name: Complete AGRO Architecture

on:
  workflow_dispatch:

jobs:
  complete-agro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create only missing AGRO architecture
        run: |
          set -e

          BASE="apps/agro"

          # ============================================================
          # MODULES
          # ============================================================

          mkdir -p \
            "$BASE/modules"

          # ============================================================
          # PERMISSIONS
          # ============================================================

          mkdir -p \
            "$BASE/permissions/policies" \
            "$BASE/permissions/roles" \
            "$BASE/permissions/rules" \
            "$BASE/permissions/scopes"

          # ============================================================
          # REGISTRY
          # ============================================================

          mkdir -p \
            "$BASE/registry/engines" \
            "$BASE/registry/events" \
            "$BASE/registry/menus" \
            "$BASE/registry/modules" \
            "$BASE/registry/permissions" \
            "$BASE/registry/roles" \
            "$BASE/registry/routes" \
            "$BASE/registry/services" \
            "$BASE/registry/templates"

          # ============================================================
          # ROUTERS
          # ============================================================

          mkdir -p \
            "$BASE/routers/api" \
            "$BASE/routers/internal" \
            "$BASE/routers/public" \
            "$BASE/routers/websocket"

          # ============================================================
          # SCHEMAS
          # ============================================================

          mkdir -p \
            "$BASE/schemas/entities" \
            "$BASE/schemas/requests" \
            "$BASE/schemas/responses" \
            "$BASE/schemas/shared"

          # ============================================================
          # SECURITY
          # ============================================================

          mkdir -p \
            "$BASE/security"

          # ============================================================
          # SERVICES
          # ============================================================

          mkdir -p \
            "$BASE/services"

          # ============================================================
          # SHARED
          # ============================================================

          mkdir -p \
            "$BASE/shared"

          # ============================================================
          # TEMPLATES
          # ============================================================

          mkdir -p \
            "$BASE/templates"

          # ============================================================
          # NEXO-STYLE APP-SPECIFIC TEMPLATE AREA
          # PRESERVED AS AN INDEPENDENT AGRO AREA
          # ============================================================

          mkdir -p \
            "$BASE/templatess"

          # ============================================================
          # VALIDATORS
          # ============================================================

          mkdir -p \
            "$BASE/validators"

          # ============================================================
          # CREATE __init__.py ONLY WHEN ABSENT
          # NEVER OVERWRITE EXISTING FILES
          # ============================================================

          find "$BASE" -type d -exec sh -c '
            for dir do
              if [ ! -e "$dir/__init__.py" ]; then
                touch "$dir/__init__.py"
              fi
            done
          ' sh {} +

          # ============================================================
          # NO DELETE
          # NO MOVE
          # NO RENAME
          # NO OVERWRITE
          # ============================================================

      - name: Commit only new AGRO architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/agro

          if git diff --cached --quiet; then
            echo "No new AGRO architecture changes."
            exit 0
          fi

          git commit -m "Complete AGRO architecture without modifying existing structure"
          git push
