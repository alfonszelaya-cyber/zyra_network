          from __future__ import annotations

          import threading
          from collections import deque
          from typing import Any

          from ..core import ObservationEvent, ObservationManager


          class SignalCollector:
              def __init__(
                  self,
                  manager: ObservationManager,
                  *,
                  max_queue: int = 10000,
              ) -> None:
                  if max_queue <= 0:
                      raise ValueError("max_queue must be positive")

                  self.manager = manager
                  self._queue: deque[Any] = deque(maxlen=max_queue)
                  self._lock = threading.RLock()

              def submit(self, signal: Any) -> None:
                  with self._lock:
                      self._queue.append(signal)

              def drain(self, limit: int = 1000) -> int:
                  processed = 0

                  while processed < limit:
                      with self._lock:
                          if not self._queue:
                              break
                          item = self._queue.popleft()

                      if isinstance(item, ObservationEvent):
                          self.manager.record_event(item)

                      processed += 1

                  return processed

              def pending(self) -> int:
                  with self._lock:
                      return len(self._queue)


          __all__ = ["SignalCollector"]
          PY

