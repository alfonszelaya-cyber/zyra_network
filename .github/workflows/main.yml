          from __future__ import annotations

          import time
          from dataclasses import dataclass


          @dataclass(frozen=True, slots=True)
          class Query:
              start_ns: int = 0
              end_ns: int = 0
              event_type: str | None = None
              limit: int = 1000
              offset: int = 0

              def normalized(self):
                  end = (
                      self.end_ns
                      or time.time_ns()
                  )

                  if self.start_ns < 0:
                      raise ValueError(
                          "start_ns cannot be negative"
                      )

                  if end < self.start_ns:
                      raise ValueError(
                          "end_ns precedes start_ns"
                      )

                  if not (
                      1 <= self.limit <= 100_000
                  ):
                      raise ValueError(
                          "query limit out of range"
                      )

                  if self.offset < 0:
                      raise ValueError(
                          "query offset cannot be negative"
                      )

                  return Query(
                      self.start_ns,
                      end,
                      self.event_type,
                      self.limit,
                      self.offset,
                  )


          class QueryEngine:
              def __init__(self, storage):
                  self.storage = storage

              def execute(self, query):
                  normalized = (
                      query.normalized()
                  )

                  return self.storage.query(
                      start_ns=(
                          normalized.start_ns
                      ),
                      end_ns=(
                          normalized.end_ns
                      ),
                      event_type=(
                          normalized.event_type
                      ),
                      limit=normalized.limit,
                      offset=normalized.offset,
                  )


