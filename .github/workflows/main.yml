name: Crear carpetas de Semilla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Agregar solo bloque 3 (permissions, registry, routers, schemas)
        run: |
          # Permissions
          mkdir -p apps/semilla/permissions/{administration,academic,admissions,certification,classroom,curriculum,family,finance,government,institution,laboratory,learning,library,psychology,roles,scholarship,security,student,teacher,users}

          # Registry
          mkdir -p apps/semilla/registry/{engines,events,institutions,menus,modules,permissions,roles,routes,schools,services,students,teachers,templates}

          # Routers
          mkdir -p apps/semilla/routers/{academic,admissions,analytics,attendance,certification,classroom,curriculum,evaluation,finance,government,institution,learning,library,psychology,reports,scholarship,security,student,teacher,system}

          # Schemas
          mkdir -p apps/semilla/schemas/{academic,admissions,certification,classroom,curriculum,evaluation,finance,government,institution,learning,library,psychology,reports,scholarship,security,student,teacher,users}

          # Crear __init__.py únicamente dentro de las carpetas de este bloque
          find apps/semilla/permissions apps/semilla/registry apps/semilla/routers apps/semilla/schemas -type d -exec touch {}/__init__.py \;

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Bloque 3 agregado: permissions, registry, routers, schemas"
          git push origin main
