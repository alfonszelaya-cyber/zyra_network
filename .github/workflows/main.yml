                  )

                  content_digest = digest(
                      document
                  )

                  with self._lock:
                      self._ensure_open()

                      try:
                          with self._db:
                              cursor = (
                                  self._db.execute(
                                      """
                                      INSERT OR IGNORE
                                      INTO observations (
                                          event_id,
                                          event_type,
                                          timestamp_ns,
                                          severity,
                                          correlation_id,
                                          trace_id,
                                          span_id,
                                          payload_json,
                                          event_json,
                                          content_digest
                                      )
                                      VALUES (
                                          ?, ?, ?, ?, ?,
                                          ?, ?, ?, ?, ?
                                      )
                                      """,
                                      (
                                          event.event_id,
                                          event.event_type,
                                          event.timestamp_ns,
                                          event.severity,
                                          event.context.correlation_id,
                                          event.context.trace_id,
                                          event.context.span_id,
                                          payload_json,
                                          event_json,
                                          content_digest,
                                      ),
                                  )
                              )

                              if cursor.rowcount:
                                  return int(
                                      cursor.lastrowid
                                  )

                              existing = (
                                  self._db.execute(
                                      """
                                      SELECT sequence
                                      FROM observations
                                      WHERE event_id=?
                                      """,
                                      (
                                          event.event_id,
                                      ),
                                  ).fetchone()
                              )

                              if existing is None:
                                  raise PersistenceError(
                                      "idempotent insert "
                                      "could not resolve "
                                      "existing event"
                                  )

                              return int(
                                  existing["sequence"]
                              )

                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

              def query(
                  self,
                  *,
                  start_ns=0,
                  end_ns=None,
                  event_type=None,
                  correlation_id=None,
                  trace_id=None,
                  limit=1000,
                  offset=0,
              ):
                  if not (
                      1 <= limit <= 100_000
                  ):
                      raise ValueError(
                          "limit out of range"
                      )

                  if offset < 0:
                      raise ValueError(
                          "offset cannot be negative"
                      )

                  if end_ns is None:
                      end_ns = time.time_ns()

                  clauses = [
                      "timestamp_ns >= ?",
                      "timestamp_ns <= ?",
                  ]

                  arguments = [
                      start_ns,
                      end_ns,
                  ]

                  if event_type:
                      clauses.append(
                          "event_type = ?"
                      )
                      arguments.append(
                          event_type
                      )

                  if correlation_id:
                      clauses.append(
                          "correlation_id = ?"
                      )
                      arguments.append(
                          correlation_id
                      )

                  if trace_id:
                      clauses.append(
                          "trace_id = ?"
                      )
                      arguments.append(
                          trace_id
                      )

                  sql = (
                      "SELECT event_json "
                      "FROM observations "
                      "WHERE "
                      + " AND ".join(clauses)
                      + " ORDER BY "
                      "timestamp_ns ASC, "
                      "sequence ASC "
                      "LIMIT ? OFFSET ?"
                  )

                  arguments.extend(
                      [limit, offset]
                  )

                  with self._lock:
                      self._ensure_open()

                      try:
                          rows = (
                              self._db.execute(
                                  sql,
                                  arguments,
                              ).fetchall()
                          )

                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

                  return [
                      json.loads(
                          row["event_json"]
                      )
                      for row in rows
                  ]

              def purge_before(
                  self,
                  cutoff_ns,
              ):
                  with self._lock:
                      self._ensure_open()

                      try:
                          with self._db:
                              cursor = (
                                  self._db.execute(
                                      """
                                      DELETE FROM
                                      observations
                                      WHERE timestamp_ns < ?
                                      """,
                                      (
                                          cutoff_ns,
                                      ),
                                  )
                              )

                              return int(
                                  cursor.rowcount
                              )

                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

              def retention(
                  self,
                  retention_seconds,
              ):
                  cutoff = (
                      time.time_ns()
                      - (
                          retention_seconds
                          * 1_000_000_000
                      )
                  )

                  return self.purge_before(
                      cutoff
                  )

              def count(self):
                  with self._lock:
                      self._ensure_open()

                      try:
                          return int(
                              self._db.execute(
                                  """
                                  SELECT COUNT(*)
                                  FROM observations
                                  """
                              ).fetchone()[0]
                          )

                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

              def integrity_check(self):
                  with self._lock:
                      self._ensure_open()

                      try:
                          row = self._db.execute(
                              "PRAGMA integrity_check"
                          ).fetchone()

                          return row[0] == "ok"

                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

              def vacuum(self):
                  with self._lock:
                      self._ensure_open()

                      try:
                          self._db.execute(
                              "PRAGMA wal_checkpoint(TRUNCATE)"
