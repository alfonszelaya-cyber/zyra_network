          cat > shared_engines/ai/config.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass

          from .constants import MAX_REQUEST_BYTES, MAX_RESPONSE_BYTES
          from .errors import ConfigurationError


          @dataclass(frozen=True, slots=True)
          class AIEngineConfig:
              database_path: str
              max_concurrency: int = 32
              queue_capacity: int = 128
              request_timeout_seconds: float = 60.0
              connect_timeout_seconds: float = 10.0
              max_request_bytes: int = MAX_REQUEST_BYTES
              max_response_bytes: int = MAX_RESPONSE_BYTES
              lease_seconds: int = 120
              retry_attempts: int = 3
              retry_base_seconds: float = 0.25
              circuit_failure_threshold: int = 5
              circuit_recovery_seconds: float = 30.0
              default_cost_limit: int = 100000
              audit_checkpoint_interval: int = 1000
              retention_days: int = 3650

              def validate(self) -> None:
                  if not self.database_path:
                      raise ConfigurationError("database_path is required")
                  if self.max_concurrency < 1:
                      raise ConfigurationError("max_concurrency must be >= 1")
                  if self.queue_capacity < 1:
                      raise ConfigurationError("queue_capacity must be >= 1")
                  if self.request_timeout_seconds <= 0:
                      raise ConfigurationError("request_timeout_seconds must be > 0")
                  if self.connect_timeout_seconds <= 0:
                      raise ConfigurationError("connect_timeout_seconds must be > 0")
                  if self.lease_seconds < 5:
                      raise ConfigurationError("lease_seconds must be >= 5")
                  if self.retry_attempts < 1:
                      raise ConfigurationError("retry_attempts must be >= 1")
                  if self.retry_base_seconds <= 0:
                      raise ConfigurationError("retry_base_seconds must be > 0")
                  if self.circuit_failure_threshold < 1:
                      raise ConfigurationError("circuit_failure_threshold must be >= 1")
                  if self.default_cost_limit < 1:
                      raise ConfigurationError("default_cost_limit must be >= 1")
                  if self.retention_days < 1:
                      raise ConfigurationError("retention_days must be >= 1")
          PY

          cat > shared_engines/ai/serialization.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from typing import Any


          def canonical_json(value: Any) -> bytes:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")


          def sha256_hex(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()


          def object_hash(value: Any) -> str:
              return sha256_hex(canonical_json(value))
          PY

          cat > shared_engines/ai/models.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime
          from typing import Any, Mapping

          from .constants import CONTRACT_VERSION
          from .errors import ValidationError
          from .serialization import object_hash


          @dataclass(frozen=True, slots=True)
          class AIRequest:
              request_id: str
              idempotency_key: str
              provider: str
              model: str
              input_payload: Mapping[str, Any]
              created_at: datetime
              contract_version: int = CONTRACT_VERSION
              metadata: Mapping[str, str] = field(default_factory=dict)
              cost_limit: int | None = None

              @property
              def request_hash(self) -> str:
                  return object_hash(
                      {
                          "contract_version": self.contract_version,
                          "provider": self.provider,
                          "model": self.model,
                          "input_payload": dict(self.input_payload),
                          "metadata": dict(self.metadata),
                      }
                  )

              def validate(self) -> None:
                  if not self.request_id:
                      raise ValidationError("request_id is required")
                  if not self.idempotency_key:
                      raise ValidationError("idempotency_key is required")
                  if not self.provider:
                      raise ValidationError("provider is required")
                  if not self.model:
                      raise ValidationError("model is required")
                  if self.contract_version != CONTRACT_VERSION:
                      raise ValidationError("unsupported contract version")
                  if self.cost_limit is not None and self.cost_limit < 1:
                      raise ValidationError("cost_limit must be positive")


          @dataclass(frozen=True, slots=True)
          class ProviderResult:
              provider_request_id: str
              payload: Mapping[str, Any]
              usage_units: int
              estimated_cost: int
              raw_hash: str


          @dataclass(frozen=True, slots=True)
          class AIResponse:
              request_id: str
              provider: str
              model: str
              provider_request_id: str
              payload: Mapping[str, Any]
              usage_units: int
              estimated_cost: int
              completed_at: datetime
              contract_version: int = CONTRACT_VERSION
          PY

          cat > shared_engines/ai/compatibility.py <<'PY'
          from __future__ import annotations

          from .constants import CONTRACT_VERSION
          from .errors import ContractError


          def validate_contract_version(version: int) -> None:
              if version != CONTRACT_VERSION:
                  raise ContractError(
                      f"unsupported contract version: {version}; "
                      f"current={CONTRACT_VERSION}"
                  )


          def is_backward_compatible(version: int) -> bool:
              return version == CONTRACT_VERSION
          PY

          cat > shared_engines/ai/security/keys.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Protocol

          from .encryption import EncryptedPayload


          class KeyProvider(Protocol):
              def current_key(self) -> tuple[str, bytes]:
                  ...

              def get_key(self, version: str) -> bytes:
                  ...


          @dataclass(frozen=True, slots=True)
          class StaticKeyProvider:
              version: str
              key: bytes

              def __post_init__(self) -> None:
                  if len(self.key) != 32:
                      raise ValueError("AES-256 requires a 32-byte key")

              def current_key(self) -> tuple[str, bytes]:
                  return self.version, self.key

              def get_key(self, version: str) -> bytes:
                  if version != self.version:
                      raise KeyError(version)
                  return self.key


          @dataclass(frozen=True, slots=True)
          class VersionedEncryptedPayload:
              key_version: str
              encrypted: EncryptedPayload
          PY

          cat > shared_engines/ai/security/encryption.py <<'PY'
          from __future__ import annotations

          import base64
          import os
          from dataclasses import dataclass

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          from ..errors import EncryptionError


          @dataclass(frozen=True, slots=True)
          class EncryptedPayload:
              nonce: str
              ciphertext: str


          class AEADEncryptor:
              def encrypt(self, plaintext: bytes, aad: bytes, key: bytes) -> EncryptedPayload:
                  if len(key) != 32:
                      raise EncryptionError("AES-256 key required")
                  nonce = os.urandom(12)
                  ciphertext = AESGCM(key).encrypt(nonce, plaintext, aad)
                  return EncryptedPayload(
                      nonce=base64.b64encode(nonce).decode("ascii"),
                      ciphertext=base64.b64encode(ciphertext).decode("ascii"),
                  )

              def decrypt(
                  self,
                  payload: EncryptedPayload,
                  aad: bytes,
                  key: bytes,
              ) -> bytes:
                  try:
                      nonce = base64.b64decode(payload.nonce)
                      ciphertext = base64.b64decode(payload.ciphertext)
                      return AESGCM(key).decrypt(nonce, ciphertext, aad)
                  except Exception as exc:
                      raise EncryptionError("authenticated decryption failed") from exc
          PY

          cat > shared_engines/ai/security/redaction.py <<'PY'
          from __future__ import annotations

          import re

          SECRET_PATTERNS = (
              re.compile(r"(?i)(authorization\s*[:=]\s*)([^\s,]+)"),
              re.compile(r"(?i)(api[_-]?key\s*[:=]\s*)([^\s,]+)"),
              re.compile(r"(?i)(token\s*[:=]\s*)([^\s,]+)"),
          )


          def redact(value: str) -> str:
              result = value
              for pattern in SECRET_PATTERNS:
                  result = pattern.sub(r"\1[REDACTED]", result)
              return result
          PY

          cat > shared_engines/ai/security/__init__.py <<'PY'
          from .encryption import AEADEncryptor, EncryptedPayload
          from .keys import KeyProvider, StaticKeyProvider

          __all__ = [
              "AEADEncryptor",
              "EncryptedPayload",
              "KeyProvider",
              "StaticKeyProvider",
