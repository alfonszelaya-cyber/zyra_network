name: ZYRA Observability — Long-Term Production Foundation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zyra-observability-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  observability:
    name: Build / Validate / Commit Observability
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install validation tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade pytest

      - name: Record repository boundary
        shell: bash
        run: |
          set -Eeuo pipefail

          git status --porcelain=v1 > /tmp/zyra_observability_before.status

          git ls-files apps/ > /tmp/zyra_observability_apps_before.files

      - name: Build observability production implementation
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          rm -rf observability

          mkdir -p \
            observability/alerts \
            observability/api \
            observability/collector \
            observability/context \
            observability/dashboards \
            observability/engine \
            observability/events \
            observability/exporter \
            observability/health \
            observability/incidents \
            observability/manager \
            observability/metrics \
            observability/monitoring \
            observability/policy \
            observability/query \
            observability/registry \
            observability/reports \
            observability/router \
            observability/snapshot \
            observability/status \
            observability/storage \
            observability/tests

          cat > observability/core.py <<'PY'
          from __future__ import annotations

          import copy
          import hashlib
          import json
          import math
          import re
          import threading
          import time
          import uuid
          from collections import deque
          from dataclasses import dataclass, field, replace
          from datetime import datetime, timezone
          from enum import Enum
          from typing import Any, Callable, Iterable, Mapping, Sequence


          CONTRACT_VERSION = "1.0"
          SCHEMA_VERSION = 1

          _NAME_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,127}$")
          _ID_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,255}$")


          class ObservabilityError(Exception):
              """Root exception for the observability subsystem."""


          ObservationError = ObservabilityError


          class ConfigurationError(ObservabilityError):
              pass


          class ValidationError(ObservabilityError):
              pass


          class CapacityError(ObservabilityError):
              pass


          class PersistenceError(ObservabilityError):
              pass


          class LifecycleError(ObservabilityError):
              pass


          class SerializationError(ObservabilityError):
              pass


          class IntegrityError(ObservabilityError):
              pass


          class MetricKind(str, Enum):
              COUNTER = "counter"
              GAUGE = "gauge"
              HISTOGRAM = "histogram"
              TIMER = "timer"


          class HealthState(str, Enum):
              UNKNOWN = "unknown"
              HEALTHY = "healthy"
              DEGRADED = "degraded"
              UNHEALTHY = "unhealthy"


          class AlertState(str, Enum):
              INACTIVE = "inactive"
              FIRING = "firing"
              ACKNOWLEDGED = "acknowledged"
              RESOLVED = "resolved"


          class IncidentState(str, Enum):
              OPEN = "open"
              ACKNOWLEDGED = "acknowledged"
              MITIGATED = "mitigated"
              RESOLVED = "resolved"
              CLOSED = "closed"


          class DeliveryStatus(str, Enum):
              ACCEPTED = "accepted"
              DELIVERED = "delivered"
              FAILED = "failed"
              DROPPED = "dropped"


          def now_ns() -> int:
              return time.time_ns()


          def iso_time(timestamp_ns: int | None = None) -> str:
              ns = timestamp_ns if timestamp_ns is not None else now_ns()
              return datetime.fromtimestamp(
                  ns / 1_000_000_000,
                  tz=timezone.utc,
              ).isoformat()


          def new_id(prefix: str) -> str:
              validate_name(prefix, "identifier prefix")
              return f"{prefix}-{uuid.uuid4().hex}"


          def validate_name(value: str, field_name: str = "name") -> str:
              if not isinstance(value, str):
                  raise ValidationError(f"{field_name} must be a string")
              if not _NAME_RE.fullmatch(value):
                  raise ValidationError(f"invalid {field_name}: {value!r}")
              return value


          def validate_id(value: str, field_name: str = "id") -> str:
              if not isinstance(value, str):
                  raise ValidationError(f"{field_name} must be a string")
              if not _ID_RE.fullmatch(value):
                  raise ValidationError(f"invalid {field_name}: {value!r}")
              return value


          def finite_float(value: Any, field_name: str = "value") -> float:
              try:
                  result = float(value)
              except (TypeError, ValueError) as exc:
                  raise ValidationError(
                      f"{field_name} must be numeric"
                  ) from exc

              if not math.isfinite(result):
                  raise ValidationError(
                      f"{field_name} must be finite"
                  )

              return result


          def bounded_text(
              value: Any,
              *,
              maximum: int,
              field_name: str,
          ) -> str:
              result = str(value)
              if len(result) > maximum:
                  raise CapacityError(
                      f"{field_name} exceeds maximum length"
                  )
              return result


          def normalize_labels(
              labels: Mapping[str, Any] | None,
              *,
              max_keys: int = 32,
              max_key_length: int = 128,
              max_value_length: int = 512,
          ) -> dict[str, str]:
              if labels is None:
                  return {}

              if not isinstance(labels, Mapping):
                  raise ValidationError("labels must be a mapping")

              if len(labels) > max_keys:
                  raise CapacityError(
                      "maximum label cardinality exceeded"
                  )

              result: dict[str, str] = {}

              for key, value in labels.items():
                  key_text = bounded_text(
                      key,
                      maximum=max_key_length,
                      field_name="label key",
                  )

                  value_text = bounded_text(
                      value,
                      maximum=max_value_length,
                      field_name="label value",
                  )

                  validate_name(key_text, "label key")
                  result[key_text] = value_text

              return dict(sorted(result.items()))


          def sanitize(
              value: Any,
              *,
              max_depth: int = 10,
              depth: int = 0,
          ) -> Any:
              if depth > max_depth:
                  raise SerializationError(
                      "maximum serialization depth exceeded"
                  )

              if value is None:
                  return None

              if isinstance(value, (str, bool, int)):
                  return value

              if isinstance(value, float):
                  if not math.isfinite(value):
                      raise SerializationError(
                          "non-finite float cannot be serialized"
                      )
                  return value

              if isinstance(value, Enum):
                  return value.value

              if isinstance(value, Mapping):
                  return {
                      str(key): sanitize(
                          item,
                          max_depth=max_depth,
                          depth=depth + 1,
                      )
                      for key, item in value.items()
                  }

              if isinstance(value, (list, tuple)):
                  return [
                      sanitize(
                          item,
                          max_depth=max_depth,
                          depth=depth + 1,
                      )
                      for item in value
                  ]

              if hasattr(value, "to_dict"):
                  return sanitize(
                      value.to_dict(),
                      max_depth=max_depth,
                      depth=depth + 1,
                  )

              raise SerializationError(
                  f"unsupported serialization type: "
                  f"{type(value).__name__}"
              )


          def stable_json(value: Any) -> str:
              try:
                  return json.dumps(
                      sanitize(value),
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                  )
              except (TypeError, ValueError) as exc:
                  raise SerializationError(
                      "value cannot be serialized"
                  ) from exc


          def digest(value: Any) -> str:
              return hashlib.sha256(
                  stable_json(value).encode("utf-8")
              ).hexdigest()


          @dataclass(frozen=True, slots=True)
          class ObservationContext:
              correlation_id: str
              trace_id: str
              span_id: str
              component: str
              operation: str
              parent_span_id: str | None = None
              labels: Mapping[str, str] = field(
                  default_factory=dict
              )
              created_at_ns: int = field(default_factory=now_ns)

              def __post_init__(self) -> None:
                  validate_id(
                      self.correlation_id,
                      "correlation_id",
                  )
                  validate_id(self.trace_id, "trace_id")
                  validate_id(self.span_id, "span_id")
                  validate_name(self.component, "component")
                  validate_name(self.operation, "operation")

                  if self.parent_span_id:
                      validate_id(
                          self.parent_span_id,
                          "parent_span_id",
                      )

                  object.__setattr__(
                      self,
                      "labels",
                      normalize_labels(self.labels),
                  )

              @classmethod
              def create(
                  cls,
                  component: str,
                  operation: str,
                  *,
                  correlation_id: str | None = None,
                  trace_id: str | None = None,
                  parent_span_id: str | None = None,
                  labels: Mapping[str, Any] | None = None,
              ) -> "ObservationContext":
                  return cls(
                      correlation_id=(
                          correlation_id or new_id("corr")
                      ),
                      trace_id=trace_id or new_id("trace"),
                      span_id=new_id("span"),
                      component=component,
                      operation=operation,
                      parent_span_id=parent_span_id,
                      labels=normalize_labels(labels),
                  )

              def child(
                  self,
                  operation: str,
                  *,
                  labels: Mapping[str, Any] | None = None,
              ) -> "ObservationContext":
                  merged = dict(self.labels)

                  if labels:
                      merged.update(
                          normalize_labels(labels)
                      )

                  return ObservationContext.create(
                      self.component,
                      operation,
                      correlation_id=self.correlation_id,
                      trace_id=self.trace_id,
                      parent_span_id=self.span_id,
                      labels=merged,
                  )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "contract_version": CONTRACT_VERSION,
                      "schema_version": SCHEMA_VERSION,
                      "correlation_id": self.correlation_id,
                      "trace_id": self.trace_id,
                      "span_id": self.span_id,
                      "parent_span_id": self.parent_span_id,
                      "component": self.component,
                      "operation": self.operation,
                      "labels": dict(self.labels),
                      "created_at_ns": self.created_at_ns,
                  }


          @dataclass(frozen=True, slots=True)
          class ObservationEvent:
              event_id: str
              event_type: str
              timestamp_ns: int
              context: ObservationContext
              payload: Mapping[str, Any]
              severity: str = "info"
              sequence: int | None = None

              def __post_init__(self) -> None:
                  validate_id(
                      self.event_id,
                      "event_id",
                  )
                  validate_name(
                      self.event_type,
                      "event_type",
                  )

                  if self.severity not in {
                      "debug",
                      "info",
                      "warning",
                      "error",
                      "critical",
                  }:
                      raise ValidationError(
                          "invalid event severity"
                      )

                  object.__setattr__(
                      self,
                      "payload",
                      sanitize(self.payload),
                  )

              @classmethod
              def create(
                  cls,
                  event_type: str,
                  context: ObservationContext,
                  payload: Mapping[str, Any] | None = None,
                  *,
                  severity: str = "info",
              ) -> "ObservationEvent":
                  return cls(
                      event_id=new_id("evt"),
                      event_type=event_type,
                      timestamp_ns=now_ns(),
                      context=context,
                      payload=payload or {},
                      severity=severity,
                  )

              def with_sequence(
                  self,
                  sequence: int,
              ) -> "ObservationEvent":
                  return replace(
                      self,
                      sequence=sequence,
                  )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "contract_version": CONTRACT_VERSION,
                      "schema_version": SCHEMA_VERSION,
                      "event_id": self.event_id,
                      "event_type": self.event_type,
                      "timestamp_ns": self.timestamp_ns,
                      "timestamp": iso_time(self.timestamp_ns),
                      "severity": self.severity,
                      "sequence": self.sequence,
                      "context": self.context.to_dict(),
                      "payload": sanitize(self.payload),
                  }


          @dataclass(frozen=True, slots=True)
          class MetricSample:
              name: str
              kind: MetricKind
              value: float
              timestamp_ns: int
              labels: Mapping[str, str] = field(
                  default_factory=dict
              )
              unit: str | None = None
              description: str | None = None

              def __post_init__(self) -> None:
                  validate_name(self.name, "metric name")

                  object.__setattr__(
                      self,
                      "value",
                      finite_float(self.value),
                  )

                  object.__setattr__(
                      self,
                      "labels",
                      normalize_labels(self.labels),
                  )

                  if self.unit is not None:
                      bounded_text(
                          self.unit,
                          maximum=64,
                          field_name="metric unit",
                      )

                  if self.description is not None:
                      bounded_text(
                          self.description,
                          maximum=1024,
                          field_name="metric description",
                      )

              def series_key(
                  self,
              ) -> tuple[str, tuple[tuple[str, str], ...]]:
                  return (
                      self.name,
                      tuple(self.labels.items()),
                  )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "contract_version": CONTRACT_VERSION,
                      "schema_version": SCHEMA_VERSION,
                      "name": self.name,
                      "kind": self.kind.value,
                      "value": self.value,
                      "timestamp_ns": self.timestamp_ns,
                      "labels": dict(self.labels),
                      "unit": self.unit,
                      "description": self.description,
                  }


          @dataclass(frozen=True, slots=True)
          class HealthResult:
              component: str
              state: HealthState
              latency_ms: float
              checked_at_ns: int
              message: str = ""
              details: Mapping[str, Any] = field(
                  default_factory=dict
              )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "contract_version": CONTRACT_VERSION,
                      "schema_version": SCHEMA_VERSION,
                      "component": self.component,
                      "state": self.state.value,
                      "latency_ms": self.latency_ms,
                      "checked_at_ns": self.checked_at_ns,
                      "message": self.message,
                      "details": sanitize(self.details),
                  }


          @dataclass(frozen=True, slots=True)
          class AlertRecord:
              alert_id: str
              rule_id: str
              state: AlertState
              fingerprint: str
              first_seen_ns: int
              last_seen_ns: int
              message: str
              labels: Mapping[str, str] = field(
                  default_factory=dict
              )
              occurrence_count: int = 1

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "contract_version": CONTRACT_VERSION,
                      "schema_version": SCHEMA_VERSION,
                      "alert_id": self.alert_id,
                      "rule_id": self.rule_id,
                      "state": self.state.value,
                      "fingerprint": self.fingerprint,
                      "first_seen_ns": self.first_seen_ns,
                      "last_seen_ns": self.last_seen_ns,
                      "message": self.message,
                      "labels": dict(self.labels),
                      "occurrence_count": self.occurrence_count,
                  }


          @dataclass(frozen=True, slots=True)
          class IncidentRecord:
              incident_id: str
              title: str
              state: IncidentState
              severity: str
              created_at_ns: int
              updated_at_ns: int
              correlation_ids: tuple[str, ...] = ()
              alert_ids: tuple[str, ...] = ()
              metadata: Mapping[str, Any] = field(
                  default_factory=dict
              )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "contract_version": CONTRACT_VERSION,
                      "schema_version": SCHEMA_VERSION,
                      "incident_id": self.incident_id,
                      "title": self.title,
                      "state": self.state.value,
                      "severity": self.severity,
                      "created_at_ns": self.created_at_ns,
                      "updated_at_ns": self.updated_at_ns,
                      "correlation_ids": list(
                          self.correlation_ids
                      ),
                      "alert_ids": list(self.alert_ids),
                      "metadata": sanitize(self.metadata),
                  }


          @dataclass(frozen=True, slots=True)
          class ObservationPolicy:
              retention_seconds: int = 2_592_000
              max_event_bytes: int = 1_048_576
              max_labels: int = 32
              max_queue_size: int = 10_000
              sample_rate: float = 1.0
              redaction_keys: tuple[str, ...] = (
                  "password",
                  "passwd",
                  "secret",
                  "token",
                  "authorization",
                  "api_key",
                  "apikey",
                  "private_key",
                  "credential",
              )

              def __post_init__(self) -> None:
                  if self.retention_seconds < 60:
                      raise ConfigurationError(
                          "retention_seconds must be >= 60"
                      )

                  if self.max_event_bytes < 4096:
                      raise ConfigurationError(
                          "max_event_bytes must be >= 4096"
                      )

                  if self.max_labels < 1:
                      raise ConfigurationError(
                          "max_labels must be positive"
                      )

                  if self.max_queue_size < 1:
                      raise ConfigurationError(
                          "max_queue_size must be positive"
                      )

                  if not 0 < self.sample_rate <= 1:
                      raise ConfigurationError(
                          "sample_rate must be > 0 and <= 1"
                      )

              def validate(self) -> "ObservationPolicy":
                  self.__post_init__()
                  return self

              def redact(self, value: Any) -> Any:
                  if isinstance(value, Mapping):
                      return {
                          str(key): (
                              "[REDACTED]"
                              if str(key).lower()
                              in self.redaction_keys
                              else self.redact(item)
                          )
                          for key, item in value.items()
                      }

                  if isinstance(value, list):
                      return [
                          self.redact(item)
                          for item in value
                      ]

                  if isinstance(value, tuple):
                      return [
                          self.redact(item)
                          for item in value
                      ]

                  return value


          @dataclass(frozen=True, slots=True)
          class ObservationConfig:
              service_name: str
              environment: str
              storage_path: str
              retention_seconds: int = 2_592_000
              queue_size: int = 10_000
              worker_count: int = 2
              max_labels: int = 32
              sample_rate: float = 1.0
              shutdown_timeout_seconds: float = 30.0

              def __post_init__(self) -> None:
                  validate_name(
                      self.service_name,
                      "service_name",
                  )
                  bounded_text(
                      self.environment,
                      maximum=128,
                      field_name="environment",
                  )

                  if self.worker_count < 1:
                      raise ConfigurationError(
                          "worker_count must be positive"
                      )

                  if self.shutdown_timeout_seconds <= 0:
                      raise ConfigurationError(
                          "shutdown timeout must be positive"
                      )

              def policy(self) -> ObservationPolicy:
                  return ObservationPolicy(
                      retention_seconds=self.retention_seconds,
                      max_queue_size=self.queue_size,
                      max_labels=self.max_labels,
                      sample_rate=self.sample_rate,
                  )


          class AtomicCounter:
              def __init__(self, initial: int = 0):
                  self._value = initial
                  self._lock = threading.Lock()

              def increment(self, amount: int = 1) -> int:
                  with self._lock:
                      self._value += amount
                      return self._value

              def value(self) -> int:
                  with self._lock:
                      return self._value


          class BoundedQueue:
              """
              Thread-safe bounded queue with explicit non-blocking and
              bounded-blocking semantics. Never grows without a hard limit.
              """

              def __init__(self, capacity: int):
                  if capacity < 1:
                      raise ConfigurationError(
                          "queue capacity must be positive"
                      )

                  self.capacity = capacity
                  self._items: deque[Any] = deque()
                  self._condition = threading.Condition()
                  self._closed = False
                  self.accepted = AtomicCounter()
                  self.dropped = AtomicCounter()

              def put(
                  self,
                  item: Any,
                  *,
                  block: bool = False,
                  timeout: float | None = None,
              ) -> bool:
                  deadline = (
                      None
                      if timeout is None
                      else time.monotonic() + timeout
                  )

                  with self._condition:
                      while (
                          len(self._items) >= self.capacity
                          and not self._closed
                      ):
                          if not block:
                              self.dropped.increment()
                              return False

                          remaining = (
                              None
                              if deadline is None
                              else deadline - time.monotonic()
                          )

                          if (
                              remaining is not None
                              and remaining <= 0
                          ):
                              self.dropped.increment()
                              return False

                          self._condition.wait(remaining)

                      if self._closed:
                          self.dropped.increment()
                          return False

                      self._items.append(item)
                      self.accepted.increment()
                      self._condition.notify_all()
                      return True

              def get(
                  self,
                  timeout: float | None = None,
              ) -> Any | None:
                  deadline = (
                      None
                      if timeout is None
                      else time.monotonic() + timeout
                  )

                  with self._condition:
                      while (
                          not self._items
                          and not self._closed
                      ):
                          remaining = (
                              None
                              if deadline is None
                              else deadline - time.monotonic()
                          )

                          if (
                              remaining is not None
                              and remaining <= 0
                          ):
                              return None

                          self._condition.wait(remaining)

                      if self._items:
                          item = self._items.popleft()
                          self._condition.notify_all()
                          return item

                      return None

              def close(self) -> None:
                  with self._condition:
                      self._closed = True
                      self._condition.notify_all()

              def qsize(self) -> int:
                  with self._condition:
                      return len(self._items)

              def drain(self) -> list[Any]:
                  with self._condition:
                      items = list(self._items)
                      self._items.clear()
                      self._condition.notify_all()
                      return items

              @property
              def closed(self) -> bool:
                  with self._condition:
                      return self._closed


          class MetricRegistry:
              def __init__(
                  self,
                  *,
                  max_series: int = 100_000,
              ):
                  if max_series < 1:
                      raise ConfigurationError(
                          "max_series must be positive"
                      )

                  self.max_series = max_series
                  self._lock = threading.RLock()
                  self._values: dict[
                      tuple[str, tuple[tuple[str, str], ...]],
                      MetricSample,
                  ] = {}

              def record(
                  self,
                  sample: MetricSample,
              ) -> MetricSample:
                  key = sample.series_key()

                  with self._lock:
                      previous = self._values.get(key)

                      if (
                          previous is None
                          and len(self._values)
                          >= self.max_series
                      ):
                          raise CapacityError(
                              "metric series capacity exceeded"
                          )

                      if (
                          previous is not None
                          and sample.kind
                          is MetricKind.COUNTER
                      ):
                          sample = replace(
                              sample,
                              value=(
                                  previous.value
                                  + sample.value
                              ),
                          )

                      self._values[key] = sample
                      return sample

              def get(
                  self,
                  name: str,
                  labels: Mapping[str, Any] | None = None,
              ) -> MetricSample | None:
                  key = (
                      name,
                      tuple(
                          normalize_labels(labels).items()
                      ),
                  )

                  with self._lock:
                      return self._values.get(key)

              def snapshot(self) -> list[MetricSample]:
                  with self._lock:
                      return list(self._values.values())

              def clear(self) -> None:
                  with self._lock:
                      self._values.clear()

              def count(self) -> int:
                  with self._lock:
                      return len(self._values)


          class EventBus:
              def __init__(
                  self,
                  *,
                  max_subscribers: int = 256,
              ):
                  self.max_subscribers = max_subscribers
                  self._lock = threading.RLock()
                  self._subscriptions: dict[
                      str,
                      list[Callable[[ObservationEvent], Any]],
                  ] = {}

              def subscribe(
                  self,
                  event_type: str,
                  callback: Callable[
                      [ObservationEvent],
                      Any,
                  ],
              ) -> None:
                  validate_name(
                      event_type,
                      "event_type",
                  )

                  if not callable(callback):
                      raise ValidationError(
                          "callback must be callable"
                      )

                  with self._lock:
                      total = sum(
                          len(value)
                          for value in
                          self._subscriptions.values()
                      )

                      if total >= self.max_subscribers:
                          raise CapacityError(
                              "subscriber capacity exceeded"
                          )

                      self._subscriptions.setdefault(
                          event_type,
                          [],
                      ).append(callback)

              def unsubscribe(
                  self,
                  event_type: str,
                  callback: Callable[
                      [ObservationEvent],
                      Any,
                  ],
              ) -> None:
                  with self._lock:
                      subscribers = self._subscriptions.get(
                          event_type,
                          [],
                      )

                      if callback in subscribers:
                          subscribers.remove(callback)

              def publish(
                  self,
                  event: ObservationEvent,
              ) -> int:
                  with self._lock:
                      callbacks = list(
                          self._subscriptions.get(
                              event.event_type,
                              [],
                          )
                      )
                      callbacks.extend(
                          self._subscriptions.get("*", [])
                      )

                  delivered = 0

                  for callback in callbacks:
                      try:
                          callback(event)
                      except Exception:
                          continue
                      delivered += 1

                  return delivered


          def quantiles(
              values: Sequence[float],
              probabilities: Sequence[float],
          ) -> dict[float, float]:
              if not values:
                  return {
                      probability: 0.0
                      for probability in probabilities
                  }

              ordered = sorted(
                  finite_float(value)
                  for value in values
              )

              result: dict[float, float] = {}

              for probability in probabilities:
                  if not 0 <= probability <= 1:
                      raise ValidationError(
                          "quantile probability out of range"
                      )

                  index = (
                      len(ordered) - 1
                  ) * probability

                  lower = math.floor(index)
                  upper = math.ceil(index)

                  if lower == upper:
                      result[probability] = ordered[lower]
                  else:
                      fraction = index - lower
                      result[probability] = (
                          ordered[lower]
                          + (
                              ordered[upper]
                              - ordered[lower]
                          )
                          * fraction
                      )

              return result
