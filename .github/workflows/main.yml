name: Protocol - Block 01

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protocol-block-01:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p protocol/api
          mkdir -p protocol/authentication
          mkdir -p protocol/authorization
          mkdir -p protocol/certification
          mkdir -p protocol/consensus
          mkdir -p protocol/contracts

      - name: Create API protocol
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/api/api.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from typing import Mapping


          @dataclass(frozen=True, slots=True)
          class APIRequest:
              method: str
              path: str
              headers: Mapping[str, str] = field(default_factory=dict)
              body: bytes = b""

              def __post_init__(self) -> None:
                  method = self.method.strip().upper()
                  path = self.path.strip()

                  if not method:
                      raise ValueError("API method cannot be empty")
                  if not path.startswith("/"):
                      raise ValueError("API path must start with '/'")

                  object.__setattr__(self, "method", method)
                  object.__setattr__(self, "path", path)
                  object.__setattr__(self, "headers", dict(self.headers))


          @dataclass(frozen=True, slots=True)
          class APIResponse:
              status_code: int
              headers: Mapping[str, str] = field(default_factory=dict)
              body: bytes = b""

              def __post_init__(self) -> None:
                  if not 100 <= self.status_code <= 599:
                      raise ValueError("Invalid HTTP status code")

                  object.__setattr__(self, "headers", dict(self.headers))


          class APIRouter:
              def __init__(self) -> None:
                  self._routes: dict[tuple[str, str], object] = {}

              def register(
                  self,
                  method: str,
                  path: str,
                  handler: object,
              ) -> None:
                  if not callable(handler):
                      raise TypeError("API handler must be callable")

                  key = (method.strip().upper(), path.strip())

                  if not key[1].startswith("/"):
                      raise ValueError("API path must start with '/'")

                  if key in self._routes:
                      raise ValueError(f"Route already registered: {key}")

                  self._routes[key] = handler

              def resolve(self, method: str, path: str) -> object:
                  key = (method.strip().upper(), path.strip())

                  try:
                      return self._routes[key]
                  except KeyError as exc:
                      raise LookupError(f"API route not found: {key}") from exc

              def routes(self) -> tuple[tuple[str, str], ...]:
                  return tuple(sorted(self._routes))


          __all__ = ["APIRequest", "APIResponse", "APIRouter"]
          PY

          cat > protocol/api/__init__.py <<'PY'
          from .api import APIRequest, APIResponse, APIRouter

          __all__ = ["APIRequest", "APIResponse", "APIRouter"]
          PY

      - name: Create authentication protocol
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/authentication/authentication.py <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import hmac
          import secrets
          from dataclasses import dataclass
          from datetime import datetime, timedelta, timezone


          @dataclass(frozen=True, slots=True)
          class AuthenticationChallenge:
              challenge: str
              issued_at: datetime
              expires_at: datetime

              @classmethod
              def create(cls, lifetime_seconds: int = 300) -> "AuthenticationChallenge":
                  if lifetime_seconds <= 0:
                      raise ValueError("Challenge lifetime must be positive")

                  issued = datetime.now(timezone.utc)

                  return cls(
                      challenge=secrets.token_urlsafe(32),
                      issued_at=issued,
                      expires_at=issued + timedelta(seconds=lifetime_seconds),
                  )

              def is_expired(self, now: datetime | None = None) -> bool:
                  current = now or datetime.now(timezone.utc)
                  return current >= self.expires_at


          class AuthenticationVerifier:
              """Challenge-response verifier using HMAC-SHA256."""

              def __init__(self, secret: bytes) -> None:
                  if not secret:
                      raise ValueError("Authentication secret cannot be empty")

                  self._secret = bytes(secret)

              def create_response(self, challenge: str) -> str:
                  if not challenge:
                      raise ValueError("Challenge cannot be empty")

                  digest = hmac.new(
                      self._secret,
                      challenge.encode("utf-8"),
                      hashlib.sha256,
                  ).digest()

                  return base64.urlsafe_b64encode(digest).decode("ascii")

              def verify(self, challenge: str, response: str) -> bool:
                  expected = self.create_response(challenge)

                  return hmac.compare_digest(expected, response)


          __all__ = [
              "AuthenticationChallenge",
              "AuthenticationVerifier",
          ]
          PY

          cat > protocol/authentication/__init__.py <<'PY'
          from .authentication import (
              AuthenticationChallenge,
              AuthenticationVerifier,
          )

          __all__ = [
              "AuthenticationChallenge",
              "AuthenticationVerifier",
          ]
          PY

      - name: Create authorization protocol
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/authorization/authorization.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass


          @dataclass(frozen=True, slots=True)
          class Permission:
              resource: str
              action: str

              def __post_init__(self) -> None:
                  if not self.resource.strip():
                      raise ValueError("Permission resource cannot be empty")
                  if not self.action.strip():
                      raise ValueError("Permission action cannot be empty")


          class AuthorizationPolicy:
              """Explicit allow-list authorization policy."""

              def __init__(self) -> None:
                  self._permissions: dict[str, set[Permission]] = {}

              def grant(self, principal: str, permission: Permission) -> None:
                  principal = principal.strip()

                  if not principal:
                      raise ValueError("Principal cannot be empty")

                  self._permissions.setdefault(principal, set()).add(permission)

              def revoke(self, principal: str, permission: Permission) -> bool:
                  permissions = self._permissions.get(principal.strip())

                  if not permissions or permission not in permissions:
                      return False

                  permissions.remove(permission)

                  if not permissions:
                      self._permissions.pop(principal.strip(), None)

                  return True

              def allowed(
                  self,
                  principal: str,
                  resource: str,
                  action: str,
              ) -> bool:
                  permission = Permission(resource, action)
                  return permission in self._permissions.get(
                      principal.strip(),
                      set(),
                  )

              def permissions(self, principal: str) -> frozenset[Permission]:
                  return frozenset(
                      self._permissions.get(principal.strip(), set())
                  )


          __all__ = ["Permission", "AuthorizationPolicy"]
          PY

          cat > protocol/authorization/__init__.py <<'PY'
          from .authorization import AuthorizationPolicy, Permission

          __all__ = ["Permission", "AuthorizationPolicy"]
          PY

      - name: Create certification protocol
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/certification/certification.py <<'PY'
          from __future__ import annotations

          import hashlib
          from dataclasses import dataclass
          from datetime import datetime, timezone


          @dataclass(frozen=True, slots=True)
          class Certificate:
              subject: str
              issuer: str
              fingerprint: str
              issued_at: datetime

              @classmethod
              def issue(
                  cls,
                  subject: str,
                  issuer: str,
                  public_material: bytes,
              ) -> "Certificate":
                  if not subject.strip():
                      raise ValueError("Certificate subject cannot be empty")
                  if not issuer.strip():
                      raise ValueError("Certificate issuer cannot be empty")
                  if not public_material:
                      raise ValueError("Public material cannot be empty")

                  fingerprint = hashlib.sha256(public_material).hexdigest()

                  return cls(
                      subject=subject.strip(),
                      issuer=issuer.strip(),
                      fingerprint=fingerprint,
                      issued_at=datetime.now(timezone.utc),
                  )


          class CertificateAuthority:
              """Local protocol-level certificate authority registry."""

              def __init__(self, authority_id: str) -> None:
                  if not authority_id.strip():
                      raise ValueError("Authority ID cannot be empty")

                  self.authority_id = authority_id.strip()
                  self._certificates: dict[str, Certificate] = {}

              def issue(
                  self,
                  subject: str,
                  public_material: bytes,
              ) -> Certificate:
                  certificate = Certificate.issue(
                      subject=subject,
                      issuer=self.authority_id,
                      public_material=public_material,
                  )

                  if subject.strip() in self._certificates:
                      raise ValueError(
                          f"Certificate already exists: {subject.strip()}"
                      )

                  self._certificates[subject.strip()] = certificate
                  return certificate

              def verify(self, certificate: Certificate) -> bool:
                  return (
                      certificate.issuer == self.authority_id
                      and certificate.subject in self._certificates
                      and self._certificates[certificate.subject]
                      == certificate
                  )

              def get(self, subject: str) -> Certificate:
                  return self._certificates[subject.strip()]


          __all__ = ["Certificate", "CertificateAuthority"]
          PY

          cat > protocol/certification/__init__.py <<'PY'
          from .certification import Certificate, CertificateAuthority

          __all__ = ["Certificate", "CertificateAuthority"]
          PY

      - name: Create consensus protocol
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/consensus/consensus.py <<'PY'
          from __future__ import annotations

          from collections import Counter
          from dataclasses import dataclass


          @dataclass(frozen=True, slots=True)
          class ConsensusResult:
              reached: bool
              value: object | None
              votes: int
              required: int


          class QuorumConsensus:
              """Deterministic majority/quorum evaluator."""

              def __init__(self, participants: int) -> None:
                  if participants <= 0:
                      raise ValueError("Participants must be positive")

                  self.participants = participants
                  self.required = participants // 2 + 1

              def evaluate(self, values: list[object]) -> ConsensusResult:
                  if not values:
                      return ConsensusResult(
                          reached=False,
                          value=None,
                          votes=0,
                          required=self.required,
                      )

                  counts = Counter(values)
                  value, votes = counts.most_common(1)[0]

                  return ConsensusResult(
                      reached=votes >= self.required,
                      value=value if votes >= self.required else None,
                      votes=votes,
                      required=self.required,
                  )


          __all__ = ["ConsensusResult", "QuorumConsensus"]
          PY

          cat > protocol/consensus/__init__.py <<'PY'
          from .consensus import ConsensusResult, QuorumConsensus

          __all__ = ["ConsensusResult", "QuorumConsensus"]
          PY

      - name: Create protocol contracts
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/contracts/contracts.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import dataclass
          from typing import Any, Mapping


          @dataclass(frozen=True, slots=True)
          class ProtocolContract:
              name: str
              version: str
              schema: Mapping[str, str]

              def __post_init__(self) -> None:
                  if not self.name.strip():
                      raise ValueError("Contract name cannot be empty")
                  if not self.version.strip():
                      raise ValueError("Contract version cannot be empty")

                  object.__setattr__(self, "schema", dict(self.schema))

              def fingerprint(self) -> str:
                  payload = json.dumps(
                      {
                          "name": self.name,
                          "version": self.version,
                          "schema": dict(sorted(self.schema.items())),
                      },
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")

                  return hashlib.sha256(payload).hexdigest()


          class ContractRegistry:
              def __init__(self) -> None:
                  self._contracts: dict[tuple[str, str], ProtocolContract] = {}

              def register(self, contract: ProtocolContract) -> None:
                  key = (contract.name.strip(), contract.version.strip())

                  if key in self._contracts:
                      raise ValueError(f"Contract already registered: {key}")

                  self._contracts[key] = contract

              def get(self, name: str, version: str) -> ProtocolContract:
                  return self._contracts[(name.strip(), version.strip())]

              def validate(
                  self,
                  name: str,
                  version: str,
                  payload: Mapping[str, Any],
              ) -> bool:
                  contract = self.get(name, version)

                  for field_name, field_type in contract.schema.items():
                      if field_name not in payload:
                          return False

                      value = payload[field_name]

                      if field_type == "str" and not isinstance(value, str):
                          return False
                      if field_type == "int" and (
                          isinstance(value, bool) or not isinstance(value, int)
                      ):
                          return False
                      if field_type == "bool" and not isinstance(value, bool):
                          return False

                  return True


          __all__ = ["ProtocolContract", "ContractRegistry"]
          PY

          cat > protocol/contracts/__init__.py <<'PY'
          from .contracts import ContractRegistry, ProtocolContract

          __all__ = ["ProtocolContract", "ContractRegistry"]
          PY

      - name: Validate block
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            protocol/api \
            protocol/authentication \
            protocol/authorization \
            protocol/certification \
            protocol/consensus \
            protocol/contracts

          python - <<'PY'
          from protocol.api import APIRequest, APIRouter
          from protocol.authentication import (
              AuthenticationChallenge,
              AuthenticationVerifier,
          )
          from protocol.authorization import AuthorizationPolicy, Permission
          from protocol.certification import CertificateAuthority
          from protocol.consensus import QuorumConsensus
          from protocol.contracts import ContractRegistry, ProtocolContract

          request = APIRequest("get", "/health")
          router = APIRouter()
          router.register("GET", "/health", lambda _: "ok")
          assert callable(router.resolve("GET", "/health"))
          assert request.method == "GET"

          challenge = AuthenticationChallenge.create()
          verifier = AuthenticationVerifier(b"zyra-test-secret")
          response = verifier.create_response(challenge.challenge)
          assert verifier.verify(challenge.challenge, response)

          policy = AuthorizationPolicy()
          permission = Permission("network", "read")
          policy.grant("node-1", permission)
          assert policy.allowed("node-1", "network", "read")

          authority = CertificateAuthority("zyra-root")
          certificate = authority.issue("node-1", b"public-material")
          assert authority.verify(certificate)

          consensus = QuorumConsensus(5)
          result = consensus.evaluate(["A", "A", "A", "B", "B"])
          assert result.reached is True
          assert result.value == "A"

          contracts = ContractRegistry()
          contract = ProtocolContract(
              "node-registration",
              "1.0.0",
              {"node_id": "str", "active": "bool"},
          )
          contracts.register(contract)
          assert contracts.validate(
              "node-registration",
              "1.0.0",
              {"node_id": "n1", "active": True},
          )

          print("Protocol block 01 validation: OK")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            protocol/api \
            protocol/authentication \
            protocol/authorization \
            protocol/certification \
            protocol/consensus \
            protocol/contracts

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Implement protocol core block 01"
          git push
