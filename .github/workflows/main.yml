          from __future__ import annotations

          import json
          import socket
          import ssl
          import urllib.error
          import urllib.request
          import uuid
          from typing import Any, Mapping

          from ..constants import MAX_RESPONSE_BYTES
          from ..errors import (
              ProviderError,
              ProviderRateLimited,
              ProviderTimeout,
              ProviderUnavailable,
          )
          from ..models import AIRequest, ProviderResult
          from ..serialization import object_hash


          class HTTPSAIProvider:
              def __init__(
                  self,
                  *,
                  name: str,
                  endpoint: str,
                  api_key: str,
                  max_response_bytes: int = MAX_RESPONSE_BYTES,
              ) -> None:
                  if not endpoint.startswith("https://"):
                      raise ValueError("AI provider endpoint must use HTTPS")
                  if not api_key:
                      raise ValueError("api_key is required")

                  self.name = name
                  self.endpoint = endpoint
                  self.api_key = api_key
                  self.max_response_bytes = max_response_bytes
                  self._ssl_context = ssl.create_default_context()

              def execute(
                  self,
                  request: AIRequest,
                  *,
                  idempotency_key: str,
                  timeout_seconds: float,
              ) -> ProviderResult:
                  body = json.dumps(
                      {
                          "model": request.model,
                          "input": dict(request.input_payload),
                          "metadata": dict(request.metadata),
                      },
                      ensure_ascii=False,
                      separators=(",", ":"),
                  ).encode("utf-8")

                  request_id = request.request_id or uuid.uuid4().hex

                  http_request = urllib.request.Request(
                      self.endpoint,
                      data=body,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "Authorization": f"Bearer {self.api_key}",
                          "Idempotency-Key": idempotency_key,
                          "X-Request-ID": request_id,
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          http_request,
                          timeout=timeout_seconds,
                          context=self._ssl_context,
                      ) as response:
                          data = response.read(self.max_response_bytes + 1)

                          if len(data) > self.max_response_bytes:
                              raise ProviderError("provider response too large")

                          parsed: Mapping[str, Any] = json.loads(data.decode("utf-8"))

                          provider_request_id = str(
                              parsed.get("id") or request_id
                          )
                          usage = int(parsed.get("usage_units", 0))
                          cost = int(parsed.get("estimated_cost", usage))

                          return ProviderResult(
                              provider_request_id=provider_request_id,
                              payload=parsed,
                              usage_units=usage,
                              estimated_cost=cost,
                              raw_hash=object_hash(parsed),
                          )

                  except urllib.error.HTTPError as exc:
                      if exc.code == 429:
                          raise ProviderRateLimited(
                              f"provider rate limited: {self.name}"
                          ) from exc
                      if 500 <= exc.code <= 599:
                          raise ProviderUnavailable(
                              f"provider server error: {exc.code}"
                          ) from exc
                      raise ProviderError(
                          f"provider HTTP error: {exc.code}"
                      ) from exc
                  except (socket.timeout, TimeoutError) as exc:
                      raise ProviderTimeout(
                          f"provider timeout: {self.name}"
                      ) from exc
                  except urllib.error.URLError as exc:
                      raise ProviderUnavailable(
                          f"provider connection failure: {self.name}"
                      ) from exc
                  except json.JSONDecodeError as exc:
                      raise ProviderError("provider returned invalid JSON") from exc

              def health(self) -> Mapping[str, object]:
                  return {
                      "provider": self.name,
                      "endpoint": self.endpoint,
                      "transport": "https",
                  }
          PY

