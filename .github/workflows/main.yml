      - name: Storage package root
        shell: bash
        run: |
          set -euo pipefail

          cat > storage/__init__.py <<'PY'
          from .cold_storage import *
          from .encrypted_backups import *
          from .shards import *

          __all__ = [
              "cold_storage",
              "encrypted_backups",
              "shards",
          ]
