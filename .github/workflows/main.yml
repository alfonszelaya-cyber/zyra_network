      - name: Git integrity
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Verify unauthorized changes
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              shared_engines/ai/*)
                ;;
              .github/workflows/shared-engines-ai-production.yml)
                ;;
              *)
                echo "Unauthorized modification: $file"
                exit 1
                ;;
            esac
          done < <(
            git status --short |
              awk '{print $2}'
          )

      - name: Commit only AI Engine
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add shared_engines/ai

          if git diff --cached --quiet; then
