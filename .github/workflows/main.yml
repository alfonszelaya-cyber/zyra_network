                  action="store_true",
              )

              return parser.parse_args()


          def main() -> int:
              args = parse_args()
              logger = configure_logging(args.verbose)
              ensure_operational_layout()
              execution = execution_id()
              root = Path.cwd()

              try:
                  with FileLock(
                      LOCK_ROOT / "update.lock",
                      timeout=300,
                  ):
                      if (
                          not args.allow_dirty
                          and not git_is_clean(root)
                      ):
                          raise OperationalError(
                              "working tree contains changes"
                          )

                      before = git_revision(root)

                      run_command(
                          [
                              "git",
                              "fetch",
                              "--prune",
                              "--tags",
                              args.remote,
                          ],
                          cwd=root,
                          timeout=600,
                      )

                      target_ref = (
                          f"{args.remote}/{args.branch}"
                      )

                      exists = run_command(
                          [
                              "git",
                              "rev-parse",
                              "--verify",
                              target_ref,
                          ],
                          cwd=root,
                          timeout=30,
                      )

                      if not exists.stdout.strip():
                          raise OperationalError(
                              "remote branch does not exist: "
                              f"{target_ref}"
                          )

                      if args.dry_run:
                          payload = {
                              "execution_id": execution,
                              "before": before,
                              "target": target_ref,
                              "dry_run": True,
                          }

                          print(
                              json.dumps(
                                  payload,
                                  indent=2,
                              )
                          )

                          audit_event(
                              "update",
                              status="dry-run",
                              execution=execution,
                              details=payload,
                          )

                          return 0

                      run_command(
                          [
                              "git",
                              "merge",
                              "--ff-only",
                              target_ref,
                          ],
                          cwd=root,
                          timeout=600,
                      )

                      after = git_revision(root)

                      payload = {
                          "execution_id": execution,
                          "before": before,
                          "after": after,
                          "target": target_ref,
                          "updated": before != after,
                          "timestamp": utc_now(),
                      }

                      if args.verify:
                          run_command(
                              [
                                  sys.executable,
                                  "scripts",
                                  "verify_installation.py",
                                  "--strict",
                              ],
                              cwd=root,
                              timeout=1800,
                          )

                          payload[
                              "verification"
                          ] = "passed"

                      write_state(
                          "update",
                          payload,
                      )

                      audit_event(
                          "update",
                          status="success",
                          execution=execution,
                          details=payload,
                      )

                      logger.info(
                          "repository update completed: "
                          "%s -> %s",
                          before[:12],
                          after[:12],
                      )

                      return 0

              except Exception as exc:
                  audit_event(
