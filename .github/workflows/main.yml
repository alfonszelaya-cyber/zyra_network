          from __future__ import annotations

          import threading
          import time
          from dataclasses import dataclass, field
          from enum import Enum
          from typing import Callable, Mapping


          class AlertState(str, Enum):
              ACTIVE = "active"
              RESOLVED = "resolved"
              SUPPRESSED = "suppressed"


          @dataclass(frozen=True, slots=True)
          class AlertRule:
              name: str
              predicate: Callable[[Mapping[str, object]], bool]
              severity: str = "warning"
              cooldown_seconds: float = 300.0
              auto_resolve: bool = True

              def __post_init__(self) -> None:
                  if not self.name.strip():
                      raise ValueError("Alert rule name is required")
                  if self.cooldown_seconds < 0:
                      raise ValueError("cooldown_seconds cannot be negative")


          @dataclass(slots=True)
          class Alert:
              alert_id: str
              rule_name: str
              severity: str
              state: AlertState
              message: str
              labels: dict[str, str] = field(default_factory=dict)
              created_at: float = field(default_factory=time.time)
              updated_at: float = field(default_factory=time.time)


          class AlertManager:
              def __init__(self):
                  self._rules: dict[str, AlertRule] = {}
                  self._alerts: dict[str, Alert] = {}
                  self._last_fired: dict[str, float] = {}
                  self._lock = threading.RLock()
                  self._counter = 0

              def register(self, rule: AlertRule) -> None:
                  with self._lock:
                      if rule.name in self._rules:
                          raise ValueError(
                              f"Alert rule already exists: {rule.name}"
                          )
                      self._rules[rule.name] = rule

              def unregister(self, name: str) -> None:
                  with self._lock:
                      self._rules.pop(name, None)

              def evaluate(
                  self,
                  payload: Mapping[str, object],
              ) -> list[Alert]:
                  now = time.time()
                  fired: list[Alert] = []

                  with self._lock:
                      rules = list(self._rules.values())

                      for rule in rules:
                          try:
                              matches = bool(rule.predicate(payload))
                          except Exception:
                              matches = False

                          if not matches:
                              continue

                          previous = self._last_fired.get(rule.name, 0.0)

                          if now - previous < rule.cooldown_seconds:
                              continue

                          self._counter += 1
                          alert_id = f"alert_{self._counter:016d}"

                          alert = Alert(
                              alert_id=alert_id,
                              rule_name=rule.name,
                              severity=rule.severity,
                              state=AlertState.ACTIVE,
                              message=f"Alert rule triggered: {rule.name}",
                          )

                          self._alerts[alert_id] = alert
                          self._last_fired[rule.name] = now
                          fired.append(alert)

                  return fired

              def resolve(self, alert_id: str) -> Alert | None:
                  with self._lock:
                      alert = self._alerts.get(alert_id)

                      if alert is None:
                          return None

                      alert.state = AlertState.RESOLVED
                      alert.updated_at = time.time()
                      return alert

              def active(self) -> list[Alert]:
                  with self._lock:
                      return [
                          alert
                          for alert in self._alerts.values()
                          if alert.state == AlertState.ACTIVE
                      ]

              def all(self) -> list[Alert]:
                  with self._lock:
                      return list(self._alerts.values())
          PY

