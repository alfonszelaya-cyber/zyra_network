                      connection.rollback()
                      raise AIStorageError(
                          f"AI completion failed: {exc}"
                      ) from exc
                  finally:
                      connection.close()

              def fail(
                  self,
                  *,
                  request: AIRequest,
                  owner: str,
                  now: int,
                  error_code: str,
                  error_message: str,
              ) -> None:
                  safe_message = error_message[:4000]

                  connection = self._connect()

                  try:
                      connection.execute("BEGIN IMMEDIATE")

                      cursor = connection.execute(
                          """
                          UPDATE ai_requests
                          SET
                              status = 'failed',
                              lease_owner = NULL,
                              lease_until = NULL,
                              error_code = ?,
                              error_message = ?,
                              updated_at = ?
                          WHERE
                              idempotency_key = ?
                              AND status = 'running'
                              AND lease_owner = ?
                          """,
                          (
                              error_code,
                              safe_message,
                              now,
                              request.idempotency_key,
                              owner,
                          ),
                      )

                      if cursor.rowcount != 1:
                          connection.rollback()
                          raise AILeaseError(
                              "Failure state rejected because lease is not owned"
                          )

                      payload = (
                          f'{{"request_id":"{request.request_id}",'
                          f'"error_code":"{error_code}",'
                          f'"timestamp":{now}}}'
                      )

                      connection.execute(
                          """
                          INSERT INTO ai_outbox(
                              aggregate_id,
                              event_type,
                              payload,
                              created_at,
                              published_at
                          )
                          VALUES (?, 'AI_REQUEST_FAILED', ?, ?, NULL)
                          """,
                          (
                              request.idempotency_key,
                              payload,
                              now,
                          ),
                      )

                      self._audit_tx(
                          connection,
                          aggregate_id=request.idempotency_key,
                          event_type="AI_REQUEST_FAILED",
                          payload=payload,
                          now=now,
                      )

                      connection.commit()

                  except AILeaseError:
                      raise
                  except sqlite3.Error as exc:
                      connection.rollback()
                      raise AIStorageError(
                          f"AI failure persistence failed: {exc}"
                      ) from exc
                  finally:
                      connection.close()

              def recover_expired(
                  self,
                  *,
                  now: int,
                  stale_after_seconds: int,
              ) -> int:
                  cutoff = now - stale_after_seconds

                  connection = self._connect()

                  try:
                      connection.execute("BEGIN IMMEDIATE")

                      rows = connection.execute(
                          """
                          SELECT idempotency_key
                          FROM ai_requests
                          WHERE
                              status = 'running'
                              AND (
                                  lease_until IS NULL
                                  OR lease_until <= ?
                              )
                              AND updated_at <= ?
                          """,
                          (now, cutoff),
                      ).fetchall()

                      for row in rows:
                          aggregate_id = str(row[0])

                          connection.execute(
                              """
                              UPDATE ai_requests
                              SET
                                  status = 'recovery_required',
                                  lease_owner = NULL,
                                  lease_until = NULL,
                                  updated_at = ?
                              WHERE idempotency_key = ?
                              """,
                              (
                                  now,
                                  aggregate_id,
                              ),
                          )

                          self._audit_tx(
                              connection,
                              aggregate_id=aggregate_id,
                              event_type="AI_RECOVERY_REQUIRED",
                              payload=(
                                  f'{{"timestamp":{now}}}'
                              ),
                              now=now,
                          )

                      connection.commit()

                      return len(rows)

                  except sqlite3.Error as exc:
                      connection.rollback()
                      raise AIStorageError(
                          f"Recovery scan failed: {exc}"
                      ) from exc
                  finally:
                      connection.close()

              def pending_outbox(
                  self,
                  *,
                  limit: int = 100,
              ) -> tuple[OutboxRecord, ...]:
                  if not 1 <= limit <= 10_000:
                      raise ValueError("Invalid outbox limit")

                  connection = self._connect()

                  try:
                      rows = connection.execute(
                          """
                          SELECT
                              event_id,
                              aggregate_id,
                              event_type,
                              payload,
                              created_at
                          FROM ai_outbox
                          WHERE published_at IS NULL
                          ORDER BY event_id
                          LIMIT ?
                          """,
                          (limit,),
                      ).fetchall()

                      return tuple(
                          OutboxRecord(
                              event_id=int(row[0]),
                              aggregate_id=str(row[1]),
                              event_type=str(row[2]),
                              payload=str(row[3]),
                              created_at=int(row[4]),
                          )
                          for row in rows
                      )

                  finally:
                      connection.close()

              def mark_outbox_published(
                  self,
                  *,
                  event_id: int,
                  published_at: int,
              ) -> bool:
                  connection = self._connect()

                  try:
                      connection.execute("BEGIN IMMEDIATE")

                      cursor = connection.execute(
                          """
                          UPDATE ai_outbox
                          SET published_at = ?
                          WHERE
                              event_id = ?
                              AND published_at IS NULL
                          """,
                          (
                              published_at,
                              event_id,
                          ),
                      )

                      connection.commit()

                      return cursor.rowcount == 1

                  except sqlite3.Error as exc:
                      connection.rollback()
                      raise AIStorageError(
                          f"Outbox acknowledgement failed: {exc}"
                      ) from exc
                  finally:
                      connection.close()

              def verify_audit_chain(self) -> bool:
                  connection = self._connect()

                  try:
                      rows = connection.execute(
                          """
                          SELECT
                              event_id,
                              aggregate_id,
                              event_type,
                              payload_hash,
                              previous_hash,
                              record_hash,
                              created_at
                          FROM ai_audit
                          ORDER BY sequence
                          """
                      ).fetchall()

                      previous = "0" * 64

                      for row in rows:
                          event_id = str(row[0])
                          aggregate_id = str(row[1])
                          event_type = str(row[2])
                          payload_hash = str(row[3])
                          previous_hash = str(row[4])
                          record_hash = str(row[5])
                          created_at = int(row[6])

                          if previous_hash != previous:
                              return False

                          expected = hashlib.sha256(
                              (
                                  f"{event_id}|{aggregate_id}|{event_type}|"
                                  f"{payload_hash}|{previous_hash}|{created_at}"
                              ).encode("utf-8")
                          ).hexdigest()

                          if expected != record_hash:
                              return False

                          previous = record_hash

                      return True

                  finally:
                      connection.close()

              def count_requests(self) -> int:
                  connection = self._connect()

                  try:
                      row = connection.execute(
                          "SELECT COUNT(*) FROM ai_requests"
                      ).fetchone()

                      return int(row[0])
                  finally:
                      connection.close()

              def count_audit_records(self) -> int:
                  connection = self._connect()

                  try:
                      row = connection.execute(
                          "SELECT COUNT(*) FROM ai_audit"
                      ).fetchone()

                      return int(row[0])
                  finally:
                      connection.close()
          PY

