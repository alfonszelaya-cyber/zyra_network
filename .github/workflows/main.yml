          import threading
          from collections import defaultdict

          from ..core import (
              MetricKind,
              MetricRegistry,
              MetricSample,
              ObservationEvent,
              quantiles,
          )


          class AggregationEngine:
              def __init__(
                  self,
                  registry=None,
              ):
                  self.registry = (
                      registry
                      or MetricRegistry()
                  )

                  self._lock = threading.RLock()
                  self._event_count = 0
                  self._error_count = 0
                  self._latencies = defaultdict(
                      list
                  )

              def process(
                  self,
                  event: ObservationEvent,
              ):
                  with self._lock:
                      self._event_count += 1

                      if event.severity in {
                          "error",
                          "critical",
                      }:
                          self._error_count += 1

                      duration = (
                          event.payload.get(
                              "duration_ms"
                          )
                      )

                      if duration is not None:
                          value = float(duration)

                          self._latencies[
                              event.event_type
                          ].append(value)

                          self.registry.record(
                              MetricSample(
                                  name=(
                                      "observability."
                                      "event.duration_ms"
                                  ),
                                  kind=(
                                      MetricKind.HISTOGRAM
                                  ),
                                  value=value,
                                  timestamp_ns=(
                                      event.timestamp_ns
                                  ),
                                  labels={
                                      "event_type":
                                          event.event_type
                                  },
                              )
                          )

