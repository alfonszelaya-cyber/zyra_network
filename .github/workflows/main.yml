          cat > shared_engines/ai/crypto.py <<'PY'
          from __future__ import annotations

          import base64
          import os

          from cryptography.exceptions import InvalidTag
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          from .errors import AIEncryptionError


          class EnvelopeCipher:
              """
              AES-256-GCM authenticated encryption.

              Secrets are supplied externally and never persisted by this
              component.
              """

              KEY_BYTES = 32
              NONCE_BYTES = 12

              def __init__(self, key: bytes) -> None:
                  if len(key) != self.KEY_BYTES:
                      raise ValueError(
                          "Encryption key must contain 32 bytes"
                      )

                  self._key = bytes(key)

              def encrypt(
                  self,
                  plaintext: bytes,
                  *,
                  associated_data: bytes,
              ) -> str:
                  nonce = os.urandom(self.NONCE_BYTES)

                  try:
                      ciphertext = AESGCM(self._key).encrypt(
                          nonce,
                          plaintext,
                          associated_data,
                      )
                  except Exception as exc:
                      raise AIEncryptionError(
                          "Encryption failed"
                      ) from exc

                  return base64.urlsafe_b64encode(
                      nonce + ciphertext
                  ).decode("ascii")

              def decrypt(
                  self,
                  token: str,
                  *,
                  associated_data: bytes,
              ) -> bytes:
                  try:
                      raw = base64.urlsafe_b64decode(
                          token.encode("ascii")
                      )

                      if len(raw) <= self.NONCE_BYTES:
                          raise ValueError(
                              "Encrypted payload is too short"
                          )

                      nonce = raw[:self.NONCE_BYTES]
                      ciphertext = raw[self.NONCE_BYTES:]

                      return AESGCM(self._key).decrypt(
                          nonce,
                          ciphertext,
                          associated_data,
                      )

                  except (
                      InvalidTag,
                      ValueError,
                      TypeError,
                  ) as exc:
                      raise AIEncryptionError(
                          "Authenticated decryption failed"
                      ) from exc
          PY

          cat > shared_engines/ai/registry.py <<'PY'
          from __future__ import annotations

          from threading import RLock

          from .contracts import ModelDescriptor
          from .errors import AIValidationError


          class ModelRegistry:
              """
              Version-aware process-local model registry.

              Existing model identities cannot be silently redefined.
              """

              def __init__(self) -> None:
                  self._lock = RLock()
                  self._models: dict[str, ModelDescriptor] = {}
                  self._revision = 0

              def register(
                  self,
                  model: ModelDescriptor,
              ) -> int:
                  with self._lock:
                      existing = self._models.get(model.model_id)

                      if existing is not None:
                          if existing != model:
                              raise AIValidationError(
                                  "Existing model identity cannot be "
                                  "silently redefined"
                              )

                          return self._revision

                      self._models[model.model_id] = model
                      self._revision += 1

                      return self._revision

              def get(
                  self,
                  model_id: str,
              ) -> ModelDescriptor:
                  normalized = model_id.strip()

                  with self._lock:
                      model = self._models.get(normalized)

                  if model is None:
                      raise AIValidationError(
                          f"Unknown model: {normalized}"
                      )

                  if not model.active:
                      raise AIValidationError(
                          f"Inactive model: {normalized}"
                      )

                  return model

              @property
              def revision(self) -> int:
                  with self._lock:
                      return self._revision

              def snapshot(
                  self,
              ) -> tuple[int, tuple[ModelDescriptor, ...]]:
                  with self._lock:
                      return (
                          self._revision,
                          tuple(self._models.values()),
                      )
          PY

