                      ) from exc
                  finally:
                      connection.close()

              def _encrypt_request(
                  self,
                  request: AIRequest,
              ) -> str:
                  plaintext = request_to_json(request).encode("utf-8")

                  nonce = os.urandom(
                      EnvelopeCipher.NONCE_BYTES
                  )

                  return self._cipher.encrypt(
                      plaintext,
                      associated_data=request.idempotency_key.encode(
                          "utf-8"
                      ),
                      nonce=nonce,
                  )

              def _decrypt_request(
                  self,
                  encrypted: str,
                  *,
                  idempotency_key: str,
              ) -> AIRequest:
                  plaintext = self._cipher.decrypt(
                      encrypted,
                      associated_data=idempotency_key.encode("utf-8"),
