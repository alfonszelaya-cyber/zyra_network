              with tempfile.TemporaryDirectory() as directory:
                  path = str(Path(directory) / "ai.db")
                  store = SQLiteAIStore(path)

                  store.reserve(
                      "r1",
                      "idem",
                      "hash-a",
                      "encrypted",
                      "provider",
                      "model",
                      "owner",
                      60,
                  )

                  with store.connection() as db:
                      db.execute(
                          """
                          UPDATE ai_requests
                          SET lease_expires=0
                          WHERE request_id='r1'
                          """
                      )

                  assert store.recover_expired() == 1

                  with pytest.raises(AIRecoveryRequired):
                      store.reserve(
                          "r1",
                          "idem",
                          "hash-a",
                          "encrypted",
                          "provider",
                          "model",
                          "owner-2",
                          60,
                      )


          def test_audit_tampering_is_detected() -> None:
              with tempfile.TemporaryDirectory() as directory:
                  path = str(Path(directory) / "ai.db")
                  store = SQLiteAIStore(path)

                  with store.connection() as db:
                      store._append_audit(
                          db,
                          "aggregate",
                          "TEST",
                          "{}",
                          1.0,
                      )

                  store.verify_audit()

                  with store.connection() as db:
                      db.execute(
                          """
                          UPDATE audit
                          SET payload='tampered'
                          """
                      )

                  with pytest.raises(AIIntegrityError):
                      store.verify_audit()


