              def fail(
                  self,
                  *,
                  request: AIRequest,
                  owner: str,
                  now: int,
                  error_code: str,
                  error_message: str,
              ) -> None:
                  safe_message = error_message[:4000]

                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      cursor = connection.execute(
                          """
                          UPDATE ai_requests
                          SET
                              status = 'failed',
                              lease_owner = NULL,
                              lease_token = NULL,
                              lease_until = NULL,
                              error_code = ?,
                              error_message = ?,
