              budget: ExecutionBudget | None = None,
          ) -> AIEngine:
              registry = ModelRegistry()
              registry.register(MODEL)

              return AIEngine(
                  registry,
                  [LocalProvider()],
                  store=store,
                  budget=budget,
              )


          def make_key() -> bytes:
              return b"0123456789abcdef0123456789abcdef"


          def test_registry_rejects_silent_model_redefinition():
