          from __future__ import annotations

          import threading
          import time

          from ..alerts.alerts import AlertManager
          from ..collector.collector import Collector
          from ..core import (
              ObservationEvent,
              ObservationPolicy,
          )
          from ..engine.engine import AggregationEngine
          from ..events.events import EventBus


          class MonitoringCoordinator:
              """
              Asynchronous observation pipeline.

              Producer:
                  emit -> bounded queue

              Worker:
                  persistence -> aggregation -> alerts -> subscribers

              Durable persistence occurs before derived processing.
              """

              def __init__(
                  self,
                  *,
                  policy=None,
                  storage=None,
                  worker_count=2,
              ):
                  self.policy = (
                      policy
                      or ObservationPolicy()
                  ).validate()

                  if worker_count < 1:
                      raise ValueError(
                          "worker_count must be positive"
                      )

                  self.collector = Collector(
                      self.policy
                  )

                  self.storage = storage
                  self.engine = (
                      AggregationEngine()
                  )

                  self.events = EventBus()
                  self.alerts = AlertManager()

                  self.worker_count = (
                      worker_count
                  )

                  self._lock = threading.RLock()
                  self._running = False
                  self._workers = []
                  self._fatal_errors = []
                  self._processed = 0
                  self._failed = 0

              def start(self):
                  with self._lock:
                      if self._running:
                          return

                      self._running = True
                      self._workers = []

                      for index in range(
                          self.worker_count
                      ):
                          worker = (
                              threading.Thread(
                                  target=self._worker,
                                  name=(
                                      "zyra-observability-"
                                      f"{index}"
                                  ),
                                  daemon=True,
                              )
                          )

                          self._workers.append(
                              worker
                          )

                          worker.start()

              def _worker(self):
                  while True:
                      with self._lock:
                          running = (
                              self._running
                          )

                      event = self.collector.get(
                          timeout=0.25
                      )

                      if event is None:
                          if not running:
                              return

                          continue

                      try:
                          if self.storage is not None:
                              sequence = (
                                  self.storage.append(
                                      event
                                  )
                              )

                              event = (
                                  event.with_sequence(
                                      sequence
                                  )
                              )

                          self.engine.process(
                              event
                          )

                          self.alerts.evaluate(
                              event
                          )

                          self.events.publish(
                              event
                          )

                          with self._lock:
                              self._processed += 1

                      except Exception as exc:
                          with self._lock:
                              self._failed += 1

                              self._fatal_errors.append({
                                  "type":
                                      type(exc).__name__,
                                  "message":
                                      str(exc),
                                  "timestamp_ns":
                                      time.time_ns(),
                              })

              def emit(
                  self,
                  event,
                  *,
                  block=False,
                  timeout=None,
              ):
                  with self._lock:
                      if not self._running:
                          return False

                  return self.collector.submit(
                      event,
                      block=block,
                      timeout=timeout,
                  )

              def stop(
                  self,
                  timeout=30.0,
              ):
                  with self._lock:
                      if not self._running:
                          return

                      self._running = False

                  deadline = (
                      time.monotonic()
                      + timeout
                  )

                  for worker in self._workers:
                      remaining = (
                          deadline
                          - time.monotonic()
                      )

                      if remaining <= 0:
                          raise TimeoutError(
                              "observability workers "
                              "did not stop"
                          )

                      worker.join(
                          remaining
                      )

                      if worker.is_alive():
                          raise TimeoutError(
                              "observability worker "
                              "did not stop"
                          )

                  self._workers = []

              def health(self):
                  with self._lock:
                      storage_count = None

                      if self.storage is not None:
                          storage_count = (
                              self.storage.count()
                          )

                      return {
                          "running":
                              self._running,
                          "queue":
                              self.collector.stats(),
                          "processed":
                              self._processed,
                          "failed":
                              self._failed,
                          "workers":
                              len(self._workers),
                          "metrics":
                              self.engine.registry.count(),
                          "active_alerts":
                              len(
                                  self.alerts.active()
                              ),
                          "storage_count":
                              storage_count,
                      }

              def snapshot(self):
                  return {
                      "health":
                          self.health(),
                      "engine":
                          self.engine.snapshot(),
                      "alerts": [
                          alert.to_dict()
                          for alert
                          in self.alerts.active()
                      ],
                  }


