              "NETWORK_HEALTH",
              {
                  "status": "ok",
                  "sequence": 1,
              },
          )

          encoded = ProtocolEncoder.encode(
              message.canonical_dict()
          )

          decoded = ProtocolEncoder.decode(
              encoded
          )

          assert decoded["message_type"] == (
              "NETWORK_HEALTH"
          )

          verifier = ProtocolVerifier()

          fingerprint = verifier.fingerprint(
              encoded
          )

          assert verifier.verify_fingerprint(
              encoded,
              fingerprint,
          )

          routes = RouteTable()

          routes.add(
              Route(
                  source="zyra-node-a",
                  destination="zyra-node-b",
                  protocol="tcp",
                  priority=1,
              )
          )

          assert routes.resolve(
              "zyra-node-a",
              "zyra-node-b",
              "tcp",
          )

          sessions = SessionManager()

          session = sessions.create(
              "zyra-node-a",
              "zyra-node-b",
          )

          sessions.activate(
              session.session_id
          )

          transport = InMemoryTransport()

          transport.connect(
              TransportAddress(
                  host="127.0.0.1",
                  port=9000,
              )
          )

          transport.send(encoded)

          received = transport.receive_all()

          assert received == (
              encoded,
          )

