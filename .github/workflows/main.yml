name: Build Complete NEXO Architecture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nexo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create complete NEXO architecture
        shell: bash
        run: |
          set -euo pipefail

          ROOT="apps/nexo"

          mkdir -p "$ROOT"

          create_dir() {
            mkdir -p "$1"
            touch "$1/__init__.py"
          }

          create_file() {
            local file="$1"
            mkdir -p "$(dirname "$file")"
            touch "$file"
          }

          # ============================================================
          # ROOT
          # ============================================================

          create_file "$ROOT/__init__.py"
          create_file "$ROOT/README.md"

          # ============================================================
          # APPLICATION
          # ============================================================

          APPLICATION_DIRS=(
            application
            application/commands
            application/queries
            application/dto
            application/handlers
            application/services
            application/workflows
            application/use_cases

            application/executive_use_cases
            application/clients_use_cases
            application/finance_use_cases
            application/accounting_use_cases
            application/operations_use_cases
            application/logistics_use_cases
            application/risk_use_cases
            application/security_identity_use_cases
            application/government_use_cases
            application/meta_government_use_cases
            application/family_office_use_cases
            application/customer_service_use_cases
            application/compliance_use_cases
            application/identity_use_cases
