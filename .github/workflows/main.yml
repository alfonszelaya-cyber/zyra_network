          from .provider_protocol import AIProvider


          class OpenAICompatibleProvider(AIProvider):
              """
              HTTPS OpenAI-compatible provider.

              The endpoint and credential are deployment configuration.
              Credentials are never persisted by this adapter.
              """

              def __init__(
                  self,
                  *,
                  name: str,
                  endpoint: str,
                  api_key: str,
                  models: tuple[ModelDescriptor, ...],
                  timeout_seconds: float = 120.0,
                  maximum_response_bytes: int = 8_000_000,
              ) -> None:
                  if not name.strip():
                      raise ValueError(
                          "Provider name is required"
                      )

                  if not endpoint.startswith("https://"):
                      raise ValueError(
                          "Provider endpoint must use HTTPS"
                      )

                  if not api_key.strip():
                      raise ValueError(
                          "Provider API key is required"
                      )

                  if not models:
                      raise ValueError(
                          "Provider requires models"
                      )

                  if not 0 < timeout_seconds <= 1800:
                      raise ValueError(
                          "Invalid provider timeout"
                      )

                  if not (
                      1
                      <= maximum_response_bytes
                      <= 64_000_000
                  ):
                      raise ValueError(
                          "Invalid response size limit"
                      )

                  if any(
                      model.provider != name
                      for model in models
                  ):
                      raise ValueError(
                          "Model/provider mismatch"
                      )

                  self._name = name.strip()
                  self._endpoint = endpoint
                  self._api_key = api_key
                  self._models = models
                  self._timeout = timeout_seconds
                  self._maximum_response_bytes = (
                      maximum_response_bytes
                  )

              @property
              def name(self) -> str:
                  return self._name

              def models(
                  self,
              ) -> tuple[ModelDescriptor, ...]:
                  return self._models

              def health(self) -> bool:
                  return bool(self._api_key)

              def complete(
                  self,
                  request: AIRequest,
                  model: ModelDescriptor,
              ) -> AIResponse:
                  messages: list[dict[str, str]] = []

                  if request.system_prompt is not None:
                      messages.append(
                          {
                              "role": "system",
                              "content": request.system_prompt,
                          }
                      )

                  messages.append(
                      {
                          "role": "user",
                          "content": request.prompt,
                      }
                  )

                  payload = {
                      "model": model.model_id,
                      "messages": messages,
                      "max_tokens": request.max_output_tokens,
                      "temperature": float(
                          request.temperature
                      ),
                  }

                  encoded = json.dumps(
                      payload,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  ).encode("utf-8")

                  request_object = urllib.request.Request(
                      self._endpoint,
                      data=encoded,
                      method="POST",
                      headers={
                          "Accept": "application/json",
                          "Content-Type": "application/json",
                          "Authorization": (
                              "Bearer " + self._api_key
                          ),
                          "Idempotency-Key": (
                              request.idempotency_key
                          ),
                          "User-Agent": (
                              "ZYRA-Network-AI/2.0"
                          ),
                      },
                  )

                  started = int(time.time())

                  try:
                      with urllib.request.urlopen(
                          request_object,
                          timeout=min(
                              self._timeout,
                              request.timeout_seconds,
                          ),
                      ) as response:
                          if response.status < 200:
                              raise AIProviderTransientError(
                                  "Invalid provider HTTP status"
                              )

                          if response.status >= 300:
                              raise AIProviderPermanentError(
                                  "Unexpected provider HTTP status"
                              )

                          raw = response.read(
                              self._maximum_response_bytes + 1
                          )

                  except urllib.error.HTTPError as exc:
                      if exc.code in {
                          408,
                          425,
                          429,
                          500,
                          502,
                          503,
                          504,
                      }:
                          raise AIProviderTransientError(
                              f"Provider returned HTTP {exc.code}"
                          ) from exc

                      raise AIProviderPermanentError(
                          f"Provider returned HTTP {exc.code}"
                      ) from exc

                  except urllib.error.URLError as exc:
                      raise AIProviderTransientError(
                          "Provider network failure"
                      ) from exc

                  except TimeoutError as exc:
                      raise AIProviderTransientError(
                          "Provider timeout"
                      ) from exc

                  if len(raw) > self._maximum_response_bytes:
                      raise AIProviderProtocolError(
                          "Provider response exceeds size limit"
                      )

                  try:
                      data = json.loads(
                          raw.decode("utf-8")
                      )
                  except (
                      UnicodeDecodeError,
                      json.JSONDecodeError,
                  ) as exc:
                      raise AIProviderProtocolError(
                          "Provider returned invalid JSON"
                      ) from exc

                  if not isinstance(data, dict):
                      raise AIProviderProtocolError(
                          "Provider response must be an object"
                      )

                  try:
                      choices = data["choices"]

                      if not isinstance(choices, list):
                          raise TypeError

                      first = choices[0]

                      if not isinstance(first, dict):
                          raise TypeError

                      message = first["message"]

                      if not isinstance(message, dict):
                          raise TypeError

                      output = message["content"]

                      if not isinstance(output, str):
                          raise TypeError

                  except (
                      KeyError,
                      IndexError,
                      TypeError,
                  ) as exc:
                      raise AIProviderProtocolError(
                          "Invalid provider response structure"
                      ) from exc

                  usage = data.get(
                      "usage",
                      {},
                  )

                  if not isinstance(usage, dict):
                      raise AIProviderProtocolError(
                          "Invalid provider usage"
                      )

                  try:
                      input_tokens = int(
                          usage.get(
                              "prompt_tokens",
                              0,
                          )
                      )

                      output_tokens = int(
                          usage.get(
                              "completion_tokens",
                              0,
                          )
                      )

                      total_tokens = int(
                          usage.get(
                              "total_tokens",
                              input_tokens
                              + output_tokens,
                          )
                      )
                  except (
                      TypeError,
                      ValueError,
                  ) as exc:
                      raise AIProviderProtocolError(
                          "Invalid provider token accounting"
                      ) from exc

                  if (
                      input_tokens < 0
                      or output_tokens < 0
                      or total_tokens
                      != input_tokens + output_tokens
                  ):
                      raise AIProviderProtocolError(
                          "Invalid provider token totals"
                      )

                  provider_response_id = data.get(
                      "id"
                  )

                  if provider_response_id is None:
                      response_id = (
                          request.request_id
                      )
                  elif isinstance(
                      provider_response_id,
                      str,
                  ) and provider_response_id.strip():
                      response_id = (
                          provider_response_id.strip()
                      )
                  else:
                      raise AIProviderProtocolError(
                          "Invalid provider response id"
                      )

                  completed = int(time.time())

                  return AIResponse(
                      schema_version=2,
                      request_id=request.request_id,
                      model_id=model.model_id,
                      provider=self._name,
                      output=output,
                      usage=AIUsage(
                          input_tokens=input_tokens,
                          output_tokens=output_tokens,
                          total_tokens=total_tokens,
                          estimated_cost=Decimal("0"),
                      ),
                      created_at=started,
                      completed_at=max(
                          completed,
                          started,
                      ),
                      response_id=response_id,
                      metadata=MappingProxyType({}),
                  )
