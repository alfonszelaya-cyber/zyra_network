name: build-shared-ai-production

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: write

concurrency:
  group: shared-ai-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            cryptography==46.0.1 \
            pytest==8.4.2 \
            flake8==7.3.0 \
            mypy==1.18.2

      - name: Generate production AI engine
        shell: bash
        run: |
          set -euo pipefail

          rm -rf shared_engines/ai

          mkdir -p \
            shared_engines/ai/tests

          cat > shared_engines/ai/__init__.py <<'PY'
          """Durable shared AI execution engine."""

          from .config import AIEngineConfig
          from .contracts import AIRequest, AIResponse, ModelDescriptor
          from .engine import AIEngine
          from .errors import (
              AIError,
              AIIdempotencyConflict,
              AIRecoveryRequired,
          )

          __all__ = [
              "AIEngine",
              "AIEngineConfig",
              "AIError",
              "AIIdempotencyConflict",
              "AIRecoveryRequired",
              "AIRequest",
              "AIResponse",
              "ModelDescriptor",
          ]
          PY

          cat > shared_engines/ai/errors.py <<'PY'
          """Typed failures for the shared AI engine."""


          class AIError(Exception):
              """Base error for the AI engine."""


          class AIConfigurationError(AIError):
              """Invalid or unsafe engine configuration."""


          class AIValidationError(AIError):
              """Invalid request or model contract."""


          class AIIdempotencyConflict(AIError):
              """An idempotency key was reused with different input."""


          class AIRequestInFlight(AIError):
              """The same idempotent request is currently being executed."""


          class AIRecoveryRequired(AIError):
              """Execution outcome is uncertain and requires reconciliation."""


          class AIProviderError(AIError):
              """Base provider failure."""


          class AIProviderTransientError(AIProviderError):
              """Provider failure that may safely be retried."""


          class AIProviderPermanentError(AIProviderError):
              """Provider failure that must not be retried."""


          class AIProviderProtocolError(AIProviderPermanentError):
              """Provider returned an invalid protocol response."""


          class AICircuitOpen(AIError):
              """Provider circuit breaker is open."""


          class AIBudgetExceeded(AIError):
              """Execution budget was exceeded."""


          class AIBackpressure(AIError):
              """The engine cannot accept more work safely."""


          class AIIntegrityError(AIError):
              """Durable state or audit integrity failure."""


          class AIMigrationError(AIError):
              """Database migration failure."""


          class AILeaseLost(AIError):
              """The execution fencing lease is no longer owned."""
          PY

          cat > shared_engines/ai/contracts.py <<'PY'
          """Stable versioned AI contracts."""

          from __future__ import annotations

          from dataclasses import dataclass
          from decimal import Decimal
          from typing import Mapping


          CONTRACT_VERSION = 1


          @dataclass(frozen=True)
          class ModelDescriptor:
              """Immutable model identity used by execution records."""

              provider: str
              model: str
              revision: str
              contract_version: int = CONTRACT_VERSION

              def validate(self) -> None:
                  values = (
                      self.provider,
                      self.model,
                      self.revision,
                  )
                  if not all(values):
                      raise ValueError("model descriptor contains empty fields")
                  if self.contract_version != CONTRACT_VERSION:
                      raise ValueError("unsupported model contract version")


          @dataclass(frozen=True)
          class AIRequest:
              """Immutable AI execution request."""

              request_id: str
              idempotency_key: str
              model: ModelDescriptor
              payload: Mapping[str, object]
              max_attempts: int = 3
              deadline_seconds: float = 60.0
              cost_limit: Decimal = Decimal("1000000")

              def validate(self) -> None:
                  if not self.request_id:
                      raise ValueError("request_id is required")
                  if not self.idempotency_key:
                      raise ValueError("idempotency_key is required")
                  if self.max_attempts < 1 or self.max_attempts > 10:
                      raise ValueError("max_attempts must be between 1 and 10")
                  if self.deadline_seconds <= 0:
                      raise ValueError("deadline_seconds must be positive")
                  if self.cost_limit < 0:
                      raise ValueError("cost_limit cannot be negative")
                  self.model.validate()


          @dataclass(frozen=True)
          class AIResponse:
              """Provider-neutral immutable response."""

              request_id: str
              provider_request_id: str
              output: Mapping[str, object]
              usage: Mapping[str, object]
              cost: Decimal
              contract_version: int = CONTRACT_VERSION

              def validate(self) -> None:
                  if not self.request_id:
                      raise ValueError("response request_id is required")
                  if not self.provider_request_id:
                      raise ValueError("provider_request_id is required")
                  if self.cost < 0:
                      raise ValueError("response cost cannot be negative")
                  if self.contract_version != CONTRACT_VERSION:
                      raise ValueError("unsupported response contract version")
          PY

          cat > shared_engines/ai/serialization.py <<'PY'
          """Canonical deterministic serialization."""

          from __future__ import annotations

          import hashlib
          import json
          from typing import Any


          def canonical_bytes(value: Any) -> bytes:
              """Serialize JSON-compatible data deterministically."""
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")


          def sha256_hex(value: Any) -> str:
              """Return a stable SHA-256 digest."""
              return hashlib.sha256(canonical_bytes(value)).hexdigest()
          PY

          cat > shared_engines/ai/keys.py <<'PY'
          """Versioned encryption key contracts."""

          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Protocol


          class KeyProvider(Protocol):
              """Supplies versioned symmetric encryption keys."""

              def current(self) -> tuple[str, bytes]:
                  ...

              def get(self, version: str) -> bytes:
                  ...


          @dataclass(frozen=True)
          class StaticKeyProvider:
              """Reference provider for deployment-managed keys.

              Production deployments should replace this with KMS/HSM-backed
              key material. Secrets must never be committed to source control.
              """

              version: str
              key: bytes

              def __post_init__(self) -> None:
                  if not self.version:
                      raise ValueError("key version is required")
                  if len(self.key) != 32:
                      raise ValueError("AES-256 requires a 32-byte key")

              def current(self) -> tuple[str, bytes]:
                  return self.version, self.key

              def get(self, version: str) -> bytes:
                  if version != self.version:
                      raise KeyError(version)
                  return self.key
          PY

          cat > shared_engines/ai/crypto.py <<'PY'
          """Authenticated encryption with explicit key versions."""

          from __future__ import annotations

          import base64

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          from .keys import KeyProvider


          class EnvelopeCipher:
              """AES-256-GCM envelope cipher."""

              def __init__(self, keys: KeyProvider) -> None:
                  self._keys = keys

              def encrypt(self, plaintext: bytes, aad: bytes) -> str:
                  version, key = self._keys.current()
                  nonce = AESGCM.generate_key(bit_length=96)
                  ciphertext = AESGCM(key).encrypt(nonce, plaintext, aad)
                  raw = (
                      version.encode("utf-8")
                      + b"\0"
                      + nonce
                      + ciphertext
                  )
                  return base64.urlsafe_b64encode(raw).decode("ascii")

              def decrypt(self, token: str, aad: bytes) -> bytes:
                  raw = base64.urlsafe_b64decode(token.encode("ascii"))
                  separator = raw.find(b"\0")
                  if separator <= 0:
                      raise ValueError("invalid encrypted envelope")
                  version = raw[:separator].decode("utf-8")
                  body = raw[separator + 1:]
                  nonce = body[:12]
                  ciphertext = body[12:]
                  key = self._keys.get(version)
                  return AESGCM(key).decrypt(nonce, ciphertext, aad)
          PY

          cat > shared_engines/ai/config.py <<'PY'
          """Validated AI engine configuration."""

          from __future__ import annotations

          from dataclasses import dataclass

          from .errors import AIConfigurationError


          @dataclass(frozen=True)
          class AIEngineConfig:
              db_path: str
              lease_seconds: int = 120
              max_concurrency: int = 32
              max_queue: int = 256
              max_payload_bytes: int = 2_000_000
              max_response_bytes: int = 8_000_000
              retry_base_seconds: float = 0.25
              retry_max_seconds: float = 8.0

              def validate(self) -> None:
                  if not self.db_path:
                      raise AIConfigurationError("db_path is required")
                  if self.lease_seconds < 5:
                      raise AIConfigurationError("lease_seconds is too small")
                  if self.max_concurrency < 1:
                      raise AIConfigurationError(
                          "max_concurrency must be positive"
                      )
                  if self.max_queue < 0:
                      raise AIConfigurationError(
                          "max_queue cannot be negative"
                      )
                  if self.max_payload_bytes < 1024:
                      raise AIConfigurationError(
                          "max_payload_bytes is too small"
                      )
                  if self.max_response_bytes < 1024:
                      raise AIConfigurationError(
                          "max_response_bytes is too small"
                      )
                  if self.retry_base_seconds <= 0:
                      raise AIConfigurationError(
                          "retry_base_seconds must be positive"
                      )
                  if self.retry_max_seconds < self.retry_base_seconds:
                      raise AIConfigurationError(
                          "retry_max_seconds must be >= base"
                      )
          PY

          cat > shared_engines/ai/compatibility.py <<'PY'
          """Long-lived schema compatibility rules."""

          from __future__ import annotations

          from dataclasses import dataclass

          from .contracts import CONTRACT_VERSION
          from .errors import AIValidationError


          @dataclass(frozen=True)
          class ContractPolicy:
              current: int = CONTRACT_VERSION
              minimum_readable: int = CONTRACT_VERSION

              def validate(self) -> None:
                  if self.minimum_readable > self.current:
                      raise AIValidationError(
                          "minimum readable version exceeds current version"
                      )

              def require_readable(self, version: int) -> None:
                  if version < self.minimum_readable or version > self.current:
                      raise AIValidationError(
                          f"unsupported contract version: {version}"
                      )
          PY

          cat > shared_engines/ai/events.py <<'PY'
          """Versioned durable event envelopes."""

          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Mapping

          from .serialization import sha256_hex


          EVENT_VERSION = 1


          @dataclass(frozen=True)
          class EventEnvelope:
              event_id: str
              event_type: str
              aggregate_id: str
              payload: Mapping[str, object]
              version: int = EVENT_VERSION

              def fingerprint(self) -> str:
                  return sha256_hex(
                      {
                          "event_id": self.event_id,
                          "event_type": self.event_type,
                          "aggregate_id": self.aggregate_id,
                          "payload": self.payload,
                          "version": self.version,
                      }
                  )
          PY

          cat > shared_engines/ai/provider_protocol.py <<'PY'
          """Provider abstraction with explicit failure semantics."""

          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Mapping, Protocol, Sequence

          from .contracts import AIRequest, AIResponse


          @dataclass(frozen=True)
          class ProviderResult:
              response: AIResponse
              provider_request_id: str


          class AIProvider(Protocol):
              """Contract every real provider adapter must implement."""

              name: str

              def execute(
                  self,
                  request: AIRequest,
                  headers: Mapping[str, str],
              ) -> ProviderResult:
                  ...

              def healthcheck(self) -> bool:
                  ...

              def supported_models(self) -> Sequence[str]:
                  ...
          PY

          cat > shared_engines/ai/http_provider.py <<'PY'
          """Strict HTTPS provider adapter."""

          from __future__ import annotations

          import json
          import ssl
          from dataclasses import dataclass
          from typing import Mapping
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          from .contracts import AIRequest, AIResponse
          from .errors import (
              AIProviderProtocolError,
              AIProviderPermanentError,
              AIProviderTransientError,
          )
          from .provider_protocol import AIProvider, ProviderResult


          @dataclass(frozen=True)
          class HTTPProvider(AIProvider):
              """Provider adapter for JSON-over-HTTPS APIs."""

              name: str
              endpoint: str
              api_key: str
              timeout_seconds: float = 30.0
              max_response_bytes: int = 8_000_000

              def __post_init__(self) -> None:
                  if not self.endpoint.startswith("https://"):
                      raise ValueError("provider endpoint must use HTTPS")
                  if not self.api_key:
                      raise ValueError("provider API key is required")
                  if self.timeout_seconds <= 0:
                      raise ValueError("timeout must be positive")

              def execute(
                  self,
                  request: AIRequest,
                  headers: Mapping[str, str],
              ) -> ProviderResult:
                  body = json.dumps(
                      {
                          "model": request.model.model,
                          "input": request.payload,
                      },
                      ensure_ascii=False,
                      separators=(",", ":"),
                  ).encode("utf-8")

                  request_headers = {
                      "Authorization": f"Bearer {self.api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "Idempotency-Key": request.idempotency_key,
                  }
                  request_headers.update(headers)

                  http_request = Request(
                      self.endpoint,
                      data=body,
                      headers=request_headers,
                      method="POST",
                  )

                  context = ssl.create_default_context()

                  try:
                      with urlopen(
                          http_request,
                          timeout=self.timeout_seconds,
                          context=context,
                      ) as response:
                          raw = response.read(self.max_response_bytes + 1)
                          if len(raw) > self.max_response_bytes:
                              raise AIProviderProtocolError(
                                  "provider response exceeded configured limit"
                              )
                          status = int(response.status)
                  except HTTPError as exc:
                      if exc.code == 429 or 500 <= exc.code <= 599:
                          raise AIProviderTransientError(
                              f"provider HTTP {exc.code}"
                          ) from exc
                      raise AIProviderPermanentError(
                          f"provider HTTP {exc.code}"
                      ) from exc
                  except URLError as exc:
                      raise AIProviderTransientError(
                          "provider network failure"
                      ) from exc
                  except TimeoutError as exc:
                      raise AIProviderTransientError(
                          "provider timeout"
                      ) from exc

                  if status != 200:
                      raise AIProviderTransientError(
                          f"unexpected provider status {status}"
                      )

                  try:
                      decoded = json.loads(raw.decode("utf-8"))
                  except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                      raise AIProviderProtocolError(
                          "provider returned invalid JSON"
                      ) from exc

                  if not isinstance(decoded, dict):
                      raise AIProviderProtocolError(
                          "provider response must be an object"
                      )

                  provider_id = decoded.get("id")
                  output = decoded.get("output")
                  usage = decoded.get("usage", {})
                  cost = decoded.get("cost", "0")

                  if not isinstance(provider_id, str) or not provider_id:
                      raise AIProviderProtocolError(
                          "provider response is missing id"
                      )
                  if not isinstance(output, dict):
                      raise AIProviderProtocolError(
                          "provider response is missing object output"
                      )
                  if not isinstance(usage, dict):
                      raise AIProviderProtocolError(
                          "provider usage must be an object"
                      )

                  from decimal import Decimal

                  try:
                      response_cost = Decimal(str(cost))
                  except Exception as exc:
                      raise AIProviderProtocolError(
                          "provider cost is invalid"
                      ) from exc

                  result = AIResponse(
                      request_id=request.request_id,
                      provider_request_id=provider_id,
                      output=output,
                      usage=usage,
                      cost=response_cost,
                  )
                  result.validate()

                  return ProviderResult(
                      response=result,
                      provider_request_id=provider_id,
                  )

              def healthcheck(self) -> bool:
                  return bool(self.endpoint and self.api_key)

              def supported_models(self) -> tuple[str, ...]:
                  return ()
          PY

          cat > shared_engines/ai/registry.py <<'PY'
          """Explicit provider and model registries."""

          from __future__ import annotations

          from threading import RLock
          from typing import Dict

          from .contracts import ModelDescriptor
          from .errors import AIValidationError
          from .provider_protocol import AIProvider


          class ProviderRegistry:
              """Process-local immutable-by-default provider catalog."""

              def __init__(self) -> None:
                  self._providers: Dict[str, AIProvider] = {}
                  self._models: Dict[str, ModelDescriptor] = {}
                  self._lock = RLock()

              def register_provider(self, provider: AIProvider) -> None:
                  with self._lock:
                      if provider.name in self._providers:
                          raise AIValidationError(
                              f"provider already registered: {provider.name}"
                          )
                      self._providers[provider.name] = provider

              def register_model(self, descriptor: ModelDescriptor) -> None:
                  descriptor.validate()
                  key = self._key(
                      descriptor.provider,
                      descriptor.model,
                  )
                  with self._lock:
                      if key in self._models:
                          raise AIValidationError(
                              f"model already registered: {key}"
                          )
                      self._models[key] = descriptor

              def provider(self, name: str) -> AIProvider:
                  with self._lock:
                      try:
                          return self._providers[name]
                      except KeyError as exc:
                          raise AIValidationError(
                              f"unknown provider: {name}"
                          ) from exc

              def model(
                  self,
                  provider: str,
                  model: str,
              ) -> ModelDescriptor:
                  key = self._key(provider, model)
                  with self._lock:
                      try:
                          return self._models[key]
                      except KeyError as exc:
                          raise AIValidationError(
                              f"unknown model: {key}"
                          ) from exc

              @staticmethod
              def _key(provider: str, model: str) -> str:
                  return f"{provider}:{model}"
          PY

          cat > shared_engines/ai/circuit.py <<'PY'
          """Thread-safe provider circuit breaker."""

          from __future__ import annotations

          import time
          from dataclasses import dataclass
          from threading import Lock

          from .errors import AICircuitOpen


          @dataclass
          class CircuitBreaker:
              failure_threshold: int = 5
              recovery_seconds: float = 30.0

              def __post_init__(self) -> None:
                  self._lock = Lock()
                  self._failures = 0
                  self._opened_at = 0.0
                  self._half_open = False

              def allow(self) -> None:
                  with self._lock:
                      if self._failures < self.failure_threshold:
                          return
                      now = time.monotonic()
                      if now - self._opened_at < self.recovery_seconds:
                          raise AICircuitOpen("provider circuit is open")
                      if self._half_open:
                          raise AICircuitOpen(
                              "provider half-open probe already running"
                          )
                      self._half_open = True

              def success(self) -> None:
                  with self._lock:
                      self._failures = 0
                      self._opened_at = 0.0
                      self._half_open = False

              def failure(self) -> None:
                  with self._lock:
                      self._failures += 1
                      self._opened_at = time.monotonic()
                      self._half_open = False
          PY

          cat > shared_engines/ai/retry.py <<'PY'
          """Bounded retry policy with deadline awareness."""

          from __future__ import annotations

          import random
          import time
          from dataclasses import dataclass

          from .errors import AIProviderTransientError


          @dataclass(frozen=True)
          class RetryPolicy:
              base_seconds: float = 0.25
              max_seconds: float = 8.0

              def delay(self, attempt: int) -> float:
                  exponential = min(
                      self.max_seconds,
                      self.base_seconds * (2 ** max(0, attempt - 1)),
                  )
                  return random.uniform(0.0, exponential)

              def sleep_if_possible(
                  self,
                  attempt: int,
                  deadline: float,
              ) -> None:
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise AIProviderTransientError(
                          "execution deadline exhausted"
                      )
                  delay = min(self.delay(attempt), remaining)
                  time.sleep(delay)
          PY

          cat > shared_engines/ai/limiter.py <<'PY'
          """Bounded concurrency and queue admission."""

          from __future__ import annotations

          from threading import Condition

          from .errors import AIBackpressure


          class ExecutionLimiter:
              """Hard bounded admission controller."""

              def __init__(self, max_active: int, max_queue: int) -> None:
                  if max_active < 1 or max_queue < 0:
                      raise ValueError("invalid limiter configuration")
                  self._condition = Condition()
                  self._active = 0
                  self._waiting = 0
                  self._max_active = max_active
                  self._max_queue = max_queue

              def acquire(self, timeout: float) -> None:
                  with self._condition:
                      if (
                          self._active >= self._max_active
                          and self._waiting >= self._max_queue
                      ):
                          raise AIBackpressure("AI execution queue is full")

                      self._waiting += 1
                      try:
                          remaining = timeout
                          while self._active >= self._max_active:
                              if remaining <= 0:
                                  raise AIBackpressure(
                                      "AI execution admission timed out"
                                  )
                              started = __import__("time").monotonic()
                              self._condition.wait(remaining)
                              remaining -= (
                                  __import__("time").monotonic() - started
                              )
                          self._active += 1
                      finally:
                          self._waiting -= 1

              def release(self) -> None:
                  with self._condition:
                      if self._active <= 0:
                          raise RuntimeError("limiter release imbalance")
                      self._active -= 1
                      self._condition.notify()
          PY

          cat > shared_engines/ai/observability.py <<'PY'
          """Optional observability hooks without hidden global state."""

          from __future__ import annotations

          from typing import Mapping, Protocol


          class AIObserver(Protocol):
              """Receives sanitized engine lifecycle events."""

              def emit(
                  self,
                  event: str,
                  fields: Mapping[str, object],
              ) -> None:
                  ...


          class NullObserver:
              """No-op observer suitable as an explicit default."""

              def emit(
                  self,
                  event: str,
                  fields: Mapping[str, object],
              ) -> None:
                  del event, fields
          PY

          cat > shared_engines/ai/storage.py <<'PY'
          """Durable SQLite journal with leases, outbox, inbox and audit."""

          from __future__ import annotations

          import hashlib
          import sqlite3
          import time
          import uuid
          from contextlib import contextmanager
          from dataclasses import dataclass
          from typing import Iterator, Optional

          from .errors import (
              AIIdempotencyConflict,
              AIIntegrityError,
              AILeaseLost,
              AIRecoveryRequired,
              AIRequestInFlight,
          )
          from .serialization import canonical_bytes, sha256_hex


          SCHEMA_VERSION = 1


          @dataclass(frozen=True)
          class Lease:
              token: str
              expires_at: float


          class SQLiteAIStore:
              """Durable single-node journal.

              Distributed HA must use a database adapter with equivalent
              transactional and fencing guarantees rather than pretending
              SQLite is a cluster database.
              """

              def __init__(self, path: str) -> None:
                  self.path = path
                  self._migrate()

              @contextmanager
              def connection(self) -> Iterator[sqlite3.Connection]:
                  connection = sqlite3.connect(
                      self.path,
                      timeout=30.0,
                      isolation_level=None,
                  )
                  connection.row_factory = sqlite3.Row
                  try:
                      connection.execute("PRAGMA foreign_keys=ON")
                      connection.execute("PRAGMA journal_mode=WAL")
                      connection.execute("PRAGMA synchronous=FULL")
                      connection.execute("PRAGMA busy_timeout=30000")
                      yield connection
                  finally:
                      connection.close()

              def _migrate(self) -> None:
                  with self.connection() as db:
                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS schema_meta (
                              version INTEGER PRIMARY KEY,
                              checksum TEXT NOT NULL,
                              applied_at REAL NOT NULL
                          )
                          """
                      )
                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS ai_requests (
                              request_id TEXT PRIMARY KEY,
                              idempotency_key TEXT NOT NULL UNIQUE,
                              request_hash TEXT NOT NULL,
                              status TEXT NOT NULL,
                              encrypted_request TEXT NOT NULL,
                              encrypted_response TEXT,
                              provider TEXT NOT NULL,
                              model TEXT NOT NULL,
                              lease_owner TEXT,
                              lease_token TEXT,
                              lease_expires REAL,
                              attempts INTEGER NOT NULL DEFAULT 0,
                              created_at REAL NOT NULL,
                              updated_at REAL NOT NULL,
                              error TEXT
                          )
                          """
                      )
                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS outbox (
                              event_id TEXT PRIMARY KEY,
                              event_type TEXT NOT NULL,
                              aggregate_id TEXT NOT NULL,
                              payload TEXT NOT NULL,
                              fingerprint TEXT NOT NULL UNIQUE,
                              created_at REAL NOT NULL,
                              published_at REAL
                          )
                          """
                      )
                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS inbox (
                              event_id TEXT PRIMARY KEY,
                              fingerprint TEXT NOT NULL UNIQUE,
                              received_at REAL NOT NULL
                          )
                          """
                      )
                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS audit (
                              sequence INTEGER PRIMARY KEY AUTOINCREMENT,
                              event_id TEXT NOT NULL,
                              event_type TEXT NOT NULL,
                              aggregate_id TEXT NOT NULL,
                              payload TEXT NOT NULL,
                              previous_hash TEXT NOT NULL,
                              event_hash TEXT NOT NULL UNIQUE,
                              created_at REAL NOT NULL
                          )
                          """
                      )
                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS audit_checkpoints (
                              checkpoint_id TEXT PRIMARY KEY,
                              sequence INTEGER NOT NULL,
                              event_hash TEXT NOT NULL,
                              created_at REAL NOT NULL
                          )
                          """
                      )
                      checksum = hashlib.sha256(
                          canonical_bytes(
                              {
                                  "version": SCHEMA_VERSION,
                                  "tables": [
                                      "ai_requests",
                                      "outbox",
                                      "inbox",
                                      "audit",
                                      "audit_checkpoints",
                                  ],
                              }
                          )
                      ).hexdigest()
                      existing = db.execute(
                          "SELECT checksum FROM schema_meta WHERE version = ?",
                          (SCHEMA_VERSION,),
                      ).fetchone()
                      if existing is None:
                          db.execute(
                              """
                              INSERT INTO schema_meta(version, checksum, applied_at)
                              VALUES (?, ?, ?)
                              """,
                              (SCHEMA_VERSION, checksum, time.time()),
                          )
                      elif existing["checksum"] != checksum:
                          raise AIIntegrityError(
                              "schema checksum mismatch"
                          )

              def reserve(
                  self,
                  request_id: str,
                  idempotency_key: str,
                  request_hash: str,
                  encrypted_request: str,
                  provider: str,
                  model: str,
                  owner: str,
                  lease_seconds: int,
              ) -> Lease:
                  now = time.time()
                  expires = now + lease_seconds
                  token = uuid.uuid4().hex

                  with self.connection() as db:
                      db.execute("BEGIN IMMEDIATE")
                      row = db.execute(
                          """
                          SELECT * FROM ai_requests
                          WHERE idempotency_key = ?
                          """,
                          (idempotency_key,),
                      ).fetchone()

                      if row is not None:
                          if row["request_hash"] != request_hash:
                              db.execute("ROLLBACK")
                              raise AIIdempotencyConflict(
                                  "idempotency key conflicts with prior request"
                              )
                          if row["status"] == "completed":
                              db.execute("COMMIT")
                              return Lease("", 0.0)
                          if row["status"] == "recovery_required":
                              db.execute("ROLLBACK")
                              raise AIRecoveryRequired(
                                  "request requires reconciliation"
                              )
                          if (
                              row["status"] == "running"
                              and row["lease_expires"]
                              and row["lease_expires"] > now
                          ):
                              db.execute("ROLLBACK")
                              raise AIRequestInFlight(
                                  "request is currently leased"
                              )

                          db.execute(
                              """
                              UPDATE ai_requests
                              SET status='running',
                                  lease_owner=?,
                                  lease_token=?,
                                  lease_expires=?,
                                  attempts=attempts+1,
                                  updated_at=?,
                                  error=NULL
                              WHERE idempotency_key=?
                              """,
                              (
                                  owner,
                                  token,
                                  expires,
                                  now,
                                  idempotency_key,
                              ),
                          )
                      else:
                          db.execute(
                              """
                              INSERT INTO ai_requests(
                                  request_id,
                                  idempotency_key,
                                  request_hash,
                                  status,
                                  encrypted_request,
                                  provider,
                                  model,
                                  lease_owner,
                                  lease_token,
                                  lease_expires,
                                  attempts,
                                  created_at,
                                  updated_at
                              )
                              VALUES (?, ?, ?, 'running', ?, ?, ?, ?, ?, ?, 1,
                                      ?, ?)
                              """,
                              (
                                  request_id,
                                  idempotency_key,
                                  request_hash,
                                  encrypted_request,
                                  provider,
                                  model,
                                  owner,
                                  token,
                                  expires,
                                  now,
                                  now,
                              ),
                          )

                      db.execute("COMMIT")
                  return Lease(token, expires)

              def complete(
                  self,
                  request_id: str,
                  owner: str,
                  token: str,
                  encrypted_response: str,
                  event_payload: str,
                  event_fingerprint: str,
              ) -> None:
                  with self.connection() as db:
                      db.execute("BEGIN IMMEDIATE")
                      row = db.execute(
                          """
                          SELECT status, lease_owner, lease_token
                          FROM ai_requests
                          WHERE request_id=?
                          """,
                          (request_id,),
                      ).fetchone()
                      if row is None:
                          db.execute("ROLLBACK")
                          raise AILeaseLost("request does not exist")
                      if (
                          row["status"] != "running"
                          or row["lease_owner"] != owner
                          or row["lease_token"] != token
                      ):
                          db.execute("ROLLBACK")
                          raise AILeaseLost("fencing lease is no longer owned")

                      now = time.time()
                      db.execute(
                          """
                          UPDATE ai_requests
                          SET status='completed',
                              encrypted_response=?,
                              lease_owner=NULL,
                              lease_token=NULL,
                              lease_expires=NULL,
                              updated_at=?
                          WHERE request_id=?
                          """,
                          (encrypted_response, now, request_id),
                      )
                      self._insert_outbox(
                          db,
                          request_id,
                          event_payload,
                          event_fingerprint,
                          now,
                      )
                      self._append_audit(
                          db,
                          request_id,
                          "AI_REQUEST_COMPLETED",
                          event_payload,
                          now,
                      )
                      db.execute("COMMIT")

              def fail(
                  self,
                  request_id: str,
                  owner: str,
                  token: str,
                  error: str,
              ) -> None:
                  with self.connection() as db:
                      db.execute("BEGIN IMMEDIATE")
                      row = db.execute(
                          """
                          SELECT status, lease_owner, lease_token
                          FROM ai_requests
                          WHERE request_id=?
                          """,
                          (request_id,),
                      ).fetchone()
                      if row is None:
                          db.execute("ROLLBACK")
                          raise AILeaseLost("request does not exist")
                      if (
                          row["status"] != "running"
                          or row["lease_owner"] != owner
                          or row["lease_token"] != token
                      ):
                          db.execute("ROLLBACK")
                          raise AILeaseLost("fencing lease is no longer owned")

                      db.execute(
                          """
                          UPDATE ai_requests
                          SET status='failed',
                              error=?,
                              lease_owner=NULL,
                              lease_token=NULL,
                              lease_expires=NULL,
                              updated_at=?
                          WHERE request_id=?
                          """,
                          (error[:4000], time.time(), request_id),
                      )
                      db.execute("COMMIT")

              def recover_expired(self) -> int:
                  now = time.time()
                  with self.connection() as db:
                      cursor = db.execute(
                          """
                          UPDATE ai_requests
                          SET status='recovery_required',
                              lease_owner=NULL,
                              lease_token=NULL,
                              lease_expires=NULL,
                              updated_at=?,
                              error='execution lease expired; outcome uncertain'
                          WHERE status='running'
                            AND lease_expires IS NOT NULL
                            AND lease_expires <= ?
                          """,
                          (now, now),
                      )
                      return cursor.rowcount

              def get_completed(
                  self,
                  idempotency_key: str,
              ) -> Optional[str]:
                  with self.connection() as db:
                      row = db.execute(
                          """
                          SELECT encrypted_response
                          FROM ai_requests
                          WHERE idempotency_key=?
                            AND status='completed'
                          """,
                          (idempotency_key,),
                      ).fetchone()
                      if row is None:
                          return None
                      return str(row["encrypted_response"])

              def inbox_accept(
                  self,
                  event_id: str,
                  fingerprint: str,
              ) -> bool:
                  with self.connection() as db:
                      try:
                          db.execute(
                              """
                              INSERT INTO inbox(
                                  event_id,
                                  fingerprint,
                                  received_at
                              )
                              VALUES (?, ?, ?)
                              """,
                              (event_id, fingerprint, time.time()),
                          )
                          return True
                      except sqlite3.IntegrityError:
                          return False

              def checkpoint_audit(self) -> Optional[str]:
                  with self.connection() as db:
                      row = db.execute(
                          """
                          SELECT sequence, event_hash
                          FROM audit
                          ORDER BY sequence DESC
                          LIMIT 1
                          """
                      ).fetchone()
                      if row is None:
                          return None
                      checkpoint_id = uuid.uuid4().hex
                      db.execute(
                          """
                          INSERT INTO audit_checkpoints(
                              checkpoint_id,
                              sequence,
                              event_hash,
                              created_at
                          )
                          VALUES (?, ?, ?, ?)
                          """,
                          (
                              checkpoint_id,
                              row["sequence"],
                              row["event_hash"],
                              time.time(),
                          ),
                      )
                      return checkpoint_id

              def verify_audit(self) -> None:
                  with self.connection() as db:
                      rows = db.execute(
                          """
                          SELECT sequence, event_id, event_type,
                                 aggregate_id, payload,
                                 previous_hash, event_hash
                          FROM audit
                          ORDER BY sequence
                          """
                      ).fetchall()

                      previous = "GENESIS"
                      last_hash = None
                      last_sequence = 0

                      for row in rows:
                          expected = sha256_hex(
                              {
                                  "sequence": row["sequence"],
                                  "event_id": row["event_id"],
                                  "event_type": row["event_type"],
                                  "aggregate_id": row["aggregate_id"],
                                  "payload": row["payload"],
                                  "previous_hash": row["previous_hash"],
                              }
                          )
                          if row["previous_hash"] != previous:
                              raise AIIntegrityError(
                                  "audit previous hash mismatch"
                              )
                          if row["event_hash"] != expected:
                              raise AIIntegrityError(
                                  "audit event hash mismatch"
                              )
                          previous = row["event_hash"]
                          last_hash = row["event_hash"]
                          last_sequence = row["sequence"]

                      checkpoints = db.execute(
                          """
                          SELECT sequence, event_hash
                          FROM audit_checkpoints
                          ORDER BY sequence
                          """
                      ).fetchall()

                      for checkpoint in checkpoints:
                          if checkpoint["sequence"] > last_sequence:
                              raise AIIntegrityError(
                                  "audit checkpoint points past audit tail"
                              )
                          if checkpoint["sequence"] == last_sequence:
                              if checkpoint["event_hash"] != last_hash:
                                  raise AIIntegrityError(
                                      "audit checkpoint mismatch"
                                  )

              def backup_to(self, destination: str) -> None:
                  with self.connection() as source:
                      backup = sqlite3.connect(destination)
                      try:
                          source.backup(backup)
                          result = backup.execute(
                              "PRAGMA integrity_check"
                          ).fetchone()
                          if result is None or result[0] != "ok":
                              raise AIIntegrityError(
                                  "backup integrity check failed"
                              )
                      finally:
                          backup.close()

              def _insert_outbox(
                  self,
                  db: sqlite3.Connection,
                  aggregate_id: str,
                  payload: str,
                  fingerprint: str,
                  created_at: float,
              ) -> None:
                  db.execute(
                      """
                      INSERT INTO outbox(
                          event_id,
                          event_type,
                          aggregate_id,
                          payload,
                          fingerprint,
                          created_at
                      )
                      VALUES (?, ?, ?, ?, ?, ?)
                      """,
                      (
                          uuid.uuid4().hex,
                          "AI_REQUEST_COMPLETED",
                          aggregate_id,
                          payload,
                          fingerprint,
                          created_at,
                      ),
                  )

              def _append_audit(
                  self,
                  db: sqlite3.Connection,
                  aggregate_id: str,
                  event_type: str,
                  payload: str,
                  created_at: float,
              ) -> None:
                  row = db.execute(
                      """
                      SELECT event_hash
                      FROM audit
                      ORDER BY sequence DESC
                      LIMIT 1
                      """
                  ).fetchone()
                  previous = "GENESIS" if row is None else row["event_hash"]
                  event_id = uuid.uuid4().hex
                  sequence_row = db.execute(
                      """
                      SELECT COALESCE(MAX(sequence), 0) + 1
                      FROM audit
                      """
                  ).fetchone()
                  sequence = int(sequence_row[0])
                  event_hash = sha256_hex(
                      {
                          "sequence": sequence,
                          "event_id": event_id,
                          "event_type": event_type,
                          "aggregate_id": aggregate_id,
                          "payload": payload,
                          "previous_hash": previous,
                      }
                  )
                  db.execute(
                      """
                      INSERT INTO audit(
                          event_id,
                          event_type,
                          aggregate_id,
                          payload,
                          previous_hash,
                          event_hash,
                          created_at
                      )
                      VALUES (?, ?, ?, ?, ?, ?, ?)
                      """,
                      (
                          event_id,
                          event_type,
                          aggregate_id,
                          payload,
                          previous,
                          event_hash,
                          created_at,
                      ),
                  )
