              "                  with store.connection() as db:\n"
              "                      store._append_audit(\n"
              "                          db,\n"
              "                          \"aggregate\",\n"
              "                          \"TEST\",\n"
              "                          \"{}\",\n"
              "                          1.0,\n"
              "                      )\n",
          )
          start = text.find("\n\n          def sqlite3_connection(")
          if start >= 0:
              end = text.find("\n\n          def test_limiter_backpressure", start)
              text = text[:start] + text[end:]
