      - name: Storage adapter
        shell: bash
        run: |
          set -euo pipefail

          cat > infrastructure/storage_adapter/storage.py <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import tempfile
          from pathlib import Path
          from threading import RLock


          class StorageError(RuntimeError):
              """Raised for infrastructure storage failures."""


          class StorageAdapter:
              """
              Durable filesystem storage boundary.

              Writes use a temporary file, fsync and atomic replace.
              """

              def __init__(
                  self,
                  root: str | Path,
              ) -> None:

                  self.root = Path(
                      root
                  ).expanduser().resolve()

                  self.root.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  self._lock = RLock()
                  self._closed = False

              def _require_open(self) -> None:
                  if self._closed:
                      raise StorageError(
                          "Storage adapter is closed"
                      )

              def _safe_path(
                  self,
                  relative_path: str | Path,
              ) -> Path:

                  path = (
                      self.root
                      / Path(relative_path)
                  ).resolve()

                  try:
                      path.relative_to(
                          self.root
                      )
                  except ValueError as exc:
                      raise StorageError(
                          "Storage path escapes storage root"
                      ) from exc

                  return path

              def write_bytes(
                  self,
                  relative_path: str | Path,
                  data: bytes,
              ) -> str:

                  if not isinstance(data, bytes):
                      raise TypeError(
                          "Storage data must be bytes"
                      )

                  with self._lock:
                      self._require_open()

                      destination = self._safe_path(
                          relative_path
                      )

                      destination.parent.mkdir(
                          parents=True,
                          exist_ok=True,
                      )

                      temporary_path: str | None = None

                      try:
                          with tempfile.NamedTemporaryFile(
                              mode="wb",
                              dir=destination.parent,
                              prefix=".zyra-",
                              suffix=".tmp",
                              delete=False,
                          ) as temporary:

                              temporary.write(data)
                              temporary.flush()

                              os.fsync(
                                  temporary.fileno()
                              )

                              temporary_path = (
                                  temporary.name
                              )

                          os.replace(
                              temporary_path,
                              destination,
                          )

                          return hashlib.sha256(
                              data
                          ).hexdigest()

                      except OSError as exc:
                          if temporary_path:
                              try:
                                  os.unlink(
                                      temporary_path
                                  )
                              except OSError:
                                  pass

                          raise StorageError(
                              "Atomic storage write failed"
                          ) from exc

              def read_bytes(
                  self,
                  relative_path: str | Path,
              ) -> bytes:

                  with self._lock:
                      self._require_open()

                      path = self._safe_path(
                          relative_path
                      )

                      try:
                          return path.read_bytes()
                      except FileNotFoundError as exc:
                          raise StorageError(
                              "Storage object not found"
                          ) from exc
                      except OSError as exc:
                          raise StorageError(
                              "Storage read failed"
                          ) from exc

              def exists(
                  self,
                  relative_path: str | Path,
              ) -> bool:

                  with self._lock:
                      self._require_open()

                      return self._safe_path(
                          relative_path
                      ).is_file()

              def delete(
                  self,
                  relative_path: str | Path,
              ) -> bool:

                  with self._lock:
                      self._require_open()

                      path = self._safe_path(
                          relative_path
                      )

                      try:
                          path.unlink()
                          return True
                      except FileNotFoundError:
                          return False
                      except OSError as exc:
                          raise StorageError(
                              "Storage delete failed"
                          ) from exc

              def checksum(
                  self,
                  relative_path: str | Path,
              ) -> str:

                  return hashlib.sha256(
                      self.read_bytes(
                          relative_path
                      )
                  ).hexdigest()

              def list(
                  self,
                  prefix: str | Path = "",
              ) -> tuple[str, ...]:

                  with self._lock:
                      self._require_open()

                      base = self._safe_path(
                          prefix
                      )

                      if not base.exists():
                          return ()

                      if not base.is_dir():
                          raise StorageError(
                              "Storage prefix is not a directory"
                          )

                      files = [
                          path
                          for path in base.rglob("*")
                          if path.is_file()
                      ]

                      return tuple(
                          sorted(
                              str(
                                  path.relative_to(
                                      self.root
                                  )
                              )
                              for path in files
                          )
                      )

              def close(self) -> None:
                  with self._lock:
                      self._closed = True

              @property
              def closed(self) -> bool:
                  with self._lock:
                      return self._closed


          __all__ = [
              "StorageAdapter",
              "StorageError",
          ]
          PY

          cat > infrastructure/storage_adapter/__init__.py <<'PY'
          from .storage import (
              StorageAdapter,
              StorageError,
          )

          __all__ = [
              "StorageAdapter",
              "StorageError",
          ]
          PY

      - name: Runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > infrastructure/runtime/runtime.py <<'PY'
          from __future__ import annotations

          import signal
          from dataclasses import dataclass
          from enum import Enum
          from threading import Event, RLock
          from time import monotonic


          class RuntimeState(str, Enum):
              CREATED = "created"
              STARTING = "starting"
              RUNNING = "running"
              STOPPING = "stopping"
              STOPPED = "stopped"
              FAILED = "failed"


          class RuntimeErrorState(RuntimeError):
              """Raised for invalid runtime lifecycle transitions."""


          @dataclass(frozen=True, slots=True)
          class RuntimeSnapshot:
              state: RuntimeState
              started_at: float | None
              stopped_at: float | None
              stop_requested: bool


          class Runtime:
              """
              Process lifecycle coordinator.
              """

              def __init__(
                  self,
                  *,
                  shutdown_timeout_seconds: int = 30,
              ) -> None:

                  if shutdown_timeout_seconds < 0:
                      raise ValueError(
                          "shutdown_timeout_seconds cannot be negative"
                      )

                  self.shutdown_timeout_seconds = (
                      shutdown_timeout_seconds
                  )

                  self._state = (
                      RuntimeState.CREATED
                  )

                  self._started_at: float | None = None
                  self._stopped_at: float | None = None

                  self._stop_event = Event()
                  self._lock = RLock()

                  self._startup_hooks: list = []
                  self._shutdown_hooks: list = []

                  self._signals_installed = False

              def on_start(
                  self,
                  callback,
              ) -> None:

                  if not callable(callback):
                      raise TypeError(
                          "Startup callback must be callable"
                      )

                  with self._lock:
                      self._startup_hooks.append(
                          callback
                      )

              def on_shutdown(
                  self,
                  callback,
              ) -> None:

                  if not callable(callback):
                      raise TypeError(
                          "Shutdown callback must be callable"
                      )

                  with self._lock:
                      self._shutdown_hooks.append(
                          callback
                      )

              def install_signal_handlers(
                  self,
              ) -> None:

                  with self._lock:
                      if self._signals_installed:
                          return

                      signal.signal(
                          signal.SIGTERM,
                          self._signal_handler,
                      )

                      signal.signal(
                          signal.SIGINT,
                          self._signal_handler,
                      )

                      self._signals_installed = True

              def _signal_handler(
                  self,
                  signum,
                  _frame,
              ) -> None:

                  self.request_shutdown()

              def start(self) -> None:

                  with self._lock:
                      if self._state is RuntimeState.RUNNING:
                          return

                      if self._state not in {
                          RuntimeState.CREATED,
                          RuntimeState.STOPPED,
                      }:
                          raise RuntimeErrorState(
                              f"Cannot start runtime from "
                              f"{self._state.value}"
                          )

                      self._state = (
                          RuntimeState.STARTING
                      )

                  try:
                      for callback in tuple(
                          self._startup_hooks
                      ):
                          callback()

                      with self._lock:
                          self._started_at = monotonic()
                          self._stopped_at = None
                          self._stop_event.clear()

                          self._state = (
                              RuntimeState.RUNNING
                          )

                  except BaseException:
                      with self._lock:
                          self._state = (
                              RuntimeState.FAILED
                          )

                      raise

              def request_shutdown(self) -> None:
                  self._stop_event.set()

              def wait_for_shutdown(
                  self,
                  timeout: float | None = None,
              ) -> bool:

                  return self._stop_event.wait(
                      timeout
                  )

              def stop(self) -> None:

                  with self._lock:
                      if self._state is RuntimeState.STOPPED:
                          return

                      if self._state is RuntimeState.CREATED:
                          self._state = (
                              RuntimeState.STOPPED
                          )
                          self._stopped_at = monotonic()
                          return

                      if self._state is RuntimeState.FAILED:
                          self._state = (
                              RuntimeState.STOPPING
                          )
                      elif self._state is RuntimeState.RUNNING:
                          self._state = (
                              RuntimeState.STOPPING
                          )
                      elif self._state is RuntimeState.STOPPING:
                          return
                      else:
                          raise RuntimeErrorState(
                              f"Cannot stop runtime from "
                              f"{self._state.value}"
                          )

                  errors: list[BaseException] = []

                  for callback in reversed(
                      tuple(self._shutdown_hooks)
                  ):
                      try:
                          callback()
                      except BaseException as exc:
                          errors.append(exc)

                  with self._lock:
                      self._stopped_at = monotonic()
                      self._state = (
                          RuntimeState.STOPPED
                      )

                  if errors:
                      raise RuntimeErrorState(
                          f"{len(errors)} shutdown hook(s) failed"
                      )

              def snapshot(
                  self,
              ) -> RuntimeSnapshot:

                  with self._lock:
                      return RuntimeSnapshot(
                          state=self._state,
                          started_at=self._started_at,
                          stopped_at=self._stopped_at,
                          stop_requested=(
                              self._stop_event.is_set()
                          ),
                      )

              @property
              def state(self) -> RuntimeState:
                  with self._lock:
                      return self._state

              @property
              def running(self) -> bool:
                  return (
                      self.state
                      is RuntimeState.RUNNING
                  )


          __all__ = [
              "Runtime",
              "RuntimeErrorState",
              "RuntimeSnapshot",
              "RuntimeState",
          ]
          PY

          cat > infrastructure/runtime/__init__.py <<'PY'
          from .runtime import (
              Runtime,
              RuntimeErrorState,
              RuntimeSnapshot,
              RuntimeState,
          )

          __all__ = [
              "Runtime",
              "RuntimeErrorState",
              "RuntimeSnapshot",
              "RuntimeState",
          ]
          PY

      - name: Bootstrap
        shell: bash
        run: |
          set -euo pipefail

          cat > infrastructure/bootstrap/bootstrap.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock

          from infrastructure.cache import Cache
          from infrastructure.config import Configuration
          from infrastructure.container import Container
          from infrastructure.database import Database
          from infrastructure.runtime import Runtime
          from infrastructure.storage_adapter import StorageAdapter


          @dataclass(frozen=True, slots=True)
          class InfrastructureContext:
              configuration: Configuration
              container: Container
              runtime: Runtime
              database: Database
              cache: Cache
              storage: StorageAdapter


          class InfrastructureBootstrap:
              """
              Infrastructure composition root.
              """

              def __init__(
                  self,
                  configuration: Configuration,
              ) -> None:

                  self.configuration = configuration
                  self._context: (
                      InfrastructureContext | None
                  ) = None

                  self._lock = RLock()

              def initialize(
                  self,
              ) -> InfrastructureContext:

                  with self._lock:
                      if self._context is not None:
                          return self._context

                      storage = StorageAdapter(
                          self.configuration.data_directory
                      )

                      try:
                          database = Database(
                              self.configuration.database_path,
                              timeout_seconds=(
                                  self.configuration
                                  .database_timeout_seconds
                              ),
                              wal=(
                                  self.configuration
                                  .database_wal
                              ),
                          )

                          cache = Cache(
                              capacity=(
                                  self.configuration
                                  .cache_capacity
                              ),
                              default_ttl_seconds=(
                                  self.configuration
                                  .cache_default_ttl_seconds
                              ),
                          )

                          runtime = Runtime(
                              shutdown_timeout_seconds=(
                                  self.configuration
                                  .shutdown_timeout_seconds
                              )
                          )

                          container = Container()

                          container.register_instance(
                              Configuration,
                              self.configuration,
                          )

                          container.register_instance(
                              Database,
                              database,
                          )

                          container.register_instance(
                              Cache,
                              cache,
                          )

                          container.register_instance(
                              StorageAdapter,
                              storage,
                          )

                          container.register_instance(
                              Runtime,
                              runtime,
                          )

                          context = InfrastructureContext(
                              configuration=self.configuration,
                              container=container,
                              runtime=runtime,
                              database=database,
                              cache=cache,
                              storage=storage,
                          )

                          runtime.on_shutdown(
                              cache.close
                          )

                          runtime.on_shutdown(
                              storage.close
                          )

                          runtime.on_shutdown(
                              database.close
                          )

                          self._context = context

                          return context

                      except BaseException:
                          try:
                              storage.close()
                          finally:
                              raise

              def shutdown(self) -> None:

                  with self._lock:
                      context = self._context

                      if context is None:
                          return

                      try:
                          context.runtime.stop()
                      finally:
                          try:
                              context.container.close()
                          finally:
                              self._context = None

              @property
              def context(
                  self,
              ) -> InfrastructureContext:

                  with self._lock:
                      if self._context is None:
                          raise RuntimeError(
                              "Infrastructure has not been initialized"
                          )

                      return self._context


          def create_infrastructure(
              configuration: Configuration,
          ) -> InfrastructureContext:

              return InfrastructureBootstrap(
                  configuration
              ).initialize()


          __all__ = [
              "InfrastructureBootstrap",
              "InfrastructureContext",
              "create_infrastructure",
          ]
          PY

          cat > infrastructure/bootstrap/__init__.py <<'PY'
          from .bootstrap import (
              InfrastructureBootstrap,
              InfrastructureContext,
              create_infrastructure,
          )

          __all__ = [
              "InfrastructureBootstrap",
              "InfrastructureContext",
              "create_infrastructure",
          ]
          PY

