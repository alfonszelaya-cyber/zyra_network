          from __future__ import annotations

          import threading
          from pathlib import Path
          from typing import Any, Mapping

          from observability.alerts import AlertManager
          from observability.context import ObservationContext
          from observability.dashboards import DashboardRegistry
          from observability.engine import ObservationEngine
          from observability.events import (
              EventSeverity,
              EventType,
              ObservationEvent,
          )
          from observability.health import (
              HealthRegistry,
              HealthResult,
              HealthState,
          )
          from observability.incidents import IncidentManager
          from observability.metrics import MetricsRegistry
          from observability.policy import ObservationPolicy
          from observability.query import ObservationQuery
          from observability.registry import ComponentRegistry
          from observability.router import ObservationRouter
          from observability.snapshot import ObservationSnapshot
          from observability.status import StatusReport, SystemStatus
          from observability.storage import ObservationStore


          class ObservabilityManager:
              VERSION = "1.0.0"

              def __init__(
                  self,
                  *,
                  storage_path: str | Path = "storage/observability.db",
                  policy: ObservationPolicy | None = None,
              ):
                  self.policy = policy or ObservationPolicy()

                  self.store = ObservationStore(
                      storage_path,
                      max_records=self.policy.retention.max_events,
                  )
                  self.metrics = MetricsRegistry()
                  self.alerts = AlertManager()
                  self.incidents = IncidentManager()
                  self.health = HealthRegistry()
                  self.components = ComponentRegistry()
                  self.dashboards = DashboardRegistry()
                  self.router = ObservationRouter()

                  self.engine = ObservationEngine(
                      self.store,
                      self.metrics,
                      self.alerts,
                      self.policy,
                  )
                  self.query = ObservationQuery(self.store)

                  self._status = SystemStatus.STARTING
                  self._lock = threading.RLock()

                  self.health.register(
                      "observability.storage",
                      self._storage_health,
                  )

              def _storage_health(self) -> HealthResult:
                  valid = self.store.verify_chain()

                  return HealthResult(
                      component="observability.storage",
                      state=(
                          HealthState.HEALTHY
                          if valid
                          else HealthState.UNHEALTHY
                      ),
                      message=(
                          "Observation store operational"
                          if valid
                          else "Observation hash chain invalid"
                      ),
                      details={
                          "records": self.store.count(),
                          "chain_valid": valid,
                      },
                  )

              def start(self) -> None:
                  with self._lock:
                      if self._status in {
                          SystemStatus.READY,
                          SystemStatus.DEGRADED,
                      }:
                          return

                      self._status = SystemStatus.READY

                  self.emit(
                      "observability.started",
                      event_type=EventType.LIFECYCLE,
                      severity=EventSeverity.INFO,
                      payload={
                          "version": self.VERSION,
                      },
                  )

              def stop(self) -> None:
                  with self._lock:
                      if self._status == SystemStatus.STOPPED:
                          return
                      self._status = SystemStatus.STOPPING

                  try:
                      self.emit(
                          "observability.stopping",
                          event_type=EventType.LIFECYCLE,
                          severity=EventSeverity.INFO,
                          payload={},
                      )
                  finally:
                      self.store.close()
                      with self._lock:
                          self._status = SystemStatus.STOPPED

              def emit(
                  self,
                  name: str,
                  *,
                  event_type: EventType = EventType.SYSTEM,
                  severity: EventSeverity = EventSeverity.INFO,
                  payload: Mapping[str, Any] | None = None,
                  context: ObservationContext | None = None,
              ) -> ObservationEvent:
                  event = ObservationEvent(
                      name=name,
                      event_type=event_type,
                      severity=severity,
                      payload=payload or {},
                      context=context or ObservationContext(),
                  )

                  result = self.engine.process(event)

                  if result.alerts:
                      self.metrics.counter(
                          "observability.alerts.fired",
                          amount=len(result.alerts),
                      )

                  try:
                      self.router.dispatch(event)
                  except Exception:
                      self.metrics.counter(
                          "observability.router.failures"
                      )

                  return event

              def snapshot(self) -> ObservationSnapshot:
                  health = self.health.overall().value

                  metrics = self.metrics.snapshot()

                  alerts = [
                      {
                          "alert_id": alert.alert_id,
                          "rule_name": alert.rule_name,
                          "severity": alert.severity,
                          "state": alert.state.value,
                          "message": alert.message,
                      }
                      for alert in self.alerts.active()
                  ]

                  incidents = [
                      {
                          "incident_id": incident.incident_id,
                          "title": incident.title,
                          "severity": incident.severity,
                          "state": incident.state.value,
                      }
                      for incident in self.incidents.active()
                  ]

                  components = [
                      {
                          "name": component.name,
                          "version": component.version,
                          "owner": component.owner,
                          "metadata": dict(component.metadata),
                      }
                      for component in self.components.list()
                  ]

                  return ObservationSnapshot.create(
                      health=health,
                      metrics=metrics,
                      alerts=alerts,
                      incidents=incidents,
                      components=components,
                  )

              def status(self) -> StatusReport:
                  health = self.health.overall()

                  status = self._status

                  if (
                      status == SystemStatus.READY
                      and health == HealthState.DEGRADED
                  ):
                      status = SystemStatus.DEGRADED

                  if health == HealthState.UNHEALTHY:
                      status = SystemStatus.FAILED

                  return StatusReport(
                      status=status,
                      health=health.value,
                      components=len(self.components.list()),
                      active_alerts=len(self.alerts.active()),
                      active_incidents=len(self.incidents.active()),
                      stored_observations=self.store.count(),
                      chain_valid=self.store.verify_chain(),
                      version=self.VERSION,
                  )

              def retain(self) -> int:
                  return self.store.purge_older_than(
                      self.policy.retention.max_age_seconds
                  )
          PY

