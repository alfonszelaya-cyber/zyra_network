name: Build Production Scripts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zyra-network-production-scripts
  cancel-in-progress: false

jobs:
  build-production-scripts:
    name: Build and Validate Production Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build complete scripts subsystem
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p scripts

          cat > scripts/__init__.py <<'PY'
          """
          Zyra Network operational script foundation.

          Stable standard-library operational primitives for the Network
          operational layer. Commands are designed to be idempotent,
          auditable, failure-aware and safe to execute repeatedly.
          """

          from __future__ import annotations

          import contextlib
          import hashlib
          import json
          import logging
          import os
          import shutil
          import socket
          import subprocess
          import tempfile
          import time
          import uuid
          from dataclasses import asdict, is_dataclass
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, Iterable, Mapping, Sequence


          PACKAGE_ROOT = Path(__file__).resolve().parent
          REPOSITORY_ROOT = PACKAGE_ROOT.parent
          STATE_ROOT = REPOSITORY_ROOT / ".zyra"
          SCRIPT_STATE_ROOT = STATE_ROOT / "scripts"
          LOCK_ROOT = STATE_ROOT / "locks"
          AUDIT_ROOT = STATE_ROOT / "audit"
          RELEASE_ROOT = STATE_ROOT / "releases"

          MANIFEST_FORMAT = "zyra.network.manifest.v1"
          STATE_FORMAT = "zyra.network.state.v1"
          AUDIT_FORMAT = "zyra.network.audit.v1"


          class OperationalError(RuntimeError):
              """Base error for operational failures."""


          class CommandError(OperationalError):
              """Raised when an external command fails."""

              def __init__(
                  self,
                  command: Sequence[str],
                  returncode: int,
                  stdout: str = "",
                  stderr: str = "",
              ) -> None:
                  self.command = tuple(command)
                  self.returncode = returncode
                  self.stdout = stdout
                  self.stderr = stderr
                  super().__init__(
                      f"command failed ({returncode}): {' '.join(command)}"
                  )


          class LockTimeout(OperationalError):
              """Raised when an operational lock cannot be acquired."""


          def utc_now() -> str:
              return datetime.now(timezone.utc).replace(microsecond=0).isoformat()


          def execution_id() -> str:
              return f"{utc_now()}-{uuid.uuid4().hex}"


          def ensure_directory(path: Path, mode: int = 0o750) -> Path:
              path.mkdir(parents=True, exist_ok=True)
              try:
                  os.chmod(path, mode)
              except OSError:
                  pass
              return path


          def fsync_directory(path: Path) -> None:
              if os.name == "nt":
                  return

              try:
                  fd = os.open(str(path), os.O_RDONLY)
                  try:
                      os.fsync(fd)
                  finally:
                      os.close(fd)
              except OSError:
                  pass


          def atomic_write_bytes(
              path: Path,
              data: bytes,
              *,
              mode: int = 0o640,
          ) -> None:
              path = path.resolve()
              ensure_directory(path.parent)

              fd, temporary = tempfile.mkstemp(
                  prefix=f".{path.name}.",
                  dir=str(path.parent),
              )
              temporary_path = Path(temporary)

              try:
                  os.fchmod(fd, mode)

                  with os.fdopen(fd, "wb") as handle:
                      handle.write(data)
                      handle.flush()
                      os.fsync(handle.fileno())

                  os.replace(temporary_path, path)
                  fsync_directory(path.parent)

              except BaseException:
                  with contextlib.suppress(FileNotFoundError):
                      temporary_path.unlink()
                  raise


          def atomic_write_json(
              path: Path,
              value: Any,
              *,
              mode: int = 0o640,
          ) -> None:
              atomic_write_bytes(
                  path,
                  (
                      json.dumps(
                          value,
                          ensure_ascii=False,
                          indent=2,
                          sort_keys=True,
                          separators=(",", ": "),
                      )
                      + "\n"
                  ).encode("utf-8"),
                  mode=mode,
              )


          def read_json(path: Path, default: Any = None) -> Any:
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      return json.load(handle)
              except FileNotFoundError:
                  return default


          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          def sha256_file(
              path: Path,
              chunk_size: int = 1024 * 1024,
          ) -> str:
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  while True:
                      chunk = handle.read(chunk_size)
                      if not chunk:
                          break
                      digest.update(chunk)

              return digest.hexdigest()


          def relative_safe_path(root: Path, candidate: Path) -> Path:
              root = root.resolve()
              candidate = candidate.resolve()

              try:
                  relative = candidate.relative_to(root)
              except ValueError as exc:
                  raise OperationalError(
                      f"path escapes permitted root: {candidate}"
                  ) from exc

              if str(relative) in {"", "."}:
                  raise OperationalError(
                      "root directory itself is not a file target"
                  )

              return relative


          def safe_remove(path: Path, *, root: Path) -> bool:
              relative_safe_path(root, path)

              if path.is_symlink():
                  path.unlink()
                  return True

              if path.is_dir():
                  shutil.rmtree(path)
                  return True

              if path.exists():
                  path.unlink()
                  return True

              return False


          def redacted_environment() -> dict[str, str]:
              sensitive = (
                  "PASSWORD",
                  "SECRET",
                  "TOKEN",
                  "PRIVATE",
                  "API_KEY",
                  "CREDENTIAL",
                  "AUTH",
                  "SIGNING",
              )

              result: dict[str, str] = {}

              for key, value in os.environ.items():
                  upper = key.upper()

                  if any(part in upper for part in sensitive):
                      result[key] = "<redacted>"
                  else:
                      result[key] = value

              return result


          def configure_logging(verbose: bool = False) -> logging.Logger:
              logger = logging.getLogger("zyra.scripts")
              logger.setLevel(logging.DEBUG if verbose else logging.INFO)

              if not logger.handlers:
                  handler = logging.StreamHandler()

                  handler.setFormatter(
                      logging.Formatter(
                          "%(asctime)sZ %(levelname)s %(name)s: %(message)s",
                          datefmt="%Y-%m-%dT%H:%M:%S",
                      )
                  )

                  logger.addHandler(handler)

              return logger


          def run_command(
              command: Sequence[str],
              *,
              cwd: Path | None = None,
              timeout: float = 300.0,
              env: Mapping[str, str] | None = None,
              check: bool = True,
              input_text: str | None = None,
          ) -> subprocess.CompletedProcess[str]:
              if not command:
                  raise OperationalError("empty command")

              process_env = os.environ.copy()

              if env:
                  process_env.update(env)

              completed = subprocess.run(
                  list(command),
                  cwd=str(cwd) if cwd else None,
                  env=process_env,
                  input=input_text,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=timeout,
                  check=False,
              )

              if check and completed.returncode != 0:
                  raise CommandError(
                      command,
                      completed.returncode,
                      completed.stdout,
                      completed.stderr,
                  )

              return completed


          def git_revision(root: Path) -> str:
              result = run_command(
                  ["git", "rev-parse", "HEAD"],
                  cwd=root,
                  timeout=30,
              )
              return result.stdout.strip()


          def git_is_clean(root: Path) -> bool:
              result = run_command(
                  [
                      "git",
                      "status",
                      "--porcelain=v1",
                      "--untracked-files=all",
                  ],
                  cwd=root,
                  timeout=30,
              )
              return not result.stdout.strip()


          def git_branch(root: Path) -> str:
              result = run_command(
                  ["git", "branch", "--show-current"],
                  cwd=root,
                  timeout=30,
              )
              return result.stdout.strip()


          def tree_digest(
              root: Path,
              *,
              excluded: Iterable[str] = (),
          ) -> str:
              root = root.resolve()
              excluded_set = set(excluded)
              digest = hashlib.sha256()

              files: list[Path] = []

              for directory, directories, filenames in os.walk(root):
                  directory_path = Path(directory)

                  directories[:] = [
                      name
                      for name in directories
                      if name not in excluded_set
                      and not (directory_path / name).is_symlink()
                  ]

                  for filename in filenames:
                      candidate = directory_path / filename

                      if candidate.is_symlink():
                          continue

                      files.append(candidate)

              for candidate in sorted(files):
                  relative = candidate.relative_to(root).as_posix()

                  digest.update(relative.encode("utf-8"))
                  digest.update(b"\0")
                  digest.update(
                      sha256_file(candidate).encode("ascii")
                  )
                  digest.update(b"\n")

              return digest.hexdigest()


          class FileLock:
              """
              Cross-platform process lock based on exclusive file creation.

              Lock metadata provides lease information for stale-lock
              detection while preserving explicit administrative recovery.
              """

              def __init__(
                  self,
                  path: Path,
                  *,
                  timeout: float = 60.0,
                  lease_seconds: float = 900.0,
              ) -> None:
                  self.path = path
                  self.timeout = timeout
                  self.lease_seconds = lease_seconds
                  self.acquired = False

              def _metadata(self) -> dict[str, Any]:
                  return {
                      "format": "zyra.lock.v1",
                      "pid": os.getpid(),
                      "hostname": socket.gethostname(),
                      "created_at": utc_now(),
                      "lease_seconds": self.lease_seconds,
                  }

              def acquire(self) -> None:
                  ensure_directory(self.path.parent)
                  deadline = time.monotonic() + self.timeout

                  while True:
                      try:
                          fd = os.open(
                              str(self.path),
                              os.O_WRONLY | os.O_CREAT | os.O_EXCL,
                              0o640,
                          )

                          try:
                              os.write(
                                  fd,
                                  (
                                      json.dumps(
                                          self._metadata(),
                                          sort_keys=True,
                                      )
                                      + "\n"
                                  ).encode("utf-8"),
                              )
                          finally:
                              os.close(fd)

                          self.acquired = True
                          return

                      except FileExistsError:
                          metadata = read_json(self.path, {})
                          created = metadata.get("created_at")
                          stale = False

                          if created:
                              try:
                                  timestamp = datetime.fromisoformat(
                                      created
                                  )

                                  age = (
                                      datetime.now(timezone.utc)
                                      - timestamp
                                  ).total_seconds()

                                  stale = age > float(
                                      metadata.get(
                                          "lease_seconds",
                                          self.lease_seconds,
                                      )
                                  )

                              except (TypeError, ValueError):
                                  stale = False

                          if stale:
                              try:
                                  self.path.unlink()
                                  continue
                              except FileNotFoundError:
                                  continue

                          if time.monotonic() >= deadline:
                              raise LockTimeout(
                                  f"timed out acquiring lock {self.path}"
                              )

                          time.sleep(0.2)

              def release(self) -> None:
                  if not self.acquired:
                      return

                  with contextlib.suppress(FileNotFoundError):
                      self.path.unlink()

                  self.acquired = False

              def __enter__(self) -> "FileLock":
                  self.acquire()
                  return self

              def __exit__(self, exc_type, exc, traceback) -> None:
                  self.release()


          def audit_event(
              operation: str,
              *,
              status: str,
              execution: str,
              details: Mapping[str, Any] | None = None,
          ) -> Path:
              ensure_directory(AUDIT_ROOT)

              event = {
                  "format": AUDIT_FORMAT,
                  "execution_id": execution,
                  "timestamp": utc_now(),
                  "operation": operation,
                  "status": status,
                  "hostname": socket.gethostname(),
                  "pid": os.getpid(),
                  "details": dict(details or {}),
              }

              filename = (
                  f"{datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%S')}"
                  f"-{execution.replace(':', '').replace('+', '')}.json"
              )

              target = AUDIT_ROOT / filename

              atomic_write_json(
                  target,
                  event,
                  mode=0o640,
              )

              return target


          def write_state(
              name: str,
              state: Mapping[str, Any],
          ) -> Path:
              ensure_directory(SCRIPT_STATE_ROOT)

              payload = {
                  "format": STATE_FORMAT,
                  "state_version": 1,
                  "updated_at": utc_now(),
                  **dict(state),
              }

              target = SCRIPT_STATE_ROOT / f"{name}.json"

              atomic_write_json(
                  target,
                  payload,
              )

              return target


          def load_state(name: str) -> dict[str, Any]:
              value = read_json(
                  SCRIPT_STATE_ROOT / f"{name}.json",
                  {},
              )

              if not isinstance(value, dict):
                  raise OperationalError(
                      f"invalid state file for operation {name}"
                  )

              return value


          def serializable(value: Any) -> Any:
              if is_dataclass(value):
                  return asdict(value)

              if isinstance(value, Path):
                  return str(value)

              if isinstance(value, Mapping):
                  return {
                      str(key): serializable(item)
                      for key, item in value.items()
                  }

              if isinstance(value, (list, tuple, set)):
                  return [
                      serializable(item)
                      for item in value
                  ]

              return value


          def ensure_operational_layout() -> None:
              for path in (
                  STATE_ROOT,
                  SCRIPT_STATE_ROOT,
                  LOCK_ROOT,
                  AUDIT_ROOT,
                  RELEASE_ROOT,
              ):
                  ensure_directory(path)


          __all__ = [
              "AUDIT_ROOT",
              "CommandError",
              "FileLock",
              "LOCK_ROOT",
              "MANIFEST_FORMAT",
              "OperationalError",
              "PACKAGE_ROOT",
              "RELEASE_ROOT",
              "REPOSITORY_ROOT",
              "SCRIPT_STATE_ROOT",
              "STATE_ROOT",
              "STATE_FORMAT",
              "audit_event",
              "atomic_write_bytes",
              "atomic_write_json",
              "configure_logging",
              "ensure_directory",
              "ensure_operational_layout",
              "execution_id",
              "fsync_directory",
              "git_branch",
              "git_is_clean",
              "git_revision",
              "load_state",
              "read_json",
              "redacted_environment",
              "relative_safe_path",
              "run_command",
              "safe_remove",
              "serializable",
              "sha256_bytes",
              "sha256_file",
              "tree_digest",
              "utc_now",
              "write_state",
          ]
          PY

          cat > scripts/bootstrap.py <<'PY'
          from __future__ import annotations

          import argparse
          import json
          import sys

          from infrastructure import Configuration, InfrastructureBootstrap

          from scripts import (
              FileLock,
              LOCK_ROOT,
              audit_event,
              configure_logging,
              ensure_operational_layout,
              execution_id,
              serializable,
              write_state,
          )


          def parse_args() -> argparse.Namespace:
              parser = argparse.ArgumentParser(
                  description="Initialize Zyra Network infrastructure."
              )

              parser.add_argument("--environment", default=None)
              parser.add_argument("--service-name", default=None)
              parser.add_argument("--node-id", default=None)
              parser.add_argument("--data-directory", default=None)
              parser.add_argument("--database-path", default=None)
              parser.add_argument("--strict", action="store_true")
              parser.add_argument("--no-strict", action="store_true")
              parser.add_argument("--dry-run", action="store_true")
              parser.add_argument("--json", action="store_true")
              parser.add_argument("-v", "--verbose", action="store_true")

              return parser.parse_args()


          def build_configuration(
              args: argparse.Namespace,
          ) -> Configuration:
              if any(
                  value is not None
                  for value in (
                      args.environment,
                      args.service_name,
                      args.node_id,
                      args.data_directory,
                      args.database_path,
                  )
              ):
                  mapping = {}

                  if args.environment is not None:
                      mapping["environment"] = args.environment

                  if args.service_name is not None:
                      mapping["service_name"] = args.service_name

                  if args.node_id is not None:
                      mapping["node_id"] = args.node_id

                  if args.data_directory is not None:
                      mapping["data_directory"] = args.data_directory

                  if args.database_path is not None:
                      mapping["database_path"] = args.database_path

                  if args.strict:
                      mapping["strict_configuration"] = True
                  elif args.no_strict:
                      mapping["strict_configuration"] = False

                  return Configuration.from_mapping(mapping)

              configuration = Configuration.from_environment()

              if args.strict and not configuration.strict_configuration:
                  configuration = Configuration.from_mapping(
                      {
                          "environment": configuration.environment,
                          "service_name": configuration.service_name,
                          "node_id": configuration.node_id,
                          "data_directory": configuration.data_directory,
                          "database_path": configuration.database_path,
                          "cache_capacity": configuration.cache_capacity,
                          "cache_default_ttl_seconds": (
                              configuration.cache_default_ttl_seconds
                          ),
                          "database_timeout_seconds": (
                              configuration.database_timeout_seconds
                          ),
                          "database_wal": configuration.database_wal,
                          "shutdown_timeout_seconds": (
                              configuration.shutdown_timeout_seconds
                          ),
                          "strict_configuration": True,
                      }
                  )

              return configuration


          def main() -> int:
              args = parse_args()
              logger = configure_logging(args.verbose)
              ensure_operational_layout()
              execution = execution_id()

              try:
                  with FileLock(
                      LOCK_ROOT / "bootstrap.lock",
                      timeout=60,
                  ):
                      configuration = build_configuration(args)

                      if (
                          args.strict
                          or configuration.environment.value
                          == "production"
                      ):
                          configuration.require_production_safe()

                      if args.dry_run:
                          payload = {
                              "execution_id": execution,
                              "operation": "bootstrap",
                              "dry_run": True,
                              "configuration": serializable(
                                  configuration
                              ),
                          }

                          write_state(
                              "bootstrap",
                              payload,
                          )

                          audit_event(
                              "bootstrap",
                              status="dry-run",
                              execution=execution,
                              details=payload,
                          )

                          print(
                              json.dumps(
                                  payload,
                                  indent=2,
                                  default=str,
                              )
                          )

                          return 0

                      infrastructure = InfrastructureBootstrap(
                          configuration
                      )

                      try:
                          context = infrastructure.initialize()

                          database_ok = False

                          if context.database is not None:
                              database_ok = (
                                  context.database.connection.execute(
                                      "PRAGMA integrity_check"
                                  ).fetchone()[0]
                                  == "ok"
                              )

                          snapshot = (
                              context.runtime.snapshot()
                              if context.runtime is not None
                              else None
                          )

                          payload = {
                              "execution_id": execution,
                              "operation": "bootstrap",
                              "status": "initialized",
                              "configuration": serializable(
                                  configuration
                              ),
                              "database_integrity": database_ok,
                              "runtime": serializable(snapshot),
                          }

                          write_state(
                              "bootstrap",
                              payload,
                          )

                          audit_event(
                              "bootstrap",
                              status="success",
                              execution=execution,
                              details=payload,
                          )

                          if args.json:
                              print(
                                  json.dumps(
                                      payload,
                                      indent=2,
                                      default=str,
                                  )
                              )
                          else:
                              logger.info(
                                  "infrastructure initialized successfully"
                              )

                          return 0

                      finally:
                          try:
                              infrastructure.shutdown()
                          except Exception:
                              logger.exception(
                                  "infrastructure shutdown failed"
                              )

              except Exception as exc:
                  audit_event(
                      "bootstrap",
                      status="failure",
                      execution=execution,
                      details={"error": repr(exc)},
                  )

                  logger.error(
                      "bootstrap failed: %s",
                      exc,
                  )

                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          PY

          cat > scripts/cleanup.py <<'PY'
          from __future__ import annotations

          import argparse
          import os
          import sys
          from pathlib import Path

          from scripts import (
              FileLock,
              LOCK_ROOT,
              audit_event,
              configure_logging,
              ensure_operational_layout,
              execution_id,
              safe_remove,
          )


          PROTECTED = {
              ".git",
              ".zyra",
              ".github",
              "apps",
          }

          GENERATED_NAMES = {
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              ".coverage",
              "htmlcov",
              ".tox",
              ".nox",
          }


          def parse_args() -> argparse.Namespace:
              parser = argparse.ArgumentParser(
                  description=(
                      "Safely remove generated development artifacts."
                  )
              )

              parser.add_argument(
                  "--root",
                  type=Path,
                  default=Path.cwd(),
              )
              parser.add_argument(
                  "--dry-run",
                  action="store_true",
              )
              parser.add_argument(
                  "--include-venv",
                  action="store_true",
              )
              parser.add_argument(
                  "--verbose",
                  action="store_true",
              )

              return parser.parse_args()


          def discover(
              root: Path,
              include_venv: bool,
          ) -> list[Path]:
              results: list[Path] = []

              for directory, directories, filenames in os.walk(root):
                  base = Path(directory)

                  directories[:] = [
                      name
                      for name in directories
                      if name not in PROTECTED
                      and (
                          include_venv
                          or name not in {
                              "venv",
                              ".venv",
                              "env",
                              ".env",
                          }
                      )
                      and not (base / name).is_symlink()
                  ]

                  for name in directories:
                      if name in GENERATED_NAMES:
                          results.append(base / name)

                  for name in filenames:
                      if name == ".coverage" or name.endswith(
                          (".pyc", ".pyo")
                      ):
                          results.append(base / name)

              return sorted(set(results))


          def main() -> int:
              args = parse_args()
              logger = configure_logging(args.verbose)
              ensure_operational_layout()
              execution = execution_id()

              root = args.root.resolve()

              if not root.exists() or not root.is_dir():
                  logger.error("invalid root: %s", root)
                  return 1

              try:
                  with FileLock(
                      LOCK_ROOT / "cleanup.lock",
                      timeout=30,
                  ):
                      targets = discover(
                          root,
                          args.include_venv,
                      )

                      if args.dry_run:
                          for target in targets:
                              print(target)

                          audit_event(
                              "cleanup",
                              status="dry-run",
                              execution=execution,
                              details={"count": len(targets)},
                          )

                          return 0

                      removed = 0

                      for target in targets:
                          try:
                              if safe_remove(
                                  target,
                                  root=root,
                              ):
                                  removed += 1
                          except FileNotFoundError:
                              continue

                      audit_event(
                          "cleanup",
                          status="success",
                          execution=execution,
                          details={
                              "discovered": len(targets),
                              "removed": removed,
                          },
                      )

                      logger.info(
                          "removed %d generated artifacts",
                          removed,
                      )

                      return 0

              except Exception as exc:
                  audit_event(
                      "cleanup",
                      status="failure",
                      execution=execution,
                      details={"error": repr(exc)},
                  )

                  logger.error(
                      "cleanup failed: %s",
                      exc,
                  )

                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          PY

          cat > scripts/deploy.py <<'PY'
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from scripts import (
              FileLock,
              LOCK_ROOT,
              MANIFEST_FORMAT,
              OperationalError,
              RELEASE_ROOT,
              audit_event,
              atomic_write_json,
              configure_logging,
              ensure_operational_layout,
              execution_id,
              git_branch,
              git_is_clean,
              git_revision,
              sha256_file,
              tree_digest,
              utc_now,
              write_state,
          )


          EXCLUDED = {
              ".git",
              ".zyra",
              ".pytest_cache",
              "__pycache__",
              ".mypy_cache",
              ".ruff_cache",
              ".coverage",
              "venv",
              ".venv",
          }


          def parse_args() -> argparse.Namespace:
              parser = argparse.ArgumentParser(
                  description="Build an immutable Zyra release."
              )

              parser.add_argument(
                  "--root",
                  type=Path,
                  default=Path.cwd(),
              )
              parser.add_argument(
                  "--revision",
                  default=None,
              )
              parser.add_argument(
                  "--allow-dirty",
                  action="store_true",
              )
              parser.add_argument(
                  "--publish",
                  action="store_true",
              )
              parser.add_argument(
                  "--json",
                  action="store_true",
              )
              parser.add_argument(
                  "--verbose",
                  action="store_true",
              )

              return parser.parse_args()


          def manifest_tree(
              root: Path,
          ) -> list[dict[str, object]]:
              entries: list[dict[str, object]] = []

              for directory, directories, filenames in os.walk(root):
                  base = Path(directory)

                  directories[:] = [
                      name
                      for name in directories
                      if name not in EXCLUDED
                      and not (base / name).is_symlink()
                  ]

                  for name in filenames:
                      path = base / name

                      if path.is_symlink():
                          continue

                      relative = path.relative_to(
                          root
                      ).as_posix()

                      entries.append(
                          {
                              "path": relative,
                              "size": path.stat().st_size,
                              "sha256": sha256_file(path),
                          }
                      )

              return sorted(
                  entries,
                  key=lambda item: str(item["path"]),
              )


          def create_git_archive(
              root: Path,
              revision: str,
              destination: Path,
          ) -> None:
              with destination.open("wb") as handle:
                  process = subprocess.Popen(
                      [
                          "git",
                          "archive",
                          "--format=tar",
                          revision,
                      ],
                      cwd=root,
                      stdout=handle,
                      stderr=subprocess.PIPE,
                  )

                  try:
                      _, stderr = process.communicate(
                          timeout=300
                      )
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.communicate()
                      raise OperationalError(
                          "git archive timed out"
                      )

                  if process.returncode != 0:
                      raise OperationalError(
                          stderr.decode(
                              "utf-8",
                              "replace",
                          )
                      )


          def main() -> int:
              args = parse_args()
              logger = configure_logging(args.verbose)
              ensure_operational_layout()
              execution = execution_id()
              root = args.root.resolve()

              try:
                  with FileLock(
                      LOCK_ROOT / "deploy.lock",
                      timeout=120,
                  ):
                      if not root.joinpath(".git").exists():
                          raise OperationalError(
                              "deployment requires a git repository"
                          )

                      if (
                          not args.allow_dirty
                          and not git_is_clean(root)
                      ):
                          raise OperationalError(
                              "working tree is dirty; "
                              "commit changes before deployment"
                          )

                      revision = (
                          args.revision
                          or git_revision(root)
                      )

                      branch = git_branch(root)

                      with tempfile.TemporaryDirectory(
                          prefix=".zyra-release-",
                          dir=str(RELEASE_ROOT),
                      ) as temporary:
                          staging = Path(temporary)

                          archive = staging / "source.tar"

                          create_git_archive(
                              root,
                              revision,
                              archive,
                          )

                          source = staging / "source"
                          source.mkdir()

                          shutil.unpack_archive(
                              str(archive),
                              str(source),
                              format="tar",
                          )

                          archive.unlink()

                          manifest = manifest_tree(source)

                          metadata = {
                              "format": MANIFEST_FORMAT,
                              "manifest_version": 1,
                              "execution_id": execution,
                              "created_at": utc_now(),
                              "revision": revision,
                              "branch": branch,
                              "tree_digest": tree_digest(source),
                              "files": manifest,
                          }

                          metadata_bytes = json.dumps(
                              metadata,
                              sort_keys=True,
                              separators=(",", ":"),
                          ).encode("utf-8")

                          metadata_digest = hashlib.sha256(
                              metadata_bytes
                          ).hexdigest()

                          release_id = (
                              f"{revision[:12]}-"
                              f"{metadata_digest[:16]}"
                          )

                          destination = (
                              RELEASE_ROOT / release_id
                          )

                          if destination.exists():
                              raise OperationalError(
                                  f"release already exists: {release_id}"
                              )

                          destination.mkdir(
                              parents=True,
                              exist_ok=False,
                          )

                          final_source = destination / "source"

                          os.replace(
                              source,
                              final_source,
                          )

                          atomic_write_json(
                              destination / "manifest.json",
                              metadata,
                              mode=0o640,
                          )

                          verification = manifest_tree(
                              final_source
                          )

                          if verification != manifest:
                              raise OperationalError(
                                  "release manifest changed "
                                  "during publication"
                              )

                          if args.publish:
                              active = (
                                  RELEASE_ROOT / "active"
                              )

                              temporary_link = (
                                  RELEASE_ROOT
                                  / f".active-{execution}"
                              )

                              if (
                                  temporary_link.exists()
                                  or temporary_link.is_symlink()
                              ):
                                  temporary_link.unlink()

                              temporary_link.symlink_to(
                                  destination
                              )

                              os.replace(
                                  temporary_link,
                                  active,
                              )

                          payload = {
                              "status": (
                                  "published"
                                  if args.publish
                                  else "built"
                              ),
                              "release_id": release_id,
                              "revision": revision,
                              "branch": branch,
                              "path": str(destination),
                              "files": len(manifest),
                              "tree_digest": metadata[
                                  "tree_digest"
                              ],
                              "metadata_sha256": metadata_digest,
                          }

                          write_state(
                              "deploy",
                              payload,
                          )

                          audit_event(
                              "deploy",
                              status=payload["status"],
                              execution=execution,
                              details=payload,
                          )

                          print(
                              json.dumps(payload, indent=2)
                              if args.json
                              else release_id
                          )

                          return 0

              except Exception as exc:
                  audit_event(
                      "deploy",
                      status="failure",
                      execution=execution,
                      details={"error": repr(exc)},
                  )

                  logger.error(
                      "deployment failed: %s",
                      exc,
                  )

                  return 1


          if __name__ == "__main__":
              sys.exit(main())
