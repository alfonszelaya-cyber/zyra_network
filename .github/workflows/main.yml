      - name: Verify staged scope
        shell: bash
        run: |
          set -euo pipefail

          files="$(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              HEAD
          )"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              shared_engines/ai/*)
                ;;
              *)
                echo "Commit contains unauthorized file: $file"
                exit 1
                ;;
            esac
          done <<< "$files"

