name: Create Agro 11 Modules Architecture

on:
  workflow_dispatch:

jobs:
  create-agro-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Agro module structure
        run: |
          set -e

          BASE="apps/agro/modules"

          mkdir -p "$BASE/executive/dashboard"
          mkdir -p "$BASE/executive/gestion"
          mkdir -p "$BASE/executive/monitoreo"
          mkdir -p "$BASE/executive/gobierno"
          mkdir -p "$BASE/executive/economia"
          mkdir -p "$BASE/executive/seguridad"

          mkdir -p "$BASE/productores/registro"
          mkdir -p "$BASE/productores/perfil"
          mkdir -p "$BASE/productores/unidades_productivas"
          mkdir -p "$BASE/productores/actividad"
          mkdir -p "$BASE/productores/programas"
          mkdir -p "$BASE/productores/documentos"
          mkdir -p "$BASE/productores/historial"
          mkdir -p "$BASE/productores/estado"

          mkdir -p "$BASE/produccion/planificacion"
          mkdir -p "$BASE/produccion/agricultura"
          mkdir -p "$BASE/produccion/ganaderia"
          mkdir -p "$BASE/produccion/seguimiento"
          mkdir -p "$BASE/produccion/rendimiento"
          mkdir -p "$BASE/produccion/tecnologia"
          mkdir -p "$BASE/produccion/reportes"

          mkdir -p "$BASE/insumos_y_apoyos/insumos"
          mkdir -p "$BASE/insumos_y_apoyos/programas_gubernamentales"
          mkdir -p "$BASE/insumos_y_apoyos/beneficios"
          mkdir -p "$BASE/insumos_y_apoyos/entregas"
          mkdir -p "$BASE/insumos_y_apoyos/distribucion"
          mkdir -p "$BASE/insumos_y_apoyos/proveedores"
          mkdir -p "$BASE/insumos_y_apoyos/asistencia"
          mkdir -p "$BASE/insumos_y_apoyos/control"

          mkdir -p "$BASE/recursos_y_activos/tierras"
          mkdir -p "$BASE/recursos_y_activos/infraestructura"
          mkdir -p "$BASE/recursos_y_activos/maquinaria"
          mkdir -p "$BASE/recursos_y_activos/equipos"
          mkdir -p "$BASE/recursos_y_activos/recursos_hidricos"
          mkdir -p "$BASE/recursos_y_activos/tecnologia"
          mkdir -p "$BASE/recursos_y_activos/inventarios"
          mkdir -p "$BASE/recursos_y_activos/valoracion"

          mkdir -p "$BASE/comercializacion/venta_simple"
          mkdir -p "$BASE/comercializacion/mercado"
          mkdir -p "$BASE/comercializacion/alertas_de_mercado"
          mkdir -p "$BASE/comercializacion/oportunidades"
          mkdir -p "$BASE/comercializacion/produccion_comercial"
          mkdir -p "$BASE/comercializacion/empresas"
          mkdir -p "$BASE/comercializacion/compradores"
          mkdir -p "$BASE/comercializacion/ventas"
          mkdir -p "$BASE/comercializacion/logistica"
          mkdir -p "$BASE/comercializacion/exportacion"
          mkdir -p "$BASE/comercializacion/resultados"

          mkdir -p "$BASE/operaciones/actividades"
          mkdir -p "$BASE/operaciones/produccion"
          mkdir -p "$BASE/operaciones/recursos"
          mkdir -p "$BASE/operaciones/inventarios"
          mkdir -p "$BASE/operaciones/almacenamiento"
          mkdir -p "$BASE/operaciones/transporte"
          mkdir -p "$BASE/operaciones/incidencias"
          mkdir -p "$BASE/operaciones/tecnologia"
          mkdir -p "$BASE/operaciones/resultados"

          mkdir -p "$BASE/gobierno/instituciones"
          mkdir -p "$BASE/gobierno/programas"
          mkdir -p "$BASE/gobierno/productores"
          mkdir -p "$BASE/gobierno/solicitudes"
          mkdir -p "$BASE/gobierno/apoyos"
          mkdir -p "$BASE/gobierno/entregas"
          mkdir -p "$BASE/gobierno/territorio"
          mkdir -p "$BASE/gobierno/crisis"
          mkdir -p "$BASE/gobierno/seguridad_alimentaria"
          mkdir -p "$BASE/gobierno/control"
          mkdir -p "$BASE/gobierno/reportes"

          mkdir -p "$BASE/riesgo/riesgo_productivo"
          mkdir -p "$BASE/riesgo/riesgo_climatico"
          mkdir -p "$BASE/riesgo/riesgo_territorial"
          mkdir -p "$BASE/riesgo/alertas"
          mkdir -p "$BASE/riesgo/impacto"
          mkdir -p "$BASE/riesgo/respuesta"
          mkdir -p "$BASE/riesgo/resiliencia"

          mkdir -p "$BASE/atencion_al_cliente/atencion"
          mkdir -p "$BASE/atencion_al_cliente/solicitudes"
          mkdir -p "$BASE/atencion_al_cliente/asistencia"
          mkdir -p "$BASE/atencion_al_cliente/escalamiento"
          mkdir -p "$BASE/atencion_al_cliente/comunicacion"
          mkdir -p "$BASE/atencion_al_cliente/calidad"

          mkdir -p "$BASE/seguridad/identidad"
          mkdir -p "$BASE/seguridad/accesos"
          mkdir -p "$BASE/seguridad/proteccion"
          mkdir -p "$BASE/seguridad/control"
          mkdir -p "$BASE/seguridad/auditoria"
          mkdir -p "$BASE/seguridad/alertas"
          mkdir -p "$BASE/seguridad/cumplimiento"

          find "$BASE" -type d -exec touch "{}/__init__.py" \;

      - name: Commit only if changes exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/agro/modules

          if git diff --cached --quiet; then
            echo "No new changes."
            exit 0
          fi

          git commit -m "Create Agro 11 modules architecture"
          git push
