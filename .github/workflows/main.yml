          from __future__ import annotations

          from ..core import ObservationConfig
          from ..manager.manager import (
              ObservabilityManager,
          )


          class ObservabilityAPI:
              """
              Stable public facade.

              Application integrations should depend on this facade rather
              than internal implementation modules.
              """

              def __init__(
                  self,
                  manager,
              ):
                  self.manager = manager

              @classmethod
              def from_config(
                  cls,
                  config: ObservationConfig,
              ):
                  manager = (
                      ObservabilityManager(
                          config
                      )
                  )

                  manager.start()

                  return cls(manager)

              def emit(
                  self,
                  component,
                  operation,
                  event_type,
                  payload=None,
                  **kwargs,
              ):
                  return self.manager.emit(
                      component,
                      operation,
                      event_type,
                      payload,
                      **kwargs,
                  )

              def status(self):
                  return self.manager.status()

              def close(self):
                  self.manager.stop()


          __all__ = [
              "ObservabilityAPI",
          ]
