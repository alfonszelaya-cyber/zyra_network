          @dataclass(frozen=True, slots=True)
          class HistogramSnapshot:
              name: str
              labels: dict[str, str]
              count: int
              minimum: float
              maximum: float
              average: float
              quantiles: dict[float, float]


          class Histogram:
              def __init__(
                  self,
                  name: str,
                  labels=None,
                  *,
                  max_observations: int = 100_000,
              ):
                  self.name = name
                  self.labels = normalize_labels(labels)
                  self.max_observations = max_observations
                  self._values: list[float] = []
                  self._lock = threading.RLock()

              def observe(self, value: float) -> None:
                  value = float(value)

                  if value != value or not abs(value) < float("inf"):
                      raise ValidationError(
                          "histogram value must be finite"
                      )

                  with self._lock:
                      if len(self._values) >= self.max_observations:
                          self._values.pop(0)

                      self._values.append(value)

              def snapshot(self) -> HistogramSnapshot:
                  with self._lock:
                      values = list(self._values)

                  if not values:
                      return HistogramSnapshot(
                          self.name,
                          dict(self.labels),
                          0,
                          0.0,
                          0.0,
                          0.0,
                          {},
                      )

                  return HistogramSnapshot(
                      self.name,
                      dict(self.labels),
                      len(values),
                      min(values),
                      max(values),
                      sum(values) / len(values),
                      quantiles(
                          values,
                          (0.50, 0.90, 0.95, 0.99),
                      ),
                  )


          class Metrics:
              def __init__(
                  self,
                  *,
                  max_series: int = 100_000,
              ):
                  self.registry = MetricRegistry(
                      max_series=max_series
                  )
                  self._histograms: dict[
                      tuple[str, tuple[tuple[str, str], ...]],
                      Histogram,
                  ] = {}
                  self._lock = threading.RLock()

              def counter(
                  self,
                  name,
                  value=1,
                  labels=None,
                  *,
                  unit=None,
                  description=None,
              ):
                  return self.registry.record(
                      MetricSample(
                          name,
                          MetricKind.COUNTER,
                          value,
                          time.time_ns(),
                          normalize_labels(labels),
                          unit,
                          description,
                      )
                  )

              def gauge(
                  self,
                  name,
                  value,
                  labels=None,
                  *,
                  unit=None,
                  description=None,
              ):
                  return self.registry.record(
