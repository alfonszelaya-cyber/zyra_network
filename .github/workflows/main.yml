          from __future__ import annotations

          import argparse
          import importlib
          import json
          import py_compile
          import sqlite3
          import subprocess
          import sys
          from pathlib import Path
          from typing import Any

          from scripts import (
              OperationalError,
              REPOSITORY_ROOT,
              audit_event,
              configure_logging,
              execution_id,
              git_branch,
              git_is_clean,
              git_revision,
              tree_digest,
              utc_now,
          )


          REQUIRED_DIRECTORIES = (
              "foundation",
              "protocol",
              "network",
              "shared_engines",
              "infrastructure",
              "storage",
              "telemetry",
              "observability",
              "scripts",
          )

          REQUIRED_SCRIPTS = (
              "bootstrap.py",
              "cleanup.py",
              "deploy.py",
              "diagnostics.py",
              "install.py",
              "migrate.py",
              "repair.py",
              "rollback.py",
              "update.py",
              "verify_installation.py",
          )

          REQUIRED_MODULES = (
              "foundation",
              "protocol",
              "network",
              "infrastructure",
              "storage",
              "telemetry",
              "observability",
          )


          def parse_args() -> argparse.Namespace:
              parser = argparse.ArgumentParser(
                  description=(
                      "Verify Zyra Network installation integrity."
                  )
              )

              parser.add_argument(
                  "--root",
                  type=Path,
                  default=REPOSITORY_ROOT,
              )
              parser.add_argument(
                  "--strict",
                  action="store_true",
              )
              parser.add_argument(
                  "--pytest",
                  action="store_true",
              )
              parser.add_argument(
                  "--json",
                  action="store_true",
              )
              parser.add_argument(
                  "--verbose",
                  action="store_true",
              )

              return parser.parse_args()


          def check_compile(
              root: Path,
          ) -> dict[str, Any]:
              failures: list[str] = []

              for path in root.rglob("*.py"):
                  relative = path.relative_to(root)

                  if any(
                      component in {
                          ".git",
                          ".venv",
                          "venv",
                          ".zyra",
                      }
                      for component in relative.parts
                  ):
                      continue

                  try:
                      py_compile.compile(
                          str(path),
                          doraise=True,
                          optimize=0,
                      )
                  except Exception as exc:
                      failures.append(
                          f"{relative}: {exc}"
                      )

              return {
                  "status": (
                      "passed"
                      if not failures
                      else "failed"
                  ),
                  "failures": failures,
              }


          def check_imports() -> dict[str, Any]:
              failures: list[str] = []

              for module in REQUIRED_MODULES:
                  try:
                      importlib.import_module(module)
                  except Exception as exc:
                      failures.append(
                          f"{module}: {exc!r}"
                      )

              return {
                  "status": (
                      "passed"
                      if not failures
                      else "failed"
                  ),
                  "failures": failures,
              }


          def check_layout(
              root: Path,
          ) -> dict[str, Any]:
              missing_directories = [
                  item
                  for item in REQUIRED_DIRECTORIES
                  if not (root / item).is_dir()
              ]

              missing_scripts = [
                  item
                  for item in REQUIRED_SCRIPTS
                  if not (
                      root / "scripts" / item
                  ).is_file()
              ]

              return {
                  "status": (
                      "passed"
                      if (
                          not missing_directories
                          and not missing_scripts
                      )
                      else "failed"
                  ),
                  "missing_directories": (
                      missing_directories
                  ),
                  "missing_scripts": missing_scripts,
              }


          def check_database() -> dict[str, Any]:
              try:
                  from infrastructure import Configuration

                  configuration = (
                      Configuration.from_environment()
                  )

                  path = Path(
                      configuration.database_path
                  )

                  if not path.exists():
                      return {
                          "status": "not-present",
                          "path": str(path),
                      }

                  connection = sqlite3.connect(
                      f"file:{path}?mode=ro",
                      uri=True,
                      timeout=30,
                  )

                  try:
                      integrity = connection.execute(
                          "PRAGMA integrity_check"
                      ).fetchone()[0]

                      foreign_keys = connection.execute(
                          "PRAGMA foreign_keys"
                      ).fetchone()[0]

                      return {
                          "status": (
                              "passed"
                              if integrity == "ok"
                              else "failed"
                          ),
                          "path": str(path),
                          "integrity": integrity,
                          "foreign_keys": foreign_keys,
                      }

                  finally:
                      connection.close()

              except Exception as exc:
                  return {
                      "status": "failed",
                      "error": repr(exc),
                  }


          def main() -> int:
              args = parse_args()
              logger = configure_logging(args.verbose)
              execution = execution_id()
              root = args.root.resolve()

              checks: dict[str, Any] = {}

              try:
                  if not root.is_dir():
                      raise OperationalError(
                          f"repository root does not exist: {root}"
                      )

                  checks["layout"] = check_layout(root)
                  checks["compile"] = check_compile(root)
                  checks["imports"] = check_imports()
                  checks["database"] = check_database()

                  if (root / ".git").exists():
                      checks["git"] = {
                          "status": "passed",
                          "revision": git_revision(root),
                          "branch": git_branch(root),
                          "clean": git_is_clean(root),
                      }

                  checks["tree"] = {
                      "status": "passed",
                      "digest": tree_digest(
                          root,
                          excluded=(
                              ".git",
                              ".zyra",
                              "__pycache__",
                              ".pytest_cache",
                              ".venv",
                              "venv",
                          ),
                      ),
                  }

                  if args.pytest:
                     
