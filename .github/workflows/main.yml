                                  encoding="utf-8"
                              )

                              if not sql.strip():
                                  raise OperationalError(
                                      f"empty migration: {path.name}"
                                  )

                              logger.info(
                                  "applying migration %s",
                                  path.name,
                              )

                              connection.execute(
                                  "BEGIN IMMEDIATE"
                              )

                              try:
                                  connection.executescript(
                                      sql
                                  )

                                  connection.execute(
                                      """
                                      INSERT INTO
                                      zyra_schema_migrations (
                                          version,
                                          filename,
                                          checksum,
                                          applied_at,
                                          execution_id
                                      )
                                      VALUES (?, ?, ?, ?, ?)
                                      """,
                                      (
                                          item["version"],
                                          item["filename"],
                                          item["checksum"],
                                          utc_now(),
                                          execution,
                                      ),
