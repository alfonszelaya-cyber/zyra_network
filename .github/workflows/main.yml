name: Protocol - Block 02

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protocol-block-02:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          set -euo pipefail
          mkdir -p protocol/discovery
          mkdir -p protocol/encoding
          mkdir -p protocol/events
          mkdir -p protocol/gateway
          mkdir -p protocol/handshake
          mkdir -p protocol/identity

      - name: Discovery
        run: |
          set -euo pipefail

          cat > protocol/discovery/discovery.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime, timezone


          @dataclass(frozen=True, slots=True)
          class ServiceRecord:
              service_id: str
              endpoint: str
              version: str
              capabilities: frozenset[str]
              registered_at: datetime

              @classmethod
              def create(
                  cls,
                  service_id: str,
                  endpoint: str,
                  version: str,
                  capabilities: set[str] | frozenset[str] = frozenset(),
              ) -> "ServiceRecord":
                  if not service_id.strip():
                      raise ValueError("service_id cannot be empty")
                  if not endpoint.strip():
                      raise ValueError("endpoint cannot be empty")
                  if not version.strip():
                      raise ValueError("version cannot be empty")

                  return cls(
                      service_id=service_id.strip(),
                      endpoint=endpoint.strip(),
                      version=version.strip(),
                      capabilities=frozenset(
                          item.strip()
                          for item in capabilities
                          if item.strip()
                      ),
                      registered_at=datetime.now(timezone.utc),
                  )


          class ServiceDiscovery:
              def __init__(self) -> None:
                  self._records: dict[str, ServiceRecord] = {}

              def register(self, record: ServiceRecord) -> None:
                  if record.service_id in self._records:
                      raise ValueError(
                          f"Service already registered: {record.service_id}"
                      )
                  self._records[record.service_id] = record

              def unregister(self, service_id: str) -> bool:
                  return self._records.pop(service_id.strip(), None) is not None

              def get(self, service_id: str) -> ServiceRecord:
                  return self._records[service_id.strip()]

              def find_by_capability(
                  self,
                  capability: str,
              ) -> tuple[ServiceRecord, ...]:
                  capability = capability.strip()
                  return tuple(
                      record
                      for record in self._records.values()
                      if capability in record.capabilities
                  )

              def all(self) -> tuple[ServiceRecord, ...]:
                  return tuple(self._records.values())


          __all__ = ["ServiceRecord", "ServiceDiscovery"]
          PY

          cat > protocol/discovery/__init__.py <<'PY'
          from .discovery import ServiceDiscovery, ServiceRecord

          __all__ = ["ServiceRecord", "ServiceDiscovery"]
          PY

      - name: Encoding
        run: |
          set -euo pipefail

          cat > protocol/encoding/encoding.py <<'PY'
          from __future__ import annotations

          import json
          from typing import Any, Mapping


          class ProtocolEncodingError(ValueError):
              """Raised when protocol data cannot be encoded or decoded."""


          class JSONCodec:
              """Canonical deterministic JSON codec for protocol messages."""

              @staticmethod
              def encode(value: Mapping[str, Any]) -> bytes:
                  try:
                      return json.dumps(
                          value,
                          sort_keys=True,
                          separators=(",", ":"),
                          ensure_ascii=False,
                      ).encode("utf-8")
                  except (TypeError, ValueError) as exc:
                      raise ProtocolEncodingError(
                          "Unable to encode protocol payload"
                      ) from exc

              @staticmethod
              def decode(data: bytes) -> dict[str, Any]:
                  if not isinstance(data, bytes):
                      raise ProtocolEncodingError("Encoded data must be bytes")

                  try:
                      value = json.loads(data.decode("utf-8"))
                  except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                      raise ProtocolEncodingError(
                          "Unable to decode protocol payload"
                      ) from exc

                  if not isinstance(value, dict):
                      raise ProtocolEncodingError(
                          "Protocol payload root must be an object"
                      )

                  return value


          __all__ = ["JSONCodec", "ProtocolEncodingError"]
          PY

          cat > protocol/encoding/__init__.py <<'PY'
          from .encoding import JSONCodec, ProtocolEncodingError

          __all__ = ["JSONCodec", "ProtocolEncodingError"]
          PY

      - name: Events
        run: |
          set -euo pipefail

          cat > protocol/events/events.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from typing import Any, Mapping
          from uuid import UUID, uuid4


          @dataclass(frozen=True, slots=True)
          class ProtocolEvent:
              name: str
              source: str
              payload: Mapping[str, Any] = field(default_factory=dict)
              event_id: UUID = field(default_factory=uuid4)
              created_at: datetime = field(
                  default_factory=lambda: datetime.now(timezone.utc)
              )

              def __post_init__(self) -> None:
                  if not self.name.strip():
                      raise ValueError("Event name cannot be empty")
                  if not self.source.strip():
                      raise ValueError("Event source cannot be empty")

                  object.__setattr__(self, "payload", dict(self.payload))


          class EventBus:
              def __init__(self) -> None:
                  self._handlers: dict[str, list] = {}

              def subscribe(self, event_name: str, handler) -> None:
                  if not callable(handler):
                      raise TypeError("Event handler must be callable")

                  name = event_name.strip()

                  if not name:
                      raise ValueError("Event name cannot be empty")

                  handlers = self._handlers.setdefault(name, [])

                  if handler not in handlers:
                      handlers.append(handler)

              def unsubscribe(self, event_name: str, handler) -> bool:
                  handlers = self._handlers.get(event_name.strip())

                  if not handlers or handler not in handlers:
                      return False

                  handlers.remove(handler)

                  if not handlers:
                      self._handlers.pop(event_name.strip(), None)

                  return True

              def publish(self, event: ProtocolEvent) -> list[Any]:
                  handlers = tuple(
                      self._handlers.get(event.name, ())
                  )

                  return [
                      handler(event)
                      for handler in handlers
                  ]


          __all__ = ["ProtocolEvent", "EventBus"]
          PY

          cat > protocol/events/__init__.py <<'PY'
          from .events import EventBus, ProtocolEvent

          __all__ = ["ProtocolEvent", "EventBus"]
          PY

      - name: Gateway
        run: |
          set -euo pipefail

          cat > protocol/gateway/gateway.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Callable


          @dataclass(frozen=True, slots=True)
          class GatewayRoute:
              path: str
              handler: Callable
              methods: frozenset[str]

              def __post_init__(self) -> None:
                  if not self.path.startswith("/"):
                      raise ValueError("Gateway path must start with '/'")
                  if not callable(self.handler):
                      raise TypeError("Gateway handler must be callable")
                  if not self.methods:
                      raise ValueError("Gateway route requires a method")


          class ProtocolGateway:
              """Protocol boundary responsible for dispatching registered routes."""

              def __init__(self) -> None:
                  self._routes: dict[tuple[str, str], GatewayRoute] = {}

              def register(
                  self,
                  path: str,
                  handler: Callable,
                  methods: set[str] | frozenset[str],
              ) -> None:
                  normalized_methods = frozenset(
                      method.strip().upper()
                      for method in methods
                      if method.strip()
                  )

                  route = GatewayRoute(
                      path=path.strip(),
                      handler=handler,
                      methods=normalized_methods,
                  )

                  for method in normalized_methods:
                      key = (method, route.path)

                      if key in self._routes:
                          raise ValueError(f"Route already exists: {key}")

                      self._routes[key] = route

              def dispatch(
                  self,
                  method: str,
                  path: str,
                  *args,
                  **kwargs,
              ):
                  key = (method.strip().upper(), path.strip())

                  try:
                      route = self._routes[key]
                  except KeyError as exc:
                      raise LookupError(f"Route not found: {key}") from exc

                  return route.handler(*args, **kwargs)


          __all__ = ["GatewayRoute", "ProtocolGateway"]
          PY

          cat > protocol/gateway/__init__.py <<'PY'
          from .gateway import GatewayRoute, ProtocolGateway

          __all__ = ["GatewayRoute", "ProtocolGateway"]
          PY

      - name: Handshake
        run: |
          set -euo pipefail

          cat > protocol/handshake/handshake.py <<'PY'
          from __future__ import annotations

          import secrets
          from dataclasses import dataclass


          @dataclass(frozen=True, slots=True)
          class HandshakeRequest:
              protocol_version: str
              node_id: str
              nonce: str

              @classmethod
              def create(
                  cls,
                  protocol_version: str,
                  node_id: str,
              ) -> "HandshakeRequest":
                  if not protocol_version.strip():
                      raise ValueError("Protocol version cannot be empty")
                  if not node_id.strip():
                      raise ValueError("Node ID cannot be empty")

                  return cls(
                      protocol_version=protocol_version.strip(),
                      node_id=node_id.strip(),
                      nonce=secrets.token_urlsafe(24),
                  )


          @dataclass(frozen=True, slots=True)
          class HandshakeResponse:
              accepted: bool
              protocol_version: str
              node_id: str
              reason: str | None = None


          class HandshakeProcessor:
              def __init__(self, supported_versions: set[str]) -> None:
                  versions = frozenset(
                      version.strip()
                      for version in supported_versions
                      if version.strip()
                  )

                  if not versions:
                      raise ValueError(
                          "At least one protocol version is required"
                      )

                  self._supported_versions = versions

              def process(
                  self,
                  request: HandshakeRequest,
                  local_node_id: str,
              ) -> HandshakeResponse:
                  if request.protocol_version not in self._supported_versions:
                      return HandshakeResponse(
                          accepted=False,
                          protocol_version=request.protocol_version,
                          node_id=local_node_id,
                          reason="Unsupported protocol version",
                      )

                  if not local_node_id.strip():
                      raise ValueError("Local node ID cannot be empty")

                  return HandshakeResponse(
                      accepted=True,
                      protocol_version=request.protocol_version,
                      node_id=local_node_id.strip(),
                  )


          __all__ = [
              "HandshakeRequest",
              "HandshakeResponse",
              "HandshakeProcessor",
          ]
          PY

          cat > protocol/handshake/__init__.py <<'PY'
          from .handshake import (
              HandshakeProcessor,
              HandshakeRequest,
              HandshakeResponse,
          )

          __all__ = [
              "HandshakeRequest",
              "HandshakeResponse",
              "HandshakeProcessor",
          ]
          PY

      - name: Identity
        run: |
          set -euo pipefail

          cat > protocol/identity/identity.py <<'PY'
          from __future__ import annotations

          import hashlib
          import hmac
          from dataclasses import dataclass


          @dataclass(frozen=True, slots=True)
          class ProtocolIdentity:
              subject_id: str
              issuer_id: str
              fingerprint: str

              @classmethod
              def create(
                  cls,
                  subject_id: str,
                  issuer_id: str,
                  identity_material: bytes,
              ) -> "ProtocolIdentity":
                  if not subject_id.strip():
                      raise ValueError("Subject ID cannot be empty")
                  if not issuer_id.strip():
                      raise ValueError("Issuer ID cannot be empty")
                  if not identity_material:
                      raise ValueError("Identity material cannot be empty")

                  fingerprint = hashlib.sha256(
                      identity_material
                  ).hexdigest()

                  return cls(
                      subject_id=subject_id.strip(),
                      issuer_id=issuer_id.strip(),
                      fingerprint=fingerprint,
                  )


          class IdentityRegistry:
              def __init__(self) -> None:
                  self._identities: dict[str, ProtocolIdentity] = {}

              def register(self, identity: ProtocolIdentity) -> None:
                  if identity.subject_id in self._identities:
                      raise ValueError(
                          f"Identity already registered: "
                          f"{identity.subject_id}"
                      )

                  self._identities[identity.subject_id] = identity

              def resolve(self, subject_id: str) -> ProtocolIdentity:
                  return self._identities[subject_id.strip()]

              def verify(
                  self,
                  identity: ProtocolIdentity,
                  identity_material: bytes,
              ) -> bool:
                  expected = hashlib.sha256(
                      identity_material
                  ).hexdigest()

                  return (
                      hmac.compare_digest(
                          expected,
                          identity.fingerprint,
                      )
                      and identity.subject_id
                      in self._identities
                      and self._identities[identity.subject_id] == identity
                  )


          __all__ = ["ProtocolIdentity", "IdentityRegistry"]
          PY

          cat > protocol/identity/__init__.py <<'PY'
          from .identity import IdentityRegistry, ProtocolIdentity

          __all__ = ["ProtocolIdentity", "IdentityRegistry"]
          PY

      - name: Validate
        run: |
          set -euo pipefail

          python -m compileall -q \
            protocol/discovery \
            protocol/encoding \
            protocol/events \
            protocol/gateway \
            protocol/handshake \
            protocol/identity

          python - <<'PY'
          from protocol.discovery import ServiceDiscovery, ServiceRecord
          from protocol.encoding import JSONCodec
          from protocol.events import EventBus, ProtocolEvent
          from protocol.gateway import ProtocolGateway
          from protocol.handshake import HandshakeProcessor, HandshakeRequest
          from protocol.identity import IdentityRegistry, ProtocolIdentity

          discovery = ServiceDiscovery()
          record = ServiceRecord.create(
              "service-1",
              "https://node/service",
              "1.0.0",
              {"identity"},
          )
          discovery.register(record)
          assert discovery.get("service-1") == record

          encoded = JSONCodec.encode({"node": "n1", "active": True})
          assert JSONCodec.decode(encoded)["node"] == "n1"

          bus = EventBus()
          received = []
          bus.subscribe("NODE_READY", lambda event: received.append(event.name))
          bus.publish(ProtocolEvent("NODE_READY", "node-1"))
          assert received == ["NODE_READY"]

          gateway = ProtocolGateway()
          gateway.register(
              "/health",
              lambda: "ok",
              {"GET"},
          )
          assert gateway.dispatch("GET", "/health") == "ok"

          request = HandshakeRequest.create("1", "node-a")
          response = HandshakeProcessor({"1"}).process(request, "node-b")
          assert response.accepted is True

          identity = ProtocolIdentity.create(
              "subject-1",
              "issuer-1",
              b"identity-material",
          )
          identities = IdentityRegistry()
          identities.register(identity)
          assert identities.verify(identity, b"identity-material")

          print("Protocol block 02 validation: OK")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            protocol/discovery \
            protocol/encoding \
            protocol/events \
            protocol/gateway \
            protocol/handshake \
            protocol/identity

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Implement protocol core block 02"
          git push
