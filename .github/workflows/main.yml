          from __future__ import annotations

          import threading

          from ..core import (
              LifecycleError,
              ObservationConfig,
              ObservationContext,
              ObservationEvent,
          )
          from ..health.health import (
              HealthCheck,
              HealthRegistry,
          )
          from ..monitoring.monitoring import (
              MonitoringCoordinator,
          )
          from ..storage.storage import (
              SQLiteObservationStore,
          )


          class ObservabilityManager:
              """
              Composition root for the observability subsystem.

              It owns observability infrastructure only and intentionally
              does not import apps/.
              """

              def __init__(
                  self,
                  config: ObservationConfig,
              ):
                  self.config = config
                  self.policy = config.policy()

                  self.storage = (
                      SQLiteObservationStore(
                          config.storage_path
                      )
                  )

                  self.monitoring = (
                      MonitoringCoordinator(
                          policy=self.policy,
                          storage=self.storage,
                          worker_count=(
                              config.worker_count
                          ),
                      )
                  )

                  self.health = HealthRegistry()

                  self._lock = threading.RLock()
                  self._started = False

                  self.health.register(
                      HealthCheck(
                          "observability_storage",
                          self.storage.integrity_check,
                      )
                  )

              def start(self):
                  with self._lock:
                      if self._started:
                          return

                      self.monitoring.start()
                      self._started = True

              def stop(self):
                  with self._lock:
                      if not self._started:
                          return

                  self.monitoring.stop(
                      self.config.shutdown_timeout_seconds
                  )

                  with self._lock:
                      self.storage.close()
                      self._started = False

              def emit(
                  self,
                  component,
                  operation,
                  event_type,
                  payload=None,
                  *,
                  severity="info",
                  labels=None,
              ):
                  with self._lock:
                      if not self._started:
                          raise LifecycleError(
                              "observability manager "
                              "is not started"
                          )

                  context = (
                      ObservationContext.create(
                          component,
                          operation,
                          labels=labels,
                      )
                  )

                  sanitized = (
                      self.policy.redact(
                          payload or {}
                      )
                  )

                  event = (
                      ObservationEvent.create(
                          event_type,
                          context,
                          sanitized,
                          severity=severity,
                      )
                  )

                  accepted = (
                      self.monitoring.emit(
                          event
                      )
                  )

                  if not accepted:
                      raise LifecycleError(
                          "observation queue is full "
                          "or closed"
                      )

                  return event

              def status(self):
                  return {
                      "service":
                          self.config.service_name,
                      "environment":
                          self.config.environment,
                      "started":
                          self._started,
                      "monitoring":
                          self.monitoring.health(),
                      "health":
                          self.health.report(),
                  }

              def __enter__(self):
                  self.start()
                  return self

              def __exit__(
                  self,
                  exc_type,
                  exc_value,
                  traceback,
              ):
                  self.stop()


          __all__ = [
              "ObservabilityManager",
          ]
          PY

