          from __future__ import annotations

          import json
          import sqlite3
          import threading
          import time
          from pathlib import Path

          from ..core import (
              ObservationEvent,
              PersistenceError,
              SCHEMA_VERSION,
              digest,
              stable_json,
          )


          class SQLiteObservationStore:
              """
              Durable observation store.

              Properties:
              - SQLite WAL.
              - FULL synchronous commits.
              - Foreign keys enabled.
              - Explicit schema version.
              - Unique event IDs.
              - Transactional inserts.
              - Idempotent writes.
              - Indexed temporal queries.
              - Correlation and trace indexes.
              - Retention deletion.
              - Integrity checking.
              - Thread-safe connection ownership.
              """

              def __init__(
                  self,
                  path,
                  *,
                  timeout=30.0,
              ):
                  if not path:
                      raise PersistenceError(
                          "storage path is required"
                      )

                  self.path = str(
                      Path(path).expanduser()
                  )

                  parent = Path(
                      self.path
                  ).parent

                  parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  self._lock = threading.RLock()
                  self._closed = False

                  try:
                      self._db = sqlite3.connect(
                          self.path,
                          timeout=timeout,
                          check_same_thread=False,
                      )

                      self._db.row_factory = (
                          sqlite3.Row
                      )

                      self._configure()
                      self._migrate()

                  except sqlite3.Error as exc:
                      raise PersistenceError(
                          str(exc)
                      ) from exc

              def _configure(self):
                  for statement in (
                      "PRAGMA journal_mode=WAL",
                      "PRAGMA synchronous=FULL",
                      "PRAGMA foreign_keys=ON",
                      "PRAGMA busy_timeout=30000",
                      "PRAGMA temp_store=MEMORY",
                  ):
                      self._db.execute(
                          statement
                      )

              def _migrate(self):
                  with self._db:
                      self._db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS
                          schema_version (
                              version INTEGER NOT NULL,
                              upgraded_at_ns
                                  INTEGER NOT NULL
                          )
                          """
                      )

                      row = self._db.execute(
                          """
                          SELECT version
                          FROM schema_version
                          ORDER BY upgraded_at_ns DESC
                          LIMIT 1
                          """
                      ).fetchone()

                      if row is not None:
                          version = int(
                              row["version"]
                          )

                          if (
                              version
                              > SCHEMA_VERSION
                          ):
                              raise PersistenceError(
                                  "database schema is newer "
                                  "than runtime"
                              )

                      if row is None:
                          self._db.execute(
                              """
                              INSERT INTO schema_version
                              (version, upgraded_at_ns)
                              VALUES (?, ?)
                              """,
                              (
                                  SCHEMA_VERSION,
                                  time.time_ns(),
                              ),
                          )

                      self._db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS
                          observations (
                              sequence
                                  INTEGER PRIMARY KEY
                                  AUTOINCREMENT,
                              event_id
                                  TEXT NOT NULL UNIQUE,
                              event_type
                                  TEXT NOT NULL,
                              timestamp_ns
                                  INTEGER NOT NULL,
                              severity
                                  TEXT NOT NULL,
                              correlation_id
                                  TEXT NOT NULL,
                              trace_id
                                  TEXT NOT NULL,
                              span_id
                                  TEXT NOT NULL,
                              payload_json
                                  TEXT NOT NULL,
                              event_json
                                  TEXT NOT NULL,
                              content_digest
                                  TEXT NOT NULL
                          )
                          """
                      )

                      self._db.execute(
                          """
                          CREATE INDEX IF NOT EXISTS
                          idx_observations_timestamp
                          ON observations(timestamp_ns)
                          """
                      )

                      self._db.execute(
                          """
                          CREATE INDEX IF NOT EXISTS
                          idx_observations_type_time
                          ON observations(
                              event_type,
                              timestamp_ns
                          )
                          """
                      )

                      self._db.execute(
                          """
                          CREATE INDEX IF NOT EXISTS
                          idx_observations_correlation
                          ON observations(
                              correlation_id
                          )
                          """
                      )

                      self._db.execute(
                          """
                          CREATE INDEX IF NOT EXISTS
                          idx_observations_trace
                          ON observations(trace_id)
                          """
                      )

              def _ensure_open(self):
                  if self._closed:
                      raise PersistenceError(
                          "observation store is closed"
