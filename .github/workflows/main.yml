          from __future__ import annotations

          from datetime import datetime, timezone

          import pytest

          from shared_engines.ai.errors import IdempotencyConflict
          from shared_engines.ai.models import AIRequest


          def make_request(request_id: str, value: str = "hello") -> AIRequest:
              return AIRequest(
                  request_id=request_id,
                  idempotency_key=f"idem-{request_id}",
                  provider="test-provider",
                  model="test-model",
                  input_payload={"value": value},
                  created_at=datetime.now(timezone.utc),
              )


          def test_complete_request(engine):
              instance, provider = engine

              response = instance.submit(make_request("r1"))

              assert response.request_id == "r1"
              assert response.provider_request_id == "provider-r1"
              assert provider.calls == 1


          def test_idempotent_replay(engine):
              instance, provider = engine
              request = make_request("r2")

              first = instance.submit(request)
              second = instance.submit(request)

              assert first.provider_request_id == second.provider_request_id
              assert provider.calls == 1


          def test_conflicting_idempotency(engine):
              instance, _ = engine

              first = make_request("r3", "one")
              instance.submit(first)

              second = AIRequest(
                  request_id="r4",
                  idempotency_key=first.idempotency_key,
                  provider="test-provider",
                  model="test-model",
                  input_payload={"value": "two"},
                  created_at=datetime.now(timezone.utc),
              )

              with pytest.raises(IdempotencyConflict):
                  instance.store.create_request(
                      request_id=second.request_id,
                      idempotency_key=second.idempotency_key,
                      request_hash=second.request_hash,
                      provider=second.provider,
                      model=second.model,
                      encrypted_input="x",
                      nonce="y",
                      key_version="v1",
                      now=datetime.now(timezone.utc).isoformat(),
                  )


          def test_database_integrity(engine):
              instance, _ = engine
              instance.submit(make_request("r5"))
              instance.verify_integrity()


          def test_backup(engine, tmp_path):
              instance, _ = engine
              instance.submit(make_request("r6"))

              destination = str(tmp_path / "backup.sqlite3")
              instance.backup(destination)

              from shared_engines.ai.backup import verify_sqlite_backup

              verify_sqlite_backup(destination)
          PY

