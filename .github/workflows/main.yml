name: Crear carpetas de Semilla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear estructura completa en apps/semilla
        run: |
          mkdir -p apps/semilla/domain/{academic,admissions,analytics,attendance,certification,classroom,curriculum,education_ai,evaluation,family,finance,government,innovation,institution,laboratory,learning,library,management,psychology,reports,research,scholarship,security,student,teacher,transportation,zyra_education_core}
          mkdir -p apps/semilla/events/{academic,admissions,attendance,certification,curriculum,evaluation,finance,government,institution,learning,notifications,psychology,scholarship,security,student,teacher,system}
          mkdir -p apps/semilla/infrastructure/{api,cache,database,messaging,network,persistence,providers,repositories,security,services,storage}
          mkdir -p apps/semilla/modules/{academic,admissions,analytics,attendance,certification,classroom,curriculum,evaluation,family,finance,government,innovation,institution,laboratory,learning,library,management,psychology,reports,research,scholarship,security,student,teacher,transportation,zyra_education_core}
          mkdir -p apps/semilla/permissions/{administration,academic,admissions,certification,classroom,curriculum,family,finance,government,institution,laboratory,learning,library,psychology,roles,scholarship,security,student,teacher,users}
          mkdir -p apps/semilla/registry/{engines,events,institutions,menus,modules,permissions,roles,routes,schools,services,students,teachers,templates}
          mkdir -p apps/semilla/routers/{academic,admissions,analytics,attendance,certification,classroom,curriculum,evaluation,finance,government,institution,learning,library,psychology,reports,scholarship,security,student,teacher,system}
          mkdir -p apps/semilla/schemas/{academic,admissions,certification,classroom,curriculum,evaluation,finance,government,institution,learning,library,psychology,reports,scholarship,security,student,teacher,users}
          find apps/semilla -type d -exec touch {}/__init__.py \;

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Estructura adicional de permisos, registro, routers y esquemas en semilla"
          git push origin main
