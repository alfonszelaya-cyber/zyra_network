          from __future__ import annotations

          import json
          import threading


          class Exporter:
              def export(self, records):
                  raise NotImplementedError


          class MemoryExporter(Exporter):
              def __init__(
                  self,
                  *,
                  capacity=10_000,
              ):
                  if capacity < 1:
                      raise ValueError(
                          "capacity must be positive"
                      )

                  self.capacity = capacity
                  self._lock = threading.RLock()
                  self._records = []

              def export(self, records):
                  records = list(records)

                  with self._lock:
                      for record in records:
                          if (
                              len(self._records)
                              >= self.capacity
                          ):
                              self._records.pop(0)

                          self._records.append(
                              record
                          )

                  return len(records)

              def records(self):
                  with self._lock:
                      return list(
                          self._records
                      )


          class JSONExporter(Exporter):
              def export(self, records):
                  return json.dumps(
                      list(records),
                      ensure_ascii=False,
                      sort_keys=True,
                      default=str,
                  )


          __all__ = [
              "Exporter",
              "MemoryExporter",
              "JSONExporter",
