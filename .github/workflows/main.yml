      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pytest pytest-xdist mypy flake8

      - name: Compile
        run: |
          python -m compileall -q shared_engines/ai

      - name: Reject empty Python files
        shell: bash
        run: |
          set -euo pipefail
          if find shared_engines/ai -type f -name '*.py' -empty | grep -q .; then
            echo "ERROR: empty Python file detected"
            find shared_engines/ai -type f -name '*.py' -empty
            exit 1
          fi

      - name: Reject forbidden placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            '(^|[^A-Za-z])(TODO|FIXME|NotImplementedError|stub|mock|dummy)([^A-Za-z]|$)' \
            shared_engines/ai \
            --exclude-dir=__pycache__; then
            echo "ERROR: forbidden placeholder detected"
            exit 1
          fi

      - name: Verify engine isolation
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            '(^|/|[[:space:]])apps([/._]|$)' \
            shared_engines/ai \
            --exclude-dir=__pycache__; then
            echo "ERROR: shared_engines/ai references apps/"
            exit 1
          fi

      - name: Verify Python imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path("shared_engines/ai")

          for path in root.rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))

              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  else:
                      continue

                  for name in names:
                      if name.startswith("apps"):
                          raise SystemExit(
                              f"Forbidden apps import in {path}: {name}"
                          )
          PY

