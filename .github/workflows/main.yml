name: ZYRA - Foundation Core Primitives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Foundation Core
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            foundation/constants \
            foundation/exceptions \
            foundation/hooks \
            foundation/metadata \
            foundation/types \
            foundation/version

          cat > foundation/constants/constants.py <<'PY'
          from __future__ import annotations

          from enum import StrEnum


          class Environment(StrEnum):
              DEVELOPMENT = "development"
              TESTING = "testing"
              STAGING = "staging"
              PRODUCTION = "production"


          class ComponentStatus(StrEnum):
              CREATED = "created"
              STARTING = "starting"
              RUNNING = "running"
              DEGRADED = "degraded"
              STOPPING = "stopping"
              STOPPED = "stopped"
              FAILED = "failed"


          class HealthStatus(StrEnum):
              HEALTHY = "healthy"
              DEGRADED = "degraded"
              UNAVAILABLE = "unavailable"


          class OperationStatus(StrEnum):
              PENDING = "pending"
              RUNNING = "running"
              SUCCEEDED = "succeeded"
              FAILED = "failed"
              CANCELLED = "cancelled"


          NETWORK_NAME = "ZYRA_NETWORK"
          NETWORK_PROTOCOL_VERSION = 1
          NETWORK_API_VERSION = "v1"

          DEFAULT_HOST = "0.0.0.0"
          DEFAULT_PORT = 8000

          DEFAULT_REQUEST_TIMEOUT_SECONDS = 30.0
          DEFAULT_SHUTDOWN_TIMEOUT_SECONDS = 30.0

          DEFAULT_HEARTBEAT_INTERVAL_SECONDS = 5.0
          DEFAULT_HEARTBEAT_TIMEOUT_SECONDS = 15.0

          MAX_IDENTIFIER_LENGTH = 256
          MAX_METADATA_KEYS = 256
          MAX_METADATA_VALUE_LENGTH = 4096
          PY

          cat > foundation/constants/__init__.py <<'PY'
          from .constants import (
              Environment,
              ComponentStatus,
              HealthStatus,
              OperationStatus,
              NETWORK_NAME,
              NETWORK_PROTOCOL_VERSION,
              NETWORK_API_VERSION,
              DEFAULT_HOST,
              DEFAULT_PORT,
              DEFAULT_REQUEST_TIMEOUT_SECONDS,
              DEFAULT_SHUTDOWN_TIMEOUT_SECONDS,
              DEFAULT_HEARTBEAT_INTERVAL_SECONDS,
              DEFAULT_HEARTBEAT_TIMEOUT_SECONDS,
              MAX_IDENTIFIER_LENGTH,
              MAX_METADATA_KEYS,
              MAX_METADATA_VALUE_LENGTH,
          )

          __all__ = [
              "Environment",
              "ComponentStatus",
              "HealthStatus",
              "OperationStatus",
              "NETWORK_NAME",
              "NETWORK_PROTOCOL_VERSION",
              "NETWORK_API_VERSION",
              "DEFAULT_HOST",
              "DEFAULT_PORT",
              "DEFAULT_REQUEST_TIMEOUT_SECONDS",
              "DEFAULT_SHUTDOWN_TIMEOUT_SECONDS",
              "DEFAULT_HEARTBEAT_INTERVAL_SECONDS",
              "DEFAULT_HEARTBEAT_TIMEOUT_SECONDS",
              "MAX_IDENTIFIER_LENGTH",
              "MAX_METADATA_KEYS",
              "MAX_METADATA_VALUE_LENGTH",
          ]
          PY

          cat > foundation/exceptions/exceptions.py <<'PY'
          from __future__ import annotations


          class ZyraError(Exception):
              """Base exception for all controlled ZYRA failures."""

              code = "ZYRA_ERROR"

              def __init__(
                  self,
                  message: str,
                  *,
                  details: dict[str, object] | None = None,
              ) -> None:
                  super().__init__(message)
                  self.message = message
                  self.details = details or {}

              def to_dict(self) -> dict[str, object]:
                  return {
                      "code": self.code,
                      "message": self.message,
                      "details": dict(self.details),
                  }


          class ConfigurationError(ZyraError):
              code = "CONFIGURATION_ERROR"


          class ValidationError(ZyraError):
              code = "VALIDATION_ERROR"


          class AuthenticationError(ZyraError):
              code = "AUTHENTICATION_ERROR"


          class AuthorizationError(ZyraError):
              code = "AUTHORIZATION_ERROR"


          class NotFoundError(ZyraError):
              code = "NOT_FOUND"


          class ConflictError(ZyraError):
              code = "CONFLICT"


          class LifecycleError(ZyraError):
              code = "LIFECYCLE_ERROR"


          class NetworkError(ZyraError):
              code = "NETWORK_ERROR"


          class TransportError(NetworkError):
              code = "TRANSPORT_ERROR"


          class TimeoutError(NetworkError):
              code = "TIMEOUT"


          class StorageError(ZyraError):
              code = "STORAGE_ERROR"


          class IntegrityError(ZyraError):
              code = "INTEGRITY_ERROR"


          class SecurityError(ZyraError):
              code = "SECURITY_ERROR"


          class DependencyError(ZyraError):
              code = "DEPENDENCY_ERROR"


          class RateLimitError(ZyraError):
              code = "RATE_LIMIT"


          class ServiceUnavailableError(ZyraError):
              code = "SERVICE_UNAVAILABLE"
          PY

          cat > foundation/exceptions/__init__.py <<'PY'
          from .exceptions import (
              ZyraError,
              ConfigurationError,
              ValidationError,
              AuthenticationError,
              AuthorizationError,
              NotFoundError,
              ConflictError,
              LifecycleError,
              NetworkError,
              TransportError,
              TimeoutError,
              StorageError,
              IntegrityError,
              SecurityError,
              DependencyError,
              RateLimitError,
              ServiceUnavailableError,
          )

          __all__ = [
              "ZyraError",
              "ConfigurationError",
              "ValidationError",
              "AuthenticationError",
              "AuthorizationError",
              "NotFoundError",
              "ConflictError",
              "LifecycleError",
              "NetworkError",
              "TransportError",
              "TimeoutError",
              "StorageError",
              "IntegrityError",
              "SecurityError",
              "DependencyError",
              "RateLimitError",
              "ServiceUnavailableError",
          ]
          PY

          cat > foundation/hooks/hooks.py <<'PY'
          from __future__ import annotations

          from collections import defaultdict
          from threading import RLock
          from typing import Any, Callable


          Hook = Callable[..., Any]


          class HookRegistry:
              """
              Thread-safe lifecycle/event hook registry.

              Hooks are intentionally synchronous at this foundation layer.
              Async orchestration belongs to the Network event subsystem.
              """

              def __init__(self) -> None:
                  self._hooks: dict[str, list[Hook]] = defaultdict(list)
                  self._lock = RLock()

              def register(
                  self,
                  event: str,
                  callback: Hook,
              ) -> None:
                  if not event.strip():
                      raise ValueError("event cannot be empty")

                  if not callable(callback):
                      raise TypeError("callback must be callable")

                  with self._lock:
                      if callback not in self._hooks[event]:
                          self._hooks[event].append(callback)

              def unregister(
                  self,
                  event: str,
                  callback: Hook,
              ) -> None:
                  with self._lock:
                      callbacks = self._hooks.get(event)

                      if not callbacks:
                          return

                      if callback in callbacks:
                          callbacks.remove(callback)

                      if not callbacks:
                          self._hooks.pop(event, None)

              def emit(
                  self,
                  event: str,
                  **payload: Any,
              ) -> list[Any]:
                  with self._lock:
                      callbacks = tuple(
                          self._hooks.get(event, ())
                      )

                  results: list[Any] = []

                  for callback in callbacks:
                      results.append(callback(**payload))

                  return results

              def events(self) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(sorted(self._hooks))

              def clear(self) -> None:
                  with self._lock:
                      self._hooks.clear()
          PY

          cat > foundation/hooks/__init__.py <<'PY'
          from .hooks import Hook, HookRegistry

          __all__ = [
              "Hook",
              "HookRegistry",
          ]
          PY

          cat > foundation/metadata/metadata.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from types import MappingProxyType
          from typing import Any, Mapping


          @dataclass(frozen=True, slots=True)
          class Metadata:
              """
              Immutable metadata attached to Network components and records.
              """

              name: str
              component_type: str
              version: str
              created_at: datetime = field(
                  default_factory=lambda:
                      datetime.now(timezone.utc)
              )
              attributes: Mapping[str, Any] = field(
                  default_factory=dict
              )

              def __post_init__(self) -> None:
                  if not self.name.strip():
                      raise ValueError("name cannot be empty")

                  if not self.component_type.strip():
                      raise ValueError(
                          "component_type cannot be empty"
                      )

                  if not self.version.strip():
                      raise ValueError(
                          "version cannot be empty"
                      )

                  if self.created_at.tzinfo is None:
                      raise ValueError(
                          "created_at must be timezone-aware"
                      )

                  object.__setattr__(
                      self,
                      "attributes",
                      MappingProxyType(
                          dict(self.attributes)
                      ),
                  )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "name": self.name,
                      "component_type": self.component_type,
                      "version": self.version,
                      "created_at":
                          self.created_at.isoformat(),
                      "attributes":
                          dict(self.attributes),
                  }

              def with_attribute(
                  self,
                  key: str,
                  value: Any,
              ) -> "Metadata":
                  updated = dict(self.attributes)
                  updated[key] = value

                  return Metadata(
                      name=self.name,
                      component_type=self.component_type,
                      version=self.version,
                      created_at=self.created_at,
                      attributes=updated,
                  )
          PY

          cat > foundation/metadata/__init__.py <<'PY'
          from .metadata import Metadata

          __all__ = [
              "Metadata",
          ]
          PY

          cat > foundation/types/types.py <<'PY'
          from __future__ import annotations

          from typing import NewType, TypeAlias


          EntityId = NewType("EntityId", str)
          NodeId = NewType("NodeId", str)
          TenantId = NewType("TenantId", str)
          PrincipalId = NewType("PrincipalId", str)
          RequestId = NewType("RequestId", str)
          CorrelationId = NewType("CorrelationId", str)
          EventId = NewType("EventId", str)
          SessionId = NewType("SessionId", str)

          JSONPrimitive: TypeAlias = (
              str | int | float | bool | None
          )

          JSONValue: TypeAlias = (
              JSONPrimitive
              | list["JSONValue"]
              | dict[str, "JSONValue"]
          )

          Headers: TypeAlias = dict[str, str]
          Attributes: TypeAlias = dict[str, JSONValue]
          PY

          cat > foundation/types/__init__.py <<'PY'
          from .types import (
              EntityId,
              NodeId,
              TenantId,
              PrincipalId,
              RequestId,
              CorrelationId,
              EventId,
              SessionId,
              JSONPrimitive,
              JSONValue,
              Headers,
              Attributes,
          )

          __all__ = [
              "EntityId",
              "NodeId",
              "TenantId",
              "PrincipalId",
              "RequestId",
              "CorrelationId",
              "EventId",
              "SessionId",
              "JSONPrimitive",
              "JSONValue",
              "Headers",
              "Attributes",
          ]
          PY

          cat > foundation/version/version.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass


          @dataclass(frozen=True, order=True, slots=True)
          class Version:
              """
              Semantic version representation.

              Supports stable ordering and explicit compatibility checks.
              """

              major: int
              minor: int
              patch: int

              def __post_init__(self) -> None:
                  if min(
                      self.major,
                      self.minor,
                      self.patch,
                  ) < 0:
                      raise ValueError(
                          "Version components cannot be negative"
                      )

              def __str__(self) -> str:
                  return (
                      f"{self.major}."
                      f"{self.minor}."
                      f"{self.patch}"
                  )

              @classmethod
              def parse(cls, value: str) -> "Version":
                  parts = value.strip().split(".")

                  if len(parts) != 3:
                      raise ValueError(
                          "Version must be MAJOR.MINOR.PATCH"
                      )

                  try:
                      numbers = tuple(
                          int(part)
                          for part in parts
                      )
                  except ValueError as exc:
                      raise ValueError(
                          "Version contains non-numeric components"
                      ) from exc

                  return cls(*numbers)

              def compatible_with(
                  self,
                  other: "Version",
              ) -> bool:
                  return self.major == other.major


          FOUNDATION_VERSION = Version(1, 0, 0)
          NETWORK_VERSION = Version(1, 0, 0)
          PROTOCOL_VERSION = Version(1, 0, 0)
          PY

          cat > foundation/version/__init__.py <<'PY'
          from .version import (
              Version,
              FOUNDATION_VERSION,
              NETWORK_VERSION,
              PROTOCOL_VERSION,
          )

          __all__ = [
              "Version",
              "FOUNDATION_VERSION",
              "NETWORK_VERSION",
              "PROTOCOL_VERSION",
          ]
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from foundation.constants import (
              Environment,
              ComponentStatus,
              NETWORK_PROTOCOL_VERSION,
          )
          from foundation.exceptions import (
              ZyraError,
              ValidationError,
          )
          from foundation.hooks import HookRegistry
          from foundation.metadata import Metadata
          from foundation.types import EntityId
          from foundation.version import Version

          assert Environment.PRODUCTION.value == "production"
          assert ComponentStatus.RUNNING.value == "running"
          assert NETWORK_PROTOCOL_VERSION >= 1

          hooks = HookRegistry()
          received = []

          hooks.register(
              "test",
              lambda **payload: received.append(payload),
          )

          hooks.emit(
              "test",
              value=123,
          )

          assert received == [{"value": 123}]

          metadata = Metadata(
              name="zyra-network",
              component_type="network",
              version="1.0.0",
          )

          assert metadata.to_dict()["name"] == "zyra-network"

          version = Version.parse("1.2.3")

          assert str(version) == "1.2.3"
          assert version.compatible_with(
              Version(1, 9, 0)
          )

          entity = EntityId("person_001")

          assert entity == "person_001"

          error = ValidationError("invalid value")

          assert isinstance(error, ZyraError)
          assert error.to_dict()["code"] == "VALIDATION_ERROR"

          print("FOUNDATION CORE PRIMITIVES: OK")
          PY

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            foundation/constants \
            foundation/exceptions \
            foundation/hooks \
            foundation/metadata \
            foundation/types \
            foundation/version

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ZYRA Network"
          git config user.email "actions@users.noreply.github.com"

          git add \
            foundation/constants \
            foundation/exceptions \
            foundation/hooks \
            foundation/metadata \
            foundation/types \
            foundation/version

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "feat: production foundation core primitives"
          git push
