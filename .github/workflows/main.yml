name: Crear carpetas de Axis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reiniciar y crear estructura limpia en apps/axis
        run: |
          # Eliminar la carpeta axis existente si hubiera alguna para reiniciar limpia
          rm -rf apps/axis
          mkdir -p apps/axis

          # Application
          mkdir -p apps/axis/application/{administration_use_cases,analytics_use_cases,biometrics_use_cases,border_control_use_cases,citizen_use_cases,civil_registry_use_cases,court_use_cases,criminal_use_cases,digital_identity_use_cases,emergency_use_cases,evidence_use_cases,forensic_use_cases,government_use_cases,health_use_cases,immigration_use_cases,intelligence_use_cases,justice_use_cases,police_use_cases,prison_use_cases,public_security_use_cases,reports_use_cases,risk_use_cases,surveillance_use_cases,zyra_security_use_cases}

          # Assets
          mkdir -p apps/axis/assets/{audio,badges,documents,fonts,icons,images,logos,templates,translations,videos}

          # Config
          mkdir -p apps/axis/config/{application,database,events,modules,network,permissions,registry,routes,security,system}

          # Constants
          mkdir -p apps/axis/constants/{biometrics,government,health,identity,justice,police,security,system}

          # Domain
          mkdir -p apps/axis/domain/{administration,analytics,biometrics,border_control,citizen,civil_registry,court,criminal,digital_identity,emergency,evidence,forensic,government,health,immigration,intelligence,justice,police,prison,public_security,reports,risk,surveillance,zyra_security_core}

          # Crear __init__.py en la raíz y cada subcarpeta de axis
          find apps/axis -type d -exec touch {}/__init__.py \;

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Estructura inicial limpia de axis (application, assets, config, constants, domain)"
          git push origin main
