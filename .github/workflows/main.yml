      - name: Validate messaging
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from infrastructure.messaging import (
              MessageBus,
              MessageQueue,
              MessageRegistry,
              MessageValidator,
              RetryManager,
              SubscriptionManager,
              TopicManager,
          )

          bus = MessageBus()
          received = []

          bus.subscribe(
              "network.health",
              lambda event: received.append(
                  event.payload["status"]
              ),
          )

          result = bus.publish(
              "network.health",
              {"status": "healthy"},
          )

          assert received == ["healthy"]
          assert result.topic == "network.health"

          queue = MessageQueue(max_size=2)
          queue.put("one")
          queue.put("two")

          assert queue.get() == "one"
          assert queue.get() == "two"

          registry = MessageRegistry()
          registry.register(
              "health",
              lambda value: value,
          )

          assert "health" in registry.names()

          subscriptions = SubscriptionManager()
          subscription_id = subscriptions.subscribe(
              "network",
              lambda value: value,
          )

          assert subscriptions.count() == 1
          assert subscriptions.unsubscribe(
              subscription_id
          ) is True

          topics = TopicManager()
          topic = topics.create(
              "network.events",
              durable=True,
              partitions=4,
          )

          assert topic.partitions == 4

          validator = MessageValidator()

          assert validator.validate(
              "health",
              {"ok": True},
          ).valid

          retry = RetryManager()

          assert retry.policy.max_attempts == 3

          print(
              "Infrastructure messaging validation: OK"
          )
          PY

      - name: Validate DNS
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from infrastructure.dns import (
              DNSCache,
              DNSEngine,
              DNSRecord,
              DNSRegistry,
              DNSValidator,
              Endpoint,
              EndpointDirectory,
              ServiceDiscovery,
              ServiceEndpoint,
          )

          validator = DNSValidator()

          assert (
              validator.validate_hostname(
                  "API.Example.COM."
              )
              == "api.example.com"
          )

          registry = DNSRegistry()

          registry.register(
              DNSRecord(
                  hostname="api.example.com",
                  addresses=("10.0.0.10",),
                  ttl_seconds=60,
              )
          )

          engine = DNSEngine(
              registry=registry
          )

          resolution = engine.resolve(
              "api.example.com"
          )

          assert resolution.source == "registry"
          assert resolution.addresses == (
              "10.0.0.10",
          )

          cache = DNSCache(
              capacity=10
          )

          cache.put(
              "cache.example.com",
              ("10.0.0.20",),
              60,
          )

          assert cache.get(
              "cache.example.com"
          ) == ("10.0.0.20",)

          discovery = ServiceDiscovery()

          endpoint = ServiceEndpoint(
              service="database",
              host="db.internal",
              port=5432,
              protocol="tcp",
              weight=100,
          )

          discovery.register(endpoint)

          assert discovery.resolve(
              "database"
          ) == (endpoint,)

          directory = EndpointDirectory()

          api_endpoint = Endpoint(
              name="api",
              address="127.0.0.1",
              port=8080,
              secure=True,
          )

          directory.register(api_endpoint)

          assert directory.get(
              "api"
          ) == api_endpoint

          print(
              "Infrastructure DNS validation: OK"
          )
          PY

      - name: Validate external services
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from infrastructure.external_services import (
              ConnectionPool,
              ExternalService,
              ServiceAdapter,
              ServiceGateway,
              ServiceHealthMonitor,
              ServiceMetrics,
              ServiceRegistry,
              ServiceRequest,
              ServiceResponse,
              ServiceTarget,
              ServiceValidator,
              TimeoutManager,
          )


          class TestAdapter(ServiceAdapter):
              def __init__(self):
                  self.closed = False

              def send(
                  self,
                  request: ServiceRequest,
              ) -> ServiceResponse:

                  return ServiceResponse(
                      status_code=200,
                      headers={
                          "content-type": "application/json"
                      },
                      body=b'{"status":"ok"}',
                  )

              def close(self) -> None:
                  self.closed = True


          validator = ServiceValidator()

          assert validator.validate_url(
              "https://example.com"
          ).valid

          adapter = TestAdapter()

          gateway = ServiceGateway()

          gateway.register(
              ServiceTarget(
                  name="example",
                  base_url="https://example.com",
                  adapter=adapter,
              )
          )

          response = gateway.send(
              "example",
              ServiceRequest(
                  method="GET",
                  path="/health",
                  headers={},
              ),
          )

          assert response.status_code == 200

          registry = ServiceRegistry()

          service = ExternalService(
              service_id="svc-1",
              name="example",
              endpoint="https://example.com",
          )

          registry.register(service)

          assert registry.get(
              "svc-1"
          ) == service

          health = ServiceHealthMonitor().evaluate(
              "svc-1",
              success=True,
              latency_ms=12.5,
          )

          assert health.healthy is True

          metrics = ServiceMetrics()

          metrics.record_request(
              bytes_sent=10
          )

          metrics.record_success(
              bytes_received=20
          )

          snapshot = metrics.snapshot()

          assert snapshot.requests == 1
          assert snapshot.successes == 1
          assert snapshot.bytes_sent == 10
          assert snapshot.bytes_received == 20

          timeout = TimeoutManager()

          assert timeout.connect_timeout() > 0

          class Connection:
              def __init__(self):
                  self.closed = False

              def close(self):
                  self.closed = True

          pool = ConnectionPool(
              Connection,
              max_size=2,
          )

          connection = pool.acquire()

          pool.release(connection)

          assert pool.stats().available == 1

          pool.close()

          assert pool.stats().closed is True

          gateway.close()

          assert adapter.closed is True

          print(
              "Infrastructure external services validation: OK"
          )
          PY

