name: Construir bloque de red 02

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-network-block-02:
    name: Build Network Block 02
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON PATH
      # ============================================================

      - name: Configure Python path
        shell: bash
        run: |
          set -euo pipefail
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      # ============================================================
      # BUILD NETWORK BLOCK 02
      # ============================================================

      - name: Build Network Block 02
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p network/routing
          mkdir -p network/load_balancer
          mkdir -p network/failover
          mkdir -p network/quorum
          mkdir -p network/replication
          mkdir -p network/firewall
          mkdir -p network/session
          mkdir -p network/diagnostics

          # ========================================================
          # ROUTING
          # ========================================================

          cat > network/routing/__init__.py <<'PY'
          """
          ZYRA Network routing layer.

          Routing consumes topology and service information but does not
          own transport, consensus or application business logic.
          """

          from .router import (
              Route,
              RouteDecision,
              RoutePolicy,
              RouteTable,
              Router,
          )

          __all__ = [
              "Route",
              "RouteDecision",
              "RoutePolicy",
              "RouteTable",
              "Router",
          ]
          PY

          cat > network/routing/router.py <<'PY'
          """
          Production routing primitives for ZYRA Network.

          The routing layer provides:
              - immutable route definitions
              - route policy
              - route tables
              - deterministic route selection
              - route health filtering

          It deliberately does not implement:
              - transport I/O
              - consensus
              - persistence
              - application authorization
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from enum import Enum
          from threading import RLock
          from typing import Mapping


          class RoutePolicy(str, Enum):
              DIRECT = "direct"
              LOWEST_COST = "lowest_cost"
              LOWEST_LATENCY = "lowest_latency"
              HIGHEST_CAPACITY = "highest_capacity"
              WEIGHTED = "weighted"


          @dataclass(frozen=True, slots=True)
          class Route:
              destination: str
              next_hop: str
              cost: float = 1.0
              latency_ms: float = 0.0
              capacity_bps: int = 1
              weight: int = 1
              healthy: bool = True
              metadata: Mapping[str, str] = field(
                  default_factory=dict
              )

              def __post_init__(self) -> None:
                  destination = self.destination.strip()
                  next_hop = self.next_hop.strip()

                  if not destination:
                      raise ValueError(
                          "route destination cannot be empty"
                      )

                  if not next_hop:
                      raise ValueError(
                          "route next_hop cannot be empty"
                      )

                  if self.cost < 0:
                      raise ValueError(
                          "route cost cannot be negative"
                      )

                  if self.latency_ms < 0:
                      raise ValueError(
                          "route latency cannot be negative"
                      )

                  if self.capacity_bps <= 0:
                      raise ValueError(
                          "route capacity must be positive"
                      )

                  if self.weight <= 0:
                      raise ValueError(
                          "route weight must be positive"
                      )

                  object.__setattr__(
                      self,
                      "destination",
                      destination,
                  )

                  object.__setattr__(
                      self,
                      "next_hop",
                      next_hop,
                  )

                  object.__setattr__(
                      self,
                      "metadata",
                      dict(self.metadata),
                  )


          @dataclass(frozen=True, slots=True)
          class RouteDecision:
              destination: str
              next_hop: str
              policy: RoutePolicy
              candidates: int


          class RouteTable:
              """Thread-safe route table."""

              def __init__(self) -> None:
                  self._routes: dict[
                      str,
                      dict[str, Route],
                  ] = {}

                  self._lock = RLock()

              def add(
                  self,
                  route: Route,
              ) -> None:
                  if not isinstance(
                      route,
                      Route,
                  ):
                      raise TypeError(
                          "route must be Route"
                      )

                  with self._lock:
                      destination = route.destination

                      bucket = self._routes.setdefault(
                          destination,
                          {},
                      )

                      if route.next_hop in bucket:
                          raise ValueError(
                              "route already exists: "
                              f"{destination} -> "
                              f"{route.next_hop}"
                          )

                      bucket[
                          route.next_hop
                      ] = route

              def replace(
                  self,
                  route: Route,
              ) -> None:
                  if not isinstance(
                      route,
                      Route,
                  ):
                      raise TypeError(
                          "route must be Route"
                      )

                  with self._lock:
                      self._routes.setdefault(
                          route.destination,
                          {},
                      )[
                          route.next_hop
                      ] = route

              def remove(
                  self,
                  destination: str,
                  next_hop: str,
              ) -> bool:
                  destination = destination.strip()
                  next_hop = next_hop.strip()

                  with self._lock:
                      bucket = self._routes.get(
                          destination
                      )

                      if bucket is None:
                          return False

                      removed = (
                          bucket.pop(
                              next_hop,
                              None,
                          )
                          is not None
                      )

                      if not bucket:
                          self._routes.pop(
                              destination,
                              None,
                          )

                      return removed

              def routes(
                  self,
                  destination: str,
                  *,
                  healthy_only: bool = True,
              ) -> tuple[Route, ...]:

                  destination = destination.strip()

                  with self._lock:
                      bucket = self._routes.get(
                          destination,
                          {},
                      )

                      values = tuple(
                          route
                          for route in bucket.values()
                          if (
                              not healthy_only
                              or route.healthy
                          )
                      )

                      return tuple(
                          sorted(
                              values,
                              key=lambda item: (
                                  item.cost,
                                  item.latency_ms,
                                  item.next_hop,
                              ),
                          )
                      )

              def set_health(
                  self,
                  destination: str,
                  next_hop: str,
                  healthy: bool,
              ) -> Route:

                  destination = destination.strip()
                  next_hop = next_hop.strip()

                  with self._lock:
                      bucket = self._routes.get(
                          destination
                      )

                      if bucket is None:
                          raise LookupError(
                              "destination not found: "
                              f"{destination}"
                          )

                      route = bucket.get(
                          next_hop
                      )

                      if route is None:
                          raise LookupError(
                              "next hop not found: "
                              f"{next_hop}"
                          )

                      updated = Route(
                          destination=route.destination,
                          next_hop=route.next_hop,
                          cost=route.cost,
                          latency_ms=route.latency_ms,
                          capacity_bps=route.capacity_bps,
                          weight=route.weight,
                          healthy=healthy,
                          metadata=route.metadata,
                      )

                      bucket[next_hop] = updated

                      return updated

              def destinations(
                  self,
              ) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(
                          sorted(
                              self._routes
                          )
                      )


          class Router:
              """
              Deterministic route selector.

              Selection is stateless and therefore safe to use concurrently.
              """

              def __init__(
                  self,
                  table: RouteTable,
              ) -> None:
                  if not isinstance(
                      table,
                      RouteTable,
                  ):
                      raise TypeError(
                          "table must be RouteTable"
                      )

                  self._table = table

              def select(
                  self,
                  destination: str,
                  *,
                  policy: RoutePolicy = (
                      RoutePolicy.LOWEST_COST
                  ),
              ) -> RouteDecision:

                  if not isinstance(
                      policy,
                      RoutePolicy,
                  ):
                      raise TypeError(
                          "policy must be RoutePolicy"
                      )

                  candidates = self._table.routes(
                      destination,
                      healthy_only=True,
                  )

                  if not candidates:
                      raise LookupError(
                          "no healthy route for destination: "
                          f"{destination}"
                      )

                  if policy is RoutePolicy.DIRECT:
                      selected = min(
                          candidates,
                          key=lambda item: (
                              0
                              if item.next_hop
                              == item.destination
                              else 1,
                              item.cost,
                              item.next_hop,
                          ),
                      )

                  elif policy is RoutePolicy.LOWEST_LATENCY:
                      selected = min(
                          candidates,
                          key=lambda item: (
                              item.latency_ms,
                              item.cost,
                              item.next_hop,
                          ),
                      )

                  elif policy is RoutePolicy.HIGHEST_CAPACITY:
                      selected = max(
                          candidates,
                          key=lambda item: (
                              item.capacity_bps,
                              -item.cost,
                              item.next_hop,
                          ),
                      )

                  elif policy is RoutePolicy.WEIGHTED:
                      selected = max(
                          candidates,
                          key=lambda item: (
                              item.weight,
                              -item.cost,
                              item.next_hop,
                          ),
                      )

                  else:
                      selected = min(
                          candidates,
                          key=lambda item: (
                              item.cost,
                              item.latency_ms,
                              item.next_hop,
                          ),
                      )

                  return RouteDecision(
                      destination=selected.destination,
                      next_hop=selected.next_hop,
                      policy=policy,
                      candidates=len(candidates),
                  )


          __all__ = [
              "RoutePolicy",
              "Route",
              "RouteDecision",
              "RouteTable",
              "Router",
          ]
          PY

          # ========================================================
          # LOAD BALANCER
          # ========================================================

          cat > network/load_balancer/__init__.py <<'PY'
          """ZYRA Network load balancing."""

          from .balancer import (
              Backend,
              BackendState,
              LoadBalancer,
              LoadBalancingPolicy,
          )

          __all__ = [
              "Backend",
              "BackendState",
              "LoadBalancer",
              "LoadBalancingPolicy",
          ]
          PY

          cat > network/load_balancer/balancer.py <<'PY'
          """
          Production load-balancing primitives.

          Supports deterministic policies without coupling Network to a
          specific proxy or cloud provider.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from enum import Enum
          from threading import RLock


          class BackendState(str, Enum):
              ACTIVE = "active"
              DRAINING = "draining"
              UNHEALTHY = "unhealthy"
              DISABLED = "disabled"


          class LoadBalancingPolicy(str, Enum):
              ROUND_ROBIN = "round_robin"
              LEAST_CONNECTIONS = "least_connections"
              WEIGHTED = "weighted"


          @dataclass(slots=True)
          class Backend:
              backend_id: str
              endpoint: str
              weight: int = 1
              state: BackendState = BackendState.ACTIVE
              connections: int = 0
              metadata: dict[str, str] = field(
                  default_factory=dict
              )

              def __post_init__(self) -> None:
                  self.backend_id = self.backend_id.strip()
                  self.endpoint = self.endpoint.strip()

                  if not self.backend_id:
                      raise ValueError(
                          "backend_id cannot be empty"
                      )

                  if not self.endpoint:
                      raise ValueError(
                          "backend endpoint cannot be empty"
                      )

                  if self.weight <= 0:
                      raise ValueError(
                          "backend weight must be positive"
                      )

                  if self.connections < 0:
                      raise ValueError(
                          "connections cannot be negative"
                      )


          class LoadBalancer:
              """Thread-safe backend selector."""

              def __init__(
                  self,
                  policy: LoadBalancingPolicy = (
                      LoadBalancingPolicy.ROUND_ROBIN
                  ),
              ) -> None:

                  if not isinstance(
                      policy,
                      LoadBalancingPolicy,
                  ):
                      raise TypeError(
                          "policy must be LoadBalancingPolicy"
                      )

                  self._policy = policy

                  self._backends: dict[
                      str,
                      Backend,
                  ] = {}

                  self._cursor = 0
                  self._lock = RLock()

              @property
              def policy(
                  self,
              ) -> LoadBalancingPolicy:
                  return self._policy

              def register(
                  self,
                  backend: Backend,
              ) -> None:

                  if not isinstance(
                      backend,
                      Backend,
                  ):
                      raise TypeError(
                          "backend must be Backend"
                      )

                  with self._lock:
                      if (
                          backend.backend_id
                          in self._backends
                      ):
                          raise ValueError(
                              "backend already exists: "
                              f"{backend.backend_id}"
                          )

                      self._backends[
                          backend.backend_id
                      ] = backend

              def unregister(
                  self,
                  backend_id: str,
              ) -> bool:

                  with self._lock:
                      return (
                          self._backends.pop(
                              backend_id.strip(),
                              None,
                          )
                          is not None
                      )

              def set_state(
                  self,
                  backend_id: str,
                  state: BackendState,
              ) -> Backend:

                  if not isinstance(
                      state,
                      BackendState,
                  ):
                      raise TypeError(
                          "state must be BackendState"
                      )

                  with self._lock:
                      backend = self._backends.get(
                          backend_id.strip()
                      )

                      if backend is None:
                          raise LookupError(
                              f"backend not found: "
                              f"{backend_id}"
                          )

                      backend.state = state

                      return backend

              def connection_open(
                  self,
                  backend_id: str,
              ) -> None:

                  with self._lock:
                      backend = self._backends.get(
                          backend_id.strip()
                      )

                      if backend is None:
                          raise LookupError(
                              f"backend not found: "
                              f"{backend_id}"
                          )

                      backend.connections += 1

              def connection_close(
                  self,
                  backend_id: str,
              ) -> None:

                  with self._lock:
                      backend = self._backends.get(
                          backend_id.strip()
                      )

                      if backend is None:
                          raise LookupError(
                              f"backend not found: "
                              f"{backend_id}"
                          )

                      if backend.connections == 0:
                          raise ValueError(
                              "backend connection count "
                              "cannot become negative"
                          )

                      backend.connections -= 1

              def select(
                  self,
              ) -> Backend:

                  with self._lock:
                      candidates = tuple(
                          backend
                          for backend
                          in self._backends.values()
                          if backend.state
                          is BackendState.ACTIVE
                      )

                      if not candidates:
                          raise LookupError(
                              "no active backends available"
                          )

                      ordered = tuple(
                          sorted(
                              candidates,
                              key=lambda item: (
                                  item.backend_id
                              ),
                          )
                      )

                      if self._policy is (
                          LoadBalancingPolicy.LEAST_CONNECTIONS
                      ):
                          return min(
                              ordered,
                              key=lambda item: (
                                  item.connections,
                                  item.backend_id,
                              ),
                          )

                      if self._policy is (
                          LoadBalancingPolicy.WEIGHTED
                      ):
                          selected = max(
                              ordered,
                              key=lambda item: (
                                  item.weight,
                                  -item.connections,
                                  item.backend_id,
                              ),
                          )

                          return selected

                      selected = ordered[
                          self._cursor
                          % len(ordered)
                      ]

                      self._cursor += 1

                      return selected

              def snapshot(
                  self,
              ) -> tuple[Backend, ...]:

                  with self._lock:
                      return tuple(
                          Backend(
                              backend_id=item.backend_id,
                              endpoint=item.endpoint,
                              weight=item.weight,
                              state=item.state,
                              connections=item.connections,
                              metadata=dict(
                                  item.metadata
                              ),
                          )
                          for item
                          in self._backends.values()
                      )


          __all__ = [
              "BackendState",
              "LoadBalancingPolicy",
              "Backend",
              "LoadBalancer",
          ]
          PY

          # ========================================================
          # FAILOVER
          # ========================================================

          cat > network/failover/__init__.py <<'PY'
          """ZYRA Network failover control."""

          from .failover import (
              FailoverAction,
              FailoverManager,
              FailoverState,
              FailoverTarget,
          )

          __all__ = [
              "FailoverAction",
              "FailoverManager",
              "FailoverState",
              "FailoverTarget",
          ]
          PY

          cat > network/failover/failover.py <<'PY'
          """
          Production failover state management.

          Failover decisions are explicit and auditable. This layer does
          not silently mutate routing tables or perform network I/O.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from enum import Enum
          from threading import RLock
          from time import monotonic
          from typing import Mapping


          class FailoverState(str, Enum):
              PRIMARY = "primary"
              STANDBY = "standby"
              FAILED = "failed"
              PROMOTED = "promoted"
              DISABLED = "disabled"


          class FailoverAction(str, Enum):
              PROMOTE = "promote"
              DEMOTE = "demote"
              MARK_FAILED = "mark_failed"
              RESTORE = "restore"


          @dataclass(slots=True)
          class FailoverTarget:
              target_id: str
              endpoint: str
              priority: int = 100
              state: FailoverState = FailoverState.STANDBY
              metadata: dict[str, str] = field(
                  default_factory=dict
              )
              changed_at: float = field(
                  default_factory=monotonic
              )

              def __post_init__(self) -> None:
                  self.target_id = self.target_id.strip()
                  self.endpoint = self.endpoint.strip()

                  if not self.target_id:
                      raise ValueError(
                          "target_id cannot be empty"
                      )

                  if not self.endpoint:
                      raise ValueError(
                          "failover endpoint cannot be empty"
                      )

                  if self.priority < 0:
                      raise ValueError(
                          "priority cannot be negative"
                      )


          class FailoverManager:
              """Thread-safe failover target manager."""

              def __init__(self) -> None:
                  self._targets: dict[
                      str,
                      FailoverTarget,
                  ] = {}

                  self._lock = RLock()

              def register(
                  self,
                  target: FailoverTarget,
              ) -> None:

                  if not isinstance(
                      target,
                      FailoverTarget,
                  ):
                      raise TypeError(
                          "target must be FailoverTarget"
                      )

                  with self._lock:
                      if target.target_id in self._targets:
                          raise ValueError(
                              "failover target already exists: "
                              f"{target.target_id}"
                          )

                      self._targets[
                          target.target_id
                      ] = target

              def action(
                  self,
                  target_id: str,
                  action: FailoverAction,
              ) -> FailoverTarget:

                  if not isinstance(
                      action,
                      FailoverAction,
                  ):
                      raise TypeError(
                          "action must be FailoverAction"
                      )

                  with self._lock:
                      target = self._targets.get(
                          target_id.strip()
                      )

                      if target is None:
                          raise LookupError(
                              f"failover target not found: "
                              f"{target_id}"
                          )

                      if action is FailoverAction.PROMOTE:
                          target.state = (
                              FailoverState.PROMOTED
                          )

                      elif action is FailoverAction.DEMOTE:
                          target.state = (
                              FailoverState.STANDBY
                          )

                      elif action is FailoverAction.MARK_FAILED:
                          target.state = (
                              FailoverState.FAILED
                          )

                      elif action is FailoverAction.RESTORE:
                          target.state = (
                              FailoverState.STANDBY
                          )

                      target.changed_at = monotonic()

                      return target

              def best_standby(
                  self,
              ) -> FailoverTarget:

                  with self._lock:
                      candidates = tuple(
                          target
                          for target
                          in self._targets.values()
                          if target.state
                          is FailoverState.STANDBY
                      )

                      if not candidates:
                          raise LookupError(
                              "no standby failover target available"
                          )

                      return min(
                          candidates,
                          key=lambda item: (
                              item.priority,
                              item.target_id,
                          ),
                      )

              def active_target(
                  self,
              ) -> FailoverTarget | None:

                  with self._lock:
                      promoted = tuple(
                          target
                          for target
                          in self._targets.values()
                          if target.state
                          is FailoverState.PROMOTED
                      )

                      if not promoted:
                          return None

                      return min(
                          promoted,
                          key=lambda item: (
                              item.priority,
                              item.target_id,
                          ),
                      )

              def snapshot(
                  self,
              ) -> tuple[FailoverTarget, ...]:

                  with self._lock:
                      return tuple(
                          FailoverTarget(
                              target_id=item.target_id,
                              endpoint=item.endpoint,
                              priority=item.priority,
                              state=item.state,
                              metadata=dict(
                                  item.metadata
                              ),
                              changed_at=item.changed_at,
                          )
                          for item
                          in self._targets.values()
                      )


          __all__ = [
              "FailoverState",
              "FailoverAction",
              "FailoverTarget",
              "FailoverManager",
          ]
          PY

          # ========================================================
          # QUORUM
          # ========================================================

          cat > network/quorum/__init__.py <<'PY'
          """ZYRA Network quorum primitives."""

          from .quorum import (
              QuorumDecision,
              QuorumGroup,
              QuorumResult,
          )

          __all__ = [
              "QuorumDecision",
              "QuorumGroup",
              "QuorumResult",
          ]
          PY

          cat > network/quorum/quorum.py <<'PY'
          """
          Production quorum calculation.

          This module calculates quorum from an explicitly supplied
          membership set. It does not implement consensus.
          """

          from __future__ import annotations

          from dataclasses import dataclass
          from enum import Enum
          from threading import RLock


          class QuorumDecision(str, Enum):
              ACHIEVED = "achieved"
              NOT_ACHIEVED = "not_achieved"
              INVALID = "invalid"


          @dataclass(frozen=True, slots=True)
          class QuorumResult:
              total: int
              votes: int
              required: int
              decision: QuorumDecision

              @property
              def achieved(self) -> bool:
                  return (
                      self.decision
                      is QuorumDecision.ACHIEVED
                  )


          class QuorumGroup:
              """
              Thread-safe membership and quorum calculator.

              Majority quorum is floor(total / 2) + 1 unless an explicit
              threshold is configured.
              """

              def __init__(
                  self,
                  *,
                  threshold: int | None = None,
              ) -> None:

                  if (
                      threshold is not None
                      and threshold <= 0
                  ):
                      raise ValueError(
                          "threshold must be positive"
                      )

                  self._threshold = threshold
                  self._members: set[str] = set()
                  self._lock = RLock()

              def add(
                  self,
                  member_id: str,
              ) -> None:

                  member_id = member_id.strip()

                  if not member_id:
                      raise ValueError(
                          "member_id cannot be empty"
                      )

                  with self._lock:
                      self._members.add(
                          member_id
                      )

              def remove(
                  self,
                  member_id: str,
              ) -> bool:

                  with self._lock:
                      if member_id.strip() not in self._members:
                          return False

                      self._members.remove(
                          member_id.strip()
                      )

                      return True

              def members(
                  self,
              ) -> tuple[str, ...]:

                  with self._lock:
                      return tuple(
                          sorted(
                              self._members
                          )
                      )

              def required(
                  self,
              ) -> int:

                  with self._lock:
                      total = len(
                          self._members
                      )

                      if total == 0:
                          return 0

                      if self._threshold is not None:
                          return min(
                              self._threshold,
                              total,
                          )

                      return (
                          total // 2
                      ) + 1

              def evaluate(
                  self,
                  voters: set[str] | frozenset[str],
              ) -> QuorumResult:

                  if not isinstance(
                      voters,
                      (set, frozenset),
                  ):
                      raise TypeError(
                          "voters must be set or frozenset"
                      )

                  with self._lock:
                      total = len(
                          self._members
                      )

                      valid_voters = (
                          voters
                          & self._members
                      )

                      votes = len(
                          valid_voters
                      )

                      required = self.required()

                      if total == 0:
                          decision = (
                              QuorumDecision.INVALID
                          )

                      elif votes >= required:
                          decision = (
                              QuorumDecision.ACHIEVED
                          )

                      else:
                          decision = (
                              QuorumDecision.NOT_ACHIEVED
                          )

                      return QuorumResult(
                          total=total,
                          votes=votes,
                          required=required,
