          cat > observability/README.md <<'MD'
          # ZYRA Observability

          Production observability subsystem for the ZYRA Network.

          ## Architectural guarantees

          The subsystem is designed as a long-term foundation rather than as
          an application-specific logging utility.

          Core characteristics:

          - explicit versioned contracts;
          - immutable event/domain records;
          - deterministic serialization;
          - bounded memory admission;
          - bounded metric cardinality;
          - explicit backpressure;
          - durable SQLite WAL persistence;
          - full synchronous database commits;
          - idempotent event persistence;
          - schema-version tracking;
          - indexed temporal queries;
          - retention controls;
          - database integrity checks;
          - asynchronous processing;
          - controlled worker lifecycle;
          - explicit alert state transitions;
          - explicit incident state transitions;
          - secret redaction;
          - serialization/depth/size boundaries;
          - vendor-neutral exporters;
          - stable public facade;
          - internal health checks;
          - tests covering persistence, integrity, lifecycle,
            concurrency boundaries, alerts, incidents, policies and
            public compatibility.

          ## Long-term evolution

          The implementation is intended to serve as a durable foundation
          for decades of evolution. No software implementation can honestly
          guarantee unchanged operation for a literal twenty-year period:
          operating systems, Python versions, cryptographic requirements,
          storage media, deployment environments and regulatory requirements
          will change.

          Therefore the architecture deliberately separates:

          1. stable public contracts;
          2. versioned persistence schema;
          3. internal implementations;
          4. policy;
          5. query interfaces;
          6. exporters;
          7. lifecycle management.

          Future migrations should preserve the public contract and perform
          explicit schema migrations rather than silently changing stored
          semantics.

          ## Boundary

          This subsystem owns only `observability/`.

          It intentionally does not import or modify `apps/`.
          MD

