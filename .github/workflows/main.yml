          from __future__ import annotations

          import threading
          import time

          from ..alerts.alerts import AlertManager
          from ..collector.collector import Collector
          from ..core import (
              ObservationEvent,
              ObservationPolicy,
          )
          from ..engine.engine import AggregationEngine
          from ..events.events import EventBus


          class MonitoringCoordinator:
              """
              Owns the asynchronous observation pipeline.

              Producer path:
                  emit -> bounded queue

              Worker path:
                  persistence -> aggregation -> alerts -> subscribers

              Persistence is performed before derived processing so that the
              durable record is the source of truth.
              """

              def __init__(
                  self,
                  *,
                  policy: ObservationPolicy | None = None,
                  storage=None,
                  worker_count: int = 2,
              ):
                  self.policy = (
                      policy
                      or ObservationPolicy()
                  ).validate()

                  if worker_count < 1:
                      raise ValueError(
                          "worker_count must be positive"
                      )

                  self.collector = Collector(
                      self.policy
                  )
                  self.storage = storage
                  self.engine = (
                      AggregationEngine()
                  )
                  self.events = EventBus()
                  self.alerts = AlertManager()

                  self.worker_count = worker_count

                  self._lock = threading.RLock()
                  self._running = False
                  self._workers: list[
                      threading.Thread
                  ] = []
                  self._fatal_errors = []
                  self._processed = 0
                  self._failed = 0

              def start(self):
                  with self._lock:
                      if self._running:
                          return

                      self._running = True
                      self._workers = []

                      for index in range(
                          self.worker_count
                      ):
                          thread = threading.Thread(
                              target=self._worker,
                              name=(
                                  "zyra-observability-"
                                  f"{index}"
                              ),
                              daemon=True,
                          )

                          self._workers.append(
                              thread
                          )
                          thread.start()

              def _worker(self):
                  while True:
                      with self._lock:
                          running = self._running

                      event = self.collector.get(
                          timeout=0.25
                      )

                      if event is None:
                          if not running:
                              return
                          continue

                      try:
                          if self.storage is not None:
                              sequence = (
                                  self.storage.append(
                                      event
                                  )
                              )

                              event = (
                                  event.with_sequence(
                                      sequence
                                  )
                              )

                          self.engine.process(
                              event
                          )

                          self.alerts.evaluate(
                              event
                          )

                          self.events.publish(
                              event
                          )

                          with self._lock:
                              self._processed += 1

                      except Exception as exc:
                          with self._lock:
                              self._failed += 1
                              self._fatal_errors.append(
                                  {
                                      "type":
                                          type(exc).__name__,
                                      "message":
                                          str(exc),
                                      "timestamp_ns":
                                          time.time_ns(),
                                  }
                              )

              def emit(
                  self,
                  event: ObservationEvent,
                  *,
                  block=False,
                  timeout=None,
              ) -> bool:
                  with self._lock:
                      if not self._running:
                          return False

                  return self.collector.submit(
                      event,
                      block=block,
                      timeout=timeout,
                  )

              def stop(
                  self,
                  timeout: float = 30.0,
              ):
                  with self._lock:
                      if not self._running:
                          return

                      self._running = False

                  deadline = (
                      time.monotonic()
                      + timeout
                  )

                  for worker in self._workers:
                      remaining = (
                          deadline
                          - time.monotonic()
                      )

                      if remaining <= 0:
                          raise TimeoutError(
                              "observability workers "
                              "did not stop"
                          )

                      worker.join(remaining)

                      if worker.is_alive():
                          raise TimeoutError(
                              "observability worker "
                              "did not stop"
                          )

                  self._workers = []

              def health(self):
                  with self._lock:
                      return {
                          "running":
                              self._running,
                          "queue":
                              self.collector.stats(),
                          "processed":
                              self._processed,
                          "failed":
                              self._failed,
                          "workers":
                              len(self._workers),
                          "metrics":
                              self.engine.registry.count(),
                          "active_alerts":
                              len(
                                  self.alerts.active()
                              ),
                          "storage_count":
                              (
                                  self.storage.count()
                                  if self.storage is not None
                                  else None
                              ),
                      }

              def snapshot(self):
                  with self._lock:
                      return {
                          "health":
                              self.health(),
                          "engine":
                              self.engine.snapshot(),
                          "alerts": [
                              alert.to_dict()
                              for alert
                              in self.alerts.active()
                          ],
                      }


          __all__ = [
              "MonitoringCoordinator",
          ]
