              first_store = make_store(path)

              first = make_engine(
                  store=first_store
              ).execute(
                  make_request("persistent")
              )

              second_store = make_store(path)

              second = make_engine(
                  store=second_store
              ).execute(
                  make_request("persistent")
              )

              assert first == second
              assert second_store.count_requests() == 1
              assert second_store.verify_audit_chain()


          def test_encryption():
              cipher = EnvelopeCipher(
                  b"0123456789abcdef"
                  b"0123456789abcdef"
              )

              token = cipher.encrypt(
                  b"sensitive",
                  associated_data=b"request",
              )

              assert cipher.decrypt(
                  token,
                  associated_data=b"request",
              ) == b"sensitive"


          def test_encryption_detects_tampering():
              cipher = EnvelopeCipher(
                  b"0123456789abcdef"
                  b"0123456789abcdef"
              )

              token = cipher.encrypt(
                  b"sensitive",
                  associated_data=b"request",
              )

              with pytest.raises(Exception):
                  cipher.decrypt(
                      token + "x",
                      associated_data=b"request",
                  )


          def test_budget():
              budget = ExecutionBudget(
                  max_requests=2,
                  max_tokens=10,
                  max_cost=Decimal("1"),
              )

              budget.reserve_request()

              budget.settle(
                  tokens=4,
                  cost=Decimal("0.1"),
              )

              snapshot = budget.snapshot()

              assert snapshot.requests == 1
              assert snapshot.tokens == 4
              assert snapshot.cost == Decimal("0.1")


          def test_circuit():
              breaker = CircuitBreaker(
                  failure_threshold=2,
                  recovery_seconds=10,
              )

              assert breaker.allow(now=NOW)

              breaker.failure(now=NOW)
              breaker.failure(now=NOW)

              assert (
                  breaker.snapshot().state
                  is CircuitState.OPEN
              )

              assert not breaker.allow(
                  now=NOW
              )

              assert breaker.allow(
                  now=NOW + 10
              )


          def test_outbox(tmp_path: Path):
              store = make_store(
                  tmp_path / "outbox.db"
              )

              make_engine(
                  store=store
              ).execute(
                  make_request("outbox")
              )

              events = store.pending_outbox()

              assert len(events) == 1

              event = events[0]

              assert event.event_type == (
                  "AI_REQUEST_COMPLETED"
              )

              assert store.mark_outbox_published(
                  event_id=event.event_id,
                  published_at=NOW + 10,
              )

              assert store.pending_outbox() == ()


          def test_inbox_deduplication(
              tmp_path: Path,
          ):
              store = make_store(
                  tmp_path / "inbox.db"
              )

              assert store.mark_inbox_seen(
                  consumer="consumer-a",
                  event_id="event-1",
                  received_at=NOW,
              )

              assert not store.mark_inbox_seen(
                  consumer="consumer-a",
                  event_id="event-1",
                  received_at=NOW + 1,
              )


          def test_concurrent_idempotency(
              tmp_path: Path,
          ):
              store = make_store(
                  tmp_path / "concurrent.db"
              )

              provider = TestProvider()

              service = make_engine(
                  store=store,
                  provider=provider,
              )

              def run(_: int):
                  return service.execute(
                      make_request("concurrent")
                  )

              with ThreadPoolExecutor(
                  max_workers=8
              ) as executor:
                  results = list(
                      executor.map(
                          run,
                          range(8),
                      )
                  )

              assert all(
                  item == results[0]
                  for item in results
              )

              assert provider.calls == 1
              assert store.count_requests() == 1
              assert store.verify_audit_chain()


          def test_database_integrity(
              tmp_path: Path,
          ):
              store = make_store(
                  tmp_path / "integrity.db"
              )

              service = make_engine(
                  store=store
              )

              service.execute(
                  make_request("integrity")
              )

              store.verify_database()
              assert store.verify_audit_chain()
          PY

