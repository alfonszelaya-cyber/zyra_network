          cat > shared_engines/ai/http_provider.py <<'PY'
          """Strict HTTPS JSON provider adapter."""

          from __future__ import annotations

          import json
          import ssl
          from dataclasses import dataclass
          from decimal import Decimal
          from typing import Mapping
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          from .contracts import AIRequest, AIResponse
          from .errors import (
              AIProviderPermanentError,
              AIProviderProtocolError,
              AIProviderTransientError,
          )
          from .provider_protocol import AIProvider, ProviderResult


          @dataclass(frozen=True)
          class HTTPProvider(AIProvider):
              """HTTPS JSON provider."""

              name: str
              endpoint: str
              api_key: str
              timeout_seconds: float = 30.0
              max_response_bytes: int = 8_000_000

              def __post_init__(self) -> None:
                  if not self.endpoint.startswith("https://"):
                      raise ValueError("endpoint must use HTTPS")
                  if not self.api_key:
                      raise ValueError("api_key is required")
                  if self.timeout_seconds <= 0:
                      raise ValueError("timeout must be positive")
                  if self.max_response_bytes < 1024:
                      raise ValueError("response limit too small")

              def execute(
                  self,
                  request: AIRequest,
                  headers: Mapping[str, str],
              ) -> ProviderResult:
                  payload = {
                      "model": request.model.model,
                      "input": request.payload,
                  }

                  body = json.dumps(
                      payload,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  ).encode("utf-8")

                  request_headers = {
                      "Authorization": f"Bearer {self.api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "Idempotency-Key": request.idempotency_key,
                  }
                  request_headers.update(headers)

                  http_request = Request(
                      self.endpoint,
                      data=body,
                      headers=request_headers,
                      method="POST",
                  )

                  context = ssl.create_default_context()

                  try:
                      with urlopen(
                          http_request,
                          timeout=self.timeout_seconds,
                          context=context,
                      ) as response:
                          raw = response.read(
                              self.max_response_bytes + 1
                          )
                          status = int(response.status)
                  except HTTPError as exc:
                      if exc.code == 429 or 500 <= exc.code <= 599:
                          raise AIProviderTransientError(
                              f"provider HTTP {exc.code}"
                          ) from exc
                      raise AIProviderPermanentError(
                          f"provider HTTP {exc.code}"
                      ) from exc
                  except (URLError, TimeoutError) as exc:
                      raise AIProviderTransientError(
                          "provider network failure"
                      ) from exc

                  if len(raw) > self.max_response_bytes:
                      raise AIProviderProtocolError(
                          "provider response exceeds configured limit"
                      )

                  if status != 200:
                      raise AIProviderTransientError(
                          f"unexpected provider status {status}"
                      )

                  try:
                      decoded = json.loads(raw.decode("utf-8"))
                  except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                      raise AIProviderProtocolError(
                          "provider returned invalid JSON"
                      ) from exc

                  if not isinstance(decoded, dict):
                      raise AIProviderProtocolError(
                          "provider response must be an object"
                      )

                  provider_id = decoded.get("id")
                  output = decoded.get("output")
                  usage = decoded.get("usage", {})
                  raw_cost = decoded.get("cost", "0")

                  if not isinstance(provider_id, str) or not provider_id:
                      raise AIProviderProtocolError(
                          "provider response missing id"
                      )

                  if not isinstance(output, dict):
                      raise AIProviderProtocolError(
                          "provider response missing output"
                      )

                  if not isinstance(usage, dict):
                      raise AIProviderProtocolError(
                          "provider usage must be an object"
                      )

                  try:
                      cost = Decimal(str(raw_cost))
                  except Exception as exc:
                      raise AIProviderProtocolError(
                          "provider cost is invalid"
                      ) from exc

                  result = AIResponse(
                      request_id=request.request_id,
                      provider_request_id=provider_id,
                      output=output,
                      usage=usage,
                      cost=cost,
                  )
                  result.validate()

                  return ProviderResult(
                      response=result,
                      provider_request_id=provider_id,
                  )

              def healthcheck(self) -> bool:
                  return bool(self.endpoint and self.api_key)

              def supported_models(self) -> Sequence[str]:
                  return ()
          PY

          cat > shared_engines/ai/registry.py <<'PY'
          """Explicit provider and model registry."""

          from __future__ import annotations

          from threading import RLock

          from .contracts import ModelDescriptor
          from .errors import AIValidationError
          from .provider_protocol import AIProvider


          class ProviderRegistry:
              """Thread-safe registry with duplicate protection."""

              def __init__(self) -> None:
                  self._providers: dict[str, AIProvider] = {}
                  self._models: dict[str, ModelDescriptor] = {}
                  self._lock = RLock()

              def register_provider(
                  self,
                  provider: AIProvider,
              ) -> None:
                  with self._lock:
                      if provider.name in self._providers:
                          raise AIValidationError(
                              f"provider already exists: {provider.name}"
                          )
                      self._providers[provider.name] = provider

              def register_model(
                  self,
                  descriptor: ModelDescriptor,
              ) -> None:
                  descriptor.validate()
                  key = self._key(
                      descriptor.provider,
                      descriptor.model,
                  )

                  with self._lock:
                      if key in self._models:
                          raise AIValidationError(
                              f"model already exists: {key}"
                          )
                      self._models[key] = descriptor

              def provider(self, name: str) -> AIProvider:
                  with self._lock:
                      if name not in self._providers:
                          raise AIValidationError(
                              f"unknown provider: {name}"
                          )
                      return self._providers[name]

              def model(
                  self,
                  provider: str,
                  model: str,
              ) -> ModelDescriptor:
                  key = self._key(provider, model)
                  with self._lock:
                      if key not in self._models:
                          raise AIValidationError(
                              f"unknown model: {key}"
                          )
                      return self._models[key]

              @staticmethod
              def _key(provider: str, model: str) -> str:
                  return f"{provider}:{model}"
          PY

          cat > shared_engines/ai/circuit.py <<'PY'
          """Thread-safe provider circuit breaker."""

          from __future__ import annotations

          import time
          from dataclasses import dataclass
          from threading import Lock

          from .errors import AICircuitOpen


          @dataclass
          class CircuitBreaker:
              failure_threshold: int = 5
              recovery_seconds: float = 30.0

              def __post_init__(self) -> None:
                  if self.failure_threshold < 1:
                      raise ValueError("failure threshold must be positive")
                  if self.recovery_seconds <= 0:
                      raise ValueError("recovery period must be positive")

                  self._lock = Lock()
                  self._failures = 0
                  self._opened_at = 0.0
                  self._probe_active = False

              def allow(self) -> None:
                  with self._lock:
                      if self._failures < self.failure_threshold:
                          return

                      elapsed = time.monotonic() - self._opened_at

                      if elapsed < self.recovery_seconds:
                          raise AICircuitOpen(
                              "provider circuit is open"
                          )

                      if self._probe_active:
                          raise AICircuitOpen(
                              "half-open probe already active"
                          )

                      self._probe_active = True

              def success(self) -> None:
                  with self._lock:
                      self._failures = 0
                      self._opened_at = 0.0
                      self._probe_active = False

              def failure(self) -> None:
                  with self._lock:
                      self._failures += 1
                      self._opened_at = time.monotonic()
                      self._probe_active = False
          PY

          cat > shared_engines/ai/retry.py <<'PY'
          """Bounded retry policy."""

          from __future__ import annotations

          import random
          import time
          from dataclasses import dataclass

          from .errors import AIProviderTransientError


          @dataclass(frozen=True)
          class RetryPolicy:
              base_seconds: float = 0.25
              max_seconds: float = 8.0

              def delay(self, attempt: int) -> float:
                  maximum = min(
                      self.max_seconds,
                      self.base_seconds * (2 ** max(0, attempt - 1)),
                  )
                  return random.uniform(0.0, maximum)

              def sleep_if_possible(
                  self,
                  attempt: int,
                  deadline: float,
              ) -> None:
                  remaining = deadline - time.monotonic()

                  if remaining <= 0:
                      raise AIProviderTransientError(
                          "execution deadline exhausted"
                      )

                  time.sleep(min(self.delay(attempt), remaining))
          PY

          cat > shared_engines/ai/limiter.py <<'PY'
          """Bounded concurrency and backpressure."""

          from __future__ import annotations

          import time
          from threading import Condition

          from .errors import AIBackpressure


          class ExecutionLimiter:
              """Hard upper bound on active and waiting executions."""

              def __init__(
                  self,
                  max_active: int,
                  max_queue: int,
              ) -> None:
                  if max_active < 1:
                      raise ValueError("max_active must be positive")
                  if max_queue < 0:
                      raise ValueError("max_queue cannot be negative")

                  self._condition = Condition()
                  self._active = 0
                  self._waiting = 0
                  self._max_active = max_active
                  self._max_queue = max_queue

              def acquire(self, timeout: float) -> None:
                  with self._condition:
                      if (
                          self._active >= self._max_active
                          and self._waiting >= self._max_queue
                      ):
                          raise AIBackpressure(
                              "AI execution queue is full"
                          )

                      self._waiting += 1

                      try:
                          deadline = time.monotonic() + timeout

                          while self._active >= self._max_active:
                              remaining = deadline - time.monotonic()

                              if remaining <= 0:
                                  raise AIBackpressure(
                                      "AI admission timeout"
                                  )

                              self._condition.wait(remaining)

                          self._active += 1
                      finally:
                          self._waiting -= 1

              def release(self) -> None:
                  with self._condition:
                      if self._active <= 0:
                          raise RuntimeError(
                              "limiter release imbalance"
                          )

                      self._active -= 1
                      self._condition.notify()
          PY

          cat > shared_engines/ai/observability.py <<'PY'
          """Explicit observability hooks."""

          from __future__ import annotations

          from typing import Mapping, Protocol


          class AIObserver(Protocol):
              """Receives sanitized lifecycle events."""

              def emit(
                  self,
                  event: str,
                  fields: Mapping[str, object],
              ) -> None:
                  ...


          class NullObserver:
              """Explicit no-op observer."""

              def emit(
                  self,
                  event: str,
                  fields: Mapping[str, object],
              ) -> None:
                  del event
                  del fields
          PY

          cat > shared_engines/ai/storage.py <<'PY'
          """Durable SQLite state, leases, outbox, inbox and audit."""

          from __future__ import annotations

          import hashlib
          import sqlite3
          import time
          import uuid
          from contextlib import contextmanager
          from dataclasses import dataclass
          from typing import Iterator, Optional

          from .errors import (
              AIIdempotencyConflict,
              AIIntegrityError,
              AILeaseLost,
              AIRecoveryRequired,
              AIRequestInFlight,
          )
          from .serialization import canonical_bytes, sha256_hex


          SCHEMA_VERSION = 1


          @dataclass(frozen=True)
          class Lease:
              token: str
              expires_at: float


          class SQLiteAIStore:
              """Durable single-node storage adapter.

              Cluster HA must be supplied by a database adapter providing
              equivalent transaction and fencing guarantees.
              """

              def __init__(self, path: str) -> None:
                  self.path = path
                  self._migrate()

              @contextmanager
              def connection(self) -> Iterator[sqlite3.Connection]:
                  db = sqlite3.connect(
                      self.path,
                      timeout=30.0,
                      isolation_level=None,
                  )
                  db.row_factory = sqlite3.Row

                  try:
                      db.execute("PRAGMA foreign_keys=ON")
                      db.execute("PRAGMA journal_mode=WAL")
                      db.execute("PRAGMA synchronous=FULL")
                      db.execute("PRAGMA busy_timeout=30000")
                      yield db
                  finally:
                      db.close()

              def _migrate(self) -> None:
                  with self.connection() as db:
                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS schema_meta(
                              version INTEGER PRIMARY KEY,
                              checksum TEXT NOT NULL,
                              applied_at REAL NOT NULL
                          )
                          """
                      )

                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS ai_requests(
                              request_id TEXT PRIMARY KEY,
                              idempotency_key TEXT NOT NULL UNIQUE,
                              request_hash TEXT NOT NULL,
                              status TEXT NOT NULL,
                              encrypted_request TEXT NOT NULL,
                              encrypted_response TEXT,
                              provider TEXT NOT NULL,
                              model TEXT NOT NULL,
                              lease_owner TEXT,
                              lease_token TEXT,
                              lease_expires REAL,
                              attempts INTEGER NOT NULL DEFAULT 0,
                              created_at REAL NOT NULL,
                              updated_at REAL NOT NULL,
                              error TEXT
                          )
                          """
                      )

                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS outbox(
                              event_id TEXT PRIMARY KEY,
                              event_type TEXT NOT NULL,
                              aggregate_id TEXT NOT NULL,
                              payload TEXT NOT NULL,
                              fingerprint TEXT NOT NULL UNIQUE,
                              created_at REAL NOT NULL,
                              published_at REAL
                          )
                          """
                      )

                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS inbox(
                              event_id TEXT PRIMARY KEY,
                              fingerprint TEXT NOT NULL UNIQUE,
                              received_at REAL NOT NULL
                          )
                          """
                      )

                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS audit(
                              sequence INTEGER PRIMARY KEY AUTOINCREMENT,
                              event_id TEXT NOT NULL,
                              event_type TEXT NOT NULL,
                              aggregate_id TEXT NOT NULL,
                              payload TEXT NOT NULL,
                              previous_hash TEXT NOT NULL,
                              event_hash TEXT NOT NULL UNIQUE,
                              created_at REAL NOT NULL
                          )
                          """
                      )

                      db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS audit_checkpoints(
                              checkpoint_id TEXT PRIMARY KEY,
                              sequence INTEGER NOT NULL,
                              event_hash TEXT NOT NULL,
                              created_at REAL NOT NULL
                          )
                          """
                      )

                      checksum = hashlib.sha256(
                          canonical_bytes(
                              {
                                  "schema": SCHEMA_VERSION,
                                  "tables": [
                                      "ai_requests",
                                      "outbox",
                                      "inbox",
                                      "audit",
                                      "audit_checkpoints",
                                  ],
                              }
                          )
                      ).hexdigest()

                      existing = db.execute(
                          """
                          SELECT checksum
                          FROM schema_meta
                          WHERE version=?
                          """,
                          (SCHEMA_VERSION,),
                      ).fetchone()

                      if existing is None:
                          db.execute(
                              """
                              INSERT INTO schema_meta(
                                  version,
                                  checksum,
                                  applied_at
                              )
                              VALUES(?, ?, ?)
                              """,
                              (
                                  SCHEMA_VERSION,
                                  checksum,
                                  time.time(),
                              ),
                          )
                      elif existing["checksum"] != checksum:
                          raise AIIntegrityError(
                              "schema checksum mismatch"
                          )

              def reserve(
                  self,
                  request_id: str,
                  idempotency_key: str,
                  request_hash: str,
                  encrypted_request: str,
                  provider: str,
                  model: str,
                  owner: str,
                  lease_seconds: int,
              ) -> Lease:
                  now = time.time()
                  expires = now + lease_seconds
                  token = uuid.uuid4().hex

                  with self.connection() as db:
                      db.execute("BEGIN IMMEDIATE")

                      row = db.execute(
                          """
                          SELECT *
                          FROM ai_requests
                          WHERE idempotency_key=?
                          """,
                          (idempotency_key,),
                      ).fetchone()

                      if row is not None:
                          if row["request_hash"] != request_hash:
                              db.execute("ROLLBACK")
                              raise AIIdempotencyConflict(
                                  "idempotency conflict"
                              )

                          if row["status"] == "completed":
                              db.execute("COMMIT")
                              return Lease("", 0.0)

                          if row["status"] == "recovery_required":
                              db.execute("ROLLBACK")
                              raise AIRecoveryRequired(
                                  "reconciliation required"
                              )

                          if (
                              row["status"] == "running"
                              and row["lease_expires"] is not None
                              and row["lease_expires"] > now
                          ):
                              db.execute("ROLLBACK")
                              raise AIRequestInFlight(
                                  "request already leased"
                              )

                          db.execute(
                              """
                              UPDATE ai_requests
                              SET status='running',
                                  lease_owner=?,
                                  lease_token=?,
                                  lease_expires=?,
                                  attempts=attempts+1,
                                  updated_at=?,
                                  error=NULL
                              WHERE idempotency_key=?
                              """,
                              (
                                  owner,
                                  token,
                                  expires,
                                  now,
                                  idempotency_key,
                              ),
                          )
                      else:
                          db.execute(
                              """
                              INSERT INTO ai_requests(
                                  request_id,
                                  idempotency_key,
                                  request_hash,
                                  status,
                                  encrypted_request,
                                  provider,
                                  model,
                                  lease_owner,
                                  lease_token,
                                  lease_expires,
                                  attempts,
                                  created_at,
                                  updated_at
                              )
                              VALUES(
                                  ?, ?, ?, 'running', ?, ?, ?,
                                  ?, ?, ?, 1, ?, ?
                              )
                              """,
                              (
                                  request_id,
                                  idempotency_key,
                                  request_hash,
                                  encrypted_request,
                                  provider,
                                  model,
                                  owner,
                                  token,
                                  expires,
                                  now,
                                  now,
                              ),
                          )

                      db.execute("COMMIT")

                  return Lease(token, expires)

              def get_completed(
                  self,
                  idempotency_key: str,
              ) -> Optional[tuple[str, str]]:
                  with self.connection() as db:
                      row = db.execute(
                          """
                          SELECT encrypted_response, request_hash
                          FROM ai_requests
                          WHERE idempotency_key=?
                            AND status='completed'
                          """,
                          (idempotency_key,),
                      ).fetchone()

                      if row is None:
                          return None

                      if row["encrypted_response"] is None:
                          raise AIIntegrityError(
                              "completed request has no response"
                          )

                      return (
                          str(row["encrypted_response"]),
                          str(row["request_hash"]),
                      )

              def complete(
                  self,
                  request_id: str,
                  owner: str,
                  token: str,
                  encrypted_response: str,
                  event_payload: str,
                  event_fingerprint: str,
              ) -> None:
                  with self.connection() as db:
                      db.execute("BEGIN IMMEDIATE")

                      row = db.execute(
                          """
                          SELECT status, lease_owner, lease_token
                          FROM ai_requests
                          WHERE request_id=?
                          """,
                          (request_id,),
                      ).fetchone()

                      if row is None:
                          db.execute("ROLLBACK")
                          raise AILeaseLost(
                              "request does not exist"
                          )

                      if (
                          row["status"] != "running"
                          or row["lease_owner"] != owner
                          or row["lease_token"] != token
                      ):
                          db.execute("ROLLBACK")
                          raise AILeaseLost(
                              "fencing lease lost"
                          )

                      now = time.time()

                      db.execute(
                          """
                          UPDATE ai_requests
                          SET status='completed',
                              encrypted_response=?,
                              lease_owner=NULL,
                              lease_token=NULL,
                              lease_expires=NULL,
                              updated_at=?
                          WHERE request_id=?
                          """,
                          (
                              encrypted_response,
                              now,
                              request_id,
                          ),
                      )

                      db.execute(
                          """
                          INSERT INTO outbox(
                              event_id,
                              event_type,
                              aggregate_id,
                              payload,
                              fingerprint,
                              created_at
                          )
                          VALUES(?, ?, ?, ?, ?, ?)
                          """,
                          (
                              uuid.uuid4().hex,
                              "AI_REQUEST_COMPLETED",
                              request_id,
                              event_payload,
                              event_fingerprint,
                              now,
                          ),
                      )

                      self._append_audit(
                          db,
                          request_id,
                          "AI_REQUEST_COMPLETED",
                          event_payload,
                          now,
                      )

                      db.execute("COMMIT")

              def fail(
                  self,
                  request_id: str,
                  owner: str,
                  token: str,
                  error: str,
              ) -> None:
                  with self.connection() as db:
                      db.execute("BEGIN IMMEDIATE")

                      row = db.execute(
                          """
                          SELECT status, lease_owner, lease_token
                          FROM ai_requests
                          WHERE request_id=?
                          """,
                          (request_id,),
                      ).fetchone()

                      if row is None:
                          db.execute("ROLLBACK")
                          raise AILeaseLost(
                              "request does not exist"
                          )

                      if (
                          row["status"] != "running"
                          or row["lease_owner"] != owner
                          or row["lease_token"] != token
                      ):
                          db.execute("ROLLBACK")
                          raise AILeaseLost(
                              "fencing lease lost"
                          )

                      db.execute(
                          """
                          UPDATE ai_requests
                          SET status='failed',
                              error=?,
                              lease_owner=NULL,
                              lease_token=NULL,
                              lease_expires=NULL,
                              updated_at=?
                          WHERE request_id=?
                          """,
                          (
                              error[:4000],
                              time.time(),
                              request_id,
                          ),
                      )

                      db.execute("COMMIT")

              def recover_expired(self) -> int:
                  now = time.time()

                  with self.connection() as db:
                      cursor = db.execute(
                          """
                          UPDATE ai_requests
                          SET status='recovery_required',
                              lease_owner=NULL,
                              lease_token=NULL,
                              lease_expires=NULL,
                              updated_at=?,
                              error=?
                          WHERE status='running'
                            AND lease_expires IS NOT NULL
                            AND lease_expires <= ?
                          """,
                          (
                              now,
                              "execution lease expired; outcome uncertain",
                              now,
                          ),
                      )
                      return cursor.rowcount

              def inbox_accept(
                  self,
                  event_id: str,
                  fingerprint: str,
              ) -> bool:
                  with self.connection() as db:
                      try:
                          db.execute(
                              """
                              INSERT INTO inbox(
                                  event_id,
                                  fingerprint,
                                  received_at
                              )
                              VALUES(?, ?, ?)
                              """,
                              (
                                  event_id,
                                  fingerprint,
                                  time.time(),
                              ),
                          )
                          return True
                      except sqlite3.IntegrityError:
                          return False

              def checkpoint_audit(self) -> Optional[str]:
                  with self.connection() as db:
                      row = db.execute(
                          """
                          SELECT sequence, event_hash
                          FROM audit
                          ORDER BY sequence DESC
                          LIMIT 1
                          """
                      ).fetchone()

                      if row is None:
                          return None

                      checkpoint_id = uuid.uuid4().hex

                      db.execute(
                          """
                          INSERT INTO audit_checkpoints(
                              checkpoint_id,
                              sequence,
                              event_hash,
                              created_at
                          )
                          VALUES(?, ?, ?, ?)
                          """,
                          (
                              checkpoint_id,
                              row["sequence"],
                              row["event_hash"],
                              time.time(),
                          ),
                      )

                      return checkpoint_id

              def verify_audit(self) -> None:
                  with self.connection() as db:
                      rows = db.execute(
                          """
                          SELECT
                              sequence,
                              event_id,
                              event_type,
                              aggregate_id,
                              payload,
                              previous_hash,
                              event_hash
                          FROM audit
                          ORDER BY sequence
                          """
                      ).fetchall()

                      previous = "GENESIS"
                      last_sequence = 0
                      last_hash: Optional[str] = None

                      for row in rows:
                          expected = sha256_hex(
                              {
                                  "sequence": row["sequence"],
                                  "event_id": row["event_id"],
                                  "event_type": row["event_type"],
                                  "aggregate_id": row["aggregate_id"],
                                  "payload": row["payload"],
                                  "previous_hash": row["previous_hash"],
                              }
                          )

                          if row["previous_hash"] != previous:
                              raise AIIntegrityError(
                                  "audit chain broken"
                              )

                          if row["event_hash"] != expected:
                              raise AIIntegrityError(
                                  "audit hash mismatch"
                              )

                          previous = row["event_hash"]
                          last_sequence = row["sequence"]
                          last_hash = row["event_hash"]

                      checkpoints = db.execute(
                          """
                          SELECT sequence, event_hash
                          FROM audit_checkpoints
                          ORDER BY sequence
                          """
                      ).fetchall()

                      for checkpoint in checkpoints:
                          if checkpoint["sequence"] > last_sequence:
                              raise AIIntegrityError(
                                  "invalid audit checkpoint"
                              )

                          if (
                              checkpoint["sequence"] == last_sequence
                              and checkpoint["event_hash"] != last_hash
                          ):
                              raise AIIntegrityError(
                                  "audit checkpoint mismatch"
                              )

              def backup_to(self, destination: str) -> None:
                  with self.connection() as source:
                      backup = sqlite3.connect(destination)

                      try:
                          source.backup(backup)

                          result = backup.execute(
                              "PRAGMA integrity_check"
                          ).fetchone()

                          if result is None or result[0] != "ok":
                              raise AIIntegrityError(
                                  "backup integrity check failed"
                              )
                      finally:
                          backup.close()

              @staticmethod
              def _append_audit(
                  db: sqlite3.Connection,
                  aggregate_id: str,
                  event_type: str,
                  payload: str,
                  created_at: float,
              ) -> None:
                  previous_row = db.execute(
                      """
                      SELECT event_hash
                      FROM audit
                      ORDER BY sequence DESC
                      LIMIT 1
                      """
                  ).fetchone()

                  previous = (
                      "GENESIS"
                      if previous_row is None
                      else str(previous_row["event_hash"])
                  )

                  event_id = uuid.uuid4().hex

                  row = db.execute(
                      """
                      SELECT COALESCE(MAX(sequence), 0) + 1
                      FROM audit
                      """
                  ).fetchone()

                  sequence = int(row[0])

                  event_hash = sha256_hex(
                      {
                          "sequence": sequence,
                          "event_id": event_id,
                          "event_type": event_type,
                          "aggregate_id": aggregate_id,
                          "payload": payload,
                          "previous_hash": previous,
                      }
                  )

                  db.execute(
                      """
                      INSERT INTO audit(
                          event_id,
                          event_type,
                          aggregate_id,
                          payload,
                          previous_hash,
                          event_hash,
                          created_at
                      )
                      VALUES(?, ?, ?, ?, ?, ?, ?)
                      """,
                      (
                          event_id,
                          event_type,
                          aggregate_id,
                          payload,
                          previous,
                          event_hash,
                          created_at,
                      ),
                  )
          PY

