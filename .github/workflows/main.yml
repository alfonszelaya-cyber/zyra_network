name: Crear carpetas de Axis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Agregar bloque de carpetas a apps/axis
        run: |
          # Events
          mkdir -p apps/axis/events/{administration,biometrics,border_control,citizen,civil_registry,court,criminal,digital_identity,emergency,evidence,forensic,government,health,immigration,intelligence,justice,police,prison,public_security,reports,risk,security,surveillance,system}

          # Infrastructure
          mkdir -p apps/axis/infrastructure/{api,cache,database,messaging,network,persistence,providers,repositories,security,services,storage}

          # Modules
          mkdir -p apps/axis/modules/{administration,analytics,biometrics,border_control,citizen,civil_registry,court,criminal,digital_identity,emergency,evidence,forensic,government,health,immigration,intelligence,justice,police,prison,public_security,reports,risk,surveillance,zyra_security_core}

          # Permissions
          mkdir -p apps/axis/permissions/{administration,biometrics,border_control,citizen,civil_registry,court,criminal,digital_identity,emergency,evidence,forensic,government,health,immigration,intelligence,justice,police,prison,public_security,roles,security,users}

          # Registry
          mkdir -p apps/axis/registry/{engines,events,institutions,menus,modules,permissions,roles,routes,security_levels,services,templates,users}

          # Routers
          mkdir -p apps/axis/routers/{administration,biometrics,border_control,citizen,civil_registry,court,criminal,digital_identity,emergency,evidence,forensic,government,health,immigration,intelligence,justice,police,prison,public_security,reports,risk,security,surveillance,system}

          # Schemas
          mkdir -p apps/axis/schemas/{administration,biometrics,border_control,citizen,civil_registry,court,criminal,digital_identity,emergency,evidence,forensic,government,health,immigration,intelligence,justice,police,prison,public_security,reports,risk,security,users}

          # Services
          mkdir -p apps/axis/services/{administration,analytics,biometrics,border_control,certificates,citizen,civil_registry,communication,court,criminal,digital_identity,documents,emergency,evidence,export,forensic,government,health,immigration,import,intelligence,justice,notifications,police,prison,public_security,reports,risk,security,surveillance,synchronization,translation}

          # Shared
          mkdir -p apps/axis/shared/{adapters,builders,contracts,decorators,dto,enums,exceptions,factories,helpers,interfaces,mixins,models,policies,types,utilities,value_objects}

          # Templates
          mkdir -p apps/axis/templates/{badges,certificates,dashboards,documents,emails,evidence,exports,forms,identity_cards,notifications,reports,warrants,warrants_pdf}

          # Validators
          mkdir -p apps/axis/validators/{administration,biometrics,border_control,citizen,civil_registry,court,criminal,digital_identity,documents,emergency,evidence,forensic,government,health,immigration,intelligence,justice,police,prison,public_security,risk,security,surveillance,users}

          # Crear __init__.py en los directorios de este bloque
          find apps/axis/events apps/axis/infrastructure apps/axis/modules apps/axis/permissions apps/axis/registry apps/axis/routers apps/axis/schemas apps/axis/services apps/axis/shared apps/axis/templates apps/axis/validators -type d -exec touch {}/__init__.py \;

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Bloque completo de axis agregado (events, infrastructure, modules, permissions, registry, routers, schemas, services, shared, templates, validators)"
          git push origin main
