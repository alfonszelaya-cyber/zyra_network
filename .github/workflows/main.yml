              def close(self):
                  with self._lock:
                      if self._closed:
                          return

                      try:
                          self._db.close()
                      finally:
                          self._closed = True

              def __enter__(self):
                  self._ensure_open()
                  return self

              def __exit__(
                  self,
                  exc_type,
                  exc_value,
                  traceback,
              ):
                  self.close()


