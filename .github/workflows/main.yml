name: Crear carpetas de Semilla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Agregar solo bloque 2 (domain, events, infrastructure, modules)
        run: |
          # Domain
          mkdir -p apps/semilla/domain/{academic,admissions,analytics,attendance,certification,classroom,curriculum,education_ai,evaluation,family,finance,government,innovation,institution,laboratory,learning,library,management,psychology,reports,research,scholarship,security,student,teacher,transportation,zyra_education_core}

          # Events
          mkdir -p apps/semilla/events/{academic,admissions,attendance,certification,curriculum,evaluation,finance,government,institution,learning,notifications,psychology,scholarship,security,student,teacher,system}

          # Infrastructure
          mkdir -p apps/semilla/infrastructure/{api,cache,database,messaging,network,persistence,providers,repositories,security,services,storage}

          # Modules
          mkdir -p apps/semilla/modules/{academic,admissions,analytics,attendance,certification,classroom,curriculum,evaluation,family,finance,government,innovation,institution,laboratory,learning,library,management,psychology,reports,research,scholarship,security,student,teacher,transportation,zyra_education_core}

          # Crear __init__.py únicamente dentro de las carpetas de este bloque
          find apps/semilla/domain apps/semilla/events apps/semilla/infrastructure apps/semilla/modules -type d -exec touch {}/__init__.py \;

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Bloque 2 agregado: domain, events, infrastructure, modules"
          git push origin main
