name: Complete Mi Primer Empleo Architecture

on:
  workflow_dispatch:

jobs:
  complete-architecture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create missing architecture
        run: |
          set -e

          BASE="apps/mi_primer_empleo"

          # application
          mkdir -p "$BASE/application"/{commands,dto,handlers,queries,services,use_cases,workflows}

          # assets
          mkdir -p "$BASE/assets"/{fonts,icons,images,logos,templates,translations}

          # config — completar existente
          mkdir -p "$BASE/config"/{application,database,events,modules,network,permissions,registry,routes,security,system}

          # constants
          mkdir -p "$BASE/constants"/{business,events,permissions,roles,security,system}

          # domain
          mkdir -p "$BASE/domain"

          # events — completar existente
          mkdir -p "$BASE/events"/{domain,notifications,system}

          # infrastructure
          mkdir -p "$BASE/infrastructure"/{api,cache,database,messaging,network,persistence,providers,repositories,security,services,storage}

          # modules — sin inventar módulos
          mkdir -p "$BASE/modules"

          # permissions
          mkdir -p "$BASE/permissions"/{policies,roles,rules,scopes}

          # registry
          mkdir -p "$BASE/registry"/{engines,events,menus,modules,permissions,roles,routes,services,templates}

          # routers
          mkdir -p "$BASE/routers"/{api,internal,public,websocket}

          # schemas
          mkdir -p "$BASE/schemas"/{entities,requests,responses,shared}

          # services — completar existente
          mkdir -p "$BASE/services"/{adapters,communication,export,import,notifications,reports,synchronization,translation}

          # shared
          mkdir -p "$BASE/shared"/{adapters,builders,contracts,decorators,dto,enums,exceptions,factories,helpers,interfaces,mixins,models,policies,types,utilities,value_objects}

          # templates — completar existente
          mkdir -p "$BASE/templates"/{certificates,dashboards,documents,emails,exports,forms,notifications,reports}

          # templatess — existente, se conserva
          mkdir -p "$BASE/templatess"

          # validators — completar existente
          mkdir -p "$BASE/validators"/{business,documents,entities,requests,security,shared}

          # Crear __init__.py únicamente donde no exista
          find "$BASE" -type d -exec sh -c '
            for dir do
              [ -f "$dir/__init__.py" ] || touch "$dir/__init__.py"
            done
          ' sh {} +

      - name: Commit only missing architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/mi_primer_empleo
          git diff --cached --quiet || git commit -m "Complete Mi Primer Empleo architecture"
          git push
