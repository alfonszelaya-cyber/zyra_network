                  is CircuitState.OPEN
              )

              assert not breaker.allow(now=NOW)

              assert breaker.allow(now=NOW + 10)


          def test_concurrent_same_idempotency_key(tmp_path: Path):
              store = SQLiteAIStore(
                  tmp_path / "concurrent.db",
                  encryption_key=make_key(),
              )

              service = make_engine(store)

              def execute(_: int):
                  return service.execute(
                      make_request("concurrent"),
                  )

              with ThreadPoolExecutor(max_workers=8) as pool:
                  results = list(
