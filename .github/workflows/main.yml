      - name: Dependency integrity
        run: |
          python -m pip check

      - name: Git whitespace validation
        run: |
          git diff --check

      - name: Verify only AI engine changed
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git status --short | awk '{print $2}')"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              shared_engines/ai/*)
                ;;
              .github/workflows/build-ai-engine-production.yml)
                ;;
              *)
                echo "ERROR: unauthorized modification: $file"
                exit 1
                ;;
            esac
          done <<< "$changed"

      - name: Final integrity verification
        run: |
          python - <<'PY'
          import ast
          import pathlib

          root = pathlib.Path("shared_engines/ai")
          files = sorted(root.rglob("*.py"))

          assert files, "AI engine contains no Python files"

          for path in files:
              source = path.read_text(encoding="utf-8")
              assert source.strip(), f"empty source: {path}"
              ast.parse(source)

          required = {
              "__init__.py",
              "config.py",
              "constants.py",
              "compatibility.py",
              "models.py",
              "engine.py",
              "resilience.py",
              "limits.py",
              "backup.py",
              "lifecycle.py",
              "persistence/migrations.py",
              "persistence/sqlite_store.py",
              "security/encryption.py",
              "security/keys.py",
              "providers/base.py",
              "providers/http.py",
              "providers/registry.py",
              "observability/hooks.py",
          }

          actual = {
              str(path.relative_to(root))
              for path in files
          }

          missing = required - actual

          assert not missing, f"missing required files: {sorted(missing)}"

          print(f"AI engine integrity OK: {len(files)} Python files")
          PY

