                  while time.monotonic() < deadline:
                      connection = self._connect()

                      try:
                          row = connection.execute(
                              """
                              SELECT
                                  request_hash,
                                  status,
                                  response_json
                              FROM ai_requests
                              WHERE idempotency_key = ?
                              """,
                              (idempotency_key,),
