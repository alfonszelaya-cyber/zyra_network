name: Build Agro Complete Functional Architecture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Agro
        shell: bash
        run: |
          set -e

          test -d "apps/agro" || {
            echo "ERROR: apps/agro no existe."
            exit 1
          }

          echo "Agro encontrado correctamente."

      - name: Create complete Agro architecture
        shell: bash
        run: |
          set -e

          BASE="apps/agro"

          # ============================================================
          # HELPER
          # ============================================================

          create_file() {
            FILE="$1"
            CONTENT="$2"

            mkdir -p "$(dirname "$FILE")"

            if [ ! -e "$FILE" ]; then
              printf '%s\n' "$CONTENT" > "$FILE"
              echo "CREATED: $FILE"
            else
              echo "EXISTS:  $FILE"
            fi
          }

          # ============================================================
          # APPLICATION
          # ============================================================

          create_file "$BASE/application/application.py" '
          from apps.agro.registry.modules.registry import ModuleRegistry
          from apps.agro.registry.menus.registry import MenuRegistry

          class AgroApplication:
              name = "agro"

              def modules(self):
                  return ModuleRegistry.all()

              def navigation(self):
                  return MenuRegistry.build()

              def health(self):
                  return {
                      "application": self.name,
                      "status": "operational"
                  }

          agro_application = AgroApplication()
          '

          create_file "$BASE/application/commands/command.py" '
          from dataclasses import dataclass
          from typing import Any, Dict

          @dataclass
          class Command:
              name: str
              payload: Dict[str, Any]

              def validate(self) -> bool:
                  return bool(self.name)
          '

          create_file "$BASE/application/dto/base.py" '
          from dataclasses import dataclass
          from typing import Any, Dict

          @dataclass
          class DTO:
              data: Dict[str, Any]

              def to_dict(self) -> Dict[str, Any]:
                  return dict(self.data)
          '

          create_file "$BASE/application/handlers/handler.py" '
          class CommandHandler:
              def handle(self, command):
                  if not command.validate():
                      raise ValueError("Invalid command")
                  return self.execute(command)

              def execute(self, command):
                  raise NotImplementedError
          '

          create_file "$BASE/application/queries/query.py" '
          from dataclasses import dataclass
          from typing import Any, Dict

          @dataclass
          class Query:
              name: str
              filters: Dict[str, Any]

              def normalized(self):
                  return {
                      "name": self.name,
                      "filters": dict(self.filters)
                  }
          '

          create_file "$BASE/application/services/application_service.py" '
          class ApplicationService:
              def execute(self, operation, *args, **kwargs):
                  if not callable(operation):
                      raise TypeError("operation must be callable")
                  return operation(*args, **kwargs)
          '

          create_file "$BASE/application/use_cases/use_case.py" '
          class UseCase:
              def execute(self, *args, **kwargs):
                  raise NotImplementedError
          '

          create_file "$BASE/application/workflows/workflow.py" '
          class Workflow:
              def __init__(self):
                  self.steps = []

              def add(self, step):
                  if not callable(step):
                      raise TypeError("Workflow step must be callable")
                  self.steps.append(step)
                  return self

              def run(self, context):
                  result = context
                  for step in self.steps:
                      result = step(result)
                  return result
          '

          # ============================================================
          # CONFIG
          # ============================================================

          create_file "$BASE/config/application/settings.py" '
          APPLICATION_NAME = "agro"
          APPLICATION_VERSION = "1.0.0"
          ENVIRONMENT = "production"
          '

          create_file "$BASE/config/database/settings.py" '
          DATABASE_TIMEOUT_SECONDS = 30
          DATABASE_POOL_SIZE = 10
          '

          create_file "$BASE/config/events/settings.py" '
          EVENT_BUS_ENABLED = True
          EVENT_DELIVERY_RETRIES = 5
          '

          create_file "$BASE/config/modules/settings.py" '
          MODULES_ENABLED = True
          '

          create_file "$BASE/config/network/settings.py" '
          NETWORK_ENABLED = True
          NETWORK_SERVICE = "zyra_network"
          '

          create_file "$BASE/config/permissions/settings.py" '
          PERMISSIONS_ENABLED = True
          DEFAULT_PERMISSION = "read"
          '

          create_file "$BASE/config/registry/settings.py" '
          REGISTRY_ENABLED = True
          '

          create_file "$BASE/config/routes/settings.py" '
          API_PREFIX = "/api/agro"
          '

          create_file "$BASE/config/security/settings.py" '
          SECURITY_ENABLED = True
          SECURITY_PROVIDER = "supreme_security"
          '

          create_file "$BASE/config/system/settings.py" '
          SYSTEM_NAME = "AGRO"
          SYSTEM_MODE = "operational"
          '

          # ============================================================
          # CONSTANTS
          # ============================================================

          create_file "$BASE/constants/business/constants.py" '
          PRODUCER_TYPES = (
              "agricultor",
              "ganadero",
              "productor_mixto",
              "cooperativa",
              "asociacion",
              "empresa_agropecuaria",
          )
          '

          create_file "$BASE/constants/events/constants.py" '
          PRODUCER_REGISTERED = "agro.producer.registered"
          PRODUCTION_UPDATED = "agro.production.updated"
          MARKET_PRICE_CHANGED = "agro.market.price_changed"
          AID_DELIVERED = "agro.aid.delivered"
          RISK_DETECTED = "agro.risk.detected"
          '

          create_file "$BASE/constants/permissions/constants.py" '
          READ = "read"
          CREATE = "create"
          UPDATE = "update"
          DELETE = "delete"
          ADMIN = "admin"
          '

          create_file "$BASE/constants/roles/constants.py" '
          PRODUCER = "producer"
          COMPANY = "company"
          GOVERNMENT = "government"
          OPERATOR = "operator"
          ADMINISTRATOR = "administrator"
          '

          create_file "$BASE/constants/security/constants.py" '
          AUTHENTICATED = "authenticated"
          VERIFIED = "verified"
          '

          create_file "$BASE/constants/system/constants.py" '
          SYSTEM_NAME = "AGRO"
          SYSTEM_VERSION = "1.0.0"
          '

          # ============================================================
          # DOMAIN
          # ============================================================

          create_file "$BASE/domain/entities/base_entity.py" '
          from dataclasses import dataclass, field
          from datetime import datetime
          from uuid import uuid4

          @dataclass
          class Entity:
              id: str = field(default_factory=lambda: str(uuid4()))
              created_at: datetime = field(default_factory=datetime.utcnow)
              updated_at: datetime = field(default_factory=datetime.utcnow)

              def touch(self):
                  self.updated_at = datetime.utcnow()
          '

          create_file "$BASE/domain/entities/producer.py" '
          from dataclasses import dataclass, field
          from typing import Optional
          from .base_entity import Entity

          @dataclass
          class Producer(Entity):
              name: str = ""
              producer_type: str = ""
              verified: bool = False
              active: bool = True
              location: Optional[str] = None
          '

          create_file "$BASE/domain/entities/production.py" '
          from dataclasses import dataclass
          from .base_entity import Entity

          @dataclass
          class Production(Entity):
              producer_id: str = ""
              product: str = ""
              quantity: float = 0.0
              unit: str = ""
              status: str = "planned"
          '

          create_file "$BASE/domain/entities/company.py" '
          from dataclasses import dataclass
          from .base_entity import Entity

          @dataclass
          class Company(Entity):
              legal_name: str = ""
              registration_id: str = ""
              active: bool = True
          '

          create_file "$BASE/domain/engines/domain_engine.py" '
          class DomainEngine:
              def process(self, entity):
                  if entity is None:
                      raise ValueError("Entity is required")
                  return entity
          '

          create_file "$BASE/domain/events/domain_event.py" '
          from dataclasses import dataclass, field
          from datetime import datetime
          from uuid import uuid4

          @dataclass
          class DomainEvent:
              event_id: str = field(default_factory=lambda: str(uuid4()))
              event_type: str = ""
              payload: dict = field(default_factory=dict)
              occurred_at: datetime = field(default_factory=datetime.utcnow)
          '

          create_file "$BASE/domain/exceptions/domain_exception.py" '
          class AgroDomainError(Exception):
              pass

          class ValidationError(AgroDomainError):
              pass

          class NotFoundError(AgroDomainError):
              pass
          '

          create_file "$BASE/domain/repositories/repository.py" '
          from abc import ABC, abstractmethod

          class Repository(ABC):

              @abstractmethod
              def save(self, entity):
                  raise NotImplementedError

              @abstractmethod
              def get(self, entity_id):
                  raise NotImplementedError

              @abstractmethod
              def list(self):
                  raise NotImplementedError
          '

          create_file "$BASE/domain/services/domain_service.py" '
          class DomainService:
              def validate(self, entity):
                  if entity is None:
                      raise ValueError("Entity is required")
                  return True
          '

          create_file "$BASE/domain/value_objects/value_object.py" '
          from dataclasses import dataclass

          @dataclass(frozen=True)
          class ValueObject:
              value: object

              def __str__(self):
                  return str(self.value)
          '

          # ============================================================
          # EVENTS
          # ============================================================

          create_file "$BASE/events/dispatchers/dispatcher.py" '
          class EventDispatcher:
              def dispatch(self, event, handlers):
                  results = []
                  for handler in handlers:
                      results.append(handler(event))
                  return results
          '

          create_file "$BASE/events/handlers/handler.py" '
          class EventHandler:
              def handle(self, event):
                  raise NotImplementedError
          '

          create_file "$BASE/events/publishers/publisher.py" '
          class EventPublisher:
              def __init__(self):
                  self.events = []

              def publish(self, event):
                  self.events.append(event)
                  return event
          '

          create_file "$BASE/events/registry/registry.py" '
          class EventRegistry:
              def __init__(self):
                  self._handlers = {}

              def register(self, event_type, handler):
                  self._handlers.setdefault(event_type, []).append(handler)

              def handlers(self, event_type):
                  return list(self._handlers.get(event_type, []))
          '

          create_file "$BASE/events/subscribers/subscriber.py" '
          class EventSubscriber:
              def subscribe(self, registry, event_type, handler):
                  registry.register(event_type, handler)
          '

          # ============================================================
          # PERMISSIONS
          # ============================================================

          create_file "$BASE/permissions/policies/policy.py" '
          class Policy:
              def __init__(self, name, allowed_actions):
                  self.name = name
                  self.allowed_actions = set(allowed_actions)

              def allows(self, action):
                  return action in self.allowed_actions
          '

          create_file "$BASE/permissions/roles/role.py" '
          class Role:
              def __init__(self, name, permissions=None):
                  self.name = name
                  self.permissions = set(permissions or [])

              def can(self, permission):
                  return permission in self.permissions
          '

          create_file "$BASE/permissions/rules/rule.py" '
          class PermissionRule:
              def __init__(self, permission):
                  self.permission = permission

              def evaluate(self, permissions):
                  return self.permission in permissions
          '

          create_file "$BASE/permissions/scopes/scope.py" '
          class PermissionScope:
              def __init__(self, name, resources=None):
                  self.name = name
                  self.resources = set(resources or [])

              def contains(self, resource):
                  return resource in self.resources
          '

          # ============================================================
          # REGISTRY
          # ============================================================

          create_file "$BASE/registry/modules/registry.py" '
          class ModuleRegistry:
              _modules = {}

              @classmethod
              def register(cls, name, module):
                  cls._modules[name] = module

              @classmethod
              def get(cls, name):
                  return cls._modules.get(name)

              @classmethod
              def all(cls):
                  return dict(cls._modules)
          '

          create_file "$BASE/registry/menus/registry.py" '
          class MenuRegistry:
              _menus = {}

              @classmethod
              def register(cls, module, menu):
                  cls._menus[module] = menu

              @classmethod
              def build(cls):
                  return dict(cls._menus)
          '

          create_file "$BASE/registry/engines/registry.py" '
          class EngineRegistry:
              _engines = {}

              @classmethod
              def register(cls, name, engine):
                  cls._engines[name] = engine

              @classmethod
              def get(cls, name):
                  return cls._engines.get(name)
          '

          create_file "$BASE/registry/events/registry.py" '
          from apps.agro.events.registry.registry import EventRegistry

          event_registry = EventRegistry()
          '

          create_file "$BASE/registry/permissions/registry.py" '
          class PermissionRegistry:
              _permissions = set()

              @classmethod
              def register(cls, permission):
                  cls._permissions.add(permission)

              @classmethod
              def all(cls):
                  return sorted(cls._permissions)
          '

          create_file "$BASE/registry/roles/registry.py" '
          class RoleRegistry:
              _roles = {}

              @classmethod
              def register(cls, role):
                  cls._roles[role.name] = role

              @classmethod
              def get(cls, name):
                  return cls._roles.get(name)
          '

          create_file "$BASE/registry/routes/registry.py" '
          class RouteRegistry:
              _routes = {}

              @classmethod
              def register(cls, path, handler):
                  cls._routes[path] = handler

              @classmethod
              def all(cls):
                  return dict(cls._routes)
          '

          create_file "$BASE/registry/services/registry.py" '
          class ServiceRegistry:
              _services = {}

              @classmethod
              def register(cls, name, service):
                  cls._services[name] = service

              @classmethod
              def get(cls, name):
                  return cls._services.get(name)
          '

          create_file "$BASE/registry/templates/registry.py" '
          class TemplateRegistry:
              _templates = {}

              @classmethod
              def register(cls, name, template):
                  cls._templates[name] = template

              @classmethod
              def get(cls, name):
                  return cls._templates.get(name)
          '

          # ============================================================
          # ROUTERS
          # ============================================================

          create_file "$BASE/routers/api/router.py" '
          from apps.agro.registry.routes.registry import RouteRegistry

          def register_route(path, handler):
              RouteRegistry.register(path, handler)

          def routes():
              return RouteRegistry.all()
          '

          create_file "$BASE/routers/internal/router.py" '
          def internal_health():
              return {"scope": "internal", "status": "operational"}
          '

          create_file "$BASE/routers/public/router.py" '
          def public_health():
              return {"scope": "public", "status": "operational"}
          '

          create_file "$BASE/routers/websocket/router.py" '
          class AgroWebSocketRouter:
              def __init__(self):
                  self.connections = set()

              def connect(self, connection):
                  self.connections.add(connection)

              def disconnect(self, connection):
                  self.connections.discard(connection)
          '

          # ============================================================
          # SCHEMAS
          # ============================================================

          create_file "$BASE/schemas/entities/producer.py" '
          from pydantic import BaseModel

          class ProducerSchema(BaseModel):
              name: str
              producer_type: str
              location: str | None = None
          '

          create_file "$BASE/schemas/entities/production.py" '
          from pydantic import BaseModel

          class ProductionSchema(BaseModel):
              producer_id: str
              product: str
              quantity: float
              unit: str
          '

          create_file "$BASE/schemas/requests/producer_request.py" '
          from pydantic import BaseModel

          class ProducerRequest(BaseModel):
              name: str
              producer_type: str
              location: str | None = None
          '

          create_file "$BASE/schemas/requests/production_request.py" '
          from pydantic import BaseModel

          class ProductionRequest(BaseModel):
              producer_id: str
              product: str
              quantity: float
              unit: str
          '

          create_file "$BASE/schemas/responses/producer_response.py" '
          from pydantic import BaseModel

          class ProducerResponse(BaseModel):
              id: str
              name: str
              producer_type: str
              verified: bool
          '

          create_file "$BASE/schemas/responses/production_response.py" '
          from pydantic import BaseModel

          class ProductionResponse(BaseModel):
              id: str
              producer_id: str
              product: str
              quantity: float
              unit: str
          '

          create_file "$BASE/schemas/shared/pagination.py" '
          from pydantic import BaseModel

          class Pagination(BaseModel):
              page: int = 1
              page_size: int = 50
              total: int = 0
          '

          # ============================================================
          # SERVICES
          # ============================================================

          create_file "$BASE/services/producer_service.py" '
          from apps.agro.domain.entities.producer import Producer

          class ProducerService:
              def create(self, name, producer_type, location=None):
                  if not name.strip():
                      raise ValueError("Producer name is required")

                  return Producer(
                      name=name.strip(),
                      producer_type=producer_type,
                      location=location
                  )

              def verify(self, producer):
                  producer.verified = True
                  producer.touch()
                  return producer
          '

          create_file "$BASE/services/production_service.py" '
          from apps.agro.domain.entities.production import Production

          class ProductionService:
              def create(self, producer_id, product, quantity, unit):
                  if quantity <= 0:
                      raise ValueError("Quantity must be positive")

                  return Production(
                      producer_id=producer_id,
                      product=product,
                      quantity=quantity,
                      unit=unit
                  )

              def complete(self, production):
                  production.status = "completed"
                  production.touch()
                  return production
          '

          create_file "$BASE/services/market_service.py" '
          class MarketService:
              def compare_prices(self, prices):
                  valid = [float(value) for value in prices if value is not None]

                  if not valid:
                      return None

                  return {
                      "minimum": min(valid),
                      "maximum": max(valid),
                      "average": sum(valid) / len(valid)
                  }
          '

          # ============================================================
          # VALIDATORS
          # ============================================================

          create_file "$BASE/validators/producer_validator.py" '
          class ProducerValidator:
              def validate(self, name, producer_type):
                  if not name or not name.strip():
                      raise ValueError("Producer name is required")

                  if not producer_type:
                      raise ValueError("Producer type is required")

                  return True
          '

          create_file "$BASE/validators/production_validator.py" '
          class ProductionValidator:
              def validate(self, quantity):
                  if quantity <= 0:
                      raise ValueError("Production quantity must be positive")
                  return True
          '

          create_file "$BASE/validators/business_validator.py" '
          class BusinessValidator:
              def validate_registration(self, registration_id):
                  if not registration_id:
                      raise ValueError("Registration ID is required")
                  return True
          '

          # ============================================================
          # SECURITY
          # ============================================================

          create_file "$BASE/security/access_control.py" '
          class AccessControl:
              def authorize(self, permissions, required):
                  return required in set(permissions)
          '

          create_file "$BASE/security/security_context.py" '
          from dataclasses import dataclass, field

          @dataclass
          class SecurityContext:
              subject_id: str
              roles: set[str] = field(default_factory=set)
              permissions: set[str] = field(default_factory=set)

              def has_permission(self, permission):
                  return permission in self.permissions
          '

          create_file "$BASE/security/security_gateway.py" '
          class SecurityGateway:
              def authorize(self, context, permission):
                  if not context.has_permission(permission):
                      raise PermissionError(
                          f"Permission denied: {permission}"
                      )
                  return True
          '

          # ============================================================
          # SHARED
          # ============================================================

          create_file "$BASE/shared/result.py" '
          from dataclasses import dataclass
          from typing import Any

          @dataclass
          class Result:
              success: bool
              data: Any = None
              error: str | None = None

              @classmethod
              def ok(cls, data=None):
                  return cls(True, data=data)

              @classmethod
              def fail(cls, error):
                  return cls(False, error=error)
          '

          create_file "$BASE/shared/pagination.py" '
          def paginate(items, page=1, page_size=50):
              if page < 1 or page_size < 1:
                  raise ValueError("Invalid pagination")

              start = (page - 1) * page_size
              end = start + page_size

              return {
                  "items": items[start:end],
                  "page": page,
                  "page_size": page_size,
                  "total": len(items)
              }
          '

          create_file "$BASE/shared/utils.py" '
          def normalize_text(value):
              return " ".join(str(value).strip().split())

          def is_positive_number(value):
              try:
                  return float(value) > 0
              except (TypeError, ValueError):
                  return False
          '

          # ============================================================
          # INFRASTRUCTURE
          # ============================================================

          create_file "$BASE/infrastructure/database/repository.py" '
          class InMemoryRepository:
              def __init__(self):
                  self._items = {}

              def save(self, entity):
                  self._items[entity.id] = entity
                  return entity

              def get(self, entity_id):
                  return self._items.get(entity_id)

              def list(self):
                  return list(self._items.values())

              def delete(self, entity_id):
                  return self._items.pop(entity_id, None)
          '

          create_file "$BASE/infrastructure/persistence/unit_of_work.py" '
          class UnitOfWork:
              def __init__(self):
                  self._operations = []

              def add(self, operation):
                  self._operations.append(operation)

              def commit(self):
                  results = [operation() for operation in self._operations]
                  self._operations.clear()
                  return results

              def rollback(self):
                  self._operations.clear()
          '

          create_file "$BASE/infrastructure/repositories/producer_repository.py" '
          from apps.agro.infrastructure.database.repository import InMemoryRepository

          class ProducerRepository(InMemoryRepository):
              pass
          '

          create_file "$BASE/infrastructure/repositories/production_repository.py" '
          from apps.agro.infrastructure.database.repository import InMemoryRepository

          class ProductionRepository(InMemoryRepository):
              pass
          '

          create_file "$BASE/infrastructure/cache/cache.py" '
          class Cache:
              def __init__(self):
                  self._data = {}

              def get(self, key):
                  return self._data.get(key)

              def set(self, key, value):
                  self._data[key] = value
                  return value

              def delete(self, key):
                  self._data.pop(key, None)
          '

          create_file "$BASE/infrastructure/messaging/message_bus.py" '
          class MessageBus:
              def __init__(self):
                  self.messages = []

              def publish(self, message):
                  self.messages.append(message)
                  return message
          '

          create_file "$BASE/infrastructure/network/network_client.py" '
          class NetworkClient:
              def request(self, service, payload=None):
                  return {
                      "service": service,
                      "payload": payload,
                      "status": "requested"
                  }
          '

          create_file "$BASE/infrastructure/providers/provider.py" '
          class Provider:
              def provide(self):
                  raise NotImplementedError
          '

          create_file "$BASE/infrastructure/security/security_provider.py" '
          class SecurityProvider:
              def verify(self, identity):
                  if not identity:
                      raise ValueError("Identity required")
                  return True
          '

          create_file "$BASE/infrastructure/services/service_adapter.py" '
          class ServiceAdapter:
              def call(self, service, *args, **kwargs):
                  method = getattr(service, "execute", None)

                  if method is None:
                      raise AttributeError("Service has no execute method")

                  return method(*args, **kwargs)
          '

          create_file "$BASE/infrastructure/storage/storage.py" '
          class Storage:
              def __init__(self):
                  self._objects = {}

              def put(self, key, value):
                  self._objects[key] = value
                  return key

              def get(self, key):
                  return self._objects.get(key)

              def delete(self, key):
                  self._objects.pop(key, None)
          '

          # ============================================================
          # 11 MODULES
          # Cada módulo mantiene su propia lógica.
          # Los motores transversales se consumen desde ZYRA Network.
          # ============================================================

          declare_module() {
            MODULE="$1"
            ID="$2"
            NAME="$3"

            DIR="$BASE/modules/$MODULE"

            mkdir -p "$DIR"

            create_file "$DIR/__init__.py" ""

            create_file "$DIR/module.py" "MODULE_ID = \"$ID\"
          MODULE_NAME = \"$NAME\"

          def get_module():
              return {
                  \"id\": MODULE_ID,
                  \"name\": MODULE_NAME,
                  \"status\": \"active\"
              }
          "

            create_file "$DIR/menu.py" "def get_menu():
              return {
