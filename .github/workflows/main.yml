          from __future__ import annotations

          import json
          import uuid
          from datetime import datetime, timezone
          from typing import Mapping

          from .clock import Clock, SystemClock
          from .compatibility import validate_contract_version
          from .config import AIEngineConfig
          from .constants import RequestState
          from .errors import (
              RecoveryRequiredError,
              ValidationError,
          )
          from .limits import ConcurrencyLimiter, CostBudget
          from .models import AIRequest, AIResponse
          from .observability.hooks import (
              Metric,
              NullObservabilitySink,
              ObservabilitySink,
          )
          from .persistence.sqlite_store import SQLiteAIStore
          from .providers.registry import ProviderRegistry
          from .resilience import CircuitBreaker, RetryPolicy
          from .security.encryption import AEADEncryptor
          from .security.keys import KeyProvider


          class AIEngine:
              def __init__(
                  self,
                  config: AIEngineConfig,
                  registry: ProviderRegistry,
                  key_provider: KeyProvider,
                  *,
                  clock: Clock | None = None,
                  observability: ObservabilitySink | None = None,
                  worker_id: str | None = None,
              ) -> None:
                  config.validate()

                  self.config = config
                  self.registry = registry
                  self.keys = key_provider
                  self.clock = clock or SystemClock()
                  self.observability = (
                      observability or NullObservabilitySink()
                  )
                  self.worker_id = worker_id or uuid.uuid4().hex

                  self.store = SQLiteAIStore(config.database_path)
                  self.encryptor = AEADEncryptor()
                  self.limiter = ConcurrencyLimiter(config.max_concurrency)
                  self.breaker = CircuitBreaker(
                      config.circuit_failure_threshold,
                      config.circuit_recovery_seconds,
                  )
                  self.retry = RetryPolicy(
                      config.retry_attempts,
                      config.retry_base_seconds,
                  )

              def close(self) -> None:
                  self.store.close()

              def submit(self, request: AIRequest) -> AIResponse:
                  request.validate()
                  validate_contract_version(request.contract_version)

                  if len(json.dumps(dict(request.input_payload))) > (
                      self.config.max_request_bytes
                  ):
                      raise ValidationError("request payload exceeds size limit")

                  existing = self.store.get_request_by_idempotency(
                      request.idempotency_key
                  )

                  if existing is not None:
                      if existing["request_hash"] != request.request_hash:
                          raise ValidationError(
                              "idempotency key conflicts with request"
                          )

                      if existing["state"] == RequestState.COMPLETED:
                          return self._restore_response(existing)

                      if existing["state"] == RequestState.RECOVERY_REQUIRED:
                          raise RecoveryRequiredError(
                              f"request {request.request_id} requires reconciliation"
                          )

                  provider = self.registry.resolve(request)

                  key_version, key = self.keys.current_key()
                  encrypted = self.encryptor.encrypt(
                      json.dumps(
                          dict(request.input_payload),
                          ensure_ascii=False,
                          separators=(",", ":"),
                      ).encode("utf-8"),
                      request.request_hash.encode("utf-8"),
                      key,
                  )

                  self.store.create_request(
                      request_id=request.request_id,
                      idempotency_key=request.idempotency_key,
                      request_hash=request.request_hash,
                      provider=request.provider,
                      model=request.model,
                      encrypted_input=encrypted.ciphertext,
                      nonce=encrypted.nonce,
                      key_version=key_version,
                      now=self.clock.now().isoformat(),
                  )

                  lease_token = self.store.acquire_lease(
                      request.request_id,
                      self.config.lease_seconds,
                      self.worker_id,
                  )

                  if lease_token is None:
                      row = self.store.get_request(request.request_id)
                      if row and row["state"] == RequestState.COMPLETED:
                          return self._restore_response(row)
                      raise RecoveryRequiredError(
                          f"unable to acquire request lease: {request.request_id}"
                      )

                  budget = CostBudget(
                      request.cost_limit or self.config.default_cost_limit
                  )

                  try:
                      with self.limiter.acquire():
                          self.breaker.before_call(request.provider)

                          try:
                              result = self.retry.execute(
                                  lambda: provider.execute(
                                      request,
                                      idempotency_key=request.idempotency_key,
                                      timeout_seconds=self.config.request_timeout_seconds,
                                  )
                              )
                              self.breaker.success(request.provider)
                          except Exception:
                              self.breaker.failure(request.provider)
                              raise

                          budget.validate(result.estimated_cost)

                          response_key_version, response_key = (
                              self.keys.current_key()
                          )

                          response_plaintext = json.dumps(
                              dict(result.payload),
                              ensure_ascii=False,
                              separators=(",", ":"),
                          ).encode("utf-8")

                          response_encrypted = self.encryptor.encrypt(
                              response_plaintext,
                              request.request_id.encode("utf-8"),
                              response_key,
                          )

                          self.store.complete_request(
                              request_id=request.request_id,
                              lease_token=lease_token,
                              provider_request_id=result.provider_request_id,
                              response_payload=response_encrypted.ciphertext,
                              response_nonce=response_encrypted.nonce,
                              response_key_version=response_key_version,
                              now=self.clock.now().isoformat(),
                          )

                          self.observability.emit_metric(
                              Metric(
                                  name="ai.request.completed",
                                  value=1,
                                  tags={
                                      "provider": request.provider,
                                      "model": request.model,
                                  },
                              )
                          )

                          row = self.store.get_request(request.request_id)
                          if row is None:
                              raise ValidationError(
                                  "completed request disappeared"
                              )

                          return self._restore_response(row)

                  except Exception as exc:
                      self.store.mark_recovery_required(
                          request.request_id,
                          lease_token,
                          type(exc).__name__,
                          str(exc),
                      )
                      raise

              def recover(self) -> int:
                  return self.store.recover_expired_leases(
                      self.clock.now().isoformat()
                  )

              def verify_integrity(self) -> None:
                  self.store.verify_database()
                  self.store.verify_audit()

              def backup(self, destination: str) -> None:
                  self.store.backup_to(destination)

              def _restore_response(self, row) -> AIResponse:
                  if row["state"] != RequestState.COMPLETED:
                      raise ValidationError("request is not completed")

                  key = self.keys.get_key(row["response_key_version"])

                  from .security.encryption import EncryptedPayload

                  encrypted = EncryptedPayload(
                      nonce=row["response_nonce"],
                      ciphertext=row["response_payload"],
                  )

                  plaintext = self.encryptor.decrypt(
                      encrypted,
                      row["request_id"].encode("utf-8"),
                      key,
                  )

                  payload = json.loads(plaintext.decode("utf-8"))

                  return AIResponse(
                      request_id=row["request_id"],
                      provider=row["provider"],
                      model=row["model"],
                      provider_request_id=row["provider_request_id"],
                      payload=payload,
                      usage_units=int(payload.get("usage_units", 0)),
                      estimated_cost=int(payload.get("estimated_cost", 0)),
                      completed_at=datetime.fromisoformat(
                          row["updated_at"]
                      ),
                  )
          PY

