          cat > shared_engines/ai/crypto.py <<'PY'
          from __future__ import annotations

          import base64
          import os
          from dataclasses import dataclass

          from cryptography.exceptions import InvalidTag
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          from .errors import AIEncryptionError


          @dataclass(frozen=True, slots=True)
          class KeyMaterial:
              version: int
              key: bytes

              def __post_init__(self) -> None:
                  if self.version < 1:
                      raise ValueError(
                          "Key version must be positive"
                      )

                  if len(self.key) != 32:
                      raise ValueError(
                          "AES-256 key must contain 32 bytes"
                      )


          class VersionedKeyRing:
              """
              Versioned key ring.

              New writes use current_version.
              Existing ciphertext remains decryptable while its key
              version is retained during controlled rotation.
              """

              def __init__(
                  self,
                  keys: tuple[KeyMaterial, ...],
                  current_version: int,
              ) -> None:
                  if not keys:
                      raise ValueError(
                          "At least one encryption key is required"
                      )

                  versions = {
                      item.version
                      for item in keys
                  }

                  if len(versions) != len(keys):
                      raise ValueError(
                          "Duplicate encryption key version"
                      )

                  if current_version not in versions:
                      raise ValueError(
                          "Current key version is not present"
                      )

                  self._keys = {
                      item.version: bytes(item.key)
                      for item in keys
                  }
                  self._current_version = current_version

              @property
              def current_version(self) -> int:
                  return self._current_version

              def key(self, version: int) -> bytes:
                  try:
                      return self._keys[version]
                  except KeyError as exc:
                      raise AIEncryptionError(
                          "Encryption key version unavailable"
                      ) from exc


          class EnvelopeCipher:
              NONCE_BYTES = 12

              def __init__(
                  self,
                  key_ring: VersionedKeyRing,
              ) -> None:
                  self._key_ring = key_ring

              def encrypt(
                  self,
                  plaintext: bytes,
                  *,
                  associated_data: bytes,
              ) -> str:
                  version = self._key_ring.current_version
                  nonce = os.urandom(
                      self.NONCE_BYTES
                  )

                  try:
                      ciphertext = AESGCM(
                          self._key_ring.key(version)
                      ).encrypt(
                          nonce,
                          plaintext,
                          associated_data,
                      )
                  except Exception as exc:
                      raise AIEncryptionError(
                          "Encryption failed"
                      ) from exc

                  encoded = base64.urlsafe_b64encode(
                      nonce + ciphertext
                  ).decode("ascii")

                  return (
                      "v"
                      + str(version)
                      + "."
                      + encoded
                  )

              def decrypt(
                  self,
                  token: str,
                  *,
                  associated_data: bytes,
              ) -> bytes:
                  try:
                      version_text, encoded = token.split(
                          ".",
                          1,
                      )

                      if not version_text.startswith("v"):
                          raise ValueError(
                              "Invalid encrypted envelope"
                          )

                      version = int(
                          version_text[1:]
                      )

                      raw = base64.urlsafe_b64decode(
                          encoded.encode("ascii")
                      )

                      if len(raw) <= self.NONCE_BYTES:
                          raise ValueError(
                              "Encrypted payload is too short"
                          )

                      nonce = raw[:self.NONCE_BYTES]
                      ciphertext = raw[self.NONCE_BYTES:]

                      return AESGCM(
                          self._key_ring.key(version)
                      ).decrypt(
                          nonce,
                          ciphertext,
                          associated_data,
                      )

                  except (
                      InvalidTag,
                      ValueError,
                      TypeError,
                  ) as exc:
                      raise AIEncryptionError(
                          "Authenticated decryption failed"
                      ) from exc
          PY

          cat > shared_engines/ai/registry.py <<'PY'
          from __future__ import annotations

          from threading import RLock

          from .contracts import ModelDescriptor
          from .errors import AIValidationError


          class ModelRegistry:
              """
              Process-local immutable-identity registry.

              A model_id cannot be silently redefined.
              New revisions require a new model identity or an explicit
              registry replacement controlled by the application layer.
              """

              def __init__(self) -> None:
                  self._lock = RLock()
                  self._models: dict[str, ModelDescriptor] = {}
                  self._revision = 0

              def register(
                  self,
                  model: ModelDescriptor,
              ) -> int:
                  with self._lock:
                      existing = self._models.get(
                          model.model_id
                      )

                      if existing is not None:
                          if existing != model:
                              raise AIValidationError(
                                  "Existing model identity cannot be "
                                  "silently redefined"
                              )

                          return self._revision

                      self._models[
                          model.model_id
                      ] = model

                      self._revision += 1

                      return self._revision

              def get(
                  self,
                  model_id: str,
              ) -> ModelDescriptor:
                  normalized = model_id.strip()

                  with self._lock:
                      model = self._models.get(
                          normalized
                      )

                  if model is None:
                      raise AIValidationError(
                          f"Unknown model: {normalized}"
                      )

                  if not model.active:
                      raise AIValidationError(
                          f"Inactive model: {normalized}"
                      )

                  return model

              @property
              def revision(self) -> int:
                  with self._lock:
                      return self._revision

              def snapshot(
                  self,
              ) -> tuple[
                  int,
                  tuple[ModelDescriptor, ...],
              ]:
                  with self._lock:
                      return (
                          self._revision,
                          tuple(
                              self._models.values()
                          ),
                      )
          PY

