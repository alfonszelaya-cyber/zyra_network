      - name: Compile
        run: |
          python -m compileall -q shared_engines/ai

      - name: Reject empty Python files
        shell: bash
        run: |
          set -euo pipefail

          empty="$(find shared_engines/ai \
            -type f \
            -name '*.py' \
            -size 0 \
            -print)"

          if [ -n "$empty" ]; then
            echo "$empty"
            exit 1
          fi

      - name: Reject incomplete implementation markers
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --include='*.py' \
            '(^|[[:space:]])pass([[:space:]]*(#.*)?)?$|NotImplementedError|TODO|FIXME|XXX' \
            shared_engines/ai; then
            echo "Incomplete implementation marker detected."
            exit 1
          fi

      - name: Verify no application dependency
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --include='*.py' \
            '(^|[[:space:]])from[[:space:]]+apps(\.|[[:space:]])|(^|[[:space:]])import[[:space:]]+apps(\.|[[:space:]])' \
            shared_engines/ai; then
            echo "shared_engines/ai cannot depend on apps/."
            exit 1
          fi

      - name: Verify apps untouched
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only | grep -E '^apps/'; then
            echo "apps/ was modified."
            exit 1
          fi

      - name: Type validation
        run: |
          mypy \
            --python-version 3.12 \
            --check-untyped-defs \
            --no-implicit-optional \
            --ignore-missing-imports \
            shared_engines/ai

      - name: Lint
        run: |
          flake8 \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            shared_engines/ai

      - name: Production tests
        run: |
          pytest \
            -q \
            -n auto \
            shared_engines/ai/tests

      - name: Verify required production tree
        shell: bash
        run: |
          set -euo pipefail

          required=(
            shared_engines/ai/__init__.py
            shared_engines/ai/errors.py
            shared_engines/ai/clock.py
            shared_engines/ai/contracts.py
            shared_engines/ai/serialization.py
            shared_engines/ai/codec.py
            shared_engines/ai/crypto.py
            shared_engines/ai/registry.py
            shared_engines/ai/providers.py
            shared_engines/ai/http_provider.py
            shared_engines/ai/circuit.py
            shared_engines/ai/retry.py
            shared_engines/ai/budget.py
            shared_engines/ai/policy.py
            shared_engines/ai/storage.py
            shared_engines/ai/engine.py
            shared_engines/ai/tests/__init__.py
            shared_engines/ai/tests/test_ai_engine.py
          )

          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty: $file"
              exit 1
            fi
          done

      - name: Git integrity
        run: |
          git diff --check
          git status --short

      - name: Commit only AI Engine
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add shared_engines/ai

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "feat(shared-engines): production AI engine"

      - name: Push
        shell: bash
        run: |
          set -euo pipefail

          git push origin "HEAD:${GITHUB_REF_NAME}"
