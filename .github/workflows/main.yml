              context_window=8192,
              max_output_tokens=4096,
          )


          class LocalProvider:
              name = "local-provider"

              def models(self):
                  return (MODEL,)

              def health(self):
                  return True

              def complete(self, request, model):
                  return AIResponse(
                      schema_version=1,
                      request_id=request.request_id,
                      model_id=model.model_id,
                      provider=self.name,
                      output="production-test-response",
                      usage=AIUsage(
                          input_tokens=2,
                          output_tokens=2,
                          total_tokens=4,
                          estimated_cost=Decimal("0.001"),
                      ),
                      created_at=request.created_at,
                      completed_at=request.created_at + 1,
                      response_id="response-" + request.request_id,
