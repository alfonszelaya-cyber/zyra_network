          from __future__ import annotations

          from ..core import (
              ObservationPolicy,
              normalize_labels,
              stable_json,
          )


          class PolicyEngine:
              def __init__(
                  self,
                  policy: ObservationPolicy | None = None,
              ):
                  self.policy = (
                      policy
                      or ObservationPolicy()
                  ).validate()

              def sanitize(self, payload):
                  return self.policy.redact(
                      payload
                  )

              def labels(self, labels):
                  return normalize_labels(
                      labels,
                      max_keys=self.policy.max_labels,
                  )

              def serialized_size(self, payload) -> int:
                  return len(
                      stable_json(
                          self.sanitize(payload)
                      ).encode("utf-8")
                  )

              def allowed(self, payload) -> bool:
                  return (
                      self.serialized_size(payload)
                      <= self.policy.max_event_bytes
                  )

              def enforce(self, payload):
                  sanitized = self.sanitize(
                      payload
                  )

                  if not self.allowed(
                      sanitized
                  ):
                      raise ValueError(
                          "payload exceeds observation policy"
                      )

                  return sanitized


          __all__ = [
              "ObservationPolicy",
              "PolicyEngine",
          ]
