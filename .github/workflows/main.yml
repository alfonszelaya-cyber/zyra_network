      - name: Compile storage
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            storage

      - name: Validate cold storage
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import tempfile

          from storage.cold_storage import (
              ColdStorageEngine,
              ColdStorageManager,
          )

          with tempfile.TemporaryDirectory() as root:
              engine = ColdStorageEngine(root)
              manager = ColdStorageManager(engine)

              object_info = manager.store(
                  "system/test.bin",
                  b"ZYRA-STORAGE",
              )

              assert object_info.size_bytes == 12
              assert manager.contains(
                  "system/test.bin"
              )

              assert manager.retrieve(
                  "system/test.bin"
              ) == b"ZYRA-STORAGE"

              operation = manager.remove(
                  "system/test.bin"
              )

              assert operation.success is True
              assert not manager.contains(
                  "system/test.bin"
              )

          print(
              "Cold storage validation: OK"
          )
          PY

      - name: Validate encrypted backups
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import tempfile

          from storage.encrypted_backups import (
              BackupEngine,
              RestoreEngine,
              RetentionPolicy,
          )

          key = (
              b"zyra-test-key-"
              b"must-not-be-persisted"
          )

          with tempfile.TemporaryDirectory() as root:
              engine = BackupEngine(root)

              artifact = engine.create_backup(
                  "test-source",
                  b"ZYRA-BACKUP-DATA",
                  key,
              )

              restored = RestoreEngine(
                  engine
              ).restore(
                  artifact,
                  key,
              )

              data, result = restored

              assert data == (
                  b"ZYRA-BACKUP-DATA"
              )

              assert result.bytes_restored == (
                  len(data)
              )

          policy = RetentionPolicy(
              max_age_days=30,
              max_backups=10,
          )

          assert (
              policy.max_age_days == 30
          )

          print(
              "Encrypted backup validation: OK"
          )
          PY

      - name: Validate shards
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from storage.shards import (
              Shard,
              ShardAllocator,
              ShardEngine,
              ShardRegistry,
              ShardRebalancer,
          )

          allocator = ShardAllocator(
              shard_count=8
          )

          shard_id = allocator.allocate(
              "global-key-001"
          )

          assert 0 <= shard_id < 8

          registry = ShardRegistry()

          shard = Shard(
              shard_id=shard_id,
              name=f"shard-{shard_id}",
              capacity_bytes=1024 * 1024,
          )

          registry.register(shard)

          engine = ShardEngine()

          value = engine.put(
              shard_id,
              "key",
              {"status": "active"},
          )

          assert value.version == 1

          updated = engine.put(
              shard_id,
              "key",
              {"status": "updated"},
          )

          assert updated.version == 2

          assert engine.get(
              shard_id,
              "key",
          ).value == {
              "status": "updated"
          }

          plan = ShardRebalancer().plan(
              shard_id,
              (shard_id + 1) % 8,
              ("key", "another-key"),
          )

          assert len(plan.keys) == 2

          print(
              "Shard storage validation: OK"
          )
          PY

