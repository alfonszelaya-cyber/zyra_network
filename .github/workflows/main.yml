          cat > infrastructure/gateway/__init__.py <<'PY'
          """Infrastructure gateway routing primitives."""

          from .gateway import (
              Gateway,
              GatewayRequest,
              GatewayResponse,
              Route,
          )

          __all__ = [
              "Gateway",
              "GatewayRequest",
