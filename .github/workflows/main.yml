name: ZYRA - Build Foundation Contracts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production contracts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p foundation/contracts

          cat > foundation/contracts/__init__.py <<'PY'
          """
          ZYRA Foundation Contracts.

          Stable contracts used as boundaries between Network components,
          infrastructure adapters and applications.
          """

          from .base import Contract, ContractViolation
          from .result import Result
          from .versioned import VersionedContract

          __all__ = [
              "Contract",
              "ContractViolation",
              "Result",
              "VersionedContract",
          ]
          PY

          cat > foundation/contracts/base.py <<'PY'
          from __future__ import annotations

          from abc import ABC, abstractmethod
          from typing import Any, ClassVar, Mapping


          class ContractViolation(ValueError):
              """Raised when data violates a declared contract."""


          class Contract(ABC):
              """
              Base contract for stable ZYRA boundaries.

              Contracts define validation and serialization rules without
              coupling callers to a particular storage or transport layer.
              """

              contract_name: ClassVar[str]
              contract_version: ClassVar[int] = 1

              @classmethod
              @abstractmethod
              def validate(cls, value: Any) -> None:
                  """Validate a value against the contract."""

              @classmethod
              @abstractmethod
              def from_dict(cls, value: Mapping[str, Any]) -> "Contract":
                  """Construct a contract instance from a mapping."""

              @abstractmethod
              def to_dict(self) -> dict[str, Any]:
                  """Serialize the contract to a transport-safe mapping."""

              @classmethod
              def metadata(cls) -> dict[str, Any]:
                  return {
                      "name": cls.contract_name,
                      "version": cls.contract_version,
                  }
          PY

          cat > foundation/contracts/result.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Generic, TypeVar


          T = TypeVar("T")


          @dataclass(frozen=True, slots=True)
          class Result(Generic[T]):
              """
              Explicit success/failure result.

              Avoids using exceptions as normal business-flow control while
              preserving an exception object for diagnostics when required.
              """

              success: bool
              value: T | None = None
              error: Exception | None = None

              def __post_init__(self) -> None:
                  if self.success and self.error is not None:
                      raise ValueError(
                          "Successful Result cannot contain an error"
                      )

                  if not self.success and self.error is None:
                      raise ValueError(
                          "Failed Result must contain an error"
                      )

              @classmethod
              def ok(cls, value: T | None = None) -> "Result[T]":
                  return cls(success=True, value=value)

              @classmethod
              def fail(cls, error: Exception) -> "Result[T]":
                  if not isinstance(error, Exception):
                      raise TypeError("error must be an Exception")
                  return cls(success=False, error=error)

              def unwrap(self) -> T:
                  if not self.success:
                      raise self.error  # type: ignore[misc]
                  return self.value  # type: ignore[return-value]

              def unwrap_or(self, default: T) -> T:
                  return self.value if self.success else default
          PY

          cat > foundation/contracts/versioned.py <<'PY'
          from __future__ import annotations

          from abc import abstractmethod
          from typing import Any, ClassVar, Mapping

          from .base import Contract, ContractViolation


          class VersionedContract(Contract):
              """
              Contract with explicit compatibility boundaries.

              A contract version is immutable once published. New versions
              should be introduced as compatible extensions or new contract
              definitions rather than silently changing existing semantics.
              """

              minimum_supported_version: ClassVar[int] = 1

              @classmethod
              def validate_version(cls, version: int) -> None:
                  if not isinstance(version, int):
                      raise ContractViolation(
                          "Contract version must be an integer"
                      )

                  if version < cls.minimum_supported_version:
                      raise ContractViolation(
                          f"Unsupported contract version: {version}"
                      )

                  if version > cls.contract_version:
                      raise ContractViolation(
                          f"Future contract version: {version}"
                      )

              @classmethod
              @abstractmethod
              def migrate(
                  cls,
                  value: Mapping[str, Any],
                  from_version: int,
              ) -> Mapping[str, Any]:
                  """
                  Upgrade an older representation to the current version.
                  """
                  raise NotImplementedError
          PY

          cat > foundation/contracts/serialization.py <<'PY'
          from __future__ import annotations

          import json
          from typing import Any, Mapping


          class ContractSerializationError(ValueError):
              """Raised when contract serialization fails."""


          def to_json(
              value: Mapping[str, Any],
              *,
              sort_keys: bool = True,
          ) -> str:
              if not isinstance(value, Mapping):
                  raise ContractSerializationError(
                      "Contract value must be a mapping"
                  )

              try:
                  return json.dumps(
                      dict(value),
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=sort_keys,
                  )
              except (TypeError, ValueError) as exc:
                  raise ContractSerializationError(
                      "Contract contains non-serializable data"
                  ) from exc


          def from_json(value: str) -> dict[str, Any]:
              if not isinstance(value, str):
                  raise ContractSerializationError(
                      "JSON input must be a string"
                  )

              try:
                  decoded = json.loads(value)
              except json.JSONDecodeError as exc:
                  raise ContractSerializationError(
                      "Invalid contract JSON"
                  ) from exc

              if not isinstance(decoded, dict):
                  raise ContractSerializationError(
                      "Contract JSON root must be an object"
                  )

              return decoded
          PY

          cat > foundation/contracts/registry.py <<'PY'
          from __future__ import annotations

          from threading import RLock
          from typing import Type

          from .base import Contract


          class ContractRegistry:
              """
              Thread-safe registry of published contract classes.

              Registration is explicit and duplicate names are rejected to
              prevent accidental protocol replacement at runtime.
              """

              def __init__(self) -> None:
                  self._lock = RLock()
                  self._contracts: dict[
                      tuple[str, int],
                      Type[Contract],
                  ] = {}

              def register(self, contract: Type[Contract]) -> None:
                  name = getattr(contract, "contract_name", None)
                  version = getattr(contract, "contract_version", None)

                  if not name or not isinstance(name, str):
                      raise ValueError(
                          "Contract must define contract_name"
                      )

                  if not isinstance(version, int) or version < 1:
                      raise ValueError(
                          "Contract version must be a positive integer"
                      )

                  key = (name, version)

                  with self._lock:
                      if key in self._contracts:
                          raise ValueError(
                              f"Contract already registered: {key}"
                          )

                      self._contracts[key] = contract

              def get(
                  self,
                  name: str,
                  version: int,
              ) -> Type[Contract]:
                  with self._lock:
                      try:
                          return self._contracts[(name, version)]
                      except KeyError as exc:
                          raise KeyError(
                              f"Unknown contract: {name}@{version}"
                          ) from exc

              def contains(self, name: str, version: int) -> bool:
                  with self._lock:
                      return (name, version) in self._contracts

              def list(self) -> tuple[tuple[str, int], ...]:
                  with self._lock:
                      return tuple(sorted(self._contracts))
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from foundation.contracts import (
              Contract,
              ContractRegistry,
              ContractViolation,
              Result,
              VersionedContract,
          )
          from foundation.contracts.serialization import (
              from_json,
              to_json,
          )

          class HealthContract(VersionedContract):
              contract_name = "network.health"
              contract_version = 1

              def __init__(self, status: str):
                  self.status = status

              @classmethod
              def validate(cls, value):
                  if not isinstance(value, dict):
                      raise ContractViolation("value must be an object")
                  if value.get("status") not in {"healthy", "degraded", "offline"}:
                      raise ContractViolation("invalid health status")

              @classmethod
              def from_dict(cls, value):
                  cls.validate(value)
                  return cls(value["status"])

              def to_dict(self):
                  return {
                      "status": self.status,
                      "version": self.contract_version,
                  }

              @classmethod
              def migrate(cls, value, from_version):
                  cls.validate_version(from_version)
                  return value

          registry = ContractRegistry()
          registry.register(HealthContract)

          assert registry.contains("network.health", 1)

          obj = HealthContract.from_dict({"status": "healthy"})
          payload = obj.to_dict()

          encoded = to_json(payload)
          decoded = from_json(encoded)

          assert decoded["status"] == "healthy"
          assert Result.ok(obj).unwrap() is obj

          print("FOUNDATION CONTRACTS: OK")
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ZYRA Network"
          git config user.email "actions@users.noreply.github.com"

          git add foundation/contracts

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "feat: production foundation contracts"
          git push
