          from __future__ import annotations

          import sqlite3

          import pytest

          from shared_engines.ai.errors import AuditIntegrityError
          from shared_engines.ai.persistence.sqlite_store import SQLiteAIStore


          def test_audit_tamper_detection(tmp_path):
              path = str(tmp_path / "audit.sqlite3")
              store = SQLiteAIStore(path)

              store.append_audit(
                  event_id="e1",
                  event_type="TEST",
                  event_version=1,
                  aggregate_id="a1",
                  payload_hash="p1",
                  created_at="2026-01-01T00:00:00+00:00",
              )

              store.append_audit(
                  event_id="e2",
                  event_type="TEST",
                  event_version=1,
                  aggregate_id="a1",
                  payload_hash="p2",
                  created_at="2026-01-01T00:00:01+00:00",
              )

              store.verify_audit()

              connection = sqlite3.connect(path)
              connection.execute(
                  "UPDATE audit_log SET payload_hash = 'tampered' WHERE sequence = 1"
              )
              connection.commit()
              connection.close()

              with pytest.raises(AuditIntegrityError):
                  store.verify_audit()

              store.close()
          PY

