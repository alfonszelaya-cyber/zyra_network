          cat > shared_engines/ai/tests/test_storage.py <<'PY'
          from pathlib import Path

          import pytest

          from shared_engines.ai.contracts import AIRequest
          from shared_engines.ai.errors import AIRequestInFlight
          from shared_engines.ai.storage import SQLiteAIStore


          def make_request() -> AIRequest:
              from decimal import Decimal

              return AIRequest(
                  schema_version=1,
                  request_id="r1",
                  idempotency_key="storage-key",
                  model_id="model",
                  prompt="hello",
                  system_prompt=None,
                  max_output_tokens=10,
                  temperature=Decimal("0"),
                  timeout_seconds=10,
                  created_at=1_800_000_000,
              )


          def request_hash(request: AIRequest) -> str:
              import hashlib

              from shared_engines.ai.serialization import (
                  canonical_json,
              )

              return hashlib.sha256(
                  canonical_json(
                      {
                          "schema_version": (
                              request.schema_version
                          ),
                          "model_id": request.model_id,
                          "prompt": request.prompt,
                          "system_prompt": (
                              request.system_prompt
                          ),
                          "max_output_tokens": (
                              request.max_output_tokens
                          ),
                          "temperature": (
                              request.temperature
                          ),
                          "timeout_seconds": (
                              request.timeout_seconds
                          ),
                          "metadata": dict(
                              request.metadata
                          ),
                      }
                  )
              ).hexdigest()


          def make_store(path: Path):
              return SQLiteAIStore(
                  path,
                  encryption_key=(
                      b"0123456789abcdef"
                      b"0123456789abcdef"
                  ),
              )


          def test_lease_conflict(tmp_path: Path):
              store = make_store(
                  tmp_path / "lease.db"
              )

              request = make_request()

              store.reserve(
                  request=request,
                  request_hash=request_hash(
                      request
                  ),
                  owner="worker-a",
                  now=1000,
                  lease_seconds=300,
              )

              with pytest.raises(
                  AIRequestInFlight
              ):
                  store.reserve(
                      request=request,
                      request_hash=request_hash(
                          request
                      ),
                      owner="worker-b",
                      now=1100,
                      lease_seconds=300,
                  )
          PY

          cat > shared_engines/ai/README.md <<'MD'
          # ZYRA Shared AI Engine

          Production-oriented shared AI orchestration layer.

          ## Core durability

          - explicit schema versioning
          - migration checksums
          - SQLite WAL
          - FULL synchronous persistence
          - transactional state transitions
          - durable idempotency
          - lease ownership
          - fencing tokens
          - crash recovery
          - recovery-required state
          - encrypted request storage
          - authenticated response persistence
          - transactional outbox
          - inbox deduplication
          - tamper-evident audit chain

          ## Execution safety

          - immutable contracts
          - strict input validation
          - bounded provider retries
          - request deadlines
          - circuit breakers
          - provider isolation
          - model capability validation
          - bounded cost accounting
          - concurrent request deduplication
          - provider idempotency keys

          ## Architectural rule

          `shared_engines/ai` must never depend on `apps/`.

          Application modules consume this engine.

          The engine does not consume application modules.

          ## Long-term evolution

          This subsystem is designed as a durable foundation rather than a
          short-lived implementation.

          Distributed high availability is intentionally not simulated with
          local SQLite. A future infrastructure adapter can replace the
          local persistence layer while preserving the public engine
          contracts.

          Twenty years cannot be guaranteed by source code. The architecture
          instead prioritizes stable contracts, explicit migrations,
          deterministic identity, recoverability, auditability and adapter
          boundaries so the subsystem can evolve for many years without
          requiring a rewrite of its public contract.
          MD

      - name: Compile
        run: |
          set -euo pipefail
          python -m compileall -q shared_engines/ai

      - name: Reject empty Python files
        shell: bash
        run: |
          set -euo pipefail

          empty="$(
            find shared_engines/ai \
              -type f \
              -name '*.py' \
              -size 0 \
              -print
          )"

          if [ -n "$empty" ]; then
            echo "$empty"
            exit 1
          fi

      - name: Reject incomplete implementation markers
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --include='*.py' \
            '(^|[[:space:]])pass([[:space:]]*(#.*)?)?$|NotImplementedError|TODO|FIXME|XXX' \
            shared_engines/ai; then
            echo "Incomplete implementation marker detected."
            exit 1
          fi

      - name: Verify no application dependency
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --include='*.py' \
            '(^|[[:space:]])from[[:space:]]+apps(\.|[[:space:]])|(^|[[:space:]])import[[:space:]]+apps(\.|[[:space:]])' \
            shared_engines/ai; then
            echo "shared_engines/ai cannot depend on apps/."
            exit 1
          fi

      - name: Verify apps untouched
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only | grep -E '^apps/'; then
            echo "apps/ was modified."
            exit 1
          fi

      - name: Static type validation
        run: |
          set -euo pipefail

          mypy \
            --python-version 3.12 \
            --check-untyped-defs \
            --no-implicit-optional \
            --ignore-missing-imports \
            shared_engines/ai

      - name: Lint
        run: |
          set -euo pipefail

          flake8 \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            shared_engines/ai

      - name: Production tests
        run: |
          set -euo pipefail

          pytest \
            -q \
            -n auto \
            shared_engines/ai/tests

      - name: Verify required production tree
        shell: bash
        run: |
          set -euo pipefail

          required=(
            shared_engines/ai/__init__.py
            shared_engines/ai/errors.py
            shared_engines/ai/clock.py
            shared_engines/ai/contracts.py
            shared_engines/ai/serialization.py
