name: Create Agro 11 Modules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-agro-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        shell: bash
        run: |
          set -e

          echo "Repository root:"
          pwd

          echo "Checking Agro:"
          test -d "apps/agro" || {
            echo "ERROR: apps/agro does not exist."
            exit 1
          }

          mkdir -p "apps/agro/modules"

          echo "Agro modules path:"
          realpath "apps/agro/modules"

      - name: Create 11 Agro modules and all routes
        shell: bash
        run: |
          set -e

          BASE="apps/agro/modules"

          # 1. EXECUTIVE
          mkdir -p \
            "$BASE/executive/dashboard" \
            "$BASE/executive/gestion" \
            "$BASE/executive/monitoreo" \
            "$BASE/executive/gobierno" \
            "$BASE/executive/economia" \
            "$BASE/executive/seguridad"

          # 2. PRODUCTORES
          mkdir -p \
            "$BASE/productores/registro" \
            "$BASE/productores/perfil" \
            "$BASE/productores/unidades_productivas" \
            "$BASE/productores/actividad" \
            "$BASE/productores/programas" \
            "$BASE/productores/documentos" \
            "$BASE/productores/historial" \
            "$BASE/productores/estado"

          # 3. PRODUCCIÓN
          mkdir -p \
            "$BASE/produccion/planificacion" \
            "$BASE/produccion/agricultura" \
            "$BASE/produccion/ganaderia" \
            "$BASE/produccion/seguimiento" \
            "$BASE/produccion/rendimiento" \
            "$BASE/produccion/tecnologia" \
            "$BASE/produccion/reportes"

          # 4. INSUMOS Y APOYOS
          mkdir -p \
            "$BASE/insumos_y_apoyos/insumos" \
            "$BASE/insumos_y_apoyos/programas_gubernamentales" \
            "$BASE/insumos_y_apoyos/beneficios" \
            "$BASE/insumos_y_apoyos/entregas" \
            "$BASE/insumos_y_apoyos/distribucion" \
            "$BASE/insumos_y_apoyos/proveedores" \
            "$BASE/insumos_y_apoyos/asistencia" \
            "$BASE/insumos_y_apoyos/control"

          # 5. RECURSOS Y ACTIVOS
          mkdir -p \
            "$BASE/recursos_y_activos/tierras" \
            "$BASE/recursos_y_activos/infraestructura" \
            "$BASE/recursos_y_activos/maquinaria" \
            "$BASE/recursos_y_activos/equipos" \
            "$BASE/recursos_y_activos/recursos_hidricos" \
            "$BASE/recursos_y_activos/tecnologia" \
            "$BASE/recursos_y_activos/inventarios" \
            "$BASE/recursos_y_activos/valoracion"

          # 6. COMERCIALIZACIÓN
          mkdir -p \
            "$BASE/comercializacion/venta_simple" \
            "$BASE/comercializacion/mercado" \
            "$BASE/comercializacion/alertas_de_mercado" \
            "$BASE/comercializacion/oportunidades" \
            "$BASE/comercializacion/produccion_comercial" \
            "$BASE/comercializacion/empresas" \
            "$BASE/comercializacion/compradores" \
            "$BASE/comercializacion/ventas" \
            "$BASE/comercializacion/logistica" \
            "$BASE/comercializacion/exportacion" \
            "$BASE/comercializacion/resultados"

          # 7. OPERACIONES
          mkdir -p \
            "$BASE/operaciones/actividades" \
            "$BASE/operaciones/produccion" \
            "$BASE/operaciones/recursos" \
            "$BASE/operaciones/inventarios" \
            "$BASE/operaciones/almacenamiento" \
            "$BASE/operaciones/transporte" \
            "$BASE/operaciones/incidencias" \
            "$BASE/operaciones/tecnologia" \
            "$BASE/operaciones/resultados"

          # 8. GOBIERNO
          mkdir -p \
            "$BASE/gobierno/instituciones" \
            "$BASE/gobierno/programas" \
            "$BASE/gobierno/productores" \
            "$BASE/gobierno/solicitudes" \
            "$BASE/gobierno/apoyos" \
            "$BASE/gobierno/entregas" \
            "$BASE/gobierno/territorio" \
            "$BASE/gobierno/crisis" \
            "$BASE/gobierno/seguridad_alimentaria" \
            "$BASE/gobierno/control" \
            "$BASE/gobierno/reportes"

          # 9. RIESGO
          mkdir -p \
            "$BASE/riesgo/riesgo_productivo" \
            "$BASE/riesgo/riesgo_climatico" \
            "$BASE/riesgo/riesgo_territorial" \
            "$BASE/riesgo/alertas" \
            "$BASE/riesgo/impacto" \
            "$BASE/riesgo/respuesta" \
            "$BASE/riesgo/resiliencia"

          # 10. ATENCIÓN AL CLIENTE
          mkdir -p \
            "$BASE/atencion_al_cliente/atencion" \
            "$BASE/atencion_al_cliente/solicitudes" \
            "$BASE/atencion_al_cliente/asistencia" \
            "$BASE/atencion_al_cliente/escalamiento" \
            "$BASE/atencion_al_cliente/comunicacion" \
            "$BASE/atencion_al_cliente/calidad"

          # 11. SEGURIDAD
          mkdir -p \
            "$BASE/seguridad/identidad" \
            "$BASE/seguridad/accesos" \
            "$BASE/seguridad/proteccion" \
            "$BASE/seguridad/control" \
            "$BASE/seguridad/auditoria" \
            "$BASE/seguridad/alertas" \
            "$BASE/seguridad/cumplimiento"

      - name: Create Python package files without overwriting
        shell: bash
        run: |
          set -e

          BASE="apps/agro/modules"

          find "$BASE" -type d -exec sh -c '
            for dir do
              file="$dir/__init__.py"
              if [ ! -e "$file" ]; then
                touch "$file"
              fi
            done
          ' sh {} +

      - name: Verify all 11 modules
        shell: bash
        run: |
          set -e

          BASE="apps/agro/modules"

          modules=(
            "executive"
            "productores"
            "produccion"
            "insumos_y_apoyos"
            "recursos_y_activos"
            "comercializacion"
            "operaciones"
            "gobierno"
            "riesgo"
            "atencion_al_cliente"
            "seguridad"
          )

          for module in "${modules[@]}"; do
            if [ ! -d "$BASE/$module" ]; then
              echo "ERROR: Missing module: $module"
              exit 1
            fi

            if [ ! -f "$BASE/$module/__init__.py" ]; then
              echo "ERROR: Missing __init__.py in: $module"
              exit 1
            fi

            echo "OK: $BASE/$module"
          done

          echo ""
          echo "========================================="
          echo "ALL 11 AGRO MODULES CREATED SUCCESSFULLY"
          echo "========================================="

          echo ""
          echo "Final structure:"
          find "$BASE" -type d | sort

      - name: Commit and push changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/agro/modules

          if git diff --cached --quiet; then
            echo "No new changes to commit."
            exit 0
          fi

          git commit -m "Create Agro 11 modules architecture"
          git push
