                  *,
                  request: AIRequest,
                  owner: str,
                  now: int,
                  error_code: str,
                  error_message: str,
              ) -> None:
                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      cursor = connection.execute(
                          """
                          UPDATE ai_requests
                          SET
                              status = 'recovery_required',
                              lease_owner = NULL,
                              lease_token = NULL,
                              lease_until = NULL,
                              error_code = ?,
                              error_message = ?,
                              updated_at = ?
                          WHERE
                              idempotency_key = ?
                              AND status = 'running'
                              AND lease_owner = ?
                          """,
                          (
                              error_code,
                              error_message[:4000],
                              now,
                              request.idempotency_key,
                              owner,
                          ),
                      )

                      if cursor.rowcount != 1:
                          connection.rollback()

                          raise AILeaseError(
                              "Recovery state rejected: lease lost"
                          )

                      payload = (
                          '{"request_id":"'
                          + request.request_id
                          + '","error_code":"'
                          + error_code
                          + '","timestamp":'
                          + str(now)
                          + "}"
                      )

                      self._audit_tx(
                          connection,
                          aggregate_id=request.idempotency_key,
                          event_type="AI_RECOVERY_REQUIRED",
                          payload=payload,
                          now=now,
                      )

                      connection.commit()

                  except AILeaseError:
                      raise

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          f"Recovery persistence failed: {exc}"
                      ) from exc

                  finally:
                      connection.close()

              def recover_expired(
                  self,
                  *,
                  now: int,
                  stale_after_seconds: int,
              ) -> int:
                  cutoff = (
                      now - stale_after_seconds
                  )

                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      rows = connection.execute(
                          """
                          SELECT idempotency_key
                          FROM ai_requests
                          WHERE
                              status = 'running'
                              AND (
                                  lease_until IS NULL
                                  OR lease_until <= ?
                              )
                              AND updated_at <= ?
                          """,
                          (
                              now,
                              cutoff,
                          ),
                      ).fetchall()

                      for row in rows:
                          aggregate_id = str(
                              row["idempotency_key"]
                          )

                          connection.execute(
                              """
                              UPDATE ai_requests
                              SET
                                  status = 'recovery_required',
                                  lease_owner = NULL,
                                  lease_token = NULL,
                                  lease_until = NULL,
                                  updated_at = ?
                              WHERE idempotency_key = ?
                              """,
                              (
                                  now,
                                  aggregate_id,
                              ),
                          )

                          self._audit_tx(
                              connection,
                              aggregate_id=aggregate_id,
                              event_type="AI_RECOVERY_REQUIRED",
                              payload=(
                                  '{"timestamp":'
                                  + str(now)
                                  + "}"
                              ),
                              now=now,
                          )

                      connection.commit()

                      return len(rows)

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          f"Recovery scan failed: {exc}"
                      ) from exc

                  finally:
                      connection.close()

              def pending_outbox(
                  self,
                  *,
                  limit: int = 100,
              ) -> tuple[OutboxRecord, ...]:
                  if not 1 <= limit <= 10_000:
                      raise ValueError(
                          "Invalid outbox limit"
                      )

                  connection = self._connect()

                  try:
                      rows = connection.execute(
                          """
                          SELECT
                              event_id,
                              aggregate_id,
                              event_type,
                              payload,
                              created_at
                          FROM ai_outbox
                          WHERE published_at IS NULL
                          ORDER BY event_id
                          LIMIT ?
                          """,
                          (limit,),
                      ).fetchall()

                      return tuple(
                          OutboxRecord(
                              event_id=int(row["event_id"]),
                              aggregate_id=str(
                                  row["aggregate_id"]
                              ),
                              event_type=str(
                                  row["event_type"]
                              ),
                              payload=str(
                                  row["payload"]
                              ),
                              created_at=int(
                                  row["created_at"]
                              ),
                          )
                          for row in rows
                      )

                  finally:
                      connection.close()

              def mark_outbox_published(
                  self,
                  *,
                  event_id: int,
                  published_at: int,
              ) -> bool:
                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      cursor = connection.execute(
                          """
                          UPDATE ai_outbox
                          SET published_at = ?
                          WHERE
                              event_id = ?
                              AND published_at IS NULL
                          """,
                          (
                              published_at,
                              event_id,
                          ),
                      )

                      connection.commit()

                      return cursor.rowcount == 1

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          f"Outbox acknowledgement failed: {exc}"
                      ) from exc

                  finally:
                      connection.close()

              def mark_inbox_seen(
                  self,
                  *,
                  consumer: str,
                  event_id: str,
                  received_at: int,
              ) -> bool:
                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      try:
                          connection.execute(
                              """
                              INSERT INTO ai_inbox(
                                  consumer,
                                  event_id,
                                  received_at
                              )
                              VALUES (?, ?, ?)
                              """,
                              (
                                  consumer,
                                  event_id,
                                  received_at,
                              ),
                          )

                          connection.commit()

                          return True

                      except sqlite3.IntegrityError:
                          connection.rollback()

                          return False

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          f"Inbox operation failed: {exc}"
                      ) from exc

                  finally:
                      connection.close()

              def verify_database(self) -> None:
                  connection = self._connect()

                  try:
                      row = connection.execute(
                          "PRAGMA integrity_check"
                      ).fetchone()

                      if row is None or row[0] != "ok":
                          raise AIIntegrityError(
                              "SQLite integrity check failed"
                          )

                  finally:
                      connection.close()

              def verify_audit_chain(self) -> bool:
                  connection = self._connect()

                  try:
                      rows = connection.execute(
                          """
                          SELECT
                              event_id,
                              aggregate_id,
                              event_type,
                              payload_hash,
                              previous_hash,
                              record_hash,
                              created_at
                          FROM ai_audit
                          ORDER BY sequence
                          """
                      ).fetchall()

                      previous = "0" * 64

                      for row in rows:
                          event_id = str(
                              row["event_id"]
                          )
                          aggregate_id = str(
                              row["aggregate_id"]
                          )
                          event_type = str(
                              row["event_type"]
                          )
                          payload_hash = str(
                              row["payload_hash"]
                          )
                          previous_hash = str(
                              row["previous_hash"]
                          )
                          record_hash = str(
                              row["record_hash"]
                          )
                          created_at = int(
                              row["created_at"]
                          )

                          if previous_hash != previous:
                              return False

                          expected = hashlib.sha256(
                              (
                                  event_id
                                  + "|"
                                  + aggregate_id
                                  + "|"
                                  + event_type
                                  + "|"
                                  + payload_hash
                                  + "|"
                                  + previous_hash
                                  + "|"
                                  + str(created_at)
                              ).encode("utf-8")
                          ).hexdigest()

                          if expected != record_hash:
                              return False

                          previous = record_hash

                      return True

                  finally:
                      connection.close()

              def count_requests(self) -> int:
                  connection = self._connect()

                  try:
                      row = connection.execute(
                          """
                          SELECT COUNT(*)
                          FROM ai_requests
                          """
                      ).fetchone()

                      return int(row[0])

                  finally:
                      connection.close()
