          from __future__ import annotations

          import threading
          from collections.abc import Callable
          from dataclasses import dataclass
          from typing import Any

          from observability.events import ObservationEvent


          @dataclass(frozen=True, slots=True)
          class Route:
              name: str
              predicate: Callable[[ObservationEvent], bool]
              handler: Callable[[ObservationEvent], None]


          class ObservationRouter:
              def __init__(self):
                  self._routes: dict[str, Route] = {}
                  self._lock = threading.RLock()

              def add(self, route: Route) -> None:
                  with self._lock:
                      if route.name in self._routes:
                          raise ValueError(
                              f"Route already exists: {route.name}"
                          )
                      self._routes[route.name] = route

              def remove(self, name: str) -> None:
                  with self._lock:
                      self._routes.pop(name, None)

              def dispatch(self, event: ObservationEvent) -> list[str]:
                  with self._lock:
                      routes = list(self._routes.values())

                  delivered: list[str] = []

                  for route in routes:
                      try:
                          matches = route.predicate(event)
                      except Exception:
                          matches = False

                      if not matches:
                          continue

                      route.handler(event)
                      delivered.append(route.name)

                  return delivered

              def route_count(self) -> int:
                  with self._lock:
                      return len(self._routes)
          PY

