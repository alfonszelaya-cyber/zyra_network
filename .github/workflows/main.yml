name: Crear carpetas de Semilla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reiniciar y crear estructura limpia en apps/semilla
        run: |
          # Eliminar estructura anterior de semilla para iniciar desde cero
          rm -rf apps/semilla
          mkdir -p apps/semilla

          # Application
          mkdir -p apps/semilla/application/{academic_use_cases,admissions_use_cases,analytics_use_cases,attendance_use_cases,certification_use_cases,classroom_use_cases,curriculum_use_cases,education_ai_use_cases,evaluation_use_cases,family_use_cases,finance_use_cases,government_use_cases,innovation_use_cases,institution_use_cases,laboratory_use_cases,learning_use_cases,library_use_cases,management_use_cases,psychology_use_cases,reports_use_cases,research_use_cases,scholarship_use_cases,security_use_cases,student_use_cases,teacher_use_cases,transportation_use_cases,zyra_use_cases}

          # Assets
          mkdir -p apps/semilla/assets/{audio,certificates,documents,fonts,icons,images,logos,templates,translations,videos}

          # Config
          mkdir -p apps/semilla/config/{application,database,education,events,modules,network,permissions,registry,routes,security,system}

          # Constants
          mkdir -p apps/semilla/constants/{academic,education,events,grades,permissions,roles,security,system}

          # Generar __init__.py en la raíz y subdirectorios
          find apps/semilla -type d -exec touch {}/__init__.py \;

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Estructura inicial limpia de semilla (application, assets, config, constants)"
          git push origin main
