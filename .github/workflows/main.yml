              ):
                  self.config = config
                  self.policy = config.policy()

                  self.storage = (
                      SQLiteObservationStore(
                          config.storage_path
                      )
                  )

                  self.monitoring = (
                      MonitoringCoordinator(
                          policy=self.policy,
                          storage=self.storage,
                          worker_count=(
                              config.worker_count
                          ),
                      )
                  )

                  self.health = HealthRegistry()

                  self._lock = threading.RLock()
                  self._started = False

                  self.health.register(
                      HealthCheck(
                          "observability_storage",
                          self.storage.integrity_check,
                      )
                  )

              def start(self):
                  with self._lock:
                      if self._started:
                          return

                      self.monitoring.start()
                      self._started = True

              def stop(self):
                  with self._lock:
                      if not self._started:
                          return

                  self.monitoring.stop(
                      self.config.shutdown_timeout_seconds
                  )

                  with self._lock:
                      self.storage.close()
                      self._started = False

              def emit(
                  self,
                  component,
                  operation,
                  event_type,
                  payload=None,
                  *,
                  severity="info",
                  labels=None,
              ):
                  with self._lock:
                      if not self._started:
                          raise LifecycleError(
                              "observability manager "
                              "is not started"
                          )

                  context = (
                      ObservationContext.create(
                          component,
                          operation,
                          labels=labels,
                      )
                  )

                  sanitized = (
                      self.policy.redact(
                          payload or {}
                      )
                  )

                  event = (
                      ObservationEvent.create(
                          event_type,
                          context,
                          sanitized,
                          severity=severity,
                      )
                  )

                  accepted = (
                      self.monitoring.emit(
                          event,
                          block=False,
                      )
                  )

                  if not accepted:
                      raise LifecycleError(
                          "observation queue is full "
                          "or closed"
                      )

                  return event

              def status(self):
                  return {
                      "service":
                          self.config.service_name,
                      "environment":
                          self.config.environment,
                      "started":
                          self._started,
                      "monitoring":
                          self.monitoring.health(),
                      "health":
                          self.health.report(),
                  }

              def __enter__(self):
                  self.start()
                  return self

              def __exit__(
                  self,
                  exc_type,
                  exc_value,
                  traceback,
              ):
                  self.stop()


          __all__ = [
              "ObservabilityManager",
          ]
          PY

          cat > observability/api/api.py <<'PY'
          from __future__ import annotations

          from ..core import ObservationConfig
          from ..manager.manager import (
              ObservabilityManager,
          )


          class ObservabilityAPI:
              """
              Stable public facade.

              Application code can depend on this contract without
              importing implementation modules.
              """

              def __init__(
                  self,
                  manager: ObservabilityManager,
              ):
                  self.manager = manager

              @classmethod
              def from_config(
                  cls,
                  config: ObservationConfig,
              ):
                  manager = (
                      ObservabilityManager(
                          config
                      )
                  )

                  manager.start()

                  return cls(manager)

              def emit(
                  self,
                  component,
                  operation,
                  event_type,
                  payload=None,
                  **kwargs,
              ):
                  return self.manager.emit(
                      component,
                      operation,
                      event_type,
                      payload,
                      **kwargs,
                  )

              def status(self):
                  return self.manager.status()

              def close(self):
                  self.manager.stop()


          __all__ = [
              "ObservabilityAPI",
          ]
          PY

