name: ZYRA Observability Production Block

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-observability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build complete Observability production layer
        shell: bash
        run: |
          set -euo pipefail

          ROOT="observability"

          # ==============================================================
          # HARD BOUNDARY
          # ==============================================================
          #
          # Este bloque solamente construye observability/.
          # Nunca escribe dentro de apps/.
          #
          # ==============================================================

          mkdir -p \
            "$ROOT/api" \
            "$ROOT/alerts" \
            "$ROOT/collector" \
            "$ROOT/context" \
            "$ROOT/dashboards" \
            "$ROOT/engine" \
            "$ROOT/events" \
            "$ROOT/exporter" \
            "$ROOT/health" \
            "$ROOT/incidents" \
            "$ROOT/manager" \
            "$ROOT/metrics" \
            "$ROOT/monitoring" \
            "$ROOT/policy" \
            "$ROOT/query" \
            "$ROOT/registry" \
            "$ROOT/reports" \
            "$ROOT/router" \
            "$ROOT/snapshot" \
            "$ROOT/status" \
            "$ROOT/storage" \
            "$ROOT/tests"

          # ==============================================================
          # observability/context/context.py
          # ==============================================================

          cat > "$ROOT/context/context.py" <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from typing import Mapping
          from uuid import uuid4


          def utc_now() -> datetime:
              return datetime.now(timezone.utc)


          def _id(prefix: str) -> str:
              return f"{prefix}_{uuid4().hex}"


          @dataclass(frozen=True, slots=True)
          class ObservationContext:
              correlation_id: str = field(default_factory=lambda: _id("corr"))
              trace_id: str = field(default_factory=lambda: _id("trace"))
              span_id: str = field(default_factory=lambda: _id("span"))
              parent_span_id: str | None = None
              component: str = "unknown"
              operation: str = "unknown"
              tenant: str | None = None
              actor: str | None = None
              tags: Mapping[str, str] = field(default_factory=dict)
              created_at: datetime = field(default_factory=utc_now)

              def child(
                  self,
                  *,
                  component: str | None = None,
                  operation: str | None = None,
                  tags: Mapping[str, str] | None = None,
              ) -> "ObservationContext":
                  merged = dict(self.tags)
                  if tags:
                      merged.update(tags)

                  return ObservationContext(
                      correlation_id=self.correlation_id,
                      trace_id=self.trace_id,
                      span_id=_id("span"),
                      parent_span_id=self.span_id,
                      component=component or self.component,
                      operation=operation or self.operation,
                      tenant=self.tenant,
                      actor=self.actor,
                      tags=merged,
                  )

              def to_dict(self) -> dict[str, object]:
                  return {
                      "correlation_id": self.correlation_id,
                      "trace_id": self.trace_id,
                      "span_id": self.span_id,
                      "parent_span_id": self.parent_span_id,
                      "component": self.component,
                      "operation": self.operation,
                      "tenant": self.tenant,
                      "actor": self.actor,
                      "tags": dict(self.tags),
                      "created_at": self.created_at.isoformat(),
                  }
          PY

          cat > "$ROOT/context/__init__.py" <<'PY'
          from .context import ObservationContext, utc_now

          __all__ = ["ObservationContext", "utc_now"]
          PY

          # ==============================================================
          # observability/events/events.py
          # ==============================================================

          cat > "$ROOT/events/events.py" <<'PY'
          from __future__ import annotations

          import json
          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from enum import Enum
          from typing import Any, Mapping
          from uuid import uuid4

          from observability.context import ObservationContext


          class EventSeverity(str, Enum):
              DEBUG = "debug"
              INFO = "info"
              WARNING = "warning"
              ERROR = "error"
              CRITICAL = "critical"


          class EventType(str, Enum):
              SYSTEM = "system"
              LIFECYCLE = "lifecycle"
              SECURITY = "security"
              PERFORMANCE = "performance"
              AVAILABILITY = "availability"
              BUSINESS = "business"
              AUDIT = "audit"
              CUSTOM = "custom"


          @dataclass(frozen=True, slots=True)
          class ObservationEvent:
              name: str
              event_type: EventType = EventType.SYSTEM
              severity: EventSeverity = EventSeverity.INFO
              payload: Mapping[str, Any] = field(default_factory=dict)
              context: ObservationContext = field(default_factory=ObservationContext)
              event_id: str = field(default_factory=lambda: uuid4().hex)
              timestamp: datetime = field(
                  default_factory=lambda: datetime.now(timezone.utc)
              )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "event_id": self.event_id,
                      "name": self.name,
                      "event_type": self.event_type.value,
                      "severity": self.severity.value,
                      "payload": dict(self.payload),
                      "context": self.context.to_dict(),
                      "timestamp": self.timestamp.isoformat(),
                  }

              def to_json(self) -> str:
                  return json.dumps(
                      self.to_dict(),
                      ensure_ascii=False,
                      sort_keys=True,
                      default=str,
                  )
          PY

          cat > "$ROOT/events/__init__.py" <<'PY'
          from .events import EventSeverity, EventType, ObservationEvent

          __all__ = ["EventSeverity", "EventType", "ObservationEvent"]
          PY

          # ==============================================================
          # observability/metrics/metrics.py
          # ==============================================================

          cat > "$ROOT/metrics/metrics.py" <<'PY'
          from __future__ import annotations

          import math
          import threading
          import time
          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from enum import Enum
          from typing import Iterable, Mapping


          class MetricKind(str, Enum):
              COUNTER = "counter"
              GAUGE = "gauge"
              HISTOGRAM = "histogram"
              TIMER = "timer"


          @dataclass(frozen=True, slots=True)
          class MetricSample:
              name: str
              value: float
              kind: MetricKind
              timestamp: datetime = field(
                  default_factory=lambda: datetime.now(timezone.utc)
              )
              labels: Mapping[str, str] = field(default_factory=dict)
              unit: str | None = None

              def __post_init__(self) -> None:
                  if not self.name or not self.name.strip():
                      raise ValueError("Metric name cannot be empty")
                  if not math.isfinite(float(self.value)):
                      raise ValueError("Metric value must be finite")

              def identity(self) -> tuple[str, tuple[tuple[str, str], ...]]:
                  return (
                      self.name,
                      tuple(sorted((str(k), str(v)) for k, v in self.labels.items())),
                  )


          class MetricSeries:
              def __init__(self, name: str, kind: MetricKind, labels: Mapping[str, str]):
                  self.name = name
                  self.kind = kind
                  self.labels = dict(labels)
                  self._lock = threading.RLock()
                  self._count = 0
                  self._sum = 0.0
                  self._value = 0.0
                  self._minimum: float | None = None
                  self._maximum: float | None = None

              def observe(self, value: float) -> None:
                  value = float(value)
                  if not math.isfinite(value):
                      raise ValueError("Metric value must be finite")

                  with self._lock:
                      self._count += 1
                      self._sum += value
                      self._value = value
                      self._minimum = (
                          value
                          if self._minimum is None
                          else min(self._minimum, value)
                      )
                      self._maximum = (
                          value
                          if self._maximum is None
                          else max(self._maximum, value)
                      )

              def increment(self, amount: float = 1.0) -> float:
                  with self._lock:
                      self._value += float(amount)
                      self._count += 1
                      self._sum += float(amount)
                      return self._value

              def set(self, value: float) -> None:
                  self.observe(value)

              def snapshot(self) -> dict[str, object]:
                  with self._lock:
                      average = (
                          self._sum / self._count if self._count else None
                      )
                      return {
                          "name": self.name,
                          "kind": self.kind.value,
                          "labels": dict(self.labels),
                          "value": self._value,
                          "count": self._count,
                          "sum": self._sum,
                          "average": average,
                          "minimum": self._minimum,
                          "maximum": self._maximum,
                      }


          class MetricsRegistry:
              def __init__(self, max_series: int = 10000):
                  if max_series <= 0:
                      raise ValueError("max_series must be positive")
                  self.max_series = max_series
                  self._lock = threading.RLock()
                  self._series: dict[
                      tuple[str, tuple[tuple[str, str], ...]], MetricSeries
                  ] = {}

              def _get(
                  self,
                  name: str,
                  kind: MetricKind,
                  labels: Mapping[str, str],
              ) -> MetricSeries:
                  key = (
                      name,
                      tuple(sorted((str(k), str(v)) for k, v in labels.items())),
                  )

                  with self._lock:
                      existing = self._series.get(key)
                      if existing:
                          if existing.kind != kind:
                              raise ValueError(
                                  f"Metric {name!r} already registered as "
                                  f"{existing.kind.value}"
                              )
                          return existing

                      if len(self._series) >= self.max_series:
                          raise RuntimeError("Metric cardinality limit reached")

                      series = MetricSeries(name, kind, labels)
                      self._series[key] = series
                      return series

              def counter(
                  self,
                  name: str,
                  amount: float = 1.0,
                  *,
                  labels: Mapping[str, str] | None = None,
              ) -> float:
                  series = self._get(
                      name, MetricKind.COUNTER, labels or {}
                  )
                  return series.increment(amount)

              def gauge(
                  self,
                  name: str,
                  value: float,
                  *,
                  labels: Mapping[str, str] | None = None,
              ) -> None:
                  self._get(
                      name, MetricKind.GAUGE, labels or {}
                  ).set(value)

              def observe(
                  self,
                  name: str,
                  value: float,
                  *,
                  labels: Mapping[str, str] | None = None,
              ) -> None:
                  self._get(
                      name, MetricKind.HISTOGRAM, labels or {}
                  ).observe(value)

              def timer(
                  self,
                  name: str,
                  *,
                  labels: Mapping[str, str] | None = None,
              ):
                  registry = self
                  start = time.perf_counter()

                  class _Timer:
                      def __enter__(self):
                          return self

                      def __exit__(self, exc_type, exc, tb):
                          elapsed = time.perf_counter() - start
                          registry._get(
                              name, MetricKind.TIMER, labels or {}
                          ).observe(elapsed)

                  return _Timer()

              def samples(self) -> Iterable[MetricSample]:
                  now = datetime.now(timezone.utc)
                  with self._lock:
                      for series in self._series.values():
                          snapshot = series.snapshot()
                          yield MetricSample(
                              name=series.name,
                              value=float(snapshot["value"]),
                              kind=series.kind,
                              timestamp=now,
                              labels=series.labels,
                          )

              def snapshot(self) -> list[dict[str, object]]:
                  with self._lock:
                      return [
                          series.snapshot()
                          for series in self._series.values()
                      ]

              def clear(self) -> None:
                  with self._lock:
                      self._series.clear()
          PY

          cat > "$ROOT/metrics/__init__.py" <<'PY'
          from .metrics import (
              MetricKind,
              MetricSample,
              MetricSeries,
              MetricsRegistry,
          )

          __all__ = [
              "MetricKind",
              "MetricSample",
              "MetricSeries",
              "MetricsRegistry",
          ]
          PY

          # ==============================================================
          # observability/policy/policy.py
          # ==============================================================

          cat > "$ROOT/policy/policy.py" <<'PY'
          from __future__ import annotations

          import re
          from dataclasses import dataclass, field
          from typing import Any, Iterable, Mapping


          @dataclass(frozen=True, slots=True)
          class RetentionPolicy:
              max_events: int = 250000
              max_age_seconds: int = 60 * 60 * 24 * 30

              def __post_init__(self) -> None:
                  if self.max_events <= 0:
                      raise ValueError("max_events must be positive")
                  if self.max_age_seconds <= 0:
                      raise ValueError("max_age_seconds must be positive")


          @dataclass(frozen=True, slots=True)
          class CardinalityPolicy:
              max_labels: int = 32
              max_value_length: int = 256

              def __post_init__(self) -> None:
                  if self.max_labels <= 0:
                      raise ValueError("max_labels must be positive")
                  if self.max_value_length <= 0:
                      raise ValueError("max_value_length must be positive")


          @dataclass(frozen=True, slots=True)
          class SamplingPolicy:
              enabled: bool = False
              rate: float = 1.0

              def __post_init__(self) -> None:
                  if not 0.0 <= self.rate <= 1.0:
                      raise ValueError("sampling rate must be between 0 and 1")


          @dataclass(frozen=True, slots=True)
          class RedactionPolicy:
              sensitive_keys: tuple[str, ...] = (
                  "password",
                  "passwd",
                  "token",
                  "secret",
                  "authorization",
                  "api_key",
                  "private_key",
              )
              replacement: str = "[REDACTED]"

              def redact(
                  self,
                  payload: Mapping[str, Any],
              ) -> dict[str, Any]:
                  sensitive = {
                      key.lower()
                      for key in self.sensitive_keys
                  }

                  def clean(value: Any) -> Any:
                      if isinstance(value, Mapping):
                          return {
                              str(k): (
                                  self.replacement
                                  if str(k).lower() in sensitive
                                  else clean(v)
                              )
                              for k, v in value.items()
                          }
                      if isinstance(value, (list, tuple)):
                          return [clean(item) for item in value]
                      if isinstance(value, str):
                          return re.sub(
                              r"(?i)(bearer\s+)[A-Za-z0-9._~+/=-]+",
                              r"\1[REDACTED]",
                              value,
                          )
                      return value

                  return clean(payload)

              def validate_keys(
                  self,
                  keys: Iterable[str],
              ) -> None:
                  if len(list(keys)) > 32:
                      raise ValueError("Payload contains too many keys")


          @dataclass(frozen=True, slots=True)
          class ObservationPolicy:
              retention: RetentionPolicy = field(
                  default_factory=RetentionPolicy
              )
              cardinality: CardinalityPolicy = field(
                  default_factory=CardinalityPolicy
              )
              sampling: SamplingPolicy = field(
                  default_factory=SamplingPolicy
              )
              redaction: RedactionPolicy = field(
                  default_factory=RedactionPolicy
              )

              def sanitize(
                  self,
                  payload: Mapping[str, Any],
              ) -> dict[str, Any]:
                  if len(payload) > self.cardinality.max_labels:
                      raise ValueError("Payload cardinality limit exceeded")

                  result = self.redaction.redact(payload)

                  def truncate(value: Any) -> Any:
                      if isinstance(value, str):
                          return value[: self.cardinality.max_value_length]
                      if isinstance(value, Mapping):
                          return {
                              str(k)[: self.cardinality.max_value_length]:
                              truncate(v)
                              for k, v in value.items()
                          }
                      if isinstance(value, list):
                          return [truncate(v) for v in value]
                      return value

                  return truncate(result)
          PY

          cat > "$ROOT/policy/__init__.py" <<'PY'
          from .policy import (
              CardinalityPolicy,
              ObservationPolicy,
              RedactionPolicy,
              RetentionPolicy,
              SamplingPolicy,
          )

          __all__ = [
              "CardinalityPolicy",
              "ObservationPolicy",
              "RedactionPolicy",
              "RetentionPolicy",
              "SamplingPolicy",
          ]
          PY

          # ==============================================================
          # observability/storage/storage.py
          # ==============================================================

          cat > "$ROOT/storage/storage.py" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sqlite3
          import threading
          from dataclasses import dataclass
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any, Iterable, Mapping


          class ObservationStorageError(RuntimeError):
              pass


          @dataclass(frozen=True, slots=True)
          class StoredObservation:
              sequence: int
              observation_id: str
              kind: str
              name: str
              timestamp: datetime
              payload: Mapping[str, Any]
              digest: str
              previous_digest: str | None

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "sequence": self.sequence,
                      "observation_id": self.observation_id,
                      "kind": self.kind,
                      "name": self.name,
                      "timestamp": self.timestamp.isoformat(),
                      "payload": dict(self.payload),
                      "digest": self.digest,
                      "previous_digest": self.previous_digest,
                  }


          class ObservationStore:
              """
              Durable SQLite/WAL observation store.

              Design properties:
              - transactional writes
              - WAL journaling
              - indexed timestamp/name queries
              - bounded retention
              - append-only hash chain
              - explicit connection ownership
              - thread-safe writes
              """

              SCHEMA_VERSION = 1

              def __init__(
                  self,
                  path: str | Path,
                  *,
                  timeout_seconds: float = 30.0,
                  max_records: int = 250000,
              ):
                  self.path = Path(path)
                  self.timeout_seconds = timeout_seconds
                  self.max_records = max_records
                  self._lock = threading.RLock()
                  self._local = threading.local()
                  self.path.parent.mkdir(parents=True, exist_ok=True)
                  self._initialize()

              def _connection(self) -> sqlite3.Connection:
                  connection = getattr(self._local, "connection", None)

                  if connection is None:
                      connection = sqlite3.connect(
                          self.path,
                          timeout=self.timeout_seconds,
                          isolation_level=None,
                          check_same_thread=False,
                      )
                      connection.row_factory = sqlite3.Row
                      connection.execute("PRAGMA journal_mode=WAL")
                      connection.execute("PRAGMA synchronous=FULL")
                      connection.execute("PRAGMA foreign_keys=ON")
                      connection.execute("PRAGMA busy_timeout=30000")
                      self._local.connection = connection

                  return connection

              def _initialize(self) -> None:
                  conn = self._connection()

                  conn.executescript(
                      """
                      CREATE TABLE IF NOT EXISTS metadata (
                          key TEXT PRIMARY KEY,
                          value TEXT NOT NULL
                      );

                      CREATE TABLE IF NOT EXISTS observations (
                          sequence INTEGER PRIMARY KEY AUTOINCREMENT,
                          observation_id TEXT NOT NULL UNIQUE,
                          kind TEXT NOT NULL,
                          name TEXT NOT NULL,
                          timestamp TEXT NOT NULL,
                          payload TEXT NOT NULL,
                          digest TEXT NOT NULL,
                          previous_digest TEXT
                      );

                      CREATE INDEX IF NOT EXISTS idx_observations_timestamp
                      ON observations(timestamp);

                      CREATE INDEX IF NOT EXISTS idx_observations_name
                      ON observations(name);

                      CREATE INDEX IF NOT EXISTS idx_observations_kind
                      ON observations(kind);
                      """
                  )

                  conn.execute(
                      "INSERT OR IGNORE INTO metadata(key,value) VALUES(?,?)",
                      ("schema_version", str(self.SCHEMA_VERSION)),
                  )

              @staticmethod
              def _canonical(payload: Mapping[str, Any]) -> str:
                  return json.dumps(
                      payload,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                      default=str,
                  )

              def _last_digest(self, conn) -> str | None:
                  row = conn.execute(
                      "SELECT digest FROM observations "
                      "ORDER BY sequence DESC LIMIT 1"
                  ).fetchone()
                  return row["digest"] if row else None

              def append(
                  self,
                  *,
                  observation_id: str,
                  kind: str,
                  name: str,
                  timestamp: datetime,
                  payload: Mapping[str, Any],
              ) -> StoredObservation:
                  if not observation_id:
                      raise ValueError("observation_id is required")
                  if not kind:
                      raise ValueError("kind is required")
                  if not name:
                      raise ValueError("name is required")

                  timestamp = timestamp.astimezone(timezone.utc)
                  canonical = self._canonical(payload)

                  with self._lock:
                      conn = self._connection()
                      previous = self._last_digest(conn)

                      digest_input = "|".join(
                          [
                              observation_id,
                              kind,
                              name,
                              timestamp.isoformat(),
                              canonical,
                              previous or "",
                          ]
                      )

                      digest = hashlib.sha256(
                          digest_input.encode("utf-8")
                      ).hexdigest()

                      try:
                          conn.execute("BEGIN IMMEDIATE")
                          cursor = conn.execute(
                              """
                              INSERT INTO observations(
                                  observation_id,
                                  kind,
                                  name,
                                  timestamp,
                                  payload,
                                  digest,
                                  previous_digest
                              )
                              VALUES(?,?,?,?,?,?,?)
                              """,
                              (
                                  observation_id,
                                  kind,
                                  name,
                                  timestamp.isoformat(),
                                  canonical,
                                  digest,
                                  previous,
                              ),
                          )
                          sequence = int(cursor.lastrowid)
                          self._enforce_count_locked(conn)
                          conn.execute("COMMIT")
                      except Exception as exc:
                          conn.execute("ROLLBACK")
                          raise ObservationStorageError(
                              "Failed to append observation"
                          ) from exc

                  return StoredObservation(
                      sequence=sequence,
                      observation_id=observation_id,
                      kind=kind,
                      name=name,
                      timestamp=timestamp,
                      payload=dict(payload),
                      digest=digest,
                      previous_digest=previous,
                  )

              def _enforce_count_locked(self, conn) -> None:
                  overflow = conn.execute(
                      "SELECT COUNT(*) AS count FROM observations"
                  ).fetchone()["count"] - self.max_records

                  if overflow > 0:
                      conn.execute(
                          """
                          DELETE FROM observations
                          WHERE sequence IN (
                              SELECT sequence
                              FROM observations
                              ORDER BY sequence ASC
                              LIMIT ?
                          )
                          """,
                          (overflow,),
                      )

              def purge_before(self, timestamp: datetime) -> int:
                  timestamp = timestamp.astimezone(timezone.utc)

                  with self._lock:
                      conn = self._connection()
                      cursor = conn.execute(
                          "DELETE FROM observations WHERE timestamp < ?",
                          (timestamp.isoformat(),),
                      )
                      return cursor.rowcount

              def purge_older_than(self, seconds: int) -> int:
                  cutoff = datetime.now(timezone.utc) - timedelta(
                      seconds=seconds
                  )
                  return self.purge_before(cutoff)

              def query(
                  self,
                  *,
                  start: datetime | None = None,
                  end: datetime | None = None,
                  kind: str | None = None,
                  name: str | None = None,
                  limit: int = 1000,
              ) -> list[StoredObservation]:
                  if limit <= 0:
                      raise ValueError("limit must be positive")

                  conditions: list[str] = []
                  values: list[Any] = []

                  if start:
                      conditions.append("timestamp >= ?")
                      values.append(start.astimezone(timezone.utc).isoformat())

                  if end:
                      conditions.append("timestamp <= ?")
                      values.append(end.astimezone(timezone.utc).isoformat())

                  if kind:
                      conditions.append("kind = ?")
                      values.append(kind)

                  if name:
                      conditions.append("name = ?")
                      values.append(name)

                  where = (
                      " WHERE " + " AND ".join(conditions)
                      if conditions
                      else ""
                  )

                  sql = (
                      "SELECT * FROM observations"
                      + where
                      + " ORDER BY sequence ASC LIMIT ?"
                  )

                  values.append(limit)

                  rows = self._connection().execute(
                      sql, values
                  ).fetchall()

                  return [
                      StoredObservation(
                          sequence=int(row["sequence"]),
                          observation_id=row["observation_id"],
                          kind=row["kind"],
                          name=row["name"],
                          timestamp=datetime.fromisoformat(
                              row["timestamp"]
                          ),
                          payload=json.loads(row["payload"]),
                          digest=row["digest"],
                          previous_digest=row["previous_digest"],
                      )
                      for row in rows
                  ]

              def count(self) -> int:
                  row = self._connection().execute(
                      "SELECT COUNT(*) AS count FROM observations"
                  ).fetchone()
                  return int(row["count"])

              def verify_chain(self) -> bool:
                  rows = self._connection().execute(
                      """
                      SELECT observation_id,kind,name,timestamp,payload,
                             digest,previous_digest
                      FROM observations
                      ORDER BY sequence ASC
                      """
                  ).fetchall()

                  previous = None

                  for row in rows:
                      if row["previous_digest"] != previous:
                          return False

                      digest_input = "|".join(
                          [
                              row["observation_id"],
                              row["kind"],
                              row["name"],
                              row["timestamp"],
                              row["payload"],
                              previous or "",
                          ]
                      )

                      expected = hashlib.sha256(
                          digest_input.encode("utf-8")
                      ).hexdigest()

                      if expected != row["digest"]:
                          return False

                      previous = row["digest"]

