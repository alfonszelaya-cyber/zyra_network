name: Zyra Network - Shared Engines AI Production

on:
  workflow_dispatch:
  push:
    branches:
      - principal
    paths:
      - "shared_engines/ai/**"
      - ".github/workflows/shared-engines-ai-production.yml"

permissions:
  contents: write

concurrency:
  group: zyra-shared-ai-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            cryptography \
            pytest \
            pytest-xdist \
            mypy \
            flake8

      - name: Generate production AI Engine
        shell: bash
        run: |
          set -euo pipefail

          rm -rf shared_engines/ai

          mkdir -p \
            shared_engines/ai/tests \
            shared_engines/ai/providers \
            shared_engines/ai/security \
            shared_engines/ai/persistence

          cat > shared_engines/ai/__init__.py <<'PY'
          """
          ZYRA Network Shared AI Engine.

          Infrastructure-neutral AI orchestration layer.

          Guarantees provided by this package:

          - versioned contracts
          - deterministic request identity
          - immutable public models
          - strict validation
          - bounded execution
          - durable idempotency
          - crash-safe request leases
          - fencing ownership
          - recovery-required state
          - authenticated encryption
          - transactional outbox
          - tamper-evident audit chain
          - database migrations
          - provider isolation
          - circuit breaking
          - bounded retries
          - cost accounting
          - concurrency protection
          - provider failover

          Application modules must not be imported by this package.
          """

          from .contracts import AIRequest, AIResponse, AIUsage, ModelDescriptor
          from .engine import AIEngine
          from .errors import (
              AIBudgetExceeded,
              AICircuitOpenError,
              AIEngineError,
              AIIdempotencyConflict,
              AILeaseError,
              AIProviderError,
              AIProviderPermanentError,
              AIProviderTransientError,
              AIProviderUnavailable,
              AIRecoveryRequired,
              AIStorageError,
              AIValidationError,
          )
          from .registry import ModelRegistry
          from .storage import SQLiteAIStore

          __version__ = "1.0.0"
          __schema_version__ = 1

          __all__ = [
              "AIEngine",
              "AIRequest",
              "AIResponse",
              "AIUsage",
              "ModelDescriptor",
              "ModelRegistry",
              "SQLiteAIStore",
              "AIEngineError",
              "AIValidationError",
              "AIProviderError",
              "AIProviderUnavailable",
              "AIProviderTransientError",
              "AIProviderPermanentError",
              "AICircuitOpenError",
              "AIIdempotencyConflict",
              "AIBudgetExceeded",
              "AIRecoveryRequired",
              "AILeaseError",
              "AIStorageError",
          ]
          PY

          cat > shared_engines/ai/errors.py <<'PY'
          class AIEngineError(Exception):
              """Base exception for the AI engine."""


          class AIValidationError(AIEngineError):
              """Input or contract validation failed."""


          class AIProviderError(AIEngineError):
              """An AI provider failed."""


          class AIProviderUnavailable(AIProviderError):
              """No eligible provider is currently available."""


          class AIProviderTransientError(AIProviderError):
              """Provider failure that may be retried."""


          class AIProviderPermanentError(AIProviderError):
              """Provider failure that must not be retried."""


          class AICircuitOpenError(AIProviderError):
              """Provider circuit is open."""


          class AIIdempotencyConflict(AIEngineError):
              """Idempotency key was reused with different input."""


          class AIRequestInFlight(AIEngineError):
              """Another worker currently owns the request."""


          class AIRecoveryRequired(AIEngineError):
              """External operation requires reconciliation."""


          class AIBudgetExceeded(AIEngineError):
              """Configured budget was exceeded."""


          class AIStorageError(AIEngineError):
              """Durable storage operation failed."""


          class AIIntegrityError(AIStorageError):
              """Stored data failed integrity validation."""


          class AIMigrationError(AIStorageError):
              """Database migration failed."""


          class AIEncryptionError(AIStorageError):
              """Encryption or decryption failed."""


          class AILeaseError(AIStorageError):
              """Request lease was lost or could not be acquired."""
          PY

