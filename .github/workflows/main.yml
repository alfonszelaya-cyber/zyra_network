          class SQLiteAIStore:
              """
              Durable local persistence adapter.

              SQLite is intentionally local. Distributed HA must be supplied
              by an infrastructure adapter; this class does not fake a
              distributed database.
              """

              SCHEMA_VERSION = 2

              def __init__(
                  self,
                  path: str | Path,
                  *,
                  cipher: EnvelopeCipher,
                  timeout_seconds: float = 15.0,
              ) -> None:
                  if timeout_seconds <= 0:
                      raise ValueError(
                          "timeout_seconds must be positive"
                      )

                  self._path = str(path)
                  self._timeout = timeout_seconds
                  self._cipher = cipher
                  self._lock = RLock()

                  self._migrate()

              def _connect(self) -> sqlite3.Connection:
                  connection = sqlite3.connect(
                      self._path,
                      timeout=self._timeout,
                      isolation_level=None,
                      check_same_thread=False,
                  )

                  connection.row_factory = sqlite3.Row

                  connection.execute(
                      "PRAGMA foreign_keys = ON"
                  )
                  connection.execute(
                      "PRAGMA journal_mode = WAL"
                  )
                  connection.execute(
                      "PRAGMA synchronous = FULL"
                  )
                  connection.execute(
                      "PRAGMA busy_timeout = 15000"
                  )

                  return connection

              def _migrate(self) -> None:
                  Path(
                      self._path
                  ).parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  connection = self._connect()

                  migration_sql = """
                  CREATE TABLE IF NOT EXISTS ai_requests (
                      idempotency_key TEXT PRIMARY KEY,
                      request_hash TEXT NOT NULL,
                      encrypted_request TEXT NOT NULL,
                      status TEXT NOT NULL,
                      lease_owner TEXT,
                      lease_token TEXT,
                      lease_until INTEGER,
                      attempt INTEGER NOT NULL,
                      response_json TEXT,
                      error_code TEXT,
                      error_message TEXT,
                      created_at INTEGER NOT NULL,
                      updated_at INTEGER NOT NULL
                  );

                  CREATE INDEX IF NOT EXISTS
                  idx_ai_requests_status_lease
                  ON ai_requests(status, lease_until);

                  CREATE TABLE IF NOT EXISTS ai_outbox (
                      event_id INTEGER PRIMARY KEY AUTOINCREMENT,
                      aggregate_id TEXT NOT NULL,
                      event_type TEXT NOT NULL,
                      payload TEXT NOT NULL,
                      created_at INTEGER NOT NULL,
                      published_at INTEGER
                  );

                  CREATE INDEX IF NOT EXISTS
                  idx_ai_outbox_pending
                  ON ai_outbox(published_at, event_id);

                  CREATE TABLE IF NOT EXISTS ai_inbox (
                      consumer TEXT NOT NULL,
                      event_id TEXT NOT NULL,
                      received_at INTEGER NOT NULL,
                      PRIMARY KEY(consumer, event_id)
                  );

                  CREATE TABLE IF NOT EXISTS ai_audit (
                      sequence INTEGER PRIMARY KEY AUTOINCREMENT,
                      event_id TEXT NOT NULL UNIQUE,
                      aggregate_id TEXT NOT NULL,
                      event_type TEXT NOT NULL,
                      payload_hash TEXT NOT NULL,
                      previous_hash TEXT NOT NULL,
                      record_hash TEXT NOT NULL,
                      created_at INTEGER NOT NULL
                  );

                  CREATE TABLE IF NOT EXISTS ai_audit_checkpoints (
                      checkpoint_id INTEGER PRIMARY KEY AUTOINCREMENT,
                      sequence INTEGER NOT NULL,
                      record_hash TEXT NOT NULL,
                      created_at INTEGER NOT NULL
                  );

                  CREATE TABLE IF NOT EXISTS ai_schema_migrations (
                      version INTEGER PRIMARY KEY,
                      checksum TEXT NOT NULL,
                      applied_at INTEGER NOT NULL
                  );
                  """

                  checksum = hashlib.sha256(
                      migration_sql.encode("utf-8")
                  ).hexdigest()

                  try:
                      row = connection.execute(
                          """
                          SELECT version, checksum
                          FROM ai_schema_migrations
                          WHERE version = ?
                          """,
                          (self.SCHEMA_VERSION,),
                      ).fetchone()

                      if row is not None:
                          if (
                              str(row["checksum"])
                              != checksum
                          ):
                              raise AIStorageError(
                                  "Migration checksum mismatch"
                              )

                          return

                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      connection.executescript(
                          migration_sql
                      )

                      connection.execute(
                          """
                          INSERT INTO ai_schema_migrations(
                              version,
                              checksum,
                              applied_at
                          )
                          VALUES (?, ?, ?)
                          """,
                          (
                              self.SCHEMA_VERSION,
                              checksum,
                              int(time.time()),
                          ),
                      )

                      connection.commit()

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          f"AI migration failed: {exc}"
                      ) from exc

                  finally:
                      connection.close()

              def _encrypt_request(
                  self,
                  request: AIRequest,
              ) -> str:
                  return self._cipher.encrypt(
                      request_to_json(
                          request
                      ).encode("utf-8"),
                      associated_data=(
                          request.idempotency_key
                          + "|request|v2"
                      ).encode("utf-8"),
