          from __future__ import annotations

          import json
          import sqlite3
          import threading
          import time
          from pathlib import Path

          from ..core import (
              ObservationEvent,
              PersistenceError,
              SCHEMA_VERSION,
              stable_json,
          )


          class SQLiteObservationStore:
              """
              Durable append-only observation store.

              Guarantees:
              - SQLite WAL mode.
              - Full synchronous commits.
              - Transactional inserts.
              - Unique event IDs for idempotency.
              - Explicit schema version.
              - Indexed time/type/correlation/trace access.
              - Retention deletion.
              - Integrity verification.
              - Thread-safe connection access.
              """

              def __init__(
                  self,
                  path: str,
                  *,
                  timeout: float = 30.0,
              ):
                  if not path:
                      raise PersistenceError(
                          "storage path is required"
                      )

                  self.path = str(
                      Path(path).expanduser()
                  )

                  parent = Path(
                      self.path
                  ).parent

                  parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  self._lock = threading.RLock()

                  try:
                      self._db = sqlite3.connect(
                          self.path,
                          timeout=timeout,
                          check_same_thread=False,
                      )

                      self._db.row_factory = (
                          sqlite3.Row
                      )

                      self._configure()
                      self._migrate()

                  except sqlite3.Error as exc:
                      raise PersistenceError(
                          str(exc)
                      ) from exc

                  self._closed = False

              def _configure(self):
                  statements = (
                      "PRAGMA journal_mode=WAL",
                      "PRAGMA synchronous=FULL",
                      "PRAGMA foreign_keys=ON",
                      "PRAGMA busy_timeout=30000",
                      "PRAGMA temp_store=MEMORY",
                  )

                  for statement in statements:
                      self._db.execute(statement)

              def _migrate(self):
                  with self._db:
                      self._db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS
                          schema_version (
                              version INTEGER NOT NULL,
                              upgraded_at_ns INTEGER NOT NULL
                          )
                          """
                      )

                      row = self._db.execute(
                          """
                          SELECT version
                          FROM schema_version
                          ORDER BY upgraded_at_ns DESC
                          LIMIT 1
                          """
                      ).fetchone()

                      if row is not None:
                          version = int(
                              row["version"]
                          )

                          if version > SCHEMA_VERSION:
                              raise PersistenceError(
                                  "database schema is newer "
                                  "than runtime"
                              )

                      if row is None:
                          self._db.execute(
                              """
                              INSERT INTO schema_version
                              (version, upgraded_at_ns)
                              VALUES (?, ?)
                              """,
                              (
                                  SCHEMA_VERSION,
                                  time.time_ns(),
                              ),
                          )

                      self._db.execute(
                          """
                          CREATE TABLE IF NOT EXISTS
                          observations (
                              sequence INTEGER PRIMARY KEY AUTOINCREMENT,
                              event_id TEXT NOT NULL UNIQUE,
                              event_type TEXT NOT NULL,
                              timestamp_ns INTEGER NOT NULL,
                              severity TEXT NOT NULL,
                              correlation_id TEXT NOT NULL,
                              trace_id TEXT NOT NULL,
                              span_id TEXT NOT NULL,
                              payload_json TEXT NOT NULL,
                              event_json TEXT NOT NULL,
                              content_digest TEXT NOT NULL
                          )
                          """
                      )

                      self._db.execute(
                          """
                          CREATE INDEX IF NOT EXISTS
                          idx_observations_timestamp
                          ON observations(timestamp_ns)
                          """
                      )

                      self._db.execute(
                          """
                          CREATE INDEX IF NOT EXISTS
                          idx_observations_type_time
                          ON observations(
                              event_type,
                              timestamp_ns
                          )
                          """
                      )

                      self._db.execute(
                          """
                          CREATE INDEX IF NOT EXISTS
                          idx_observations_correlation
                          ON observations(
                              correlation_id
                          )
                          """
                      )

                      self._db.execute(
                          """
                          CREATE INDEX IF NOT EXISTS
                          idx_observations_trace
                          ON observations(trace_id)
                          """
                      )

              def _ensure_open(self):
                  if self._closed:
                      raise PersistenceError(
                          "observation store is closed"
                      )

              def append(
                  self,
                  event: ObservationEvent,
              ) -> int:
                  if not isinstance(
                      event,
                      ObservationEvent,
                  ):
                      raise TypeError(
                          "append expects ObservationEvent"
                      )

                  document = event.to_dict()
                  event_json = stable_json(
                      document
                  )
                  payload_json = stable_json(
                      event.payload
                  )

                  from ..core import digest

                  content_digest = digest(
                      document
                  )

                  with self._lock:
                      self._ensure_open()

                      try:
                          with self._db:
                              cursor = self._db.execute(
                                  """
                                  INSERT OR IGNORE INTO
                                  observations (
                                      event_id,
                                      event_type,
                                      timestamp_ns,
                                      severity,
                                      correlation_id,
                                      trace_id,
                                      span_id,
                                      payload_json,
                                      event_json,
                                      content_digest
                                  )
                                  VALUES (
                                      ?, ?, ?, ?, ?, ?,
                                      ?, ?, ?, ?
                                  )
                                  """,
                                  (
                                      event.event_id,
                                      event.event_type,
                                      event.timestamp_ns,
                                      event.severity,
                                      event.context.correlation_id,
                                      event.context.trace_id,
                                      event.context.span_id,
                                      payload_json,
                                      event_json,
                                      content_digest,
                                  ),
                              )

                              if cursor.rowcount:
                                  return int(
                                      cursor.lastrowid
                                  )

                              existing = (
                                  self._db.execute(
                                      """
                                      SELECT sequence
                                      FROM observations
                                      WHERE event_id=?
                                      """,
                                      (event.event_id,),
                                  ).fetchone()
                              )

                              if existing is None:
                                  raise PersistenceError(
                                      "idempotent insert "
                                      "could not resolve "
                                      "existing event"
                                  )

                              return int(
                                  existing["sequence"]
                              )

                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

              def query(
                  self,
                  *,
                  start_ns: int = 0,
                  end_ns: int | None = None,
                  event_type: str | None = None,
                  correlation_id: str | None = None,
                  trace_id: str | None = None,
                  limit: int = 1000,
                  offset: int = 0,
              ):
                  if not 1 <= limit <= 100_000:
                      raise ValueError(
                          "limit out of range"
                      )

                  if offset < 0:
                      raise ValueError(
                          "offset cannot be negative"
                      )

                  end_ns = (
                      end_ns
                      if end_ns is not None
                      else time.time_ns()
                  )

                  clauses = [
                      "timestamp_ns >= ?",
                      "timestamp_ns <= ?",
                  ]

                  arguments = [
                      start_ns,
                      end_ns,
                  ]

                  if event_type:
                      clauses.append(
                          "event_type = ?"
                      )
                      arguments.append(
                          event_type
                      )

                  if correlation_id:
                      clauses.append(
                          "correlation_id = ?"
                      )
                      arguments.append(
                          correlation_id
                      )

                  if trace_id:
                      clauses.append(
                          "trace_id = ?"
                      )
                      arguments.append(
                          trace_id
                      )

                  sql = (
                      "SELECT event_json "
                      "FROM observations WHERE "
                      + " AND ".join(clauses)
                      + " ORDER BY "
                      "timestamp_ns ASC, "
                      "sequence ASC "
                      "LIMIT ? OFFSET ?"
                  )

                  arguments.extend(
                      [limit, offset]
                  )

                  with self._lock:
                      self._ensure_open()

                      try:
                          rows = self._db.execute(
                              sql,
                              arguments,
                          ).fetchall()
                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

                  return [
                      json.loads(
                          row["event_json"]
                      )
                      for row in rows
                  ]

              def purge_before(
                  self,
                  cutoff_ns: int,
              ) -> int:
                  with self._lock:
                      self._ensure_open()

                      try:
                          with self._db:
                              cursor = self._db.execute(
                                  """
                                  DELETE FROM
                                  observations
                                  WHERE timestamp_ns < ?
                                  """,
                                  (cutoff_ns,),
                              )

                              return int(
                                  cursor.rowcount
                              )

                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

              def retention(
                  self,
                  retention_seconds: int,
              ) -> int:
                  cutoff = (
                      time.time_ns()
                      - retention_seconds
                      * 1_000_000_000
                  )

                  return self.purge_before(
                      cutoff
                  )

              def count(self) -> int:
                  with self._lock:
                      self._ensure_open()

                      try:
                          return int(
                              self._db.execute(
                                  """
                                  SELECT COUNT(*)
                                  FROM observations
                                  """
                              ).fetchone()[0]
                          )
                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

              def integrity_check(self) -> bool:
                  with self._lock:
                      self._ensure_open()

                      try:
                          row = self._db.execute(
                              "PRAGMA integrity_check"
                          ).fetchone()

                          return row[0] == "ok"

                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

              def vacuum(self):
                  with self._lock:
                      self._ensure_open()

                      try:
                          self._db.execute(
                              "PRAGMA wal_checkpoint(TRUNCATE)"
                          )
                          self._db.execute(
                              "VACUUM"
                          )
                      except sqlite3.Error as exc:
                          raise PersistenceError(
                              str(exc)
                          ) from exc

              def close(self):
                  with self._lock:
                      if self._closed:
                          return

                      try:
                          self._db.close()
                      finally:
                          self._closed = True

              def __enter__(self):
                  self._ensure_open()
                  return self

              def __exit__(
                  self,
                  exc_type,
                  exc_value,
                  traceback,
              ):
                  self.close()


          __all__ = [
              "SQLiteObservationStore",
          ]
          PY

