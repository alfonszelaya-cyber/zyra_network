      - name: Git integrity checks
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          git diff --check

          if git status --porcelain=v1 \
              | awk '{print $2}' \
              | grep -E '^apps/'; then
            echo "::error::apps/ boundary violation."
            exit 1
          fi

      - name: Stage observability only
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          git add -A -- observability/

          staged="$(
            git diff --cached --name-only
          )"

          if [[ -z "${staged}" ]]; then
            echo "No observability changes detected."
            exit 0
          fi

          unexpected="$(
            printf '%s\n' "${staged}" \
              | grep -v '^observability/' \
              || true
          )"

          if [[ -n "${unexpected}" ]]; then
            echo "::error::Staging boundary violation:"
            echo "${unexpected}"
            git reset
            exit 1
          fi

