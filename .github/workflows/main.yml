name: ZYRA - Build Foundation Context

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-context:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production context
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p foundation/context

          cat > foundation/context/__init__.py <<'PY'
          """
          ZYRA Foundation Context.

          Provides immutable execution context primitives shared by the
          Network, transversal engines and applications.
          """

          from .context import Context
          from .scope import ContextScope
          from .correlation import CorrelationContext
          from .manager import ContextManager

          __all__ = [
              "Context",
              "ContextScope",
              "CorrelationContext",
              "ContextManager",
          ]
          PY

          cat > foundation/context/context.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from types import MappingProxyType
          from typing import Any, Mapping
          from uuid import UUID

          from foundation.ids import generate_id


          @dataclass(frozen=True, slots=True)
          class Context:
              """
              Immutable execution context.

              Carries identity, correlation, causation, tenant and request
              metadata across Network boundaries without coupling components
              to HTTP, databases or message brokers.
              """

              context_id: str
              correlation_id: str
              created_at: datetime
              actor_id: str | None = None
              tenant_id: str | None = None
              request_id: str | None = None
              parent_context_id: str | None = None
              metadata: Mapping[str, Any] = field(
                  default_factory=dict
              )

              def __post_init__(self) -> None:
                  if not self.context_id:
                      raise ValueError("context_id cannot be empty")

                  if not self.correlation_id:
                      raise ValueError(
                          "correlation_id cannot be empty"
                      )

                  if self.created_at.tzinfo is None:
                      raise ValueError(
                          "created_at must be timezone-aware"
                      )

                  object.__setattr__(
                      self,
                      "metadata",
                      MappingProxyType(dict(self.metadata)),
                  )

              @classmethod
              def create(
                  cls,
                  *,
                  actor_id: str | None = None,
                  tenant_id: str | None = None,
                  request_id: str | None = None,
                  correlation_id: str | None = None,
                  parent_context_id: str | None = None,
                  metadata: Mapping[str, Any] | None = None,
              ) -> "Context":
                  context_id = str(
                      generate_id("context")
                  )

                  correlation = (
                      correlation_id
                      or str(generate_id("correlation"))
                  )

                  return cls(
                      context_id=context_id,
                      correlation_id=correlation,
                      created_at=datetime.now(timezone.utc),
                      actor_id=actor_id,
                      tenant_id=tenant_id,
                      request_id=request_id,
                      parent_context_id=parent_context_id,
                      metadata=metadata or {},
                  )

              def child(
                  self,
                  *,
                  metadata: Mapping[str, Any] | None = None,
              ) -> "Context":
                  merged = dict(self.metadata)

                  if metadata:
                      merged.update(metadata)

                  return Context.create(
                      actor_id=self.actor_id,
                      tenant_id=self.tenant_id,
                      request_id=self.request_id,
                      correlation_id=self.correlation_id,
                      parent_context_id=self.context_id,
                      metadata=merged,
                  )

              def with_metadata(
                  self,
                  **values: Any,
              ) -> "Context":
                  merged = dict(self.metadata)
                  merged.update(values)

                  return Context(
                      context_id=self.context_id,
                      correlation_id=self.correlation_id,
                      created_at=self.created_at,
                      actor_id=self.actor_id,
                      tenant_id=self.tenant_id,
                      request_id=self.request_id,
                      parent_context_id=self.parent_context_id,
                      metadata=merged,
                  )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "context_id": self.context_id,
                      "correlation_id": self.correlation_id,
                      "created_at": self.created_at.isoformat(),
                      "actor_id": self.actor_id,
                      "tenant_id": self.tenant_id,
                      "request_id": self.request_id,
                      "parent_context_id": self.parent_context_id,
                      "metadata": dict(self.metadata),
                  }

              @classmethod
              def from_dict(
                  cls,
                  value: Mapping[str, Any],
              ) -> "Context":
                  if not isinstance(value, Mapping):
                      raise TypeError(
                          "Context data must be a mapping"
                      )

                  created_at = datetime.fromisoformat(
                      str(value["created_at"])
                  )

                  return cls(
                      context_id=str(value["context_id"]),
                      correlation_id=str(
                          value["correlation_id"]
                      ),
                      created_at=created_at,
                      actor_id=value.get("actor_id"),
                      tenant_id=value.get("tenant_id"),
                      request_id=value.get("request_id"),
                      parent_context_id=value.get(
                          "parent_context_id"
                      ),
                      metadata=value.get("metadata", {}),
                  )
          PY

          cat > foundation/context/correlation.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass

          from foundation.ids import generate_id


          @dataclass(frozen=True, slots=True)
          class CorrelationContext:
              """
              Correlates distributed operations across services,
              nodes, events and asynchronous workflows.
              """

              correlation_id: str
              causation_id: str | None = None

              @classmethod
              def create(
                  cls,
                  *,
                  causation_id: str | None = None,
              ) -> "CorrelationContext":
                  return cls(
                      correlation_id=str(
                          generate_id("correlation")
                      ),
                      causation_id=causation_id,
                  )

              def child(
                  self,
                  *,
                  causation_id: str | None = None,
              ) -> "CorrelationContext":
                  return CorrelationContext(
                      correlation_id=self.correlation_id,
                      causation_id=(
                          causation_id
                          or self.correlation_id
                      ),
                  )

              def to_headers(self) -> dict[str, str]:
                  headers = {
                      "x-zyra-correlation-id":
                          self.correlation_id,
                  }

                  if self.causation_id:
                      headers["x-zyra-causation-id"] = (
                          self.causation_id
                      )

                  return headers
          PY

          cat > foundation/context/scope.py <<'PY'
          from __future__ import annotations

          from contextvars import ContextVar, Token
          from dataclasses import dataclass

          from .context import Context


          _CURRENT_CONTEXT: ContextVar[
              Context | None
          ] = ContextVar(
              "zyra_current_context",
              default=None,
          )


          @dataclass
          class ContextScope:
              """
              Context manager that safely installs an execution context.

              ContextVar makes the implementation safe for asynchronous
              execution without leaking context between concurrent tasks.
              """

              context: Context
              _token: Token | None = None

              def __enter__(self) -> Context:
                  self._token = _CURRENT_CONTEXT.set(
                      self.context
                  )
                  return self.context

              def __exit__(
                  self,
                  exc_type,
                  exc_value,
                  traceback,
              ) -> None:
                  if self._token is not None:
                      _CURRENT_CONTEXT.reset(self._token)
                      self._token = None


          def current_context() -> Context | None:
              """Return the current execution context."""
              return _CURRENT_CONTEXT.get()


          def require_context() -> Context:
              """Return current context or fail explicitly."""
              context = current_context()

              if context is None:
                  raise RuntimeError(
                      "No active ZYRA execution context"
                  )

              return context
          PY

          cat > foundation/context/manager.py <<'PY'
          from __future__ import annotations

          from contextlib import contextmanager
          from typing import Iterator, Mapping, Any

          from .context import Context
          from .scope import ContextScope, current_context


          class ContextManager:
              """
              Creates and manages Network execution contexts.
              """

              @staticmethod
              def create(
                  *,
                  actor_id: str | None = None,
                  tenant_id: str | None = None,
                  request_id: str | None = None,
                  correlation_id: str | None = None,
                  metadata: Mapping[str, Any] | None = None,
              ) -> Context:
                  return Context.create(
                      actor_id=actor_id,
                      tenant_id=tenant_id,
                      request_id=request_id,
                      correlation_id=correlation_id,
                      metadata=metadata,
                  )

              @staticmethod
              def current() -> Context | None:
                  return current_context()

              @staticmethod
              @contextmanager
              def scope(
                  context: Context,
              ) -> Iterator[Context]:
                  with ContextScope(context):
                      yield context
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from foundation.context import (
              Context,
              ContextManager,
              ContextScope,
              CorrelationContext,
          )
          from foundation.context.scope import (
              current_context,
              require_context,
          )

          context = Context.create(
              actor_id="test-actor",
              tenant_id="test-tenant",
              request_id="request-001",
              metadata={"source": "test"},
          )

          assert context.context_id
          assert context.correlation_id
          assert context.created_at.tzinfo is not None

          child = context.child(
              metadata={"operation": "child"}
          )

          assert child.correlation_id == (
              context.correlation_id
          )
          assert child.parent_context_id == (
              context.context_id
          )

          with ContextScope(context):
              assert current_context() == context
              assert require_context() == context

          assert current_context() is None

          correlation = CorrelationContext.create()

          assert correlation.correlation_id
          assert (
              "x-zyra-correlation-id"
              in correlation.to_headers()
          )

          with ContextManager.scope(context):
              assert ContextManager.current() == context

          restored = Context.from_dict(
              context.to_dict()
          )

          assert restored == context

          print("FOUNDATION CONTEXT: OK")
          PY

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q foundation/context

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ZYRA Network"
          git config user.email "actions@users.noreply.github.com"

          git add foundation/context

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "feat: production foundation context"
          git push
