name: Populate Docker Core Infrastructure

on:
  workflow_dispatch:

jobs:
  populate-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure docker directory exists
        run: mkdir -p docker

      - name: Write Dockerfile
        run: |
          cat << 'EOF' > docker/Dockerfile
          # ==========================================
          # Stage 1: Build & Dependencies
          # ==========================================
          FROM python:3.11-slim AS builder

          ENV PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1 \
              PIP_NO_CACHE_DIR=1 \
              PIP_DISABLE_PIP_VERSION_CHECK=1

          WORKDIR /app

          RUN apt-get update && apt-get install -y --no-install-recommends \
              build-essential \
              curl \
              libpq-dev \
              && rm -rf /var/lib/apt/lists/*

          COPY requirements.txt .
          RUN python -m venv /opt/venv
          ENV PATH="/opt/venv/bin:$PATH"
          RUN pip install --upgrade pip && pip install -r requirements.txt

          # ==========================================
          # Stage 2: Production Runtime (Long-Term Support)
          # ==========================================
          FROM python:3.11-slim AS runner

          ENV PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1 \
              PATH="/opt/venv/bin:$PATH" \
              TZ=UTC

          # Security: Non-root user execution
          RUN groupadd -g 10001 zyra && \
              useradd -u 10001 -g zyra -s /bin/sh -m zyrauser

          WORKDIR /app

          RUN apt-get update && apt-get install -y --no-install-recommends \
              libpq5 \
              curl \
              ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          COPY --from=builder /opt/venv /opt/venv
          COPY . /app

          RUN chown -R zyrauser:zyra /app

          USER zyrauser

          HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \
            CMD curl -f http://localhost:8000/health || exit 1

          EXPOSE 8000

          CMD ["python", "main.py"]
          EOF

      - name: Write docker-compose.yml
        run: |
          cat << 'EOF' > docker/docker-compose.yml
          version: '3.8'

          services:
            zyra_network_node:
              build:
                context: ..
                dockerfile: docker/Dockerfile
              container_name: zyra_network_core
              restart: always
              environment:
                - NODE_ENV=production
                - NETWORK_PORT=8000
                - LOG_LEVEL=INFO
              ports:
                - "8000:8000"
              networks:
                - zyra_internal_net
              resources:
                limits:
                  cpus: '2.0'
                  memory: 2048M
                reservations:
                  cpus: '0.25'
                  memory: 512M
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                interval: 30s
                timeout: 5s
                retries: 3

          networks:
            zyra_internal_net:
              driver: bridge
          EOF

      - name: Write __init__.py
        run: |
          cat << 'EOF' > docker/__init__.py
          """
          ZYRA NETWORK - Infrastructure Docker Package
          Core containerization definition for enterprise validation node deployment.
          """

          __version__ = "1.0.0"
          EOF

      - name: Commit and Push Infrastructure Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docker/
          git commit -m "feat(infrastructure): populate docker directory with production configs [20-year durability]" || echo "No changes to commit"
          git push
