      - name: Verify generated Python tree
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path("shared_engines/ai")
          files = sorted(root.rglob("*.py"))

          if not files:
              raise SystemExit(
                  "shared_engines/ai contains no Python files"
              )

          for path in files:
              source = path.read_text(
                  encoding="utf-8"
