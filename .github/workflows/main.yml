name: ZYRA - Foundation Core Block 02

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-core-02:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Foundation Kernel Lifecycle Loaders Security
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            foundation/kernel \
            foundation/lifecycle \
            foundation/loaders \
            foundation/security

          # ============================================================
          # KERNEL
          # ============================================================

          cat > foundation/kernel/kernel.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock
          from typing import Any, Callable


          class KernelError(RuntimeError):
              """Base kernel failure."""


          class KernelNotRunningError(KernelError):
              """Operation requires a running kernel."""


          KernelHandler = Callable[..., Any]


          @dataclass(frozen=True, slots=True)
          class KernelState:
              name: str
              running: bool
              generation: int


          class Kernel:
              """
              Minimal ZYRA execution kernel.

              The kernel coordinates registered handlers and exposes the
              fundamental execution boundary. Network transports, storage,
              messaging and applications remain outside this primitive.
              """

              def __init__(
                  self,
                  *,
                  name: str = "zyra-kernel",
              ) -> None:
                  if not name.strip():
                      raise ValueError(
                          "Kernel name cannot be empty"
                      )

                  self._name = name
                  self._running = False
                  self._generation = 0
                  self._handlers: dict[str, KernelHandler] = {}
                  self._lock = RLock()

              @property
              def name(self) -> str:
                  return self._name

              @property
              def running(self) -> bool:
                  with self._lock:
                      return self._running

              @property
              def generation(self) -> int:
                  with self._lock:
                      return self._generation

              def start(self) -> KernelState:
                  with self._lock:
                      if self._running:
                          return self.state()

                      self._generation += 1
                      self._running = True

                      return self.state()

              def stop(self) -> KernelState:
                  with self._lock:
                      if not self._running:
                          return self.state()

                      self._running = False

                      return self.state()

              def state(self) -> KernelState:
                  return KernelState(
                      name=self._name,
                      running=self._running,
                      generation=self._generation,
                  )

              def register(
                  self,
                  name: str,
                  handler: KernelHandler,
              ) -> None:
                  if not name.strip():
                      raise ValueError(
                          "Handler name cannot be empty"
                      )

                  if not callable(handler):
                      raise TypeError(
                          "Kernel handler must be callable"
                      )

                  with self._lock:
                      if name in self._handlers:
                          raise KernelError(
                              f"Handler already registered: {name}"
                          )

                      self._handlers[name] = handler

              def unregister(self, name: str) -> bool:
                  with self._lock:
                      return (
                          self._handlers.pop(
                              name,
                              None,
                          )
                          is not None
                      )

              def execute(
                  self,
                  name: str,
                  *args: Any,
                  **kwargs: Any,
              ) -> Any:
                  with self._lock:
                      if not self._running:
                          raise KernelNotRunningError(
                              "Kernel is not running"
                          )

                      handler = self._handlers.get(name)

                      if handler is None:
                          raise KernelError(
                              f"Unknown kernel handler: {name}"
                          )

                  return handler(
                      *args,
                      **kwargs,
                  )

              def handlers(self) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(
                          sorted(self._handlers)
                      )
          PY

          cat > foundation/kernel/__init__.py <<'PY'
          """
          ZYRA Foundation Kernel.
          """

          from .kernel import (
              Kernel,
              KernelError,
              KernelHandler,
              KernelNotRunningError,
              KernelState,
          )

          __all__ = [
              "Kernel",
              "KernelError",
              "KernelHandler",
              "KernelNotRunningError",
              "KernelState",
          ]
          PY

          # ============================================================
          # LIFECYCLE
          # ============================================================

          cat > foundation/lifecycle/lifecycle.py <<'PY'
          from __future__ import annotations

          from enum import StrEnum
          from threading import RLock
          from typing import Callable


          class LifecycleError(RuntimeError):
              """Invalid lifecycle transition."""


          class LifecycleState(StrEnum):
              CREATED = "created"
              STARTING = "starting"
              RUNNING = "running"
              STOPPING = "stopping"
              STOPPED = "stopped"
              FAILED = "failed"


          LifecycleCallback = Callable[[], None]


          class Lifecycle:
              """
              Deterministic component lifecycle controller.

              State transitions are serialized and callbacks execute only
              after the corresponding transition is accepted.
              """

              _ALLOWED: dict[
                  LifecycleState,
                  frozenset[LifecycleState],
              ] = {
                  LifecycleState.CREATED: frozenset({
                      LifecycleState.STARTING,
                      LifecycleState.FAILED,
                  }),
                  LifecycleState.STARTING: frozenset({
                      LifecycleState.RUNNING,
                      LifecycleState.FAILED,
                  }),
                  LifecycleState.RUNNING: frozenset({
                      LifecycleState.STOPPING,
                      LifecycleState.FAILED,
                  }),
                  LifecycleState.STOPPING: frozenset({
                      LifecycleState.STOPPED,
                      LifecycleState.FAILED,
                  }),
                  LifecycleState.STOPPED: frozenset(),
                  LifecycleState.FAILED: frozenset(),
              }

              def __init__(self) -> None:
                  self._state = LifecycleState.CREATED
                  self._lock = RLock()
                  self._callbacks: dict[
                      LifecycleState,
                      list[LifecycleCallback],
                  ] = {
                      state: []
                      for state in LifecycleState
                  }

              @property
              def state(self) -> LifecycleState:
                  with self._lock:
                      return self._state

              def transition(
                  self,
                  target: LifecycleState,
              ) -> LifecycleState:
                  with self._lock:
                      if target == self._state:
                          return self._state

                      allowed = self._ALLOWED[
                          self._state
                      ]

                      if target not in allowed:
                          raise LifecycleError(
                              f"Invalid lifecycle transition: "
                              f"{self._state} -> {target}"
                          )

                      self._state = target
                      callbacks = tuple(
                          self._callbacks[target]
                      )

                  for callback in callbacks:
                      callback()

                  return target

              def on(
                  self,
                  state: LifecycleState,
                  callback: LifecycleCallback,
              ) -> None:
                  if not callable(callback):
                      raise TypeError(
                          "Lifecycle callback must be callable"
                      )

                  with self._lock:
                      self._callbacks[state].append(
                          callback
                      )

              def start(self) -> LifecycleState:
                  self.transition(
                      LifecycleState.STARTING
                  )
                  return self.transition(
                      LifecycleState.RUNNING
                  )

              def stop(self) -> LifecycleState:
                  self.transition(
                      LifecycleState.STOPPING
                  )
                  return self.transition(
                      LifecycleState.STOPPED
                  )

              def fail(self) -> LifecycleState:
                  return self.transition(
                      LifecycleState.FAILED
                  )
          PY

          cat > foundation/lifecycle/__init__.py <<'PY'
          """
          ZYRA Foundation lifecycle management.
          """

          from .lifecycle import (
              Lifecycle,
              LifecycleCallback,
              LifecycleError,
              LifecycleState,
          )

          __all__ = [
              "Lifecycle",
              "LifecycleCallback",
              "LifecycleError",
              "LifecycleState",
          ]
          PY

          # ============================================================
          # LOADERS
          # ============================================================

          cat > foundation/loaders/loader.py <<'PY'
          from __future__ import annotations

          import importlib
          from dataclasses import dataclass
          from threading import RLock
          from types import ModuleType
          from typing import Iterable


          class LoaderError(RuntimeError):
              """Module loading failure."""


          @dataclass(frozen=True, slots=True)
          class LoadedModule:
              name: str
              module: ModuleType


          class ModuleLoader:
              """
              Controlled Python module loader.

              Imports are explicit and deterministic. The loader never scans
              arbitrary filesystem paths or executes untrusted source.
              """

              def __init__(
                  self,
                  *,
                  allowed_prefixes: Iterable[str] = (),
              ) -> None:
                  self._allowed_prefixes = tuple(
                      prefix.strip()
                      for prefix in allowed_prefixes
                      if prefix.strip()
                  )

                  self._loaded: dict[
                      str,
                      LoadedModule,
                  ] = {}

                  self._lock = RLock()

              def load(
                  self,
                  module_name: str,
              ) -> LoadedModule:
                  self._validate_name(module_name)

                  if (
                      self._allowed_prefixes
                      and not any(
                          module_name == prefix
                          or module_name.startswith(
                              prefix + "."
                          )
                          for prefix in self._allowed_prefixes
                      )
                  ):
                      raise LoaderError(
                          f"Module not allowed: {module_name}"
                      )

                  with self._lock:
                      existing = self._loaded.get(
                          module_name
                      )

                      if existing is not None:
                          return existing

                  try:
                      module = importlib.import_module(
                          module_name
                      )
                  except Exception as exc:
                      raise LoaderError(
                          f"Unable to load module: "
                          f"{module_name}"
                      ) from exc

                  loaded = LoadedModule(
                      name=module_name,
                      module=module,
                  )

                  with self._lock:
                      self._loaded[module_name] = loaded

                  return loaded

              def unload(self, module_name: str) -> bool:
                  with self._lock:
                      return (
                          self._loaded.pop(
                              module_name,
                              None,
                          )
                          is not None
                      )

              def is_loaded(
                  self,
                  module_name: str,
              ) -> bool:
                  with self._lock:
                      return module_name in self._loaded

              def loaded_modules(
                  self,
              ) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(
                          sorted(self._loaded)
                      )

              @staticmethod
              def _validate_name(
                  module_name: str,
              ) -> None:
                  if (
                      not isinstance(
                          module_name,
                          str,
                      )
                      or not module_name.strip()
                  ):
                      raise ValueError(
                          "Module name cannot be empty"
                      )

                  parts = module_name.split(".")

                  for part in parts:
                      if not part.isidentifier():
                          raise ValueError(
                              f"Invalid module name: "
                              f"{module_name}"
                          )
          PY

          cat > foundation/loaders/__init__.py <<'PY'
          """
          ZYRA Foundation module loading.
          """

          from .loader import (
              LoadedModule,
              LoaderError,
              ModuleLoader,
          )

          __all__ = [
              "LoadedModule",
              "LoaderError",
              "ModuleLoader",
          ]
          PY

          # ============================================================
          # SECURITY
          # ============================================================

          cat > foundation/security/security.py <<'PY'
          from __future__ import annotations

          import hashlib
          import hmac
          import secrets
          from dataclasses import dataclass
          from datetime import datetime, timedelta, timezone


          class SecurityError(RuntimeError):
              """Base foundation security failure."""


          class SecretValidationError(SecurityError):
              """Invalid secret or security parameter."""


          @dataclass(frozen=True, slots=True)
          class SecretDigest:
              algorithm: str
              digest: str
              created_at: datetime

              def to_dict(self) -> dict[str, str]:
                  return {
                      "algorithm": self.algorithm,
                      "digest": self.digest,
                      "created_at":
                          self.created_at.isoformat(),
                  }


          class SecurityPrimitives:
              """
              Cryptographic foundation primitives.

              Uses Python's standard-library cryptography primitives for
              secure random values, SHA-256 integrity digests and constant
              time comparisons. Higher-level authentication, credentials
              and certificates belong to protocol/shared security layers.
              """

              HASH_ALGORITHM = "sha256"

              @staticmethod
              def random_token(
                  length: int = 32,
              ) -> str:
                  if length < 16:
                      raise SecretValidationError(
                          "Token length must be >= 16"
                      )

                  return secrets.token_urlsafe(length)

              @classmethod
              def digest(
                  cls,
                  value: bytes | str,
              ) -> SecretDigest:
                  data = cls._bytes(value)

                  digest = hashlib.sha256(
                      data
                  ).hexdigest()

                  return SecretDigest(
                      algorithm=cls.HASH_ALGORITHM,
                      digest=digest,
                      created_at=datetime.now(
                          timezone.utc
                      ),
                  )

              @staticmethod
              def verify_digest(
                  value: bytes | str,
                  expected_digest: str,
              ) -> bool:
                  if not isinstance(
                      expected_digest,
                      str,
                  ):
                      return False

                  data = (
                      value.encode("utf-8")
                      if isinstance(value, str)
                      else value
                  )

                  actual = hashlib.sha256(
                      data
                  ).hexdigest()

                  return hmac.compare_digest(
                      actual,
                      expected_digest,
                  )

              @staticmethod
              def constant_time_equal(
                  left: str | bytes,
                  right: str | bytes,
              ) -> bool:
                  left_bytes = SecurityPrimitives._bytes(
                      left
                  )

                  right_bytes = SecurityPrimitives._bytes(
                      right
                  )

                  return hmac.compare_digest(
                      left_bytes,
                      right_bytes,
                  )

              @staticmethod
              def expiration(
                  lifetime_seconds: int,
              ) -> datetime:
                  if lifetime_seconds <= 0:
                      raise SecretValidationError(
                          "Lifetime must be positive"
                      )

                  return (
                      datetime.now(timezone.utc)
                      + timedelta(
                          seconds=lifetime_seconds
                      )
                  )

              @staticmethod
              def is_expired(
                  expires_at: datetime,
              ) -> bool:
                  if expires_at.tzinfo is None:
                      raise SecretValidationError(
                          "Expiration must be timezone-aware"
                      )

                  return (
                      datetime.now(timezone.utc)
                      >= expires_at
                  )

              @staticmethod
              def _bytes(
                  value: bytes | str,
              ) -> bytes:
                  if isinstance(value, bytes):
                      return value

                  if isinstance(value, str):
                      return value.encode("utf-8")

                  raise TypeError(
                      "Value must be bytes or string"
                  )
          PY

          cat > foundation/security/__init__.py <<'PY'
          """
          ZYRA Foundation security primitives.
          """

          from .security import (
              SecurityError,
              SecurityPrimitives,
              SecretDigest,
              SecretValidationError,
          )

          __all__ = [
              "SecurityError",
              "SecurityPrimitives",
              "SecretDigest",
              "SecretValidationError",
          ]
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from foundation.kernel import Kernel
          from foundation.lifecycle import (
              Lifecycle,
              LifecycleState,
          )
          from foundation.loaders import ModuleLoader
          from foundation.security import (
              SecurityPrimitives,
          )

          # Kernel
          kernel = Kernel()
          kernel.register(
              "add",
              lambda a, b: a + b,
          )

          assert not kernel.running
          kernel.start()

          assert kernel.running
          assert kernel.execute("add", 2, 3) == 5

          kernel.stop()
          assert not kernel.running

          # Lifecycle
          lifecycle = Lifecycle()

          assert lifecycle.state == (
              LifecycleState.CREATED
          )

          lifecycle.start()

          assert lifecycle.state == (
              LifecycleState.RUNNING
          )

          lifecycle.stop()

          assert lifecycle.state == (
              LifecycleState.STOPPED
          )

          # Loader
          loader = ModuleLoader(
              allowed_prefixes=("foundation",)
          )

          loaded = loader.load(
              "foundation.constants"
          )

          assert loaded.name == (
              "foundation.constants"
          )

          assert loader.is_loaded(
              "foundation.constants"
          )

          # Security
          token = SecurityPrimitives.random_token(32)

          assert len(token) >= 16

          digest = SecurityPrimitives.digest(
              "zyra-network"
          )

          assert SecurityPrimitives.verify_digest(
              "zyra-network",
              digest.digest,
          )

          assert SecurityPrimitives.constant_time_equal(
              "zyra",
              "zyra",
          )

          assert not SecurityPrimitives.constant_time_equal(
              "zyra",
              "ZYRA",
          )

          print(
              "FOUNDATION CORE BLOCK 02: OK"
          )
          PY

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            foundation/kernel \
            foundation/lifecycle \
            foundation/loaders \
            foundation/security

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ZYRA Network"
          git config user.email "actions@users.noreply.github.com"

          git add \
            foundation/kernel \
            foundation/lifecycle \
            foundation/loaders \
            foundation/security

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "feat: production foundation kernel lifecycle loaders security"
          git push
