          """Key-version contract tests."""

          from __future__ import annotations

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          from shared_engines.ai.crypto import EnvelopeCipher
          from shared_engines.ai.keys import StaticKeyProvider


          class RotatingProvider:
              def __init__(self) -> None:
                  self.keys = {
                      "v1": b"01234567890123456789012345678901",
                      "v2": b"12345678901234567890123456789012",
                  }

              def current(self) -> tuple[str, bytes]:
                  return "v2", self.keys["v2"]

              def get(self, version: str) -> bytes:
                  return self.keys[version]


          def test_versioned_cipher_reads_current_key() -> None:
              cipher = EnvelopeCipher(RotatingProvider())
              token = cipher.encrypt(b"data", b"aad")
              assert cipher.decrypt(token, b"aad") == b"data"


          def test_static_provider_rejects_wrong_size() -> None:
              try:
                  StaticKeyProvider("bad", AESGCM.generate_key(128))
              except ValueError:
                  return
              raise AssertionError("invalid key size was accepted")
          PY

