          from __future__ import annotations

          import threading


          class EventRouter:
              def __init__(self):
                  self._lock = threading.RLock()
                  self._routes = {}

              def route(
                  self,
                  event_type,
                  sink,
              ):
                  if not callable(sink):
                      raise TypeError(
                          "sink must be callable"
                      )

                  with self._lock:
                      self._routes.setdefault(
                          event_type,
                          [],
                      ).append(sink)

              def remove(
                  self,
                  event_type,
                  sink,
              ):
                  with self._lock:
                      sinks = self._routes.get(
                          event_type,
                          [],
                      )

                      if sink in sinks:
                          sinks.remove(sink)

              def dispatch(self, event):
                  with self._lock:
                      sinks = list(
                          self._routes.get(
                              event.event_type,
                              [],
                          )
                      )

                      sinks.extend(
                          self._routes.get(
                              "*",
                              [],
                          )
                      )

                  results = []

                  for sink in sinks:
                      try:
                          results.append(
                              sink(event)
                          )
                      except Exception as exc:
                          results.append(exc)

                  return results


          __all__ = [
              "EventRouter",
          ]
