          from __future__ import annotations

          from pathlib import Path
          from decimal import Decimal

          import pytest

          from shared_engines.ai.contracts import AIRequest
          from shared_engines.ai.errors import (
              AIRequestInFlight,
          )
          from shared_engines.ai.serialization import (
              canonical_json,
          )
          from shared_engines.ai.storage import (
              SQLiteAIStore,
          )
          from shared_engines.ai.crypto import (
              EnvelopeCipher,
              KeyMaterial,
              VersionedKeyRing,
          )


          def make_cipher() -> EnvelopeCipher:
              return EnvelopeCipher(
                  VersionedKeyRing(
                      keys=(
                          KeyMaterial(
                              version=1,
                              key=(
                                  b"0123456789abcdef"
                                  b"0123456789abcdef"
                              ),
                          ),
                      ),
                      current_version=1,
                  )
              )


          def make_request() -> AIRequest:
              return AIRequest(
                  schema_version=2,
                  request_id="r1",
                  idempotency_key="storage-key",
                  model_id="model",
                  prompt="hello",
                  system_prompt=None,
                  max_output_tokens=10,
                  temperature=Decimal("0"),
                  timeout_seconds=10,
                  created_at=1_800_000_000,
              )


          def request_hash(
              request: AIRequest,
          ) -> str:
              import hashlib

              return hashlib.sha256(
                  canonical_json(
                      {
                          "schema_version": (
                              request.schema_version
                          ),
                          "model_id": request.model_id,
                          "prompt": request.prompt,
                          "system_prompt": (
                              request.system_prompt
                          ),
                          "max_output_tokens": (
                              request.max_output_tokens
                          ),
                          "temperature": (
                              request.temperature
                          ),
                          "timeout_seconds": (
                              request.timeout_seconds
                          ),
                          "metadata": dict(
                              request.metadata
                          ),
                      }
                  )
              ).hexdigest()


          def make_store(
              path: Path,
          ) -> SQLiteAIStore:
              return SQLiteAIStore(
                  path,
                  cipher=make_cipher(),
              )


          def test_lease_conflict(
              tmp_path: Path,
          ) -> None:
              store = make_store(
                  tmp_path / "lease.db"
              )

              request = make_request()

              store.reserve(
                  request=request,
                  request_hash=request_hash(
                      request
                  ),
                  owner="worker-a",
                  now=1000,
                  lease_seconds=300,
              )

              with pytest.raises(
                  AIRequestInFlight
              ):
                  store.reserve(
                      request=request,
                      request_hash=request_hash(
                          request
                      ),
                      owner="worker-b",
                      now=1100,
                      lease_seconds=300,
                  )


          def test_audit_empty_store(
              tmp_path: Path,
          ) -> None:
              store = make_store(
                  tmp_path / "empty.db"
              )

              assert store.verify_audit_chain()
              store.verify_database()
          PY

          cat > shared_engines/ai/README.md <<'MD'
          # ZYRA Shared AI Engine

          Production-oriented shared AI foundation.

          ## Durability

          - versioned contracts
          - deterministic request hashes
          - durable idempotency
          - SQLite WAL
          - SQLite FULL synchronous persistence
          - transactional state transitions
          - lease ownership
          - fencing tokens
          - recovery-required state
          - migration checksums
          - encrypted request persistence
          - versioned encryption keys
          - online backup
          - backup verification
          - transactional outbox
          - inbox deduplication
          - tamper-evident audit chain
          - audit checkpoints

          ## Execution protection

          - bounded concurrency
          - strict request validation
          - provider protocol isolation
          - circuit breakers
          - bounded retry policy
          - request deadlines
          - provider idempotency keys
          - cost accounting
          - model capability validation

          ## Architecture

          The package never imports `apps/`.

          The provider protocol is deliberately isolated in
          `provider_protocol.py`.

          There is intentionally no `providers.py` together with a
          `providers/` package because that creates unnecessary module
          resolution ambiguity.

          Distributed high availability is not falsely simulated with local
          SQLite. A future infrastructure adapter may replace the local
          persistence implementation while preserving the public contracts.

          Twenty years cannot be guaranteed by source code. The objective is
          long-lived evolution through stable contracts, explicit migrations,
          deterministic identity, recoverability, auditability, encryption
          key versioning, backup/restore boundaries and replaceable adapters.
          MD

      - name: Compile
        run: |
          set -euo pipefail
          python -m compileall -q shared_engines/ai

      - name: Verify module layout
        shell: bash
        run: |
          set -euo pipefail

          test ! -e shared_engines/ai/providers.py
          test ! -d shared_engines/ai/providers

          test -s shared_engines/ai/provider_protocol.py

      - name: Reject empty Python files
        shell: bash
        run: |
          set -euo pipefail

          empty="$(
            find shared_engines/ai \
              -type f \
              -name '*.py' \
              -size 0 \
              -print
          )"

          if [ -n "$empty" ]; then
            echo "$empty"
            exit 1
          fi

      - name: Reject incomplete implementation markers
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --include='*.py' \
            '(^|[[:space:]])pass([[:space:]]*(#.*)?)?$|NotImplementedError|TODO|FIXME|XXX' \
            shared_engines/ai; then
            echo "Incomplete implementation marker detected."
            exit 1
          fi

      - name: Verify no application dependency
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --include='*.py' \
            '(^|[[:space:]])from[[:space:]]+apps(\.|[[:space:]])|(^|[[:space:]])import[[:space:]]+apps(\.|[[:space:]])' \
            shared_engines/ai; then
            echo "shared_engines/ai cannot depend on apps/."
            exit 1
          fi

      - name: Verify apps untouched
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only | grep -E '^apps/'; then
            echo "apps/ was modified."
            exit 1
          fi

      - name: Static type validation
        run: |
          set -euo pipefail

          python -m mypy \
            --python-version 3.12 \
            --check-untyped-defs \
            --no-implicit-optional \
            --warn-redundant-casts \
            --warn-unused-ignores \
            --ignore-missing-imports \
            shared_engines/ai

      - name: Lint
        run: |
          set -euo pipefail

          python -m flake8 \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            shared_engines/ai

      - name: Production tests
        run: |
          set -euo pipefail

          python -m pytest \
            -q \
            -n auto \
            shared_engines/ai/tests

      - name: Verify required production tree
        shell: bash
        run: |
          set -euo pipefail

          required=(
            shared_engines/ai/__init__.py
            shared_engines/ai/errors.py
            shared_engines/ai/clock.py
            shared_engines/ai/contracts.py
            shared_engines/ai/serialization.py
            shared_engines/ai/codec.py
            shared_engines/ai/crypto.py
            shared_engines/ai/registry.py
            shared_engines/ai/provider_protocol.py
            shared_engines/ai/http_provider.py
            shared_engines/ai/circuit.py
            shared_engines/ai/limiter.py
            shared_engines/ai/budget.py
            shared_engines/ai/policy.py
            shared_engines/ai/storage.py
            shared_engines/ai/engine.py
            shared_engines/ai/tests/__init__.py
            shared_engines/ai/tests/test_ai_engine.py
            shared_engines/ai/tests/test_validation.py
            shared_engines/ai/tests/test_storage.py
            shared_engines/ai/README.md
          )

          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty: $file"
              exit 1
            fi
          done

      - name: Verify generated Python tree
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path("shared_engines/ai")
          files = sorted(root.rglob("*.py"))

          if not files:
              raise SystemExit(
                  "shared_engines/ai contains no Python files"
              )

          for path in files:
              source = path.read_text(
                  encoding="utf-8"
              )

              if not source.strip():
                  raise SystemExit(
                      f"Empty Python source: {path}"
                  )

              ast.parse(source)

          print(
              f"Validated {len(files)} Python files."
          )
          PY

      - name: Verify no duplicate provider module layout
        shell: bash
        run: |
          set -euo pipefail

          if find shared_engines/ai \
            \( -name 'providers.py' -o -path '*/providers/__init__.py' \) \
            -print | grep -q .; then
            echo "Provider module collision detected."
            exit 1
          fi

      - name: Git integrity
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Verify unauthorized changes
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              shared_engines/ai/*)
                ;;
              .github/workflows/shared-engines-ai-production.yml)
                ;;
              *)
                echo "Unauthorized modification: $file"
                exit 1
                ;;
            esac
          done < <(
            git status --short |
              awk '{print $2}'
          )

      - name: Commit only AI Engine
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add shared_engines/ai

          if git diff --cached --quiet; then
            echo "No AI engine changes to commit."
            exit 0
          fi

          git commit \
            -m "feat(shared-engines): harden production AI engine"

      - name: Verify staged scope
        shell: bash
        run: |
          set -euo pipefail

          files="$(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              HEAD
          )"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              shared_engines/ai/*)
                ;;
              *)
                echo "Commit contains unauthorized file: $file"
                exit 1
                ;;
            esac
          done <<< "$files"

      - name: Push
        shell: bash
        run: |
          set -euo pipefail

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"
