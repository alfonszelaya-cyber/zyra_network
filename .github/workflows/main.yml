      - name: Boundary validation — apps must remain untouched
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          if git diff --name-only -- apps/ \
              | grep -q .; then
            echo "::error::The observability build modified apps/."
            git diff --name-only -- apps/
            exit 1
          fi

          if git status --porcelain=v1 \
              | awk '{print $2}' \
              | grep -E '^apps/'; then
            echo "::error::Unstaged/staged changes detected in apps/."
            git status --porcelain=v1
            exit 1
          fi

      - name: Boundary validation — only observability may change
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          unexpected="$(
            git status --porcelain=v1 \
              | awk '{print $2}' \
              | grep -v '^observability/' \
              || true
          )"

          if [[ -n "${unexpected}" ]]; then
            echo "::error::Unexpected changes outside observability/:"
            echo "${unexpected}"
            exit 1
          fi

      - name: Remove generated bytecode
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          find observability \
            -type d \
            -name '__pycache__' \
