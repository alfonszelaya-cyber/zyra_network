name: Zyra Network - Shared Engines AI Production

on:
  workflow_dispatch:
  push:
    branches:
      - principal
    paths:
      - "shared_engines/ai/**"
      - ".github/workflows/shared-engines-ai-production.yml"

permissions:
  contents: write

concurrency:
  group: zyra-shared-ai-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            "cryptography>=43,<48" \
            "pytest>=8,<9" \
            "pytest-xdist>=3,<4" \
            "mypy>=1.17,<2" \
            "flake8>=7,<8"

      - name: Generate production AI Engine
        shell: bash
        run: |
          set -euo pipefail

          rm -rf shared_engines/ai

          # IMPORTANTE:
          # No existe providers.py + providers/ simultáneamente.
          # El protocolo vive en provider_protocol.py para evitar
          # colisiones de resolución de módulos.

          mkdir -p \
            shared_engines/ai/tests \
            shared_engines/ai/persistence \
            shared_engines/ai/security

          cat > shared_engines/ai/__init__.py <<'PY'
          """
          ZYRA Network Shared AI Engine.

          Infrastructure-neutral, durable AI orchestration layer.

          Design goals:

          - stable versioned contracts
          - deterministic request identity
          - strict validation
          - bounded concurrency
          - durable idempotency
          - lease ownership
          - fencing tokens
          - crash recovery
          - recovery-required state
          - authenticated encryption
          - versioned encryption keys
          - transactional outbox
          - inbox deduplication
          - tamper-evident audit chain
          - audit checkpoints
          - migration checksums
          - SQLite WAL/FULL durability
          - provider isolation
          - bounded retries
          - circuit breaking
          - explicit provider protocol
          - cost accounting
          - backup and integrity verification

          Application modules must never be imported here.
          """

          from .contracts import (
              AIRequest,
              AIResponse,
              AIUsage,
              ModelDescriptor,
          )
          from .engine import AIEngine
          from .errors import (
              AIBudgetExceeded,
              AICircuitOpenError,
              AIEncryptionError,
              AIEngineError,
              AIIdempotencyConflict,
              AIIntegrityError,
              AILeaseError,
              AIMigrationError,
              AIProviderError,
              AIProviderPermanentError,
              AIProviderProtocolError,
              AIProviderTransientError,
              AIProviderUnavailable,
              AIRecoveryRequired,
              AIRequestInFlight,
              AIStorageError,
              AIValidationError,
          )
          from .provider_protocol import AIProvider
          from .registry import ModelRegistry
          from .storage import SQLiteAIStore

          __version__ = "2.0.0"
          __schema_version__ = 2

          __all__ = [
              "AIEngine",
              "AIRequest",
              "AIResponse",
              "AIUsage",
              "ModelDescriptor",
              "ModelRegistry",
              "SQLiteAIStore",
              "AIProvider",
              "AIEngineError",
              "AIValidationError",
              "AIProviderError",
              "AIProviderUnavailable",
              "AIProviderTransientError",
              "AIProviderPermanentError",
              "AIProviderProtocolError",
              "AICircuitOpenError",
              "AIIdempotencyConflict",
              "AIBudgetExceeded",
              "AIRecoveryRequired",
              "AILeaseError",
              "AIRequestInFlight",
              "AIStorageError",
