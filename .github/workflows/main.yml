name: Zyra Network - Shared Engines AI Production

on:
  workflow_dispatch:
  push:
    branches:
      - principal
    paths:
      - "shared_engines/ai/**"
      - ".github/workflows/shared-engines-ai-production.yml"

permissions:
  contents: write

concurrency:
  group: zyra-shared-ai-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            cryptography \
            pytest \
            pytest-xdist \
            mypy \
            flake8

      - name: Generate production AI Engine
        shell: bash
        run: |
          set -euo pipefail

          rm -rf shared_engines/ai

          mkdir -p \
            shared_engines/ai/tests

          cat > shared_engines/ai/__init__.py <<'PY'
          """
          ZYRA Network Shared AI Engine.

          This package provides the infrastructure-neutral orchestration layer
          for AI workloads across the ZYRA Network.

          Design principles:

          - immutable public contracts
          - explicit schema versions
          - deterministic request identity
          - Decimal-safe cost accounting
          - bounded execution
          - provider isolation
          - provider failover
          - circuit breaking
          - retry control
          - durable idempotency
          - encrypted request persistence
          - crash-safe leases
          - recovery-required state
          - transactional outbox
          - tamper-evident audit records
          - explicit database migrations
          - strict application boundary

          Application code must depend on this engine, never the reverse.
          """

          from .contracts import (
              AIRequest,
              AIResponse,
              AIUsage,
              ModelDescriptor,
          )
          from .engine import AIEngine
          from .errors import (
              AICircuitOpenError,
              AIEngineError,
              AIIdempotencyConflict,
              AIProviderError,
              AIProviderUnavailable,
              AIBudgetExceeded,
              AIRecoveryRequired,
              AIValidationError,
          )
          from .registry import ModelRegistry
          from .storage import SQLiteAIStore

          __all__ = [
              "AIEngine",
              "AIRequest",
              "AIResponse",
              "AIUsage",
              "ModelDescriptor",
              "ModelRegistry",
              "SQLiteAIStore",
              "AIEngineError",
              "AIValidationError",
              "AIProviderError",
              "AIProviderUnavailable",
              "AICircuitOpenError",
              "AIIdempotencyConflict",
              "AIBudgetExceeded",
              "AIRecoveryRequired",
          ]
          PY

          cat > shared_engines/ai/errors.py <<'PY'
          class AIEngineError(Exception):
              """Base exception for the AI engine."""


          class AIValidationError(AIEngineError):
              """Input or contract validation failed."""


          class AIProviderError(AIEngineError):
              """An AI provider failed."""


          class AIProviderUnavailable(AIProviderError):
              """No eligible provider is available."""


          class AIProviderTransientError(AIProviderError):
              """A provider failure is eligible for retry."""


          class AIProviderPermanentError(AIProviderError):
              """A provider failure must not be retried."""


          class AIProviderProtocolError(AIProviderError):
              """Provider returned an invalid protocol response."""


          class AICircuitOpenError(AIProviderError):
              """Provider circuit is currently open."""


          class AIIdempotencyConflict(AIEngineError):
              """An idempotency key was reused with different input."""


          class AIRequestInFlight(AIEngineError):
              """Another worker currently owns the request lease."""


          class AIRecoveryRequired(AIEngineError):
              """A previous worker failed during an external operation."""


          class AIBudgetExceeded(AIEngineError):
              """Configured request, token, or cost budget was exceeded."""


          class AIStorageError(AIEngineError):
              """Durable storage operation failed."""


          class AIIntegrityError(AIStorageError):
              """Stored data failed integrity verification."""


          class AIMigrationError(AIStorageError):
              """Database migration failed."""


          class AIEncryptionError(AIStorageError):
              """Encryption or decryption failed."""


          class AILeaseError(AIStorageError):
              """Request lease could not be acquired or renewed."""
          PY

