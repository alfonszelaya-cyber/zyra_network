      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from foundation.exceptions import (
              ValidationError,
              AuthorizationError,
              ZyraError,
          )

          from foundation.hooks import HookRegistry

          from foundation.metadata import Metadata

          from foundation.types import (
              EntityId,
              JSONValue,
          )


          error = ValidationError(
              "Invalid entity",
              details={"field": "entity_id"},
          )

          assert isinstance(error, ZyraError)
          assert error.code == "VALIDATION_ERROR"
          assert error.to_dict()["details"]["field"] == "entity_id"


          hooks = HookRegistry()
          received = []

          def callback(**payload):
              received.append(payload)
              return True

          hooks.register(
              "network.started",
              callback,
          )

          assert hooks.has("network.started")
          assert hooks.callback_count(
              "network.started"
          ) == 1

          result = hooks.emit(
              "network.started",
              node="node-001",
          )

          assert result == [True]
          assert received == [
              {"node": "node-001"}
          ]

          assert hooks.unregister(
              "network.started",
              callback,
          )

          metadata = Metadata(
              name="identity",
              component_type="shared_engine",
              version="1.0.0",
              attributes={
                  "scope": "network",
                  "transversal": True,
              },
          )

          restored = Metadata.from_dict(
              metadata.to_dict()
          )

          assert restored == metadata
          assert restored.get("transversal") is True

          entity = EntityId("person_001")

          assert entity == "person_001"

          print(
              "FOUNDATION CORE BLOCK 01: OK"
          )
          PY

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            foundation/exceptions \
            foundation/hooks \
            foundation/metadata \
            foundation/types

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ZYRA Network"
          git config user.email "actions@users.noreply.github.com"

          git add \
            foundation/exceptions \
            foundation/hooks \
            foundation/metadata \
            foundation/types

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "feat: production foundation core block 01"
          git push
