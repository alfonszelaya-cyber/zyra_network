          cat > shared_engines/security/crypto.py <<'PYEOF'
          """AES-256-GCM authenticated encryption with key versioning.

          Sealed bytes are canonical JSON: format, key_version, nonce and
          ciphertext (the 16-byte GCM tag is appended by AESGCM). AAD binds
          an envelope to its storage context so captured bytes cannot be
          replayed under another record. Keys live in memory only and come
          from a KeyProvider; rotation adds versions, it never rewrites
          the past.
          """
          from __future__ import annotations

          import base64
          import os
          import threading
          from collections.abc import Mapping
          from dataclasses import dataclass

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          from shared_engines.common.errors import (
              ConfigurationError,
              IntegrityError,
              SerializationError,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
              canonical_json_loads,
          )

          KEY_SIZE_BYTES = 32
          NONCE_SIZE_BYTES = 12
          _ENVELOPE_FORMAT = "zyra.enc.v1"


          @dataclass(frozen=True)
          class EncryptedEnvelope:
              key_version: int
              nonce: bytes
              ciphertext: bytes


          class EnvelopeCrypto:
              def __init__(
                  self, keys: Mapping[int, bytes], current_version: int
              ) -> None:
                  if not keys:
                      raise ConfigurationError("at least one key version is required")
                  clean: dict[int, bytes] = {}
                  for version, key in keys.items():
                      if not isinstance(version, int) or version <= 0:
                          raise ConfigurationError(
                              "key versions must be positive integers"
                          )
                      if len(key) != KEY_SIZE_BYTES:
                          raise ConfigurationError(
                              f"key v{version} must be {KEY_SIZE_BYTES} bytes"
                          )
                      clean[version] = bytes(key)
                  if current_version not in clean:
                      raise ConfigurationError(
                          "current_version must be present in keys"
                      )
                  self._lock = threading.Lock()
                  self._keys = clean
                  self._current = current_version

              @property
              def current_version(self) -> int:
                  with self._lock:
                      return self._current

              def encrypt(
                  self,
                  plaintext: bytes,
                  *,
                  aad: bytes = b"",
                  key_version: int | None = None,
              ) -> EncryptedEnvelope:
                  with self._lock:
                      version = (
                          key_version if key_version is not None else self._current
                      )
                      key = self._keys.get(version)
                  if key is None:
                      raise ConfigurationError(
                          f"no key configured for version {version}"
                      )
                  nonce = os.urandom(NONCE_SIZE_BYTES)
                  ciphertext = AESGCM(key).encrypt(nonce, plaintext, aad)
                  return EncryptedEnvelope(
                      key_version=version, nonce=nonce, ciphertext=ciphertext
                  )

              def decrypt(
                  self, envelope: EncryptedEnvelope, *, aad: bytes = b""
              ) -> bytes:
                  with self._lock:
                      key = self._keys.get(envelope.key_version)
                  if key is None:
                      raise IntegrityError(
                          "cannot decrypt: key version"
                          f" {envelope.key_version} is unknown"
                      )
                  try:
                      return AESGCM(key).decrypt(
                          envelope.nonce, envelope.ciphertext, aad
                      )
                  except Exception as exc:
                      raise IntegrityError(
                          "decryption failed: wrong key, wrong AAD"
                          " or tampered ciphertext"
                      ) from exc

              def rotate(self, new_version: int, new_key: bytes) -> None:
                  if len(new_key) != KEY_SIZE_BYTES:
                      raise ConfigurationError(
                          f"new key must be {KEY_SIZE_BYTES} bytes"
                      )
                  with self._lock:
                      if new_version in self._keys:
                          raise ConfigurationError(
                              f"key version {new_version} already exists"
                          )
                      self._keys[new_version] = bytes(new_key)
                      self._current = new_version

              def reseal(self, sealed: bytes, *, aad: bytes = b"") -> bytes:
                  """Decrypts and re-encrypts to the current key version."""
                  return self.seal(self.open(sealed, aad=aad), aad=aad)

              def inspect_key_version(self, sealed: bytes) -> int:
                  """Returns the key version without decrypting."""
                  return self._parse_sealed(sealed).key_version

              def seal(self, plaintext: bytes, *, aad: bytes = b"") -> bytes:
                  envelope = self.encrypt(plaintext, aad=aad)
                  token = canonical_json_dumps(
                      {
                          "format": _ENVELOPE_FORMAT,
                          "key_version": envelope.key_version,
                          "nonce": base64.b64encode(envelope.nonce).decode("ascii"),
                          "ciphertext": base64.b64encode(
                              envelope.ciphertext
                          ).decode("ascii"),
                      }
                  )
                  return token.encode("utf-8")

              def open(self, sealed: bytes, *, aad: bytes = b"") -> bytes:
                  envelope = self._parse_sealed(sealed)
                  return self.decrypt(envelope, aad=aad)

              @staticmethod
              def _parse_sealed(sealed: bytes) -> EncryptedEnvelope:
                  try:
                      doc = canonical_json_loads(sealed.decode("utf-8"))
                  except (UnicodeDecodeError, SerializationError) as exc:
                      raise IntegrityError("sealed payload is not decodable") from exc
                  if not isinstance(doc, dict) or doc.get("format") != _ENVELOPE_FORMAT:
                      raise IntegrityError("unknown envelope format")
                  try:
                      return EncryptedEnvelope(
                          key_version=int(doc["key_version"]),
                          nonce=base64.b64decode(str(doc["nonce"]), validate=True),
                          ciphertext=base64.b64decode(
                              str(doc["ciphertext"]), validate=True
                          ),
                      )
                  except (KeyError, TypeError, ValueError) as exc:
                      raise IntegrityError("malformed sealed envelope") from exc
          PYEOF

          cat > shared_engines/security/keys.py <<'PYEOF'
          """Key providers feeding ``EnvelopeCrypto`` from managed sources.

          This is the KMS/HSM/secret-manager adapter point: implement
          ``KeyProvider`` against the real service at the composition root.
          Secrets are read at runtime and never logged or persisted here.
          """
          from __future__ import annotations

          import os
          from collections.abc import Mapping
          from typing import Protocol

          from shared_engines.common.errors import ConfigurationError
          from shared_engines.security.crypto import EnvelopeCrypto


          class KeyProvider(Protocol):
              def load_keys(self) -> Mapping[int, bytes]:
                  ...

              @property
              def current_version(self) -> int:
                  ...


          class StaticKeyProvider:
              """Explicit mapping; useful for tests and in-memory compositions."""

              def __init__(
                  self, keys: Mapping[int, bytes], current_version: int
              ) -> None:
                  self._keys = dict(keys)
                  self._current = current_version

              def load_keys(self) -> Mapping[int, bytes]:
                  return dict(self._keys)

              @property
              def current_version(self) -> int:
                  return self._current


          class EnvironmentKeyProvider:
              """Reads 32-byte hex keys from ``<prefix>_V<version>`` env
              variables; ``<prefix>_CURRENT`` names the active version."""

              def __init__(
                  self,
                  prefix: str = "ZYRA_MASTER_KEY",
                  env: Mapping[str, str] | None = None,
              ) -> None:
                  self._prefix = prefix
                  self._env = dict(os.environ if env is None else env)
                  self._current: int | None = None

              def load_keys(self) -> Mapping[int, bytes]:
                  keys: dict[int, bytes] = {}
                  prefix = f"{self._prefix}_V"
                  for name, value in self._env.items():
                      if not name.startswith(prefix):
                          continue
                      suffix = name[len(prefix):]
                      if not suffix.isdigit():
                          continue
                      try:
                          keys[int(suffix)] = bytes.fromhex(value)
                      except ValueError as exc:
                          raise ConfigurationError(
                              f"key env var {name} is not valid hex"
                          ) from exc
                  if not keys:
                      raise ConfigurationError(
                          f"no keys configured via {self._prefix}_V<version>"
                      )
                  current_raw = self._env.get(f"{self._prefix}_CURRENT")
                  if (
                      current_raw is None
                      or not current_raw.isdigit()
                      or int(current_raw) not in keys
                  ):
                      raise ConfigurationError(
                          f"{self._prefix}_CURRENT must name a configured version"
                      )
                  self._current = int(current_raw)
                  return keys

              @property
              def current_version(self) -> int:
                  if self._current is None:
                      self.load_keys()
                  if self._current is None:
                      raise ConfigurationError("no current key version available")
                  return self._current


          def crypto_from_provider(provider: KeyProvider) -> EnvelopeCrypto:
              keys = provider.load_keys()
              return EnvelopeCrypto(keys, provider.current_version)
          PYEOF

          cat > shared_engines/security/engine.py <<'PYEOF'
          """Security engine: sealed records, security events, key rotation.

          Every path here exercises real infrastructure: writes go through
          the audit hash chain, rotation publishes through the transactional
          outbox, counters go through the configured metrics backend. No
          secrets or plaintext are ever logged.
          """
          from __future__ import annotations

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.common.validation import require_non_empty_str
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.observability.backend import (
              MetricsBackend,
              NoopMetrics,
              engine_logger,
          )
          from shared_engines.observability.health import (
              ComponentHealth,
              HealthStatus,
          )
          from shared_engines.security.crypto import EnvelopeCrypto
          from shared_engines.storage.database import Database

          SECURITY_EVENT_TYPES = (
              "security.record.sealed",
              "security.record.tamper_detected",
              "security.key.rotated",
          )


          def register_security_events(catalog: EventCatalog) -> None:
              for event_type in SECURITY_EVENT_TYPES:
                  catalog.register(event_type)


          class SecurityEngine:
              def __init__(
                  self,
                  *,
                  crypto: EnvelopeCrypto,
                  audit: AuditTrail,
                  db: Database,
                  clock: Clock,
                  metrics: MetricsBackend | None = None,
              ) -> None:
                  self._crypto = crypto
                  self._audit = audit
                  self._clock = clock
                  self._metrics = metrics if metrics is not None else NoopMetrics()
                  self._log = engine_logger("security")
                  self._catalog = EventCatalog()
                  register_security_events(self._catalog)
                  self._outbox = Outbox(db, self._clock)
                  self._outbox.ensure_schema()

              def _aad(self, context: str) -> bytes:
                  return f"security-record:{context}".encode("utf-8")

              def seal_record(self, plaintext: bytes, *, context: str) -> str:
                  require_non_empty_str(context, "context")
                  sealed = self._crypto.seal(plaintext, aad=self._aad(context))
                  self._audit.append(
                      event_type="security.record.sealed",
                      actor="security-engine",
                      subject=context,
                      payload={"key_version": self._crypto.current_version},
                  )
                  self._metrics.increment(
                      "security.record.sealed", tags={"result": "ok"}
                  )
                  self._log.info(
                      "sealed record subject=%s key_version=%d",
                      context,
                      self._crypto.current_version,
                  )
                  return sealed.decode("utf-8")

              def open_record(self, sealed: str, *, context: str) -> bytes:
                  require_non_empty_str(context, "context")
                  try:
                      return self._crypto.open(
                          sealed.encode("utf-8"), aad=self._aad(context)
                      )
                  except IntegrityError:
                      self._audit.append(
                          event_type="security.record.tamper_detected",
                          actor="security-engine",
                          subject=context,
                          payload={},
                      )
                      self._metrics.increment(
                          "security.record.tamper_detected",
                          tags={"context": context},
                      )
                      self._log.warning(
                          "tamper detected on record subject=%s", context
                      )
                      raise

              def rotate_key(self, new_version: int, new_key: bytes) -> None:
                  self._crypto.rotate(new_version, new_key)
                  self._audit.append(
                      event_type="security.key.rotated",
                      actor="security-engine",
                      subject=f"key-v{new_version}",
                      payload={"key_version": new_version},
                  )
                  event = self._catalog.build(
                      "security.key.rotated",
                      aggregate_id=f"key-v{new_version}",
                      payload={"key_version": new_version},
                      clock=self._clock,
                  )
                  self._outbox.enqueue(event)
                  self._metrics.increment(
                      "security.key.rotated",
                      tags={"key_version": str(new_version)},
                  )
                  self._log.info("rotated key to version=%d", new_version)

              def check_health(self) -> ComponentHealth:
                  try:
                      probe = b"healthcheck"
                      sealed = self._crypto.seal(probe, aad=b"healthcheck-probe")
                      ok = self._crypto.open(sealed, aad=b"healthcheck-probe") == probe
                  except Exception:
                      return ComponentHealth(
                          "security", HealthStatus.UNHEALTHY, "crypto self-test failed"
                      )
                  status = HealthStatus.HEALTHY if ok else HealthStatus.UNHEALTHY
                  return ComponentHealth("security", status, "crypto self-test")
          PYEOF

