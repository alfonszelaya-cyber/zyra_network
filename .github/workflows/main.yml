name: Complete NEXO Architecture

on:
  workflow_dispatch:

jobs:
  complete-nexo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create only missing NEXO architecture
        run: |
          set -e

          BASE="apps/nexo"

          # ============================================================
          # FUNCTION: CREATE DIRECTORY ONLY IF NEEDED
          # ============================================================

          create_dir() {
            mkdir -p "$1"
          }

          # ============================================================
          # APPLICATION
          # Existing application structure is preserved.
          # Only missing domain-specific use-case folders are created.
          # ============================================================

          create_dir "$BASE/application/accounting_use_cases"
          create_dir "$BASE/application/analytics_use_cases"
          create_dir "$BASE/application/audit_use_cases"
          create_dir "$BASE/application/clients_use_cases"
          create_dir "$BASE/application/compliance_use_cases"
          create_dir "$BASE/application/customer_service_use_cases"
          create_dir "$BASE/application/executive_use_cases"
          create_dir "$BASE/application/family_office_use_cases"
          create_dir "$BASE/application/finance_use_cases"
          create_dir "$BASE/application/government_use_cases"
          create_dir "$BASE/application/identity_use_cases"
          create_dir "$BASE/application/logistics_use_cases"
          create_dir "$BASE/application/meta_government_use_cases"
          create_dir "$BASE/application/notifications_use_cases"
          create_dir "$BASE/application/operations_use_cases"
          create_dir "$BASE/application/payments_use_cases"
          create_dir "$BASE/application/reports_use_cases"
          create_dir "$BASE/application/risk_use_cases"
          create_dir "$BASE/application/search_use_cases"
          create_dir "$BASE/application/security_identity_use_cases"
          create_dir "$BASE/application/synchronization_use_cases"
          create_dir "$BASE/application/workflow_use_cases"

          # ============================================================
          # DOMAIN
          # ============================================================

          create_dir "$BASE/domain/accounting"
          create_dir "$BASE/domain/analytics"
          create_dir "$BASE/domain/audit"
          create_dir "$BASE/domain/clients"
          create_dir "$BASE/domain/compliance"
          create_dir "$BASE/domain/customer_service"
          create_dir "$BASE/domain/executive"
          create_dir "$BASE/domain/family_office"
          create_dir "$BASE/domain/finance"
          create_dir "$BASE/domain/government"
          create_dir "$BASE/domain/identity"
          create_dir "$BASE/domain/logistics"
          create_dir "$BASE/domain/meta_government"
          create_dir "$BASE/domain/notifications"
          create_dir "$BASE/domain/operations"
          create_dir "$BASE/domain/payments"
          create_dir "$BASE/domain/reports"
          create_dir "$BASE/domain/risk"
          create_dir "$BASE/domain/search"
          create_dir "$BASE/domain/security_identity"
          create_dir "$BASE/domain/synchronization"
          create_dir "$BASE/domain/workflow"

          # ============================================================
          # MODULE — SINGULAR
          # ============================================================

          create_dir "$BASE/module/executive"
          create_dir "$BASE/module/clients"
          create_dir "$BASE/module/finance"
          create_dir "$BASE/module/operations"
          create_dir "$BASE/module/family_office"
          create_dir "$BASE/module/government"
          create_dir "$BASE/module/meta_government"
          create_dir "$BASE/module/risk"
          create_dir "$BASE/module/security_identity"
          create_dir "$BASE/module/compliance"
          create_dir "$BASE/module/accounting"
          create_dir "$BASE/module/customer_service"

          # ============================================================
          # EVENTS
          # ============================================================

          create_dir "$BASE/events/accounting"
          create_dir "$BASE/events/clients"
          create_dir "$BASE/events/compliance"
          create_dir "$BASE/events/finance"
          create_dir "$BASE/events/government"
          create_dir "$BASE/events/logistics"
          create_dir "$BASE/events/notifications"
          create_dir "$BASE/events/operations"
          create_dir "$BASE/events/payments"
          create_dir "$BASE/events/risk"
          create_dir "$BASE/events/security"
          create_dir "$BASE/events/system"

          # ============================================================
          # NEXO CONTROL / ALERTS
          # Accounting, fiscal, documents, deadlines and inconsistencies.
          # NOT a commercial radar.
          # ============================================================

          create_dir "$BASE/events/system/alerts"
          create_dir "$BASE/events/system/document_alerts"
          create_dir "$BASE/events/system/compliance_alerts"
          create_dir "$BASE/events/system/deadlines"
          create_dir "$BASE/events/system/missing_documents"
          create_dir "$BASE/events/system/inconsistencies"

          # ============================================================
          # PERMISSIONS
          # ============================================================

          create_dir "$BASE/permissions"
          create_dir "$BASE/permissions/policies"
          create_dir "$BASE/permissions/roles"
          create_dir "$BASE/permissions/rules"
          create_dir "$BASE/permissions/scopes"

          # ============================================================
          # REGISTRY
          # ============================================================

          create_dir "$BASE/registry"
          create_dir "$BASE/registry/engines"
          create_dir "$BASE/registry/events"
          create_dir "$BASE/registry/menus"
          create_dir "$BASE/registry/modules"
          create_dir "$BASE/registry/permissions"
          create_dir "$BASE/registry/roles"
          create_dir "$BASE/registry/routes"
          create_dir "$BASE/registry/services"
          create_dir "$BASE/registry/templates"

          # ============================================================
          # ROUTERS
          # ============================================================

          create_dir "$BASE/routers"
          create_dir "$BASE/routers/api"
          create_dir "$BASE/routers/internal"
          create_dir "$BASE/routers/public"
          create_dir "$BASE/routers/websocket"

          # ============================================================
          # SCHEMAS
          # ============================================================

          create_dir "$BASE/schemas"
          create_dir "$BASE/schemas/entities"
          create_dir "$BASE/schemas/requests"
          create_dir "$BASE/schemas/responses"
          create_dir "$BASE/schemas/shared"

          # ============================================================
          # INFRASTRUCTURE
          # ============================================================

          create_dir "$BASE/infrastructure"
          create_dir "$BASE/infrastructure/api"
          create_dir "$BASE/infrastructure/cache"
          create_dir "$BASE/infrastructure/database"
          create_dir "$BASE/infrastructure/messaging"
          create_dir "$BASE/infrastructure/network"
          create_dir "$BASE/infrastructure/persistence"
          create_dir "$BASE/infrastructure/providers"
          create_dir "$BASE/infrastructure/repositories"
          create_dir "$BASE/infrastructure/security"
          create_dir "$BASE/infrastructure/services"
          create_dir "$BASE/infrastructure/storage"

          # ============================================================
          # SERVICES
          # ============================================================

          create_dir "$BASE/services/adapters"
          create_dir "$BASE/services/communication"
          create_dir "$BASE/services/export"
          create_dir "$BASE/services/import"
          create_dir "$BASE/services/notifications"
          create_dir "$BASE/services/reports"
          create_dir "$BASE/services/synchronization"
          create_dir "$BASE/services/translation"

          # ============================================================
          # SHARED
          # ============================================================

          create_dir "$BASE/shared"
          create_dir "$BASE/shared/adapters"
          create_dir "$BASE/shared/builders"
          create_dir "$BASE/shared/contracts"
          create_dir "$BASE/shared/decorators"
          create_dir "$BASE/shared/dto"
          create_dir "$BASE/shared/enums"
          create_dir "$BASE/shared/exceptions"
          create_dir "$BASE/shared/factories"
          create_dir "$BASE/shared/helpers"
          create_dir "$BASE/shared/interfaces"
          create_dir "$BASE/shared/mixins"
          create_dir "$BASE/shared/models"
          create_dir "$BASE/shared/policies"
          create_dir "$BASE/shared/types"
          create_dir "$BASE/shared/utilities"
          create_dir "$BASE/shared/value_objects"

          # ============================================================
          # TEMPLATES
          # ============================================================

          create_dir "$BASE/templates/certificates"
          create_dir "$BASE/templates/dashboards"
          create_dir "$BASE/templates/documents"
          create_dir "$BASE/templates/emails"
          create_dir "$BASE/templates/exports"
          create_dir "$BASE/templates/forms"
          create_dir "$BASE/templates/notifications"
          create_dir "$BASE/templates/reports"

          # ============================================================
          # NEXO-SPECIFIC TEMPLATESS — PRESERVED
          # ============================================================

          create_dir "$BASE/templatess"

          # ============================================================
          # CREATE __init__.py ONLY IN NEW DIRECTORIES
          # NEVER OVERWRITE EXISTING FILES
          # ============================================================

          find "$BASE" -type d -exec sh -c '
            for dir do
              if [ ! -e "$dir/__init__.py" ]; then
                touch "$dir/__init__.py"
              fi
            done
          ' sh {} +

          # ============================================================
          # IMPORTANT
          # NO RADAR IS CREATED IN NEXO.
          # NO RADAR_VIP IS CREATED IN NEXO.
          # NO SALES/OPPORTUNITY RADAR IS CREATED IN NEXO.
          # Existing NEXO files and folders are not deleted.
          # ============================================================

      - name: Commit only new NEXO architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/nexo

          if git diff --cached --quiet; then
            echo "No new NEXO architecture changes."
            exit 0
          fi

          git commit -m "Complete NEXO architecture without replacing existing structure"
          git push
