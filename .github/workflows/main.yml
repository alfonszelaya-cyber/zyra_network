          # MODULO 10 - ATENCION AL CLIENTE
          # ============================================================

          create_file "$BASE/modules/atencion_al_cliente/atencion/service.py" '
          class CustomerService:
              def open_case(self, subject, requester_id):
                  return {
                      "subject": subject,
                      "requester_id": requester_id,
                      "status": "open"
                  }
          '

          create_file "$BASE/modules/atencion_al_cliente/solicitudes/request_service.py" '
          class CustomerRequestService:
              def create(self, requester_id, subject):
                  return {
                      "requester_id": requester_id,
                      "subject": subject,
                      "status": "new"
                  }
          '

          create_file "$BASE/modules/atencion_al_cliente/asistencia/assistance_service.py" '
          class CustomerAssistanceService:
              def answer(self, request, response):
                  return {
                      "request": request,
                      "response": response,
                      "source": "ai"
                  }
          '

          create_file "$BASE/modules/atencion_al_cliente/escalamiento/escalation_service.py" '
          class EscalationService:
              def escalate(self, case, reason):
                  case = dict(case)
                  case["status"] = "escalated"
                  case["escalation_reason"] = reason
                  case["destination"] = "human_support"
                  return case
          '

          create_file "$BASE/modules/atencion_al_cliente/comunicacion/communication_service.py" '
          class CommunicationService:
              def send(self, recipient_id, message, channel="app"):
                  return {
                      "recipient_id": recipient_id,
                      "message": message,
                      "channel": channel,
                      "status": "queued"
                  }
          '

          create_file "$BASE/modules/atencion_al_cliente/calidad/quality_service.py" '
          class ServiceQuality:
              def score(self, ratings):
                  if not ratings:
                      return 0

                  return sum(ratings) / len(ratings)
          '

          # ============================================================
          # MODULO 11 - SEGURIDAD
          # ============================================================

          create_file "$BASE/modules/seguridad/identidad/identity_service.py" '
          class AgroIdentityService:
              def verify(self, identity):
                  if not identity:
                      raise ValueError("Identity is required")

                  return {
                      "identity": identity,
                      "verified": True
                  }
          '

          create_file "$BASE/modules/seguridad/accesos/access_service.py" '
          class AccessService:
              def authorize(self, permissions, required_permission):
                  return required_permission in set(permissions)
          '

          create_file "$BASE/modules/seguridad/proteccion/protection_service.py" '
          class DataProtectionService:
              def protect(self, data):
                  return dict(data)
          '

          create_file "$BASE/modules/seguridad/control/security_control_service.py" '
          class SecurityControlService:
              def record(self, actor_id, action, resource):
                  return {
                      "actor_id": actor_id,
                      "action": action,
                      "resource": resource
                  }
          '

          create_file "$BASE/modules/seguridad/auditoria/audit_service.py" '
          from datetime import datetime

          class AgroAuditService:
              def record(self, actor_id, action, resource, resource_id):
                  return {
                      "actor_id": actor_id,
                      "action": action,
                      "resource": resource,
                      "resource_id": resource_id,
                      "timestamp": datetime.utcnow().isoformat()
                  }
          '

          create_file "$BASE/modules/seguridad/alertas/security_alert_service.py" '
          class SecurityAlertService:
              def create(self, alert_type, severity, subject):
                  return {
                      "alert_type": alert_type,
                      "severity": severity,
                      "subject": subject
                  }
          '

          create_file "$BASE/modules/seguridad/cumplimiento/compliance_service.py" '
          class AgroComplianceService:
              def verify(self, record, required_fields):
                  missing = [
                      field for field in required_fields
                      if field not in record
                  ]

                  return {
                      "compliant": not missing,
                      "missing": missing
                  }
          '

          # ============================================================
          # ROOT ENTRY POINT
          # ============================================================

          create_file "$BASE/main.py" '
          from apps.agro.application.application import agro_application

          def create_app():
              return agro_application

          app = create_app()
          '

          # ============================================================
          # ENSURE ALL EXISTING DIRECTORIES ARE PYTHON PACKAGES
          # WITHOUT OVERWRITING ANYTHING
          # ============================================================

          find "$BASE" -type d -exec sh -c '
            for DIR do
              FILE="$DIR/__init__.py"

              if [ ! -e "$FILE" ]; then
                touch "$FILE"
              fi
            done
          ' sh {} +

      - name: Verify complete Agro architecture
        shell: bash
        run: |
          set -e

          BASE="apps/agro"

          REQUIRED_FILES=(
            "$BASE/main.py"
            "$BASE/application/application.py"
            "$BASE/domain/entities/base_entity.py"
            "$BASE/domain/entities/producer.py"
            "$BASE/domain/entities/production.py"
            "$BASE/services/producer_service.py"
            "$BASE/services/production_service.py"
            "$BASE/infrastructure/database/repository.py"
            "$BASE/registry/modules/registry.py"
            "$BASE/registry/menus/registry.py"
            "$BASE/security/access_control.py"
            "$BASE/routers/api/router.py"
            "$BASE/schemas/entities/producer.py"
            "$BASE/validators/producer_validator.py"
            "$BASE/shared/result.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            test -f "$FILE" || {
              echo "ERROR: Missing $FILE"
              exit 1
            }

            echo "OK: $FILE"
          done

          MODULES=(
            "ejecutivo"
            "productores"
            "produccion"
            "insumos_y_apoyos"
            "recursos_y_activos"
            "comercializacion"
            "operaciones"
            "gobierno"
            "riesgo"
            "atencion_al_cliente"
            "seguridad"
          )

          for MODULE in "${MODULES[@]}"; do
            test -f "$BASE/modules/$MODULE/module.py"
            test -f "$BASE/modules/$MODULE/menu.py"
            test -f "$BASE/modules/$MODULE/navigation.py"

            echo "MODULE OK: $MODULE"
          done

          echo ""
          echo "=============================================="
          echo "AGRO COMPLETE ARCHITECTURE VERIFIED"
          echo "11 MODULES + APPLICATION + DOMAIN + EVENTS"
          echo "PERMISSIONS + REGISTRIES + ROUTERS + SCHEMAS"
          echo "SERVICES + INFRASTRUCTURE + SECURITY"
          echo "=============================================="

      - name: Compile Python files
        shell: bash
        run: |
          set -e

          python -m compileall -q apps/agro

          echo "Python compilation successful."

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A apps/agro

          if git diff --cached --quiet; then
            echo "No new changes."
            exit 0
          fi

          git commit -m "Build complete Agro functional architecture"
          git push
