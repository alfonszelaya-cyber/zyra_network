name: construir infraestructura

on:
  workflow_dispatch:

jobs:
  build-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Python path
        shell: bash
        run: |
          set -euo pipefail
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Build Infrastructure
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          ROOT = Path("infrastructure")
          ROOT.mkdir(parents=True, exist_ok=True)

          def write(path, content):
              target = ROOT / path
              target.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              target.write_text(
                  textwrap.dedent(content).lstrip(),
                  encoding="utf-8",
              )

          # ==========================================================
          # CACHE
          # ==========================================================

          write("cache/__init__.py", """
          from .cache_engine import (
              Cache,
              CacheEngine,
              CacheEntry,
              CacheStats,
          )
          from .cache_manager import CacheManager
          from .cache_policy import CachePolicy
          from .cache_registry import CacheRegistry
          from .cache_health import CacheHealth
          from .cache_metrics import CacheMetrics
          from .cache_events import CacheEvent
          from .cache_snapshot import CacheSnapshot
          from .distributed_cache import DistributedCache
          from .eviction_strategy import EvictionStrategy

          __all__ = [
              "Cache",
              "CacheEngine",
              "CacheEntry",
              "CacheStats",
              "CacheManager",
              "CachePolicy",
              "CacheRegistry",
              "CacheHealth",
              "CacheMetrics",
              "CacheEvent",
              "CacheSnapshot",
              "DistributedCache",
              "EvictionStrategy",
          ]
          """)

          write("cache/cache_engine.py", """
          from __future__ import annotations

          import threading
          import time
          from dataclasses import dataclass

          @dataclass
          class CacheEntry:
              value: object
              created_at: float
              expires_at: float | None
              hits: int = 0

          @dataclass(frozen=True)
          class CacheStats:
              entries: int
              hits: int
              misses: int

              @property
              def hit_rate(self):
                  total = self.hits + self.misses

                  if total == 0:
                      return 0.0

                  return self.hits / total

              def to_dict(self):
                  return {
                      "entries": self.entries,
                      "hits": self.hits,
                      "misses": self.misses,
                      "hit_rate": self.hit_rate,
                  }

          class CacheEngine:
              def __init__(self, policy=None):
                  from .cache_policy import CachePolicy

                  self.policy = (
                      policy or CachePolicy()
                  )

                  self._data = {}
                  self._lock = threading.RLock()
                  self._hits = 0
                  self._misses = 0

              def get(
                  self,
                  key,
                  default=None,
              ):
                  key = str(key)

                  with self._lock:
                      entry = self._data.get(key)

                      if entry is None:
                          self._misses += 1
                          return default

                      if (
                          entry.expires_at is not None
                          and time.monotonic()
                          >= entry.expires_at
                      ):
                          del self._data[key]
                          self._misses += 1
                          return default

                      entry.hits += 1
                      self._hits += 1

                      return entry.value

              def set(
                  self,
                  key,
                  value,
                  ttl=None,
              ):
                  key = str(key)

                  if ttl is None:
                      ttl = self.policy.ttl_seconds

                  if ttl is not None and ttl < 0:
                      raise ValueError(
                          "ttl must be >= 0"
                      )

                  now = time.monotonic()

                  with self._lock:
                      if (
                          key not in self._data
                          and len(self._data)
                          >= self.policy.max_entries
                      ):
                          self._evict_one()

                      self._data[key] = CacheEntry(
                          value=value,
                          created_at=now,
                          expires_at=(
                              None
                              if ttl is None
                              else now + ttl
                          ),
                      )

              def delete(self, key):
                  with self._lock:
                      return (
                          self._data.pop(
                              str(key),
                              None,
                          )
                          is not None
                      )

              def clear(self):
                  with self._lock:
                      self._data.clear()

              def contains(self, key):
                  key = str(key)

                  with self._lock:
                      entry = self._data.get(key)

                      if entry is None:
                          return False

                      if (
                          entry.expires_at is not None
                          and time.monotonic()
                          >= entry.expires_at
                      ):
                          del self._data[key]
                          return False

                      return True

              def stats(self):
                  with self._lock:
                      return CacheStats(
                          entries=len(
                              self._data
                          ),
                          hits=self._hits,
                          misses=self._misses,
                      )

              def _evict_one(self):
                  if not self._data:
                      return

                  oldest = min(
                      self._data.items(),
                      key=lambda item:
                          item[1].created_at,
                  )[0]

                  del self._data[oldest]


          class Cache(CacheEngine):
              """
              Compatibility API used by
              infrastructure.__init__.
              """

              pass
          """)

          write("cache/cache_policy.py", """
          from dataclasses import dataclass

          @dataclass(frozen=True)
          class CachePolicy:
              ttl_seconds: float | None = 300.0
              max_entries: int = 10000
              allow_stale: bool = False

              def __post_init__(self):
                  if (
                      self.ttl_seconds is not None
                      and self.ttl_seconds < 0
                  ):
                      raise ValueError(
                          "ttl_seconds must be >= 0"
                      )

                  if self.max_entries <= 0:
                      raise ValueError(
                          "max_entries must be > 0"
                      )
          """)

          write("cache/cache_manager.py", """
          from .cache_engine import CacheEngine

          class CacheManager:
              def __init__(self, engine=None):
                  self.engine = (
                      engine or CacheEngine()
                  )

              def read(
                  self,
                  key,
                  default=None,
              ):
                  return self.engine.get(
                      key,
                      default,
                  )

              def write(
                  self,
                  key,
                  value,
                  ttl=None,
              ):
                  self.engine.set(
                      key,
                      value,
                      ttl,
                  )

              def remove(self, key):
                  return self.engine.delete(
                      key
                  )

              def invalidate_all(self):
                  self.engine.clear()

              def health(self):
                  return {
                      "status": "healthy",
                      "cache":
                          self.engine.stats()
                          .to_dict(),
                  }
          """)

          write("cache/cache_registry.py", """
          import threading

          class CacheRegistry:
              def __init__(self):
                  self._items = {}
                  self._lock = threading.RLock()

              def register(self, name, cache):
                  with self._lock:
                      self._items[str(name)] = cache

              def get(self, name):
                  with self._lock:
                      return self._items.get(
                          str(name)
                      )

              def remove(self, name):
                  with self._lock:
                      return self._items.pop(
                          str(name),
                          None,
                      )

              def names(self):
                  with self._lock:
                      return tuple(
                          self._items
                      )
          """)

          write("cache/cache_events.py", """
          from dataclasses import dataclass, field
          from datetime import datetime, timezone

          @dataclass(frozen=True)
          class CacheEvent:
              event_type: str
              key: str | None = None
              payload: dict = field(
                  default_factory=dict
              )
              timestamp: str = field(
                  default_factory=lambda:
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              )
          """)

          write("cache/cache_metrics.py", """
          import threading

          class CacheMetrics:
              def __init__(self):
                  self._lock = threading.Lock()
                  self._counters = {}

              def increment(
                  self,
                  name,
                  value=1,
              ):
                  with self._lock:
                      self._counters[name] = (
                          self._counters.get(
                              name,
                              0,
                          )
                          + value
                      )

              def snapshot(self):
                  with self._lock:
                      return dict(
                          self._counters
                      )
          """)

          write("cache/cache_health.py", """
          class CacheHealth:
              def __init__(self, cache):
                  self.cache = cache

              def check(self):
                  stats = self.cache.stats()

                  return {
                      "status": "healthy",
                      **stats.to_dict(),
                  }
          """)

          write("cache/cache_snapshot.py", """
          import copy

          class CacheSnapshot:
              def __init__(self, cache):
                  self.cache = cache

              def export(self):
                  with self.cache._lock:
                      return copy.deepcopy({
                          key: entry.value
                          for key, entry
                          in self.cache._data.items()
                      })

              def restore(self, values):
                  for key, value in dict(
                      values
                  ).items():
                      self.cache.set(
                          key,
                          value,
                      )
          """)

          write("cache/distributed_cache.py", """
          class DistributedCache:
              def __init__(self, backend):
                  if backend is None:
                      raise ValueError(
                          "backend is required"
                      )

                  self.backend = backend

              def get(
                  self,
                  key,
                  default=None,
              ):
                  value = self.backend.get(key)

                  if value is None:
                      return default

                  return value

              def set(
                  self,
                  key,
                  value,
                  ttl=None,
              ):
                  if ttl is None:
                      return self.backend.set(
                          key,
                          value,
                      )

                  return self.backend.set(
                      key,
                      value,
                      ex=ttl,
                  )

              def delete(self, key):
                  return self.backend.delete(key)
          """)

          write("cache/eviction_strategy.py", """
          from enum import Enum

          class EvictionStrategy(str, Enum):
              FIFO = "fifo"
              LRU = "lru"
              NONE = "none"
          """)

          # ==========================================================
          # DATABASE
          # ==========================================================

          write("database/__init__.py", """
          from .database import (
              Database,
              DatabaseConfig,
          )

          __all__ = [
              "Database",
              "DatabaseConfig",
          ]
          """)

          write("database/database.py", """
          import sqlite3
          import threading
          from dataclasses import dataclass

          @dataclass(frozen=True)
          class DatabaseConfig:
              path: str = ":memory:"
              timeout: float = 30.0

          class Database:
              def __init__(self, config=None):
                  self.config = (
                      config or DatabaseConfig()
                  )

                  self._local = (
                      threading.local()
                  )

              def connect(self):
                  connection = getattr(
                      self._local,
                      "connection",
                      None,
                  )

                  if connection is None:
                      connection = sqlite3.connect(
                          self.config.path,
                          timeout=self.config.timeout,
                          check_same_thread=False,
                      )

                      connection.row_factory = (
                          sqlite3.Row
                      )

                      self._local.connection = (
                          connection
                      )

                  return connection

              def execute(
                  self,
                  sql,
                  parameters=(),
              ):
                  connection = self.connect()

                  cursor = connection.execute(
                      sql,
                      parameters,
                  )

                  connection.commit()

                  return cursor

              def executemany(
                  self,
                  sql,
                  parameters,
              ):
                  connection = self.connect()

                  cursor = connection.executemany(
                      sql,
                      parameters,
                  )

                  connection.commit()

                  return cursor

              def close(self):
                  connection = getattr(
                      self._local,
                      "connection",
                      None,
                  )

                  if connection is not None:
                      connection.close()
                      self._local.connection = None
          """)

          # ==========================================================
          # MONITORING
          # ==========================================================

          write(
              "monitoring_adapters/__init__.py",
              """
              from .health_adapter import HealthAdapter
              from .metrics_adapter import MetricsAdapter
              from .telemetry_adapter import TelemetryAdapter
              from .tracing_adapter import TracingAdapter

              __all__ = [
                  "HealthAdapter",
                  "MetricsAdapter",
                  "TelemetryAdapter",
                  "TracingAdapter",
              ]
              """,
          )

          write(
              "monitoring_adapters/health_adapter.py",
              """
              class HealthAdapter:
                  def __init__(self, checks=None):
                      self.checks = dict(
                          checks or {}
                      )

                  def register(self, name, check):
                      self.checks[str(name)] = check

                  def check(self):
                      result = {}
                      overall = True

                      for name, check in (
                          self.checks.items()
                      ):
                          try:
                              value = check()

                              if isinstance(
                                  value,
                                  bool,
                              ):
                                  healthy = value
                              elif isinstance(
                                  value,
                                  dict,
                              ):
                                  healthy = (
                                      value.get(
                                          "status"
                                      )
                                      == "healthy"
                                  )
                              else:
                                  healthy = bool(
                                      value
                                  )

                              result[name] = {
                                  "status":
                                      "healthy"
                                      if healthy
                                      else "unhealthy"
                              }

                              overall = (
                                  overall and healthy
                              )

                          except Exception as exc:
                              overall = False

                              result[name] = {
                                  "status":
                                      "unhealthy",
                                  "error":
                                      str(exc),
                              }

                      return {
                          "status":
                              "healthy"
                              if overall
                              else "unhealthy",
                          "checks": result,
                      }
              """,
          )

          write(
              "monitoring_adapters/metrics_adapter.py",
              """
              import threading

              class MetricsAdapter:
                  def __init__(self):
                      self._values = {}
                      self._lock = (
                          threading.RLock()
                      )

                  def increment(
                      self,
                      name,
                      value=1,
                  ):
                      with self._lock:
                          self._values[name] = (
                              self._values.get(
                                  name,
                                  0,
                              )
                              + value
                          )

                  def set(self, name, value):
                      with self._lock:
                          self._values[name] = value

                  def snapshot(self):
                      with self._lock:
                          return dict(
                              self._values
                          )
              """,
          )

          write(
              "monitoring_adapters/telemetry_adapter.py",
              """
              from datetime import datetime, timezone

              class TelemetryAdapter:
                  def __init__(self, sink=None):
                      self.sink = sink
                      self._events = []

                  def emit(
                      self,
                      event_type,
                      payload=None,
                  ):
                      event = {
                          "event_type":
                              str(event_type),
                          "payload":
                              dict(
                                  payload or {}
                              ),
                          "timestamp":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),
                      }

                      if self.sink:
                          self.sink(event)
                      else:
                          self._events.append(
                              event
                          )

                      return event

                  def recent(self):
                      return list(
                          self._events
                      )
              """,
          )

          write(
              "monitoring_adapters/tracing_adapter.py",
              """
              from contextlib import contextmanager
              from time import perf_counter

              class TracingAdapter:
                  def __init__(self, recorder=None):
                      self.recorder = recorder

                  @contextmanager
                  def span(
                      self,
                      name,
                      **attributes,
                  ):
                      started = perf_counter()
                      error = None

                      try:
                          yield

                      except Exception as exc:
                          error = exc
                          raise

                      finally:
                          data = {
                              "name": str(name),
                              "duration_seconds":
                                  perf_counter()
                                  - started,
                              "attributes":
                                  dict(attributes),
                              "error":
                                  None
                                  if error is None
                                  else str(error),
                          }

                          if self.recorder:
                              self.recorder(
                                  data
                              )
              """,
          )

          # ==========================================================
          # PROXY
          # ==========================================================

          write("proxy/__init__.py", """
          from .proxy_engine import ProxyEngine
          from .proxy_router import ProxyRouter
          from .proxy_registry import ProxyRegistry

          __all__ = [
              "ProxyEngine",
              "ProxyRouter",
              "ProxyRegistry",
          ]
          """)

          write("proxy/proxy_engine.py", """
          from dataclasses import dataclass
          from time import monotonic

          @dataclass
          class ProxyResponse:
              status_code: int
              headers: dict
              body: object
              latency_seconds: float

          class ProxyEngine:
              def __init__(self, transport):
                  if transport is None:
                      raise ValueError(
                          "transport is required"
                      )

                  self.transport = transport

              def forward(
                  self,
                  method,
                  target,
                  headers=None,
                  body=None,
              ):
                  started = monotonic()

                  response = self.transport(
                      method,
                      target,
                      headers or {},
                      body,
                  )

                  return ProxyResponse(
                      status_code=getattr(
                          response,
                          "status_code",
                          200,
                      ),
                      headers=dict(
                          getattr(
                              response,
                              "headers",
                              {},
                          ) or {}
                      ),
                      body=getattr(
                          response,
                          "body",
                          response,
                      ),
                      latency_seconds=(
                          monotonic()
                          - started
                      ),
                  )
          """)

          write("proxy/proxy_router.py", """
          class ProxyRouter:
              def __init__(self):
                  self._routes = []

              def add(self, prefix, target):
                  self._routes.append(
                      (str(prefix), target)
                  )

                  self._routes.sort(
                      key=lambda item:
                          len(item[0]),
                      reverse=True,
                  )

              def resolve(self, path):
                  for prefix, target in (
                      self._routes
                  ):
                      if path.startswith(prefix):
                          return target

                  return None
          """)

          write("proxy/reverse_proxy.py", """
          class ReverseProxy:
              def __init__(
                  self,
                  engine,
                  router,
              ):
                  self.engine = engine
                  self.router = router

              def handle(
                  self,
                  method,
                  path,
                  headers=None,
                  body=None,
              ):
                  target = self.router.resolve(
                      path
                  )

                  if target is None:
                      return {
                          "status_code": 404,
                          "body": {
                              "error":
                                  "route_not_found"
                          },
                      }

                  return self.engine.forward(
                      method,
                      target,
                      headers=headers,
                      body=body,
                  )
          """)

          write("proxy/gateway_proxy.py", """
          from .reverse_proxy import ReverseProxy

          class GatewayProxy(ReverseProxy):
              pass
          """)

          write("proxy/load_distribution.py", """
          import threading

          class LoadDistributor:
              def __init__(self):
                  self._targets = []
                  self._index = 0
                  self._lock = (
                      threading.Lock()
                  )

              def set_targets(self, targets):
                  targets = list(targets)

                  if not targets:
                      raise ValueError(
                          "at least one target is required"
                      )

                  with self._lock:
                      self._targets = targets
                      self._index = 0

              def next(self):
                  with self._lock:
                      if not self._targets:
                          raise RuntimeError(
                              "no targets configured"
                          )

                      target = self._targets[
                          self._index
                      ]

                      self._index = (
                          self._index + 1
                      ) % len(self._targets)

                      return target
          """)

          write("proxy/proxy_registry.py", """
          class ProxyRegistry:
              def __init__(self):
                  self._proxies = {}

              def register(self, name, proxy):
                  self._proxies[str(name)] = proxy

              def get(self, name):
                  return self._proxies.get(
                      str(name)
                  )

              def remove(self, name):
                  return self._proxies.pop(
                      str(name),
                      None,
                  )

              def names(self):
                  return tuple(
                      self._proxies
                  )
          """)

          write("proxy/proxy_validator.py", """
          from urllib.parse import urlparse

          class ProxyValidator:
              @staticmethod
              def validate_target(target):
                  parsed = urlparse(str(target))

                  if parsed.scheme not in {
                      "http",
                      "https",
                  }:
                      raise ValueError(
                          "target must use http or https"
                      )

                  if not parsed.netloc:
                      raise ValueError(
                          "target must include a host"
                      )

                  return True
          """)

          write("proxy/proxy_events.py", """
          from dataclasses import dataclass, field
          from datetime import datetime, timezone

          @dataclass(frozen=True)
          class ProxyEvent:
              event_type: str
              payload: dict = field(
                  default_factory=dict
              )
              timestamp: str = field(
                  default_factory=lambda:
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              )
          """)

          write("proxy/proxy_metrics.py", """
          import threading

          class ProxyMetrics:
              def __init__(self):
                  self._data = {}
                  self._lock = (
                      threading.Lock()
                  )

              def increment(
                  self,
                  name,
                  value=1,
              ):
                  with self._lock:
                      self._data[name] = (
                          self._data.get(
                              name,
                              0,
                          )
                          + value
                      )

              def snapshot(self):
                  with self._lock:
                      return dict(
                          self._data
                      )
          """)

          write("proxy/proxy_health.py", """
          class ProxyHealth:
              def __init__(self, registry):
                  self.registry = registry

              def check(self):
                  return {
                      "status": "healthy",
                      "registered_proxies":
                          len(
                              self.registry.names()
                          ),
                  }
          """)

          # ==========================================================
          # STORAGE ADAPTER
          # ==========================================================

          write("storage_adapter/__init__.py", """
          from .storage_engine import StorageEngine
          from .storage_registry import StorageRegistry

          __all__ = [
              "StorageEngine",
              "StorageRegistry",
          ]
          """)

          write("storage_adapter/storage_engine.py", """
          from pathlib import Path
          import os
          import tempfile

          class StorageEngine:
              def __init__(self, root):
                  self.root = Path(
                      root
                  ).resolve()

                  self.root.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

              def _path(self, key):
                  candidate = (
                      self.root / str(key)
                  ).resolve()

                  if (
                      candidate != self.root
                      and self.root
                      not in candidate.parents
                  ):
                      raise ValueError(
                          "storage key escapes "
                          "storage root"
                      )

                  return candidate

              def put(self, key, data):
                  target = self._path(key)

                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  fd, temporary = (
                      tempfile.mkstemp(
                          prefix=".zyra-",
                          dir=str(
                              target.parent
                          ),
                      )
                  )

                  try:
                      with os.fdopen(
                          fd,
                          "wb",
                      ) as handle:
                          handle.write(data)
                          handle.flush()
                          os.fsync(
                              handle.fileno()
                          )

                      os.replace(
                          temporary,
                          target,
                      )

                  finally:
                      if os.path.exists(
                          temporary
                      ):
                          os.unlink(
                              temporary
                          )

              def get(self, key):
                  return self._path(
                      key
                  ).read_bytes()

              def exists(self, key):
                  return self._path(
                      key
                  ).is_file()

              def delete(self, key):
                  path = self._path(key)

                  if not path.exists():
                      return False

                  path.unlink()

                  return True
          """)

          write("storage_adapter/storage_registry.py", """
          class StorageRegistry:
              def __init__(self):
                  self._backends = {}

              def register(
                  self,
                  name,
                  backend,
              ):
                  self._backends[
                      str(name)
                  ] = backend

              def get(self, name):
                  return self._backends.get(
                      str(name)
                  )

              def names(self):
                  return tuple(
                      self._backends
                  )
          """)

          write("storage_adapter/object_storage.py", """
          class ObjectStorage:
              def __init__(self, engine):
                  self.engine = engine

              def put_object(self, key, data):
                  self.engine.put(
                      key,
                      data,
                  )

              def get_object(self, key):
                  return self.engine.get(key)

              def delete_object(self, key):
                  return self.engine.delete(
                      key
                  )
          """)

          write("storage_adapter/block_storage.py", """
          class BlockStorage:
              def __init__(
                  self,
                  engine,
                  block_size=4 * 1024 * 1024,
              ):
                  if block_size <= 0:
                      raise ValueError(
                          "block_size must be > 0"
                      )

                  self.engine = engine
                  self.block_size = block_size

              def write(self, key, data):
                  self.engine.put(
                      key,
                      data,
                  )

              def read(self, key):
                  return self.engine.get(key)
          """)

          write("storage_adapter/storage_router.py", """
          class StorageRouter:
              def __init__(self):
                  self._routes = {}

              def register(
                  self,
                  namespace,
                  backend,
              ):
                  self._routes[
                      str(namespace)
                  ] = backend

              def resolve(self, namespace):
                  backend = self._routes.get(
                      str(namespace)
                  )

                  if backend is None:
                      raise KeyError(
                          namespace
                      )

                  return backend
          """)

          write("storage_adapter/storage_validator.py", """
          class StorageValidator:
              @staticmethod
              def validate_key(key):
                  key = str(key)

                  if not key:
                      raise ValueError(
                          "storage key cannot be empty"
                      )

                  if "\\x00" in key:
                      raise ValueError(
                          "storage key cannot contain NUL"
                      )

                  return True
          """)

          # ==========================================================
          # TEMPLATE
          # ==========================================================

          write("template/__init__.py", """
          from .template_engine import TemplateEngine
          from .template_registry import TemplateRegistry
          from .template_validator import TemplateValidator
          from .template_manager import TemplateManager

          __all__ = [
              "TemplateEngine",
              "TemplateRegistry",
              "TemplateValidator",
              "TemplateManager",
          ]
          """)

          write("template/template_validator.py", """
          class TemplateValidator:
              MAX_SIZE = 2_000_000

              @staticmethod
              def validate_content(content):
                  if not isinstance(
                      content,
                      str,
                  ):
                      raise TypeError(
                          "template content must be str"
                      )

                  if (
                      len(
                          content.encode(
                              "utf-8"
                          )
                      )
                      > TemplateValidator.MAX_SIZE
                  ):
                      raise ValueError(
                          "template exceeds "
                          "maximum size"
                      )

                  return content
          """)

          write("template/template_renderer.py", """
          class TemplateRenderer:
              def render(
                  self,
                  source,
                  context,
              ):
                  return source.format_map(
                      _Context(context)
                  )

          class _Context(dict):
              def __missing__(self, key):
                  raise KeyError(
                      f"missing template variable: "
                      f"{key}"
                  )
          """)

          write("template/template_engine.py", """
          from .template_validator import (
              TemplateValidator,
          )
          from .template_renderer import (
              TemplateRenderer,
          )

          class TemplateEngine:
              def __init__(self, renderer=None):
                  self.renderer = (
                      renderer
                      or TemplateRenderer()
                  )

              def render(
                  self,
                  source,
                  context=None,
              ):
                  TemplateValidator.validate_content(
                      source
                  )

                  return self.renderer.render(
                      source,
                      dict(context or {}),
                  )
          """)

          write("template/template_registry.py", """
          import threading

          class TemplateRegistry:
              def __init__(self):
                  self._templates = {}
                  self._lock = (
                      threading.RLock()
                  )

              def register(
                  self,
                  name,
                  template,
              ):
                  with self._lock:
                      if name in self._templates:
                          raise ValueError(
                              "template already "
                              "registered"
                          )

                      self._templates[name] = (
                          template
                      )

              def replace(
                  self,
                  name,
                  template,
              ):
                  with self._lock:
                      self._templates[name] = (
                          template
                      )

              def get(self, name):
                  with self._lock:
                      return self._templates.get(
                          name
                      )

              def remove(self, name):
                  with self._lock:
                      return self._templates.pop(
                          name,
                          None,
                      )

              def names(self):
                  with self._lock:
                      return tuple(
                          self._templates
                      )
          """)

          write("template/template_manager.py", """
          from .template_engine import TemplateEngine
          from .template_registry import TemplateRegistry

          class TemplateManager:
              def __init__(
                  self,
                  registry=None,
                  engine=None,
              ):
                  self.registry = (
                      registry
                      or TemplateRegistry()
                  )

                  self.engine = (
                      engine
                      or TemplateEngine()
                  )

              def register(
                  self,
                  name,
                  source,
              ):
                  self.registry.replace(
                      name,
                      source,
                  )

              def render(
                  self,
                  name,
                  context=None,
              ):
                  source = self.registry.get(
                      name
                  )

                  if source is None:
                      raise KeyError(name)

                  return self.engine.render(
                      source,
                      context,
                  )
          """)

          write("template/template_context.py", """
          class TemplateContext(dict):
              def require(self, key):
                  if key not in self:
                      raise KeyError(
                          f"missing template context: "
                          f"{key}"
                      )

                  return self[key]
          """)

          write("template/template_parser.py", """
          import string

          class TemplateParser:
              def parse(self, source):
                  return [
                      name
                      for _, name, _, _
                      in string.Formatter().parse(
                          source
                      )
                      if name
                  ]
          """)

          write("template/template_schema.py", """
          from dataclasses import dataclass, field

          @dataclass(frozen=True)
          class TemplateSchema:
              required: tuple[str, ...] = ()
              defaults: dict = field(
                  default_factory=dict
              )

              def validate(self, context):
                  missing = [
                      key
                      for key in self.required
                      if key not in context
                      and key not in self.defaults
                  ]

                  if missing:
                      raise ValueError(
                          "missing template fields: "
                          + ", ".join(missing)
                      )

                  return True
          """)

          write("template/template_health.py", """
          class TemplateHealth:
              def __init__(self, registry):
                  self.registry = registry

              def check(self):
                  return {
                      "status": "healthy",
                      "templates":
                          len(
                              self.registry.names()
                          ),
                  }
          """)

          write("template/template_metrics.py", """
          import threading

          class TemplateMetrics:
              def __init__(self):
                  self._values = {}
                  self._lock = (
                      threading.Lock()
                  )

              def increment(
                  self,
                  name,
                  value=1,
              ):
                  with self._lock:
                      self._values[name] = (
                          self._values.get(
                              name,
                              0,
                          )
                          + value
                      )

              def snapshot(self):
                  with self._lock:
                      return dict(
                          self._values
                      )
          """)

          write("template/template_api.py", """
          class TemplateAPI:
              def __init__(self, manager):
                  self.manager = manager

              def register(
                  self,
                  name,
                  source,
              ):
                  self.manager.register(
                      name,
                      source,
                  )

                  return {
                      "status":
                          "registered",
                      "name": name,
                  }

              def render(
                  self,
                  name,
                  context=None,
              ):
                  return self.manager.render(
                      name,
                      context,
                  )
          """)

          print(
              "ZYRA Infrastructure generated."
          )

      - name: Compile Infrastructure
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q infrastructure

          echo "COMPILE: PASS"

      - name: Integration checks
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          python - <<'PY'
          import infrastructure

          # ----------------------------------------------------------
          # COMPATIBILITY CHECK
          # ----------------------------------------------------------

          from infrastructure import (
              Cache,
              CacheEntry,
              CacheStats,
          )

          assert Cache is not None
          assert CacheEntry is not None
          assert CacheStats is not None

          # ----------------------------------------------------------
          # CACHE
          # ----------------------------------------------------------

          cache = Cache()

          cache.set(
              "test",
              "ok",
          )

          assert (
              cache.get("test")
              == "ok"
          )

          stats = cache.stats()

          assert isinstance(
              stats,
              CacheStats,
          )

          assert (
              stats.entries == 1
          )

          # ----------------------------------------------------------
          # DATABASE
          # ----------------------------------------------------------

          from infrastructure.database import (
              Database,
          )

          database = Database()

          database.execute(
              "CREATE TABLE IF NOT EXISTS "
              "zyra_health "
              "(id INTEGER PRIMARY KEY, "
              "status TEXT)"
          )

          # ----------------------------------------------------------
          # MONITORING
          # ----------------------------------------------------------

          from infrastructure.monitoring_adapters import (
              HealthAdapter,
          )

          health = HealthAdapter()

          health.register(
              "cache",
              lambda: {
                  "status": "healthy"
              },
          )

          health_result = health.check()

          assert (
              health_result["status"]
              == "healthy"
          )

          # ----------------------------------------------------------
          # PROXY
          # ----------------------------------------------------------

          from infrastructure.proxy import (
              ProxyRouter,
          )

          router = ProxyRouter()

          router.add(
              "/api",
              "http://localhost:8000",
          )

          assert (
              router.resolve(
                  "/api/test"
              )
              == "http://localhost:8000"
          )

          # ----------------------------------------------------------
          # TEMPLATE
          # ----------------------------------------------------------

          from infrastructure.template import (
              TemplateEngine,
          )

          engine = TemplateEngine()

          result = engine.render(
              "ZYRA {name}",
              {
                  "name": "Network"
              },
          )

          assert (
              result
              == "ZYRA Network"
          )

          print(
              "========================================"
          )

          print(
              "ZYRA INFRASTRUCTURE"
          )

          print(
              "COMPATIBILITY: PASS"
          )

          print(
              "CACHE: PASS"
          )

          print(
              "DATABASE: PASS"
          )

          print(
              "MONITORING: PASS"
          )

          print(
              "PROXY: PASS"
          )

          print(
              "TEMPLATE: PASS"
          )

          print(
              "========================================"
          )
          PY

      - name: Verify apps boundary
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only -- apps/ | grep -q .; then
            echo "ERROR: apps/ was modified."
            git diff --name-only -- apps/
            exit 1
          fi

          echo "APPS BOUNDARY: PASS"

      - name: Verify Infrastructure
        shell: bash
        run: |
          set -euo pipefail

          for directory in \
            cache \
            database \
            monitoring_adapters \
            proxy \
            storage_adapter \
            template
          do
            test -d \
              "infrastructure/${directory}"

            test -n "$(
              find \
                "infrastructure/${directory}" \
                -type f \
                -name '*.py' \
                -size +1c
            )"
          done

          echo "INFRASTRUCTURE VERIFICATION: PASS"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "ZYRA Infrastructure Bot"

          git config user.email \
            "actions@github.com"

          git add infrastructure

          if git diff --cached --quiet; then
            echo "No Infrastructure changes."
            exit 0
          fi

          git commit \
            -m "Fix and complete ZYRA infrastructure"

          git push
