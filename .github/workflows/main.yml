          )

          nodes.ready(
              "node-a"
          )

          nodes.heartbeat(
              "node-a"
          )

          assert (
              nodes.get(
                  "node-a"
              ).status
              is NodeStatus.READY
          )

          # ------------------------------------------------------------
          # Security
          # ------------------------------------------------------------

          security = SecurityManager()

          security.require_role(
              "network.admin",
              "admin",
          )

          security_context = SecurityContext(
              principal="system",
              roles=frozenset(
                  {"admin"}
              ),
          )

          assert (
              security.authorize(
                  security_context,
                  "network.admin",
              )
              is AccessDecision.ALLOW
          )

          # ------------------------------------------------------------
          # Security scheduler
          # ------------------------------------------------------------

          scheduler = SecurityScheduler()

          executed = []

          scheduler.schedule(
              "security-check",
              datetime.now(
                  timezone.utc
              ),
              lambda: executed.append(True),
          )

          assert scheduler.run_due() == 1
          assert executed == [True]

          # ------------------------------------------------------------
          # Template
          # ------------------------------------------------------------

          template = TemplateEngine()

          assert (
              template.render(
                  "ZYRA {{ environment }}",
                  {
                      "environment": "testing"
                  },
              )
              == "ZYRA testing"
          )

          # ------------------------------------------------------------
          # Proper Infrastructure shutdown
          # ------------------------------------------------------------

          infrastructure_bootstrap.shutdown()

          print(
              "INFRASTRUCTURE PRODUCTION "
              "INTEGRATION: PASS"
          )
          PY

          # ============================================================
          # NO EMPTY PYTHON FILES
          # ============================================================

          empty_files=0

          while IFS= read -r -d '' file; do
            if [ ! -s "$file" ]; then
              echo "EMPTY INFRASTRUCTURE FILE: $file"
              empty_files=$((empty_files + 1))
            fi
          done < <(
            find infrastructure \
              -type f \
              -name '*.py' \
              -print0
          )

          if [ "$empty_files" -ne 0 ]; then
            echo "ERROR: empty Python files remain."
            exit 1
          fi

          # ============================================================
          # APPS BOUNDARY
          # ============================================================

          if git status --porcelain -- apps | grep -q .; then
            echo "ERROR: apps/ was modified."
            git status --short -- apps
            exit 1
          fi

          echo "Infrastructure build: PASS"

      - name: Compile Infrastructure
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m compileall -q infrastructure
          echo "Infrastructure compilation: PASS"

      - name: Integration checks
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import infrastructure

          from infrastructure import (
              Cache,
              CacheEntry,
              CacheStats,
              Configuration,
              InfrastructureBootstrap,
          )

          assert infrastructure is not None
          assert Cache is not None
          assert CacheEntry is not None
          assert CacheStats is not None
          assert Configuration is not None
          assert InfrastructureBootstrap is not None

          configuration = Configuration.from_mapping(
              {
                  "ZYRA_ENVIRONMENT": "testing",
                  "ZYRA_SERVICE_NAME": "zyra-network-test",
                  "ZYRA_NODE_ID": "ci-node",
                  "ZYRA_DATA_DIRECTORY": "/tmp/zyra-ci-data-2",
                  "ZYRA_DATABASE_PATH": "/tmp/zyra-ci-data-2/zyra.db",
                  "ZYRA_CACHE_CAPACITY": "4096",
                  "ZYRA_CACHE_DEFAULT_TTL_SECONDS": "300",
                  "ZYRA_DATABASE_TIMEOUT_SECONDS": "30",
                  "ZYRA_DATABASE_WAL": "true",
                  "ZYRA_SHUTDOWN_TIMEOUT_SECONDS": "30",
                  "ZYRA_STRICT_CONFIGURATION": "true",
              }
          )

          bootstrap = InfrastructureBootstrap(
              configuration
          )

          context = bootstrap.initialize()

          context.cache.set(
              "integration",
              "pass",
          )

          assert (
              context.cache.get(
                  "integration"
              )
              == "pass"
          )

          bootstrap.shutdown()

          print(
              "Infrastructure imports and "
              "composition root: PASS"
          )
          PY

      - name: Verify apps boundary
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if git status --porcelain -- apps | grep -q .; then
            echo "ERROR: apps/ was modified."
            git status --short -- apps
            exit 1
          fi

          echo "apps/ boundary: PASS"

      - name: Verify Infrastructure
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          root = Path("infrastructure")

          required = [
              "bootstrap/api/__init__.py",
              "bootstrap/api/bootstrap_api.py",
              "cluster/__init__.py",
              "cluster/cluster_manager.py",
              "deployment/__init__.py",
              "deployment/deployment_manager.py",
              "diagnostics/__init__.py",
              "diagnostics/diagnostics.py",
              "discovery/__init__.py",
              "discovery/service_discovery.py",
              "gateway/__init__.py",
              "gateway/gateway.py",
              "load_balancer/__init__.py",
              "load_balancer/load_balancer.py",
              "monitoring_adapters/__init__.py",
              "monitoring_adapters/monitoring.py",
              "network/__init__.py",
              "network/network_manager.py",
              "node/__init__.py",
              "node/node_manager.py",
              "security/__init__.py",
              "security/security_manager.py",
              "security/scheduler/__init__.py",
              "security/scheduler/security_scheduler.py",
              "template/__init__.py",
              "template/template_engine.py",
          ]

          for relative in required:
              path = root / relative

              assert path.exists(), (
                  f"Missing Infrastructure file: {path}"
              )

              assert path.stat().st_size > 0, (
                  f"Empty Infrastructure file: {path}"
              )

          python_files = tuple(
              root.rglob("*.py")
          )

          assert python_files, (
              "Infrastructure contains no Python files"
          )

          for path in python_files:
              assert path.stat().st_size > 0, (
                  f"Empty Python file: {path}"
              )

          print(
              f"Infrastructure files verified: "
              f"{len(python_files)}"
          )
          print(
              "Infrastructure completeness: PASS"
          )
          PY

      - name: Commit and push
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add infrastructure

          if git diff --cached --quiet; then
            echo "No Infrastructure changes to commit."
            exit 0
          fi

          git commit \
            -m "build: complete production infrastructure foundation"

          git push origin "${GITHUB_REF_NAME}"
