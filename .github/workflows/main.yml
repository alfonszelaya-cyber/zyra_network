          import argparse
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path

          from scripts import (
              FileLock,
              LOCK_ROOT,
              OperationalError,
              RELEASE_ROOT,
              audit_event,
              configure_logging,
              ensure_operational_layout,
              execution_id,
              read_json,
              sha256_file,
              utc_now,
              write_state,
          )


          def parse_args() -> argparse.Namespace:
              parser = argparse.ArgumentParser(
                  description=(
                      "Safely activate a previously built release."
                  )
              )

              parser.add_argument("release")
              parser.add_argument(
                  "--root",
                  type=Path,
                  default=Path.cwd(),
              )
              parser.add_argument(
                  "--dry-run",
                  action="store_true",
              )
              parser.add_argument(
                  "--force",
                  action="store_true",
              )
              parser.add_argument(
                  "--verbose",
                  action="store_true",
              )

              return parser.parse_args()


          def verify_release(
              release: Path,
          ) -> dict:
              manifest = read_json(
                  release / "manifest.json"
              )

              if not isinstance(manifest, dict):
                  raise OperationalError(
                      "invalid release manifest"
                  )

              if (
                  manifest.get("format")
                  != "zyra.network.manifest.v1"
              ):
                  raise OperationalError(
                      "unsupported release manifest"
                  )

              source = release / "source"

              if not source.is_dir():
                  raise OperationalError(
                      "release source directory is missing"
                  )

              for entry in manifest.get(
                  "files",
                  [],
              ):
                  relative = Path(
                      str(entry["path"])
                  )

                  if (
                      relative.is_absolute()
                      or ".." in relative.parts
                  ):
                      raise OperationalError(
                          f"unsafe release path: {relative}"
                      )

                  target = source / relative

                  if not target.is_file():
                      raise OperationalError(
                          f"release file missing: {relative}"
                      )

                  actual = sha256_file(target)

                  if (
                      actual
                      != entry["sha256"]
                  ):
                      raise OperationalError(
                          "release checksum mismatch: "
                          f"{relative}"
                      )

              return manifest


          def main() -> int:
              args = parse_args()
              logger = configure_logging(args.verbose)
              ensure_operational_layout()
              execution = execution_id()
              root = args.root.resolve()

              release = Path(args.release)

              if not release.is_absolute():
                  release = (
                      RELEASE_ROOT / release
                  )

              release = release.resolve()

              try:
                  with FileLock(
                      LOCK_ROOT / "rollback.lock",
                      timeout=300,
                  ):
                      manifest = verify_release(
                          release
                      )

                      payload = {
                          "execution_id": execution,
                          "release": str(release),
                          "revision": manifest.get(
                              "revision"
                          ),
                          "dry_run": args.dry_run,
                      }

                      if args.dry_run:
                          print(
                              json.dumps(
                                  payload,
                                  indent=2,
                              )
                          )

                          audit_event(
                              "rollback",
                              status="dry-run",
                              execution=execution,
                              details=payload,
                          )

                          return 0

                      backup_root = (
                          RELEASE_ROOT
                          / "rollback-backups"
                      )

                      backup_root.mkdir(
                          parents=True,
                          exist_ok=True,
                      )

                      backup = (
                          backup_root / execution
                      )

                      backup.mkdir(
                          parents=True
                      )

                      managed_paths = {
                          str(entry["path"])
                          for entry in manifest.get(
                              "files",
                              [],
                          )
                      }

                      current_backup = (
                          backup / "current"
                      )

                      current_backup.mkdir()

                      for relative in managed_paths:
                          current = root / relative

                          if current.is_file():
                              destination = (
                                  current_backup
                                  / relative
                              )

                              destination.parent.mkdir(
                                  parents=True,
                                  exist_ok=True,
                              )

                              shutil.copy2(
                                  current,
                                  destination,
                              )

                      staging = Path(
                          tempfile.mkdtemp(
                              prefix=".zyra-rollback-",
                              dir=str(root.parent),
                          )
                      )

                      try:
                          for entry in manifest.get(
                              "files",
                              [],
                          ):
                              relative = Path(
                                  str(entry["path"])
                              )

                              source_file = (
                                  release
                                  / "source"
                                  / relative
                              )

                              target_file = (
                                  staging
                                  / relative
                              )

                              target_file.parent.mkdir(
                                  parents=True,
                                  exist_ok=True,
                              )

                              shutil.copy2(
                                  source_file,
                                  target_file,
                              )

                          for entry in manifest.get(
                              "files",
                              [],
                          ):
                              relative = Path(
                                  str(entry["path"])
                              )

                              staged = (
                                  staging / relative
                              )

                              if (
                                  sha256_file(staged)
                                  != entry["sha256"]
                              ):
                                  raise OperationalError(
                                      "staging verification "
                                      f"failed: {relative}"
                                  )

                          active = (
                              RELEASE_ROOT / "active"
                          )

                          temporary = (
                              RELEASE_ROOT
                              / f".active-{execution}"
                          )

                          if (
                              temporary.exists()
                              or temporary.is_symlink()
                          ):
                              temporary.unlink()

                          temporary.symlink_to(
                              release
                          )

                          os.replace(
                              temporary,
                              active,
                          )

                      finally:
                          shutil.rmtree(
                              staging,
                              ignore_errors=True,
                          )

                      payload.update(
                          {
                              "status": "activated",
                              "backup": str(backup),
                              "completed_at": utc_now(),
                          }
                      )

                      write_state(
                          "rollback",
                          payload,
                      )

                      audit_event(
                          "rollback",
                          status="success",
                          execution=execution,
                          details=payload,
                      )

                      print(
                          json.dumps(
                              payload,
                              indent=2,
                          )
                      )

                      return 0

              except Exception as exc:
                  audit_event(
                      "rollback",
                      status="failure",
                      execution=execution,
                      details={"error": repr(exc)},
                  )

                  logger.error(
                      "rollback failed: %s",
                      exc,
                  )

                  return 1


          if __name__ == "__main__":
              sys.exit(main())
