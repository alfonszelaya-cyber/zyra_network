name: construir-IA

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: write

concurrency:
  group: construir-ai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "cryptography==46.0.1" \
            "pytest==8.4.2" \
            "flake8==7.3.0" \
            "mypy==1.18.2"

      - name: Construir AI Engine
        shell: bash
        run: |
          set -euo pipefail

          rm -rf shared_engines/ai

          mkdir -p shared_engines/ai/tests

          cat > shared_engines/ai/__init__.py <<'PY'
          """Durable shared AI execution engine."""

          from .config import AIEngineConfig
          from .contracts import AIRequest, AIResponse, ModelDescriptor
          from .engine import AIEngine
          from .errors import AIError, AIIdempotencyConflict, AIRecoveryRequired

          __all__ = [
              "AIEngine",
              "AIEngineConfig",
              "AIError",
              "AIIdempotencyConflict",
              "AIRecoveryRequired",
              "AIRequest",
              "AIResponse",
              "ModelDescriptor",
          ]
          PY

          cat > shared_engines/ai/errors.py <<'PY'
          """Typed AI engine failures."""


          class AIError(Exception):
              """Base AI engine error."""


          class AIConfigurationError(AIError):
              """Invalid configuration."""


          class AIValidationError(AIError):
              """Invalid contract or input."""


          class AIIdempotencyConflict(AIError):
              """Idempotency key reused with different input."""


          class AIRequestInFlight(AIError):
              """Request is already executing."""


          class AIRecoveryRequired(AIError):
              """External execution outcome is uncertain."""


          class AIProviderError(AIError):
              """Base provider error."""


          class AIProviderTransientError(AIProviderError):
              """Provider error that may be retried."""


          class AIProviderPermanentError(AIProviderError):
              """Provider error that must not be retried."""


          class AIProviderProtocolError(AIProviderPermanentError):
              """Invalid provider response."""


          class AICircuitOpen(AIError):
              """Provider circuit is open."""


          class AIBudgetExceeded(AIError):
              """Execution cost limit exceeded."""


          class AIBackpressure(AIError):
              """Execution admission limit reached."""


          class AIIntegrityError(AIError):
              """Durable state integrity failure."""


          class AIMigrationError(AIError):
              """Migration failure."""


          class AILeaseLost(AIError):
              """Fencing lease is no longer owned."""
          PY

          cat > shared_engines/ai/contracts.py <<'PY'
          """Stable versioned AI contracts."""

          from __future__ import annotations

          from dataclasses import dataclass
          from decimal import Decimal
          from typing import Mapping


          CONTRACT_VERSION = 1


          @dataclass(frozen=True)
          class ModelDescriptor:
              """Immutable model identity."""

              provider: str
              model: str
              revision: str
              contract_version: int = CONTRACT_VERSION

              def validate(self) -> None:
                  if not self.provider:
                      raise ValueError("provider is required")
                  if not self.model:
                      raise ValueError("model is required")
                  if not self.revision:
                      raise ValueError("revision is required")
                  if self.contract_version != CONTRACT_VERSION:
                      raise ValueError("unsupported contract version")


          @dataclass(frozen=True)
          class AIRequest:
              """Immutable AI request."""

              request_id: str
              idempotency_key: str
              model: ModelDescriptor
              payload: Mapping[str, object]
              max_attempts: int = 3
              deadline_seconds: float = 60.0
              cost_limit: Decimal = Decimal("1000000")

              def validate(self) -> None:
                  if not self.request_id:
                      raise ValueError("request_id is required")
                  if not self.idempotency_key:
                      raise ValueError("idempotency_key is required")
                  if not 1 <= self.max_attempts <= 10:
                      raise ValueError("max_attempts must be 1..10")
                  if self.deadline_seconds <= 0:
                      raise ValueError("deadline must be positive")
                  if self.cost_limit < 0:
                      raise ValueError("cost limit cannot be negative")
                  self.model.validate()


          @dataclass(frozen=True)
          class AIResponse:
              """Immutable provider-neutral response."""

              request_id: str
              provider_request_id: str
              output: Mapping[str, object]
              usage: Mapping[str, object]
              cost: Decimal
              contract_version: int = CONTRACT_VERSION

              def validate(self) -> None:
                  if not self.request_id:
                      raise ValueError("request_id is required")
                  if not self.provider_request_id:
                      raise ValueError("provider request id is required")
                  if self.cost < 0:
                      raise ValueError("cost cannot be negative")
                  if self.contract_version != CONTRACT_VERSION:
                      raise ValueError("unsupported contract version")
          PY

          cat > shared_engines/ai/serialization.py <<'PY'
          """Canonical deterministic serialization."""

          from __future__ import annotations

          import hashlib
          import json
          from typing import Any


          def canonical_bytes(value: Any) -> bytes:
              """Serialize JSON deterministically."""
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")


          def sha256_hex(value: Any) -> str:
              """Calculate stable SHA-256."""
              return hashlib.sha256(canonical_bytes(value)).hexdigest()
          PY

          cat > shared_engines/ai/keys.py <<'PY'
          """Versioned encryption key provider."""

          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Protocol


          class KeyProvider(Protocol):
              """Provides versioned AES-256 keys."""

              def current(self) -> tuple[str, bytes]:
                  ...

              def get(self, version: str) -> bytes:
                  ...


          @dataclass(frozen=True)
          class StaticKeyProvider:
              """Deployment-supplied key provider.

              Production deployments should replace this with KMS/HSM
              backed material. Keys must never be committed to source.
              """

              version: str
              key: bytes

              def __post_init__(self) -> None:
                  if not self.version:
                      raise ValueError("key version is required")
                  if len(self.key) != 32:
                      raise ValueError("AES-256 requires 32 bytes")

              def current(self) -> tuple[str, bytes]:
                  return self.version, self.key

              def get(self, version: str) -> bytes:
                  if version != self.version:
                      raise KeyError(version)
                  return self.key
          PY

          cat > shared_engines/ai/crypto.py <<'PY'
          """Authenticated encryption with key rotation support."""

          from __future__ import annotations

          import base64
          import os

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          from .keys import KeyProvider


          class EnvelopeCipher:
              """AES-256-GCM encrypted envelope."""

              def __init__(self, keys: KeyProvider) -> None:
                  self._keys = keys

              def encrypt(self, plaintext: bytes, aad: bytes) -> str:
                  version, key = self._keys.current()
                  nonce = os.urandom(12)
                  ciphertext = AESGCM(key).encrypt(
                      nonce,
                      plaintext,
                      aad,
                  )
                  raw = (
                      version.encode("utf-8")
                      + b"\0"
                      + nonce
                      + ciphertext
                  )
                  return base64.urlsafe_b64encode(raw).decode("ascii")

              def decrypt(self, token: str, aad: bytes) -> bytes:
                  raw = base64.urlsafe_b64decode(token.encode("ascii"))
                  separator = raw.find(b"\0")

                  if separator <= 0:
                      raise ValueError("invalid encrypted envelope")

                  version = raw[:separator].decode("utf-8")
                  body = raw[separator + 1:]

                  if len(body) < 13:
                      raise ValueError("invalid encrypted payload")

                  nonce = body[:12]
                  ciphertext = body[12:]
                  key = self._keys.get(version)

                  return AESGCM(key).decrypt(
                      nonce,
                      ciphertext,
                      aad,
                  )
          PY

          cat > shared_engines/ai/config.py <<'PY'
          """Validated engine configuration."""

          from __future__ import annotations

          from dataclasses import dataclass

          from .errors import AIConfigurationError


          @dataclass(frozen=True)
          class AIEngineConfig:
              db_path: str
              lease_seconds: int = 120
              max_concurrency: int = 32
              max_queue: int = 256
              max_payload_bytes: int = 2_000_000
              max_response_bytes: int = 8_000_000
              retry_base_seconds: float = 0.25
              retry_max_seconds: float = 8.0

              def validate(self) -> None:
                  if not self.db_path:
                      raise AIConfigurationError("db_path is required")
                  if self.lease_seconds < 5:
                      raise AIConfigurationError(
                          "lease_seconds must be >= 5"
                      )
                  if self.max_concurrency < 1:
                      raise AIConfigurationError(
                          "max_concurrency must be positive"
                      )
                  if self.max_queue < 0:
                      raise AIConfigurationError(
                          "max_queue cannot be negative"
                      )
                  if self.max_payload_bytes < 1024:
                      raise AIConfigurationError(
                          "payload limit too small"
                      )
                  if self.max_response_bytes < 1024:
                      raise AIConfigurationError(
                          "response limit too small"
                      )
                  if self.retry_base_seconds <= 0:
                      raise AIConfigurationError(
                          "retry base must be positive"
                      )
                  if self.retry_max_seconds < self.retry_base_seconds:
                      raise AIConfigurationError(
                          "retry max must be >= retry base"
                      )
          PY

          cat > shared_engines/ai/compatibility.py <<'PY'
          """Contract compatibility policy."""

          from __future__ import annotations

          from dataclasses import dataclass

          from .contracts import CONTRACT_VERSION
          from .errors import AIValidationError


          @dataclass(frozen=True)
          class ContractPolicy:
              current: int = CONTRACT_VERSION
              minimum_readable: int = CONTRACT_VERSION

              def validate(self) -> None:
                  if self.minimum_readable > self.current:
                      raise AIValidationError(
                          "invalid compatibility policy"
                      )

              def require_readable(self, version: int) -> None:
                  if version < self.minimum_readable:
                      raise AIValidationError(
                          f"contract {version} is too old"
                      )
                  if version > self.current:
                      raise AIValidationError(
                          f"contract {version} is too new"
                      )
          PY

          cat > shared_engines/ai/events.py <<'PY'
          """Versioned durable event envelope."""

          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Mapping

          from .serialization import sha256_hex


          EVENT_VERSION = 1


          @dataclass(frozen=True)
          class EventEnvelope:
