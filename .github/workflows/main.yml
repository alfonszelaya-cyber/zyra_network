                  with pytest.raises(AIIntegrityError):
                      store.verify_audit()


          def sqlite3_connection(
              store: SQLiteAIStore,
          ):
              connection = store._test_connection()
              return connection


          def test_limiter_backpressure() -> None:
              limiter = ExecutionLimiter(1, 0)
              limiter.acquire(0.1)
              try:
                  with pytest.raises(Exception):
                      limiter.acquire(0.01)
              finally:
                  limiter.release()
