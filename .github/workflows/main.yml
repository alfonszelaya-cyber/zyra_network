          secret = b"protocol-secret"

          fingerprint = verifier.fingerprint(
              payload
          )

          assert len(fingerprint) == 64

          assert verifier.verify_fingerprint(
              payload,
              fingerprint,
          )

          signature = verifier.sign_hmac(
              payload,
              secret,
          )

          assert verifier.verify_hmac(
              payload,
              secret,
              signature,
          )

          assert not verifier.verify_hmac(
              b"tampered",
              secret,
              signature,
          )

          result = verifier.verify(
              payload,
              fingerprint,
          )

          assert result.valid is True
          assert result.algorithm == "sha256"

          print("Protocol verification validation: OK")
