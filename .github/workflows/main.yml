name: Crear carpetas de Axis - Bloque Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Agregar bloque final a apps/axis
        run: |
          # Docs
          mkdir -p apps/axis/docs/{api,architecture,diagrams,manuals,policies,standards,user_guides}

          # Localization
          mkdir -p apps/axis/localization/{countries,languages,regions,timezones,translations}

          # Resources
          mkdir -p apps/axis/resources/{catalogs,dictionaries,forms,import_templates,reference_data,system_defaults}

          # Tests
          mkdir -p apps/axis/tests/{application,domain,infrastructure,integration,modules,performance,security,unit}

          # Migrations
          mkdir -p apps/axis/migrations/{data,database,versions}

          # Archivo README.md en la raíz de axis
          touch apps/axis/README.md

          # Crear __init__.py únicamente dentro de los directorios de este bloque
          find apps/axis/docs apps/axis/localization apps/axis/resources apps/axis/tests apps/axis/migrations -type d -exec touch {}/__init__.py \;

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Bloque final de axis agregado (docs, localization, resources, tests, migrations)"
          git push origin main
