                      with self._limiter:
                          return self._execute_locked(
                              request=request,
                              model=model,
                              owner=owner,
                              lease_token=lease_token,
                          )
                  except Exception:
                      raise

              def _execute_locked(
                  self,
                  *,
                  request: AIRequest,
                  model: object,
                  owner: str,
                  lease_token: str | None,
              ) -> AIResponse:
                  deadline = (
                      time.monotonic()
                      + request.timeout_seconds
                  )

                  failures: list[str] = []

                  for provider in self._providers:
                      supports_model = any(
                          descriptor.model_id
                          == request.model_id
                          for descriptor
                          in provider.models()
                      )

                      if not supports_model:
                          continue

                      circuit = self._circuits[
                          provider.name
                      ]

                      if not circuit.allow(
                          now=self._clock.now()
                      ):
                          failures.append(
                              provider.name
                              + ": circuit-open"
                          )
                          continue

                      for attempt in range(
                          self._policy.max_attempts
                      ):
                          if (
                              time.monotonic()
                              >= deadline
                          ):
                              failures.append(
                                  provider.name
                                  + ": deadline-exceeded"
                              )
                              break

                          try:
                              response = (
                                  provider.complete(
                                      request,
                                      model,  # type: ignore[arg-type]
                                  )
                              )

                              circuit.success()

                              maximum_cost = (
                                  self._policy
                                  .maximum_cost_per_request
                              )

                              if (
                                  maximum_cost is not None
                                  and (
                                      response.usage
                                      .estimated_cost
                                      > maximum_cost
                                  )
                              ):
                                  raise AIBudgetExceeded(
                                      "Per-request cost limit exceeded"
                                  )

                              if self._budget is not None:
                                  self._budget.settle(
                                      tokens=(
                                          response
                                          .usage
                                          .total_tokens
                                      ),
                                      cost=(
                                          response
                                          .usage
                                          .estimated_cost
                                      ),
                                  )

                              if (
                                  self._store is not None
                                  and lease_token is not None
                              ):
                                  self._store.complete(
                                      request=request,
                                      response=response,
                                      owner=owner,
                                      lease_token=lease_token,
                                      now=self._clock.now(),
                                  )

                              return response

                          except AIBudgetExceeded:
                              if (
                                  self._store is not None
                                  and lease_token is not None
                              ):
                                  self._store.fail(
                                      request=request,
                                      owner=owner,
                                      lease_token=lease_token,
                                      now=self._clock.now(),
                                      error_code=(
                                          "BUDGET_EXCEEDED"
                                      ),
                                      error_message=(
                                          "AI budget exceeded"
                                      ),
                                  )

                              raise

                          except AIProviderTransientError as exc:
                              circuit.failure(
                                  now=self._clock.now()
                              )

                              failures.append(
                                  provider.name
                                  + ": transient"
                              )

                              if (
                                  attempt + 1
                                  >= self._policy.max_attempts
                              ):
                                  break

                              delay = min(
                                  self._policy
                                  .retry_max_seconds,
                                  self._policy
                                  .retry_base_seconds
                                  * (2 ** attempt),
                              )

                              remaining = (
                                  deadline
                                  - time.monotonic()
                              )

                              if remaining <= 0:
                                  break

                              time.sleep(
                                  min(
                                      delay,
                                      remaining,
                                  )
                              )

                              _ = exc

                          except AIProviderPermanentError:
                              circuit.failure(
                                  now=self._clock.now()
                              )

                              failures.append(
                                  provider.name
                                  + ": permanent"
                              )

                              break

                          except Exception as exc:
                              circuit.failure(
                                  now=self._clock.now()
                              )

                              if (
                                  self._store is not None
                                  and lease_token is not None
                              ):
                                  self._store.mark_recovery_required(
                                      request=request,
                                      owner=owner,
                                      lease_token=lease_token,
                                      now=self._clock.now(),
                                      error_code=(
                                          type(exc).__name__
                                      ),
                                      error_message=str(
                                          exc
                                      ),
                                  )

                              raise

                  if (
                      self._store is not None
                      and lease_token is not None
                  ):
                      self._store.fail(
                          request=request,
                          owner=owner,
                          lease_token=lease_token,
                          now=self._clock.now(),
                          error_code=(
                              "ALL_PROVIDERS_FAILED"
                          ),
                          error_message=(
                              " | ".join(failures)
                          ),
                      )

                  if not failures:
                      raise AIProviderUnavailable(
                          "No provider supports the requested model"
                      )

                  raise AIProviderError(
                      "All eligible providers failed: "
                      + " | ".join(failures)
                  )

              def recover_stale_requests(self) -> int:
                  if self._store is None:
                      return 0

                  return self._store.recover_expired(
                      now=self._clock.now(),
                      stale_after_seconds=(
                          self._policy
                          .stale_request_seconds
                      ),
                  )

              def audit_is_valid(self) -> bool:
                  if self._store is None:
                      return True

                  return self._store.verify_audit_chain()

              def health(self) -> dict[str, object]:
                  providers: dict[
                      str,
                      object,
                  ] = {}

                  for provider in self._providers:
                      snapshot = self._circuits[
                          provider.name
                      ].snapshot()

                      providers[
                          provider.name
                      ] = {
                          "healthy": provider.health(),
                          "circuit": (
                              snapshot.state.value
                          ),
                          "failures": snapshot.failures,
                          "opened_at": snapshot.opened_at,
                      }

                  return {
                      "engine": "ready",
                      "registry_revision": (
                          self._registry.revision
                      ),
                      "audit_valid": (
                          self.audit_is_valid()
                      ),
                      "concurrency_available": (
                          self._limiter
                          .available_probe()
                      ),
                      "providers": providers,
                  }
          PY

