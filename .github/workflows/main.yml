name: Foundation - Config Constants Exceptions Hooks Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-core-5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p foundation/config
          mkdir -p foundation/constants
          mkdir -p foundation/exceptions
          mkdir -p foundation/hooks
          mkdir -p foundation/metadata

      - name: Create foundation config
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/config/config.py <<'PY'
          from __future__ import annotations

          import os
          from dataclasses import dataclass
          from typing import Mapping


          class ConfigurationError(ValueError):
              """Raised when required configuration is invalid."""


          def _required(env: Mapping[str, str], name: str) -> str:
              value = env.get(name)
              if value is None or not value.strip():
                  raise ConfigurationError(f"Required configuration is missing: {name}")
              return value.strip()


          def _positive_int(value: str, name: str) -> int:
              try:
                  parsed = int(value)
              except ValueError as exc:
                  raise ConfigurationError(
                      f"{name} must be an integer"
                  ) from exc

              if parsed <= 0:
                  raise ConfigurationError(f"{name} must be greater than zero")

              return parsed


          @dataclass(frozen=True, slots=True)
          class NetworkConfig:
              environment: str
              service_name: str
              node_id: str | None
              host: str
              port: int
              log_level: str

              @classmethod
              def from_env(cls, env: Mapping[str, str] | None = None) -> "NetworkConfig":
                  source = os.environ if env is None else env

                  environment = source.get("ZYRA_ENV", "production").strip().lower()
                  if environment not in {"development", "testing", "staging", "production"}:
                      raise ConfigurationError(
                          "ZYRA_ENV must be development, testing, staging, or production"
                      )

                  service_name = source.get(
                      "ZYRA_SERVICE_NAME",
                      "zyra-network",
                  ).strip()

                  if not service_name:
                      raise ConfigurationError("ZYRA_SERVICE_NAME cannot be empty")

                  host = source.get("ZYRA_HOST", "0.0.0.0").strip()
                  port = _positive_int(
                      source.get("ZYRA_PORT", "8000"),
                      "ZYRA_PORT",
                  )

                  log_level = source.get("ZYRA_LOG_LEVEL", "INFO").strip().upper()
                  allowed_levels = {"DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"}

                  if log_level not in allowed_levels:
                      raise ConfigurationError(
                          "ZYRA_LOG_LEVEL must be DEBUG, INFO, WARNING, ERROR, or CRITICAL"
                      )

                  node_id = source.get("ZYRA_NODE_ID")
                  if node_id is not None:
                      node_id = node_id.strip() or None

                  return cls(
                      environment=environment,
                      service_name=service_name,
                      node_id=node_id,
                      host=host,
                      port=port,
                      log_level=log_level,
                  )


          __all__ = ["ConfigurationError", "NetworkConfig"]
          PY

          cat > foundation/config/__init__.py <<'PY'
          from .config import ConfigurationError, NetworkConfig

          __all__ = ["ConfigurationError", "NetworkConfig"]
          PY

      - name: Create foundation constants
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/constants/constants.py <<'PY'
          from __future__ import annotations

          NETWORK_NAME = "ZYRA_NETWORK"
          NETWORK_API_VERSION = "v1"
          NETWORK_PROTOCOL_VERSION = "1"

          DEFAULT_HOST = "0.0.0.0"
          DEFAULT_PORT = 8000

          ENV_DEVELOPMENT = "development"
          ENV_TESTING = "testing"
          ENV_STAGING = "staging"
          ENV_PRODUCTION = "production"

          LOG_LEVELS = frozenset(
              {"DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"}
          )

          __all__ = [
              "NETWORK_NAME",
              "NETWORK_API_VERSION",
              "NETWORK_PROTOCOL_VERSION",
              "DEFAULT_HOST",
              "DEFAULT_PORT",
              "ENV_DEVELOPMENT",
              "ENV_TESTING",
              "ENV_STAGING",
              "ENV_PRODUCTION",
              "LOG_LEVELS",
          ]
          PY

          cat > foundation/constants/__init__.py <<'PY'
          from .constants import (
              DEFAULT_HOST,
              DEFAULT_PORT,
              ENV_DEVELOPMENT,
              ENV_PRODUCTION,
              ENV_STAGING,
              ENV_TESTING,
              LOG_LEVELS,
              NETWORK_API_VERSION,
              NETWORK_NAME,
              NETWORK_PROTOCOL_VERSION,
          )

          __all__ = [
              "NETWORK_NAME",
              "NETWORK_API_VERSION",
              "NETWORK_PROTOCOL_VERSION",
              "DEFAULT_HOST",
              "DEFAULT_PORT",
              "ENV_DEVELOPMENT",
              "ENV_TESTING",
              "ENV_STAGING",
              "ENV_PRODUCTION",
              "LOG_LEVELS",
          ]
          PY

      - name: Create foundation exceptions
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/exceptions/exceptions.py <<'PY'
          from __future__ import annotations


          class FoundationError(Exception):
              """Base exception for the ZYRA foundation layer."""


          class ConfigurationError(FoundationError):
              """Invalid or incomplete system configuration."""


          class ValidationError(FoundationError):
              """Domain or structural validation failure."""


          class StateError(FoundationError):
              """Invalid state transition or state operation."""


          class RegistryError(FoundationError):
              """Registry operation failure."""


          class SecurityError(FoundationError):
              """Foundation security boundary violation."""


          class LifecycleError(FoundationError):
              """Invalid lifecycle operation."""


          class ContractError(FoundationError):
              """Contract violation between system components."""


          class NotFoundError(FoundationError):
              """Requested foundation resource does not exist."""


          class ConflictError(FoundationError):
              """Operation conflicts with current system state."""


          __all__ = [
              "FoundationError",
              "ConfigurationError",
              "ValidationError",
              "StateError",
              "RegistryError",
              "SecurityError",
              "LifecycleError",
              "ContractError",
              "NotFoundError",
              "ConflictError",
          ]
          PY

          cat > foundation/exceptions/__init__.py <<'PY'
          from .exceptions import (
              ConfigurationError,
              ConflictError,
              ContractError,
              FoundationError,
              LifecycleError,
              NotFoundError,
              RegistryError,
              SecurityError,
              StateError,
              ValidationError,
          )

          __all__ = [
              "FoundationError",
              "ConfigurationError",
              "ValidationError",
              "StateError",
              "RegistryError",
              "SecurityError",
              "LifecycleError",
              "ContractError",
              "NotFoundError",
              "ConflictError",
          ]
          PY

      - name: Create foundation hooks
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/hooks/hooks.py <<'PY'
          from __future__ import annotations

          from collections.abc import Callable
          from threading import RLock
          from typing import Any


          Hook = Callable[..., Any]


          class HookRegistry:
              """Thread-safe registry for lifecycle and system extension hooks."""

              def __init__(self) -> None:
                  self._hooks: dict[str, list[Hook]] = {}
                  self._lock = RLock()

              def register(self, event: str, hook: Hook) -> None:
                  if not event or not event.strip():
                      raise ValueError("Hook event cannot be empty")

                  if not callable(hook):
                      raise TypeError("Hook must be callable")

                  normalized = event.strip()

                  with self._lock:
                      hooks = self._hooks.setdefault(normalized, [])
                      if hook not in hooks:
                          hooks.append(hook)

              def unregister(self, event: str, hook: Hook) -> bool:
                  with self._lock:
                      hooks = self._hooks.get(event.strip())

                      if not hooks or hook not in hooks:
                          return False

                      hooks.remove(hook)

                      if not hooks:
                          self._hooks.pop(event.strip(), None)

                      return True

              def emit(self, event: str, *args: Any, **kwargs: Any) -> list[Any]:
                  with self._lock:
                      hooks = tuple(self._hooks.get(event.strip(), ()))

                  results: list[Any] = []

                  for hook in hooks:
                      results.append(hook(*args, **kwargs))

                  return results

              def has(self, event: str) -> bool:
                  with self._lock:
                      return bool(self._hooks.get(event.strip()))

              def clear(self, event: str | None = None) -> None:
                  with self._lock:
                      if event is None:
                          self._hooks.clear()
                      else:
                          self._hooks.pop(event.strip(), None)

              def events(self) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(sorted(self._hooks))


          __all__ = ["Hook", "HookRegistry"]
          PY

          cat > foundation/hooks/__init__.py <<'PY'
          from .hooks import Hook, HookRegistry

          __all__ = ["Hook", "HookRegistry"]
          PY

      - name: Create foundation metadata
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/metadata/metadata.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from typing import Any, Mapping


          @dataclass(frozen=True, slots=True)
          class ComponentMetadata:
              """Immutable metadata describing a network component."""

              name: str
              version: str
              component_type: str
              owner: str | None = None
              description: str | None = None
              capabilities: frozenset[str] = field(default_factory=frozenset)
              attributes: Mapping[str, Any] = field(default_factory=dict)
              registered_at: datetime = field(
                  default_factory=lambda: datetime.now(timezone.utc)
              )

              def __post_init__(self) -> None:
                  if not self.name.strip():
                      raise ValueError("Metadata name cannot be empty")

                  if not self.version.strip():
                      raise ValueError("Metadata version cannot be empty")

                  if not self.component_type.strip():
                      raise ValueError("Metadata component_type cannot be empty")

                  object.__setattr__(
                      self,
                      "capabilities",
                      frozenset(
                          capability.strip()
                          for capability in self.capabilities
                          if capability and capability.strip()
                      ),
                  )

                  object.__setattr__(
                      self,
                      "attributes",
                      dict(self.attributes),
                  )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "name": self.name,
                      "version": self.version,
                      "component_type": self.component_type,
                      "owner": self.owner,
                      "description": self.description,
                      "capabilities": sorted(self.capabilities),
                      "attributes": dict(self.attributes),
                      "registered_at": self.registered_at.isoformat(),
                  }


          __all__ = ["ComponentMetadata"]
          PY

          cat > foundation/metadata/__init__.py <<'PY'
          from .metadata import ComponentMetadata

          __all__ = ["ComponentMetadata"]
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            foundation/config \
            foundation/constants \
            foundation/exceptions \
            foundation/hooks \
            foundation/metadata

          python - <<'PY'
          from foundation.config import NetworkConfig
          from foundation.constants import NETWORK_NAME
          from foundation.exceptions import FoundationError
          from foundation.hooks import HookRegistry
          from foundation.metadata import ComponentMetadata

          config = NetworkConfig.from_env({})
          assert config.port == 8000
          assert NETWORK_NAME == "ZYRA_NETWORK"
          assert issubclass(FoundationError, Exception)

          registry = HookRegistry()
          values = []

          def hook(value):
              values.append(value)
              return value

          registry.register("test", hook)
          assert registry.emit("test", 42) == [42]
          assert values == [42]

          metadata = ComponentMetadata(
              name="foundation",
              version="1.0.0",
              component_type="core",
          )
          assert metadata.to_dict()["name"] == "foundation"

          print("Foundation block 1 validation: OK")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add foundation/config foundation/constants foundation/exceptions foundation/hooks foundation/metadata

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Complete foundation config constants exceptions hooks metadata"
          git push
