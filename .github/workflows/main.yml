                  store = ObservationStore(
                      path,
                      max_records=100,
                  )

                  store.append(
                      {
                          "type": "test",
                          "value": 123,
                      }
                  )

                  assert store.count() == 1
                  records = store.read_all()

                  assert records[0]["type"] == "test"
                  assert records[0]["value"] == 123


          def test_manager_lifecycle():
              manager = ObservationManager()

              assert manager.status()["state"] == "created"

              manager.start()

              assert manager.status()["state"] == "running"

              manager.stop()

              assert manager.status()["state"] == "stopped"


          def test_event_recording():
              manager = ObservationManager()
              manager.start()

              context = manager.engine.events.recent

              assert callable(context)

              observation_context = ObservationContext.create(
                  component="test",
                  operation="event",
              )

              from observability import ObservationEvent

              event = ObservationEvent.create(
                  event_type="TEST_EVENT",
                  severity=Severity.INFO,
                  message="production test",
                  context=observation_context,
              )

              manager.record_event(event)

              events = manager.events.recent()

              assert len(events) == 1
              assert events[0].event_type == "TEST_EVENT"
          PY

