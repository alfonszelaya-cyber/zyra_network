      - name: Verify boundaries
        shell: bash
        run: |
          set -euo pipefail

          for path in apps telemetry infrastructure network; do
            if git status --porcelain -- "$path/" | grep -q .; then
              echo "ERROR: forbidden modification:"
              echo "$path/"
              git status --short -- "$path/"
              exit 1
            fi
          done

          echo "Boundary verification: PASS"

      - name: Verify allowed changes
        shell: bash
        run: |
          set -euo pipefail

          changed="$(
            git status --porcelain \
            | sed 's/^.. //'
          )"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              observability/*)
                ;;
              *)
                echo "ERROR: unauthorized change:"
                echo "$file"
                exit 1
                ;;
            esac
          done <<< "$changed"

          echo "Allowed changes: PASS"

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q observability

          python - <<'PY'
          from observability import (
              HealthState,
              ObservabilityManager,
          )

          manager = ObservabilityManager()
          manager.start()

          assert manager.state.value == "ready"
          assert manager.status()["state"] == "healthy"

          manager.health_check(
              "final",
              lambda: __import__(
                  "observability"
              ).HealthResult(
                  component="final",
                  state=HealthState.HEALTHY,
                  latency_ms=0,
                  message="ok",
              ),
          )

          assert manager.run_health()[0].state == (
              HealthState.HEALTHY
          )

          snapshot = manager.snapshot()

          assert snapshot.snapshot_id

          manager.stop()

          print(
              "FINAL VERIFICATION: PASS"
          )
          PY

      - name: Show result
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ZYRA OBSERVABILITY"
          echo " PRODUCTION BUILD: PASS"
          echo "=========================================="

          git status --short
          git diff --stat

      - name: Commit Observability
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ZYRA Production Bot"
          git config user.email "actions@github.com"

          # IMPORTANTE:
          # Solo se agrega Observability.
          # NO se agrega el Workflow por su nombre/path.
          git add -A -- observability/

          if git diff --cached --quiet; then
            echo "No Observability changes to commit."
            exit 0
          fi

          git commit \
            -m "feat(observability): production observability layer"

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD
