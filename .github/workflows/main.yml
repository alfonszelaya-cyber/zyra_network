          from __future__ import annotations

          from dataclasses import dataclass
          from decimal import Decimal

          from .contracts import AIRequest, ModelDescriptor


          @dataclass(frozen=True, slots=True)
          class ExecutionPolicy:
              max_attempts: int = 3
              retry_base_seconds: float = 0.25
              retry_max_seconds: float = 8.0
              lease_seconds: int = 300
              stale_request_seconds: int = 900
              maximum_cost_per_request: Decimal | None = None
              concurrent_wait_seconds: float = 30.0

              def __post_init__(self) -> None:
                  if not 1 <= self.max_attempts <= 10:
                      raise ValueError(
                          "max_attempts must be between 1 and 10"
                      )

                  if self.retry_base_seconds < 0:
                      raise ValueError(
                          "retry_base_seconds cannot be negative"
                      )

                  if (
                      self.retry_max_seconds
                      < self.retry_base_seconds
                  ):
                      raise ValueError(
                          "Invalid retry delay range"
                      )

                  if not 10 <= self.lease_seconds <= 3600:
                      raise ValueError(
                          "Invalid lease_seconds"
                      )

                  if (
                      self.stale_request_seconds
                      < self.lease_seconds
                  ):
                      raise ValueError(
                          "stale_request_seconds must cover lease"
                      )

                  if self.concurrent_wait_seconds < 0:
                      raise ValueError(
                          "concurrent_wait_seconds cannot be negative"
                      )

                  if (
                      self.maximum_cost_per_request is not None
                      and self.maximum_cost_per_request < 0
                  ):
                      raise ValueError(
                          "maximum_cost_per_request cannot be negative"
                      )

              def validate(
                  self,
                  request: AIRequest,
                  model: ModelDescriptor,
              ) -> None:
                  if (
                      request.max_output_tokens
                      > model.max_output_tokens
                  ):
                      raise ValueError(
                          "Requested output exceeds model capability"
                      )
