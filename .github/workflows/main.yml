              labels: dict[str, str]
              count: int
              minimum: float
              maximum: float
              average: float
              quantiles: dict[float, float]


          class Histogram:
              def __init__(
                  self,
                  name,
                  labels=None,
                  *,
                  max_observations=100_000,
              ):
                  self.name = name
                  self.labels = normalize_labels(
                      labels
                  )
                  self.max_observations = (
                      max_observations
                  )
                  self._values = []
                  self._lock = threading.RLock()

              def observe(self, value):
                  value = float(value)

                  if not (
                      value == value
                      and abs(value) < float("inf")
                  ):
                      raise ValidationError(
                          "histogram value must be finite"
                      )

                  with self._lock:
                      if (
                          len(self._values)
                          >= self.max_observations
                      ):
                          self._values.pop(0)

                      self._values.append(value)

              def snapshot(self):
                  with self._lock:
                      values = list(
                          self._values
                      )

                  if not values:
                      return HistogramSnapshot(
                          self.name,
                          dict(self.labels),
                          0,
                          0.0,
                          0.0,
                          0.0,
                          {},
                      )

                  return HistogramSnapshot(
                      self.name,
                      dict(self.labels),
                      len(values),
                      min(values),
                      max(values),
                      sum(values)
                      / len(values),
                      quantiles(
                          values,
                          (
