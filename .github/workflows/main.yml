          cat > shared_engines/ai/README.md <<'MD'
          # Zyra AI Engine

          Production-oriented shared AI engine.

          Design objectives:

          - versioned contracts;
          - deterministic request hashing;
          - durable SQLite journal;
          - WAL + FULL synchronous persistence;
          - transactional outbox;
          - inbox deduplication;
          - lease/fencing tokens;
          - crash/recovery states;
          - authenticated encryption;
          - versioned encryption keys;
          - online backup;
          - database integrity verification;
          - audit hash chain;
          - audit checkpoints;
          - migration checksums;
          - provider/model registry;
          - HTTPS-only provider transport;
          - provider idempotency keys;
          - bounded concurrency;
          - circuit breaking;
          - bounded retries;
          - cost budgets;
          - observability interfaces;
          - deterministic serialization.

          Distributed HA is intentionally not faked inside this package.
          A future distributed persistence adapter can implement the same
          durability contracts using an external transactional datastore,
          while the engine contract remains stable.

          External provider calls must use a stable provider-side idempotency
          key. A process crash after transmission but before receiving the
          response is therefore treated as an uncertain operation and is not
          silently retried by this engine without reconciliation.

          Secrets must be supplied by deployment configuration or a secret
          manager. They are never embedded in source code.

          This package is designed for long-term evolution, not as a claim
          of guaranteed compatibility for any fixed number of years.
          MD

