          from __future__ import annotations

          import threading
          import time
          from dataclasses import dataclass, field
          from enum import Enum
          from typing import Callable


          class HealthState(str, Enum):
              HEALTHY = "healthy"
              DEGRADED = "degraded"
              UNHEALTHY = "unhealthy"
              UNKNOWN = "unknown"


          @dataclass(frozen=True, slots=True)
          class HealthResult:
              component: str
              state: HealthState
              message: str = ""
              latency_seconds: float | None = None
              details: dict[str, object] = field(default_factory=dict)
              checked_at: float = field(default_factory=time.time)


          HealthCheck = Callable[[], HealthResult]


          class HealthRegistry:
              def __init__(self):
                  self._checks: dict[str, HealthCheck] = {}
                  self._lock = threading.RLock()

              def register(
                  self,
                  name: str,
                  check: HealthCheck,
                  *,
                  replace: bool = False,
              ) -> None:
                  if not name.strip():
                      raise ValueError("Health check name is required")

                  with self._lock:
                      if name in self._checks and not replace:
                          raise ValueError(
                              f"Health check already registered: {name}"
                          )
                      self._checks[name] = check

              def unregister(self, name: str) -> None:
                  with self._lock:
                      self._checks.pop(name, None)

              def check(self, name: str) -> HealthResult:
                  with self._lock:
                      check = self._checks.get(name)

                  if check is None:
                      return HealthResult(
                          component=name,
                          state=HealthState.UNKNOWN,
                          message="Health check not registered",
                      )

                  started = time.perf_counter()

                  try:
                      result = check()
                  except Exception as exc:
                      return HealthResult(
                          component=name,
                          state=HealthState.UNHEALTHY,
                          message=str(exc),
                          latency_seconds=time.perf_counter() - started,
                      )

                  if result.latency_seconds is None:
                      return HealthResult(
                          component=result.component,
                          state=result.state,
                          message=result.message,
                          latency_seconds=time.perf_counter() - started,
                          details=dict(result.details),
                      )

                  return result

              def check_all(self) -> list[HealthResult]:
                  with self._lock:
                      names = list(self._checks)

                  return [self.check(name) for name in names]

              def overall(self) -> HealthState:
                  results = self.check_all()

                  if not results:
                      return HealthState.UNKNOWN

                  states = {result.state for result in results}

                  if HealthState.UNHEALTHY in states:
                      return HealthState.UNHEALTHY

                  if HealthState.DEGRADED in states:
                      return HealthState.DEGRADED

                  if states == {HealthState.HEALTHY}:
                      return HealthState.HEALTHY

                  return HealthState.UNKNOWN
          PY

