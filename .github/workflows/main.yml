          from __future__ import annotations

          import time
          from typing import Protocol


          class Clock(Protocol):
              def now(self) -> int:
                  ...


          class SystemClock:
              def now(self) -> int:
                  current = int(time.time())

                  if current <= 0:
                      raise RuntimeError("Invalid system clock")

                  return current
