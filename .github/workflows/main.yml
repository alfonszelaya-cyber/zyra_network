      - name: Full infrastructure smoke test
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import tempfile
          from pathlib import Path

          from infrastructure.bootstrap import (
              InfrastructureBootstrap,
          )
          from infrastructure.config import (
              Configuration,
          )

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)

              configuration = (
                  Configuration.from_mapping(
                      {
                          "ZYRA_ENVIRONMENT": "testing",
                          "ZYRA_SERVICE_NAME": (
                              "zyra-network"
                          ),
                          "ZYRA_NODE_ID": (
                              "infra-node-01"
                          ),
                          "ZYRA_DATA_DIRECTORY": str(
                              root / "data"
                          ),
                          "ZYRA_DATABASE_PATH": str(
                              root
                              / "data"
                              / "zyra.db"
                          ),
                          "ZYRA_CACHE_CAPACITY": "256",
                          "ZYRA_CACHE_DEFAULT_TTL_SECONDS": "300",
                          "ZYRA_DATABASE_TIMEOUT_SECONDS": "15",
                          "ZYRA_DATABASE_WAL": "true",
                          "ZYRA_SHUTDOWN_TIMEOUT_SECONDS": "15",
                          "ZYRA_STRICT_CONFIGURATION": "true",
                      }
                  )
              )

              bootstrap = (
                  InfrastructureBootstrap(
                      configuration
                  )
              )

              context = bootstrap.initialize()

              context.database.create_schema(
                  [
                      """
                      CREATE TABLE infrastructure_health (
                          id INTEGER PRIMARY KEY,
                          status TEXT NOT NULL
                      )
                      """
                  ]
              )

              with context.database.transaction() as connection:
                  connection.execute(
                      """
                      INSERT INTO infrastructure_health (
                          status
                      )
                      VALUES (?)
                      """,
                      ("healthy",),
                  )

              rows = context.database.query(
                  """
                  SELECT status
                  FROM infrastructure_health
                  ORDER BY id
                  """
              )

              assert len(rows) == 1
              assert rows[0]["status"] == "healthy"

              context.cache.set(
                  "infrastructure:health",
                  "healthy",
              )

              assert (
                  context.cache.get(
                      "infrastructure:health"
                  )
                  == "healthy"
              )

              context.storage.write_bytes(
                  "health/status.txt",
                  b"healthy",
              )

              assert (
                  context.storage.read_bytes(
                      "health/status.txt"
                  )
                  == b"healthy"
              )

              context.runtime.start()

              assert context.runtime.running is True

              bootstrap.shutdown()

          print(
              "Infrastructure block 01 full smoke test: OK"
          )
          PY

