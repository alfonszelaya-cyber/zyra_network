name: Infrastructure - Block 02

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  infrastructure-block-02:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p infrastructure/messaging
          mkdir -p infrastructure/dns
          mkdir -p infrastructure/external_services

      - name: Messaging - complete production implementation
        shell: bash
        run: |
          set -euo pipefail

          cat > infrastructure/messaging/message_events.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from typing import Any, Mapping
          from uuid import UUID, uuid4


          @dataclass(frozen=True, slots=True)
          class MessageEvent:
              topic: str
              payload: Mapping[str, Any]
              event_id: UUID = field(default_factory=uuid4)
              occurred_at: datetime = field(
                  default_factory=lambda: datetime.now(timezone.utc)
              )
              correlation_id: UUID | None = None

              def __post_init__(self) -> None:
                  topic = self.topic.strip()

                  if not topic:
                      raise ValueError(
                          "Message event topic cannot be empty"
                      )

                  if self.occurred_at.tzinfo is None:
                      raise ValueError(
                          "Message event timestamp must be timezone-aware"
                      )

                  object.__setattr__(self, "topic", topic)
                  object.__setattr__(
                      self,
                      "payload",
                      dict(self.payload),
                  )

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "event_id": str(self.event_id),
                      "topic": self.topic,
                      "payload": dict(self.payload),
                      "occurred_at": self.occurred_at.astimezone(
                          timezone.utc
                      ).isoformat(),
                      "correlation_id": (
                          str(self.correlation_id)
                          if self.correlation_id
                          else None
                      ),
                  }


          __all__ = ["MessageEvent"]
          PY

          cat > infrastructure/messaging/message_validator.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Any, Mapping


          @dataclass(frozen=True, slots=True)
          class MessageValidationResult:
              valid: bool
              errors: tuple[str, ...] = ()

              @classmethod
              def ok(cls) -> "MessageValidationResult":
                  return cls(True, ())

              @classmethod
              def invalid(
                  cls,
                  *errors: str,
              ) -> "MessageValidationResult":
                  return cls(False, tuple(errors))


          class MessageValidator:
              MAX_TOPIC_LENGTH = 512
              MAX_PAYLOAD_KEYS = 10000

              def validate(
                  self,
                  topic: str,
                  payload: Mapping[str, Any],
              ) -> MessageValidationResult:

                  errors: list[str] = []

                  if not isinstance(topic, str):
                      errors.append(
                          "topic must be a string"
                      )
                  else:
                      normalized = topic.strip()

                      if not normalized:
                          errors.append(
                              "topic cannot be empty"
                          )

                      if len(normalized) > self.MAX_TOPIC_LENGTH:
                          errors.append(
                              "topic exceeds maximum length"
                          )

                  if not isinstance(payload, Mapping):
                      errors.append(
                          "payload must be a mapping"
                      )
                  elif len(payload) > self.MAX_PAYLOAD_KEYS:
                      errors.append(
                          "payload contains too many keys"
                      )

                  if errors:
                      return MessageValidationResult.invalid(
                          *errors
                      )

                  return MessageValidationResult.ok()

              def require_valid(
                  self,
                  topic: str,
                  payload: Mapping[str, Any],
              ) -> None:

                  result = self.validate(
                      topic,
                      payload,
                  )

                  if not result.valid:
                      raise ValueError(
                          "; ".join(result.errors)
                      )


          __all__ = [
              "MessageValidationResult",
              "MessageValidator",
          ]
          PY

          cat > infrastructure/messaging/message_registry.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock
          from typing import Any, Callable


          MessageHandler = Callable[[Any], Any]


          @dataclass(frozen=True, slots=True)
          class MessageHandlerRecord:
              name: str
              handler: MessageHandler
              enabled: bool = True


          class MessageRegistry:
              def __init__(self) -> None:
                  self._handlers: dict[
                      str,
                      MessageHandlerRecord,
                  ] = {}
                  self._lock = RLock()

              def register(
                  self,
                  name: str,
                  handler: MessageHandler,
                  *,
                  replace: bool = False,
              ) -> None:

                  name = name.strip()

                  if not name:
                      raise ValueError(
                          "Handler name cannot be empty"
                      )

                  if not callable(handler):
                      raise TypeError(
                          "Message handler must be callable"
                      )

                  with self._lock:
                      if name in self._handlers and not replace:
                          raise ValueError(
                              f"Message handler already registered: {name}"
                          )

                      self._handlers[name] = MessageHandlerRecord(
                          name=name,
                          handler=handler,
                      )

              def unregister(self, name: str) -> bool:
                  with self._lock:
                      return (
                          self._handlers.pop(
                              name.strip(),
                              None,
                          )
                          is not None
                      )

              def resolve(
                  self,
                  name: str,
              ) -> MessageHandlerRecord:

                  with self._lock:
                      try:
                          return self._handlers[name.strip()]
                      except KeyError as exc:
                          raise LookupError(
                              f"Message handler not found: {name}"
                          ) from exc

              def names(self) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(sorted(self._handlers))


          __all__ = [
              "MessageHandler",
              "MessageHandlerRecord",
              "MessageRegistry",
          ]
          PY

          cat > infrastructure/messaging/subscription_manager.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock
          from uuid import UUID, uuid4
          from typing import Callable


          SubscriptionHandler = Callable[[object], object]


          @dataclass(frozen=True, slots=True)
          class Subscription:
              subscription_id: UUID
              topic: str
              handler: SubscriptionHandler
              active: bool = True


          class SubscriptionManager:
              def __init__(self) -> None:
                  self._subscriptions: dict[
                      UUID,
                      Subscription,
                  ] = {}
                  self._lock = RLock()

              def subscribe(
                  self,
                  topic: str,
                  handler: SubscriptionHandler,
              ) -> UUID:

                  topic = topic.strip()

                  if not topic:
                      raise ValueError(
                          "Subscription topic cannot be empty"
                      )

                  if not callable(handler):
                      raise TypeError(
                          "Subscription handler must be callable"
                      )

                  subscription = Subscription(
                      subscription_id=uuid4(),
                      topic=topic,
                      handler=handler,
                  )

                  with self._lock:
                      self._subscriptions[
                          subscription.subscription_id
                      ] = subscription

                  return subscription.subscription_id

              def unsubscribe(
                  self,
                  subscription_id: UUID,
              ) -> bool:

                  with self._lock:
                      return (
                          self._subscriptions.pop(
                              subscription_id,
                              None,
                          )
                          is not None
                      )

              def handlers(
                  self,
                  topic: str,
              ) -> tuple[Subscription, ...]:

                  normalized = topic.strip()

                  with self._lock:
                      return tuple(
                          subscription
                          for subscription
                          in self._subscriptions.values()
                          if subscription.active
                          and (
                              subscription.topic
                              == normalized
                          )
                      )

              def count(self) -> int:
                  with self._lock:
                      return len(self._subscriptions)


          __all__ = [
              "Subscription",
              "SubscriptionManager",
          ]
          PY

          cat > infrastructure/messaging/topic_manager.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock


          @dataclass(frozen=True, slots=True)
          class Topic:
              name: str
              durable: bool = True
              partitions: int = 1

              def __post_init__(self) -> None:
                  name = self.name.strip()

                  if not name:
                      raise ValueError(
                          "Topic name cannot be empty"
                      )

                  if self.partitions <= 0:
                      raise ValueError(
                          "Topic partitions must be positive"
                      )

                  object.__setattr__(
                      self,
                      "name",
                      name,
                  )


          class TopicManager:
              def __init__(self) -> None:
                  self._topics: dict[str, Topic] = {}
                  self._lock = RLock()

              def create(
                  self,
                  name: str,
                  *,
                  durable: bool = True,
                  partitions: int = 1,
              ) -> Topic:

                  topic = Topic(
                      name=name,
                      durable=durable,
                      partitions=partitions,
                  )

                  with self._lock:
                      if topic.name in self._topics:
                          raise ValueError(
                              f"Topic already exists: {topic.name}"
                          )

                      self._topics[topic.name] = topic

                  return topic

              def get(self, name: str) -> Topic:
                  with self._lock:
                      try:
                          return self._topics[name.strip()]
                      except KeyError as exc:
                          raise LookupError(
                              f"Topic not found: {name}"
                          ) from exc

              def delete(self, name: str) -> bool:
                  with self._lock:
                      return (
                          self._topics.pop(
                              name.strip(),
                              None,
                          )
                          is not None
                      )

              def list(self) -> tuple[Topic, ...]:
                  with self._lock:
                      return tuple(
                          self._topics[name]
                          for name in sorted(self._topics)
                      )


          __all__ = ["Topic", "TopicManager"]
          PY

          cat > infrastructure/messaging/message_queue.py <<'PY'
          from __future__ import annotations

          from collections import deque
          from threading import Condition, RLock
          from typing import Generic, TypeVar


          T = TypeVar("T")


          class MessageQueue(Generic[T]):
              def __init__(
                  self,
                  max_size: int = 10000,
              ) -> None:

                  if max_size <= 0:
                      raise ValueError(
                          "max_size must be positive"
                      )

                  self._queue: deque[T] = deque()
                  self._max_size = max_size
                  self._lock = RLock()
                  self._condition = Condition(
                      self._lock
                  )
                  self._closed = False

              def put(
                  self,
                  item: T,
                  *,
                  block: bool = True,
                  timeout: float | None = None,
              ) -> None:

                  with self._condition:
                      if self._closed:
                          raise RuntimeError(
                              "Message queue is closed"
                          )

                      if not block:
                          if len(self._queue) >= self._max_size:
                              raise OverflowError(
                                  "Message queue is full"
                              )
                      else:
                          if not self._condition.wait_for(
                              lambda: (
                                  len(self._queue)
                                  < self._max_size
                                  or self._closed
                              ),
                              timeout=timeout,
                          ):
                              raise TimeoutError(
                                  "Timed out waiting for queue capacity"
                              )

                          if self._closed:
                              raise RuntimeError(
                                  "Message queue is closed"
                              )

                      self._queue.append(item)
                      self._condition.notify_all()

              def get(
                  self,
                  *,
                  block: bool = True,
                  timeout: float | None = None,
              ) -> T:

                  with self._condition:
                      if not block:
                          if not self._queue:
                              raise LookupError(
                                  "Message queue is empty"
                              )
                      else:
                          if not self._condition.wait_for(
                              lambda: (
                                  bool(self._queue)
                                  or self._closed
                              ),
                              timeout=timeout,
                          ):
                              raise TimeoutError(
                                  "Timed out waiting for message"
                              )

                          if not self._queue:
                              raise LookupError(
                                  "Message queue is empty"
                              )

                      item = self._queue.popleft()
                      self._condition.notify_all()
                      return item

              def size(self) -> int:
                  with self._lock:
                      return len(self._queue)

              def clear(self) -> int:
                  with self._condition:
                      count = len(self._queue)
                      self._queue.clear()
                      self._condition.notify_all()
                      return count

              def close(self) -> None:
                  with self._condition:
                      self._closed = True
                      self._condition.notify_all()

              @property
              def closed(self) -> bool:
                  with self._lock:
                      return self._closed


          __all__ = ["MessageQueue"]
          PY

          cat > infrastructure/messaging/retry_manager.py <<'PY'
          from __future__ import annotations

          import time
          from dataclasses import dataclass


          @dataclass(frozen=True, slots=True)
          class RetryPolicy:
              max_attempts: int = 3
              initial_delay_seconds: float = 0.25
              multiplier: float = 2.0
              max_delay_seconds: float = 30.0

              def __post_init__(self) -> None:
                  if self.max_attempts <= 0:
                      raise ValueError(
                          "max_attempts must be positive"
                      )

                  if self.initial_delay_seconds < 0:
                      raise ValueError(
                          "initial_delay_seconds cannot be negative"
                      )

                  if self.multiplier < 1:
                      raise ValueError(
                          "multiplier must be at least 1"
                      )

                  if self.max_delay_seconds < 0:
                      raise ValueError(
                          "max_delay_seconds cannot be negative"
                      )


          class RetryManager:
              def __init__(
                  self,
                  policy: RetryPolicy | None = None,
              ) -> None:
                  self.policy = policy or RetryPolicy()

              def delay_for(
                  self,
                  attempt: int,
              ) -> float:

                  if attempt < 1:
                      raise ValueError(
                          "attempt must be positive"
                      )

                  delay = (
                      self.policy.initial_delay_seconds
                      * (
                          self.policy.multiplier
                          ** (attempt - 1)
                      )
                  )

                  return min(
                      delay,
                      self.policy.max_delay_seconds,
                  )

              def execute(
                  self,
                  operation,
              ):
                  last_error: BaseException | None = None

                  for attempt in range(
                      1,
                      self.policy.max_attempts + 1,
                  ):
                      try:
                          return operation()
                      except BaseException as exc:
                          last_error = exc

                          if (
                              attempt
                              >= self.policy.max_attempts
                          ):
                              break

                          delay = self.delay_for(
                              attempt
                          )

                          if delay > 0:
                              time.sleep(delay)

                  assert last_error is not None
                  raise last_error


          __all__ = [
              "RetryPolicy",
              "RetryManager",
          ]
          PY

          cat > infrastructure/messaging/message_router.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock
          from typing import Callable


          RouteHandler = Callable[[object], object]


          @dataclass(frozen=True, slots=True)
          class MessageRoute:
              topic: str
              handler: RouteHandler


          class MessageRouter:
              def __init__(self) -> None:
                  self._routes: dict[
                      str,
                      list[RouteHandler],
                  ] = {}
                  self._lock = RLock()

              def add_route(
                  self,
                  topic: str,
                  handler: RouteHandler,
              ) -> None:

                  topic = topic.strip()

                  if not topic:
                      raise ValueError(
                          "Message route topic cannot be empty"
                      )

                  if not callable(handler):
                      raise TypeError(
                          "Message route handler must be callable"
                      )

                  with self._lock:
                      self._routes.setdefault(
                          topic,
                          [],
                      ).append(handler)

              def remove_route(
                  self,
                  topic: str,
                  handler: RouteHandler,
              ) -> bool:

                  topic = topic.strip()

                  with self._lock:
                      handlers = self._routes.get(topic)

                      if not handlers or handler not in handlers:
                          return False

                      handlers.remove(handler)

                      if not handlers:
                          self._routes.pop(topic)

                      return True

              def dispatch(
                  self,
                  topic: str,
                  message: object,
              ) -> list[object]:

                  with self._lock:
                      handlers = tuple(
                          self._routes.get(
                              topic.strip(),
                              (),
                          )
                      )

                  return [
                      handler(message)
                      for handler in handlers
                  ]

              def topics(self) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(
                          sorted(self._routes)
                      )


          __all__ = [
              "MessageRoute",
              "MessageRouter",
          ]
          PY

          cat > infrastructure/messaging/message_dispatcher.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Any, Mapping

          from .message_events import MessageEvent
          from .message_router import MessageRouter
          from .message_validator import MessageValidator


          @dataclass(frozen=True, slots=True)
          class DispatchResult:
              topic: str
              handler_results: tuple[Any, ...]


          class MessageDispatcher:
              def __init__(
                  self,
                  router: MessageRouter,
                  validator: MessageValidator | None = None,
              ) -> None:

                  self.router = router
                  self.validator = (
                      validator
                      or MessageValidator()
                  )

              def dispatch(
                  self,
                  topic: str,
                  payload: Mapping[str, Any],
              ) -> DispatchResult:

                  self.validator.require_valid(
                      topic,
                      payload,
                  )

                  event = MessageEvent(
                      topic=topic,
                      payload=payload,
                  )

                  results = self.router.dispatch(
                      event.topic,
                      event,
                  )

                  return DispatchResult(
                      topic=event.topic,
                      handler_results=tuple(results),
                  )


          __all__ = [
              "DispatchResult",
              "MessageDispatcher",
          ]
          PY

          cat > infrastructure/messaging/message_bus.py <<'PY'
          from __future__ import annotations

          from typing import Any, Mapping

          from .message_dispatcher import (
              MessageDispatcher,
          )
          from .message_router import MessageRouter
          from .message_validator import MessageValidator


          class MessageBus:
              """
              Synchronous infrastructure message bus.

              The bus intentionally has no transport-specific behavior.
              Transport adapters can feed validated messages into this
              boundary without coupling application code to a broker.
              """

              def __init__(
                  self,
                  router: MessageRouter | None = None,
                  validator: MessageValidator | None = None,
              ) -> None:

                  self.router = router or MessageRouter()

                  self.dispatcher = MessageDispatcher(
                      self.router,
                      validator,
                  )

              def subscribe(
                  self,
                  topic: str,
                  handler,
              ) -> None:

                  self.router.add_route(
                      topic,
                      handler,
                  )

              def unsubscribe(
                  self,
                  topic: str,
                  handler,
              ) -> bool:

                  return self.router.remove_route(
                      topic,
                      handler,
                  )

              def publish(
                  self,
                  topic: str,
                  payload: Mapping[str, Any],
              ):
                  return self.dispatcher.dispatch(
                      topic,
                      payload,
                  )


          __all__ = ["MessageBus"]
          PY

