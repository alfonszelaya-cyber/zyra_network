          cat > shared_engines/ai/http_provider.py <<'PY'
          from __future__ import annotations

          import json
          import time
          import urllib.error
          import urllib.request
          import uuid
          from decimal import Decimal
          from types import MappingProxyType

          from .contracts import AIRequest, AIResponse, AIUsage, ModelDescriptor
          from .errors import (
              AIProviderPermanentError,
              AIProviderProtocolError,
              AIProviderTransientError,
          )
          from .providers import AIProvider


          class OpenAICompatibleProvider(AIProvider):
              """
              Provider adapter for OpenAI-compatible chat-completion APIs.

              Endpoint and credentials are deployment configuration.

              Required environment-independent inputs:
              - HTTPS endpoint
              - provider name
              - model descriptors
              - API key

              The request idempotency key is transmitted to the provider.
              """

              def __init__(
                  self,
                  *,
                  name: str,
                  endpoint: str,
                  api_key: str,
                  models: tuple[ModelDescriptor, ...],
                  timeout_seconds: float = 120.0,
              ) -> None:
                  if not name.strip():
                      raise ValueError("Provider name is required")

                  if not endpoint.startswith("https://"):
                      raise ValueError("AI provider endpoint must use HTTPS")

                  if not api_key.strip():
                      raise ValueError("API key is required")

                  if not 0 < timeout_seconds <= 1800:
                      raise ValueError("Invalid provider timeout")

                  if not models:
                      raise ValueError("At least one model is required")

                  if any(
                      descriptor.provider != name
                      for descriptor in models
                  ):
                      raise ValueError(
                          "Every model must belong to this provider"
                      )

                  self._name = name.strip()
                  self._endpoint = endpoint
                  self._api_key = api_key
                  self._models = models
                  self._timeout = timeout_seconds

              @property
              def name(self) -> str:
                  return self._name

              def models(self) -> tuple[ModelDescriptor, ...]:
                  return self._models

              def health(self) -> bool:
                  return bool(self._api_key)

              def complete(
                  self,
                  request: AIRequest,
                  model: ModelDescriptor,
              ) -> AIResponse:
                  if not any(
                      descriptor.model_id == model.model_id
                      for descriptor in self._models
                  ):
                      raise AIProviderPermanentError(
                          f"Provider does not expose {model.model_id}"
                      )

                  messages: list[dict[str, str]] = []

                  if request.system_prompt is not None:
                      messages.append(
                          {
                              "role": "system",
                              "content": request.system_prompt,
                          }
                      )

                  messages.append(
                      {
                          "role": "user",
                          "content": request.prompt,
                      }
                  )

                  payload = {
                      "model": model.model_id,
                      "messages": messages,
                      "max_tokens": request.max_output_tokens,
                      "temperature": float(request.temperature),
                  }

                  encoded = json.dumps(
                      payload,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  ).encode("utf-8")

                  http_request = urllib.request.Request(
                      self._endpoint,
                      data=encoded,
                      method="POST",
                      headers={
                          "Accept": "application/json",
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {self._api_key}",
                          "Idempotency-Key": request.idempotency_key,
                          "User-Agent": "ZYRA-Network-AI/1",
                      },
                  )

                  started = int(time.time())

                  try:
                      with urllib.request.urlopen(
                          http_request,
                          timeout=min(
                              self._timeout,
                              request.timeout_seconds,
                          ),
                      ) as response:
                          status = response.status
                          raw = response.read(8 * 1024 * 1024)

                  except urllib.error.HTTPError as exc:
                      if exc.code in {408, 425, 429, 500, 502, 503, 504}:
                          raise AIProviderTransientError(
                              f"{self._name} returned HTTP {exc.code}"
                          ) from exc

                      raise AIProviderPermanentError(
                          f"{self._name} returned HTTP {exc.code}"
                      ) from exc

                  except urllib.error.URLError as exc:
                      raise AIProviderTransientError(
                          f"{self._name} network failure: {exc}"
                      ) from exc

                  if status != 200:
                      raise AIProviderPermanentError(
                          f"{self._name} returned HTTP {status}"
                      )

                  try:
                      data = json.loads(raw.decode("utf-8"))
                  except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                      raise AIProviderProtocolError(
                          f"{self._name} returned invalid JSON"
                      ) from exc

                  if not isinstance(data, dict):
                      raise AIProviderProtocolError(
                          "Provider response must be a JSON object"
                      )

                  try:
                      choices = data["choices"]
                      first = choices[0]
                      message = first["message"]
                      output = str(message["content"])
                  except (KeyError, IndexError, TypeError) as exc:
                      raise AIProviderProtocolError(
                          "Provider response has no valid message"
                      ) from exc

                  usage_data = data.get("usage", {})

                  if not isinstance(usage_data, dict):
                      raise AIProviderProtocolError(
                          "Provider usage must be an object"
                      )

                  input_tokens = int(
                      usage_data.get("prompt_tokens", 0)
                  )
                  output_tokens = int(
                      usage_data.get("completion_tokens", 0)
                  )
                  total_tokens = int(
                      usage_data.get(
                          "total_tokens",
                          input_tokens + output_tokens,
                      )
                  )

                  response_id = str(
                      data.get(
                          "id",
                          uuid.uuid4().hex,
                      )
                  )

                  completed = int(time.time())

                  return AIResponse(
                      schema_version=1,
                      request_id=request.request_id,
                      model_id=model.model_id,
                      provider=self._name,
                      output=output,
                      usage=AIUsage(
                          input_tokens=input_tokens,
                          output_tokens=output_tokens,
                          total_tokens=total_tokens,
                          estimated_cost=Decimal("0"),
                      ),
                      created_at=started,
                      completed_at=max(completed, started),
                      response_id=response_id,
                      metadata=MappingProxyType({}),
                  )
