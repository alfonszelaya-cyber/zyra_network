          from __future__ import annotations

          import queue
          import threading
          from dataclasses import dataclass
          from typing import Callable

          from observability.events import ObservationEvent


          class CollectorClosedError(RuntimeError):
              pass


          @dataclass(frozen=True, slots=True)
          class CollectorStats:
              accepted: int
              rejected: int
              processed: int
              queue_size: int


          class SignalCollector:
              def __init__(
                  self,
                  *,
                  capacity: int = 10000,
                  worker_count: int = 2,
              ):
                  if capacity <= 0:
                      raise ValueError("capacity must be positive")
                  if worker_count <= 0:
                      raise ValueError("worker_count must be positive")

                  self._queue: queue.Queue[ObservationEvent | None] = (
                      queue.Queue(maxsize=capacity)
                  )
                  self._workers: list[threading.Thread] = []
                  self._handler: Callable[[ObservationEvent], None] | None = None
                  self._lock = threading.RLock()
                  self._closed = False
                  self._accepted = 0
                  self._rejected = 0
                  self._processed = 0
                  self._worker_count = worker_count

              def start(
                  self,
                  handler: Callable[[ObservationEvent], None],
              ) -> None:
                  with self._lock:
                      if self._closed:
                          raise CollectorClosedError("Collector is closed")

                      if self._workers:
                          raise RuntimeError("Collector already started")

                      self._handler = handler

                      for index in range(self._worker_count):
                          worker = threading.Thread(
                              target=self._run,
                              name=f"zyra-observer-{index}",
                              daemon=True,
                          )
                          self._workers.append(worker)
                          worker.start()

              def submit(
                  self,
                  event: ObservationEvent,
                  *,
                  block: bool = False,
              ) -> bool:
                  with self._lock:
                      if self._closed:
                          raise CollectorClosedError("Collector is closed")

                  try:
                      self._queue.put(event, block=block, timeout=0.1 if block else 0)
                  except queue.Full:
                      with self._lock:
                          self._rejected += 1
                      return False

                  with self._lock:
                      self._accepted += 1

                  return True

              def _run(self) -> None:
                  while True:
                      event = self._queue.get()

                      try:
                          if event is None:
                              return

                          handler = self._handler
                          if handler is not None:
                              handler(event)

                          with self._lock:
                              self._processed += 1
                      finally:
                          self._queue.task_done()

              def stats(self) -> CollectorStats:
                  with self._lock:
                      return CollectorStats(
                          accepted=self._accepted,
                          rejected=self._rejected,
                          processed=self._processed,
                          queue_size=self._queue.qsize(),
                      )

              def close(self, timeout: float = 10.0) -> None:
                  with self._lock:
                      if self._closed:
                          return
                      self._closed = True

                  for _ in self._workers:
                      try:
                          self._queue.put(None, timeout=timeout)
                      except queue.Full:
                          break

                  for worker in self._workers:
                      worker.join(timeout=timeout)

                  self._workers.clear()
          PY

