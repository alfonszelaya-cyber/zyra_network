      - name: Implement shard layer
        shell: bash
        run: |
          set -euo pipefail

          cat > storage/shards/shard_allocator.py <<'PY'
          from __future__ import annotations

          import hashlib


          class ShardAllocator:
              def __init__(
                  self,
                  shard_count: int,
              ) -> None:

                  if shard_count <= 0:
                      raise ValueError(
                          "shard_count must be positive"
                      )

                  self.shard_count = shard_count

              def allocate(
                  self,
                  key: str,
              ) -> int:

                  normalized = key.strip()

                  if not normalized:
                      raise ValueError(
                          "Shard key cannot be empty"
                      )

                  digest = hashlib.sha256(
                      normalized.encode(
                          "utf-8"
                      )
                  ).digest()

                  value = int.from_bytes(
                      digest[:8],
                      "big",
                  )

                  return value % self.shard_count


          __all__ = ["ShardAllocator"]
          PY

          cat > storage/shards/shard_registry.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock


          @dataclass(frozen=True, slots=True)
          class Shard:
              shard_id: int
              name: str
              capacity_bytes: int
              active: bool = True

              def __post_init__(self) -> None:
                  if self.shard_id < 0:
                      raise ValueError(
                          "shard_id cannot be negative"
                      )

                  if not self.name.strip():
                      raise ValueError(
                          "Shard name cannot be empty"
                      )

                  if self.capacity_bytes <= 0:
                      raise ValueError(
                          "Shard capacity must be positive"
                      )


          class ShardRegistry:
              def __init__(self) -> None:
                  self._shards: dict[
                      int,
                      Shard,
                  ] = {}

                  self._lock = RLock()

              def register(
                  self,
                  shard: Shard,
                  *,
                  replace: bool = False,
              ) -> None:

                  with self._lock:
                      if (
                          shard.shard_id in self._shards
                          and not replace
                      ):
                          raise ValueError(
                              f"Shard already exists: "
                              f"{shard.shard_id}"
                          )

                      self._shards[
                          shard.shard_id
                      ] = shard

              def get(
                  self,
                  shard_id: int,
              ) -> Shard:

                  with self._lock:
                      try:
                          return self._shards[
                              shard_id
                          ]
                      except KeyError as exc:
                          raise LookupError(
                              f"Shard not found: {shard_id}"
                          ) from exc

              def list(
                  self,
              ) -> tuple[Shard, ...]:

                  with self._lock:
                      return tuple(
                          self._shards[key]
                          for key in sorted(
                              self._shards
                          )
                      )


          __all__ = [
              "Shard",
              "ShardRegistry",
          ]
          PY

          cat > storage/shards/shard_engine.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock
          from typing import Any


          @dataclass(frozen=True, slots=True)
          class ShardValue:
              key: str
              value: Any
              version: int


          class ShardEngine:
              def __init__(self) -> None:
                  self._data: dict[
                      int,
                      dict[str, ShardValue],
                  ] = {}

                  self._lock = RLock()

              def put(
                  self,
                  shard_id: int,
                  key: str,
                  value: Any,
              ) -> ShardValue:

                  normalized = key.strip()

                  if not normalized:
                      raise ValueError(
                          "Shard key cannot be empty"
                      )

                  with self._lock:
                      shard = self._data.setdefault(
                          shard_id,
                          {},
                      )

                      previous = shard.get(
                          normalized
                      )

                      version = (
                          previous.version + 1
                          if previous
                          else 1
                      )

                      stored = ShardValue(
                          key=normalized,
                          value=value,
                          version=version,
                      )

                      shard[
                          normalized
                      ] = stored

                      return stored

              def get(
                  self,
                  shard_id: int,
                  key: str,
              ) -> ShardValue:

                  with self._lock:
                      try:
                          return self._data[
                              shard_id
                          ][key.strip()]
                      except KeyError as exc:
                          raise LookupError(
                              f"Shard value not found: "
                              f"{shard_id}/{key}"
                          ) from exc

              def delete(
                  self,
                  shard_id: int,
                  key: str,
              ) -> bool:

                  with self._lock:
                      shard = self._data.get(
                          shard_id
                      )

                      if not shard:
                          return False

                      return (
                          shard.pop(
                              key.strip(),
                              None,
                          )
                          is not None
                      )

              def keys(
                  self,
                  shard_id: int,
              ) -> tuple[str, ...]:

                  with self._lock:
                      return tuple(
                          sorted(
                              self._data.get(
                                  shard_id,
                                  {},
                              )
                          )
                      )


          __all__ = [
              "ShardEngine",
              "ShardValue",
          ]
          PY

          cat > storage/shards/shard_rebalance.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass


          @dataclass(frozen=True, slots=True)
          class RebalancePlan:
              source_shard: int
              target_shard: int
              keys: tuple[str, ...]


          class ShardRebalancer:
              def plan(
                  self,
                  source_shard: int,
                  target_shard: int,
                  keys: tuple[str, ...],
              ) -> RebalancePlan:

                  if (
                      source_shard
                      == target_shard
                  ):
                      raise ValueError(
                          "Source and target shards must differ"
                      )

                  return RebalancePlan(
                      source_shard=source_shard,
                      target_shard=target_shard,
                      keys=tuple(
                          sorted(set(keys))
                      ),
                  )


          __all__ = [
              "RebalancePlan",
              "ShardRebalancer",
          ]
          PY

          cat > storage/shards/shard_events.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from uuid import UUID, uuid4


          @dataclass(frozen=True, slots=True)
          class ShardEvent:
              event_type: str
              shard_id: int
              key: str | None = None
              event_id: UUID = field(
                  default_factory=uuid4
              )
              occurred_at: datetime = field(
                  default_factory=lambda:
                  datetime.now(timezone.utc)
              )

              def __post_init__(self) -> None:
                  if not self.event_type.strip():
                      raise ValueError(
                          "Shard event type cannot be empty"
                      )

                  if self.shard_id < 0:
                      raise ValueError(
                          "shard_id cannot be negative"
                      )


          __all__ = ["ShardEvent"]
          PY

          cat > storage/shards/shard_metrics.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock


          @dataclass(frozen=True, slots=True)
          class ShardMetricsSnapshot:
              writes: int
              reads: int
              deletes: int
              rebalances: int


          class ShardMetrics:
              def __init__(self) -> None:
                  self._writes = 0
                  self._reads = 0
                  self._deletes = 0
                  self._rebalances = 0

                  self._lock = RLock()

              def record_write(self) -> None:
                  with self._lock:
                      self._writes += 1

              def record_read(self) -> None:
                  with self._lock:
                      self._reads += 1

              def record_delete(self) -> None:
                  with self._lock:
                      self._deletes += 1

              def record_rebalance(self) -> None:
                  with self._lock:
                      self._rebalances += 1

              def snapshot(
                  self,
              ) -> ShardMetricsSnapshot:

                  with self._lock:
                      return ShardMetricsSnapshot(
                          writes=self._writes,
                          reads=self._reads,
                          deletes=self._deletes,
                          rebalances=self._rebalances,
                      )


          __all__ = [
              "ShardMetrics",
              "ShardMetricsSnapshot",
          ]
          PY

          cat > storage/shards/shard_health.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime, timezone


          @dataclass(frozen=True, slots=True)
          class ShardHealth:
              healthy: bool
              registered_shards: int
              checked_at: datetime


          class ShardHealthMonitor:
              def check(
                  self,
                  registered_shards: int,
              ) -> ShardHealth:

                  if registered_shards < 0:
                      raise ValueError(
                          "registered_shards cannot be negative"
                      )

                  return ShardHealth(
                      healthy=(
                          registered_shards > 0
                      ),
                      registered_shards=(
                          registered_shards
                      ),
                      checked_at=datetime.now(
                          timezone.utc
                      ),
                  )


          __all__ = [
              "ShardHealth",
              "ShardHealthMonitor",
          ]
          PY

