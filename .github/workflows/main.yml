          from __future__ import annotations

          import threading
          from collections import defaultdict

          from ..core import (
              MetricKind,
              MetricRegistry,
              MetricSample,
              ObservationEvent,
              quantiles,
          )


          class AggregationEngine:
              """
              Deterministic in-process aggregation.

              The engine deliberately has no network dependency. External
              exporters consume immutable snapshots produced by this layer.
              """

              def __init__(
                  self,
                  registry: MetricRegistry | None = None,
              ):
                  self.registry = (
                      registry or MetricRegistry()
                  )
                  self._lock = threading.RLock()
                  self._event_count = 0
                  self._error_count = 0
                  self._latencies = defaultdict(list)

              def process(
                  self,
                  event: ObservationEvent,
              ) -> None:
                  with self._lock:
                      self._event_count += 1

                      if event.severity in {
                          "error",
                          "critical",
                      }:
                          self._error_count += 1

                      duration = event.payload.get(
                          "duration_ms"
                      )

                      if duration is not None:
                          value = float(duration)
                          self._latencies[
                              event.event_type
                          ].append(value)

                          self.registry.record(
                              MetricSample(
                                  name=(
                                      "observability."
                                      "event.duration_ms"
                                  ),
                                  kind=(
                                      MetricKind.HISTOGRAM
                                  ),
                                  value=value,
                                  timestamp_ns=(
                                      event.timestamp_ns
                                  ),
                                  labels={
                                      "event_type":
                                      event.event_type
                                  },
                              )
                          )

              def snapshot(self):
                  with self._lock:
                      return {
                          "events_processed":
                              self._event_count,
                          "errors_processed":
                              self._error_count,
                          "metrics": [
                              sample.to_dict()
                              for sample
                              in self.registry.snapshot()
                          ],
                          "latency_quantiles": {
                              event_type: quantiles(
                                  values,
                                  (0.50, 0.90, 0.95, 0.99),
                              )
                              for event_type, values
                              in self._latencies.items()
                          },
                      }


          __all__ = ["AggregationEngine"]
