          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Mapping

          from ..constants import CONTRACT_VERSION
          from ..errors import ContractError
          from ..models import AIRequest
          from .base import AIProvider


          @dataclass(frozen=True, slots=True)
          class ModelDescriptor:
              provider: str
              model: str
              contract_version: int
              active: bool = True


          class ProviderRegistry:
              def __init__(self) -> None:
                  self._providers: dict[str, AIProvider] = {}
                  self._models: dict[tuple[str, str], ModelDescriptor] = {}

              def register_provider(self, provider: AIProvider) -> None:
                  if provider.name in self._providers:
                      raise ContractError(
                          f"provider already registered: {provider.name}"
                      )
                  self._providers[provider.name] = provider

              def register_model(self, descriptor: ModelDescriptor) -> None:
                  if descriptor.contract_version != CONTRACT_VERSION:
                      raise ContractError("model contract version mismatch")

                  key = (descriptor.provider, descriptor.model)
                  if key in self._models:
                      raise ContractError(
                          f"model already registered: {descriptor.provider}/{descriptor.model}"
                      )

                  self._models[key] = descriptor

              def resolve(self, request: AIRequest) -> AIProvider:
                  provider = self._providers.get(request.provider)
                  if provider is None:
                      raise ContractError(
                          f"provider not registered: {request.provider}"
                      )

                  model = self._models.get((request.provider, request.model))
                  if model is None or not model.active:
                      raise ContractError(
                          f"model not active: {request.provider}/{request.model}"
                      )

                  if model.contract_version != request.contract_version:
                      raise ContractError("request/model contract mismatch")

                  return provider

              def descriptors(self) -> Mapping[tuple[str, str], ModelDescriptor]:
                  return dict(self._models)
          PY

