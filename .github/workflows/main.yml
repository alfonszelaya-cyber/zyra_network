                  next_hop="node-01",
                  cost=10,
                  latency_ms=5,
                  capacity_bps=1_000_000_000,
              )
          )

          table.add(
              Route(
                  destination="service-a",
                  next_hop="node-02",
                  cost=5,
                  latency_ms=10,
                  capacity_bps=2_000_000_000,
              )
          )

          router = Router(table)

          decision = router.select(
              "service-a",
              policy=RoutePolicy.LOWEST_COST,
          )

          assert decision.next_hop == "node-02"
          assert decision.candidates == 2

          # --------------------------------------------------------
          # LOAD BALANCER
          # --------------------------------------------------------

          balancer = LoadBalancer(
              LoadBalancingPolicy.LEAST_CONNECTIONS
          )

          balancer.register(
              Backend(
                  backend_id="backend-01",
                  endpoint="tcp://10.0.0.1:9000",
                  connections=5,
              )
          )

          balancer.register(
              Backend(
                  backend_id="backend-02",
                  endpoint="tcp://10.0.0.2:9000",
                  connections=1,
              )
          )

          selected = balancer.select()

          assert selected.backend_id == "backend-02"

          # --------------------------------------------------------
          # FAILOVER
          # --------------------------------------------------------

          failover = FailoverManager()

          failover.register(
              FailoverTarget(
                  target_id="primary",
                  endpoint="tcp://10.0.0.1:9000",
                  priority=10,
                  state=FailoverState.PRIMARY,
              )
          )

          failover.register(
              FailoverTarget(
                  target_id="standby",
                  endpoint="tcp://10.0.0.2:9000",
                  priority=20,
              )
          )

          standby = failover.best_standby()

          assert standby.target_id == "standby"

          failover.action(
              "standby",
              FailoverAction.PROMOTE,
          )

          assert (
              failover.active_target().target_id
              == "standby"
          )

          # --------------------------------------------------------
          # QUORUM
          # --------------------------------------------------------

          quorum = QuorumGroup()

          quorum.add("node-01")
          quorum.add("node-02")
          quorum.add("node-03")

          result = quorum.evaluate(
              {
                  "node-01",
                  "node-02",
              }
          )

          assert result.decision is (
              QuorumDecision.ACHIEVED
          )

          assert result.required == 2

          # --------------------------------------------------------
          # REPLICATION
          # --------------------------------------------------------

          replication = ReplicationManager()

          replication.register_peer(
              ReplicationPeer(
                  peer_id="replica-01",
                  endpoint="tcp://10.0.0.3:9000",
              )
          )

          replication.advance_local(10)

          status = replication.update_peer(
              "replica-01",
              10,
          )

          assert status.lag == 0
          assert status.state is (
              ReplicationState.SYNCED
          )

          # --------------------------------------------------------
          # FIREWALL
          # --------------------------------------------------------

          firewall = FirewallRuleSet()

          firewall.add(
              FirewallRule(
                  rule_id="allow-api",
                  priority=10,
                  action=FirewallAction.ALLOW,
                  source="node-01",
                  destination="service-a",
                  protocol="tcp",
                  port=443,
              )
          )

          allowed = firewall.evaluate(
              source="node-01",
              destination="service-a",
              protocol="tcp",
              port=443,
          )

          assert allowed.action is (
              FirewallAction.ALLOW
          )

          denied = firewall.evaluate(
              source="node-02",
              destination="service-a",
              protocol="tcp",
              port=443,
          )

          assert denied.action is (
              FirewallAction.DENY
          )

          # --------------------------------------------------------
          # SESSION
          # --------------------------------------------------------

          sessions = SessionManager(
              idle_timeout_seconds=900
          )

          session = sessions.create(
              "node-01"
          )

          assert session.session_id
          assert session.state.value == "active"

          sessions.touch(
              session.session_id
          )

          assert (
              sessions.get(
                  session.session_id
              )
              is not None
          )

          sessions.close(
              session.session_id
          )

          assert (
              sessions.get(
                  session.session_id
              ).state.value
              == "closed"
          )

          # --------------------------------------------------------
          # DIAGNOSTICS
          # --------------------------------------------------------

          diagnostics = DiagnosticsEngine()

          diagnostics.register(
              "network-core",
              lambda: DiagnosticResult(
                  component="network-core",
                  level=DiagnosticLevel.INFO,
                  message="network core healthy",
                  healthy=True,
              ),
          )

          report = diagnostics.run()

          assert report.healthy is True
          assert report.failures == 0
          assert len(report.results) == 1

          print(
              "NETWORK BLOCK 02 "
              "PRODUCTION CONTRACT: PASS"
          )
          PY

          # ========================================================
          # NO EMPTY PYTHON FILES
          # ========================================================

          empty_files=0

          while IFS= read -r -d '' file; do
            if [ ! -s "$file" ]; then
              echo "EMPTY NETWORK FILE: $file"
              empty_files=$((empty_files + 1))
            fi
          done < <(
            find network \
              -type f \
              -name '*.py' \
              -print0
          )

          if [ "$empty_files" -ne 0 ]; then
            echo "ERROR: empty Python files remain in network/"
            exit 1
          fi

          # ========================================================
          # PROTECTED BOUNDARIES
          # ========================================================

          if git status --porcelain -- apps | grep -q .; then
            echo "ERROR: apps/ was modified."
            git status --short -- apps
            exit 1
          fi

          if git status --porcelain -- infrastructure | grep -q .; then
            echo "ERROR: infrastructure/ was modified."
            git status --short -- infrastructure
            exit 1
          fi

          echo "NETWORK BLOCK 02 BUILD: PASS"

      # ============================================================
      # COMPILE NETWORK
      # ============================================================

      - name: Compile Network
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m compileall -q network
          echo "Network compilation: PASS"

      # ============================================================
      # COMPLETE NETWORK IMPORT CHECK
      # ============================================================

      - name: Integration checks
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import network

          required = [
              "Route",
              "RouteTable",
              "Router",
              "Backend",
              "LoadBalancer",
              "FailoverManager",
              "QuorumGroup",
              "ReplicationManager",
              "FirewallRuleSet",
              "SessionManager",
              "DiagnosticsEngine",
          ]

          missing = [
              name
              for name in required
              if not hasattr(network, name)
          ]

          if missing:
              raise AssertionError(
                  "Missing Network public API: "
                  + ", ".join(missing)
              )

          print(
              "Complete Network public API: PASS"
          )
          PY

      # ============================================================
      # VERIFY EXACT BLOCK 02 FILES
      # ============================================================

      - name: Verify Network Block 02
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          root = Path("network")

          required = [
              root / "__init__.py",

              root / "routing" / "__init__.py",
              root / "routing" / "router.py",

              root / "load_balancer" / "__init__.py",
              root / "load_balancer" / "balancer.py",

              root / "failover" / "__init__.py",
              root / "failover" / "failover.py",

              root / "quorum" / "__init__.py",
              root / "quorum" / "quorum.py",

              root / "replication" / "__init__.py",
              root / "replication" / "replication.py",

              root / "firewall" / "__init__.py",
              root / "firewall" / "firewall.py",

              root / "session" / "__init__.py",
              root / "session" / "session.py",

              root / "diagnostics" / "__init__.py",
              root / "diagnostics" / "diagnostics.py",
          ]

          for path in required:
              if not path.exists():
                  raise AssertionError(
                      f"Missing Network file: {path}"
                  )

              if path.stat().st_size == 0:
                  raise AssertionError(
                      f"Empty Network file: {path}"
                  )

          print(
              "Network Block 02 files: PASS"
          )
          PY

      # ============================================================
      # VERIFY APPS AND INFRASTRUCTURE WERE NOT TOUCHED
      # ============================================================

      - name: Verify protected boundaries
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if git status --porcelain -- apps | grep -q .; then
            echo "ERROR: apps/ was modified."
            git status --short -- apps
            exit 1
          fi

          if git status --porcelain -- infrastructure | grep -q .; then
            echo "ERROR: infrastructure/ was modified."
            git status --short -- infrastructure
            exit 1
          fi

          echo "Protected boundaries: PASS"

      # ============================================================
      # FINAL NETWORK STATUS
      # ============================================================

      - name: Network final validation
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          root = Path("network")

          python_files = tuple(
              path
              for path in root.rglob("*.py")
              if "__pycache__" not in path.parts
          )

          if not python_files:
              raise AssertionError(
                  "Network contains no Python source"
              )

          empty = [
              str(path)
              for path in python_files
              if path.stat().st_size == 0
          ]

          if empty:
              raise AssertionError(
                  "Empty Network files:\n"
                  + "\n".join(empty)
              )

          print(
              f"Network production source files: "
              f"{len(python_files)}"
          )

          print(
              "NETWORK PRODUCTION VALIDATION: PASS"
          )
          PY

      # ============================================================
      # COMMIT AND PUSH
      # ============================================================

      - name: Commit and push
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add network

          if git diff --cached --quiet; then
            echo "No Network Block 02 changes to commit."
            exit 0
          fi

          git commit \
            -m "build: complete network production block 02"

          git push origin "${GITHUB_REF_NAME}"
