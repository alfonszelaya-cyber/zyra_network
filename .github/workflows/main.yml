                  self,
                  incident_id,
                  state,
              ):
                  if not isinstance(
                      state,
                      IncidentState,
                  ):
                      raise ValidationError(
                          "state must be IncidentState"
                      )

                  with self._lock:
                      current = self._items.get(
                          incident_id
                      )

                      if current is None:
                          raise KeyError(
                              incident_id
                          )

                      if state not in (
                          self._TRANSITIONS[
                              current.state
                          ]
                      ):
                          raise ValidationError(
                              "invalid incident transition: "
                              f"{current.state.value} -> "
                              f"{state.value}"
                          )

                      updated = IncidentRecord(
                          incident_id=(
                              current.incident_id
                          ),
                          title=current.title,
