          from __future__ import annotations

          from concurrent.futures import ThreadPoolExecutor
          from decimal import Decimal
          from pathlib import Path
          from types import MappingProxyType

          import pytest

          from shared_engines.ai.budget import ExecutionBudget
          from shared_engines.ai.circuit import (
              CircuitBreaker,
              CircuitState,
          )
          from shared_engines.ai.contracts import (
              AIRequest,
              AIResponse,
              AIUsage,
              ModelDescriptor,
          )
          from shared_engines.ai.crypto import (
              EnvelopeCipher,
              KeyMaterial,
              VersionedKeyRing,
          )
          from shared_engines.ai.engine import AIEngine
          from shared_engines.ai.errors import (
              AIIdempotencyConflict,
          )
          from shared_engines.ai.registry import ModelRegistry
          from shared_engines.ai.storage import SQLiteAIStore


          NOW = 1_800_000_000

          MODEL = ModelDescriptor(
              schema_version=2,
              model_id="test-model",
              provider="test-provider",
              family="test",
              capabilities=frozenset({"text"}),
              context_window=8192,
              max_output_tokens=4096,
          )


          def make_cipher() -> EnvelopeCipher:
              return EnvelopeCipher(
                  VersionedKeyRing(
                      keys=(
                          KeyMaterial(
                              version=1,
                              key=(
                                  b"0123456789abcdef"
                                  b"0123456789abcdef"
                              ),
                          ),
                      ),
                      current_version=1,
                  )
              )


          class TestProvider:
              name = "test-provider"

              def __init__(self) -> None:
                  self.calls = 0

              def models(
                  self,
              ) -> tuple[ModelDescriptor, ...]:
                  return (MODEL,)

              def health(self) -> bool:
                  return True

              def complete(
                  self,
                  request: AIRequest,
                  model: ModelDescriptor,
              ) -> AIResponse:
                  self.calls += 1

                  return AIResponse(
                      schema_version=2,
                      request_id=request.request_id,
                      model_id=model.model_id,
                      provider=self.name,
                      output="production-response",
                      usage=AIUsage(
                          input_tokens=2,
                          output_tokens=2,
                          total_tokens=4,
                          estimated_cost=Decimal("0.001"),
                      ),
                      created_at=request.created_at,
                      completed_at=(
                          request.created_at + 1
                      ),
                      response_id=(
                          "response-"
                          + request.request_id
                      ),
                      metadata=MappingProxyType({}),
                  )


          def make_request(
              key: str = "key-1",
              prompt: str = "hello",
          ) -> AIRequest:
              return AIRequest(
                  schema_version=2,
                  request_id="request-" + key,
                  idempotency_key=key,
                  model_id=MODEL.model_id,
                  prompt=prompt,
                  system_prompt=None,
                  max_output_tokens=100,
                  temperature=Decimal("0"),
                  timeout_seconds=30,
                  created_at=NOW,
              )


          def make_store(
              path: Path,
          ) -> SQLiteAIStore:
              return SQLiteAIStore(
                  path,
                  cipher=make_cipher(),
              )


          def make_engine(
              store: SQLiteAIStore | None = None,
              provider: TestProvider | None = None,
              budget: ExecutionBudget | None = None,
          ) -> AIEngine:
              registry = ModelRegistry()
              registry.register(MODEL)

              selected = (
                  provider
                  if provider is not None
                  else TestProvider()
              )

              return AIEngine(
                  registry,
                  [selected],
                  store=store,
                  budget=budget,
              )


          def test_engine_executes() -> None:
              provider = TestProvider()

              response = make_engine(
                  provider=provider
              ).execute(
                  make_request()
              )

              assert response.output == (
                  "production-response"
              )

              assert provider.calls == 1


          def test_durable_idempotency(
              tmp_path: Path,
          ) -> None:
              store = make_store(
                  tmp_path / "ai.db"
              )

              provider = TestProvider()

              service = make_engine(
                  store=store,
                  provider=provider,
              )

              first = service.execute(
                  make_request("same")
              )

              second = service.execute(
                  make_request("same")
              )

              assert first == second
              assert provider.calls == 1
              assert store.count_requests() == 1
              assert store.verify_audit_chain()


          def test_idempotency_conflict(
              tmp_path: Path,
          ) -> None:
              store = make_store(
                  tmp_path / "ai.db"
              )

              service = make_engine(
                  store=store
              )

              service.execute(
                  make_request(
                      "same",
                      "first",
                  )
              )

              with pytest.raises(
                  AIIdempotencyConflict
              ):
                  service.execute(
                      make_request(
                          "same",
                          "second",
                      )
                  )


          def test_sqlite_reopen(
              tmp_path: Path,
          ) -> None:
              path = tmp_path / "durable.db"

              first_store = make_store(path)

              first = make_engine(
                  store=first_store
              ).execute(
                  make_request("persistent")
              )

              second_store = make_store(path)

              second = make_engine(
                  store=second_store
              ).execute(
                  make_request("persistent")
              )

              assert first == second
              assert second_store.count_requests() == 1
              assert second_store.verify_audit_chain()


          def test_encryption_and_key_rotation() -> None:
              ring = VersionedKeyRing(
                  keys=(
                      KeyMaterial(
                          version=1,
                          key=(
                              b"0123456789abcdef"
                              b"0123456789abcdef"
                          ),
                      ),
                      KeyMaterial(
                          version=2,
                          key=(
                              b"abcdef0123456789"
                              b"abcdef0123456789"
                          ),
                      ),
                  ),
                  current_version=2,
              )

              cipher = EnvelopeCipher(ring)

              token = cipher.encrypt(
                  b"sensitive",
                  associated_data=b"request",
              )

              assert token.startswith("v2.")

              assert cipher.decrypt(
                  token,
                  associated_data=b"request",
              ) == b"sensitive"


          def test_encryption_detects_tampering() -> None:
              cipher = make_cipher()

              token = cipher.encrypt(
                  b"sensitive",
                  associated_data=b"request",
              )

              with pytest.raises(Exception):
                  cipher.decrypt(
                      token + "x",
                      associated_data=b"request",
                  )


          def test_budget() -> None:
              budget = ExecutionBudget(
                  max_requests=2,
                  max_tokens=10,
                  max_cost=Decimal("1"),
              )

              budget.reserve_request()

              budget.settle(
                  tokens=4,
                  cost=Decimal("0.1"),
              )

              snapshot = budget.snapshot()

              assert snapshot.requests == 1
              assert snapshot.tokens == 4
              assert snapshot.cost == Decimal("0.1")


          def test_circuit() -> None:
              breaker = CircuitBreaker(
                  failure_threshold=2,
                  recovery_seconds=10,
              )

              assert breaker.allow(now=NOW)

              breaker.failure(now=NOW)
              breaker.failure(now=NOW)

              assert (
                  breaker.snapshot().state
                  is CircuitState.OPEN
              )

              assert not breaker.allow(
                  now=NOW
              )

              assert breaker.allow(
                  now=NOW + 10
              )


          def test_outbox(
              tmp_path: Path,
          ) -> None:
              store = make_store(
                  tmp_path / "outbox.db"
              )

              make_engine(
                  store=store
              ).execute(
                  make_request("outbox")
              )

              events = store.pending_outbox()

              assert len(events) == 1

              event = events[0]

              assert event.event_type == (
                  "AI_REQUEST_COMPLETED"
              )

              assert store.mark_outbox_published(
                  event_id=event.event_id,
                  published_at=NOW + 10,
              )

              assert store.pending_outbox() == ()


          def test_inbox_deduplication(
              tmp_path: Path,
          ) -> None:
              store = make_store(
                  tmp_path / "inbox.db"
              )

              assert store.mark_inbox_seen(
                  consumer="consumer-a",
                  event_id="event-1",
                  received_at=NOW,
              )

              assert not store.mark_inbox_seen(
                  consumer="consumer-a",
                  event_id="event-1",
                  received_at=NOW + 1,
              )


          def test_concurrent_idempotency(
              tmp_path: Path,
          ) -> None:
              store = make_store(
                  tmp_path / "concurrent.db"
              )

              provider = TestProvider()

              service = make_engine(
                  store=store,
                  provider=provider,
              )

              def run(
                  _: int,
              ) -> AIResponse:
                  return service.execute(
                      make_request("concurrent")
                  )

              with ThreadPoolExecutor(
                  max_workers=8
              ) as executor:
                  results = list(
                      executor.map(
                          run,
                          range(8),
                      )
                  )

              assert all(
                  item == results[0]
                  for item in results
              )

              assert provider.calls == 1
              assert store.count_requests() == 1
              assert store.verify_audit_chain()


          def test_database_integrity(
              tmp_path: Path,
          ) -> None:
              store = make_store(
                  tmp_path / "integrity.db"
              )

              make_engine(
                  store=store
              ).execute(
                  make_request("integrity")
              )

              store.verify_database()
              assert store.verify_audit_chain()


          def test_backup_and_restore(
              tmp_path: Path,
          ) -> None:
              source = tmp_path / "source.db"
              backup = tmp_path / "backup.db"

              store = make_store(source)

              make_engine(
                  store=store
              ).execute(
                  make_request("backup")
              )

              store.backup_and_verify(
                  backup
              )

              restored = make_store(
                  backup
              )

              assert restored.count_requests() == 1
              assert restored.verify_audit_chain()
