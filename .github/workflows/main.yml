                          connection.execute(
                              """
                              CREATE INDEX IF NOT EXISTS
                              idx_ai_requests_status_lease
                              ON ai_requests(status, lease_until)
                              """
                          )

                          connection.execute(
                              """
                              CREATE TABLE IF NOT EXISTS ai_outbox (
                                  event_id INTEGER PRIMARY KEY AUTOINCREMENT,
