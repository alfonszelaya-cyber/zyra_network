name: construir network

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-network:
    name: Build Network Block 01
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python path
        shell: bash
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Build Network Block 01
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p network/transport
          mkdir -p network/topology
          mkdir -p network/discovery
          mkdir -p network/heartbeat
          mkdir -p network/cluster

          # ============================================================
          # NETWORK ROOT
          # ============================================================

          cat > network/__init__.py <<'PY'
          """
          ZYRA Network.

          Foundational network layer for the distributed ZYRA platform.

          Block 01 provides:
              - transport primitives
              - network topology
              - service discovery
              - heartbeat/liveness
              - cluster membership

          Higher-level routing, failover, quorum, replication,
          load-balancing, firewall, sessions and diagnostics are
          implemented in the subsequent Network block.
          """

          from .transport import (
              ConnectionState,
              Frame,
              FrameType,
              NetworkTransport,
              TransportAddress,
              TransportError,
              TransportManager,
          )

          from .topology import (
              Link,
              LinkState,
              NetworkGraph,
              NetworkNode,
              NodeType,
              TopologySnapshot,
          )

          from .discovery import (
              DiscoveryRecord,
              DiscoveryRegistry,
              DiscoveryStatus,
          )

          from .heartbeat import (
              Heartbeat,
              HeartbeatMonitor,
              HeartbeatState,
          )

          from .cluster import (
              Cluster,
              ClusterMember,
              ClusterMemberState,
              ClusterSnapshot,
          )

          __all__ = [
              "ConnectionState",
              "Frame",
              "FrameType",
              "NetworkTransport",
              "TransportAddress",
              "TransportError",
              "TransportManager",
              "Link",
              "LinkState",
              "NetworkGraph",
              "NetworkNode",
              "NodeType",
              "TopologySnapshot",
              "DiscoveryRecord",
              "DiscoveryRegistry",
              "DiscoveryStatus",
              "Heartbeat",
              "HeartbeatMonitor",
              "HeartbeatState",
              "Cluster",
              "ClusterMember",
              "ClusterMemberState",
              "ClusterSnapshot",
          ]
          PY

          # ============================================================
          # TRANSPORT
          # ============================================================

          cat > network/transport/__init__.py <<'PY'
          """
          Network transport primitives.

          This package defines the stable transport contract without
          binding the Network layer to a specific socket, cloud,
          operating-system or third-party implementation.
          """

          from .transport import (
              ConnectionState,
              Frame,
              FrameType,
              NetworkTransport,
              TransportAddress,
              TransportError,
              TransportManager,
          )

          __all__ = [
              "ConnectionState",
              "Frame",
              "FrameType",
              "NetworkTransport",
              "TransportAddress",
              "TransportError",
              "TransportManager",
          ]
          PY

          cat > network/transport/transport.py <<'PY'
          """
          Production-grade transport abstractions for ZYRA Network.

          Design principles:
              - deterministic state transitions
              - immutable addressing and frames
              - explicit validation
              - bounded frame sizes
              - thread-safe manager operations
              - provider-neutral transport contracts
              - no arbitrary code execution
              - no dependency on a particular network vendor

          Actual TCP/TLS/QUIC/Unix/cloud transports can implement the
          NetworkTransport contract without changing the network API.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from enum import Enum
          from threading import RLock
          from time import monotonic
          from typing import Mapping, Protocol


          MAX_FRAME_SIZE = 16 * 1024 * 1024
          MAX_HEADER_COUNT = 128


          class TransportError(RuntimeError):
              """Base transport failure."""


          class ConnectionState(str, Enum):
              DISCONNECTED = "disconnected"
              CONNECTING = "connecting"
              CONNECTED = "connected"
              DRAINING = "draining"
              CLOSED = "closed"
              FAILED = "failed"


          class FrameType(str, Enum):
              DATA = "data"
              CONTROL = "control"
              HEARTBEAT = "heartbeat"
              ACK = "ack"
              ERROR = "error"


          @dataclass(frozen=True, slots=True)
          class TransportAddress:
              """
              Immutable network endpoint.

              ``scheme`` identifies the transport family while host and
              port identify the endpoint. DNS resolution remains outside
              this value object.
              """

              host: str
              port: int
              scheme: str = "tcp"
              secure: bool = False

              def __post_init__(self) -> None:
                  host = self.host.strip()
                  scheme = self.scheme.strip().lower()

                  if not host:
                      raise ValueError(
                          "transport host cannot be empty"
                      )

                  if not 1 <= self.port <= 65535:
                      raise ValueError(
                          "transport port must be between 1 and 65535"
                      )

                  if not scheme:
                      raise ValueError(
                          "transport scheme cannot be empty"
                      )

                  object.__setattr__(
                      self,
                      "host",
                      host,
                  )

                  object.__setattr__(
                      self,
                      "scheme",
                      scheme,
                  )

              def as_uri(self) -> str:
                  return (
                      f"{self.scheme}://"
                      f"{self.host}:{self.port}"
                  )


          @dataclass(frozen=True, slots=True)
          class Frame:
              """
              Immutable transport frame.

              Frames are intentionally opaque to Network. Serialization
              belongs to the protocol/encoding layer.
              """

              frame_type: FrameType
              payload: bytes
              sequence: int
              headers: Mapping[str, str] = field(
                  default_factory=dict
              )

              def __post_init__(self) -> None:
                  if not isinstance(
                      self.frame_type,
                      FrameType,
                  ):
                      raise TypeError(
                          "frame_type must be FrameType"
                      )

                  if not isinstance(
                      self.payload,
                      bytes,
                  ):
                      raise TypeError(
                          "frame payload must be bytes"
                      )

                  if self.sequence < 0:
                      raise ValueError(
                          "frame sequence cannot be negative"
                      )

                  if len(self.payload) > MAX_FRAME_SIZE:
                      raise ValueError(
                          "frame payload exceeds maximum size"
                      )

                  normalized = {
                      str(key): str(value)
                      for key, value in self.headers.items()
                  }

                  if len(normalized) > MAX_HEADER_COUNT:
                      raise ValueError(
                          "frame header count exceeds maximum"
                      )

                  object.__setattr__(
                      self,
                      "payload",
                      bytes(self.payload),
                  )

                  object.__setattr__(
                      self,
                      "headers",
                      normalized,
                  )

              @property
              def size(self) -> int:
                  return len(self.payload)


          class NetworkTransport(Protocol):
              """
              Stable provider contract for network transports.
              """

              @property
              def state(self) -> ConnectionState:
                  ...

              @property
              def address(self) -> TransportAddress | None:
                  ...

              def connect(
                  self,
                  address: TransportAddress,
              ) -> None:
                  ...

              def send(
                  self,
                  frame: Frame,
              ) -> None:
                  ...

              def receive(
                  self,
              ) -> tuple[Frame, ...]:
                  ...

              def close(self) -> None:
                  ...


          class TransportManager:
              """
              Thread-safe transport registry.

              The manager controls lifecycle ownership and lookup.
              Concrete transports remain independently replaceable.
              """

              def __init__(self) -> None:
                  self._transports: dict[
                      str,
                      NetworkTransport,
                  ] = {}

                  self._lock = RLock()

              def register(
                  self,
                  name: str,
                  transport: NetworkTransport,
              ) -> None:
                  name = name.strip()

                  if not name:
                      raise ValueError(
                          "transport name cannot be empty"
                      )

                  required = (
                      "connect",
                      "send",
                      "receive",
                      "close",
                  )

                  for method in required:
                      if not callable(
                          getattr(
                              transport,
                              method,
                              None,
                          )
                      ):
                          raise TypeError(
                              f"transport is missing {method}()"
                          )

                  with self._lock:
                      if name in self._transports:
                          raise ValueError(
                              f"transport already registered: {name}"
                          )

                      self._transports[name] = transport

              def get(
                  self,
                  name: str,
              ) -> NetworkTransport:
                  normalized = name.strip()

                  with self._lock:
                      try:
                          return self._transports[
                              normalized
                          ]
                      except KeyError as exc:
                          raise LookupError(
                              f"transport not found: {normalized}"
                          ) from exc

              def unregister(
                  self,
                  name: str,
              ) -> bool:
                  with self._lock:
                      return (
                          self._transports.pop(
                              name.strip(),
                              None,
                          )
                          is not None
                      )

              def names(
                  self,
              ) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(
                          sorted(
                              self._transports
                          )
                      )

              def close_all(self) -> None:
                  """
                  Close every registered transport.

                  Individual failures do not prevent remaining transports
                  from receiving the close request.
                  """
                  with self._lock:
                      transports = tuple(
                          self._transports.values()
                      )

                  errors: list[Exception] = []

                  for transport in transports:
                      try:
                          transport.close()
                      except Exception as exc:
                          errors.append(exc)

                  if errors:
                      raise TransportError(
                          f"{len(errors)} transport(s) "
                          "failed during close_all()"
                      )


          class InMemoryNetworkTransport:
              """
              Deterministic reference transport.

              Used for integration tests, local simulation and bootstrap
              validation. It does not represent the production wire
              transport; production adapters implement NetworkTransport.
              """

              def __init__(self) -> None:
                  self._state = (
                      ConnectionState.DISCONNECTED
                  )

                  self._address: (
                      TransportAddress | None
                  ) = None

                  self._frames: list[Frame] = []
                  self._lock = RLock()
                  self._sequence = 0
                  self._created_at = monotonic()

              @property
              def state(self) -> ConnectionState:
                  with self._lock:
                      return self._state

              @property
              def address(
                  self,
              ) -> TransportAddress | None:
                  with self._lock:
                      return self._address

              def connect(
                  self,
                  address: TransportAddress,
              ) -> None:
                  if not isinstance(
                      address,
                      TransportAddress,
                  ):
                      raise TypeError(
                          "address must be TransportAddress"
                      )

                  with self._lock:
                      if (
                          self._state
                          is ConnectionState.CLOSED
                      ):
                          raise TransportError(
                              "closed transport cannot reconnect"
                          )

                      self._state = (
                          ConnectionState.CONNECTING
                      )

                      self._address = address

                      self._state = (
                          ConnectionState.CONNECTED
                      )

              def send(
                  self,
                  frame: Frame,
              ) -> None:
                  if not isinstance(
                      frame,
                      Frame,
                  ):
                      raise TypeError(
                          "frame must be Frame"
                      )

                  with self._lock:
                      if (
                          self._state
                          is not ConnectionState.CONNECTED
                      ):
                          raise TransportError(
                              "transport is not connected"
                          )

                      self._frames.append(
                          frame
                      )

              def receive(
                  self,
              ) -> tuple[Frame, ...]:
                  with self._lock:
                      frames = tuple(
                          self._frames
                      )

                      self._frames.clear()

                      return frames

              def close(self) -> None:
                  with self._lock:
                      self._state = (
                          ConnectionState.CLOSED
                      )

                      self._address = None

              def next_sequence(self) -> int:
                  with self._lock:
                      value = self._sequence
                      self._sequence += 1
                      return value


          __all__ = [
              "MAX_FRAME_SIZE",
              "MAX_HEADER_COUNT",
              "TransportError",
              "ConnectionState",
              "FrameType",
              "TransportAddress",
              "Frame",
              "NetworkTransport",
              "TransportManager",
              "InMemoryNetworkTransport",
          ]
          PY

          # ============================================================
          # TOPOLOGY
          # ============================================================

          cat > network/topology/__init__.py <<'PY'
          """Network topology and graph primitives."""

          from .topology import (
              Link,
              LinkState,
              NetworkGraph,
              NetworkNode,
              NodeType,
              TopologySnapshot,
          )

          __all__ = [
              "Link",
              "LinkState",
              "NetworkGraph",
              "NetworkNode",
              "NodeType",
              "TopologySnapshot",
          ]
          PY

          cat > network/topology/topology.py <<'PY'
          """
          Network topology model.

          The graph is authoritative only for the network process that owns
          it. Persistence, distributed consensus and route computation are
          intentionally separate layers.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from enum import Enum
          from threading import RLock
          from time import time
          from typing import Mapping


          class NodeType(str, Enum):
              CORE = "core"
              EDGE = "edge"
              SERVICE = "service"
              GATEWAY = "gateway"
              STORAGE = "storage"
              OBSERVER = "observer"


          class LinkState(str, Enum):
              UP = "up"
              DEGRADED = "degraded"
              DOWN = "down"
              DRAINING = "draining"


          @dataclass(frozen=True, slots=True)
          class NetworkNode:
              node_id: str
              node_type: NodeType
              metadata: Mapping[str, str] = field(
                  default_factory=dict
              )

              def __post_init__(self) -> None:
                  node_id = self.node_id.strip()

                  if not node_id:
                      raise ValueError(
                          "node_id cannot be empty"
                      )

                  if not isinstance(
                      self.node_type,
                      NodeType,
                  ):
                      raise TypeError(
                          "node_type must be NodeType"
                      )

                  object.__setattr__(
                      self,
                      "node_id",
                      node_id,
                  )

                  object.__setattr__(
                      self,
                      "metadata",
                      dict(self.metadata),
                  )


          @dataclass(frozen=True, slots=True)
          class Link:
              source: str
              destination: str
              state: LinkState = LinkState.UP
              latency_ms: float | None = None
              capacity_bps: int | None = None
              metadata: Mapping[str, str] = field(
                  default_factory=dict
              )

              def __post_init__(self) -> None:
                  source = self.source.strip()
                  destination = self.destination.strip()

                  if not source:
                      raise ValueError(
                          "link source cannot be empty"
                      )

                  if not destination:
                      raise ValueError(
                          "link destination cannot be empty"
                      )

                  if source == destination:
                      raise ValueError(
                          "self-referential links are not allowed"
                      )

                  if not isinstance(
                      self.state,
                      LinkState,
                  ):
                      raise TypeError(
                          "state must be LinkState"
                      )

                  if (
                      self.latency_ms is not None
                      and self.latency_ms < 0
                  ):
                      raise ValueError(
                          "latency_ms cannot be negative"
                      )

                  if (
                      self.capacity_bps is not None
                      and self.capacity_bps <= 0
                  ):
                      raise ValueError(
                          "capacity_bps must be positive"
                      )

                  object.__setattr__(
                      self,
                      "source",
                      source,
                  )

                  object.__setattr__(
                      self,
                      "destination",
                      destination,
                  )

                  object.__setattr__(
                      self,
                      "metadata",
                      dict(self.metadata),
                  )


          @dataclass(frozen=True, slots=True)
          class TopologySnapshot:
              version: int
              created_at: float
              nodes: tuple[NetworkNode, ...]
              links: tuple[Link, ...]


          class NetworkGraph:
              """
              Thread-safe topology graph.

              All mutations increment a monotonic topology version.
              """

              def __init__(self) -> None:
                  self._nodes: dict[
                      str,
                      NetworkNode,
                  ] = {}

                  self._links: dict[
                      tuple[str, str],
                      Link,
                  ] = {}

                  self._version = 0
                  self._lock = RLock()

              @property
              def version(self) -> int:
                  with self._lock:
                      return self._version

              def add_node(
                  self,
                  node: NetworkNode,
              ) -> None:
                  if not isinstance(
                      node,
                      NetworkNode,
                  ):
                      raise TypeError(
                          "node must be NetworkNode"
                      )

                  with self._lock:
                      if node.node_id in self._nodes:
                          raise ValueError(
                              f"network node already exists: "
                              f"{node.node_id}"
                          )

                      self._nodes[
                          node.node_id
                      ] = node

                      self._version += 1

              def remove_node(
                  self,
                  node_id: str,
              ) -> bool:
                  node_id = node_id.strip()

                  with self._lock:
                      if (
                          self._nodes.pop(
                              node_id,
                              None,
                          )
                          is None
                      ):
                          return False

                      keys = tuple(
                          key
                          for key in self._links
                          if node_id in key
                      )

                      for key in keys:
                          del self._links[key]

                      self._version += 1

                      return True

              def get_node(
                  self,
                  node_id: str,
              ) -> NetworkNode | None:
                  with self._lock:
                      return self._nodes.get(
                          node_id.strip()
                      )

              def add_link(
                  self,
                  link: Link,
              ) -> None:
                  if not isinstance(
                      link,
                      Link,
                  ):
                      raise TypeError(
                          "link must be Link"
                      )

                  key = (
                      link.source,
                      link.destination,
                  )

                  with self._lock:
                      if link.source not in self._nodes:
                          raise LookupError(
                              f"source node does not exist: "
                              f"{link.source}"
                          )

                      if (
                          link.destination
                          not in self._nodes
                      ):
                          raise LookupError(
                              f"destination node does not exist: "
                              f"{link.destination}"
                          )

                      if key in self._links:
                          raise ValueError(
                              f"link already exists: {key}"
                          )

                      self._links[key] = link
                      self._version += 1

              def remove_link(
                  self,
                  source: str,
                  destination: str,
              ) -> bool:
                  key = (
                      source.strip(),
                      destination.strip(),
                  )

                  with self._lock:
                      if (
                          self._links.pop(
                              key,
                              None,
                          )
                          is None
                      ):
                          return False

                      self._version += 1
                      return True

              def neighbors(
                  self,
                  node_id: str,
              ) -> tuple[NetworkNode, ...]:
                  node_id = node_id.strip()

                  with self._lock:
                      if node_id not in self._nodes:
                          raise LookupError(
                              f"node not found: {node_id}"
                          )

                      neighbor_ids = {
                          link.destination
                          for link in self._links.values()
                          if (
                              link.source == node_id
                              and link.state
                              in {
                                  LinkState.UP,
                                  LinkState.DEGRADED,
                              }
                          )
                      }

                      return tuple(
                          self._nodes[
                              neighbor_id
                          ]
                          for neighbor_id
                          in sorted(
                              neighbor_ids
                          )
                      )

              def set_link_state(
                  self,
                  source: str,
                  destination: str,
                  state: LinkState,
              ) -> None:
                  if not isinstance(
                      state,
                      LinkState,
                  ):
                      raise TypeError(
                          "state must be LinkState"
                      )

                  key = (
                      source.strip(),
                      destination.strip(),
                  )

                  with self._lock:
                      link = self._links.get(key)

                      if link is None:
                          raise LookupError(
                              f"link not found: {key}"
                          )

                      self._links[key] = Link(
                          source=link.source,
                          destination=link.destination,
                          state=state,
                          latency_ms=link.latency_ms,
                          capacity_bps=link.capacity_bps,
                          metadata=link.metadata,
                      )

                      self._version += 1

              def snapshot(
                  self,
              ) -> TopologySnapshot:
                  with self._lock:
                      return TopologySnapshot(
                          version=self._version,
                          created_at=time(),
                          nodes=tuple(
                              self._nodes.values()
                          ),
                          links=tuple(
                              self._links.values()
                          ),
                      )


          __all__ = [
              "NodeType",
              "LinkState",
              "NetworkNode",
              "Link",
              "TopologySnapshot",
              "NetworkGraph",
          ]
          PY

          # ============================================================
          # DISCOVERY
          # ============================================================

          cat > network/discovery/__init__.py <<'PY'
          """Network service discovery."""

          from .discovery import (
              DiscoveryRecord,
              DiscoveryRegistry,
              DiscoveryStatus,
          )

          __all__ = [
              "DiscoveryRecord",
              "DiscoveryRegistry",
              "DiscoveryStatus",
          ]
          PY

          cat > network/discovery/discovery.py <<'PY'
          """
          Service discovery registry.

          Discovery stores service identity, endpoint and liveness metadata.
          It does not perform DNS, consensus or load balancing.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from enum import Enum
          from threading import RLock
          from time import monotonic
          from typing import Mapping


          class DiscoveryStatus(str, Enum):
              REGISTERING = "registering"
              ACTIVE = "active"
              DEGRADED = "degraded"
              DRAINING = "draining"
              OFFLINE = "offline"


          @dataclass(slots=True)
          class DiscoveryRecord:
              service_id: str
              instance_id: str
              endpoint: str
              status: DiscoveryStatus = (
                  DiscoveryStatus.REGISTERING
              )
              weight: int = 1
              metadata: dict[str, str] = field(
                  default_factory=dict
              )
              registered_at: float = field(
                  default_factory=monotonic
              )
              last_seen: float = field(
                  default_factory=monotonic
              )

              def __post_init__(self) -> None:
                  self.service_id = (
                      self.service_id.strip()
                  )

                  self.instance_id = (
                      self.instance_id.strip()
                  )

                  self.endpoint = (
                      self.endpoint.strip()
                  )

                  if not self.service_id:
                      raise ValueError(
                          "service_id cannot be empty"
                      )

                  if not self.instance_id:
                      raise ValueError(
                          "instance_id cannot be empty"
                      )

                  if not self.endpoint:
                      raise ValueError(
                          "endpoint cannot be empty"
                      )

                  if self.weight <= 0:
                      raise ValueError(
                          "weight must be positive"
                      )


          class DiscoveryRegistry:
              """Thread-safe service discovery registry."""

              def __init__(self) -> None:
                  self._records: dict[
                      tuple[str, str],
                      DiscoveryRecord,
                  ] = {}

                  self._lock = RLock()

              def register(
                  self,
                  service_id: str,
                  instance_id: str,
                  endpoint: str,
                  *,
                  weight: int = 1,
                  metadata: Mapping[str, str] | None = None,
              ) -> DiscoveryRecord:
                  record = DiscoveryRecord(
                      service_id=service_id,
                      instance_id=instance_id,
                      endpoint=endpoint,
                      status=DiscoveryStatus.ACTIVE,
                      weight=weight,
                      metadata=dict(
                          metadata or {}
                      ),
                  )

                  key = (
                      record.service_id,
                      record.instance_id,
                  )

                  with self._lock:
                      existing = self._records.get(
                          key
                      )

                      if existing is not None:
                          if (
                              existing.endpoint
                              != record.endpoint
                          ):
                              raise ValueError(
                                  "service instance already "
                                  "registered with another endpoint"
                              )

                      self._records[key] = record

                      return record

              def heartbeat(
                  self,
                  service_id: str,
                  instance_id: str,
              ) -> None:
                  key = (
                      service_id.strip(),
                      instance_id.strip(),
                  )

                  with self._lock:
                      record = self._records.get(
                          key
                      )

                      if record is None:
                          raise LookupError(
                              f"service instance not found: "
                              f"{key}"
                          )

                      record.last_seen = monotonic()
                      record.status = (
                          DiscoveryStatus.ACTIVE
                      )

              def set_status(
                  self,
                  service_id: str,
                  instance_id: str,
                  status: DiscoveryStatus,
              ) -> None:
                  if not isinstance(
                      status,
                      DiscoveryStatus,
                  ):
                      raise TypeError(
                          "status must be DiscoveryStatus"
                      )

                  key = (
                      service_id.strip(),
                      instance_id.strip(),
                  )

                  with self._lock:
                      record = self._records.get(
                          key
                      )

                      if record is None:
                          raise LookupError(
                              f"service instance not found: "
                              f"{key}"
                          )

                      record.status = status

              def resolve(
                  self,
                  service_id: str,
              ) -> tuple[
                  DiscoveryRecord,
                  ...,
              ]:
                  service_id = service_id.strip()

                  with self._lock:
                      return tuple(
                          sorted(
                              (
                                  record
                                  for record
                                  in self._records.values()
                                  if (
                                      record.service_id
                                      == service_id
                                      and record.status
                                      in {
                                          DiscoveryStatus.ACTIVE,
                                          DiscoveryStatus.DEGRADED,
                                      }
                                  )
                              ),
                              key=lambda item: (
                                  -item.weight,
                                  item.instance_id,
                              ),
                          )
                      )

              def get(
                  self,
                  service_id: str,
                  instance_id: str,
              ) -> DiscoveryRecord | None:
                  key = (
                      service_id.strip(),
                      instance_id.strip(),
                  )

                  with self._lock:
                      return self._records.get(
                          key
                      )

              def remove(
                  self,
                  service_id: str,
                  instance_id: str,
              ) -> bool:
                  key = (
                      service_id.strip(),
                      instance_id.strip(),
                  )

                  with self._lock:
                      return (
                          self._records.pop(
                              key,
                              None,
                          )
                          is not None
                      )

              def snapshot(
                  self,
              ) -> tuple[
                  DiscoveryRecord,
                  ...,
              ]:
                  with self._lock:
                      return tuple(
                          self._records.values()
                      )


          __all__ = [
              "DiscoveryStatus",
              "DiscoveryRecord",
              "DiscoveryRegistry",
          ]
