          cat > shared_engines/ai/contracts.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from decimal import Decimal
          from types import MappingProxyType
          from typing import Mapping


          SCHEMA_VERSION = 1

          MAX_PROMPT_BYTES = 4_000_000
          MAX_SYSTEM_PROMPT_BYTES = 1_000_000
          MAX_METADATA_ITEMS = 64
          MAX_METADATA_KEY_BYTES = 128
          MAX_METADATA_VALUE_BYTES = 4096


          def _validate_text(
              value: str,
              name: str,
              max_bytes: int,
          ) -> str:
              if not isinstance(value, str):
                  raise TypeError(f"{name} must be a string")

              normalized = value

              if not normalized.strip():
                  raise ValueError(f"{name} cannot be empty")

              if len(normalized.encode("utf-8")) > max_bytes:
                  raise ValueError(f"{name} exceeds configured size limit")

              return normalized


          def _freeze_metadata(
              metadata: Mapping[str, str] | None,
          ) -> Mapping[str, str]:
              if metadata is None:
                  return MappingProxyType({})

              if len(metadata) > MAX_METADATA_ITEMS:
                  raise ValueError("Too many metadata entries")

              result: dict[str, str] = {}

              for key, value in metadata.items():
                  if not isinstance(key, str) or not isinstance(value, str):
                      raise TypeError("Metadata keys and values must be strings")

                  if not key.strip():
                      raise ValueError("Metadata key cannot be empty")

                  if len(key.encode("utf-8")) > MAX_METADATA_KEY_BYTES:
                      raise ValueError("Metadata key exceeds size limit")

                  if len(value.encode("utf-8")) > MAX_METADATA_VALUE_BYTES:
                      raise ValueError("Metadata value exceeds size limit")

                  lowered = key.lower()

                  if any(
                      secret_word in lowered
                      for secret_word in (
                          "password",
                          "secret",
                          "api_key",
                          "apikey",
                          "authorization",
                          "private_key",
                          "access_token",
                          "refresh_token",
                      )
                  ):
                      raise ValueError(
                          f"Sensitive metadata key is not permitted: {key}"
                      )

                  result[key] = value

              return MappingProxyType(result)


          @dataclass(frozen=True, slots=True)
          class ModelDescriptor:
              schema_version: int
              model_id: str
              provider: str
              family: str
              capabilities: frozenset[str]
              context_window: int
              max_output_tokens: int
              active: bool = True
              revision: str = "1"

              def __post_init__(self) -> None:
                  if self.schema_version != SCHEMA_VERSION:
                      raise ValueError("Unsupported model schema version")

                  model_id = self.model_id.strip()
                  provider = self.provider.strip()
                  family = self.family.strip()

                  if not model_id:
                      raise ValueError("model_id is required")

                  if not provider:
                      raise ValueError("provider is required")

                  if not family:
                      raise ValueError("family is required")

                  if not self.capabilities:
                      raise ValueError("At least one capability is required")

                  if not all(
                      isinstance(capability, str) and capability.strip()
                      for capability in self.capabilities
                  ):
                      raise ValueError("Invalid model capability")

                  if not 1 <= self.context_window <= 100_000_000:
                      raise ValueError("Invalid context window")

                  if not 1 <= self.max_output_tokens <= self.context_window:
                      raise ValueError("Invalid max_output_tokens")

                  if not self.revision.strip():
                      raise ValueError("revision is required")

                  object.__setattr__(self, "model_id", model_id)
                  object.__setattr__(self, "provider", provider)
                  object.__setattr__(self, "family", family)


          @dataclass(frozen=True, slots=True)
          class AIRequest:
              schema_version: int
              request_id: str
              idempotency_key: str
              model_id: str
              prompt: str
              system_prompt: str | None
              max_output_tokens: int
              temperature: Decimal
              timeout_seconds: float
              created_at: int
              metadata: Mapping[str, str] = field(
                  default_factory=lambda: MappingProxyType({})
              )

              def __post_init__(self) -> None:
                  if self.schema_version != SCHEMA_VERSION:
                      raise ValueError("Unsupported request schema version")

                  request_id = self.request_id.strip()
                  idempotency_key = self.idempotency_key.strip()
                  model_id = self.model_id.strip()

                  if not request_id:
                      raise ValueError("request_id is required")

                  if not idempotency_key:
                      raise ValueError("idempotency_key is required")

                  if len(idempotency_key) > 512:
                      raise ValueError("idempotency_key exceeds size limit")

                  if not model_id:
                      raise ValueError("model_id is required")

                  _validate_text(
                      self.prompt,
                      "prompt",
                      MAX_PROMPT_BYTES,
                  )

                  if self.system_prompt is not None:
                      _validate_text(
                          self.system_prompt,
                          "system_prompt",
                          MAX_SYSTEM_PROMPT_BYTES,
                      )

                  if not 1 <= self.max_output_tokens <= 10_000_000:
                      raise ValueError("Invalid max_output_tokens")

                  if not self.temperature.is_finite():
                      raise ValueError("temperature must be finite")

                  if not Decimal("0") <= self.temperature <= Decimal("2"):
                      raise ValueError("temperature must be between 0 and 2")

                  if not 0 < self.timeout_seconds <= 1800:
                      raise ValueError(
                          "timeout_seconds must be greater than 0 and <= 1800"
                      )

                  if self.created_at <= 0:
                      raise ValueError("created_at must be positive")

                  object.__setattr__(self, "request_id", request_id)
                  object.__setattr__(self, "idempotency_key", idempotency_key)
                  object.__setattr__(self, "model_id", model_id)
                  object.__setattr__(
                      self,
                      "metadata",
                      _freeze_metadata(self.metadata),
                  )


          @dataclass(frozen=True, slots=True)
          class AIUsage:
              input_tokens: int
              output_tokens: int
              total_tokens: int
              estimated_cost: Decimal

              def __post_init__(self) -> None:
                  if self.input_tokens < 0:
                      raise ValueError("input_tokens cannot be negative")

                  if self.output_tokens < 0:
                      raise ValueError("output_tokens cannot be negative")

                  expected = self.input_tokens + self.output_tokens

                  if self.total_tokens != expected:
                      raise ValueError("total_tokens does not match token counts")

                  if (
                      self.estimated_cost < 0
                      or not self.estimated_cost.is_finite()
                  ):
                      raise ValueError("Invalid estimated_cost")


          @dataclass(frozen=True, slots=True)
          class AIResponse:
              schema_version: int
              request_id: str
              model_id: str
              provider: str
              output: str
              usage: AIUsage
              created_at: int
              completed_at: int
              response_id: str
              metadata: Mapping[str, str] = field(
                  default_factory=lambda: MappingProxyType({})
              )

              def __post_init__(self) -> None:
                  if self.schema_version != SCHEMA_VERSION:
                      raise ValueError("Unsupported response schema version")

                  if not self.request_id.strip():
                      raise ValueError("request_id is required")

                  if not self.model_id.strip():
                      raise ValueError("model_id is required")

                  if not self.provider.strip():
                      raise ValueError("provider is required")

                  if not self.response_id.strip():
                      raise ValueError("response_id is required")

                  if self.created_at <= 0:
                      raise ValueError("created_at must be positive")

                  if self.completed_at < self.created_at:
                      raise ValueError(
                          "completed_at cannot precede created_at"
                      )

                  if len(self.output.encode("utf-8")) > MAX_PROMPT_BYTES:
                      raise ValueError("AI output exceeds size limit")

                  object.__setattr__(
                      self,
                      "metadata",
                      _freeze_metadata(self.metadata),
                  )
          PY

          cat > shared_engines/ai/serialization.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import fields, is_dataclass
          from decimal import Decimal
          from enum import Enum
          from typing import Any


          def normalize(value: Any) -> Any:
              if isinstance(value, Decimal):
                  return {
                      "__type__": "decimal",
                      "value": format(value, "f"),
                  }

              if isinstance(value, Enum):
                  return {
                      "__type__": "enum",
                      "class": f"{type(value).__module__}.{type(value).__qualname__}",
                      "value": value.value,
                  }

              if is_dataclass(value):
                  return {
                      field.name: normalize(getattr(value, field.name))
                      for field in fields(value)
                  }

              if isinstance(value, dict):
                  return {
                      str(key): normalize(value[key])
                      for key in sorted(
                          value,
                          key=lambda item: str(item),
                      )
                  }

              if isinstance(value, (list, tuple)):
                  return [normalize(item) for item in value]

              if isinstance(value, (set, frozenset)):
                  normalized = [normalize(item) for item in value]
                  return sorted(
                      normalized,
                      key=lambda item: json.dumps(
                          item,
                          ensure_ascii=False,
                          sort_keys=True,
                          separators=(",", ":"),
                      ),
                  )

              if isinstance(value, (str, int, float, bool)) or value is None:
                  return value

              raise TypeError(
                  f"Unsupported serialization type: {type(value).__name__}"
              )


          def canonical_json(value: Any) -> bytes:
              return json.dumps(
                  normalize(value),
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")


          def sha256_hex(value: Any) -> str:
              return hashlib.sha256(canonical_json(value)).hexdigest()
          PY

          cat > shared_engines/ai/codec.py <<'PY'
          from __future__ import annotations

          import json
          from decimal import Decimal
          from types import MappingProxyType

          from .contracts import AIRequest, AIResponse, AIUsage


          def request_to_dict(request: AIRequest) -> dict[str, object]:
              return {
                  "schema_version": request.schema_version,
                  "request_id": request.request_id,
                  "idempotency_key": request.idempotency_key,
                  "model_id": request.model_id,
                  "prompt": request.prompt,
                  "system_prompt": request.system_prompt,
                  "max_output_tokens": request.max_output_tokens,
                  "temperature": str(request.temperature),
                  "timeout_seconds": request.timeout_seconds,
                  "created_at": request.created_at,
                  "metadata": dict(request.metadata),
              }


          def request_to_json(request: AIRequest) -> str:
              return json.dumps(
                  request_to_dict(request),
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )


          def response_to_dict(response: AIResponse) -> dict[str, object]:
              return {
                  "schema_version": response.schema_version,
                  "request_id": response.request_id,
                  "model_id": response.model_id,
                  "provider": response.provider,
                  "output": response.output,
                  "usage": {
                      "input_tokens": response.usage.input_tokens,
                      "output_tokens": response.usage.output_tokens,
                      "total_tokens": response.usage.total_tokens,
                      "estimated_cost": str(
                          response.usage.estimated_cost
                      ),
                  },
                  "created_at": response.created_at,
                  "completed_at": response.completed_at,
                  "response_id": response.response_id,
                  "metadata": dict(response.metadata),
              }


          def response_to_json(response: AIResponse) -> str:
              return json.dumps(
                  response_to_dict(response),
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )


          def response_from_json(payload: str) -> AIResponse:
              data = json.loads(payload)

              if not isinstance(data, dict):
                  raise ValueError("Stored response must be an object")

              usage = data["usage"]

              if not isinstance(usage, dict):
                  raise ValueError("Stored usage must be an object")

              return AIResponse(
                  schema_version=int(data["schema_version"]),
                  request_id=str(data["request_id"]),
                  model_id=str(data["model_id"]),
                  provider=str(data["provider"]),
                  output=str(data["output"]),
                  usage=AIUsage(
                      input_tokens=int(usage["input_tokens"]),
                      output_tokens=int(usage["output_tokens"]),
                      total_tokens=int(usage["total_tokens"]),
                      estimated_cost=Decimal(
                          str(usage["estimated_cost"])
                      ),
                  ),
                  created_at=int(data["created_at"]),
                  completed_at=int(data["completed_at"]),
                  response_id=str(data["response_id"]),
                  metadata=MappingProxyType(
                      {
                          str(key): str(value)
                          for key, value in data.get(
                              "metadata",
                              {},
                          ).items()
                      }
                  ),
              )


          def request_from_json(payload: str) -> AIRequest:
              data = json.loads(payload)

              if not isinstance(data, dict):
                  raise ValueError("Stored request must be an object")

              return AIRequest(
                  schema_version=int(data["schema_version"]),
                  request_id=str(data["request_id"]),
                  idempotency_key=str(data["idempotency_key"]),
                  model_id=str(data["model_id"]),
                  prompt=str(data["prompt"]),
                  system_prompt=(
                      None
                      if data.get("system_prompt") is None
                      else str(data["system_prompt"])
                  ),
                  max_output_tokens=int(data["max_output_tokens"]),
                  temperature=Decimal(str(data["temperature"])),
                  timeout_seconds=float(data["timeout_seconds"]),
                  created_at=int(data["created_at"]),
                  metadata=MappingProxyType(
                      {
                          str(key): str(value)
                          for key, value in data.get(
                              "metadata",
                              {},
                          ).items()
                      }
                  ),
              )
