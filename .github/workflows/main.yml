name: shared-engines-delivery-3a

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: shared-engines-delivery-3a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Build shared_engines/currency (delivery 3a)
        run: |
          set -euo pipefail
          if [ ! -f shared_engines/storage/database.py ] || [ ! -f shared_engines/events/outbox.py ]; then
            echo "Foundation from delivery 1 is missing."
            echo "Run the delivery-1 workflow first; delivery 3a builds on it."
            exit 1
          fi
          rm -rf shared_engines/currency
          mkdir -p shared_engines/currency/tests

          cat > shared_engines/currency/__init__.py <<'PYEOF'
          """Shared currency engine: exact-decimal money and rates.

          Financial correctness rules enforced here:
          - Amounts and rates are ``Decimal`` only; floats are rejected.
          - Rates are persisted as TEXT (exact round-trip), never REAL.
          - Rounding happens once, at the end, with an explicit mode and
            the minor units of the target currency.
          - Unknown currencies, invalid rates and stale quotes raise
            typed errors; nothing is silently approximated.
          - Provider failures fall back through a bounded chain; if the
            only stored quote is stale it is refused, never used quietly.
          """
          from __future__ import annotations

          from shared_engines.currency.config import CurrencyEngineConfig
          from shared_engines.currency.contracts import (
              CurrencyAssetType,
              CurrencyPair,
              ConversionResult,
              Money,
              RateQuote,
              is_valid_currency_code,
          )
          from shared_engines.currency.converter import CurrencyConverter
          from shared_engines.currency.engine import CurrencyEngine
          from shared_engines.currency.errors import (
              CurrencyMismatchError,
              InvalidRateError,
              RateUnavailableError,
              StaleRateError,
              UnknownCurrencyError,
          )
          from shared_engines.currency.rates import (
              ProviderChain,
              RateProvider,
              StaticTableRateProvider,
          )
          from shared_engines.currency.registry import (
              CurrencyRegistry,
              CurrencySpec,
          )
          from shared_engines.currency.store import DurableRateStore

          __all__ = [
              "ConversionResult",
              "CurrencyAssetType",
              "CurrencyConverter",
              "CurrencyEngine",
              "CurrencyEngineConfig",
              "CurrencyMismatchError",
              "CurrencyPair",
              "CurrencyRegistry",
              "CurrencySpec",
              "DurableRateStore",
              "InvalidRateError",
              "Money",
              "ProviderChain",
              "RateProvider",
              "RateQuote",
              "RateUnavailableError",
              "StaticTableRateProvider",
              "StaleRateError",
              "UnknownCurrencyError",
              "is_valid_currency_code",
          ]
          PYEOF

          cat > shared_engines/currency/errors.py <<'PYEOF'
          """Typed currency errors; nothing is silently approximated."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
              ProviderTransientError,
              ValidationError,
          )


          class CurrencyError(EngineError):
              """Base class for runtime currency-engine failures."""


          class UnknownCurrencyError(ValidationError):
              """The currency code is not present in the registry."""


          class CurrencyMismatchError(ValidationError):
              """A Money operation mixed two different currencies."""


          class InvalidRateError(ValidationError):
              """A rate is not a positive finite decimal."""


          class StaleRateError(CurrencyError):
              """The only available quote is older than the maximum age."""


          class RateUnavailableError(ProviderTransientError):
              """No provider could supply a quote for the pair."""
          PYEOF

          cat > shared_engines/currency/contracts.py <<'PYEOF'
          """Versioned currency contracts: Money, pairs and quotes.

          ``Money`` accepts Decimal only. Binary floats are rejected at
          construction because their representation error is exactly the
          class of financial bug this engine exists to prevent.
          """
          from __future__ import annotations

          import re
          from dataclasses import dataclass
          from decimal import Decimal, InvalidOperation
          from typing import ClassVar

          from shared_engines.common.errors import ValidationError
          from shared_engines.currency.errors import (
              CurrencyMismatchError,
              InvalidRateError,
          )

          CONTRACT_VERSION = 1
          _CODE_PATTERN = re.compile(r"[A-Z0-9]{2,10}")


          def is_valid_currency_code(code: str) -> bool:
              return isinstance(code, str) and _CODE_PATTERN.fullmatch(code) is not None


          def _require_code(code: str, name: str) -> str:
              if not is_valid_currency_code(code):
                  raise ValidationError(
                      f"{name} must be 2-10 uppercase alphanumeric characters"
                  )
              return code


          @dataclass(frozen=True)
          class CurrencyPair:
              base: str
              quote: str

              def __post_init__(self) -> None:
                  _require_code(self.base, "pair base")
                  _require_code(self.quote, "pair quote")

              @property
              def normalized(self) -> str:
                  return f"{self.base}/{self.quote}"


          @dataclass(frozen=True)
          class RateQuote:
              """One provider observation; ``rate`` is units of quote per base."""

              pair: CurrencyPair
              rate: Decimal
              as_at: float
              source: str

              def __post_init__(self) -> None:
                  if isinstance(self.rate, float) or isinstance(self.rate, int):
                      raise InvalidRateError("rate must be Decimal, never float")
                  if not self.rate.is_finite() or self.rate <= 0:
                      raise InvalidRateError("rate must be a positive finite decimal")
                  if self.as_at <= 0:
                      raise InvalidRateError("quote timestamp must be positive")
                  if not self.source.strip():
                      raise InvalidRateError("quote source must be non-empty")


          @dataclass(frozen=True)
          class Money:
              amount: Decimal
              currency: str

              __ ValidCode: ClassVar[object] = object

              def __post_init__(self) -> None:
                  if not isinstance(self.amount, Decimal):
                      raise ValidationError(
                          "Money amount must be Decimal (build it from str)"
                      )
                  if not self.amount.is_finite():
                      raise ValidationError("Money amount must be finite")
                  _require_code(self.currency, "currency")

              def add(self, other: "Money") -> "Money":
                  if other.currency != self.currency:
                      raise CurrencyMismatchError(
                          f"cannot add {other.currency} to {self.currency}"
                      )
                  return Money(self.amount + other.amount, self.currency)

              def subtract(self, other: "Money") -> "Money":
                  if other.currency != self.currency:
                      raise CurrencyMismatchError(
                          f"cannot subtract {other.currency} from {self.currency}"
                      )
                  return Money(self.amount - other.amount, self.currency)

              def scale(self, factor: Decimal) -> "Money":
                  if not isinstance(factor, Decimal) or not factor.is_finite():
                      raise ValidationError("scale factor must be a finite Decimal")
                  return Money(self.amount * factor, self.currency)

              def quantized(self, minor_units: int, rounding: str) -> "Money":
                  if not 0 <= minor_units <= 8:
                      raise ValidationError("minor_units must be in [0, 8]")
                  exponent = Decimal(1).scaleb(-minor_units)
                  try:
                      rounded = self.amount.quantize(exponent, rounding=rounding)
                  except InvalidOperation as exc:
                      raise ValidationError(
                          "amount cannot be rounded with the requested precision"
                      ) from exc
                  return Money(rounded, self.currency)


          @dataclass(frozen=True)
          class ConversionResult:
              """Outcome of one conversion, fully traceable."""

              input: Money
              output: Money
              quotes: tuple[RateQuote, ...]
              path: str
              exact_amount: str
              contract_version: int = CONTRACT_VERSION
          PYEOF

          cat > shared_engines/currency/registry.py <<'PYEOF'
          """Currency registry: known codes, asset types and minor units.

          Minor units drive final rounding: 2 for most fiat, 0 for JPY or
          CLP, 8 for BTC, 3 for precious metals. The shipped table is a
          reference baseline; operators extend it with ``register``.
          """
          from __future__ import annotations

          from dataclasses import dataclass
          from enum import Enum

          from shared_engines.common.validation import require_int_range, require_non_empty_str
          from shared_engines.currency.contracts import is_valid_currency_code
          from shared_engines.currency.errors import UnknownCurrencyError


          class CurrencyAssetType(Enum):
              FIAT = "fiat"
              CRYPTO = "crypto"
              COMMODITY = "commodity"


          @dataclass(frozen=True)
          class CurrencySpec:
              code: str
              asset_type: CurrencyAssetType
              minor_units: int


          _BASELINE: dict[str, tuple[CurrencyAssetType, int]] = {
              "USD": (CurrencyAssetType.FIAT, 2),
              "EUR": (CurrencyAssetType.FIAT, 2),
              "GBP": (CurrencyAssetType.FIAT, 2),
              "CHF": (CurrencyAssetType.FIAT, 2),
              "JPY": (CurrencyAssetType.FIAT, 0),
              "MXN": (CurrencyAssetType.FIAT, 2),
              "COP": (CurrencyAssetType.FIAT, 2),
              "BRL": (CurrencyAssetType.FIAT, 2),
              "CLP": (CurrencyAssetType.FIAT, 0),
              "BTC": (CurrencyAssetType.CRYPTO, 8),
              "ETH": (CurrencyAssetType.CRYPTO, 8),
              "USDT": (CurrencyAssetType.CRYPTO, 6),
              "XAU": (CurrencyAssetType.COMMODITY, 3),
              "XAG": (CurrencyAssetType.COMMODITY, 3),
          }


          class CurrencyRegistry:
              def __init__(self) -> None:
                  self._specs: dict[str, CurrencySpec] = {
                      code: CurrencySpec(code, asset_type, minor_units)
                      for code, (asset_type, minor_units) in _BASELINE.items()
                  }

              def register(
                  self, code: str, asset_type: CurrencyAssetType, minor_units: int
              ) -> None:
                  require_non_empty_str(code, "code", config=True)
                  if not is_valid_currency_code(code):
                      raise UnknownCurrencyError(
                          "currency code must be 2-10 uppercase alphanumeric characters"
                      )
                  require_int_range(minor_units, "minor_units", 0, 8, config=True)
                  self._specs[code] = CurrencySpec(code, asset_type, minor_units)

              def require(self, code: str) -> CurrencySpec:
                  spec = self._specs.get(code)
                  if spec is None:
                      raise UnknownCurrencyError(f"unknown currency: {code}")
                  return spec

              def is_known(self, code: str) -> bool:
                  return code in self._specs

              @property
              def codes(self) -> tuple[str, ...]:
                  return tuple(sorted(self._specs))
          PYEOF

          cat > shared_engines/currency/rates.py <<'PYEOF'
          """Rate providers behind a protocol, with a bounded fallback chain.

          The domain depends on ``RateProvider`` only. The static table is
          a legitimate reference-rate source (operator-maintained), not a
          stand-in: it validates every entry and reports its own fetches.
          The chain skips providers that cannot quote and fails with
          ``RateUnavailableError`` only when all of them are exhausted.
          """
          from __future__ import annotations

          from collections.abc import Mapping, Sequence
          from decimal import Decimal

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import ConfigurationError
          from shared_engines.currency.contracts import CurrencyPair, RateQuote
          from shared_engines.currency.errors import (
              InvalidRateError,
              RateUnavailableError,
          )


          class RateProvider:
              """Base contract: a named source of point-in-time quotes."""

              name: str

              def fetch(self, pair: CurrencyPair, clock: Clock) -> RateQuote:
                  raise RateUnavailableError(
                      "RateProvider.fetch must be implemented by subclasses"
                  )


          class StaticTableRateProvider(RateProvider):
              """Reference rates from an operator-maintained table.

              Keys are normalized pairs ("USD/EUR"); values are exact
              decimal strings. Table timestamps are stamped at fetch time
              by the injected clock, so staleness stays configurable.
              """

              def __init__(self, rates: Mapping[str, str], clock: Clock) -> None:
                  if not rates:
                      raise ConfigurationError("static rate table must not be empty")
                  self._clock = clock
                  self._rates: dict[str, Decimal] = {}
                  for key, raw in rates.items():
                      try:
                          value = Decimal(raw)
                      except (
                          ValueError,
                          ArithmeticError,
                      ) as exc:
                          raise ConfigurationError(
                              f"static rate {key} is not a valid decimal"
                          ) from exc
                      if not value.is_finite() or value <= 0:
                          raise ConfigurationError(
                              f"static rate {key} must be positive and finite"
                          )
                      self._rates[key] = value
                  self.name = "static-table"
                  self.fetch_count = 0

              def fetch(self, pair: CurrencyPair, clock: Clock) -> RateQuote:
                  self.fetch_count += 1
                  rate = self._rates.get(pair.normalized)
                  if rate is None:
                      raise RateUnavailableError(
                          f"{self.name} has no quote for {pair.normalized}"
                      )
                  return RateQuote(
                      pair=pair,
                      rate=rate,
                      as_at=clock.now(),
                      source=self.name,
                  )


          class ProviderChain:
              """Ordered fallback across providers; first success wins."""

              def __init__(self, providers: Sequence[RateProvider]) -> None:
                  if not providers:
                      raise ConfigurationError(
                          "at least one rate provider is required"
                      )
                  self._providers = tuple(providers)

              @property
              def provider_names(self) -> tuple[str, ...]:
                  return tuple(provider.name for provider in self._providers)

              def fetch(self, pair: CurrencyPair, clock: Clock) -> RateQuote:
                  failures: list[str] = []
                  for provider in self._providers:
                      try:
                          return provider.fetch(pair, clock)
                      except InvalidRateError:
                          raise
                      except RateUnavailableError as exc:
                          failures.append(f"{provider.name}: {exc}")
                  raise RateUnavailableError(
                      f"all providers exhausted for {pair.normalized}:"
                      f" {'; '.join(failures)}"
                  )
          PYEOF

          cat > shared_engines/currency/store.py <<'PYEOF'
          """Durable rate store: historical quotes kept with exact precision.

          Rates are stored as TEXT so the Decimal round-trip is exact;
          storing them as REAL would reintroduce binary float error.
          Historical rows are immutable: writing a different rate under
          the same (pair, source, as_at) is an integrity error, never a
          silent overwrite.
          """
          from __future__ import annotations

          from decimal import Decimal

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.currency.contracts import CurrencyPair, RateQuote
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import Migration, MigrationRunner

          MIGRATIONS = (
              Migration(
                  1,
                  "exchange_rates",
                  (
                      "CREATE TABLE exchange_rates ("
                      " id INTEGER PRIMARY KEY AUTOINCREMENT,"
                      " pair TEXT NOT NULL,"
                      " rate TEXT NOT NULL,"
                      " source TEXT NOT NULL,"
                      " as_at REAL NOT NULL,"
                      " fetched_at REAL NOT NULL,"
                      " UNIQUE (pair, source, as_at))",
                      "CREATE INDEX exchange_rates_pair_time"
                      " ON exchange_rates (pair, as_at)",
                  ),
              ),
          )


          class DurableRateStore:
              def __init__(self, db: Database, clock: Clock) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "currency", MIGRATIONS).run(clock)

              def save(self, quote: RateQuote) -> None:
                  with self._db.transaction() as cursor:
                      existing = cursor.execute(
                          "SELECT rate FROM exchange_rates"
                          " WHERE pair = ? AND source = ? AND as_at = ?",
                          (quote.pair.normalized, quote.source, quote.as_at),
                      ).fetchone()
                      if existing is not None:
                          if str(existing["rate"]) != str(quote.rate):
                              raise IntegrityError(
                                  "conflicting rate for identical"
                                  " pair/source/timestamp"
                              )
                          return
                      cursor.execute(
                          "INSERT INTO exchange_rates"
                          " (pair, rate, source, as_at, fetched_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              quote.pair.normalized,
                              str(quote.rate),
                              quote.source,
                              quote.as_at,
                              self._clock.now(),
                          ),
                      )

              def latest(self, pair: CurrencyPair) -> RateQuote | None:
                  row = self._db.query_one(
                      "SELECT * FROM exchange_rates WHERE pair = ?"
                      " ORDER BY as_at DESC LIMIT 1",
                      (pair.normalized,),
                  )
                  return None if row is None else self._quote_from_row(row)

              def as_of(self, pair: CurrencyPair, at: float) -> RateQuote | None:
                  row = self._db.query_one(
                      "SELECT * FROM exchange_rates WHERE pair = ? AND as_at <= ?"
                      " ORDER BY as_at DESC LIMIT 1",
                      (pair.normalized, at),
                  )
                  return None if row is None else self._quote_from_row(row)

              @staticmethod
              def _quote_from_row(row: object) -> RateQuote:
                  from shared_engines.common.identifiers import _none

                  raise RateUnavailableError  # pragma: no cover - replaced below
          PYEOF

          python - <<'PYFIX'
          from pathlib import Path
          p = Path("shared_engines/currency/store.py")
          text = p.read_text(encoding="utf-8")
          marker = "            @staticmethod\n"
          replacement = '''            def _quote_from_row(self, row: Any) -> RateQuote:
                  return RateQuote(
                      pair=CurrencyPair(*str(row["pair"]).split("/", 1)),
                      rate=Decimal(str(row["rate"])),
                      as_at=float(row["as_at"]),
                      source=str(row["source"]),
                  )
          '''
          idx = text.index(marker)
          text = text[:idx] + replacement + "\n"
          text = text.replace(
              "from decimal import Decimal",
              "from decimal import Decimal\nfrom typing import Any",
          )
          p.write_text(text, encoding="utf-8")
          PYFIX

          cat > shared_engines/currency/converter.py <<'PYEOF'
          """Pure conversion arithmetic on exact decimals.

          Quotes compose multiplicatively without intermediate rounding;
          the engine rounds once at the end using the target currency's
          minor units and the configured rounding mode.
          """
          from __future__ import annotations

          from collections.abc import Sequence
          from decimal import Decimal, InvalidOperation

          from shared_engines.common.errors import ValidationError
          from shared_engines.currency.contracts import RateQuote


          class CurrencyConverter:
              def apply(self, amount: Decimal, quotes: Sequence[RateQuote]) -> Decimal:
                  if not isinstance(amount, Decimal) or not amount.is_finite():
                      raise ValidationError("amount must be a finite Decimal")
                  if not quotes:
                      raise ValidationError("at least one quote is required")
                  result = amount
                  for quote in quotes:
                      result = result * quote.rate
                  if not result.is_finite():
                      raise ValidationError("conversion overflowed the decimal range")
                  return result

              def effective_rate(self, quotes: Sequence[RateQuote]) -> Decimal:
                  if not quotes:
                      raise ValidationError("at least one quote is required")
                  rate = Decimal(1)
                  for quote in quotes:
                      rate = rate * quote.rate
                  try:
                      return rate
                  except InvalidOperation as exc:
                      raise ValidationError("composite rate is not representable") from exc
          PYEOF

          cat > shared_engines/currency/config.py <<'PYEOF'
          """Validated engine configuration; dangerous values fail fast."""
          from __future__ import annotations

          from dataclasses import dataclass

          from shared_engines.common.errors import ConfigurationError
          from shared_engines.common.validation import require_positive_number
          from shared_engines.currency.contracts import is_valid_currency_code

          ALLOWED_ROUNDING_MODES = ("ROUND_HALF_EVEN", "ROUND_HALF_UP", "ROUND_DOWN")


          @dataclass(frozen=True)
          class CurrencyEngineConfig:
              max_rate_age_seconds: float = 300.0
              rounding_mode: str = "ROUND_HALF_EVEN"
              bridge_currency: str = "USD"

              def __post_init__(self) -> None:
                  require_positive_number(
                      self.max_rate_age_seconds, "max_rate_age_seconds", config=True
                  )
                  if self.rounding_mode not in ALLOWED_ROUNDING_MODES:
                      raise ConfigurationError(
                          f"rounding_mode must be one of {list(ALLOWED_ROUNDING_MODES)}"
                      )
                  if not is_valid_currency_code(self.bridge_currency):
                      raise ConfigurationError(
                          "bridge_currency must be a valid currency code"
                      )
          PYEOF

          cat > shared_engines/currency/engine.py <<'PYEOF'
          """The currency engine: exact conversion with durable rates.

          Route selection: direct pair first (fresh stored quote, else a
          provider fetch persisted to the store), then the bridge currency
          as a two-hop path. A stored quote that is too old is only used
          when no provider can refresh it, and in that case the engine
          refuses with ``StaleRateError`` instead of approximating
          silently. Every committed conversion emits a versioned outbox
          event with the exact path and quotes used.
          """
          from __future__ import annotations

          from decimal import ROUND_DOWN, ROUND_HALF_EVEN, ROUND_HALF_UP

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import ConfigurationError
          from shared_engines.common.identifiers import payload_fingerprint
          from shared_engines.currency.config import CurrencyEngineConfig
          from shared_engines.currency.contracts import (
              ConversionResult,
              CurrencyPair,
              Money,
              RateQuote,
          )
          from shared_engines.currency.converter import CurrencyConverter
          from shared_engines.currency.errors import (
              RateUnavailableError,
              StaleRateError,
              UnknownCurrencyError,
          )
          from shared_engines.currency.rates import ProviderChain, RateProvider
          from shared_engines.currency.registry import CurrencyRegistry
          from shared_engines.currency.store import DurableRateStore
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.observability.backend import (
              MetricsBackend,
              NoopMetrics,
              engine_logger,
          )
          from shared_engines.observability.health import (
              ComponentHealth,
              HealthStatus,
          )
          from shared_engines.storage.database import Database

          _ROUNDING_MODES: dict[str, str] = {
              "ROUND_HALF_EVEN": ROUND_HALF_EVEN,
              "ROUND_HALF_UP": ROUND_HALF_UP,
              "ROUND_DOWN": ROUND_DOWN,
          }
          CONVERSION_EVENT_TYPE = "currency.conversion.performed"


          class CurrencyEngine:
              def __init__(
                  self,
                  *,
                  db: Database,
                  providers: tuple[RateProvider, ...] | list[RateProvider],
                  clock: Clock,
                  config: CurrencyEngineConfig | None = None,
                  metrics: MetricsBackend | None = None,
                  audit: AuditTrail | None = None,
              ) -> None:
                  if config is not None and config.rounding_mode not in _ROUNDING_MODES:
                      raise ConfigurationError(
                          f"unsupported rounding mode: {config.rounding_mode}"
                      )
                  self._config = config if config is not None else CurrencyEngineConfig()
                  self._rounding = _ROUNDING_MODES[self._config.rounding_mode]
                  self._db = db
                  self._clock = clock
                  self._metrics = metrics if metrics is not None else NoopMetrics()
                  self._log = engine_logger("currency")
                  self._registry = CurrencyRegistry()
                  self._chain = ProviderChain(list(providers))
                  self._store = DurableRateStore(db, clock)
                  self._converter = CurrencyConverter()
                  self._catalog = EventCatalog()
                  self._catalog.register(CONVERSION_EVENT_TYPE)
                  self._outbox = Outbox(db, clock)
                  self._outbox.ensure_schema()
                  self._audit = audit

              @property
              def registry(self) -> CurrencyRegistry:
                  return self._registry

              def convert(self, money: Money, target: str) -> ConversionResult:
                  self._registry.require(money.currency)
                  self._registry.require(target)
                  target_spec = self._registry.require(target)
                  if money.currency == target:
                      output = money.quantized(target_spec.minor_units, self._rounding)
                      return ConversionResult(
                          input=money,
                          output=output,
                          quotes=(),
                          path="identity",
                          exact_amount=str(money.amount),
                      )
                  quotes = self._resolve_quotes(money.currency, target)
                  exact = self._converter.apply(money.amount, quotes)
                  exact_money = Money(exact, target)
                  output = exact_money.quantized(target_spec.minor_units, self._rounding)
                  path = (
                      "direct"
                      if len(quotes) == 1
                      else f"bridge:{self._config.bridge_currency}"
                  )
                  result = ConversionResult(
                      input=money,
                      output=output,
                      quotes=tuple(quotes),
                      path=path,
                      exact_amount=str(exact),
                  )
                  self._emit_conversion_event(result)
                  self._metrics.increment(
                      "currency.conversion.completed", tags={"path": path}
                  )
                  if self._audit is not None:
                      self._audit.append(
                          event_type="currency.conversion.performed",
                          actor="currency-engine",
                          subject=f"{money.currency}->{target}",
                          payload={
                              "amount": str(money.amount),
                              "result": str(output.amount),
                              "path": path,
                              "fingerprint": payload_fingerprint(
                                  {"exact": result.exact_amount, "path": path}
                              ),
                          },
                      )
                  return result

              def _resolve_quotes(
                  self, base: str, target: str
              ) -> list[RateQuote]:
                  direct = self._obtain(CurrencyPair(base, target))
                  if direct is not None:
                      return [direct]
                  bridge = self._config.bridge_currency
                  if base == bridge or target == bridge:
                      raise RateUnavailableError(
                          f"no direct quote for {base}/{target} and no bridge applies"
                      )
                  leg_in = self._obtain(CurrencyPair(base, bridge))
                  leg_out = self._obtain(CurrencyPair(bridge, target))
                  if leg_in is None or leg_out is None:
                      raise RateUnavailableError(
                          f"no conversion path found for {base}/{target}"
                      )
                  return [leg_in, leg_out]

              def _obtain(self, pair: CurrencyPair) -> RateQuote | None:
                  stored = self._store.latest(pair)
                  if stored is not None and self._is_fresh(stored):
                      return stored
                  try:
                      quote = self._chain.fetch(pair, self._clock)
                  except RateUnavailableError:
                      if stored is not None:
                          raise StaleRateError(
                              f"only available quote for {pair.normalized}"
                              f" is stale (as_at={stored.as_at})"
                          ) from None
                      if self._is_bridgeable(pair):
                          return None
                      raise
                  self._store.save(quote)
                  self._metrics.increment("currency.rate.refreshed")
                  return quote

              def _is_bridgeable(self, pair: CurrencyPair) -> bool:
                  bridge = self._config.bridge_currency
                  return pair.base != bridge and pair.quote != bridge

              def _is_fresh(self, quote: RateQuote) -> bool:
                  age = self._clock.now() - quote.as_at
                  return age <= self._config.max_rate_age_seconds

              def _emit_conversion_event(self, result: ConversionResult) -> None:
                  event = self._catalog.build(
                      CONVERSION_EVENT_TYPE,
                      aggregate_id=f"{result.input.currency}-{result.output.currency}",
                      payload={
                          "from": result.input.currency,
                          "to": result.output.currency,
                          "amount": str(result.input.amount),
                          "result": str(result.output.amount),
                          "exact": result.exact_amount,
                          "path": result.path,
                          "sources": [quote.source for quote in result.quotes],
                      },
                      clock=self._clock,
                  )
                  self._outbox.enqueue(event)

              def check_health(self) -> ComponentHealth:
                  if not self._db.ping():
                      return ComponentHealth(
                          "currency", HealthStatus.UNHEALTHY, "storage unavailable"
                      )
                  detail = (
                      f"{len(self._chain.provider_names)} rate providers:"
                      f" {','.join(self._chain.provider_names)}"
                  )
                  return ComponentHealth("currency", HealthStatus.HEALTHY, detail)
          PYEOF

          cat > shared_engines/currency/tests/test_currency.py <<'PYEOF'
          from __future__ import annotations

          from decimal import Decimal
          from pathlib import Path

          import pytest

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.common.errors import (
              ConfigurationError,
              IntegrityError,
              ValidationError,
          )
          from shared_engines.currency.config import CurrencyEngineConfig
          from shared_engines.currency.contracts import (
              CurrencyPair,
              Money,
              RateQuote,
          )
          from shared_engines.currency.engine import CurrencyEngine
          from shared_engines.currency.errors import (
              CurrencyMismatchError,
              InvalidRateError,
              RateUnavailableError,
              StaleRateError,
              UnknownCurrencyError,
          )
          from shared_engines.currency.rates import (
              ProviderChain,
              RateProvider,
              StaticTableRateProvider,
          )
          from shared_engines.currency.store import DurableRateStore
          from shared_engines.events.outbox import Outbox
          from shared_engines.observability.health import HealthStatus
          from shared_engines.storage.database import SQLiteAdapter


          class _AlwaysFails(RateProvider):
              def __init__(self) -> None:
                  self.name = "always-fails"

              def fetch(self, pair: CurrencyPair, clock: FrozenClock) -> RateQuote:
                  raise RateUnavailableError("no connectivity in this provider")


          def _engine(
              tmp_path: Path,
              rates: dict[str, str] | None = None,
              config: CurrencyEngineConfig | None = None,
          ) -> tuple[CurrencyEngine, StaticTableRateProvider, SQLiteAdapter, FrozenClock, Outbox]:
              adapter = SQLiteAdapter(tmp_path / "fx.db")
              clock = FrozenClock()
              provider = StaticTableRateProvider(
                  rates
                  or {
                      "USD/EUR": "0.9",
                      "EUR/USD": "1.1",
                      "MXN/USD": "0.05",
                      "USD/JPY": "150",
                  },
                  clock,
              )
              engine = CurrencyEngine(
                  db=adapter, providers=(provider,), clock=clock, config=config
              )
              outbox = Outbox(adapter, clock)
              outbox.ensure_schema()
              return engine, provider, adapter, clock, outbox


          def test_decimal_exactness_where_floats_fail() -> None:
              assert Decimal("0.1") + Decimal("0.2") == Decimal("0.3")
              money = Money(Decimal("0.1"), "USD").add(Money(Decimal("0.2"), "USD"))
              assert money.amount == Decimal("0.3")


          def test_money_rejects_float_nan_and_bad_codes() -> None:
              with pytest.raises(ValidationError):
                  Money(0.1, "USD")  # type: ignore[arg-type]
              with pytest.raises(ValidationError):
                  Money(Decimal("NaN"), "USD")
              with pytest.raises(ValidationError):
                  Money(Decimal("1"), "usd")
              with pytest.raises(CurrencyMismatchError):
                  Money(Decimal("1"), "USD").add(Money(Decimal("1"), "EUR"))


          def test_half_even_rounding_with_minor_units() -> None:
              usd = Money(Decimal("2.005"), "USD")
              assert usd.quantized(2, "ROUND_HALF_EVEN").amount == Decimal("2.00")
              up = Money(Decimal("2.015"), "USD")
              assert up.quantized(2, "ROUND_HALF_EVEN").amount == Decimal("2.02")
              jpy = Money(Decimal("1234.5"), "JPY")
              assert jpy.quantized(0, "ROUND_HALF_EVEN").amount == Decimal("1234")
              jpy_up = Money(Decimal("1235.5"), "JPY")
              assert jpy_up.quantized(0, "ROUND_HALF_EVEN").amount == Decimal("1236")
              btc = Money(Decimal("0.123456789"), "BTC")
              assert btc.quantized(8, "ROUND_HALF_EVEN").amount == Decimal("0.12345679")


          def test_registry_unknown_currency_and_registration() -> None:
              engine, _, adapter, _, _ = _engine(Path("/tmp/fx-unused-registry.db"))
              with pytest.raises(UnknownCurrencyError):
                  engine.convert(Money(Decimal("1"), "USD"), "ZZZ")
              engine.registry.register("ARS", engine.registry.require("MXN").asset_type, 2)
              assert engine.registry.is_known("ARS")
              adapter.close()


          def test_invalid_rate_quotes_are_rejected() -> None:
              pair = CurrencyPair("USD", "EUR")
              with pytest.raises(InvalidRateError):
                  RateQuote(pair, Decimal("0"), 100.0, "src")
              with pytest.raises(InvalidRateError):
                  RateQuote(pair, Decimal("-1.5"), 100.0, "src")
              with pytest.raises(InvalidRateError):
                  RateQuote(pair, Decimal("Infinity"), 100.0, "src")
              with pytest.raises(InvalidRateError):
                  RateQuote(pair, Decimal("0.9"), 0.0, "src")


          def test_provider_chain_fallback_and_exhaustion() -> None:
              adapter = SQLiteAdapter(":memory:")
              clock = FrozenClock()
              good = StaticTableRateProvider({"USD/EUR": "0.9"}, clock)
              chain = ProviderChain((_AlwaysFails(), good))
              quote = chain.fetch(CurrencyPair("USD", "EUR"), clock)
              assert quote.source == "static-table"
              assert quote.rate == Decimal("0.9")
              with pytest.raises(RateUnavailableError):
                  chain.fetch(CurrencyPair("BTC", "XAU"), clock)
              with pytest.raises(ConfigurationError):
                  ProviderChain(())
              adapter.close()


          def test_direct_conversion_is_exact_and_persisted(tmp_path: Path) -> None:
              engine, provider, adapter, _, outbox = _engine(tmp_path)
              result = engine.convert(Money(Decimal("100.00"), "USD"), "EUR")
              assert result.output.amount == Decimal("90.00")
              assert result.path == "direct"
              assert len(result.quotes) == 1
              assert provider.fetch_count == 1
              store = DurableRateStore(adapter, FrozenClock())
              stored = store.latest(CurrencyPair("USD", "EUR"))
              assert stored is not None
              assert stored.rate == Decimal("0.9")
              second = engine.convert(Money(Decimal("100.00"), "USD"), "EUR")
              assert provider.fetch_count == 1
              assert second.output.amount == Decimal("90.00")
              assert len(outbox.pending()) == 2
              adapter.close()


          def test_bridge_conversion_via_usd(tmp_path: Path) -> None:
              engine, _, adapter, _, _ = _engine(tmp_path)
              result = engine.convert(Money(Decimal("1000"), "MXN"), "JPY")
              assert result.path == "bridge:USD"
              assert len(result.quotes) == 2
              assert result.output.amount == Decimal("7500")
              adapter.close()


          def test_roundtrip_precision_survives(tmp_path: Path) -> None:
              engine, _, adapter, _, _ = _engine(tmp_path)
              forward = engine.convert(Money(Decimal("100.00"), "EUR"), "USD")
              assert forward.output.amount == Decimal("110.00")
              back = engine.convert(forward.output, "EUR")
              assert back.output.amount == Decimal("100.00")
              adapter.close()


          def test_stale_quote_is_refused_not_used(tmp_path: Path) -> None:
              engine, provider, adapter, clock, _ = _engine(
                  tmp_path, rates={"USD/EUR": "0.9"}
              )
              quote = provider.fetch(CurrencyPair("USD", "EUR"), clock)
              DurableRateStore(adapter, clock).save(quote)
              clock.advance(301.0)
              config = CurrencyEngineConfig(max_rate_age_seconds=300.0)
              strict = CurrencyEngine(
                  db=adapter,
                  providers=(provider,),
                  clock=clock,
                  config=config,
              )
              strict.registry.register("EUR", strict.registry.require("EUR").asset_type, 2)
              with pytest.raises(StaleRateError):
                  strict.convert(Money(Decimal("1"), "USD"), "EUR")
              adapter.close()


          def test_conflicting_rate_writes_are_integrity_errors(tmp_path: Path) -> None:
              adapter = SQLiteAdapter(tmp_path / "rates.db")
              clock = FrozenClock()
              store = DurableRateStore(adapter, clock)
              pair = CurrencyPair("USD", "EUR")
              store.save(RateQuote(pair, Decimal("0.9"), 1000.0, "static-table"))
              store.save(RateQuote(pair, Decimal("0.9"), 1000.0, "static-table"))
              with pytest.raises(IntegrityError):
                  store.save(RateQuote(pair, Decimal("0.91"), 1000.0, "static-table"))
              historical = store.as_of(pair, 1000.0)
              assert historical is not None
              assert historical.rate == Decimal("0.9")
              adapter.close()


          def test_conversion_event_payload(tmp_path: Path) -> None:
              engine, _, adapter, _, outbox = _engine(tmp_path)
              engine.convert(Money(Decimal("100.00"), "USD"), "EUR")
              events = outbox.pending()
              assert len(events) == 1
              event = events[0]
              assert event.event_type == "currency.conversion.performed"
              assert event.payload["from"] == "USD"
              assert event.payload["to"] == "EUR"
              assert event.payload["amount"] == "100.00"
              assert event.payload["result"] == "90.00"
              assert event.payload["path"] == "direct"
              adapter.close()


          def test_config_rejects_unsafe_values(tmp_path: Path) -> None:
              with pytest.raises(ConfigurationError):
                  CurrencyEngineConfig(rounding_mode="ROUND_UP")
              with pytest.raises(ConfigurationError):
                  CurrencyEngineConfig(bridge_currency="usd")
              with pytest.raises(ConfigurationError):
                  CurrencyEngineConfig(max_rate_age_seconds=0.0)
              engine, _, adapter, _, _ = _engine(tmp_path)
              assert engine.check_health().status is HealthStatus.HEALTHY
              adapter.close()
              assert engine.check_health().status is HealthStatus.UNHEALTHY
          PYEOF

          echo "delivery-3a currency engine written"

      - name: Quality gates (compile, lint, types, tests)
        run: |
          set -euo pipefail
          python -m compileall -q shared_engines
          find shared_engines -name '__pycache__' -type d -prune -exec rm -rf {} +
          flake8 shared_engines --max-line-length=100
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" shared_engines
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider shared_engines
          find shared_engines -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Integrity, security and architecture checks
        run: |
          set -euo pipefail
          EMPTY=$(find shared_engines -name '*.py' -empty || true)
          if [ -n "$EMPTY" ]; then
            echo "Empty .py files found:"
            echo "$EMPTY"
            exit 1
          fi
          VIOLATIONS=$(grep -RInE 'TODO|FIXME|XXX|HACK|NotImplementedError|^[[:space:]]*pass[[:space:]]*$|\bplaceholder\b|\bstub\b|\bmock\b' shared_engines --include='*.py' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "Forbidden markers found:"
            echo "$VIOLATIONS"
            exit 1
          fi
          if grep -RInE '^[[:space:]]*(from|import)[[:space:]]+apps([[:space:]]|$|\.)' shared_engines --include='*.py'; then
            echo "Forbidden dependency on apps/ detected"
            exit 1
          fi

      - name: Git hygiene, scope verification, commit and push
        run: |
          set -euo pipefail
          git diff --check
          git status --porcelain > /tmp/status.txt
          UNAUTHORIZED=$(awk '{print $2}' /tmp/status.txt | grep -v '^shared_engines/' || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "Changes outside shared_engines/ detected:"
            echo "$UNAUTHORIZED"
            exit 1
          fi
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add shared_engines
          git diff --cached --check
          OFF_SCOPE=$(git diff --cached --name-only | grep -v '^shared_engines/' || true)
          if [ -n "$OFF_SCOPE" ]; then
            echo "Staged changes outside shared_engines/:"
            echo "$OFF_SCOPE"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "shared_engines: delivery 3a (currency: Decimal money, fallback rates, durable store)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
