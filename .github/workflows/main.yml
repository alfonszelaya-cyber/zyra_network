          from __future__ import annotations

          import time
          from typing import Protocol


          class Clock(Protocol):
              def now(self) -> int:
                  ...


          class SystemClock:
              def now(self) -> int:
                  value = int(time.time())

                  if value <= 0:
                      raise RuntimeError("System clock returned an invalid time")

                  return value
