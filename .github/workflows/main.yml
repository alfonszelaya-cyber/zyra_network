name: shared-engines-delivery-1

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: shared-engines-delivery-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Rebuild shared_engines foundation (delivery 1)
        run: |
          set -euo pipefail
          rm -rf shared_engines
          mkdir -p shared_engines/common/tests shared_engines/observability/tests \
            shared_engines/storage/tests shared_engines/events/tests \
            shared_engines/audit/tests shared_engines/security/tests

          cat > shared_engines/__init__.py <<'PYEOF'
          """Zyra Network shared engines layer.

          Dependency direction is strict: apps -> shared_engines ->
          foundation (common, observability, storage, events). No module
          in this layer may import from ``apps`` or from any concrete
          application.
          """
          from __future__ import annotations

          __version__ = "1.0.0"
          LAYER_CONTRACT_VERSION = 1

          __all__ = ["LAYER_CONTRACT_VERSION", "__version__"]
          PYEOF

          cat > shared_engines/py.typed <<'EOF'
          # PEP 561 marker: this package ships inline types.
          EOF

          cat > shared_engines/conftest.py <<'PYEOF'
          """Pytest bootstrap: make the repository root importable."""
          from __future__ import annotations

          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))
          PYEOF

          cat > shared_engines/README.md <<'MDEOF'
          # shared_engines — delivery 1

          Foundation modules built in this delivery:

          - `common/`: typed errors, injectable clocks, canonical JSON,
            stable hashing, fail-fast validation, Result, pagination.
          - `observability/`: metrics backend protocol (noop / in-memory /
            composite) and real health checks with worst-status aggregation.
          - `storage/`: Database protocol + SQLiteAdapter (WAL, FULL sync,
            foreign keys, busy timeout, explicit transactions), checksummed
            immutable migrations per namespace, verified backup/restore.
          - `events/`: versioned event contracts with a central catalog,
            transactional outbox (at-least-once dispatch) and consumer
            inbox (dedup + effect in one transaction).
          - `audit/`: append-only hash chain, tamper-evident verification,
            checkpoints ready for external anchoring.
          - `security/`: AES-256-GCM envelope crypto with key versioning
            and rotation, KeyProvider as the KMS/HSM adapter point, and a
            SecurityEngine that drives audit + outbox + metrics for real.

          Rules: no module depends on `apps`; state survives restarts via
          adapters, never via memory; an applied migration is never
          silently rewritten; uncertain external outcomes are never
          retried blindly (recovery/fencing lands with the ai engine in
          delivery 2).

          External infrastructure mount points:
          - KMS/HSM/secret manager -> `security.keys.KeyProvider`
          - PostgreSQL/Kafka -> `storage.database.Database`
          - OpenTelemetry/Prometheus -> `observability.backend.MetricsBackend`
          - External audit anchoring -> consume `audit_checkpoints`
          MDEOF

