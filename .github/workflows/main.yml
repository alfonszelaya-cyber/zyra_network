          from __future__ import annotations

          import threading
          from dataclasses import dataclass
          from typing import Any, Mapping

          from observability.alerts import Alert, AlertManager
          from observability.events import ObservationEvent
          from observability.metrics import MetricsRegistry
          from observability.policy import ObservationPolicy
          from observability.storage import ObservationStore


          @dataclass(frozen=True, slots=True)
          class EngineResult:
              event_id: str
              stored: bool
              alerts: tuple[Alert, ...]


          class ObservationEngine:
              def __init__(
                  self,
                  store: ObservationStore,
                  metrics: MetricsRegistry,
                  alerts: AlertManager,
                  policy: ObservationPolicy,
              ):
                  self.store = store
                  self.metrics = metrics
                  self.alerts = alerts
                  self.policy = policy
                  self._lock = threading.RLock()

              def process(
                  self,
                  event: ObservationEvent,
              ) -> EngineResult:
                  payload = self.policy.sanitize(event.payload)

                  with self._lock:
                      stored = self.store.append(
                          observation_id=event.event_id,
                          kind=event.event_type.value,
                          name=event.name,
                          timestamp=event.timestamp,
                          payload=payload,
                      )

                      self.metrics.counter(
                          "observability.events.total",
                          labels={
                              "event_type": event.event_type.value,
                              "severity": event.severity.value,
                          },
                      )

                      if event.severity.value in {"error", "critical"}:
                          self.metrics.counter(
                              "observability.events.errors",
                              labels={
                                  "severity": event.severity.value
                              },
                          )

                      fired = self.alerts.evaluate(payload)

                  return EngineResult(
                      event_id=stored.observation_id,
                      stored=True,
                      alerts=tuple(fired),
                  )

              def record_metric(
                  self,
                  name: str,
                  value: float,
                  *,
                  labels: Mapping[str, str] | None = None,
              ) -> None:
                  self.metrics.observe(
                      name,
                      value,
                      labels=labels,
                  )
          PY

