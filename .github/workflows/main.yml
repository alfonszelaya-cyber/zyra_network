          from __future__ import annotations

          import hashlib
          import time
          import uuid
          from collections.abc import Iterable
          from decimal import Decimal

          from .budget import ExecutionBudget
          from .circuit import CircuitBreaker
          from .clock import Clock, SystemClock
          from .contracts import AIRequest, AIResponse
          from .errors import (
              AIBudgetExceeded,
              AICircuitOpenError,
              AIProviderError,
              AIProviderPermanentError,
              AIProviderTransientError,
              AIProviderUnavailable,
          )
          from .policy import ExecutionPolicy
          from .providers import AIProvider
          from .registry import ModelRegistry
          from .serialization import canonical_json, sha256_hex
          from .storage import SQLiteAIStore


          class AIEngine:
              """
              Long-lived AI orchestration engine.

              The engine is deliberately independent from application modules.
              Durable state is delegated to SQLiteAIStore or a compatible
              infrastructure adapter in future versions.
              """

              def __init__(
                  self,
                  registry: ModelRegistry,
                  providers: Iterable[AIProvider],
                  *,
                  store: SQLiteAIStore | None = None,
                  budget: ExecutionBudget | None = None,
                  policy: ExecutionPolicy | None = None,
                  clock: Clock | None = None,
                  failure_threshold: int = 5,
                  recovery_seconds: int = 30,
              ) -> None:
                  self._registry = registry
                  self._providers = tuple(providers)
                  self._store = store
                  self._budget = budget
                  self._policy = policy or ExecutionPolicy()
                  self._clock = clock or SystemClock()

                  if not self._providers:
                      raise ValueError("At least one AI provider is required")

                  names = tuple(
                      provider.name.strip()
                      for provider in self._providers
                  )

                  if any(not name for name in names):
                      raise ValueError("Provider names cannot be empty")

                  if len(set(names)) != len(names):
                      raise ValueError("Provider names must be unique")

                  self._circuits = {
                      provider.name: CircuitBreaker(
                          failure_threshold=failure_threshold,
                          recovery_seconds=recovery_seconds,
                      )
                      for provider in self._providers
                  }

              def _request_hash(
                  self,
                  request: AIRequest,
              ) -> str:
                  return hashlib.sha256(
                      canonical_json(
                          {
                              "schema_version": request.schema_version,
                              "model_id": request.model_id,
                              "prompt": request.prompt,
                              "system_prompt": request.system_prompt,
                              "max_output_tokens": request.max_output_tokens,
                              "temperature": request.temperature,
                              "metadata": dict(request.metadata),
                          }
                      )
                  ).hexdigest()

              def execute(
                  self,
                  request: AIRequest,
              ) -> AIResponse:
                  now = self._clock.now()

                  model = self._registry.get(request.model_id)

                  self._policy.validate(request, model)

                  if self._budget is not None:
                      self._budget.reserve_request()

                  owner = uuid.uuid4().hex
                  request_hash = self._request_hash(request)

                  if self._store is not None:
                      reservation = self._store.reserve(
                          request=request,
                          request_hash=request_hash,
                          owner=owner,
                          now=now,
                          lease_seconds=self._policy.lease_seconds,
                      )

                      if reservation.response is not None:
                          return reservation.response

                  failures: list[str] = []

                  deadline = time.monotonic() + request.timeout_seconds

                  for provider in self._providers:
                      if not any(
                          item.model_id == model.model_id
                          for item in provider.models()
                      ):
                          continue

                      circuit = self._circuits[provider.name]

                      if not circuit.allow(now=now):
                          failures.append(
                              f"{provider.name}: circuit-open"
                          )
                          continue

                      for attempt in range(
                          self._policy.max_attempts
                      ):
                          if time.monotonic() >= deadline:
                              failures.append(
                                  f"{provider.name}: request-timeout"
                              )
                              break

                          try:
                              response = provider.complete(
                                  request,
                                  model,
                              )

                              circuit.success()

                              if self._policy.maximum_cost_per_request is not None:
                                  if (
                                      response.usage.estimated_cost
                                      > self._policy.maximum_cost_per_request
                                  ):
                                      raise AIBudgetExceeded(
                                          "Per-request AI cost limit exceeded"
                                      )

                              if self._budget is not None:
                                  self._budget.settle(
                                      tokens=response.usage.total_tokens,
                                      cost=response.usage.estimated_cost,
                                  )

                              if self._store is not None:
                                  self._store.complete(
                                      request=request,
                                      response=response,
                                      owner=owner,
                                      now=self._clock.now(),
                                  )

                              return response

                          except AIBudgetExceeded:
                              if self._store is not None:
                                  self._store.fail(
                                      request=request,
                                      owner=owner,
                                      now=self._clock.now(),
                                      error_code="BUDGET_EXCEEDED",
                                      error_message=(
                                          "AI budget exceeded"
                                      ),
                                  )
                              raise

                          except AIProviderTransientError as exc:
                              circuit.failure(now=self._clock.now())

                              failures.append(
                                  f"{provider.name}: transient: {exc}"
                              )

                              if attempt + 1 >= self._policy.max_attempts:
                                  break

                              delay = min(
                                  self._policy.retry_max_seconds,
                                  self._policy.retry_base_seconds
                                  * (2 ** attempt),
                              )

                              remaining = deadline - time.monotonic()

                              if remaining <= 0:
                                  break

                              time.sleep(min(delay, remaining))

                          except AIProviderPermanentError as exc:
                              circuit.failure(now=self._clock.now())

                              failures.append(
                                  f"{provider.name}: permanent: {exc}"
                              )
                              break

                          except Exception as exc:
                              circuit.failure(now=self._clock.now())

                              failures.append(
                                  f"{provider.name}: "
                                  f"{type(exc).__name__}: {exc}"
                              )
                              break

                  if self._store is not None:
                      self._store.fail(
                          request=request,
                          owner=owner,
                          now=self._clock.now(),
                          error_code="ALL_PROVIDERS_FAILED",
                          error_message=" | ".join(failures),
                      )

                  if not failures:
                      raise AIProviderUnavailable(
                          f"No provider supports {model.model_id}"
                      )

                  raise AIProviderError(
                      "All eligible AI providers failed: "
                      + " | ".join(failures)
                  )

              def recover_stale_requests(self) -> int:
                  if self._store is None:
                      return 0

                  return self._store.recover_expired(
                      now=self._clock.now(),
                      stale_after_seconds=self._policy.stale_request_seconds,
                  )

              def audit_is_valid(self) -> bool:
                  if self._store is None:
                      return True

                  return self._store.verify_audit_chain()

              def health(self) -> dict[str, object]:
                  providers: dict[str, object] = {}

                  for provider in self._providers:
                      circuit = self._circuits[provider.name].snapshot()

                      providers[provider.name] = {
                          "provider_health": provider.health(),
                          "circuit": circuit.state.value,
                          "failures": circuit.failures,
                          "opened_at": circuit.opened_at,
                      }

                  return {
                      "engine": "ready",
                      "providers": providers,
                      "registry_revision": self._registry.revision,
                      "audit_valid": self.audit_is_valid(),
                  }
          PY

