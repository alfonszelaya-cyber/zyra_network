          from __future__ import annotations

          import threading
          import time

          from ..core import (
              AlertRecord,
              AlertState,
              ObservationEvent,
              digest,
              new_id,
              normalize_labels,
          )


          class AlertRule:
              def __init__(
                  self,
                  rule_id,
                  predicate,
                  *,
                  message="alert",
                  severity="warning",
                  cooldown_seconds=60,
              ):
                  if not rule_id:
                      raise ValueError(
                          "rule_id is required"
                      )

                  if not callable(predicate):
                      raise TypeError(
                          "predicate must be callable"
                      )

                  if cooldown_seconds < 0:
                      raise ValueError(
                          "cooldown cannot be negative"
                      )

                  self.rule_id = rule_id
                  self.predicate = predicate
                  self.message = message
                  self.severity = severity
                  self.cooldown_seconds = (
                      cooldown_seconds
                  )


          class AlertManager:
              def __init__(self):
                  self._lock = threading.RLock()
                  self._rules = {}
                  self._records = {}

              def register(self, rule):
                  with self._lock:
                      self._rules[
                          rule.rule_id
                      ] = rule

              def unregister(self, rule_id):
                  with self._lock:
                      self._rules.pop(
                          rule_id,
                          None,
                      )

              def evaluate(self, event):
                  triggered = []
                  current_ns = time.time_ns()

                  with self._lock:
                      rules = list(
                          self._rules.values()
                      )

                      for rule in rules:
                          try:
                              matched = bool(
                                  rule.predicate(
                                      event
                                  )
                              )
                          except Exception:
                              matched = False

                          if not matched:
                              continue

                          labels = normalize_labels({
                              "component":
                                  event.context.component,
                              "event_type":
                                  event.event_type,
                          })

                          fingerprint = digest({
                              "rule_id":
                                  rule.rule_id,
                              "labels":
                                  labels,
                          })

                          previous = (
                              self._records.get(
                                  fingerprint
                              )
                          )

                          if (
                              previous is not None
                              and (
                                  current_ns
                                  - previous.last_seen_ns
                              )
                              <
                              rule.cooldown_seconds
                              * 1_000_000_000
                          ):
                              self._records[
                                  fingerprint
                              ] = AlertRecord(
                                  alert_id=(
                                      previous.alert_id
                                  ),
                                  rule_id=(
                                      previous.rule_id
                                  ),
                                  state=(
                                      previous.state
                                  ),
                                  fingerprint=(
                                      previous.fingerprint
                                  ),
                                  first_seen_ns=(
                                      previous.first_seen_ns
                                  ),
                                  last_seen_ns=(
                                      current_ns
                                  ),
                                  message=(
                                      previous.message
                                  ),
                                  labels=(
                                      previous.labels
                                  ),
                                  occurrence_count=(
                                      previous.occurrence_count
                                      + 1
                                  ),
                              )

                              continue

                          record = AlertRecord(
                              alert_id=(
                                  previous.alert_id
                                  if previous
                                  else new_id(
                                      "alert"
                                  )
                              ),
                              rule_id=rule.rule_id,
                              state=(
                                  AlertState.FIRING
                              ),
                              fingerprint=(
                                  fingerprint
                              ),
                              first_seen_ns=(
                                  previous.first_seen_ns
                                  if previous
                                  else current_ns
                              ),
                              last_seen_ns=current_ns,
                              message=rule.message,
                              labels=labels,
                              occurrence_count=(
                                  previous.occurrence_count
                                  + 1
                                  if previous
                                  else 1
                              ),
                          )

                          self._records[
                              fingerprint
                          ] = record

                          triggered.append(
                              record
                          )

                  return triggered

              def acknowledge(
                  self,
                  fingerprint,
              ):
                  with self._lock:
                      record = self._records.get(
                          fingerprint
                      )

                      if record is None:
                          return None

                      updated = AlertRecord(
                          alert_id=record.alert_id,
                          rule_id=record.rule_id,
                          state=(
                              AlertState.ACKNOWLEDGED
                          ),
                          fingerprint=(
                              record.fingerprint
                          ),
                          first_seen_ns=(
                              record.first_seen_ns
                          ),
                          last_seen_ns=(
                              time.time_ns()
                          ),
                          message=record.message,
                          labels=record.labels,
                          occurrence_count=(
                              record.occurrence_count
                          ),
                      )

                      self._records[
                          fingerprint
                      ] = updated

                      return updated

              def resolve(
                  self,
                  fingerprint,
              ):
                  with self._lock:
                      record = self._records.get(
                          fingerprint
                      )

                      if record is None:
                          return None

                      updated = AlertRecord(
                          alert_id=record.alert_id,
                          rule_id=record.rule_id,
                          state=(
                              AlertState.RESOLVED
                          ),
                          fingerprint=(
                              record.fingerprint
                          ),
                          first_seen_ns=(
                              record.first_seen_ns
                          ),
                          last_seen_ns=(
                              time.time_ns()
                          ),
                          message=record.message,
                          labels=record.labels,
                          occurrence_count=(
                              record.occurrence_count
                          ),
                      )

                      self._records[
                          fingerprint
                      ] = updated

                      return updated

              def active(self):
                  with self._lock:
                      return [
                          record
                          for record
                          in self._records.values()
                          if record.state
                          in {
                              AlertState.FIRING,
                              AlertState.ACKNOWLEDGED,
                          }
                      ]


