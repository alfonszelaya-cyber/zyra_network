                          ),
                          correlation_ids=(
                              current.correlation_ids
                          ),
                          alert_ids=(
                              current.alert_ids
                          ),
                          metadata=current.metadata,
                      )

                      self._items[
                          incident_id
                      ] = updated

                      return updated

              def get(self, incident_id):
                  with self._lock:
                      return self._items.get(
                          incident_id
                      )

              def list(self):
                  with self._lock:
                      return list(
