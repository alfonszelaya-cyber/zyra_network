name: Create Currency Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-currency-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Currency Engine
        run: |
          set -e

          mkdir -p \
            shared_engines/currency/conversion \
            shared_engines/currency/rates \
            shared_engines/currency/currencies \
            shared_engines/currency/sources/providers \
            shared_engines/currency/events \
            shared_engines/currency/validation

          touch \
            shared_engines/currency/__init__.py \
            shared_engines/currency/conversion/__init__.py \
            shared_engines/currency/conversion/converter.py \
            shared_engines/currency/conversion/precision.py \
            shared_engines/currency/conversion/rounding.py \
            shared_engines/currency/rates/__init__.py \
            shared_engines/currency/rates/provider.py \
            shared_engines/currency/rates/realtime.py \
            shared_engines/currency/rates/cache.py \
            shared_engines/currency/rates/history.py \
            shared_engines/currency/currencies/__init__.py \
            shared_engines/currency/currencies/registry.py \
            shared_engines/currency/currencies/fiat.py \
            shared_engines/currency/currencies/crypto.py \
            shared_engines/currency/currencies/commodities.py \
            shared_engines/currency/sources/__init__.py \
            shared_engines/currency/sources/providers/__init__.py \
            shared_engines/currency/sources/providers/primary.py \
            shared_engines/currency/sources/providers/fallback.py \
            shared_engines/currency/events/__init__.py \
            shared_engines/currency/events/rate_updated.py \
            shared_engines/currency/events/currency_changed.py \
            shared_engines/currency/validation/__init__.py \
            shared_engines/currency/validation/rate_validator.py

          cat > shared_engines/currency/__init__.py <<'EOF'
          """
          ZYRA Network — Universal Currency Engine.

          Transversal real-time currency conversion infrastructure
          available to all internal and external systems.
          """
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shared_engines/currency

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add universal currency engine"
            git push
          fi
