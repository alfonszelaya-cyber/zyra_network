          from __future__ import annotations

          import hashlib
          import time
          import uuid
          from collections.abc import Iterable
          from decimal import Decimal

          from .budget import ExecutionBudget
          from .circuit import CircuitBreaker
          from .clock import Clock, SystemClock
          from .contracts import AIRequest, AIResponse
          from .errors import (
              AIBudgetExceeded,
              AIIdempotencyConflict,
              AIProviderError,
              AIProviderPermanentError,
              AIProviderTransientError,
              AIProviderUnavailable,
              AIRequestInFlight,
          )
          from .policy import ExecutionPolicy
          from .providers import AIProvider
          from .registry import ModelRegistry
          from .serialization import canonical_json
          from .storage import SQLiteAIStore


          class AIEngine:
              """
              Durable AI orchestration layer.

              The engine does not pretend that an uncertain external network
              operation is safe to duplicate. Provider calls are protected
              with the request idempotency key and uncertain executions are
              persisted for reconciliation.
              """

              def __init__(
                  self,
                  registry: ModelRegistry,
                  providers: Iterable[AIProvider],
                  *,
                  store: SQLiteAIStore | None = None,
                  budget: ExecutionBudget | None = None,
                  policy: ExecutionPolicy | None = None,
                  clock: Clock | None = None,
                  failure_threshold: int = 5,
                  recovery_seconds: int = 30,
              ) -> None:
                  self._registry = registry
                  self._providers = tuple(providers)
                  self._store = store
                  self._budget = budget
                  self._policy = (
                      policy or ExecutionPolicy()
                  )
                  self._clock = (
                      clock or SystemClock()
                  )

                  if not self._providers:
                      raise ValueError(
                          "At least one provider is required"
                      )

                  names = tuple(
                      provider.name.strip()
                      for provider in self._providers
                  )

                  if any(not name for name in names):
                      raise ValueError(
                          "Provider names cannot be empty"
                      )

                  if len(set(names)) != len(names):
                      raise ValueError(
                          "Provider names must be unique"
                      )

                  self._circuits = {
                      provider.name: CircuitBreaker(
                          failure_threshold=(
                              failure_threshold
                          ),
                          recovery_seconds=(
                              recovery_seconds
                          ),
                      )
                      for provider in self._providers
                  }

              def _request_hash(
                  self,
                  request: AIRequest,
              ) -> str:
                  payload = {
                      "schema_version": (
                          request.schema_version
                      ),
                      "model_id": request.model_id,
                      "prompt": request.prompt,
                      "system_prompt": (
                          request.system_prompt
                      ),
                      "max_output_tokens": (
                          request.max_output_tokens
                      ),
                      "temperature": request.temperature,
                      "timeout_seconds": (
                          request.timeout_seconds
                      ),
                      "metadata": dict(
                          request.metadata
                      ),
                  }

                  return hashlib.sha256(
                      canonical_json(payload)
                  ).hexdigest()

              def execute(
                  self,
                  request: AIRequest,
              ) -> AIResponse:
                  model = self._registry.get(
                      request.model_id
                  )

                  self._policy.validate(
                      request,
                      model,
                  )

                  if self._budget is not None:
                      self._budget.reserve_request()

                  request_hash = self._request_hash(
                      request
                  )

                  owner = uuid.uuid4().hex

                  if self._store is not None:
                      try:
                          reservation = (
                              self._store.reserve(
                                  request=request,
                                  request_hash=request_hash,
                                  owner=owner,
                                  now=self._clock.now(),
                                  lease_seconds=(
                                      self._policy.lease_seconds
                                  ),
                              )
                          )

                      except AIRequestInFlight:
                          response = (
                              self._store.wait_for_completion(
                                  idempotency_key=(
                                      request.idempotency_key
                                  ),
                                  request_hash=request_hash,
                                  timeout_seconds=(
                                      self._policy
                                      .concurrent_wait_seconds
                                  ),
                              )
                          )

                          if response is not None:
                              return response

                          raise AIRequestInFlight(
                              "Concurrent request did not complete "
                              "within the configured wait window"
                          )

                      if reservation.response is not None:
                          return reservation.response

                  deadline = (
                      time.monotonic()
                      + request.timeout_seconds
                  )

                  failures: list[str] = []

                  for provider in self._providers:
                      supports_model = any(
                          descriptor.model_id
                          == model.model_id
                          for descriptor in provider.models()
                      )

                      if not supports_model:
                          continue

                      circuit = self._circuits[
                          provider.name
                      ]

                      if not circuit.allow(
                          now=self._clock.now()
                      ):
                          failures.append(
                              provider.name
                              + ": circuit-open"
                          )
                          continue

                      for attempt in range(
                          self._policy.max_attempts
                      ):
                          if (
                              time.monotonic()
                              >= deadline
                          ):
                              failures.append(
                                  provider.name
                                  + ": deadline-exceeded"
                              )
                              break

                          try:
                              response = (
                                  provider.complete(
                                      request,
                                      model,
                                  )
                              )

                              circuit.success()

                              maximum_cost = (
                                  self._policy
                                  .maximum_cost_per_request
                              )

                              if (
                                  maximum_cost is not None
                                  and response.usage
                                  .estimated_cost
                                  > maximum_cost
                              ):
                                  raise AIBudgetExceeded(
                                      "Per-request cost limit exceeded"
                                  )

                              if self._budget is not None:
                                  self._budget.settle(
                                      tokens=(
                                          response.usage
                                          .total_tokens
                                      ),
                                      cost=(
                                          response.usage
                                          .estimated_cost
                                      ),
                                  )

                              if self._store is not None:
                                  self._store.complete(
                                      request=request,
                                      response=response,
                                      owner=owner,
                                      now=self._clock.now(),
                                  )

                              return response

                          except AIBudgetExceeded:
                              if self._store is not None:
                                  self._store.fail(
                                      request=request,
                                      owner=owner,
                                      now=self._clock.now(),
                                      error_code=(
                                          "BUDGET_EXCEEDED"
                                      ),
                                      error_message=(
                                          "AI budget exceeded"
                                      ),
                                  )
                              raise

                          except AIProviderTransientError as exc:
                              circuit.failure(
                                  now=self._clock.now()
                              )

                              failures.append(
                                  provider.name
                                  + ": transient: "
                                  + str(exc)
                              )

                              if (
                                  attempt + 1
                                  >= self._policy.max_attempts
                              ):
                                  break

                              delay = min(
                                  self._policy.retry_max_seconds,
                                  self._policy
                                  .retry_base_seconds
                                  * (2 ** attempt),
                              )

                              remaining = (
                                  deadline
                                  - time.monotonic()
                              )

                              if remaining <= 0:
                                  break

                              time.sleep(
                                  min(
                                      delay,
                                      remaining,
                                  )
                              )

                          except AIProviderPermanentError as exc:
                              circuit.failure(
                                  now=self._clock.now()
                              )

                              failures.append(
                                  provider.name
                                  + ": permanent: "
                                  + str(exc)
                              )

                              break

                          except Exception as exc:
                              circuit.failure(
                                  now=self._clock.now()
                              )

                              if self._store is not None:
                                  self._store.mark_recovery_required(
                                      request=request,
                                      owner=owner,
                                      now=self._clock.now(),
                                      error_code=(
                                          type(exc).__name__
                                      ),
                                      error_message=str(exc),
                                  )

                              raise

                  if self._store is not None:
                      self._store.fail(
                          request=request,
                          owner=owner,
                          now=self._clock.now(),
                          error_code=(
                              "ALL_PROVIDERS_FAILED"
                          ),
                          error_message=(
                              " | ".join(failures)
                          ),
                      )

                  if not failures:
                      raise AIProviderUnavailable(
                          "No provider supports the requested model"
                      )

                  raise AIProviderError(
                      "All eligible providers failed: "
                      + " | ".join(failures)
                  )

              def recover_stale_requests(self) -> int:
                  if self._store is None:
                      return 0

                  return self._store.recover_expired(
                      now=self._clock.now(),
                      stale_after_seconds=(
                          self._policy
                          .stale_request_seconds
                      ),
                  )

              def audit_is_valid(self) -> bool:
                  if self._store is None:
                      return True

                  return self._store.verify_audit_chain()

              def health(self) -> dict[str, object]:
                  providers: dict[str, object] = {}

                  for provider in self._providers:
                      snapshot = self._circuits[
                          provider.name
                      ].snapshot()

                      providers[provider.name] = {
                          "healthy": provider.health(),
                          "circuit": (
                              snapshot.state.value
                          ),
                          "failures": snapshot.failures,
                          "opened_at": snapshot.opened_at,
                      }

                  return {
                      "engine": "ready",
                      "registry_revision": (
                          self._registry.revision
                      ),
                      "audit_valid": (
                          self.audit_is_valid()
                      ),
                      "providers": providers,
                  }
          PY

