                  payload_hash = hashlib.sha256(
                      payload.encode("utf-8")
                  ).hexdigest()

                  event_id = hashlib.sha256(
                      (
                          f"{aggregate_id}|{event_type}|"
                          f"{payload_hash}|{now}|{previous_hash}"
                      ).encode("utf-8")
