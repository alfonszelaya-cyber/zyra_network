          from __future__ import annotations

          import threading
          import time
          from dataclasses import replace

          from ..core import (
              IncidentRecord,
              IncidentState,
              ValidationError,
              new_id,
          )


          class IncidentManager:
              _TRANSITIONS = {
                  IncidentState.OPEN: {
                      IncidentState.ACKNOWLEDGED,
                      IncidentState.MITIGATED,
                      IncidentState.RESOLVED,
                  },
                  IncidentState.ACKNOWLEDGED: {
                      IncidentState.MITIGATED,
                      IncidentState.RESOLVED,
                  },
                  IncidentState.MITIGATED: {
                      IncidentState.RESOLVED,
                  },
                  IncidentState.RESOLVED: {
                      IncidentState.CLOSED,
                  },
                  IncidentState.CLOSED: set(),
              }

              def __init__(self):
                  self._lock = threading.RLock()
                  self._items: dict[
                      str,
                      IncidentRecord,
                  ] = {}

              def create(
                  self,
                  title: str,
                  *,
                  severity="warning",
                  correlation_ids=(),
                  alert_ids=(),
                  metadata=None,
              ):
                  if not title or len(title) > 512:
                      raise ValidationError(
                          "invalid incident title"
                      )

                  now = time.time_ns()

                  record = IncidentRecord(
                      incident_id=new_id("inc"),
                      title=title,
                      state=IncidentState.OPEN,
                      severity=severity,
                      created_at_ns=now,
                      updated_at_ns=now,
                      correlation_ids=tuple(
                          correlation_ids
                      ),
                      alert_ids=tuple(alert_ids),
                      metadata=metadata or {},
                  )

                  with self._lock:
                      self._items[
                          record.incident_id
                      ] = record

                  return record

              def transition(
                  self,
                  incident_id: str,
                  state: IncidentState,
              ):
                  with self._lock:
                      current = self._items.get(
                          incident_id
                      )

                      if current is None:
                          raise KeyError(
                              incident_id
                          )

                      if state not in self._TRANSITIONS[
                          current.state
                      ]:
                          raise ValidationError(
                              "invalid incident transition: "
                              f"{current.state.value} -> "
                              f"{state.value}"
                          )

                      updated = replace(
                          current,
                          state=state,
                          updated_at_ns=time.time_ns(),
                      )

                      self._items[
                          incident_id
                      ] = updated

                      return updated

              def get(self, incident_id):
                  with self._lock:
                      return self._items.get(
                          incident_id
                      )

              def list(self):
                  with self._lock:
                      return list(
                          self._items.values()
                      )


          __all__ = [
              "IncidentManager",
              "IncidentRecord",
              "IncidentState",
          ]
