          PY

          cat > shared_engines/ai/persistence/migrations.py <<'PY'
          from __future__ import annotations

          import hashlib
          import sqlite3
          from dataclasses import dataclass

          from ..errors import MigrationError


          @dataclass(frozen=True, slots=True)
          class Migration:
              version: int
              name: str
              sql: str

              @property
              def checksum(self) -> str:
                  return hashlib.sha256(self.sql.encode("utf-8")).hexdigest()


          MIGRATIONS = (
              Migration(
                  1,
                  "initial",
                  """
                  CREATE TABLE IF NOT EXISTS schema_migrations (
                      version INTEGER PRIMARY KEY,
                      name TEXT NOT NULL,
                      checksum TEXT NOT NULL,
                      applied_at TEXT NOT NULL
                  );

                  CREATE TABLE IF NOT EXISTS requests (
                      request_id TEXT PRIMARY KEY,
                      idempotency_key TEXT NOT NULL UNIQUE,
                      request_hash TEXT NOT NULL,
                      provider TEXT NOT NULL,
                      model TEXT NOT NULL,
                      state TEXT NOT NULL,
                      encrypted_input TEXT NOT NULL,
                      input_nonce TEXT NOT NULL,
                      key_version TEXT NOT NULL,
                      created_at TEXT NOT NULL,
                      updated_at TEXT NOT NULL,
                      lease_until TEXT,
                      lease_token TEXT,
                      attempts INTEGER NOT NULL DEFAULT 0,
                      response_payload TEXT,
                      response_nonce TEXT,
                      response_key_version TEXT,
                      provider_request_id TEXT,
                      error_code TEXT,
                      error_message TEXT
                  );

                  CREATE INDEX IF NOT EXISTS idx_requests_state
                      ON requests(state);

                  CREATE INDEX IF NOT EXISTS idx_requests_lease
                      ON requests(lease_until);

                  CREATE TABLE IF NOT EXISTS outbox (
                      event_id TEXT PRIMARY KEY,
                      event_type TEXT NOT NULL,
                      event_version INTEGER NOT NULL,
                      aggregate_id TEXT NOT NULL,
                      payload TEXT NOT NULL,
                      created_at TEXT NOT NULL,
                      published_at TEXT
                  );

                  CREATE INDEX IF NOT EXISTS idx_outbox_pending
                      ON outbox(published_at, created_at);

                  CREATE TABLE IF NOT EXISTS inbox (
                      consumer TEXT NOT NULL,
                      event_id TEXT NOT NULL,
                      received_at TEXT NOT NULL,
                      PRIMARY KEY (consumer, event_id)
                  );

                  CREATE TABLE IF NOT EXISTS audit_log (
                      sequence INTEGER PRIMARY KEY AUTOINCREMENT,
                      event_id TEXT NOT NULL UNIQUE,
                      event_type TEXT NOT NULL,
                      event_version INTEGER NOT NULL,
                      aggregate_id TEXT NOT NULL,
                      event_hash TEXT NOT NULL,
                      previous_hash TEXT NOT NULL,
                      payload_hash TEXT NOT NULL,
                      created_at TEXT NOT NULL
                  );

                  CREATE TABLE IF NOT EXISTS audit_checkpoints (
                      sequence INTEGER PRIMARY KEY,
                      chain_hash TEXT NOT NULL,
                      created_at TEXT NOT NULL
                  );

                  CREATE TABLE IF NOT EXISTS provider_catalog (
                      provider TEXT NOT NULL,
                      model TEXT NOT NULL,
                      contract_version INTEGER NOT NULL,
                      endpoint TEXT NOT NULL,
                      active INTEGER NOT NULL,
                      updated_at TEXT NOT NULL,
                      PRIMARY KEY(provider, model)
                  );

                  CREATE TABLE IF NOT EXISTS circuit_state (
                      provider TEXT PRIMARY KEY,
                      failures INTEGER NOT NULL DEFAULT 0,
                      opened_at TEXT,
                      half_open_token TEXT,
                      updated_at TEXT NOT NULL
                  );
                  """,
              ),
          )


          class MigrationRunner:
              def __init__(self, connection: sqlite3.Connection) -> None:
                  self.connection = connection

              def run(self, now: str) -> None:
                  self.connection.execute(
                      """
                      CREATE TABLE IF NOT EXISTS schema_migrations (
                          version INTEGER PRIMARY KEY,
                          name TEXT NOT NULL,
                          checksum TEXT NOT NULL,
                          applied_at TEXT NOT NULL
                      )
                      """
                  )

                  rows = self.connection.execute(
                      "SELECT version, checksum FROM schema_migrations"
                  ).fetchall()
                  applied = {int(row[0]): str(row[1]) for row in rows}

                  for migration in MIGRATIONS:
                      if migration.version in applied:
                          if applied[migration.version] != migration.checksum:
                              raise MigrationError(
                                  f"migration checksum mismatch: {migration.version}"
                              )
                          continue

                      try:
                          with self.connection:
                              self.connection.executescript(migration.sql)
                              self.connection.execute(
                                  """
                                  INSERT INTO schema_migrations
                                  (version, name, checksum, applied_at)
                                  VALUES (?, ?, ?, ?)
                                  """,
                                  (
                                      migration.version,
                                      migration.name,
                                      migration.checksum,
                                      now,
                                  ),
                              )
                      except sqlite3.Error as exc:
                          raise MigrationError(
                              f"migration failed: {migration.version}"
                          ) from exc
          PY

          cat > shared_engines/ai/persistence/sqlite_store.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sqlite3
          import uuid
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any

          from ..constants import RequestState
          from ..errors import (
              AuditIntegrityError,
              IdempotencyConflict,
              LeaseLostError,
              StorageError,
          )
          from ..persistence.migrations import MigrationRunner
          from ..serialization import canonical_json


          class SQLiteAIStore:
              def __init__(self, database_path: str) -> None:
                  Path(database_path).parent.mkdir(parents=True, exist_ok=True)
                  self.connection = sqlite3.connect(
                      database_path,
                      isolation_level=None,
                      check_same_thread=False,
                      timeout=30.0,
                  )
                  self.connection.row_factory = sqlite3.Row
                  self.connection.execute("PRAGMA journal_mode=WAL")
                  self.connection.execute("PRAGMA synchronous=FULL")
                  self.connection.execute("PRAGMA foreign_keys=ON")
                  self.connection.execute("PRAGMA busy_timeout=30000")
                  MigrationRunner(self.connection).run(
                      datetime.now(timezone.utc).isoformat()
                  )

              def close(self) -> None:
                  self.connection.close()

              def get_request_by_idempotency(
                  self,
                  idempotency_key: str,
              ) -> sqlite3.Row | None:
                  return self.connection.execute(
                      """
                      SELECT * FROM requests
                      WHERE idempotency_key = ?
                      """,
                      (idempotency_key,),
                  ).fetchone()

              def create_request(
                  self,
                  *,
                  request_id: str,
                  idempotency_key: str,
                  request_hash: str,
                  provider: str,
                  model: str,
                  encrypted_input: str,
                  nonce: str,
                  key_version: str,
                  now: str,
              ) -> None:
                  try:
                      with self.connection:
                          self.connection.execute(
                              """
                              INSERT INTO requests (
                                  request_id, idempotency_key, request_hash,
                                  provider, model, state, encrypted_input,
                                  input_nonce, key_version, created_at,
                                  updated_at
                              )
                              VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                              """,
                              (
                                  request_id,
                                  idempotency_key,
                                  request_hash,
                                  provider,
                                  model,
                                  RequestState.PENDING,
                                  encrypted_input,
                                  nonce,
                                  key_version,
                                  now,
                                  now,
                              ),
                          )
                  except sqlite3.IntegrityError as exc:
                      existing = self.get_request_by_idempotency(idempotency_key)
                      if existing is None:
                          raise StorageError("request insertion failed") from exc
                      if existing["request_hash"] != request_hash:
                          raise IdempotencyConflict(
                              "idempotency key already belongs to another request"
                          )

              def acquire_lease(
                  self,
                  request_id: str,
                  lease_seconds: int,
                  worker_id: str,
              ) -> str | None:
                  now = datetime.now(timezone.utc)
                  until = now + timedelta(seconds=lease_seconds)
                  token = f"{worker_id}:{uuid.uuid4().hex}"

                  with self.connection:
                      cursor = self.connection.execute(
                          """
                          UPDATE requests
                          SET state = ?,
                              lease_until = ?,
                              lease_token = ?,
                              attempts = attempts + 1,
                              updated_at = ?
                          WHERE request_id = ?
                            AND state IN (?, ?)
                            AND (
                                lease_until IS NULL
                                OR lease_until < ?
                            )
                          """,
                          (
                              RequestState.RUNNING,
                              until.isoformat(),
                              token,
                              now.isoformat(),
                              request_id,
                              RequestState.PENDING,
                              RequestState.RUNNING,
                              now.isoformat(),
                          ),
                      )

                  return token if cursor.rowcount == 1 else None

              def mark_recovery_required(
                  self,
                  request_id: str,
                  lease_token: str,
                  error_code: str,
                  error_message: str,
              ) -> None:
                  with self.connection:
                      cursor = self.connection.execute(
                          """
                          UPDATE requests
                          SET state = ?,
                              error_code = ?,
                              error_message = ?,
                              updated_at = ?
                          WHERE request_id = ?
                            AND lease_token = ?
                          """,
                          (
                              RequestState.RECOVERY_REQUIRED,
                              error_code,
                              error_message,
                              datetime.now(timezone.utc).isoformat(),
                              request_id,
                              lease_token,
                          ),
                      )
                  if cursor.rowcount != 1:
                      raise LeaseLostError(request_id)

              def complete_request(
                  self,
                  *,
                  request_id: str,
                  lease_token: str,
                  provider_request_id: str,
                  response_payload: str,
                  response_nonce: str,
                  response_key_version: str,
                  now: str,
              ) -> None:
                  event_id = uuid.uuid4().hex

                  with self.connection:
                      cursor = self.connection.execute(
                          """
                          UPDATE requests
                          SET state = ?,
                              provider_request_id = ?,
                              response_payload = ?,
                              response_nonce = ?,
                              response_key_version = ?,
                              lease_until = NULL,
                              lease_token = NULL,
                              updated_at = ?
                          WHERE request_id = ?
                            AND lease_token = ?
                          """,
                          (
                              RequestState.COMPLETED,
                              provider_request_id,
                              response_payload,
                              response_nonce,
                              response_key_version,
                              now,
                              request_id,
                              lease_token,
                          ),
                      )

                      if cursor.rowcount != 1:
                          raise LeaseLostError(request_id)

                      payload = canonical_json(
                          {
                              "request_id": request_id,
                              "provider_request_id": provider_request_id,
                          }
                      ).decode("utf-8")

                      self.connection.execute(
                          """
                          INSERT INTO outbox (
                              event_id, event_type, event_version,
                              aggregate_id, payload, created_at
                          )
                          VALUES (?, ?, ?, ?, ?, ?)
                          """,
                          (
                              event_id,
                              "AI_REQUEST_COMPLETED",
                              1,
                              request_id,
                              payload,
                              now,
                          ),
                      )

              def fail_request(
                  self,
                  request_id: str,
                  lease_token: str,
                  error_code: str,
                  error_message: str,
                  now: str,
              ) -> None:
                  with self.connection:
                      cursor = self.connection.execute(
                          """
                          UPDATE requests
                          SET state = ?,
                              error_code = ?,
                              error_message = ?,
                              lease_until = NULL,
                              lease_token = NULL,
                              updated_at = ?
                          WHERE request_id = ?
                            AND lease_token = ?
                          """,
                          (
                              RequestState.FAILED,
                              error_code,
                              error_message[:2000],
                              now,
                              request_id,
                              lease_token,
                          ),
                      )
                  if cursor.rowcount != 1:
                      raise LeaseLostError(request_id)

              def recover_expired_leases(self, now: str) -> int:
                  with self.connection:
                      cursor = self.connection.execute(
                          """
                          UPDATE requests
                          SET state = ?,
                              lease_until = NULL,
                              lease_token = NULL,
                              updated_at = ?
                          WHERE state = ?
                            AND lease_until IS NOT NULL
                            AND lease_until < ?
                          """,
                          (
                              RequestState.RECOVERY_REQUIRED,
                              now,
                              RequestState.RUNNING,
                              now,
                          ),
                      )
                  return cursor.rowcount

              def get_request(self, request_id: str) -> sqlite3.Row | None:
                  return self.connection.execute(
                      "SELECT * FROM requests WHERE request_id = ?",
                      (request_id,),
                  ).fetchone()

              def claim_outbox(self, limit: int = 100) -> list[sqlite3.Row]:
                  return self.connection.execute(
                      """
                      SELECT *
                      FROM outbox
                      WHERE published_at IS NULL
                      ORDER BY created_at
                      LIMIT ?
                      """,
                      (limit,),
                  ).fetchall()

              def mark_outbox_published(
                  self,
                  event_id: str,
                  published_at: str,
              ) -> None:
                  with self.connection:
                      self.connection.execute(
                          """
                          UPDATE outbox
                          SET published_at = ?
                          WHERE event_id = ?
                            AND published_at IS NULL
                          """,
                          (published_at, event_id),
                      )

              def inbox_seen(self, consumer: str, event_id: str) -> bool:
                  row = self.connection.execute(
                      """
                      SELECT 1 FROM inbox
                      WHERE consumer = ? AND event_id = ?
                      """,
                      (consumer, event_id),
                  ).fetchone()
                  return row is not None

              def mark_inbox(
                  self,
                  consumer: str,
                  event_id: str,
                  received_at: str,
              ) -> bool:
                  try:
                      with self.connection:
                          self.connection.execute(
                              """
                              INSERT INTO inbox
                              (consumer, event_id, received_at)
                              VALUES (?, ?, ?)
                              """,
                              (consumer, event_id, received_at),
                          )
                      return True
                  except sqlite3.IntegrityError:
                      return False

              def append_audit(
                  self,
                  *,
                  event_id: str,
                  event_type: str,
                  event_version: int,
                  aggregate_id: str,
                  payload_hash: str,
                  created_at: str,
              ) -> int:
                  previous = self.connection.execute(
                      """
                      SELECT sequence, event_hash
                      FROM audit_log
                      ORDER BY sequence DESC
                      LIMIT 1
                      """
                  ).fetchone()

                  previous_hash = previous["event_hash"] if previous else "GENESIS"

                  event_hash = hashlib.sha256(
                      canonical_json(
                          {
                              "event_id": event_id,
                              "event_type": event_type,
                              "event_version": event_version,
                              "aggregate_id": aggregate_id,
                              "payload_hash": payload_hash,
                              "previous_hash": previous_hash,
                              "created_at": created_at,
                          }
                      )
                  ).hexdigest()

                  with self.connection:
                      cursor = self.connection.execute(
                          """
                          INSERT INTO audit_log (
                              event_id, event_type, event_version,
                              aggregate_id, event_hash,
                              previous_hash, payload_hash, created_at
                          )
                          VALUES (?, ?, ?, ?, ?, ?, ?, ?)
                          """,
                          (
                              event_id,
                              event_type,
                              event_version,
                              aggregate_id,
                              event_hash,
                              previous_hash,
                              payload_hash,
                              created_at,
                          ),
                      )

                  return int(cursor.lastrowid)

              def checkpoint_audit(
                  self,
                  sequence: int,
                  created_at: str,
              ) -> None:
                  row = self.connection.execute(
                      """
                      SELECT event_hash
                      FROM audit_log
                      WHERE sequence = ?
                      """,
                      (sequence,),
                  ).fetchone()

                  if row is None:
                      raise AuditIntegrityError(
                          f"missing audit sequence {sequence}"
                      )

                  with self.connection:
                      self.connection.execute(
                          """
                          INSERT OR REPLACE INTO audit_checkpoints
                          (sequence, chain_hash, created_at)
                          VALUES (?, ?, ?)
                          """,
                          (sequence, row["event_hash"], created_at),
                      )

              def verify_audit(self) -> None:
                  rows = self.connection.execute(
                      """
                      SELECT *
                      FROM audit_log
                      ORDER BY sequence
                      """
                  ).fetchall()

                  previous_hash = "GENESIS"

                  for row in rows:
                      expected = hashlib.sha256(
                          canonical_json(
                              {
                                  "event_id": row["event_id"],
                                  "event_type": row["event_type"],
                                  "event_version": row["event_version"],
                                  "aggregate_id": row["aggregate_id"],
                                  "payload_hash": row["payload_hash"],
                                  "previous_hash": row["previous_hash"],
                                  "created_at": row["created_at"],
                              }
                          )
                      ).hexdigest()

                      if row["previous_hash"] != previous_hash:
                          raise AuditIntegrityError(
                              f"audit chain broken at sequence {row['sequence']}"
                          )

                      if row["event_hash"] != expected:
                          raise AuditIntegrityError(
                              f"audit hash mismatch at sequence {row['sequence']}"
                          )

                      previous_hash = row["event_hash"]

                  checkpoints = self.connection.execute(
                      """
                      SELECT sequence, chain_hash
                      FROM audit_checkpoints
                      ORDER BY sequence
                      """
                  ).fetchall()

                  for checkpoint in checkpoints:
                      row = self.connection.execute(
                          """
                          SELECT event_hash
                          FROM audit_log
                          WHERE sequence = ?
                          """,
                          (checkpoint["sequence"],),
                      ).fetchone()

                      if row is None or row["event_hash"] != checkpoint["chain_hash"]:
                          raise AuditIntegrityError(
                              f"audit checkpoint invalid at "
                              f"{checkpoint['sequence']}"
                          )

              def health_check(self) -> dict[str, Any]:
                  row = self.connection.execute("PRAGMA integrity_check").fetchone()
                  return {
                      "database": "ok" if row and row[0] == "ok" else "failed",
                      "wal": True,
                  }

              def backup_to(self, destination: str) -> None:
                  try:
                      target = sqlite3.connect(destination)
                      try:
                          self.connection.backup(target)
                      finally:
                          target.close()
                  except sqlite3.Error as exc:
                      raise StorageError("online backup failed") from exc

              def verify_database(self) -> None:
                  result = self.connection.execute(
                      "PRAGMA integrity_check"
                  ).fetchone()
                  if not result or result[0] != "ok":
                      raise StorageError("sqlite integrity check failed")

              def close(self) -> None:
                  self.connection.close()
          PY

