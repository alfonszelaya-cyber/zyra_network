name: Complete ARQUEOLOGIA DIGITAL Architecture

on:
  workflow_dispatch:

jobs:
  complete-arqueologia:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create only missing architecture
        run: |
          set -e

          BASE="apps/arqueologia_digital"

          # ============================================================
          # CONFIG
          # ============================================================

          mkdir -p \
            "$BASE/config/application" \
            "$BASE/config/database" \
            "$BASE/config/events" \
            "$BASE/config/modules" \
            "$BASE/config/network" \
            "$BASE/config/permissions" \
            "$BASE/config/registry" \
            "$BASE/config/routes" \
            "$BASE/config/security" \
            "$BASE/config/system"

          # ============================================================
          # CONSTANTS
          # ============================================================

          mkdir -p \
            "$BASE/constants/business" \
            "$BASE/constants/events" \
            "$BASE/constants/permissions" \
            "$BASE/constants/roles" \
            "$BASE/constants/security" \
            "$BASE/constants/system"

          # ============================================================
          # EVENTS
          # ============================================================

          mkdir -p \
            "$BASE/events/domain" \
            "$BASE/events/system" \
            "$BASE/events/notifications"

          # ============================================================
          # INFRASTRUCTURE
          # ============================================================

          mkdir -p \
            "$BASE/infrastructure/api" \
            "$BASE/infrastructure/cache" \
            "$BASE/infrastructure/database" \
            "$BASE/infrastructure/messaging" \
            "$BASE/infrastructure/network" \
            "$BASE/infrastructure/persistence" \
            "$BASE/infrastructure/providers" \
            "$BASE/infrastructure/repositories" \
            "$BASE/infrastructure/security" \
            "$BASE/infrastructure/services" \
            "$BASE/infrastructure/storage"

          # ============================================================
          # MODULES
          # ============================================================

          mkdir -p \
            "$BASE/modules"

          # ============================================================
          # PERMISSIONS
          # ============================================================

          mkdir -p \
            "$BASE/permissions/policies" \
            "$BASE/permissions/roles" \
            "$BASE/permissions/rules" \
            "$BASE/permissions/scopes"

          # ============================================================
          # REGISTRY
          # ============================================================

          mkdir -p \
            "$BASE/registry/engines" \
            "$BASE/registry/events" \
            "$BASE/registry/menus" \
            "$BASE/registry/modules" \
            "$BASE/registry/permissions" \
            "$BASE/registry/roles" \
            "$BASE/registry/routes" \
            "$BASE/registry/services" \
            "$BASE/registry/templates"

          # ============================================================
          # ROUTERS
          # ============================================================

          mkdir -p \
            "$BASE/routers/api" \
            "$BASE/routers/internal" \
            "$BASE/routers/public" \
            "$BASE/routers/websocket"

          # ============================================================
          # SCHEMAS
          # ============================================================

          mkdir -p \
            "$BASE/schemas/entities" \
            "$BASE/schemas/requests" \
            "$BASE/schemas/responses" \
            "$BASE/schemas/shared"

          # ============================================================
          # SERVICES
          # ============================================================

          mkdir -p \
            "$BASE/services/adapters" \
            "$BASE/services/communication" \
            "$BASE/services/export" \
            "$BASE/services/import" \
            "$BASE/services/notifications" \
            "$BASE/services/reports" \
            "$BASE/services/synchronization" \
            "$BASE/services/translation"

          # ============================================================
          # SHARED
          # ============================================================

          mkdir -p \
            "$BASE/shared/adapters" \
            "$BASE/shared/builders" \
            "$BASE/shared/contracts" \
            "$BASE/shared/decorators" \
            "$BASE/shared/dto" \
            "$BASE/shared/enums" \
            "$BASE/shared/exceptions" \
            "$BASE/shared/factories" \
            "$BASE/shared/helpers" \
            "$BASE/shared/interfaces" \
            "$BASE/shared/mixins" \
            "$BASE/shared/models" \
            "$BASE/shared/policies" \
            "$BASE/shared/types" \
            "$BASE/shared/utilities" \
            "$BASE/shared/value_objects"

          # ============================================================
          # TEMPLATES
          # ============================================================

          mkdir -p \
            "$BASE/templates/certificates" \
            "$BASE/templates/dashboards" \
            "$BASE/templates/documents" \
            "$BASE/templates/emails" \
            "$BASE/templates/exports" \
            "$BASE/templates/forms" \
            "$BASE/templates/notifications" \
            "$BASE/templates/reports"

          # ============================================================
          # APP-SPECIFIC TEMPLATESS
          # ============================================================

          mkdir -p "$BASE/templatess"

          # ============================================================
          # VALIDATORS
          # ============================================================

          mkdir -p \
            "$BASE/validators/business" \
            "$BASE/validators/documents" \
            "$BASE/validators/entities" \
            "$BASE/validators/requests" \
            "$BASE/validators/security" \
            "$BASE/validators/shared"

          # ============================================================
          # CREATE __init__.py ONLY IF ABSENT
          # NEVER OVERWRITE EXISTING FILES
          # ============================================================

          find "$BASE" -type d -exec sh -c '
            for dir do
              if [ ! -e "$dir/__init__.py" ]; then
                touch "$dir/__init__.py"
              fi
            done
          ' sh {} +

      - name: Commit only new architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/arqueologia_digital

          if git diff --cached --quiet; then
            echo "No new architecture changes."
            exit 0
          fi

          git commit -m "Complete Arqueologia Digital architecture"
          git push
