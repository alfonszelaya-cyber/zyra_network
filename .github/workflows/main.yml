          from __future__ import annotations

          import argparse
          import json
          import re
          import sqlite3
          import sys
          from pathlib import Path

          from scripts import (
              FileLock,
              LOCK_ROOT,
              OperationalError,
              audit_event,
              configure_logging,
              ensure_operational_layout,
              execution_id,
              sha256_file,
              utc_now,
              write_state,
          )


          VERSION_PATTERN = re.compile(
              r"^(\d+)[-_].+\.sql$",
              re.IGNORECASE,
          )


          def parse_args() -> argparse.Namespace:
              parser = argparse.ArgumentParser(
                  description="Apply durable Zyra SQLite migrations."
              )

              parser.add_argument(
                  "--database",
                  type=Path,
              )
              parser.add_argument(
                  "--directory",
                  type=Path,
                  default=Path("migrations/versions"),
              )
              parser.add_argument(
                  "--target",
                  type=int,
              )
              parser.add_argument(
                  "--status",
                  action="store_true",
              )
              parser.add_argument(
                  "--dry-run",
                  action="store_true",
              )
              parser.add_argument(
                  "--no-backup",
                  action="store_true",
              )
              parser.add_argument(
                  "--verbose",
                  action="store_true",
              )

              return parser.parse_args()


          def resolve_database(
              args: argparse.Namespace,
          ) -> Path:
              if args.database:
                  return args.database.resolve()

              from infrastructure import Configuration

              configuration = (
                  Configuration.from_environment()
              )

              return Path(
                  configuration.database_path
              ).resolve()


          def discover(
              directory: Path,
          ) -> list[tuple[int, Path]]:
              if not directory.exists():
                  return []

              result: list[tuple[int, Path]] = []

              for path in directory.glob("*.sql"):
                  match = VERSION_PATTERN.match(path.name)

                  if not match:
                      raise OperationalError(
                          f"invalid migration filename: {path.name}"
                      )

                  result.append(
                      (
                          int(match.group(1)),
                          path,
                      )
                  )

              result.sort(
                  key=lambda item: item[0]
              )

              versions = [
                  version
                  for version, _ in result
              ]

              if len(versions) != len(set(versions)):
                  raise OperationalError(
                      "duplicate migration versions"
                  )

              return result


          def ensure_schema(
              connection: sqlite3.Connection,
          ) -> None:
              connection.execute(
                  """
                  CREATE TABLE IF NOT EXISTS zyra_schema_migrations (
                      version INTEGER PRIMARY KEY,
                      filename TEXT NOT NULL,
                      checksum TEXT NOT NULL,
                      applied_at TEXT NOT NULL,
                      execution_id TEXT NOT NULL
                  )
                  """
              )


          def backup_database(
              database: Path,
              execution: str,
          ) -> Path:
              backup_dir = (
                  database.parent
                  / ".zyra-migration-backups"
              )

              backup_dir.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              target = (
                  backup_dir
                  / f"{database.name}.{execution}.bak"
              )

              source = sqlite3.connect(
                  str(database)
              )

              destination = sqlite3.connect(
                  str(target)
              )

              try:
                  source.backup(destination)
                  destination.execute(
                      "PRAGMA synchronous=FULL"
                  )
                  destination.commit()
              finally:
                  destination.close()
                  source.close()

              return target


          def main() -> int:
              args = parse_args()
              logger = configure_logging(args.verbose)
              ensure_operational_layout()
              execution = execution_id()

              try:
                  with FileLock(
                      LOCK_ROOT / "migrate.lock",
                      timeout=300,
                  ):
                      database = resolve_database(args)
                      directory = args.directory.resolve()

                      migrations = discover(directory)

                      connection = sqlite3.connect(
                          str(database),
                          timeout=60,
                          isolation_level=None,
                      )

                      try:
                          connection.execute(
                              "PRAGMA foreign_keys=ON"
                          )

                          connection.execute(
                              "PRAGMA busy_timeout=60000"
                          )

                          ensure_schema(connection)

                          rows = connection.execute(
                              """
                              SELECT
                                  version,
                                  filename,
                                  checksum,
                                  applied_at
                              FROM zyra_schema_migrations
                              ORDER BY version
                              """
                          ).fetchall()

                          applied = {
                              int(row[0]): {
                                  "filename": row[1],
                                  "checksum": row[2],
                                  "applied_at": row[3],
                              }
                              for row in rows
                          }

                          status = []

                          for version, path in migrations:
                              checksum = sha256_file(path)

                              if version in applied:
                                  record = applied[version]

                                  if (
                                      record["checksum"]
                                      != checksum
                                  ):
                                      raise OperationalError(
                                          "migration checksum changed: "
                                          f"{path.name}"
                                      )

                                  if (
                                      record["filename"]
                                      != path.name
                                  ):
                                      raise OperationalError(
                                          "migration filename changed "
                                          f"for version {version}"
                                      )

                                  state = "applied"
                              else:
                                  state = "pending"

                              status.append(
                                  {
                                      "version": version,
                                      "filename": path.name,
                                      "checksum": checksum,
                                      "state": state,
                                  }
                              )

                          if args.status or args.dry_run:
                              payload = {
                                  "execution_id": execution,
                                  "database": str(database),
                                  "migrations": status,
                              }

                              if args.status:
                                  print(
                                      json.dumps(
                                          payload,
                                          indent=2,
                                      )
                                  )

                              audit_event(
                                  "migrate",
                                  status=(
                                      "dry-run"
                                      if args.dry_run
                                      else "status"
                                  ),
                                  execution=execution,
                                  details=payload,
                              )

                              return 0

                          pending = [
                              item
                              for item in status
                              if (
                                  item["state"]
                                  == "pending"
                              )
                              and (
                                  args.target is None
                                  or item["version"]
