      - name: Verify no empty Python files
        shell: bash
        run: |
          set -euo pipefail
          if find shared_engines/ai -name '*.py' -type f -empty -print -quit | grep -q .; then
            echo "Empty Python file detected"
            exit 1
          fi

      - name: Verify forbidden placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[[:space:]])pass([[:space:]]|$)|TODO|FIXME|NotImplementedError|XXX' \
            shared_engines/ai --include='*.py'; then
            echo "Forbidden placeholder found"
            exit 1
          fi

      - name: Verify provider layout
        shell: bash
        run: |
          set -euo pipefail
          test -f shared_engines/ai/provider_protocol.py
          test ! -e shared_engines/ai/providers.py
          test ! -d shared_engines/ai/providers

      - name: Verify generated tree
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "__init__.py"
            "errors.py"
            "contracts.py"
            "serialization.py"
            "keys.py"
            "crypto.py"
            "config.py"
            "compatibility.py"
            "events.py"
            "provider_protocol.py"
            "http_provider.py"
            "registry.py"
            "circuit.py"
            "retry.py"
            "limiter.py"
            "observability.py"
            "storage.py"
            "backup.py"
            "engine.py"
          )

          for file in "${required[@]}"; do
            test -f "shared_engines/ai/$file"
          done

          test -d shared_engines/ai/tests

      - name: Compile
        run: |
          python -m compileall -q shared_engines/ai

      - name: Flake8
        run: |
          python -m flake8 shared_engines/ai \
            --max-line-length=88 \
            --extend-ignore=E203,W503

      - name: Mypy
        run: |
          python -m mypy shared_engines/ai \
            --config-file shared_engines/ai/mypy.ini

      - name: Production tests
        run: |
          python -m pytest \
            shared_engines/ai/tests \
            -q \
            --disable-warnings \
            --maxfail=1

      - name: Verify no apps changes
        shell: bash
        run: |
          set -euo pipefail

          if git status --short | awk '{print $2}' | grep -E '^apps/' ; then
            echo "ERROR: apps/ was modified"
            exit 1
          fi

          if git status --short | awk '{print $2}' | grep -E '^shared_engines/(?!ai/)' ; then
            echo "ERROR: another shared engine was modified"
            exit 1
          fi

      - name: Git integrity
        run: |
          git diff --check

      - name: Commit only AI engine
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shared_engines/ai

          if git diff --cached --quiet; then
            echo "No AI changes to commit"
            exit 0
          fi

          git commit -m "feat(shared-engines): harden AI engine"

      - name: Push
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
