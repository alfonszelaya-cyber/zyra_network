name: Crear carpetas de Semilla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear carpetas y archivos faltantes
        run: |
          mkdir -p apps/semilla/application/{academic,admissions,analytics,attendance,certification,classroom,curriculum,education_ai,evaluation,family,finance,government,innovation,institution,laboratory,learning,library,management,psychology,reports,research,scholarship,security,student,teacher,transportation,zyra}_use_cases
          mkdir -p apps/semilla/assets/{audio,certificates,documents,fonts,icons,images,logos,templates,translations,videos}
          mkdir -p apps/semilla/config/{application,database,education,events,modules,network,permissions,registry,routes,security,system}
          mkdir -p apps/semilla/constants/{academic,education,events,grades,permissions,roles,security,system}
          find apps/semilla -type d -exec touch {}/__init__.py \;

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Estructura de carpetas semilla agregada"
          git push
