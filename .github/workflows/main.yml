          cat > shared_engines/common/errors.py <<'PYEOF'
          """Typed error hierarchy shared by every engine."""
          from __future__ import annotations


          class EngineError(Exception):
              """Base class for every error raised by shared engines."""


          class ConfigurationError(EngineError):
              """Invalid or unsafe configuration; must fail at startup."""


          class ValidationError(EngineError):
              """Input failed contract validation."""


          class SerializationError(EngineError):
              """Canonical serialization or parsing failed."""


          class IntegrityError(EngineError):
              """Stored data failed integrity verification."""


          class ConcurrencyError(EngineError):
              """Concurrent access conflict that cannot be resolved here."""


          class LeaseLost(ConcurrencyError):
              """Fencing token rejected: this worker lost its lease."""


          class RecoveryRequired(EngineError):
              """Operation ended in an externally-uncertain state."""


          class ProviderTransientError(EngineError):
              """Provider failure that may succeed on a later attempt."""


          class ProviderPermanentError(EngineError):
              """Provider failure that will never succeed unchanged."""


          class BackpressureError(EngineError):
              """Bounded queue is full; caller must slow down."""


          class BudgetExceeded(EngineError):
              """Request would exceed a configured budget or limit."""


          class MigrationError(EngineError):
              """Migration registry inconsistency or checksum mismatch."""


          class UnsupportedVersionError(EngineError):
              """Contract/event version is not compatible with this engine."""


          class NotFoundError(EngineError):
              """Requested entity does not exist."""


          class PolicyViolation(EngineError):
              """Action denied by governance, compliance or security policy."""
          PYEOF

          cat > shared_engines/common/clocks.py <<'PYEOF'
          """Injectable clocks so time-dependent logic is deterministic."""
          from __future__ import annotations

          import time
          from typing import Protocol


          class Clock(Protocol):
              def now(self) -> float:
                  """Unix epoch seconds."""
                  ...

              def sleep(self, seconds: float) -> None:
                  ...


          class SystemClock:
              """Wall-clock implementation."""

              def now(self) -> float:
                  return time.time()

              def sleep(self, seconds: float) -> None:
                  time.sleep(seconds)


          class FrozenClock:
              """Deterministic clock for tests and simulations."""

              def __init__(self, start: float = 1_000_000.0) -> None:
                  self._now = start

              def now(self) -> float:
                  return self._now

              def sleep(self, seconds: float) -> None:
                  self._now += seconds

              def advance(self, seconds: float) -> None:
                  self._now += seconds
          PYEOF

          cat > shared_engines/common/serialization.py <<'PYEOF'
          """Canonical JSON used for hashing, journals and fingerprints."""
          from __future__ import annotations

          import json
          from decimal import Decimal
          from typing import Any

          from shared_engines.common.errors import SerializationError

          _SEPARATORS = (",", ":")


          def _default(obj: Any) -> Any:
              if isinstance(obj, Decimal):
                  return {"__decimal__": str(obj)}
              raise SerializationError(
                  f"type {type(obj).__name__} is not canonically serializable"
              )


          def canonical_json_dumps(payload: Any) -> str:
              try:
                  return json.dumps(
                      payload,
                      separators=_SEPARATORS,
                      sort_keys=True,
                      default=_default,
                      ensure_ascii=False,
                  )
              except (TypeError, ValueError) as exc:
                  raise SerializationError(
                      f"payload not canonically serializable: {exc}"
                  ) from exc


          def canonical_json_loads(raw: str) -> Any:
              """Parses canonical JSON; Decimals arrive as strings by design."""
              try:
                  return json.loads(raw)
              except (TypeError, ValueError) as exc:
                  raise SerializationError(
                      f"payload is not valid JSON: {exc}"
                  ) from exc
          PYEOF

          cat > shared_engines/common/identifiers.py <<'PYEOF'
          """Stable identifiers and content hashing."""
          from __future__ import annotations

          import hashlib
          import uuid

          from shared_engines.common.serialization import canonical_json_dumps


          def new_id() -> str:
              return uuid.uuid4().hex


          def stable_hash(*parts: str) -> str:
              digest = hashlib.sha256()
              for part in parts:
                  digest.update(part.encode("utf-8"))
                  digest.update(b"\x1f")
              return digest.hexdigest()


          def payload_fingerprint(payload: object) -> str:
              return stable_hash(canonical_json_dumps(payload))
          PYEOF

          cat > shared_engines/common/validation.py <<'PYEOF'
          """Fail-fast validation helpers shared by configs and contracts.

          ``config=True`` raises ConfigurationError (startup-time, unsafe
          settings); the default raises ValidationError (bad runtime
          input). Later engines (ai, currency) import from here, so this
          module is the single source of these primitives.
          """
          from __future__ import annotations

          import math
          from collections.abc import Sequence

          from shared_engines.common.errors import ConfigurationError, ValidationError


          def _raise(message: str, config: bool) -> None:
              if config:
                  raise ConfigurationError(message)
              raise ValidationError(message)


          def require_non_empty_str(
              value: str, name: str, *, config: bool = False
          ) -> str:
              if not isinstance(value, str) or not value.strip():
                  _raise(f"{name} must be a non-empty string", config)
              return value


          def require_int_range(
              value: int, name: str, minimum: int, maximum: int, *, config: bool = False
          ) -> int:
              if not isinstance(value, int) or isinstance(value, bool):
                  _raise(f"{name} must be an integer", config)
              if not minimum <= value <= maximum:
                  _raise(f"{name} must be in [{minimum}, {maximum}]", config)
              return value


          def require_positive_number(
              value: float, name: str, *, config: bool = False
          ) -> float:
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  _raise(f"{name} must be a number", config)
              if not math.isfinite(value) or value <= 0:
                  _raise(f"{name} must be a positive finite number", config)
              return float(value)


          def require_one_of(
              value: str, allowed: Sequence[str], name: str, *, config: bool = False
          ) -> str:
              if value not in allowed:
                  _raise(f"{name} must be one of {sorted(allowed)}", config)
              return value
          PYEOF

          cat > shared_engines/common/result.py <<'PYEOF'
          """Explicit success/failure container for non-throwing APIs."""
          from __future__ import annotations

          from typing import Generic, TypeVar, cast

          from shared_engines.common.errors import ConfigurationError, EngineError

          ValueT = TypeVar("ValueT")


          class Result(Generic[ValueT]):
              """Immutable result holding exactly one of value or error.

              ``None`` is not a valid success value: use ``err`` for absence.
              """

              __slots__ = ("_value", "_error")

              def __init__(
                  self, value: ValueT | None, error: EngineError | None
              ) -> None:
                  if (value is None) == (error is None):
                      raise ConfigurationError(
                          "Result requires exactly one of value or error"
                      )
                  self._value = value
                  self._error = error

              @classmethod
              def ok(cls, value: ValueT) -> "Result[ValueT]":
                  return cls(value, None)

              @classmethod
              def err(cls, error: EngineError) -> "Result[ValueT]":
                  return cls(None, error)

              @property
              def ok(self) -> bool:
                  return self._error is None

              @property
              def value(self) -> ValueT:
                  if self._error is not None:
                      raise self._error
                  return cast(ValueT, self._value)

              @property
              def error(self) -> EngineError | None:
                  return self._error
          PYEOF

          cat > shared_engines/common/pagination.py <<'PYEOF'
          """Page container for list endpoints across engines."""
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Generic, TypeVar

          from shared_engines.common.validation import require_int_range

          ItemT = TypeVar("ItemT")


          @dataclass(frozen=True)
          class Page(Generic[ItemT]):
              items: tuple[ItemT, ...]
              offset: int
              limit: int
              total: int

              def __post_init__(self) -> None:
                  require_int_range(self.offset, "offset", 0, 10**12)
                  require_int_range(self.limit, "limit", 1, 10**6)
                  require_int_range(self.total, "total", 0, 10**12)

              @property
              def has_more(self) -> bool:
                  return self.offset + len(self.items) < self.total

              @property
              def next_offset(self) -> int | None:
                  if self.has_more:
                      return self.offset + len(self.items)
                  return None
          PYEOF

          cat > shared_engines/common/types.py <<'PYEOF'
          """Shared semantic aliases (no runtime behaviour by design)."""
          from __future__ import annotations

          from typing import NewType

          ISO4217Code = NewType("ISO4217Code", str)
          ISO3166Code = NewType("ISO3166Code", str)
          Sha256Hex = NewType("Sha256Hex", str)
          EngineName = NewType("EngineName", str)
          PYEOF

          cat > shared_engines/common/tests/test_common.py <<'PYEOF'
          from __future__ import annotations

          import pytest

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.common.errors import (
              ConfigurationError,
              SerializationError,
              ValidationError,
          )
          from shared_engines.common.pagination import Page
          from shared_engines.common.result import Result
          from shared_engines.common.serialization import canonical_json_dumps
          from shared_engines.common.validation import (
              require_int_range,
              require_one_of,
              require_positive_number,
          )


          def test_canonical_json_is_stable_across_key_order() -> None:
              assert canonical_json_dumps({"b": 1, "a": 2}) == canonical_json_dumps(
                  {"a": 2, "b": 1}
              )
              assert canonical_json_dumps({"a": 2, "b": 1}) == '{"a":2,"b":1}'


          def test_canonical_json_rejects_unserializable() -> None:
              with pytest.raises(SerializationError):
                  canonical_json_dumps({"x": object()})


          def test_frozen_clock_advances() -> None:
              clock = FrozenClock(start=100.0)
              clock.sleep(5.0)
              assert clock.now() == 105.0


          def test_result_ok_and_err() -> None:
              ok: Result[int] = Result.ok(3)
              assert ok.ok
              assert ok.value == 3
              err: Result[int] = Result.err(ConfigurationError("bad"))
              assert not err.ok
              assert err.error is not None
              with pytest.raises(ConfigurationError):
                  _ = err.value


          def test_result_requires_exactly_one_side() -> None:
              with pytest.raises(ConfigurationError):
                  Result[int](None, None)
              with pytest.raises(ConfigurationError):
                  Result[int](1, ConfigurationError("bad"))


          def test_page_navigation() -> None:
              page: Page[int] = Page(items=(1, 2), offset=0, limit=2, total=5)
              assert page.has_more
              assert page.next_offset == 2
              last: Page[int] = Page(items=(1,), offset=4, limit=2, total=5)
              assert not last.has_more
              assert last.next_offset is None


          def test_page_rejects_invalid_bounds() -> None:
              with pytest.raises(ValidationError):
                  Page(items=(), offset=-1, limit=2, total=0)


          def test_require_int_range_rejects_out_of_band() -> None:
              with pytest.raises(ValidationError):
                  require_int_range(-1, "offset", 0, 10)
              with pytest.raises(ConfigurationError):
                  require_int_range(-1, "busy_timeout_ms", 1, 600_000, config=True)


          def test_require_positive_number_rejects_bad_values() -> None:
              with pytest.raises(ValidationError):
                  require_positive_number(-1.0, "timeout")
              with pytest.raises(ValidationError):
                  require_positive_number(0, "timeout")
              with pytest.raises(ValidationError):
                  require_positive_number(float("inf"), "timeout")
              with pytest.raises(ConfigurationError):
                  require_positive_number(0, "timeout", config=True)


          def test_require_one_of_accepts_only_listed_values() -> None:
              allowed = ("ROUND_HALF_EVEN", "ROUND_DOWN")
              picked = require_one_of("ROUND_HALF_EVEN", allowed, "mode")
              assert picked == "ROUND_HALF_EVEN"
              with pytest.raises(ValidationError):
                  require_one_of("ROUND_UP", allowed, "mode")
          PYEOF

