name: ZYRA - Foundation Core Block 03

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-core-03:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            foundation/state \
            foundation/validators \
            foundation/services \
            foundation/utils

          # ============================================================
          # STATE
          # ============================================================

          cat > foundation/state/state.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime, timezone
          from threading import RLock
          from typing import Any, Mapping


          class StateError(RuntimeError):
              """Base state error."""


          class StateConflictError(StateError):
              """Raised when an expected state version is stale."""


          @dataclass(frozen=True, slots=True)
          class StateSnapshot:
              version: int
              values: Mapping[str, Any]
              updated_at: datetime

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "version": self.version,
                      "values": dict(self.values),
                      "updated_at": self.updated_at.isoformat(),
                  }


          class StateStore:
              """
              Thread-safe in-memory state primitive.

              This is the authoritative state interface for a single
              process. Persistent/distributed state implementations must
              implement their own adapter above this foundation layer.
              """

              def __init__(
                  self,
                  initial: Mapping[str, Any] | None = None,
              ) -> None:
                  self._values = dict(initial or {})
                  self._version = 0
                  self._updated_at = datetime.now(
                      timezone.utc
                  )
                  self._lock = RLock()

              def get(
                  self,
                  key: str,
                  default: Any = None,
              ) -> Any:
                  self._validate_key(key)

                  with self._lock:
                      return self._values.get(
                          key,
                          default,
                      )

              def require(self, key: str) -> Any:
                  self._validate_key(key)

                  with self._lock:
                      if key not in self._values:
                          raise StateError(
                              f"State key not found: {key}"
                          )

                      return self._values[key]

              def set(
                  self,
                  key: str,
                  value: Any,
                  *,
                  expected_version: int | None = None,
              ) -> StateSnapshot:
                  self._validate_key(key)

                  with self._lock:
                      self._check_version(
                          expected_version
                      )

                      self._values[key] = value
                      self._version += 1
                      self._updated_at = datetime.now(
                          timezone.utc
                      )

                      return self.snapshot()

              def update(
                  self,
                  values: Mapping[str, Any],
                  *,
                  expected_version: int | None = None,
              ) -> StateSnapshot:
                  if not isinstance(values, Mapping):
                      raise TypeError(
                          "values must be a mapping"
                      )

                  for key in values:
                      self._validate_key(key)

                  with self._lock:
                      self._check_version(
                          expected_version
                      )

                      self._values.update(values)
                      self._version += 1
                      self._updated_at = datetime.now(
                          timezone.utc
                      )

                      return self.snapshot()

              def delete(
                  self,
                  key: str,
                  *,
                  expected_version: int | None = None,
              ) -> StateSnapshot:
                  self._validate_key(key)

                  with self._lock:
                      self._check_version(
                          expected_version
                      )

                      self._values.pop(key, None)
                      self._version += 1
                      self._updated_at = datetime.now(
                          timezone.utc
                      )

                      return self.snapshot()

              def snapshot(self) -> StateSnapshot:
                  with self._lock:
                      return StateSnapshot(
                          version=self._version,
                          values=dict(self._values),
                          updated_at=self._updated_at,
                      )

              @property
              def version(self) -> int:
                  with self._lock:
                      return self._version

              def clear(
                  self,
                  *,
                  expected_version: int | None = None,
              ) -> StateSnapshot:
                  with self._lock:
                      self._check_version(
                          expected_version
                      )

                      self._values.clear()
                      self._version += 1
                      self._updated_at = datetime.now(
                          timezone.utc
                      )

                      return self.snapshot()

              def _check_version(
                  self,
                  expected_version: int | None,
              ) -> None:
                  if (
                      expected_version is not None
                      and expected_version != self._version
                  ):
                      raise StateConflictError(
                          "State version conflict: "
                          f"expected={expected_version}, "
                          f"actual={self._version}"
                      )

              @staticmethod
              def _validate_key(key: str) -> None:
                  if (
                      not isinstance(key, str)
                      or not key.strip()
                  ):
                      raise ValueError(
                          "State key cannot be empty"
                      )
          PY

          cat > foundation/state/__init__.py <<'PY'
          from .state import (
              StateConflictError,
              StateError,
              StateSnapshot,
              StateStore,
          )

          __all__ = [
              "StateError",
              "StateConflictError",
              "StateSnapshot",
              "StateStore",
          ]
          PY

          # ============================================================
          # VALIDATORS
          # ============================================================

          cat > foundation/validators/validators.py <<'PY'
          from __future__ import annotations

          import re
          from collections.abc import Mapping, Sequence
          from typing import Any, Callable


          class ValidationFailure(ValueError):
              """Raised when validation fails."""


          class Validator:
              """Composable production validation primitives."""

              @staticmethod
              def required(
                  value: Any,
                  field: str,
              ) -> Any:
                  if value is None:
                      raise ValidationFailure(
                          f"{field} is required"
                      )

                  if (
                      isinstance(value, str)
                      and not value.strip()
                  ):
                      raise ValidationFailure(
                          f"{field} cannot be empty"
                      )

                  return value

              @staticmethod
              def string(
                  value: Any,
                  field: str,
                  *,
                  min_length: int | None = None,
                  max_length: int | None = None,
              ) -> str:
                  if not isinstance(value, str):
                      raise ValidationFailure(
                          f"{field} must be a string"
                      )

                  length = len(value)

                  if (
                      min_length is not None
                      and length < min_length
                  ):
                      raise ValidationFailure(
                          f"{field} is too short"
                      )

                  if (
                      max_length is not None
                      and length > max_length
                  ):
                      raise ValidationFailure(
                          f"{field} is too long"
                      )

                  return value

              @staticmethod
              def integer(
                  value: Any,
                  field: str,
                  *,
                  minimum: int | None = None,
                  maximum: int | None = None,
              ) -> int:
                  if (
                      isinstance(value, bool)
                      or not isinstance(value, int)
                  ):
                      raise ValidationFailure(
                          f"{field} must be an integer"
                      )

                  if (
                      minimum is not None
                      and value < minimum
                  ):
                      raise ValidationFailure(
                          f"{field} is below minimum"
                      )

                  if (
                      maximum is not None
                      and value > maximum
                  ):
                      raise ValidationFailure(
                          f"{field} exceeds maximum"
                      )

                  return value

              @staticmethod
              def number(
                  value: Any,
                  field: str,
                  *,
                  minimum: float | None = None,
                  maximum: float | None = None,
              ) -> int | float:
                  if (
                      isinstance(value, bool)
                      or not isinstance(
                          value,
                          (int, float),
                      )
                  ):
                      raise ValidationFailure(
                          f"{field} must be numeric"
                      )

                  numeric = float(value)

                  if (
                      minimum is not None
                      and numeric < minimum
                  ):
                      raise ValidationFailure(
                          f"{field} is below minimum"
                      )

                  if (
                      maximum is not None
                      and numeric > maximum
                  ):
                      raise ValidationFailure(
                          f"{field} exceeds maximum"
                      )

                  return value

              @staticmethod
              def boolean(
                  value: Any,
                  field: str,
              ) -> bool:
                  if not isinstance(value, bool):
                      raise ValidationFailure(
                          f"{field} must be boolean"
                      )

                  return value

              @staticmethod
              def mapping(
                  value: Any,
                  field: str,
              ) -> Mapping[str, Any]:
                  if not isinstance(value, Mapping):
                      raise ValidationFailure(
                          f"{field} must be an object"
                      )

                  return value

              @staticmethod
              def sequence(
                  value: Any,
                  field: str,
              ) -> Sequence[Any]:
                  if (
                      isinstance(value, (str, bytes))
                      or not isinstance(
                          value,
                          Sequence,
                      )
                  ):
                      raise ValidationFailure(
                          f"{field} must be a sequence"
                      )

                  return value

              @staticmethod
              def one_of(
                  value: Any,
                  field: str,
                  allowed: set[Any] | frozenset[Any],
              ) -> Any:
                  if value not in allowed:
                      raise ValidationFailure(
                          f"{field} contains an unsupported value"
                      )

                  return value

              @staticmethod
              def pattern(
                  value: str,
                  field: str,
                  expression: str,
              ) -> str:
                  Validator.string(value, field)

                  if re.fullmatch(
                      expression,
                      value,
                  ) is None:
                      raise ValidationFailure(
                          f"{field} has invalid format"
                      )

                  return value

              @staticmethod
              def custom(
                  value: Any,
                  field: str,
                  predicate: Callable[[Any], bool],
                  message: str,
              ) -> Any:
                  if not predicate(value):
                      raise ValidationFailure(
                          f"{field}: {message}"
                      )

                  return value
          PY

          cat > foundation/validators/__init__.py <<'PY'
          from .validators import (
              ValidationFailure,
              Validator,
          )

          __all__ = [
              "ValidationFailure",
              "Validator",
          ]
          PY

          # ============================================================
          # SERVICES
          # ============================================================

          cat > foundation/services/services.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock
          from typing import Any, Protocol


          class ServiceError(RuntimeError):
              """Base service error."""


          class ServiceAlreadyRegistered(ServiceError):
              """Service name already exists."""


          class ServiceNotFound(ServiceError):
              """Service name does not exist."""


          class Service(Protocol):
              def start(self) -> None:
                  ...

              def stop(self) -> None:
                  ...


          @dataclass(frozen=True, slots=True)
          class ServiceRecord:
              name: str
              service: Service
              started: bool = False


          class ServiceContainer:
              """
              Thread-safe dependency/service container.

              Services are explicitly registered and lifecycle-managed.
              Dependency injection remains independent of any framework.
              """

              def __init__(self) -> None:
                  self._services: dict[
                      str,
                      ServiceRecord,
                  ] = {}

                  self._lock = RLock()

              def register(
                  self,
                  name: str,
                  service: Service,
              ) -> None:
                  if not name.strip():
                      raise ValueError(
                          "Service name cannot be empty"
                      )

                  if not hasattr(service, "start") or not hasattr(
                      service,
                      "stop",
                  ):
                      raise TypeError(
                          "Service must implement start() and stop()"
                      )

                  with self._lock:
                      if name in self._services:
                          raise ServiceAlreadyRegistered(
                              f"Service already registered: {name}"
                          )

                      self._services[name] = ServiceRecord(
                          name=name,
                          service=service,
                          started=False,
                      )

              def resolve(
                  self,
                  name: str,
              ) -> Service:
                  with self._lock:
                      record = self._services.get(name)

                      if record is None:
                          raise ServiceNotFound(
                              f"Service not found: {name}"
                          )

                      return record.service

              def start_all(self) -> None:
                  with self._lock:
                      records = tuple(
                          self._services.values()
                      )

                  started: list[str] = []

                  try:
                      for record in records:
                          record.service.start()
                          started.append(record.name)

                          with self._lock:
                              self._services[
                                  record.name
                              ] = ServiceRecord(
                                  name=record.name,
                                  service=record.service,
                                  started=True,
                              )

                  except Exception:
                      for name in reversed(started):
                          self._safe_stop(name)

                      raise

              def stop_all(self) -> None:
                  with self._lock:
                      records = tuple(
                          self._services.values()
                      )

                  for record in reversed(records):
                      if record.started:
                          record.service.stop()

                          with self._lock:
                              self._services[
                                  record.name
                              ] = ServiceRecord(
                                  name=record.name,
                                  service=record.service,
                                  started=False,
                              )

              def unregister(self, name: str) -> bool:
                  with self._lock:
                      record = self._services.pop(
                          name,
                          None,
                      )

                  if record is None:
                      return False

                  if record.started:
                      record.service.stop()

                  return True

              def names(self) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(
                          sorted(self._services)
                      )

              def status(self) -> dict[str, bool]:
                  with self._lock:
                      return {
                          name: record.started
                          for name, record
                          in self._services.items()
                      }

              def _safe_stop(self, name: str) -> None:
                  with self._lock:
                      record = self._services.get(name)

                  if record is None:
                      return

                  try:
                      record.service.stop()
                  finally:
                      with self._lock:
                          self._services[
                              name
                          ] = ServiceRecord(
                              name=name,
                              service=record.service,
                              started=False,
                          )
          PY

          cat > foundation/services/__init__.py <<'PY'
          from .services import (
              Service,
              ServiceAlreadyRegistered,
              ServiceContainer,
              ServiceError,
              ServiceNotFound,
              ServiceRecord,
          )

          __all__ = [
              "Service",
              "ServiceError",
              "ServiceAlreadyRegistered",
              "ServiceNotFound",
              "ServiceRecord",
              "ServiceContainer",
          ]
          PY

          # ============================================================
          # UTILS
          # ============================================================

          cat > foundation/utils/utils.py <<'PY'
          from __future__ import annotations

          import re
          import unicodedata
          from collections.abc import Iterable, Mapping
          from typing import Any


          _WHITESPACE = re.compile(r"\s+")


          def normalize_text(
              value: str,
          ) -> str:
              if not isinstance(value, str):
                  raise TypeError(
                      "value must be a string"
                  )

              normalized = unicodedata.normalize(
                  "NFKC",
                  value,
              )

              return _WHITESPACE.sub(
                  " ",
                  normalized,
              ).strip()


          def normalize_identifier(
              value: str,
          ) -> str:
              normalized = normalize_text(
                  value
              ).lower()

              normalized = re.sub(
                  r"[^a-z0-9._:-]",
                  "-",
                  normalized,
              )

              normalized = re.sub(
                  r"-{2,}",
                  "-",
                  normalized,
              )

              return normalized.strip("-")


          def deep_copy_mapping(
              value: Mapping[str, Any],
          ) -> dict[str, Any]:
              if not isinstance(value, Mapping):
                  raise TypeError(
                      "value must be a mapping"
                  )

              def copy_item(item: Any) -> Any:
                  if isinstance(item, Mapping):
                      return {
                          str(key): copy_item(val)
                          for key, val in item.items()
                      }

                  if isinstance(item, list):
                      return [
                          copy_item(val)
                          for val in item
                      ]

                  if isinstance(item, tuple):
                      return tuple(
                          copy_item(val)
                          for val in item
                      )

                  if isinstance(item, set):
                      return {
                          copy_item(val)
                          for val in item
                      }

                  return item

              return copy_item(value)


          def compact_dict(
              value: Mapping[str, Any],
          ) -> dict[str, Any]:
              return {
                  key: item
                  for key, item in value.items()
                  if item is not None
              }


          def chunks(
              values: Iterable[Any],
              size: int,
          ) -> Iterable[list[Any]]:
              if size <= 0:
                  raise ValueError(
                      "size must be positive"
                  )

              batch: list[Any] = []

              for value in values:
                  batch.append(value)

                  if len(batch) == size:
                      yield batch
                      batch = []

              if batch:
                  yield batch


          def clamp(
              value: float,
              minimum: float,
              maximum: float,
          ) -> float:
              if minimum > maximum:
                  raise ValueError(
                      "minimum cannot exceed maximum"
                  )

              return max(
                  minimum,
                  min(value, maximum),
              )
          PY

          cat > foundation/utils/__init__.py <<'PY'
          from .utils import (
              chunks,
              clamp,
              compact_dict,
              deep_copy_mapping,
              normalize_identifier,
              normalize_text,
          )

          __all__ = [
              "normalize_text",
              "normalize_identifier",
              "deep_copy_mapping",
              "compact_dict",
              "chunks",
              "clamp",
          ]
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from foundation.state import (
              StateConflictError,
              StateStore,
          )
          from foundation.validators import (
              ValidationFailure,
              Validator,
          )
          from foundation.services import (
              ServiceContainer,
          )
          from foundation.utils import (
              normalize_text,
              normalize_identifier,
              compact_dict,
              chunks,
              clamp,
          )


          # STATE
          state = StateStore(
              {"status": "created"}
          )

          snapshot = state.set(
              "status",
              "running",
          )

          assert snapshot.version == 1
          assert state.get("status") == "running"

          try:
              state.set(
                  "status",
                  "failed",
                  expected_version=0,
              )
          except StateConflictError:
              pass
          else:
              raise AssertionError(
                  "Stale state update was accepted"
              )


          # VALIDATORS
          assert Validator.string(
              "zyra",
              "name",
              min_length=2,
          ) == "zyra"

          assert Validator.integer(
              10,
              "count",
              minimum=1,
          ) == 10

          try:
              Validator.required(
                  "",
                  "name",
              )
          except ValidationFailure:
              pass
          else:
              raise AssertionError(
                  "Invalid value accepted"
              )


          # SERVICES
          class TestService:
              def __init__(self):
                  self.started = False

              def start(self):
                  self.started = True

              def stop(self):
                  self.started = False


          service = TestService()
          container = ServiceContainer()

          container.register(
              "test",
              service,
          )

          container.start_all()

          assert service.started
          assert container.status()["test"]

          container.stop_all()

          assert not service.started


          # UTILS
          assert normalize_text(
              "  ZYRA   Network  "
          ) == "ZYRA Network"

          assert normalize_identifier(
              "ZYRA Network / Core"
          ) == "zyra-network-core"

          assert compact_dict(
              {"a": 1, "b": None}
          ) == {"a": 1}

          assert list(
              chunks(range(5), 2)
          ) == [
              [0, 1],
              [2, 3],
              [4],
          ]

          assert clamp(
              15,
              0,
              10,
          ) == 10

          print(
              "FOUNDATION CORE BLOCK 03: OK"
          )
          PY

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            foundation/state \
            foundation/validators \
            foundation/services \
            foundation/utils

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ZYRA Network"
          git config user.email "actions@users.noreply.github.com"

          git add \
            foundation/state \
            foundation/validators \
            foundation/services \
            foundation/utils

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "feat: production foundation state validators services utils"
          git push
