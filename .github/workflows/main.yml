                  try:
                      connection.execute("BEGIN IMMEDIATE")

                      cursor = connection.execute(
                          """
                          UPDATE ai_requests
                          SET
                              lease_until = ?,
                              updated_at = ?
                          WHERE
                              idempotency_key = ?
                              AND status = 'running'
