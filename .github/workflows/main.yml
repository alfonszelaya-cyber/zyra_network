          from __future__ import annotations

          import threading
          from contextlib import contextmanager

          from .errors import BackpressureError, BudgetExceededError


          class ConcurrencyLimiter:
              def __init__(self, maximum: int) -> None:
                  self._semaphore = threading.BoundedSemaphore(maximum)

              @contextmanager
              def acquire(self):
                  acquired = self._semaphore.acquire(blocking=False)
                  if not acquired:
                      raise BackpressureError("AI concurrency limit reached")
                  try:
                      yield
                  finally:
                      self._semaphore.release()


          class CostBudget:
              def __init__(self, limit: int) -> None:
                  self.limit = limit

              def validate(self, estimated_cost: int) -> None:
                  if estimated_cost < 0:
                      raise BudgetExceededError("negative cost is invalid")
                  if estimated_cost > self.limit:
                      raise BudgetExceededError(
                          f"estimated cost {estimated_cost} exceeds limit {self.limit}"
                      )
          PY

