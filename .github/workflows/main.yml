name: Storage - Block 03

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  storage-block-03:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare storage directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p storage/cold_storage
          mkdir -p storage/encrypted_backups
          mkdir -p storage/shards

      - name: Implement cold storage
        shell: bash
        run: |
          set -euo pipefail

          cat > storage/cold_storage/cold_storage_engine.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime, timezone
          from pathlib import Path
          from threading import RLock
          from typing import BinaryIO
          from uuid import UUID, uuid4


          @dataclass(frozen=True, slots=True)
          class ColdObject:
              object_id: UUID
              key: str
              size_bytes: int
              created_at: datetime
              path: str

              def __post_init__(self) -> None:
                  if not self.key.strip():
                      raise ValueError(
                          "Cold storage key cannot be empty"
                      )

                  if self.size_bytes < 0:
                      raise ValueError(
                          "Object size cannot be negative"
                      )


          class ColdStorageEngine:
              def __init__(
                  self,
                  root: str | Path,
              ) -> None:

                  self.root = Path(root)
                  self.root.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  self._lock = RLock()

              def _safe_path(
                  self,
                  key: str,
              ) -> Path:

                  normalized = key.strip().lstrip("/")

                  if not normalized:
                      raise ValueError(
                          "Storage key cannot be empty"
                      )

                  path = (
                      self.root / normalized
                  ).resolve()

                  root = self.root.resolve()

                  if (
                      path != root
                      and root not in path.parents
                  ):
                      raise ValueError(
                          "Storage key escapes storage root"
                      )

                  return path

              def put(
                  self,
                  key: str,
                  data: bytes | bytearray | memoryview,
              ) -> ColdObject:

                  payload = bytes(data)
                  path = self._safe_path(key)

                  with self._lock:
                      path.parent.mkdir(
                          parents=True,
                          exist_ok=True,
                      )

                      path.write_bytes(payload)

                      return ColdObject(
                          object_id=uuid4(),
                          key=key.strip().lstrip("/"),
                          size_bytes=len(payload),
                          created_at=datetime.now(
                              timezone.utc
                          ),
                          path=str(path),
                      )

              def put_stream(
                  self,
                  key: str,
                  stream: BinaryIO,
                  *,
                  chunk_size: int = 1024 * 1024,
              ) -> ColdObject:

                  if chunk_size <= 0:
                      raise ValueError(
                          "chunk_size must be positive"
                      )

                  path = self._safe_path(key)

                  total = 0

                  with self._lock:
                      path.parent.mkdir(
                          parents=True,
                          exist_ok=True,
                      )

                      with path.open("wb") as output:
                          while True:
                              chunk = stream.read(
                                  chunk_size
                              )

                              if not chunk:
                                  break

                              output.write(chunk)
                              total += len(chunk)

                  return ColdObject(
                      object_id=uuid4(),
                      key=key.strip().lstrip("/"),
                      size_bytes=total,
                      created_at=datetime.now(
                          timezone.utc
                      ),
                      path=str(path),
                  )

              def get(
                  self,
                  key: str,
              ) -> bytes:

                  path = self._safe_path(key)

                  with self._lock:
                      if not path.is_file():
                          raise FileNotFoundError(
                              f"Cold object not found: {key}"
                          )

                      return path.read_bytes()

              def exists(
                  self,
                  key: str,
              ) -> bool:

                  return self._safe_path(
                      key
                  ).is_file()

              def delete(
                  self,
                  key: str,
              ) -> bool:

                  path = self._safe_path(key)

                  with self._lock:
                      if not path.is_file():
                          return False

                      path.unlink()
                      return True

              def size(
                  self,
                  key: str,
              ) -> int:

                  path = self._safe_path(key)

                  with self._lock:
                      if not path.is_file():
                          raise FileNotFoundError(
                              f"Cold object not found: {key}"
                          )

                      return path.stat().st_size


          __all__ = [
              "ColdObject",
              "ColdStorageEngine",
          ]
          PY

          cat > storage/cold_storage/cold_storage_manager.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock

          from .cold_storage_engine import (
              ColdObject,
              ColdStorageEngine,
          )


          @dataclass(frozen=True, slots=True)
          class StorageOperation:
              operation: str
              key: str
              success: bool


          class ColdStorageManager:
              def __init__(
                  self,
                  engine: ColdStorageEngine,
              ) -> None:

                  self.engine = engine
                  self._lock = RLock()

              def store(
                  self,
                  key: str,
                  data: bytes,
              ) -> ColdObject:

                  with self._lock:
                      return self.engine.put(
                          key,
                          data,
                      )

              def retrieve(
                  self,
                  key: str,
              ) -> bytes:

                  with self._lock:
                      return self.engine.get(key)

              def remove(
                  self,
                  key: str,
              ) -> StorageOperation:

                  with self._lock:
                      success = self.engine.delete(
                          key
                      )

                      return StorageOperation(
                          operation="delete",
                          key=key,
                          success=success,
                      )

              def contains(
                  self,
                  key: str,
              ) -> bool:

                  with self._lock:
                      return self.engine.exists(
                          key
                      )


          __all__ = [
              "StorageOperation",
              "ColdStorageManager",
          ]
          PY

          cat > storage/cold_storage/cold_storage_registry.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock
          from uuid import UUID


          @dataclass(frozen=True, slots=True)
          class StorageRecord:
              object_id: UUID
              key: str
              size_bytes: int
              location: str

              def __post_init__(self) -> None:
                  if not self.key.strip():
                      raise ValueError(
                          "Storage record key cannot be empty"
                      )

                  if self.size_bytes < 0:
                      raise ValueError(
                          "Storage record size cannot be negative"
                      )


          class ColdStorageRegistry:
              def __init__(self) -> None:
                  self._records: dict[
                      str,
                      StorageRecord,
                  ] = {}

                  self._lock = RLock()

              def register(
                  self,
                  record: StorageRecord,
                  *,
                  replace: bool = False,
              ) -> None:

                  key = record.key.strip()

                  with self._lock:
                      if (
                          key in self._records
                          and not replace
                      ):
                          raise ValueError(
                              f"Storage record already exists: {key}"
                          )

                      self._records[key] = record

              def get(
                  self,
                  key: str,
              ) -> StorageRecord:

                  with self._lock:
                      try:
                          return self._records[
                              key.strip()
                          ]
                      except KeyError as exc:
                          raise LookupError(
                              f"Storage record not found: {key}"
                          ) from exc

              def remove(
                  self,
                  key: str,
              ) -> bool:

                  with self._lock:
                      return (
                          self._records.pop(
                              key.strip(),
                              None,
                          )
                          is not None
                      )

              def list(
                  self,
              ) -> tuple[StorageRecord, ...]:

                  with self._lock:
                      return tuple(
                          self._records[key]
                          for key in sorted(
                              self._records
                          )
                      )


          __all__ = [
              "StorageRecord",
              "ColdStorageRegistry",
          ]
          PY

