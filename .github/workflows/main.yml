name: Infrastructure - Block 01

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  infrastructure-block-01:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare infrastructure directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p infrastructure
          mkdir -p infrastructure/bootstrap
          mkdir -p infrastructure/config
          mkdir -p infrastructure/container
          mkdir -p infrastructure/database
          mkdir -p infrastructure/cache
          mkdir -p infrastructure/runtime
          mkdir -p infrastructure/storage_adapter

      - name: Infrastructure root
        shell: bash
        run: |
          set -euo pipefail

          cat > infrastructure/__init__.py <<'PY'
          """
          ZYRA Network infrastructure layer.
          """

          from .cache import Cache, CacheEntry, CacheStats
          from .config import (
              Configuration,
              ConfigurationError,
              Environment,
          )
          from .container import (
              Container,
              DependencyError,
              Lifetime,
          )
          from .database import (
              Database,
              DatabaseError,
              Transaction,
          )
          from .runtime import (
              Runtime,
              RuntimeErrorState,
              RuntimeSnapshot,
              RuntimeState,
          )
          from .storage_adapter import (
              StorageAdapter,
              StorageError,
          )

          __all__ = [
              "Cache",
              "CacheEntry",
              "CacheStats",
              "Configuration",
              "ConfigurationError",
              "Environment",
              "Container",
              "DependencyError",
              "Lifetime",
              "Database",
              "DatabaseError",
              "Transaction",
              "Runtime",
              "RuntimeErrorState",
              "RuntimeSnapshot",
              "RuntimeState",
              "StorageAdapter",
              "StorageError",
          ]
          PY

      - name: Configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > infrastructure/config/config.py <<'PY'
          from __future__ import annotations

          import os
          from dataclasses import dataclass
          from enum import Enum
          from typing import Mapping


          class ConfigurationError(ValueError):
              """Raised when infrastructure configuration is invalid."""


          class Environment(str, Enum):
              DEVELOPMENT = "development"
              TESTING = "testing"
              STAGING = "staging"
              PRODUCTION = "production"

              @classmethod
              def parse(cls, value: str) -> "Environment":
                  normalized = value.strip().lower()

                  aliases = {
                      "dev": cls.DEVELOPMENT,
                      "development": cls.DEVELOPMENT,
                      "test": cls.TESTING,
                      "testing": cls.TESTING,
                      "stage": cls.STAGING,
                      "staging": cls.STAGING,
                      "prod": cls.PRODUCTION,
                      "production": cls.PRODUCTION,
                  }

                  try:
                      return aliases[normalized]
                  except KeyError as exc:
                      raise ConfigurationError(
                          f"Unsupported environment: {value}"
                      ) from exc


          def _parse_bool(
              value: str,
              name: str,
          ) -> bool:
              normalized = value.strip().lower()

              if normalized in {
                  "1",
                  "true",
                  "yes",
                  "on",
              }:
                  return True

              if normalized in {
                  "0",
                  "false",
                  "no",
                  "off",
              }:
                  return False

              raise ConfigurationError(
                  f"{name} must be a boolean value"
              )


          def _parse_positive_int(
              value: str,
              name: str,
          ) -> int:
              try:
                  parsed = int(value)
              except ValueError as exc:
                  raise ConfigurationError(
                      f"{name} must be an integer"
                  ) from exc

              if parsed <= 0:
                  raise ConfigurationError(
                      f"{name} must be greater than zero"
                  )

              return parsed


          def _parse_non_negative_int(
              value: str,
              name: str,
          ) -> int:
              try:
                  parsed = int(value)
              except ValueError as exc:
                  raise ConfigurationError(
                      f"{name} must be an integer"
                  ) from exc

              if parsed < 0:
                  raise ConfigurationError(
                      f"{name} cannot be negative"
                  )

              return parsed


          @dataclass(frozen=True, slots=True)
          class Configuration:
              environment: Environment
              service_name: str
              node_id: str
              data_directory: str
              database_path: str
              cache_capacity: int
              cache_default_ttl_seconds: int
              database_timeout_seconds: int
              database_wal: bool
              shutdown_timeout_seconds: int
              strict_configuration: bool

              @classmethod
              def from_mapping(
                  cls,
                  values: Mapping[str, str],
              ) -> "Configuration":

                  environment = Environment.parse(
                      values.get(
                          "ZYRA_ENVIRONMENT",
                          "production",
                      )
                  )

                  service_name = values.get(
                      "ZYRA_SERVICE_NAME",
                      "zyra-network",
                  ).strip()

                  node_id = values.get(
                      "ZYRA_NODE_ID",
                      "node-default",
                  ).strip()

                  data_directory = values.get(
                      "ZYRA_DATA_DIRECTORY",
                      "./data",
                  ).strip()

                  database_path = values.get(
                      "ZYRA_DATABASE_PATH",
                      "./data/zyra.db",
                  ).strip()

                  if not service_name:
                      raise ConfigurationError(
                          "ZYRA_SERVICE_NAME cannot be empty"
                      )

                  if not node_id:
                      raise ConfigurationError(
                          "ZYRA_NODE_ID cannot be empty"
                      )

                  if not data_directory:
                      raise ConfigurationError(
                          "ZYRA_DATA_DIRECTORY cannot be empty"
                      )

                  if not database_path:
                      raise ConfigurationError(
                          "ZYRA_DATABASE_PATH cannot be empty"
                      )

                  return cls(
                      environment=environment,
                      service_name=service_name,
                      node_id=node_id,
                      data_directory=data_directory,
                      database_path=database_path,
                      cache_capacity=_parse_positive_int(
                          values.get(
                              "ZYRA_CACHE_CAPACITY",
                              "4096",
                          ),
                          "ZYRA_CACHE_CAPACITY",
                      ),
                      cache_default_ttl_seconds=_parse_positive_int(
                          values.get(
                              "ZYRA_CACHE_DEFAULT_TTL_SECONDS",
                              "300",
                          ),
                          "ZYRA_CACHE_DEFAULT_TTL_SECONDS",
                      ),
                      database_timeout_seconds=_parse_positive_int(
                          values.get(
                              "ZYRA_DATABASE_TIMEOUT_SECONDS",
                              "30",
                          ),
                          "ZYRA_DATABASE_TIMEOUT_SECONDS",
                      ),
                      database_wal=_parse_bool(
                          values.get(
                              "ZYRA_DATABASE_WAL",
                              "true",
                          ),
                          "ZYRA_DATABASE_WAL",
                      ),
                      shutdown_timeout_seconds=_parse_non_negative_int(
                          values.get(
                              "ZYRA_SHUTDOWN_TIMEOUT_SECONDS",
                              "30",
                          ),
                          "ZYRA_SHUTDOWN_TIMEOUT_SECONDS",
                      ),
                      strict_configuration=_parse_bool(
                          values.get(
                              "ZYRA_STRICT_CONFIGURATION",
                              "true",
                          ),
                          "ZYRA_STRICT_CONFIGURATION",
                      ),
                  )

              @classmethod
              def from_environment(
                  cls,
              ) -> "Configuration":
                  return cls.from_mapping(os.environ)

              def require_production_safe(self) -> None:
                  if self.environment is not Environment.PRODUCTION:
                      return

                  if not self.strict_configuration:
                      raise ConfigurationError(
                          "Strict configuration must be enabled in production"
                      )

                  if self.node_id == "node-default":
                      raise ConfigurationError(
                          "ZYRA_NODE_ID must be explicitly configured in production"
                      )

                  if self.service_name == "zyra-network":
                      raise ConfigurationError(
                          "ZYRA_SERVICE_NAME must be explicitly configured in production"
                      )


          __all__ = [
              "Configuration",
              "ConfigurationError",
              "Environment",
          ]
          PY

          cat > infrastructure/config/__init__.py <<'PY'
          from .config import (
              Configuration,
              ConfigurationError,
              Environment,
          )

          __all__ = [
              "Configuration",
              "ConfigurationError",
              "Environment",
          ]
          PY

      - name: Container
        shell: bash
        run: |
          set -euo pipefail

          cat > infrastructure/container/container.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from enum import Enum
          from threading import RLock
          from typing import Any, Callable


          class DependencyError(RuntimeError):
              """Raised when dependency resolution fails."""


          class Lifetime(str, Enum):
              TRANSIENT = "transient"
              SINGLETON = "singleton"


          Factory = Callable[["Container"], Any]


          @dataclass(slots=True)
          class _Registration:
              factory: Factory
              lifetime: Lifetime
              instance: Any = None
              initialized: bool = False


          class Container:
              """
              Thread-safe dependency injection container.
              """

              def __init__(self) -> None:
                  self._registrations: dict[
                      object,
                      _Registration,
                  ] = {}

                  self._lock = RLock()
                  self._closed = False

              def register(
                  self,
                  key: object,
                  factory: Factory,
                  *,
                  lifetime: Lifetime = Lifetime.TRANSIENT,
                  replace: bool = False,
              ) -> None:

                  if self._closed:
                      raise DependencyError(
                          "Container is closed"
                      )

                  if not callable(factory):
                      raise TypeError(
                          "Dependency factory must be callable"
                      )

                  with self._lock:
                      if (
                          key in self._registrations
                          and not replace
                      ):
                          raise DependencyError(
                              f"Dependency already registered: {key!r}"
                          )

                      self._registrations[key] = _Registration(
                          factory=factory,
                          lifetime=lifetime,
                      )

              def register_instance(
                  self,
                  key: object,
                  instance: Any,
                  *,
                  replace: bool = False,
              ) -> None:

                  if instance is None:
                      raise ValueError(
                          "Container instance cannot be None"
                      )

                  def factory(
                      _container: Container,
                  ) -> Any:
                      return instance

                  self.register(
                      key,
                      factory,
                      lifetime=Lifetime.SINGLETON,
                      replace=replace,
                  )

              def resolve(
                  self,
                  key: object,
              ) -> Any:

                  with self._lock:
                      if self._closed:
                          raise DependencyError(
                              "Container is closed"
                          )

                      try:
                          registration = (
                              self._registrations[key]
                          )
                      except KeyError as exc:
                          raise DependencyError(
                              f"Dependency not registered: {key!r}"
                          ) from exc

                      if (
                          registration.lifetime
                          is Lifetime.SINGLETON
                      ):
                          if not registration.initialized:
                              instance = registration.factory(
                                  self
                              )

                              if instance is None:
                                  raise DependencyError(
                                      f"Factory returned None: {key!r}"
                                  )

                              registration.instance = instance
                              registration.initialized = True

                          return registration.instance

                      instance = registration.factory(
                          self
                      )

                      if instance is None:
                          raise DependencyError(
                              f"Factory returned None: {key!r}"
                          )

                      return instance

              def contains(
                  self,
                  key: object,
              ) -> bool:

                  with self._lock:
                      return key in self._registrations

              def remove(
                  self,
                  key: object,
              ) -> bool:

                  with self._lock:
                      registration = (
                          self._registrations.pop(
                              key,
                              None,
                          )
                      )

                  if registration is None:
                      return False

                  instance = registration.instance

                  if instance is not None:
                      close = getattr(
                          instance,
                          "close",
                          None,
                      )

                      if callable(close):
                          close()

                  return True

              def keys(self) -> tuple[object, ...]:
                  with self._lock:
                      return tuple(
                          self._registrations.keys()
                      )

              def close(self) -> None:
                  with self._lock:
                      if self._closed:
                          return

                      registrations = tuple(
                          self._registrations.values()
                      )

                      self._closed = True
                      self._registrations.clear()

                  errors: list[BaseException] = []

                  for registration in reversed(
                      registrations
                  ):
                      instance = registration.instance

                      if instance is None:
                          continue

                      close = getattr(
                          instance,
                          "close",
                          None,
                      )

                      if not callable(close):
                          continue

                      try:
                          close()
                      except BaseException as exc:
                          errors.append(exc)

                  if errors:
                      raise DependencyError(
                          f"{len(errors)} dependency close operation(s) failed"
                      )

              @property
              def closed(self) -> bool:
                  with self._lock:
                      return self._closed


          __all__ = [
              "Container",
              "DependencyError",
              "Lifetime",
          ]
          PY

          cat > infrastructure/container/__init__.py <<'PY'
          from .container import (
              Container,
              DependencyError,
              Lifetime,
          )

          __all__ = [
              "Container",
              "DependencyError",
              "Lifetime",
          ]
          PY

      - name: Database
        shell: bash
        run: |
          set -euo pipefail

          cat > infrastructure/database/database.py <<'PY'
          from __future__ import annotations

          import sqlite3
          from contextlib import contextmanager
          from pathlib import Path
          from threading import RLock
          from typing import Iterator, Sequence


          class DatabaseError(RuntimeError):
              """Raised for infrastructure database failures."""


          class Transaction:
              """
              Explicit transaction boundary.

              The connection uses autocommit mode, therefore explicit
              BEGIN/COMMIT/ROLLBACK statements are used for transactions.
              """

              def __init__(
                  self,
                  connection: sqlite3.Connection,
                  lock: RLock,
              ) -> None:
                  self._connection = connection
                  self._lock = lock
                  self._entered = False

              def __enter__(
                  self,
              ) -> sqlite3.Connection:

                  self._lock.acquire()

                  try:
                      self._connection.execute(
                          "BEGIN"
                      )
                      self._entered = True
                      return self._connection
                  except sqlite3.Error as exc:
                      self._lock.release()

                      raise DatabaseError(
                          "Unable to begin transaction"
                      ) from exc

              def __exit__(
                  self,
                  exc_type,
                  exc_value,
                  traceback,
              ) -> bool:

                  try:
                      if exc_type is None:
                          self._connection.execute(
                              "COMMIT"
                          )
                      else:
                          self._connection.execute(
                              "ROLLBACK"
                          )
                  except sqlite3.Error as exc:
                      try:
                          self._connection.execute(
                              "ROLLBACK"
                          )
                      except sqlite3.Error:
                          pass

                      raise DatabaseError(
                          "Transaction finalization failed"
                      ) from exc
                  finally:
                      self._entered = False
                      self._lock.release()

                  return False


          class Database:
              """
              Durable SQLite infrastructure backend.

              SQLite remains isolated behind this adapter so higher
              layers do not depend directly on sqlite3.
              """

              def __init__(
                  self,
                  path: str | Path,
                  *,
                  timeout_seconds: int = 30,
                  wal: bool = True,
              ) -> None:

                  if timeout_seconds <= 0:
                      raise ValueError(
                          "timeout_seconds must be positive"
                      )

                  self.path = Path(
                      path
                  ).expanduser()

                  if str(self.path) != ":memory:":
                      self.path.parent.mkdir(
                          parents=True,
                          exist_ok=True,
                      )

                  self._timeout_seconds = (
                      timeout_seconds
                  )

                  self._wal = wal
                  self._lock = RLock()
                  self._connection: (
                      sqlite3.Connection | None
                  ) = None
                  self._closed = False

                  self.open()

              def open(self) -> None:
                  with self._lock:
                      if self._closed:
                          raise DatabaseError(
                              "Database is closed"
                          )

                      if self._connection is not None:
                          return

                      try:
                          connection = sqlite3.connect(
                              str(self.path),
                              timeout=self._timeout_seconds,
                              isolation_level=None,
                              check_same_thread=False,
                          )

                          connection.row_factory = (
                              sqlite3.Row
                          )

                          connection.execute(
                              "PRAGMA foreign_keys = ON"
                          )

                          # SQLite does not support parameter
                          # placeholders inside PRAGMA assignments.
                          busy_timeout_ms = (
                              self._timeout_seconds * 1000
                          )

                          connection.execute(
                              f"PRAGMA busy_timeout = "
                              f"{busy_timeout_ms}"
                          )

                          if self._wal:
                              connection.execute(
                                  "PRAGMA journal_mode = WAL"
                              )

                          connection.execute(
                              "PRAGMA synchronous = NORMAL"
                          )

                          connection.execute(
                              "PRAGMA temp_store = MEMORY"
                          )

                          self._connection = connection

                      except sqlite3.Error as exc:
                          if self._connection is None:
                              try:
                                  connection.close()
                              except (
                                  UnboundLocalError,
                                  sqlite3.Error,
                              ):
                                  pass

                          raise DatabaseError(
                              "Unable to open database"
                          ) from exc

              def _require_connection(
                  self,
              ) -> sqlite3.Connection:

                  if self._closed:
                      raise DatabaseError(
                          "Database is closed"
                      )

                  if self._connection is None:
                      raise DatabaseError(
                          "Database is not open"
                      )

                  return self._connection

              def execute(
                  self,
                  sql: str,
                  parameters: Sequence[object] = (),
              ) -> sqlite3.Cursor:

                  if not sql.strip():
                      raise ValueError(
                          "SQL statement cannot be empty"
                      )

                  with self._lock:
                      connection = (
                          self._require_connection()
                      )

                      try:
                          return connection.execute(
                              sql,
                              tuple(parameters),
                          )
                      except sqlite3.Error as exc:
                          raise DatabaseError(
                              "Database execution failed"
                          ) from exc

              def executemany(
                  self,
                  sql: str,
                  parameter_sets: Sequence[
                      Sequence[object]
                  ],
              ) -> sqlite3.Cursor:

                  if not sql.strip():
                      raise ValueError(
                          "SQL statement cannot be empty"
                      )

                  with self._lock:
                      connection = (
                          self._require_connection()
                      )

                      try:
                          return connection.executemany(
                              sql,
                              [
                                  tuple(values)
                                  for values in parameter_sets
                              ],
                          )
                      except sqlite3.Error as exc:
                          raise DatabaseError(
                              "Database batch execution failed"
                          ) from exc

              def query(
                  self,
                  sql: str,
                  parameters: Sequence[object] = (),
              ) -> list[sqlite3.Row]:

                  cursor = self.execute(
                      sql,
                      parameters,
                  )

                  return cursor.fetchall()

              def query_one(
                  self,
                  sql: str,
                  parameters: Sequence[object] = (),
              ) -> sqlite3.Row | None:

                  cursor = self.execute(
                      sql,
                      parameters,
                  )

                  return cursor.fetchone()

              def transaction(self) -> Transaction:
                  with self._lock:
                      connection = (
                          self._require_connection()
                      )

                  return Transaction(
                      connection,
                      self._lock,
                  )

              def create_schema(
                  self,
                  statements: Sequence[str],
              ) -> None:

                  with self.transaction() as connection:
                      for statement in statements:
                          if not statement.strip():
                              continue

                          try:
                              connection.execute(
                                  statement
                              )
                          except sqlite3.Error as exc:
                              raise DatabaseError(
                                  "Schema initialization failed"
                              ) from exc

              @contextmanager
              def connection(
                  self,
              ) -> Iterator[sqlite3.Connection]:

                  with self._lock:
                      yield self._require_connection()

              def checkpoint(self) -> None:
                  with self._lock:
                      connection = (
                          self._require_connection()
                      )

                      try:
                          connection.execute(
                              "PRAGMA wal_checkpoint(PASSIVE)"
                          )
                      except sqlite3.Error as exc:
                          raise DatabaseError(
                              "Database checkpoint failed"
                          ) from exc

              def close(self) -> None:
                  with self._lock:
                      if self._closed:
                          return

                      connection = self._connection
                      self._connection = None
                      self._closed = True

                      if connection is None:
                          return

                      try:
                          connection.close()
                      except sqlite3.Error as exc:
                          raise DatabaseError(
                              "Database close failed"
                          ) from exc

              @property
              def closed(self) -> bool:
                  with self._lock:
                      return self._closed


          __all__ = [
              "Database",
              "DatabaseError",
              "Transaction",
          ]
          PY

          cat > infrastructure/database/__init__.py <<'PY'
          from .database import (
              Database,
              DatabaseError,
              Transaction,
          )

          __all__ = [
              "Database",
              "DatabaseError",
              "Transaction",
          ]
          PY

      - name: Cache
        shell: bash
        run: |
          set -euo pipefail

          cat > infrastructure/cache/cache.py <<'PY'
          from __future__ import annotations

          import time
          from collections import OrderedDict
          from dataclasses import dataclass
          from threading import RLock
          from typing import Generic, TypeVar


          T = TypeVar("T")


          @dataclass(frozen=True, slots=True)
          class CacheEntry(Generic[T]):
              value: T
              expires_at: float | None


          @dataclass(frozen=True, slots=True)
          class CacheStats:
              hits: int
              misses: int
              evictions: int
              expirations: int
              size: int
              capacity: int

              @property
              def hit_ratio(self) -> float:
                  total = self.hits + self.misses

                  if total == 0:
                      return 0.0

                  return self.hits / total


          class Cache(Generic[T]):
              """
              Thread-safe bounded LRU cache with TTL.

              Cache is never the source of truth for durable state.
              """

              def __init__(
                  self,
                  capacity: int = 4096,
                  default_ttl_seconds: int = 300,
              ) -> None:

                  if capacity <= 0:
                      raise ValueError(
                          "capacity must be positive"
                      )

                  if default_ttl_seconds <= 0:
                      raise ValueError(
                          "default_ttl_seconds must be positive"
                      )

                  self._capacity = capacity
                  self._default_ttl = (
                      default_ttl_seconds
                  )

                  self._entries: OrderedDict[
                      str,
                      CacheEntry[T],
                  ] = OrderedDict()

                  self._hits = 0
                  self._misses = 0
                  self._evictions = 0
                  self._expirations = 0

                  self._lock = RLock()
                  self._closed = False

              def _require_open(self) -> None:
                  if self._closed:
                      raise RuntimeError(
                          "Cache is closed"
                      )

              @staticmethod
              def _expiration(
                  ttl_seconds: int | None,
              ) -> float | None:

                  if ttl_seconds is None:
                      return None

                  if ttl_seconds <= 0:
                      raise ValueError(
                          "ttl_seconds must be positive"
                      )

                  return (
                      time.monotonic()
                      + ttl_seconds
                  )

              @staticmethod
              def _expired(
                  entry: CacheEntry[T],
              ) -> bool:

                  return (
                      entry.expires_at is not None
                      and time.monotonic()
                      >= entry.expires_at
                  )

              def set(
                  self,
                  key: str,
                  value: T,
                  *,
                  ttl_seconds: int | None = None,
              ) -> None:

                  key = key.strip()

                  if not key:
                      raise ValueError(
                          "Cache key cannot be empty"
                      )

                  with self._lock:
                      self._require_open()

                      self._entries.pop(
                          key,
                          None,
                      )

                      ttl = (
                          self._default_ttl
                          if ttl_seconds is None
                          else ttl_seconds
                      )

                      self._entries[key] = CacheEntry(
                          value=value,
                          expires_at=self._expiration(
                              ttl
                          ),
                      )

                      while (
                          len(self._entries)
                          > self._capacity
                      ):
                          self._entries.popitem(
                              last=False
                          )

                          self._evictions += 1

              def get(
                  self,
                  key: str,
                  default: T | None = None,
              ) -> T | None:

                  key = key.strip()

                  if not key:
                      raise ValueError(
                          "Cache key cannot be empty"
                      )

                  with self._lock:
                      self._require_open()

                      entry = self._entries.get(
                          key
                      )

                      if entry is None:
                          self._misses += 1
                          return default

                      if self._expired(entry):
                          self._entries.pop(
                              key,
                              None,
                          )

                          self._misses += 1
                          self._expirations += 1

                          return default

                      self._entries.move_to_end(
                          key
                      )

                      self._hits += 1

                      return entry.value

              def get_or_set(
                  self,
                  key: str,
                  factory,
                  *,
                  ttl_seconds: int | None = None,
              ) -> T:

                  existing = self.get(
                      key,
                      None,
                  )

                  if existing is not None:
                      return existing

                  value = factory()

                  if value is None:
                      raise ValueError(
                          "Cache factory cannot return None"
                      )

                  self.set(
                      key,
                      value,
                      ttl_seconds=ttl_seconds,
                  )

                  return value

              def delete(
                  self,
                  key: str,
              ) -> bool:

                  key = key.strip()

                  if not key:
                      raise ValueError(
                          "Cache key cannot be empty"
                      )

                  with self._lock:
                      self._require_open()

                      return (
                          self._entries.pop(
                              key,
                              None,
                          )
                          is not None
                      )

              def exists(
                  self,
                  key: str,
              ) -> bool:

                  sentinel = object()

                  return (
                      self.get(
                          key,
                          sentinel,
                      )
                      is not sentinel
                  )

              def clear(self) -> None:
                  with self._lock:
                      self._require_open()
                      self._entries.clear()

              def cleanup_expired(self) -> int:
                  with self._lock:
                      self._require_open()

                      expired = [
                          key
                          for key, entry
                          in self._entries.items()
                          if self._expired(entry)
                      ]

                      for key in expired:
                          self._entries.pop(
                              key,
                              None,
                          )

                      self._expirations += len(
                          expired
                      )

                      return len(expired)

              def stats(self) -> CacheStats:
                  with self._lock:
                      return CacheStats(
                          hits=self._hits,
                          misses=self._misses,
                          evictions=self._evictions,
                          expirations=self._expirations,
                          size=len(self._entries),
                          capacity=self._capacity,
                      )

              def close(self) -> None:
                  with self._lock:
                      if self._closed:
                          return

                      self._entries.clear()
                      self._closed = True

              @property
              def closed(self) -> bool:
                  with self._lock:
                      return self._closed


          __all__ = [
              "Cache",
              "CacheEntry",
              "CacheStats",
          ]
          PY

