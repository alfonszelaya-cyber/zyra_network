          cat > shared_engines/ai/crypto.py <<'PY'
          from __future__ import annotations

          import base64

          from cryptography.exceptions import InvalidTag
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          from .errors import AIEncryptionError


          class EnvelopeCipher:
              """
              AES-256-GCM envelope encryption.

              The key is supplied by the deployment environment or a
              dedicated secret manager. It is never persisted by this class.
              """

              KEY_BYTES = 32
              NONCE_BYTES = 12

              def __init__(self, key: bytes) -> None:
                  if len(key) != self.KEY_BYTES:
                      raise ValueError(
                          "AI encryption key must contain exactly 32 bytes"
                      )

                  self._cipher = AESGCM(key)

              def encrypt(
                  self,
                  plaintext: bytes,
                  *,
                  associated_data: bytes,
                  nonce: bytes,
              ) -> str:
                  if len(nonce) != self.NONCE_BYTES:
                      raise ValueError("AES-GCM nonce must contain 12 bytes")

                  try:
                      encrypted = self._cipher.encrypt(
                          nonce,
                          plaintext,
                          associated_data,
                      )
                  except Exception as exc:
                      raise AIEncryptionError(
                          "Encryption operation failed"
                      ) from exc

                  return base64.urlsafe_b64encode(
                      nonce + encrypted
                  ).decode("ascii")

              def decrypt(
                  self,
                  token: str,
                  *,
                  associated_data: bytes,
              ) -> bytes:
                  try:
                      raw = base64.urlsafe_b64decode(token.encode("ascii"))

                      if len(raw) <= self.NONCE_BYTES:
                          raise ValueError("Encrypted payload is too short")

                      nonce = raw[:self.NONCE_BYTES]
                      encrypted = raw[self.NONCE_BYTES:]

                      return self._cipher.decrypt(
                          nonce,
                          encrypted,
                          associated_data,
                      )
                  except (InvalidTag, ValueError, TypeError) as exc:
                      raise AIEncryptionError(
                          "Encrypted payload failed authentication"
                      ) from exc
          PY

          cat > shared_engines/ai/registry.py <<'PY'
          from __future__ import annotations

          from threading import RLock

          from .contracts import ModelDescriptor
          from .errors import AIValidationError


          class ModelRegistry:
              """
              Process-local immutable-by-revision model registry.

              Existing model identities cannot be silently redefined.
              """

              def __init__(self) -> None:
                  self._lock = RLock()
                  self._models: dict[str, ModelDescriptor] = {}
                  self._revision = 0

              def register(self, model: ModelDescriptor) -> int:
                  with self._lock:
                      existing = self._models.get(model.model_id)

                      if existing is not None and existing != model:
                          raise AIValidationError(
                              f"Model {model.model_id!r} already exists "
                              "with incompatible metadata"
                          )

                      if existing is None:
                          self._models[model.model_id] = model
                          self._revision += 1

                      return self._revision

              def get(self, model_id: str) -> ModelDescriptor:
                  normalized = model_id.strip()

                  with self._lock:
                      model = self._models.get(normalized)

                  if model is None:
                      raise AIValidationError(
                          f"Unknown model: {normalized}"
                      )

                  if not model.active:
                      raise AIValidationError(
                          f"Model is inactive: {normalized}"
                      )

                  return model

              def snapshot(self) -> tuple[int, tuple[ModelDescriptor, ...]]:
                  with self._lock:
                      return self._revision, tuple(
                          self._models.values()
                      )

              @property
              def revision(self) -> int:
                  with self._lock:
                      return self._revision
          PY

