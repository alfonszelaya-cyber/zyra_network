name: ZYRA - Production Foundation Registry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Registry
        shell: bash
        run: |
          set -euo pipefail

          test -d foundation/registry
          test -f foundation/registry/registry.py

          cat > foundation/registry/registry.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock
          from typing import Any, Generic, TypeVar


          T = TypeVar("T")


          class RegistryError(RuntimeError):
              """Base exception for registry failures."""


          class RegistrationConflictError(RegistryError):
              """Raised when an identifier is already registered."""


          class RegistrationNotFoundError(RegistryError):
              """Raised when a registry identifier does not exist."""


          @dataclass(frozen=True, slots=True)
          class RegistryEntry(Generic[T]):
              """
              Immutable registry entry.

              The registry stores metadata independently from the registered
              object so discovery, diagnostics and auditing can inspect the
              registry without modifying the object itself.
              """

              name: str
              value: T
              version: int = 1
              metadata: tuple[tuple[str, Any], ...] = ()

              def metadata_dict(self) -> dict[str, Any]:
                  return dict(self.metadata)


          class Registry(Generic[T]):
              """
              Thread-safe process-local registry.

              Designed as a foundation primitive. Persistence, distributed
              discovery and replication belong to higher Network layers.
              """

              def __init__(self, *, name: str = "default") -> None:
                  if not name or not isinstance(name, str):
                      raise ValueError(
                          "Registry name must be a non-empty string"
                      )

                  self._name = name
                  self._items: dict[str, RegistryEntry[T]] = {}
                  self._lock = RLock()

              @property
              def name(self) -> str:
                  return self._name

              def register(
                  self,
                  name: str,
                  item: T,
                  *,
                  version: int = 1,
                  metadata: dict[str, Any] | None = None,
                  replace: bool = False,
              ) -> RegistryEntry[T]:
                  self._validate_name(name)

                  if version < 1:
                      raise ValueError(
                          "Registry version must be >= 1"
                      )

                  with self._lock:
                      if name in self._items and not replace:
                          raise RegistrationConflictError(
                              f"Already registered: {name}"
                          )

                      entry = RegistryEntry(
                          name=name,
                          value=item,
                          version=version,
                          metadata=tuple(
                              sorted(
                                  (metadata or {}).items(),
                                  key=lambda pair: pair[0],
                              )
                          ),
                      )

                      self._items[name] = entry
                      return entry

              def unregister(self, name: str) -> RegistryEntry[T]:
                  self._validate_name(name)

                  with self._lock:
                      try:
                          return self._items.pop(name)
                      except KeyError as exc:
                          raise RegistrationNotFoundError(
                              f"Not registered: {name}"
                          ) from exc

              def get(self, name: str) -> T:
                  return self.entry(name).value

              def entry(self, name: str) -> RegistryEntry[T]:
                  self._validate_name(name)

                  with self._lock:
                      try:
                          return self._items[name]
                      except KeyError as exc:
                          raise RegistrationNotFoundError(
                              f"Not registered: {name}"
                          ) from exc

              def get_or_none(self, name: str) -> T | None:
                  self._validate_name(name)

                  with self._lock:
                      entry = self._items.get(name)
                      return None if entry is None else entry.value

              def contains(self, name: str) -> bool:
                  self._validate_name(name)

                  with self._lock:
                      return name in self._items

              def version(self, name: str) -> int:
                  return self.entry(name).version

              def metadata(self, name: str) -> dict[str, Any]:
                  return self.entry(name).metadata_dict()

              def names(self) -> tuple[str, ...]:
                  with self._lock:
                      return tuple(sorted(self._items))

              def entries(
                  self,
              ) -> tuple[RegistryEntry[T], ...]:
                  with self._lock:
                      return tuple(
                          self._items[name]
                          for name in sorted(self._items)
                      )

              def snapshot(self) -> dict[str, RegistryEntry[T]]:
                  with self._lock:
                      return dict(self._items)

              def clear(self) -> None:
                  with self._lock:
                      self._items.clear()

              def __len__(self) -> int:
                  with self._lock:
                      return len(self._items)

              def __contains__(self, name: str) -> bool:
                  return self.contains(name)

              @staticmethod
              def _validate_name(name: str) -> None:
                  if not isinstance(name, str):
                      raise TypeError(
                          "Registry name must be a string"
                      )

                  if not name.strip():
                      raise ValueError(
                          "Registry name cannot be empty"
                      )

                  if name != name.strip():
                      raise ValueError(
                          "Registry name cannot have surrounding whitespace"
                      )
          PY

          cat > foundation/registry/__init__.py <<'PY'
          """
          ZYRA Foundation Registry.

          Provides thread-safe registration and discovery primitives for
          Network components.
          """

          from .registry import (
              Registry,
              RegistryEntry,
              RegistryError,
              RegistrationConflictError,
              RegistrationNotFoundError,
          )

          __all__ = [
              "Registry",
              "RegistryEntry",
              "RegistryError",
              "RegistrationConflictError",
              "RegistrationNotFoundError",
          ]
          PY

      - name: Validate Registry
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from foundation.registry import (
              Registry,
              RegistrationConflictError,
              RegistrationNotFoundError,
          )

          registry = Registry(name="network")

          service = object()

          entry = registry.register(
              "identity",
              service,
              version=1,
              metadata={
                  "component": "shared_engine",
                  "critical": True,
              },
          )

          assert entry.value is service
          assert registry.get("identity") is service
          assert registry.contains("identity")
          assert registry.version("identity") == 1
          assert registry.metadata("identity")["critical"] is True

          try:
              registry.register("identity", object())
          except RegistrationConflictError:
              pass
          else:
              raise AssertionError(
                  "Duplicate registration was accepted"
              )

          assert registry.get_or_none("missing") is None

          try:
              registry.get("missing")
          except RegistrationNotFoundError:
              pass
          else:
              raise AssertionError(
                  "Missing registry item did not fail"
              )

          registry.unregister("identity")

          assert len(registry) == 0

          print("FOUNDATION REGISTRY: OK")
          PY

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            foundation/registry/registry.py \
            foundation/registry/__init__.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ZYRA Network"
          git config user.email "actions@users.noreply.github.com"

          git add foundation/registry

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "feat: production foundation registry"
          git push
