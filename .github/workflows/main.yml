          cat > infrastructure/deployment/deployment_manager.py <<'PY'
          """
          Deployment state machine.

          Infrastructure owns lifecycle state; actual cloud/container
          execution remains an adapter concern.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from enum import Enum
          from threading import RLock


          class DeploymentState(str, Enum):
              PENDING = "pending"
              VALIDATING = "validating"
              DEPLOYING = "deploying"
              ACTIVE = "active"
              FAILED = "failed"
              ROLLED_BACK = "rolled_back"


          @dataclass
          class Deployment:
              deployment_id: str
              version: str
              environment: str
              state: DeploymentState = DeploymentState.PENDING
              created_at: str = field(
                  default_factory=lambda: datetime.now(timezone.utc).isoformat()
              )
              updated_at: str = field(
                  default_factory=lambda: datetime.now(timezone.utc).isoformat()
              )
              error: str | None = None


          class DeploymentManager:
              _ALLOWED = {
                  DeploymentState.PENDING: {
                      DeploymentState.VALIDATING,
                      DeploymentState.FAILED,
                  },
                  DeploymentState.VALIDATING: {
                      DeploymentState.DEPLOYING,
                      DeploymentState.FAILED,
                  },
                  DeploymentState.DEPLOYING: {
                      DeploymentState.ACTIVE,
                      DeploymentState.FAILED,
                  },
                  DeploymentState.ACTIVE: {
                      DeploymentState.ROLLED_BACK,
                  },
                  DeploymentState.FAILED: {
                      DeploymentState.ROLLED_BACK,
                  },
                  DeploymentState.ROLLED_BACK: set(),
              }

              def __init__(self) -> None:
                  self._deployments: dict[str, Deployment] = {}
                  self._lock = RLock()

              def create(
                  self,
                  deployment_id: str,
                  version: str,
                  environment: str,
              ) -> Deployment:
                  if not deployment_id.strip():
                      raise ValueError("deployment_id is required")
                  if not version.strip():
                      raise ValueError("version is required")
                  if not environment.strip():
                      raise ValueError("environment is required")

                  with self._lock:
                      if deployment_id in self._deployments:
                          raise ValueError(
                              f"deployment already exists: {deployment_id}"
                          )

                      deployment = Deployment(
                          deployment_id=deployment_id,
                          version=version,
                          environment=environment,
                      )
                      self._deployments[deployment_id] = deployment
                      return deployment

              def transition(
                  self,
                  deployment_id: str,
                  target: DeploymentState,
                  error: str | None = None,
              ) -> Deployment:
                  with self._lock:
                      deployment = self._deployments[deployment_id]

                      if target not in self._ALLOWED[deployment.state]:
                          raise ValueError(
                              f"invalid deployment transition: "
                              f"{deployment.state.value} -> {target.value}"
                          )

                      deployment.state = target
                      deployment.error = error
                      deployment.updated_at = datetime.now(
                          timezone.utc
                      ).isoformat()

                      return deployment

              def get(self, deployment_id: str) -> Deployment | None:
                  with self._lock:
                      return self._deployments.get(deployment_id)

              def list(self) -> tuple[Deployment, ...]:
                  with self._lock:
                      return tuple(self._deployments.values())
          PY

          # ============================================================
          # DIAGNOSTICS
          # ============================================================

          cat > infrastructure/diagnostics/__init__.py <<'PY'
          """
          Infrastructure diagnostics.
          """

          from .diagnostics import (
              DiagnosticCheck,
              DiagnosticReport,
              DiagnosticsEngine,
          )

          __all__ = [
              "DiagnosticCheck",
              "DiagnosticReport",
              "DiagnosticsEngine",
          ]
          PY

          cat > infrastructure/diagnostics/diagnostics.py <<'PY'
          """
          Deterministic infrastructure diagnostics engine.
          """

          from __future__ import annotations

          from dataclasses import dataclass
          from time import monotonic
          from typing import Callable


          @dataclass(frozen=True)
          class DiagnosticCheck:
              name: str
              passed: bool
              duration_ms: float
              message: str


          @dataclass(frozen=True)
          class DiagnosticReport:
              checks: tuple[DiagnosticCheck, ...]
              passed: bool

              @property
              def failures(self) -> tuple[DiagnosticCheck, ...]:
                  return tuple(c for c in self.checks if not c.passed)


          class DiagnosticsEngine:
              def __init__(self) -> None:
                  self._checks: dict[str, Callable[[], object]] = {}

              def register(
                  self,
                  name: str,
                  check: Callable[[], object],
              ) -> None:
                  if not name.strip():
                      raise ValueError("diagnostic name is required")
                  if not callable(check):
                      raise TypeError("diagnostic check must be callable")

                  self._checks[name] = check

              def run(self) -> DiagnosticReport:
                  results: list[DiagnosticCheck] = []

                  for name, check in self._checks.items():
                      started = monotonic()

                      try:
                          value = check()
                          passed = bool(value)
                          message = "ok" if passed else "check returned false"
                      except Exception as exc:
                          passed = False
                          message = f"{type(exc).__name__}: {exc}"

                      duration = (monotonic() - started) * 1000.0

                      results.append(
                          DiagnosticCheck(
                              name=name,
                              passed=passed,
                              duration_ms=round(duration, 3),
                              message=message,
                          )
                      )

                  checks = tuple(results)
                  return DiagnosticReport(
                      checks=checks,
                      passed=all(c.passed for c in checks),
                  )
          PY

