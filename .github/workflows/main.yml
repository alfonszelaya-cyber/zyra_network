name: Crear carpetas de Semilla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Agregar bloques finales de Semilla
        run: |
          # Bloque 4: Services, Shared, Templates, Validators
          mkdir -p apps/semilla/services/{academic,admissions,analytics,attendance,certification,classroom,communication,curriculum,documents,education_ai,evaluation,export,family,finance,government,import,institution,laboratory,learning,library,notifications,psychology,reports,research,scholarship,security,student,synchronization,teacher,transportation,translation}
          mkdir -p apps/semilla/shared/{adapters,builders,contracts,decorators,dto,enums,exceptions,factories,helpers,interfaces,mixins,models,policies,types,utilities,value_objects}
          mkdir -p apps/semilla/templates/{academic,admissions,certificates,classroom,dashboards,diplomas,documents,emails,evaluations,exports,forms,notifications,reports,student_cards,transcripts}
          mkdir -p apps/semilla/validators/{academic,admissions,attendance,certification,classroom,curriculum,documents,evaluation,finance,government,institution,learning,psychology,scholarship,security,student,teacher,users}

          # Bloque 5: Docs, Localization, Resources, Tests, Migrations
          mkdir -p apps/semilla/docs/{api,architecture,diagrams,manuals,policies,standards,user_guides}
          mkdir -p apps/semilla/localization/{currencies,languages,regions,school_systems,timezones,translations}
          mkdir -p apps/semilla/resources/{academic_calendars,catalogs,dictionaries,forms,images,import_templates,seed_data,system_defaults}
          mkdir -p apps/semilla/tests/{application,domain,infrastructure,integration,modules,performance,security,unit}
          mkdir -p apps/semilla/migrations/{data,database,versions}

          # Archivo README.md en la raíz de semilla
          touch apps/semilla/README.md

          # Crear __init__.py en los directorios de estos dos bloques
          find apps/semilla/services apps/semilla/shared apps/semilla/templates apps/semilla/validators apps/semilla/docs apps/semilla/localization apps/semilla/resources apps/semilla/tests apps/semilla/migrations -type d -exec touch {}/__init__.py \;

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Bloques finales agregados: services, shared, templates, validators, docs, localization, resources, tests, migrations"
          git push origin main
