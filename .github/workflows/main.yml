          from __future__ import annotations

          import threading
          import time
          from dataclasses import dataclass

          from ..core import (
              HealthResult,
              HealthState,
              ValidationError,
          )


          @dataclass(frozen=True, slots=True)
          class HealthCheck:
              name: str
              callback: object
              timeout_seconds: float = 5.0

              def __post_init__(self):
                  if not self.name:
                      raise ValidationError(
                          "health check name is required"
                      )

                  if not callable(
                      self.callback
                  ):
                      raise ValidationError(
                          "health callback must be callable"
                      )

                  if self.timeout_seconds <= 0:
                      raise ValidationError(
                          "health timeout must be positive"
                      )

              def run(self):
                  start = time.monotonic_ns()

                  try:
                      result = self.callback()

                      if isinstance(
                          result,
                          HealthResult,
                      ):
                          return result

                      state = (
                          HealthState.HEALTHY
                          if result is not False
                          else HealthState.UNHEALTHY
                      )

                      message = ""

                  except Exception as exc:
                      state = (
                          HealthState.UNHEALTHY
                      )

                      message = (
                          f"{type(exc).__name__}: "
                          f"{exc}"
                      )

                  latency = (
                      time.monotonic_ns()
                      - start
                  ) / 1_000_000

                  return HealthResult(
                      self.name,
                      state,
                      latency,
                      time.time_ns(),
                      message,
                  )


          class HealthRegistry:
              def __init__(self):
                  self._lock = threading.RLock()
                  self._checks = {}

              def register(self, check):
                  with self._lock:
                      self._checks[
                          check.name
                      ] = check

              def remove(self, name):
                  with self._lock:
                      self._checks.pop(
                          name,
                          None,
                      )

              def run_all(self):
                  with self._lock:
                      checks = list(
                          self._checks.values()
                      )

                  return [
                      check.run()
                      for check in checks
                  ]

              def overall(self):
                  results = self.run_all()

                  if not results:
                      return HealthState.UNKNOWN

                  states = {
                      result.state
                      for result in results
                  }

                  if (
                      HealthState.UNHEALTHY
                      in states
                  ):
                      return (
                          HealthState.UNHEALTHY
                      )

                  if (
                      HealthState.DEGRADED
                      in states
                  ):
                      return (
                          HealthState.DEGRADED
                      )

                  return HealthState.HEALTHY

              def report(self):
                  results = self.run_all()

                  overall = (
                      HealthState.UNKNOWN
                      if not results
                      else (
                          HealthState.UNHEALTHY
                          if any(
                              item.state
                              is HealthState.UNHEALTHY
                              for item in results
                          )
                          else (
                              HealthState.DEGRADED
                              if any(
                                  item.state
                                  is HealthState.DEGRADED
                                  for item in results
                              )
                              else HealthState.HEALTHY
                          )
                      )
                  )

                  return {
                      "state":
                          overall.value,
                      "checks": [
                          result.to_dict()
                          for result
                          in results
                      ],
                  }


          __all__ = [
              "HealthCheck",
              "HealthRegistry",
              "HealthResult",
              "HealthState",
          ]
