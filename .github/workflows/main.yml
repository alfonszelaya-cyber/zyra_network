name: construir infraestructura

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-infrastructure:
    name: Build Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python path
        shell: bash
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Build Infrastructure
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p infrastructure/bootstrap/api
          mkdir -p infrastructure/cluster
          mkdir -p infrastructure/deployment
          mkdir -p infrastructure/diagnostics
          mkdir -p infrastructure/discovery
          mkdir -p infrastructure/gateway
          mkdir -p infrastructure/load_balancer
          mkdir -p infrastructure/monitoring_adapters
          mkdir -p infrastructure/network
          mkdir -p infrastructure/node
          mkdir -p infrastructure/security/scheduler
          mkdir -p infrastructure/template

          # ============================================================
          # BOOTSTRAP API
          # ============================================================

          cat > infrastructure/bootstrap/api/__init__.py <<'PY'
          """Public bootstrap API contracts."""

          from .bootstrap_api import (
              BootstrapRequest,
              BootstrapResponse,
              BootstrapService,
          )

          __all__ = [
              "BootstrapRequest",
              "BootstrapResponse",
              "BootstrapService",
          ]
          PY

          cat > infrastructure/bootstrap/api/bootstrap_api.py <<'PY'
          """Stable API facade over the Infrastructure composition root."""

          from __future__ import annotations

          from dataclasses import dataclass, field
          from typing import Mapping

          from ..bootstrap import InfrastructureBootstrap
          from ...config import Configuration


          @dataclass(frozen=True, slots=True)
          class BootstrapRequest:
              configuration: Configuration
              metadata: Mapping[str, str] = field(default_factory=dict)


          @dataclass(frozen=True, slots=True)
          class BootstrapResponse:
              accepted: bool
              environment: str
              service_name: str
              node_id: str
              message: str


          class BootstrapService:
              """
              Public service facade for starting and stopping Infrastructure.

              The composition root remains InfrastructureBootstrap. This
              service provides a stable API boundary without introducing
              provider-specific dependencies.
              """

              def __init__(self) -> None:
                  self._bootstrap: InfrastructureBootstrap | None = None

              def start(
                  self,
                  request: BootstrapRequest,
              ) -> BootstrapResponse:
                  if not isinstance(
                      request.configuration,
                      Configuration,
                  ):
                      raise TypeError(
                          "request.configuration must be Configuration"
                      )

                  configuration = request.configuration

                  self._bootstrap = InfrastructureBootstrap(
                      configuration
                  )

                  self._bootstrap.initialize()

                  return BootstrapResponse(
                      accepted=True,
                      environment=configuration.environment.value,
                      service_name=configuration.service_name,
                      node_id=configuration.node_id,
                      message="Infrastructure initialized",
                  )

              def stop(self) -> None:
                  if self._bootstrap is not None:
                      self._bootstrap.shutdown()
                      self._bootstrap = None


          __all__ = [
              "BootstrapRequest",
              "BootstrapResponse",
              "BootstrapService",
          ]
          PY

          # ============================================================
          # CLUSTER
          # ============================================================

          cat > infrastructure/cluster/__init__.py <<'PY'
          """Cluster coordination primitives."""

          from .cluster_manager import (
              ClusterManager,
              ClusterMember,
              ClusterState,
              MemberStatus,
          )

          __all__ = [
              "ClusterManager",
              "ClusterMember",
              "ClusterState",
              "MemberStatus",
          ]
          PY

          cat > infrastructure/cluster/cluster_manager.py <<'PY'
          """
          Thread-safe cluster membership and heartbeat registry.

          This module owns local cluster state. Distributed consensus,
          service discovery transports and cloud orchestration remain
          separate adapters.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from enum import Enum
          from threading import RLock
          from time import monotonic
          from typing import Mapping


          class MemberStatus(str, Enum):
              JOINING = "joining"
              READY = "ready"
              DEGRADED = "degraded"
              LEAVING = "leaving"
              OFFLINE = "offline"


          @dataclass(slots=True)
          class ClusterMember:
              node_id: str
              endpoint: str
              status: MemberStatus = MemberStatus.JOINING
              metadata: dict[str, str] = field(default_factory=dict)
              last_heartbeat: float = field(
                  default_factory=monotonic
              )
              generation: int = 0


          @dataclass(frozen=True, slots=True)
          class ClusterState:
              cluster_id: str
              generation: int
              members: tuple[ClusterMember, ...]


          class ClusterManager:
              """Thread-safe cluster membership manager."""

              def __init__(
                  self,
                  cluster_id: str,
              ) -> None:
                  if not cluster_id.strip():
                      raise ValueError(
                          "cluster_id is required"
                      )

                  self._cluster_id = cluster_id
                  self._generation = 0
                  self._members: dict[
                      str,
                      ClusterMember,
                  ] = {}
                  self._lock = RLock()

              def register(
                  self,
                  node_id: str,
                  endpoint: str,
                  metadata: Mapping[str, str] | None = None,
              ) -> ClusterMember:
                  if not node_id.strip():
                      raise ValueError(
                          "node_id is required"
                      )

                  if not endpoint.strip():
                      raise ValueError(
                          "endpoint is required"
                      )

                  with self._lock:
                      self._generation += 1

                      member = ClusterMember(
                          node_id=node_id,
                          endpoint=endpoint,
                          status=MemberStatus.READY,
                          metadata=dict(
                              metadata or {}
                          ),
                          last_heartbeat=monotonic(),
                          generation=self._generation,
                      )

                      self._members[node_id] = member

                      return member

              def heartbeat(
                  self,
                  node_id: str,
              ) -> None:
                  with self._lock:
                      member = self._members.get(
                          node_id
                      )

                      if member is None:
                          raise KeyError(
                              f"unknown cluster member: {node_id}"
                          )

                      member.last_heartbeat = monotonic()
                      member.status = MemberStatus.READY

              def set_status(
                  self,
                  node_id: str,
                  status: MemberStatus,
              ) -> None:
                  if not isinstance(
                      status,
                      MemberStatus,
                  ):
                      raise TypeError(
                          "status must be MemberStatus"
                      )

                  with self._lock:
                      member = self._members.get(
                          node_id
                      )

                      if member is None:
                          raise KeyError(
                              f"unknown cluster member: {node_id}"
                          )

                      self._generation += 1
                      member.status = status
                      member.generation = self._generation

              def remove(
                  self,
                  node_id: str,
              ) -> None:
                  with self._lock:
                      if (
                          self._members.pop(
                              node_id,
                              None,
                          )
                          is not None
                      ):
                          self._generation += 1

              def snapshot(
                  self,
              ) -> ClusterState:
                  with self._lock:
                      members = tuple(
                          ClusterMember(
                              node_id=member.node_id,
                              endpoint=member.endpoint,
                              status=member.status,
                              metadata=dict(
                                  member.metadata
                              ),
                              last_heartbeat=(
                                  member.last_heartbeat
                              ),
                              generation=member.generation,
                          )
                          for member
                          in self._members.values()
                      )

                      return ClusterState(
                          cluster_id=self._cluster_id,
                          generation=self._generation,
                          members=members,
                      )


          __all__ = [
              "ClusterManager",
              "ClusterMember",
              "ClusterState",
              "MemberStatus",
          ]
          PY

          # ============================================================
          # DEPLOYMENT
          # ============================================================

          cat > infrastructure/deployment/__init__.py <<'PY'
          """Deployment lifecycle primitives."""

          from .deployment_manager import (
              Deployment,
              DeploymentManager,
              DeploymentState,
          )

          __all__ = [
              "Deployment",
              "DeploymentManager",
              "DeploymentState",
          ]
          PY

          cat > infrastructure/deployment/deployment_manager.py <<'PY'
          """
          Provider-neutral deployment lifecycle state machine.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from enum import Enum
          from threading import RLock


          class DeploymentState(str, Enum):
              PENDING = "pending"
              VALIDATING = "validating"
              DEPLOYING = "deploying"
              ACTIVE = "active"
              FAILED = "failed"
              ROLLED_BACK = "rolled_back"


          @dataclass(slots=True)
          class Deployment:
              deployment_id: str
              version: str
              environment: str
              state: DeploymentState = (
                  DeploymentState.PENDING
              )
              created_at: str = field(
                  default_factory=lambda:
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              )
              updated_at: str = field(
                  default_factory=lambda:
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              )
              error: str | None = None


          class DeploymentManager:
              """Thread-safe deployment state manager."""

              _ALLOWED = {
                  DeploymentState.PENDING: {
                      DeploymentState.VALIDATING,
                      DeploymentState.FAILED,
                  },
                  DeploymentState.VALIDATING: {
                      DeploymentState.DEPLOYING,
                      DeploymentState.FAILED,
                  },
                  DeploymentState.DEPLOYING: {
                      DeploymentState.ACTIVE,
                      DeploymentState.FAILED,
                  },
                  DeploymentState.ACTIVE: {
                      DeploymentState.ROLLED_BACK,
                  },
                  DeploymentState.FAILED: {
                      DeploymentState.ROLLED_BACK,
                  },
                  DeploymentState.ROLLED_BACK: set(),
              }

              def __init__(self) -> None:
                  self._deployments: dict[
                      str,
                      Deployment,
                  ] = {}
                  self._lock = RLock()

              def create(
                  self,
                  deployment_id: str,
                  version: str,
                  environment: str,
              ) -> Deployment:
                  if not deployment_id.strip():
                      raise ValueError(
                          "deployment_id is required"
                      )

                  if not version.strip():
                      raise ValueError(
                          "version is required"
                      )

                  if not environment.strip():
                      raise ValueError(
                          "environment is required"
                      )

                  with self._lock:
                      if deployment_id in self._deployments:
                          raise ValueError(
                              f"deployment already exists: "
                              f"{deployment_id}"
                          )

                      deployment = Deployment(
                          deployment_id=deployment_id,
                          version=version,
                          environment=environment,
                      )

                      self._deployments[
                          deployment_id
                      ] = deployment

                      return deployment

              def transition(
                  self,
                  deployment_id: str,
                  target: DeploymentState,
                  error: str | None = None,
              ) -> Deployment:
                  with self._lock:
                      deployment = self._deployments[
                          deployment_id
                      ]

                      if target not in self._ALLOWED[
                          deployment.state
                      ]:
                          raise ValueError(
                              "invalid deployment transition: "
                              f"{deployment.state.value} -> "
                              f"{target.value}"
                          )

                      deployment.state = target
                      deployment.error = error
                      deployment.updated_at = (
                          datetime.now(
                              timezone.utc
                          ).isoformat()
                      )

                      return deployment

              def get(
                  self,
                  deployment_id: str,
              ) -> Deployment | None:
                  with self._lock:
                      return self._deployments.get(
                          deployment_id
                      )

              def snapshot(
                  self,
              ) -> tuple[Deployment, ...]:
                  with self._lock:
                      return tuple(
                          self._deployments.values()
                      )


          __all__ = [
              "Deployment",
              "DeploymentManager",
              "DeploymentState",
          ]
          PY

          # ============================================================
          # DIAGNOSTICS
          # ============================================================

          cat > infrastructure/diagnostics/__init__.py <<'PY'
          """Infrastructure diagnostic checks."""

          from .diagnostics import (
              DiagnosticCheck,
              DiagnosticReport,
              DiagnosticsEngine,
          )

          __all__ = [
              "DiagnosticCheck",
              "DiagnosticReport",
              "DiagnosticsEngine",
          ]
          PY

          cat > infrastructure/diagnostics/diagnostics.py <<'PY'
          """Deterministic infrastructure diagnostic engine."""

          from __future__ import annotations

          from dataclasses import dataclass
          from time import monotonic
          from typing import Callable


          @dataclass(frozen=True, slots=True)
          class DiagnosticCheck:
              name: str
              passed: bool
              duration_ms: float
              message: str


          @dataclass(frozen=True, slots=True)
          class DiagnosticReport:
              checks: tuple[DiagnosticCheck, ...]
              passed: bool

              @property
              def failures(
                  self,
              ) -> tuple[DiagnosticCheck, ...]:
                  return tuple(
                      check
                      for check in self.checks
                      if not check.passed
                  )


          class DiagnosticsEngine:
              """Registry and executor for infrastructure health checks."""

              def __init__(self) -> None:
                  self._checks: dict[
                      str,
                      Callable[[], object],
                  ] = {}

              def register(
                  self,
                  name: str,
                  check: Callable[[], object],
              ) -> None:
                  if not name.strip():
                      raise ValueError(
                          "diagnostic name is required"
                      )

                  if not callable(check):
                      raise TypeError(
                          "diagnostic check must be callable"
                      )

                  self._checks[name] = check

              def run(
                  self,
              ) -> DiagnosticReport:
                  results: list[
                      DiagnosticCheck
                  ] = []

                  for name, check in (
                      self._checks.items()
                  ):
                      started = monotonic()

                      try:
                          value = check()

                          passed = bool(value)

                          message = (
                              "ok"
                              if passed
                              else "check returned false"
                          )

                      except Exception as exc:
                          passed = False
                          message = (
                              f"{type(exc).__name__}: "
                              f"{exc}"
                          )

                      duration = (
                          monotonic() - started
                      ) * 1000.0

                      results.append(
                          DiagnosticCheck(
                              name=name,
                              passed=passed,
                              duration_ms=round(
                                  duration,
                                  3,
                              ),
                              message=message,
                          )
                      )

                  checks = tuple(results)

                  return DiagnosticReport(
                      checks=checks,
                      passed=all(
                          check.passed
                          for check in checks
                      ),
                  )


          __all__ = [
              "DiagnosticCheck",
              "DiagnosticReport",
              "DiagnosticsEngine",
          ]
          PY

          # ============================================================
          # DISCOVERY
          # ============================================================

          cat > infrastructure/discovery/__init__.py <<'PY'
          """Service discovery primitives."""

          from .service_discovery import (
              ServiceEndpoint,
              ServiceRegistry,
              ServiceStatus,
          )

          __all__ = [
              "ServiceEndpoint",
              "ServiceRegistry",
              "ServiceStatus",
          ]
