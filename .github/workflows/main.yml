name: Build NEXO Structure

on:
  workflow_dispatch:

jobs:
  build-nexo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create NEXO structure
        run: |
          set -e

          BASE="apps/nexo"

          # ============================================================
          # APPLICATION
          # ============================================================

          mkdir -p \
            "$BASE/application/accounting_use_cases" \
            "$BASE/application/analytics_use_cases" \
            "$BASE/application/audit_use_cases" \
            "$BASE/application/clients_use_cases" \
            "$BASE/application/compliance_use_cases" \
            "$BASE/application/customer_service_use_cases" \
            "$BASE/application/executive_use_cases" \
            "$BASE/application/family_office_use_cases" \
            "$BASE/application/finance_use_cases" \
            "$BASE/application/government_use_cases" \
            "$BASE/application/identity_use_cases" \
            "$BASE/application/logistics_use_cases" \
            "$BASE/application/meta_government_use_cases" \
            "$BASE/application/notifications_use_cases" \
            "$BASE/application/operations_use_cases" \
            "$BASE/application/payments_use_cases" \
            "$BASE/application/reports_use_cases" \
            "$BASE/application/risk_use_cases" \
            "$BASE/application/search_use_cases" \
            "$BASE/application/security_identity_use_cases" \
            "$BASE/application/synchronization_use_cases" \
            "$BASE/application/workflow_use_cases"

          # ============================================================
          # DOMAIN
          # ============================================================

          mkdir -p \
            "$BASE/domain/accounting" \
            "$BASE/domain/analytics" \
            "$BASE/domain/audit" \
            "$BASE/domain/clients" \
            "$BASE/domain/compliance" \
            "$BASE/domain/customer_service" \
            "$BASE/domain/executive" \
            "$BASE/domain/family_office" \
            "$BASE/domain/finance" \
            "$BASE/domain/government" \
            "$BASE/domain/identity" \
            "$BASE/domain/logistics" \
            "$BASE/domain/meta_government" \
            "$BASE/domain/notifications" \
            "$BASE/domain/operations" \
            "$BASE/domain/payments" \
            "$BASE/domain/reports" \
            "$BASE/domain/risk" \
            "$BASE/domain/search" \
            "$BASE/domain/security_identity" \
            "$BASE/domain/synchronization" \
            "$BASE/domain/workflow"

          # ============================================================
          # NEXO MODULES
          # ============================================================

          mkdir -p \
            "$BASE/module/executive" \
            "$BASE/module/clients" \
            "$BASE/module/finance" \
            "$BASE/module/operations" \
            "$BASE/module/family_office" \
            "$BASE/module/government" \
            "$BASE/module/meta_government" \
            "$BASE/module/risk" \
            "$BASE/module/security_identity" \
            "$BASE/module/compliance" \
            "$BASE/module/accounting" \
            "$BASE/module/customer_service"

          # ============================================================
          # EVENTS
          # ============================================================

          mkdir -p \
            "$BASE/events/accounting" \
            "$BASE/events/clients" \
            "$BASE/events/compliance" \
            "$BASE/events/finance" \
            "$BASE/events/government" \
            "$BASE/events/logistics" \
            "$BASE/events/notifications" \
            "$BASE/events/operations" \
            "$BASE/events/payments" \
            "$BASE/events/risk" \
            "$BASE/events/security" \
            "$BASE/events/system"

          # ============================================================
          # ALERTS / CONTROL
          # NEXO-specific: accounting, fiscal and operational alerts.
          # NOT a sales/opportunity radar.
          # ============================================================

          mkdir -p \
            "$BASE/events/system/alerts" \
            "$BASE/events/system/document_alerts" \
            "$BASE/events/system/compliance_alerts" \
            "$BASE/events/system/deadlines" \
            "$BASE/events/system/missing_documents" \
            "$BASE/events/system/inconsistencies"

          # ============================================================
          # PERMISSIONS
          # ============================================================

          mkdir -p \
            "$BASE/permissions/policies" \
            "$BASE/permissions/roles" \
            "$BASE/permissions/rules" \
            "$BASE/permissions/scopes"

          # ============================================================
          # REGISTRY
          # ============================================================

          mkdir -p \
            "$BASE/registry/engines" \
            "$BASE/registry/events" \
            "$BASE/registry/menus" \
            "$BASE/registry/modules" \
            "$BASE/registry/permissions" \
            "$BASE/registry/roles" \
            "$BASE/registry/routes" \
            "$BASE/registry/services" \
            "$BASE/registry/templates"

          # ============================================================
          # ROUTERS
          # ============================================================

          mkdir -p \
            "$BASE/routers/api" \
            "$BASE/routers/internal" \
            "$BASE/routers/public" \
            "$BASE/routers/websocket"

          # ============================================================
          # SCHEMAS
          # ============================================================

          mkdir -p \
            "$BASE/schemas/entities" \
            "$BASE/schemas/requests" \
            "$BASE/schemas/responses" \
            "$BASE/schemas/shared"

          # ============================================================
          # INFRASTRUCTURE
          # ============================================================

          mkdir -p \
            "$BASE/infrastructure/api" \
            "$BASE/infrastructure/cache" \
            "$BASE/infrastructure/database" \
            "$BASE/infrastructure/messaging" \
            "$BASE/infrastructure/network" \
            "$BASE/infrastructure/persistence" \
            "$BASE/infrastructure/providers" \
            "$BASE/infrastructure/repositories" \
            "$BASE/infrastructure/security" \
            "$BASE/infrastructure/services" \
            "$BASE/infrastructure/storage"

          # ============================================================
          # SERVICES
          # ============================================================

          mkdir -p \
            "$BASE/services/adapters" \
            "$BASE/services/communication" \
            "$BASE/services/export" \
            "$BASE/services/import" \
            "$BASE/services/notifications" \
            "$BASE/services/reports" \
            "$BASE/services/synchronization" \
            "$BASE/services/translation"

          # ============================================================
          # SHARED
          # ============================================================

          mkdir -p \
            "$BASE/shared/adapters" \
            "$BASE/shared/builders" \
            "$BASE/shared/contracts" \
            "$BASE/shared/decorators" \
            "$BASE/shared/dto" \
            "$BASE/shared/enums" \
            "$BASE/shared/exceptions" \
            "$BASE/shared/factories" \
            "$BASE/shared/helpers" \
            "$BASE/shared/interfaces" \
            "$BASE/shared/mixins" \
            "$BASE/shared/models" \
            "$BASE/shared/policies" \
            "$BASE/shared/types" \
            "$BASE/shared/utilities" \
            "$BASE/shared/value_objects"

          # ============================================================
          # TEMPLATES
          # ============================================================

          mkdir -p \
            "$BASE/templates/certificates" \
            "$BASE/templates/dashboards" \
            "$BASE/templates/documents" \
            "$BASE/templates/emails" \
            "$BASE/templates/exports" \
            "$BASE/templates/forms" \
            "$BASE/templates/notifications" \
            "$BASE/templates/reports"

          # ============================================================
          # KEEP NEXO-SPECIFIC TEMPLATESS
          # ============================================================

          mkdir -p "$BASE/templatess"

          # ============================================================
          # PYTHON PACKAGE MARKERS
          # ============================================================

          find "$BASE" -type d -exec touch "{}/__init__.py" \;

          # ============================================================
          # REMOVE RADAR VIP FROM NEXO
          # ============================================================

          rm -rf \
            "$BASE/application/radar_vip_use_cases" \
            "$BASE/domain/radar_vip" \
            "$BASE/module/radar_vip" \
            "$BASE/events/radar" \
            "$BASE/radar_vip" \
            "$BASE/radar"

          # ============================================================
          # REMOVE OLD TYPO IF PRESENT
          # ============================================================

          rm -rf "$BASE/application/complancie_use_cases"

      - name: Commit NEXO structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/nexo

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Clean and complete NEXO architecture"
          git push
