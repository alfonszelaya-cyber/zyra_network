          from __future__ import annotations

          import json
          from abc import ABC, abstractmethod
          from pathlib import Path
          from typing import Any, Iterable, Mapping


          class ObservationExporter(ABC):
              @abstractmethod
              def export(
                  self,
                  records: Iterable[Mapping[str, Any]],
              ) -> int:
                  raise NotImplementedError


          class JsonLinesExporter(ObservationExporter):
              def __init__(self, path: str | Path):
                  self.path = Path(path)
                  self.path.parent.mkdir(parents=True, exist_ok=True)

              def export(
                  self,
                  records: Iterable[Mapping[str, Any]],
              ) -> int:
                  count = 0

                  with self.path.open(
                      "a",
                      encoding="utf-8",
                  ) as handle:
                      for record in records:
                          handle.write(
                              json.dumps(
                                  dict(record),
                                  ensure_ascii=False,
                                  sort_keys=True,
                                  default=str,
                              )
                              + "\n"
                          )
                          count += 1

                      handle.flush()

                  return count


          class MemoryExporter(ObservationExporter):
              def __init__(self):
                  self.records: list[dict[str, Any]] = []

              def export(
                  self,
                  records: Iterable[Mapping[str, Any]],
              ) -> int:
                  count = 0

                  for record in records:
                      self.records.append(dict(record))
                      count += 1

                  return count
          PY

