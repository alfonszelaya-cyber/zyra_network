name: zyra-01-common

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-01-common-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Remove superseded broken workflows
        run: |
          set -euo pipefail
          git rm -q --ignore-unmatch \
            .github/workflows/shared-engines-delivery-1.yml \
            .github/workflows/shared-engines-delivery-1a.yml \
            .github/workflows/shared-engines-delivery-2.yml \
            .github/workflows/shared-engines-delivery-3a.yml \
            .github/workflows/shared-engines-delivery-3b.yml
          echo "legacy workflows removed if present"

      - name: Repair broken __init__py markers (missing dot)
        run: |
          set -euo pipefail
          BROKEN=$(find shared_engines -name '__init__py' -type f || true)
          if [ -n "$BROKEN" ]; then
            echo "$BROKEN"
            while IFS= read -r f; do
              dir=$(dirname "$f")
              if [ ! -f "$dir/__init__.py" ]; then
                mv "$f" "$dir/__init__.py"
                echo "repaired: $f -> $dir/__init__.py"
              else
                rm "$f"
                echo "removed duplicate broken marker: $f"
              fi
            done <<< "$BROKEN"
          else
            echo "no broken markers found"
          fi

      - name: Build shared_engines/common (additive, nothing deleted)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/common/tests

          cat > shared_engines/py.typed <<'EOF'
          # PEP 561 marker: this package ships inline types.
          EOF

          cat > shared_engines/conftest.py <<'PYEOF'
          """Pytest bootstrap: make the repository root importable."""
          from __future__ import annotations

          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))
          PYEOF

          cat > shared_engines/common/__init__.py <<'PYEOF'
          """Foundation primitives shared by every Zyra engine."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              BackpressureError,
              BudgetExceeded,
              ConfigurationError,
              ConcurrencyError,
              EngineError,
              IntegrityError,
              LeaseLost,
              MigrationError,
              NotFoundError,
              PolicyViolation,
              ProviderPermanentError,
              ProviderTransientError,
              RecoveryRequired,
              SerializationError,
              UnsupportedVersionError,
              ValidationError,
          )

          __all__ = [
              "BackpressureError",
              "BudgetExceeded",
              "ConfigurationError",
              "ConcurrencyError",
              "EngineError",
              "IntegrityError",
              "LeaseLost",
              "MigrationError",
              "NotFoundError",
              "PolicyViolation",
              "ProviderPermanentError",
              "ProviderTransientError",
              "RecoveryRequired",
              "SerializationError",
              "UnsupportedVersionError",
              "ValidationError",
          ]
          PYEOF

          cat > shared_engines/common/errors.py <<'PYEOF'
          """Typed error hierarchy: no bare Exception anywhere in Zyra."""
          from __future__ import annotations


          class EngineError(Exception):
              """Base class for every engine error."""


          class ConfigurationError(EngineError):
              """Invalid or unsafe configuration; must fail at startup."""


          class ValidationError(EngineError):
              """Input failed contract validation."""


          class SerializationError(EngineError):
              """Canonical serialization or parsing failed."""


          class IntegrityError(EngineError):
              """Stored data failed integrity verification."""


          class ConcurrencyError(EngineError):
              """Concurrent access conflict that cannot be resolved here."""


          class LeaseLost(ConcurrencyError):
              """Fencing token rejected: this worker lost its lease."""


          class RecoveryRequired(EngineError):
              """Operation ended in an externally-uncertain state."""


          class ProviderTransientError(EngineError):
              """Provider failure that may succeed on a later attempt."""


          class ProviderPermanentError(EngineError):
              """Provider failure that will never succeed unchanged."""


          class BackpressureError(EngineError):
              """Bounded queue is full; caller must slow down."""


          class BudgetExceeded(EngineError):
              """Request would exceed a configured budget or limit."""


          class MigrationError(EngineError):
              """Migration registry inconsistency or checksum mismatch."""


          class UnsupportedVersionError(EngineError):
              """Contract or event version is not compatible."""


          class NotFoundError(EngineError):
              """Requested entity does not exist."""


          class PolicyViolation(EngineError):
              """Action denied by governance or security policy."""
          PYEOF

          cat > shared_engines/common/clocks.py <<'PYEOF'
          """Injectable clocks so time-dependent logic is deterministic."""
          from __future__ import annotations

          import time
          from typing import Protocol


          class Clock(Protocol):
              def now(self) -> float:
                  """Unix epoch seconds."""
                  ...

              def sleep(self, seconds: float) -> None:
                  ...


          class SystemClock:
              """Wall-clock implementation."""

              def now(self) -> float:
                  return time.time()

              def sleep(self, seconds: float) -> None:
                  time.sleep(seconds)


          class FrozenClock:
              """Deterministic clock for tests and simulations."""

              def __init__(self, start: float = 1_000_000.0) -> None:
                  self._now = start

              def now(self) -> float:
                  return self._now

              def sleep(self, seconds: float) -> None:
                  self._now += seconds

              def advance(self, seconds: float) -> None:
                  self._now += seconds
          PYEOF

          cat > shared_engines/common/serialization.py <<'PYEOF'
          """Canonical JSON used for hashing, journals and fingerprints."""
          from __future__ import annotations

          import json
          from decimal import Decimal
          from typing import Any

          from shared_engines.common.errors import SerializationError

          _SEPARATORS = (",", ":")


          def _default(obj: Any) -> Any:
              if isinstance(obj, Decimal):
                  return {"__decimal__": str(obj)}
              raise SerializationError(
                  f"type {type(obj).__name__} is not canonically serializable"
              )


          def canonical_json_dumps(payload: Any) -> str:
              try:
                  return json.dumps(
                      payload,
                      separators=_SEPARATORS,
                      sort_keys=True,
                      default=_default,
                      ensure_ascii=False,
                  )
              except (TypeError, ValueError) as exc:
                  raise SerializationError(
                      f"payload not canonically serializable: {exc}"
                  ) from exc


          def canonical_json_loads(raw: str) -> Any:
              try:
                  return json.loads(raw)
              except (TypeError, ValueError) as exc:
                  raise SerializationError(
                      f"payload is not valid JSON: {exc}"
                  ) from exc
          PYEOF

          cat > shared_engines/common/identifiers.py <<'PYEOF'
          """Stable identifiers and content hashing."""
          from __future__ import annotations

          import hashlib
          import uuid

          from shared_engines.common.serialization import canonical_json_dumps


          def new_id() -> str:
              return uuid.uuid4().hex


          def stable_hash(*parts: str) -> str:
              digest = hashlib.sha256()
              for part in parts:
                  digest.update(part.encode("utf-8"))
                  digest.update(b"\x1f")
              return digest.hexdigest()


          def payload_fingerprint(payload: object) -> str:
              return stable_hash(canonical_json_dumps(payload))
          PYEOF

          cat > shared_engines/common/validation.py <<'PYEOF'
          """Fail-fast validation helpers shared by all engines.

          ``config=True`` raises ConfigurationError (unsafe settings at
          startup); default raises ValidationError (bad runtime input).
          """
          from __future__ import annotations

          import math
          from collections.abc import Sequence

          from shared_engines.common.errors import ConfigurationError, ValidationError


          def _raise(message: str, config: bool) -> None:
              if config:
                  raise ConfigurationError(message)
              raise ValidationError(message)


          def require_non_empty_str(
              value: str, name: str, *, config: bool = False
          ) -> str:
              if not isinstance(value, str) or not value.strip():
                  _raise(f"{name} must be a non-empty string", config)
              return value


          def require_int_range(
              value: int, name: str, minimum: int, maximum: int, *, config: bool = False
          ) -> int:
              if not isinstance(value, int) or isinstance(value, bool):
                  _raise(f"{name} must be an integer", config)
              if not minimum <= value <= maximum:
                  _raise(f"{name} must be in [{minimum}, {maximum}]", config)
              return value


          def require_positive_number(
              value: float, name: str, *, config: bool = False
          ) -> float:
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  _raise(f"{name} must be a number", config)
              if not math.isfinite(value) or value <= 0:
                  _raise(f"{name} must be a positive finite number", config)
              return float(value)


          def require_one_of(
              value: str, allowed: Sequence[str], name: str, *, config: bool = False
          ) -> str:
              if value not in allowed:
                  _raise(f"{name} must be one of {sorted(allowed)}", config)
              return value
          PYEOF

          cat > shared_engines/common/result.py <<'PYEOF'
          """Explicit success/failure container for non-throwing APIs."""
          from __future__ import annotations

          from typing import Generic, TypeVar, cast

          from shared_engines.common.errors import ConfigurationError, EngineError

          ValueT = TypeVar("ValueT")


          class Result(Generic[ValueT]):
              """Holds exactly one of value or error; None is not a value."""

              __slots__ = ("_value", "_error")

              def __init__(
                  self, value: ValueT | None, error: EngineError | None
              ) -> None:
                  if (value is None) == (error is None):
                      raise ConfigurationError(
                          "Result requires exactly one of value or error"
                      )
                  self._value = value
                  self._error = error

              @classmethod
              def ok(cls, value: ValueT) -> "Result[ValueT]":
                  return cls(value, None)

              @classmethod
              def err(cls, error: EngineError) -> "Result[ValueT]":
                  return cls(None, error)

              @property
              def ok(self) -> bool:
                  return self._error is None

              @property
              def value(self) -> ValueT:
                  if self._error is not None:
                      raise self._error
                  return cast(ValueT, self._value)

              @property
              def error(self) -> EngineError | None:
                  return self._error
          PYEOF

          cat > shared_engines/common/pagination.py <<'PYEOF'
          """Page container for list/query endpoints across engines."""
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Generic, TypeVar

          from shared_engines.common.validation import require_int_range

          ItemT = TypeVar("ItemT")


          @dataclass(frozen=True)
          class Page(Generic[ItemT]):
              items: tuple[ItemT, ...]
              offset: int
              limit: int
              total: int

              def __post_init__(self) -> None:
                  require_int_range(self.offset, "offset", 0, 10**12)
                  require_int_range(self.limit, "limit", 1, 10**6)
                  require_int_range(self.total, "total", 0, 10**12)

              @property
              def has_more(self) -> bool:
                  return self.offset + len(self.items) < self.total

              @property
              def next_offset(self) -> int | None:
                  if self.has_more:
                      return self.offset + len(self.items)
                  return None
          PYEOF

          cat > shared_engines/common/types.py <<'PYEOF'
          """Shared semantic aliases."""
          from __future__ import annotations

          from typing import NewType

          ISO4217Code = NewType("ISO4217Code", str)
          ISO3166Code = NewType("ISO3166Code", str)
          Sha256Hex = NewType("Sha256Hex", str)
          EngineName = NewType("EngineName", str)
          PYEOF

          cat > shared_engines/common/tests/test_common.py <<'PYEOF'
          from __future__ import annotations

          import pytest

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.common.errors import (
              ConfigurationError,
              SerializationError,
              ValidationError,
          )
          from shared_engines.common.pagination import Page
          from shared_engines.common.result import Result
          from shared_engines.common.serialization import canonical_json_dumps
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
              require_one_of,
              require_positive_number,
          )


          def test_canonical_json_is_stable_and_ordered() -> None:
              assert canonical_json_dumps({"b": 1, "a": 2}) == '{"a":2,"b":1}'
              with pytest.raises(SerializationError):
                  canonical_json_dumps({"x": object()})


          def test_frozen_clock_advances() -> None:
              clock = FrozenClock(start=100.0)
              clock.sleep(5.0)
              assert clock.now() == 105.0


          def test_result_ok_err_and_exclusivity() -> None:
              ok: Result[int] = Result.ok(3)
              assert ok.ok and ok.value == 3
              err: Result[int] = Result.err(ConfigurationError("bad"))
              assert not err.ok and err.error is not None
              with pytest.raises(ConfigurationError):
                  _ = err.value
              with pytest.raises(ConfigurationError):
                  Result[int](None, None)
              with pytest.raises(ConfigurationError):
                  Result[int](1, ConfigurationError("bad"))


          def test_page_navigation_and_bounds() -> None:
              page: Page[int] = Page(items=(1, 2), offset=0, limit=2, total=5)
              assert page.has_more and page.next_offset == 2
              last: Page[int] = Page(items=(1,), offset=4, limit=2, total=5)
              assert not last.has_more and last.next_offset is None
              with pytest.raises(ValidationError):
                  Page(items=(), offset=-1, limit=2, total=0)


          def test_validators_fail_fast() -> None:
              assert require_non_empty_str("x", "v") == "x"
              with pytest.raises(ValidationError):
                  require_non_empty_str("  ", "v")
              with pytest.raises(ValidationError):
                  require_int_range(-1, "offset", 0, 10)
              with pytest.raises(ConfigurationError):
                  require_int_range(-1, "t", 1, 10, config=True)
              with pytest.raises(ValidationError):
                  require_positive_number(-1.0, "timeout")
              with pytest.raises(ValidationError):
                  require_positive_number(float("inf"), "timeout")
              assert require_one_of("A", ("A", "B"), "m") == "A"
              with pytest.raises(ValidationError):
                  require_one_of("C", ("A", "B"), "m")
          PYEOF

          echo "module 1 (common) written; python files now in shared_engines:"
          find shared_engines -name '*.py' -type f | sort

      - name: Quality gates (scoped to modules built by zyra workflows)
        run: |
          set -euo pipefail
          MODULES="shared_engines/common"
          python -m compileall -q $MODULES
          find $MODULES -name '__pycache__' -type d -prune -exec rm -rf {} +
          flake8 $MODULES --max-line-length=100
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $MODULES
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider shared_engines/common/tests
          find $MODULES -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Integrity checks (scoped)
        run: |
          set -euo pipefail
          MODULES="shared_engines/common"
          EMPTY=$(find $MODULES -name '*.py' -empty || true)
          if [ -n "$EMPTY" ]; then
            echo "Empty .py files found:"; echo "$EMPTY"; exit 1
          fi
          VIOLATIONS=$(grep -RInE 'TODO|FIXME|XXX|HACK|NotImplementedError|^[[:space:]]*pass[[:space:]]*$' $MODULES --include='*.py' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "Forbidden markers found:"; echo "$VIOLATIONS"; exit 1
          fi
          if grep -RInE '^[[:space:]]*(from|import)[[:space:]]+apps([[:space:]]|$|\.)' $MODULES --include='*.py'; then
            echo "Forbidden dependency on apps/ detected"; exit 1
          fi

      - name: Commit and push (scoped: shared_engines + workflows only)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add shared_engines .github/workflows
          git diff --cached --check
          OFF_SCOPE=$(git diff --cached --name-only | grep -vE '^(shared_engines/|\.github/workflows/)' || true)
          if [ -n "$OFF_SCOPE" ]; then
            echo "Staged changes outside allowed scope:"
            echo "$OFF_SCOPE"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "zyra: module 01 common (typed errors, clocks, canonical json, validation, result) + workflow cleanup + init repairs"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
