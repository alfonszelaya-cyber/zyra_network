          from __future__ import annotations

          from ..core import (
              BoundedQueue,
              ObservationEvent,
              ObservationPolicy,
          )


          class Collector:
              def __init__(
                  self,
                  policy: ObservationPolicy,
              ):
                  self.policy = policy.validate()

                  self.queue = BoundedQueue(
                      self.policy.max_queue_size
                  )

                  self._closed = False

              def submit(
                  self,
                  event: ObservationEvent,
                  *,
                  block=False,
                  timeout=None,
              ):
                  if not isinstance(
                      event,
                      ObservationEvent,
                  ):
                      raise TypeError(
                          "collector accepts ObservationEvent"
                      )

                  if self._closed:
                      return False

                  return self.queue.put(
                      event,
                      block=block,
                      timeout=timeout,
                  )

              def get(self, timeout=None):
                  return self.queue.get(timeout)

              def close(self):
                  self._closed = True
                  self.queue.close()

              def stats(self):
                  return {
                      "queued":
                          self.queue.qsize(),
                      "accepted":
                          self.queue.accepted.value(),
                      "dropped":
                          self.queue.dropped.value(),
                      "closed":
                          self._closed,
                  }

              @property
              def closed(self):
                  return self._closed


