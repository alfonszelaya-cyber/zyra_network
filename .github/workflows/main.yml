      - name: Implement encrypted backups
        shell: bash
        run: |
          set -euo pipefail

          cat > storage/encrypted_backups/retention_policy.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime, timedelta, timezone


          @dataclass(frozen=True, slots=True)
          class RetentionPolicy:
              max_age_days: int = 30
              max_backups: int = 100

              def __post_init__(self) -> None:
                  if self.max_age_days <= 0:
                      raise ValueError(
                          "max_age_days must be positive"
                      )

                  if self.max_backups <= 0:
                      raise ValueError(
                          "max_backups must be positive"
                      )

              def expiration_time(
                  self,
                  created_at: datetime,
              ) -> datetime:

                  if created_at.tzinfo is None:
                      raise ValueError(
                          "created_at must be timezone-aware"
                      )

                  return (
                      created_at.astimezone(
                          timezone.utc
                      )
                      + timedelta(
                          days=self.max_age_days
                      )
                  )

              def is_expired(
                  self,
                  created_at: datetime,
                  *,
                  now: datetime | None = None,
              ) -> bool:

                  current = (
                      now
                      or datetime.now(timezone.utc)
                  )

                  return current >= self.expiration_time(
                      created_at
                  )


          __all__ = ["RetentionPolicy"]
          PY

          cat > storage/encrypted_backups/backup_engine.py <<'PY'
          from __future__ import annotations

          import hashlib
          import hmac
          import secrets
          from dataclasses import dataclass
          from pathlib import Path
          from threading import RLock
          from uuid import UUID, uuid4


          @dataclass(frozen=True, slots=True)
          class BackupArtifact:
              backup_id: UUID
              source: str
              path: str
              digest: str
              size_bytes: int


          class BackupEngine:
              """
              Local encrypted-backup primitive.

              The engine uses authenticated encryption semantics based on
              a generated nonce and HMAC-SHA256 over the encrypted payload.
              The key must be supplied by the caller and must never be
              persisted by this component.
              """

              NONCE_SIZE = 32

              def __init__(
                  self,
                  root: str | Path,
              ) -> None:

                  self.root = Path(root)

                  self.root.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  self._lock = RLock()

              @staticmethod
              def _keystream(
                  key: bytes,
                  nonce: bytes,
                  length: int,
              ) -> bytes:

                  if not key:
                      raise ValueError(
                          "Encryption key cannot be empty"
                      )

                  output = bytearray()
                  counter = 0

                  while len(output) < length:
                      block = hashlib.sha256(
                          key
                          + nonce
                          + counter.to_bytes(
                              8,
                              "big",
                          )
                      ).digest()

                      output.extend(block)
                      counter += 1

                  return bytes(
                      output[:length]
                  )

              @classmethod
              def _encrypt(
                  cls,
                  data: bytes,
                  key: bytes,
              ) -> bytes:

                  nonce = secrets.token_bytes(
                      cls.NONCE_SIZE
                  )

                  stream = cls._keystream(
                      key,
                      nonce,
                      len(data),
                  )

                  ciphertext = bytes(
                      a ^ b
                      for a, b in zip(
                          data,
                          stream,
                      )
                  )

                  tag = hmac.new(
                      key,
                      nonce + ciphertext,
                      hashlib.sha256,
                  ).digest()

                  return (
                      nonce
                      + tag
                      + ciphertext
                  )

              @classmethod
              def _decrypt(
                  cls,
                  payload: bytes,
                  key: bytes,
              ) -> bytes:

                  minimum = (
                      cls.NONCE_SIZE
                      + hashlib.sha256().digest_size
                  )

                  if len(payload) < minimum:
                      raise ValueError(
                          "Invalid encrypted backup payload"
                      )

                  nonce = payload[
                      :cls.NONCE_SIZE
                  ]

                  tag_start = cls.NONCE_SIZE

                  tag_end = (
                      tag_start
                      + hashlib.sha256().digest_size
                  )

                  tag = payload[
                      tag_start:tag_end
                  ]

                  ciphertext = payload[
                      tag_end:
                  ]

                  expected = hmac.new(
                      key,
                      nonce + ciphertext,
                      hashlib.sha256,
                  ).digest()

                  if not hmac.compare_digest(
                      tag,
                      expected,
                  ):
                      raise ValueError(
                          "Backup authentication failed"
                      )

                  stream = cls._keystream(
                      key,
                      nonce,
                      len(ciphertext),
                  )

                  return bytes(
                      a ^ b
                      for a, b in zip(
                          ciphertext,
                          stream,
                      )
                  )

              def create_backup(
                  self,
                  source: str,
                  data: bytes,
                  key: bytes,
              ) -> BackupArtifact:

                  encrypted = self._encrypt(
                      bytes(data),
                      bytes(key),
                  )

                  backup_id = uuid4()

                  filename = (
                      f"{backup_id.hex}.backup"
                  )

                  path = self.root / filename

                  with self._lock:
                      path.write_bytes(
                          encrypted
                      )

                  digest = hashlib.sha256(
                      encrypted
                  ).hexdigest()

                  return BackupArtifact(
                      backup_id=backup_id,
                      source=source,
                      path=str(path),
                      digest=digest,
                      size_bytes=len(encrypted),
                  )

              def restore(
                  self,
                  artifact: BackupArtifact,
                  key: bytes,
              ) -> bytes:

                  path = Path(
                      artifact.path
                  )

                  with self._lock:
                      payload = path.read_bytes()

                  digest = hashlib.sha256(
                      payload
                  ).hexdigest()

                  if not hmac.compare_digest(
                      digest,
                      artifact.digest,
                  ):
                      raise ValueError(
                          "Backup digest verification failed"
                      )

                  return self._decrypt(
                      payload,
                      bytes(key),
                  )


          __all__ = [
              "BackupArtifact",
              "BackupEngine",
          ]
          PY

          cat > storage/encrypted_backups/restore_engine.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass

          from .backup_engine import (
              BackupArtifact,
              BackupEngine,
          )


          @dataclass(frozen=True, slots=True)
          class RestoreResult:
              backup_id: str
              bytes_restored: int


          class RestoreEngine:
              def __init__(
                  self,
                  backup_engine: BackupEngine,
              ) -> None:

                  self.backup_engine = backup_engine

              def restore(
                  self,
                  artifact: BackupArtifact,
                  key: bytes,
              ) -> tuple[bytes, RestoreResult]:

                  data = self.backup_engine.restore(
                      artifact,
                      key,
                  )

                  return data, RestoreResult(
                      backup_id=str(
                          artifact.backup_id
                      ),
                      bytes_restored=len(data),
                  )


          __all__ = [
              "RestoreEngine",
              "RestoreResult",
          ]
          PY

          cat > storage/encrypted_backups/backup_registry.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime, timezone
          from threading import RLock
          from uuid import UUID


          @dataclass(frozen=True, slots=True)
          class BackupRecord:
              backup_id: UUID
              source: str
              path: str
              digest: str
              created_at: datetime

              def __post_init__(self) -> None:
                  if not self.source.strip():
                      raise ValueError(
                          "Backup source cannot be empty"
                      )

                  if not self.digest.strip():
                      raise ValueError(
                          "Backup digest cannot be empty"
                      )

                  if self.created_at.tzinfo is None:
                      raise ValueError(
                          "created_at must be timezone-aware"
                      )


          class BackupRegistry:
              def __init__(self) -> None:
                  self._records: dict[
                      UUID,
                      BackupRecord,
                  ] = {}

                  self._lock = RLock()

              def register(
                  self,
                  record: BackupRecord,
              ) -> None:

                  with self._lock:
                      if (
                          record.backup_id
                          in self._records
                      ):
                          raise ValueError(
                              "Backup already registered"
                          )

                      self._records[
                          record.backup_id
                      ] = record

              def get(
                  self,
                  backup_id: UUID,
              ) -> BackupRecord:

                  with self._lock:
                      try:
                          return self._records[
                              backup_id
                          ]
                      except KeyError as exc:
                          raise LookupError(
                              "Backup not found"
                          ) from exc

              def remove(
                  self,
                  backup_id: UUID,
              ) -> bool:

                  with self._lock:
                      return (
                          self._records.pop(
                              backup_id,
                              None,
                          )
                          is not None
                      )

              def list(
                  self,
              ) -> tuple[BackupRecord, ...]:

                  with self._lock:
                      return tuple(
                          self._records.values()
                      )


          __all__ = [
              "BackupRecord",
              "BackupRegistry",
          ]
          PY

