              ) -> None:
                  previous_row = connection.execute(
                      """
                      SELECT record_hash
                      FROM ai_audit
                      ORDER BY sequence DESC
                      LIMIT 1
                      """
                  ).fetchone()

                  previous_hash = (
                      str(previous_row["record_hash"])
                      if previous_row is not None
                      else "0" * 64
                  )

                  payload_hash = hashlib.sha256(
                      payload.encode("utf-8")
                  ).hexdigest()

                  event_id = hashlib.sha256(
                      (
                          aggregate_id
                          + "|"
                          + event_type
                          + "|"
                          + payload_hash
                          + "|"
                          + str(now)
                          + "|"
                          + previous_hash
                      ).encode("utf-8")
                  ).hexdigest()

                  record_hash = hashlib.sha256(
                      (
                          event_id
                          + "|"
                          + aggregate_id
                          + "|"
                          + event_type
                          + "|"
                          + payload_hash
                          + "|"
                          + previous_hash
                          + "|"
                          + str(now)
                      ).encode("utf-8")
                  ).hexdigest()

                  connection.execute(
                      """
                      INSERT INTO ai_audit(
                          event_id,
                          aggregate_id,
                          event_type,
                          payload_hash,
                          previous_hash,
                          record_hash,
                          created_at
