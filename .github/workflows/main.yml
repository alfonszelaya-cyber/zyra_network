      - name: Validate protocol integration
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from protocol import (
              InMemoryTransport,
              MessageFactory,
              ProtocolMessage,
              ProtocolSDK,
              ProtocolValidator,
              ProtocolVerifier,
              Route,
              RouteTable,
              SDKConfiguration,
              SessionManager,
              SessionState,
              TransportAddress,
          )


          # Messages
          factory = MessageFactory()

          message = factory.create(
              message_type="PING",
              sender_id="node-a",
              payload={"sequence": 1},
              headers={"content-type": "application/protocol"},
          )

          assert isinstance(message, ProtocolMessage)
          assert message.message_type == "PING"
          assert message.sender_id == "node-a"
          assert len(message.fingerprint()) == 64
          assert message.canonical_bytes()


          # Routing
          routes = RouteTable()

          routes.add(
              Route(
                  source="node-a",
                  destination="node-b",
                  protocol="tcp",
                  priority=10,
              )
          )

          resolved = routes.resolve(
              "node-a",
              "node-b",
              "tcp",
          )

          assert resolved.destination == "node-b"
          assert routes.candidates(
              "node-a",
              "node-b",
          )


          # SDK
          sdk = ProtocolSDK(
              SDKConfiguration(
                  protocol_version="1",
                  sender_id="node-sdk",
                  default_timeout_seconds=30,
              )
          )

          sdk_message = sdk.message(
              "HEALTH",
              {"status": "ok"},
          )

          assert sdk.identity() == "node-sdk"
          assert sdk.version() == "1"
          assert sdk_message.sender_id == "node-sdk"


          # Sessions
          sessions = SessionManager()

          session = sessions.create(
              "node-a",
              "node-b",
          )

          assert session.state is SessionState.CREATED

          active = sessions.activate(session.session_id)

          assert active.state is SessionState.ACTIVE
          assert active.activated_at is not None

          closed = sessions.close(session.session_id)

          assert closed.state is SessionState.CLOSED
          assert closed.closed_at is not None


          # Transport
          transport = InMemoryTransport()

          transport.connect(
              TransportAddress(
                  host="127.0.0.1",
                  port=9000,
              )
          )

          transport.send(b"protocol-frame")

          assert transport.receive_all() == (
              b"protocol-frame",
          )


          # Validation
          validator = ProtocolValidator()

          result = validator.validate_required(
              {"id": "node-a", "sequence": 1},
              {
                  "id": str,
                  "sequence": int,
              },
          )

          assert result.valid is True
          assert not result.issues

          invalid = validator.validate_required(
              {"id": 10, "sequence": True},
              {
                  "id": str,
                  "sequence": int,
              },
          )

          assert invalid.valid is False
          assert len(invalid.issues) == 2


          # Verification
          verifier = ProtocolVerifier()

          payload = b"zyra-protocol"

          fingerprint = verifier.fingerprint(payload)

          assert len(fingerprint) == 64
          assert verifier.verify_fingerprint(
              payload,
              fingerprint,
          )

          secret = b"protocol-secret"

          signature = verifier.sign_hmac(
              payload,
              secret,
          )

          assert verifier.verify_hmac(
              payload,
              secret,
              signature,
          )

          assert not verifier.verify_hmac(
              b"tampered",
              secret,
              signature,
          )


          print("Protocol block 03 integration validation: OK")
          PY

      - name: Validate existing protocol modules
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from protocol.api import APIRequest, APIResponse, APIRouter
          from protocol.authentication import (
              AuthenticationChallenge,
              AuthenticationVerifier,
          )
          from protocol.authorization import (
              AuthorizationPolicy,
              Permission,
          )
          from protocol.certification import CertificateAuthority
          from protocol.consensus import QuorumConsensus
          from protocol.contracts import (
              ContractRegistry,
              ProtocolContract,
          )
          from protocol.discovery import (
              ServiceDiscovery,
              ServiceRecord,
          )
          from protocol.encoding import ProtocolEncoder
          from protocol.events import EventBus, ProtocolEvent
          from protocol.gateway import ProtocolGateway
          from protocol.handshake import (
              Handshake,
              HandshakeValidator,
          )
          from protocol.identity import (
              IdentityRegistry,
              ProtocolIdentity,
          )


          # API
          request = APIRequest(
              method="get",
              path="/health",
          )

          response = APIResponse(
              status_code=200,
              body=b"ok",
          )

          assert request.method == "GET"
          assert response.status_code == 200

          api = APIRouter()
          api.register(
              "GET",
              "/health",
              lambda req: response,
          )

          assert api.resolve("GET", "/health")(request).status_code == 200


          # Authentication
          challenge = AuthenticationChallenge.create(60)

          auth = AuthenticationVerifier(
              b"long-lived-protocol-secret",
          )

          auth_response = auth.create_response(
              challenge.challenge,
          )

          assert auth.verify(
              challenge.challenge,
              auth_response,
          )


          # Authorization
          policy = AuthorizationPolicy()

          permission = Permission(
              "protocol",
              "read",
          )

          policy.grant(
              "node-a",
              permission,
          )

          assert policy.allowed(
              "node-a",
              "protocol",
              "read",
          )


          # Certification
          authority = CertificateAuthority("zyra-root")

          certificate = authority.issue(
              "node-a",
              b"public-material",
          )

          assert authority.verify(certificate)


          # Consensus
          consensus = QuorumConsensus(3)

          result = consensus.evaluate(
              ["accept", "accept", "reject"],
          )

          assert result.reached is True
          assert result.value == "accept"


          # Contracts
          contracts = ContractRegistry()

          contract = ProtocolContract(
              name="health",
              version="1",
              schema={
                  "status": "str",
              },
          )

          contracts.register(contract)

          assert contracts.validate(
              "health",
              "1",
              {"status": "ok"},
          )


          # Discovery
          discovery = ServiceDiscovery()

          record = ServiceRecord(
              service_id="protocol",
              address="127.0.0.1:9000",
              protocol="tcp",
              metadata={},
          )

          discovery.register(record)

          assert discovery.resolve(
              "protocol",
          ) == record


          # Encoding
          encoded = ProtocolEncoder.encode(
              {"z": 2, "a": 1},
          )

          assert ProtocolEncoder.decode(encoded) == {
              "a": 1,
              "z": 2,
          }


          # Events
          events = EventBus()
          received = []

          events.subscribe(
              "PROTOCOL_TEST",
              lambda event: received.append(
                  event.event_id,
              ),
          )

          events.publish(
              ProtocolEvent(
                  "PROTOCOL_TEST",
                  {"ok": True},
              ),
          )

          assert len(received) == 1


          # Gateway
          gateway = ProtocolGateway()

          gateway.add_route(
              "GET",
              "/health",
              lambda req: "ok",
          )

          assert gateway.dispatch(
              "GET",
              "/health",
              None,
          ) == "ok"


          # Handshake
          handshake = Handshake.create(
              "1",
              "remote-node",
          )

          assert HandshakeValidator.validate(
              handshake,
              "1",
          )


          # Identity
          identity = ProtocolIdentity.create(
              "node-a",
              "zyra-root",
          )

          identities = IdentityRegistry()

          identities.register(identity)

          assert identities.get(
              identity.identity_id,
          ) == identity


          print("Existing protocol integration validation: OK")
          PY

