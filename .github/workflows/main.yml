          from __future__ import annotations

          from dataclasses import dataclass
          from decimal import Decimal
          from threading import Lock

          from .errors import AIBudgetExceeded


          @dataclass(frozen=True, slots=True)
          class BudgetSnapshot:
              requests: int
              tokens: int
              cost: Decimal


          class ExecutionBudget:
              def __init__(
                  self,
                  *,
                  max_requests: int | None = None,
                  max_tokens: int | None = None,
                  max_cost: Decimal | None = None,
              ) -> None:
                  if max_requests is not None and max_requests < 1:
                      raise ValueError(
                          "max_requests must be positive"
                      )

                  if max_tokens is not None and max_tokens < 1:
                      raise ValueError(
                          "max_tokens must be positive"
                      )

                  if max_cost is not None and (
                      max_cost < 0
                      or not max_cost.is_finite()
                  ):
                      raise ValueError(
                          "Invalid max_cost"
                      )

                  self._max_requests = max_requests
                  self._max_tokens = max_tokens
                  self._max_cost = max_cost

                  self._requests = 0
                  self._tokens = 0
                  self._cost = Decimal("0")

                  self._lock = Lock()

              def reserve_request(self) -> None:
                  with self._lock:
                      if (
                          self._max_requests is not None
                          and self._requests + 1
                          > self._max_requests
                      ):
                          raise AIBudgetExceeded(
                              "AI request budget exceeded"
                          )

                      self._requests += 1

              def settle(
                  self,
                  *,
                  tokens: int,
                  cost: Decimal,
              ) -> None:
                  if tokens < 0:
                      raise ValueError(
                          "tokens cannot be negative"
                      )

                  if (
                      cost < 0
                      or not cost.is_finite()
                  ):
                      raise ValueError(
                          "cost must be finite and non-negative"
                      )

                  with self._lock:
                      new_tokens = self._tokens + tokens
                      new_cost = self._cost + cost

                      if (
                          self._max_tokens is not None
                          and new_tokens > self._max_tokens
                      ):
                          raise AIBudgetExceeded(
                              "AI token budget exceeded"
                          )

                      if (
                          self._max_cost is not None
                          and new_cost > self._max_cost
                      ):
                          raise AIBudgetExceeded(
                              "AI cost budget exceeded"
                          )

                      self._tokens = new_tokens
                      self._cost = new_cost

              def snapshot(self) -> BudgetSnapshot:
                  with self._lock:
                      return BudgetSnapshot(
                          requests=self._requests,
                          tokens=self._tokens,
                          cost=self._cost,
                      )
