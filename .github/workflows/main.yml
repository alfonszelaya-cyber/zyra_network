          from __future__ import annotations

          from datetime import datetime
          from pathlib import Path
          from typing import Any, Mapping

          from observability.context import ObservationContext
          from observability.events import EventSeverity, EventType
          from observability.manager import ObservabilityManager
          from observability.status import StatusReport


          class ObservabilityAPI:
              """
              Stable public facade.

              Applications should depend on this facade rather than
              importing implementation internals.
              """

              def __init__(
                  self,
                  manager: ObservabilityManager | None = None,
                  *,
                  storage_path: str | Path = "storage/observability.db",
              ):
                  self.manager = manager or ObservabilityManager(
                      storage_path=storage_path
                  )

              def start(self) -> None:
                  self.manager.start()

              def stop(self) -> None:
                  self.manager.stop()

              def event(
                  self,
                  name: str,
                  *,
                  payload: Mapping[str, Any] | None = None,
                  event_type: EventType = EventType.SYSTEM,
                  severity: EventSeverity = EventSeverity.INFO,
                  context: ObservationContext | None = None,
              ):
                  return self.manager.emit(
                      name,
                      payload=payload,
                      event_type=event_type,
                      severity=severity,
                      context=context,
                  )

              def metric(
                  self,
                  name: str,
                  value: float,
                  *,
                  labels: Mapping[str, str] | None = None,
              ) -> None:
                  self.manager.metrics.observe(
                      name,
                      value,
                      labels=labels,
                  )

              def status(self) -> StatusReport:
                  return self.manager.status()

              def snapshot(self):
                  return self.manager.snapshot()

              def query(
                  self,
                  *,
                  start: datetime | None = None,
                  end: datetime | None = None,
                  kind: str | None = None,
                  name: str | None = None,
                  limit: int = 1000,
              ):
                  return self.manager.query.execute(
                      start=start,
                      end=end,
                      kind=kind,
                      name=name,
                      limit=limit,
