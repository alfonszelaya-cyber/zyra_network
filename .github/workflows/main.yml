          from __future__ import annotations

          from datetime import datetime
          from typing import Any

          from observability.storage import ObservationStore, StoredObservation


          class ObservationQuery:
              def __init__(self, store: ObservationStore):
                  self.store = store

              def execute(
                  self,
                  *,
                  start: datetime | None = None,
                  end: datetime | None = None,
                  kind: str | None = None,
                  name: str | None = None,
                  limit: int = 1000,
              ) -> list[StoredObservation]:
                  return self.store.query(
                      start=start,
                      end=end,
                      kind=kind,
                      name=name,
                      limit=limit,
                  )

              def count(
                  self,
                  *,
                  start: datetime | None = None,
                  end: datetime | None = None,
                  kind: str | None = None,
                  name: str | None = None,
              ) -> int:
                  return len(
                      self.execute(
                          start=start,
                          end=end,
                          kind=kind,
                          name=name,
                          limit=2_000_000,
                      )
                  )

              def aggregate(
                  self,
                  *,
                  name: str,
                  start: datetime | None = None,
                  end: datetime | None = None,
              ) -> dict[str, Any]:
                  rows = self.execute(
                      start=start,
                      end=end,
                      name=name,
                      limit=2_000_000,
                  )

                  values = [
                      float(row.payload["value"])
                      for row in rows
                      if isinstance(row.payload.get("value"), (int, float))
                  ]

                  if not values:
                      return {
                          "name": name,
                          "count": 0,
                          "minimum": None,
                          "maximum": None,
                          "average": None,
                          "sum": 0.0,
                      }

                  return {
                      "name": name,
                      "count": len(values),
                      "minimum": min(values),
                      "maximum": max(values),
                      "average": sum(values) / len(values),
                      "sum": sum(values),
                  }
