                  self,
                  request,
                  *,
                  idempotency_key: str,
                  timeout_seconds: float,
              ) -> ProviderResult:
                  self.calls += 1
                  payload = {
                      "id": f"provider-{request.request_id}",
                      "usage_units": 3,
                      "estimated_cost": 7,
                      "echo": dict(request.input_payload),
                  }
                  return ProviderResult(
                      provider_request_id=payload["id"],
                      payload=payload,
                      usage_units=3,
                      estimated_cost=7,
                      raw_hash="test",
                  )

              def health(self):
                  return {"healthy": True}


          @pytest.fixture()
