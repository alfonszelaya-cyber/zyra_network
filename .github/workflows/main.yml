          from __future__ import annotations

          import threading
          import time


          class ConcurrencyLimiter:
              """
              Bounded in-process concurrency.

              Prevents unbounded application pressure from becoming
              unbounded provider pressure.
              """

              def __init__(
                  self,
                  maximum: int,
                  wait_seconds: float,
              ) -> None:
                  if maximum < 1:
                      raise ValueError(
                          "maximum must be positive"
                      )

                  if wait_seconds < 0:
                      raise ValueError(
                          "wait_seconds cannot be negative"
                      )

                  self._semaphore = threading.BoundedSemaphore(
                      maximum
                  )
                  self._wait_seconds = wait_seconds

              def acquire(self) -> bool:
                  return self._semaphore.acquire(
                      timeout=self._wait_seconds
                  )

              def release(self) -> None:
                  self._semaphore.release()

              def __enter__(
                  self,
              ) -> "ConcurrencyLimiter":
                  if not self.acquire():
                      raise TimeoutError(
                          "AI concurrency capacity exhausted"
                      )

                  return self

              def __exit__(
                  self,
                  exc_type: object,
                  exc_value: object,
                  traceback: object,
              ) -> None:
                  self.release()

              def available_probe(self) -> bool:
                  acquired = self._semaphore.acquire(
                      timeout=0
                  )

                  if acquired:
                      self._semaphore.release()

                  return acquired

              @property
              def wait_seconds(self) -> float:
                  return self._wait_seconds
