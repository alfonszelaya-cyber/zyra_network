          from __future__ import annotations

          import threading

          from ..core import (
              BoundedQueue,
              ObservationEvent,
              ObservationPolicy,
          )


          class Collector:
              """
              Admission boundary for telemetry.

              The queue has a hard capacity. Producers can choose between
              immediate rejection and bounded blocking. There is no
              unbounded memory growth.
              """

              def __init__(
                  self,
                  policy: ObservationPolicy,
              ):
                  self.policy = policy.validate()
                  self.queue = BoundedQueue(
                      self.policy.max_queue_size
                  )
                  self._lock = threading.RLock()
                  self._closed = False

              def submit(
                  self,
                  event: ObservationEvent,
                  *,
                  block: bool = False,
                  timeout: float | None = None,
              ) -> bool:
                  if not isinstance(
                      event,
                      ObservationEvent,
                  ):
                      raise TypeError(
                          "collector accepts ObservationEvent"
                      )

                  with self._lock:
                      if self._closed:
                          return False

                      return self.queue.put(
                          event,
                          block=block,
                          timeout=timeout,
                      )

              def get(self, timeout=None):
                  return self.queue.get(timeout)

              def close(self):
                  with self._lock:
                      self._closed = True
                      self.queue.close()

              def stats(self):
                  return {
                      "queued": self.queue.qsize(),
                      "accepted": self.queue.accepted.value(),
                      "dropped": self.queue.dropped.value(),
                      "closed": self._closed,
                  }

              @property
              def closed(self):
                  with self._lock:
                      return self._closed


          __all__ = ["Collector"]
