          cat > shared_engines/ai/README.md <<'MD'
          # Shared AI Engine

          This package is a durable execution boundary for shared AI services.

          Design goals:

          - explicit versioned contracts
          - deterministic request fingerprints
          - authenticated encrypted payloads
          - versioned encryption keys
          - idempotent execution
          - transactional request journal
          - fencing leases
          - conservative uncertain-outcome recovery
          - bounded concurrency and backpressure
          - bounded retries and deadlines
          - provider circuit breaking
          - transactional outbox and inbox deduplication
          - chained audit records
          - audit checkpoints
          - migration checksums
          - online SQLite backup
          - integrity verification
          - explicit observability hooks

          SQLite is deliberately treated as a durable single-node adapter.
          Distributed high availability must be implemented by an infrastructure
          adapter with equivalent transactional, locking and fencing semantics.
          MD

          # Fix the test helper without weakening production code.
          python - <<'PY'
          from pathlib import Path

          path = Path("shared_engines/ai/storage.py")
          text = path.read_text()
          marker = "              def _insert_outbox("
          helper = """
              def _test_connection(self) -> sqlite3.Connection:
                  connection = sqlite3.connect(
                      self.path,
                      timeout=30.0,
                      isolation_level=None,
                  )
                  connection.row_factory = sqlite3.Row
                  connection.execute("PRAGMA foreign_keys=ON")
                  return connection

          """
          text = text.replace(marker, helper + marker)
          path.write_text(text)

          path = Path("shared_engines/ai/tests/test_core.py")
          text = path.read_text()
          text = text.replace(
              "import tempfile\n",
              "import tempfile\n",
