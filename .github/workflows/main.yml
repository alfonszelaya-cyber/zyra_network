name: construir infraestructura

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-infrastructure:
    name: Build Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python path
        shell: bash
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Build Infrastructure
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p infrastructure/bootstrap/api
          mkdir -p infrastructure/cluster
          mkdir -p infrastructure/deployment
          mkdir -p infrastructure/diagnostics
          mkdir -p infrastructure/discovery
          mkdir -p infrastructure/gateway
          mkdir -p infrastructure/load_balancer
          mkdir -p infrastructure/monitoring_adapters
          mkdir -p infrastructure/network
          mkdir -p infrastructure/node
          mkdir -p infrastructure/security/scheduler
          mkdir -p infrastructure/template

          # ============================================================
          # BOOTSTRAP API
          # ============================================================

          cat > infrastructure/bootstrap/api/__init__.py <<'PY'
          """
          Bootstrap API package.

          Stable public interface for infrastructure bootstrap operations.
          """

          from .bootstrap_api import (
              BootstrapRequest,
              BootstrapResponse,
              BootstrapService,
          )

          __all__ = [
              "BootstrapRequest",
              "BootstrapResponse",
              "BootstrapService",
          ]
          PY

          cat > infrastructure/bootstrap/api/bootstrap_api.py <<'PY'
          """
          Infrastructure bootstrap API.

          This module contains the application-independent bootstrap contract.
          It deliberately uses only standard-library primitives so the base
          infrastructure remains deployable before optional providers exist.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from threading import RLock
          from typing import Mapping

          from ...bootstrap import BootstrapManager


          @dataclass(frozen=True)
          class BootstrapRequest:
              environment: str
              node_id: str
              metadata: Mapping[str, str] = field(default_factory=dict)


          @dataclass(frozen=True)
          class BootstrapResponse:
              accepted: bool
              node_id: str
              environment: str
              started_at: str
              message: str


          class BootstrapService:
              """
              Stable service facade for infrastructure initialization.

              The service is idempotent at the API level and serializes
              concurrent bootstrap requests for the same process.
              """

              def __init__(self, manager: BootstrapManager | None = None) -> None:
                  self._manager = manager or BootstrapManager()
                  self._lock = RLock()

              def start(self, request: BootstrapRequest) -> BootstrapResponse:
                  if not request.environment.strip():
                      raise ValueError("environment is required")
                  if not request.node_id.strip():
                      raise ValueError("node_id is required")

                  now = datetime.now(timezone.utc).isoformat()

                  with self._lock:
                      self._manager.initialize(
                          environment=request.environment,
                          node_id=request.node_id,
                          metadata=dict(request.metadata),
                      )

                  return BootstrapResponse(
                      accepted=True,
                      node_id=request.node_id,
                      environment=request.environment,
                      started_at=now,
                      message="Infrastructure bootstrap accepted",
                  )
          PY

          # ============================================================
          # CLUSTER
          # ============================================================

          cat > infrastructure/cluster/__init__.py <<'PY'
          """
          Cluster coordination primitives.
          """

          from .cluster_manager import (
              ClusterManager,
              ClusterMember,
              ClusterState,
              MemberStatus,
          )

          __all__ = [
              "ClusterManager",
              "ClusterMember",
              "ClusterState",
              "MemberStatus",
          ]
          PY

          cat > infrastructure/cluster/cluster_manager.py <<'PY'
          """
          In-process cluster membership and health coordination.

          This is the infrastructure contract. Network-specific discovery,
          consensus and orchestration providers can be attached above it
          without changing the public model.
          """

          from __future__ import annotations

          from dataclasses import dataclass, field
          from enum import Enum
          from threading import RLock
          from time import monotonic
          from typing import Mapping


          class MemberStatus(str, Enum):
              JOINING = "joining"
              READY = "ready"
              DEGRADED = "degraded"
              LEAVING = "leaving"
              OFFLINE = "offline"


          @dataclass
          class ClusterMember:
              node_id: str
              endpoint: str
              status: MemberStatus = MemberStatus.JOINING
              metadata: dict[str, str] = field(default_factory=dict)
              last_heartbeat: float = field(default_factory=monotonic)
              generation: int = 0


          @dataclass(frozen=True)
          class ClusterState:
              cluster_id: str
              generation: int
              members: tuple[ClusterMember, ...]


          class ClusterManager:
              def __init__(self, cluster_id: str) -> None:
                  if not cluster_id.strip():
                      raise ValueError("cluster_id is required")

                  self._cluster_id = cluster_id
                  self._generation = 0
                  self._members: dict[str, ClusterMember] = {}
                  self._lock = RLock()

              def register(
                  self,
                  node_id: str,
                  endpoint: str,
                  metadata: Mapping[str, str] | None = None,
              ) -> ClusterMember:
                  if not node_id.strip():
                      raise ValueError("node_id is required")
                  if not endpoint.strip():
                      raise ValueError("endpoint is required")

                  with self._lock:
                      self._generation += 1

                      member = ClusterMember(
                          node_id=node_id,
                          endpoint=endpoint,
                          status=MemberStatus.READY,
                          metadata=dict(metadata or {}),
                          generation=self._generation,
                      )

                      self._members[node_id] = member
                      return member

              def heartbeat(self, node_id: str) -> None:
                  with self._lock:
                      member = self._members.get(node_id)
                      if member is None:
                          raise KeyError(f"unknown cluster member: {node_id}")

                      member.last_heartbeat = monotonic()
                      if member.status in {
                          MemberStatus.DEGRADED,
                          MemberStatus.OFFLINE,
                      }:
                          member.status = MemberStatus.READY

              def set_status(
                  self,
                  node_id: str,
                  status: MemberStatus,
              ) -> None:
                  with self._lock:
                      member = self._members.get(node_id)
                      if member is None:
                          raise KeyError(f"unknown cluster member: {node_id}")
                      member.status = status
                      self._generation += 1
                      member.generation = self._generation

              def remove(self, node_id: str) -> None:
                  with self._lock:
                      if node_id in self._members:
                          del self._members[node_id]
                          self._generation += 1

              def snapshot(self) -> ClusterState:
                  with self._lock:
                      members = tuple(
                          ClusterMember(
                              node_id=m.node_id,
                              endpoint=m.endpoint,
                              status=m.status,
                              metadata=dict(m.metadata),
                              last_heartbeat=m.last_heartbeat,
                              generation=m.generation,
                          )
                          for m in self._members.values()
                      )

                      return ClusterState(
                          cluster_id=self._cluster_id,
                          generation=self._generation,
                          members=members,
                      )
          PY

          # ============================================================
          # DEPLOYMENT
          # ============================================================

          cat > infrastructure/deployment/__init__.py <<'PY'
          """
          Deployment lifecycle primitives.
          """

          from .deployment_manager import (
              Deployment,
              DeploymentManager,
              DeploymentState,
