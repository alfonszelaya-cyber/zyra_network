          from __future__ import annotations

          from dataclasses import dataclass
          from enum import Enum
          from threading import Lock
          import time


          class CircuitState(str, Enum):
              CLOSED = "closed"
              OPEN = "open"
              HALF_OPEN = "half_open"


          @dataclass(frozen=True, slots=True)
          class CircuitSnapshot:
              state: CircuitState
              failures: int
              opened_at: int | None


          class CircuitBreaker:
              def __init__(
                  self,
                  *,
                  failure_threshold: int = 5,
                  recovery_seconds: int = 30,
              ) -> None:
                  if failure_threshold < 1:
                      raise ValueError("failure_threshold must be positive")

                  if recovery_seconds < 1:
                      raise ValueError("recovery_seconds must be positive")

                  self._threshold = failure_threshold
                  self._recovery = recovery_seconds
                  self._lock = Lock()
                  self._state = CircuitState.CLOSED
                  self._failures = 0
                  self._opened_at: int | None = None
                  self._half_open_claimed = False

              def allow(self, *, now: int) -> bool:
                  with self._lock:
                      if self._state is CircuitState.CLOSED:
                          return True

                      if self._state is CircuitState.OPEN:
                          if (
                              self._opened_at is not None
                              and now - self._opened_at >= self._recovery
                          ):
                              self._state = CircuitState.HALF_OPEN
                              self._half_open_claimed = True
                              return True

                          return False

                      if not self._half_open_claimed:
                          self._half_open_claimed = True
                          return True

                      return False

              def success(self) -> None:
                  with self._lock:
                      self._state = CircuitState.CLOSED
                      self._failures = 0
                      self._opened_at = None
                      self._half_open_claimed = False

              def failure(self, *, now: int) -> None:
                  with self._lock:
                      self._failures += 1

                      if self._state is CircuitState.HALF_OPEN:
                          self._state = CircuitState.OPEN
                          self._opened_at = now
                          self._half_open_claimed = False
                          return

                      if self._failures >= self._threshold:
                          self._state = CircuitState.OPEN
                          self._opened_at = now
                          self._half_open_claimed = False

              def snapshot(self) -> CircuitSnapshot:
                  with self._lock:
                      return CircuitSnapshot(
                          state=self._state,
                          failures=self._failures,
                          opened_at=self._opened_at,
                      )
