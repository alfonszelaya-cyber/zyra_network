              def reserve(
                  self,
                  *,
                  request: AIRequest,
                  request_hash: str,
                  owner: str,
                  now: int,
                  lease_seconds: int,
              ) -> Reservation:
                  encrypted_request = (
                      self._encrypt_request(request)
                  )

                  lease_until = (
                      now + lease_seconds
                  )
                  lease_token = os.urandom(
                      32
                  ).hex()

                  with self._lock:
                      connection = self._connect()

                      try:
                          connection.execute(
                              "BEGIN IMMEDIATE"
                          )

                          row = connection.execute(
                              """
                              SELECT *
                              FROM ai_requests
                              WHERE idempotency_key = ?
                              """,
                              (
                                  request.idempotency_key,
                              ),
                          ).fetchone()

                          if row is not None:
                              if (
                                  str(row["request_hash"])
                                  != request_hash
                              ):
                                  connection.rollback()

                                  raise AIIdempotencyConflict(
                                      "Idempotency key conflicts "
                                      "with existing request"
                                  )

                              if (
                                  row["status"]
                                  == "completed"
                              ):
                                  response_json = (
                                      row["response_json"]
                                  )

                                  if (
                                      response_json
                                      is None
                                  ):
                                      connection.rollback()

                                      raise AIIntegrityError(
                                          "Completed request has no response"
                                      )

                                  response = (
                                      response_from_json(
                                          str(
                                              response_json
                                          )
                                      )
                                  )

                                  connection.commit()

                                  return Reservation(
                                      response=response,
                                      acquired=False,
                                      lease_token=None,
                                  )

                              if (
                                  row["status"]
                                  == "running"
                                  and row["lease_until"]
                                  is not None
                                  and int(
                                      row["lease_until"]
                                  ) > now
                                  and row["lease_owner"]
                                  != owner
                              ):
                                  connection.rollback()

                                  raise AIRequestInFlight(
                                      "Request is currently owned"
                                  )

                              connection.execute(
                                  """
                                  UPDATE ai_requests
                                  SET
                                      status = 'running',
                                      lease_owner = ?,
                                      lease_token = ?,
                                      lease_until = ?,
                                      attempt = attempt + 1,
                                      updated_at = ?,
                                      error_code = NULL,
                                      error_message = NULL
                                  WHERE idempotency_key = ?
                                  """,
                                  (
                                      owner,
                                      lease_token,
                                      lease_until,
                                      now,
                                      request.idempotency_key,
                                  ),
                              )

                              self._audit_tx(
                                  connection,
                                  aggregate_id=(
                                      request.idempotency_key
                                  ),
                                  event_type=(
                                      "AI_REQUEST_RECLAIMED"
                                  ),
                                  payload=(
                                      '{"timestamp":'
                                      + str(now)
                                      + "}"
                                  ),
                                  now=now,
                              )

                              connection.commit()

                              return Reservation(
                                  response=None,
                                  acquired=True,
                                  lease_token=lease_token,
                              )

                          connection.execute(
                              """
                              INSERT INTO ai_requests(
                                  idempotency_key,
                                  request_hash,
                                  encrypted_request,
                                  status,
                                  lease_owner,
                                  lease_token,
                                  lease_until,
                                  attempt,
                                  response_json,
                                  error_code,
                                  error_message,
                                  created_at,
                                  updated_at
                              )
                              VALUES (
                                  ?, ?, ?, 'running', ?, ?, ?, 1,
                                  NULL, NULL, NULL, ?, ?
                              )
                              """,
                              (
                                  request.idempotency_key,
                                  request_hash,
                                  encrypted_request,
                                  owner,
                                  lease_token,
                                  lease_until,
                                  request.created_at,
                                  now,
                              ),
                          )

                          self._audit_tx(
                              connection,
                              aggregate_id=(
                                  request.idempotency_key
                              ),
                              event_type=(
                                  "AI_REQUEST_CREATED"
                              ),
                              payload=(
                                  '{"timestamp":'
                                  + str(now)
                                  + "}"
                              ),
                              now=now,
                          )

                          connection.commit()

                          return Reservation(
                              response=None,
                              acquired=True,
                              lease_token=lease_token,
                          )

                      except (
                          AIIdempotencyConflict,
                          AIRequestInFlight,
                          AIIntegrityError,
                      ):
                          raise

                      except sqlite3.Error as exc:
                          connection.rollback()

                          raise AIStorageError(
                              f"Reservation failed: {exc}"
                          ) from exc

                      finally:
                          connection.close()

              def wait_for_completion(
                  self,
                  *,
                  idempotency_key: str,
                  request_hash: str,
                  timeout_seconds: float,
              ) -> AIResponse | None:
                  deadline = (
                      time.monotonic()
                      + timeout_seconds
                  )

                  while (
                      time.monotonic()
                      < deadline
                  ):
                      connection = self._connect()

                      try:
                          row = connection.execute(
                              """
                              SELECT
                                  request_hash,
                                  status,
                                  response_json
                              FROM ai_requests
                              WHERE idempotency_key = ?
                              """,
                              (
                                  idempotency_key,
                              ),
                          ).fetchone()
                      finally:
                          connection.close()

                      if row is None:
                          return None

                      if (
                          str(row["request_hash"])
                          != request_hash
                      ):
                          raise AIIdempotencyConflict(
                              "Stored request hash differs"
                          )

                      if row["status"] == "completed":
                          response_json = (
                              row["response_json"]
                          )

                          if response_json is None:
                              raise AIIntegrityError(
                                  "Completed request has no response"
                              )

                          return response_from_json(
                              str(response_json)
                          )

                      time.sleep(0.05)

                  return None

              def complete(
                  self,
                  *,
                  request: AIRequest,
                  response: AIResponse,
                  owner: str,
                  lease_token: str,
                  now: int,
              ) -> None:
                  payload = response_to_json(
                      response
                  )

                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      cursor = connection.execute(
                          """
                          UPDATE ai_requests
                          SET
                              status = 'completed',
                              lease_owner = NULL,
                              lease_token = NULL,
                              lease_until = NULL,
                              response_json = ?,
                              updated_at = ?
                          WHERE
                              idempotency_key = ?
                              AND status = 'running'
                              AND lease_owner = ?
                              AND lease_token = ?
                          """,
                          (
                              payload,
                              now,
                              request.idempotency_key,
                              owner,
                              lease_token,
                          ),
                      )

                      if cursor.rowcount != 1:
                          connection.rollback()

                          raise AILeaseError(
                              "Completion rejected: fencing token lost"
                          )

                      event_payload = (
                          '{"request_id":"'
                          + request.request_id
                          + '","response_id":"'
                          + response.response_id
                          + '","timestamp":'
                          + str(now)
                          + "}"
                      )

                      connection.execute(
                          """
                          INSERT INTO ai_outbox(
                              aggregate_id,
                              event_type,
                              payload,
                              created_at
                          )
                          VALUES(
                              ?,
                              'AI_REQUEST_COMPLETED',
                              ?,
                              ?
                          )
                          """,
                          (
                              request.idempotency_key,
                              event_payload,
                              now,
                          ),
                      )

                      self._audit_tx(
                          connection,
                          aggregate_id=(
                              request.idempotency_key
                          ),
                          event_type=(
                              "AI_REQUEST_COMPLETED"
                          ),
                          payload=event_payload,
                          now=now,
                      )

                      self._checkpoint_tx(
                          connection,
                          now=now,
                      )

                      connection.commit()

                  except AILeaseError:
                      raise

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          f"Completion failed: {exc}"
                      ) from exc

                  finally:
                      connection.close()

              def fail(
                  self,
                  *,
                  request: AIRequest,
                  owner: str,
                  lease_token: str,
                  now: int,
                  error_code: str,
                  error_message: str,
              ) -> None:
                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      cursor = connection.execute(
                          """
                          UPDATE ai_requests
                          SET
                              status = 'failed',
                              lease_owner = NULL,
                              lease_token = NULL,
                              lease_until = NULL,
                              error_code = ?,
                              error_message = ?,
                              updated_at = ?
                          WHERE
                              idempotency_key = ?
                              AND status = 'running'
                              AND lease_owner = ?
                              AND lease_token = ?
                          """,
                          (
                              error_code,
                              error_message[:4000],
                              now,
                              request.idempotency_key,
                              owner,
                              lease_token,
                          ),
                      )

                      if cursor.rowcount != 1:
                          connection.rollback()

                          raise AILeaseError(
                              "Failure state rejected: fencing token lost"
                          )

                      connection.commit()

                  except AILeaseError:
                      raise

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          f"Failure persistence failed: {exc}"
                      ) from exc

                  finally:
                      connection.close()

              def mark_recovery_required(
                  self,
                  *,
                  request: AIRequest,
                  owner: str,
                  lease_token: str,
                  now: int,
                  error_code: str,
                  error_message: str,
              ) -> None:
                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      cursor = connection.execute(
                          """
                          UPDATE ai_requests
                          SET
                              status = 'recovery_required',
                              lease_owner = NULL,
                              lease_token = NULL,
                              lease_until = NULL,
                              error_code = ?,
                              error_message = ?,
                              updated_at = ?
                          WHERE
                              idempotency_key = ?
                              AND status = 'running'
                              AND lease_owner = ?
                              AND lease_token = ?
                          """,
                          (
                              error_code,
                              error_message[:4000],
                              now,
                              request.idempotency_key,
                              owner,
                              lease_token,
                          ),
                      )

                      if cursor.rowcount != 1:
                          connection.rollback()

                          raise AILeaseError(
                              "Recovery state rejected: fencing token lost"
                          )

                      payload = (
                          '{"request_id":"'
                          + request.request_id
                          + '","error_code":"'
                          + error_code
                          + '","timestamp":'
                          + str(now)
                          + "}"
                      )

                      self._audit_tx(
                          connection,
                          aggregate_id=(
                              request.idempotency_key
                          ),
                          event_type=(
                              "AI_RECOVERY_REQUIRED"
                          ),
                          payload=payload,
                          now=now,
                      )

                      connection.commit()

                  except AILeaseError:
                      raise

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          f"Recovery persistence failed: {exc}"
                      ) from exc

                  finally:
                      connection.close()

              def recover_expired(
                  self,
                  *,
                  now: int,
                  stale_after_seconds: int,
              ) -> int:
                  cutoff = (
                      now - stale_after_seconds
                  )

                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      rows = connection.execute(
                          """
                          SELECT idempotency_key
                          FROM ai_requests
                          WHERE
                              status = 'running'
                              AND (
                                  lease_until IS NULL
                                  OR lease_until <= ?
                              )
                              AND updated_at <= ?
                          """,
                          (
                              now,
                              cutoff,
                          ),
                      ).fetchall()

                      for row in rows:
                          aggregate_id = str(
                              row["idempotency_key"]
                          )

                          connection.execute(
                              """
                              UPDATE ai_requests
                              SET
                                  status = 'recovery_required',
                                  lease_owner = NULL,
                                  lease_token = NULL,
                                  lease_until = NULL,
                                  updated_at = ?
                              WHERE idempotency_key = ?
                              """,
                              (
                                  now,
                                  aggregate_id,
                              ),
                          )

                          self._audit_tx(
                              connection,
                              aggregate_id=aggregate_id,
                              event_type=(
                                  "AI_RECOVERY_REQUIRED"
                              ),
                              payload=(
                                  '{"timestamp":'
                                  + str(now)
                                  + "}"
                              ),
                              now=now,
                          )

                      self._checkpoint_tx(
                          connection,
                          now=now,
                      )

                      connection.commit()

                      return len(rows)

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          f"Recovery scan failed: {exc}"
                      ) from exc

                  finally:
                      connection.close()

              def pending_outbox(
                  self,
                  *,
                  limit: int = 100,
              ) -> tuple[OutboxRecord, ...]:
                  if not 1 <= limit <= 10_000:
                      raise ValueError(
                          "Invalid outbox limit"
                      )

                  connection = self._connect()

                  try:
                      rows = connection.execute(
                          """
                          SELECT
                              event_id,
                              aggregate_id,
                              event_type,
                              payload,
                              created_at
                          FROM ai_outbox
                          WHERE published_at IS NULL
                          ORDER BY event_id
                          LIMIT ?
                          """,
                          (limit,),
                      ).fetchall()

                      return tuple(
                          OutboxRecord(
                              event_id=int(
                                  row["event_id"]
                              ),
                              aggregate_id=str(
                                  row["aggregate_id"]
                              ),
                              event_type=str(
                                  row["event_type"]
                              ),
                              payload=str(
                                  row["payload"]
                              ),
                              created_at=int(
                                  row["created_at"]
                              ),
                          )
                          for row in rows
                      )

                  finally:
                      connection.close()

              def mark_outbox_published(
                  self,
                  *,
                  event_id: int,
                  published_at: int,
              ) -> bool:
                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      cursor = connection.execute(
                          """
                          UPDATE ai_outbox
                          SET published_at = ?
                          WHERE
                              event_id = ?
                              AND published_at IS NULL
                          """,
                          (
                              published_at,
                              event_id,
                          ),
                      )

                      connection.commit()

                      return cursor.rowcount == 1

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          "Outbox acknowledgement failed"
                      ) from exc

                  finally:
                      connection.close()

              def mark_inbox_seen(
                  self,
                  *,
                  consumer: str,
                  event_id: str,
                  received_at: int,
              ) -> bool:
                  if not consumer.strip():
                      raise ValueError(
                          "consumer is required"
                      )

                  if not event_id.strip():
                      raise ValueError(
                          "event_id is required"
                      )

                  connection = self._connect()

                  try:
                      connection.execute(
                          "BEGIN IMMEDIATE"
                      )

                      try:
                          connection.execute(
                              """
                              INSERT INTO ai_inbox(
                                  consumer,
                                  event_id,
                                  received_at
                              )
                              VALUES (?, ?, ?)
                              """,
                              (
                                  consumer,
                                  event_id,
                                  received_at,
                              ),
                          )

                          connection.commit()

                          return True

                      except sqlite3.IntegrityError:
                          connection.rollback()

                          return False

                  except sqlite3.Error as exc:
                      connection.rollback()

                      raise AIStorageError(
                          "Inbox operation failed"
                      ) from exc

                  finally:
                      connection.close()

              def verify_database(self) -> None:
                  connection = self._connect()

                  try:
                      row = connection.execute(
                          "PRAGMA integrity_check"
                      ).fetchone()

                      if row is None or row[0] != "ok":
                          raise AIIntegrityError(
                              "SQLite integrity check failed"
                          )
                  finally:
                      connection.close()

              def verify_audit_chain(self) -> bool:
                  connection = self._connect()

                  try:
                      rows = connection.execute(
                          """
                          SELECT
                              event_id,
                              aggregate_id,
                              event_type,
                              payload_hash,
                              previous_hash,
                              record_hash,
                              created_at
                          FROM ai_audit
                          ORDER BY sequence
                          """
                      ).fetchall()

                      previous = "0" * 64

                      for row in rows:
                          event_id = str(
                              row["event_id"]
                          )
                          aggregate_id = str(
                              row["aggregate_id"]
                          )
                          event_type = str(
                              row["event_type"]
                          )
                          payload_hash = str(
                              row["payload_hash"]
                          )
                          previous_hash = str(
                              row["previous_hash"]
                          )
                          record_hash = str(
                              row["record_hash"]
                          )
                          created_at = int(
                              row["created_at"]
                          )

                          if previous_hash != previous:
                              return False

                          expected = hashlib.sha256(
                              (
                                  event_id
                                  + "|"
                                  + aggregate_id
                                  + "|"
                                  + event_type
                                  + "|"
                                  + payload_hash
                                  + "|"
                                  + previous_hash
                                  + "|"
                                  + str(created_at)
                              ).encode("utf-8")
                          ).hexdigest()

                          if expected != record_hash:
                              return False

                          previous = record_hash

                      checkpoint_rows = connection.execute(
                          """
                          SELECT
                              sequence,
                              record_hash
                          FROM ai_audit_checkpoints
                          ORDER BY checkpoint_id
                          """
                      ).fetchall()

                      for checkpoint in checkpoint_rows:
                          sequence = int(
                              checkpoint["sequence"]
                          )

                          row = connection.execute(
                              """
                              SELECT record_hash
                              FROM ai_audit
                              WHERE sequence = ?
                              """,
                              (sequence,),
                          ).fetchone()

                          if row is None:
                              return False

                          if (
                              str(row["record_hash"])
                              != str(
                                  checkpoint[
                                      "record_hash"
                                  ]
                              )
                          ):
                              return False

                      return True

                  finally:
                      connection.close()

              def backup(
                  self,
                  destination: str | Path,
              ) -> None:
                  destination_path = Path(
                      destination
                  )

                  destination_path.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  source = self._connect()
                  target = sqlite3.connect(
                      str(destination_path)
                  )

                  try:
                      source.backup(target)
                      target.commit()
                  except sqlite3.Error as exc:
                      raise AIStorageError(
                          "SQLite backup failed"
                      ) from exc
                  finally:
                      target.close()
                      source.close()

              def backup_and_verify(
                  self,
                  destination: str | Path,
              ) -> None:
                  self.verify_database()
                  self.backup(destination)

                  backup_store = SQLiteAIStore(
                      destination,
                      cipher=self._cipher,
                      timeout_seconds=self._timeout,
                  )

                  backup_store.verify_database()

                  if not backup_store.verify_audit_chain():
                      raise AIIntegrityError(
                          "Backup audit chain verification failed"
                      )

              def count_requests(self) -> int:
                  connection = self._connect()

                  try:
                      row = connection.execute(
                          """
                          SELECT COUNT(*)
                          FROM ai_requests
                          """
                      ).fetchone()

                      return int(row[0])
                  finally:
                      connection.close()
