name: Build AI Engine - Production Durable

on:
  workflow_dispatch:
  push:
    branches:
      - principal
    paths:
      - "shared_engines/ai/**"
      - ".github/workflows/build-ai-engine-production.yml"

permissions:
  contents: write

concurrency:
  group: ai-engine-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ai-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate production AI engine
        shell: bash
        run: |
          set -euo pipefail

          rm -rf shared_engines/ai
          mkdir -p \
            shared_engines/ai/providers \
            shared_engines/ai/persistence \
            shared_engines/ai/security \
            shared_engines/ai/observability \
            shared_engines/ai/tests

          cat > shared_engines/ai/__init__.py <<'PY'
          from .config import AIEngineConfig
          from .engine import AIEngine
          from .errors import AIEngineError
          from .models import AIRequest, AIResponse, ProviderResult

          __all__ = [
              "AIEngine",
              "AIEngineConfig",
              "AIEngineError",
              "AIRequest",
              "AIResponse",
              "ProviderResult",
          ]

          __version__ = "1.0.0"
          __contract_version__ = 1
          PY

          cat > shared_engines/ai/errors.py <<'PY'
          class AIEngineError(Exception):
              """Base exception for the AI engine."""


          class ConfigurationError(AIEngineError):
              pass


          class ContractError(AIEngineError):
              pass


          class ValidationError(AIEngineError):
              pass


          class StorageError(AIEngineError):
              pass


          class MigrationError(AIEngineError):
              pass


          class IntegrityError(AIEngineError):
              pass


          class EncryptionError(AIEngineError):
              pass


          class ProviderError(AIEngineError):
              pass


          class ProviderUnavailable(ProviderError):
              pass


          class ProviderTimeout(ProviderError):
              pass


          class ProviderRateLimited(ProviderError):
              pass


          class CircuitOpenError(ProviderError):
              pass


          class IdempotencyConflict(AIEngineError):
              pass


          class LeaseLostError(AIEngineError):
              pass


          class BackpressureError(AIEngineError):
              pass


          class BudgetExceededError(AIEngineError):
              pass


          class RecoveryRequiredError(AIEngineError):
              pass


          class AuditIntegrityError(IntegrityError):
              pass
          PY

          cat > shared_engines/ai/constants.py <<'PY'
