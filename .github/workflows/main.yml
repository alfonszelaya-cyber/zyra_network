      - name: Integration validation
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import tempfile
          from pathlib import Path

          from observability import (
              AlertRule,
              MetricKind,
              MetricSample,
              ObservationContext,
              ObservationManager,
              Severity,
          )

          with tempfile.TemporaryDirectory() as directory:
              storage = Path(directory) / "observability.jsonl"

              manager = ObservationManager(
                  storage_path=storage,
              )

              manager.registry.register(
                  "zyra.network",
                  kind="network",
                  metadata={
                      "layer": "network",
                      "owner": "zyra",
                  },
              )

              manager.alerts.register_rule(
                  AlertRule(
                      rule_id="integration-load",
                      name="Integration Load",
                      metric_name="integration.load",
                      threshold=90,
                      operator=">",
                      severity=Severity.CRITICAL,
                  )
              )

              manager.start()

              context = ObservationContext.create(
                  component="zyra.network",
                  operation="integration",
              )

              event = manager.engine.emit(
                  event_type="OBSERVABILITY_INTEGRATION",
                  severity=Severity.INFO,
                  message="integration validation",
                  context=context,
              )

              manager.record_event(event)

              sample = MetricSample.create(
                  name="integration.load",
                  kind=MetricKind.GAUGE,
                  value=95,
                  labels={
                      "component": "zyra.network",
                  },
              )

              alerts = manager.record_metric(sample)

              assert alerts
              assert alerts[0].state.value == "firing"
              assert storage.exists()
              assert manager.storage is not None
              assert manager.storage.count() >= 2

              manager.stop()

          print("Observability integration validation passed.")
          PY

      - name: Verify only Observability changed
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain -- apps/ | grep -q .; then
            echo "ERROR: apps/ was modified."
            git status --short -- apps/
            exit 1
          fi

          echo "Files generated under observability:"
          find observability -type f | sort

          echo
          echo "Changed files:"
          git status --short

      - name: Remove generated Python caches
        shell: bash
        run: |
          set -euo pipefail

          find observability \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find observability \
            -type f \
            \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

      - name: Commit Observability production block
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- observability/

