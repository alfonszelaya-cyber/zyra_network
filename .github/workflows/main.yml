name: Protocol - Block 03

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protocol-block-03:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p protocol
          mkdir -p protocol/messages
          mkdir -p protocol/routing
          mkdir -p protocol/sdk
          mkdir -p protocol/sessions
          mkdir -p protocol/transport
          mkdir -p protocol/validation
          mkdir -p protocol/verification
          mkdir -p protocol/encoding

      - name: Encoding
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/encoding/encoding.py <<'PY'
          from __future__ import annotations

          import json
          from collections.abc import Mapping
          from typing import Any


          class ProtocolEncoder:
              """
              Canonical JSON encoder for ZYRA protocol messages.

              The encoding is deterministic:
              - UTF-8
              - sorted object keys
              - compact separators
              - no ASCII escaping
              """

              @staticmethod
              def encode(value: Mapping[str, Any]) -> bytes:
                  if not isinstance(value, Mapping):
                      raise TypeError(
                          "Protocol payload must be a mapping"
                      )

                  try:
                      encoded = json.dumps(
                          dict(value),
                          sort_keys=True,
                          separators=(",", ":"),
                          ensure_ascii=False,
                          allow_nan=False,
                      )
                  except (TypeError, ValueError) as exc:
                      raise ValueError(
                          "Protocol payload is not JSON serializable"
                      ) from exc

                  return encoded.encode("utf-8")

              @staticmethod
              def decode(payload: bytes) -> dict[str, Any]:
                  if not isinstance(payload, bytes):
                      raise TypeError(
                          "Protocol payload must be bytes"
                      )

                  if not payload:
                      raise ValueError(
                          "Protocol payload cannot be empty"
                      )

                  try:
                      decoded = payload.decode("utf-8")
                      value = json.loads(decoded)
                  except (
                      UnicodeDecodeError,
                      json.JSONDecodeError,
                  ) as exc:
                      raise ValueError(
                          "Invalid protocol payload"
                      ) from exc

                  if not isinstance(value, dict):
                      raise ValueError(
                          "Protocol payload must decode to an object"
                      )

                  return value


          __all__ = ["ProtocolEncoder"]
          PY

          cat > protocol/encoding/__init__.py <<'PY'
          from .encoding import ProtocolEncoder

          __all__ = ["ProtocolEncoder"]
          PY

      - name: Messages
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/messages/messages.py <<'PY'
          from __future__ import annotations

          import hashlib
          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from typing import Any, Mapping
          from uuid import UUID, uuid4

          # IMPORT DIRECTO:
          # evita depender del contenido exportado por protocol.encoding.__init__
          from protocol.encoding.encoding import ProtocolEncoder


          PROTOCOL_MESSAGE_VERSION = "1"


          @dataclass(frozen=True, slots=True)
          class ProtocolMessage:
              message_id: UUID
              message_type: str
              version: str
              sender_id: str
              payload: Mapping[str, Any]
              created_at: datetime
              correlation_id: UUID | None = None
              reply_to: UUID | None = None
              headers: Mapping[str, str] = field(
                  default_factory=dict
              )

              @classmethod
              def create(
                  cls,
                  message_type: str,
                  sender_id: str,
                  payload: Mapping[str, Any],
                  *,
                  correlation_id: UUID | None = None,
                  reply_to: UUID | None = None,
                  headers: Mapping[str, str] | None = None,
              ) -> "ProtocolMessage":

                  message_type = message_type.strip()
                  sender_id = sender_id.strip()

                  if not message_type:
                      raise ValueError(
                          "message_type cannot be empty"
                      )

                  if not sender_id:
                      raise ValueError(
                          "sender_id cannot be empty"
                      )

                  if not isinstance(payload, Mapping):
                      raise TypeError(
                          "payload must be a mapping"
                      )

                  return cls(
                      message_id=uuid4(),
                      message_type=message_type,
                      version=PROTOCOL_MESSAGE_VERSION,
                      sender_id=sender_id,
                      payload=dict(payload),
                      created_at=datetime.now(timezone.utc),
                      correlation_id=correlation_id,
                      reply_to=reply_to,
                      headers=dict(headers or {}),
                  )

              def __post_init__(self) -> None:
                  if not isinstance(
                      self.message_id,
                      UUID,
                  ):
                      raise TypeError(
                          "message_id must be UUID"
                      )

                  if not self.message_type.strip():
                      raise ValueError(
                          "message_type cannot be empty"
                      )

                  if not self.version.strip():
                      raise ValueError(
                          "version cannot be empty"
                      )

                  if not self.sender_id.strip():
                      raise ValueError(
                          "sender_id cannot be empty"
                      )

                  if self.created_at.tzinfo is None:
                      raise ValueError(
                          "created_at must be timezone-aware"
                      )

                  object.__setattr__(
                      self,
                      "payload",
                      dict(self.payload),
                  )

                  object.__setattr__(
                      self,
                      "headers",
                      dict(self.headers),
                  )

              def canonical_dict(self) -> dict[str, Any]:
                  return {
                      "message_id": str(self.message_id),
                      "message_type": self.message_type,
                      "version": self.version,
                      "sender_id": self.sender_id,
                      "payload": dict(self.payload),
                      "created_at": self.created_at.astimezone(
                          timezone.utc
                      ).isoformat(),
                      "correlation_id": (
                          str(self.correlation_id)
                          if self.correlation_id is not None
                          else None
                      ),
                      "reply_to": (
                          str(self.reply_to)
                          if self.reply_to is not None
                          else None
                      ),
                      "headers": dict(
                          sorted(
                              self.headers.items()
                          )
                      ),
                  }

              def canonical_bytes(self) -> bytes:
                  return ProtocolEncoder.encode(
                      self.canonical_dict()
                  )

              def fingerprint(self) -> str:
                  return hashlib.sha256(
                      self.canonical_bytes()
                  ).hexdigest()


          class MessageFactory:

              def create(
                  self,
                  message_type: str,
                  sender_id: str,
                  payload: Mapping[str, Any],
                  *,
                  correlation_id: UUID | None = None,
                  reply_to: UUID | None = None,
                  headers: Mapping[str, str] | None = None,
              ) -> ProtocolMessage:

                  return ProtocolMessage.create(
                      message_type=message_type,
                      sender_id=sender_id,
                      payload=payload,
                      correlation_id=correlation_id,
                      reply_to=reply_to,
                      headers=headers,
                  )


          __all__ = [
              "PROTOCOL_MESSAGE_VERSION",
              "ProtocolMessage",
              "MessageFactory",
          ]
          PY

          cat > protocol/messages/__init__.py <<'PY'
          from .messages import (
              MessageFactory,
              PROTOCOL_MESSAGE_VERSION,
              ProtocolMessage,
          )

          __all__ = [
              "PROTOCOL_MESSAGE_VERSION",
              "ProtocolMessage",
              "MessageFactory",
          ]
          PY

      - name: Routing
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/routing/routing.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock


          @dataclass(frozen=True, slots=True)
          class Route:
              source: str
              destination: str
              protocol: str
              priority: int = 100
              metadata: dict[str, str] | None = None

              def __post_init__(self) -> None:
                  source = self.source.strip()
                  destination = self.destination.strip()
                  protocol = self.protocol.strip()

                  if not source:
                      raise ValueError(
                          "Route source cannot be empty"
                      )

                  if not destination:
                      raise ValueError(
                          "Route destination cannot be empty"
                      )

                  if not protocol:
                      raise ValueError(
                          "Route protocol cannot be empty"
                      )

                  if self.priority < 0:
                      raise ValueError(
                          "Route priority cannot be negative"
                      )

                  object.__setattr__(
                      self,
                      "source",
                      source,
                  )

                  object.__setattr__(
                      self,
                      "destination",
                      destination,
                  )

                  object.__setattr__(
                      self,
                      "protocol",
                      protocol,
                  )

                  object.__setattr__(
                      self,
                      "metadata",
                      dict(self.metadata or {}),
                  )


          class RouteTable:

              def __init__(self) -> None:
                  self._routes: dict[
                      tuple[str, str, str],
                      Route,
                  ] = {}

                  self._lock = RLock()

              def add(self, route: Route) -> None:
                  key = (
                      route.source,
                      route.destination,
                      route.protocol,
                  )

                  with self._lock:
                      if key in self._routes:
                          raise ValueError(
                              f"Route already exists: {key}"
                          )

                      self._routes[key] = route

              def remove(
                  self,
                  source: str,
                  destination: str,
                  protocol: str,
              ) -> bool:

                  key = (
                      source.strip(),
                      destination.strip(),
                      protocol.strip(),
                  )

                  with self._lock:
                      return (
                          self._routes.pop(
                              key,
                              None,
                          )
                          is not None
                      )

              def resolve(
                  self,
                  source: str,
                  destination: str,
                  protocol: str,
              ) -> Route:

                  key = (
                      source.strip(),
                      destination.strip(),
                      protocol.strip(),
                  )

                  with self._lock:
                      try:
                          return self._routes[key]
                      except KeyError as exc:
                          raise LookupError(
                              f"Route not found: {key}"
                          ) from exc

              def candidates(
                  self,
                  source: str,
                  destination: str,
              ) -> tuple[Route, ...]:

                  source = source.strip()
                  destination = destination.strip()

                  with self._lock:
                      matches = [
                          route
                          for route in self._routes.values()
                          if route.source == source
                          and route.destination == destination
                      ]

                  return tuple(
                      sorted(
                          matches,
                          key=lambda route: (
                              route.priority,
                              route.protocol,
                          ),
                      )
                  )

              def list(self) -> tuple[Route, ...]:
                  with self._lock:
                      return tuple(
                          sorted(
                              self._routes.values(),
                              key=lambda route: (
                                  route.priority,
                                  route.source,
                                  route.destination,
                                  route.protocol,
                              ),
                          )
                      )


          class Router:

              def __init__(
                  self,
                  table: RouteTable | None = None,
              ) -> None:

                  self.table = table or RouteTable()

              def route(
                  self,
                  source: str,
                  destination: str,
                  protocol: str,
              ) -> Route:

                  return self.table.resolve(
                      source,
                      destination,
                      protocol,
                  )


          __all__ = [
              "Route",
              "RouteTable",
              "Router",
          ]
          PY

          cat > protocol/routing/__init__.py <<'PY'
          from .routing import (
              Route,
              RouteTable,
              Router,
          )

          __all__ = [
              "Route",
              "RouteTable",
              "Router",
          ]
          PY

      - name: SDK
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/sdk/sdk.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Any, Mapping
          from uuid import UUID

          from protocol.messages.messages import ProtocolMessage


          @dataclass(frozen=True, slots=True)
          class SDKConfiguration:
              protocol_version: str = "1"
              sender_id: str = "anonymous"
              default_timeout_seconds: float = 30.0

              def __post_init__(self) -> None:
                  if not self.protocol_version.strip():
                      raise ValueError(
                          "protocol_version cannot be empty"
                      )

                  if not self.sender_id.strip():
                      raise ValueError(
                          "sender_id cannot be empty"
                      )

                  if self.default_timeout_seconds <= 0:
                      raise ValueError(
                          "default_timeout_seconds must be positive"
                      )


          class ProtocolSDK:
              """
              Stable application-facing facade
              for the protocol layer.
              """

              def __init__(
                  self,
                  configuration: SDKConfiguration | None = None,
              ) -> None:

                  self.configuration = (
                      configuration
                      or SDKConfiguration()
                  )

              def message(
                  self,
                  message_type: str,
                  payload: Mapping[str, Any],
                  *,
                  correlation_id: UUID | None = None,
                  reply_to: UUID | None = None,
                  headers: Mapping[str, str] | None = None,
              ) -> ProtocolMessage:

                  return ProtocolMessage.create(
                      message_type=message_type,
                      sender_id=(
                          self.configuration.sender_id
                      ),
                      payload=payload,
                      correlation_id=correlation_id,
                      reply_to=reply_to,
                      headers=headers,
                  )

              def identity(self) -> str:
                  return self.configuration.sender_id

              def version(self) -> str:
                  return self.configuration.protocol_version


          __all__ = [
              "SDKConfiguration",
              "ProtocolSDK",
          ]
          PY

          cat > protocol/sdk/__init__.py <<'PY'
          from .sdk import (
              ProtocolSDK,
              SDKConfiguration,
          )

          __all__ = [
              "SDKConfiguration",
              "ProtocolSDK",
          ]
          PY

      - name: Sessions
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/sessions/sessions.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime, timezone
          from enum import Enum
          from threading import RLock
          from uuid import UUID, uuid4


          class SessionState(str, Enum):
              CREATED = "created"
              ACTIVE = "active"
              CLOSED = "closed"


          @dataclass(frozen=True, slots=True)
          class ProtocolSession:
              session_id: UUID
              local_identity: str
              remote_identity: str
              state: SessionState
              created_at: datetime
              activated_at: datetime | None = None
              closed_at: datetime | None = None

              @classmethod
              def create(
                  cls,
                  local_identity: str,
                  remote_identity: str,
              ) -> "ProtocolSession":

                  local_identity = local_identity.strip()
                  remote_identity = remote_identity.strip()

                  if not local_identity:
                      raise ValueError(
                          "local_identity cannot be empty"
                      )

                  if not remote_identity:
                      raise ValueError(
                          "remote_identity cannot be empty"
                      )

                  return cls(
                      session_id=uuid4(),
                      local_identity=local_identity,
                      remote_identity=remote_identity,
                      state=SessionState.CREATED,
                      created_at=datetime.now(
                          timezone.utc
                      ),
                  )


          class SessionManager:

              def __init__(self) -> None:
                  self._sessions: dict[
                      UUID,
                      ProtocolSession,
                  ] = {}

                  self._lock = RLock()

              def create(
                  self,
                  local_identity: str,
                  remote_identity: str,
              ) -> ProtocolSession:

                  session = ProtocolSession.create(
                      local_identity,
                      remote_identity,
                  )

                  with self._lock:
                      self._sessions[
                          session.session_id
                      ] = session

                  return session

              def activate(
                  self,
                  session_id: UUID,
              ) -> ProtocolSession:

                  with self._lock:
                      session = self._get(session_id)

                      if session.state is SessionState.CLOSED:
                          raise RuntimeError(
                              "Closed session cannot be activated"
                          )

                      if session.state is SessionState.ACTIVE:
                          return session

                      updated = ProtocolSession(
                          session_id=session.session_id,
                          local_identity=session.local_identity,
                          remote_identity=session.remote_identity,
                          state=SessionState.ACTIVE,
                          created_at=session.created_at,
                          activated_at=datetime.now(
                              timezone.utc
                          ),
                          closed_at=None,
                      )

                      self._sessions[
                          session_id
                      ] = updated

                      return updated

              def close(
                  self,
                  session_id: UUID,
              ) -> ProtocolSession:

                  with self._lock:
                      session = self._get(session_id)

                      if session.state is SessionState.CLOSED:
                          return session

                      updated = ProtocolSession(
                          session_id=session.session_id,
                          local_identity=session.local_identity,
                          remote_identity=session.remote_identity,
                          state=SessionState.CLOSED,
                          created_at=session.created_at,
                          activated_at=session.activated_at,
                          closed_at=datetime.now(
                              timezone.utc
                          ),
                      )

                      self._sessions[
                          session_id
                      ] = updated

                      return updated

              def get(
                  self,
                  session_id: UUID,
              ) -> ProtocolSession:

                  with self._lock:
                      return self._get(session_id)

              def list(
                  self,
              ) -> tuple[ProtocolSession, ...]:

                  with self._lock:
                      return tuple(
                          sorted(
                              self._sessions.values(),
                              key=lambda session: (
                                  session.created_at,
                                  str(session.session_id),
                              ),
                          )
                      )

              def _get(
                  self,
                  session_id: UUID,
              ) -> ProtocolSession:

                  try:
                      return self._sessions[session_id]
                  except KeyError as exc:
                      raise LookupError(
                          f"Session not found: {session_id}"
                      ) from exc


          __all__ = [
              "SessionState",
              "ProtocolSession",
              "SessionManager",
          ]
          PY

          cat > protocol/sessions/__init__.py <<'PY'
          from .sessions import (
              ProtocolSession,
              SessionManager,
              SessionState,
          )

          __all__ = [
              "SessionState",
              "ProtocolSession",
              "SessionManager",
          ]
          PY

      - name: Transport
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/transport/transport.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from enum import Enum
          from threading import RLock
          from typing import Protocol


          class TransportState(str, Enum):
              DISCONNECTED = "disconnected"
              CONNECTED = "connected"
              CLOSED = "closed"


          @dataclass(frozen=True, slots=True)
          class TransportAddress:
              host: str
              port: int
              scheme: str = "tcp"

              def __post_init__(self) -> None:
                  host = self.host.strip()
                  scheme = self.scheme.strip().lower()

                  if not host:
                      raise ValueError(
                          "Transport host cannot be empty"
                      )

                  if not 1 <= self.port <= 65535:
                      raise ValueError(
                          "Transport port must be between "
                          "1 and 65535"
                      )

                  if not scheme:
                      raise ValueError(
                          "Transport scheme cannot be empty"
                      )

                  object.__setattr__(
                      self,
                      "host",
                      host,
                  )

                  object.__setattr__(
                      self,
                      "scheme",
                      scheme,
                  )

              def as_uri(self) -> str:
                  return (
                      f"{self.scheme}://"
                      f"{self.host}:{self.port}"
                  )


          class TransportChannel(Protocol):

              def connect(
                  self,
                  address: TransportAddress,
              ) -> None:
                  ...

              def send(
                  self,
                  payload: bytes,
              ) -> None:
                  ...

              def close(self) -> None:
                  ...


          class InMemoryTransport:

              def __init__(self) -> None:
                  self._state = (
                      TransportState.DISCONNECTED
                  )

                  self._address: (
                      TransportAddress | None
                  ) = None

                  self._frames: list[bytes] = []
                  self._lock = RLock()

              @property
              def state(self) -> TransportState:
                  with self._lock:
                      return self._state

              @property
              def address(
                  self,
              ) -> TransportAddress | None:

                  with self._lock:
                      return self._address

              def connect(
                  self,
                  address: TransportAddress,
              ) -> None:

                  with self._lock:
                      if self._state is TransportState.CLOSED:
                          raise RuntimeError(
                              "Transport is permanently closed"
                          )

                      self._address = address
                      self._state = (
                          TransportState.CONNECTED
                      )

              def send(
                  self,
                  payload: bytes,
              ) -> None:

                  if not isinstance(payload, bytes):
                      raise TypeError(
                          "Transport payload must be bytes"
                      )

                  with self._lock:
                      if (
                          self._state
                          is not TransportState.CONNECTED
                      ):
                          raise RuntimeError(
                              "Transport is not connected"
                          )

                      self._frames.append(
                          bytes(payload)
                      )

              def receive_all(
                  self,
              ) -> tuple[bytes, ...]:

                  with self._lock:
                      frames = tuple(self._frames)
                      self._frames.clear()
                      return frames

              def close(self) -> None:
                  with self._lock:
                      self._state = (
                          TransportState.CLOSED
                      )
                      self._address = None


          class TransportManager:

              def __init__(self) -> None:
                  self._channels: dict[
                      str,
                      TransportChannel,
                  ] = {}

                  self._lock = RLock()

              def register(
                  self,
                  name: str,
                  channel: TransportChannel,
              ) -> None:

                  name = name.strip()

                  if not name:
                      raise ValueError(
                          "Transport channel name "
                          "cannot be empty"
                      )

                  for method in (
                      "connect",
                      "send",
                      "close",
                  ):
                      if not callable(
                          getattr(channel, method, None)
                      ):
                          raise TypeError(
                              f"Transport channel missing "
                              f"{method}()"
                          )

                  with self._lock:
                      if name in self._channels:
                          raise ValueError(
                              f"Transport already registered: "
                              f"{name}"
                          )

                      self._channels[name] = channel

              def get(
                  self,
                  name: str,
              ) -> TransportChannel:

                  normalized = name.strip()

                  with self._lock:
                      try:
                          return self._channels[
                              normalized
                          ]
                      except KeyError as exc:
                          raise LookupError(
                              f"Transport not found: "
                              f"{normalized}"
                          ) from exc

              def unregister(
                  self,
                  name: str,
              ) -> bool:

                  with self._lock:
                      return (
                          self._channels.pop(
                              name.strip(),
                              None,
                          )
                          is not None
                      )

              def names(
                  self,
              ) -> tuple[str, ...]:

                  with self._lock:
                      return tuple(
                          sorted(
                              self._channels
                          )
                      )


          __all__ = [
              "TransportState",
              "TransportAddress",
              "TransportChannel",
              "InMemoryTransport",
              "TransportManager",
          ]
          PY

          cat > protocol/transport/__init__.py <<'PY'
          from .transport import (
              InMemoryTransport,
              TransportAddress,
              TransportChannel,
              TransportManager,
              TransportState,
          )

          __all__ = [
              "TransportState",
              "TransportAddress",
              "TransportChannel",
              "TransportManager",
              "InMemoryTransport",
          ]
          PY

      - name: Validation
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/validation/validation.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Any, Mapping


          @dataclass(frozen=True, slots=True)
          class ValidationIssue:
              field: str
              message: str


          @dataclass(frozen=True, slots=True)
          class ValidationResult:
              valid: bool
              issues: tuple[
                  ValidationIssue,
                  ...,
              ] = ()

              @classmethod
              def success(
                  cls,
              ) -> "ValidationResult":

                  return cls(
                      valid=True,
                      issues=(),
                  )

              @classmethod
              def failure(
                  cls,
                  issues: list[ValidationIssue],
              ) -> "ValidationResult":

                  return cls(
                      valid=False,
                      issues=tuple(issues),
                  )


          class ProtocolValidator:

              def validate_required(
                  self,
                  payload: Mapping[str, Any],
                  required: Mapping[str, type],
              ) -> ValidationResult:

                  issues: list[
                      ValidationIssue
                  ] = []

                  if not isinstance(
                      payload,
                      Mapping,
                  ):
                      return ValidationResult.failure(
                          [
                              ValidationIssue(
                                  field="$",
                                  message=(
                                      "payload must be "
                                      "a mapping"
                                  ),
                              )
                          ]
                      )

                  for (
                      field_name,
                      expected_type,
                  ) in required.items():

                      if field_name not in payload:
                          issues.append(
                              ValidationIssue(
                                  field=field_name,
                                  message=(
                                      "required field "
                                      "is missing"
                                  ),
                              )
                          )
                          continue

                      value = payload[field_name]

                      if expected_type is int:
                          valid_type = (
                              isinstance(value, int)
                              and not isinstance(
                                  value,
                                  bool,
                              )
                          )
                      else:
                          valid_type = isinstance(
                              value,
                              expected_type,
                          )

                      if not valid_type:
                          issues.append(
                              ValidationIssue(
                                  field=field_name,
                                  message=(
                                      "invalid type; "
                                      "expected "
                                      f"{expected_type.__name__}"
                                  ),
                              )
                          )

                  if issues:
                      return ValidationResult.failure(
                          issues
                      )

                  return ValidationResult.success()

              def validate_non_empty_strings(
                  self,
                  payload: Mapping[str, Any],
                  fields: tuple[str, ...],
              ) -> ValidationResult:

                  issues: list[
                      ValidationIssue
                  ] = []

                  if not isinstance(
                      payload,
                      Mapping,
                  ):
                      return ValidationResult.failure(
                          [
                              ValidationIssue(
                                  field="$",
                                  message=(
                                      "payload must be "
                                      "a mapping"
                                  ),
                              )
                          ]
                      )

                  for field_name in fields:

                      if field_name not in payload:
                          issues.append(
                              ValidationIssue(
                                  field=field_name,
                                  message="field is missing",
                              )
                          )
                          continue

                      value = payload[field_name]

                      if not isinstance(
                          value,
                          str,
                      ):
                          issues.append(
                              ValidationIssue(
                                  field=field_name,
                                  message=(
                                      "field must be "
                                      "a string"
                                  ),
                              )
                          )
                          continue

                      if not value.strip():
                          issues.append(
                              ValidationIssue(
                                  field=field_name,
                                  message=(
                                      "field cannot "
                                      "be empty"
                                  ),
                              )
                          )

                  if issues:
                      return ValidationResult.failure(
                          issues
                      )

                  return ValidationResult.success()


          __all__ = [
              "ValidationIssue",
              "ValidationResult",
              "ProtocolValidator",
          ]
          PY

          cat > protocol/validation/__init__.py <<'PY'
          from .validation import (
              ProtocolValidator,
              ValidationIssue,
              ValidationResult,
          )

          __all__ = [
              "ValidationIssue",
              "ValidationResult",
              "ProtocolValidator",
          ]
          PY

      - name: Verification
        shell: bash
        run: |
          set -euo pipefail

          cat > protocol/verification/verification.py <<'PY'
          from __future__ import annotations

          import hashlib
          import hmac
          from dataclasses import dataclass


          DEFAULT_DIGEST = "sha256"


          @dataclass(frozen=True, slots=True)
          class VerificationResult:
              valid: bool
              algorithm: str
              fingerprint: str


          class ProtocolVerifier:

              def __init__(
                  self,
                  algorithm: str = DEFAULT_DIGEST,
              ) -> None:

                  normalized = (
                      algorithm.strip().lower()
                  )

                  if normalized not in (
                      hashlib.algorithms_available
                  ):
                      raise ValueError(
                          f"Unsupported digest algorithm: "
                          f"{algorithm}"
                      )

                  self.algorithm = normalized

              def fingerprint(
                  self,
                  payload: bytes,
              ) -> str:

                  if not isinstance(
                      payload,
                      bytes,
                  ):
                      raise TypeError(
                          "Verification payload "
                          "must be bytes"
                      )

                  return hashlib.new(
                      self.algorithm,
                      payload,
                  ).hexdigest()

              def verify_fingerprint(
                  self,
                  payload: bytes,
                  expected: str,
              ) -> bool:

                  actual = self.fingerprint(
                      payload
                  )

                  return hmac.compare_digest(
                      actual,
                      expected.strip().lower(),
                  )

              def sign_hmac(
                  self,
                  payload: bytes,
                  secret: bytes,
              ) -> bytes:

                  if not isinstance(
                      payload,
                      bytes,
                  ):
                      raise TypeError(
                          "payload must be bytes"
                      )

                  if not isinstance(
                      secret,
                      bytes,
                  ):
                      raise TypeError(
                          "secret must be bytes"
                      )

                  if not secret:
                      raise ValueError(
                          "secret cannot be empty"
                      )

                  return hmac.new(
                      secret,
                      payload,
                      self.algorithm,
                  ).digest()

              def verify_hmac(
                  self,
                  payload: bytes,
                  secret: bytes,
                  expected: bytes,
              ) -> bool:

                  if not isinstance(
                      payload,
                      bytes,
                  ):
                      raise TypeError(
                          "payload must be bytes"
                      )

                  if not isinstance(
                      secret,
                      bytes,
                  ):
                      raise TypeError(
                          "secret must be bytes"
                      )

                  if not isinstance(
                      expected,
                      bytes,
                  ):
                      raise TypeError(
                          "expected must be bytes"
                      )

                  if not secret:
                      raise ValueError(
                          "secret cannot be empty"
                      )

                  actual = self.sign_hmac(
                      payload,
                      secret,
                  )

                  return hmac.compare_digest(
                      actual,
                      expected,
                  )

              def verify(
                  self,
                  payload: bytes,
                  expected_fingerprint: str,
              ) -> VerificationResult:

                  fingerprint = self.fingerprint(
                      payload
                  )

                  return VerificationResult(
                      valid=hmac.compare_digest(
                          fingerprint,
                          expected_fingerprint
                          .strip()
                          .lower(),
                      ),
                      algorithm=self.algorithm,
                      fingerprint=fingerprint,
                  )


          __all__ = [
              "DEFAULT_DIGEST",
              "VerificationResult",
              "ProtocolVerifier",
          ]
          PY

          cat > protocol/verification/__init__.py <<'PY'
          from .verification import (
              DEFAULT_DIGEST,
              ProtocolVerifier,
              VerificationResult,
          )

          __all__ = [
              "DEFAULT_DIGEST",
              "VerificationResult",
              "ProtocolVerifier",
          ]
          PY

