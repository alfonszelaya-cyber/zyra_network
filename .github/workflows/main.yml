          """Durable AI execution orchestrator."""

          from __future__ import annotations

          import json
          import time
          import uuid
          from decimal import Decimal
          from typing import Optional

          from .compatibility import ContractPolicy
          from .config import AIEngineConfig
          from .contracts import AIRequest, AIResponse
          from .crypto import EnvelopeCipher
          from .errors import (
              AIBudgetExceeded,
              AIIdempotencyConflict,
              AIProviderPermanentError,
              AIProviderTransientError,
              AIRecoveryRequired,
              AIRequestInFlight,
          )
          from .limiter import ExecutionLimiter
          from .observability import AIObserver, NullObserver
          from .provider_protocol import AIProvider
          from .registry import ProviderRegistry
          from .retry import RetryPolicy
          from .serialization import canonical_bytes, sha256_hex
          from .storage import SQLiteAIStore


          class AIEngine:
              """Production-oriented durable AI engine."""

              def __init__(
                  self,
                  config: AIEngineConfig,
                  registry: ProviderRegistry,
                  store: SQLiteAIStore,
                  cipher: EnvelopeCipher,
                  observer: Optional[AIObserver] = None,
              ) -> None:
                  config.validate()

                  self._config = config
                  self._registry = registry
                  self._store = store
                  self._cipher = cipher
                  self._observer = observer or NullObserver()
                  self._limiter = ExecutionLimiter(
                      config.max_concurrency,
                      config.max_queue,
                  )
                  self._retry = RetryPolicy(
                      config.retry_base_seconds,
                      config.retry_max_seconds,
                  )
                  self._contracts = ContractPolicy()

                  self._contracts.validate()

              def execute(self, request: AIRequest) -> AIResponse:
                  request.validate()

                  self._contracts.require_readable(
                      request.model.contract_version
                  )

                  request_hash = self._request_hash(request)

                  self._limiter.acquire(
                      request.deadline_seconds
                  )

                  try:
                      return self._execute(
                          request,
                          request_hash,
                      )
                  finally:
                      self._limiter.release()

              def _execute(
                  self,
                  request: AIRequest,
                  request_hash: str,
              ) -> AIResponse:
                  completed = self._store.get_completed(
                      request.idempotency_key
                  )

                  if completed is not None:
                      encrypted, stored_hash = completed

                      if stored_hash != request_hash:
                          raise AIIdempotencyConflict(
                              "stored request hash mismatch"
                          )

                      return self._decode_response(
                          encrypted,
                          request_hash,
                      )

                  owner = uuid.uuid4().hex

                  encrypted_request = self._cipher.encrypt(
                      canonical_bytes(
                          {
                              "request_id": request.request_id,
                              "idempotency_key": request.idempotency_key,
                              "provider": request.model.provider,
                              "model": request.model.model,
                              "revision": request.model.revision,
                              "payload": request.payload,
                          }
                      ),
                      request_hash.encode("ascii"),
                  )

                  lease = self._store.reserve(
                      request.request_id,
                      request.idempotency_key,
                      request_hash,
                      encrypted_request,
                      request.model.provider,
                      request.model.model,
                      owner,
                      self._config.lease_seconds,
                  )

                  if not lease.token:
                      completed = self._store.get_completed(
                          request.idempotency_key
                      )

                      if completed is None:
                          raise AIRecoveryRequired(
                              "completed result disappeared"
                          )

                      encrypted, stored_hash = completed

                      if stored_hash != request_hash:
                          raise AIIdempotencyConflict(
                              "stored request hash mismatch"
                          )

                      return self._decode_response(
                          encrypted,
                          request_hash,
                      )

                  provider: AIProvider = self._registry.provider(
                      request.model.provider
                  )

                  deadline = (
                      time.monotonic()
                      + request.deadline_seconds
                  )

                  last_error: Optional[Exception] = None

                  for attempt in range(
                      1,
                      request.max_attempts + 1,
                  ):
                      if time.monotonic() >= deadline:
                          break

                      try:
                          result = provider.execute(
                              request,
                              {
                                  "X-Zyra-Request": request.request_id,
                              },
                          )

                          result.response.validate()

                          if result.response.cost > request.cost_limit:
                              raise AIBudgetExceeded(
                                  "cost limit exceeded"
                              )

                          response_payload = canonical_bytes(
                              {
                                  "request_id": (
                                      result.response.request_id
                                  ),
                                  "provider_request_id": (
                                      result.response.provider_request_id
                                  ),
                                  "output": result.response.output,
                                  "usage": result.response.usage,
                                  "cost": str(result.response.cost),
                                  "contract_version": (
                                      result.response.contract_version
                                  ),
                              }
                          )

                          encrypted_response = self._cipher.encrypt(
                              response_payload,
                              request_hash.encode("ascii"),
                          )

                          self._store.complete(
                              request.request_id,
                              owner,
                              lease.token,
                              encrypted_response,
                              response_payload.decode("utf-8"),
                              sha256_hex(response_payload),
                          )

                          self._observer.emit(
                              "ai.execution.completed",
                              {
                                  "request_id": request.request_id,
                                  "provider": request.model.provider,
                                  "model": request.model.model,
                                  "attempt": attempt,
                              },
                          )

                          return result.response

                      except AIProviderTransientError as exc:
                          last_error = exc

                          if attempt < request.max_attempts:
                              self._retry.sleep_if_possible(
                                  attempt,
                                  deadline,
                              )

                      except AIProviderPermanentError as exc:
                          self._store.fail(
                              request.request_id,
                              owner,
                              lease.token,
                              str(exc),
                          )
                          raise

                      except AIBudgetExceeded as exc:
                          self._store.fail(
                              request.request_id,
                              owner,
                              lease.token,
                              str(exc),
                          )
                          raise

                      except Exception as exc:
                          self._observer.emit(
                              "ai.execution.recovery_required",
                              {
                                  "request_id": request.request_id,
                                  "error_type": type(exc).__name__,
                              },
                          )

                          raise AIRecoveryRequired(
                              "execution outcome is uncertain"
                          ) from exc

                  message = (
                      str(last_error)
                      if last_error is not None
                      else "execution deadline exhausted"
                  )

                  self._store.fail(
                      request.request_id,
                      owner,
                      lease.token,
                      message,
                  )

                  raise AIProviderTransientError(message)

              @staticmethod
              def _request_hash(request: AIRequest) -> str:
                  return sha256_hex(
                      {
                          "contract_version": (
                              request.model.contract_version
                          ),
                          "provider": request.model.provider,
                          "model": request.model.model,
                          "revision": request.model.revision,
                          "payload": request.payload,
                      }
                  )

              def _decode_response(
                  self,
                  encrypted: str,
                  request_hash: str,
              ) -> AIResponse:
                  raw = self._cipher.decrypt(
                      encrypted,
                      request_hash.encode("ascii"),
                  )

                  decoded = json.loads(
                      raw.decode("utf-8")
                  )

                  response = AIResponse(
                      request_id=decoded["request_id"],
                      provider_request_id=(
                          decoded["provider_request_id"]
                      ),
                      output=decoded["output"],
                      usage=decoded["usage"],
                      cost=Decimal(decoded["cost"]),
                      contract_version=decoded["contract_version"],
                  )

                  response.validate()
                  return response
