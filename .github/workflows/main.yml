name: ZYRA - Build Foundation IDs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-ids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production ID engine
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p foundation/ids

          cat > foundation/ids/__init__.py <<'PY'
          """
          ZYRA Foundation - Universal Identity/ID primitives.

          This package provides immutable, sortable, cryptographically strong
          identifiers used throughout the ZYRA Network.
          """

          from .generator import generate_id
          from .identifier import Identifier
          from .namespace import Namespace

          __all__ = [
              "Identifier",
              "Namespace",
              "generate_id",
          ]
          PY

          cat > foundation/ids/identifier.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          import re
          from uuid import UUID

          _ID_RE = re.compile(
              r"^zyra_[a-z0-9][a-z0-9_-]{0,63}_"
              r"[0-9a-f]{32}$"
          )


          @dataclass(frozen=True, slots=True)
          class Identifier:
              """
              Canonical ZYRA identifier.

              Format:
                  zyra_<namespace>_<128-bit-hex-value>

              The identifier is immutable and safe to serialize as text.
              """

              value: str

              def __post_init__(self) -> None:
                  if not isinstance(self.value, str):
                      raise TypeError("Identifier value must be a string")

                  if not _ID_RE.fullmatch(self.value):
                      raise ValueError(
                          "Invalid ZYRA identifier format"
                      )

              @property
              def namespace(self) -> str:
                  parts = self.value.split("_", 2)
                  return parts[1]

              @property
              def raw_uuid(self) -> UUID:
                  return UUID(self.value.rsplit("_", 1)[1])

              def __str__(self) -> str:
                  return self.value

              def __repr__(self) -> str:
                  return f"Identifier({self.value!r})"

              def to_dict(self) -> dict[str, str]:
                  return {
                      "id": self.value,
                      "namespace": self.namespace,
                  }
          PY

          cat > foundation/ids/namespace.py <<'PY'
          from __future__ import annotations

          from enum import StrEnum


          class Namespace(StrEnum):
              """
              Reserved universal namespaces for ZYRA identifiers.

              Applications may use their own namespace without changing
              the identifier implementation.
              """

              NETWORK = "network"
              NODE = "node"
              PERSON = "person"
              COMPANY = "company"
              GOVERNMENT = "government"
              AI = "ai"
              DEVICE = "device"
              DOCUMENT = "document"
              CONTRACT = "contract"
              VEHICLE = "vehicle"
              PROPERTY = "property"
              ASSET = "asset"
              TRANSACTION = "transaction"
              EVENT = "event"
              SESSION = "session"
              CREDENTIAL = "credential"
              CERTIFICATE = "certificate"
              SHIPMENT = "shipment"
              LOCATION = "location"
              WORKFLOW = "workflow"
          PY

          cat > foundation/ids/generator.py <<'PY'
          from __future__ import annotations

          import secrets

          from .identifier import Identifier
          from .namespace import Namespace


          def generate_id(
              namespace: Namespace | str,
          ) -> Identifier:
              """
              Generate a cryptographically strong 128-bit identifier.

              secrets.token_hex() uses the operating system's secure
              randomness source and is appropriate for identifiers where
              unpredictability is required.
              """

              if isinstance(namespace, Namespace):
                  namespace_value = namespace.value
              elif isinstance(namespace, str):
                  namespace_value = namespace.strip().lower()
              else:
                  raise TypeError(
                      "namespace must be Namespace or string"
                  )

              if not namespace_value:
                  raise ValueError("namespace cannot be empty")

              if len(namespace_value) > 64:
                  raise ValueError(
                      "namespace cannot exceed 64 characters"
                  )

              if not namespace_value[0].isalnum():
                  raise ValueError(
                      "namespace must start with an alphanumeric character"
                  )

              for char in namespace_value:
                  if not (
                      char.isalnum()
                      or char in {"-", "_"}
                  ):
                      raise ValueError(
                          "namespace contains invalid characters"
                      )

              value = (
                  f"zyra_{namespace_value}_"
                  f"{secrets.token_hex(16)}"
              )

              return Identifier(value)
          PY

          cat > foundation/ids/validation.py <<'PY'
          from __future__ import annotations

          from .identifier import Identifier


          def is_valid_identifier(value: str) -> bool:
              """Return True when value is a valid ZYRA identifier."""
              try:
                  Identifier(value)
                  return True
              except (TypeError, ValueError):
                  return False


          def require_identifier(
              value: str | Identifier,
          ) -> Identifier:
              """
              Normalize an identifier and fail immediately when invalid.
              """
              if isinstance(value, Identifier):
                  return value

              return Identifier(value)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from foundation.ids import (
              Identifier,
              Namespace,
              generate_id,
          )
          from foundation.ids.validation import (
              is_valid_identifier,
              require_identifier,
          )

          identifier = generate_id(Namespace.NETWORK)

          assert isinstance(identifier, Identifier)
          assert identifier.namespace == "network"
          assert is_valid_identifier(str(identifier))
          assert require_identifier(str(identifier)) == identifier

          print(identifier)
          print("FOUNDATION IDS: OK")
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ZYRA Network"
          git config user.email "actions@users.noreply.github.com"

          git add foundation/ids

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "feat: production foundation universal identifiers"
          git push
