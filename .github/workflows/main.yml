      - name: Production integration
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from observability import (
              EventType,
              HealthResult,
              HealthState,
              MetricKind,
              ObservationContext,
              ObservationPolicy,
              ObservabilityAPI,
              ObservabilityManager,
              Severity,
          )

          policy = ObservationPolicy(
              retention_seconds=3600,
              max_events=1000,
              max_metrics=1000,
              max_metric_series=100,
              max_samples_per_series=100,
              max_queue_size=100,
              max_alerts=100,
              max_incidents=100,
          )

          manager = ObservabilityManager(
              policy=policy
          )

          manager.start()

          assert manager.state.value == "ready"

          context = ObservationContext.create(
              service="zyra",
              component="production-test",
              environment="production",
          )

          child = context.child(
              operation="contract-test"
          )

          assert child.trace_id == context.trace_id
          assert child.parent_span_id == context.span_id
          assert child.span_id != context.span_id
          assert (
              child.correlation_id
              == context.correlation_id
          )

          event = manager.emit(
              name="observability.contract.test",
              message="production contract test",
              severity=Severity.INFO,
              event_type=EventType.SYSTEM,
              context=child,
          )

          assert event.event_id.startswith("evt_")

          counter = manager.counter(
              "zyra_observability_events_total",
              1,
              labels={
                  "environment": "production"
              },
          )

          gauge = manager.gauge(
              "zyra_observability_health",
              1,
          )

          histogram = manager.histogram(
              "zyra_observability_latency_ms",
              12.5,
              unit="ms",
          )

          timer = manager.timer(
              "zyra_observability_operation_seconds",
              0.0125,
          )

          assert counter.kind == MetricKind.COUNTER
          assert gauge.kind == MetricKind.GAUGE
          assert histogram.kind == MetricKind.HISTOGRAM
          assert timer.kind == MetricKind.TIMER

          manager.health_check(
              "observability",
              lambda: HealthResult(
                  component="observability",
                  state=HealthState.HEALTHY,
                  latency_ms=0.0,
                  message="ok",
              ),
          )

          results = manager.run_health()

          assert len(results) == 1
          assert (
              results[0].state
              == HealthState.HEALTHY
          )

          status = manager.status()

          assert status["state"] == "healthy"
          assert status["storage"]["events"] >= 1
          assert status["storage"]["metrics"] >= 4

          events = manager.query.events(
              limit=100
          )

          assert len(events) >= 1

          metrics = manager.query.metrics(
              limit=100
          )

          assert len(metrics) >= 4

          snapshot = manager.snapshot()

          assert snapshot.snapshot_id.startswith(
              "snapshot_"
          )

          assert len(snapshot.components) >= 1
          assert len(snapshot.metrics) >= 4

          report = manager.report()

          assert report["components"] >= 1

          api = ObservabilityAPI(manager)

          assert api.status()["state"] == "healthy"

          manager.stop()

          assert manager.state.value == "stopped"

          print(
              "Production integration: PASS"
          )
          PY

      - name: Alert and incident contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from observability import (
              AlertRule,
              IncidentState,
              MetricKind,
              MetricRegistry,
              Severity,
          )
          from observability.core import (
              AlertManager,
              IncidentManager,
          )

          metrics = MetricRegistry(
              max_series=10,
              max_samples_per_series=10,
          )

          alerts = AlertManager(
              max_alerts=10
          )

          incidents = IncidentManager(
              max_incidents=10
          )

          alerts.register(
              AlertRule(
                  name="high_value",
                  severity=Severity.CRITICAL,
                  condition=lambda signal: (
                      getattr(signal, "value", 0) > 90
                  ),
                  cooldown_seconds=0,
              )
          )

          sample = metrics.gauge(
              "test.value",
              100,
          )

          fired = alerts.evaluate(sample)

          assert len(fired) == 1
          assert fired[0].severity == (
              Severity.CRITICAL
          )

          incident = incidents.open_from_alert(
              fired[0]
          )

          assert incident.state == (
              IncidentState.OPEN
          )

          acknowledged = incidents.acknowledge(
              incident.incident_id
          )

          assert acknowledged.state == (
              IncidentState.ACKNOWLEDGED
          )

          resolved = incidents.resolve(
              incident.incident_id
          )

          assert resolved.state == (
              IncidentState.RESOLVED
          )

          print(
              "Alert/incident contract: PASS"
          )
          PY

