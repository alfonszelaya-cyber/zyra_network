          from __future__ import annotations

          import random
          import threading
          import time
          from dataclasses import dataclass

          from .errors import (
              CircuitOpenError,
              ProviderRateLimited,
              ProviderTimeout,
              ProviderUnavailable,
          )


          @dataclass(slots=True)
          class _Circuit:
              failures: int = 0
              opened_at: float | None = None
              half_open: bool = False


          class CircuitBreaker:
              def __init__(
                  self,
                  failure_threshold: int,
                  recovery_seconds: float,
              ) -> None:
                  self.failure_threshold = failure_threshold
                  self.recovery_seconds = recovery_seconds
                  self._states: dict[str, _Circuit] = {}
                  self._lock = threading.Lock()

              def allow(self, provider: str) -> bool:
                  with self._lock:
                      state = self._states.setdefault(provider, _Circuit())

                      if state.opened_at is None:
                          return True

                      if (
                          time.monotonic() - state.opened_at
                          >= self.recovery_seconds
                      ):
                          if state.half_open:
                              return False
                          state.half_open = True
                          return True

                      return False

              def before_call(self, provider: str) -> None:
                  if not self.allow(provider):
                      raise CircuitOpenError(
                          f"circuit open for provider {provider}"
                      )

              def success(self, provider: str) -> None:
                  with self._lock:
                      self._states[provider] = _Circuit()

              def failure(self, provider: str) -> None:
                  with self._lock:
                      state = self._states.setdefault(provider, _Circuit())
                      state.failures += 1
                      state.half_open = False
                      if state.failures >= self.failure_threshold:
                          state.opened_at = time.monotonic()


          class RetryPolicy:
              def __init__(
                  self,
                  attempts: int,
                  base_seconds: float,
              ) -> None:
                  self.attempts = attempts
                  self.base_seconds = base_seconds

              def execute(self, operation):
                  last_error = None

                  for attempt in range(self.attempts):
                      try:
                          return operation()
                      except (
                          ProviderUnavailable,
                          ProviderTimeout,
                          ProviderRateLimited,
                      ) as exc:
                          last_error = exc
                          if attempt + 1 >= self.attempts:
                              break

                          delay = self.base_seconds * (2 ** attempt)
                          delay *= random.uniform(0.75, 1.25)
                          time.sleep(min(delay, 10.0))

                  if last_error is not None:
                      raise last_error

                  raise RuntimeError("retry operation produced no result")
          PY

