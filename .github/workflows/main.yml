                  self,
                  attributes: dict,
              ) -> dict:
                  result = {}

                  for key, value in list(
                      attributes.items()
                  )[: self.max_attributes]:

                      result[str(key)[:256]] = str(
                          value
                      )[: self.max_attribute_length]

                  return result


