name: Foundation - Types Version Shared Kernel Lifecycle Loaders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-core-6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p foundation/types
          mkdir -p foundation/version
          mkdir -p foundation/shared
          mkdir -p foundation/kernel
          mkdir -p foundation/lifecycle
          mkdir -p foundation/loaders

      - name: Create foundation types
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/types/types.py <<'PY'
          from __future__ import annotations

          from typing import NewType, TypeAlias

          NodeId = NewType("NodeId", str)
          ComponentId = NewType("ComponentId", str)
          CorrelationId = NewType("CorrelationId", str)
          RegistryId = NewType("RegistryId", str)
          EventName = NewType("EventName", str)

          JSONPrimitive: TypeAlias = str | int | float | bool | None
          JSONValue: TypeAlias = JSONPrimitive | list["JSONValue"] | dict[str, "JSONValue"]

          __all__ = [
              "NodeId",
              "ComponentId",
              "CorrelationId",
              "RegistryId",
              "EventName",
              "JSONPrimitive",
              "JSONValue",
          ]
          PY

          cat > foundation/types/__init__.py <<'PY'
          from .types import (
              ComponentId,
              CorrelationId,
              EventName,
              JSONPrimitive,
              JSONValue,
              NodeId,
              RegistryId,
          )

          __all__ = [
              "NodeId",
              "ComponentId",
              "CorrelationId",
              "RegistryId",
              "EventName",
              "JSONPrimitive",
              "JSONValue",
          ]
          PY

      - name: Create foundation version
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/version/version.py <<'PY'
          from __future__ import annotations

          import re
          from dataclasses import dataclass


          _SEMVER = re.compile(
              r"^(0|[1-9]\d*)\."
              r"(0|[1-9]\d*)\."
              r"(0|[1-9]\d*)"
              r"(?:-[0-9A-Za-z.-]+)?"
              r"(?:\+[0-9A-Za-z.-]+)?$"
          )


          @dataclass(frozen=True, order=True, slots=True)
          class Version:
              major: int
              minor: int
              patch: int

              def __post_init__(self) -> None:
                  if min(self.major, self.minor, self.patch) < 0:
                      raise ValueError("Version components cannot be negative")

              @classmethod
              def parse(cls, value: str) -> "Version":
                  match = _SEMVER.match(value.strip())

                  if not match:
                      raise ValueError(f"Invalid semantic version: {value}")

                  return cls(
                      int(match.group(1)),
                      int(match.group(2)),
                      int(match.group(3)),
                  )

              def __str__(self) -> str:
                  return f"{self.major}.{self.minor}.{self.patch}"


          NETWORK_VERSION = Version(1, 0, 0)

          __all__ = ["Version", "NETWORK_VERSION"]
          PY

          cat > foundation/version/__init__.py <<'PY'
          from .version import NETWORK_VERSION, Version

          __all__ = ["Version", "NETWORK_VERSION"]
          PY

      - name: Create foundation shared
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/shared/shared.py <<'PY'
          from __future__ import annotations

          from collections.abc import Iterator, Mapping
          from contextlib import contextmanager
          from threading import RLock
          from typing import Any


          class SharedContext:
              """Thread-safe key/value context for explicitly shared foundation data."""

              def __init__(
                  self,
                  initial: Mapping[str, Any] | None = None,
              ) -> None:
                  self._values: dict[str, Any] = dict(initial or {})
                  self._lock = RLock()

              def set(self, key: str, value: Any) -> None:
                  normalized = key.strip()

                  if not normalized:
                      raise ValueError("Shared context key cannot be empty")

                  with self._lock:
                      self._values[normalized] = value

              def get(self, key: str, default: Any = None) -> Any:
                  with self._lock:
                      return self._values.get(key, default)

              def require(self, key: str) -> Any:
                  with self._lock:
                      if key not in self._values:
                          raise KeyError(key)
                      return self._values[key]

              def remove(self, key: str) -> Any:
                  with self._lock:
                      return self._values.pop(key)

              def contains(self, key: str) -> bool:
                  with self._lock:
                      return key in self._values

              def snapshot(self) -> dict[str, Any]:
                  with self._lock:
                      return dict(self._values)

              def __len__(self) -> int:
                  with self._lock:
                      return len(self._values)

              def __iter__(self) -> Iterator[str]:
                  return iter(self.snapshot())


          @contextmanager
          def temporary_value(
              context: SharedContext,
              key: str,
              value: Any,
          ):
              marker = object()
              previous = context.get(key, marker)
              context.set(key, value)

              try:
                  yield context
              finally:
                  if previous is marker:
                      try:
                          context.remove(key)
                      except KeyError:
                          pass
                  else:
                      context.set(key, previous)


          __all__ = ["SharedContext", "temporary_value"]
          PY

          cat > foundation/shared/__init__.py <<'PY'
          from .shared import SharedContext, temporary_value

          __all__ = ["SharedContext", "temporary_value"]
          PY

      - name: Create foundation kernel
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/kernel/kernel.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from threading import RLock
          from typing import Any


          @dataclass(frozen=True, slots=True)
          class KernelStatus:
              initialized: bool
              running: bool


          class FoundationKernel:
              """Minimal deterministic kernel boundary for foundation services."""

              def __init__(self) -> None:
                  self._initialized = False
                  self._running = False
                  self._services: dict[str, Any] = {}
                  self._lock = RLock()

              def initialize(self) -> None:
                  with self._lock:
                      if self._initialized:
                          return
                      self._initialized = True

              def start(self) -> None:
                  with self._lock:
                      if not self._initialized:
                          raise RuntimeError(
                              "Kernel must be initialized before start"
                          )
                      self._running = True

              def stop(self) -> None:
                  with self._lock:
                      self._running = False

              def register_service(self, name: str, service: Any) -> None:
                  normalized = name.strip()

                  if not normalized:
                      raise ValueError("Service name cannot be empty")

                  if service is None:
                      raise ValueError("Service cannot be None")

                  with self._lock:
                      if normalized in self._services:
                          raise ValueError(
                              f"Service already registered: {normalized}"
                          )
                      self._services[normalized] = service

              def get_service(self, name: str) -> Any:
                  with self._lock:
                      return self._services[name.strip()]

              def status(self) -> KernelStatus:
                  with self._lock:
                      return KernelStatus(
                          initialized=self._initialized,
                          running=self._running,
                      )


          __all__ = ["FoundationKernel", "KernelStatus"]
          PY

          cat > foundation/kernel/__init__.py <<'PY'
          from .kernel import FoundationKernel, KernelStatus

          __all__ = ["FoundationKernel", "KernelStatus"]
          PY

      - name: Create foundation lifecycle
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/lifecycle/lifecycle.py <<'PY'
          from __future__ import annotations

          from enum import Enum
          from threading import RLock


          class LifecycleState(str, Enum):
              CREATED = "created"
              INITIALIZED = "initialized"
              RUNNING = "running"
              STOPPED = "stopped"


          class LifecycleManager:
              """Controlled lifecycle state machine for foundation components."""

              _TRANSITIONS = {
                  LifecycleState.CREATED: {LifecycleState.INITIALIZED},
                  LifecycleState.INITIALIZED: {
                      LifecycleState.RUNNING,
                      LifecycleState.STOPPED,
                  },
                  LifecycleState.RUNNING: {LifecycleState.STOPPED},
                  LifecycleState.STOPPED: set(),
              }

              def __init__(self) -> None:
                  self._state = LifecycleState.CREATED
                  self._lock = RLock()

              @property
              def state(self) -> LifecycleState:
                  with self._lock:
                      return self._state

              def transition(self, target: LifecycleState) -> None:
                  with self._lock:
                      if target not in self._TRANSITIONS[self._state]:
                          raise RuntimeError(
                              f"Invalid lifecycle transition: "
                              f"{self._state.value} -> {target.value}"
                          )

                      self._state = target

              def initialize(self) -> None:
                  self.transition(LifecycleState.INITIALIZED)

              def start(self) -> None:
                  self.transition(LifecycleState.RUNNING)

              def stop(self) -> None:
                  self.transition(LifecycleState.STOPPED)


          __all__ = ["LifecycleState", "LifecycleManager"]
          PY

          cat > foundation/lifecycle/__init__.py <<'PY'
          from .lifecycle import LifecycleManager, LifecycleState

          __all__ = ["LifecycleManager", "LifecycleState"]
          PY

      - name: Create foundation loaders
        shell: bash
        run: |
          set -euo pipefail

          cat > foundation/loaders/loaders.py <<'PY'
          from __future__ import annotations

          import importlib
          from collections.abc import Iterable


          class LoaderError(RuntimeError):
              """Raised when a foundation component cannot be loaded."""


          class ComponentLoader:
              """Explicit import loader with deterministic failure reporting."""

              def load_module(self, module_name: str):
                  normalized = module_name.strip()

                  if not normalized:
                      raise LoaderError("Module name cannot be empty")

                  try:
                      return importlib.import_module(normalized)
                  except (ImportError, ModuleNotFoundError) as exc:
                      raise LoaderError(
                          f"Unable to load module: {normalized}"
                      ) from exc

              def load_modules(
                  self,
                  module_names: Iterable[str],
              ) -> dict[str, object]:
                  loaded: dict[str, object] = {}

                  for name in module_names:
                      normalized = name.strip()

                      if normalized in loaded:
                          continue

                      loaded[normalized] = self.load_module(normalized)

                  return loaded


          __all__ = ["ComponentLoader", "LoaderError"]
          PY

          cat > foundation/loaders/__init__.py <<'PY'
          from .loaders import ComponentLoader, LoaderError

          __all__ = ["ComponentLoader", "LoaderError"]
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            foundation/types \
            foundation/version \
            foundation/shared \
            foundation/kernel \
            foundation/lifecycle \
            foundation/loaders

          python - <<'PY'
          from foundation.types import ComponentId, NodeId
          from foundation.version import NETWORK_VERSION, Version
          from foundation.shared import SharedContext
          from foundation.kernel import FoundationKernel
          from foundation.lifecycle import LifecycleManager
          from foundation.loaders import ComponentLoader

          assert NodeId("node-1") == "node-1"
          assert ComponentId("component-1") == "component-1"

          assert str(Version.parse("1.2.3")) == "1.2.3"
          assert NETWORK_VERSION == Version(1, 0, 0)

          context = SharedContext()
          context.set("key", "value")
          assert context.require("key") == "value"

          kernel = FoundationKernel()
          kernel.initialize()
          kernel.start()
          assert kernel.status().running is True
          kernel.stop()

          lifecycle = LifecycleManager()
          lifecycle.initialize()
          lifecycle.start()
          lifecycle.stop()

          loader = ComponentLoader()
          module = loader.load_module("foundation.types")
          assert module is not None

          print("Foundation block 2 validation: OK")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            foundation/types \
            foundation/version \
            foundation/shared \
            foundation/kernel \
            foundation/lifecycle \
            foundation/loaders

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Complete foundation types version shared kernel lifecycle loaders"
          git push
