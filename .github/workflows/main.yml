          class SQLiteAIStore:
              """
              Crash-safe durable AI journal.

              Database responsibilities:

              - idempotency
              - request ownership leases
              - encrypted request/response storage
              - recovery state
              - transactional completion
              - outbox
              - tamper-evident audit chain
              - schema migration
              """

              SCHEMA_VERSION = 1

              def __init__(
                  self,
