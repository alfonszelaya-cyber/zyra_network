# ============================================================
# ZYRA REV E v9 - parche del nucleo del registro ZID (todo-o-nada)
#
# Arregla los 4 problemas reportados en el telefono:
#   1) NOMBRES: acepta 1 o 2 nombres y 1 o 2 apellidos (Jose Zelaya,
#      Jose Alfonso Zelaya, Zelaya Mira, Jose Alfonso Zelaya Mira...).
#      Solo rebota si el nombre de verdad no es de la persona.
#   2) LINEA VERDE: ahora DETECTA el documento de verdad (las esquinas
#      verdes siguen al documento y avisa si esta lejos o muy pegado).
#   3) BIOMETRIA: OVALO de rostro; si tu cara no esta centrada dentro
#      del ovalo, NO deja capturar. Sigue comparando con la foto del
#      documento (0.60) y 3 intentos.
#   4) FOTOS: nunca se pierden y el envio final es filtro: si falta
#      algo te regresa SOLO al paso que falta; nunca mas el error
#      "Falta el documento frontal" al final. Ademas mete las fotos
#      en el formulario antes de enviarlas al servidor.
#
# COMO USAR:
#   1) GitHub > Add file > Upload files y sube ESTE archivo tal cual a
#      .github/workflows/zyra-fix-biometrics.yml (reemplaza el anterior).
#   2) Actions > ZYRA fix biometricos REV E > Run workflow.
#   3) Verde = publicado (Render despliega en 1-2 min).
#   4) Si algo falla, pega el Resumen (Summary) del run en el chat.
#
# Si el archivo llega con UN caracter danado, el run lo REPARA solo
# verificando por SHA y publica igual. Si el dano es mayor, no publica
# nada y dice el motivo exacto (regla todo-o-nada).
# ============================================================
