          add('')
          add('## F2. Red con proveedor facial cargado: sonda enroll')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
