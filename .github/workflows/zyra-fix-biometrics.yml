name: ZYRA A2c portada del laboratorio con repr seguro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseA2c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias minimas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography

      - name: Portada del laboratorio via repr
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          LAB = ROOT / 'apps' / 'laboratorio'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseA2c.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO - archivo restaurado')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _manejador

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def pedir(url):
              try:
                  with urllib.request.urlopen(url, timeout=8) as r:
                      return r.status, r.headers.get('Content-Type', ''), \
                             r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, '', str(e)

          PORTADA = (
              '<!doctype html><html lang="es"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<title>LABORATORIO</title>'
              '<style>body{font-family:system-ui,sans-serif;background:#0d1117;'
              'color:#e6edf3;max-width:720px;margin:0 auto;padding:24px 16px}'
              '.mod{background:#161b22;border:1px solid #30363d;'
              'border-radius:10px;padding:12px 14px;margin:8px 0}'
              '.mut{color:#8b949e}</style></head><body>'
              '<div id="lab-portada"></div>'
              '<h1>LABORATORIO</h1>'
              '<p class="mut">Experimentos, simulaciones y proyecciones'
              ' dentro de ZYRA Network.</p>'
              '<div class="mod">Captura</div>'
              '<div class="mod">Creacion y Diseno</div>'
              '<div class="mod">Exportar y Biblioteca</div>'
              '<div class="mod">Presentar y Proyeccion</div>'
              '<div class="mod">Renderizar y Simulacion</div>'
              '<div class="mod">Comprension y Mundo 4D</div>'
              '<p class="mut">ZYRA Network</p>'
              '</body></html>'
          )

          add('# A2c - PORTADA DEL LABORATORIO (repr seguro, sin escapes manuales)')
          add('')

          add('## D1. Localizacion del handler del indice')
          add('')
          hits = []
          for p in LAB.rglob('*.py'):
              partes = p.parts
              if '.git' in partes or '__pycache__' in partes or 'tests' in partes:
                  continue
              try:
                  if p.stat().st_size == 0:
                      continue
              except OSError:
                  continue
              t = txt(p)
              for m in re.finditer(r'activo dentro de', t, re.I):
                  ln = t.count('\n', 0, m.start()) + 1
                  hits.append({'archivo': str(p.relative_to(ROOT)), 'linea': ln,
                               'texto': t.splitlines()[ln - 1].strip()[:150]})
          archivos = sorted(set(h['archivo'] for h in hits))
          add('- Coincidencias: %d en %d archivo(s)' % (len(hits), len(archivos)))
          for h in hits:
              add('  - %s:%d' % (h['archivo'], h['linea']))
              add('    `%s`' % h['texto'])
          if len(archivos) != 1:
              add('')
              add('- **NO UNIVOCO: nada editado.** Registros de rutas como contexto:')
              for p in LAB.rglob('*.py'):
                  if '.git' in p.parts or '__pycache__' in p.parts:
                      continue
                  try:
                      if p.stat().st_size == 0:
                          continue
                  except OSError:
                      continue
                  for i, ln in enumerate(txt(p).splitlines()):
                      if 'registrar(' in ln and '/laboratorio' in ln:
                          add('  - %s:%d: %s' % (p.relative_to(ROOT), i + 1,
                              ln.strip()[:140]))
              gate('handler_unico', False)
              DATA['hits'] = hits
              Path('faseA2c.json').write_text(
                  json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
                  encoding='utf-8')
              escribe()
              raise SystemExit('HANDLER NO IDENTIFICADO - sin cambios')
          archivo = ROOT / archivos[0]
          i_hit = hits[0]['linea'] - 1
          gate('handler_unico', True)
          add('')

          original = archivo.read_bytes()
          texto = original.decode('utf-8')
          lineas = texto.splitlines()

          def revertir():
              try:
                  archivo.write_bytes(original)
              except Exception:
                  pass

          add('## D2. Contexto del handler (antes de editar)')
          add('')
          ini_ctx = max(0, i_hit - 25)
          fin_ctx = min(len(lineas), i_hit + 10)
          add('```python')
          for i in range(ini_ctx, fin_ctx):
              add('%d: %s' % (i + 1, lineas[i].rstrip()[:150]))
          add('```')
          add('')

          i_def = None
          for j in range(i_hit, -1, -1):
              if re.match(r'^\s*def\s+\w+\s*\(', lineas[j]):
                  i_def = j
                  break
          ind_def = len(lineas[i_def]) - len(lineas[i_def].lstrip())
          ind_hit = len(lineas[i_hit]) - len(lineas[i_hit].lstrip())
          add('## D3. Validacion de estructura')
          add('')
          add('- def contenedor: linea %d | indent def=%d hit=%d' % (
              i_def + 1, ind_def, ind_hit))
          estructura_ok = (i_def is not None) and (ind_hit > ind_def)
          gate('estructura_valida', estructura_ok)
          add('')

          ya = 'lab-portada' in texto
          editado = False
          if estructura_ok and not ya:
              add('## D4. Insercion (via repr, cero escapes manuales)')
              add('')
              ind = ' ' * ind_hit
              literal = repr(PORTADA)
              INS = [
                  ind + 'html_portada = (',
                  ind + '    ' + literal,
                  ind + ')',
                  ind + 'return 200, html_portada.encode("utf-8"), '
                        '{"Content-Type": "text/html; charset=utf-8"}',
              ]
              nuevo = '\n'.join(lineas[:i_def + 1] + INS + lineas[i_def + 1:]) + '\n'
              archivo.write_text(nuevo, encoding='utf-8')
              editado = True
              add('- Portada insertada en linea %d.' % (i_def + 2))
              gate('insercion_aplicada', True)
          elif ya:
              add('## D4. Ya aplicado antes (idempotente).')
              gate('insercion_aplicada', True)
          else:
              add('## D4. Estructura invalida: nada insertado.')
              gate('insercion_aplicada', False)
          add('')

          add('## D5. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(archivo), doraise=True)
              add('- py_compile: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## D6. Arranque real del sistema')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN,
                      'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-a2c',
                      'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-a2c',
                      'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _c, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sproc = None
          sp_vivo = False
          apps = []
          if vivo:
              sproc = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT),
                                       env=env, stdout=subprocess.DEVNULL,
                                       stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sproc.poll() is not None:
                      break
                  st, _c, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      sp_vivo = True
                      try:
                          apps = list(json.loads(cuerpo).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red: %s | superapp: %s | apps: %d' % (vivo, sp_vivo, len(apps)))
          gate('sistema_arriba', vivo and sp_vivo and len(apps) == 8)
          add('')

          add('## D7. Comportamiento verificado')
          add('')
          if sp_vivo:
              for nombre, url in (('con_barra', BSP + '/laboratorio/'),
                                  ('sin_barra', BSP + '/laboratorio')):
                  st, ct, cuerpo = pedir(url)
                  ok = (st == 200 and 'text/html' in ct.lower()
                        and 'lab-portada' in cuerpo)
                  add('- %s: GET %s -> %s %s | %s' % (nombre, url.replace(BSP, ''),
                      st, ct[:25], 'OK' if ok else 'FALLO'))
                  gate('portada_' + nombre, ok)
              st, ct, cuerpo = pedir(BSP + '/laboratorio/ui')
              guard = (st == 401 and 'zid' in cuerpo.lower())
              add('- panel intacto: GET /laboratorio/ui -> %s | %s'
                  % (st, 'OK' if guard else 'FALLO'))
              gate('resto_del_app_intacto', guard)
          else:
              gate('portada_con_barra', False)
              gate('portada_sin_barra', False)
              gate('resto_del_app_intacto', False)
          add('')

          criticos = ('handler_unico', 'estructura_valida', 'insercion_aplicada',
                      'compila', 'sistema_arriba', 'portada_con_barra',
                      'portada_sin_barra', 'resto_del_app_intacto')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos) and not ya:
              revertir()
              add('## REVERSION APLICADA - archivo restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p in (sproc, proc):
              try:
                  if p and p.poll() is None:
                      p.terminate()
                      p.wait(timeout=10)
              except Exception:
                  try:
                      p.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**PORTADA VERIFICADA CON SISTEMA REAL. Commit.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseA2c.json').write_text(
              json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
              encoding='utf-8')
          escribe()
          print('A2c terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A apps/laboratorio
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(laboratorio): portada HTML en la raiz en lugar de catalogo JSON"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios que commitear" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseA2c-zyra
          path: faseA2c.json
          if-no-files-found: ignore
