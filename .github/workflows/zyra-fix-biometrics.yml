name: ZYRA AXIS Block 9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write ops_server.py
        run: |
          cat > apps/axis/life_history/ops_server.py <<'OEOF'
          """AXIS ops server: justice & security screens.

          Standalone additive HTTP surface on its own port.
          Zero modification of existing server.py.

          Routes:
            GET  /ops/justicia   case form
            POST /ops/justicia   open case (chained to life)
            GET  /ops/seguridad  incident form
            POST /ops/seguridad  report incident (chained)
          """
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import ClassVar
          from urllib.parse import urlparse

          from apps.axis.life_history.justice_service import (
              JusticeLifeService,
          )
          from apps.axis.life_history.security_service import (
              SecurityLifeService,
          )

          _CSS = (
              "body{font-family:system-ui;"
              "background:#0d1117;color:#e6edf3;"
              "padding:20px;margin:0}"
              ".card{background:#161b22;border:1px"
              " solid #30363d;border-radius:10px;"
              "padding:14px;margin-top:10px}"
              "input{width:100%;box-sizing:border-box;"
              "background:#0d1117;color:#e6edf3;"
              "border:1px solid #30363d;"
              "border-radius:6px;padding:8px;"
              "margin:4px 0}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px;"
              "border-radius:8px;width:100%;"
              "margin-top:6px}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html><head>"
                  "<meta charset='utf-8'>"
                  f"<title>{title}</title>"
                  f"<style>{_CSS}</style></head>"
                  f"<body>{body}</body></html>"
              )


          class OpsHandler(BaseHTTPRequestHandler):
              store: ClassVar[object] = None
              life: ClassVar[object] = None

              def log_message(
                  self, fmt, *args,
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  path = urlparse(
                      self.path
                  ).path
                  if path == "/ops/justicia":
                      self._form_justicia()
                      return
                  if path == "/ops/seguridad":
                      self._form_seguridad()
                      return
                  self._html(
                      404,
                      _page(
                          "404",
                          "<h1>No encontrado</h1>",
                      ),
                  )

              def do_POST(self) -> None:
                  path = urlparse(
                      self.path
                  ).path
                  doc = self._form()
                  if path == "/ops/justicia":
                      self._case(doc)
                      return
                  if path == "/ops/seguridad":
                      self._incident(doc)
                      return
                  self._html(
                      404,
                      _page(
                          "404",
                          "<h1>No encontrado</h1>",
                      ),
                  )

              def _form_justicia(self) -> None:
                  body = (
                      "<h1>JUSTICIA</h1>"
                      "<div class='card'>"
                      "<form method='POST'"
                      " action='/ops/justicia'>"
                      "<input name='client_account'"
                      " placeholder='ID cliente'>"
                      "<input name='lawyer_account'"
                      " placeholder='Mi ID abogado'>"
                      "<input name='detail'"
                      " placeholder='Detalle'>"
                      "<button>Registrar caso"
                      "</button>"
                      "</form></div>"
                      "<a href='/ops/seguridad'>"
                      "Seguridad</a>"
                  )
                  self._html(
                      200,
                      _page(
                          "AXIS - Justicia",
                          body,
                      ),
                  )

              def _form_seguridad(self) -> None:
                  body = (
                      "<h1>SEGURIDAD</h1>"
                      "<div class='card'>"
                      "<form method='POST'"
                      " action='/ops/seguridad'>"
                      "<input name='police_account'"
                      " placeholder='Mi ID policia'>"
                      "<input name='subject_account'"
                      " placeholder='ID sujeto'>"
                      "<input name='description'"
                      " placeholder='Descripcion'>"
                      "<button>Reportar incidente"
                      "</button>"
                      "</form></div>"
                      "<a href='/ops/justicia'>"
                      "Justicia</a>"
                  )
                  self._html(
                      200,
                      _page(
                          "AXIS - Seguridad",
                          body,
                      ),
                  )

              def _case(self, doc) -> None:
                  justice = JusticeLifeService(
                      store=type(self).store,
                      life=type(self).life,
                  )
                  case_id = (
                      "CASE-"
                      + uuid.uuid4().hex[:10]
                  )
                  opened = justice.open_case(
                      case_id=case_id,
                      client_account=self._req(
                          doc, "client_account"
                      ),
                      lawyer_account=self._req(
                          doc, "lawyer_account"
                      ),
                      detail=self._req(
                          doc, "detail"
                      ),
                      stage="denuncia",
                  )
                  chained = (
                      "SI"
                      if opened["life_chained"]
                      else "NO"
                  )
                  body = (
                      "<h1>Caso "
                      + case_id
                      + "</h1><p>Encadenado: "
                      + chained
                      + "</p><a href='/ops/justicia'>"
                      "Volver</a>"
                  )
                  self._html(
                      200,
                      _page("AXIS - Caso", body),
                  )

              def _incident(self, doc) -> None:
                  security = SecurityLifeService(
                      store=type(self).store,
                      life=type(self).life,
                  )
                  incident_id = (
                      "INC-"
                      + uuid.uuid4().hex[:10]
                  )
                  subject = doc.get(
                      "subject_account"
                  )
                  subject = (
                      str(subject).strip()
                      if subject
                      and str(subject).strip()
                      else None
                  )
                  reported = (
                      security.report_incident(
                          incident_id=incident_id,
                          police_account=(
                              self._req(
                                  doc,
                                  "police_account",
                              )
                          ),
                          description=self._req(
                              doc,
                              "description",
                          ),
                          subject_account=subject,
                      )
                  )
                  chained = (
                      "SI"
                      if reported["life_chained"]
                      else "NO"
                  )
                  body = (
                      "<h1>Incidente "
                      + incident_id
                      + "</h1><p>Encadenado: "
                      + chained
                      + "</p><a href='/ops/seguridad'>"
                      "Volver</a>"
                  )
                  self._html(
                      200,
                      _page(
                          "AXIS - Incidente",
                          body,
                      ),
                  )

              def _form(self) -> dict:
                  length = self.headers.get(
                      "Content-Length"
                  )
                  raw = self.rfile.read(
                      int(length)
                  ).decode("utf-8")
                  doc: dict = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          k, v = pair.split(
                              "=", 1
                          )
                          doc[k] = v.replace(
                              "+", " "
                          )
                  return doc

              @staticmethod
              def _req(
                  doc: dict, key: str,
              ) -> str:
                  value = doc.get(key)
                  if (
                      not isinstance(value, str)
                      or not value.strip()
                  ):
                      raise ValueError(
                          "missing: " + key
                      )
                  return value

              def _html(
                  self,
                  status: int,
                  html: str,
              ) -> None:
                  body = html.encode("utf-8")
                  self.send_response(status)
                  self.send_header(
                      "Content-Type",
                      "text/html; charset=utf-8",
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body)),
                  )
                  self.end_headers()
                  self.wfile.write(body)


          class OpsServer(ThreadingHTTPServer):
              daemon_threads = True
              allow_reuse_address = True

              def __init__(
                  self, address,
              ) -> None:
                  super().__init__(
                      address, OpsHandler
                  )

              @property
              def bound_port(self) -> int:
                  return int(
                      self.server_address[1]
                  )


          def serve_ops(
              store,
              life,
              *,
              host: str = "127.0.0.1",
              port: int = 0,
          ) -> OpsServer:
              OpsHandler.store = store
              OpsHandler.life = life
              return OpsServer((host, port))
          OEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/ops_server.py').read()); print('ops_server OK')"

      - name: Write ops E2E test
        run: |
          cat > apps/axis/life_history/tests/test_ops_server.py <<'TEOF'
          """Ops server E2E over real HTTP."""
          from __future__ import annotations

          import threading
          import unittest
          from urllib.request import (
              Request,
              urlopen,
          )

          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore,
          )
          from apps.axis.life_history.ops_server import (
              serve_ops,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )

          _SUBJECT = "ZID-subject-ops"
          _MOTHER = "ZID-mother-ops"


          class _FakeNetwork:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid in (_SUBJECT, _MOTHER):
                      return (
                          True,
                          {"status": "ACTIVE"},
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-o"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return (False, None, "unknown")


          class OpsServerE2E(unittest.TestCase):
              def test_justice_and_security(self) -> None:
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )
                  from shared_engines.storage.database import (
                      SQLiteAdapter,
                  )

                  db = SQLiteAdapter(":memory:")
                  clock = SystemClock()
                  life = LifeHistoryService(
                      store=LifeHistoryStore(
                          db, clock
                      ),
                      client=_FakeNetwork(),
                  )
                  birth = (
                      life.register_birth_with_network(
                          registrar_account=(
                              "AX-reg-1"
                          ),
                          child_name="Sujeto Ops",
                          birth_date="1990-06-01",
                          birth_place="San Salvador",
                          sex="M",
                          mother_name="Madre Ops",
                          mother_zid=_MOTHER,
                      )
                  )
                  person_id = str(
                      birth["person_id"]
                  )
                  life.attach_zid_with_audit(
                      person_id,
                      zid=_SUBJECT,
                      actor="biometric-enroll",
                  )
                  store = AxisStore(db, clock)
                  store.add_account(
                      account_id="AX-cli-o",
                      zid=_SUBJECT,
                      name="Sujeto Ops",
                      role="paciente",
                  )
                  store.add_account(
                      account_id="AX-law-o",
                      zid=None,
                      name="Abogado O",
                      role="abogado",
                  )
                  store.add_account(
                      account_id="AX-pol-o",
                      zid=None,
                      name="Agente O",
                      role="policia",
                  )
                  server = serve_ops(
                      store, life
                  )
                  thread = threading.Thread(
                      target=server.serve_forever,
                      daemon=True,
                  )
                  thread.start()
                  base = (
                      "http://127.0.0.1:"
                      + str(server.bound_port)
                  )

                  def pf(path, doc):
                      req = Request(
                          base + path,
                          data=(
                              "&".join(
                                  str(k)
                                  + "="
                                  + str(v)
                                  for k, v in doc.items()
                              )
                          ).encode("utf-8"),
                          method="POST",
                      )
                      with urlopen(
                          req, timeout=10
                      ) as r:
                          return r.read().decode(
                              "utf-8"
                          )

                  def h(path):
                      with urlopen(
                          base + path,
                          timeout=10,
                      ) as r:
                          return r.read().decode(
                              "utf-8"
                          )

                  try:
                      self.assertIn(
                          "JUSTICIA",
                          h("/ops/justicia"),
                      )
                      self.assertIn(
                          "SEGURIDAD",
                          h("/ops/seguridad"),
                      )
                      case_html = pf(
                          "/ops/justicia",
                          {
                              "client_account": "AX-cli-o",
                              "lawyer_account": "AX-law-o",
                              "detail": "robo",
                          },
                      )
                      self.assertIn(
                          "Caso", case_html
                      )
                      types = [
                          e["event_type"]
                          for e in life._store.events_of(
                              person_id
                          )
                      ]
                      self.assertIn(
                          "justice_case", types
                      )
                      inc_html = pf(
                          "/ops/seguridad",
                          {
                              "police_account": "AX-pol-o",
                              "subject_account": "AX-cli-o",
                              "description": "robo",
                          },
                      )
                      self.assertIn(
                          "Incidente", inc_html
                      )
                      types = [
                          e["event_type"]
                          for e in life._store.events_of(
                              person_id
                          )
                      ]
                      self.assertIn(
                          "security_incident",
                          types,
                      )
                      self.assertTrue(
                          life._store.events_verify(
                              person_id
                          )
                      )
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          TEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_ops_server.py').read()); print('test OK')"

      - name: 1/3 Ops server E2E
        run: python -m apps.axis.life_history.tests.test_ops_server -v

      - name: 2/3 Life History regression
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q
          python -m apps.axis.life_history.tests.test_justice_service -q
          python -m apps.axis.life_history.tests.test_security_service -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "axis: standalone ops server for justice and security screens + E2E"
            git push
          fi
