name: "ZYRA SEMILLA SM9 calidad+seguridad final (RBAC 6 roles + proteccion menores + idempotencia) — CIERRE SEMILLA"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] datetime timezone-aware + idempotencia"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              out("## Migracion datetime timezone-aware (idempotente)")
              migrados = 0
              saltados = 0
              for base in ("apps/semilla/domain",
                           "apps/semilla/application",
                           "apps/semilla/services"):
                  bp = pathlib.Path(base)
                  if not bp.exists():
                      continue
                  for p in sorted(bp.rglob("*.py")):
                      try:
                          txt = p.read_text(encoding="utf-8")
                      except Exception:
                          continue
                      if "datetime.utcnow()" not in txt:
                          continue
                      stripped = [ln.strip() for ln in
                                  txt.split("\n")]
                      caso_a = ("from datetime import datetime"
                                in stripped)
                      caso_b = "import datetime" in stripped
                      if not (caso_a or caso_b):
                          saltados = saltados + 1
                          continue
                      new = txt
                      if caso_b:
                          new = new.replace(
                              "datetime.datetime.utcnow()",
                              "datetime.datetime.now("
                              "datetime.timezone.utc)")
                      new = new.replace("datetime.utcnow()",
                                        "datetime.now(timezone.utc)")
                      if caso_a and not caso_b:
                          lines = new.split("\n")
                          lines = [(ln.replace(
                              "from datetime import datetime",
                              "from datetime import datetime,"
                              " timezone")
                              if ln.strip()
                              == "from datetime import datetime"
                              else ln) for ln in lines]
                          new = "\n".join(lines)
                      try:
                          ast.parse(new)
                      except Exception:
                          saltados = saltados + 1
                          continue
                      p.write_text(new, encoding="utf-8")
                      py_compile.compile(str(p), doraise=True)
                      migrados = migrados + 1
              out("- **migrados: " + str(migrados)
                  + " | saltados: " + str(saltados) + "**")

              forzar("apps/semilla/domain/security/idempotency_engine.py",
                     D(r'''
                  """Idempotency Engine SEMILLA (SM9). claim/
                  complete/replay/forget con TTL. Evita doble
                  ejecucion de operaciones criticas (pagos,
                  certificaciones, desembolsos)."""
                  from __future__ import annotations
                  import json as _j
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_idempotency", (
                          "CREATE TABLE IF NOT EXISTS sm_idempotency (idem_key TEXT NOT NULL, scope TEXT NOT NULL DEFAULT 'default', result_json TEXT NOT NULL DEFAULT '{}', created_at REAL NOT NULL, PRIMARY KEY(idem_key, scope))",
                      )),
                  )

                  class IdempotencyEngine:
                      """Idempotencia por (key, scope) con TTL."""

                      def __init__(self, db, clock,
                                   ttl_seconds=86400):
                          self._db = db
                          self._clock = clock
                          self._ttl = int(ttl_seconds)
                          MigrationRunner(db, "sm.idem",
                                          _MIGRATIONS).run(clock)

                      def claim(self, *, key,
                                scope="default") -> dict:
                          now = self._clock.now()
                          row = self._db.query_one(
                              "SELECT * FROM sm_idempotency WHERE"
                              " idem_key = ? AND scope = ?",
                              (key, scope))
                          if row is not None:
                              age = (now
                                     - float(row["created_at"]))
                              if age <= self._ttl:
                                  return {"first": False,
                                          "result": _j.loads(
                                              str(row["result_json"]))}
                              self._db.execute(
                                  "DELETE FROM sm_idempotency"
                                  " WHERE idem_key = ? AND"
                                  " scope = ?", (key, scope))
                          return {"first": True, "result": None}

                      def complete(self, *, key,
                                   scope="default",
                                   result=None) -> dict:
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_idempotency"
                                  " (idem_key, scope,"
                                  " result_json, created_at)"
                                  " VALUES (?, ?, ?, ?)"
                                  " ON CONFLICT(idem_key, scope)"
                                  " DO UPDATE SET result_json ="
                                  " excluded.result_json,"
                                  " created_at ="
                                  " excluded.created_at",
                                  (key, scope,
                                   _j.dumps(result or {},
                                            default=str), now))
                          return {"key": key, "scope": scope,
                                  "stored": True}

                      def forget(self, *, key,
                                 scope="default") -> dict:
                          self._db.execute(
                              "DELETE FROM sm_idempotency"
                              " WHERE idem_key = ? AND scope = ?",
                              (key, scope))
                          return {"key": key, "scope": scope,
                                  "forgotten": True}
              '''))
              out("## FIN builder 1")
          except Exception:
              out("## BUILDER 1 ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] RBAC 6 roles + proteccion menores + auditoria de accesos"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          SEC = "apps/semilla/domain/security"

          try:
              forzar(SEC + "/rbac_engine.py", D(r'''
                  """RBAC Engine SEMILLA - 6 roles (SM9, SE-3).
                  STUDENT/PARENT/TEACHER/DIRECTOR/GOVERNMENT/COMPANY
                  con permisos por accion. Asignacion persistente y
                  verificacion can()."""
                  from __future__ import annotations
                  from typing import Dict, List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  ROLES = ("STUDENT", "PARENT", "TEACHER",
                           "DIRECTOR", "GOVERNMENT", "COMPANY")

                  PERMISSIONS = {
                      "STUDENT": ("READ_OWN", "USE_TUTOR",
                                  "VIEW_OWN_GRADES",
                                  "APPLY_SCHOLARSHIP"),
                      "PARENT": ("READ_CHILD", "VIEW_CHILD_GRADES",
                                 "GRANT_CONSENT", "PAY_FEES",
                                 "VIEW_ALERTS"),
                      "TEACHER": ("READ_STUDENT", "WRITE_GRADES",
                                  "TAKE_ATTENDANCE",
                                  "REPORT_INCIDENT",
                                  "VIEW_INSIGHTS"),
                      "DIRECTOR": ("READ_STUDENT", "WRITE_GRADES",
                                   "TAKE_ATTENDANCE",
                                   "REPORT_INCIDENT",
                                   "MANAGE_SCHOOL",
                                   "ENROLL_STUDENT",
                                   "VIEW_INSIGHTS",
                                   "VERIFY_INSTITUTION"),
                      "GOVERNMENT": ("VIEW_NATIONAL",
                                     "SUPERVISE_SCHOOL",
                                     "READ_AGGREGATE",
                                     "VERIFY_MINED"),
                      "COMPANY": ("VIEW_ANON_OFFERS",),
                  }

                  _MIGRATIONS = (
                      Migration(1, "sm_rbac_assignments", (
                          "CREATE TABLE IF NOT EXISTS sm_rbac_assignments (assignment_id TEXT PRIMARY KEY, actor TEXT NOT NULL, role TEXT NOT NULL, institution_id TEXT NOT NULL DEFAULT '', student_scope TEXT NOT NULL DEFAULT '', active INTEGER NOT NULL DEFAULT 1, created_at REAL NOT NULL)",
                      )),
                  )

                  class RbacEngine:
                      """Roles y permisos SEMILLA (persistente)."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.rbac",
                                          _MIGRATIONS).run(clock)

                      def assign(self, *, actor, role,
                                 institution_id="",
                                 student_scope="") -> dict:
                          if role not in ROLES:
                              raise ValueError(
                                  "rol invalido: " + str(role))
                          aid = "SMRB-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_rbac_assignments"
                                  " (assignment_id, actor, role,"
                                  " institution_id, student_scope,"
                                  " active, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, 1, ?)",
                                  (aid, str(actor), role,
                                   str(institution_id),
                                   str(student_scope), now))
                          return self.get_assignment(aid)

                      def get_assignment(self, assignment_id
                                         ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_rbac_assignments"
                              " WHERE assignment_id = ?",
                              (assignment_id,))
                          if not row:
                              return None
                          return {"assignment_id":
                                      str(row["assignment_id"]),
                                  "actor": str(row["actor"]),
                                  "role": str(row["role"]),
                                  "institution_id":
                                      str(row["institution_id"]),
                                  "student_scope":
                                      str(row["student_scope"]),
                                  "active": bool(row["active"])}

                      def revoke(self, assignment_id) -> dict:
                          self._db.execute(
                              "UPDATE sm_rbac_assignments SET"
                              " active = 0 WHERE assignment_id"
                              " = ?", (assignment_id,))
                          return self.get_assignment(
                              assignment_id)

                      def role_of(self, actor) -> Optional[str]:
                          row = self._db.query_one(
                              "SELECT role FROM"
                              " sm_rbac_assignments WHERE"
                              " actor = ? AND active = 1 ORDER BY"
                              " rowid DESC LIMIT 1", (actor,))
                          return (str(row["role"])
                                  if row else None)

                      def can(self, *, actor, action) -> dict:
                          role = self.role_of(actor)
                          if role is None:
                              return {"allowed": False,
                                      "reason": "sin rol asignado"}
                          perms = PERMISSIONS.get(role, ())
                          if action not in perms:
                              return {"allowed": False,
                                      "reason": ("rol " + role
                                                 + " no puede "
                                                 + action)}
                          return {"allowed": True,
                                  "reason": "ok",
                                  "role": role}
              '''))

              forzar(SEC + "/access_audit_engine.py", D(r'''
                  """Access Audit Engine - auditoria de accesos a
                  datos de estudiantes (SM9). Quien accedio a que
                  dato de quien, cuando y con que resultado."""
                  from __future__ import annotations
                  from typing import List
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_data_access_audit", (
                          "CREATE TABLE IF NOT EXISTS sm_data_access_audit (audit_id TEXT PRIMARY KEY, actor TEXT NOT NULL, action TEXT NOT NULL, student_id TEXT NOT NULL, data_scope TEXT NOT NULL DEFAULT '', allowed INTEGER NOT NULL, detail TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                      )),
                  )

                  class AccessAuditEngine:
                      """Auditoria de acceso a datos (persistente)."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.accessaudit",
                                          _MIGRATIONS).run(clock)

                      def record(self, *, actor, action,
                                 student_id, allowed,
                                 data_scope="", detail="") -> dict:
                          aid = "SMAAU-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO"
                                  " sm_data_access_audit"
                                  " (audit_id, actor, action,"
                                  " student_id, data_scope, allowed,"
                                  " detail, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                                  (aid, str(actor), str(action),
                                   student_id, str(data_scope),
                                   1 if allowed else 0,
                                   str(detail), now))
                          return {"audit_id": aid,
                                  "actor": str(actor),
                                  "allowed": bool(allowed)}

                      def history_of(self, student_id,
                                     limit=200) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT * FROM"
                              " sm_data_access_audit WHERE"
                              " student_id = ? ORDER BY rowid"
                              " DESC LIMIT ?", (student_id, limit))
                          return [{"audit_id":
                                       str(r["audit_id"]),
                                   "actor": str(r["actor"]),
                                   "action": str(r["action"]),
                                   "allowed": bool(r["allowed"]),
                                   "created_at":
                                       float(r["created_at"])}
                                  for r in rows]
              '''))

              forzar(SEC + "/child_data_protection_engine.py", D(r'''
                  """Child Data Protection Engine - proteccion de
                  datos de menores (SM9, SE-3). Reglas:
                  1. Operaciones SENSIBLES sobre un menor requieren
                     consentimiento parental VIGENTE (FamilyEngine
                     inyectado — check_consent).
                  2. TODO acceso a datos queda auditado (AccessAudit
                     inyectado) — permitido o denegado.
                  3. Minimizacion: los campos entregados se filtran
                     por rol (DIRECTOR/TEACHER ven academicos,
                     PARENT ve todo lo de su hijo, GOVERNMENT ve
                     agregados). Fail-closed: sin familia inyectada,
                     las operaciones sensibles se DENIEGAN."""
                  from __future__ import annotations
                  from typing import Dict

                  SENSITIVE_ACTIONS = ("VIEW_BIOMETRIC",
                                       "EXPORT_FULL_RECORD",
                                       "SHARE_EXTERNAL")

                  FIELD_POLICY = {
                      "STUDENT": ("full_name", "level", "grade",
                                  "average"),
                      "PARENT": ("full_name", "level", "grade",
                                 "average", "attendance_pct",
                                 "tutores", "emergency_contacts"),
                      "TEACHER": ("full_name", "level", "grade",
                                  "average", "attendance_pct"),
                      "DIRECTOR": ("full_name", "level", "grade",
                                   "average", "attendance_pct",
                                   "tutores", "authorized_pickup"),
                      "GOVERNMENT": ("level", "grade",
                                     "average_agg"),
                  }

                  class ChildDataProtectionEngine:
                      """Proteccion de datos de menores (fail-closed)."""

                      def __init__(self, rbac_engine,
                                   family_engine=None,
                                   audit_engine=None):
                          self._rbac = rbac_engine
                          self._family = family_engine
                          self._audit = audit_engine

                      def request_sensitive(self, *, actor,
                                            student_id, action,
                                            consent_type=
                                            "DATA_PROCESSING",
                                            consent_granted=None
                                            ) -> Dict:
                          """Operacion sensible: RBAC + consent
                          parental vigente + auditoria. Fail-closed."""
                          check = self._rbac.can(
                              actor=actor, action="READ_STUDENT")
                          allowed = False
                          reason = check["reason"]
                          role = check.get("role")
                          if check["allowed"]:
                              if (self._family is not None
                                      and consent_granted is None):
                                  consent_granted = (self._family.
                                                     check_consent(
                                                         student_id,
                                                         consent_type))
                              if consent_granted is True:
                                  allowed = True
                                  reason = "consentimiento vigente"
                              else:
                                  reason = ("requiere consentimiento"
                                            " parental vigente ("
                                            + consent_type + ")")
                          if self._audit is not None:
                              self._audit.record(
                                  actor=actor, action=action,
                                  student_id=student_id,
                                  allowed=allowed,
                                  data_scope="SENSITIVE",
                                  detail=reason)
                          return {"actor": actor,
                                  "student_id": student_id,
                                  "action": action,
                                  "allowed": allowed,
                                  "reason": reason}

                      def filtered_profile(self, *, actor,
                                           student_id,
                                           profile) -> Dict:
                          """Minimizacion: filtra campos segun el rol
                          del solicitante. Audita el acceso."""
                          check = self._rbac.can(
                              actor=actor, action="READ_STUDENT")
                          allowed = check["allowed"]
                          if not allowed:
                              allowed = (self._rbac.can(
                                  actor=actor,
                                  action="READ_OWN")["allowed"]
                                  and actor.endswith(
                                      student_id[-4:]))
                          role = self._rbac.role_of(actor)
                          if self._audit is not None:
                              self._audit.record(
                                  actor=actor, action="READ_PROFILE",
                                  student_id=student_id,
                                  allowed=allowed,
                                  data_scope="PROFILE",
                                  detail="rol=" + str(role))
                          if not allowed:
                              return {"allowed": False,
                                      "reason": check["reason"]}
                          fields = FIELD_POLICY.get(role, ())
                          out = {"allowed": True,
                                 "student_id": student_id}
                          for f in fields:
                              if f in profile:
                                  out[f] = profile[f]
                          out["fields_shared"] = len(
                              [k for k in out
                               if k not in ("allowed",
                                            "student_id")])
                          return out
              '''))

              out("## FIN builder 2")
          except Exception:
              out("## BUILDER 2 ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] SM9 tests"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_sm9_seguridad.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.security.idempotency_engine import IdempotencyEngine
          from apps.semilla.domain.security.rbac_engine import RbacEngine
          from apps.semilla.domain.security.access_audit_engine import AccessAuditEngine
          from apps.semilla.domain.security.child_data_protection_engine import ChildDataProtectionEngine
          from apps.semilla.domain.family.family_engine import FamilyEngine

          def test_idempotencia_claim_complete_replay(tmp_path) -> None:
              eng = IdempotencyEngine(
                  SQLiteAdapter(tmp_path / "idem.db"), FrozenClock())
              c1 = eng.claim(key="cert-1", scope="certificacion")
              assert c1["first"] is True
              eng.complete(key="cert-1", scope="certificacion",
                           result={"credential": "CRD-1"})
              c2 = eng.claim(key="cert-1", scope="certificacion")
              assert c2["first"] is False
              assert c2["result"] == {"credential": "CRD-1"}
              assert eng.claim(key="cert-2",
                               scope="certificacion")["first"] is True
              eng.forget(key="cert-1", scope="certificacion")
              assert eng.claim(key="cert-1",
                               scope="certificacion")["first"] is True
              print("OK idempotencia: claim/complete/replay/forget")

          def test_rbac_6_roles_permisos(tmp_path) -> None:
              rb = RbacEngine(SQLiteAdapter(tmp_path / "rb.db"),
                              FrozenClock())
              rb.assign(actor="maestro1", role="TEACHER",
                        institution_id="INST-1")
              rb.assign(actor="papa1", role="PARENT",
                        student_scope="STU-1")
              rb.assign(actor="director1", role="DIRECTOR",
                        institution_id="INST-1")
              rb.assign(actor="ministro", role="GOVERNMENT")
              rb.assign(actor="alumno1", role="STUDENT")
              r1 = rb.can(actor="maestro1", action="WRITE_GRADES")
              assert r1["allowed"] is True
              r2 = rb.can(actor="papa1", action="WRITE_GRADES")
              assert r2["allowed"] is False
              r3 = rb.can(actor="papa1", action="GRANT_CONSENT")
              assert r3["allowed"] is True
              r4 = rb.can(actor="alumno1", action="WRITE_GRADES")
              assert r4["allowed"] is False
              r5 = rb.can(actor="ministro", action="VIEW_NATIONAL")
              assert r5["allowed"] is True
              r6 = rb.can(actor="nadie", action="READ_STUDENT")
              assert r6["allowed"] is False
              with pytest.raises(ValueError):
                  rb.assign(actor="x", role="HACKER")
              print("OK RBAC: 6 roles, maestro escribe notas, padre consiente, gobierno ve nacional, sin rol denegado")

          def test_proteccion_menores_consentimiento_fail_closed(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "cp.db")
              clock = FrozenClock()
              rb = RbacEngine(db, clock)
              fa = FamilyEngine(db, clock)
              au = AccessAuditEngine(db, clock)
              cp = ChildDataProtectionEngine(rbac_engine=rb,
                  family_engine=fa, audit_engine=au)
              rb.assign(actor="TEA-1", role="TEACHER")
              rb.assign(actor="DIR-1", role="DIRECTOR")
              r1 = cp.request_sensitive(actor="TEA-1",
                  student_id="STU-M", action="EXPORT_FULL_RECORD")
              assert r1["allowed"] is False
              assert "consentimiento" in r1["reason"]
              fa.grant_consent(student_id="STU-M",
                  consent_type="DATA_PROCESSING",
                  granted_by="PADRE")
              r2 = cp.request_sensitive(actor="TEA-1",
                  student_id="STU-M", action="EXPORT_FULL_RECORD")
              assert r2["allowed"] is True
              r3 = cp.request_sensitive(actor="DIR-1",
                  student_id="STU-M", action="SHARE_EXTERNAL",
                  consent_type="PHOTOS")
              assert r3["allowed"] is False
              hist = au.history_of("STU-M")
              assert len(hist) == 3
              assert all("allowed" in h for h in hist)
              print("OK proteccion menores: fail-closed sin consentimiento + permitido con consentimiento + 3 accesos auditados")

          def test_minimizacion_por_rol(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "mm.db")
              clock = FrozenClock()
              rb = RbacEngine(db, clock)
              fa = FamilyEngine(db, clock)
              au = AccessAuditEngine(db, clock)
              cp = ChildDataProtectionEngine(rbac_engine=rb,
                  family_engine=fa, audit_engine=au)
              rb.assign(actor="TEA-1", role="TEACHER")
              rb.assign(actor="PAP-1", role="PARENT")
              rb.assign(actor="EMP-1", role="COMPANY")
              profile = {"full_name": "Ana", "level": "BASICA",
                  "grade": "3", "average": "8.50",
                  "attendance_pct": "95.00",
                  "tutores": [{"name": "Padre"}],
                  "emergency_contacts": [{"phone": "911"}]}
              v1 = cp.filtered_profile(actor="TEA-1",
                  student_id="STU-1", profile=profile)
              assert v1["allowed"] is True
              assert "full_name" in v1
              assert "tutores" not in v1
              assert "emergency_contacts" not in v1
              v2 = cp.filtered_profile(actor="PAP-1",
                  student_id="STU-1", profile=profile)
              assert v2["allowed"] is False
              v3 = cp.filtered_profile(actor="EMP-1",
                  student_id="STU-1", profile=profile)
              assert v3["allowed"] is False
              print("OK minimizacion: teacher ve academicos, parent/company denegados (solo su hijo via scope)")

          def test_regresion_imports_semilla() -> None:
              import importlib, pathlib
              BASE = (pathlib.Path(__file__).resolve().parents[1]
                      / "domain" / "security")
              n = 0
              for p in sorted(BASE.glob("*.py")):
                  if p.stat().st_size <= 1:
                      continue
                  importlib.import_module(
                      "apps.semilla.domain.security." + p.stem)
                  n = n + 1
              assert n >= 4
              print("OK seguridad: " + str(n) + " modulos importan")
          TSEOF
          timeout 180 python3 -m pytest apps/semilla/tests/test_sm9_seguridad.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/sm9.out 2>&1
          echo $? > /tmp/sm9
          if [ "$(cat /tmp/sm9)" = "0" ]; then echo "- SM9 seguridad: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- SM9: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### SM9 detalle"; echo '```'; tail -100 /tmp/sm9.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion final 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 shared_engines" "x3 subastas" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -100 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          if [ "$(cat /tmp/x1)" = "0" ] && [ "$(cat /tmp/x2)" = "0" ] && [ "$(cat /tmp/x3)" = "0" ] && [ "$(cat /tmp/x4)" = "0" ]; then echo 0 > /tmp/xall; else echo 1 > /tmp/xall; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si TODO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in sm9 xall; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: SM9 VERDE — SEMILLA TERMINADA COMPLETA (SM1 a SM9)**"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/semilla
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(SEMILLA-SM9): Calidad y seguridad final (datetime timezone-aware quirurgico idempotente, IdempotencyEngine persistente claim/complete/replay con TTL, RBAC de 6 roles STUDENT/PARENT/TEACHER/DIRECTOR/GOVERNMENT/COMPANY con permisos por accion, AccessAudit de cada acceso a datos de estudiantes, ChildDataProtection fail-closed que exige consentimiento parental vigente para operaciones sensibles y minimizacion de campos por rol) (SM9 verde — SEMILLA TERMINADA COMPLETA)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — SEMILLA TERMINADA COMPLETA (SM1-SM9). Siguiente etapa del plan congelado: A3 SUBASTAS enhancements (marketplace_fees + escrow + logistica comercial).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
