name: "ZYRA RUN6 v2: AX-10..AX-20 (8 engines; fix tabla policial en test 11 + LookupError test 13 + firma verify_db 16)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] 8 engines (biometric con firma verify_db explícita; resto idénticos)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/axis/life_history/immigration_registry.py",
                     D(r'''
              """AX-10 Immigration: entradas/salidas, visas con
              vencimiento, residencia, ciudadania sin duplicado,
              deportacion. Patron _DDL + ensure_db."""
              from __future__ import annotations
              import uuid
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS ax_mig_moves ("
                  " move_id TEXT PRIMARY KEY, person_id TEXT NOT"
                  " NULL, zid TEXT NOT NULL DEFAULT '', kind TEXT"
                  " NOT NULL, checkpoint TEXT NOT NULL DEFAULT"
                  " '', at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_mig_visas ("
                  " visa_id TEXT PRIMARY KEY, person_id TEXT NOT"
                  " NULL, kind TEXT NOT NULL, status TEXT NOT"
                  " NULL DEFAULT 'solicitada', issued_at TEXT"
                  " NOT NULL DEFAULT '', expires_at TEXT NOT"
                  " NULL DEFAULT '', notes TEXT NOT NULL DEFAULT"
                  " '')",
                  "CREATE TABLE IF NOT EXISTS ax_mig_residency ("
                  " res_id TEXT PRIMARY KEY, person_id TEXT NOT"
                  " NULL, kind TEXT NOT NULL, status TEXT NOT"
                  " NULL DEFAULT 'vigente', granted_at TEXT NOT"
                  " NULL DEFAULT '', notes TEXT NOT NULL"
                  " DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_mig_citizenship ("
                  " cit_id TEXT PRIMARY KEY, person_id TEXT NOT"
                  " NULL, granted_by TEXT NOT NULL, granted_at"
                  " TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_mig_deport ("
                  " dep_id TEXT PRIMARY KEY, person_id TEXT NOT"
                  " NULL, reason TEXT NOT NULL, status TEXT NOT"
                  " NULL DEFAULT 'ordenada', ordered_by TEXT NOT"
                  " NULL, executed_at TEXT NOT NULL DEFAULT '',"
                  " created_at TEXT NOT NULL DEFAULT '')",
              )
              _VISA = ("TURISTA", "TRABAJO", "ESTUDIANTE",
                       "TRANSITO")
              _RESK = ("TEMPORAL", "PERMANENTE")
              _MOVE = ("ENTRADA", "SALIDA")


              def ensure_db(db):
                  for stmt in _DDL:
                      db.execute(stmt)


              def _person_ok(db, person_id):
                  if not str(person_id).strip():
                      raise ValueError(
                          "person_id requerido")
                  return str(person_id)


              def register_move_db(db, *, person_id, zid="",
                                   kind, checkpoint="",
                                   at=""):
                  ensure_db(db)
                  _person_ok(db, person_id)
                  k = str(kind).upper()
                  if k not in _MOVE:
                      raise ValueError("kind debe ser "
                                       + "/".join(_MOVE))
                  mid = ("AXMV-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_mig_moves (move_id,"
                      " person_id, zid, kind, checkpoint, at)"
                      " VALUES (?, ?, ?, ?, ?, ?)",
                      (mid, str(person_id), str(zid), k,
                       str(checkpoint), str(at)))
                  return {"move_id": mid, "kind": k}


              def moves_of_db(db, person_id):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT move_id, kind, checkpoint, at"
                      " FROM ax_mig_moves WHERE person_id = ?"
                      " ORDER BY rowid", (str(person_id),))
                  return [{"move_id": str(r["move_id"]),
                           "kind": str(r["kind"]),
                           "checkpoint": str(r["checkpoint"]),
                           "at": str(r["at"])}
                          for r in rows]


              def apply_visa_db(db, *, person_id, kind,
                                notes="", at=""):
                  ensure_db(db)
                  _person_ok(db, person_id)
                  k = str(kind).upper()
                  if k not in _VISA:
                      raise ValueError("kind debe ser "
                                       + "/".join(_VISA))
                  vid = ("AXV-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_mig_visas (visa_id,"
                      " person_id, kind, status, issued_at,"
                      " expires_at, notes) VALUES (?, ?, ?,"
                      " 'solicitada', '', '', ?)",
                      (vid, str(person_id), k, str(notes)))
                  return {"visa_id": vid,
                          "status": "solicitada"}


              def decide_visa_db(db, visa_id, *, approve,
                                 expires_at="", actor="",
                                 at=""):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT status FROM ax_mig_visas WHERE"
                      " visa_id = ?", (str(visa_id),))
                  if row is None:
                      raise KeyError(visa_id)
                  if str(row["status"]) != "solicitada":
                      raise ValueError(
                          "visa ya decidida")
                  new = "aprobada" if approve \
                      else "rechazada"
                  db.execute(
                      "UPDATE ax_mig_visas SET status = ?,"
                      " issued_at = ?, expires_at = ? WHERE"
                      " visa_id = ?",
                      (new, str(at), str(expires_at),
                       str(visa_id)))
                  return {"visa_id": str(visa_id),
                          "status": new}


              def expire_visa_db(db, visa_id, *, at=""):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT status FROM ax_mig_visas WHERE"
                      " visa_id = ?", (str(visa_id),))
                  if row is None:
                      raise KeyError(visa_id)
                  if str(row["status"]) != "aprobada":
                      raise ValueError(
                          "solo se vence una aprobada")
                  db.execute(
                      "UPDATE ax_mig_visas SET status ="
                      " 'vencida' WHERE visa_id = ?",
                      (str(visa_id),))
                  return {"visa_id": str(visa_id),
                          "status": "vencida"}


              def visas_of_db(db, person_id):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT visa_id, kind, status, expires_at"
                      " FROM ax_mig_visas WHERE person_id = ?"
                      " ORDER BY rowid", (str(person_id),))
                  return [{"visa_id": str(r["visa_id"]),
                           "kind": str(r["kind"]),
                           "status": str(r["status"]),
                           "expires_at": str(
                               r["expires_at"])}
                          for r in rows]


              def grant_residency_db(db, *, person_id, kind,
                                     notes="", at=""):
                  ensure_db(db)
                  _person_ok(db, person_id)
                  k = str(kind).upper()
                  if k not in _RESK:
                      raise ValueError("kind debe ser "
                                       + "/".join(_RESK))
                  rid = ("AXR-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_mig_residency (res_id,"
                      " person_id, kind, status, granted_at,"
                      " notes) VALUES (?, ?, ?, 'vigente', ?,"
                      " ?)",
                      (rid, str(person_id), k, str(at),
                       str(notes)))
                  return {"res_id": rid, "kind": k,
                          "status": "vigente"}


              def cancel_residency_db(db, res_id, *, at=""):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT status FROM ax_mig_residency"
                      " WHERE res_id = ?", (str(res_id),))
                  if row is None:
                      raise KeyError(res_id)
                  if str(row["status"]) != "vigente":
                      raise ValueError("no vigente")
                  db.execute(
                      "UPDATE ax_mig_residency SET status ="
                      " 'cancelada' WHERE res_id = ?",
                      (str(res_id),))
                  return {"res_id": str(res_id),
                          "status": "cancelada"}


              def residency_of_db(db, person_id):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT res_id, kind, status, granted_at"
                      " FROM ax_mig_residency WHERE person_id ="
                      " ? ORDER BY rowid", (str(person_id),))
                  return [{"res_id": str(r["res_id"]),
                           "kind": str(r["kind"]),
                           "status": str(r["status"])}
                          for r in rows]


              def naturalize_db(db, *, person_id, granted_by,
                                at=""):
                  ensure_db(db)
                  _person_ok(db, person_id)
                  if not str(granted_by).strip():
                      raise ValueError(
                          "granted_by requerido")
                  dup = db.query_one(
                      "SELECT cit_id FROM ax_mig_citizenship"
                      " WHERE person_id = ?",
                      (str(person_id),))
                  if dup is not None:
                      raise ValueError(
                          "ya naturalizado (regla 66)")
                  cid = ("AXC-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_mig_citizenship (cit_id,"
                      " person_id, granted_by, granted_at)"
                      " VALUES (?, ?, ?, ?)",
                      (cid, str(person_id), str(granted_by),
                       str(at)))
                  return {"cit_id": cid,
                          "status": "naturalizado"}


              def order_deportation_db(db, *, person_id,
                                       reason, ordered_by,
                                       at=""):
                  ensure_db(db)
                  _person_ok(db, person_id)
                  if not str(reason).strip():
                      raise ValueError(
                          "reason requerida")
                  did = ("AXD-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_mig_deport (dep_id,"
                      " person_id, reason, status, ordered_by,"
                      " executed_at, created_at)"
                      " VALUES (?, ?, ?, 'ordenada', ?, '',"
                      " ?)",
                      (did, str(person_id), str(reason),
                       str(ordered_by), str(at)))
                  return {"dep_id": did,
                          "status": "ordenada"}


              def execute_deportation_db(db, dep_id, *,
                                         at=""):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT status FROM ax_mig_deport WHERE"
                      " dep_id = ?", (str(dep_id),))
                  if row is None:
                      raise KeyError(dep_id)
                  if str(row["status"]) != "ordenada":
                      raise ValueError(
                          "ya ejecutada")
                  db.execute(
                      "UPDATE ax_mig_deport SET status ="
                      " 'ejecutada', executed_at = ? WHERE"
                      " dep_id = ?",
                      (str(at), str(dep_id)))
                  return {"dep_id": str(dep_id),
                          "status": "ejecutada"}


              def deportations_of_db(db, person_id):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT dep_id, reason, status,"
                      " executed_at FROM ax_mig_deport WHERE"
                      " person_id = ? ORDER BY rowid",
                      (str(person_id),))
                  return [{"dep_id": str(r["dep_id"]),
                           "reason": str(r["reason"]),
                           "status": str(r["status"])}
                          for r in rows]
              '''))
              forzar("apps/axis/life_history/border_control.py",
                     D(r'''
              """AX-11 Border Control: puestos/agentes, cruces
              con ALERTA de buscado (referencia ax_pol_wanted —
              su dueno crea la tabla, leccion c), vehiculos
              marcados, inspecciones. Patron _DDL + ensure_db."""
              from __future__ import annotations
              import uuid
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS ax_border_posts ("
                  " post_id TEXT PRIMARY KEY, name TEXT NOT"
                  " NULL, kind TEXT NOT NULL DEFAULT"
                  " 'terrestre', active INTEGER NOT NULL"
                  " DEFAULT 1, created_at TEXT NOT NULL"
                  " DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS"
                  " ax_border_agents (agent_id TEXT PRIMARY KEY,"
                  " name TEXT NOT NULL, post_id TEXT NOT NULL"
                  " DEFAULT '', active INTEGER NOT NULL DEFAULT"
                  " 1, created_at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_border_cross ("
                  " cross_id TEXT PRIMARY KEY, post_id TEXT NOT"
                  " NULL, person_id TEXT NOT NULL DEFAULT '',"
                  " zid TEXT NOT NULL DEFAULT '', direction TEXT"
                  " NOT NULL, alert TEXT NOT NULL DEFAULT '',"
                  " agent_id TEXT NOT NULL DEFAULT '', at TEXT"
                  " NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_border_vehicles ("
                  " veh_id TEXT PRIMARY KEY, plate TEXT NOT NULL"
                  " UNIQUE, flagged TEXT NOT NULL DEFAULT '',"
                  " created_at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS"
                  " ax_border_inspections (insp_id TEXT PRIMARY"
                  " KEY, cross_id TEXT NOT NULL DEFAULT '',"
                  " veh_id TEXT NOT NULL DEFAULT '', result TEXT"
                  " NOT NULL, notes TEXT NOT NULL DEFAULT '',"
                  " agent_id TEXT NOT NULL DEFAULT '', at TEXT"
                  " NOT NULL DEFAULT '')",
              )
              _DIRS = ("ENTRADA", "SALIDA")
              _POSTK = ("terrestre", "aereo", "maritimo")


              def ensure_db(db):
                  for stmt in _DDL:
                      db.execute(stmt)


              def register_post_db(db, *, name, kind="terrestre",
                                   created_at=""):
                  ensure_db(db)
                  if not str(name).strip():
                      raise ValueError("name requerido")
                  k = str(kind).lower()
                  if k not in _POSTK:
                      raise ValueError("kind debe ser "
                                       + "/".join(_POSTK))
                  pid = ("AXBP-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_border_posts (post_id,"
                      " name, kind, active, created_at)"
                      " VALUES (?, ?, ?, 1, ?)",
                      (pid, str(name), k, str(created_at)))
                  return {"post_id": pid, "name": str(name)}


              def register_bagent_db(db, *, name, post_id="",
                                     created_at=""):
                  ensure_db(db)
                  if not str(name).strip():
                      raise ValueError("name requerido")
                  aid = ("AXBA-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_border_agents (agent_id,"
                      " name, post_id, active, created_at)"
                      " VALUES (?, ?, ?, 1, ?)",
                      (aid, str(name), str(post_id),
                       str(created_at)))
                  return {"agent_id": aid, "name": str(name)}


              def cross_db(db, *, post_id, direction,
                           person_id="", zid="", agent_id="",
                           at=""):
                  ensure_db(db)
                  k = str(direction).upper()
                  if k not in _DIRS:
                      raise ValueError("direction debe ser "
                                       + "/".join(_DIRS))
                  if not str(person_id).strip() and \
                          not str(zid).strip():
                      raise ValueError(
                          "person_id o zid requerido")
                  alert = ""
                  if str(zid).strip():
                      w = db.query_one(
                          "SELECT wanted_id FROM ax_pol_wanted"
                          " WHERE zid = ? AND status ="
                          " 'buscado' LIMIT 1",
                          (str(zid),))
                      if w is not None:
                          alert = ("BUSCADO:"
                                   + str(w["wanted_id"]))
                  cid = ("AXBC-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_border_cross (cross_id,"
                      " post_id, person_id, zid, direction,"
                      " alert, agent_id, at) VALUES (?, ?, ?,"
                      " ?, ?, ?, ?, ?)",
                      (cid, str(post_id), str(person_id),
                       str(zid), k, alert, str(agent_id),
                       str(at)))
                  return {"cross_id": cid, "direction": k,
                          "alert": alert}


              def crosses_of_db(db, post_id="", only_alerts=
                                False):
                  ensure_db(db)
                  if only_alerts:
                      rows = db.query_all(
                          "SELECT cross_id, post_id, zid,"
                          " direction, alert, at FROM"
                          " ax_border_cross WHERE alert !="
                          " '' ORDER BY rowid")
                  elif str(post_id).strip():
                      rows = db.query_all(
                          "SELECT cross_id, post_id, zid,"
                          " direction, alert, at FROM"
                          " ax_border_cross WHERE post_id = ?"
                          " ORDER BY rowid", (str(post_id),))
                  else:
                      rows = db.query_all(
                          "SELECT cross_id, post_id, zid,"
                          " direction, alert, at FROM"
                          " ax_border_cross ORDER BY rowid")
                  return [{"cross_id": str(r["cross_id"]),
                           "post_id": str(r["post_id"]),
                           "zid": str(r["zid"]),
                           "direction": str(r["direction"]),
                           "alert": str(r["alert"]),
                           "at": str(r["at"])}
                          for r in rows]


              def flag_vehicle_db(db, *, plate, reason,
                                  created_at=""):
                  ensure_db(db)
                  if not str(plate).strip() or \
                          not str(reason).strip():
                      raise ValueError(
                          "plate y reason requeridos")
                  db.execute(
                      "INSERT OR REPLACE INTO"
                      " ax_border_vehicles (veh_id, plate,"
                      " flagged, created_at) VALUES (?, ?, ?,"
                      " ?)",
                      ("AXBV-" + uuid.uuid4().hex[:10],
                       str(plate).upper(), str(reason),
                       str(created_at)))
                  return {"plate": str(plate).upper(),
                          "flagged": str(reason)}


              def vehicle_status_db(db, plate):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT flagged FROM ax_border_vehicles"
                      " WHERE plate = ?",
                      (str(plate).upper(),))
                  if row is None:
                      return {"plate": str(plate).upper(),
                              "flagged": "",
                              "flagged_bool": False}
                  return {"plate": str(plate).upper(),
                          "flagged": str(row["flagged"]),
                          "flagged_bool": bool(
                              str(row["flagged"]).strip())}


              def inspect_db(db, *, cross_id="", veh_id="",
                             result, notes="", agent_id="",
                             at=""):
                  ensure_db(db)
                  if not str(result).strip():
                      raise ValueError(
                          "result requerido")
                  if not str(cross_id).strip() and \
                          not str(veh_id).strip():
                      raise ValueError(
                          "inspeccion exige cruce o"
                          " vehiculo")
                  iid = ("AXBI-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_border_inspections"
                      " (insp_id, cross_id, veh_id, result,"
                      " notes, agent_id, at) VALUES (?, ?, ?, ?,"
                      " ?, ?, ?)",
                      (iid, str(cross_id), str(veh_id),
                       str(result), str(notes),
                       str(agent_id), str(at)))
                  return {"insp_id": iid,
                          "result": str(result)}


              def inspections_of_db(db, ref_id):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT insp_id, cross_id, veh_id, result,"
                      " notes, at FROM ax_border_inspections"
                      " WHERE cross_id = ? OR veh_id = ? ORDER"
                      " BY rowid", (str(ref_id), str(ref_id)))
                  return [{"insp_id": str(r["insp_id"]),
                           "result": str(r["result"]),
                           "notes": str(r["notes"])}
                          for r in rows]
              '''))
              forzar("apps/axis/life_history/prison_movements.py",
                     D(r'''
              """AX-12 Prison Movements: clasificacion, traslados,
              visitas, liberacion que sincroniza ax_justice_pris.
              Patron _DDL + ensure_db."""
              from __future__ import annotations
              import uuid
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS ax_justice_pris ("
                  " pris_id TEXT PRIMARY KEY, case_id TEXT NOT"
                  " NULL, person_id TEXT NOT NULL, zid TEXT NOT"
                  " NULL DEFAULT '', sentence_days INTEGER NOT"
                  " NULL DEFAULT 0, status TEXT NOT NULL DEFAULT"
                  " 'preso', entry_by TEXT NOT NULL, entry_at"
                  " TEXT NOT NULL DEFAULT '', exit_at TEXT NOT"
                  " NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_pris_moves ("
                  " move_id TEXT PRIMARY KEY, pris_id TEXT NOT"
                  " NULL, kind TEXT NOT NULL, from_center TEXT"
                  " NOT NULL DEFAULT '', to_center TEXT NOT"
                  " NULL DEFAULT '', detail TEXT NOT NULL"
                  " DEFAULT '', at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_pris_visits ("
                  " visit_id TEXT PRIMARY KEY, pris_id TEXT NOT"
                  " NULL, visitor TEXT NOT NULL, allowed INTEGER"
                  " NOT NULL DEFAULT 1, at TEXT NOT NULL"
                  " DEFAULT '')",
              )
              _RISK = ("BAJO", "MEDIO", "ALTO", "MAXIMO")


              def ensure_db(db):
                  for stmt in _DDL:
                      db.execute(stmt)


              def _prison(db, pris_id):
                  row = db.query_one(
                      "SELECT pris_id, status, person_id FROM"
                      " ax_justice_pris WHERE pris_id = ?",
                      (str(pris_id),))
                  if row is None:
                      raise LookupError(
                          "preso no encontrado: "
                          + str(pris_id))
                  return row


              def classify_db(db, pris_id, *, risk, center,
                              at=""):
                  ensure_db(db)
                  _prison(db, pris_id)
                  r = str(risk).upper()
                  if r not in _RISK:
                      raise ValueError("risk debe ser "
                                       + "/".join(_RISK))
                  if not str(center).strip():
                      raise ValueError(
                          "center requerido")
                  mid = ("AXPM-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_pris_moves (move_id,"
                      " pris_id, kind, from_center, to_center,"
                      " detail, at) VALUES (?, ?,"
                      " 'CLASIFICACION', '', ?, ?, ?)",
                      (mid, str(pris_id), str(center),
                       "riesgo " + r, str(at)))
                  return {"move_id": mid, "risk": r}


              def transfer_db(db, pris_id, *, from_center,
                              to_center, at=""):
                  ensure_db(db)
                  row = _prison(db, pris_id)
                  if str(row["status"]) != "preso":
                      raise ValueError(
                          "solo se traslada a un preso")
                  if not str(to_center).strip():
                      raise ValueError(
                          "to_center requerido")
                  mid = ("AXPM-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_pris_moves (move_id,"
                      " pris_id, kind, from_center, to_center,"
                      " detail, at) VALUES (?, ?, 'TRASLADO',"
                      " ?, ?, '', ?)",
                      (mid, str(pris_id), str(from_center),
                       str(to_center), str(at)))
                  return {"move_id": mid, "kind": "TRASLADO"}


              def visit_db(db, pris_id, *, visitor,
                           allowed=True, at=""):
                  ensure_db(db)
                  row = _prison(db, pris_id)
                  if str(row["status"]) != "preso":
                      raise ValueError(
                          "visitas solo a presos")
                  if not str(visitor).strip():
                      raise ValueError(
                          "visitor requerido")
                  vid = ("AXPV-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_pris_visits (visit_id,"
                      " pris_id, visitor, allowed, at)"
                      " VALUES (?, ?, ?, ?, ?)",
                      (vid, str(pris_id), str(visitor),
