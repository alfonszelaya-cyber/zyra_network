              # CORREGIDO: el proyecto de prueba tiene exactamente 4 piezas
              # reales (3 escenas + 1 presentacion; sin artefactos ni
              # evaluaciones en este flujo).
              assert exp["total_piezas"] == 4, "piezas=" + str(exp["total_piezas"])
              assert len(exp["hash_sha256"]) == 64
              assert exp["tamano_total"] > 500
              ref["bundle"] = exp
              nombres = {p["nombre"] for p in exp["piezas"]}
              assert any(n.startswith("escena_") for n in nombres), "escenas incluidas"
              assert any(n.startswith("presentacion_") for n in nombres), "presentaciones incluidas"

          def t_envio_zyra():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/exports", {
                  "tipo": "envio_zyra", "destino": "nexo",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              datos = cuerpo["datos"]
              assert datos["exportacion"]["tipo"] == "envio_zyra"
              assert datos["exportacion"]["destino"] == "nexo"
              assert datos["estado_envio"] == "pendiente_red", "outbox real sin red"
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/exports", {
                  "tipo": "envio_zyra", "destino": "twitter",
              }, headers=H_DUENO)
              assert status == 400, "destino invalido: " + str(status)

          def t_listar_y_403():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/projects/" + pid + "/presentations", headers=H_DUENO)
              assert status == 200 and cuerpo["datos"]["total"] == 1
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/projects/" + pid + "/exports", headers=H_DUENO)
              assert status == 200 and cuerpo["datos"]["total"] == 2
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/exports", {
                  "tipo": "bundle_verificable",
              }, headers=H_OTRO)
              assert status == 403, "espectador no exporta: " + str(status)
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/presentations/" + ref["presentacion"]["id"] + "/seal", None, headers=H_OTRO)
              assert status == 403, "espectador no sella: " + str(status)

          def t_ui_paneles_fase7():
              status, _, html, _ = llamada("GET", "/laboratorio/ui/presentar", headers=H_DUENO)
              assert status == 200, "presentar status=" + str(status)
              texto = html.decode("utf-8")
              assert "EN VIVO" in texto
              assert texto.count('data-accion=') == 3, "Ley 3, hay " + str(texto.count('data-accion='))
              assert 'id="form-presentacion"' in texto and 'id="form-sellar"' in texto
              assert "ZYRA Network para El Salvador" in texto
              assert "sellada" in texto
              status, _, html, _ = llamada("GET", "/laboratorio/ui/exportar", headers=H_DUENO)
              assert status == 200, "exportar status=" + str(status)
              texto = html.decode("utf-8")
              assert "EN VIVO" in texto
              assert texto.count('data-accion=') == 3, "Ley 3 exportar"
              assert 'id="form-exportar"' in texto
              assert "bundle_verificable" in texto and "envio_zyra" in texto

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              total = len(cuerpo["datos"]["rutas"])
              assert total == 57, "se esperaban 57 rutas (49 previas + 5 presentaciones + 3 exports), hay " + str(total)
              ids_modulos = {m["id"] for m in cuerpo["datos"]["modulos"]}
              assert ids_modulos == {"capture", "simulation", "understanding", "design", "creation", "library", "world4d", "render", "presentation", "export"}, str(ids_modulos)

          def t_plantillas_completas():
              assert verificar_plantillas() == 16

          sum_write("")
          sum_write("### Pruebas end-to-end Fase 7 (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Migracion v7 + proyecto insignia con 3 escenas", preparar)
          check("Crear presentacion insignia con 3 pasos", t_crear_presentacion)
          check("Presentaciones invalidas rechazadas (400)", t_presentacion_invalida)
          check("Reproducir slideshow SVG real con narraciones", t_reproducir_slideshow)
          check("Sellar en ZYRA via outbox (pendiente_red real)", t_sellar_presentacion)
          check("Bundle ZIP con 4 piezas reales y SHA-256", t_bundle_zip_real)
          check("Envio a NEXO via outbox + destino invalido", t_envio_zyra)
          check("Listados + 403 espectador", t_listar_y_403)
          check("UI presentar y exportar EN VIVO con Ley 3", t_ui_paneles_fase7)
          check("Indice publico: 57 rutas, 10 modulos", t_indice_publico)
          check("16 plantillas verificadas", t_plantillas_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 7 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 7Ac aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 7Ac - Fase 7 con conteo de piezas corregido a 4"
            git push
          fi
