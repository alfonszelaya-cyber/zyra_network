name: ZYRA Security Chain

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base dependencies
        run: pip install cryptography pytest

      - name: 1/4 Biometrics engine tests
        run: python -m shared_engines.security.biometrics -v

      - name: 2/4 Runtime existing tests (biometrics off)
        run: python -m pytest shared_engines/runtime/tests -q

      - name: 3/4 Native wiring smoke (router + api + kernel)
        run: |
          python - <<'PYEOF'
          import os, tempfile
          from pathlib import Path

          from shared_engines.common.clocks import SystemClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.api import ZyraApiHandler
          from shared_engines.runtime.combined_api import CORE_PREFIXES
          from shared_engines.authority.root import PersistentRootAuthority
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.security.biometrics import ProviderError

          KEY = "ab" * 32

          assert "proofing" in CORE_PREFIXES, (
              "router missing proofing prefix"
          )
          assert hasattr(
              ZyraApiHandler, "_handle_proofing_submit"
          ), "api missing proofing routes"

          with tempfile.TemporaryDirectory() as tmp:
              authority = PersistentRootAuthority(
                  data_dir=Path(tmp),
                  master_key_hex=KEY,
              )
              signer, _status = authority.load_or_create()
              db = SQLiteAdapter(
                  os.path.join(tmp, "chain.db")
              )
              kernel = ZyraKernel(
                  db=db,
                  clock=SystemClock(),
                  signer=signer,
                  config=RuntimeConfig(
                      host="127.0.0.1", port=0
                  ),
                  master_key_hex=KEY,
              )
              assert kernel.biometrics is not None, (
                  "biometrics engine not wired"
              )
              components = [
                  c.component
                  for c in kernel.health_components()
              ]
              assert "biometrics" in components, (
                  f"health missing biometrics: {components}"
              )
              try:
                  kernel.biometrics.submit_case(
                      display_name="x",
                      actor="ci",
                      doc_image=b"doc",
                      selfie_image=b"doc",
                  )
              except ProviderError:
                  pass
              else:
                  raise AssertionError(
                      "fail-closed provider must refuse"
                      " submissions"
                  )

          print(
              "CHAIN OK: router + api routes + kernel"
              " wiring + fail-closed verified"
          )
          PYEOF

      - name: Install real face engine dependencies
        run: |
          pip install "numpy>=1.24,<2.0" "opencv-python-headless>=4.8,<5.0" "onnxruntime>=1.16,<2.0" "cython<3" "setuptools<81" wheel
          pip install --no-build-isolation "insightface>=0.7,<0.8"

      - name: 4/4 Real face engine loads and refuses face-less images
        run: |
          python - <<'PYEOF'
          import os, tempfile

          from shared_engines.security.biometrics_face import (
              InsightFaceProvider,
          )
          from shared_engines.security.biometrics import (
              TemplateQualityError,
          )

          provider = InsightFaceProvider(
              models_dir=os.path.join(
                  tempfile.gettempdir(), "zyra-models"
              )
          )
          print("FACE ENGINE LOADED OK")

          try:
              provider.extract_template(b"not-an-image")
          except TemplateQualityError:
              print(
                  "REJECT OK: garbage image refused"
                  " (fail-closed)"
              )
          else:
              raise AssertionError(
                  "garbage image must be refused"
              )

          blank = bytes.fromhex(
              "89504e470d0a1a0a0000000d494844520000000"
              "100000001080600000" "01f15c4890000000a49444"
              "154789c6360000002000148" "afa71d0000000049454e44"
              "ae426082"
          )
          try:
              provider.extract_template(blank)
          except TemplateQualityError:
              print(
                  "REJECT OK: face-less image refused"
                  " (no face detected)"
              )
          else:
              raise AssertionError(
                  "face-less image must be refused"
              )

          print("EYE OK: real face engine verified")
          PYEOF

      - name: Result
        if: always()
        run: echo "Security chain validation finished"
