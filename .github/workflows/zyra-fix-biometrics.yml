      - name: E2E smoke (session + KYB lifecycle)
        run: |
          python3 - <<'EOF'
          import http.cookiejar
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import uuid

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-test"}, None)
                  return (False, None, "offline")


          def make_opener():
              cj = http.cookiejar.CookieJar()
              return urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(cj)
              )


          def call(opener, method, url, data=None, form=None):
              if form is not None:
                  from urllib.parse import urlencode
                  payload = urlencode(form).encode("utf-8")
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              elif data is not None:
                  payload = json.dumps(data).encode("utf-8")
                  headers = {"Content-Type": "application/json"}
              else:
                  payload = None
                  headers = {}
              req = urllib.request.Request(
                  url, data=payload, method=method, headers=headers
              )
              try:
                  with opener.open(req, timeout=5) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read()[:300].decode("utf-8", "replace")
                  raise AssertionError(
                      "HTTP %s en %s %s -> %s" % (e.code, method, url, body)
                  )


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          uname = "user" + uuid.uuid4().hex[:6]

          o1 = make_opener()
          st, _ = call(o1, "POST", base + "/subastas/registro", form={
              "username": uname, "password": "secreto123",
              "display_name": "User Test", "role": "vendedor",
          })
          assert st == 303, st
          print("1. registro de cuenta OK (sesion automatica)")

          st, html = call(o1, "GET", base + "/subastas/inscripcion")
          assert "Sesion activa" in html and uname in html, html[:200]
          assert "Mi perfil de inscripcion" in html
          print("2. sesion activa visible OK")

          st, _ = call(o1, "POST", base + "/subastas/perfil", form={
              "address": "San Salvador", "phone": "5555",
              "category": "electronica", "payout_info": "cartera-zid",
          })
          assert st == 200, st
          st, html = call(o1, "GET", base + "/subastas/inscripcion")
          assert "San Salvador" in html
          print("3. perfil guardado y visible OK")

          st, _ = call(o1, "POST", base + "/subastas/empresa", form={
              "company_name": "Tienda ZYRA SA",
              "rep_name": "User Test", "rep_doc": "DOC-123",
              "doc_ref": "ref-1",
          })
          assert st == 200, st
          print("4. KYB empresa registrada OK")

          o2 = make_opener()
          st, _ = call(o2, "POST", base + "/subastas/registro", form={
              "username": "gob" + uuid.uuid4().hex[:4],
              "password": "gobpass1", "display_name": "Gob",
              "role": "comprador",
          })
          o2user = "gob" + uuid.uuid4().hex[:4]
          print("5. (gobierno se registra aparte)")

          st, html = call(o1, "GET", base + "/subastas/inscripcion")
          assert "Vincular mi ZID" in html
          print("6. seccion ZID visible OK")

          o3 = make_opener()
          st, html = call(o3, "GET", base + "/subastas/inscripcion")
          assert "Entrar" in html and "Sesion activa" not in html
          print("7. visitante ve login, no sesion OK")

          print("E2E SMOKE OK: registro + sesion + perfil + KYB + roles + invitado")
          EOF

