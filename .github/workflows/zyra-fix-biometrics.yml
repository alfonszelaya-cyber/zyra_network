              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, "ruta.txt"), "w", encoding="utf-8") as f:
                  f.write(RUTA)

              with open(RUTA, encoding="utf-8") as f:
                  base = f.read()

              base_limpio = limpiar(base)
              if base_limpio != base:
                  suma("- Se detectaron restos de parches v5/v6 anteriores; se limpiaron antes de aplicar v6.")

              okb, msgb = pyok(base_limpio)
              if not okb:
                  rechazo("el superapp.py base no compila: " + msgb[:300])
              else:
                  suma("- Base estable verificada con py_compile: OK (" + str(len(base_limpio)) + " caracteres)")

              if not PAYLOAD:
                  rechazo("el nucleo v6 codificado no se pudo decodificar")
              if PAYLOAD:
                  okn, msgn = node_check(PAYLOAD)
                  if okn:
                      suma("- Sintaxis del nucleo v6 (node --check del nucleo decodificado): OK")
                  else:
                      rechazo("el nucleo v6 tiene errores de sintaxis: " + msgn[:300])

              info = None
              t = base_limpio
              if not RECHAZOS and PAYLOAD:
                  try:
                      t, info = aplicar(base_limpio)
                      suma("")
                      suma("### 1) Parche v6 aplicado")
                      suma("- Insercion UNICA del bloque codificado: ancla " + info["ancla"] + " | variante de comillas: " + info["variante"] + " | tamano: " + str(info["tam"]) + " caracteres")
                      suma("- CSS compacto de captura via JavaScript (contenedor 520px, media max 58vh); guia y marco del documento intactos.")
                      suma("- Gates: nombre vs documento (60%), tipo de documento (incluye EAD USA y Permiso legal), biometria facial (distancia 0.60), orden de pasos obligatorio con regreso automatico al Paso 1, avisos 500/502/503/413, reintentos y warmup anti-502.")
                  except Rechazo as e:
                      rechazo(str(e)[:500])

              if limpiar(t) != base_limpio:
                  rechazo("conservacion fallida: hay cambios que no son el bloque marcado v6")
              if base_limpio.count("docVencido") != t.count("docVencido"):
                  rechazo("docVencido cambio de numero de apariciones")
              elif not RECHAZOS:
                  suma("- docVencido intacto: OK (" + str(base_limpio.count("docVencido")) + " apariciones, sin cambios)")

              agregadas = len(t.splitlines()) - len(base_limpio.splitlines())
              suma("- Lineas agregadas: " + str(max(0, agregadas)) + " / eliminadas: 0 (solo insercion marcada)")

              with open(RUTA, "w", encoding="utf-8") as f:
                  f.write(t)

              suma("")
              suma("### 2) Validaciones")
              okf, msgf = pyok(t)
              if okf:
                  suma("- Sintaxis Python (py_compile) del archivo parchado: OK")
              else:
                  rechazo("py_compile fallo tras el parche: " + msgf[:300])

              B = bloque_js(base_limpio)
              P = bloque_js(t)
              suma("- Bloques script: estable=" + str(len(B)) + " parchado=" + str(len(P)))
              if len(P) < len(B):
                  rechazo("la cantidad de bloques script disminuyo")
              else:
                  regre = 0
                  for i in range(len(B)):
                      okB, _eB = node_check(B[i])
                      okP, eP = node_check(P[i])
                      if okB and not okP:
                          regre += 1
                          primera = (eP.splitlines() or ["(sin detalle)"])[0][:220]
                          rechazo("el bloque script " + str(i + 1) + " quedo roto tras el parche: " + primera)
                  extra = P[len(B):] if len(P) > len(B) else []
                  for j, ex in enumerate(extra):
                      okE, eE = node_check(ex)
                      if not okE:
                          regre += 1
                          rechazo("el bloque nuevo " + str(j + 1) + " no compila: " + (eE.splitlines() or ["?"])[0][:200])
                  if regre == 0 and not RECHAZOS:
                      suma("- node --check diferencial de TODOS los bloques (incluido el nuevo): sin regresiones OK")

              n_ini = t.count(MARCA_INI)
              n_fin = t.count(MARCA_FIN)
              if n_ini != 1 or n_fin != 1:
                  rechazo("marcadores v6 no son unicos (ini=" + str(n_ini) + ", fin=" + str(n_fin) + ")")
              elif not RECHAZOS:
                  suma("- Marcadores v6 unicos: OK")

              if info and not RECHAZOS:
                  try:
                      t2, info2 = aplicar(limpiar(t))
                      if t2 == t:
                          suma("- Idempotencia (2da pasada produce el mismo archivo): OK")
                      else:
                          rechazo("idempotencia fallida: la 2da pasada produce un archivo distinto")
                  except Rechazo as e:
                      rechazo("idempotencia fallida: " + str(e)[:300])
                  _pruebas_js(info)

              if not RECHAZOS:
                  suma("")
                  suma("### 3) Estructura detectada (auditoria)")
                  try:
                      ids_vistos = []
                      for mm in re.finditer(r"<(?:button|input|select|canvas|video|img|a|div|section|form)\b[^>]*>", base):
                          mi = re.search(r"\bid=[\"']([A-Za-z0-9_\-]+)[\"']", mm.group(0))
                          if mi and mi.group(1) not in ids_vistos:
                              ids_vistos.append(mi.group(1))
                      opts = [o.strip() for o in re.findall(r"<option[^>]*>([^<]{0,60})</option>", base)][:10]
                      presencia = ["Tesseract", "faceapi", "pdf417", "fetch(", "nombreNoCoincide", "bioRechazada", "docVencido"]
                      pres = {k: (k in base) for k in presencia}
                      with open(os.path.join(d, "estructura.txt"), "w", encoding="utf-8") as f:
                          f.write("IDs: " + json.dumps(ids_vistos[:60]) + "\n")
                          f.write("Opciones: " + json.dumps(opts) + "\n")
                          f.write("Presencia: " + json.dumps(pres) + "\n")
                      suma("- IDs detectados: " + ", ".join(ids_vistos[:18]) + (" ..." if len(ids_vistos) > 18 else ""))
                      if opts:
                          suma("- Opciones del select: " + " | ".join(opts))
                      suma("- Presentes: " + ", ".join(k for k, v in pres.items() if v))
                  except Exception as e:
                      suma("- Auditoria de estructura omitida: " + str(e)[:200])
                  suma("")
                  suma("### 4) Pruebas en su telefono (tras el deploy de Render)")
                  suma("1. Nombre vacio o sin apellido: al avanzar lo regresa al Paso 1 con aviso.")
                  suma("2. Nombre distinto al documento: al continuar de fotos, avisa y lo regresa al PASO 1; las fotos se borran para tomarlas de nuevo.")
                  suma("3. DUI seleccionado pero licencia capturada: mismo tratamiento (regresa al Paso 1 a corregir el tipo).")
                  suma("4. Sin pasos previos completos, la biometria y la clave no se alcanzan: el orden se corrige solo.")
                  suma("5. Selfie de otra persona: NO pasa a la clave. Selfie propia: pasa.")
                  suma("6. Clave y ZID: si el servidor falla (502/503), reintenta solo; si vuelve a fallar, avisa y reinicia el registro completo desde el Paso 1.")
                  suma("7. La pantalla de captura se ve mas compacta; la guia y el marco no cambian.")

              if RECHAZOS:
                  with open(os.path.join(d, "RECHAZO"), "w", encoding="utf-8") as f:
                      f.write("\n".join(RECHAZOS))
              sys.exit(0)

          if __name__ == "__main__":
              main()

          PYEOF

      - name: Paso 3 - Veredicto y commit condicional
        run: |
          if [ -f _zyra/RECHAZO ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Veredicto final - RECHAZADO (RC=2). NO se publica el parche v6. Su pagina queda en el estado estable." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          RUTA=$(cat _zyra/ruta.txt 2>/dev/null || echo "superapp.py")
          rm -rf __pycache__
          git add "$RUTA"
          if git diff --cached --quiet; then
            echo "## Veredicto final - sin cambios que publicar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "ZYRA-FIX v6 - orden de pasos obligatorio + gates de nombre, tipo y biometria + anti-502"
          git push origin HEAD
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Veredicto final - APROBADO (RC=0). Commit y push realizados: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Avisos (no bloquean)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node 20 en las acciones de GitHub esta obsoleto (aviso del runner, cosmico; no afecta este workflow)." >> "$GITHUB_STEP_SUMMARY"
          echo "- ubuntu-latest migra a Ubuntu 26 el 19-oct-2026; este workflow solo usa python3, node y git, disponibles tambien ahi." >> "$GITHUB_STEP_SUMMARY"

      - name: Artefacto informes y diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra-fix-v6-informe
          path: _zyra
