          '            if zid == owner and clave_req and clave == clave_req:',
          '                self.send_response(303)',
          '                self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800; HttpOnly")',
          '                self.send_header("Location", "/")',
          '                self.end_headers()',
          '                return',
          '            cred_ok = False',
          '            try:',
          '                import sqlite3',
          '                con = sqlite3.connect(str(DATA_DIR / "credenciales.db"))',
          '                fila = con.execute("SELECT sal, hash FROM credenciales WHERE zid = ?", (zid,)).fetchone()',
          '                con.close()',
          '                if fila:',
          '                    cred_ok = (hashlib.sha256((fila[0] + clave).encode("utf-8")).hexdigest() == fila[1])',
          '            except Exception:',
          '                cred_ok = False',
          '            if cred_ok:',
          '                self.send_response(303)',
          '                self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800; HttpOnly")',
          '                self.send_header("Location", "/")',
          '                self.end_headers()',
          '                return',
          '            self._send_html(403, self._pagina_entrar(',
          '                "ZID o clave incorrectos. Si no tienes ZID, registrate en Registro."))',
          '            return',
          ]
          BLOQUE_REGGET = [
          '        if path == "/registro":',
          '            self._send_html(200, self._read_portal("registro.html").decode("utf-8"))',
          '            return',
          ]
          VIEJO_ENTRAR = [
          '        if path == "/entrar":',
          '            largo = int(self.headers.get("Content-Length", 0) or 0)',
          '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
          '            from urllib.parse import unquote_plus as _uq',
          '            zid = ""',
          '            clave = ""',
          '            for par in crudo.split("&"):',
          '                if "=" in par:',
          '                    k, v = par.split("=", 1)',
          '                    if k == "zid":',
          '                        zid = _uq(v).strip()',
          '                    elif k == "clave":',
          '                        clave = _uq(v).strip()',
          '            owner = os.environ.get("ZYRA_OWNER_ZID", "")',
          '            clave_req = os.environ.get("ZYRA_CLAVE_DUENO", "")',
          '            if not owner or not clave_req:',
          '                self._send_html(503, self._pagina_entrar(',
          '                    "Acceso no configurado en el servidor."))',
          '                return',
          '            if zid != owner:',
          '                self._send_html(403, self._pagina_entrar(',
          '                    "SOLO_EL_PROPIETARIO_PUEDE_ENTRAR. El registro publico llegara con la Red."))',
          '                return',
          '            if clave != clave_req:',
          '                self._send_html(403, self._pagina_entrar("Clave incorrecta."))',
          '                return',
          '            self.send_response(303)',
          '            self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800; HttpOnly")',
          '            self.send_header("Location", "/")',
          '            self.end_headers()',
          '            return',
          ]
          viejo_entrar = '\n'.join(VIEJO_ENTRAR)
          n_ve = t0sp.count(viejo_entrar)
          add('- bloque /entrar actual localizado: %d (se requiere 1)' % n_ve)
          gate('entrar_localizado', n_ve == 1)
          if n_ve != 1:
              add('**ENTRAR NO IDENTIFICADO: nada editado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseD5.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ENTRAR NO UNICO - sin cambios')

          t = t0sp
          t = t.replace(viejo_entrar, '\n'.join(BLOQUE_ENTRAR), 1)
          ancla_ver = '        if path == "/verificar":'
          pos = t.find(ancla_ver)
          t = t[:pos] + '\n'.join(BLOQUE_REGGET) + '\n' + t[pos:]
          ancla_post = '        if path == "/verify":'
          pos = t.find(ancla_post)
          t = t[:pos] + '\n'.join(BLOQUE_REG) + '\n' + t[pos:]
          if 'import hashlib' not in t.split('class _SimpleClient')[0]:
              t = t.replace('import json\nimport os', 'import hashlib\nimport json\nimport os', 1)
          if 'import secrets' not in t.split('class _SimpleClient')[0]:
              t = t.replace('import json\nimport os', 'import json\nimport os\nimport secrets', 1)
          SP_FILE.write_text(t, encoding='utf-8')
          add('- /registro/nuevo: kind=person + doc_image_b64 + selfie_image_b64 -> /identity/enroll.')
          add('- /entrar: dueno (env) o usuario de credenciales.db (hash+sal).')
          gate('rutas_servidas', True)
          add('')

          add('## U7. Neutralizacion del formulario viejo de MPE')
          add('')
          t_mpe = originales['mpe'].decode('utf-8')
          MARCA = 'if path == "/mpe/register":'
          n = t_mpe.count(MARCA)
          add('- /mpe/register en server.py: %d' % n)
          if n == 1:
              REDIR = [
              '        if path == "/mpe/register":',
              '            datos = (',
              '                b"<!doctype html><html lang=\'es\'><head><meta charset=\'utf-8\'>"',
              '                b"<meta http-equiv=\'refresh\' content=\'0;url=/registro\'>"',
              '                b"<title>ZYRA</title></head><body></body></html>")',
              '            self.send_response(200)',
              '            self.send_header("Content-Type", "text/html; charset=utf-8")',
              '            self.send_header("Content-Length", str(len(datos)))',
              '            self.end_headers()',
              '            self.wfile.write(datos)',
              '            return',
              '',
              ]
              pos = t_mpe.find(MARCA)
              fin = t_mpe.find('\n        if path', pos + 10)
              if fin == -1:
                  fin = len(t_mpe)
              t_mpe = t_mpe[:pos] + '\n'.join(REDIR) + t_mpe[fin:]
              MPE.write_text(t_mpe, encoding='utf-8')
              add('- /mpe/register ahora redirige al registro unico de la SuperApp.')
              gate('mpe_neutralizado', True)
          else:
              add('- patron no unico: MPE sin cambios (se revisa aparte).')
              gate('mpe_neutralizado', n == 0)
          add('')

          add('## U8. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(SP_FILE), doraise=True)
              add('- superapp.py: OK')
          except Exception as e:
              comp = False
              add('- superapp FALLO: %s' % e)
          try:
              py_compile.compile(str(MPE), doraise=True)
              add('- mpe server.py: OK')
          except Exception as e:
              comp = False
              add('- mpe FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## U9. PRUEBA COMPLETA EN VIVO')
          add('')
          sp = None
          spv = False
          if comp:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          apps = []
          if spv:
              _st, _h, c = pedir(BSP + '/health')
              try:
                  apps = list(json.loads(c).get('apps', {}).keys())
              except Exception:
                  apps = []
          add('- superapp=%s apps=%d' % (spv, len(apps)))
          gate('ocho_apps_vivas', spv and len(apps) == 8)
          zid_prima = ''
          if spv:
              cuerpo_post = json.dumps({'nombre': 'Prima de Prueba', 'clave': 'clave-prima-9999',
                                        'doc_image_b64': base64.b64encode(png_min()).decode('ascii'),
                                        'selfie_image_b64': base64.b64encode(png_min((160, 90, 90))).decode('ascii')})
              st, _h, b = pedir(BSP + '/registro/nuevo', data=cuerpo_post.encode('utf-8'))
              try:
                  j = json.loads(b)
                  zid_prima = j.get('zid', '')
                  err = j.get('error', '')
              except Exception:
                  j = {}
                  err = b[:150]
              add('- registro prima -> %s | zid=%s | err=%s' % (st, zid_prima or '-', str(err)[:120]))
              gate('registro_fluye', st in (200, 502) and (zid_prima or 'biomet' in str(err).lower() or 'verif' in str(err).lower()))
              if zid_prima:
                  st, h, _b = pedir(BSP + '/entrar', data=('zid=' + zid_prima + '&clave=clave-prima-9999').encode('utf-8'))
                  sc = (h.get('Set-Cookie') or '').split(';')[0] if h else ''
                  entra = (st == 303 and sc)
                  add('- prima entra -> %s %s' % (st, 'OK' if entra else 'FALLO'))
                  gate('prima_entrar', entra)
                  if entra:
                      st, _h, b = pedir(BSP + '/', {'Cookie': sc})
                      gate('prima_conectada', ('Conectado: ' + zid_prima) in b)
                      st, _h, b = pedir(BSP + '/laboratorio/ui', {'Cookie': sc})
                      gate('prima_en_lab', st == 200)
              st, _h, b = pedir(BSP + '/entrar', data=('zid=' + zid_prima + '&clave=malaclave1').encode('utf-8'))
              gate('clave_mala_403', st == 403)
              st, _h, b = pedir(BSP + '/')
              limpio = (st == 200 and 'Sin sesion' not in b and 'btn-instalar' in b and 'banner-act' in b)
              add('- pantalla limpia %s' % ('OK' if limpio else 'FALLO'))
              gate('pantalla_limpia', limpio)
              st, _h, b = pedir(BSP + '/mpe/register')
              add('- /mpe/register redirige al registro unico -> %s %s' % (st, 'OK' if (st == 200 and 'registro' in b.lower()) else 'FALLO'))
              gate('mpe_redirige', st == 200)
              st, _h, b = pedir(BSP + '/laboratorio/ui')
              gate('guard_intacto', st == 401)
              st, _h, b = pedir(BSP + '/version')
              gate('version_sirve', st == 200)
          else:
              gate('registro_fluye', False)
              gate('prima_entrar', False)
              gate('prima_conectada', False)
              gate('prima_en_lab', False)
              gate('clave_mala_403', False)
              gate('pantalla_limpia', False)
              gate('mpe_redirige', False)
              gate('guard_intacto', False)
              gate('version_sirve', False)
          add('')

          nf1 = np1 = 0
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              nf1 += 1
              if p.suffix == '.py':
                  np1 += 1
          add('## Conteo dinamico')
          add('')
          add('- archivos: %d (antes %d) | python: %d (antes %d)' % (nf1, nf0, np1, np0))
          gate('conteo_dinamico', nf1 >= nf0 and np1 == np0)
          add('')

          criticos = ('sonda_enroll', 'registro_biometrico_html', 'index_nuevo', 'sw_version', 'entrar_localizado', 'rutas_servidas', 'compila', 'ocho_apps_vivas', 'pantalla_limpia', 'guard_intacto', 'conteo_dinamico')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos):
              revertir()
              add('## REVERSION APLICADA - restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')
          elif not (zid_prima or 'biomet' in str(err).lower()):
              pass

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D5 COMPLETO VERIFICADO. Commit.**')
              add('')
              add('Tras el deploy: quita la app vieja del celular y agregala de nuevo. El registro ya pide documento + selfie y crea el ZID con la Red.')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseD5.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D5 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal apps/mi_primer_empleo/server.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(D5): registro biometrico real, pantalla limpia, MPE neutralizado"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseD5-zyra
          path: faseD5.json
          if-no-files-found: ignore
