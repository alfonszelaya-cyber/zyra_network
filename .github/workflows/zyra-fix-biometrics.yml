name: "AXIS: dump de serve_axis actual (solo lectura)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump de la region serve_axis
        run: |
          python3 - <<'DMPEOF'
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          idx = t.find("def serve_axis(")
          print("def serve_axis encontrado en posicion:", idx)
          if idx < 0:
              print("NO EXISTE def serve_axis en el archivo")
          else:
              fin = t.find("class AxisServer", idx)
              if fin < 0:
                  fin = len(t)
              bloque = t[idx:fin]
              lines = bloque.splitlines()
              print("=== serve_axis actual ("
                    + str(len(lines)) + " lineas) ===")
              for i, l in enumerate(lines, 1):
                  print(f"{i:3d}| {l}")
          DMPEOF
