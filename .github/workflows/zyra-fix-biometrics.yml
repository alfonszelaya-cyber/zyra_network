                  " 'P1', 'U-1', 'MAIZ', 10.0, 'cancelled',"
                  " '2026-01-01')")
              with pytest.raises(LookupError):
                  register_harvest_db(db, plan_id="NO",
                      quantity=10)
              with pytest.raises(ValueError):
                  register_harvest_db(db, plan_id="PLN-3",
                      quantity=10)
              with pytest.raises(ValueError):
                  register_harvest_db(db, plan_id="PLN-2",
                      quantity=0)
              h = register_harvest_db(db, plan_id="PLN-2",
                  quantity=90.0, unit="qq",
                  quality_grade="A", losses=5.0,
                  harvest_date="2026-04-20")
              assert h["product"] == "MAIZ"
              assert h["producer_id"] == "P1"
