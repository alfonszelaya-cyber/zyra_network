name: "ZYRA - AUDITORIA archivos del lote EX (solo lectura, 1 min)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Auditar que archivos del lote EX existen y cuales faltan
        run: |
          python - <<'PYEOF'
          import os, subprocess, sys
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append

          A("# 🔍 AUDITORIA — archivos del lote EX en el repo\n")

          archivos = {
              "EX-3 camara": "apps/laboratorio/infrastructure/providers/renderer_3d.py",
              "EX-3 test": "apps/laboratorio/tests/test_camara_orbital.py",
              "EX-4 curso": "apps/laboratorio/routers/api/presentations.py",
              "EX-4 test": "apps/laboratorio/tests/test_curso_certificado.py",
              "EX-DES ciudadanos": "apps/laboratorio/infrastructure/providers/citizens_engine.py",
              "EX-DES test": "apps/laboratorio/tests/test_desastres.py",
              "EX-4 provider": "apps/laboratorio/infrastructure/providers/presentation_remote.py",
              "EX gemelo": "apps/laboratorio/infrastructure/providers/simulation_engine.py",
              "EX gemelo test": "apps/laboratorio/tests/test_gemelo_vivo.py",
              "EX ciudadanos test": "apps/laboratorio/tests/test_ciudadanos_fisica.py",
              "EX 4D rutas": "apps/laboratorio/routers/api/world4d.py",
          }
          A("| Punto | Archivo | Estado |")
          A("|---|---|---|")
          faltan = []
          for punto, ruta in archivos.items():
              p = Path(ruta)
              existe = p.is_file()
              A("| " + punto + " | `" + ruta + "` | " + ("✅ existe" if existe else "❌ NO EXISTE") + " |")
              if not existe:
                  faltan.append((punto, ruta))
          A("")

          if faltan:
              A("## ❌ FALTAN " + str(len(faltan)) + " archivos (se regeneran autocontenidos):")
              for punto, ruta in faltan:
                  A("- " + punto + " -> `" + ruta + "`")
          else:
              A("## ✅ TODOS EXISTEN — el lote ya esta commiteado")
          A("")

          A("## Suite corriendo AHORA\n")
          r = subprocess.run([sys.executable, "-m", "pytest", "apps/laboratorio/tests", "-q", "--tb=line"],
                             capture_output=True, text=True, timeout=600)
          salida = (r.stdout or "") + (r.stderr or "")
          A("codigo: " + str(r.returncode))
          A("```")
          A(salida[-4000:] if len(salida) > 4000 else salida)
          A("```")

          if summary:
              with open(summary, "a") as fh:
                  fh.write("\n".join(L) + "\n")
          print("\n".join(L))
          PYEOF

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-ex-lote
          path: auditoria_ex_lote.md
