name: "ZYRA SEMILLA SM5 institucion+gobierno+analitica + SM6 eventos+red"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] SM5 institucion + gobierno + analitica + reportes"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          IN = "apps/semilla/domain/institution"
          GO = "apps/semilla/domain/government"
          AN = "apps/semilla/domain/analytics"
          RE = "apps/semilla/domain/reports"

          try:
              forzar(IN + "/institution_verification_engine.py", D(r'''
                  """Institution Verification Engine - verificacion de
                  instituciones educativas (SM5). Alineado MINED:
                  registro con documento de respaldo y verificacion
                  (SE-5: PENDING -> INSTITUTION_VERIFIED ->
                  MINED_VERIFIED, elevable sin degradar)."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  VSTATUSES = ("PENDING", "INSTITUTION_VERIFIED",
                               "MINED_VERIFIED")

                  _MIGRATIONS = (
                      Migration(1, "sm_institution_verify", (
                          "CREATE TABLE IF NOT EXISTS sm_institution_verify (verify_id TEXT PRIMARY KEY, institution_id TEXT NOT NULL, document_ref TEXT NOT NULL, document_hash TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'PENDING', verified_by TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                      )),
                  )

                  class InstitutionVerificationEngine:
                      """Verificacion documental de instituciones."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.instverify",
                                          _MIGRATIONS).run(clock)

                      def submit_document(self, *,
                                          institution_id,
                                          document_ref) -> dict:
                          if not str(document_ref).strip():
                              raise ValueError(
                                  "document_ref requerido")
                          import hashlib
                          h = hashlib.sha256(
                              str(document_ref).encode(
                                  "utf-8")).hexdigest()
                          vid = "SMIV-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO"
                                  " sm_institution_verify"
                                  " (verify_id, institution_id,"
                                  " document_ref, document_hash,"
                                  " status, created_at, updated_at)"
                                  " VALUES (?, ?, ?, ?, 'PENDING',"
                                  " ?, ?)",
                                  (vid, institution_id,
                                   str(document_ref), h, now, now))
                          return self.get(vid)

                      def get(self, verify_id) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_institution_verify"
                              " WHERE verify_id = ?", (verify_id,))
                          if not row:
                              return None
                          return {"verify_id":
                                      str(row["verify_id"]),
                                  "institution_id":
                                      str(row["institution_id"]),
                                  "document_ref":
                                      str(row["document_ref"]),
                                  "document_hash":
                                      str(row["document_hash"]),
                                  "status": str(row["status"]),
                                  "verified_by":
                                      str(row["verified_by"])}

                      def elevate(self, verify_id, new_status,
                                  verified_by) -> dict:
                          if new_status not in VSTATUSES:
                              raise ValueError("status invalido")
                          row = self._db.query_one(
                              "SELECT status FROM"
                              " sm_institution_verify WHERE"
                              " verify_id = ?", (verify_id,))
                          if not row:
                              raise KeyError(verify_id)
                          if (VSTATUSES.index(new_status)
                                  <= VSTATUSES.index(
                                      str(row["status"]))):
                              raise ValueError(
                                  "nada que elevar (o intento de"
                                  " degradar)")
                          self._db.execute(
                              "UPDATE sm_institution_verify SET"
                              " status = ?, verified_by = ?,"
                              " updated_at = ? WHERE verify_id = ?",
                              (new_status, str(verified_by),
                               self._clock.now(), verify_id))
                          return self.get(verify_id)

                      def verifications_of(self,
                                           institution_id
                                           ) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT verify_id FROM"
                              " sm_institution_verify WHERE"
                              " institution_id = ?"
                              " ORDER BY rowid",
                              (institution_id,))
                          return [self.get(str(r["verify_id"]))
                                  for r in rows]
              '''))

              forzar(GO + "/governance_engine.py", D(r'''
                  """Governance Engine - gobierno educativo (SM5).
                  Panel ministerial y supervision de escuelas.
                  SEMILLA opera la escuela; MINED conserva autoridad:
                  los reportes son para el mecanismo de
                  interoperabilidad que MINED autorice (SE-5/R13)."""
                  from __future__ import annotations
                  from typing import Dict, List
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_supervisions", (
                          "CREATE TABLE IF NOT EXISTS sm_supervisions (supervision_id TEXT PRIMARY KEY, institution_id TEXT NOT NULL, supervisor TEXT NOT NULL, findings TEXT NOT NULL DEFAULT '', status TEXT NOT NULL DEFAULT 'OPEN', created_at REAL NOT NULL, closed_at REAL)",
                      )),
                      Migration(2, "sm_policies", (
                          "CREATE TABLE IF NOT EXISTS sm_policies (policy_id TEXT PRIMARY KEY, title TEXT NOT NULL, scope TEXT NOT NULL DEFAULT 'NATIONAL', status TEXT NOT NULL DEFAULT 'DRAFT', detail TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                      )),
                  )

                  class GovernanceEngine:
                      """Supervision escolar + politicas educativas."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.governance",
                                          _MIGRATIONS).run(clock)

                      def supervise(self, *, institution_id,
                                    supervisor,
                                    findings="") -> dict:
                          if not str(supervisor).strip():
                              raise ValueError(
                                  "supervisor requerido")
                          sid = "SMSUP-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_supervisions"
                                  " (supervision_id,"
                                  " institution_id, supervisor,"
                                  " findings, status, created_at)"
                                  " VALUES (?, ?, ?, ?, 'OPEN', ?)",
                                  (sid, institution_id,
                                   str(supervisor).strip(),
                                   str(findings), now))
                          return {"supervision_id": sid,
                                  "institution_id":
                                      institution_id,
                                  "supervisor":
                                      str(supervisor).strip(),
                                  "status": "OPEN"}

                      def close_supervision(self,
                                            supervision_id) -> dict:
                          self._db.execute(
                              "UPDATE sm_supervisions SET"
                              " status = 'CLOSED', closed_at = ?"
                              " WHERE supervision_id = ?",
                              (self._clock.now(),
                               supervision_id))
                          row = self._db.query_one(
                              "SELECT * FROM sm_supervisions WHERE"
                              " supervision_id = ?",
                              (supervision_id,))
                          if not row:
                              raise KeyError(supervision_id)
                          return {"supervision_id":
                                      str(row["supervision_id"]),
                                  "status": str(row["status"])}

                      def create_policy(self, *, title, scope="NATIONAL",
                                        detail="") -> dict:
                          if not str(title).strip():
                              raise ValueError("title requerido")
                          pid = "SMPOL-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_policies"
                                  " (policy_id, title, scope,"
                                  " status, detail, created_at)"
                                  " VALUES (?, ?, ?, 'DRAFT', ?, ?)",
                                  (pid, str(title).strip(), scope,
                                   str(detail), now))
                          return self.get_policy(pid)

                      def get_policy(self, policy_id
                                     ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_policies WHERE"
                              " policy_id = ?", (policy_id,))
                          if not row:
                              return None
                          return {"policy_id":
                                      str(row["policy_id"]),
                                  "title": str(row["title"]),
                                  "scope": str(row["scope"]),
                                  "status": str(row["status"]),
                                  "detail": str(row["detail"])}

                      def activate_policy(self, policy_id) -> dict:
                          self._db.execute(
                              "UPDATE sm_policies SET status ="
                              " 'ACTIVE' WHERE policy_id = ?",
                              (policy_id,))
                          return self.get_policy(policy_id)

                      def ministry_dashboard(self, *,
                                             registry,
                                             enrollment_engine=None
                                             ) -> Dict:
                          """Snapshot nacional para MINED."""
                          institutions = registry.list_all()
                          total_enrolled = 0
                          if enrollment_engine is not None:
                              for inst in institutions:
                                  roster = (enrollment_engine.
                                            roster(
                                                inst["institution_id"],
                                                "2026"))
                                  total_enrolled = (total_enrolled
                                                    + len(roster))
                          return {"dashboard": "MINISTRY_VIEW",
                                  "institutions":
                                      len(institutions),
                                  "enrolled_2026":
                                      total_enrolled,
                                  "generated_at":
                                      self._clock.now()}
              '''))

              forzar(AN + "/analytics_engine.py", D(r'''
                  """Analytics Engine - analitica educativa (SM5).
                  Rendimiento por estudiante, escuela y nacion a
                  partir de evaluaciones reales. Decimal 2d (61)."""
                  from __future__ import annotations
                  from decimal import (Decimal as _D,
                                       ROUND_HALF_UP as _UP)
                  from typing import Dict, List
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)

                  _Q = "0.01"

                  class AnalyticsEngine:
                      """Analitica educativa (Decimal 2d)."""

                      def __init__(self, db, clock,
                                   evaluation_engine,
                                   student_registry=None):
                          self._db = db
                          self._clock = clock
                          self._eval = evaluation_engine
                          self._students = student_registry

                      def student_report(self, student_id) -> Dict:
                          bd = self._eval.subject_breakdown(
                              student_id)
                          avg = self._eval.average_of(student_id)
                          best = (max(bd, key=lambda x: float(
                              x["average"])) if bd else None)
                          worst = (min(bd, key=lambda x: float(
                              x["average"])) if bd else None)
                          return {"student_id": student_id,
                                  "average": avg["average"],
                                  "evaluations": avg["count"],
                                  "subjects": bd,
                                  "best_subject": (best["subject"]
                                                   if best
                                                   else None),
                                  "weak_subject": (worst["subject"]
                                                   if worst
                                                   else None)}

                      def school_report(self, student_ids,
                                        institution_id) -> Dict:
                          from decimal import Decimal as _D
                          vals = []
                          per_student = []
                          for sid in student_ids:
                              r = self.student_report(sid)
                              try:
                                  v = float(r["average"])
                              except Exception:
                                  continue
                              vals.append(v)
                              per_student.append({
                                  "student_id": sid,
                                  "average": r["average"],
                                  "evaluations":
                                      r["evaluations"]})
                          if vals:
                              savg = str((_D(str(sum(vals)))
                                          / _D(str(len(vals)))
                                          ).quantize(_D(_Q)))
                          else:
                              savg = "0.00"
                          return {"institution_id":
                                      institution_id,
                                  "students": len(vals),
                                  "school_average": savg,
                                  "per_student": per_student}

                      def national_report(self, institution_ids,
                                          student_registry,
                                          enrollment_engine=None
                                          ) -> Dict:
                          from decimal import Decimal as _D
                          all_vals = []
                          by_inst = []
                          for iid in institution_ids:
                              students = (student_registry.
                                          by_institution(iid))
                              ids = [s["student_id"]
                                     for s in students]
                              rep = self.school_report(
                                  ids, iid)
                              try:
                                  all_vals.append(float(
                                      rep["school_average"]))
                              except Exception:
                                  continue
                              by_inst.append(rep)
                          if all_vals:
                              navg = str((_D(str(sum(all_vals)))
                                          / _D(str(len(all_vals)))
                                          ).quantize(_D(_Q)))
                          else:
                              navg = "0.00"
                          return {"report": "NATIONAL_EDUCATION",
                                  "institutions": len(all_vals),
                                  "national_average": navg,
                                  "by_institution": by_inst,
                                  "generated_at":
                                      self._clock.now()}
              '''))

              forzar(RE + "/report_engine.py", D(r'''
                  """Report Engine - reportes formales SEMILLA (SM5).
                  Genera, persiste y recupera reportes JSON con tipo
                  y periodo. Patron NEXO reports."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import json as _j
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_reports", (
                          "CREATE TABLE IF NOT EXISTS sm_reports (report_id TEXT PRIMARY KEY, report_type TEXT NOT NULL, institution_id TEXT NOT NULL DEFAULT '', period TEXT NOT NULL DEFAULT '', payload_json TEXT NOT NULL DEFAULT '{}', created_at REAL NOT NULL)",
                      )),
                  )

                  class SemillaReportEngine:
                      """Reportes formales persistidos."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.reports",
                                          _MIGRATIONS).run(clock)

                      def generate(self, *, report_type,
                                   institution_id="", period="",
                                   data=None) -> dict:
                          if not str(report_type).strip():
                              raise ValueError(
                                  "report_type requerido")
                          if data is None or not isinstance(
                                  data, dict):
                              raise ValueError(
                                  "data requerida (objeto)")
                          rid = "SMRPT-" + str(uuid.uuid4())
                          now = self._clock.now()
                          payload = {"report_id": rid,
                                     "report_type": report_type,
                                     "institution_id":
                                         institution_id,
                                     "period": period,
                                     "data": data,
                                     "generated_at": now}
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_reports"
                                  " (report_id, report_type,"
                                  " institution_id, period,"
                                  " payload_json, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?)",
                                  (rid, report_type,
                                   institution_id, period,
                                   _j.dumps(payload,
                                            default=str), now))
                          return payload

                      def get(self, report_id) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT payload_json FROM"
                              " sm_reports WHERE report_id = ?",
                              (report_id,))
                          if not row:
                              return None
                          return _j.loads(str(row["payload_json"]))

                      def list_of(self, institution_id,
                                  period="") -> List[dict]:
                          if period:
                              rows = self._db.query_all(
                                  "SELECT payload_json FROM"
                                  " sm_reports WHERE"
                                  " institution_id = ? AND"
                                  " period = ? ORDER BY"
                                  " created_at",
                                  (institution_id, period))
                          else:
                              rows = self._db.query_all(
                                  "SELECT payload_json FROM"
                                  " sm_reports WHERE"
                                  " institution_id = ?"
                                  " ORDER BY created_at",
                                  (institution_id,))
                          return [_j.loads(str(r["payload_json"]))
                                  for r in rows]
              '''))

              out("## FIN SM5 builder")
          except Exception:
              out("## SM5 BUILDER ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] SM6 eventos + bus + bridge a la Red"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          EV = "apps/semilla/events"
          SE = "apps/semilla/services"

          try:
              forzar(EV + "/contracts.py", D(r'''
                  """Contratos de eventos SEMILLA_* (catalogo oficial
                  SM6). Fuente unica de nombres. make_event valida
                  que el evento este catalogado (produccion real,
                  sin improvisar)."""
                  from __future__ import annotations
                  import uuid

                  SOURCE = "semilla"
                  EVENT_VERSION = "1.0"

                  SEMILLA_STUDENT_REGISTERED = "SEMILLA_STUDENT_REGISTERED"
                  SEMILLA_ENROLLED = "SEMILLA_ENROLLED"
                  SEMILLA_ATTENDANCE_LOW = "SEMILLA_ATTENDANCE_LOW"
                  SEMILLA_TALENT_DETECTED = "SEMILLA_TALENT_DETECTED"
                  SEMILLA_SCHOLARSHIP_APPROVED = "SEMILLA_SCHOLARSHIP_APPROVED"
                  SEMILLA_GRADE_POSTED = "SEMILLA_GRADE_POSTED"
                  SEMILLA_PERIOD_ADVANCED = "SEMILLA_PERIOD_ADVANCED"
                  SEMILLA_CERTIFIED = "SEMILLA_CERTIFIED"
                  SEMILLA_DROPOUT_RISK = "SEMILLA_DROPOUT_RISK"

                  SEMILLA_EVENTS = (
                      SEMILLA_STUDENT_REGISTERED, SEMILLA_ENROLLED,
                      SEMILLA_ATTENDANCE_LOW,
                      SEMILLA_TALENT_DETECTED,
                      SEMILLA_SCHOLARSHIP_APPROVED,
                      SEMILLA_GRADE_POSTED,
                      SEMILLA_PERIOD_ADVANCED,
                      SEMILLA_CERTIFIED, SEMILLA_DROPOUT_RISK)

                  def is_valid_event(name) -> bool:
                      return name in SEMILLA_EVENTS

                  def make_event(name, student_id="",
                                 payload=None,
                                 occurred_at=None) -> dict:
                      if not is_valid_event(name):
                          raise ValueError("evento no catalogado: "
                                           + str(name))
                      return {"event_id": "SMSEVT-"
                              + str(uuid.uuid4()),
                              "event": name, "source": SOURCE,
                              "version": EVENT_VERSION,
                              "student_id": str(student_id),
                              "payload": dict(payload or {}),
                              "occurred_at": occurred_at}
              '''))

              forzar("apps/semilla/infrastructure/messaging/message_bus.py", D(r'''
                  """Message bus SEMILLA (adaptador fino, regla 69).
                  Patron NEXO message_bus: si hay outbox inyectado
                  lo usa (duck-typing por alias); si no, buffer local
                  marcado como degradado. Idempotente."""
                  from __future__ import annotations
                  from typing import List
                  import json as _j

                  class SemillaMessageBus:
                      """Bus interno SEMILLA: publish + drain +
                      pending."""

                      def __init__(self, outbox=None, clock=None):
                          self._outbox = outbox
                          self._clock = clock
                          self._buffer = []

                      def _publish_external(self, event) -> bool:
                          if self._outbox is None:
                              return False
                          for name in ("append", "enqueue",
                                       "publish", "put", "add"):
                              m = getattr(self._outbox, name,
                                          None)
                              if callable(m):
                                  try:
                                      m(event)
                                      return True
                                  except TypeError:
                                      try:
                                          m(_j.dumps(event,
                                                     default=str))
                                          return True
                                      except Exception:
                                          return False
                                  except Exception:
                                      return False
                          return False

                      def publish(self, event) -> dict:
                          delivered = self._publish_external(event)
                          if not delivered:
                              self._buffer.append(event)
                          return {"event_id":
                                      event.get("event_id"),
                                  "event": event.get("event"),
                                  "delivered_to_network":
                                      delivered,
                                  "buffered": not delivered}

                      def drain(self, limit=100) -> List[dict]:
                          taken = self._buffer[:limit]
                          self._buffer = self._buffer[limit:]
                          return taken

                      def pending(self) -> int:
                          return len(self._buffer)
              '''))

              forzar(SE + "/semilla_bridge.py", D(r'''
                  """SemillaBridge - composicion con el nucleo vivo
                  (SM6, SE-1 intacto). Une: bus de eventos SEMILLA_*,
                  tutor/store/link existentes. feed_talent() registra
                  el talento detectado en el historial de la Red via
                  semilla_link.record_milestone() (delegacion, cero
                  duplicar — regla 69). Degradacion honesta: sin
                  link los eventos quedan en buffer."""
                  from __future__ import annotations
                  from apps.semilla.events.contracts import make_event
                  from apps.semilla.infrastructure.messaging.message_bus import (
                      SemillaMessageBus)

                  class SemillaBridge:
                      """Raiz de composicion de SEMILLA en vivo."""

                      def __init__(self, semilla_link=None,
                                   clock=None):
                          self.clock = clock
                          self.link = semilla_link
                          self.bus = SemillaMessageBus(clock=clock)

                      def emit(self, event, student_id="",
                               payload=None) -> dict:
                          ev = make_event(
                              event, student_id=student_id,
                              payload=payload,
                              occurred_at=(self.clock.now()
                                           if self.clock
                                           else None))
                          return self.bus.publish(ev)

                      def drain_events(self, limit=100) -> list:
                          return self.bus.drain(limit)

                      def feed_talent(self, *, student_id,
                                      category, detail="") -> dict:
                          """Talento detectado -> evento catalogado
                          + milestone en el historial de la Red via
                          link real (best-effort, degradacion
                          honesta)."""
                          r = self.emit("SEMILLA_TALENT_DETECTED",
                              student_id=student_id,
                              payload={"category": category,
                                       "detail": detail})
                          net = False
                          if self.link is not None:
                              try:
                                  self.link.record_milestone(
                                      student_id, "talento",
                                      category + ": " + detail)
                                  net = True
                              except Exception:
                                  net = False
                          return {"event": r,
                                  "network_history": net}

                      def feed_certification(self, *, student_id,
                                             title, detail="") -> dict:
                          r = self.emit("SEMILLA_CERTIFIED",
                              student_id=student_id,
                              payload={"title": title,
                                       "detail": detail})
                          net = False
                          if self.link is not None:
                              try:
                                  self.link.record_milestone(
                                      student_id, "certificacion",
                                      title + ": " + detail)
                                  net = True
                              except Exception:
                                  net = False
                          return {"event": r,
                                  "network_history": net}

                      def status(self) -> dict:
                          return {"events_pending":
                                      self.bus.pending(),
                                  "link_available":
                                      self.link is not None}
              '''))

              out("## FIN SM6 builder")
          except Exception:
              out("## SM6 BUILDER ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] SM5+SM6 tests"
