name: "ETAPA 3 ID-c v2: 9 engines (fix 2 imports json + assert corregido) + tests + regresion"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "ConsentLedgerEngine (ID-3) — ya paso verde en v1"
        if: always()
        run: |
          cat > shared_engines/identity/consent_ledger_engine.py << 'EOF'
          """Consent Ledger Engine (ID-3) - registro INMUTABLE
          de consentimientos por proposito: append-only con
          hash-chain por ZID (patron LifeHistory). Reglas 63/66/76."""
          from __future__ import annotations
          import hashlib, json, uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_consent_ledger", (
                  "CREATE TABLE IF NOT EXISTS"
                  " zid_consent_ledger (entry_id TEXT PRIMARY"
                  " KEY, zid TEXT NOT NULL, purpose TEXT NOT"
                  " NULL, app TEXT NOT NULL DEFAULT '', state"
                  " TEXT NOT NULL, scope_json TEXT NOT NULL"
                  " DEFAULT '[]', expires_at REAL, prev_hash"
                  " TEXT NOT NULL DEFAULT '', entry_hash TEXT"
                  " NOT NULL, created_at REAL NOT NULL)",
                  "CREATE INDEX ix_cl_zid ON"
                  " zid_consent_ledger (zid, purpose)",
              )),
          )


          def _sha(t):
              return hashlib.sha256(
                  t.encode("utf-8")).hexdigest()


          class ConsentLedgerEngine:
              """Ledger inmutable de consentimientos (ID-3)."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.consentled",
                                  _MIGRATIONS).run(clock)

              def _append(self, zid, purpose, app, state,
                          scope, expires_at):
                  prev = self._db.query_one(
                      "SELECT entry_hash FROM"
                      " zid_consent_ledger WHERE zid = ?"
                      " ORDER BY rowid DESC LIMIT 1",
                      (str(zid),))
                  ph = (str(prev["entry_hash"])
                        if prev else "GENESIS")
                  eid = "ZCL-" + uuid.uuid4().hex[:10]
                  now = self._clock.now()
                  eh = _sha(ph + "|" + eid + "|" + str(zid)
                            + "|" + purpose + "|" + state
                            + "|" + str(expires_at))
                  self._db.execute(
                      "INSERT INTO zid_consent_ledger"
                      " (entry_id, zid, purpose, app, state,"
                      " scope_json, expires_at, prev_hash,"
                      " entry_hash, created_at)"
                      " VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)",
                      (eid, str(zid), str(purpose), str(app),
                       state, json.dumps(list(scope or [])),
                       expires_at, ph, eh, now))
                  return {"entry_id": eid, "entry_hash": eh}

              def grant(self, *, zid, purpose, app="",
                        scope=None, expires_at=None):
                  if not str(zid).strip() or \
                          not str(purpose).strip():
                      raise ValueError(
                          "zid y purpose requeridos")
                  r = self._append(zid, purpose, str(app),
                                   "granted", scope,
                                   (float(expires_at)
                                    if expires_at is not None
                                    else None))
                  return {"ok": True,
                          "entry_id": r["entry_id"]}

              def revoke(self, *, zid, purpose, app=""):
                  st = self.state_of(zid=zid,
                                     purpose=purpose,
                                     app=app)
                  if not st.get("granted"):
                      raise ValueError(
                          "no hay consentimiento activo")
                  r = self._append(zid, purpose, str(app),
                                   "revoked", None, None)
                  return {"ok": True,
                          "entry_id": r["entry_id"]}

              def check(self, *, zid, purpose, app=""):
                  now = self._clock.now()
                  row = self._db.query_one(
                      "SELECT state, expires_at FROM"
                      " zid_consent_ledger WHERE zid = ?"
                      " AND purpose = ? AND app = ? ORDER"
                      " BY rowid DESC LIMIT 1",
                      (str(zid), str(purpose), str(app)))
                  if row is None:
                      return {"granted": False,
                              "reason": "sin registro"}
                  if str(row["state"]) != "granted":
                      return {"granted": False,
                              "reason": "revocado"}
                  if row["expires_at"] is not None and \
                          float(row["expires_at"]) <= now:
                      return {"granted": False,
                              "reason": "expirado"}
                  return {"granted": True}

              def state_of(self, *, zid, purpose, app=""):
                  row = self._db.query_one(
                      "SELECT state FROM zid_consent_ledger"
                      " WHERE zid = ? AND purpose = ? AND"
                      " app = ? ORDER BY rowid DESC LIMIT 1",
                      (str(zid), str(purpose), str(app)))
                  if row is None:
                      return {"granted": False}
                  return {"granted":
                              str(row["state"])
                              == "granted",
                          "state": str(row["state"])}
          EOF
          python3 -m py_compile shared_engines/identity/consent_ledger_engine.py && echo "consent_ledger: OK"

      - name: "PresentationEngine (ID-7) — ya paso verde en v1"
        if: always()
        run: |
          cat > shared_engines/identity/presentation_engine.py << 'EOF'
          """Presentation Engine (ID-7) - presentaciones
          verificables con selective disclosure + sello HMAC.
          Reglas 63/66/76."""
          from __future__ import annotations
          import hashlib, hmac, json, os, uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_presentations", (
                  "CREATE TABLE IF NOT EXISTS"
                  " zid_presentations (pres_id TEXT PRIMARY"
                  " KEY, zid TEXT NOT NULL, fields_json TEXT"
                  " NOT NULL, nonce TEXT NOT NULL, seal TEXT"
                  " NOT NULL, verified INTEGER NOT NULL"
                  " DEFAULT 0, created_at REAL NOT NULL)",
              )),
          )


          class PresentationEngine:
              """Presentaciones verificables (ID-7)."""

              def __init__(self, db: Database, clock: Clock,
                           master_key=None):
                  self._db = db
                  self._clock = clock
                  self._master = (str(master_key)
                                  if master_key
                                  else os.environ.get(
                                      "ZYRA_ROOT_KEY", "")
                                  or "zyra-default-dev-key")
                  MigrationRunner(db, "zid.present",
                                  _MIGRATIONS).run(clock)

              def _seal(self, zid, fields, nonce):
                  payload = json.dumps(
                      {"zid": str(zid), "fields": fields,
                       "nonce": nonce}, sort_keys=True)
                  return hmac.new(
                      self._master.encode(),
                      payload.encode(),
                      hashlib.sha256).hexdigest()

              def present(self, *, zid, fields, verifier=""):
                  if not str(zid).strip():
                      raise ValueError("zid requerido")
                  if not fields or not isinstance(fields,
                                                  dict):
                      raise ValueError(
                          "fields debe ser objeto no vacio")
                  nonce = os.urandom(16).hex()
                  seal = self._seal(zid, fields, nonce)
                  pid = "ZPR-" + uuid.uuid4().hex[:10]
                  self._db.execute(
                      "INSERT INTO zid_presentations (pres_id,"
                      " zid, fields_json, nonce, seal, verified,"
                      " created_at) VALUES (?, ?, ?, ?, ?, 0, ?)",
                      (pid, str(zid),
                       json.dumps(fields, sort_keys=True),
                       nonce, seal, self._clock.now()))
                  return {"pres_id": pid, "nonce": nonce,
                          "seal": seal, "fields": dict(fields)}

              def verify(self, pres_id, *, zid, fields, nonce,
                         seal):
                  row = self._db.query_one(
                      "SELECT fields_json, nonce, seal FROM"
                      " zid_presentations WHERE pres_id = ?"
                      " AND zid = ?",
                      (str(pres_id), str(zid)))
                  if row is None:
                      return {"valid": False,
                              "reason": "no encontrada"}
                  expected = self._seal(zid, fields, nonce)
                  if expected != str(seal):
                      return {"valid": False,
                              "reason": "sello invalido"
                                        " (datos alterados)"}
                  if (json.loads(str(row["fields_json"]))
                          != fields
                          or str(row["nonce"])
                          != str(nonce)):
                      return {"valid": False,
                              "reason": "no coincide con"
                                        " la presentacion"
                                        " original"}
                  self._db.execute(
                      "UPDATE zid_presentations SET verified"
                      " = 1 WHERE pres_id = ?",
                      (str(pres_id),))
                  return {"valid": True,
                          "fields": dict(fields)}

              def presentations_of(self, zid):
                  rows = self._db.query_all(
                      "SELECT pres_id, verified FROM"
                      " zid_presentations WHERE zid = ?"
                      " ORDER BY rowid", (str(zid),))
                  return [{"pres_id": str(r["pres_id"]),
                           "verified": bool(
                               int(r["verified"]))}
                          for r in rows]
          EOF
          python3 -m py_compile shared_engines/identity/presentation_engine.py && echo "presentation: OK"

      - name: "GovernanceEngine (ID-5) — ya paso verde en v1"
        if: always()
        run: |
          cat > shared_engines/identity/governance_engine.py << 'EOF'
          """Identity Governance Engine (ID-5) - politicas
          versionadas + decisiones. Reglas 63/66/76."""
          from __future__ import annotations
          import json, uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_gov", (
                  "CREATE TABLE IF NOT EXISTS"
                  " zid_gov_policies (policy_id TEXT PRIMARY"
                  " KEY, name TEXT NOT NULL, rule_json TEXT NOT"
                  " NULL, version INTEGER NOT NULL DEFAULT 1,"
                  " status TEXT NOT NULL DEFAULT 'activa',"
                  " created_by TEXT NOT NULL DEFAULT '',"
                  " created_at REAL NOT NULL)",
                  "CREATE TABLE IF NOT EXISTS"
                  " zid_gov_decisions (decision_id TEXT PRIMARY"
                  " KEY, policy_id TEXT NOT NULL, subject_zid"
                  " TEXT NOT NULL, decision TEXT NOT NULL,"
                  " reason TEXT NOT NULL DEFAULT '', decided_by"
                  " TEXT NOT NULL DEFAULT '', created_at REAL"
                  " NOT NULL)",
              )),
          )
          _ACTIONS = ("register", "verify", "suspend",
                      "revoke", "export", "delete")


          class GovernanceEngine:
              """Gobierno de identidad (ID-5)."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.gov",
                                  _MIGRATIONS).run(clock)

              def create_policy(self, *, name, rule,
                                created_by=""):
                  if not str(name).strip():
                      raise ValueError("name requerido")
                  if not isinstance(rule, dict) or not rule:
                      raise ValueError(
                          "rule debe ser objeto no vacio")
                  pid = "ZGP-" + uuid.uuid4().hex[:10]
                  self._db.execute(
                      "INSERT INTO zid_gov_policies (policy_id,"
                      " name, rule_json, version, status,"
                      " created_by, created_at)"
                      " VALUES (?, ?, ?, 1, 'activa', ?, ?)",
                      (pid, str(name),
                       json.dumps(rule, sort_keys=True),
                       str(created_by), self._clock.now()))
                  return {"policy_id": pid, "version": 1}

              def decide(self, *, policy_id, subject_zid,
                         action, approve, decided_by="",
                         reason=""):
                  row = self._db.query_one(
                      "SELECT policy_id FROM zid_gov_policies"
                      " WHERE policy_id = ?",
                      (str(policy_id),))
                  if row is None:
                      raise KeyError(policy_id)
                  if str(action) not in _ACTIONS:
                      raise ValueError("action debe ser "
                                       + "/".join(_ACTIONS))
                  if not str(subject_zid).strip():
                      raise ValueError(
                          "subject_zid requerido")
                  if not str(reason).strip():
                      raise ValueError(
                          "reason obligatoria (regla 66)")
                  did = "ZGD-" + uuid.uuid4().hex[:10]
                  dec = "approved" if approve else "rejected"
                  self._db.execute(
                      "INSERT INTO zid_gov_decisions"
                      " (decision_id, policy_id, subject_zid,"
                      " decision, reason, decided_by,"
                      " created_at) VALUES (?, ?, ?, ?, ?, ?,"
                      " ?)",
                      (did, str(policy_id),
                       str(subject_zid), dec, str(reason),
                       str(decided_by), self._clock.now()))
                  return {"decision_id": did,
                          "decision": dec}

              def decisions_of(self, subject_zid):
                  rows = self._db.query_all(
                      "SELECT decision_id, policy_id,"
                      " decision, reason FROM"
                      " zid_gov_decisions WHERE subject_zid ="
                      " ? ORDER BY rowid",
                      (str(subject_zid),))
                  return [{"decision_id": str(
                               r["decision_id"]),
                           "decision": str(r["decision"]),
                           "reason": str(r["reason"])}
                          for r in rows]
          EOF
          python3 -m py_compile shared_engines/identity/governance_engine.py && echo "governance: OK"

      - name: "AssuranceEngine (ID-1) — ya paso verde en v1"
        if: always()
        run: |
          cat > shared_engines/identity/assurance_engine.py << 'EOF'
          """Identity Assurance Engine (ID-1) - niveles L0..L3
          por evidencia. Reglas 63/66/76."""
          from __future__ import annotations
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_assurance", (
                  "CREATE TABLE IF NOT EXISTS zid_assurance ("
                  " zid TEXT PRIMARY KEY, level TEXT NOT NULL,"
                  " evidence_json TEXT NOT NULL DEFAULT '[]',"
                  " updated_at REAL NOT NULL)",
              )),
          )


          class AssuranceEngine:
              """Niveles de assurance por evidencia (ID-1)."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.assurance",
                                  _MIGRATIONS).run(clock)

              def compute(self, *, zid, has_active_zid=False,
                          has_biometrics=False,
                          has_official_doc=False):
                  if not str(zid).strip():
                      raise ValueError("zid requerido")
                  level = "L0"
                  evid = []
                  if has_active_zid:
                      level = "L1"
                      evid.append("zid_activo")
                  if has_biometrics:
                      level = "L2"
                      evid.append("biometria")
                  if has_official_doc and has_biometrics:
                      level = "L3"
                      evid.append("documento_oficial")
                  self._db.execute(
                      "INSERT OR REPLACE INTO zid_assurance"
                      " (zid, level, evidence_json, updated_at)"
                      " VALUES (?, ?, ?, ?)",
                      (str(zid), level, str(evid),
                       self._clock.now()))
                  return {"zid": str(zid), "level": level,
                          "evidence": evid}

              def level_of(self, zid):
                  row = self._db.query_one(
                      "SELECT level FROM zid_assurance WHERE"
                      " zid = ?", (str(zid),))
                  if row is None:
                      return {"zid": str(zid), "level": "L0",
                              "note": "sin evidencia"}
                  return {"zid": str(zid),
                          "level": str(row["level"])}
          EOF
          python3 -m py_compile shared_engines/identity/assurance_engine.py && echo "assurance: OK"

      - name: "FederationAdaptersEngine (ID-2) — ya paso verde en v1"
        if: always()
        run: |
          cat > shared_engines/identity/federation_adapters_engine.py << 'EOF'
          """Federation Adapters Engine (ID-2) - ZIDs con
          proveedores externos. Reglas 63/66/76."""
          from __future__ import annotations
          import uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_federation", (
                  "CREATE TABLE IF NOT EXISTS"
                  " zid_federation_links (link_id TEXT PRIMARY"
                  " KEY, zid TEXT NOT NULL, provider TEXT NOT"
                  " NULL, external_id TEXT NOT NULL, status"
                  " TEXT NOT NULL DEFAULT 'linked', created_at"
                  " REAL NOT NULL, UNIQUE(provider,"
                  " external_id))",
              )),
          )
          _PROVIDERS = ("GOOGLE", "MICROSOFT", "GOBSV",
                        "CUSTOM")


          class FederationAdaptersEngine:
              """Federacion de identidad (ID-2)."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.fed",
                                  _MIGRATIONS).run(clock)

              def link_identity(self, *, zid, provider,
                                external_id):
                  if not str(zid).strip() or \
                          not str(external_id).strip():
                      raise ValueError(
                          "zid y external_id requeridos")
                  p = str(provider).upper()
                  if p not in _PROVIDERS:
                      raise ValueError("provider debe ser "
                                       + "/".join(_PROVIDERS))
                  dup = self._db.query_one(
                      "SELECT link_id, zid FROM"
                      " zid_federation_links WHERE provider ="
                      " ? AND external_id = ?",
                      (p, str(external_id)))
                  if dup is not None:
                      raise ValueError(
                          "external_id ya vinculado a "
                          + str(dup["zid"]) + " (regla 66)")
                  lid = "ZFL-" + uuid.uuid4().hex[:10]
                  self._db.execute(
                      "INSERT INTO zid_federation_links"
                      " (link_id, zid, provider, external_id,"
                      " status, created_at) VALUES (?, ?, ?,"
                      " ?, 'linked', ?)",
                      (lid, str(zid), p, str(external_id),
                       self._clock.now()))
                  return {"link_id": lid, "provider": p}

              def unlink_identity(self, *, zid, provider):
                  rows = self._db.query_all(
                      "SELECT link_id FROM zid_federation_links"
                      " WHERE zid = ? AND provider = ?",
                      (str(zid), str(provider).upper()))
                  if not rows:
                      raise LookupError(
                          "sin vinculos para ese zid/"
                          "provider")
                  for r in rows:
                      self._db.execute(
                          "DELETE FROM zid_federation_links"
                          " WHERE link_id = ?",
                          (str(r["link_id"]),))
                  return {"removed": len(rows)}

              def zid_of_external(self, *, provider,
                                  external_id):
                  row = self._db.query_one(
                      "SELECT zid FROM zid_federation_links"
                      " WHERE provider = ? AND external_id ="
                      " ?", (str(provider).upper(),
                             str(external_id)))
                  if row is None:
                      return {"found": False}
                  return {"found": True,
                          "zid": str(row["zid"])}

              def links_of(self, zid):
                  rows = self._db.query_all(
                      "SELECT provider, external_id FROM"
                      " zid_federation_links WHERE zid = ?"
                      " ORDER BY rowid", (str(zid),))
                  return [{"provider": str(r["provider"]),
                           "external_id": str(
                               r["external_id"])}
                          for r in rows]
          EOF
          python3 -m py_compile shared_engines/identity/federation_adapters_engine.py && echo "federation: OK"

      - name: "OidcBridgeEngine (ID-10) — FIX import json"
        if: always()
        run: |
          cat > shared_engines/identity/oidc_bridge_engine.py << 'EOF'
          """OIDC Bridge Engine (ID-10) - scopes OIDC estandar,
          tokens con expiracion, introspeccion, revocacion.
          Reglas 63/66/76."""
          from __future__ import annotations
          import hashlib, json, secrets, uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_oidc_tokens", (
                  "CREATE TABLE IF NOT EXISTS zid_oidc_tokens ("
                  " token_id TEXT PRIMARY KEY, zid TEXT NOT"
                  " NULL, client_id TEXT NOT NULL, token_hash"
                  " TEXT NOT NULL, scopes_json TEXT NOT NULL"
                  " DEFAULT '[]', expires_at REAL NOT NULL,"
                  " revoked INTEGER NOT NULL DEFAULT 0,"
                  " created_at REAL NOT NULL)",
              )),
          )
          _SCOPES = ("openid", "profile", "email", "agro",
                     "semilla", "nexo")


          def _sha(t):
              return hashlib.sha256(
                  t.encode("utf-8")).hexdigest()


          class OidcBridgeEngine:
              """Puente OIDC sobre ZID (ID-10)."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.oidc",
                                  _MIGRATIONS).run(clock)

              def issue_token(self, *, zid, client_id,
                              scopes, ttl_seconds=3600.0):
                  if not str(zid).strip() or \
                          not str(client_id).strip():
                      raise ValueError(
                          "zid y client_id requeridos")
                  sc = [str(s).lower()
                        for s in (scopes or [])]
                  if not sc:
                      raise ValueError(
                          "scopes requeridos (regla 66)")
                  for s in sc:
                      if s not in _SCOPES:
                          raise ValueError(
                              "scope invalido: " + s
                              + " (validos: "
                              + "/".join(_SCOPES) + ")")
                  token = "ZT-" + secrets.token_urlsafe(24)
                  tid = "ZOT-" + uuid.uuid4().hex[:10]
                  exp = self._clock.now() + float(ttl_seconds)
                  self._db.execute(
                      "INSERT INTO zid_oidc_tokens (token_id,"
                      " zid, client_id, token_hash, scopes_json,"
                      " expires_at, revoked, created_at)"
                      " VALUES (?, ?, ?, ?, ?, ?, 0, ?)",
                      (tid, str(zid), str(client_id),
                       _sha(token), json.dumps(sc), exp,
                       self._clock.now()))
                  return {"token": token,
                          "expires_in": int(ttl_seconds),
                          "scopes": sc}

              def introspect(self, token):
                  row = self._db.query_one(
                      "SELECT zid, client_id, scopes_json,"
                      " expires_at, revoked FROM"
                      " zid_oidc_tokens WHERE token_hash = ?",
                      (_sha(str(token)),))
                  if row is None:
                      return {"active": False,
                              "reason": "desconocido"}
                  if int(row["revoked"]) == 1:
                      return {"active": False,
                              "reason": "revocado"}
                  if float(row["expires_at"]) <= \
                          self._clock.now():
                      return {"active": False,
                              "reason": "expirado"}
                  return {"active": True,
                          "zid": str(row["zid"]),
                          "client_id": str(
                              row["client_id"]),
                          "scopes": json.loads(
                              str(row["scopes_json"]))}

              def revoke_token(self, token):
                  row = self._db.query_one(
                      "SELECT revoked FROM zid_oidc_tokens"
                      " WHERE token_hash = ?",
                      (_sha(str(token)),))
                  if row is None:
                      raise LookupError("no existe")
                  if int(row["revoked"]) == 1:
                      raise ValueError("ya revocado")
                  self._db.execute(
                      "UPDATE zid_oidc_tokens SET revoked = 1"
                      " WHERE token_hash = ?",
                      (_sha(str(token)),))
                  return {"revoked": True}
          EOF
          python3 -m py_compile shared_engines/identity/oidc_bridge_engine.py && echo "oidc: OK"

      - name: "MiZidEngine (ID-8) — ya paso verde en v1"
        if: always()
        run: |
          cat > shared_engines/identity/mi_zid_engine.py << 'EOF'
          """MI ZID Engine (ID-8) - vista agregada de TODO lo
          que la Red sabe de un ZID. Compone los engines
          existentes (regla 69: cada caller pasa lo que
          tenga; los ausentes se reportan)."""
          from __future__ import annotations
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database


          class MiZidEngine:
              """Vista agregada MI ZID (ID-8)."""

              def __init__(self, db: Database, clock: Clock,
                           identity_engine=None,
                           guardian_engine=None,
                           minor_biometrics_engine=None,
                           representation_engine=None):
                  self._db = db
                  self._clock = clock
                  self._ids = identity_engine
                  self._guardians = guardian_engine
                  self._minor_bio = minor_biometrics_engine
                  self._rep = representation_engine

              def portfolio(self, zid):
                  if not str(zid).strip():
                      raise ValueError("zid requerido")
                  out = {"zid": str(zid),
                         "identity": None,
                         "guardians": [],
                         "minors": [],
                         "biometrics_phase": None,
                         "representations": []}
                  if self._ids is not None:
                      try:
                          ident = self._ids.get_identity(
                              str(zid))
                          if ident is not None:
                              out["identity"] = {
                                  "status": ident.status
                                  .value,
                                  "kind": ident.kind.value,
                                  "display_name":
                                      ident.display_name}
                      except Exception:
                          pass
                  if self._guardians is not None:
                      try:
                          out["guardians"] = self \
                              ._guardians.guardians_of(
                              str(zid))
                          out["minors"] = self \
                              ._guardians.minors_of(
                              str(zid))
                      except Exception:
                          pass
                  if self._minor_bio is not None:
                      try:
                          out["biometrics_phase"] = self \
                              ._minor_bio.phase_of(
                              str(zid))["phase"]
                      except Exception:
                          pass
                  if self._rep is not None:
                      try:
                          out["representations"] = self \
                              ._rep.representations_of(
                              str(zid))
                      except Exception:
                          pass
                  return out
