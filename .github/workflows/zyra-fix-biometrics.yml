name: ZYRA AXIS Block 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lifehistory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Ensure life_history package marker
        run: |
          if [ ! -f apps/axis/life_history/__init__.py ]; then
            printf '"""AXIS Life History: verifiable life history from birth."""\n' > apps/axis/life_history/__init__.py
            echo "created life_history/__init__.py"
          else
            echo "already present"
          fi

      - name: 1/4 Birth registry tests (7 tests, tamper-evident chain)
        run: python -m apps.axis.life_history.store -v

      - name: 2/4 Security regression (biometrics 13 + PAD 3)
        run: |
          python -m shared_engines.security.biometrics -v
          python - <<'PYEOF'
          import unittest

          loader = unittest.TestLoader()
          from shared_engines.security import (
              biometrics_face,
          )

          suite = loader.loadTestsFromName(
              "shared_engines.security.biometrics_face"
              ".LivenessHeuristicTests"
          )
          result = unittest.TextTestRunner(
              verbosity=1
          ).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print("PAD OK")
          PYEOF

      - name: 3/4 AXIS tests stay green (7/7)
        run: python -m pytest apps/axis/tests -q

      - name: 4/4 Network transport regression (TCP 6)
        run: python -m network.transport.tcp_transport -v

      - name: Commit package marker (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/__init__.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "axis: life_history package marker - birth registry certified"
            git push
          fi
