name: "CONSOL-3A: crear server_shared + 5 mixins (ast.unparse, server.py SIN TOCAR) + compilar/smoke cada uno + commit — riesgo cero"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[3A] generar server_shared + 5 mixins (server.py INTACTO)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          NEW_FILES = []

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              tree = ast.parse(src)

              cls = css_node = page_fn = None
              srv_cls = serve_fn = None
              for node in tree.body:
                  if isinstance(node, ast.FunctionDef) and \
                          node.name == "_page":
                      page_fn = node
                  if isinstance(node, ast.Assign):
                      for t in node.targets:
                          if isinstance(t, ast.Name) and \
                                  t.id == "_CSS":
                              css_node = node
                  if isinstance(node, ast.ClassDef) and \
                          node.name == "AgroApiHandler":
                      cls = node
                  if isinstance(node, ast.ClassDef) and \
                          node.name == "AgroServer":
                      srv_cls = node
                  if isinstance(node, ast.FunctionDef) and \
                          node.name.startswith("serve_"):
                      serve_fn = node
              assert all(x is not None for x in
                         (cls, css_node, page_fn,
                          srv_cls, serve_fn)), \
                  "nodos base no hallados"

              # ---- server_shared.py: _CSS + _page ----
              shared = pathlib.Path(
                  "apps/agro/routers/server_shared.py")
              shared.write_text(
                  '"""AGRO server shared (A-18, regla 77):'
                  '\n_CSS + _page usados por el server y los'
                  ' mixins."""\n'
                  'from __future__ import annotations\n\n'
                  + ast.unparse(css_node) + "\n\n\n"
                  + ast.unparse(page_fn) + "\n",
                  encoding="utf-8")
              py_compile.compile(str(shared), doraise=True)
              NEW_FILES.append(str(shared))
              out("- **server_shared.py OK**")

              # ---- grupos de metodos ----
              GROUPS = {
                  "get_mixin.py": ("GetMixin",
                                   ["_get"]),
                  "post_mixin.py": ("PostMixin",
                                    ["_post"]),
                  "zyra_mixin.py": ("ZyraMixin",
                                    ["_ZYRA_AREAS_V2",
                                     "_ZYRA_EVENTS_V2",
                                     "_ZYRA_PAYLOAD_V2",
                                     "_ZYRA_MENUS_V2",
                                     "_ZYRA_MATRIX_V6",
                                     "_ZYRA_FN_V6",
                                     "_ZYRA_AUDIT_V6",
                                     "_ZYRA_AUDIT_VERIFY_V6",
                                     "_ZYRA_RATE_V6",
                                     "_ZYRA_IS_BLOCKED_V6",
                                     "_ZYRA_BLOCK_V6",
                                     "_ZYRA_UNBLOCK_V6",
                                     "_ZYRA_COM_D"]),
                  "aid_screens_mixin.py": (
                      "AidScreensMixin",
                      ["_aid_payload",
                       "_aid_network_seq",
                       "_aid_request",
                       "_aid_eligibility",
                       "_aid_approve",
                       "_aid_assign",
                       "_aid_deliver",
                       "_aid_confirm",
                       "_screen_ayudas",
                       "_screen_ayudas_gobierno",
                       "_screen_producer",
                       "_screen_government",
                       "_screen_bank", "_home"]),
                  "http_mixin.py": ("HttpMixin",
                                    ["_html", "_send",
                                     "_read_form",
                                     "_read_json", "_req"]),
              }

              node_map = {n.name: n for n in cls.body
                          if isinstance(n, ast.FunctionDef)}

              for fname, (gname, meths) in GROUPS.items():
                  parts = []
                  for m in meths:
                      node = node_map[m]
                      code = textwrap.indent(
                          ast.unparse(node), "    ")
                      parts.append(code)
                  src_m = (
                      '"""AGRO mixin (A-18, regla 77):'
                      ' metodos del handler.\n'
                      'self._page/_send/store resuelven por'
                      ' MRO cuando AgroApiHandler herede."""\n'
                      'from __future__ import annotations\n'
                      'import json  # noqa: F401\n'
                      'import uuid  # noqa: F401\n'
                      'from apps.agro.routers.server_shared'
                      ' import _page  # noqa: F401\n\n\n'
                      + "class " + gname + ":\n\n"
                      + "\n\n".join(parts) + "\n")
                  gp = pathlib.Path("apps/agro/routers/"
                                    + fname)
                  gp.write_text(src_m, encoding="utf-8")
                  py_compile.compile(str(gp), doraise=True)
                  NEW_FILES.append(str(gp))
                  out("- **mixin " + gname + " ("
                      + str(len(meths)) + " metodos) OK**")

              # ---- smoke: importar los 5 mixins ----
              import subprocess
              env = dict(os.environ)
              env["PYTHONPATH"] = (os.getcwd() + ":"
                                   + os.getcwd()
                                   + "/shared_engines")
              for fname, (gname, _) in GROUPS.items():
                  mod = ("apps.agro.routers."
                         + fname[:-3])
                  r = subprocess.run(
                      ["python3", "-c",
                       "import " + mod + " as m;"
                       " assert hasattr(m, '" + gname
                       + "'); print('ok')"],
                      capture_output=True, text=True,
                      env=env, timeout=60)
                  if r.returncode != 0:
                      raise RuntimeError(
                          mod + " no importa: "
                          + r.stderr[-300:])
                  out("- smoke " + gname + ": OK")

              # server.py SIN TOCAR
              chk = SP.read_text(encoding="utf-8")
              assert "AidMixin" not in chk, \
                  "server no debia cambiar"
              out("- server.py: INTACTO (verificado)")
              with open("/tmp/c3a_ok", "w") as f:
                  f.write("OK")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO — limpieza de archivos nuevos")
              for f in NEW_FILES:
                  try:
                      os.remove(f)
                  except Exception:
                      pass
              out("- **server.py NUNCA fue tocado — estado"
                  " estable intacto**")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              with open("/tmp/c3a_ok", "w") as f:
                  f.write("FAIL")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion AGRO (server intacto — debe pasar igual)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — server intacto" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed)" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -40 /tmp/x3.out; echo '```'; } >> "$SUM"
            echo "FAIL" > /tmp/c3a_ok
          fi
          exit 0

      - name: "[ENTREGA] commit de los archivos nuevos (server.py no cambia)"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/c3a_ok 2>/dev/null || echo FAIL)" != "OK" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**3A BLOQUEADA — archivos nuevos limpiados, estado estable intacto**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro/routers
          set +e
          if git diff --cached --quiet; then
            log "**3A: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(A-18 fase 3A, regla 77): server_shared.py (_CSS+_page) + 5 mixins extraidos con ast.unparse (GetMixin/_get, PostMixin/_post, ZyraMixin/13 helpers, AidScreensMixin/14 metodos, HttpMixin/5 primitivas) — server.py SIN TOCAR; los mixins se activan en 3B (solo 2 imports + bases de clase)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**3A OK — mixins committeados, server intacto. 3B: activar herencia en server.py (3 lineas de diff) + regresion.**"
          exit 0
