                                  " ORDER BY seq DESC LIMIT ?"
                                  " OFFSET ?",
                                  (int(limit), int(offset)),
                              )
                          except Exception:
                              got = None
                          if got:
                              return [dict(r) for r in got]
                  return []
          ''')

