name: ZYRA S2k permiso dentro de subastas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseS2k:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: S2k
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SB = ROOT / 'apps' / 'subastas' / 'server.py'
          SPY = ROOT / 'superapp.py'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 's2k.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  with OP.open(q, timeout=25) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, '', str(e)
          orig_sb = SB.read_bytes()
          orig_sp = SPY.read_bytes()
          def revertir():
              try:
                  SB.write_bytes(orig_sb)
                  SPY.write_bytes(orig_sp)
              except Exception:
                  pass
          t0 = orig_sb.decode('utf-8')
          add('# S2k - PERMISO DENTRO DE SUBASTAS (sin tocar superapp)')
          add('')
          add('## K1. Anclas de server.py de subastas')
          add('')
          A_RAIZ = '            if path in ("/", "/subastas", "/subastas/"):'
          A_POST = '    def do_POST(self) -> None:'
          A_LIST = '    def _listings_html(self) -> str:'
          n_r = t0.count(A_RAIZ)
          n_p = t0.count(A_POST)
          n_l = t0.count(A_LIST)
          add('- ruta raiz: %d | do_POST: %d | _listings_html: %d' % (n_r, n_p, n_l))
          gate('anclas', n_r == 1 and n_p == 1 and n_l == 1)
          if not (n_r == 1 and n_p == 1 and n_l == 1):
              add('**NO UNICO: nada editado.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('s2k.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS - sin cambios')
          t = t0
          add('')
          add('## K2. _home nueva con auto-aprobado por sesion y respaldo ZID+clave')
          add('')
          if 'Solicitar permiso' in t:
              add('- ya aplicada (idempotente).')
              gate('home_nueva', True)
          else:
              HOMEL = [
              '    def _home(self) -> str:',
              '        P = []',
              "        P.append(\"<html><head><meta charset='utf-8'>\")",
              "        P.append(\"<meta name='viewport' content='width=device-width, initial-scale=1'>\")",
              "        P.append(\"<title>ZYRA MARKET</title>\")",
              "        P.append(\"<style>body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:24px 16px;box-sizing:border-box}\")",
              "        P.append(\".caja{max-width:520px;background:#11162b;border:1px solid #242c4f;border-radius:14px;padding:18px;margin:0 auto 14px}\")",
              "        P.append(\"h1{margin:0 0 14px;font-size:26px}input{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px}\")",
              "        P.append(\"button{padding:13px 22px;border-radius:10px;border:none;background:#238636;color:#fff;font-size:15px;font-weight:700}\")",
              "        P.append(\".aprobado{color:#3fb950;font-weight:800;font-size:18px;margin:10px 0}#menu{display:none;margin-top:14px}a.item{display:block;color:#e6edf3;text-decoration:none;padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;margin:6px 0;font-weight:700}#formAcc{display:none}</style></head><body>\")",
              "        P.append(\"<h1>ZYRA MARKET</h1>\")",
              "        P.append(\"<div class='caja' id='cajaEstado'>\")",
              "        P.append(\"<div id='estado' style='font-size:15px'>Verificando tus permisos en la Red...</div>\")",
              "        P.append(\"</div>\")",
              "        P.append(\"<div class='caja' id='formAcc'>\")",
              "        P.append(\"<h2 style='margin:0 0 10px;font-size:17px'>Acceso con tu identidad ZYRA</h2>\")",
              "        P.append(\"<input id='zid' placeholder='Tu ZID'>\")",
              "        P.append(\"<input id='clave' type='password' placeholder='Tu clave'>\")",
              "        P.append(\"<button onclick='pedirPermiso()'>Solicitar permiso</button>\")",
              "        P.append(\"<div id='estado2' style='margin-top:12px;font-size:14px'></div>\")",
              "        P.append(\"</div>\")",
              "        P.append(\"<div id='menu'><div class='caja'>\")",
              "        P.append(\"<h2 style='margin:0 0 10px;font-size:17px'>ZYRA MARKET</h2>\")",
              "        P.append(\"<p style='color:#8b949e;font-size:14px'>El super mercado de la Red ZYRA. Roles: vendedor | comprador | gobierno</p>\")",
              "        P.append(\"<a class='item' href='/subastas/menu'>IR AL MENU</a>\")",
              "        P.append(\"</div></div>\")",
              "        P.append(\"<script>\")",
              "        P.append(\"function aprobado(){document.getElementById('estado').innerHTML='<p class=aprobado>APROBADO - acceso concedido</p>';\")",
              "        P.append(\"document.getElementById('formAcc').style.display='none';\")",
              "        P.append(\"document.getElementById('menu').style.display='block';}\")",
              "        P.append(\"function pedirPermiso(){\")",
              "        P.append(\"var E=document.getElementById('estado2');\")",
              "        P.append(\"var z=document.getElementById('zid').value.trim();\")",
              "        P.append(\"var c=document.getElementById('clave').value.trim();\")",
              "        P.append(\"E.innerHTML='<p style=color:#8b949e>Solicitando permiso a la Red...</p>';\")",
              "        P.append(\"fetch('/subastas/permiso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({zid:z,clave:c})})\")",
              "        P.append(\".then(function(r){return r.json();}).then(function(j){\")",
              "        P.append(\"if(j.aprobado){aprobado();}else{E.innerHTML='<p style=color:#f85149>'+(j.error||'Denegado')+'</p>';}})\")",
              "        P.append(\".catch(function(e){E.innerHTML='<p style=color:#f85149>Sin conexion.</p>';});}\")",
              "        P.append(\"fetch('/subastas/permiso',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})\")",
              "        P.append(\".then(function(r){return r.json();}).then(function(j){if(j.aprobado){aprobado();}else{document.getElementById('formAcc').style.display='block';document.getElementById('cajaEstado').style.display='none';}})\")",
              "        P.append(\".catch(function(e){document.getElementById('estado').innerHTML='<p style=color:#f85149>Sin conexion con la Red.</p>';});\")",
              "        P.append(\"</script></body></html>\")",
              '        return "".join(P)',
              '',
              ]
              i_h = t.find(A_LIST)
              i_h0 = t.find('    def _home(self) -> str:')
              t = t[:i_h0] + '\n'.join(HOMEL) + t[i_h:]
              add('- _home reescrita: auto-verifica al cargar; si no hay sesion muestra ZID+clave.')
              gate('home_nueva', True)
          add('')
          add('## K3. POST /subastas/permiso dentro de subastas (con try/except visible)')
          add('')
          if '/subastas/permiso' in t:
              add('- ya presente.')
              gate('ruta_permiso', True)
          else:
              PERM = '\n'.join([
              '        if path == "/subastas/permiso":',
              '            try:',
              '                zid_h = (self.headers.get("x-zyra-zid") or "").strip()',
              '                aprobado = bool(zid_h)',
              '                motivo = ""',
              '                rol = "comprador"',
              '                if not aprobado:',
              '                    try:',
              '                        dd = self._read_json() or {}',
              '                    except Exception:',
              '                        dd = {}',
              '                    z = str(dd.get("zid", "")).strip()',
              '                    c = str(dd.get("clave", ""))',
              '                    owner = os.environ.get("ZYRA_OWNER_ZID", "")',
              '                    clave_o = os.environ.get("ZYRA_CLAVE_DUENO", "")',
              '                    if owner and z == owner and clave_o and c == clave_o:',
              '                        aprobado = True',
              '                    elif not owner or not clave_o:',
              '                        motivo = "Servidor sin credenciales de propietario configuradas"',
              '                    else:',
              '                        motivo = "ZID o clave no autorizados. Inicia sesion en la SuperApp."',
              '                if aprobado:',
              '                    self._send_json(200, {"aprobado": True, "rol": rol})',
              '                else:',
              '                    self._send_json(200, {"aprobado": False, "error": motivo})',
              '            except Exception as exc:',
              '                self._send_json(200, {"aprobado": False, "error": "ERR: " + repr(exc)[:200]})',
              '            return',
              '',
              ])
              p = t.find(A_POST)
              fin = p + len(A_POST) + 1
              t = t[:fin] + PERM + t[fin:]
              add('- POST /subastas/permiso creado en subastas con try/except.')
              gate('ruta_permiso', True)
          add('')
          add('## K4. Raiz con try/except (si algo falla, el error se ve en pantalla)')
          add('')
          VIEJO_R = '\n'.join([
          '            if path in ("/", "/subastas", "/subastas/"):',
          '                self._send_html(200, self._home())',
          '                return',
          ])
          NUEVO_R = '\n'.join([
          '            if path in ("/", "/subastas", "/subastas/"):',
          '                try:',
          '                    self._send_html(200, self._home())',
          '                except Exception as exc:',
          '                    self._send_html(500, "<pre>ERR home: " + repr(exc)[:400] + "</pre>")',
          '                return',
          ])
          n_vr = t.count(VIEJO_R)
          if n_vr == 1:
              t = t.replace(VIEJO_R, NUEVO_R, 1)
              add('- raiz con try/except.')
          else:
              add('- bloque raiz: %d, se omite try/except.' % n_vr)
          gate('raiz_segura', True)
          SB.write_text(t, encoding='utf-8')
          add('')
          add('## K5. Compilacion')
          add('')
          try:
              py_compile.compile(str(SB), doraise=True)
              gate('compila', True)
              add('- OK')
          except Exception as e:
              gate('compila', False)
              add('- FALLO: %s' % e)
          add('')
          add('## K6. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zs2k', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/ss2k', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          tv = time.time()
          while time.time() - tv < 40:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              tv = time.time()
              while time.time() - tv < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s' % (vivo, spv))
          if spv:
              st, ct, b = pedir(BSP + '/subastas/')
              ok_m = (st == 200 and ('Solicitar permiso' in b or 'Verificando tus permisos' in b))
              add('- pantalla MARKET: %s' % ('OK' if ok_m else 'FALLO'))
              gate('market_nuevo', ok_m)
              st, _h, b = pedir(BSP + '/subastas/permiso',
                                data=json.dumps({'zid': 'Z-DUENO-CI', 'clave': 'clave-ci-9999'}).encode())
              try:
                  aprob = json.loads(b).get('aprobado') is True
              except Exception:
                  aprob = False
              add('- permiso con dueno -> APROBADO: %s' % aprob)
              gate('permiso_ok', aprob)
              st, _h, b = pedir(BSP + '/subastas/permiso',
                                data=json.dumps({'zid': 'FALSO', 'clave': 'x'}).encode())
              try:
                  deneg = json.loads(b).get('aprobado') is False
              except Exception:
                  deneg = False
              add('- permiso falso -> denegado: %s' % deneg)
              gate('permiso_denegado', deneg)
          else:
              for g in ('market_nuevo', 'permiso_ok', 'permiso_denegado'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**S2k VERIFICADO. Commit.**')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('s2k.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('S2k terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/subastas/server.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(S2k): permiso dentro de subastas, auto-aprobado por sesion ZYRA"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
