name: ZYRA Lectura 2 - App de Registro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lectura2:
    name: Leer app de registro (solo lectura)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Localizar y leer la app de registro
        run: |
          python3 - <<'PYEOF'
          import os, re, io, datetime

          ROOT = os.getcwd()
          OUT = []

          def p(s=""):
              OUT.append(str(s))

          TEXT_EXT = (".py", ".html", ".htm", ".js", ".css", ".json", ".txt", ".md", ".yml", ".yaml", ".sh", ".cfg", ".ini", ".ts", ".jsx", ".tsx", ".vue")
          SKIP_DIRS = {".git", "__pycache__", "node_modules"}

          p("======================================================================")
          p("ZYRA - LECTURA 2: APP DE REGISTRO EN PRODUCCION (erapp)")
          p("Fecha UTC: " + datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M"))
          p("SOLO LECTURA: no se crea ni modifica nada del repositorio.")
          p("Mision: ver el codigo de la app de registro (Crear mi ZID) para")
          p("preparar: control nombre-documento, pantalla de camara y el error 502.")
          p("======================================================================")

          LOCATORS = ["crear mi zid", "parser verificado", "zyra registro", "red de confianza digital", "paso 1", "dui", "selfie", "abrir cam", "tomar foto"]

          hits = {}
          for dirpath, dirnames, filenames in os.walk(ROOT):
              dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS]
              for fn in filenames:
                  if not fn.lower().endswith(TEXT_EXT):
                      continue
                  full = os.path.join(dirpath, fn)
                  rel = os.path.relpath(full, ROOT)
                  try:
                      if os.path.getsize(full) > 3000000:
                          continue
                      with io.open(full, "r", encoding="utf-8", errors="replace") as f:
                          lines = f.readlines()
                  except OSError:
                      continue
                  for idx, ln in enumerate(lines, 1):
                      low = ln.lower()
                      for s in LOCATORS:
                          if s in low:
                              h = hits.setdefault(rel, {"n": 0, "locs": set(), "lines": {}})
                              h["n"] += 1
                              h["locs"].add(s)
                              lst = h["lines"].setdefault(s, [])
                              if len(lst) < 5:
                                  lst.append(idx)

          ranked = sorted(hits.items(), key=lambda kv: -kv[1]["n"])

          p("")
          p("======================================================================")
          p("SECCION 1 - DONDE VIVE LA APP DE REGISTRO (top 20 archivos)")
          p("======================================================================")
          for rel, h in ranked[:20]:
              p("")
              p("### %s (puntaje %d)" % (rel, h["n"]))
              p("    cadenas: %s" % ", ".join(sorted(h["locs"])))
              for s in sorted(h["lines"]):
                  p("    '%s' en lineas %s" % (s, h["lines"][s]))

          main_files = [rel for rel, _ in ranked[:3]]

          p("")
          if main_files:
              p("ARCHIVOS PRINCIPALES ELEGIDOS: " + ", ".join(main_files))
          else:
              p("ARCHIVOS PRINCIPALES: ninguno encontrado (avisar al chat)")

          CORE_RE = re.compile(r"(?i)(paso|nombre|documento|ocr|parse|camara|camera|video|getusermedia|facingmode|canvas|gu[ií]a|marco|frame|selfie|zid|@app|route|do_post|do_get|def |class |max-width|width|height|object-fit|aspect-ratio|coincid|compar|match|fetch\(|/api|502|error)")

          p("")
          p("======================================================================")
          p("SECCION 2 - CODIGO DE LOS ARCHIVOS PRINCIPALES")
          p("======================================================================")

          full_dump = {}
          for rel in main_files:
              fullp = os.path.join(ROOT, rel)
              try:
                  with io.open(fullp, "r", encoding="utf-8", errors="replace") as f:
                      lines = f.readlines()
              except OSError:
                  continue
              full_dump[rel] = lines
              p("")
              p("### " + rel + "  (%d lineas)" % len(lines))
              p("-- Primeras 50 lineas:")
              for i, ln in enumerate(lines[:50], 1):
                  p("%4d| %s" % (i, ln.rstrip()[:170]))
              p("-- Lineas clave (maximo 150):")
              c = 0
              for i, ln in enumerate(lines, 1):
                  if CORE_RE.search(ln):
                      p("%4d| %s" % (i, ln.rstrip()[:170]))
                      c += 1
                      if c >= 150:
                          p("(se corta en 150; el archivo completo va en el artefacto)")
                          break

          MODEL_RE = re.compile(r"(?i)(inferencesession|onnxruntime|sface|yunet)")

          p("")
          p("======================================================================")
          p("SECCION 3 - QUIEN CARGA LOS MODELOS FACIALES (causa posible del 502)")
          p("======================================================================")
          c = 0
          for dirpath, dirnames, filenames in os.walk(ROOT):
              dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS]
              for fn in filenames:
                  if not fn.endswith(".py"):
                      continue
                  full = os.path.join(dirpath, fn)
                  rel = os.path.relpath(full, ROOT)
                  try:
                      if os.path.getsize(full) > 3000000:
                          continue
                      with io.open(full, "r", encoding="utf-8", errors="replace") as f:
                          for i, ln in enumerate(f, 1):
                              if MODEL_RE.search(ln):
                                  p("%s:%d| %s" % (rel, i, ln.strip()[:160]))
                                  c += 1
                                  if c >= 40:
                                      break
                  except OSError:
                      continue
              if c >= 40:
                  break
          p("[referencias a modelos mostradas: %d]" % c)

          MASK = "****VALOR_OCULTO****"
          SECRET_KEY_WORDS = ("secret","password","passwd","pwd","token","api_key","apikey","access_key","private_key","credential","clave","contrasena","auth_key","auth_token","authorization")
          SECRET_LINE_RE = re.compile(r"^\s*([A-Za-z0-9_\-.]+)\s*([:=])\s*(.+?)\s*$", re.IGNORECASE)
          DUMMY_HINTS = ("test","dummy","fake","example","sample","changeme","placeholder","demo","your","tu_","mi_","xxxx","1234","abcd","default","aqui","<")

          def secret_verdict(value):
              v = value.strip().strip("'\"").lower()
              if any(h2 in v for h2 in DUMMY_HINTS):
                  return "PARECE DE PRUEBA (probable falsa alarma)"
              if len(v) < 6 or v.isdigit():
                  return "PARECE DEBIL (probable falsa alarma)"
              return "PUEDE SER REAL: rotarla y pasarla a variable de entorno"

          def mask_line(line):
              m = SECRET_LINE_RE.match(line)
              if m and any(k in m.group(1).lower() for k in SECRET_KEY_WORDS):
                  return m.group(1) + " " + m.group(2) + " " + MASK + "    << " + secret_verdict(m.group(3))
              return re.sub(r"(?i)((?:secret|password|passwd|pwd|token|api_?key|access_key|clave|credential|authorization)[A-Za-z0-9_\-]*['\"]?\s*[:=]\s*)(['\"]?)[A-Za-z0-9_\-\.+/=]{4,}", lambda mo: mo.group(1) + MASK, line)

          p("")
          p("======================================================================")
          p("SECCION 4 - SECRETOS (solo lineas sospechosas, valor oculto)")
          p("======================================================================")
          for rel in ["apps/subastas/modules/002_inscripciones/inscripciones_store.py", "shared_engines/runtime/tests/test_runtime_api.py"]:
              fullp = os.path.join(ROOT, rel)
              p("")
              p("### " + rel)
              if not os.path.exists(fullp):
                  p("[!] no existe")
                  continue
              try:
                  with io.open(fullp, "r", encoding="utf-8", errors="replace") as f:
                      lines = f.readlines()
              except OSError:
                  continue
              c = 0
              for i, ln in enumerate(lines, 1):
                  ml = mask_line(ln.rstrip("\n"))
                  if MASK in ml:
                      p("%4d| %s" % (i, ml[:180]))
                      c += 1
                      if c >= 10:
                          p("(se corta en 10)")
                          break
              if c == 0:
                  p("   (sin coincidencias en esta pasada)")

          p("")
          p("======================================================================")
          p("FIN - copia TODO este bloque y pegalo en el chat.")
          p("======================================================================")

          texto = "\n".join(OUT)
          print(texto)

          ART = list(OUT)
          ART.append("")
          ART.append("======================================================================")
          ART.append("ANEXO - CONTENIDO COMPLETO DE LOS ARCHIVOS PRINCIPALES")
          ART.append("======================================================================")
          for rel, lines in full_dump.items():
              ART.append("")
              ART.append("########## " + rel + " ##########")
              ART.extend(l.rstrip("\n") for l in lines)
          with io.open("volcado_registro.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(ART))
          PYEOF

      - name: Guardar volcado como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volcado-registro
          path: volcado_registro.txt
          if-no-files-found: warn
          retention-days: 7
