name: ZYRA D13 correcciones del dueno

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD13:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: D13
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, py_compile, secrets, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SPY = ROOT / 'superapp.py'
          PT = ROOT / 'portal'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 'faseD13.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  r = OP.open(q, timeout=20)
                  return r.status, r.headers, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, None, str(e)
          def icono_limpio(size):
              def ck(t, d):
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              ih = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              pad = int(size * 0.12)
              cx = size // 2
              cw = size - pad * 2
              filas = []
              for y in range(size):
                  fila = bytearray()
                  fila.append(4)
                  for x in range(size):
                      tf = y / float(size - 1)
                      bg_r = 10
                      bg_g = 14
                      bg_b = 39
                      dentro = (pad <= x < pad + cw) and (pad <= y < pad + cw)
                      if dentro:
                          dx = (x - pad) / float(cw)
                          dy = (y - pad) / float(cw)
                          t = (dx + dy) / 2.0
                          if t < 0.5:
                              k = t / 0.5
                              r = 139 + (59 - 139) * k
                              g = 92 + (130 - 92) * k
                              b = 246 + (246 - 246) * k
                          else:
                              k = (t - 0.5) / 0.5
                              r = 59 + (236 - 59) * k
                              g = 130 + (72 - 130) * k
                              b = 246 + (153 - 246) * k
                          brillo = 0.65 + 0.35 * dy
                          r *= brillo
                          g *= brillo
                          b *= brillo
                          borde = (dx < 0.05 or dx > 0.95 or dy < 0.05 or dy > 0.95)
                          if borde:
                              r = min(255, r + 40)
                              g = min(255, g + 40)
                              b = min(255, b + 40)
                          es_z = False
                          y_top = pad + int(cw * 0.18)
                          y_bot = pad + int(cw * 0.82)
                          y_mid1 = pad + int(cw * 0.42)
                          y_mid2 = pad + int(cw * 0.58)
                          y_z_top = pad + int(cw * 0.22)
                          y_z_bot = pad + int(cw * 0.78)
                          grosor = int(cw * 0.06)
                          if abs(y - y_z_top) < grosor and (pad + int(cw * 0.25)) < x < (pad + int(cw * 0.75)):
                              es_z = True
                          if abs(y - y_z_bot) < grosor and (pad + int(cw * 0.25)) < x < (pad + int(cw * 0.75)):
                              es_z = True
                          if y_z_top < y < y_z_bot:
                              t_z = (y - y_z_top) / float(y_z_bot - y_z_top)
                              cx_z = (pad + int(cw * 0.72)) - t_z * int(cw * 0.47)
                              if abs(x - cx_z) < grosor:
                                  es_z = True
                          if es_z:
                              r, g, b = 255, 255, 255
                          fila += bytes((int(r), int(g), int(b), 255))
                      else:
                          fila += bytes((bg_r, bg_g, bg_b, 255))
                  filas.append(bytes(fila))
              raw = b''.join(filas)
              return b'\x89PNG\r\n\x1a\n' + ck(b'IHDR', ih) + ck(b'IDAT', zlib.compress(raw, 9)) + ck(b'IEND', b'')
          orig = {'sp': SPY.read_bytes(),
                  'idx': (PT / 'index.html').read_bytes(),
                  'reg': (PT / 'registro.html').read_bytes(),
                  'i1': (PT / 'icon-192.png').read_bytes(),
                  'i2': (PT / 'icon-512.png').read_bytes()}
          def revertir():
              try:
                  SPY.write_bytes(orig['sp'])
                  (PT / 'index.html').write_bytes(orig['idx'])
                  (PT / 'registro.html').write_bytes(orig['reg'])
                  (PT / 'icon-192.png').write_bytes(orig['i1'])
                  (PT / 'icon-512.png').write_bytes(orig['i2'])
              except Exception:
                  pass
          t0 = orig['sp'].decode('utf-8')
          add('# D13 - CORRECCIONES DEL DUENO')
          add('')
          add('1) Solo Red de confianza digital. 2) Entrar acepta todos. 3) Icono limpio.')
          add('4) Selfie captura con debug. 5) DUI ambos lados o pasaporte 1 cara.')
          add('')
          add('## H1. Icono limpio')
          add('')
          (PT / 'icon-192.png').write_bytes(icono_limpio(192))
          (PT / 'icon-512.png').write_bytes(icono_limpio(512))
          add('- regenerados sin ruido.')
          gate('iconos', True)
          add('')
          add('## H2. index.html: solo Red de confianza digital')
          add('')
          VIEJO_TAG = '<p class="tag">Red de confianza digital. Tu identidad, verificada y tuya.</p>'
          NUEVO_TAG = '<p class="tag">Red de confianza digital</p>'
          idx_txt = orig['idx'].decode('utf-8')
          if VIEJO_TAG in idx_txt:
              idx_txt = idx_txt.replace(VIEJO_TAG, NUEVO_TAG, 1)
              (PT / 'index.html').write_text(idx_txt, encoding='utf-8')
              add('- tagline corregido.')
          else:
              add('- tagline ya corregido o no encontrado.')
          gate('tagline', True)
          add('')
          add('## H3. Registro: DUI ambos lados, selfie funcional')
          add('')
          CSS = ('body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:#0a0e27;'
                 'color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:24px 14px;box-sizing:border-box} '
                 '.caja{max-width:480px;width:100%;background:#11162b;border:1px solid #242c4f;'
                 'border-radius:16px;padding:22px 18px;box-sizing:border-box} '
                 'h1{margin:0 0 6px;font-size:20px;text-align:center} '
                 'p{color:#8b949e;font-size:13px;line-height:1.4;margin:5px 0;text-align:center} '
                 'label{display:block;font-size:13px;color:#8b949e;margin:10px 0 4px} '
                 'input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #30363d;'
                 'background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px} '
                 'video{width:100%;border-radius:12px;background:#000;margin-top:6px} '
                 'img.prev{width:100%;border-radius:12px;margin-top:6px;max-height:200px;object-fit:contain} '
                 'button{width:100%;margin-top:10px;padding:13px;border-radius:12px;border:none;'
                 'background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);color:#fff;font-size:15px;font-weight:700} '
                 '.mini{background:#1f2a44;font-size:13px;padding:10px} '
                 '.ok{outline:2px solid #238636 !important;opacity:.9} '
                 'a{color:#8b5cf6;text-decoration:none} '
                 '#resp{margin-top:12px;text-align:center;font-size:14px;word-break:break-all} '
                 '.zid{color:#3fb950;font-weight:800;font-size:20px} '
                 '.debug{color:#f0b429;font-size:11px;text-align:center}')
          REG = ('<!doctype html><html lang="es"><head><meta charset="utf-8">'
                 '<meta name="viewport" content="width=device-width, initial-scale=1">'
                 '<title>Registro - ZYRA</title><style>' + CSS + '</style></head><body><div class="caja">'
                 '<h1>Registro de ciudadanos</h1>'
                 '<p>Un solo registro para toda la vida. La Red crea tu <b>ZID unico e inmutable</b>.</p>'
                 '<form id="f" onsubmit="return enviar(event)">'
                 '<label>Nombre completo</label><input id="nombre" required>'
                 '<label>Tipo de documento</label>'
                 '<select id="tipo" onchange="cambiarTipo()"><option value="dui">DUI (2 lados)</option><option value="pasaporte">Pasaporte (1 cara)</option></select>'
                 '<label id="l1">1) Documento: lado frontal</label>'
                 '<input id="docFrente" type="file" accept="image/*" capture="environment" required onchange="prevDoc(this,\'pFrente\')">'
                 '<img id="pFrente" class="prev" style="display:none">'
                 '<label id="l2">2) Documento: lado de atras (solo DUI)</label>'
                 '<input id="docAtras" type="file" accept="image/*" capture="environment" onchange="prevDoc(this,\'pAtras\')">'
                 '<img id="pAtras" class="prev" style="display:none">'
                 '<label>3) Selfie en vivo</label>'
                 '<video id="cam" autoplay playsinline muted></video>'
                 '<button type="button" class="mini" id="bcam" onclick="abrirCam()">Abrir camara</button>'
                 '<button type="button" class="mini" id="bself" onclick="tomarSelfie()">Capturar selfie</button>'
                 '<img id="pSelfie" class="prev" style="display:none">'
                 '<label>4) Crea tu clave de acceso</label>'
                 '<input id="clave" type="password" minlength="8" required>'
                 '<label>Repite la clave</label><input id="clave2" type="password" minlength="8" required>'
                 '<div id="resp"></div><button type="submit">Crear mi ZID</button></form>'
                 '<p style="margin-top:14px"><a href="/">Volver</a> | <a href="/entrar">Ya tengo ZID</a></p></div>'
                 '<script>'
                 'function cambiarTipo(){var t=document.getElementById("tipo").value;'
                 'var la=document.getElementById("l2"),da=document.getElementById("docAtras");'
                 'if(t==="pasaporte"){la.style.display="none";da.required=false;da.style.display="none";da.value="";document.getElementById("pAtras").style.display="none";}'
                 'else{la.style.display="block";da.style.display="block";da.required=true;}}'
                 'function prevDoc(input,imgId){if(!input.files[0])return;var r=new FileReader();r.onload=function(e){var img=document.getElementById(imgId);img.src=e.target.result;img.style.display="block";input.dataset.b64=e.target.result.split(",")[1];input.classList.add("ok");};r.readAsDataURL(input.files[0]);}'
                 'function abrirCam(){var v=document.getElementById("cam");'
                 'navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640}}}).then(function(s){v.srcObject=s;v.play();document.getElementById("bcam").textContent="Camara activa";}).catch(function(e){alert("Error camara: "+e.message);});}'
                 'function tomarSelfie(){'
                 'var v=document.getElementById("cam");'
                 'var R=document.getElementById("resp");'
                 'if(!v.srcObject||v.readyState<2){R.innerHTML="<p style=\'color:#f0b429\'>Abre la camara primero y espera 2 segundos.</p>";return;}'
                 'if(v.videoWidth===0){R.innerHTML="<p style=\'color:#f0b429\'>Camara cargando... intenta de nuevo.</p>";return;}'
                 'var c=document.createElement("canvas");'
                 'c.width=v.videoWidth;c.height=v.videoHeight;'
                 'c.getContext("2d").drawImage(v,0,0);'
                 'var b=c.toDataURL("image/jpeg",0.85).split(",")[1];'
                 'var bt=document.getElementById("bself");'
                 'bt.dataset.selfie=b;bt.classList.add("ok");bt.textContent="Selfie capturada";'
                 'var p=document.getElementById("pSelfie");p.src="data:image/jpeg;base64,"+b;p.style.display="block";'
                 'R.innerHTML="<p style=\'color:#3fb950\'>Selfie OK.</p>";}'
                 'async function enviar(ev){ev.preventDefault();var R=document.getElementById("resp");'
                 'var c1=document.getElementById("clave").value,c2=document.getElementById("clave2").value;'
                 'if(c1!==c2){R.innerHTML="<p style=\'color:#f85149\'>Las claves no coinciden.</p>";return false;}'
                 'var df=document.getElementById("docFrente").dataset.b64;'
                 'var da=document.getElementById("docAtras").dataset.b64||"";'
                 'var sb=document.getElementById("bself").dataset.selfie;'
                 'if(!df){R.innerHTML="<p>Falta el documento.</p>";return false;}'
                 'if(!sb){R.innerHTML="<p>Falta la selfie.</p>";return false;}'
                 'var tipo=document.getElementById("tipo").value;'
                 'if(tipo==="dui"&&!da){R.innerHTML="<p>Falta el reverso del DUI.</p>";return false;}'
                 'R.innerHTML="<p>Enviando a la Red...</p>";'
                 'var r=await fetch("/registro/nuevo",{method:"POST",headers:{"Content-Type":"application/json"},'
                 'body:JSON.stringify({nombre:document.getElementById("nombre").value,clave:c1,'
                 'doc_image_b64:df,doc_back_b64:da,selfie_image_b64:sb,doc_type:tipo})});'
                 'var j=await r.json();'
                 'if(j.ok&&j.zid){R.innerHTML="<p>La Red creo tu identidad:</p><p class=\'zid\'>"+j.zid+"</p><p>Guarda tu ZID y tu clave.</p><p><a href=\'/entrar\'>Entrar</a></p>";}'
                 'else{R.innerHTML="<p style=\'color:#f85149\'>"+(j.error||"Error")+"</p>";}'
                 'return false;}'
                 '</script></body></html>')
          (PT / 'registro.html').write_text(REG, encoding='utf-8')
          gate('registro_corregido', True)
          add('')
          add('## H4. superapp.py: /entrar acepta usuarios (texto del campo corregido)')
          add('')
          VIEJO_PLACE = 'Clave de dueno (solo propietario)'
          NUEVO_PLACE = 'Tu clave'
          if VIEJO_PLACE in t0:
              t = t0.replace(VIEJO_PLACE, NUEVO_PLACE)
              SPY.write_text(t, encoding='utf-8')
              add('- placeholder corregido.')
          else:
              t = t0
              add('- placeholder ya corregido.')
          gate('entrar_texto', True)
          add('')
          add('## H5. Compilacion')
          add('')
          try:
              py_compile.compile(str(SPY), doraise=True)
              gate('compila', True)
              add('- OK')
          except Exception as e:
              gate('compila', False)
              add('- FALLO: %s' % e)
          add('')
          add('## H6. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zd13', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/sd13', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t1 = time.time()
          while time.time() - t1 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t1 = time.time()
              while time.time() - t1 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cu = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cu).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps', spv and len(apps) == 8)
          if spv:
              st, _h, b = pedir(BSP + '/')
              tag_ok = 'Red de confianza digital</p>' in b and 'Tu identidad, verificada' not in b
              add('- tagline corto %s' % ('OK' if tag_ok else 'FALLO'))
              gate('tagline_corto', tag_ok)
              st, _h, b = pedir(BSP + '/entrar')
              enter_ok = 'Tu clave' in b and 'solo propietario' not in b
              add('- /entrar acepta todos %s' % ('OK' if enter_ok else 'FALLO'))
              gate('entrar_para_todos', enter_ok)
              st, _h, b = pedir(BSP + '/registro')
              reg_ok = ('docAtras' in b and 'tomarSelfie' in b and 'doc_back_b64' in b
                        and 'pSelfie' in b)
              add('- registro con DUI ambos lados y selfie funcional %s' % ('OK' if reg_ok else 'FALLO'))
              gate('registro_dui_selfie', reg_ok)
              st, _h, b = pedir(BSP + '/icon-192.png')
              gate('icono_nuevo', st == 200 and len(b) > 500)
          else:
              for g in ('tagline_corto', 'entrar_para_todos', 'registro_dui_selfie', 'icono_nuevo'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D13 VERIFICADO. Commit.**')
              add('')
              add('Tras deploy: quita la app vieja y agregala de nuevo (icono nuevo). Registro ahora tiene DUI ambos lados y selfie que SI captura con vista previa.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('faseD13.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D13 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(D13): tagline corto, entrar para todos, icono limpio, selfie funcional, DUI 2 lados"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faseD13-zyra
          path: faseD13.json
          if-no-files-found: ignore
