# ZYRA-AUDIT v1 - Auditoria completa SOLO LECTURA (antes de tocar cualquier cosa)
#
# REGLAS DEL PROYECTO (respetadas al pie de la letra):
#   1) Se trabaja SOBRE lo que ya existe: no se crean carpetas ni archivos nuevos
#      en el repositorio (el informe va al resumen de GitHub y a /tmp del runner).
#   2) superapp.py se abre SOLO en modo lectura: no se modifica, no se borra nada.
#   3) NO hay commit ni push en toda la corrida (permiso de escritura retirado).
#   4) El parche revC que ya vive dentro de superapp.py queda intacto y en produccion.
#
# Este contenido reemplaza temporalmente el del MISMO archivo de workflow (el de revC).
# Ejecutar: Actions -> "zyra-auditoria" -> Run workflow. RC=0 = auditoria lista.

name: zyra-auditoria

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar-solo-lectura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auditoria completa y del registro ZID (solo lectura)
        run: |
          python3 <<'PYEOF'
          # -*- coding: utf-8 -*-
          # ZYRA-AUDIT v1 - Auditoria completa de superapp.py en MODO SOLO LECTURA.
          # No modifica, no borra, no crea nada en el repositorio; no commit, no push.
          import os, re, sys, hashlib, subprocess, tempfile, py_compile

          TMP = "/tmp/zyra_audit"
          REPORTE = []
          PASOS = []

          def decir(s):
              s = str(s)
              REPORTE.append(s)
              print(s, flush=True)
              try:
                  SUM = os.environ.get("GITHUB_STEP_SUMMARY") or os.path.join(TMP, "resumen.md")
                  d = os.path.dirname(SUM)
                  if d and not os.path.isdir(d):
                      os.makedirs(d, exist_ok=True)
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(s.rstrip() + "\n")
              except Exception:
                  pass

          def lin(t, pos):
              return t.count("\n", 0, pos) + 1

          def seguro(fn):
              try:
                  fn()
              except Exception as e:
                  decir("- (seccion omitida por error interno: " + str(e)[:160] + ")")

          def buscar_superapp():
              if os.path.exists("superapp.py"):
                  return "superapp.py"
              for raiz, _dirs, files in os.walk("."):
                  if ".git" in raiz:
                      continue
                  if "superapp.py" in files:
                      return os.path.join(raiz, "superapp.py")
              return None

          def sec_repo():
              decir("### A.1) Repositorio (lo que existe hoy, sin crear nada)")
              files = []
              try:
                  r = subprocess.run(["git", "ls-files"], capture_output=True, text=True, timeout=60)
                  files = [x for x in (r.stdout or "").splitlines() if x.strip()]
              except Exception:
                  pass
              if not files:
                  files = sorted(f for f in os.listdir(".") if not f.startswith("."))
              for f in files[:40]:
                  try:
                      sz = os.path.getsize(f)
                      decir("- " + f + " (" + str(sz) + " bytes)")
                  except Exception:
                      decir("- " + f)
              if len(files) > 40:
                  decir("- ... y " + str(len(files) - 40) + " archivos mas")

          def sec_base(t):
              decir("### A.2) superapp.py base")
              b = t.encode("utf-8", "replace")
              decir("- Tamano: " + str(len(t)) + " caracteres | " + str(len(b)) + " bytes | " + str(t.count("\n") + 1) + " lineas")
              decir("- sha256: " + hashlib.sha256(b).hexdigest()[:32] + "...")
              fd, p = tempfile.mkstemp(suffix=".py")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(t)
                  py_compile.compile(p, cfile=p + "c", doraise=True)
                  decir("- py_compile: OK (el archivo compila)")
              except Exception as e:
                  decir("- py_compile: FALLA -> " + str(e)[:200])
              finally:
                  for x in (p, p + "c"):
                      try:
                          os.unlink(x)
                      except Exception:
                          pass
              decir("- Inicio del archivo (primeras 12 lineas):")
              decir("```")
              for ln in t.split("\n")[:12]:
                  decir(ln[:160])
              decir("```")

          def sec_servidor(t):
              decir("### A.3) Servidor Python: como corre, rutas y guardado")
              fw = []
              if re.search(r"\bfrom flask\b|\bimport flask\b", t, re.I):
                  fw.append("Flask")
              if "FastAPI" in t:
                  fw.append("FastAPI")
              if re.search(r"http\.server|BaseHTTPRequestHandler|SimpleHTTPRequestHandler", t):
                  fw.append("http.server nativo")
              if "socketserver" in t:
                  fw.append("socketserver")
              if "gunicorn" in t:
                  fw.append("gunicorn (referencia)")
              decir("- Framework: " + (", ".join(fw) if fw else "no identificado con claridad"))
              if re.search(r"os\.environ\.get\(\s*['\"]PORT['\"]", t):
                  decir("- Puerto: usa la variable PORT (estandar de Render).")
              defs = re.findall(r"^\s*def\s+(\w+)\s*\(", t, re.M)
              decir("- Funciones definidas (" + str(len(defs)) + "): " + ", ".join(defs[:30]) + (" ..." if len(defs) > 30 else ""))
              nrutas = 0
              for m in re.finditer(r"@[\w\.]+\.route\(\s*['\"]([^'\"]+)['\"]([^)]*)\)", t):
                  nrutas += 1
                  if nrutas <= 25:
                      extra = (m.group(2) or "").strip()
                      decir("- Ruta: " + m.group(1) + " " + (extra if extra else "(GET)") + " (linea " + str(lin(t, m.start())) + ")")
              if nrutas == 0:
                  for nombre in ("do_GET", "do_POST", "do_HEAD"):
                      m = re.search(r"\bdef " + nombre + r"\b", t)
                      if m:
                          decir("- Handler " + nombre + " (linea " + str(lin(t, m.start())) + ")")
              gu = []
              for m in re.finditer(r"def\s+(\w+)\s*\(", t):
                  if re.search(r"zid|regist|guarda|save|crear|usuario|clave", m.group(1), re.I):
                      gu.append("def " + m.group(1) + " (linea " + str(lin(t, m.start())) + ")")
              if gu:
                  decir("- Funciones del servidor ligadas al registro: " + " | ".join(gu[:12]))
              alm = []
              for m in re.finditer(r"sqlite3|json\.dump|open\([^)]*['\"]w[a-z+]?['\"]|os\.makedirs|shutil", t):
                  alm.append(lin(t, m.start()))
              if alm:
                  decir("- Escritura/almacenamiento en lineas: " + ", ".join(str(x) for x in alm[:12]) + (" ... total " + str(len(alm)) if len(alm) > 12 else ""))
              else:
                  decir("- Escritura/almacenamiento: no se detecto escritura a disco evidente.")
              pin = []
              for k in ("hashlib", "sha256", "bcrypt", "pbkdf2", "salt"):
                  n = len(re.findall(r"\b" + k, t, re.I))
                  if n:
                      pin.append(k + " x" + str(n))
              decir("- Clave/PIN: " + (", ".join(pin) if pin else "SIN hash detectado (punto a reforzar en la capa de seguridad)"))
              if "uuid" in t:
                  decir("- Identificadores: uuid presente")
              elif "random" in t:
                  decir("- Identificadores: random presente")
              if re.search(r"\b413\b", t):
                  decir("- Manejo de 413 (archivos demasiado grandes): presente")

          def sec_html(t):
              decir("### A.4) Pagina embebida y pasos del registro")
              m = re.search(r"<!DOCTYPE", t, re.I)
              if m:
                  decir("- `<!DOCTYPE>` en linea " + str(lin(t, m.start())))
              mver = re.search(r"ZYRA registro v(\d+)", t)
              if mver:
                  decir("- Version visible: ZYRA registro v" + mver.group(1))
              enc = list(dict.fromkeys(re.findall(r"PASO \d+ DE \d+", t)))
              if enc:
                  decir("- Encabezados de paso: " + " | ".join(enc[:8]))
              hallados = []
              for mm in re.finditer(r"id=[\"']ps(\d+)[\"']", t):
                  hallados.append((int(mm.group(1)), mm.start()))
              hallados.sort()
              decir("- Bloques de paso (id=psN): " + str(len(hallados)))
              i = 0
              while i < len(hallados):
                  n, pos = hallados[i]
                  fin = hallados[i + 1][1] if i + 1 < len(hallados) else min(len(t), pos + 20000)
                  seg = t[pos:fin]
                  ids = list(dict.fromkeys(re.findall(r"id=[\"']([A-Za-z0-9_\-]+)[\"']", seg)))
                  ids = [x for x in ids if not re.fullmatch(r"ps\d+", x)][:12]
                  s = seg.lower()
                  lab = []
                  if "nombre" in s:
                      lab.append("nombre")
                  if "option" in s or "tipo" in s:
                      lab.append("tipo de documento")
                  if "camara" in s or "foto" in s or "captur" in s or "archivo" in s:
                      lab.append("fotos del documento")
                  if "biometr" in s or "selfie" in s or "rostro" in s or "video" in s:
                      lab.append("biometria/selfie")
                  if "clave" in s or "pin" in s:
                      lab.append("clave")
                  if "zid" in s:
                      lab.append("ZID/resultado")
                  decir("- ps" + str(n) + " (linea " + str(lin(t, pos)) + ") -> " + (", ".join(lab) if lab else "sin etiqueta clara") + (" | contiene: " + ", ".join(ids) if ids else ""))
                  PASOS.append(n)
                  i += 1
              mnom = re.search(r"id=[\"']nombre[\"']", t)
              if mnom:
                  decir("- Campo de nombre: linea " + str(lin(t, mnom.start())))
              opts = re.findall(r"<option[^>]*>([^<]{1,60})</option>", t)
              if opts:
                  decir("- Tipos de documento en el selector (" + str(len(opts)) + "): " + " | ".join(o.strip() for o in opts[:12]))
              bots = re.findall(r"<button[^>]*id=[\"']([^\"']+)[\"']", t, re.I)
              if bots:
                  decir("- Botones: " + ", ".join(list(dict.fromkeys(bots))[:20]))

          def sec_libs(t):
              decir("### A.5) Librerias externas y capacidades del navegador")
              ntot = len(re.findall(r"<script\b", t, re.I))
              nsrc = len(re.findall(r"<script[^>]*\bsrc=", t, re.I))
              decir("- Tags `script` totales: " + str(ntot) + " (con src externo: " + str(nsrc) + ")")
              for m in re.finditer(r"<script[^>]*src=[\"']([^\"']+)[\"']", t, re.I):
                  decir("- linea " + str(lin(t, m.start())) + ": " + m.group(1)[:130])
              for k in ("Tesseract", "faceapi", "pdf417", "getUserMedia", "toDataURL", "FileReader", "BarcodeDetector", "MutationObserver"):
                  n = t.count(k)
                  if n:
                      decir("- " + k + ": " + str(n) + " menciones")

          def sec_gates(t):
              decir("### A.6) Protecciones ya existentes (estado del candado actual)")
              for k in ("docVencido", "nombreNoCoincide", "bioRechazada", "tipoDoc"):
                  n = t.count(k)
                  if n:
                      decir("- " + k + ": " + str(n) + " apariciones (primera en linea " + str(lin(t, t.find(k))) + ")")
              urls = list(dict.fromkeys(re.findall(r"fetch\(\s*['\"]([^'\"]+)['\"]", t)))
              decir("- fetch(): " + str(t.count("fetch(")) + " llamadas. Destinos: " + ((" | ".join(urls))[:400] if urls else "(dinamicos)"))
              marcas = (
                  ("ZYRA-V5-IIFE-BEGIN", "parche v5 IIFE"),
                  ("ZYRA-V5-CSS-BEGIN", "parche v5 CSS"),
                  ("ZYRA-V6-BEGIN", "parche v6 revC inicio"),
                  ("ZYRA-V6-END", "parche v6 revC fin"),
                  ("ZTEST-BEGIN", "pruebas internas del parche"),
              )
              for k, dsc in marcas:
                  n = t.count(k)
                  if n:
                      decir("- " + k + " (" + dsc + "): linea " + str(lin(t, t.find(k))) + ", x" + str(n))
              if t.count("ZYRA-V6-BEGIN") == 1 and t.count("ZYRA-V6-END") == 1:
                  decir("- Parche revC dentro de superapp.py: ACTIVO y unico (los candados de orden estan en produccion).")
              else:
                  decir("- Parche revC dentro de superapp.py: NO detectado o duplicado (revisar).")

          def sec_registro(t):
              decir("")
              decir("## PARTE B) Auditoria enfocada: flujo de registro ZID")
              decir("- Pasos encontrados: " + (", ".join("ps" + str(n) for n in PASOS) if PASOS else "NINGUNO (revisar)"))
              campos = list(dict.fromkeys(re.findall(r"append\(\s*['\"]([^'\"]+)['\"]", t)))
              if campos:
                  decir("- Campos que el navegador envia al servidor (FormData): " + ", ".join(campos[:20]))
              for m in re.finditer(r"<form[^>]*>", t):
                  decir("- Formulario en linea " + str(lin(t, m.start())) + ": " + m.group(0)[:120])
              conv = list(dict.fromkeys(re.findall(r"toDataURL\(\s*['\"]([^'\"]+)['\"]", t)))
              if conv:
                  decir("- Formato de captura de fotos: " + ", ".join(conv))
              gat = []
              if re.search(r"simNombres", t):
                  gat.append("comparacion nombre vs OCR")
              if re.search(r"docVencido", t):
                  gat.append("documento vencido")
              if re.search(r"tipoDistinto|familiaDoc|familiaTipo", t):
                  gat.append("tipo de documento")
              if re.search(r"decidirBio|distEucl|compararRostros", t):
                  gat.append("biometria facial")
              decir("- Gates del flujo activos hoy: " + (", ".join(gat) if gat else "no identificados"))
              decir("")
              decir("### Mapa de NO-TOCAR (para el proximo parche)")
              for k, dsc in (
                  ("docVencido", "logica de vencimiento (base)"),
                  ("bAbrirF", "abrir camara (base)"),
                  ("bCapF", "capturar foto (base)"),
                  ("galF", "elegir archivo (base)"),
                  ("bIr4", "continuar a biometria (base)"),
                  ("bIr5", "continuar a clave (base)"),
                  ("tipoDoc", "selector de documento (base)"),
                  ("nombreNoCoincide", "aviso de nombre (base)"),
                  ("bioRechazada", "aviso de biometria (base)"),
              ):
                  decir("- " + k + " - " + dsc + ": " + str(t.count(k)) + " apariciones")
              m1 = re.search(r"/\*\s*ZYRA-V6-BEGIN\s*\*/", t)
              m2 = re.search(r"/\*\s*ZYRA-V6-END\s*\*/", t)
              if m1 and m2:
                  decir("- Zona del parche revC (lo unico que el workflow gestiona): lineas " + str(lin(t, m1.start())) + " a " + str(lin(t, m2.end())))
              decir("- Regla para revD: se inserta SOLO como bloque marcado en UN punto; todo lo demas queda byte a byte igual (conservacion verificada por el parcheador).")

          def sec_final():
              decir("")
              decir("## Veredicto")
              decir("- AUDITORIA COMPLETADA (solo lectura). superapp.py NO fue modificado; no se borro nada; no se creo ningun archivo nuevo en el repositorio; no hubo commit ni push.")
              decir("- Respaldo del informe: artefacto de esta corrida (guardado en /tmp del runner, fuera del repo).")
              decir("- Con este mapa, revD se construye sobre lo que existe y solo toca su bloque marcado.")

          def main():
              try:
                  os.makedirs(TMP, exist_ok=True)
              except Exception:
                  pass
              decir("# ZYRA-AUDIT v1 - Auditoria completa y del registro ZID (SOLO LECTURA)")
              decir("")
              decir("Reglas aplicadas: se trabaja sobre lo que existe. Este run NO modifica superapp.py, NO crea archivos en el repositorio, NO commitea y NO hace push.")
              RUTA = buscar_superapp()
              if not RUTA:
                  decir("- RECHAZO: no se encontro superapp.py en el repositorio.")
                  sys.exit(1)
              with open(RUTA, encoding="utf-8") as f:
                  t = f.read()
              decir("")
              decir("## PARTE A) Auditoria completa")
              decir("- Archivo auditado (solo lectura): " + RUTA)
              for fn in (sec_repo, lambda: sec_base(t), lambda: sec_servidor(t), lambda: sec_html(t), lambda: sec_libs(t), lambda: sec_gates(t), lambda: sec_registro(t)):
                  seguro(fn)
              sec_final()
              try:
                  with open(os.path.join(TMP, "auditoria_completa.txt"), "w", encoding="utf-8") as f:
                      f.write("\n".join(REPORTE))
              except Exception:
                  pass
              sys.exit(0)

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Artefacto del informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra-audit-v1-informe
          path: /tmp/zyra_audit
