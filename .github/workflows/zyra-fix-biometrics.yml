          """Identity Gateways Engine (ID-9) - puertos de entrada
          por tipo de cliente. Reglas 63/66/76."""
          from __future__ import annotations
          import uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_gateways", (
                  "CREATE TABLE IF NOT EXISTS zid_gateways ("
                  " gw_id TEXT PRIMARY KEY, name TEXT NOT NULL,"
                  " kind TEXT NOT NULL, owner_zid TEXT NOT NULL"
                  " DEFAULT '', status TEXT NOT NULL DEFAULT"
                  " 'abierta', created_at REAL NOT NULL)",
              )),
          )
          _KINDS = ("APP_MOVIL", "PORTAL_WEB", "API",
                    "NODO_OFFLINE")


          class IdentityGatewaysEngine:
              """Puertos de entrada (ID-9)."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.gw",
                                  _MIGRATIONS).run(clock)

              def register_gateway(self, *, name, kind,
                                   owner_zid=""):
                  if not str(name).strip():
                      raise ValueError("name requerido")
                  k = str(kind).upper()
                  if k not in _KINDS:
                      raise ValueError("kind debe ser "
                                       + "/".join(_KINDS))
                  gid = "ZGW-" + uuid.uuid4().hex[:10]
                  self._db.execute(
                      "INSERT INTO zid_gateways (gw_id, name,"
                      " kind, owner_zid, status, created_at)"
                      " VALUES (?, ?, ?, ?, 'abierta', ?)",
                      (gid, str(name), k, str(owner_zid),
                       self._clock.now()))
                  return {"gw_id": gid, "status": "abierta"}

              def close_gateway(self, gw_id):
                  row = self._db.query_one(
                      "SELECT status FROM zid_gateways WHERE"
                      " gw_id = ?", (str(gw_id),))
                  if row is None:
                      raise KeyError(gw_id)
                  if str(row["status"]) != "abierta":
                      raise ValueError("ya cerrado")
                  self._db.execute(
                      "UPDATE zid_gateways SET status ="
                      " 'cerrada' WHERE gw_id = ?",
                      (str(gw_id),))
                  return {"gw_id": str(gw_id),
                          "status": "cerrada"}

              def gateways_of(self, status=""):
                  if str(status).strip():
                      rows = self._db.query_all(
                          "SELECT gw_id, name, kind, status"
                          " FROM zid_gateways WHERE status ="
                          " ? ORDER BY rowid",
                          (str(status).upper(),))
                  else:
                      rows = self._db.query_all(
                          "SELECT gw_id, name, kind, status"
                          " FROM zid_gateways ORDER BY rowid")
                  return [{"gw_id": str(r["gw_id"]),
                           "name": str(r["name"]),
                           "kind": str(r["kind"]),
                           "status": str(r["status"])}
                          for r in rows]
          EOF
          python3 -m py_compile shared_engines/identity/identity_gateways_engine.py && echo "gateways: OK"

      - name: "TokensEngine (ID-11) — FIX import json"
        if: always()
        run: |
          cat > shared_engines/identity/tokens_engine.py << 'EOF'
          """Identity Tokens Engine (ID-11) - access+refresh con
          scopes, expiracion, reuso detectado, revoke_all.
          Reglas 63/66/76."""
          from __future__ import annotations
          import hashlib, json, secrets, uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_tokens", (
                  "CREATE TABLE IF NOT EXISTS zid_tokens ("
                  " token_id TEXT PRIMARY KEY, zid TEXT NOT"
                  " NULL, kind TEXT NOT NULL, token_hash TEXT"
                  " NOT NULL, scopes_json TEXT NOT NULL DEFAULT"
                  " '[]', expires_at REAL NOT NULL, used INTEGER"
                  " NOT NULL DEFAULT 0, revoked INTEGER NOT"
                  " NULL DEFAULT 0, created_at REAL NOT NULL)",
              )),
          )
          _KINDS = ("access", "refresh")


          def _sha(t):
              return hashlib.sha256(
                  t.encode("utf-8")).hexdigest()


          class TokensEngine:
              """Tokens con refresh (ID-11)."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.tokens",
                                  _MIGRATIONS).run(clock)

              def issue_pair(self, *, zid, scopes=None,
                             access_ttl=3600.0,
                             refresh_ttl=604800.0):
                  if not str(zid).strip():
                      raise ValueError("zid requerido")
                  sc = [str(s) for s in (scopes or [])]
                  now = self._clock.now()
                  access = "ZAT-" + secrets.token_urlsafe(24)
                  refresh = "ZRT-" + secrets.token_urlsafe(24)
                  self._db.execute(
                      "INSERT INTO zid_tokens (token_id, zid,"
                      " kind, token_hash, scopes_json,"
                      " expires_at, created_at)"
                      " VALUES (?, ?, 'access', ?, ?, ?, ?)",
                      ("ZTK-" + uuid.uuid4().hex[:10],
                       str(zid), _sha(access),
                       json.dumps(sc),
                       now + float(access_ttl), now))
                  self._db.execute(
                      "INSERT INTO zid_tokens (token_id, zid,"
                      " kind, token_hash, scopes_json,"
                      " expires_at, created_at)"
                      " VALUES (?, ?, 'refresh', ?, ?, ?, ?)",
                      ("ZTK-" + uuid.uuid4().hex[:10],
                       str(zid), _sha(refresh),
                       json.dumps(sc),
                       now + float(refresh_ttl), now))
                  return {"access_token": access,
                          "refresh_token": refresh,
                          "expires_in": int(access_ttl)}

              def check_access(self, token):
                  row = self._db.query_one(
                      "SELECT zid, scopes_json, expires_at,"
                      " revoked FROM zid_tokens WHERE"
                      " token_hash = ? AND kind = 'access'",
                      (_sha(str(token)),))
                  if row is None:
                      return {"valid": False,
                              "reason": "desconocido"}
                  if int(row["revoked"]) == 1:
                      return {"valid": False,
                              "reason": "revocado"}
                  if float(row["expires_at"]) <= \
                          self._clock.now():
                      return {"valid": False,
                              "reason": "expirado"}
                  return {"valid": True,
                          "zid": str(row["zid"]),
                          "scopes": json.loads(
                              str(row["scopes_json"]))}

              def refresh(self, refresh_token, *,
                          access_ttl=3600.0):
                  row = self._db.query_one(
                      "SELECT zid, scopes_json, expires_at,"
                      " used, revoked FROM zid_tokens WHERE"
                      " token_hash = ? AND kind = 'refresh'",
                      (_sha(str(refresh_token)),))
                  if row is None:
                      raise LookupError("no existe")
                  if int(row["used"]) == 1:
                      raise ValueError(
                          "refresh ya usado (reuso)")
                  if int(row["revoked"]) == 1:
                      raise ValueError("revocado")
                  if float(row["expires_at"]) <= \
                          self._clock.now():
                      raise ValueError("expirado")
                  self._db.execute(
                      "UPDATE zid_tokens SET used = 1 WHERE"
                      " token_hash = ?",
                      (_sha(str(refresh_token)),))
                  sc = json.loads(str(row["scopes_json"]))
                  access = "ZAT-" + secrets.token_urlsafe(24)
                  self._db.execute(
                      "INSERT INTO zid_tokens (token_id, zid,"
                      " kind, token_hash, scopes_json,"
                      " expires_at, created_at)"
                      " VALUES (?, ?, 'access', ?, ?, ?, ?)",
                      ("ZTK-" + uuid.uuid4().hex[:10],
                       str(row["zid"]), _sha(access),
                       json.dumps(sc),
                       self._clock.now()
                       + float(access_ttl),
                       self._clock.now()))
                  return {"access_token": access,
                          "expires_in": int(access_ttl)}

              def revoke_all(self, zid):
                  n = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM zid_tokens"
                      " WHERE zid = ? AND revoked = 0",
                      (str(zid),))
                  self._db.execute(
                      "UPDATE zid_tokens SET revoked = 1 WHERE"
                      " zid = ? AND revoked = 0",
                      (str(zid),))
                  return {"zid": str(zid),
                          "revoked": int(n["n"])}
          EOF
          python3 -m py_compile shared_engines/identity/tokens_engine.py && echo "tokens: OK"

