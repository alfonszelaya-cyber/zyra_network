name: "ZYRA NEXO NG11+NG12 calidad + runtime vivo (fix inyeccion y prefijos)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] NG11 datetime timezone-aware + idempotency engine"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              out("## Migracion datetime timezone-aware (idempotente)")
              migrados = 0
              saltados = 0
              for base in ("apps/nexo/domain",
                           "apps/nexo/application",
                           "apps/nexo/services"):
                  for p in sorted(pathlib.Path(base).rglob("*.py")):
                      try:
                          txt = p.read_text(encoding="utf-8")
                      except Exception:
                          continue
                      if "datetime.utcnow()" not in txt:
                          continue
                      stripped = [ln.strip() for ln in
                                  txt.split("\n")]
                      caso_a = ("from datetime import datetime"
                                in stripped)
                      caso_b = "import datetime" in stripped
                      if not (caso_a or caso_b):
                          saltados = saltados + 1
                          out("- " + str(p)
                              + ": import no standard — SALTADO")
                          continue
                      new = txt
                      if caso_b:
                          new = new.replace(
                              "datetime.datetime.utcnow()",
                              "datetime.datetime.now("
                              "datetime.timezone.utc)")
                      new = new.replace("datetime.utcnow()",
                                        "datetime.now(timezone.utc)")
                      if caso_a and not caso_b:
                          lines = new.split("\n")
                          lines = [
                              (ln.replace(
                                  "from datetime import datetime",
                                  "from datetime import datetime,"
                                  " timezone")
                               if ln.strip()
                               == "from datetime import datetime"
                               else ln)
                              for ln in lines]
                          new = "\n".join(lines)
                      try:
                          ast.parse(new)
                      except Exception:
                          saltados = saltados + 1
                          out("- " + str(p)
                              + ": transform invalida — SALTADO")
                          continue
                      p.write_text(new, encoding="utf-8")
                      py_compile.compile(str(p), doraise=True)
                      migrados = migrados + 1
              out("- **migrados: " + str(migrados)
                  + " | saltados: " + str(saltados) + "**")

              forzar("apps/nexo/domain/operations/idempotency_engine.py",
                     D(r'''
                  """Idempotency Engine - idempotencia persistente
                  (NG11). claim(key, scope): primera vez ->
                  first=True; si ya existe dentro del TTL ->
                  first=False con el resultado guardado (replay).
                  complete(key, scope, result): guarda el resultado.
                  Produccion real: evita doble ejecucion de
                  operaciones criticas (pagos, asientos, cierres)."""
                  from __future__ import annotations
                  import json as _j
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "nexo_idempotency", (
                          "CREATE TABLE IF NOT EXISTS nexo_idempotency (idem_key TEXT NOT NULL, scope TEXT NOT NULL DEFAULT 'default', result_json TEXT NOT NULL DEFAULT '{}', created_at REAL NOT NULL, PRIMARY KEY(idem_key, scope))",
                      )),
                  )

                  class IdempotencyEngine:
                      """Idempotencia por (key, scope) con TTL."""

                      def __init__(self, db, clock,
                                   ttl_seconds=86400):
                          self._db = db
                          self._clock = clock
                          self._ttl = int(ttl_seconds)
                          MigrationRunner(db, "nexo.idem",
                                          _MIGRATIONS).run(clock)

                      def claim(self, *, key,
                                scope="default") -> dict:
                          now = self._clock.now()
                          row = self._db.query_one(
                              "SELECT * FROM nexo_idempotency"
                              " WHERE idem_key = ? AND scope = ?",
                              (key, scope))
                          if row is not None:
                              age = (now
                                     - float(row["created_at"]))
                              if age <= self._ttl:
                                  return {"first": False,
                                          "result": _j.loads(
                                              str(row["result_json"]))}
                              self._db.execute(
                                  "DELETE FROM nexo_idempotency"
                                  " WHERE idem_key = ? AND"
                                  " scope = ?", (key, scope))
                          return {"first": True,
                                  "result": None}

                      def complete(self, *, key,
                                   scope="default",
                                   result=None) -> dict:
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO nexo_idempotency"
                                  " (idem_key, scope,"
                                  " result_json, created_at)"
                                  " VALUES (?, ?, ?, ?)"
                                  " ON CONFLICT(idem_key, scope)"
                                  " DO UPDATE SET result_json ="
                                  " excluded.result_json,"
                                  " created_at ="
                                  " excluded.created_at",
                                  (key, scope,
                                   _j.dumps(result or {},
                                            default=str), now))
                          return {"key": key, "scope": scope,
                                  "stored": True}

                      def forget(self, *, key,
                                 scope="default") -> dict:
                          self._db.execute(
                              "DELETE FROM nexo_idempotency"
                              " WHERE idem_key = ? AND scope = ?",
                              (key, scope))
                          return {"key": key, "scope": scope,
                                  "forgotten": True}
              '''))
              out("## FIN NG11 builder")
          except Exception:
              out("## NG11 BUILDER ERROR (visible abajo)")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] NG12 runtime + menu patch + inyeccion en server.py"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/nexo/services/runtime.py", D(r'''
                  """NexoRuntime - raiz de composicion de NEXO en
                  vivo (NG12). Une: bus de eventos NEXO_* (cartero),
                  auditoria, moneda y clasificacion IA. Todo por
                  gateways existentes (regla 69, cero duplicar).
                  Opcionalmente recibe outbox de la Red y AIChain
                  para operar plenamente conectado."""
                  from __future__ import annotations
                  from apps.nexo.infrastructure.messaging.message_bus import (
                      NexoMessageBus)
                  from apps.nexo.services.transversal.currency.currency_gateway import (
                      NexoCurrencyGateway)
                  from apps.nexo.services.transversal.ai.ai_gateway import (
                      NexoAIGateway)
                  from apps.nexo.services.transversal.audit.audit_gateway import (
                      NexoAuditGateway)

                  class NexoRuntime:
                      """Runtime de produccion de NEXO."""

                      def __init__(self, db=None, clock=None,
                                   outbox=None, ai_chain=None):
                          self.clock = clock
                          self.bus = NexoMessageBus(outbox=outbox,
                                                    clock=clock)
                          self.currency = NexoCurrencyGateway()
                          self.ai = NexoAIGateway(chain=ai_chain)
                          self.audit = NexoAuditGateway(db=db,
                                                        clock=clock)

                      def emit(self, event, company_id="",
                               payload=None) -> dict:
                          from apps.nexo.events.contracts import (
                              make_event)
                          ev = make_event(
                              event, company_id=company_id,
                              payload=payload,
                              occurred_at=(self.clock.now()
                                           if self.clock
                                           else None))
                          return self.bus.publish(ev)

                      def drain_events(self, limit=100) -> list:
                          return self.bus.drain(limit)

                      def classify_document(self, text) -> dict:
                          return self.ai.classify_document(text)

                      def audit_event(self, *, event, actor="",
                                      entity="", before=None,
                                      after=None) -> dict:
                          return self.audit.record_event(
                              event=event, actor=actor,
                              entity=entity, before=before,
                              after=after)

                      def convert(self, amount, base,
                                  quote) -> dict:
                          return self.currency.convert(
                              amount, base, quote)

                      def status(self) -> dict:
                          return {"events_pending":
                                      self.bus.pending(),
                                  "currency_mode":
                                      self.currency.mode,
                                  "ai_mode": self.ai.mode,
                                  "audit_mode": self.audit.mode}
              '''))

              forzar("apps/nexo/services/menu_server_patch.py", D(r'''
                  """Menu server patch - patch aditivo (regla 51).
                  Envuelve do_GET de cualquier handler HTTP stdlib
                  para servir los menus de NEXO en /nexo/menus y
                  /nexo/menus/<menu_id> sin tocar el handler.
                  Idempotente por marca de clase."""
                  from __future__ import annotations
                  import json as _json
                  from apps.nexo.routers.modules_router import (
                      list_menus, get_menu)

                  def apply_menu_routes(handler_cls):
                      """Aplica el patch una sola vez."""
                      if getattr(handler_cls,
                                 "_ng12_menus_applied", False):
                          return handler_cls
                      original = getattr(handler_cls, "do_GET",
                                         None)

                      def do_GET(self):
                          path = ((getattr(self, "path", "")
                                   or "").split("?")[0])
                          if (path == "/nexo/menus"
                                  or path.startswith(
                                      "/nexo/menus/")):
                              mid = ""
                              if len(path) > len("/nexo/menus/"):
                                  mid = path[len("/nexo/menus/"):]\
                                      .lstrip("/")
                              if mid:
                                  m = get_menu(mid)
                                  code = 200 if m else 404
                                  payload = (m if m else
                                             {"error": "menu no"
                                                       " encontrado"})
                              else:
                                  code = 200
                                  payload = list_menus()
                              body = _json.dumps(
                                  payload,
                                  default=str).encode("utf-8")
                              self.send_response(code)
                              self.send_header(
                                  "Content-Type",
                                  "application/json")
                              self.send_header(
                                  "Content-Length",
                                  str(len(body)))
                              self.end_headers()
                              self.wfile.write(body)
                              return
                          if original is not None:
                              return original(self)
                          self.send_response(404)
                          self.end_headers()

                      handler_cls.do_GET = do_GET
                      handler_cls._ng12_menus_applied = True
                      return handler_cls
              '''))

              sp = pathlib.Path("apps/nexo/server.py")
              src = sp.read_text(encoding="utf-8")
              if "/nexo/menus" in src:
                  out("- server.py: /nexo/menus ya presente"
                      " — skip (idempotencia)")
              else:
                  tree = ast.parse(src)
                  doget = None
                  for node in tree.body:
                      if (isinstance(node, ast.ClassDef)
                              and node.name == "NexoApiHandler"):
                          for m in node.body:
                              if (isinstance(m, ast.FunctionDef)
                                      and m.name == "do_GET"):
                                  doget = m
                  if doget is None:
                      out("- server.py: do_GET no encontrado"
                          " — skip")
                  else:
                      idx = doget.body[0].lineno - 1
                      block = [
                          '        from apps.nexo.routers.'
                          'modules_router import (list_menus as'
                          ' _ng12_list, get_menu as _ng12_get)',
                          '        _ng12_path = ((getattr(self,'
                          ' "path", "") or "").split("?")[0])',
                          '        if (_ng12_path == "/nexo/menus"'
                          ' or _ng12_path.startswith('
                          '"/nexo/menus/")):',
                          '            import json as _json',
                          '            _ng12_mid = ""',
                          '            if len(_ng12_path) > len('
                          '"/nexo/menus/"):',
                          '                _ng12_mid = _ng12_path['
                          'len("/nexo/menus/"):].lstrip("/")',
                          '            if _ng12_mid:',
                          '                _ng12_m = _ng12_get('
                          '_ng12_mid)',
                          '                _ng12_code = 200 if'
                          ' _ng12_m else 404',
                          '                _ng12_payload = _ng12_m'
                          ' if _ng12_m else {"error": "menu no'
                          ' encontrado"}',
                          '            else:',
                          '                _ng12_code = 200',
                          '                _ng12_payload ='
                          ' _ng12_list()',
                          '            _ng12_body = _json.dumps('
                          '_ng12_payload, default=str).encode('
                          '"utf-8")',
                          '            self.send_response('
                          '_ng12_code)',
                          '            self.send_header('
                          '"Content-Type", "application/json")',
                          '            self.send_header('
                          '"Content-Length", str(len(_ng12_body)))',
                          '            self.end_headers()',
                          '            self.wfile.write(_ng12_body)',
                          '            return',
                      ]
                      lines = src.split("\n")
                      new_src = "\n".join(
                          lines[:idx] + block + lines[idx:])
                      ast.parse(new_src)
                      sp.write_text(new_src, encoding="utf-8")
                      py_compile.compile("apps/nexo/server.py",
                                         doraise=True)
                      out("- **server.py: bloque /nexo/menus"
                          " inyectado y compilado OK**")
              out("## FIN NG12 builder")
          except Exception:
              out("## NG12 BUILDER ERROR (visible abajo)")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] NG11 tests (11 archivos llenados)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps/nexo -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/nexo/tests
          cat > apps/nexo/tests/test_accounting.py << 'TSEOF'
          import importlib, pathlib
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.accounting.chart_of_accounts_engine import ChartOfAccountsEngine
          from apps.nexo.domain.accounting.general_ledger_engine import GeneralLedgerEngine

          BASE = pathlib.Path(__file__).resolve().parents[1] / "domain" / "accounting"

          def test_modulos_accounting_importan():
              n = 0
              for p in sorted(BASE.glob("*.py")):
                  if p.stat().st_size <= 1:
                      continue
                  importlib.import_module(
                      "apps.nexo.domain.accounting." + p.stem)
                  n = n + 1
              assert n >= 10
              print("OK accounting: " + str(n) + " modulos importan")

          def test_nucleo_contable_operates(tmp_path):
              chart = ChartOfAccountsEngine(
                  SQLiteAdapter(tmp_path / "a.db"), FrozenClock())
              chart.install_template(company_id="EMP-T")
              ledger = GeneralLedgerEngine(
                  SQLiteAdapter(tmp_path / "b.db"), FrozenClock())
              ledger.post_balanced(company_id="EMP-T",
                  period="2026-03", lines=[
                      {"account_code": "1000",
                       "debit": "100", "credit": "0"},
                      {"account_code": "4000",
                       "debit": "0", "credit": "100"}])
              assert len(ledger.trial_balance("EMP-T",
                                              "2026-03")) == 2
              print("OK accounting: plantilla + asiento cuadrado")
          TSEOF
          cat > apps/nexo/tests/test_domain.py << 'TSEOF'
          import importlib, pathlib, pytest

          BASE = pathlib.Path(__file__).resolve().parents[1] / "domain"

          def test_import_todos_los_engines_de_dominio():
              mods = []
              errores = []
              for p in sorted(BASE.rglob("*.py")):
                  if p.stat().st_size <= 1:
                      continue
                  rel = ("apps.nexo."
                         + p.relative_to(BASE.parent)
                         .as_posix()[:-3].replace("/", "."))
                  try:
                      importlib.import_module(rel)
                      mods.append(rel)
                  except Exception as e:
                      errores.append(rel + ": " + str(e)[:80])
              assert errores == []
              assert len(mods) >= 80
              print("OK domain: " + str(len(mods))
                    + " modulos importan sin errores")

          def test_e2e_flujo_contable_completo(tmp_path):
              from shared_engines.common.clocks import FrozenClock
              from shared_engines.storage.database import SQLiteAdapter
              from apps.nexo.domain.accounting.chart_of_accounts_engine import ChartOfAccountsEngine
              from apps.nexo.domain.accounting.general_ledger_engine import GeneralLedgerEngine
              from apps.nexo.domain.accounting.financial_statements_engine import FinancialStatementsEngine
              from apps.nexo.domain.accounting.period_closing_engine import PeriodClosingEngine
              from apps.nexo.application.accounting_use_cases.close_accounting_period_use_case import CloseAccountingPeriodUseCase
              db = SQLiteAdapter(tmp_path / "e2e.db")
              clock = FrozenClock()
              chart = ChartOfAccountsEngine(db, clock)
              chart.install_template(company_id="EMP-E2E")
              ledger = GeneralLedgerEngine(db, clock)
              periods = PeriodClosingEngine(db, clock)
              periods.ensure_open("EMP-E2E", "2026-03")
              ledger.post_balanced(company_id="EMP-E2E",
                  period="2026-03", lines=[
                      {"account_code": "1000",
                       "debit": "1000", "credit": "0"},
                      {"account_code": "4000",
                       "debit": "0", "credit": "1000"}])
              ledger.post_balanced(company_id="EMP-E2E",
                  period="2026-03", lines=[
                      {"account_code": "6000",
                       "debit": "300", "credit": "0"},
                      {"account_code": "1000",
                       "debit": "0", "credit": "300"}])
              st = FinancialStatementsEngine(db, clock,
                  chart=chart, ledger=ledger)
              assert (st.income_statement("EMP-E2E", "2026-03")
                      ["utilidad"] == "700.00")
              r = CloseAccountingPeriodUseCase(
                  periods, st, ledger).execute(
                  company_id="EMP-E2E", period="2026-03",
                  actor="contador")
              assert r["status"] == "CLOSED"
              assert r["utilidad"] == "700.00"
              with pytest.raises(ValueError):
                  ledger.post_entry(company_id="EMP-E2E",
                      period="2026-03", account_code="1000",
                      debit="1")
              print("OK E2E contable: plantilla->asientos->estados->cierre->bloqueo")
          TSEOF
          cat > apps/nexo/tests/test_use_cases.py << 'TSEOF'
          import importlib, pathlib, pytest

          BASE = pathlib.Path(__file__).resolve().parents[1] / "application"

          def test_import_todos_los_use_cases():
              n = 0
              errores = []
              for p in sorted(BASE.rglob("*.py")):
                  if p.stat().st_size <= 1:
                      continue
                  rel = ("apps.nexo."
                         + p.relative_to(BASE.parent)
                         .as_posix()[:-3].replace("/", "."))
                  try:
                      importlib.import_module(rel)
                      n = n + 1
                  except Exception as e:
                      errores.append(rel + ": " + str(e)[:80])
              assert errores == []
              assert n >= 50
              print("OK use cases: " + str(n) + " importan sin errores")

          def test_idempotencia_claim_complete(tmp_path):
              from shared_engines.common.clocks import FrozenClock
              from shared_engines.storage.database import SQLiteAdapter
              from apps.nexo.domain.operations.idempotency_engine import IdempotencyEngine
              eng = IdempotencyEngine(
                  SQLiteAdapter(tmp_path / "idem.db"), FrozenClock())
              c1 = eng.claim(key="op-1", scope="pagos")
              assert c1["first"] is True
              eng.complete(key="op-1", scope="pagos",
                           result={"ok": True})
              c2 = eng.claim(key="op-1", scope="pagos")
              assert c2["first"] is False
              assert c2["result"] == {"ok": True}
              assert eng.claim(key="op-2",
                               scope="pagos")["first"] is True
              eng.forget(key="op-1", scope="pagos")
              assert eng.claim(key="op-1",
                               scope="pagos")["first"] is True
              print("OK idempotencia: claim/complete/replay/forget")
          TSEOF
          cat > apps/nexo/tests/test_finance.py << 'TSEOF'
          import importlib, pathlib
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.finance.accounts_receivable_engine import AccountsReceivableEngine
          from apps.nexo.domain.finance.treasury_engine import TreasuryEngine

          BASE = pathlib.Path(__file__).resolve().parents[1] / "domain" / "finance"

          def test_modulos_finance_importan():
              n = 0
              for p in sorted(BASE.glob("*.py")):
                  if p.stat().st_size <= 1:
                      continue
                  importlib.import_module(
                      "apps.nexo.domain.finance." + p.stem)
                  n = n + 1
              assert n >= 10
              print("OK finance: " + str(n) + " modulos importan")

          def test_cxc_y_tesoreria(tmp_path):
              ar = AccountsReceivableEngine(
                  SQLiteAdapter(tmp_path / "ar.db"), FrozenClock())
              inv = ar.create_invoice(company_id="EMP-F",
                  client_id="C1", invoice_number="F-1",
                  amount="500")
              ar.register_payment(invoice_id=inv["invoice_id"],
                  amount="500")
              assert (ar.get_invoice(inv["invoice_id"])["status"]
                      == "PAID")
              tr = TreasuryEngine(
                  SQLiteAdapter(tmp_path / "tr.db"), FrozenClock())
              acc = tr.create_account(company_id="EMP-F",
                  account_name="Banco")
              tr.deposit(account_id=acc["account_id"],
                         amount="1000")
              assert (tr.get_account(acc["account_id"])["balance"]
                      == "1000.00")
              print("OK finance: CxC pagada + deposito 2d")
          TSEOF
          cat > apps/nexo/tests/test_government.py << 'TSEOF'
          import importlib, pathlib
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
