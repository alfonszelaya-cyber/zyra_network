name: ZYRA Fase 9b lectura del despachador del laboratorio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fase9b:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lectura del despachador (solo lectura)
        run: |
          python3 - <<'PYEOF'
          import json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          GATES = []

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('fase9b.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _manejador

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          add('# FASE 9b - LECTURA DEL DESPACHADOR (sin cambios)')
          add('')
          add('Objetivo: ver el codigo exacto para corregir SOLO la raiz del laboratorio.')
          add('Confirmado: el panel exige ZID y ASI SE QUEDA (vision del propietario).')
          add('')

          add('## L1. Archivos clave del laboratorio')
          add('')
          lab = ROOT / 'apps' / 'laboratorio'
          candidatos = [
              lab / 'infrastructure' / 'api' / 'app.py',
              lab / 'routers' / 'public' / 'ui.py',
              lab / 'server.py',
          ]
          for c in candidatos:
              add('- %s: %s (%s lineas)' % (
                  c.relative_to(ROOT),
                  'EXISTE' if c.exists() else 'AUSENTE',
                  len(txt(c).splitlines()) if c.exists() else 0))
          add('')

          add('## L2. app.py completo de infrastructure/api (el despachador)')
          add('')
          f = lab / 'infrastructure' / 'api' / 'app.py'
          if f.exists():
              ls = txt(f).splitlines()
              add('(%d lineas - se muestran hasta 120 primeras)' % len(ls))
              add('```python')
              for i, l in enumerate(ls[:120]):
                  add('%d: %s' % (i + 1, l.rstrip()[:150]))
              add('```')
          add('')

          add('## L3. Donde se monta el catalogo JSON en la raiz')
          add('')
          hits = []
          for p in lab.rglob('*.py'):
              if '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              if p.stat().st_size == 0:
                  continue
              for i, ln in enumerate(txt(p).splitlines()):
                  if re.search(r'(?i)(path\s*==\s*["\'/]|startswith\(["\']/|==\s*["\']/["\'])', ln):
                      hits.append('%s:%d: %s' % (p.relative_to(ROOT), i + 1, ln.strip()[:140]))
                      if len(hits) >= 25:
                          break
              if len(hits) >= 25:
                  break
          add('```python')
          for h in hits:
              add(h)
          add('```')
          add('')

          add('## L4. El router publico ui.py COMPLETO')
          add('')
          f2 = lab / 'routers' / 'public' / 'ui.py'
          if f2.exists():
              add('```python')
              for i, l in enumerate(txt(f2).splitlines()[:80]):
                  add('%d: %s' % (i + 1, l.rstrip()[:150]))
              add('```')
          else:
              add('- AUSENTE')
          add('')

          add('## L5. Donde se exige el ZID (el guard que NO se toca)')
          add('')
          gz = []
          for p in lab.rglob('*.py'):
              if '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              if p.stat().st_size == 0:
                  continue
              for i, ln in enumerate(txt(p).splitlines()):
                  if re.search(r'(?i)zid_ausente', ln):
                      gz.append('%s:%d: %s' % (p.relative_to(ROOT), i + 1, ln.strip()[:140]))
                      if len(gz) >= 10:
                          break
              if len(gz) >= 10:
                  break
          add('```python')
          for h in gz:
              add(h)
          add('```')
          add('')

          add('## L6. Patron de las 6 apps que SI sirven HTML en raiz (ejemplo AGRO)')
          add('')
          agro = ROOT / 'apps' / 'agro'
          ga = []
          for p in agro.rglob('*.py'):
              if '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              if p.stat().st_size == 0:
                  continue
              for i, ln in enumerate(txt(p).splitlines()):
                  if re.search(r'(?i)(MIME_HTML|text/html|<title>)', ln):
                      ga.append('%s:%d: %s' % (p.relative_to(ROOT), i + 1, ln.strip()[:140]))
                      if len(ga) >= 15:
                          break
              if len(ga) >= 15:
                  break
          add('```python')
          for h in ga:
              add(h)
          add('```')
          add('')

          add('## L7. MPE: que define su servidor (por que la raiz da 404)')
          add('')
          mpe = ROOT / 'apps' / 'mi_primer_empleo'
          mp = []
          for nombre in ('server.py', 'app.py', 'api.py'):
              p = mpe / nombre
              if not p.exists():
                  continue
              for i, ln in enumerate(txt(p).splitlines()):
                  if re.search(r'(?i)(path|route|do_GET|do_POST|/empleo|/oferta|/ui|/health)', ln):
                      mp.append('%s:%d: %s' % (nombre, i + 1, ln.strip()[:140]))
                      if len(mp) >= 20:
                          break
              if len(mp) >= 20:
                  break
          add('```python')
          for h in mp:
              add(h)
          add('```')
          add('')

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          if not fallos:
              add('**Lectura completa. Con L2-L7 se hace la correccion quirurgica en el proximo run.**')
          add('')
          add('Plan siguiente tras esta lectura (orden del propietario):')
          add('1. Corregir raiz del laboratorio (portada HTML como las demas; panel con ZID intacto).')
          add('2. Pruebas reales: primero la red completa, luego las apps una por una.')
          add('')

          DATA['archivos'] = {str(c.relative_to(ROOT)): c.exists() for c in candidatos}
          Path('fase9b.json').write_text(
              json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
              encoding='utf-8')
          escribe()
          print('Fase 9b lectura terminada')
          PYEOF

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase9b-zyra
          path: fase9b.json
          if-no-files-found: ignore
