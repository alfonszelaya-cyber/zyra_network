                      if row is None:
                          return None
                      return {"animal_id": str(
                                  row["animal_id"]),
                              "producer_id": str(
                                  row["producer_id"]),
                              "species": str(row["species"]),
                              "breed": str(row["breed"]),
                              "birth_date": str(
                                  row["birth_date"]),
                              "sire_id": str(row["sire_id"]),
                              "dam_id": str(row["dam_id"]),
                              "status": str(row["status"])}


                  def animals_of_db(db, producer_id,
                                    status=""):
                      if str(status).strip():
                          rows = db.query_all(
                              "SELECT animal_id, species,"
                              " breed, status FROM"
                              " agro_animals WHERE producer_id"
                              " = ? AND status = ? ORDER BY"
                              " rowid",
                              (str(producer_id),
