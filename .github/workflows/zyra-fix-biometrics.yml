          assert '"enabled": true' in html, html[:400]
          print("3. regla de seguridad guardada OK")

          st, html = call(opG, "GET", base + "/subastas/gov-seguridad", step="4")
          assert "Auditoria" in html
          assert "Reglas de seguridad" in html
