name: "ZYRA NEXO NG1 gateways transversales + pagos contables + auditoria dominio"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir NG1 gateways transversales
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          # ==================================================
          # 1) CONTRATOS DE EVENTOS NEXO_*
          # ==================================================
          forzar("apps/nexo/events/contracts.py", D(r'''
              """Contratos de eventos NEXO_* (catalogo oficial).

              Fuente unica de nombres de eventos NEXO_* del dominio.
              Todo evento tiene: event_id, event, source, version,
              company_id, payload, occurred_at. Solo eventos del
              catalogo pueden emitirse (produccion real, sin improvisar)."""
              from __future__ import annotations
              import uuid

              SOURCE = "nexo"
              EVENT_VERSION = "1.0"

              NEXO_COMPANY_REGISTERED = "NEXO_COMPANY_REGISTERED"
              NEXO_OPERATION_CREATED = "NEXO_OPERATION_CREATED"
              NEXO_OPERATION_COMPLETED = "NEXO_OPERATION_COMPLETED"
              NEXO_JOURNAL_POSTED = "NEXO_JOURNAL_POSTED"
              NEXO_INVOICE_POSTED = "NEXO_INVOICE_POSTED"
              NEXO_PAYMENT_RECEIVED = "NEXO_PAYMENT_RECEIVED"
              NEXO_PAYMENT_SENT = "NEXO_PAYMENT_SENT"
              NEXO_TAX_DECLARED = "NEXO_TAX_DECLARED"
              NEXO_PERIOD_CLOSED = "NEXO_PERIOD_CLOSED"
              NEXO_DOCUMENT_SEALED = "NEXO_DOCUMENT_SEALED"
              NEXO_AUDIT_APPENDED = "NEXO_AUDIT_APPENDED"

              NEXO_EVENTS = (
                  NEXO_COMPANY_REGISTERED, NEXO_OPERATION_CREATED,
                  NEXO_OPERATION_COMPLETED, NEXO_JOURNAL_POSTED,
                  NEXO_INVOICE_POSTED, NEXO_PAYMENT_RECEIVED,
                  NEXO_PAYMENT_SENT, NEXO_TAX_DECLARED,
                  NEXO_PERIOD_CLOSED, NEXO_DOCUMENT_SEALED,
                  NEXO_AUDIT_APPENDED)

              def is_valid_event(name) -> bool:
                  return name in NEXO_EVENTS

              def make_event(name, company_id="", payload=None,
                             occurred_at=None) -> dict:
                  if not is_valid_event(name):
                      raise ValueError("evento no catalogado: " + str(name))
                  return {"event_id": "NEXOEVT-" + str(uuid.uuid4()),
                          "event": name, "source": SOURCE,
                          "version": EVENT_VERSION,
                          "company_id": str(company_id),
                          "payload": dict(payload or {}),
                          "occurred_at": occurred_at}
          '''))

          # ==================================================
          # 2) MESSAGE BUS NEXO (adaptador fino, regla 69)
          # ==================================================
          forzar("apps/nexo/infrastructure/messaging/message_bus.py", D(r'''
              """Message bus NEXO (adaptador fino al bus transversal).

              Regla 69: NO duplica el bus de la Red. Si hay outbox
              inyectado lo usa (duck-typing por alias); si no, buffer
              local marcado como degradado (los eventos esperan aqui
              hasta el wiring a la Red en NG12)."""
              from __future__ import annotations
              from typing import List
              import json as _j

              class NexoMessageBus:
                  """Bus interno NEXO: publish + drain + pending."""

                  def __init__(self, outbox=None, clock=None):
                      self._outbox = outbox
                      self._clock = clock
                      self._buffer = []

                  def _publish_external(self, event) -> bool:
                      if self._outbox is None:
                          return False
                      for name in ("append", "enqueue", "publish",
                                   "put", "add"):
                          m = getattr(self._outbox, name, None)
                          if callable(m):
                              try:
                                  m(event)
                                  return True
                              except TypeError:
                                  try:
                                      m(_j.dumps(event, default=str))
                                      return True
                                  except Exception:
                                      return False
                              except Exception:
                                  return False
                      return False

                  def publish(self, event) -> dict:
                      delivered = self._publish_external(event)
                      if not delivered:
                          self._buffer.append(event)
                      return {"event_id": event.get("event_id"),
                              "event": event.get("event"),
                              "delivered_to_network": delivered,
                              "buffered": not delivered}

                  def drain(self, limit=100) -> List[dict]:
                      taken = self._buffer[:limit]
                      self._buffer = self._buffer[limit:]
                      return taken

                  def pending(self) -> int:
                      return len(self._buffer)
          '''))

          # ==================================================
          # 3) GATEWAY CURRENCY (firmas reales del engine)
          # ==================================================
          forzar("apps/nexo/services/transversal/currency/currency_gateway.py", D(r'''
              """Gateway NEXO -> CurrencyEngine transversal.

              Regla 69: el motor vive en shared_engines.currency;
              este gateway solo adapta. Firma real del engine:
              quote(*, base, quote_ccy, requester_zid) -> SignedQuote
              y convert(*, subject_zid, base, quote_ccy, amount).
              Si el motor esta inyectado se delega con esas firmas;
              si no, tasas estaticas de degradacion marcada.
              Montos Decimal (regla 61)."""
              from __future__ import annotations
              from decimal import Decimal as _D

              STATIC_RATES = {
                  "USD": {"USD": "1", "EUR": "0.92", "GTQ": "7.75",
                          "SVC": "8.75", "BTC": "0.0000152"},
                  "EUR": {"EUR": "1", "USD": "1.0870",
                          "GTQ": "8.4239", "SVC": "9.5109"},
                  "GTQ": {"GTQ": "1", "USD": "0.1290",
                          "EUR": "0.1187"},
                  "BTC": {"BTC": "1", "USD": "65789.47"},
              }

              def _rate(base, quote) -> _D:
                  if base == quote:
                      return _D("1")
                  direct = STATIC_RATES.get(base, {}).get(quote)
                  if direct:
                      return _D(direct)
                  inv = STATIC_RATES.get(quote, {}).get(base)
                  if inv:
                      return (_D("1") / _D(inv)).quantize(_D("0.000001"))
                  raise ValueError("par no soportado en degradacion: "
                                   + base + "/" + quote)

              def _extraer_rate(r) -> str:
                  for attr in ("rate", "price", "value"):
                      v = getattr(r, attr, None)
                      if v is not None:
                          return str(v)
                  if isinstance(r, dict):
                      for k in ("rate", "price", "value"):
                          if k in r:
                              return str(r[k])
                  return str(r)

              class NexoCurrencyGateway:
                  """Cotizacion y conversion multi-moneda para NEXO."""

                  def __init__(self, engine=None):
                      self._engine = engine

                  @property
                  def mode(self) -> str:
                      return ("shared_engine"
                              if self._engine is not None
                              else "static_fallback")

                  def quote(self, base, quote) -> dict:
                      if self._engine is not None:
                          try:
                              r = self._engine.quote(
                                  base=base, quote_ccy=quote,
                                  requester_zid="nexo-gateway")
                              return {"rate": _extraer_rate(r),
                                      "source": "shared_engine"}
                          except Exception:
                              pass
                          for name in ("get_quote", "rate", "get_rate"):
                              m = getattr(self._engine, name, None)
                              if callable(m):
                                  try:
                                      r = m(base, quote)
                                      return {"rate": _extraer_rate(r),
                                              "source":
                                                  "shared_engine"}
                                  except Exception:
                                      continue
                      return {"rate": str(_rate(base, quote)),
                              "source": self.mode}

                  def convert(self, amount, base, quote) -> dict:
                      amt = _D(str(amount))
                      q = self.quote(base, quote)
                      converted = (amt * _D(q["rate"])).quantize(
                          _D("0.01"))
                      return {"amount": str(amt), "from": base,
                              "to": quote, "rate": q["rate"],
                              "converted": str(converted),
                              "source": q["source"]}

                  def supported(self):
                      if self._engine is not None:
                          for name in ("supported", "currencies",
                                       "list_currencies"):
                              m = getattr(self._engine, name, None)
                              if callable(m):
                                  try:
                                      return list(m())
                                  except Exception:
                                      continue
                      todas = set(STATIC_RATES.keys())
                      for d in STATIC_RATES.values():
                          todas.update(d.keys())
                      return sorted(todas)
          '''))

          # ==================================================
          # 4) GATEWAY FINANCE (fachada, NO motor nuevo)
          # ==================================================
          forzar("apps/nexo/services/transversal/finance/finance_gateway.py", D(r'''
              """Gateway NEXO Finance (fachada del dominio, NO motor).

              Regla 69: domain/finance ya es el dueno de la logica
              financiera de NEXO. Este gateway expone esas capacidades
              al ecosistema y reporta estado honesto (sin falsos OK)."""
              from __future__ import annotations

              class NexoFinanceGateway:
                  """Fachada fina sobre los engines financieros NEXO."""

                  def __init__(self, finanzas_total=None,
                               declaration_engine=None,
                               tax_declarations=None,
                               fiscal_document_engine=None):
                      self._fin = finanzas_total
                      self._dec = declaration_engine
                      self._tax = tax_declarations
                      self._fdoc = fiscal_document_engine

                  def capabilities(self) -> dict:
                      return {"finance_master":
                                  self._fin is not None,
                              "declarations":
                                  self._dec is not None,
                              "tax_declarations":
                                  self._tax is not None,
                              "fiscal_documents":
                                  self._fdoc is not None}

                  def declare_tax(self, **kwargs) -> dict:
                      if self._tax is not None:
                          for name in ("declare", "create_declaration",
                                       "submit"):
                              m = getattr(self._tax, name, None)
                              if callable(m):
                                  r = m(**kwargs)
                                  return (r if isinstance(r, dict)
                                          else {"result": r})
                      return {"status": "not_configured",
                              "reason": "tax_declarations no inyectado"}

                  def fiscal_summary(self, **kwargs) -> dict:
                      if self._fin is not None:
                          for name in ("summary", "resumen", "status"):
                              m = getattr(self._fin, name, None)
                              if callable(m):
                                  r = m(**kwargs)
                                  return (r if isinstance(r, dict)
                                          else {"result": r})
                      return {"status": "not_configured",
                              "reason": "finanzas_total no inyectado"}
          '''))

          # ==================================================
          # 5) GATEWAY AUDIT (firma real del AuditTrail)
          # ==================================================
          forzar("apps/nexo/services/transversal/audit/audit_gateway.py", D(r'''
              """Gateway NEXO -> AuditTrail transversal (regla 69).

              Firma real: append(*, event_type, actor, subject,
              payload) -> AuditRecord. Se intenta primero con esa
              firma exacta; si no hay trail, buffer local marcado.
              Cada registro lleva quien/que/cuando/antes-despues."""
              from __future__ import annotations
              from typing import List
              import json as _j
              import uuid

              class NexoAuditGateway:
                  """Adaptador de auditoria NEXO."""

                  def __init__(self, trail=None, db=None, clock=None):
                      self._clock = clock
                      self._trail = trail
                      self._buffer = []
                      if self._trail is None and db is not None:
                          try:
                              from shared_engines.audit.chain import (
                                  AuditTrail)
                              try:
                                  self._trail = AuditTrail(db)
                              except TypeError:
                                  self._trail = None
                          except Exception:
                              self._trail = None

                  @property
                  def mode(self) -> str:
                      return ("shared_audit"
                              if self._trail is not None
                              else "local_buffer")

                  def record_event(self, *, event, actor="",
                                   entity="", before=None,
                                   after=None) -> dict:
                      rec = {"audit_id": "NAUD-" + str(uuid.uuid4()),
                             "event": event, "actor": actor,
                             "entity": entity, "before": before,
                             "after": after,
                             "ts": (self._clock.now()
                                    if self._clock is not None
                                    else None)}
                      sent = False
                      if self._trail is not None:
                          try:
                              self._trail.append(
                                  event_type=str(event),
                                  actor=str(actor),
                                  subject=str(entity),
                                  payload=rec)
                              sent = True
                          except Exception:
                              for name in ("record", "add", "log"):
                                  m = getattr(self._trail, name,
                                              None)
                                  if callable(m):
                                      try:
                                          m(rec)
                                          sent = True
                                          break
                                      except Exception:
                                          continue
                      if not sent:
                          self._buffer.append(rec)
                      return {"audit_id": rec["audit_id"],
                              "recorded": True,
                              "sent_to_network": sent,
                              "mode": self.mode}

                  def entries(self) -> List[dict]:
                      return list(self._buffer)
          '''))

          # ==================================================
          # 6) GATEWAY AI
          # ==================================================
          forzar("apps/nexo/services/transversal/ai/ai_gateway.py", D(r'''
              """Gateway NEXO -> AIChain transversal (regla 69).

              Firma real: analyze(prompt, content) -> AIResult.
              Clasificacion de documentos contables. Si la IA real
              esta disponible delega; si no, reglas simples locales
              marcadas (catalogo NexoStore: venta/compra/pago/cobro/
              ajuste)."""
              from __future__ import annotations

              RULES = (
                  ("venta", ("venta", "factura de venta", "invoice",
                             "sold")),
                  ("compra", ("compra", "purchase", "proveedor")),
                  ("pago", ("pago", "payment", "abono")),
                  ("cobro", ("cobro", "cobranza", "receipt")),
                  ("ajuste", ("ajuste", "adjustment",
                              "correccion")),
              )

              class NexoAIGateway:
                  """Clasificador de documentos contables NEXO."""

                  def __init__(self, chain=None):
                      self._chain = chain

                  @property
                  def mode(self) -> str:
                      return ("ai_chain"
                              if self._chain is not None
                              else "rules_fallback")

                  def _rules_classify(self, text):
                      t = (text or "").lower()
                      best, hits = None, 0
                      for cat, kws in RULES:
                          c = sum(1 for k in kws if k in t)
                          if c > hits:
                              best, hits = cat, c
                      return (best or "ajuste",
                              0.6 if hits else 0.3)

                  def classify_document(self, text) -> dict:
                      if self._chain is not None:
                          try:
                              r = self._chain.analyze(
                                  "clasifica documento contable "
                                  "en venta/compra/pago/cobro/ajuste",
                                  text)
                              cat = (getattr(r, "verdict", None)
                                     or getattr(r, "category", None)
                                     or (r.get("category")
                                         if isinstance(r, dict)
                                         else None)
                                     or str(r))
                              conf = getattr(r, "confidence", None)
                              out = {"category": str(cat),
                                     "source": self.mode}
                              if conf is not None:
                                  out["confidence"] = float(conf)
                              return out
                          except Exception:
                              pass
                      cat, conf = self._rules_classify(text)
                      return {"category": cat,
                              "confidence": conf,
                              "source": self.mode}
          '''))

          # ==================================================
          # 7) GATEWAY VERIFICATION
          # ==================================================
          forzar("apps/nexo/services/transversal/verification/verification_gateway.py", D(r'''
              """Gateway NEXO -> verificacion/credenciales de la Red.

              Usa NexoLink inyectado para /verification/credentials
              (credenciales financieras verificables). Sin link:
              not_configured honesto (nunca falsos OK)."""
              from __future__ import annotations

              class NexoVerificationGateway:
                  """Credenciales financieras via Red ZYRA."""

                  def __init__(self, link=None):
                      self._link = link

                  @property
                  def mode(self) -> str:
                      return ("nexo_link"
                              if self._link is not None
                              else "not_configured")

                  def request_financial_credential(self, *,
                                                   company_id,
                                                   payload=None) -> dict:
                      if self._link is not None:
                          for name in ("request_credential",
                                       "financial_credential",
                                       "credentials",
                                       "request_financial_credential"):
                              m = getattr(self._link, name, None)
                              if callable(m):
                                  try:
                                      r = m(company_id=company_id,
                                            payload=payload)
                                  except TypeError:
                                      r = m(company_id)
                                  return {"status": "requested",
                                          "via": self.mode,
                                          "result": (r if
                                                     isinstance(r, dict)
                                                     else
                                                     {"raw": str(r)})}
                      return {"status": "not_configured",
                              "reason": "NexoLink no inyectado "
                                        "(wiring pendiente NG12)"}
          '''))

          # ==================================================
          # 8) GATEWAY SECURITY
          # ==================================================
          forzar("apps/nexo/services/transversal/security/security_gateway.py", D(r'''
              """Gateway NEXO -> seguridad transversal (regla 69).

              Delegacion fina a ApiKeyManager/hardening inyectados.
              Sin motor: not_configured honesto."""
              from __future__ import annotations

              class NexoSecurityGateway:
                  """Adaptador de seguridad NEXO."""

                  def __init__(self, api_keys=None):
                      self._keys = api_keys

                  @property
                  def mode(self) -> str:
                      return ("shared_security"
                              if self._keys is not None
                              else "not_configured")

                  def check_api_key(self, key) -> dict:
                      if self._keys is not None:
                          for name in ("verify", "validate",
                                       "check", "authenticate"):
                              m = getattr(self._keys, name, None)
                              if callable(m):
                                  try:
                                      return {"status": "checked",
                                              "result": bool(m(key))}
                                  except Exception:
                                      continue
                      return {"status": "not_configured",
                              "reason": "ApiKeyManager no inyectado"}
          '''))

          # ==================================================
          # 9) DOMAIN PAYMENTS: engine contable (regla 69+61)
          # ==================================================
          forzar("apps/nexo/domain/payments/payment_engine.py", D(r'''
              """Motor de pagos de dominio NEXO (capa contable fina).

              Regla 69: el motor transversal vive en
              shared_engines.payments; NEXO NO lo duplica — lo
              consume por inyeccion (opcional) y su trabajo contable
              es registrar el impacto de cada pago + emitir eventos
              NEXO_*. Montos Decimal (regla 61)."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              DIRECTIONS = ("INCOMING", "OUTGOING")

              _MIGRATIONS = (
                  Migration(1, "nexo_payments", (
                      "CREATE TABLE IF NOT EXISTS nexo_payments (payment_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, direction TEXT NOT NULL, amount TEXT NOT NULL, currency TEXT NOT NULL DEFAULT 'USD', counterparty TEXT NOT NULL DEFAULT '', method TEXT NOT NULL DEFAULT '', reference TEXT NOT NULL DEFAULT '', status TEXT NOT NULL DEFAULT 'RECORDED', created_at REAL NOT NULL)",
                  )),
              )

              class NexoPaymentEngine:
                  """Registro contable de pagos + eventos NEXO_*."""

                  def __init__(self, db, clock,
                               payments_engine=None, bus=None):
                      self._db = db
                      self._clock = clock
                      self._shared = payments_engine
                      self._bus = bus
                      MigrationRunner(db, "nexo.payments",
                                      _MIGRATIONS).run(clock)

                  def _emit(self, event_name, company_id, payload):
                      if self._bus is None:
                          return None
                      try:
                          from apps.nexo.events.contracts import (
                              make_event)
                          ev = make_event(
                              event_name, company_id=company_id,
                              payload=payload,
                              occurred_at=self._clock.now())
                          return self._bus.publish(ev)
                      except Exception:
                          return None

                  def record_payment(self, *, company_id, direction,
                                     amount, currency="USD",
                                     counterparty="", method="",
                                     reference="") -> dict:
                      from decimal import Decimal as _D
                      val = _D(str(amount))
                      if val <= 0:
                          raise ValueError(
                              "monto debe ser positivo")
                      if direction not in DIRECTIONS:
                          direction = "INCOMING"
                      pid = "PAY-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_payments"
                              " (payment_id, company_id, direction,"
                              " amount, currency, counterparty,"
                              " method, reference, status,"
                              " created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?, ?,"
                              " 'RECORDED', ?)",
                              (pid, company_id, direction, str(val),
                               currency, counterparty, method,
                               reference, now))
                      event = ("NEXO_PAYMENT_RECEIVED"
                               if direction == "INCOMING"
                               else "NEXO_PAYMENT_SENT")
                      pub = self._emit(event, company_id,
                                       {"payment_id": pid,
                                        "amount": str(val),
                                        "currency": currency,
                                        "reference": reference})
                      return {"payment_id": pid,
                              "company_id": company_id,
                              "direction": direction,
                              "amount": str(val),
                              "currency": currency,
                              "status": "RECORDED",
                              "event_published": bool(
                                  pub and pub.get("event_id"))}

                  def get_payment(self, payment_id) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM nexo_payments"
                          " WHERE payment_id = ?", (payment_id,))
                      return self._row(row) if row else None

                  def _row(self, r) -> dict:
                      return {"payment_id": str(r["payment_id"]),
                              "company_id": str(r["company_id"]),
                              "direction": str(r["direction"]),
                              "amount": str(r["amount"]),
                              "currency": str(r["currency"]),
                              "counterparty": str(r["counterparty"]),
                              "method": str(r["method"]),
                              "reference": str(r["reference"]),
                              "status": str(r["status"]),
                              "created_at": float(r["created_at"])}

                  def payments_for(self, company_id) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_payments"
                          " WHERE company_id = ?"
                          " ORDER BY created_at", (company_id,))
                      return [self._row(r) for r in rows]

                  def mark_reconciled(self, payment_id) -> dict:
                      self._db.execute(
                          "UPDATE nexo_payments SET"
                          " status = 'RECONCILED'"
                          " WHERE payment_id = ?", (payment_id,))
                      return self.get_payment(payment_id)
          '''))

          # ==================================================
          # 10) DOMAIN PAYMENTS: validacion (FIX: id unico por fila)
          # ==================================================
          forzar("apps/nexo/domain/payments/payment_validation.py", D(r'''
              """Validacion de pagos NEXO (persistente, auditable).

              Cada chequeo inserta su propia fila con validation_id
              unico (la corrida completa comparte batch_id)."""
              from __future__ import annotations
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_payment_validations", (
                      "CREATE TABLE IF NOT EXISTS nexo_payment_validations (validation_id TEXT PRIMARY KEY, payment_ref TEXT NOT NULL, passed INTEGER NOT NULL, detail TEXT NOT NULL DEFAULT '', validated_at REAL NOT NULL)",
                  )),
              )

              class NexoPaymentValidation:
                  """Validaciones: monto, contraparte, referencia,
                  moneda soportada (via currency gateway)."""

                  def __init__(self, db, clock,
                               currency_gateway=None):
                      self._db = db
                      self._clock = clock
                      self._cur = currency_gateway
                      MigrationRunner(db, "nexo.payvalid",
                                      _MIGRATIONS).run(clock)

                  def validate_payment(self, *, amount,
                                       currency="USD",
                                       counterparty="",
                                       reference="") -> dict:
                      from decimal import Decimal as _D
                      checks = []
                      try:
                          ok = _D(str(amount)) > 0
                          detail = "monto=" + str(amount)
                      except Exception:
                          ok = False
                          detail = "monto invalido"
                      checks.append(("AMOUNT_POSITIVE", ok, detail))
                      checks.append(("COUNTERPARTY_REQUIRED",
                                     bool(counterparty.strip()),
                                     "counterparty="
                                     + (counterparty or "")))
                      checks.append(("REFERENCE_REQUIRED",
                                     bool(reference.strip()),
                                     "reference="
                                     + (reference or "")))
                      cur_ok = True
                      if self._cur is not None:
                          cur_ok = currency in self._cur.supported()
                      checks.append(("CURRENCY_SUPPORTED", cur_ok,
                                     "currency=" + currency))
                      batch_id = "PVAL-" + str(uuid.uuid4())
                      passed = all(c[1] for c in checks)
                      now = self._clock.now()
                      ids = []
                      with self._db.transaction() as cursor:
                          for ctype, cok, cdetail in checks:
                              vid = ("PVALC-"
                                     + str(uuid.uuid4()))
                              cursor.execute(
                                  "INSERT INTO"
                                  " nexo_payment_validations"
                                  " (validation_id, payment_ref,"
                                  " passed, detail, validated_at)"
                                  " VALUES (?, ?, ?, ?, ?)",
                                  (vid, ctype,
                                   1 if cok else 0, cdetail,
                                   now))
                              ids.append(vid)
                      return {"validation_id": batch_id,
                              "row_ids": ids,
                              "valid": passed,
                              "checks": [{"check": c,
                                          "passed": okk,
                                          "detail": d}
                                         for c, okk, d in checks]}
          '''))

          # ==================================================
          # 11) DOMAIN PAYMENTS: conciliacion
          # ==================================================
          forzar("apps/nexo/domain/payments/payment_reconciliation.py", D(r'''
              """Conciliacion de pagos NEXO: statement externo vs
              pagos registrados, match por referencia y monto exacto
              (Decimal). Persistente y auditable."""
              from __future__ import annotations
              import json as _j
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_payment_reconciliations", (
                      "CREATE TABLE IF NOT EXISTS nexo_payment_reconciliations (reconciliation_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, matched INTEGER NOT NULL, unmatched INTEGER NOT NULL, detail_json TEXT NOT NULL DEFAULT '[]', created_at REAL NOT NULL)",
                  )),
              )

              class NexoPaymentReconciliation:
                  """Conciliacion por referencia + monto exacto."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.payrecon",
                                      _MIGRATIONS).run(clock)

                  def reconcile(self, *, company_id, payments,
                                statement) -> dict:
                      from decimal import Decimal as _D
                      by_ref = {}
                      for s in statement or []:
                          by_ref[str(s.get("reference", ""))] = \
                              _D(str(s.get("amount", "0")))
                      matched, unmatched = [], []
                      for p in payments or []:
                          ref = str(p.get("reference", ""))
                          amt = _D(str(p.get("amount", "0")))
                          item = {"payment_id":
                                  p.get("payment_id"),
                                  "reference": ref}
                          if ref in by_ref and by_ref[ref] == amt:
                              matched.append(item)
                          else:
                              unmatched.append(item)
                      rid = "REC-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO"
                              " nexo_payment_reconciliations"
                              " (reconciliation_id, company_id,"
                              " matched, unmatched, detail_json,"
                              " created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?)",
                              (rid, company_id, len(matched),
                               len(unmatched),
                               _j.dumps({"matched": matched,
                                         "unmatched": unmatched},
                                        default=str), now))
                      return {"reconciliation_id": rid,
                              "company_id": company_id,
                              "matched": len(matched),
                              "unmatched": len(unmatched),
                              "items": {"matched": matched,
                                        "unmatched": unmatched}}
          '''))

          # ==================================================
          # 12-14) USE CASES DE PAGOS (3)
          # ==================================================
          forzar("apps/nexo/application/payments_use_cases/process_payment_use_case.py", D(r'''
              from __future__ import annotations

              class ProcessPaymentUseCase:
                  """Valida -> registra pago -> emite evento NEXO_*."""

                  def __init__(self, validation, payment_engine):
                      self._val = validation
                      self._eng = payment_engine

                  def execute(self, *, company_id, direction,
                              amount, currency="USD",
                              counterparty="", reference="",
                              method="") -> dict:
                      v = self._val.validate_payment(
                          amount=amount, currency=currency,
                          counterparty=counterparty,
                          reference=reference)
                      if not v["valid"]:
                          return {"processed": False,
                                  "validation": v}
                      p = self._eng.record_payment(
                          company_id=company_id,
                          direction=direction, amount=amount,
                          currency=currency,
                          counterparty=counterparty,
                          reference=reference, method=method)
                      return {"processed": True, "payment": p,
                              "validation": v}
          '''))

          forzar("apps/nexo/application/payments_use_cases/reconcile_payment_use_case.py", D(r'''
              from __future__ import annotations

              class ReconcilePaymentUseCase:
                  """Concilia statement externo contra pagos y marca
                  RECONCILED los matcheados."""

                  def __init__(self, reconciliation,
                               payment_engine=None):
                      self._rec = reconciliation
                      self._eng = payment_engine

                  def execute(self, *, company_id, statement,
                              payments=None) -> dict:
                      if payments is None:
                          payments = (self._eng.payments_for(
                              company_id)
                              if self._eng is not None else [])
                      r = self._rec.reconcile(
                          company_id=company_id, payments=payments,
                          statement=statement)
                      for item in r["items"]["matched"]:
                          if (self._eng is not None
                                  and item.get("payment_id")):
                              self._eng.mark_reconciled(
                                  item["payment_id"])
                      return r
          '''))

          forzar("apps/nexo/application/payments_use_cases/validate_payment_use_case.py", D(r'''
              from __future__ import annotations

              class ValidatePaymentUseCase:
                  """Validacion pura de un pago (sin registrar)."""

                  def __init__(self, validation):
                      self._val = validation

                  def execute(self, *, amount, currency="USD",
                              counterparty="", reference="") -> dict:
                      return self._val.validate_payment(
                          amount=amount, currency=currency,
                          counterparty=counterparty,
                          reference=reference)
          '''))

          # ==================================================
          # 15-17) DOMAIN AUDIT (3)
          # ==================================================
          forzar("apps/nexo/domain/audit/audit_engine.py", D(r'''
              """Motor de auditoria de dominio NEXO.

              Regla 69: el motor criptografico vive en
              shared_engines.audit; NEXO mantiene su registro de
              dominio (quien/que/cuando/antes-despues) y lo replica
              al AuditTrail transversal via gateway cuando existe."""
              from __future__ import annotations
              from typing import List
              import json as _j
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_audit_events", (
                      "CREATE TABLE IF NOT EXISTS nexo_audit_events (audit_id TEXT PRIMARY KEY, event TEXT NOT NULL, actor TEXT NOT NULL DEFAULT '', entity TEXT NOT NULL DEFAULT '', before_json TEXT NOT NULL DEFAULT '{}', after_json TEXT NOT NULL DEFAULT '{}', created_at REAL NOT NULL)",
                  )),
              )

              class NexoAuditEngine:
                  """Auditoria de dominio persistente + replicacion."""

                  def __init__(self, db, clock, gateway=None):
                      self._db = db
                      self._clock = clock
                      self._gw = gateway
                      MigrationRunner(db, "nexo.audit",
                                      _MIGRATIONS).run(clock)

                  def audit(self, *, event, actor="", entity="",
                            before=None, after=None) -> dict:
                      aid = "AUD-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_audit_events"
                              " (audit_id, event, actor, entity,"
                              " before_json, after_json, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?)",
                              (aid, event, actor, entity,
                               _j.dumps(before or {}, default=str),
                               _j.dumps(after or {}, default=str),
                               now))
                      sent = None
                      if self._gw is not None:
                          sent = self._gw.record_event(
                              event=event, actor=actor,
                              entity=entity, before=before,
                              after=after)
                      return {"audit_id": aid, "event": event,
                              "actor": actor, "entity": entity,
                              "replicated": bool(
                                  sent and sent.get("recorded"))}

                  def history(self, entity="", actor="",
                              limit=200) -> List[dict]:
                      if entity:
                          rows = self._db.query_all(
                              "SELECT * FROM nexo_audit_events"
                              " WHERE entity = ?"
                              " ORDER BY created_at DESC LIMIT ?",
                              (entity, limit))
                      elif actor:
                          rows = self._db.query_all(
                              "SELECT * FROM nexo_audit_events"
                              " WHERE actor = ?"
                              " ORDER BY created_at DESC LIMIT ?",
                              (actor, limit))
                      else:
                          rows = self._db.query_all(
                              "SELECT * FROM nexo_audit_events"
                              " ORDER BY created_at DESC LIMIT ?",
                              (limit,))
                      return [{"audit_id": str(r["audit_id"]),
                               "event": str(r["event"]),
                               "actor": str(r["actor"]),
                               "entity": str(r["entity"]),
                               "before": _j.loads(
                                   str(r["before_json"])),
                               "after": _j.loads(
                                   str(r["after_json"])),
                               "created_at": float(r["created_at"])}
                              for r in rows]
          '''))

          forzar("apps/nexo/domain/audit/audit_registry.py", D(r'''
              """Registry de auditoria NEXO: consultas agregadas."""
              from __future__ import annotations
              from typing import Dict
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database

              class NexoAuditRegistry:
                  """Consultas agregadas sobre nexo_audit_events."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock

                  def counts_by_event(self) -> Dict[str, int]:
                      rows = self._db.query_all(
                          "SELECT event, COUNT(*) AS c FROM"
                          " nexo_audit_events GROUP BY event")
                      return {str(r["event"]): int(r["c"])
                              for r in rows}

                  def counts_by_actor(self) -> Dict[str, int]:
                      rows = self._db.query_all(
                          "SELECT actor, COUNT(*) AS c FROM"
                          " nexo_audit_events GROUP BY actor")
                      return {str(r["actor"]): int(r["c"])
                              for r in rows}

                  def last_for_entity(self, entity):
                      row = self._db.query_one(
                          "SELECT audit_id, event, created_at FROM"
                          " nexo_audit_events WHERE entity = ?"
                          " ORDER BY created_at DESC LIMIT 1",
                          (entity,))
                      if not row:
                          return None
                      return {"audit_id": str(row["audit_id"]),
                              "event": str(row["event"]),
                              "created_at": float(row["created_at"])}
          '''))

          forzar("apps/nexo/domain/audit/audit_validation.py", D(r'''
              """Validacion de registros de auditoria NEXO."""
              from __future__ import annotations

              class NexoAuditValidation:
                  """Un registro valido lleva event, actor, entity."""

                  REQUIRED = ("event", "actor", "entity")

                  def validate_record(self, record) -> dict:
                      missing = []
                      for f in self.REQUIRED:
                          if f not in record or record[f] in (None,
                                                              ""):
                              missing.append(f)
                      return {"valid": len(missing) == 0,
                              "missing": missing}
          '''))

          out("## FIN NG1: gateways + bus + eventos + pagos + auditoria")
          exit(0)
          PYEOF

