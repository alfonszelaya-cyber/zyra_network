      - name: "Paso 4 - tests GPT-1/2 añadidos a test_agro_superapp.py (archivo existente)"
        run: |
          python3 - <<'TSTEOF'
          import textwrap
          from pathlib import Path

          p = Path("apps/agro/tests/test_agro_superapp.py")
          t = p.read_text(encoding="utf-8")
          if "test_producer_profile_unit_document" in t:
              print("SKIP superapp (ya tiene tests C)")
              raise SystemExit(0)

          EXTRA = textwrap.dedent('''\


              # ============ GPT-1/2: perfil/unidades/planes ============


              def test_producer_profile_unit_document(tmp_path: Path) -> None:
                  dead = NetworkClient("http://127.0.0.1:1",
                                       timeout_seconds=1.0, max_retries=0)
                  srv = serve_agro(
                      AgroStore(SQLiteAdapter(":memory:"), FrozenClock()), dead)
                  threading.Thread(target=srv.serve_forever, daemon=True).start()
                  time.sleep(0.4)
                  base = f"http://127.0.0.1:{srv.bound_port}"
                  pid = _register(base, "Carlos Perfil")

                  st, body = _post(base, "/agro/perfil", {
                      "producer_id": pid, "phone": "7777",
                      "location": "Norte", "notes": "cafe"})
                  assert st == 200, str(body)
                  st, body = _get(base, "/agro/perfil/" + pid)
                  d = json.loads(body)["data"]
                  assert d["phone"] == "7777"
                  assert d["location"] == "Norte"

                  st, body = _post(base, "/agro/unit", {
                      "producer_id": pid, "name": "Finca Uno",
                      "unit_type": "agricola"})
                  assert st == 201, str(body)
                  unit_id = body["data"]["unit_id"]
                  st, body = _get(base, "/agro/units/" + pid)
                  assert len(json.loads(body)["data"]["units"]) == 1

                  st, body = _post(base, "/agro/plan", {
                      "producer_id": pid, "unit_id": unit_id,
                      "crop": "maiz", "planned_quantity": 100})
                  assert st == 201, str(body)

                  st, body = _post(base, "/agro/plan", {
                      "producer_id": pid, "unit_id": "UNI-fantasma",
                      "crop": "maiz", "planned_quantity": 10})
                  assert st == 400, "unidad fantasma debe rechazar"

                  st, body = _post(base, "/agro/document", {
                      "producer_id": pid, "doc_kind": "dui",
                      "content_b64": "c2VtYXBh"})
                  assert st == 201, str(body)
                  doc_id = body["data"]["doc_id"]
                  assert body["data"]["content_sha256"]
                  st, body = _get(base, "/agro/docs/" + pid)
                  assert len(json.loads(body)["data"]["documents"]) == 1


              def test_production_plan_stages_incident_yield(
                  tmp_path: Path,
              ) -> None:
                  dead = NetworkClient("http://127.0.0.1:1",
                                       timeout_seconds=1.0, max_retries=0)
                  srv = serve_agro(
                      AgroStore(SQLiteAdapter(":memory:"), FrozenClock()), dead)
                  threading.Thread(target=srv.serve_forever, daemon=True).start()
                  time.sleep(0.4)
                  base = f"http://127.0.0.1:{srv.bound_port}"
                  pid = _register(base, "Dora Etapas")
                  st, body = _post(base, "/agro/unit", {
                      "producer_id": pid, "name": "Parcela Sur",
                      "unit_type": "agricola"})
                  unit_id = body["data"]["unit_id"]

                  st, body = _post(base, "/agro/plan", {
                      "producer_id": pid, "unit_id": unit_id,
                      "crop": "frijol", "planned_quantity": 100})
                  assert st == 201
                  plan_id = body["data"]["plan_id"]

                  for expected in ("planted", "growing", "harvested"):
                      st, body = _post(base, "/agro/plan/advance", {
                          "plan_id": plan_id, "detail": "paso " + expected})
                      assert st == 200, str(body)
                      assert body["data"]["to_stage"] == expected

                  st, body = _post(base, "/agro/plan/advance", {
                      "plan_id": plan_id})
                  assert st == 400, "no debe avanzar pasado harvested"

                  st, body = _get(base, "/agro/plans/" + pid)
                  plans = json.loads(body)["data"]["plans"]
                  assert len(plans) == 1
                  stages = [s["stage"] for s in plans[0]["stages"]]
                  assert stages == [
                      "planned", "planted", "growing", "harvested"
                  ]

                  st, body = _post(base, "/agro/incident", {
                      "producer_id": pid, "unit_id": unit_id,
                      "kind": "plaga", "severity": "alta",
                      "detail": "mosca blanca"})
                  assert st == 201, str(body)
                  inc_id = body["data"]["incident_id"]
                  st, body = _get(base, "/agro/incidents/" + pid)
                  assert len(json.loads(body)["data"]["incidents"]) == 1
                  st, body = _post(base, "/agro/incident/resolve", {
                      "incident_id": inc_id})
                  assert st == 200 and body["data"]["status"] == "resolved"

                  _post(base, "/agro/production", {
                      "producer_id": pid, "product": "frijol",
                      "quantity": 80, "unit": "quintal"})
                  st, body = _get(base, "/agro/yield/" + pid)
                  d = json.loads(body)["data"]
                  assert d["planned_harvested"] == 100.0
                  assert d["produced"] == 80.0
                  assert d["efficiency"] == 0.8
              ''')

          t = t + EXTRA
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          print("OK superapp +2 tests GPT-1/2")
          TSTEOF

      - name: "Paso 5 - SMOKE: flujo completo GPT-1/2"
        run: |
          python3 - <<'SMOKEEOF'
          import json
          import threading
          import time
          import urllib.error
          import urllib.request

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from apps.agro.infrastructure.network.network_client import NetworkClient
          from apps.agro.infrastructure.persistence.agro_store import AgroStore
          from apps.agro.server import serve_agro

          dead = NetworkClient("http://127.0.0.1:1", timeout_seconds=1.0, max_retries=0)
          store = AgroStore(SQLiteAdapter(":memory:"), FrozenClock())
          srv = serve_agro(store, dead)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base = f"http://127.0.0.1:{srv.bound_port}"

          def seed(n):
              return (n.strip().encode("utf-8").hex() + "zyra" * 16)[:64]

          def post(path, doc, role="agricultor"):
              h = {"Content-Type": "application/json",
                   "X-ZYRA-Actor-Role": role}
              req = urllib.request.Request(
                  base + path, data=json.dumps(doc).encode(),
                  headers=h, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          def get(path):
              with urllib.request.urlopen(base + path, timeout=10) as r:
                  return r.status, r.read().decode("utf-8", "replace")

          st, body = post("/agro/producers", {
              "name": "Smoke C", "producer_type": "agricultor",
              "location": "X", "doc_image_b64": seed("Smoke C"),
              "selfie_image_b64": seed("Smoke C")})
          pid = json.loads(body)["data"]["producer_id"]
          print("register:", st)

          st, body = post("/agro/perfil", {"producer_id": pid, "phone": "777"})
          print("perfil:", st)
          st, body = post("/agro/unit", {"producer_id": pid, "name": "U1"})
          print("unit:", st)
          uid = json.loads(body)["data"]["unit_id"]
          st, body = post("/agro/document", {"producer_id": pid, "doc_kind": "dui", "content_b64": "abc"})
          print("document:", st)
          did = json.loads(body)["data"]["doc_id"]
          st, body = post("/agro/document/verify", {"doc_id": did}, role="gobierno")
          print("document verify (gobierno):", st)
          st, body = post("/agro/plan", {"producer_id": pid, "unit_id": uid, "crop": "maiz", "planned_quantity": 50})
          print("plan:", st)
          pl = json.loads(body)["data"]["plan_id"]
          for i in range(3):
              st, body = post("/agro/plan/advance", {"plan_id": pl})
              print("advance", i + 1, "->", st)
          st, body = post("/agro/incident", {"producer_id": pid, "kind": "sequia", "severity": "alta"})
          print("incident:", st)
          st, body = get("/agro/yield/" + pid)
          print("yield:", json.loads(body)["data"])
          print("SMOKE COMPLETADO")
          SMOKEEOF

