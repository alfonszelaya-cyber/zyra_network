          '''

          RECHAZOS = []

          def suma(s):
              SUM = os.environ.get("GITHUB_STEP_SUMMARY") or os.path.join(os.getcwd(), "_zyra", "resumen.md")
              d = os.path.dirname(SUM)
              if d and not os.path.isdir(d):
                  os.makedirs(d, exist_ok=True)
              with open(SUM, "a", encoding="utf-8") as f:
                  f.write(s.rstrip() + "\n")

          def rechazo(m):
              RECHAZOS.append(m)
              suma("- RECHAZO: " + m)

          class Rechazo(Exception):
              pass

          def bloque_js(t):
              return [m.group(1) for m in re.finditer(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", t, re.S | re.I)]

          def node_check(cod):
              fd, p = tempfile.mkstemp(suffix=".js")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(cod)
                  r = subprocess.run(["node", "--check", p], capture_output=True, text=True, timeout=90)
                  return (r.returncode == 0), ((r.stderr or "") + (r.stdout or "")).strip()
              except Exception as e:
                  return False, str(e)
              finally:
                  try: os.unlink(p)
                  except Exception: pass

          def node_run(p):
              try:
                  r = subprocess.run(["node", p], capture_output=True, text=True, timeout=90)
                  return (r.returncode == 0), ((r.stderr or "") + (r.stdout or "")).strip()
              except Exception as e:
                  return False, str(e)

          def pyok(texto):
              fd, p = tempfile.mkstemp(suffix=".py")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(texto)
                  py_compile.compile(p, cfile=p + "c", doraise=True)
                  return True, ""
              except Exception as e:
                  return False, str(e)
              finally:
                  try: os.unlink(p)
                  except Exception: pass
                  try: os.unlink(p + "c")
                  except Exception: pass

          def limpiar(x):
              x = re.sub(r"<script>\s*/\*ZYRA-V6-BEGIN\*/.*?/\*ZYRA-V6-END\*/\s*</script>\n?", "", x, flags=re.S)
              x = re.sub(r"/\*ZYRA-V6-BEGIN\*/.*?/\*ZYRA-V6-END\*/\n?", "", x, flags=re.S)
              x = re.sub(r"/\*ZYRA-V5-IIFE-BEGIN\*/.*?/\*ZYRA-V5-IIFE-END\*/\n?", "", x, flags=re.S)
              x = re.sub(r"/\*ZYRA-V5-CSS-BEGIN\*/.*?/\*ZYRA-V5-CSS-END\*/\n?", "", x, flags=re.S)
              return x

          def _posicion_umbral(t):
              umbral = -1
              for pat in (r"<html", r"id=[\"']ps1[\"']", r"id=[\"']nombre[\"']"):
                  m = re.search(pat, t, re.I)
                  if m and m.start() > umbral:
                      umbral = m.start()
              return umbral

          def _candidatos(t):
              umbral = _posicion_umbral(t)
              sale = []
              for tok in ("</body>", "</html>", "</script>"):
                  p = t.rfind(tok)
                  while p > 0:
                      if p > umbral:
                          sale.append((tok, p))
                          break
                      p = t.rfind(tok, 0, p)
              sale.sort(key=lambda x: (["</body>", "</html>", "</script>"].index(x[0])))
              vistos = set()
              unicos = []
              for tok, p in sale:
                  if p not in vistos:
                      vistos.add(p)
                      unicos.append((tok, p))
              return unicos

          def aplicar(t):
              """Recibe texto base limpio, devuelve (texto_parchado, info). Lanza Rechazo si no hay punto seguro."""
              if MARCA_INI in t or MARCA_FIN in t:
                  raise Rechazo("marcadores v6 preexistentes no eliminados")
              for req in ("bIr4", "bIr5"):
                  if req not in t:
                      raise Rechazo("no se encontro " + req + " en superapp.py (anclas de los gates)")
              if "docVencido" in PAYLOAD:
                  raise Rechazo("el nucleo v6 no debe tocar docVencido")
              for tok in ("nombreNoCoincide", "bioRechazada"):
                  if tok in PAYLOAD:
                      raise Rechazo("el nucleo v6 no debe tocar " + tok)
              umbral = _posicion_umbral(t)
              errores = []
              for tok, pos in _candidatos(t):
                  for nombre_var, codigo in (
                      ("simple", "try{eval(atob('" + PAYLOAD_B64 + "'))}catch(_ze){}"),
                      ("doble", "try{eval(atob(\"" + PAYLOAD_B64 + "\"))}catch(_ze){}"),
                  ):
                      if tok == "</script>":
                          frag = MARCA_INI + codigo + MARCA_FIN
                      else:
                          frag = "<script>" + MARCA_INI + codigo + MARCA_FIN + "</script>"
                      cand = t[:pos] + frag + t[pos:]
                      okc, msgc = pyok(cand)
                      if okc:
                          return cand, {"ancla": tok, "posicion": pos, "variante": nombre_var, "tam": len(frag), "umbral": umbral}
                      errores.append(tok + "/" + nombre_var + ": " + (msgc.splitlines() or ["?"])[0][:160])
              raise Rechazo("ningun punto de insercion seguro (py_compile fallo en todas las variantes): " + " | ".join(errores[-3:]))

          def _pruebas_js(info):
              m = re.search(r"/\*ZTEST-BEGIN\*/(.*?)/\*ZTEST-END\*/", PAYLOAD, re.S)
              if not m:
                  rechazo("no se encontro la seccion ZTEST en el nucleo v6")
                  return
              d = os.path.join(os.getcwd(), "_zyra")
              os.makedirs(d, exist_ok=True)
              ptest = os.path.join(d, "pruebas_v6.js")
              with open(ptest, "w", encoding="utf-8") as f:
                  f.write(STUBS + "\n" + m.group(1) + "\n" + TESTS + "\n")
              okp, sal = node_run(ptest)
              if okp:
                  ultima = (sal.splitlines() or ["OK"])[-1]
                  suma("- Pruebas JS de los gates con casos reales: OK (" + ultima + ")")
              else:
                  rechazo("pruebas JS fallaron: " + sal[:300])

          def main():
              suma("")
