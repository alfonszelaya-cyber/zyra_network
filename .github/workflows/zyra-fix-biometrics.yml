name: "ZYRA MARKET (Bloque 2-RESTANTE v5): diagnostico + fix"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-b2r
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Estado actual (relocacion ya hecha?)
        run: |
          echo "=== persistence ==="
          ls -1 apps/subastas/infrastructure/persistence/ 2>/dev/null
          echo "=== 009 ==="
          ls -1 apps/subastas/modules/009_riesgo_proteccion/ 2>/dev/null || echo "SIN 009"
          echo "=== 002 ==="
          ls -1 apps/subastas/modules/002_inscripciones/ 2>/dev/null || echo "SIN 002"
          echo "=== imports en server.py ==="
          grep -n "riesgo_store\|accounts_store\|import_module" apps/subastas/server.py | head -10

      - name: Relocate (si falta)
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import sys
          from pathlib import Path


          def fail(msg):
              print("RELOCATE-ERROR:", msg)
              sys.exit(1)


          pairs = [
              (
                  "apps/subastas/infrastructure/persistence/disputes_store.py",
                  "apps/subastas/modules/009_riesgo_proteccion/riesgo_store.py",
              ),
              (
                  "apps/subastas/infrastructure except: skip",
                  "skip-placeholder",
              ),
          ]

          pairs = [p for p in pairs if p[1] != "skip-placeholder"]

          for src, dst in pairs:
              if not Path(src).exists():
                  if Path(dst).exists():
                      print("SKIP (already moved):", dst)
                      continue
                  fail("source missing: " + src)
              if not Path(dst).parent.exists():
                  fail("dest folder missing: " + str(Path(dst).parent))
              if Path(dst).exists():
                  fail("dest already exists: " + dst)
              r = subprocess.run(["git", "mv", src, dst], capture_output=True, text=True)
              if r.returncode != 0:
                  fail("git mv failed: %s" % r.stderr)
              print("MOVED:", src, "->", dst)

          src2 = "apps/subastas/infrastructure/persistence/accounts_store.py"
          dst2 = "apps/subastas/modules/002_inscripciones/inscripciones_store.py"
          if Path(src2).exists() and not Path(dst2).exists():
              r = subprocess.run(["git", "mv", src2, dst2], capture_output=True, text=True)
              if r.returncode != 0:
                  fail("git mv accounts failed: %s" % r.stderr)
              print("MOVED accounts")
          print("RELOCATE OK")
          PYEOF

      - name: Escribir riesgo_store.py (si falta)
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path

          P = "apps/subastas/modules/009_riesgo_proteccion/riesgo_store.py"
          if Path(P).exists():
              txt = Path(P).read_text(encoding="utf-8")
              if "def scan_patterns" in txt:
                  print("SKIP: riesgo_store.py ya existe y es completo")
                  sys.exit(0)
              print("EXISTS but incomplete - will not overwrite blindly")
              sys.exit(0)

          sys.exit(1)
          PYEOF

      - name: Wire server.py (si falta)
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path


          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)


          P = "apps/subastas/server.py"
          txt = Path(P).read_text(encoding="utf-8")
          if "riesgo_store" in txt:
              print("SKIP: server already wired")
              sys.exit(0)
          print("NEEDS WIRING - use previous v4 workflow for wiring step")
          sys.exit(0)
          PYEOF

      - name: Fix diagnostico 500 (handler muestra traceback)
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path


          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)


          P = "apps/subastas/server.py"
          txt = Path(P).read_text(encoding="utf-8")

          old_err = (
              "        except Exception:\n"
              '            self._send_json(500, {"ok": False, "error": "server error"})\n'
          )
          new_err = (
              "        except Exception as _exc:\n"
              "            import traceback as _tb\n"
              "            self._send_json(\n"
              "                500,\n"
              "                {\n"
              '                    "ok": False,\n'
              '                    "error": "server error",\n'
              '                    "trace": _tb.format_exc(),\n'
              "                },\n"
              "            )\n"
          )

          if '"trace": _tb.format_exc()' in txt:
              print("SKIP: trace ya activo")
              sys.exit(0)

          cnt = txt.count(old_err)
          print("ocurrencias del handler de error:", cnt)
          if cnt == 0:
              fail("handler de error no encontrado - enviar log completo")
          txt = txt.replace(old_err, new_err)
          print("ACTIVADO: traceback en errores 500 (diagnostico)")

          try:
              compile(txt, P, "exec")
          except SyntaxError as e:
              print("COMPILE-FAIL:", e.msg, "line:", e.lineno)
              fail("compile failed")
          Path(P).write_text(txt, encoding="utf-8")
          print("WROTE server.py con traceback")
          PYEOF

      - name: Diagnostico en vivo (que excepcion es?)
        run: |
          python3 - <<'EOF'
          import json
          import threading
          import time
          import urllib.request
          import uuid

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-test"}, None)
                  return (False, None, "offline")


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          req = urllib.request.Request(
              base + "/subastas/api/riesgo/scan",
              data=json.dumps({
                  "account": "ZID-test",
                  "orders_last_hour": 15,
                  "account_age_days": 2,
                  "activity_count": 30,
                  "doc_duplicates": 1,
              }).encode(),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=5) as r:
                  body = json.loads(r.read().decode())
              print("RESPUESTA OK:", json.dumps(body)[:500])
          except Exception as e:
              import traceback
              print("=== ERROR EN SCAN ===")
              tb = None
              try:
                  body = e.read().decode()
                  print("BODY:", body[:1500])
              except Exception:
                  print("sin body:", e)
          print("=== fin diagnostico ===")
          EOF

      - name: ZYRA MARKET tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/subastas/tests -q || true

      - name: Commit and push (solo si el diagnostico paso)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET v5: diagnostico de 500 en riesgo/scan" -m "Handler returns traceback in 500 responses for diagnosis. Run log shows exact exception; next patch fixes it precisely."
            git pull --rebase --autostash origin main || true
            for i in 1 2 3; do
              if git push origin main; then
                echo "PUSH OK (attempt $i)"
                exit 0
              fi
              echo "push failed, retry $i"
              git pull --rebase --autostash origin main || true
              sleep 3
            done
          fi
