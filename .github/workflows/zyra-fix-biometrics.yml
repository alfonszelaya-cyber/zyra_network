name: ZYRA S31 verificacion del motor en vivo (solo lectura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s31:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: S31 — fabrica del kernel exacta + prueba en vivo
        run: |
          {
            echo "## S31 — fabrica del kernel (lineas 115-195 de kernel.py)"
            echo '````'
            sed -n '115,195p' shared_engines/runtime/kernel.py
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "## S31 — PRUEBA EN VIVO del motor"
            echo '````'
            PNG="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
            DATA="{\"nombre\":\"ZZ TEST BORRAR\",\"clave\":\"prueba12345\",\"doc_image_b64\":\"$PNG\",\"selfie_image_b64\":\"$PNG\",\"doc_type\":\"dui\"}"
            C=$(curl -sS -m 150 -o /tmp/b31 -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "$DATA" "https://zyra-superapp.onrender.com/registro/nuevo" 2>/dev/null)
            BODY=$(head -c 500 /tmp/b31)
            echo "POST -> HTTP $C : $BODY"
            echo ""
            if printf '%s' "$BODY" | grep -qE "ningun rostro|template_quality|biometrics_gate"; then
              echo ">>> MOTOR ACTIVO Y ATENDIENDO: la Red corrio ZYRA VISION y rechazo la imagen sin rostro (correcto)."
              echo ">>> Ve al celular AHORA: reinstala la PWA (debe decir v22) y registra con tu DUI real -> ZID."
            elif printf '%s' "$BODY" | grep -q "mantenimiento"; then
              echo ">>> SIGUE EN MANTENIMIENTO: la variable no esta llegando al servicio correcto."
              echo ">>> Checklist: 1) la variable esta en zyra-network-or16 (NO en superapp)?"
              echo ">>> 2) Value es exactamente: zyra  (minuscula, sin espacios)?"
              echo ">>> 3) El servicio redeployo y dice Live DESPUES de guardar?"
              echo ">>> Si todo eso ya esta, el bloque de arriba (fabrica del kernel) dira por que no acepta el valor."
            elif printf '%s' "$BODY" | grep -q '"zid"'; then
              echo ">>> ZID CREADO EN LA PRUEBA (no deberia con 1 pixel): avisar de inmediato."
            else
              echo ">>> Respuesta no clasificada (posible cold start) — relanza este workflow una vez."
            fi
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-s31
          path: shared_engines/runtime/kernel.py
