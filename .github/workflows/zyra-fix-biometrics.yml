              { echo "### REG $2 detalle"; echo '```'; tail -100 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          if [ "$(cat /tmp/x1)" = "0" ] && [ "$(cat /tmp/x2)" = "0" ] && [ "$(cat /tmp/x3)" = "0" ] && [ "$(cat /tmp/x4)" = "0" ]; then echo 0 > /tmp/xall; else echo 1 > /tmp/xall; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si TODO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in sm78 xall; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: SM7+SM8 VERDES — LABS+INNOVACION+INVESTIGACION+BIBLIOTECA + 11 MENUS+TRANSPORTE+PATCH**"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/semilla
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(SEMILLA-SM7+SM8): Laboratorios (proyectos/experimentos en 9 tipos de lab con resultados) + Innovacion (startups IDEA->INCUBATING->LAUNCHED + patentes FILED->GRANTED) + Investigacion (crear->publicar) + Biblioteca (catalogo + prestamos transaccionales + busqueda) + Transporte escolar (rutas/paradas/estudiantes con cupos) + 11 menus de modulos SEMILLA (arquitectura del ZIP) + menu registry + modules router + menu_server_patch aditivo (regla 51, SE-1 intacto) + inyeccion AST generica en server con skip honesto (SM7+SM8 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — SM7+SM8 CERRADOS. Solo falta SM9 calidad+seguridad final para TERMINAR SEMILLA.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
