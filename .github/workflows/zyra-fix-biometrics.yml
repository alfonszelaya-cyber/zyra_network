name: ZYRA D14b mensajes limpios y motor facial en render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD14b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: D14b
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, py_compile, re, secrets, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SPY = ROOT / 'superapp.py'
          PT = ROOT / 'portal'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 'faseD14b.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  r = OP.open(q, timeout=25)
                  return r.status, r.headers, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, None, str(e)
          def png(rgb):
              def ck(t, d):
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              ih = struct.pack('>IIBBBBB', 32, 32, 8, 2, 0, 0, 0)
              f = b'\x00' + bytes(rgb) * 32
              return b'\x89PNG\r\n\x1a\n' + ck(b'IHDR', ih) + ck(b'IDAT', zlib.compress(f * 32)) + ck(b'IEND', b'')
          DOC = base64.b64encode(png((90, 90, 160))).decode()
          SEL = base64.b64encode(png((160, 90, 90))).decode()
          orig = {'sp': SPY.read_bytes(),
                  'reg': (PT / 'registro.html').read_bytes(),
                  'ver': (PT / 'verificar.html').read_bytes() if (PT / 'verificar.html').exists() else b''}
          def revertir():
              try:
                  SPY.write_bytes(orig['sp'])
                  (PT / 'registro.html').write_bytes(orig['reg'])
                  if orig['ver']:
                      (PT / 'verificar.html').write_bytes(orig['ver'])
              except Exception:
                  pass
          t0 = orig['sp'].decode('utf-8')
          add('# D14b - MENSAJES LIMPIOS + MOTOR FACIAL EN RENDER')
          add('')
          add('## N1. Motor facial ACTIVADO (estai pagando Render: RAM y librerias)')
          add('')
          reqf = ROOT / 'requirements-render.txt'
          reqf_txt = reqf.read_text(encoding='utf-8') if reqf.exists() else ''
          LINS = ['cryptography', 'numpy>=1.24,<2.0',
                  'opencv-python-headless>=4.8,<5.0', 'onnxruntime>=1.16,<2.0']
          nuevas = []
          for l in LINS:
              base = l.split('>=')[0].split('<')[0].strip()
              if base.lower() not in reqf_txt.lower():
                  nuevas.append(l)
          if nuevas:
              nuevo_txt = reqf_txt.rstrip() + '\n' + '\n'.join(nuevas) + '\n'
              reqf.write_text(nuevo_txt, encoding='utf-8')
              add('- anadidas a requirements-render.txt: %s' % ', '.join(nuevas))
          else:
              add('- ya estaban.')
          gate('deps_faciales', True)
          add('')
          add('## N2. Mensajes claros del registro (JS LIMPIO, sin escapes rotos)')
          add('')
          t_reg = orig['reg'].decode('utf-8')
          m = re.search(r'async function enviar\(ev\)\{.*?return false;\}', t_reg, re.S)
          if not m:
              add('**NO ENCONTRE la funcion enviar en registro.html: nada editado ahi.**')
              gate('registro_encontrado', False)
          else:
              nuevo_js = """async function enviar(ev){ev.preventDefault();
var R=document.getElementById("resp");
var c1=document.getElementById("clave").value;
var c2=document.getElementById("clave2").value;
if(c1!==c2){R.innerHTML="<p style='color:#f85149'>Las claves no coinciden.</p>";return false;}
var db=document.getElementById("docFrente").dataset.b64||"";
var da=document.getElementById("docAtras")?document.getElementById("docAtras").dataset.b64||"":"";
var sb=document.getElementById("bself").dataset.selfie||"";
if(!db){R.innerHTML="<p>Falta la foto del documento.</p>";return false;}
if(!sb){R.innerHTML="<p>Falta la selfie.</p>";return false;}
R.innerHTML="<p style='color:#8b949e'>Enviando a la Red y verificando biometria...</p>";
try{
var r=await fetch("/registro/nuevo",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({nombre:document.getElementById("nombre").value,clave:c1,doc_image_b64:db,doc_back_b64:da,selfie_image_b64:sb})});
var j=await r.json();
if(j.ok&&j.zid){
R.innerHTML="<div style='background:#0f2a1a;border:1px solid #238636;border-radius:12px;padding:14px'><p style='color:#3fb950;font-weight:800;font-size:17px;margin:4px 0'>REGISTRO EXITOSO</p><p>Tu ZID unico fue creado:</p><p class='zid'>"+j.zid+"</p><p>Guarda tu ZID y tu clave. Nadie mas los tiene.</p><p><a href='/entrar'>ENTRAR AHORA</a></p></div>";
}
else if(j.codigo==="mantenimiento"){
R.innerHTML="<div style='background:#2a2410;border:1px solid #f0b429;border-radius:12px;padding:14px'><p style='color:#f0b429;font-weight:800;font-size:16px;margin:4px 0'>BIOMETRIA EN MANTENIMIENTO</p><p>El motor de rostro esta siendo actualizado. Tu solicitud quedo guardada.</p><p><a href='/registro'>Volver a intentar</a></p></div>";
}
else{
R.innerHTML="<p style='color:#f85149;font-weight:700'>NO SE PUDO CREAR EL ZID</p><p>"+(j.error||"Motivo desconocido")+"</p>";
}
}catch(e){
R.innerHTML="<p style='color:#f85149'>Error de conexion. Intenta de nuevo.</p>";
}
return false;}"""
              t_reg2 = t_reg[:m.start()] + nuevo_js + t_reg[m.end():]
              (PT / 'registro.html').write_text(t_reg2, encoding='utf-8')
              gate('registro_js', True)
              add('- funcion enviar reescrita limpia con 3 mensajes claros.')
          add('')
          add('## N3. Verificador claro')
          add('')
          VER = ('<!doctype html><html lang="es"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<title>Verificar - ZYRA</title><style>'
              'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:#0a0e27;'
              'color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:28px 14px;box-sizing:border-box}'
              '.caja{max-width:480px;width:100%;background:#11162b;border:1px solid #242c4f;'
              'border-radius:16px;padding:24px 20px;box-sizing:border-box}'
              'h1{margin:0 0 6px;font-size:21px;text-align:center}'
              'p{color:#8b949e;font-size:13px;line-height:1.4;margin:6px 0;text-align:center}'
              'textarea{width:100%;min-height:110px;padding:12px;border-radius:10px;border:1px solid #30363d;'
              'background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:14px;resize:vertical}'
              'button{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:none;'
              'background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);color:#fff;font-size:15px;font-weight:700}'
              'a{color:#8b5cf6;text-decoration:none}'
              '#resp{margin-top:12px;text-align:center;font-size:14px;word-break:break-all}'
              '</style></head><body><div class="caja">'
              '<h1>Verificador de ZYRA</h1>'
              '<p>Pega el codigo del documento o certificado.</p>'
              '<textarea id="codigo" placeholder="Pega aqui..."></textarea>'
              '<button onclick="verificar()">Verificar</button>'
              '<div id="resp"></div>'
              '<p style="margin-top:14px"><a href="/">Volver</a></p></div>'
              '<script>'
              'async function verificar(){var R=document.getElementById("resp");'
              'var c=document.getElementById("codigo").value.trim();'
              'if(!c){R.innerHTML="<p style=\'color:#f0b429\'>Pega un codigo.</p>";return;}'
              'R.innerHTML="<p>Consultando a la Red...</p>";'
              'try{var r=await fetch("/verificar/check",{method:"POST",headers:{"Content-Type":"application/json"},'
              'body:JSON.stringify({codigo:c})});var j=await r.json();'
              'if(j.ok===true){R.innerHTML="<div style=\'background:#0f2a1a;border:1px solid #238636;border-radius:12px;padding:14px\'>'
              '<p style=\'color:#3fb950;font-weight:800;font-size:17px\'>AUTENTICO</p><p>"+(j.detalle||"La Red confirma")+"</p></div>";}'
              'else if(j.codigo==="no_encontrado"){R.innerHTML="<div style=\'background:#2a1414;border:1px solid #f85149;border-radius:12px;padding:14px\'>'
              '<p style=\'color:#f85149;font-weight:800;font-size:17px\'>NO AUTENTICO</p><p>La Red no reconoce este codigo.</p></div>";}'
              'else{R.innerHTML="<p style=\'color:#f0b429\'>"+(j.detalle||j.error||"No se pudo verificar")+"</p>";}}'
              'catch(e){R.innerHTML="<p style=\'color:#f0b429\'>Sin conexion. Intenta de nuevo.</p>";}}'
              '</script></body></html>')
          (PT / 'verificar.html').write_text(VER, encoding='utf-8')
          gate('verificador', True)
          add('')
          add('## N4. superapp.py: mantenimieto guardado + /verificar/check')
          add('')
          t = t0
          n_ed = 0
          if '/registro/nuevo' not in t:
              add('**/registro/nuevo NO existe: nada que editar. Anchors no validos.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('faseD14b.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('SIN REGISTRO - sin cambios')
          if 'biometrics_unavailable' not in t:
              VIEJO_ERR = ('            if not ok_r:\n'
                           '                self._send(502, "application/json", json.dumps({"ok": False, "error": "La Red responde: " + str(er)[:250]}).encode())\n'
                           '                return')
              NUEVO_ERR = ('            if not ok_r:\n'
                           '                er_txt = str(er)\n'
                           '                if "biometrics_unavailable" in er_txt or "face engine not installed" in er_txt:\n'
                           '                    try:\n'
                           '                        import sqlite3 as _sq2\n'
                           '                        con2 = _sq2.connect(str(DATA_DIR / "credenciales.db"))\n'
                           '                        con2.execute("CREATE TABLE IF NOT EXISTS pendientes (nombre TEXT, doc_b64 TEXT, selfie_b64 TEXT, fecha TEXT)")\n'
                           '                        con2.execute("INSERT INTO pendientes VALUES (?, ?, ?, datetime(\'now\'))", (nombre, db64, sb64))\n'
                           '                        con2.commit()\n'
                           '                        con2.close()\n'
                           '                    except Exception:\n'
                           '                        pass\n'
                           '                    self._send(200, "application/json", json.dumps({"ok": False, "codigo": "mantenimiento", "error": "Biometria en mantenimiento. Tu solicitud quedo guardada."}).encode())\n'
                           '                    return\n'
                           '                self._send(502, "application/json", json.dumps({"ok": False, "error": "La Red responde: " + er_txt[:250]}).encode())\n'
                           '                return')
              n_err = t.count(VIEJO_ERR)
              if n_err == 1:
                  t = t.replace(VIEJO_ERR, NUEVO_ERR, 1)
                  n_ed += 1
                  add('- manejo de biometrics_unavailable anadido.')
              else:
                  add('- bloque de error del registro: %d (esperaba 1). Se omite esta edicion.' % n_err)
          else:
              add('- manejo de biometrics_unavailable ya presente.')
          if '        if path == "/verificar/check":' not in t:
              ANCLA = '        if path == "/verify":'
              if t.count(ANCLA) == 1:
                  CHK = '\n'.join([
                      '        if path == "/verificar/check":',
                      '            if not ZYRA_URL:',
                      '                self._send(200, "application/json", json.dumps({"ok": False, "detalle": "Red no configurada"}).encode())',
                      '                return',
                      '            largo = int(self.headers.get("Content-Length", 0) or 0)',
                      '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
                      '            try:',
                      '                dd = json.loads(crudo or "{}")',
                      '            except Exception:',
                      '                dd = {}',
                      '            codigo = str(dd.get("codigo", "")).strip()',
                      '            if not codigo:',
                      '                self._send(200, "application/json", json.dumps({"ok": False, "detalle": "Pega un codigo"}).encode())',
                      '                return',
                      '            ok_v, dv, ev = _SimpleClient(ZYRA_URL).post("/verify", {"attestation": codigo})',
                      '            if ok_v:',
                      '                self._send(200, "application/json", json.dumps({"ok": True, "detalle": (json.dumps(dv, ensure_ascii=False)[:300] if dv else "Confirmado por la Red")}).encode())',
                      '            else:',
                      '                ev_l = str(ev).lower()',
                      '                if "no" in ev_l and "encontr" in ev_l:',
                      '                    self._send(200, "application/json", json.dumps({"ok": False, "codigo": "no_encontrado", "detalle": "La Red no reconoce este codigo"}).encode())',
                      '                else:',
                      '                    self._send(200, "application/json", json.dumps({"ok": False, "detalle": "La Red no pudo verificar: " + str(ev)[:180]}).encode())',
                      '                return'])
                  p = t.find(ANCLA)
                  t = t[:p] + CHK + '\n' + t[p:]
                  n_ed += 1
                  add('- /verificar/check creado.')
              else:
                  add('- ancla /verify no unica, se omite.')
          else:
              add('- /verificar/check ya presente.')
          SPY.write_text(t, encoding='utf-8')
          gate('ediciones', n_ed >= 1)
          add('')
          add('## N5. Compilacion')
          add('')
          try:
              py_compile.compile(str(SPY), doraise=True)
              gate('compila', True)
              add('- OK')
          except Exception as e:
              gate('compila', False)
              add('- FALLO: %s' % e)
          add('')
          add('## N6. Prueba en vivo (con ZYRA_URL, corregido del #788)')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zd14b', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/sd14b', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t1 = time.time()
          while time.time() - t1 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t1 = time.time()
              while time.time() - t1 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cu = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cu).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps', spv and len(apps) == 8)
          if spv:
              cuerpo = json.dumps({'nombre': 'Prima de Prueba', 'clave': 'clave-prima-99',
                                   'doc_image_b64': DOC, 'selfie_image_b64': SEL}).encode()
              st, _h, b = pedir(BSP + '/registro/nuevo', data=cuerpo)
              try:
                  j = json.loads(b)
                  zid = j.get('zid', '')
                  cod = j.get('codigo', '')
                  err = str(j.get('error', ''))[:150]
              except Exception:
                  zid, cod, err = '', '', b[:150]
              add('- registro prima -> %s | zid=%s | codigo=%s | err=%s' % (st, zid or '-', cod or '-', err))
              ok_reg = (st == 200 and (zid or cod == 'mantenimiento'))
              add('- resultado claro: %s' % ('ZID CREADO' if zid else ('MANTENIMIENTO' if cod == 'mantenimiento' else 'RECHAZADO: ' + err)))
              gate('registro_mensaje_claro', ok_reg)
              st, _h, b = pedir(BSP + '/verificar/check', data=json.dumps({'codigo': 'TEST'}).encode())
              gate('verificador_funciona', st == 200)
              st, _h, b = pedir(BSP + '/mpe/register')
              gate('mpe_redirige', st == 200 and '/registro' in b)
              st, _h, _b = pedir(BSP + '/laboratorio/ui')
              gate('guard_intacto', st == 401)
          else:
              for g in ('registro_mensaje_claro', 'verificador_funciona', 'mpe_redirige', 'guard_intacto'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D14b VERIFICADO. Commit.**')
              add('')
              add('IMPORTANTE para Render (ya pagas): sube la RAM del servicio zyra-network a un plan con al menos 1GB')
              add('(Starter $7/mes o superior), porque las librerias faciales ya estan en requirements-render.txt.')
              add('Si tu plan actual aguanta la instalacion, la biometria real funcionara en el proximo deploy.')
              add('Prueba el registro con tu prima: ahora dira claramente REGISTRO EXITOSO + ZID, o el motivo exacto.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('faseD14b.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D14b terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal requirements-render.txt
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(D14b): mensajes claros, verificador, librerias faciales para Render pago"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faseD14b-zyra
          path: faseD14b.json
          if-no-files-found: ignore
