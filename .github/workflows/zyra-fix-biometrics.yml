name: "ZYRA RUN8c: auditoria PURA de la Red existente (identity/capabilities/biometrics/life_history/portable) — solo lectura, cero escritura, base para decidir R-1..R-9 sin duplicar"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "[LECTURA-A] identity COMPLETO (engine/registry/contracts — el ZID real)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA RED 8c — identity" >> "$SUM"
          for f in shared_engines/identity/engine.py shared_engines/identity/registry.py shared_engines/identity/contracts.py shared_engines/identity/errors.py; do
            echo "### $f" >> "$SUM"
            { echo '```python'; cat "$f" 2>/dev/null; echo '```'; } >> "$SUM"
          done
          exit 0

      - name: "[LECTURA-B] network/life_history COMPLETO + portable_profile firmas"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA RED 8c — network" >> "$SUM"
          echo "### network/life_history.py COMPLETO" >> "$SUM"
          { echo '```python'; cat shared_engines/network/life_history.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### portable_profile.py firmas" >> "$SUM"
          { echo '```'; grep -n "^class \|    def \|^def \|CREATE TABLE" shared_engines/network/portable_profile.py 2>/dev/null | head -40; echo '```'; } >> "$SUM"
          echo "### document_exchange.py firmas" >> "$SUM"
          { echo '```'; grep -n "^class \|    def \|^def " shared_engines/network/document_exchange.py 2>/dev/null | head -30; echo '```'; } >> "$SUM"
          exit 0

      - name: "[LECTURA-C] capabilities_api + biometrics + verification (firmas + cabezas)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA RED 8c — capabilities/biometrics/verification" >> "$SUM"
          echo "### runtime/capabilities_api.py firmas" >> "$SUM"
          { echo '```'; grep -n "^class \|    def \|^def " shared_engines/runtime/capabilities_api.py 2>/dev/null | head -50; echo '```'; } >> "$SUM"
          echo "### capabilities_api.py cabeza (1-120)" >> "$SUM"
          { echo '```python'; head -120 shared_engines/runtime/capabilities_api.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### security/biometrics.py firmas (1983 lineas)" >> "$SUM"
          { echo '```'; grep -n "^class \|    def \|^def " shared_engines/security/biometrics.py 2>/dev/null | head -60; echo '```'; } >> "$SUM"
          echo "### biometrics.py cabeza (1-100)" >> "$SUM"
          { echo '```python'; head -100 shared_engines/security/biometrics.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### verification/engine.py + credentials.py firmas" >> "$SUM"
          { echo '```'; grep -n "^class \|    def \|^def " shared_engines/verification/engine.py shared_engines/verification/credentials.py 2>/dev/null | head -40; echo '```'; } >> "$SUM"
          echo "### certification/engine.py firmas" >> "$SUM"
          { echo '```'; grep -n "^class \|    def \|^def " shared_engines/certification/engine.py 2>/dev/null | head -30; echo '```'; } >> "$SUM"
          echo "### fin auditoria" >> "$SUM"
          exit 0

      - name: "[LECTURA] regresion 4 apps (baseline)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Sin cambios de codigo (auditoria pura); fallar si regresion rota"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: regresion rota**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**AUDITORIA PURA COMPLETA — SIN CAMBIOS (correcto). Con las fuentes de arriba + su auditoria propia decidimos: que de R-1..R-9 ya existe (se extiende regla 69) y que falta de verdad (se aprueba antes de escribir).**"
            exit 0
          fi
          git commit -m "chore(auditoria): limpieza de caches tras regresion verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK (limpieza)**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK. RUN 8d se planifica con el mapa completo.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
