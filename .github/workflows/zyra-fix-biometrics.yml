name: ZYRA LOTE - glTF 2.0 real + GLB binario + Monte Carlo (auto-escritor)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Escribir monte_carlo_engine.py (simulacion estocastica real)
        run: |
          cat > apps/laboratorio/infrastructure/providers/monte_carlo_engine.py <<'MC_EOF'
          """Motor MONTE CARLO: simulacion estocastica real y reproducible.

          Distribuciones soportadas (parametrizadas por variable):
            normal     {dist: normal,     media, desv}
            uniforme   {dist: uniforme,   minimo, maximo}
            triangular {dist: triangular, minimo, modo, maximo}

          Generador determinista: random.Random(seed) — la misma semilla
          produce exactamente los mismos resultados (auditable).

          Formula de puntaje TRANSPARENTE y declarada (coherente con el
          criterio oficial: menor costo y menor riesgo son mejores):
            puntaje = (w_b*beneficio + w_c*(100-costo) + w_r*(100-riesgo))
                      / (w_b + w_c + w_r)
          Resultado en 0..100. Los valores muestreados se acotan a 0..100
          y el conteo de acotados se reporta (honestidad).

          Estadisticas reales: media, desviacion muestral, minimo, maximo,
          percentiles P5/P25/P50/P75/P95 (nearest-rank), intervalo de
          confianza 95% de la media (1.96*error_estandar) y convergencia
          de la media acumulada en 10 lotes.
          """
          import math
          import random

          DISTRIBUCIONES = ("normal", "uniforme", "triangular")
          MAX_CORRIDAS = 200_000
          DEF_CORRIDAS = 10_000
          UMBRAL_DEFECTO = 60.0
          LOTES_CONVERGENCIA = 10
          PESOS_DEFECTO = {"costo": 1.0, "beneficio": 1.0, "riesgo": 1.0}
          VARIABLES_VALIDAS = ("costo", "beneficio", "riesgo")


          def _numero(valor, nombre):
              if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                  raise ValueError(
                      "Parametro " + nombre + " debe ser numerico."
                  )
              return float(valor)


          class MotorMonteCarlo:
              """Simulacion Monte Carlo con semilla reproducible."""

              def capacidades(self) -> dict:
                  return {
                      "distribuciones": DISTRIBUCIONES,
                      "corridas": {"defecto": DEF_CORRIDAS, "max": MAX_CORRIDAS},
                      "salidas": (
                          "media", "desv", "min", "max",
                          "p5", "p25", "p50", "p75", "p95",
                          "ic95", "prob_alcanza_umbral", "convergencia",
                      ),
                      "reproducible": "semilla entera opcional",
                      "formula": (
                          "puntaje = (w_b*beneficio + w_c*(100-costo)"
                          " + w_r*(100-riesgo)) / (w_b+w_c+w_r)"
                      ),
                      "rango": "variables y puntaje acotados a 0..100",
                  }

              @staticmethod
              def _muestrear(rng, definicion, nombre):
                  dist = str(definicion.get("dist", "")).strip()
                  if dist == "normal":
                      media = _numero(definicion.get("media"), nombre + ".media")
                      desv = _numero(definicion.get("desv"), nombre + ".desv")
                      if desv < 0:
                          raise ValueError(nombre + ".desv no puede ser negativa.")
                      return rng.gauss(media, desv)
                  if dist == "uniforme":
                      bajo = _numero(definicion.get("minimo"), nombre + ".minimo")
                      alto = _numero(definicion.get("maximo"), nombre + ".maximo")
                      if bajo > alto:
                          raise ValueError(
                              nombre + ": minimo no puede superar maximo."
                          )
                      return rng.uniform(bajo, alto)
                  if dist == "triangular":
                      bajo = _numero(definicion.get("minimo"), nombre + ".minimo")
                      modo = _numero(definicion.get("modo"), nombre + ".modo")
                      alto = _numero(definicion.get("maximo"), nombre + ".maximo")
                      if not (bajo <= modo <= alto):
                          raise ValueError(
                              nombre + ": requiere minimo <= modo <= maximo."
                          )
                      return rng.triangular(bajo, alto, modo)
                  raise ValueError(
                      nombre + ": distribucion desconocida " + repr(dist)
                      + ". Validas: " + ", ".join(DISTRIBUCIONES)
                  )

              @staticmethod
              def _percentil(ordenados, q):
                  if not ordenados:
                      return 0.0
                  indice = max(
                      0,
                      min(
                          len(ordenados) - 1,
                          math.ceil(q / 100.0 * len(ordenados)) - 1,
                      ),
                  )
                  return ordenados[indice]

              def simular(self, config) -> dict:
                  if not isinstance(config, dict):
                      raise ValueError("Configuracion debe ser un objeto.")
                  variables = config.get("variables")
                  if not isinstance(variables, dict) or not variables:
                      raise ValueError(
                          "variables requiere costo, beneficio y riesgo "
                          "con sus distribuciones."
                      )
                  for nombre in variables:
                      if nombre not in VARIABLES_VALIDAS:
                          raise ValueError(
                              "Variable desconocida: " + repr(nombre)
                              + ". Validas: " + ", ".join(VARIABLES_VALIDAS)
                          )
                  if not variables:
                      raise ValueError("variables no puede estar vacia.")
                  pesos_crudos = config.get("pesos", {})
                  if not isinstance(pesos_crudos, dict):
                      raise ValueError("pesos debe ser un objeto.")
                  pesos = dict(PESOS_DEFECTO)
                  for clave, valor in pesos_crudos.items():
                      if clave not in VARIABLES_VALIDAS:
                          raise ValueError(
                              "Peso desconocido: " + repr(clave)
                          )
                      numero = _numero(valor, "pesos." + clave)
                      if numero < 0:
                          raise ValueError("pesos." + clave + " no puede ser negativo.")
                      pesos[clave] = numero
                  total_pesos = sum(pesos.values())
                  if total_pesos <= 0:
                      raise ValueError("La suma de pesos debe ser mayor que cero.")
                  corridas = config.get("corridas", DEF_CORRIDAS)
                  if isinstance(corridas, bool) or not isinstance(corridas, int):
                      raise ValueError("corridas debe ser entero.")
                  if corridas < 1 or corridas > MAX_CORRIDAS:
                      raise ValueError(
                          "corridas debe estar entre 1 y " + str(MAX_CORRIDAS)
                      )
                  umbral = config.get("umbral", UMBRAL_DEFECTO)
                  umbral = _numero(umbral, "umbral")
                  if not 0.0 <= umbral <= 100.0:
                      raise ValueError("umbral debe estar entre 0 y 100.")
                  semilla = config.get("semilla")
                  if semilla is not None and (
                      isinstance(semilla, bool) or not isinstance(semilla, int)
                  ):
                      raise ValueError("semilla debe ser entera.")
                  rng = random.Random(semilla)
                  definiciones = {}
                  for nombre, definicion in variables.items():
                      if not isinstance(definicion, dict):
                          raise ValueError(
                              "variables." + nombre + " debe ser un objeto."
                          )
                      definiciones[nombre] = definicion
                  puntajes = []
                  acotados = 0
                  peso_b = pesos["beneficio"]
                  peso_c = pesos["costo"]
                  peso_r = pesos["riesgo"]
                  divisor = total_pesos
                  for _ in range(corridas):
                      costo = self._muestrear(
                          rng, definiciones["costo"], "costo"
                      )
                      beneficio = self._muestrear(
                          rng, definiciones["beneficio"], "beneficio"
                      )
                      riesgo = self._muestrear(
                          rng, definiciones["riesgo"], "riesgo"
                      )
                      for crudo in (costo, beneficio, riesgo):
                          if crudo < 0.0 or crudo > 100.0:
                              acotados += 1
                      costo = max(0.0, min(100.0, costo))
                      beneficio = max(0.0, min(100.0, beneficio))
                      riesgo = max(0.0, min(100.0, riesgo))
                      puntaje = (
                          peso_b * beneficio
                          + peso_c * (100.0 - costo)
                          + peso_r * (100.0 - riesgo)
                      ) / divisor
                      puntajes.append(max(0.0, min(100.0, puntaje)))
                  ordenados = sorted(puntajes)
                  n = float(corridas)
                  media = sum(puntajes) / n
                  varianza = sum(
                      (p - media) * (p - media) for p in puntajes
                  ) / max(1.0, n - 1.0)
                  desv = math.sqrt(varianza)
                  se = desv / math.sqrt(n)
                  lote = max(1, corridas // LOTES_CONVERGENCIA)
                  convergencia = []
                  acumulado = 0.0
                  for indice in range(LOTES_CONVERGENCIA):
                      inicio = indice * lote
                      fin = (
                          inicio + lote if indice < LOTES_CONVERGENCIA - 1
                          else corridas
                      )
                      tramo = puntajes[inicio:fin]
                      acumulado += sum(tramo)
                      convergencia.append(round(acumulado / float(fin), 4))
                  alcanz = sum(1 for p in puntajes if p >= umbral)
                  return {
                      "n": corridas,
                      "semilla": semilla,
                      "formula": self.capacidades()["formula"],
                      "variables": variables,
                      "pesos": pesos,
                      "umbral": umbral,
                      "media": round(media, 4),
                      "desv": round(desv, 4),
                      "min": round(ordenados[0], 4),
                      "max": round(ordenados[-1], 4),
                      "p5": round(self._percentil(ordenados, 5), 4),
                      "p25": round(self._percentil(ordenados, 25), 4),
                      "p50": round(self._percentil(ordenados, 50), 4),
                      "p75": round(self._percentil(ordenados, 75), 4),
                      "p95": round(self._percentil(ordenados, 95), 4),
                      "ic95": [
                          round(max(0.0, media - 1.96 * se), 4),
                          round(min(100.0, media + 1.96 * se), 4),
                      ],
                      "prob_alcanza_umbral": round(alcanz / n, 4),
                      "convergencia": convergencia,
                      "valores_acotados": acotados,
                  }

              def comparar(self, configs) -> dict:
                  if not isinstance(configs, list) or len(configs) < 2:
                      raise ValueError(
                          "comparar requiere al menos 2 configuraciones."
                      )
                  tabla = []
                  for indice, entrada in enumerate(configs):
                      if not isinstance(entrada, dict):
                          raise ValueError(
                              "Cada configuracion debe ser un objeto."
                          )
                      nombre = str(entrada.get("nombre", "config-" + str(indice + 1)))
                      config = dict(entrada)
                      config.pop("nombre", None)
                      resultado = self.simular(config)
                      tabla.append({
                          "nombre": nombre,
                          "media": resultado["media"],
                          "p50": resultado["p50"],
                          "p95": resultado["p95"],
                          "ic95": resultado["ic95"],
                          "prob_alcanza_umbral": resultado["prob_alcanza_umbral"],
                      })
                  orden = sorted(tabla, key=lambda f: f["media"], reverse=True)
                  ganador = orden[0]
                  segundo = orden[1]
                  return {
                      "ganador": ganador["nombre"],
                      "brecha": round(ganador["media"] - segundo["media"], 4),
                      "ranking": orden,
                      "criterio": "mayor media de puntaje (formula declarada)",
                  }
          MC_EOF

      - name: Escribir generation_engine.py (glTF 2.0 real JSON + GLB binario)
        run: |
          cat > apps/laboratorio/infrastructure/providers/generation_engine.py <<'GEN_EOF'
          """Motor de generacion: 8 formatos reales desde una Escena3D.

          imagen / pagina / animacion : SVG y HTML reales
          modelo                      : glTF 2.0 JSON con buffer embebido
          modelo_glb                  : GLB binario (JSON chunk + BIN chunk)
          naked3d / holograma / oligrama : motores dedicados

          glTF REAL conforme a la especificacion 2.0:
            - mallas con POSITION (VEC3 FLOAT) + indices (u16)
            - accessors con min/max obligatorios
            - bufferViews alineados a 4 bytes
            - materiales pbrMetallicRoughness.baseColorFactor
            - coordenadas convertidas a Y-arriba (glTF) desde el plano
              de la escena; Z por capa (fondo 0.0, medio 0.5, frente 1.0)
            - los objetos de texto NO se malla-fican: se listan en
              extras.objetos_texto (honesto, sin geometria falsa)
          """
          import base64 as b64
          import json
          import math
          import struct

          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.hologram_engine import MotorHolograma
          from apps.laboratorio.infrastructure.providers.naked3d_engine import MotorNaked3D
          from apps.laboratorio.infrastructure.providers.oligram_engine import MotorOligrama
          from apps.laboratorio.infrastructure.providers.renderer_svg import MotorRenderSVG
          from apps.laboratorio.infrastructure.security.html_sanitizer import escapar

          Z_CAPA = {"fondo": 0.0, "medio": 0.5, "frente": 1.0}
          SEG_CIRCULO = 24


          def _hex_rgb(texto: str):
              crudo = str(texto or "").strip().lstrip("#")
              if len(crudo) != 6:
                  return (0.58, 0.64, 0.72)
              return (
                  int(crudo[0:2], 16) / 255.0,
                  int(crudo[2:4], 16) / 255.0,
                  int(crudo[4:6], 16) / 255.0,
              )


          def _empaquetar_glb(gltf: dict, binario: bytes) -> bytes:
              json_crudo = json.dumps(
                  gltf, separators=(",", ":"), ensure_ascii=True
              ).encode("utf-8")
              pad_json = (4 - len(json_crudo) % 4) % 4
              json_crudo += b" " * pad_json
              pad_bin = (4 - len(binario) % 4) % 4
              bin_crudo = binario + b"\x00" * pad_bin
              total = 12 + 8 + len(json_crudo) + 8 + len(bin_crudo)
              return (
                  struct.pack("<III", 0x46546C67, 2, total)
                  + struct.pack("<II", len(json_crudo), 0x4E4F534A)
                  + json_crudo
                  + struct.pack("<II", len(bin_crudo), 0x004E4942)
                  + bin_crudo
              )


          class MotorGeneracionReal:
              """Genera entregables reales desde una Escena3D."""

              def __init__(self):
                  self._renderer = MotorRenderSVG()
                  self._naked3d = MotorNaked3D()
                  self._holograma = MotorHolograma()
                  self._oligrama = MotorOligrama()

              def capacidades(self) -> dict:
                  return {
                      "disponibles": (
                          "imagen", "pagina", "modelo", "modelo_glb",
                          "animacion", "naked3d", "holograma", "oligrama",
                      ),
                      "gltf": "2.0 con mallas reales y materiales PBR",
                      "glb": "contenedor binario JSON+BIN alineado a 4",
                      "no_disponibles": {
                          "video_mp4": "El motor de secuencia llega con el motor GPU",
                      },
                  }

              def generar(self, escena: Escena3D, formato: str) -> bytes:
                  if not isinstance(escena, Escena3D):
                      raise ValueError("Se esperaba una Escena3D.")
                  if formato == "imagen":
                      return self._generar_imagen(escena)
                  if formato == "pagina":
                      return self._generar_pagina(escena)
                  if formato == "modelo":
                      return self._generar_modelo(escena)
                  if formato == "modelo_glb":
                      return self._generar_glb(escena)
                  if formato == "animacion":
                      return self._generar_animacion(escena)
                  if formato == "naked3d":
                      return self._naked3d.generar(escena)
                  if formato == "holograma":
                      return self._holograma.generar(escena)
                  if formato == "oligrama":
                      return self._oligrama.generar(escena)
                  raise ValueError(
                      "El formato '" + str(formato)
                      + "' no esta disponible. Validos: "
                      + ", ".join(self.capacidades()["disponibles"])
                  )

              def _generar_imagen(self, escena: Escena3D) -> bytes:
                  resultado = self._renderer.renderizar(escena.a_especificacion(), {})
                  return resultado.imagen_bytes

              def _generar_pagina(self, escena: Escena3D) -> bytes:
                  svg = self._generar_imagen(escena).decode("utf-8")
                  filas = []
                  for i, obj in enumerate(escena.objetos, 1):
                      detalle = ", ".join(
                          k + "=" + escapar(v) for k, v in sorted(obj.items())
                          if k not in ("forma", "color")
                      )
                      filas.append(
                          "<tr><td>" + str(i) + "</td>"
                          + '<td><span class="pill">' + escapar(obj["forma"]) + "</span></td>"
                          + '<td><span class="pill">' + escapar(obj.get("capa", "medio")) + "</span></td>"
                          + '<td><code style="color:#93C5FD">' + escapar(obj["color"]) + "</code></td>"
                          + "<td>" + detalle + "</td></tr>"
                      )
                  html = (
                      "<!doctype html><html lang='es'><head><meta charset='utf-8'>"
                      "<title>" + escapar(escena.nombre) + "</title>"
                      "<style>body{background:#0B1220;color:#E2E8F0;font-family:system-ui,sans-serif;padding:24px}"
                      "h1{font-size:22px}.pill{background:rgba(37,99,235,.15);color:#93C5FD;border-radius:999px;padding:2px 10px;font-size:12px}"
                      "table{border-collapse:collapse;width:100%;max-width:860px}td,th{border-bottom:1px solid #1E293B;padding:8px;text-align:left;font-size:14px}"
                      "th{color:#94A3B8;font-size:12px;text-transform:uppercase}img{max-width:100%;border-radius:12px;border:1px solid #1E293B}</style></head><body>"
                      "<h1>" + escapar(escena.nombre) + "</h1>"
                      "<p style='color:#94A3B8'>Escena generada por ZYRA LABORATORIO - " + str(len(escena.objetos)) + " objetos</p>"
                      "<img alt='render de la escena' src='data:image/svg+xml;base64,"
                      + b64.b64encode(svg.encode("utf-8")).decode("ascii")
                      + "'><h2 style='font-size:16px;margin-top:20px'>Objetos y profundidad</h2>"
                      "<table><thead><tr><th>#</th><th>Forma</th><th>Capa</th><th>Color</th><th>Parametros</th></tr></thead><tbody>"
                      + "\n".join(filas) + "</tbody></table></body></html>"
                  )
                  return html.encode("utf-8")

              @staticmethod
              def _geometria_objeto(obj, alto):
                  """Malla real del objeto (posiciones Y-arriba + indices)."""
                  forma = str(obj.get("forma", ""))
                  capa = str(obj.get("capa", "medio"))
                  z = Z_CAPA.get(capa, 0.5)

                  def punto(px, py):
                      return (float(px), float(alto) - float(py), z)

                  if forma == "rect":
                      x = obj["x"]
                      y = obj["y"]
                      w = obj["w"]
                      h = obj["h"]
                      p0 = punto(x, y)
                      p1 = punto(x + w, y)
                      p2 = punto(x + w, y + h)
                      p3 = punto(x, y + h)
                      posiciones = [p0, p1, p2, p3]
                      indices = [0, 1, 2, 0, 2, 3]
                      return posiciones, indices
                  if forma == "circle":
                      cx = float(obj["cx"])
                      cy = float(obj["cy"])
                      r = float(obj["r"])
                      centro = punto(cx, cy)
                      anillo = []
                      for i in range(SEG_CIRCULO):
                          ang = 2.0 * math.pi * i / SEG_CIRCULO
                          anillo.append(punto(
                              cx + r * math.cos(ang),
                              cy + r * math.sin(ang),
                          ))
                      posiciones = [centro] + anillo
                      indices = []
                      for i in range(1, SEG_CIRCULO):
                          siguiente = i + 1 if i + 1 <= SEG_CIRCULO else 1
                          indices.extend([0, i, siguiente])
                      return posiciones, indices
                  return None, None

              def _construir_gltf(self, escena: Escena3D, con_buffer_uri: bool):
                  posiciones_totales = bytearray()
                  indices_totales = bytearray()
                  bufferViews = []
                  accessors = []
                  meshes = []
                  nodes = []
                  materials = []
                  textos = []
                  offset = 0
                  for i, obj in enumerate(escena.objetos):
                      forma = str(obj.get("forma", ""))
                      if forma not in ("rect", "circle"):
                          textos.append({
                              "indice": i, "forma": forma,
                              "contenido": str(obj.get("contenido", "")),
                              "capa": str(obj.get("capa", "medio")),
                          })
                          continue
                      posiciones, indices = self._geometria_objeto(obj, escena.alto)
                      if posiciones is None:
                          continue
                      plano = []
                      for (px, py, pz) in posiciones:
                          plano.extend((px, py, pz))
                      datos_pos = struct.pack(
                          "<" + str(len(plano)) + "f", *plano
                      )
                      minimo = [
                          min(plano[0::3]), min(plano[1::3]), min(plano[2::3])
                      ]
                      maximo = [
                          max(plano[0::3]), max(plano[1::3]), max(plano[2::3])
                      ]
                      datos_idx = struct.pack(
                          "<" + str(len(indices)) + "H", *indices
                      )
                      pad_pos = (4 - len(datos_pos) % 4) % 4
                      datos_pos += b"\x00" * pad_pos
                      pad_idx = (4 - len(datos_idx) % 4) % 4
                      datos_idx += b"\x00" * pad_idx
                      vista_pos = len(bufferViews)
                      bufferViews.append({
                          "buffer": 0,
                          "byteOffset": offset,
                          "byteLength": len(datos_pos),
                          "target": 34962,
                      })
                      offset += len(datos_pos)
                      vista_idx = len(bufferViews)
                      bufferViews.append({
                          "buffer": 0,
                          "byteOffset": offset,
                          "byteLength": len(datos_idx),
                          "target": 34963,
                      })
                      offset += len(datos_idx)
                      acc_pos = len(accessors)
                      accessors.append({
                          "bufferView": vista_pos,
                          "componentType": 5126,
                          "count": len(posiciones),
                          "type": "VEC3",
                          "min": minimo,
                          "max": maximo,
                      })
                      acc_idx = len(accessors)
                      accessors.append({
                          "bufferView": vista_idx,
                          "componentType": 5123,
                          "count": len(indices),
                          "type": "SCALAR",
                      })
                      color = _hex_rgb(obj.get("color", "#94A3B8"))
                      material = len(materials)
                      materials.append({
                          "pbrMetallicRoughness": {
                              "baseColorFactor": [color[0], color[1], color[2], 1.0],
                              "metallicFactor": 0.05,
                              "roughnessFactor": 0.55,
                          },
                          "name": "mat_" + forma + "_" + str(i),
                      })
                      mesh = len(meshes)
                      meshes.append({
                          "name": forma + "_" + str(i),
                          "primitives": [{
                              "attributes": {"POSITION": acc_pos},
                              "indices": acc_idx,
                              "material": material,
                              "mode": 4,
                          }],
                      })
                      nodes.append({
                          "mesh": mesh,
                          "name": forma + "_" + str(i),
                          "extras": {
                              "capa": str(obj.get("capa", "medio")),
                              "color": str(obj.get("color", "")),
                          },
                      })
                  binario = bytes(posiciones_totales) + bytes(indices_totales)
                  binario = (
                      struct.pack("<", ) if False else b""
                  ) + b"".join([
                      datos for datos in [b""]
                  ]) if False else None
                  buffer_bin = bytearray()
                  for i, obj in enumerate(escena.objetos):
                      forma = str(obj.get("forma", ""))
                      if forma not in ("rect", "circle"):
                          continue
                      posiciones, indices = self._geometria_objeto(obj, escena.alto)
                      plano = []
                      for (px, py, pz) in posiciones:
                          plano.extend((px, py, pz))
                      datos_pos = struct.pack("<" + str(len(plano)) + "f", *plano)
                      pad_pos = (4 - len(datos_pos) % 4) % 4
                      buffer_bin += datos_pos + b"\x00" * pad_pos
                      datos_idx = struct.pack(
                          "<" + str(len(indices)) + "H", *indices
                      )
                      pad_idx = (4 - len(datos_idx) % 4) % 4
                      buffer_bin += datos_idx + b"\x00" * pad_idx
                  binario = bytes(buffer_bin)
                  if con_buffer_uri:
                      uri = (
                          "data:application/octet-stream;base64,"
                          + b64.b64encode(binario).decode("ascii")
                      )
                      buffers = [{"byteLength": len(binario), "uri": uri}]
                  else:
                      buffers = [{"byteLength": len(binario)}]
                  gltf = {
                      "asset": {
                          "version": "2.0",
                          "generator": "ZYRA LABORATORIO glTF 2.0 real",
                      },
                      "scene": 0,
                      "scenes": [{
                          "name": escapar(escena.nombre),
                          "nodes": list(range(len(nodes))),
                      }],
                      "nodes": nodes,
                      "meshes": meshes,
                      "materials": materials,
                      "accessors": accessors,
                      "bufferViews": bufferViews,
                      "buffers": buffers,
                      "extras": {
                          "escena": [escena.ancho, escena.alto],
                          "conversion": "Y-arriba (glTF) desde plano de escena; Z por capa fondo=0.0 medio=0.5 frente=1.0",
                          "objetos_texto": textos,
                          "nota": "los textos no se malla-fican (sin geometria falsa)",
                      },
                  }
                  return gltf, binario

              def _generar_modelo(self, escena: Escena3D) -> bytes:
                  gltf, _binario = self._construir_gltf(escena, con_buffer_uri=True)
                  return json.dumps(gltf, ensure_ascii=True, indent=2).encode("utf-8")

              def _generar_glb(self, escena: Escena3D) -> bytes:
                  gltf, binario = self._construir_gltf(escena, con_buffer_uri=False)
                  return _empaquetar_glb(gltf, binario)

              def _generar_animacion(self, escena: Escena3D) -> bytes:
                  if not escena.objetos:
                      from apps.laboratorio.shared.exceptions.render_errors import RenderFallidoError
                      raise RenderFallidoError("La escena no tiene objetos para animar.")
                  resultado = self._renderer.renderizar(escena.a_especificacion(), {})
                  svg = resultado.imagen_bytes.decode("utf-8")
                  centro_x = escena.ancho / 2.0
                  centro_y = escena.alto / 2.0
                  animacion = (
                      '<animateTransform attributeName="transform" attributeType="XML" '
                      'type="rotate" from="0 ' + str(centro_x) + " " + str(centro_y)
                      + '" to="360 ' + str(centro_x) + " " + str(centro_y)
                      + '" dur="12s" repeatCount="indefinite"/>'
                  )
                  if "</svg>" in svg:
                      svg = svg.replace("</svg>", animacion + "</svg>", 1)
                  return svg.encode("utf-8")
          GEN_EOF

