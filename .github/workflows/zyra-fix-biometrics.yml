name: ZYRA Fase 7 portal veraz segun estado real

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fase7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias minimas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography

      - name: Portal veraz con verificacion en CI
        run: |
          python3 - <<'PYEOF'
          import json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          GATES = []
          NP = 8765
          SP = 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('fase7.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _manejador

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          MAPA = [('Mi Primer Empleo', '/mpe'), ('AGRO', '/agro'),
                  ('AXIS', '/axis'), ('SEMILLA', '/semilla'),
                  ('NEXO', '/nexo'), ('ZYRA MARKET', '/subastas'),
                  ('CICLO-DIGITAL', '/ciclo'), ('LABORATORIO', '/laboratorio'),
                  ('FUTURO-OS', None)]
          LABELS = {'/laboratorio': 'Laboratorio digital activo',
                    '/ciclo': 'Reciclaje y arqueologia activo'}

          add('# FASE 7 - PORTAL VERAZ')
          add('')
          add('Regla: una tarjeta se abre SOLO si su ruta esta viva segun /health de la SuperApp real.')
          add('FUTURO-OS queda Próximamente a proposito: es la 9a app oficial, aun sin codigo.')
          add('')

          add('## A1. Arranque de la red (reportaje)')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN,
                      'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-7',
                      'ZYRA_PORT': str(NP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env,
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              try:
                  urllib.request.urlopen(BASE + '/health', timeout=2)
                  vivo = True
                  break
              except urllib.error.HTTPError:
                  vivo = True
                  break
              except Exception:
                  time.sleep(1.0)
          add('- red arriba: %s' % vivo)
          gate('red_arranca', vivo)
          add('')

          add('## A2. Arranque de la SuperApp y apps vivas segun /health')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_URL': BASE, 'ZYRA_API_TOKEN': TOKEN,
                       'ZYRA_ROOT_KEY': ROOTKEY, 'SUPERAPP_DATA_DIR': '/tmp/super-7',
                       'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          sproc = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                   stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          sp_vivo = False
          apps_keys = []
          t0 = time.time()
          while time.time() - t0 < 60:
              if sproc.poll() is not None:
                  break
              try:
                  with urllib.request.urlopen(BSP + '/health', timeout=3) as r:
                      h = json.loads(r.read().decode('utf-8', errors='replace'))
                  apps_keys = list(h.get('apps', {}).keys())
                  sp_vivo = True
                  break
              except Exception:
                  time.sleep(1.5)
          add('- superapp arriba: %s' % sp_vivo)
          add('- apps vivas segun /health: %s' % apps_keys)
          gate('superapp_arranca', sp_vivo)
          gate('ocho_apps_vivas', len(apps_keys) == 8)
          add('')

          add('## A3. Inventario de tarjetas del portal')
          add('')
          ruta_html = ROOT / 'portal' / 'index.html'
          html = ruta_html.read_text(encoding='utf-8')

          def tarjeta_de(titulo):
              pos = 0
              while True:
                  idx = html.find(titulo, pos)
                  if idx == -1:
                      return None
                  ini = html.rfind('<a', 0, idx)
                  fin = html.find('</a>', idx)
                  if ini != -1 and fin != -1:
                      blk = html[ini:fin + 4]
                      if 'card' in blk:
                          return ini, fin + 4, blk
                  pos = idx + 1

          conv = '/'
          mconv = re.search(r'href="(/(?:mpe|agro|axis|semilla|nexo|subastas|ciclo)/?)"', html)
          if mconv:
              conv = '/' if mconv.group(1).endswith('/') else ''
          add('- Convencion de enlaces detectada en tarjetas existentes: barra final=%s' % (conv == '/'))
          inventario = []
          for titulo, ruta in MAPA:
              t = tarjeta_de(titulo)
              if t is None:
                  inventario.append((titulo, ruta, None))
                  add('- %s: tarjeta no encontrada' % titulo)
                  continue
              ini, fin, blk = t
              inv = {'soon': 'soon' in blk, 'href': 'href=' in blk,
                     'viva': bool(ruta) and ruta in apps_keys}
              inventario.append((titulo, ruta, inv))
              add('- %s | ruta=%s | soon=%s | href=%s | viva=%s'
                  % (titulo, ruta, inv['soon'], inv['href'], inv['viva']))
          add('')

          add('## A4. Edicion: habilitar solo tarjetas soon con ruta viva')
          add('')
          EDITAR = [(t, r) for t, r, i in inventario
                    if i and i['soon'] and i['viva'] and r]
          add('- Tarjetas a habilitar: %s' % [t for t, _ in EDITAR])
          antes_soon = html.count('soon')
          editadas = 0
          for titulo, ruta in EDITAR:
              t = tarjeta_de(titulo)
              if t is None:
                  continue
              ini, fin, blk = t
              nuevo = blk.replace('card soon', 'card', 1)
              nuevo = re.sub(r'<p>[^<]*</p>', '<p>%s</p>' % LABELS.get(ruta, 'Activo'),
                             nuevo, count=1)
              nuevo = nuevo.replace('<a ', '<a href="%s%s" ' % (ruta, conv), 1)
              html = html[:ini] + nuevo + html[fin:]
              editadas += 1
              add('- %s habilitada -> href=%s%s' % (titulo, ruta, conv))
          ruta_html.write_text(html, encoding='utf-8')
          despues_soon = html.count('soon')
          add('- Tarjetas editadas: %d | soon antes=%d despues=%d' % (editadas, antes_soon, despues_soon))
          add('')
          if not EDITAR:
              add('- Nada que editar: el portal ya es veraz (idempotente).')
              add('')

          add('## A5. Verificacion post-edicion')
          add('')
          veraz = True
          for titulo, ruta, inv in inventario:
              if ruta is None:
                  continue
              t = tarjeta_de(titulo)
              if t is None:
                  veraz = False
                  continue
              _ini, _fin, blk = t
              if inv['viva'] and 'soon' in blk:
                  veraz = False
                  add('- FALLO: %s sigue soon siendo ruta viva' % titulo)
          gate('portal_veraz', veraz)
          gate('ediciones_exactas', (antes_soon - despues_soon) == len(EDITAR))
          tf = tarjeta_de('FUTURO-OS')
          futuro_soon = bool(tf) and 'soon' in tf[2]
          add('- FUTURO-OS sigue Próximamente: %s' % futuro_soon)
          gate('futuro_sigue_soon', futuro_soon)
          add('')

          add('## A6. Sonda directa a rutas habilitadas (informativo)')
          add('')
          for titulo, ruta in EDITAR:
              for suf in ('/', ''):
                  try:
                      with urllib.request.urlopen(BSP + ruta + suf, timeout=6) as r:
                          add('- GET %s%s -> HTTP %d' % (ruta, suf, r.status))
                  except urllib.error.HTTPError as e:
                      add('- GET %s%s -> HTTP %d' % (ruta, suf, e.code))
                  except Exception as e:
                      add('- GET %s%s -> error: %s' % (ruta, suf, e))
          add('')

          try:
              if sproc.poll() is None:
                  sproc.terminate()
                  sproc.wait(timeout=10)
          except Exception:
              try:
                  sproc.kill()
              except Exception:
                  pass
          try:
              if proc.poll() is None:
                  proc.terminate()
                  proc.wait(timeout=10)
          except Exception:
              try:
                  proc.kill()
              except Exception:
                  pass

          add('## Conteo estable')
          add('')
          nf = npy = 0
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              nf += 1
              if p.suffix == '.py':
                  npy += 1
          add('- archivos: %d | python: %d (solo cambia portal/index.html)' % (nf, npy))
          gate('conteo_estable', npy == 4500)
          add('')

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**Portal veraz. Commit de portal/index.html. Render desplegara automatico.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          DATA['apps_vivas'] = apps_keys
          DATA['editadas'] = [t for t, _ in EDITAR]
          Path('fase7.json').write_text(
              json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
              encoding='utf-8')
          escribe()
          print('Fase 7 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portal/index.html
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(portal): tarjetas segun estado real verificado, laboratorio activo"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios (portal ya veraz)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase7-zyra
          path: fase7.json
          if-no-files-found: ignore
