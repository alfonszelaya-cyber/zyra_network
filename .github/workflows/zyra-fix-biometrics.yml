name: ZYRA D29 restaurar registro nuevo y marcos visuales

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD29:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: D29
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SPY = ROOT / 'superapp.py'
          PT = ROOT / 'portal'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 'faseD29.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  with OP.open(q, timeout=25) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, '', str(e)
          orig = SPY.read_bytes()
          def revertir():
              try:
                  SPY.write_bytes(orig)
              except Exception:
                  pass
          t0 = orig.decode('utf-8')
          add('# D29 - RESTAURAR /registro/nuevo + MARCOS VISUALES')
          add('')
          add('## R1. Diagnostico: existe /registro/nuevo?')
          add('')
          existe = '"/registro/nuevo"' in t0 or "'/registro/nuevo'" in t0
          add('- presente en superapp.py: %s' % existe)
          gate('diagnostico', True)
          add('')
          add('## R2. Insertar /registro/nuevo si falta')
          add('')
          t = t0
          if existe:
              add('- ya presente (idempotente).')
              gate('registro_nuevo', True)
          else:
              REGN = '\n'.join([
              '        if path == "/registro/nuevo":',
              '            if not ZYRA_URL:',
              '                self._send(503, "application/json", json.dumps({"ok": False, "error": "Red no configurada"}).encode())',
              '                return',
              '            largo = int(self.headers.get("Content-Length", 0) or 0)',
              '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
              '            try:',
              '                dd = json.loads(crudo or "{}")',
              '            except Exception:',
              '                dd = {}',
              '            nombre = str(dd.get("nombre", "")).strip()',
              '            clave = str(dd.get("clave", ""))',
              '            db64 = str(dd.get("doc_image_b64", ""))',
              '            sb64 = str(dd.get("selfie_image_b64", ""))',
              '            if len(nombre) < 3 or len(clave) < 8 or not db64 or not sb64:',
              '                self._send(400, "application/json", json.dumps({"ok": False, "error": "Falta nombre, clave (min 8), documento o selfie"}).encode())',
              '                return',
              '            ok_r, dr, er = _SimpleClient(ZYRA_URL).post("/identity/enroll", {"kind": "person", "name": nombre, "display_name": nombre, "actor": os.environ.get("ZYRA_ENROLL_ACTOR", "superapp"), "doc_image_b64": db64, "selfie_image_b64": sb64})',
              '            if not ok_r:',
              '                er_l = str(er).lower()',
              '                if "biometrics_unavailable" in er_l or "face engine not installed" in er_l:',
              '                    self._send(200, "application/json", json.dumps({"ok": False, "codigo": "mantenimiento", "error": "Biometria en mantenimiento. Motor facial activandose en el servidor."}).encode())',
              '                    return',
              '                self._send(502, "application/json", json.dumps({"ok": False, "error": "La Red responde: " + str(er)[:250]}).encode())',
              '                return',
              '            zid = ""',
              '            if isinstance(dr, dict):',
              '                dx = dr.get("data") or dr',
              '                if isinstance(dx, dict):',
              '                    zid = str(dx.get("zid") or dx.get("identity_id") or dx.get("id") or "")',
              '            if not zid:',
              '                self._send(500, "application/json", json.dumps({"ok": False, "error": "La Red no devolvio ZID"}).encode())',
              '                return',
              '            import secrets as _sc, hashlib as _hs, sqlite3 as _sq',
              '            sal = _sc.token_hex(16)',
              '            hc = _hs.sha256((sal + clave).encode()).hexdigest()',
              '            con = _sq.connect(str(DATA_DIR / "credenciales.db"))',
              '            con.execute("CREATE TABLE IF NOT EXISTS credenciales (zid TEXT PRIMARY KEY, sal TEXT, hash TEXT)")',
              '            con.execute("INSERT OR REPLACE INTO credenciales VALUES (?, ?, ?)", (zid, sal, hc))',
              '            con.commit()',
              '            con.close()',
              '            self._send(200, "application/json", json.dumps({"ok": True, "zid": zid}).encode())',
              '            return',
              '',
              ])
              ANCLA = '        if path == "/verify":'
              n_v = t.count(ANCLA)
              if n_v != 1:
                  add('**ANCLA /verify: %d - nada editado.**' % n_v)
                  gate('registro_nuevo', False)
              else:
                  p = t.find(ANCLA)
                  t = t[:p] + REGN + t[p:]
                  gate('registro_nuevo', True)
                  add('- /registro/nuevo restaurado (con mensaje de mantenimiento si el motor facial no esta activo).')
          add('')
          add('## R3. registro.html con marcos visuales')
          add('')
          CSS = ('body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:#0a0e27;'
                 'color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:24px 14px;box-sizing:border-box} '
                 '.caja{max-width:480px;width:100%;background:#11162b;border:1px solid #242c4f;'
                 'border-radius:16px;padding:22px 18px;box-sizing:border-box} '
                 'h1{margin:0 0 6px;font-size:20px;text-align:center} '
                 'p{color:#8b949e;font-size:13px;line-height:1.4;margin:5px 0;text-align:center} '
                 'label{display:block;font-size:13px;color:#8b949e;margin:10px 0 4px} '
                 'input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #30363d;'
                 'background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px} '
                 '.marco{position:relative;width:100%;max-width:380px;margin:8px auto;border-radius:14px;overflow:hidden;background:#000} '
                 '.marco video,.marco img{width:100%;display:block} '
                 '.marco .guia{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);'
                 'width:70%;height:75%;border:3px dashed #238636;border-radius:12px;pointer-events:none} '
                 '.marco .guia-ovalo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);'
                 'width:55%;height:72%;border:3px dashed #8b5cf6;border-radius:50%;pointer-events:none} '
                 '.marco .esquinas span{position:absolute;width:26px;height:26px;border-color:#3fb950;border-style:solid;pointer-events:none} '
                 '.marco .esquinas .s1{top:6px;left:6px;border-width:3px 0 0 3px;border-radius:6px 0 0 0} '
                 '.marco .esquinas .s2{top:6px;right:6px;border-width:3px 3px 0 0;border-radius:0 6px 0 0} '
                 '.marco .esquinas .s3{bottom:6px;left:6px;border-width:0 0 3px 3px;border-radius:0 0 0 6px} '
                 '.marco .esquinas .s4{bottom:6px;right:6px;border-width:0 3px 3px 0;border-radius:0 0 6px 0} '
                 '.nota{font-size:11px;color:#8b949e;text-align:center;margin:4px 0} '
                 'img.prev{width:100%;max-width:380px;border-radius:14px;margin:8px auto;display:block;border:2px solid #238636} '
                 'button{width:100%;margin-top:10px;padding:13px;border-radius:12px;border:none;'
                 'background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);color:#fff;font-size:15px;font-weight:700} '
                 '.mini{background:#1f2a44;font-size:14px;padding:10px} '
                 '.ok{outline:2px solid #238636 !important;opacity:.9} '
                 'a{color:#8b5cf6;text-decoration:none} '
                 '#resp{margin-top:12px;text-align:center;font-size:14px;word-break:break-all} '
                 '.zid{color:#3fb950;font-weight:800;font-size:20px}')
          REGL = [
          '<!doctype html><html lang="es"><head><meta charset="utf-8">',
          '<meta name="viewport" content="width=device-width, initial-scale=1">',
          '<title>Registro - ZYRA</title><style>' + CSS + '</style></head><body><div class="caja">',
          '<h1>Registro de ciudadanos</h1>',
          '<p>Un solo registro para toda la vida. La Red verifica tu identidad con biometria y crea tu <b>ZID unico e inmutable</b>.</p>',
          '<form id="f" onsubmit="return enviar(event)">',
          '<label>Nombre completo</label><input id="nombre" required>',
          '<label>Tipo de documento</label>',
          '<select id="tipo" onchange="cambiarTipo()"><option value="dui">DUI (2 lados)</option><option value="pasaporte">Pasaporte (1 cara)</option></select>',
          '<label id="l1">1) Documento: lado frontal</label>',
          '<div class="marco"><div class="esquinas"><span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span></div><input id="docFrente" type="file" accept="image/*" capture="environment" required style="width:100%;padding:14px;box-sizing:border-box" onchange="prevDoc(this,\'pFrente\')"></div>',
          '<p class="nota">Coloca el documento dentro del marco y toma la foto con buena luz</p>',
          '<img id="pFrente" class="prev" style="display:none">',
          '<label id="l2">2) Documento: lado de atras (solo DUI)</label>',
          '<div class="marco"><div class="esquinas"><span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span></div><input id="docAtras" type="file" accept="image/*" capture="environment" style="width:100%;padding:14px;box-sizing:border-box" onchange="prevDoc(this,\'pAtras\')"></div>',
          '<img id="pAtras" class="prev" style="display:none">',
          '<label>3) Selfie en vivo</label>',
          '<div class="marco" id="marcoCam"><video id="cam" autoplay playsinline muted></video><div class="guia-ovalo"></div></div>',
          '<p class="nota">Coloca tu rostro dentro del ovalo</p>',
          '<button type="button" class="mini" id="bcam" onclick="abrirCam()">Abrir camara</button>',
          '<button type="button" class="mini" id="bself" onclick="tomarSelfie()">Capturar selfie</button>',
          '<img id="pSelfie" class="prev" style="display:none">',
          '<label>4) Crea tu clave de acceso</label>',
          '<input id="clave" type="password" minlength="8" required>',
          '<label>Repite la clave</label><input id="clave2" type="password" minlength="8" required>',
          '<div id="resp"></div><button type="submit">Crear mi ZID</button></form>',
          '<p style="margin-top:14px"><a href="/">Volver</a> | <a href="/entrar">Ya tengo ZID</a></p></div>',
          '<script>',
          'function cambiarTipo(){var t=document.getElementById("tipo").value;',
          'var la=document.getElementById("l2"),da=document.getElementById("docAtras");',
          'if(t==="pasaporte"){la.style.display="none";da.required=false;da.parentElement.style.display="none";da.value="";document.getElementById("pAtras").style.display="none";}',
          'else{la.style.display="block";da.parentElement.style.display="block";da.required=true;}}',
          'function prevDoc(input,imgId){if(!input.files[0])return;var r=new FileReader();r.onload=function(e){var img=document.getElementById(imgId);img.src=e.target.result;img.style.display="block";input.dataset.b64=e.target.result.split(",")[1];input.classList.add("ok");};r.readAsDataURL(input.files[0]);}',
          'function abrirCam(){var v=document.getElementById("cam");',
          'navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640}}}).then(function(s){v.srcObject=s;v.play();document.getElementById("bcam").textContent="Camara activa";}).catch(function(e){alert("Error camara: "+e.message+" | Da permiso de camara al navegador (icono del candado > Permisos > Camara > Permitir)");});}',
          'function tomarSelfie(){',
          'var v=document.getElementById("cam");',
          'var R=document.getElementById("resp");',
          'if(!v.srcObject||v.readyState<2){R.innerHTML="<p style=\'color:#f0b429\'>Abre la camara primero.</p>";return;}',
          'if(v.videoWidth===0){R.innerHTML="<p style=\'color:#f0b429\'>Camara cargando...</p>";return;}',
          'var c=document.createElement("canvas");',
          'c.width=v.videoWidth;c.height=v.videoHeight;',
          'c.getContext("2d").drawImage(v,0,0);',
          'var b=c.toDataURL("image/jpeg",0.85).split(",")[1];',
          'var bt=document.getElementById("bself");',
          'bt.dataset.selfie=b;bt.classList.add("ok");bt.textContent="Selfie capturada";',
          'var p=document.getElementById("pSelfie");p.src="data:image/jpeg;base64,"+b;p.style.display="block";',
          'R.innerHTML="<p style=\'color:#3fb950\'>Selfie OK.</p>";}',
          'async function enviar(ev){ev.preventDefault();var R=document.getElementById("resp");',
          'var c1=document.getElementById("clave").value,c2=document.getElementById("clave2").value;',
          'if(c1!==c2){R.innerHTML="<p style=\'color:#f85149\'>Las claves no coinciden.</p>";return false;}',
          'var df=document.getElementById("docFrente").dataset.b64||"";',
          'var sb=document.getElementById("bself").dataset.selfie||"";',
          'if(!df){R.innerHTML="<p>Falta la foto del documento.</p>";return false;}',
          'if(!sb){R.innerHTML="<p>Falta la selfie.</p>";return false;}',
          'R.innerHTML="<p style=\'color:#8b949e\'>Enviando a la Red y verificando biometria...</p>";',
          'try{var r=await fetch("/registro/nuevo",{method:"POST",headers:{"Content-Type":"application/json"},',
          'body:JSON.stringify({nombre:document.getElementById("nombre").value,clave:c1,doc_image_b64:df,selfie_image_b64:sb})});',
          'var j=await r.json();',
          'if(j.ok&&j.zid){R.innerHTML="<div style=\'background:#0f2a1a;border:1px solid #238636;border-radius:12px;padding:14px\'><p style=\'color:#3fb950;font-weight:800;font-size:17px\'>REGISTRO EXITOSO</p><p>Tu ZID unico fue creado:</p><p class=\'zid\'>"+j.zid+"</p><p>Guarda tu ZID y tu clave.</p><p><a href=\'/entrar\'>ENTRAR AHORA</a></p></div>";}',
          'else if(j.codigo==="mantenimiento"){R.innerHTML="<div style=\'background:#2a2410;border:1px solid #f0b429;border-radius:12px;padding:14px\'><p style=\'color:#f0b429;font-weight:800\'>BIOMETRIA EN MANTENIMIENTO</p><p>"+(j.error||"")+"</p><p><a href=\'/registro\'>Volver a intentar</a></p></div>";}',
          'else{R.innerHTML="<p style=\'color:#f85149;font-weight:700\'>NO SE PUDO CREAR EL ZID</p><p>"+(j.error||"Motivo desconocido")+"</p>";}}',
          'catch(e){R.innerHTML="<p style=\'color:#f85149\'>La Red no respondio ("+e+"). Intenta de nuevo.</p>";}',
          'return false;}',
          '</script></body></html>']
          (PT / 'registro.html').write_text('\n'.join(REGL) + '\n', encoding='utf-8')
          add('- registro.html: marcos con esquinas verdes para documento, ovalo violeta para selfie,')
          add('  vista previa de cada foto, y mensaje de error de camara con instrucciones.')
          gate('marcos_visuales', True)
          add('')
          if (PT / 'version.txt').exists():
              (PT / 'version.txt').write_text('ZYRA-2026.10.12-9\n', encoding='utf-8')
          add('## R4. Compilacion')
          add('')
          try:
              py_compile.compile(str(SPY), doraise=True)
              gate('compila', True)
              add('- OK')
          except Exception as e:
              gate('compila', False)
              add('- FALLO: %s' % e)
          add('')
          add('## R5. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zd29', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/sd29', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          tv = time.time()
          while time.time() - tv < 40:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              tv = time.time()
              while time.time() - tv < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s' % (vivo, spv))
          if spv:
              st, _h, b = pedir(BSP + '/registro')
              gate('registro_marcos', st == 200 and 'guia-ovalo' in b and 'esquinas' in b)
              cuerpo = json.dumps({'nombre': 'Prueba D29', 'clave': 'clave-prima-99',
                                   'doc_image_b64': 'dGVzdA==', 'selfie_image_b64': 'dGVzdA=='}).encode()
              st, _h, b = pedir(BSP + '/registro/nuevo', data=cuerpo)
              try:
                  j = json.loads(b)
                  zid = j.get('zid', '')
                  cod = j.get('codigo', '')
                  err = str(j.get('error', ''))[:150]
              except Exception:
                  zid, cod, err = '', '', b[:150]
              if zid:
                  res = 'ZID CREADO: ' + zid
              elif cod == 'mantenimiento':
                  res = 'MANTENIMIENTO (solicitud guardada)'
              else:
                  res = 'respuesta: ' + err
              add('- POST /registro/nuevo -> %s | %s' % (st, res))
              gate('registro_responde', st in (200, 400, 500, 502))
          else:
              for g in ('registro_marcos', 'registro_responde'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D29 VERIFICADO. Commit.**')
              add('')
              add('El registro ya NO dira Sin conexion: respondera con ZID creado, mantenimiento o el motivo exacto.')
              add('Marcos visuales: documento con esquinas verdes, selfie con ovalo violeta.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('faseD29.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D29 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(D29): /registro/nuevo restaurado, marcos visuales doc y selfie"
            git push
            echo "## Commit aplicado - espera deploy y prueba el registro" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
