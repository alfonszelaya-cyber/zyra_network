name: "RECUPERACION server.py AGRO: restaurar desde git history la ultima version SIN AidMixin + verificar"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }

      - name: "[RECUPERACION] buscar la ultima version buena de server.py en el history y restaurarla"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          RESTORED=0
          for sha in $(git log --format="%H" -- apps/agro/server.py | head -30); do
            if git show "$sha:apps/agro/server.py" 2>/dev/null | grep -q "class AgroApiHandler" && ! git show "$sha:apps/agro/server.py" 2>/dev/null | grep -q "AidMixin"; then
              NL=$(git show "$sha:apps/agro/server.py" | wc -l)
              if [ "$NL" -gt 2000 ]; then
                git show "$sha:apps/agro/server.py" > apps/agro/server.py
                echo "- RESTAURADA version de commit $sha ($NL lineas, sin AidMixin)" >> "$SUM"
                RESTORED=1
                break
              fi
            fi
          done
          if [ "$RESTORED" != "1" ]; then
            echo "- **ERROR: no se encontro version buena en el history**" >> "$SUM"
            exit 1
          fi
          python3 -c "import ast; ast.parse(open('apps/agro/server.py').read()); print('sintaxis OK')" >> "$SUM" 2>&1
          rm -f apps/agro/routers/aid_mixin.py apps/agro/routers/screens_mixin.py apps/agro/routers/get_mixin.py apps/agro/routers/post_mixin.py apps/agro/routers/zyra_mixin.py apps/agro/routers/http_mixin.py apps/agro/routers/server_shared.py apps/agro/server_backup_original.py 2>/dev/null
          exit 0

      - name: "[LECTURA] regresion AGRO completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — SISTEMA RECUPERADO" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed)" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -40 /tmp/x3.out; echo '```'; } >> "$SUM"
          fi
          exit 0

      - name: "[ENTREGA] commit de la recuperacion"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            echo "SIN CAMBIOS" >> "$SUM"
          else
            git commit -m "fix(recuperacion): server.py AGRO restaurado desde git history (ultima version sin AidMixin — una corrida anterior hizo commit del server roto)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/push.log 2>&1 || git push origin "HEAD:main" > /tmp/push2.log 2>&1
          fi
          if [ "$(cat /tmp/x3 2>/dev/null || echo 1)" = "0" ]; then
            echo "RECUPERADO — SISTEMA ESTABLE (57 tests verde). server.py AGRO original intacto." >> "$SUM"
          else
            echo "RECUPERACION_FALLO" >> "$SUM"
          fi
          exit 0
