          echo "=== 4 DECORADORES (shared/decorators) ==="
          escribir apps/laboratorio/shared/decorators/timed.py << 'ZYRA_EOF'
          """Decorador cronometrado: mide la duracion real de cada llamada."""
          import functools
          import time


          def cronometrado(func):
              """Registra la duracion en ms del ultimo llamado en el wrapper."""

              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  inicio = time.perf_counter()
                  try:
                      return func(*args, **kwargs)
                  finally:
                      wrapper.ultima_duracion_ms = round(
                          (time.perf_counter() - inicio) * 1000.0, 3
                      )

              wrapper.ultima_duracion_ms = 0.0
              return wrapper
          ZYRA_EOF
          escribir apps/laboratorio/shared/decorators/idempotent.py << 'ZYRA_EOF'
          """Decorador idempotente: repetir la llamada no repite el efecto."""
          import functools


          def idempotente(func):
              """Cachea por argumentos; la segunda llamada devuelve sin ejecutar."""

              cache = {}

              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  clave = (
                      func.__module__,
                      func.__qualname__,
                      repr(args),
                      tuple(sorted((k, repr(v)) for k, v in kwargs.items())),
                  )
                  if clave in cache:
                      wrapper.aciertos += 1
                      return cache[clave]
                  resultado = func(*args, **kwargs)
                  cache[clave] = resultado
                  wrapper.ejecuciones += 1
                  return resultado

              wrapper.ejecuciones = 0
              wrapper.aciertos = 0
              wrapper.limpiar = cache.clear
              return wrapper
          ZYRA_EOF
          escribir apps/laboratorio/shared/decorators/require_permission.py << 'ZYRA_EOF'
          """Decorador de permisos: exige un codigo antes de ejecutar."""
          import functools

          from apps.laboratorio.shared.exceptions.domain_errors import PermisoDenegadoError


          def requiere_permiso(verificador, codigo_permiso: str):
              """Fábrica: verificador(codigo) -> bool concede o deniega."""

              if not callable(verificador):
                  raise ValueError("El verificador debe ser callable.")
              if not codigo_permiso or not isinstance(codigo_permiso, str):
                  raise ValueError("Codigo de permiso invalido.")

              def decorador(func):
                  @functools.wraps(func)
                  def wrapper(*args, **kwargs):
                      if not verificador(codigo_permiso):
                          raise PermisoDenegadoError(
                              "Permiso requerido: " + codigo_permiso
                          )
                      return func(*args, **kwargs)

                  return wrapper

              return decorador
          ZYRA_EOF
          escribir apps/laboratorio/shared/decorators/audited.py << 'ZYRA_EOF'
          """Decorador auditado: registra duracion y error de cada llamada."""
          import functools
          import time


          def auditado(registrador=None):
              """Fábrica: registrador(dict) recibe el reporte de cada llamada."""

              def decorador(func):
                  @functools.wraps(func)
                  def wrapper(*args, **kwargs):
                      inicio = time.perf_counter()
                      error = None
                      try:
                          return func(*args, **kwargs)
                      except Exception as exc:
                          error = type(exc).__name__ + ": " + str(exc)
                          raise
                      finally:
                          if registrador is not None:
                              registrador(
                                  {
                                      "funcion": func.__qualname__,
                                      "duracion_ms": round(
                                          (time.perf_counter() - inicio) * 1000.0, 3
                                      ),
                                      "error": error,
                                  }
                              )

                  return wrapper

              return decorador
          ZYRA_EOF
          echo "=== 5 UTILIDADES (shared/utilities) ==="
          escribir apps/laboratorio/shared/utilities/id_generator.py << 'ZYRA_EOF'
          """Generadores de ids legibles y codigos cortos.

          Diferencia con models.identifiers (dueño de Identificador de dominio):
          aqui se producen slugs y codigos de presentacion, no entidades.
          """
          import re
          import secrets
          import time
          import unicodedata


          def slug(texto: str, maximo: int = 40) -> str:
              """Convierte texto a slug ascii: 'ZYRA El Salvador' -> 'zyra-el-salvador'."""
              if not isinstance(texto, str):
                  raise ValueError("slug requiere texto.")
              normalizado = unicodedata.normalize("NFKD", texto)
              ascii_puro = normalizado.encode("ascii", "ignore").decode("ascii")
              limpio = re.sub(r"[^a-zA-Z0-9]+", "-", ascii_puro).strip("-").lower()
              if not limpio:
                  limpio = "sin-nombre"
              return limpio[:maximo].strip("-")


          def id_legible(prefijo: str, texto: str = "") -> str:
              """Produce ids tipo 'proy-zyra-el-salvador-a1b2c3'."""
              if not prefijo or not prefijo.replace("-", "").replace("_", "").isalnum():
                  raise ValueError("Prefijo invalido: " + repr(prefijo))
              partes = [prefijo]
              if texto.strip():
                  partes.append(slug(texto))
              partes.append(secrets.token_hex(3))
              return "-".join(partes)


          def codigo_corto(longitud_bytes: int = 4) -> str:
              """Codigo hex aleatorio corto para verificacion visual."""
              if not 1 <= longitud_bytes <= 32:
                  raise ValueError("longitud_bytes debe estar entre 1 y 32.")
              return secrets.token_hex(longitud_bytes)


          def marca_tiempo_compacta() -> str:
              """Milisegundos epoch en hex, para ordenar sin ambiguedad."""
              return format(int(time.time() * 1000), "x")
          ZYRA_EOF
          escribir apps/laboratorio/shared/utilities/file_utils.py << 'ZYRA_EOF'
          """Utilidades de archivos con proteccion anti path-traversal."""
          from pathlib import Path


          def ruta_segura(base, *partes) -> Path:
              """Resuelve base/partes y falla si el resultado escapa de base."""
              base_resuelta = Path(base).resolve()
              if not partes:
                  raise ValueError("ruta_segura requiere partes de ruta.")
              candidata = base_resuelta.joinpath(*[str(p) for p in partes]).resolve()
              if candidata != base_resuelta and base_resuelta not in candidata.parents:
                  raise ValueError("Ruta fuera de la base permitida: " + candidata.name)
              return candidata


          def tamano_dentro_de_limite(datos: bytes, maximo_mb: float) -> bool:
              """True si los bytes no exceden el limite en MB."""
              if not isinstance(maximo_mb, (int, float)) or maximo_mb <= 0:
                  raise ValueError("maximo_mb debe ser positivo.")
              if not isinstance(datos, (bytes, bytearray)):
                  raise ValueError("Se esperaban bytes.")
              return len(datos) <= int(maximo_mb * 1024 * 1024)


          def extension_segura(nombre_archivo: str) -> str:
              """Devuelve la extension validada (alfanumerica) o falla."""
              if not isinstance(nombre_archivo, str) or not nombre_archivo.strip():
                  raise ValueError("Nombre de archivo invalido.")
              ext = Path(nombre_archivo).suffix.lower().lstrip(".")
              if not ext or not ext.isalnum():
                  raise ValueError("Extension invalida o ausente: " + repr(nombre_archivo))
              return ext
          ZYRA_EOF
          escribir apps/laboratorio/shared/utilities/logging_utils.py << 'ZYRA_EOF'
          """Logging estructurado JSON por modulo, sin handlers duplicados."""
          import json
          import logging
          import sys


          class FormatoEstructurado(logging.Formatter):
              """Emite cada linea de log como objeto JSON plano."""

              def format(self, record: logging.LogRecord) -> str:
                  datos = {
                      "nivel": record.levelname,
                      "logger": record.name,
                      "mensaje": record.getMessage(),
                  }
                  if record.exc_info:
                      datos["excepcion"] = self.formatException(record.exc_info)
                  return json.dumps(datos, ensure_ascii=True)


          _cache_loggers = {}


          def obtener_logger(nombre: str) -> logging.Logger:
              """Devuelve el logger del modulo con formato estructurado."""
              if not nombre or not nombre.replace("_", "").replace("-", "").isalnum():
                  raise ValueError("Nombre de logger invalido.")
              clave = "laboratorio." + nombre
              if clave in _cache_loggers:
                  return _cache_loggers[clave]
              logger = logging.getLogger(clave)
              if not logger.handlers:
                  manejador = logging.StreamHandler(sys.stdout)
                  manejador.setFormatter(FormatoEstructurado())
                  logger.addHandler(manejador)
                  logger.setLevel(logging.INFO)
                  logger.propagate = False
              _cache_loggers[clave] = logger
              return logger
          ZYRA_EOF
          escribir apps/laboratorio/shared/utilities/image_utils.py << 'ZYRA_EOF'
          """Deteccion de formatos de imagen por firma y dimensiones PNG."""
          import struct

          FIRMA_PNG = b"\x89PNG\r\n\x1a\n"
          FIRMA_JPEG = b"\xff\xd8\xff"


          def detectar_formato(datos: bytes) -> str:
              """Devuelve 'png', 'jpeg' o 'desconocido' segun la firma real."""
              if not isinstance(datos, (bytes, bytearray)) or not datos:
                  raise ValueError("Se requieren bytes para detectar formato.")
              if bytes(datos[:8]) == FIRMA_PNG:
                  return "png"
              if bytes(datos[:3]) == FIRMA_JPEG:
                  return "jpeg"
              return "desconocido"


          def dimensiones_png(datos: bytes) -> tuple:
              """Extrae (ancho, alto) de la cabecera IHDR de un PNG."""
              if detectar_formato(datos) != "png":
                  raise ValueError("Los datos no son un PNG.")
              if len(datos) < 24:
                  raise ValueError("PNG truncado: faltan bytes de cabecera.")
              ancho, alto = struct.unpack(">II", bytes(datos[16:24]))
              return (int(ancho), int(alto))


          def es_imagen_valida(datos: bytes) -> bool:
              """True solo si los bytes son PNG o JPEG reales."""
              return detectar_formato(datos) in ("png", "jpeg")
          ZYRA_EOF
          escribir apps/laboratorio/shared/utilities/mesh_utils.py << 'ZYRA_EOF'
          """Utilidades de mallas 3D: bbox, triangulos e indices."""
          from typing import Sequence, Tuple


          def _vertice_valido(v) -> bool:
              if not isinstance(v, (tuple, list)) or len(v) != 3:
                  return False
              for c in v:
                  if isinstance(c, bool) or not isinstance(c, (int, float)):
                      return False
              return True


          def bounding_box(vertices: Sequence[Tuple[float, float, float]]) -> tuple:
              """Devuelve ((min_x,min_y,min_z), (max_x,max_y,max_z))."""
              if not vertices:
                  raise ValueError("bounding_box requiere al menos un vertice.")
              for v in vertices:
                  if not _vertice_valido(v):
                      raise ValueError("Vertice invalido: " + repr(v))
              xs = [float(v[0]) for v in vertices]
              ys = [float(v[1]) for v in vertices]
              zs = [float(v[2]) for v in vertices]
              return ((min(xs), min(ys), min(zs)), (max(xs), max(ys), max(zs)))


          def contar_triangulos(indices: Sequence[int]) -> int:
              """Cuenta triangulos: los indices deben venir en multiplos de 3."""
              if not indices or len(indices) % 3 != 0:
                  raise ValueError("Indices deben venir en multiplos de 3.")
              return len(indices) // 3


          def validar_indices(indices: Sequence[int], total_vertices: int) -> bool:
              """True si todo indice apunta a un vertice existente."""
              if total_vertices < 1:
                  raise ValueError("total_vertices debe ser positivo.")
              for i in indices:
                  if not isinstance(i, int) or isinstance(i, bool):
                      raise ValueError("Indice no entero: " + repr(i))
                  if not 0 <= i < total_vertices:
                      raise ValueError("Indice fuera de rango: " + str(i))
              return True
          ZYRA_EOF
