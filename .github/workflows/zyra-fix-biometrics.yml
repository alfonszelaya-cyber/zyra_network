name: ZYRA S38 veredicto final post-deploy S37

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s38:
    runs-on: ubuntu-latest
    steps:
      - name: Leer motor activo + probar cadena completa
        run: |
          B="(sin respuesta)"
          for i in 1 2 3 4 5 6 7 8; do
            B=$(curl -sS -m 30 "https://zyra-network-or16.onrender.com/provider" 2>/dev/null | head -c 300)
            echo "provider intento $i: $B"
            if printf '%s' "$B" | grep -q "provider"; then break; fi
            sleep 15
          done
          PNG="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          DATA="{\"nombre\":\"ZZ TEST BORRAR\",\"clave\":\"prueba12345\",\"doc_image_b64\":\"$PNG\",\"selfie_image_b64\":\"$PNG\",\"doc_type\":\"dui\"}"
          C=$(curl -sS -m 150 -o /tmp/b38 -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "$DATA" "https://zyra-superapp.onrender.com/registro/nuevo" 2>/dev/null)
          BODY=$(head -c 600 /tmp/b38)
          {
            echo "## S38 — VEREDICTO FINAL"
            echo '````'
            echo "GET /provider  -> $B"
            echo "POST registro  -> HTTP $C : $BODY"
            echo ""
            if printf '%s' "$B" | grep -q "zyravision"; then
              if printf '%s' "$BODY" | grep -qE "ningun rostro|template_quality|biometrics_gate"; then
                echo "=================================================="
                echo ">>> MOTOR ZYRA VISION ACTIVO Y ATENDIENDO."
                echo ">>> La Red corrio el motor y rechazo la imagen de"
                echo ">>> prueba (1 pixel sin rostro) = EXACTO LO CORRECTO."
                echo ">>>"
                echo ">>> CELULAR AHORA:"
                echo ">>> 1. Desinstala la PWA, agregala de nuevo (debe decir v22)."
                echo ">>> 2. Registra con tu DUI real: nombre+apellido ->"
                echo ">>>    fotos -> selfie -> clave -> Crear mi ZID."
                echo ">>> 3. Final: REGISTRO EXITOSO + TU ZID."
                echo "=================================================="
              elif printf '%s' "$BODY" | grep -q "mantenimiento"; then
                echo ">>> Red con motor OK; superapp con codigo viejo."
                echo ">>> Render -> zyra-superapp -> Manual Deploy -> Deploy latest commit."
                echo ">>> Espera Live y relanza S38."
              elif printf '%s' "$BODY" | grep -q '"zid"'; then
                echo ">>> ZID CREADO CON 1 PIXEL: NO deberia. Avisar de inmediato."
              else
                echo ">>> Motor activo; respuesta no clasificada: mandar este bloque."
              fi
            elif printf '%s' "$B" | grep -q "fail-closed"; then
              echo "=================================================="
              echo ">>> La Red dice FAIL-CLOSED. Los logs ahora DICEN LA VERDAD:"
              echo ">>> Render -> zyra-network-or16 -> Logs (arriba de todo, del arranque) ->"
              echo ">>> busca estas 2 lineas y pegamelas:"
              echo ">>>   'ZYRA provider seleccionado: ...'"
              echo ">>>   'biometrics engine wired (provider: ...)'"
              echo ">>> Si dice 'seleccionado: zyra' + 'provider: fail-closed' ="
              echo ">>>   el import del motor fallo en Render (pegame tambien el"
              echo ">>>   traceback que aparece justo despues de esas lineas)."
              echo ">>> Si dice 'seleccionado: fail-closed' ="
              echo ">>>   la variable no llega al proceso: verifica en Environment"
              echo ">>>   de ESTE servicio (zyra-network) que exista"
              echo ">>>   ZYRA_BIOMETRICS_PROVIDER = zyra"
              echo "=================================================="
            elif printf '%s' "$B" | grep -q "unknown route"; then
              echo ">>> /provider sigue sin existir: el deploy 4a4d103 no sirve codigo nuevo."
              echo ">>> Render -> zyra-network -> Events: verifica que el deploy de 4a4d103"
              echo ">>> diga 'Deploy succeeded'. Si dice failed, pegame la linea roja."
            else
              echo ">>> Respuesta no clasificada: mandar este bloque completo."
            fi
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-s38
          path: superapp.py
