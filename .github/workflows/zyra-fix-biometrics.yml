      - name: "[LECTURA] NG4-a tests finanzas avanzadas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          mkdir -p apps/nexo/tests
          cat > apps/nexo/tests/test_ng4_finance.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.finance.accounts_receivable_engine import AccountsReceivableEngine
          from apps.nexo.domain.finance.accounts_payable_engine import AccountsPayableEngine
          from apps.nexo.domain.finance.treasury_engine import TreasuryEngine
          from apps.nexo.domain.finance.fixed_assets_engine import FixedAssetsEngine
          from apps.nexo.domain.finance.budget_engine import BudgetEngine

          def test_ar_aging(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "ar.db")
              ar = AccountsReceivableEngine(db, FrozenClock())
              inv = ar.create_invoice(company_id="EMP-AR",
                  client_id="CLI-1",
                  invoice_number="F-2001", amount="1000",
                  credit_days=30)
              assert inv["balance"] == "1000"
              p = ar.register_payment(invoice_id=inv["invoice_id"],
                  amount="400", reference="AB-1")
              assert p["balance"] == "600"
              assert p["status"] == "PARTIAL"
              with pytest.raises(ValueError):
                  ar.register_payment(
                      invoice_id=inv["invoice_id"],
                      amount="99999")
              ag = ar.aging("EMP-AR")
              assert ag["aging"]["current"] == "600"
              assert ag["overdue_invoices"] == 0
              print("OK CxC: abonos parciales + aging + proteccion")

          def test_ap_approval_flow(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "ap.db")
              ap = AccountsPayableEngine(db, FrozenClock())
              inv = ap.create_invoice(company_id="EMP-AP",
                  supplier_id="PROV-1",
                  invoice_number="P-500",
                  amount="800", purchase_order="OC-77")
              assert inv["status"] == "PENDING_APPROVAL"
              with pytest.raises(ValueError):
                  ap.register_payment(
                      invoice_id=inv["invoice_id"],
                      amount="100")
              a = ap.approve_invoice(
                  invoice_id=inv["invoice_id"],
                  approver="gerente")
              assert a["status"] == "APPROVED"
              assert a["approved_by"] == "gerente"
              ap.register_payment(invoice_id=inv["invoice_id"],
                  amount="300")
              got = ap.get_invoice(inv["invoice_id"])
              assert got["status"] == "PARTIAL"
              assert got["balance"] == "500"
              print("OK CxP: aprobacion requerida + pago parcial")

          def test_treasury_position(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "tr.db")
              tr = TreasuryEngine(db, FrozenClock())
              banco = tr.create_account(company_id="EMP-TR",
                  account_name="Banco Principal",
                  account_kind="BANK", bank="Banco NEXO")
              caja = tr.create_account(company_id="EMP-TR",
                  account_name="Caja General",
                  account_kind="CASH")
              d = tr.deposit(account_id=banco["account_id"],
                  amount="5000", reference="apertura")
              assert d["balance"] == "5000.00"
              t = tr.transfer(
                  from_account=banco["account_id"],
                  to_account=caja["account_id"],
                  amount="1200")
              assert t["from_balance"] == "3800.00"
              assert t["to_balance"] == "1200.00"
              with pytest.raises(ValueError):
                  tr.withdraw(account_id=banco["account_id"],
                      amount="999999")
              pos = tr.position("EMP-TR")
              assert len(pos) == 2
              tx = tr.transactions_of("EMP-TR")
              assert len(tx) == 3
              print("OK tesoreria: saldo 2d + transferencia + sin sobregiro")

          def test_fixed_assets_depreciation(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "fa.db")
              fa = FixedAssetsEngine(db, FrozenClock())
              a = fa.register_asset(company_id="EMP-FA",
                  asset_name="Camion reparto",
                  acquisition_cost="12000",
                  useful_life_months=60,
                  residual_value="2000")
              dep = fa.monthly_depreciation(a["asset_id"])
              assert dep == "166.67"
              m1 = fa.apply_month(a["asset_id"], months=12)
              assert (m1["accumulated_depreciation"]
                      == "2000.04")
              assert m1["book_value"] == "9999.96"
              for _ in range(60):
                  fa.apply_month(a["asset_id"])
              full = fa.get_asset(a["asset_id"])
              assert (full["accumulated_depreciation"]
                      == "10000.00")
              assert full["book_value"] == "2000.00"
              d = fa.dispose(asset_id=a["asset_id"],
                  reason="venta")
              assert d["status"] == "DISPOSED"
              print("OK activos: depreciacion con tope 2d + baja")

          def test_budget_alerts(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "bg.db")
              bud = BudgetEngine(db, FrozenClock())
              bud.set_budget(company_id="EMP-BG",
                  period="2026-03", category="COMBUSTIBLE",
                  budgeted="500")
              bud.register_actual(company_id="EMP-BG",
                  period="2026-03", category="COMBUSTIBLE",
                  amount="300")
              b = bud.get_budget("EMP-BG", "2026-03",
                                 "COMBUSTIBLE")
              assert b["over_budget"] is False
              bud.register_actual(company_id="EMP-BG",
                  period="2026-03", category="COMBUSTIBLE",
                  amount="250")
              b2 = bud.get_budget("EMP-BG", "2026-03",
                                  "COMBUSTIBLE")
              assert b2["over_budget"] is True
              assert b2["actual"] == "550.00"
              al = bud.alerts("EMP-BG", "2026-03")
              assert len(al) == 1
              assert al[0]["category"] == "COMBUSTIBLE"
              print("OK presupuesto: acumulado 2d + alerta desviacion")
          TSEOF
          timeout 120 python3 -m pytest apps/nexo/tests/test_ng4_finance.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/ng4a.out 2>&1
          echo $? > /tmp/ng4a
          if [ "$(cat /tmp/ng4a)" = "0" ]; then echo "- NG4a finanzas avanzadas: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- NG4a: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### NG4a detalle"; echo '```'; tail -80 /tmp/ng4a.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] NG4-b tests finance engine + use cases"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          mkdir -p apps/nexo/tests
          cat > apps/nexo/tests/test_ng4_usecases.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.finance.finance_engine import FinanceEngine
          from apps.nexo.domain.finance.finance_registry import FinanceRegistry
          from apps.nexo.domain.finance.financial_validation_engine import FinancialValidationEngine
          from apps.nexo.domain.finance.treasury_engine import TreasuryEngine
          from apps.nexo.domain.finance.budget_engine import BudgetEngine
          from apps.nexo.application.finance_use_cases.create_financial_record_use_case import CreateFinancialRecordUseCase
          from apps.nexo.application.finance_use_cases.generate_financial_report_use_case import GenerateFinancialReportUseCase
          from apps.nexo.application.finance_use_cases.process_financial_operation_use_case import ProcessFinancialOperationUseCase
          from apps.nexo.application.finance_use_cases.validate_financial_operation_use_case import ValidateFinancialOperationUseCase

          def _setup(tmp_path):
              db = SQLiteAdapter(tmp_path / "fin.db")
              clock = FrozenClock()
              val = FinancialValidationEngine(db, clock)
              eng = FinanceEngine(db, clock)
              reg = FinanceRegistry(db, clock)
              trs = TreasuryEngine(db, clock)
              bud = BudgetEngine(db, clock)
              return db, clock, val, eng, reg, trs, bud

          def test_validate_usecase(tmp_path) -> None:
              _, _, val, _, _, _, _ = _setup(tmp_path)
              uc = ValidateFinancialOperationUseCase(val)
              r = uc.execute(amount="100", currency="USD",
                             category="VENTAS",
                             period="2026-03")
              assert r["valid"] is True
              r2 = uc.execute(amount="-5", currency="XXX",
                              category="", period="")
              assert r2["valid"] is False
              print("OK validate fin: reglas de produccion")

          def test_create_record_usecase(tmp_path) -> None:
              _, _, val, eng, reg, _, _ = _setup(tmp_path)
              uc = CreateFinancialRecordUseCase(val, eng, reg)
              r = uc.execute(company_id="EMP-F",
                  period="2026-03", record_type="INCOME",
                  amount="1500", category="VENTAS",
                  actor="contador")
              assert r["created"] is True
              evs = reg.events_of("EMP-F")
              assert evs[0]["event_type"] == "RECORD_CREATED"
              r2 = uc.execute(company_id="EMP-F",
                  period="2026-03", record_type="INCOME",
                  amount="0", category="VENTAS")
              assert r2["created"] is False
              print("OK create record: crea + traza + rechaza")

          def test_process_operation_usecase(tmp_path) -> None:
              _, _, val, eng, reg, trs, bud = _setup(tmp_path)
              banco = trs.create_account(
                  company_id="EMP-PO",
                  account_name="Banco", account_kind="BANK")
              bud.set_budget(company_id="EMP-PO",
                  period="2026-03", category="LOGISTICA",
                  budgeted="1000")
              uc = ProcessFinancialOperationUseCase(
                  val, eng, treasury=trs, budget=bud)
              r1 = uc.execute(company_id="EMP-PO",
                  period="2026-03", record_type="INCOME",
                  amount="3000", category="VENTAS",
                  treasury_account=banco["account_id"],
                  reference="cobro F-1")
              assert r1["processed"] is True
              assert (r1["treasury_tx"]["balance"]
                      == "3000.00")
              r2 = uc.execute(company_id="EMP-PO",
                  period="2026-03", record_type="EXPENSE",
                  amount="600", category="LOGISTICA",
                  treasury_account=banco["account_id"],
                  reference="flete")
              assert r2["processed"] is True
              assert r2["budget"]["over_budget"] is False
              acc = trs.get_account(banco["account_id"])
              assert acc["balance"] == "2400.00"
              print("OK proceso fin: valida+registra+tesoreria 2d+presupuesto")

          def test_financial_report_usecase(tmp_path) -> None:
              _, _, val, eng, reg, trs, bud = _setup(tmp_path)
              eng.create_record(company_id="EMP-R",
                  period="2026-03", record_type="INCOME",
                  amount="2000", category="VENTAS")
              eng.create_record(company_id="EMP-R",
                  period="2026-03", record_type="EXPENSE",
                  amount="700", category="LOGISTICA")
              bud.set_budget(company_id="EMP-R",
                  period="2026-03", category="LOGISTICA",
                  budgeted="500")
              r = GenerateFinancialReportUseCase(
                  eng, bud).execute(company_id="EMP-R",
                  period="2026-03")
              assert r["totals"]["income"] == "2000"
              assert r["totals"]["expense"] == "700"
              assert r["totals"]["net"] == "1300"
              assert len(r["budget_alerts"]) == 0
              print("OK reporte fin: totales + presupuestos del periodo")
          TSEOF
          timeout 120 python3 -m pytest apps/nexo/tests/test_ng4_usecases.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/ng4b.out 2>&1
          echo $? > /tmp/ng4b
          if [ "$(cat /tmp/ng4b)" = "0" ]; then echo "- NG4b use cases finance: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- NG4b: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### NG4b detalle"; echo '```'; tail -80 /tmp/ng4b.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] NGX regresion completa por bloque"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc1.out 2>&1
          echo $? > /tmp/ngxc1
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=short > /tmp/ngxc2.out 2>&1
          echo $? > /tmp/ngxc2
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc3.out 2>&1
          echo $? > /tmp/ngxc3
          for par in "ngxc1 nexo" "ngxc2 shared_engines" "ngxc3 subastas"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- NGX $2: ✅" >> "$SUM"
            else
              echo "- NGX $2: ❌" >> "$SUM"
              { echo "### NGX $2 detalle"; echo '```'; tail -100 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          if [ "$(cat /tmp/ngxc1)" = "0" ] && [ "$(cat /tmp/ngxc2)" = "0" ] && [ "$(cat /tmp/ngxc3)" = "0" ]; then echo 0 > /tmp/ngxc; else echo 1 > /tmp/ngxc; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si TODO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in ng3a ng3b ng4a ng4b ngxc; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: NG3+NG4 VERDES — ACCOUNTING CORE I y II (Decimal 2 decimales)**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-NG3+NG4 fix): Accounting Core I y II con montos SIEMPRE a 2 decimales (regla 61): mayor con cuantizacion y control de periodo cerrado via period_engine, asiento de cierre sin lineas vacias, estados financieros con cuadra bool nativo, tesoreria con saldos 2d, activos con depreciacion tope 2d, presupuestos acumulados 2d + use cases accounting/finance alineados (NG3+NG4 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — NG3+NG4 CERRADOS. Sigue NG5 fiscal completo.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
