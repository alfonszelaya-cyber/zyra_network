name: "ZYRA RUN8: Red/ZID R-1..R-9 (nacimiento completo + tutor-menor canonico + biometria infantil + representacion legal + capabilities + sesiones/firmas) + N-9 parcial"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] 7 engines de la Red (CLASES con MigrationRunner+clock — patron probado; carpetas shared_engines EXISTENTES)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("shared_engines/identity/birth_registry_engine.py",
                     D(r'''
              """Birth Registry Engine (R-1/R-3) - modelo completo
              de nacimiento alrededor del ZID (regla 78: nace SIN
              biometria): identidad del nacido, fecha/lugar, madre
              y padre por ZID (referencias, regla 63), EVIDENCIA
              de nacimiento como objeto de Red (tipo/issuer/hash/
              provenance/estado/revocacion), certificado con
              hash-chain por nacido. Patron clase + MigrationRunner
              (probado). Reglas 63/66/68/76/78."""
              from __future__ import annotations
              import hashlib
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import (
                  Database)
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "zid_births", (
                      "CREATE TABLE IF NOT EXISTS zid_births ("
                      " birth_id TEXT PRIMARY KEY, child_name TEXT"
                      " NOT NULL, birth_date TEXT NOT NULL DEFAULT"
                      " '', birth_place TEXT NOT NULL DEFAULT '',"
                      " sex TEXT NOT NULL DEFAULT '', mother_zid"
                      " TEXT NOT NULL DEFAULT '', father_zid TEXT"
                      " NOT NULL DEFAULT '', zid TEXT NOT NULL"
                      " DEFAULT '', cert_code TEXT NOT NULL,"
                      " cert_hash TEXT NOT NULL, prev_hash TEXT"
                      " NOT NULL DEFAULT '', status TEXT NOT NULL"
                      " DEFAULT 'active', created_at REAL NOT"
                      " NULL)",
                  )),
                  Migration(2, "zid_birth_evidence", (
                      "CREATE TABLE IF NOT EXISTS"
                      " zid_birth_evidence (ev_id TEXT PRIMARY"
                      " KEY, birth_id TEXT NOT NULL, kind TEXT NOT"
                      " NULL, issuer TEXT NOT NULL, doc_hash TEXT"
                      " NOT NULL, provenance TEXT NOT NULL DEFAULT"
                      " '', status TEXT NOT NULL DEFAULT 'valid',"
                      " revoked_reason TEXT NOT NULL DEFAULT '',"
                      " created_at REAL NOT NULL)",
                  )),
              )
              _SEX = ("M", "F", "I")
              _EVK = ("ACTA", "HOSPITAL", "DECLARACION")


              def _sha(t):
                  return hashlib.sha256(
                      t.encode("utf-8")).hexdigest()


              class BirthRegistryEngine:
                  """Nacimientos con evidencia y certificado."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "zid.birth",
                                      _MIGRATIONS).run(clock)

                  def register_birth(self, *, child_name,
                                     mother_zid, father_zid="",
                                     birth_date="", birth_place="",
                                     sex=""):
                      if not str(child_name).strip():
                          raise ValueError(
                              "child_name requerido")
                      if not str(mother_zid).strip():
                          raise ValueError(
                              "mother_zid requerido (regla"
                              " 78: nacimiento -> ZID)")
                      s = str(sex).upper()
                      if s and s not in _SEX:
                          raise ValueError("sex debe ser "
                                           + "/".join(_SEX))
                      now = self._clock.now()
                      bid = ("ZB-"
                             + uuid.uuid4().hex[:10])
                      prev = self._db.query_one(
                          "SELECT cert_hash FROM zid_births"
                          " WHERE child_name = ? ORDER BY rowid"
                          " DESC LIMIT 1",
                          (str(child_name),))
                      ph = (str(prev["cert_hash"])
                            if prev else "")
                      ch = _sha(ph + "|" + bid + "|"
                                + str(child_name) + "|"
                                + str(mother_zid) + "|"
                                + str(father_zid))
                      cert = ("ZCERT-"
                              + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO zid_births (birth_id,"
                          " child_name, birth_date, birth_place,"
                          " sex, mother_zid, father_zid, zid,"
                          " cert_code, cert_hash, prev_hash,"
                          " status, created_at) VALUES (?, ?, ?,"
                          " ?, ?, ?, ?, '', ?, ?, ?, 'active',"
                          " ?)",
                          (bid, str(child_name).strip(),
                           str(birth_date), str(birth_place), s,
                           str(mother_zid), str(father_zid),
                           cert, ch, ph, now))
                      return {"birth_id": bid,
                              "cert_code": cert,
                              "cert_hash": ch,
                              "zid": ""}

                  def get_birth(self, birth_id):
                      row = self._db.query_one(
                          "SELECT * FROM zid_births WHERE"
                          " birth_id = ?", (str(birth_id),))
                      if row is None:
                          return {"found": False}
                      return {"found": True,
                              "birth_id": str(
                                  row["birth_id"]),
                              "child_name": str(
                                  row["child_name"]),
                              "mother_zid": str(
                                  row["mother_zid"]),
                              "father_zid": str(
                                  row["father_zid"]),
                              "zid": str(row["zid"]),
                              "cert_code": str(
                                  row["cert_code"]),
                              "cert_hash": str(
                                  row["cert_hash"]),
                              "status": str(row["status"])}


                  def bind_zid(self, birth_id, *, zid,
                               actor=""):
                      row = self._db.query_one(
                          "SELECT status, zid FROM zid_births"
                          " WHERE birth_id = ?",
                          (str(birth_id),))
                      if row is None:
                          raise KeyError(birth_id)
                      if str(row["status"]) != "active":
                          raise ValueError(
                              "nacimiento no activo")
                      if str(row["zid"]).strip():
                          raise ValueError(
                              "ya tiene ZID (regla 78: UN"
                              " ZID por nacimiento)")
                      if not str(zid).strip():
                          raise ValueError("zid requerido")
                      self._db.execute(
                          "UPDATE zid_births SET zid = ? WHERE"
                          " birth_id = ?",
                          (str(zid), str(birth_id)))
                      return {"birth_id": str(birth_id),
                              "zid": str(zid)}


                  def attach_evidence(self, birth_id, *, kind,
                                      issuer, content_b64="",
                                      doc_hash="", provenance=""):
                      row = self._db.query_one(
                          "SELECT birth_id, status FROM"
                          " zid_births WHERE birth_id = ?",
                          (str(birth_id),))
                      if row is None:
                          raise KeyError(birth_id)
                      if str(row["status"]) != "active":
                          raise ValueError(
                              "nacimiento no activo")
                      k = str(kind).upper()
                      if k not in _EVK:
                          raise ValueError("kind debe ser "
                                           + "/".join(_EVK))
                      if not str(issuer).strip():
                          raise ValueError(
                              "issuer requerido")
                      if str(content_b64).strip():
                          dh = _sha(str(content_b64))
                      elif str(doc_hash).strip():
                          dh = (str(doc_hash).strip()
                                .lower())
                          if len(dh) != 64:
                              raise ValueError(
                                  "doc_hash 64 hex")
                      else:
                          raise ValueError(
                              "content_b64 o doc_hash"
                              " requerido (regla 66)")
                      eid = ("ZBE-"
                             + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO zid_birth_evidence"
                          " (ev_id, birth_id, kind, issuer,"
                          " doc_hash, provenance, status,"
                          " created_at) VALUES (?, ?, ?, ?, ?, ?,"
                          " 'valid', ?)",
                          (eid, str(birth_id), k, str(issuer),
                           dh, str(provenance), now := self
                           ._clock.now()))
                      return {"ev_id": eid,
                              "doc_hash": dh}


                  def revoke_evidence(self, ev_id, *, reason):
                      row = self._db.query_one(
                          "SELECT status FROM zid_birth_evidence"
                          " WHERE ev_id = ?", (str(ev_id),))
                      if row is None:
                          raise KeyError(ev_id)
                      if str(row["status"]) != "valid":
                          raise ValueError("ya revocada")
                      if not str(reason).strip():
                          raise ValueError(
                              "motivo obligatorio")
                      self._db.execute(
                          "UPDATE zid_birth_evidence SET status"
                          " = 'revoked', revoked_reason = ?"
                          " WHERE ev_id = ?",
                          (str(reason), str(ev_id)))
                      return {"ev_id": str(ev_id),
                              "status": "revoked"}


                  def evidence_of(self, birth_id):
                      rows = self._db.query_all(
                          "SELECT ev_id, kind, issuer, doc_hash,"
                          " provenance, status FROM"
                          " zid_birth_evidence WHERE birth_id ="
                          " ? ORDER BY rowid", (str(birth_id),))
                      return [{"ev_id": str(r["ev_id"]),
                               "kind": str(r["kind"]),
                               "issuer": str(r["issuer"]),
                               "doc_hash": str(r["doc_hash"]),
                               "provenance": str(
                                   r["provenance"]),
                               "status": str(r["status"])}
                              for r in rows]


                  def verify_chain(self, child_name):
                      rows = self._db.query_all(
                          "SELECT child_name, cert_hash,"
                          " prev_hash FROM zid_births WHERE"
                          " child_name = ? ORDER BY rowid",
                          (str(child_name),))
                      prev = ""
                      for r in rows:
                          if prev != str(r["prev_hash"]):
                              return False
                          prev = str(r["cert_hash"])
                      return True
              '''))
              forzar("shared_engines/identity/guardian_link_engine.py",
                     D(r'''
              """Guardian Link Engine (R-2) - la relacion
              tutor<->menor CANONICA de la Red (la misma para
              SEMILLA, AXIS y todas las apps, regla 69): vinculo
              MADRE/PADRE/TUTOR/REPRESENTANTE/ENCARGADO por ZIDs,
              UNICO activo por (guardian, menor, rol), revocacion
              con motivo, consulta de tutores del menor. Reglas
              63/66/68/76/78."""
              from __future__ import annotations
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import (
                  Database)
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "zid_guardian_links", (
                      "CREATE TABLE IF NOT EXISTS"
                      " zid_guardian_links (link_id TEXT PRIMARY"
                      " KEY, guardian_zid TEXT NOT NULL, minor_zid"
                      " TEXT NOT NULL, role TEXT NOT NULL, status"
                      " TEXT NOT NULL DEFAULT 'activa', revoked"
                      "_reason TEXT NOT NULL DEFAULT '', created"
                      "_at REAL NOT NULL, UNIQUE(guardian_zid,"
                      " minor_zid, role))",
                  )),
              )
              _ROLES = ("MADRE", "PADRE", "TUTOR",
                        "REPRESENTANTE", "ENCARGADO")


              class GuardianLinkEngine:
                  """Relacion tutor<->menor canonica."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "zid.guardian",
                                      _MIGRATIONS).run(clock)

                  def link(self, *, guardian_zid, minor_zid,
                           role):
                      g = str(guardian_zid).strip()
                      m = str(minor_zid).strip()
                      if not g or not m:
                          raise ValueError(
                              "guardian_zid y minor_zid"
                              " requeridos (regla 63:"
                              " por referencia)")
                      if g == m:
                          raise ValueError(
                              "guardian y minor no pueden"
                              " ser el mismo ZID")
                      r = str(role).upper()
                      if r not in _ROLES:
                          raise ValueError("role debe ser "
                                           + "/".join(_ROLES))
                      if r in ("MADRE", "PADRE") and \
                              not g.startswith("ZID-"):
                          raise ValueError(
                              "ZID invalido para"
                              " progenitor")
                      lid = ("ZGL-"
                             + uuid.uuid4().hex[:10])
                      try:
                          self._db.execute(
                              "INSERT INTO zid_guardian_links"
                              " (link_id, guardian_zid, minor_zid,"
                              " role, status, created_at)"
                              " VALUES (?, ?, ?, ?, 'activa', ?)",
                              (lid, g, m, r,
                               self._clock.now()))
                      except Exception:
                          dup = self._db.query_one(
                              "SELECT link_id, status FROM"
                              " zid_guardian_links WHERE"
                              " guardian_zid = ? AND minor_zid ="
                              " ? AND role = ?", (g, m, r))
                          if dup is not None and str(
                                  dup["status"]) == "activa":
                              raise ValueError(
                                  "vinculo ya activo"
                                  " (regla 66)")
                          lid = str(dup["link_id"])
                          self._db.execute(
                              "UPDATE zid_guardian_links SET"
                              " status = 'activa', revoked"
                              "_reason = '' WHERE link_id = ?",
                              (lid,))
                      return {"link_id": lid,
                              "guardian_zid": g,
                              "minor_zid": m,
                              "role": r,
                              "status": "activa"}

                  def revoke(self, link_id, *, reason):
                      row = self._db.query_one(
                          "SELECT status FROM"
                          " zid_guardian_links WHERE link_id ="
                          " ?", (str(link_id),))
                      if row is None:
                          raise KeyError(link_id)
                      if str(row["status"]) != "activa":
                          raise ValueError("ya revocado")
                      if not str(reason).strip():
                          raise ValueError(
                              "motivo obligatorio")
                      self._db.execute(
                          "UPDATE zid_guardian_links SET status"
                          " = 'revocada', revoked_reason = ?"
                          " WHERE link_id = ?",
                          (str(reason), str(link_id)))
                      return {"link_id": str(link_id),
                              "status": "revocada"}

                  def guardians_of(self, minor_zid,
                                   only_active=True):
                      if only_active:
                          rows = self._db.query_all(
                              "SELECT link_id, guardian_zid,"
                              " role FROM zid_guardian_links"
                              " WHERE minor_zid = ? AND status"
                              " = 'activa' ORDER BY rowid",
                              (str(minor_zid),))
                      else:
                          rows = self._db.query_all(
                              "SELECT link_id, guardian_zid,"
                              " role FROM zid_guardian_links"
                              " WHERE minor_zid = ? ORDER BY"
                              " rowid", (str(minor_zid),))
                      return [{"link_id": str(r["link_id"]),
                               "guardian_zid": str(
                                   r["guardian_zid"]),
                               "role": str(r["role"])}
                              for r in rows]

                  def minors_of(self, guardian_zid):
                      rows = self._db.query_all(
                          "SELECT link_id, minor_zid, role FROM"
                          " zid_guardian_links WHERE guardian"
                          "_zid = ? AND status = 'activa' ORDER"
                          " BY rowid", (str(guardian_zid),))
                      return [{"link_id": str(r["link_id"]),
                               "minor_zid": str(
                                   r["minor_zid"]),
                               "role": str(r["role"])}
                              for r in rows]

                  def is_guardian(self, guardian_zid, minor_zid,
                                  role=None):
                      if role:
                          row = self._db.query_one(
                              "SELECT link_id FROM"
                              " zid_guardian_links WHERE"
                              " guardian_zid = ? AND minor_zid ="
                              " ? AND role = ? AND status ="
                              " 'activa'",
                              (str(guardian_zid),
                               str(minor_zid),
                               str(role).upper()))
                      else:
                          row = self._db.query_one(
                              "SELECT link_id FROM"
                              " zid_guardian_links WHERE"
                              " guardian_zid = ? AND minor_zid ="
                              " ? AND status = 'activa'",
                              (str(guardian_zid),
                               str(minor_zid)))
                      return row is not None
              '''))
              forzar("shared_engines/identity/biometric_lifecycle_engine.py",
                     D(r'''
              """Biometric Lifecycle Engine (R-4) - lifecycle
              biometrico infantil FORMAL (regla 78): el ZID nace
              SIN biometria -> fase PENDING -> enrolamiento al
              MISMO ZID -> binding -> ACTUALIZACION por crecimiento
              (reemplazo con historial). PROTECCION ESPECIAL de
              menores: template JAMAS en claro (hash, regla 63),
              consentimiento del tutor requerido (via
              GuardianLinkEngine, regla 69), revocacion total.
              Patron clase. Reglas 63/66/68/76/78."""
              from __future__ import annotations
              import hashlib
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import (
                  Database)
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "zid_biometrics", (
                      "CREATE TABLE IF NOT EXISTS zid_biometrics"
                      " (bio_id TEXT PRIMARY KEY, zid TEXT NOT"
                      " NULL, kind TEXT NOT NULL, template_hash"
                      " TEXT NOT NULL, quality INTEGER NOT NULL"
                      " DEFAULT 0, status TEXT NOT NULL DEFAULT"
                      " 'activa', created_at REAL NOT NULL)",
                  )),
              )
              _KINDS = ("HUELLA", "ROSTRO", "IRIS")


              def _sha(t):
                  return hashlib.sha256(
                      t.encode("utf-8")).hexdigest()


              class BiometricLifecycleEngine:
                  """Biometria del MISMO ZID, con tutor."""

                  def __init__(self, db, clock,
                               guardian_engine=None):
                      self._db = db
                      self._clock = clock
                      self._guardians = guardian_engine
                      MigrationRunner(db, "zid.bio",
                                      _MIGRATIONS).run(clock)

                  def enroll(self, *, zid, kind, template_b64,
                             quality=0, guardian_zid=None):
                      if not str(zid).strip():
                          raise ValueError(
                              "zid requerido (regla 78:"
                              " mismo ZID del nacimiento)")
                      k = str(kind).upper()
                      if k not in _KINDS:
                          raise ValueError("kind debe ser "
                                           + "/".join(_KINDS))
                      if not str(template_b64).strip():
                          raise ValueError(
                              "template_b64 requerido")
                      if int(quality) < 0 or \
                              int(quality) > 100:
                          raise ValueError(
                              "quality 0..100")
                      if self._guardians is not None:
                          g = str(guardian_zid or "").strip()
                          if not g:
                              raise ValueError(
                                  "menor: enrolamiento exige"
                                  " tutor (proteccion)"
                                  " — pase guardian_zid")
                          if not self._guardians.is_guardian(
                                  g, str(zid)):
                              raise ValueError(
                                  "guardian_zid NO es tutor"
                                  " activo de este menor"
                                  " (regla 66)")
                      th = _sha(str(template_b64))
                      dup = self._db.query_one(
                          "SELECT bio_id FROM zid_biometrics"
                          " WHERE zid = ? AND kind = ? AND"
                          " status = 'activa'",
                          (str(zid), k))
                      if dup is not None:
                          self._db.execute(
                              "UPDATE zid_biometrics SET status"
                              " = 'reemplazada' WHERE bio_id ="
                              " ?", (str(dup["bio_id"]),))
                      bid = ("ZBIO-"
                             + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO zid_biometrics (bio_id,"
                          " zid, kind, template_hash, quality,"
                          " status, created_at)"
                          " VALUES (?, ?, ?, ?, ?, 'activa', ?)",
                          (bid, str(zid), k, th, int(quality),
                           self._clock.now()))
                      return {"bio_id": bid,
                              "template_hash": th,
                              "status": "activa"}

                  def verify(self, *, zid, kind, template_b64):
                      k = str(kind).upper()
                      th = _sha(str(template_b64))
                      row = self._db.query_one(
                          "SELECT bio_id, template_hash FROM"
                          " zid_biometrics WHERE zid = ? AND"
                          " kind = ? AND status = 'activa'",
                          (str(zid), k))
                      if row is None:
                          return {"matched": False,
                                  "reason": "sin plantilla"}
                      return {"matched":
                                  str(row["template_hash"])
                                  == th}

                  def revoke_all(self, zid, *, reason):
                      if not str(reason).strip():
                          raise ValueError(
                              "motivo obligatorio")
                      n = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " zid_biometrics WHERE zid = ? AND"
                          " status = 'activa'", (str(zid),))
                      self._db.execute(
                          "UPDATE zid_biometrics SET status ="
                          " 'revocada' WHERE zid = ? AND status"
                          " = 'activa'", (str(zid),))
                      return {"zid": str(zid),
                              "revoked": int(n["n"])}

                  def lifecycle_of(self, zid):
                      rows = self._db.query_all(
                          "SELECT bio_id, kind, status, quality"
                          " FROM zid_biometrics WHERE zid = ?"
                          " ORDER BY rowid", (str(zid),))
                      if not rows:
                          return {"zid": str(zid),
                                  "phase": "PENDING_BIOMETRIC",
                                  "note": "regla 78: nace sin"
                                          " biometria",
                                  "entries": []}
                      active = [r for r in rows
                                if str(r["status"])
                                == "activa"]
                      return {"zid": str(zid),
                              "phase": ("ENROLADO" if active
                                        else "REVOCADO"),
                              "entries": [{"bio_id": str(
                                  r["bio_id"]),
                                  "kind": str(r["kind"]),
                                  "status": str(r["status"])}
                                  for r in rows]}
              '''))
              forzar("shared_engines/identity/representation_engine.py",
                     D(r'''
              """Representation Engine (R-5) - 'este adulto puede
              actuar POR este ZID menor para ESTE servicio':
              alcance (servicio especifico o '*'), consentimiento
              del vinculo tutor (via GuardianLinkEngine, regla 69),
              EXPIRACION, revocacion, y el chequeo canonico
              can_act(). Patron clase. Reglas 63/66/68/76."""
              from __future__ import annotations
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import (
                  Database)
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "zid_representations", (
                      "CREATE TABLE IF NOT EXISTS"
                      " zid_representations (rep_id TEXT PRIMARY"
                      " KEY, guardian_zid TEXT NOT NULL, minor_zid"
                      " TEXT NOT NULL, service TEXT NOT NULL,"
                      " status TEXT NOT NULL DEFAULT 'activa',"
                      " expires_at REAL, revoked_reason TEXT NOT"
                      " NULL DEFAULT '', granted_by TEXT NOT"
                      " NULL DEFAULT '', created_at REAL NOT"
                      " NULL)",
                  )),
              )


              class RepresentationEngine:
                  """Representacion legal de menores."""

