          var fcx=caja.x+caja.w/2,fcy=caja.y+caja.h/2;
          var nx=(fcx-o.cx)/(o.rx*0.55),ny=(fcy-o.cy)/(o.ry*0.55);
          var wr=caja.w/vw;
          alineado=((nx*nx+ny*ny)<=1&&wr>0.16&&wr<0.60);
