name: "AUDITORIA TOTAL DEL SISTEMA (Red + todas las apps): sintaxis + tablas duplicadas/conflicto + clases/def duplicadas + logica SQL + utcnow + carpetas — solo lectura, veredicto LIMPIO o ERRORES"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias (cryptography explicito)
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }

      - name: "[AUDITORIA-TOTAL] 12 chequeos sobre TODO el sistema (solo lectura)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, re, subprocess
          from collections import defaultdict
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              out("# AUDITORIA TOTAL DEL SISTEMA — ZYRA")
              out("Alcance: apps/* + shared_engines/* (Red). Solo lectura.")

              # ---------- recoleccion ----------
              py_files = []
              for root in ("apps", "shared_engines"):
                  for p in pathlib.Path(root).rglob("*.py"):
                      if "__pycache__" in p.parts:
                          continue
                      py_files.append(p)
              out(f"## 0) ALCANCE: {len(py_files)} archivos .py")

              # archivos creados por zyra-bot (para atribuir hallazgos)
              mine = set()
              try:
                  r = subprocess.run(
                      ["git", "log", "--author=zyra-bot",
                       "--name-only", "--pretty=format:"],
                      capture_output=True, text=True, timeout=60)
                  for ln in r.stdout.splitlines():
                      ln = ln.strip()
                      if ln:
                          mine.add(ln)
              except Exception:
                  pass

              def es_mio(p):
                  return str(p) in mine

              # ---------- 1) SINTAXIS ----------
              trees = {}
              syntax_errors = []
              for p in py_files:
                  try:
                      src = p.read_text(encoding="utf-8")
                      trees[p] = ast.parse(src, filename=str(p))
                  except SyntaxError as e:
                      syntax_errors.append(f"{p}: linea {e.lineno}:"
                                           f" {e.msg}")
                  except Exception as e:
                      syntax_errors.append(f"{p}: {e}")
              out("## 1) SINTAXIS (ast.parse de TODO)")
              if syntax_errors:
                  out("**ERRORES DE SINTAXIS:**")
                  for e in syntax_errors[:30]:
                      out("- ERROR: " + e)
              else:
                  out("- **LIMPIO: 0 errores de sintaxis en "
                      + str(len(py_files)) + " archivos**")

              # ---------- 2) TABLAS: creadas ----------
              create_map = defaultdict(set)
              ddl_map = defaultdict(set)
              rx_create = re.compile(
                  r"CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?"
                  r"([a-zA-Z_][a-zA-Z0-9_]*)", re.I)
              for p, tree in trees.items():
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Constant) \
                              and isinstance(node.value, str):
                          v = node.value
                          for m in rx_create.finditer(v):
                              tname = m.group(1).lower()
                              create_map[tname].add(str(p))
                              ddl_map[tname].add(
                                  re.sub(r"\s+", " ",
                                         v.strip()).lower())
              out("## 2) TABLAS DEFINIDAS: "
                  + str(len(create_map)) + " tablas")
              dup_tables = {t: fs for t, fs
                            in create_map.items() if len(fs) > 1}
              if dup_tables:
                  out("### Tablas creadas en MAS de un archivo"
                      " (verificar mismo esquema):")
                  for t in sorted(dup_tables):
                      mine_flag = any(es_mio(pathlib.Path(f))
                                      for f in dup_tables[t])
                      tag = ("MIO+OTRO" if mine_flag
                             else "pre-existente")
                      files = sorted(dup_tables[t])
                      short = " ; ".join(f[:70] for f
                                         in files[:4])
                      extra = (" (+" + str(len(files) - 4)
                               + ")" if len(files) > 4 else "")
                      out(f"- {t} [{tag}]: {short}{extra}")
              else:
                  out("- LIMPIO: ninguna tabla definida en dos"
                      " archivos")
              schema_conflicts = []
              for t, stmts in ddl_map.items():
                  if len(stmts) > 1:
                      schema_conflicts.append(t)
              if schema_conflicts:
                  out("**CONFLICTO DE ESQUEMA (misma tabla, DDL"
                      " DISTINTO) — ERROR:**")
                  for t in sorted(schema_conflicts):
                      out("- ERROR CONFLICTO: " + t
                          + " -> archivos: "
                          + ", ".join(sorted(
                              create_map[t])[:4]))
              else:
                  out("- LIMPIO: 0 conflictos de esquema (las"
                      " tablas re-creadas usan DDL identico"
                      " IF NOT EXISTS)")

              # ---------- 3) TABLAS USADAS NO CREADAS ----------
              used = defaultdict(set)
              rx_use = re.compile(
                  r"\b(?:FROM|INTO|UPDATE)\s+([a-z][a-z0-9_]*)",
                  re.I)
              for p, tree in trees.items():
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Constant) \
                              and isinstance(node.value, str):
                          v = node.value
                          if "SELECT" in v.upper() or \
                                  "INSERT" in v.upper() or \
                                  "UPDATE" in v.upper() or \
                                  "DELETE" in v.upper():
                              for m in rx_use.finditer(v):
                                  used[m.group(1).lower()].add(
                                      str(p))
              internals = {"sqlite_master", "sqlite_sequence",
                           "schema_migrations"}
              ghost = []
              for t, fs in used.items():
                  if t in create_map or t in internals:
                      continue
                  if t.startswith(("temp_", "new_")):
                      continue
                  ghost.append((t, fs))
              out("## 3) TABLAS USADAS SIN CREATE DETECTADO"
                  " (heuristica: puede ser tabla de OTRO"
                  " engine en la misma db)")
              if ghost:
                  mine_ghost = [(t, fs) for t, fs in ghost
                                if any(es_mio(pathlib.Path(f))
                                       for f in fs)]
                  if mine_ghost:
                      out("**ERROR: tablas que MI codigo usa y"
                          " nadie crea:**")
                      for t, fs in sorted(mine_ghost)[:20]:
                          out("- ERROR: " + t + " -> "
                              + sorted(fs)[0][:70])
                  otros = [(t, fs) for t, fs in ghost
                           if (t, fs) not in mine_ghost]
                  if otros:
                      out("Aviso (pre-existentes, "
                          + str(len(otros)) + "):")
                      for t, fs in sorted(otros)[:15]:
                          out(f"- AVISO: {t} -> "
                              + sorted(fs)[0][:60])
              else:
                  out("- LIMPIO: toda tabla usada tiene CREATE")

              # ---------- 4) CLASES DUPLICADAS (sin tests) ----------
              class_defs = defaultdict(set)
              for p, tree in trees.items():
                  if "tests" in p.parts:
                      continue
                  for node in tree.body:
                      if isinstance(node, ast.ClassDef):
                          class_defs[node.name].add(str(p))
              dup_classes = {k: sorted(v) for k, v
                             in class_defs.items()
                             if len(v) > 1}
              out("## 4) CLASES DUPLICADAS (fuera de tests)")
              if dup_classes:
                  mias = []
                  previas = []
                  for k, fs in sorted(dup_classes.items()):
                      if any(es_mio(pathlib.Path(f)) for f in fs):
                          mias.append((k, fs))
                      else:
                          previas.append((k, fs))
                  if mias:
                      out("**ERROR: duplicados que involucran"
                          " archivos de zyra-bot:**")
                      for k, fs in mias[:20]:
                          out("- ERROR DUP: " + k + " -> "
                              + " ; ".join(f[:60]
                                           for f in fs[:3]))
                  if previas:
                      out("Aviso (arquitectura pre-existente, "
                          + str(len(previas))
                          + " clases — decision del dueno):")
                      for k, fs in previas[:20]:
                          out(f"- AVISO: {k} ({len(fs)}"
                              + " archivos)")
              else:
                  out("- LIMPIO: 0 clases duplicadas")

              # ---------- 5) DEF duplicadas en mismo archivo o clase ----------
              dup_same = []
              for p, tree in trees.items():
                  names = [n.name for n in tree.body
                           if isinstance(n, (ast.FunctionDef,
                                             ast.AsyncFunctionDef))]
                  cnt = {}
                  for n in names:
                      cnt[n] = cnt.get(n, 0) + 1
                  for n, c in cnt.items():
                      if c > 1:
                          dup_same.append(f"{p}: def {n} x{c}"
                                          " (sobrescribe en"
                                          " silencio)")
              for p, tree in trees.items():
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ClassDef):
                          meths = [n.name for n in node.body
                                   if isinstance(n,
                                                 (ast.FunctionDef,
                                                  ast.AsyncFunctionDef))]
                          cnt = {}
                          for m in meths:
                              cnt[m] = cnt.get(m, 0) + 1
                          for m, c in cnt.items():
                              if c > 1:
                                  tag = "MIO" if es_mio(p) \
                                      else "PRE"
                                  dup_same.append(
                                      f"{p}::{node.name}.{m}"
                                      f" x{c} [{tag}]")
              out("## 5) FUNCIONES/METODOS DUPLICADOS (misma clase o"
                  " archivo = sobrescritura silenciosa)")
              if dup_same:
                  errs = [d for d in dup_same if "MIO" in d
                          or "sobrescribe" in d]
                  avs = [d for d in dup_same if d not in errs]
                  if errs:
                      out("**ERRORES:**")
                      for d in errs[:20]:
                          out("- ERROR: " + d)
                  if avs:
                      out("Avisos: " + str(len(avs)))
                      for d in avs[:15]:
                          out("- AVISO: " + d)
              else:
                  out("- LIMPIO: 0 duplicados de def/metodo")

              # ---------- 6) utcnow ----------
              out("## 6) UTCNOW por app (debe ser 0)")
              for app in ("nexo", "semilla", "agro", "axis",
                          "subastas", "ciclo_digital",
                          "mi_primer_empleo"):
                  n = 0
                  for p in pathlib.Path("apps", app).rglob("*.py"):
                      if "__pycache__" in p.parts or \
                              "tests" in p.parts:
                          continue
                      try:
                          n += p.read_text(
                              encoding="utf-8").count(
                              "datetime.utcnow")
                      except Exception:
                          pass
                  flag = "OK" if n == 0 else "**ERROR**"
                  out(f"- {app}: {n} {flag}")

              # ---------- 7) carpetas duplicadas conocidas ----------
              out("## 7) CARPETAS DUPLICADAS conocidas (decision del"
                  " dueno: N-10/A-17)")
              out("- N-10: apps/nexo/module/operaciones vs"
                  " apps/nexo/domain/operations")
              out("- A-17: apps/agro/modules/executive vs"
                  " apps/agro/modules/ejecutivo")

              # ---------- 8) basenames duplicados por app ----------
              by_base = defaultdict(set)
              for p in py_files:
                  parts = p.parts
                  if parts[0] == "apps" and len(parts) > 2:
                      app = parts[1]
                  else:
                      app = "shared_engines"
                  if p.name == "__init__.py":
                      continue
                  by_base[(app, p.name)].add(str(p))
              dups_b = {k: v for k, v in by_base.items()
                        if len(v) > 1}
              estructurales = {"menu.py", "module.py",
                               "navigation.py", "permissions.py"}
              real_dups = {k: v for k, v in dups_b.items()
                           if k[1] not in estructurales}
              out("## 8) ARCHIVOS con mismo nombre en la misma app"
                  " (excluye __init__ y menu/module/navigation"
                  " estructurales)")
              if real_dups:
                  out("Avisos: " + str(len(real_dups)))
                  for (app, name), fs in sorted(
                          real_dups.items())[:25]:
                      out(f"- AVISO: {app}/{name} x{len(fs)}: "
                          + " ; ".join(f[:60]
                                       for f in sorted(fs)[:3]))
              else:
                  out("- LIMPIO")

              # ---------- 9) dirs vacios ----------
              empty_dirs = []
              for root in ("apps", "shared_engines"):
                  for p in pathlib.Path(root).rglob("*"):
                      if p.is_dir() and "__pycache__" \
                              not in p.parts:
                          kids = list(p.iterdir())
                          if not kids:
                              empty_dirs.append(str(p))
              out("## 9) CARPETAS VACIAS: " + str(len(empty_dirs))
                  + " (llenado FASE 5 / decision dueno)")
              for d in empty_dirs[:25]:
                  out("- AVISO: " + d)

              # ---------- 10) bare except ----------
              bare = []
              for p, tree in trees.items():
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ExceptHandler) \
                              and node.type is None:
                          bare.append(str(p))
              out("## 10) EXCEPT desnudo (bare except): "
                  + str(len(bare)) + " archivos")
              for b in bare[:15]:
                  out("- AVISO: " + b)

              # ---------- 11) archivos largos regla 77 ----------
              longs = []
              for p in py_files:
                  try:
                      n = sum(1 for _ in open(
                          p, encoding="utf-8",
                          errors="ignore"))
                      if n > 800:
                          longs.append(f"{n} {p}")
                  except Exception:
                      pass
              out("## 11) ARCHIVOS >800 lineas (regla 77):")
              for l in sorted(longs, reverse=True)[:15]:
                  out("- AVISO: " + l)

              # ---------- 12) apps y tests ----------
              out("## 12) APPS y TESTS")
              apps_list = sorted(d.name for d in
                                 pathlib.Path("apps").iterdir()
                                 if d.is_dir() and
                                 d.name != "__pycache__")
              out("- apps: " + ", ".join(apps_list))
              for app in ("nexo", "semilla", "agro", "axis",
                          "subastas"):
                  n = len(list(pathlib.Path(
                      "apps", app, "tests").rglob(
                      "test_*.py")))
                  out(f"- tests {app}: {n} archivos de test")

              # ---------- VEREDICTO ----------
              errs_total = (len(syntax_errors)
                            + len(schema_conflicts)
                            + len([g for g in ghost
                                   if any(es_mio(
                                       pathlib.Path(f))
                                       for f in g[1])])
                            + len([1 for k, fs
                                   in dup_classes.items()
                                   if any(es_mio(
                                       pathlib.Path(f))
                                       for f in fs)])
                            + len([d for d in dup_same
                                   if "MIO" in d]))
              out("# VEREDICTO FINAL")
              out(f"- ERRORES (rompen, requieren fix): "
                  f"**{errs_total}**")
              out("- AVISOS (pre-existentes, decision del"
                  " dueno): listados arriba")
              if errs_total == 0 and not syntax_errors:
                  out("# SISTEMA LIMPIO — listo para su"
                      " auditoria final")
              else:
                  out("# SISTEMA CON ERRORES — ver seccion"
                      " ERRORES arriba")
              if errs_total > 0 or syntax_errors:
                  raise SystemExit(1)
          except SystemExit:
              raise
          except Exception:
              out("## AUDITORIA CRASHEO")
              import traceback as tb
              out("```\n" + tb.format_exc().strip() + "\n```")
              raise SystemExit(1)
          PYEOF

      - name: "[LECTURA] regresion 4 apps (evidencia final)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[VEREDICTO] Estado final (sin cambios de codigo — auditoria pura)"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          audit_ok=1
          grep -q "SISTEMA LIMPIO" "$SUM" 2>/dev/null || audit_ok=0
          if [ "$audit_ok" = "1" ] && [ "$(cat /tmp/x1 2>/dev/null || echo 1)" = "0" ] && [ "$(cat /tmp/x2 2>/dev/null || echo 1)" = "0" ] && [ "$(cat /tmp/x3 2>/dev/null || echo 1)" = "0" ] && [ "$(cat /tmp/x4 2>/dev/null || echo 1)" = "0" ]; then
            log "**VEREDICTO: SISTEMA LIMPIO Y VERDE — auditoria total pasada, 4 nucleos en verde, sin escrituras. Entregado para su auditoria final (duplicados pre-existentes y pendientes N-10/A-17/A-18/A-19 marcados como AVISO/decision del dueno).**"
            exit 0
          fi
          log "**VEREDICTO: HALLAZGOS — ver seccion ERRORES/REG de la auditoria arriba. Sin commit (solo lectura). Corregimos lo que marque.**"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps shared_engines
          set +e
          if git diff --cached --quiet; then
            exit 1
          fi
          git commit -m "chore(auditoria): limpieza de caches"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || true
          exit 1
