name: ZYRA AXIS Block 4 - Life History Complete + Civil Registry Screen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Ensure package markers
        run: |
          for f in apps/axis/life_history/__init__.py apps/axis/life_history/tests/__init__.py; do
            if [ ! -f "$f" ]; then
              printf '"""AXIS Life History."""\n' > "$f"
            fi
          done

      - name: Write permissions.py
        run: |
          cat > apps/axis/life_history/permissions.py <<'ZP1'
          """Life History permissions - additive module."""
          from __future__ import annotations

          REGISTRY_OPERATORS = (
              "registrador_civil",
              "gobierno",
          )
          HISTORY_READERS = REGISTRY_OPERATORS + (
              "madre",
              "padre",
              "tutor",
              "medico",
              "policia",
              "abogado",
          )
          ZID_UPGRADERS = REGISTRY_OPERATORS + (
              "biometric-enroll",
          )

          __all__ = [
              "REGISTRY_OPERATORS",
              "HISTORY_READERS",
              "ZID_UPGRADERS",
          ]
          ZP1
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/permissions.py').read()); print('permissions OK')"

      - name: Write verification.py
        run: |
          cat > apps/axis/life_history/verification.py <<'ZP2'
          """Life History verification - third-party surface."""
          from __future__ import annotations

          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )


          def verify_birth(
              store: LifeHistoryStore,
              birth_id: str,
              *,
              claimed_cert_hash: str,
          ) -> dict[str, object]:
              birth = store.get_birth(birth_id)
              chain_ok, count = (
                  store.births_chain_verify()
              )
              matches = (
                  str(birth["cert_hash"])
                  == claimed_cert_hash.strip().lower()
              )
              return {
                  "birth_id": birth_id,
                  "exists": True,
                  "active": (
                      birth["status"] == "active"
                  ),
                  "hash_matches": matches,
                  "chain_verified": chain_ok,
                  "chain_size": count,
                  "valid": bool(
                      matches
                      and chain_ok
                      and birth["status"]
                      == "active"
                  ),
              }


          def person_history_summary(
              store: LifeHistoryStore,
              person_id: str,
          ) -> dict[str, object]:
              person = store.get_person(person_id)
              events = store.events_of(person_id)
              return {
                  "person_id": person_id,
                  "status": person["status"],
                  "zid_bound": (
                      person["zid"] is not None
                  ),
                  "events": len(events),
                  "events_verified": (
                      store.events_verify(person_id)
                  ),
              }
          ZP2
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/verification.py').read()); print('verification OK')"

      - name: Write repository.py
        run: |
          cat > apps/axis/life_history/repository.py <<'ZP3'
          """Life History repository - read-side queries."""
          from __future__ import annotations

          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )


          class LifeHistoryRepository:
              def __init__(
                  self, store: LifeHistoryStore,
              ) -> None:
                  self._store = store

              def births_between(
                  self,
                  *,
                  date_from: str,
                  date_to: str,
              ) -> list[dict[str, object]]:
                  rows = self._store._db.query_all(
                      "SELECT birth_id, person_id,"
                      " birth_date, birth_place,"
                      " status FROM life_births"
                      " WHERE birth_date >= ?"
                      " AND birth_date <= ?"
                      " ORDER BY rowid",
                      (date_from, date_to),
                  )
                  return [
                      {
                          "birth_id": str(
                              r["birth_id"]
                          ),
                          "person_id": str(
                              r["person_id"]
                          ),
                          "birth_date": str(
                              r["birth_date"]
                          ),
                          "birth_place": str(
                              r["birth_place"]
                          ),
                          "status": str(
                              r["status"]
                          ),
                      }
                      for r in rows
                  ]

              def registry_size(self) -> int:
                  row = self._store._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " life_births"
                  )
                  return (
                      int(row["n"])
                      if row is not None
                      else 0
                  )

              def unbound_persons(self) -> list[str]:
                  rows = self._store._db.query_all(
                      "SELECT person_id FROM"
                      " life_persons WHERE zid"
                      " IS NULL ORDER BY rowid"
                  )
                  return [
                      str(r["person_id"])
                      for r in rows
                  ]
          ZP3
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/repository.py').read()); print('repository OK')"

      - name: Write integration.py
        run: |
          cat > apps/axis/life_history/integration.py <<'ZP4'
          """Life History integration - server factory."""
          from __future__ import annotations

          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )


          def build_life_history(
              *,
              db,
              clock,
              network_client,
              require_active_parents: bool = True,
          ) -> LifeHistoryService:
              store = LifeHistoryStore(db, clock)
              return LifeHistoryService(
                  store=store,
                  client=network_client,
                  require_active_parents=(
                      require_active_parents
                  ),
              )
          ZP4
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/integration.py').read()); print('integration OK')"

      - name: Write service tests
        run: |
          cat > apps/axis/life_history/tests/test_service.py <<'ZP5'
          """Life History service tests."""
          from __future__ import annotations

          import unittest

          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
              LifeHistoryError,
          )

          _MOTHER = "ZID-mother-0001"
          _FATHER = "ZID-father-0001"


          class _FakeNetwork:
              def __init__(self, reachable=True):
                  self.reachable = reachable
                  self.known = {
                      _MOTHER: {"status": "ACTIVE"},
                      _FATHER: {"status": "ACTIVE"},
                  }
                  self.sealed = []

              def get(self, path):
                  if not self.reachable:
                      return (False, None, "offline")
                  zid = path.rsplit("/", 1)[-1]
                  if zid in self.known:
                      return (
                          True,
                          dict(self.known[zid]),
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if not self.reachable:
                      return (False, None, "offline")
                  if path == "/documents/seal":
                      self.sealed.append(dict(payload))
                      return (
                          True,
                          {"document_id": "DOC-1"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return (False, None, "unknown")


          class ServiceTests(unittest.TestCase):
              def _svc(self, reachable=True):
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )
                  from shared_engines.storage.database import (
                      SQLiteAdapter,
                  )

                  db = SQLiteAdapter(":memory:")
                  store = LifeHistoryStore(
                      db, SystemClock()
                  )
                  net = _FakeNetwork(
                      reachable=reachable
                  )
                  svc = LifeHistoryService(
                      store=store,
                      client=net,
                  )
                  return svc, net, store

              def _birth(self, svc):
                  return (
                      svc.register_birth_with_network(
                          registrar_account="AX-reg-1",
                          child_name="Bebe",
                          birth_date="2025-01-15",
                          birth_place="San Salvador",
                          sex="F",
                          mother_name="Maria",
                          mother_zid=_MOTHER,
                          father_name="Jose",
                          father_zid=_FATHER,
                      )
                  )

              def test_full_birth_sealed(self):
                  svc, net, store = self._svc()
                  birth = self._birth(svc)
                  self.assertTrue(birth["network_ok"])
                  self.assertEqual(
                      "DOC-1",
                      birth["network_seal"],
                  )
                  self.assertEqual(1, len(net.sealed))
                  ok, _n = store.births_chain_verify()
                  self.assertTrue(ok)

              def test_offline_birth_survives(self):
                  svc, _net, store = self._svc(
                      reachable=False
                  )
                  birth = self._birth(svc)
                  self.assertFalse(birth["network_ok"])
                  ok, _n = store.births_chain_verify()
                  self.assertTrue(ok)
                  pending = (
                      svc.pending_network_seals()
                  )
                  self.assertEqual(1, len(pending))

              def test_ghost_parent_rejected(self):
                  svc, _net, _store = self._svc()
                  try:
                      svc.register_birth_with_network(
                          registrar_account="AX-reg-1",
                          child_name="Fraude",
                          birth_date="2025-01-15",
                          birth_place="X",
                          sex="M",
                          mother_name="Impostora",
                          mother_zid="ZID-fantasma",
                      )
                  except LifeHistoryError:
                      pass
                  else:
                      self.fail("ghost parent accepted")

              def test_inactive_parent_rejected(self):
                  svc, _net, _store = self._svc()
                  svc._client.known[_MOTHER] = {
                      "status": "REGISTERED"
                  }
                  try:
                      self._birth(svc)
                  except LifeHistoryError:
                      pass
                  else:
                      self.fail("inactive parent accepted")

              def test_attach_notifies_network(self):
                  svc, _net, store = self._svc()
                  birth = self._birth(svc)
                  person_id = str(birth["person_id"])
                  person = svc.attach_zid_with_audit(
                      person_id,
                      zid="ZID-newborn-1",
                      actor="biometric-enroll",
                  )
                  self.assertEqual(
                      "biometric_verified",
                      person["status"],
                  )
                  events = store.events_of(person_id)
                  self.assertEqual(
                      "zid_biometric_upgrade",
                      events[-1]["event_type"],
                  )


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          ZP5
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_service.py').read()); print('test_service OK')"

      - name: Write life_history verification tests
        run: |
          cat > apps/axis/life_history/tests/test_verification.py <<'ZP6'
          """Third-party verification tests."""
          from __future__ import annotations

          import unittest

          from apps.axis.life_history.repository import (
              LifeHistoryRepository,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )
          from apps.axis.life_history.verification import (
              person_history_summary,
              verify_birth,
          )


          class VerificationTests(unittest.TestCase):
              def _store(self):
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )
                  from shared_engines.storage.database import (
                      SQLiteAdapter,
                  )

                  db = SQLiteAdapter(":memory:")
                  return LifeHistoryStore(
                      db, SystemClock()
                  )

              def test_verify_birth_valid(self) -> None:
                  store = self._store()
                  birth = store.register_birth(
                      registrar_account="AX-reg-1",
                      child_name="Bebe",
                      birth_date="2025-01-15",
                      birth_place="San Salvador",
                      sex="F",
                      mother_name="Maria",
                      mother_zid="ZID-mother-1",
                  )
                  report = verify_birth(
                      store,
                      str(birth["birth_id"]),
                      claimed_cert_hash=str(
                          birth["cert_hash"]
                      ),
                  )
                  self.assertTrue(report["valid"])
                  self.assertTrue(
                      report["chain_verified"]
                  )

              def test_verify_birth_wrong_hash(self) -> None:
                  store = self._store()
                  birth = store.register_birth(
                      registrar_account="AX-reg-1",
                      child_name="Bebe",
                      birth_date="2025-01-15",
                      birth_place="San Salvador",
                      sex="F",
                      mother_name="Maria",
                      mother_zid="ZID-mother-1",
                  )
                  report = verify_birth(
                      store,
                      str(birth["birth_id"]),
                      claimed_cert_hash=(
                          "0" * 64
                      ),
                  )
                  self.assertFalse(
                      report["valid"]
                  )

              def test_repository_queries(self) -> None:
                  store = self._store()
                  store.register_birth(
                      registrar_account="AX-reg-1",
                      child_name="Uno",
                      birth_date="2025-01-01",
                      birth_place="A",
                      sex="M",
                      mother_name="M1",
                      mother_zid="ZID-m1",
                  )
                  store.register_birth(
                      registrar_account="AX-reg-1",
                      child_name="Dos",
                      birth_date="2025-02-01",
                      birth_place="B",
                      sex="F",
                      mother_name="M2",
                      mother_zid="ZID-m2",
                  )
                  repo = LifeHistoryRepository(store)
                  self.assertEqual(2, repo.registry_size())
                  found = repo.births_between(
                      date_from="2025-01-01",
                      date_to="2025-01-31",
                  )
                  self.assertEqual(1, len(found))
                  unbound = repo.unbound_persons()
                  self.assertEqual(2, len(unbound))


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          ZP6
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_verification.py').read()); print('test_verification OK')"

      - name: Wire civil registry screens into AXIS server (additive)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path("apps/axis/server.py")
          src = path.read_text(encoding="utf-8")

          MARKER = "life_history_service"
          if MARKER in src:
              print("SERVER: already wired")
          else:
              anchor = "class AxisApiHandler(\n    BaseHTTPRequestHandler\n):\n    store: ClassVar[AxisStore]\n    link: ClassVar[AxisLink]\n"
              addition = (
                  "class AxisApiHandler(\n"
                  "    BaseHTTPRequestHandler\n"
                  "):\n"
                  "    store: ClassVar[AxisStore]\n"
                  "    link: ClassVar[AxisLink]\n"
                  "    life_history_service: ClassVar[object] = None\n"
              )
              assert anchor in src, "class anchor not found"
              src = src.replace(anchor, addition, 1)

              route_anchor = (
                  "        if s == [\"exam\"]:\n"
                  "            self._exam_form(doc)\n"
                  "            return\n"
              )
              assert route_anchor in src, "route anchor not found"
              routes = (
                  "        if s == [\"exam\"]:\n"
                  "            self._exam_form(doc)\n"
                  "            return\n"
                  "        if s == [\"birth-register\"]:\n"
                  "            self._birth_register(doc)\n"
                  "            return\n"
              )
              src = src.replace(
                  route_anchor, routes, 1
              )

              get_anchor = (
                  "        if s[0] == \"emergencias\":\n"
                  "            self._screen_emergencias()\n"
                  "            return\n"
              )
              assert get_anchor in src, "get anchor not found"
              get_routes = (
                  "        if s[0] == \"emergencias\":\n"
                  "            self._screen_emergencias()\n"
                  "            return\n"
                  "        if s[0] == \"registro-civil\":\n"
                  "            self._screen_registro_civil()\n"
                  "            return\n"
                  "        if s[0] == \"life\":\n"
                  "            self._screen_life_person(s)\n"
                  "            return\n"
              )
              src = src.replace(
                  get_anchor, get_routes, 1
              )

              home_anchor = (
                  "            \"<h2>Paneles</h2>\"\n"
              )
              assert home_anchor in src, "home anchor not found"
              home_add = (
                  "            \"<h2>Registro Civil (Life History)</h2>\"\n"
                  "            \"<div class='card'>\"\n"
                  "            \"<a href='/axis/registro-civil'>\"\n"
                  "            \"<button>Abrir Registro Civil\"\n"
                  "            \"</button></a>\"\n"
                  "            \"</div>\"\n"
                  "            \"<h2>Paneles</h2>\"\n"
              )
              src = src.replace(home_anchor, home_add, 1)

              methods = '''

              def _lh(self):
                  svc = type(self).life_history_service
                  if svc is None:
                      raise LookupError(
                          "life_history not wired"
                      )
                  return svc

              def _screen_registro_civil(self) -> None:
                  store = type(self).store
                  patients = store.list_by_role(
                      role="paciente"
                  )
                  options = ""
                  for p in patients:
                      options = (
                          options
                          + "<option value='"
                          + p["account_id"]
                          + "'>"
                          + p["name"]
                          + "</option>"
                      )
                  body = (
                      "<h1>📜 Registro Civil</h1>"
                      "<p>Nueva partida de nacimiento"
                      " (se sella en la cadena nacional"
                      " inalterable).</p>"
                      "<div class='card'>"
                      "<form method='POST'"
                      " action='/axis/birth-register'>"
                      "<input name='registrar_account'"
                      " placeholder='Mi ID (AX-...)'>"
                      "<input name='child_name'"
                      " placeholder='Nombre del recien nacido'>"
                      "<input name='birth_date'"
                      " placeholder='Fecha (AAAA-MM-DD)'>"
                      "<input name='birth_place'"
                      " placeholder='Lugar de nacimiento'>"
                      "<select name='sex'>"
                      "<option value='F'>F</option>"
                      "<option value='M'>M</option>"
                      "<option value='I'>I</option>"
                      "</select>"
                      "<input name='mother_name'"
                      " placeholder='Nombre de la madre'>"
                      "<input name='mother_zid'"
                      " placeholder='ZID de la madre (ZID-...)'>"
                      "<input name='father_name'"
                      " placeholder='Nombre del padre (opcional)'>"
                      "<input name='father_zid'"
                      " placeholder='ZID del padre (ZID-...)'>"
                      "<input name='source_hospital'"
                      " placeholder='Hospital (opcional)'>"
                      "<button>Registrar partida</button>"
                      "</form></div>"
                      "<a href='/axis'><button"
                      " class='gray'>Inicio</button></a>"
                  )
                  self._html(
                      200,
                      _page(
                          "AXIS - Registro Civil",
                          body,
                      ),
                  )

              def _birth_register(self, doc) -> None:
                  svc = self._lh()
                  father_name = doc.get("father_name")
                  father_name = (
                      str(father_name).strip()
                      if father_name
                      and str(father_name).strip()
                      else None
                  )
                  father_zid = doc.get("father_zid")
                  father_zid = (
                      str(father_zid).strip()
                      if father_zid
                      and str(father_zid).strip()
                      else None
                  )
                  hospital = doc.get("source_hospital")
                  hospital = (
                      str(hospital).strip()
                      if hospital
                      and str(hospital).strip()
                      else None
                  )
                  birth = (
                      svc.register_birth_with_network(
                          registrar_account=self._req(
                              doc, "registrar_account"
                          ),
                          child_name=self._req(
                              doc, "child_name"
                          ),
                          birth_date=self._req(
                              doc, "birth_date"
                          ),
                          birth_place=self._req(
                              doc, "birth_place"
                          ),
                          sex=self._req(doc, "sex"),
                          mother_name=self._req(
                              doc, "mother_name"
                          ),
                          mother_zid=self._req(
                              doc, "mother_zid"
                          ),
                          father_name=father_name,
                          father_zid=father_zid,
                          source_hospital=hospital,
                      )
                  )
                  seal = (
                      birth.get("network_seal")
                      or "-"
                  )
                  body = (
                      "<h1>📜 Partida registrada"
                      "</h1>"
                      "<p>ID partida: <b>"
                      + str(birth["birth_id"])
                      + "</b></p>"
                      "<p>ID persona: <b>"
                      + str(birth["person_id"])
                      + "</b></p>"
                      "<p>Sello de certificado:"
                      " <b>"
                      + str(birth["cert_hash"])[:24]
                      + "...</b></p>"
                      "<p>Sello en la Red: <b>"
                      + seal
                      + "</b></p>"
                      "<p>La partida esta encadenada"
                      " al registro nacional"
                      " inalterable.</p>"
                      "<a href='/axis/registro-civil'>"
                      "<button>Registrar otra"
                      "</button></a>"
                      "<a href='/axis'><button"
                      " class='gray'>Inicio"
                      "</button></a>"
                  )
                  self._html(
                      200,
                      _page(
                          "AXIS - Partida emitida",
                          body,
                      ),
                  )

              def _screen_life_person(
                  self, s: list[str],
              ) -> None:
                  svc = self._lh()
                  if len(s) < 2:
                      raise LookupError(
                          "person id required"
                      )
                  person_id = s[1]
                  person = svc._store.get_person(
                      person_id
                  )
                  events = svc._store.events_of(
                      person_id
                  )
                  items = ""
                  for e in events:
                      items = (
                          items
                          + "<li>• "
                          + e["event_type"]
                          + " — "
                          + str(e["detail"] or "")
                          + "</li>"
                      )
                  if not items:
                      items = "<li>Sin eventos</li>"
                  chain = (
                      "VERIFICADA"
                      if svc._store.events_verify(
                          person_id
                      )
                      else "COMPROMETIDA"
                  )
                  body = (
                      "<h1>🧬 Historial de Vida</h1>"
                      "<p>"
                      + str(person["full_name"])
                      + " | estado: "
                      + person["status"]
                      + " | ZID: "
                      + str(person["zid"] or "pendiente")
                      + "</p>"
                      "<p>Cadena: " + chain + "</p>"
                      "<h2>Eventos</h2><ul>"
                      + items
                      + "</ul>"
                      "<a href='/axis'><button"
                      " class='gray'>Inicio"
                      "</button></a>"
                  )
                  self._html(
                      200,
                      _page(
                          "AXIS - Historial de Vida",
                          body,
                      ),
                  )
          '''
              src = src.replace(
                  "class AxisServer(ThreadingHTTPServer):",
                  methods
                  + "\n\nclass AxisServer(ThreadingHTTPServer):",
                  1,
              )

              serve_anchor = (
                  "def serve_axis(\n"
                  "    store: AxisStore,\n"
                  "    client: NetworkClient,\n"
                  "    *,\n"
                  "    host: str = \"127.0.0.1\",\n"
                  "    port: int = 0,\n"
                  ") -> AxisServer:\n"
                  "    AxisApiHandler.store = store\n"
                  "    AxisApiHandler.link = AxisLink(client)\n"
                  "    return AxisServer((host, port))\n"
              )
              assert serve_anchor in src, "serve anchor not found"
              serve_new = (
                  "def serve_axis(\n"
                  "    store: AxisStore,\n"
                  "    client: NetworkClient,\n"
                  "    *,\n"
                  "    host: str = \"127.0.0.1\",\n"
                  "    port: int = 0,\n"
                  "    life_history_service=None,\n"
                  ") -> AxisServer:\n"
                  "    AxisApiHandler.store = store\n"
                  "    AxisApiHandler.link = AxisLink(client)\n"
                  "    AxisApiHandler.life_history_service = life_history_service\n"
                  "    return AxisServer((host, port))\n"
              )
              src = src.replace(
                  serve_anchor, serve_new, 1
              )
              path.write_text(
                  src, encoding="utf-8"
              )
              print("SERVER: WIRED OK")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
