          """Rutas API de red: contratos, indicadores y solicitudes."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo

          RUTA_INDICADORES = "/laboratorio/api/v1/network/indicators"
          RUTA_SOLICITUDES = "/laboratorio/api/v1/network/requests"
          RUTA_CONTRATOS = "/laboratorio/api/v1/network/contracts"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_red")

              def _publicar(ctx):
                  return manejador.publicar(ctx.identidad, ctx.json())

              def _solicitar(ctx):
                  return manejador.solicitar(ctx.identidad, ctx.json())

              def _listar(ctx):
                  return manejador.listar(ctx.identidad)

              app.registrar("POST", RUTA_INDICADORES, _publicar, PermisoCodigo.RED_CONTRATOS, "Publicar indicador a GOV-DATA")
              app.registrar("POST", RUTA_SOLICITUDES, _solicitar, PermisoCodigo.RED_CONTRATOS, "Solicitar datos a una app ZYRA")
              app.registrar("GET", RUTA_CONTRATOS, _listar, PermisoCodigo.VER, "Catalogo de contratos y estado")
