name: ZYRA LABORATORIO - Lote 1A-4b (corregido)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar, escribir y verificar (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_1a4.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          mkdir -p apps/laboratorio/infrastructure/security apps/laboratorio/infrastructure/network apps/laboratorio/infrastructure/messaging apps/laboratorio/infrastructure/providers apps/laboratorio/infrastructure/api apps/laboratorio/registry/modules apps/laboratorio/registry/menus apps/laboratorio/registry/routes apps/laboratorio/registry/engines apps/laboratorio/registry/permissions apps/laboratorio/registry/roles apps/laboratorio/registry/services apps/laboratorio/registry/templates apps/laboratorio/registry/events apps/laboratorio/permissions/policies apps/laboratorio/permissions/roles apps/laboratorio/permissions/rules apps/laboratorio/permissions/scopes apps/laboratorio/application/commands apps/laboratorio/application/queries apps/laboratorio/application/handlers apps/laboratorio/application/use_cases apps/laboratorio/application/dto apps/laboratorio/schemas/requests apps/laboratorio/schemas/responses apps/laboratorio/schemas/shared apps/laboratorio/validators/business apps/laboratorio/validators/security apps/laboratorio/validators/shared apps/laboratorio/events/domain apps/laboratorio/services/export apps/laboratorio/routers/public apps/laboratorio/routers/api
          echo "=== SEGURIDAD (5) ==="
          escribir apps/laboratorio/validators/security/zid_validator.py << 'ZYRA_EOF'
          """Validacion del ZID y roles recibidos desde ZYRA SuperApp."""
          import re
          from apps.laboratorio.constants.roles.role_codes import RolCodigo

          PATRON_ZID = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$")


          def validar_zid(valor) -> str:
              """Valida formato de ZID y lo devuelve limpio."""
              if not isinstance(valor, str):
                  raise ValueError("El ZID debe ser texto.")
              limpio = valor.strip()
              if not PATRON_ZID.match(limpio):
                  raise ValueError("Formato de ZID invalido: " + repr(valor))
              return limpio


          def limpiar_roles(texto) -> tuple:
              """Separa roles por coma; ignora los no reconocidos."""
              if texto is None or (isinstance(texto, str) and not texto.strip()):
                  return ()
              if not isinstance(texto, str):
                  raise ValueError("Los roles deben venir como texto separado por comas.")
              roles = []
              for parte in texto.split(","):
                  rol = parte.strip()
                  if rol and rol in RolCodigo.TODOS and rol not in roles:
                      roles.append(rol)
              return tuple(roles)
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/security/zid_auth.py << 'ZYRA_EOF'
          """Identidad del usuario dentro de LABORATORIO (via ZYRA SuperApp)."""
          from dataclasses import dataclass

          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.constants.roles.role_codes import RolCodigo
          from apps.laboratorio.shared.exceptions.domain_errors import PermisoDenegadoError
          from apps.laboratorio.shared.policies.access_policy import PoliticaAcceso
          from apps.laboratorio.validators.security.zid_validator import (
              limpiar_roles,
              validar_zid,
          )

          HEADER_ZID = "x-zyra-zid"
          HEADER_ROLES = "x-zyra-roles"


          @dataclass(frozen=True)
          class Identidad:
              """Quien hace la peticion: ZID + roles + permisos derivados."""

              zid: str
              roles: tuple = ()

              @property
              def permisos(self) -> set:
                  total = set()
                  for rol in self.roles:
                      total |= PoliticaAcceso.permisos_de(rol)
                  if not total:
                      total = {PermisoCodigo.VER}
                  return total

              @property
              def es_gobernador(self) -> bool:
                  return RolCodigo.GOBERNADOR in self.roles

              def tiene_permiso(self, codigo: str) -> bool:
                  return codigo in self.permisos

              def exigir_permiso(self, codigo: str) -> None:
                  if not self.tiene_permiso(codigo):
                      raise PermisoDenegadoError("Permiso requerido: " + codigo)

              def tiene_rol(self, rol: str) -> bool:
                  return rol in self.roles


          def anonimo() -> Identidad:
              """Identidad para rutas publicas (solo lectura de estado)."""
              return Identidad(zid="anonimo", roles=())


          def _buscar_header(headers: dict, nombre: str):
              if nombre in headers:
                  return headers[nombre]
              for clave, valor in headers.items():
                  if str(clave).lower() == nombre:
                      return valor
              return None


          def extraer_identidad(headers: dict, rol_defecto: str = RolCodigo.ESPECTADOR) -> Identidad:
              """Extrae y valida la identidad desde los headers del SuperApp."""
              if not isinstance(headers, dict):
                  raise ValueError("Headers invalidos.")
              crudo = _buscar_header(headers, HEADER_ZID)
              if crudo is None or not str(crudo).strip():
                  raise ValueError("ZID ausente en la peticion.")
              zid = validar_zid(str(crudo))
              roles = list(limpiar_roles(_buscar_header(headers, HEADER_ROLES)))
              if not roles:
                  roles = [PoliticaAcceso.validar_rol(rol_defecto)]
              return Identidad(zid=zid, roles=tuple(roles))
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/security/html_sanitizer.py << 'ZYRA_EOF'
          """Escapado HTML obligatorio para todo dato mostrado o incrustado."""

          import html


          def escapar(texto) -> str:
              """Escapa un valor individual para HTML seguro."""
              return html.escape(str(texto), quote=True)


          def escapar_estructura(datos):
              """Escapa recursivamente dict/list conservando tipos numericos."""
              if isinstance(datos, dict):
                  return {str(escapar(k)): escapar_estructura(v) for k, v in datos.items()}
              if isinstance(datos, (list, tuple)):
                  return [escapar_estructura(v) for v in datos]
              if isinstance(datos, str):
                  return escapar(datos)
              return datos
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/security/signing.py << 'ZYRA_EOF'
          """Firmas HMAC-SHA256 para documentos y enlaces (integridad)."""
          import hashlib
          import hmac
          from datetime import datetime, timezone

          ALGORITMO = "hmac-sha256"


          class Firmador:
              """Firma y verifica contenido con clave de la aplicacion."""

              def __init__(self, clave: str):
                  if not isinstance(clave, str) or len(clave.strip()) < 16:
                      raise ValueError("La clave de firma requiere al menos 16 caracteres.")
                  self._clave = clave.strip().encode("utf-8")

              def firmar_texto(self, contenido: str) -> str:
                  if not isinstance(contenido, str):
                      raise ValueError("Contenido a firmar debe ser texto.")
                  return hmac.new(
                      self._clave, contenido.encode("utf-8"), hashlib.sha256
                  ).hexdigest()

              def verificar(self, contenido: str, firma: str) -> bool:
                  if not isinstance(firma, str) or not firma:
                      return False
                  return hmac.compare_digest(self.firmar_texto(contenido), firma.lower())

              def firmar_documento(self, id_documento: str, contenido: str) -> dict:
                  """Produce el bloque de firma para un documento."""
                  if not id_documento or not isinstance(id_documento, str):
                      raise ValueError("id_documento invalido.")
                  firma = self.firmar_texto(id_documento + "\n" + contenido)
                  return {
                      "documento_id": id_documento,
                      "algoritmo": ALGORITMO,
                      "firma": firma,
                      "sellado_en": datetime.now(timezone.utc).isoformat(),
                  }
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/security/audit_sink.py << 'ZYRA_EOF'
          """Puerta de auditoria para toda operacion sensible."""

          from apps.laboratorio.shared.helpers.json_helpers import a_json


          class AuditoriaSink:
              """Registra quien hizo que, sobre que recurso y con que resultado."""

              def __init__(self, repositorio):
                  if repositorio is None:
                      raise ValueError("AuditoriaSink requiere su repositorio.")
                  self._repo = repositorio

              def registrar(self, identidad, accion: str, recurso: str, resultado: str, detalle: dict = None) -> int:
                  actor = identidad.zid if identidad is not None and hasattr(identidad, "zid") else "anonimo"
                  return self._repo.registrar(actor, accion, recurso, resultado, detalle)

              def registrar_error(self, identidad, accion: str, recurso: str, exc: Exception) -> int:
                  detalle = {"error": type(exc).__name__, "mensaje": a_json({"m": str(exc)[:300]})}
                  return self.registrar(identidad, accion, recurso, "error", detalle)
          ZYRA_EOF
          echo "=== RED (2) ==="
          escribir apps/laboratorio/infrastructure/network/zyra_client.py << 'ZYRA_EOF'
          """LAB-CORE: cliente de ZYRA Core (registro, sellado, confianza).

          Ley 1: si la red no esta configurada, lo reporta; nunca simula exito.
          """
          import json as _json
          import urllib.error
          import urllib.request

          from apps.laboratorio.constants.system.system_constants import SistemaConstantes
          from apps.laboratorio.shared.exceptions.network_errors import (
              RedNoDisponibleError,
              RespuestaInvalidaError,
          )

          DESTINO_SELLO = "zyra/documents/seal"


          class ClienteZyra:
              """Unica puerta HTTP hacia ZYRA Core."""

              def __init__(self, config_red):
                  if config_red is None:
                      raise ValueError("ClienteZyra requiere su configuracion.")
                  self._cfg = config_red

              @property
              def configurado(self) -> bool:
                  return self._cfg.configurada

              def _peticion(self, metodo: str, ruta: str, carga: dict = None) -> dict:
                  if not self.configurado:
                      raise RedNoDisponibleError("URL de ZYRA Core no configurada.")
                  url = self._cfg.url_zyra_core.rstrip("/") + ruta
                  datos = _json.dumps(carga or {}).encode("utf-8")
                  peticion = urllib.request.Request(
                      url, data=datos if metodo != "GET" else None, method=metodo
                  )
                  peticion.add_header("Content-Type", "application/json")
                  peticion.add_header("X-ZYRA-APP", self._cfg.app_id)
                  if self._cfg.api_token:
                      peticion.add_header("Authorization", "Bearer " + self._cfg.api_token)
                  try:
                      with urllib.request.urlopen(
                          peticion, timeout=self._cfg.timeout_segundos
                      ) as respuesta:
                          crudo = respuesta.read()
                  except urllib.error.HTTPError as exc:
                      raise RedNoDisponibleError(
                          "ZYRA Core respondio HTTP " + str(exc.code)
                      ) from exc
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      raise RedNoDisponibleError(
                          "ZYRA Core inalcanzable: " + str(exc)
                      ) from exc
                  try:
                      cuerpo = _json.loads(crudo.decode("utf-8"))
                  except (ValueError, UnicodeDecodeError) as exc:
                      raise RespuestaInvalidaError(
                          "Respuesta de ZYRA Core no es JSON valido."
                      ) from exc
                  if not isinstance(cuerpo, dict):
                      raise RespuestaInvalidaError(
                          "Respuesta de ZYRA Core debe ser un objeto JSON."
                      )
                  return cuerpo

              def registrar_app(self) -> dict:
                  if not self.configurado:
                      return {"registrado": False, "motivo": "URL de ZYRA Core no configurada"}
                  return self._peticion(
                      "POST",
                      "/apps/register",
                      {
                          "app_id": self._cfg.app_id,
                          "nombre": SistemaConstantes.NOMBRE_APP,
                          "version": SistemaConstantes.VERSION_APP,
                      },
                  )

              def sellar_documento(self, titulo: str, contenido: str) -> dict:
                  if not self.configurado:
                      return {"sellado": False, "motivo": "URL de ZYRA Core no configurada"}
                  return self._peticion(
                      "POST", "/documents/seal", {"titulo": titulo, "contenido": contenido}
                  )

              def verificar_documento(self, documento_id: str) -> dict:
                  if not documento_id:
                      raise ValueError("documento_id requerido.")
                  return self._peticion("GET", "/documents/" + documento_id + "/verify")

              def entregar(self, destino: str, carga: dict) -> dict:
                  if not self.configurado:
                      raise RedNoDisponibleError("URL de ZYRA Core no configurada.")
                  if destino == DESTINO_SELLO:
                      return self.sellar_documento(
                          str(carga.get("titulo", "")), str(carga.get("contenido", ""))
                      )
                  raise RespuestaInvalidaError("Destino de entrega desconocido: " + destino)
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/network/health.py << 'ZYRA_EOF'
          """Estado de salud real de LABORATORIO (sin fingir nada)."""
          from datetime import datetime, timezone

          from apps.laboratorio.constants.system.system_constants import SistemaConstantes


          class EstadoSalud:
              """Consulta BD, motores y configuracion de red reales."""

              def __init__(self, conexion, config_red, registro_motores):
                  self._cx = conexion
                  self._cfg_red = config_red
                  self._motores = registro_motores

              def estado(self) -> dict:
                  try:
                      self._cx.consultar("SELECT 1")
                      bd = True
                  except Exception:
                      bd = False
                  motores = self._motores.reporte_todos()
                  disponibles = sum(1 for m in motores if m.get("estado") == "disponible")
                  return {
                      "ok": bd,
                      "app": SistemaConstantes.ID_APP,
                      "version": SistemaConstantes.VERSION_APP,
                      "base_datos": bd,
                      "motores_total": len(motores),
                      "motores_disponibles": disponibles,
                      "red_configurada": self._cfg_red.configurada,
                      "momento": datetime.now(timezone.utc).isoformat(),
                  }
          ZYRA_EOF
          echo "=== MENSAJERIA (3) ==="
          escribir apps/laboratorio/infrastructure/messaging/event_bus.py << 'ZYRA_EOF'
          """Bus de eventos en memoria (implementa el puerto EventBus)."""

          from apps.laboratorio.shared.interfaces.event_bus import (
              EventBus,
              Evento,
              ManejadorEvento,
          )
          from apps.laboratorio.shared.utilities.logging_utils import obtener_logger


          class BusEventos(EventBus):
              """Publica a suscriptores aislando errores de manejadores."""

              def __init__(self):
                  self._suscriptores = {}
                  self._logger = obtener_logger("bus_eventos")

              def suscribir(self, nombre_evento: str, manejador: ManejadorEvento) -> None:
                  if not nombre_evento or not callable(manejador):
                      raise ValueError("Suscripcion requiere nombre y manejador callable.")
                  self._suscriptores.setdefault(nombre_evento, []).append(manejador)

              def publicar(self, evento: Evento) -> int:
                  if not isinstance(evento, Evento):
                      raise ValueError("publicar requiere un Evento.")
                  entregados = 0
                  for manejador in self._suscriptores.get(evento.nombre, ()):
                      try:
                          manejador(evento)
                          entregados += 1
                      except Exception as exc:
                          self._logger.error(
                              "manejador fallo para " + evento.nombre + ": "
                              + type(exc).__name__ + ": " + str(exc)
                          )
                  return entregados
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/messaging/outbox.py << 'ZYRA_EOF'
          """Outbox con reintentos: ninguna entrega a la red se pierde."""
          from apps.laboratorio.shared.helpers.json_helpers import (
              a_json,
              intentar_desde_json,
          )
          from apps.laboratorio.shared.models.base import ahora_utc

          ESTADO_PENDIENTE = "pendiente"
          ESTADO_ENVIADO = "enviado"
          ESTADO_ERROR = "error"


          class Outbox:
              def __init__(self, conexion, reintentos_max: int = 3):
                  if conexion is None:
                      raise ValueError("Outbox requiere conexion.")
                  if reintentos_max < 1:
                      raise ValueError("reintentos_max debe ser mayor o igual a 1.")
                  self._cx = conexion
                  self._max = int(reintentos_max)

              def encolar(self, evento: str, destino: str, carga: dict) -> int:
                  if not evento or not destino:
                      raise ValueError("encolar requiere evento y destino.")
                  cursor = self._cx.ejecutar(
                      "INSERT INTO lab_outbox (evento, destino, carga, intentos, estado, "
                      "ultimo_error, creado_en) VALUES (?, ?, ?, 0, ?, '', ?)",
                      (evento, destino, a_json(dict(carga or {})), ESTADO_PENDIENTE, ahora_utc().isoformat()),
                  )
                  return int(cursor.lastrowid)

              def pendientes(self, limite: int = 50) -> list:
                  filas = self._cx.consultar(
                      "SELECT * FROM lab_outbox WHERE estado = ? ORDER BY id LIMIT ?",
                      (ESTADO_PENDIENTE, int(limite)),
                  )
                  return [self._fila_a_dict(f) for f in filas]

              def procesar(self, entregador) -> dict:
                  if not callable(entregador):
                      raise ValueError("entregador debe ser callable.")
                  resumen = {"procesados": 0, "enviados": 0, "reprogramados": 0, "abandonados": 0}
                  for fila in self._cx.consultar(
                      "SELECT * FROM lab_outbox WHERE estado = ? ORDER BY id",
                      (ESTADO_PENDIENTE,),
                  ):
                      resumen["procesados"] += 1
                      try:
                          entregador(fila["destino"], intentar_desde_json(fila["carga"]))
                          self._cx.ejecutar(
                              "UPDATE lab_outbox SET estado = ?, enviado_en = ? WHERE id = ?",
                              (ESTADO_ENVIADO, ahora_utc().isoformat(), fila["id"]),
                          )
                          resumen["enviados"] += 1
                      except Exception as exc:
                          intentos = int(fila["intentos"]) + 1
                          error = type(exc).__name__ + ": " + str(exc)[:500]
                          if intentos >= self._max:
                              self._cx.ejecutar(
                                  "UPDATE lab_outbox SET intentos = ?, estado = ?, "
                                  "ultimo_error = ? WHERE id = ?",
                                  (intentos, ESTADO_ERROR, error, fila["id"]),
                              )
                              resumen["abandonados"] += 1
                          else:
                              self._cx.ejecutar(
                                  "UPDATE lab_outbox SET intentos = ?, ultimo_error = ? WHERE id = ?",
                                  (intentos, error, fila["id"]),
                              )
                              resumen["reprogramados"] += 1
                  return resumen

              def estadisticas(self) -> dict:
                  filas = self._cx.consultar(
                      "SELECT estado, COUNT(*) AS n FROM lab_outbox GROUP BY estado"
                  )
                  base = {ESTADO_PENDIENTE: 0, ESTADO_ENVIADO: 0, ESTADO_ERROR: 0}
                  for f in filas:
                      base[f["estado"]] = int(f["n"])
                  return base

              @staticmethod
              def _fila_a_dict(f) -> dict:
                  return {
                      "id": int(f["id"]),
                      "evento": f["evento"],
                      "destino": f["destino"],
                      "carga": intentar_desde_json(f["carga"]),
                      "intentos": int(f["intentos"]),
                      "estado": f["estado"],
                      "ultimo_error": f["ultimo_error"],
                      "creado_en": f["creado_en"],
                      "enviado_en": f["enviado_en"],
                  }
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/messaging/subscribers.py << 'ZYRA_EOF'
          """Suscripciones que envian eventos de dominio a ZYRA Core via outbox."""

          from apps.laboratorio.constants.events.event_names import EventoNombre
          from apps.laboratorio.infrastructure.network.zyra_client import DESTINO_SELLO
          from apps.laboratorio.shared.helpers.json_helpers import a_json


          class SuscriptorZyra:
              """Conecta bus -> outbox: todo evento relevante se sella en ZYRA."""

              def __init__(self, bus, outbox):
                  if bus is None or outbox is None:
                      raise ValueError("SuscriptorZyra requiere bus y outbox.")
                  self._bus = bus
                  self._outbox = outbox

              def conectar(self) -> int:
                  self._bus.suscribir(EventoNombre.PROYECTO_CREADO, self._encolar_sello)
                  self._bus.suscribir(EventoNombre.ESCENARIO_EVALUADO, self._encolar_sello)
                  return 2

              def _encolar_sello(self, evento) -> None:
                  datos = dict(evento.datos)
                  titulo = str(datos.get("titulo") or "LABORATORIO/" + evento.nombre)
                  self._outbox.encolar(evento.nombre, DESTINO_SELLO, {"titulo": titulo, "contenido": a_json(datos)})
          ZYRA_EOF
          echo "=== REGISTROS (11) ==="
          escribir apps/laboratorio/registry/modules/module_manifest.py << 'ZYRA_EOF'
          """Manifiesto oficial de un modulo vertical."""
          import re
          from dataclasses import dataclass

          PATRON_ID = re.compile(r"^[a-z][a-z0-9_]{2,30}$")


          @dataclass(frozen=True)
          class ManifiestoModulo:
              id: str
              nombre: str
              version: str = "1.0.0"
              descripcion: str = ""

              def __post_init__(self):
                  if not PATRON_ID.match(self.id or ""):
                      raise ValueError("Id de modulo invalido: " + repr(self.id))
                  if not self.nombre or not self.nombre.strip():
                      raise ValueError("El modulo requiere nombre.")
                  if not self.version or not self.version.strip():
                      raise ValueError("El modulo requiere version.")
          ZYRA_EOF
          escribir apps/laboratorio/registry/modules/register.py << 'ZYRA_EOF'
          """Registro unico de modulos verticales activos."""


          class RegistroModulos:
              def __init__(self):
                  self._modulos = {}

              def registrar(self, manifiesto) -> None:
                  if manifiesto is None or not hasattr(manifiesto, "id"):
                      raise ValueError("Se esperaba un ManifiestoModulo.")
                  if manifiesto.id in self._modulos:
                      raise ValueError("Modulo duplicado: " + manifiesto.id)
                  self._modulos[manifiesto.id] = manifiesto

              def registrar_varios(self, manifiestos) -> None:
                  for m in manifiestos:
                      self.registrar(m)

              def listar(self) -> list:
                  return [
                      {"id": m.id, "nombre": m.nombre, "version": m.version, "descripcion": m.descripcion}
                      for _, m in sorted(self._modulos.items())
                  ]

              def contiene(self, id_modulo: str) -> bool:
                  return id_modulo in self._modulos

              def total(self) -> int:
                  return len(self._modulos)
          ZYRA_EOF
          escribir apps/laboratorio/registry/menus/menu_tree.py << 'ZYRA_EOF'
          """DUENO UNICO del arbol de menus de LABORATORIO (Ley 3: max 3 botones)."""

          MENUS = (
