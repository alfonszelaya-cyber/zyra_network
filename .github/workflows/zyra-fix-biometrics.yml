name: ZYRA AXIS Block 10

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write access_control.py
        run: |
          cat > apps/axis/life_history/access_control.py <<'AEOF'
          """AXIS granular access control - additive."""
          from __future__ import annotations

          import unittest

          from apps.axis.life_history.permissions import (
              HISTORY_READERS,
              REGISTRY_OPERATORS,
          )

          OPERATIONS = {
              "birth.register": REGISTRY_OPERATORS,
              "birth.amend": REGISTRY_OPERATORS,
              "health.record": ("medico",),
              "justice.case": ("abogado", "gobierno"),
              "justice.status": ("abogado", "gobierno"),
              "security.report": ("policia", "gobierno"),
              "security.advance": ("policia", "gobierno"),
              "clearance.emit": REGISTRY_OPERATORS,
              "history.read": HISTORY_READERS,
              "zid.upgrade": REGISTRY_OPERATORS
              + ("biometric-enroll",),
          }


          def authorize(operation: str, role: str) -> bool:
              allowed = OPERATIONS.get(operation)
              if allowed is None:
                  raise ValueError(
                      f"unknown operation: {operation}"
                  )
              return role in allowed


          class AccessControlTests(unittest.TestCase):
              def test_roles_allowed(self) -> None:
                  self.assertTrue(
                      authorize(
                          "birth.register",
                          "registrador_civil",
                      )
                  )
                  self.assertTrue(
                      authorize(
                          "health.record", "medico"
                      )
                  )
                  self.assertTrue(
                      authorize(
                          "clearance.emit", "gobierno"
                      )
                  )

              def test_roles_denied(self) -> None:
                  self.assertFalse(
                      authorize(
                          "clearance.emit", "paciente"
                      )
                  )
                  self.assertFalse(
                      authorize(
                          "security.report", "medico"
                      )
                  )

              def test_unknown_operation(self) -> None:
                  with self.assertRaises(ValueError):
                      authorize("hack.admin", "gobierno")


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          AEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/access_control.py').read()); print('access_control OK')"

      - name: Write clearance_ops.py
        run: |
          cat > apps/axis/life_history/clearance_ops.py <<'CEOF'
          """AXIS clearance ops screen - standalone additive
          HTTP surface (own port). Routes:
          GET/POST /clr/emision, POST /clr/verify
          """
          from __future__ import annotations

          import json
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import ClassVar
          from urllib.parse import urlparse

          from apps.axis.life_history.access_control import (
              authorize,
          )
          from apps.axis.life_history.clearance_service import (
              ClearanceNotAuthorizedError,
          )

          _CSS = (
              "body{font-family:system-ui;"
              "background:#0d1117;color:#e6edf3;"
              "padding:20px;margin:0}"
              ".card{background:#161b22;border:1px"
              " solid #30363d;border-radius:10px;"
              "padding:14px;margin-top:10px}"
              "input{width:100%;box-sizing:border-box;"
              "background:#0d1117;color:#e6edf3;"
              "border:1px solid #30363d;"
              "border-radius:6px;padding:8px;"
              "margin:4px 0}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px;"
              "border-radius:8px;width:100%;"
              "margin-top:6px}"
              ".ok{color:#3fb950}"
              ".bad{color:#f85149}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html><head>"
                  "<meta charset='utf-8'>"
                  "<title>"
                  + title
                  + "</title><style>"
                  + _CSS
                  + "</style></head><body>"
                  + body
                  + "</body></html>"
              )


          class ClearanceHandler(BaseHTTPRequestHandler):
              emitter: ClassVar[object] = None

              def log_message(self, fmt, *args) -> None:
                  return None

              def do_GET(self) -> None:
                  path = urlparse(self.path).path
                  if path == "/clr/emision":
                      self._form()
                      return
                  self._html(
                      404,
                      _page("404", "<h1>No encontrado</h1>"),
                  )

              def do_POST(self) -> None:
                  path = urlparse(self.path).path
                  doc = self._form()
                  if path == "/clr/emision":
                      self._emit(doc)
                      return
                  self._html(
                      404,
                      _page("404", "<h1>No encontrado</h1>"),
                  )

              def _form(self) -> None:
                  body = (
                      "<h1>CERTIFICACION DE ANTECEDENTES</h1>"
                      "<div class='card'>"
                      "<form method='POST'"
                      " action='/clr/emision'>"
                      "<input name='operator_account'"
                      " placeholder='Mi ID operador (AX-)'>"
                      "<input name='operator_role'"
                      " placeholder='Mi rol (gobierno)'>"
                      "<input name='subject_zid'"
                      " placeholder='ZID del solicitante'>"
                      "<button>Emitir certificacion</button>"
                      "</form></div>"
                  )
                  self._html(
                      200,
                      _page(
                          "AXIS - Certificaciones",
                          body,
                      ),
                  )

              def _emit(self, doc) -> None:
                  emitter = type(self).emitter
                  role = str(
                      doc.get("operator_role", "")
                  ).strip()
                  try:
                      if not authorize(
                          "clearance.emit", role
                      ):
                          raise (
                              ClearanceNotAuthorizedError(
                                  "rol no autorizado:"
                                  " " + role
                              )
                          )
                      cert = emitter.emit(
                          operator_account=self._req(
                              doc, "operator_account"
                          ),
                          operator_role=role,
                          subject_zid=self._req(
                              doc, "subject_zid"
                          ),
                      )
                      finding = cert["finding"]
                      css = (
                          "ok"
                          if "SIN" in finding
                          else "bad"
                      )
                      body = (
                          "<h1>Certificacion emitida</h1>"
                          "<p>ID: <b>"
                          + cert["cert_id"]
                          + "</b></p>"
                          "<p>Resultado: <b class='"
                          + css
                          + "'>"
                          + finding
                          + "</b></p>"
                          "<p>Documento: <b>"
                          + str(cert["document_id"] or "-")
                          + "</b></p>"
                          "<p class='" + css + "'>"
                          + json.dumps(
                              {
                                  "cert_id": cert["cert_id"],
                                  "requester": cert[
                                      "requester"
                                  ],
                                  "subject_zid": cert[
                                      "subject_zid"
                                  ],
                                  "finding": finding,
                                  "issued_at": cert[
                                      "issued_at"
                                  ],
                                  "signature": cert[
                                      "signature"
                                  ],
                              }
                          )
                          + "</p>"
                          "<a href='/clr/emision'>Volver</a>"
                      )
                      self._html(
                          200,
                          _page(
                              "AXIS - Certificacion",
                              body,
                          ),
                      )
                  except Exception as exc:
                      self._html(
                          403,
                          _page(
                              "Rechazado",
                              "<h1 class='bad'>Rechazada</h1>"
                              "<p>"
                              + str(exc)
                              + "</p>"
                              "<a href='/clr/emision'>Volver</a>",
                          ),
                      )

              def _form_data(self) -> dict:
                  length = self.headers.get(
                      "Content-Length"
                  )
                  raw = self.rfile.read(
                      int(length)
                  ).decode("utf-8")
                  doc: dict = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          k, v = pair.split("=", 1)
                          doc[k] = v.replace("+", " ")
                  return doc

              def _form(self2=None) -> None:
                  pass

              def _form_data2(self) -> None:
                  pass

              def _req(doc, key) -> str:
                  value = doc.get(key)
                  if (
                      not isinstance(value, str)
                      or not value.strip()
                  ):
                      raise ValueError("missing: " + key)
                  return value

              def _html(
                  self, status: int, html: str,
              ) -> None:
                  body = html.encode("utf-8")
                  self.send_response(status)
                  self.send_header(
                      "Content-Type",
                      "text/html; charset=utf-8",
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body)),
                  )
                  self.end_headers()
                  self.wfile.write(body)


          ClearanceHandler._form = ClearanceHandler._form
          ClearanceHandler._form_data = (
              ClearanceHandler._form_data
          )
          ClearanceHandler._req = staticmethod(
              ClearanceHandler._req
          )


          class ClearanceServer(ThreadingHTTPServer):
              daemon_threads = True
              allow_reuse_address = True

              def __init__(self, address) -> None:
                  super().__init__(
                      address, ClearanceHandler
                  )

              @property
              def bound_port(self) -> int:
                  return int(self.server_address[1])


          def serve_clearance(
              emitter,
              *,
              host: str = "127.0.0.1",
              port: int = 0,
          ) -> ClearanceServer:
              ClearanceHandler.emitter = emitter
              return ClearanceServer((host, port))
          CEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/clearance_ops.py').read()); print('clearance_ops OK')"

      - name: Fix clearance_ops form method name collision
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/axis/life_history/"
              "clearance_ops.py"
          )
          src = path.read_text(encoding="utf-8")

          src = src.replace(
              "def _form(self) -> None:",
              "def _show_form(self) -> None:",
          )
          src = src.replace(
              "def _form_data(self) -> dict:",
              "def _read_form(self) -> dict:",
          )
          src = src.replace(
              "def _form_data2(self) -> None:\n"
              "                  pass\n",
              "",
          )
          src = src.replace(
              "doc = self._form()",
              "doc = self._read_form()",
          )
          src = src.replace(
              "self._form()",
              "self._show_form()",
          )
          src = src.replace(
              "self._req(",
              "self._req_static(",
          )
          src = src.replace(
              "def _req_static(doc, key) -> str:",
              "@staticmethod\n"
              "              def _req_static(doc, key) -> str:",
          )
          path.write_text(src, encoding="utf-8")
          print("CLEANED")

          import ast

          ast.parse(src)
          print("SYNTAX OK")
          PYEOF

      - name: Write E2E test (fixed, no HTML JSON extraction)
        run: |
          cat > apps/axis/life_history/tests/test_clearance_ops.py <<'VEOF'
          """Clearance screen E2E over real HTTP."""
          from __future__ import annotations

          import threading
          import unittest
          from urllib.request import (
              Request,
              urlopen,
          )

          from apps.axis.life_history.clearance_ops import (
              serve_clearance,
          )
          from apps.axis.life_history.clearance_service import (
              ClearanceEmitter,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )


          class _FakeNet:
              def get(self, path):
                  return True, {"status": "ACTIVE"}, None

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-clr"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return False, None, "unknown"


          class _Clock:
              def now(self) -> float:
                  import time

                  return time.time()


          class ClearanceOpsE2E(unittest.TestCase):
              def test_emit_and_denied(self) -> None:
                  db = SQLiteAdapter(":memory:")
                  net_db = SQLiteAdapter(":memory:")
                  life = LifeHistoryService(
                      store=LifeHistoryStore(
                          db, _Clock()
                      ),
                      client=_FakeNet(),
                  )
                  emitter = ClearanceEmitter(
                      store=db,
                      life=life,
                      client=_FakeNet(),
                      network_db=net_db,
                      master_key_hex="ab" * 32,
                  )
                  server = serve_clearance(emitter)
                  thread = threading.Thread(
                      target=server.serve_forever,
                      daemon=True,
                  )
                  thread.start()
                  base = (
                      "http://127.0.0.1:"
                      + str(server.bound_port)
                  )

                  def post(path, doc):
                      req = Request(
                          base + path,
                          data=(
                              "&".join(
                                  str(k)
                                  + "="
                                  + str(v)
                                  for k, v in doc.items()
                              )
                          ).encode("utf-8"),
                          method="POST",
                      )
                      with urlopen(
                          req, timeout=10
                      ) as r:
                          return r.read().decode(
                              "utf-8"
                          )

                  try:
                      ok_page = post(
                          "/clr/emision",
                          {
                              "operator_account": "AX-gob",
                              "operator_role": "gobierno",
                              "subject_zid": "ZID-suj-1",
                          },
                      )
                      self.assertIn(
                          "Certificacion emitida",
                          ok_page,
                      )
                      self.assertIn(
                          "SIN_ANTECEDENTES_ACTIVOS",
                          ok_page,
                      )
                      denied = post(
                          "/clr/emision",
                          {
                              "operator_account": "AX-any",
                              "operator_role": "paciente",
                              "subject_zid": "ZID-suj-2",
                          },
                      )
                      self.assertIn(
                          "Rechazada", denied
                      )
                      rows = net_db.query_all(
                          "SELECT * FROM"
                          " clearance_requests"
                      )
                      self.assertEqual(
                          1, len(rows)
                      )
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()
                      net_db.close()


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          VEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_clearance_ops.py').read()); print('test OK')"

      - name: 1/3 Clearance screen E2E
        run: python -m apps.axis.life_history.tests.test_clearance_ops -v

      - name: 2/3 Access control tests
        run: python -m apps.axis.life_history.access_control -v

      - name: 3/3 Full regression (all suites)
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q
          python -m apps.axis.life_history.tests.test_justice_service -q
          python -m apps.axis.life_history.tests.test_security_service -q
          python -m apps.axis.life_history.tests.test_ops_server -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "axis: clearance ops screen + granular access control - AXIS complete"
            git push
          fi
