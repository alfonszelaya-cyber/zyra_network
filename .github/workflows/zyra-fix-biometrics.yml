name: "ZYRA FIX v9: radar validacion 400 + diagnostico agro"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-fix-biometrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 0 - Dump: handlers de registro de AGRO server"
        run: |
          python3 - <<'DUMPEOF'
          import re
          from pathlib import Path

          p = Path("apps/agro/server.py")
          if not p.exists():
              print("apps/agro/server.py NO EXISTE")
              raise SystemExit(0)
          t = p.read_text(encoding="utf-8", errors="ignore")
          print(f"===== apps/agro/server.py (total {len(t.splitlines())} lineas) =====")
          for key in ('/agro/register', '/agro/producers'):
              n = 0
              for m in re.finditer(re.escape(key), t):
                  if n >= 2:
                      break
                  i = m.start()
                  print(f"----- region alrededor de '{key}' (ocurrencia {n+1}) -----")
                  print(t[max(0, i - 2500): i + 3500])
                  print("----- fin region -----")
                  n += 1
          DUMPEOF

      - name: "Paso 1 - fix radar: validacion devuelve 400 (no 500+trace)"
        run: |
          python3 - <<'RADAREOF'
          from pathlib import Path

          p = Path("apps/subastas/modules/motores/radar_motor.py")
          if not p.exists():
              print("radar_motor.py NO EXISTE")
              raise SystemExit(1)
          txt = p.read_text(encoding="utf-8")
          if "except (ValueError, LookupError, PermissionError) as exc:" in txt:
              print("SKIP radar ya parcheado")
              raise SystemExit(0)
          OLD = (
              "        self._send_json(400, {\"ok\": False, \"error\": \"accion desconocida\"})\n"
              "    except Exception:\n"
              "        self._send_json(500, {\n"
              "            \"ok\": False, \"error\": \"server error\",\n"
              "            \"trace\": traceback.format_exc(),\n"
              "        })\n"
          )
          NEW = (
              "        self._send_json(400, {\"ok\": False, \"error\": \"accion desconocida\"})\n"
              "    except (ValueError, LookupError, PermissionError) as exc:\n"
              "        self._send_json(400, {\"ok\": False, \"error\": str(exc)})\n"
              "    except Exception:\n"
              "        self._send_json(500, {\n"
              "            \"ok\": False, \"error\": \"server error\",\n"
              "            \"trace\": traceback.format_exc(),\n"
              "        })\n"
          )
          if OLD not in txt:
              print("MISS bloque except del radar no encontrado")
              raise SystemExit(1)
          new = txt.replace(OLD, NEW, 1)
          compile(new, str(p), "exec")
          p.write_text(new, encoding="utf-8")
          print("OK radar validacion 400 aplicado")
          RADAREOF

      - name: "Paso 2 - RADAR SMOKE: scan 201 / validacion 400 / accion desconocida 400"
        run: |
          python3 - <<'SMORAD_EOF'
          import http.cookiejar
          import json
          import threading
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-smoke"}, None)
                  return (False, None, "offline")


          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.5)
          base = f"http://127.0.0.1:{srv.server_address[1]}"

          def call(method, path, payload=None, form=None):
              if form is not None:
                  data = urllib.parse.urlencode(form).encode()
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              else:
                  data = json.dumps(payload).encode() if payload is not None else None
                  headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(
                  base + path, data=data, method=method, headers=headers)
              try:
                  with op.open(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:500].decode("utf-8", "replace")

          st, body = call("POST", "/subastas/registro", form={
              "username": "radar" + uuid.uuid4().hex[:6],
              "password": "clave123",
              "display_name": "Radar Tester",
              "role": "vendedor",
          })
          print("registro:", st, body[:150])
          assert 200 <= st < 300, "registro fallo: " + body

          st, body = call("POST", "/subastas/api/radar", payload={
              "action": "scan", "instance": "market",
              "summary": "prueba radar",
              "findings": [{"label": "x", "score": 5}]})
          print("scan valido:", st, body[:300])
          assert st == 201, "scan deberia ser 201: " + body

          st, body = call("POST", "/subastas/api/radar", payload={
              "action": "scan", "instance": "market",
              "summary": "", "findings": []})
          print("scan sin summary:", st, body[:300])
          assert st == 400, "validacion deberia ser 400 (antes 500): " + body

          st, body = call("POST", "/subastas/api/radar", payload={"action": "zzz"})
          print("accion desconocida:", st, body[:200])
          assert st == 400, "accion desconocida deberia ser 400: " + body

          print("RADAR SMOKE OK")
          SMORAD_EOF

      - name: "Paso 3 - AGRO SMOKE: imprime el motivo exacto del 400 (diagnostico)"
        run: |
          python3 - <<'AGROEOF'
          import json
          import threading
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.agro.infrastructure.network.network_client import NetworkClient
          from apps.agro.infrastructure.persistence.agro_store import AgroStore
          from apps.agro.server import serve_agro

          dead = NetworkClient("http://127.0.0.1:1", timeout_seconds=1.0, max_retries=0)
          db = SQLiteAdapter(":memory:")
          store = AgroStore(db, SystemClock())
          srv = serve_agro(store, dead)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.5)
          base = f"http://127.0.0.1:{srv.bound_port}"

          def post_json(path, doc):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(doc).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:800].decode("utf-8", "replace")

          def post_form(path, form):
              req = urllib.request.Request(
                  base + path,
                  data=urllib.parse.urlencode(form).encode(),
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:800].decode("utf-8", "replace")

          try:
              st, body = post_json("/agro/health", {})
              print("health:", st, body[:300])
          except Exception as e:
              print("health GET fallo:", e)

          st, body = post_json("/agro/producers", {
              "name": "Smoke Productor",
              "producer_type": "agricultor",
              "location": "Chalatenango",
          })
          print("POST /agro/producers ->", st)
          print("   cuerpo:", body)

          st, body = post_form("/agro/register", {
              "name": "Smoke Rol",
              "producer_type": "maiz",
              "role": "agricultor",
              "location": "San Miguel",
          })
          print("POST /agro/register ->", st)
          print("   cuerpo:", body)

          print("AGRO SMOKE COMPLETADO (diagnostico, no bloquea)")
          AGROEOF

      - name: "Paso 4 - GATE: pytest subastas + mpe + semilla"
        run: |
          python3 -m pytest apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: "Paso 5 - reporte agro (no bloquea)"
        if: always()
        run: |
          python3 -m pytest apps/agro/tests -q --tb=short || true

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA FIX v9: radar validacion 400" -m "market_radar_api mapea ValueError/LookupError a 400 (antes 500+traceback); smoke radar estricto; smoke agro diagnostico; gate ampliado a semilla."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
