      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN E: GPT-5+6 recursos y riesgo completos" -m "Equipos/infraestructura persistentes; historial de cambios de activos (trazabilidad); valoracion con AssetValuationService real (amount>=0); riesgo climatico con alerta automatica en high/critical (umbral real); riesgo productivo con niveles de umbral real + alerta automatica en high; impacto con ImpactService real; planes de respuesta con estados y RiskResponseService real; score de recuperacion con ResilienceService real; resolucion de alertas STAFF; guardia +11 ops; tests en archivo existente."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
