name: ZYRA RUM 1 - Cliente ZYRA con reintentos reales (auto-escritor)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cliente:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Escribir zyra_client.py con reintentos reales
        run: |
          cat > apps/laboratorio/infrastructure/network/zyra_client.py <<'CLIENTE_EOF'
          """LAB-CORE: cliente de ZYRA Core (registro, sellado, confianza).

          Ley 1: si la red no esta configurada, lo reporta; nunca simula exito.
          Reintentos reales con espera progresiva sobre fallos de transporte
          (nunca sobre respuestas de error de la Red: esas son definitivas).
          """
          import json as _json
          import time
          import urllib.error
          import urllib.request

          from apps.laboratorio.constants.system.system_constants import SistemaConstantes
          from apps.laboratorio.shared.exceptions.network_errors import (
              RedNoDisponibleError,
              RespuestaInvalidaError,
          )

          DESTINO_SELLO = "zyra/documents/seal"
          ESPERA_BASE = 0.4


          class ClienteZyra:
              """Unica puerta HTTP hacia ZYRA Core."""

              def __init__(self, config_red):
                  if config_red is None:
                      raise ValueError("ClienteZyra requiere su configuracion.")
                  self._cfg = config_red

              @property
              def configurado(self) -> bool:
                  return self._cfg.configurada

              def estado_conexion(self) -> dict:
                  """Estado real y honesto del enlace con ZYRA Core."""
                  if not self.configurado:
                      return {
                          "configurada": False,
                          "conectada": False,
                          "motivo": "URL de ZYRA Core no configurada",
                      }
                  try:
                      self._peticion("GET", "/health")
                      return {
                          "configurada": True,
                          "conectada": True,
                          "motivo": "",
                      }
                  except RedNoDisponibleError as exc:
                      return {
                          "configurada": True,
                          "conectada": False,
                          "motivo": str(exc)[:300],
                      }

              def _peticion(self, metodo: str, ruta: str, carga: dict = None) -> dict:
                  if not self.configurado:
                      raise RedNoDisponibleError("URL de ZYRA Core no configurada.")
                  url = self._cfg.url_zyra_core.rstrip("/") + ruta
                  intentos_max = max(1, int(getattr(self._cfg, "reintentos", 1)))
                  ultimo_error = ""
                  for intento in range(1, intentos_max + 1):
                      datos = _json.dumps(carga or {}).encode("utf-8")
                      peticion = urllib.request.Request(
                          url,
                          data=datos if metodo != "GET" else None,
                          method=metodo,
                      )
                      peticion.add_header("Content-Type", "application/json")
                      peticion.add_header("X-ZYRA-APP", self._cfg.app_id)
                      if self._cfg.api_token:
                          peticion.add_header(
                              "Authorization", "Bearer " + self._cfg.api_token
                          )
                      try:
                          with urllib.request.urlopen(
                              peticion, timeout=self._cfg.timeout_segundos
                          ) as respuesta:
                              crudo = respuesta.read()
                          return self._procesar(crudo)
                      except urllib.error.HTTPError as exc:
                          cuerpo = b""
                          try:
                              cuerpo = exc.read()
                          except Exception:
                              pass
                          if exc.code >= 500:
                              ultimo_error = "ZYRA Core respondio HTTP " + str(exc.code)
                          else:
                              raise RedNoDisponibleError(
                                  "ZYRA Core rechazo la peticion (HTTP "
                                  + str(exc.code) + "): " + cuerpo.decode("utf-8", "replace")[:200]
                              ) from exc
                      except (urllib.error.URLError, TimeoutError, OSError) as exc:
                          ultimo_error = "ZYRA Core inalcanzable: " + str(exc)
                      if intento < intentos_max:
                          espera = ESPERA_BASE * (2 ** (intento - 1))
                          time.sleep(espera)
                  raise RedNoDisponibleError(ultimo_error or "ZYRA Core inalcanzable.")

              @staticmethod
              def _procesar(crudo: bytes) -> dict:
                  try:
                      cuerpo = _json.loads(crudo.decode("utf-8"))
                  except (ValueError, UnicodeDecodeError) as exc:
                      raise RespuestaInvalidaError(
                          "Respuesta de ZYRA Core no es JSON valido."
                      ) from exc
                  if not isinstance(cuerpo, dict):
                      raise RespuestaInvalidaError(
                          "Respuesta de ZYRA Core debe ser un objeto JSON."
                      )
                  return cuerpo

              def registrar_app(self) -> dict:
                  if not self.configurado:
                      return {"registrado": False, "motivo": "URL de ZYRA Core no configurada"}
                  return self._peticion(
                      "POST",
                      "/apps/register",
                      {
                          "app_id": self._cfg.app_id,
                          "nombre": SistemaConstantes.NOMBRE_APP,
                          "version": SistemaConstantes.VERSION_APP,
                      },
                  )

              def sellar_documento(self, titulo: str, contenido: str) -> dict:
                  if not self.configurado:
                      return {"sellado": False, "motivo": "URL de ZYRA Core no configurada"}
                  return self._peticion(
                      "POST", "/documents/seal", {"titulo": titulo, "contenido": contenido}
                  )

              def verificar_documento(self, documento_id: str) -> dict:
                  if not documento_id:
                      raise ValueError("documento_id requerido.")
                  return self._peticion("GET", "/documents/" + documento_id + "/verify")

              def entregar(self, destino: str, carga: dict) -> dict:
                  if not self.configurado:
                      raise RedNoDisponibleError("URL de ZYRA Core no configurada.")
                  if destino == DESTINO_SELLO:
                      return self.sellar_documento(
                          str(carga.get("titulo", "")), str(carga.get("contenido", ""))
                      )
                  raise RespuestaInvalidaError("Destino de entrega desconocido: " + destino)
          CLIENTE_EOF

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Verificar cliente real (sin red configurada = honesto)
        run: |
          python - <<'PYEOF'
          import ast, importlib, os, sys, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append
          A("# Cliente ZYRA con reintentos — resultado\n")

          ruta = "apps/laboratorio/infrastructure/network/zyra_client.py"
          t = Path(ruta).read_text(encoding="utf-8", errors="replace")
          try:
              ast.parse(t)
              A("- sintaxis: OK")
          except SyntaxError as e:
              A("- sintaxis: FALLO " + str(e))
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("\n".join(L) + "\n")
              sys.exit(1)

          A("")
          A("## Pruebas reales del cliente")
          A("```")
          try:
              from apps.laboratorio.config.network.network_config import NetworkConfig
              from apps.laboratorio.infrastructure.network.zyra_client import ClienteZyra

              ok = True

              cfg_vacia = NetworkConfig.cargar()
              cli1 = ClienteZyra(cfg_vacia)
              if cli1.configurado:
                  A("FALLO: config vacia no debe quedar configurada")
                  ok = False
              estado = cli1.estado_conexion()
              if estado.get("configurada") is not False or estado.get("conectada") is not False:
                  A("FALLO: estado sin config incorrecto: " + str(estado))
                  ok = False
              A("sin red configurada -> estado honesto: OK")

              try:
                  cli1._peticion("GET", "/health")
                  A("FALLO: peticion sin config debia fallar")
                  ok = False
              except Exception as exc:
                  A("peticion sin config se niega: OK (" + type(exc).__name__ + ")")

              cfg_fake = NetworkConfig(
                  url_zyra_core="http://127.0.0.1:59999",
                  app_id="laboratorio",
                  api_token="",
                  timeout_segundos=1.0,
                  reintentos=2,
              )
              cli2 = ClienteZyra(cfg_fake)
              estado2 = cli2.estado_conexion()
              if estado2.get("conectada") is not False:
                  A("FALLO: servidor muerto no debe reportar conectada")
                  ok = False
              A("servidor muerto -> conectada False con motivo real: OK")
              A("motivo: " + str(estado2.get("motivo", ""))[:120])

              resp = cli2.sellar_documento("t", "c")
              if resp.get("sellado") is not False:
                  A("FALLO: sellar sin red debe reportar sellado False")
                  ok = False
              A("sellar_documento degradado honesto: OK")

              if ok:
                  A("CLIENTE ZYRA CORRECTO")
              else:
                  sys.exit(1)
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-1800:])
              sys.exit(1)
          A("```")

          md = "\n".join(L)
          if summary:
              with open(summary, "a") as fh:
                  fh.write(md + "\n")
          print(md)
          PYEOF

      - name: Correr pruebas de laboratorio (no se rompe nada)
        run: |
          python -m pytest apps/laboratorio -q --tb=short 2>&1 | tail -5 || true
          echo "(informal: laboratorio sin suite propia todavia - se agrega en RUM 6)"

      - name: Commit y push automatico
        run: |
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio/infrastructure/network/zyra_client.py
          if git diff --cached --quiet; then
            echo "ya estaba corregido - sin cambios"
          else
            git commit -m "RUM 1: cliente ZYRA con reintentos reales y estado honesto de conexion"
            git push
          fi
