          """Manejador de red: indicadores, solicitudes y catalogo."""
          from apps.laboratorio.application.use_cases.network import (
              CasoListarContratos,
              CasoPublicarIndicador,
              CasoSolicitarDatos,
          )
          from apps.laboratorio.schemas.responses.envelopes import exito


          class ManejadorRed:
              def __init__(self, caso_publicar, caso_solicitar, caso_listar, auditoria):
                  self._caso_publicar = caso_publicar
                  self._caso_solicitar = caso_solicitar
                  self._caso_listar = caso_listar
                  self._auditoria = auditoria

              def publicar(self, identidad, datos: dict) -> tuple:
                  if not isinstance(datos, dict) or not str(datos.get("tipo", "")).strip():
                      raise ValueError("Falta el campo tipo.")
                  valor = datos.get("valor")
                  if valor is not None:
                      try:
                          valor = int(valor)
                      except (TypeError, ValueError) as exc:
                          raise ValueError("El valor debe ser entero.") from exc
                  resultado = self._caso_publicar.ejecutar(
                      identidad, str(datos["tipo"]).strip().lower(), valor
                  )
                  return exito(resultado, 201)

              def solicitar(self, identidad, datos: dict) -> tuple:
                  if not isinstance(datos, dict):
                      raise ValueError("Cuerpo invalido.")
                  app_destino = str(datos.get("app_destino", "")).strip().lower()
                  contrato = str(datos.get("contrato", "")).strip().lower()
                  if not app_destino:
                      raise ValueError("Falta el campo app_destino.")
                  if not contrato:
                      raise ValueError("Falta el campo contrato.")
                  resultado = self._caso_solicitar.ejecutar(
                      identidad, app_destino, contrato, datos.get("carga")
                  )
                  return exito(resultado, 201)

              def listar(self, identidad) -> tuple:
                  self._auditoria.registrar(identidad, "red.listar", "catalogo", "exito", {})
                  return exito(self._caso_listar.catalogo())
