# ============================================================
# ZYRA REV F v18 - parche del nucleo del registro ZID (todo-o-nada)
#
# Corrige lo reportado el 11/11 con 2 capturas: todos los pasos pasan
# (paso 5/5 con la clave escrita y "contrasena lista y coincidente")
# pero al tocar Crear mi ZID no se crea nada y la pantalla acaba diciendo
# "Recuperar contrasena"; y al tocar Volver para registrarse de nuevo,
# al querer escribir el nombre te bota al paso 5 sin dejarte escribir.
#
#   1) "RECUPERAR CONTRASENA" YA NO SE CONFUNDE CON EXITO (causa raiz
#      encontrada): en la v17, cualquier respuesta del servidor sin
#      marcas de rebote se tomaba como creacion y, si traia el nucleo
#      embebido, la pagina SE REESCRIBIA con esa respuesta. La pantalla
#      de recuperar del servidor pintaba ENCIMA de tu registro. Ahora:
#      - la respuesta se CLASIFICA: exito real (texto de exito o codigo
#        de ZID) -> pantalla verde TU ZID FUE CREADO;
#      - peticion de recuperar clave -> panel ambar nuevo que explica
#        QUE HACER (tu ZID casi seguro YA EXISTE de un intento anterior:
#        entra con tu clave en "Ya tengo ZID"; si no entra, usa
#        Recuperar contrasena y deja la MISMA clave), con boton para
#        VER MI CLAVE y la respuesta cruda del servidor; NO borra nada;
#      - respuesta desconocida -> aviso ambar, todo queda intacto;
#      - la pagina SOLO se reescribe si hay exito DEMOSTRADO, y la marca
#        de exito falsa que la v17 pudo guardar se limpia sola.
#   2) EL BOTON CREAR FUNCIONA EN TODOS LOS CAMINOS: si el codigo viejo
#      llama form.submit() directo (sin evento), el envolvente nuevo lo
#      toma igual por el canal protegido; y si tras tocar el boton nada
#      empieza en 600 ms, el nucleo lanza el envio protegido el mismo.
#      Los onclick viejos ya no se cortan (pueden rellenar campos ocultos
#      antes del envio). Nunca hay doble envio.
#   3) VOLVER VUELVE DE VERDAD: al tocar Volver/Atras/Regresar/Cancelar
#      la guardia anti-patada se PAUSA hasta que TU avanzas de nuevo.
#      Antes la pausa duraba 3 segundos: el barrido automatico de
#      mensajes (que muta el DOM) disparaba la guardia y te pateaba del
#      paso 1 al paso 5 justo al escribir tu nombre. Ahora ademas, si el
#      codigo viejo te empuja al paso 5 por su cuenta mientras estas en
#      tu paso elegido, el empujon SE CANCELA; un click tuyo en un boton
#      de accion (Continuar) libera la pausa. Mientras escribes en el
#      campo del nombre, nadie te mueve.
#   4) NUNCA HAY DOBLE ENVIO: marca de tiempo del ultimo envio + banderas.
#
#   CONSERVA todo lo de v13..v17: motor de nombres flexible, el reverso
#   no valida el nombre, guardia anti-patada, respaldo automatico del
#   registro en el telefono, 4 esquinas con mascara anti-tela, foto del
#   documento recortada al cuadro, auto-captura, motor facial EN VIVO,
#   selfie de rostro, lectura fuerte con poca luz, OCR multi-pase con
#   lectura confirmable, clave descubierta sola y respaldada en sesion
#   con repuesta automatica, envio protegido por fetch, pantalla de
#   exito TU ZID FUE CREADO, envio fail-closed, anti-bloqueo legado y
#   boton "i".
#
#   VERIFICACION RAPIDA de que v18 esta vivo en el telefono: el titulo
#   de la pestana termina en "REV F v18" y el boton "i" (abajo a la
#   derecha) dice "nucleo: REV F v18 activo". Si no lo dice, el run no
#   se ejecuto o Render aun no despliega.
#
# COMO USAR:
#   1) GitHub > Add file > Upload files y sube ESTE archivo tal cual a
#      .github/workflows/zyra-rev-f.yml (reemplaza el anterior).
#   2) Actions > ZYRA REV F - registro ZID > Run workflow.
#   3) Verde = publicado (Render despliega en 1-2 min). Prueba en el
#      telefono abriendo el registro DE NUEVO (recarga la pagina).
#   4) Si algo falla, pega el Resumen (Summary) del run en el chat.
#
# Si el archivo llega con UN caracter danado, el run lo REPARA solo
# verificando por SHA y publica igual. Si el dano es mayor, no publica
# nada y dice el motivo exacto (regla todo-o-nada).
# ============================================================
