          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(SEMILLA S-4 HTTP v2): HomeRegistrationRouter (logica pura dict->(code,payload): start 201 / detalle / confirm / pendientes; SIN_CUPOS 409 con alternativas; SE-3 + regla 78; errores honestos) + wiring V2 en server.py con RUTAS REALES /semilla/api/home-registration* (auditoria: _route exige prefijo semilla) inyectadas antes del fallback 'unknown api route' de _api_get/_api_post, doc reutilizado, handler comparte la MISMA db/clock del store, repair automatico v1->v2 si existiera, revert total si anclas no coinciden + smoke HTTP real en RUN 1e"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — S-4 HTTP v2 CERRADO (matricula desde casa accesible en /semilla/api/home-registration). RUN 1e: smoke HTTP real levantando serve_semilla + luego RUN 2 (S-5 a S-10 ciclo escolar).**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
