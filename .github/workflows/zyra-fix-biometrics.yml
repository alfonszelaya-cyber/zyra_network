                  '    c.registrar("caso_comparar", lambda _c: CasoCompararEscenarios(_c.obtener("repo_comparaciones"), _c.obtener("repo_escenarios"), _c.obtener("repo_evaluaciones"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("motor_comparacion"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_optimizar", lambda _c: CasoOptimizarEscenario(_c.obtener("repo_optimizaciones"), _c.obtener("repo_escenarios"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("motor_optimizacion"), _c.obtener("auditoria_sink")))\n'
