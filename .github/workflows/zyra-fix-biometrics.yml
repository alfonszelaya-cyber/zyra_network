          escribir apps/laboratorio/constants/business/stages.py << 'ZYRA_EOF'
          """Grupos de etapas de la cadena D1.

          Dueno de la cadena: shared/enums/pipeline_stage.py (sin duplicacion).
          Este modulo solo la agrupa para reportes y navegacion.
          """

          from apps.laboratorio.shared.enums.pipeline_stage import PipelineStage

          CAPTURA = (
              PipelineStage.DESCRIBIR.value,
              PipelineStage.FOTOGRAFIAR.value,
              PipelineStage.ESCANEAR.value,
              PipelineStage.MEDIR.value,
              PipelineStage.IMPORTAR.value,
          )

          CREACION = (
              PipelineStage.COMPRENDER.value,
              PipelineStage.DISENAR.value,
              PipelineStage.CREAR.value,
          )

          DECISION = (
              PipelineStage.SIMULAR.value,
              PipelineStage.PROBAR.value,
              PipelineStage.COMPARAR.value,
              PipelineStage.OPTIMIZAR.value,
          )

          VISUAL = (
              PipelineStage.TRES_D.value,
              PipelineStage.CUATRO_D.value,
              PipelineStage.FOTORREALISMO.value,
              PipelineStage.PRESENTACION.value,
          )

          ENTREGA = (
              PipelineStage.PROYECCION.value,
              PipelineStage.LIGHT_FIELD.value,
              PipelineStage.HOLOGRAFIA.value,
              PipelineStage.AR_VR.value,
          )

          GRUPOS = {
              "captura": CAPTURA,
              "creacion": CREACION,
              "decision": DECISION,
              "visual": VISUAL,
              "entrega": ENTREGA,
          }


          def validar_cobertura_total() -> bool:
              """Comprueba que los grupos cubren TODA la cadena sin repetir."""
              union = []
              for grupo in GRUPOS.values():
                  for etapa in grupo:
                      if etapa in union:
                          return False
                      union.append(etapa)
              return set(union) == set(PipelineStage.cadena_completa())
          ZYRA_EOF
          escribir apps/laboratorio/domain/project.py << 'ZYRA_EOF'
          """Proyecto: agregado raiz de LABORATORIO.

          Toda creacion (presentacion, ley, edificio, app, negocio...) es un
          Proyecto con UN tipo oficial y UNA etapa de la cadena D1.
          """

          from dataclasses import dataclass, field

          from apps.laboratorio.shared.enums.creation_type import CreationType
          from apps.laboratorio.shared.enums.pipeline_stage import PipelineStage
          from apps.laboratorio.shared.enums.project_status import ProjectStatus
          from apps.laboratorio.shared.models.base import EntidadBase


          @dataclass
          class Proyecto(EntidadBase):
              """Agregado raiz: identidad, tipo, etapa y estado del trabajo."""

              prefijo_id = "proy"

              titulo: str = ""
              descripcion: str = ""
              tipo_creacion: CreationType = CreationType.PRESENTACION
              etapa_actual: PipelineStage = PipelineStage.DESCRIBIR
              estado: ProjectStatus = ProjectStatus.BORRADOR
              propietario_zid: str = ""
              etiquetas: list = field(default_factory=list)

              def __post_init__(self):
                  if not self.titulo.strip():
                      raise ValueError("El proyecto requiere un titulo.")
                  if not self.propietario_zid.strip():
                      raise ValueError("El proyecto requiere un propietario ZID.")
                  self.titulo = self.titulo.strip()
                  self.propietario_zid = self.propietario_zid.strip()

              def avanzar_etapa(self) -> PipelineStage:
                  """Avanza a la siguiente etapa de la cadena D1."""
                  cadena = PipelineStage.cadena_completa()
                  indice = cadena.index(self.etapa_actual.value)
                  if indice >= len(cadena) - 1:
                      raise ValueError("El proyecto ya esta en la ultima etapa.")
                  self.etapa_actual = PipelineStage(cadena[indice + 1])
                  self.marcar_actualizacion()
                  return self.etapa_actual

              def cambiar_estado(self, nuevo: ProjectStatus) -> ProjectStatus:
                  """Cambia el estado del ciclo de vida."""
                  if not isinstance(nuevo, ProjectStatus):
                      raise ValueError("Estado de proyecto invalido.")
                  self.estado = nuevo
                  self.marcar_actualizacion()
                  return self.estado

              def agregar_etiqueta(self, etiqueta: str) -> None:
                  """Agrega una etiqueta normalizada sin duplicar."""
                  if not isinstance(etiqueta, str) or not etiqueta.strip():
                      raise ValueError("Etiqueta invalida.")
                  limpia = etiqueta.strip().lower()
                  if limpia not in self.etiquetas:
                      self.etiquetas.append(limpia)
                  self.marcar_actualizacion()
          ZYRA_EOF
          escribir apps/laboratorio/domain/scenario.py << 'ZYRA_EOF'
          """LAB-CORE: Escenario A/B/C y evaluate_scenario().

          Logica de dominio pura: sin HTTP, sin base de datos, sin framework.
          La API y la persistencia son capas externas que la consumen.
          """

          from dataclasses import dataclass, field
          from typing import Dict

          from apps.laboratorio.shared.enums.scenario_type import ScenarioType
          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador


          @dataclass
          class Escenario(EntidadBase):
              """Un escenario comparable (A, B o C) de un proyecto."""

              prefijo_id = "esc"

              proyecto_id: Identificador = None
              tipo: ScenarioType = ScenarioType.A
              titulo: str = ""
              descripcion: str = ""
              parametros: Dict[str, float] = field(default_factory=dict)

              def __post_init__(self):
                  if self.proyecto_id is None:
                      raise ValueError("El escenario requiere el id de su proyecto.")
                  if not self.titulo.strip():
                      raise ValueError("El escenario requiere un titulo.")
                  self.titulo = self.titulo.strip()
                  for clave, valor in self.parametros.items():
                      if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                          raise ValueError("Parametro no numerico: " + clave)

              def definir_parametro(self, clave: str, valor: float) -> None:
                  """Define un parametro numerico del escenario."""
                  if not isinstance(clave, str) or not clave.strip():
                      raise ValueError("Clave de parametro invalida.")
                  if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                      raise ValueError("El parametro debe ser numerico.")
                  self.parametros[clave.strip()] = float(valor)
                  self.marcar_actualizacion()


          def evaluate_scenario(escenario: Escenario) -> Dict[str, object]:
              """Evalua un escenario A/B/C con la regla oficial LAB-CORE.

              Parametros requeridos (escala 0 a 100):
                costo     -> menor es mejor
                beneficio -> mayor es mejor
                riesgo    -> menor es mejor
              Puntaje = 0.4*(100-costo) + 0.4*beneficio + 0.2*(100-riesgo).
              """
              if not isinstance(escenario, Escenario):
                  raise ValueError("evaluate_scenario requiere un Escenario.")
              requeridos = ("costo", "beneficio", "riesgo")
              faltan = [k for k in requeridos if k not in escenario.parametros]
              if faltan:
                  raise ValueError("Faltan parametros: " + ", ".join(faltan))
              for clave in requeridos:
                  valor = escenario.parametros[clave]
                  if not 0.0 <= valor <= 100.0:
                      raise ValueError(
                          "Parametro " + clave + " fuera de escala 0-100."
                      )
              costo = escenario.parametros["costo"]
              beneficio = escenario.parametros["beneficio"]
              riesgo = escenario.parametros["riesgo"]
              puntaje = (
                  0.4 * (100.0 - costo)
                  + 0.4 * beneficio
                  + 0.2 * (100.0 - riesgo)
              )
              return {
                  "costo": round(costo, 4),
                  "beneficio": round(beneficio, 4),
                  "riesgo": round(riesgo, 4),
                  "puntaje_total": round(puntaje, 4),
                  "tipo": escenario.tipo.value,
              }
          ZYRA_EOF
