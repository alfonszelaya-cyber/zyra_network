      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (Bloque 2-RESTANTE v3): 009 completo en su carpeta" -m "Stores relocated to modules/009_riesgo_proteccion and modules/002_inscripciones (git mv). Digit-leading modules imported via importlib. 009 completed: fraud patterns, automatic alerts, investigations, account blocks enforced on bid/listing/order. Listing anchor fixed to v6 exact line."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK (attempt $i)"
              exit 0
            fi
            echo "push failed, retry $i"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
