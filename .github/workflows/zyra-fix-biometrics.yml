name: "ZYRA SEMILLA SM3+SM4 fix quirurgico (solo 5 archivos afectados)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] Fix quirurgico: 2 use cases + 3 engines"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          USC = "apps/semilla/application/student_use_cases"
          USS = "apps/semilla/application/scholarship_use_cases"
          PSY = "apps/semilla/domain/psychology"
          FA = "apps/semilla/domain/family"
          AN = "apps/semilla/domain/analytics"

          try:
              forzar(USC + "/detect_talent_use_case.py", D(r'''
                  """Detect Talent Use Case (SM3). execute DENTRO
                  de la clase."""
                  from __future__ import annotations


                  class DetectTalentUseCase:
                      """Escanea el desglose por materia y registra
                      talentos con promedio >= min_average."""

                      def __init__(self, evaluation_engine,
                                   talent_engine,
                                   min_average="9.00"):
                          self._eval = evaluation_engine
                          self._tal = talent_engine
                          self._min = str(min_average)

                      def execute(self, *, student_id) -> dict:
                          breakdown = (self._eval
                                       .subject_breakdown(
                                           student_id))
                          detectados = []
                          for row in breakdown:
                              try:
                                  if (float(row["average"])
                                          >= float(self._min)):
                                      t = (self._tal.
                                           register_talent(
                                               student_id=student_id,
                                               category=row["subject"],
                                               detail=("promedio "
                                                       + row["average"]),
                                               source="USE_CASE",
                                               score=row["average"]))
                                      detectados.append(t)
                              except Exception:
                                  continue
                          return {"student_id": student_id,
                                  "threshold": self._min,
                                  "talents_registered":
                                      len(detectados),
                                  "talents": detectados}
              '''))

              forzar(USS + "/apply_scholarship_use_case.py", D(r'''
                  """Apply Scholarship Use Case (SM3). execute DENTRO
                  de la clase."""
                  from __future__ import annotations


                  class ApplyScholarshipUseCase:
                      """Aplica a la beca y corre la evaluacion
                      automatica por criterios."""

                      def __init__(self, scholarship_engine):
                          self._eng = scholarship_engine

                      def execute(self, *, program_id,
                                  student_id) -> dict:
                          app = self._eng.apply(
                              program_id=program_id,
                              student_id=student_id)
                          final = self._eng.evaluate(
                              app["application_id"])
                          return {"application": final}
              '''))

              forzar(PSY + "/emotional_monitoring_engine.py", D(r'''
                  """Emotional Monitoring (SM4). Orden por rowid:
                  con reloj congelado created_at empataria y el
                  orden seria ambiguo — rowid es determinista."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  NORMAL_MOODS = ("feliz", "tranquilo", "motivado",
                                  "contento")
                  ALERT_MOODS = ("triste", "estresado", "frustrado",
                                 "enojado", "ansioso", "cansado")
                  CRISIS = "crisis"

                  _MIGRATIONS = (
                      Migration(1, "sm_emotional", (
                          "CREATE TABLE IF NOT EXISTS sm_emotional (record_id TEXT PRIMARY KEY, student_id TEXT NOT NULL, mood TEXT NOT NULL, level TEXT NOT NULL, detail TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                      )),
                  )

                  class EmotionalMonitoringEngine:
                      """Monitoreo emocional del estudiante."""

                      def __init__(self, db, clock,
                                   alert_engine=None):
                          self._db = db
                          self._clock = clock
                          self._alerts = alert_engine
                          MigrationRunner(db, "sm.emotional",
                                          _MIGRATIONS).run(clock)

                      def _classify(self, mood) -> str:
                          m = str(mood).strip().lower()
                          if m == CRISIS:
                              return "CRITICAL"
                          if m in NORMAL_MOODS:
                              return "NORMAL"
                          if m in ALERT_MOODS:
                              return "ALERT"
                          raise ValueError(
                              "mood no reconocido: " + str(mood))

                      def _escalated(self, cursor,
                                     student_id) -> bool:
                          rows = cursor.execute(
                              "SELECT level FROM sm_emotional"
                              " WHERE student_id = ? ORDER BY"
                              " rowid DESC LIMIT 4",
                              (student_id,)).fetchall()
                          alerts = sum(1 for r in rows
                                       if str(r["level"])
                                       == "ALERT")
                          return alerts >= 3

                      def record_mood(self, *, student_id, mood,
                                      detail="") -> dict:
                          base = self._classify(mood)
                          rid = "SMEMO-" + str(uuid.uuid4())
                          now = self._clock.now()
                          level = base
                          escalated = False
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_emotional"
                                  " (record_id, student_id, mood,"
                                  " level, detail, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?)",
                                  (rid, student_id,
                                   str(mood).strip().lower(),
                                   level, str(detail), now))
                              if base == "ALERT":
                                  if self._escalated(cursor,
                                                     student_id):
                                      level = "CRITICAL"
                                      escalated = True
                                      cursor.execute(
                                          "UPDATE sm_emotional SET"
                                          " level = 'CRITICAL' WHERE"
                                          " record_id = ?", (rid,))
                          notified = False
                          if (self._alerts is not None
                                  and level != "NORMAL"):
                              self._alerts.publish(
                                  student_id=student_id,
                                  alert_type=("HEALTH" if level
                                              == "CRITICAL"
                                              else "GENERAL"),
                                  title=("Alerta emocional critica"
                                         if level == "CRITICAL"
                                         else "Seguimiento"
                                              " emocional"),
                                  detail=("estado reportado: "
                                          + str(mood)),
                                  recipient_role="PARENT")
                              notified = True
                          return {"record_id": rid,
                                  "mood": str(mood).strip().lower(),
                                  "level": level,
                                  "escalated": escalated,
                                  "parent_notified": notified}

                      def emotional_state(self, student_id
                                          ) -> dict:
                          rows = self._db.query_all(
                              "SELECT * FROM sm_emotional WHERE"
                              " student_id = ? ORDER BY"
                              " rowid DESC LIMIT 10",
                              (student_id,))
                          records = [{"mood": str(r["mood"]),
                                      "level": str(r["level"]),
                                      "created_at": float(
                                          r["created_at"])}
                                     for r in rows]
                          current = ("NORMAL" if not records
                                     else records[0]["level"])
                          alerts = sum(1 for r in records
                                       if r["level"] != "NORMAL")
                          return {"student_id": student_id,
                                  "current_level": current,
                                  "recent_alerts": alerts,
                                  "records": records}

                      def history_of(self, student_id
                                     ) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT * FROM sm_emotional WHERE"
                              " student_id = ? ORDER BY"
                              " rowid ASC", (student_id,))
                          return [{"mood": str(r["mood"]),
                                   "level": str(r["level"]),
                                   "detail": str(r["detail"]),
                                   "created_at":
                                       float(r["created_at"])}
                                  for r in rows]
              '''))

              forzar(FA + "/family_engine.py", D(r'''
                  """Family Engine (SM4). check_consent por rowid
                  DESC: la mas reciente SIEMPRE manda — created_at
                  con reloj congelado empataria."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  CONSENT_TYPES = ("DATA_PROCESSING", "PHOTOS",
                                   "OFFSITE_ACTIVITY", "MEDICAL",
                                   "INTERNET_USE")

                  _MIGRATIONS = (
                      Migration(1, "sm_consents", (
                          "CREATE TABLE IF NOT EXISTS sm_consents (consent_id TEXT PRIMARY KEY, student_id TEXT NOT NULL, consent_type TEXT NOT NULL, status TEXT NOT NULL, granted_by TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                      )),
                      Migration(2, "sm_family_comms", (
                          "CREATE TABLE IF NOT EXISTS sm_family_comms (comm_id TEXT PRIMARY KEY, student_id TEXT NOT NULL, from_role TEXT NOT NULL, subject TEXT NOT NULL, body TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                      )),
                      Migration(3, "sm_family_meetings", (
                          "CREATE TABLE IF NOT EXISTS sm_family_meetings (meeting_id TEXT PRIMARY KEY, student_id TEXT NOT NULL, date TEXT NOT NULL, topic TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'SCHEDULED', notes TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                      )),
                  )

                  class FamilyEngine:
                      """Consentimientos + comunicacion familia."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.family",
                                          _MIGRATIONS).run(clock)

                      def grant_consent(self, *, student_id,
                                        consent_type,
                                        granted_by) -> dict:
                          if consent_type not in CONSENT_TYPES:
                              raise ValueError(
                                  "consent_type invalido")
                          cid = "SMCNS-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_consents"
                                  " (consent_id, student_id,"
                                  " consent_type, status,"
                                  " granted_by, created_at)"
                                  " VALUES (?, ?, ?, 'GRANTED',"
                                  " ?, ?)",
                                  (cid, student_id, consent_type,
                                   str(granted_by), now))
                          return {"consent_id": cid,
                                  "consent_type": consent_type,
                                  "status": "GRANTED"}

                      def revoke_consent(self, *, student_id,
                                         consent_type,
                                         revoked_by) -> dict:
                          if consent_type not in CONSENT_TYPES:
                              raise ValueError(
                                  "consent_type invalido")
                          cid = "SMCNS-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_consents"
                                  " (consent_id, student_id,"
                                  " consent_type, status,"
                                  " granted_by, created_at)"
                                  " VALUES (?, ?, ?, 'REVOKED',"
                                  " ?, ?)",
                                  (cid, student_id, consent_type,
                                   str(revoked_by), now))
                          return {"consent_id": cid,
                                  "consent_type": consent_type,
                                  "status": "REVOKED"}

                      def check_consent(self, student_id,
                                        consent_type) -> bool:
                          row = self._db.query_one(
                              "SELECT status FROM sm_consents"
                              " WHERE student_id = ? AND"
                              " consent_type = ? ORDER BY"
                              " rowid DESC LIMIT 1",
                              (student_id, consent_type))
                          if not row:
                              return False
                          return str(row["status"]) == "GRANTED"

                      def send_communication(self, *, student_id,
                                             from_role, subject,
                                             body="") -> dict:
                          if from_role not in ("SCHOOL",
                                               "TEACHER",
                                               "INSTITUTION",
                                               "SYSTEM"):
                              raise ValueError(
                                  "from_role invalido")
                          if not str(subject).strip():
                              raise ValueError(
                                  "subject requerido")
                          cmid = "SMFCM-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_family_comms"
                                  " (comm_id, student_id,"
                                  " from_role, subject, body,"
                                  " created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?)",
                                  (cmid, student_id, from_role,
                                   str(subject).strip(),
                                   str(body), now))
                          return {"comm_id": cmid,
                                  "student_id": student_id,
                                  "subject": str(subject).strip(),
                                  "status": "SENT"}

                      def communications_of(self, student_id
                                            ) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT * FROM sm_family_comms WHERE"
                              " student_id = ? ORDER BY rowid",
                              (student_id,))
                          return [{"comm_id":
                                       str(r["comm_id"]),
                                   "from_role":
                                       str(r["from_role"]),
                                   "subject": str(r["subject"]),
                                   "body": str(r["body"]),
                                   "created_at":
                                       float(r["created_at"])}
                                  for r in rows]

                      def schedule_meeting(self, *, student_id,
                                           date, topic) -> dict:
                          if not str(date).strip():
                              raise ValueError("date requerida")
                          mid = "SMFMT-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_family_meetings"
                                  " (meeting_id, student_id, date,"
                                  " topic, status, created_at)"
                                  " VALUES (?, ?, ?, ?,"
                                  " 'SCHEDULED', ?)",
                                  (mid, student_id, str(date),
                                   str(topic).strip(), now))
                          return {"meeting_id": mid,
                                  "student_id": student_id,
                                  "date": str(date),
                                  "topic": str(topic).strip(),
                                  "status": "SCHEDULED"}
              '''))

              forzar(AN + "/dropout_prediction_engine.py", D(r'''
                  """Dropout Prediction (SM4). Informativo (57)."""
                  from __future__ import annotations
                  from typing import Dict

                  class DropoutPredictionEngine:
                      """Riesgo de abandono escolar (informativo)."""

                      def __init__(self, attendance_engine,
                                   evaluation_engine,
                                   emotional_engine=None):
                          self._att = attendance_engine
                          self._eval = evaluation_engine
                          self._emo = emotional_engine

                      def assess(self, student_id) -> Dict:
                          factors = []
                          risk = "LOW"
                          rank = {"LOW": 0, "MEDIUM": 1,
                                  "HIGH": 2}
                          att_pct = None
                          att = self._att.rate(student_id)
                          if att["total"] > 0:
                              att_pct = (att
                                         ["present_rate_pct"])
                          avg_val = None
                          avg = self._eval.average_of(student_id)
                          if avg["count"] > 0:
                              avg_val = float(avg["average"])
                          emo_level = None
                          if self._emo is not None:
                              st = self._emo.emotional_state(
                                  student_id)
                              if st["records"]:
                                  emo_level = (st
                                               ["current_level"])
                          if (att_pct is None and avg_val is None
                                  and emo_level is None):
                              return {"student_id": student_id,
                                      "risk_level":
                                          "INSUFFICIENT_DATA",
                                      "factors": [],
                                      "recommendation":
                                          "sin datos suficientes"
                                          " para evaluar"}
                          if att_pct is not None:
                              if att_pct < 70.0:
                                  factors.append(
                                      "asistencia critica ("
                                      + str(att_pct) + "%)")
                                  risk = "HIGH"
                              elif att_pct < 85.0:
                                  factors.append(
                                      "asistencia baja ("
                                      + str(att_pct) + "%)")
                                  if rank["MEDIUM"] > rank[risk]:
                                      risk = "MEDIUM"
                          if avg_val is not None:
                              if avg_val < 5.0:
                                  factors.append(
                                      "promedio critico ("
                                      + str(avg_val) + ")")
                                  risk = "HIGH"
                              elif avg_val < 7.0:
                                  factors.append(
                                      "promedio bajo ("
                                      + str(avg_val) + ")")
                                  if rank["MEDIUM"] > rank[risk]:
                                      risk = "MEDIUM"
                          if emo_level == "CRITICAL":
                              factors.append(
                                  "alerta emocional critica")
                              risk = "HIGH"
                          elif emo_level == "ALERT":
                              factors.append("alerta emocional")
                              if rank["MEDIUM"] > rank[risk]:
                                  risk = "MEDIUM"
                          return {"student_id": student_id,
                                  "risk_level": risk,
                                  "factors": factors,
                                  "attendance_pct": att_pct,
                                  "average": avg_val,
                                  "emotional_state": emo_level,
                                  "recommendation":
                                      ("acompanamiento inmediato:"
                                       " contactar al encargado"
                                       " y activar apoyo"
                                       if risk == "HIGH" else
                                       "dar seguimiento cercano"
                                       if risk == "MEDIUM" else
                                       "sin riesgo detectado")}
              '''))

              out("## FIN fix quirurgico: 5 archivos")
          except Exception:
              out("## BUILDER ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] SM3+SM4 tests"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_sm3_talento_economia.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.student.talent_engine import TalentEngine
          from apps.semilla.domain.scholarship.scholarship_engine import ScholarshipEngine
          from apps.semilla.domain.finance.school_payments_gateway import SchoolPaymentsGateway
          from apps.semilla.domain.finance.education_economy_engine import EducationEconomyEngine
          from apps.semilla.domain.evaluation.evaluation_engine import EvaluationEngine
          from apps.semilla.domain.attendance.attendance_engine import AttendanceEngine
          from apps.semilla.domain.notifications.alert_engine import AlertEngine
          from apps.semilla.application.student_use_cases.detect_talent_use_case import DetectTalentUseCase
          from apps.semilla.application.scholarship_use_cases.apply_scholarship_use_case import ApplyScholarshipUseCase

          def test_talento_registro_mentoria_aceleracion(tmp_path) -> None:
              al = AlertEngine(SQLiteAdapter(tmp_path / "a.db"),
                               FrozenClock())
              t = TalentEngine(SQLiteAdapter(tmp_path / "t.db"),
                               FrozenClock(), alert_engine=al)
              tal = t.register_talent(student_id="STU-1",
                  category="MATEMATICAS", detail="promedio 9.8",
                  source="TUTOR", score="9.8")
              assert tal["status"] == "DETECTED"
              assert len(al.unread("STU-1")) == 1
              m = t.assign_mentor(talent_id=tal["talent_id"],
                  mentor_name="Ing. Rivas", mentor_ref="MIT-CLUB")
              assert m["status"] == "MENTORED"
              ac = t.accelerate(talent_id=tal["talent_id"],
                  detail="paso a olimpiada nacional")
              assert ac["status"] == "ACCELERATED"
              assert len(t.national_registry()) == 1
              with pytest.raises(ValueError):
                  t.register_talent(student_id="STU-1",
                                    category="", detail="x")
              print("OK talento: detectar->mentor->acelerar + alerta + registro nacional")

          def test_usecase_detecta_talentos_por_promedio(tmp_path) -> None:
              ev = EvaluationEngine(
                  SQLiteAdapter(tmp_path / "ev.db"), FrozenClock())
              t = TalentEngine(SQLiteAdapter(tmp_path / "t2.db"),
                               FrozenClock())
              ev.register(student_id="STU-2", subject="Matematica",
                  period="P1", score="9.8")
              ev.register(student_id="STU-2", subject="Fisica",
                  period="P1", score="9.2")
              ev.register(student_id="STU-2", subject="Lenguaje",
                  period="P1", score="6.0")
              uc = DetectTalentUseCase(ev, t, min_average="9.00")
              r = uc.execute(student_id="STU-2")
              assert r["talents_registered"] == 2
              cats = [x["category"] for x in r["talents"]]
              assert "Matematica" in cats and "Fisica" in cats
              assert "Lenguaje" not in cats
              print("OK use case talento: execute existe y detecta por umbral 9.0")

          def test_beca_flujo_completo(tmp_path) -> None:
              ev = EvaluationEngine(
                  SQLiteAdapter(tmp_path / "ev.db"), FrozenClock())
              at = AttendanceEngine(
                  SQLiteAdapter(tmp_path / "at.db"), FrozenClock())
              sch = ScholarshipEngine(
                  SQLiteAdapter(tmp_path / "s.db"), FrozenClock(),
                  evaluation_engine=ev, attendance_engine=at)
              for subj in ("Matematica", "Lenguaje", "Ciencias"):
                  ev.register(student_id="STU-G", subject=subj,
                      period="P1", score="9.0")
              at.record(student_id="STU-G", date="2026-03-01",
                  status="PRESENTE")
              prg = sch.create_program(name="Beca Excelencia",
                  funder="Fondo ZYRA", min_average="8.00",
                  min_attendance_pct=85.0, slots=1)
              uc = ApplyScholarshipUseCase(sch)
              r = uc.execute(program_id=prg["program_id"],
                  student_id="STU-G")
              assert r["application"]["status"] == "APPROVED"
              d = sch.disburse(
                  application_id=r["application"]["application_id"],
                  amount="500.00", method="transferencia")
              assert d["status"] == "DISBURSED"
              assert d["disbursed_amount"] == "500.00"
              print("OK beca: aplicar->evaluar->APPROVED->desembolsar")

          def test_beca_rechazos_por_criterios_y_slots(tmp_path) -> None:
              ev = EvaluationEngine(
                  SQLiteAdapter(tmp_path / "ev2.db"), FrozenClock())
              at = AttendanceEngine(
                  SQLiteAdapter(tmp_path / "at2.db"), FrozenClock())
              sch = ScholarshipEngine(
                  SQLiteAdapter(tmp_path / "s2.db"), FrozenClock(),
                  evaluation_engine=ev, attendance_engine=at)
              prg = sch.create_program(name="Beca Unica",
                  min_average="8.00", min_attendance_pct=85.0,
                  slots=1)
              ev.register(student_id="STU-MAL", subject="X",
                  period="P1", score="6.0")
              ev.register(student_id="STU-BN", subject="X",
                  period="P1", score="9.0")
              ev.register(student_id="STU-B2", subject="X",
                  period="P1", score="9.0")
              at.record(student_id="STU-BN", date="2026-03-01",
                  status="PRESENTE")
              at.record(student_id="STU-B2", date="2026-03-01",
                  status="PRESENTE")
              a1 = sch.apply(program_id=prg["program_id"],
                  student_id="STU-MAL")
              r1 = sch.evaluate(a1["application_id"])
              assert r1["status"] == "REJECTED"
              assert "criterios" in r1["reason"]
              a2 = sch.apply(program_id=prg["program_id"],
                  student_id="STU-BN")
              r2 = sch.evaluate(a2["application_id"])
              assert r2["status"] == "APPROVED"
              a3 = sch.apply(program_id=prg["program_id"],
                  student_id="STU-B2")
              r3 = sch.evaluate(a3["application_id"])
              assert r3["status"] == "REJECTED"
              assert "slots" in r3["reason"]
              with pytest.raises(ValueError):
                  sch.apply(program_id=prg["program_id"],
                      student_id="STU-BN")
              print("OK beca rechazos: no cumple criterios + sin slots + duplicado")

