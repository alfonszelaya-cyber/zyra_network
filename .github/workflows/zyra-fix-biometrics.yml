name: "AGRO RUN F: GPT-8 ecosistema - catalogo tipado + idempotencia + outbox + status de Red"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - zyra_link: catalogo de eventos + outbox con idempotencia"
        run: |
          python3 - <<'LKEOF'
          import textwrap
          from pathlib import Path

          p = Path("apps/agro/services/zyra_link.py")
          t = p.read_text(encoding="utf-8")
          if "AGRO_EVENT_CATALOG" in t:
              print("SKIP zyra_link RUN F")
              raise SystemExit(0)

          extra = textwrap.dedent('''\


              # ---- additive RUN F (GPT-8): ecosistema ----
              # Contrato tipado de eventos AGRO->Red. Las demas
              # apps (NEXO contable, SUBASTAS mercado, AXIS
              # historial de vida, SEMILLA) leen estos eventos
              # del history del ZID en la Red: las apps nunca se
              # hablan entre si, hablan con la Red.
              AGRO_EVENT_CATALOG = {
                  "producer.registered": ("producer_id",),
                  "producer.verified": ("producer_id",),
                  "asset.registered": (
                      "producer_id", "asset_type", "asset_id",
                  ),
                  "unit.created": ("producer_id", "unit_id"),
                  "plan.created": ("producer_id", "plan_id"),
                  "plan.harvested": ("producer_id", "plan_id"),
                  "sale.created": ("producer_id", "sale_id"),
                  "sale.completed": ("producer_id", "sale_id"),
                  "risk.detected": ("producer_id", "risk_type"),
                  "incident.created": (
                      "producer_id", "incident_id",
                  ),
                  "aid.requested": ("producer_id", "aid_id"),
                  "aid.delivered": ("producer_id", "aid_id"),
              }


              def validate_agro_event(event_type, payload):
                  """Valida el contrato: tipo en catalogo y
                  campos requeridos presentes. Rechaza antes
                  de tocar la Red."""
                  if str(event_type) not in AGRO_EVENT_CATALOG:
                      raise ValueError(
                          "evento desconocido: "
                          + str(event_type)
                          + " (catalogo: "
                          + ", ".join(
                              sorted(AGRO_EVENT_CATALOG)
                          )
                          + ")"
                      )
                  required = AGRO_EVENT_CATALOG[
                      str(event_type)
                  ]
                  missing = []
                  for field in required:
                      if not str(
                          (payload or {}).get(field) or ""
                      ).strip():
                          missing.append(field)
                  if missing:
                      raise ValueError(
                          "campos faltantes: "
                          + ", ".join(missing)
                      )
                  return True


              def _event_key(event_type, payload):
                  import hashlib as _hl
                  import json as _json
                  canonical = _json.dumps(
                      payload or {}, sort_keys=True
                  )
                  return _hl.sha256(
                      (str(event_type) + "|"
                       + canonical).encode("utf-8")
                  ).hexdigest()


              def _outbox_db(db):
                  db.execute(
                      "CREATE TABLE IF NOT EXISTS"
                      " agro_event_outbox ("
                      " event_key TEXT PRIMARY KEY,"
                      " event_type TEXT NOT NULL,"
                      " payload TEXT NOT NULL,"
                      " zid TEXT,"
                      " status TEXT NOT NULL,"
                      " attempts INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " last_error TEXT,"
                      " created_at TEXT,"
                      " updated_at TEXT)"
                  )


              def emit_event_db(
                  db, link, *, zid,
                  event_type, payload,
              ):
                  """Emision con idempotencia (GPT-8): el
                  mismo evento (mismo tipo+payload) nunca
                  se duplica en la Red, haya fallado o no
                  el primer intento. Reintentos aumentan
                  attempts sin duplicar."""
                  import json as _json
                  import time as _t
                  validate_agro_event(event_type, payload)
                  key = _event_key(event_type, payload)
                  _outbox_db(db)
                  row = None
                  for fname in ("query_one", "query"):
                      fn = getattr(db, fname, None)
                      if callable(fn):
                          try:
                              row = fn(
                                  "SELECT status FROM"
                                  " agro_event_outbox WHERE"
                                  " event_key = ?",
                                  (key,),
                              )
                          except Exception:
                              row = None
                          if row:
                              break
                  if row:
                      try:
                          prior = str(row["status"])
                      except Exception:
                          prior = str(row[0])
                      if prior == "sent":
                          return {
                              "event_key": key,
                              "deduplicated": True,
                              "status": "sent",
                          }
                  payload_json = _json.dumps(
                      payload or {}, sort_keys=True
                  )
                  detail = _json.dumps(
                      {
                          "event_type": str(event_type),
                          **(payload or {}),
                      },
                      sort_keys=True,
                  )
                  ok, data, err = link.record_agro_event(
                      zid, str(event_type), detail
                  )
                  ts = _t.strftime(
                      "%Y-%m-%dT%H:%M:%SZ", _t.gmtime()
                  )
                  status = "sent" if ok else "failed"
                  if row:
                      db.execute(
                          "UPDATE agro_event_outbox SET"
                          " status = ?, attempts ="
                          " attempts + 1, last_error = ?,"
                          " zid = ?, updated_at = ? WHERE"
                          " event_key = ?",
                          (status, str(err or ""),
                           str(zid), ts, key),
                      )
                  else:
                      db.execute(
                          "INSERT INTO"
                          " agro_event_outbox ("
                          " event_key, event_type,"
                          " payload, zid, status,"
                          " attempts, last_error,"
                          " created_at, updated_at)"
                          " VALUES (?, ?, ?, ?, ?, 1, ?,"
                          " ?, ?)",
                          (key, str(event_type),
                           payload_json, str(zid),
                           status, str(err or ""),
                           ts, ts),
                      )
                  return {
                      "event_key": key,
                      "sent": bool(ok),
                      "status": status,
                      "error": str(err) if err else None,
                  }


              def outbox_stats_db(db):
                  rows = []
                  for name in (
                      "query_all", "query", "fetchall"
                  ):
                      fn = getattr(db, name, None)
                      if callable(fn):
                          try:
                              got = fn(
                                  "SELECT status, COUNT(*)"
                                  " AS n FROM"
                                  " agro_event_outbox GROUP"
                                  " BY status"
                              )
                          except Exception:
                              got = None
                          if got:
                              rows = list(got)
                              break
                  by_status = {}
                  total = 0
                  for r in rows:
                      try:
                          st = str(r["status"])
                          n = int(r["n"])
                      except Exception:
                          continue
                      by_status[st] = n
                      total += n
                  return {
                      "total": total,
                      "by_status": by_status,
                  }


              def outbox_pending_db(db, limit=20):
                  for name in ("query_all", "query", "fetchall"):
                      fn = getattr(db, name, None)
                      if callable(fn):
                          try:
                              got = fn(
                                  "SELECT event_key,"
                                  " event_type, payload, zid,"
                                  " status, attempts,"
                                  " last_error, updated_at"
                                  " FROM agro_event_outbox"
                                  " WHERE status != 'sent'"
                                  " ORDER BY updated_at"
                                  " LIMIT ?",
                                  (int(limit),),
                              )
                          except Exception:
                              got = None
                          if got:
                              return [dict(r) for r in got]
                  return []


              def retry_pending_db(
                  db, link, zid, limit=10,
              ):
                  """Reintento de pendientes (GPT-8: manejo
                  de fallos). Cada reintento respeta la
                  idempotencia: si la Red ya lo recibio en
                  un intento previo, no duplica."""
                  rows = outbox_pending_db(db, limit=limit)
                  results = []
                  for r in rows:
                      try:
                          payload = json.loads(
                              str(r.get("payload"))
                          )
                      except Exception:
                          payload = {}
                      res = emit_event_db(
                          db, link,
                          zid=str(r.get("zid") or zid),
                          event_type=str(r.get("event_type")),
                          payload=payload,
                      )
                      results.append(res)
                  return {
                      "retried": len(results),
                      "results": results,
                  }
          ''')

          t = t.rstrip("\n") + "\n" + extra
          compile(t, str(p), "exec")

          # network_status() como metodo de instancia
          t2 = p.read_text(encoding="utf-8")
          if "def network_status(" not in t2:
              meth = (
                  "\n"
                  "    def network_status(self):\n"
                  "        \"\"\"GPT-8: salud del enlace\n"
                  "        AGRO->Red en vivo.\"\"\"\n"
                  "        ok, data, err = self._client.get(\n"
                  "            \"/health\"\n"
                  "        )\n"
                  "        return {\n"
                  "            \"reachable\": bool(ok),\n"
                  "            \"error\": (\n"
                  "                str(err) if err else None\n"
                  "            ),\n"
                  "            \"catalog_events\": len(\n"
                  "                AGRO_EVENT_CATALOG\n"
                  "            ),\n"
                  "        }\n"
              )
              t2 = t2.rstrip("\n") + "\n" + meth
              compile(t2, str(p), "exec")
              p.write_text(t2, encoding="utf-8")
          else:
              p.write_text(t2, encoding="utf-8")
          print("OK zyra_link RUN F")
          LKEOF

      - name: "Paso 2 - matriz: network.emit (aditivo)"
        run: |
          python3 - <<'MXEOF'
          import textwrap
          from pathlib import Path
          p = Path("apps/agro/security/operation_matrix.py")
          t = p.read_text(encoding="utf-8")
          if '"network.emit"' in t:
              print("SKIP matrix")
              raise SystemExit(0)
          extra = textwrap.dedent('''

              # ---- additive RUN F: ops ecosistema ----
              OPERATIONS.update({
                  "network.emit": (
                      PRODUCER, COMPANY, GOVERNMENT,
                      OPERATOR, ADMINISTRATOR,
                  ),
              })
          ''')
          t = t.rstrip("\n") + "\n" + extra
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          print("OK matrix RUN F")
          MXEOF

      - name: "Paso 3 - server: rutas GET network/status y network/outbox"
        run: |
          python3 - <<'GETEOF'
          from pathlib import Path

          sp = Path("apps/agro/server.py")
          t = sp.read_text(encoding="utf-8")
          if 'if s == ["network", "status"]:' in t:
              print("SKIP GET ya presentes")
              raise SystemExit(0)
          anchor_home = "        if not s or s == [\"home\"]:\n"
          if anchor_home not in t:
              print("MISS ancla home")
              raise SystemExit(1)
          R = []
          R.append("        if s == [\"network\", \"status\"]:\n")
          R.append("            st_row = type(self).link.network_status()\n")
          R.append("            from apps.agro.services.zyra_link import (\n")
          R.append("                outbox_stats_db,\n")
          R.append("            )\n")
          R.append("            st_row[\"outbox\"] = outbox_stats_db(\n")
          R.append("                type(self).store._db\n")
          R.append("            )\n")
          R.append("            self._send(200, {\"ok\": True, \"data\": st_row})\n")
          R.append("            return\n")
          R.append("        if s == [\"network\", \"outbox\"]:\n")
          R.append("            from apps.agro.services.zyra_link import (\n")
          R.append("                outbox_pending_db,\n")
          R.append("            )\n")
          R.append("            rows = outbox_pending_db(\n")
          R.append("                type(self).store._db, limit=20\n")
          R.append("            )\n")
          R.append("            self._send(\n")
          R.append("                200,\n")
          R.append("                {\"ok\": True, \"data\": {\"pending\": rows}},\n")
          R.append("            )\n")
          R.append("            return\n")
          t = t.replace(anchor_home, "".join(R) + anchor_home, 1)
          compile(t, str(sp), "exec")
          sp.write_text(t, encoding="utf-8")
          print("OK rutas GET network (2)")
          GETEOF

      - name: "Paso 4 - server: ruta POST network/emit + guardia"
        run: |
          python3 - <<'POSTEOF'
          from pathlib import Path

          sp = Path("apps/agro/server.py")
          t = sp.read_text(encoding="utf-8")
          if 'if s == ["network", "emit"]:' in t:
              print("SKIP POST ya presente")
              raise SystemExit(0)
          ancla = '        if s == ["sale", "publish"]:\n'
          if ancla not in t:
              print("MISS ancla sale/publish")
              raise SystemExit(1)
          P = []
          P.append("        if s == [\"network\", \"emit\"]:\n")
          P.append("            doc = self._ZYRA_PAYLOAD_V2(is_json)\n")
          P.append("            zid = self._req(doc, \"zid\")\n")
          P.append("            et = self._req(doc, \"event_type\")\n")
          P.append("            payload = doc.get(\"payload\")\n")
          P.append("            if not isinstance(payload, dict):\n")
          P.append("                raise ValueError(\n")
          P.append("                    \"payload debe ser objeto\"\n")
          P.append("                )\n")
          P.append("            row = self._ZYRA_FN_V6(\n")
          P.append("                \"apps.agro.services.zyra_link\",\n")
          P.append("                \"emit_event_db\",\n")
          P.append("            )(\n")
          P.append("                type(self).store._db,\n")
          P.append("                type(self).link,\n")
          P.append("                zid=zid,\n")
          P.append("                event_type=et,\n")
          P.append("                payload=payload,\n")
          P.append("            )\n")
          P.append("            self._send(200, {\"ok\": True, \"data\": row})\n")
          P.append("            return\n")
          t = t.replace(ancla, "".join(P) + ancla, 1)

          ancla_g = '            ("response", "update"): "response.update",\n'
          if ancla_g not in t:
              print("MISS ancla guardia response/update")
              raise SystemExit(1)
          t = t.replace(
              ancla_g,
              ancla_g
              + '            ("network", "emit"): "network.emit",\n',
              1,
          )
          compile(t, str(sp), "exec")
          sp.write_text(t, encoding="utf-8")
          print("OK POST network/emit + guardia")
          POSTEOF

      - name: "Paso 5 - tests RUN F anadidos a test_agro_superapp.py"
        run: |
          python3 - <<'T3EOF'
          import textwrap
          from pathlib import Path

          p = Path("apps/agro/tests/test_agro_superapp.py")
          t = p.read_text(encoding="utf-8")
          if "test_ecosystem_contract_offline" in t:
              print("SKIP superapp RUN F")
              raise SystemExit(0)

          EXTRA = textwrap.dedent('''\


              # ====== RUN F: GPT-8 ecosistema ======


              def test_ecosystem_contract_offline(
                  tmp_path: Path,
              ) -> None:
                  dead = NetworkClient(
                      "http://127.0.0.1:1",
                      timeout_seconds=1.0,
                      max_retries=0,
                  )
                  srv = serve_agro(
                      AgroStore(
                          SQLiteAdapter(":memory:"), FrozenClock()
                      ),
                      dead,
                  )
                  threading.Thread(
                      target=srv.serve_forever, daemon=True
                  ).start()
                  time.sleep(0.4)
                  base = f"http://127.0.0.1:{srv.bound_port}"
                  pid = _register(base, "Karla Eco")

                  st, body = _pj(
                      base + "/agro/network/emit",
                      {
                          "zid": "ZID-x",
                          "event_type": "hack.borro",
                          "payload": {"producer_id": pid},
                      },
                  )
                  assert st == 400, "evento desconocido 400"
                  assert "desconocido" in str(body)

                  st, body = _pj(
                      base + "/agro/network/emit",
                      {
                          "zid": "ZID-x",
                          "event_type": "asset.registered",
                          "payload": {"producer_id": pid},
                      },
                  )
                  assert st == 400, "campo faltante 400"
                  assert "asset_id" in str(body)

                  st, body = _pj(
                      base + "/agro/network/emit",
                      {
                          "zid": "ZID-x",
                          "event_type":
                          "producer.registered",
                          "payload": {"producer_id": pid},
                      },
                  )
                  assert st == 200, str(body)
                  key = body["data"]["event_key"]
                  assert body["data"]["sent"] is False
                  assert body["data"]["status"] == "failed"

                  st, body = _pj(
                      base + "/agro/network/emit",
                      {
                          "zid": "ZID-x",
                          "event_type":
                          "producer.registered",
                          "payload": {"producer_id": pid},
                      },
                  )
                  assert st == 200, str(body)
                  assert (
                      body["data"]["event_key"] == key
                  )
                  assert (
                      body["data"].get("deduplicated")
                      is None
                  ), "no enviado no deduplica"

                  st, body = _gjp(
                      base + "/agro/network/status"
                  )
                  d = body["data"]
                  assert d["reachable"] is False
                  assert d["catalog_events"] >= 12
                  assert d["outbox"]["total"] >= 1

                  st, body = _gjp(
                      base + "/agro/network/outbox"
                  )
                  pend = body["data"]["pending"]
                  assert len(pend) >= 1
                  assert pend[0]["attempts"] == 2


              def test_ecosystem_to_network_online(
                  tmp_path: Path,
              ) -> None:
                  net_db = SQLiteAdapter(tmp_path / "net.db")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None,
                      ),
                  )
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(
                      db=net_db,
                      clock=FrozenClock(),
                      audit=kernel.audit,
                      provider=DeterministicTestProvider(),
                      cipher=TemplateCipher(
                          master_key_hex="ab" * 32
                      ),
                      policy=BiometricsPolicy(
                          require_liveness=False,
                          doc_reject=0.01,
                          doc_review=0.02,
                          doc_auto=0.03,
                          dup_reject=0.98,
                      ),
                  )
                  caps = ZyraCapabilities(
                      net_db,
                      FrozenClock(),
                      identity=kernel.identity,
                      signer=signer,
                  )
                  net_srv = serve_combined(
                      kernel,
                      caps,
                      host="127.0.0.1",
                      port=0,
                  )
                  threading.Thread(
                      target=net_srv.serve_forever,
                      daemon=True,
                  ).start()
                  time.sleep(0.4)
                  net_base = (
                      "http://127.0.0.1:"
                      f"{net_srv.server_address[1]}"
                  )

                  client = NetworkClient(
                      net_base, max_retries=1
                  )
                  reg = ZyraLink(client).register_app()
                  assert reg[0] is True, str(reg[2])

                  srv = serve_agro(
                      AgroStore(
                          SQLiteAdapter(":memory:"), FrozenClock()
                      ),
                      client,
                  )
                  threading.Thread(
                      target=srv.serve_forever, daemon=True
                  ).start()
                  time.sleep(0.4)
                  base = f"http://127.0.0.1:{srv.bound_port}"

                  st, body = _pj(
                      base + "/agro/producers",
                      {
                          "name": "Luis EnRed",
                          "producer_type": "agricultor",
                          "location": "Chalatenango",
                          "doc_image_b64": _seed(
                              "Luis EnRed"
                          ),
                          "selfie_image_b64": _seed(
                              "Luis EnRed"
                          ),
                      },
                  )
                  assert st == 201, str(body)
                  pid = body["data"]["producer_id"]
                  zid = body["data"]["zid"]
                  assert zid and zid.startswith("ZID-")

                  st, body = _pj(
                      base + "/agro/network/emit",
                      {
                          "zid": zid,
                          "event_type":
                          "producer.registered",
                          "payload": {"producer_id": pid},
                      },
                  )
                  assert st == 200, str(body)
                  assert body["data"]["sent"] is True, str(
                      body
                  )
                  key = body["data"]["event_key"]

                  st, body = _pj(
                      base + "/agro/network/emit",
                      {
                          "zid": zid,
                          "event_type":
                          "producer.registered",
                          "payload": {"producer_id": pid},
                      },
                  )
                  assert st == 200, str(body)
                  assert (
                      body["data"]["deduplicated"]
                      is True
                  ), "idempotencia contra Red viva"

                  st, body = _gjp(
                      base + "/agro/network/status"
                  )
                  d = body["data"]
                  assert d["reachable"] is True, str(d)
                  assert d["outbox"]["by_status"].get(
                      "sent"
                  ) == 1

                  req = urllib.request.Request(
                      net_base + "/history/" + zid,
                      method="GET",
                  )
                  with urllib.request.urlopen(
                      req, timeout=10
                  ) as r:
                      hist = r.read().decode()
                  assert (
                      "producer.registered" in hist
                  ), "evento no visible en la Red"
              ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          print("OK superapp +2 RUN F")
          T3EOF

      - name: "Paso 6 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN F: GPT-8 ecosistema via la Red" -m "Catalogo tipado de 12 eventos validado antes de enviar (desconocidos y campos faltantes rechazados 400); idempotencia por event_key (retry no duplica, dedup contra Red viva); outbox persistente con attempts y last_error; network/status con health real de la Red + stats; network/outbox de pendientes; verificacion inter-app: evento visible en /history/{zid} de la Red para NEXO/SEMILLA/MPE/AXIS; matrix network.emit; tests offline+online en archivo existente."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
