              from __future__ import annotations
              from apps.nexo.domain.operations.operations_engine import (
                  OperationsEngine)
              from apps.nexo.domain.operations.operations_validation_engine import (
                  OperationsValidationEngine)
              from apps.nexo.domain.operations.process_tracking_engine import (
                  ProcessTrackingEngine)

              class ExecuteOperationUseCase:
                  """Valida, aprueba y ejecuta una operacion dejando
                  trazabilidad completa. La operacion debe estar en
                  PENDING. Si la validacion falla -> REJECTED."""

                  def __init__(self, operations, validations,
                               tracking):
                      self._ops = operations
                      self._val = validations
                      self._track = tracking

                  def execute(self, *, operation_id, amount,
                              description, actor) -> dict:
                      op = self._ops.get_operation(operation_id)
                      if not op:
                          return {"operation_id": operation_id,
                                  "executed": False,
                                  "reason": "not_found"}
                      if op["status"] != "PENDING":
                          return {"operation_id": operation_id,
                                  "executed": False,
                                  "reason": "estado="
                                            + op["status"]}
                      v = self._val.validate_operation(
                          operation_id=operation_id,
                          amount=amount, description=description)
                      if not v["valid"]:
                          self._ops.transition(
                              operation_id=operation_id,
                              new_status="REJECTED", actor=actor)
                          self._track.append_event(
                              process_id=operation_id,
                              event_type="REJECTED", actor=actor,
                              detail="validacion fallo")
                          return {"operation_id": operation_id,
                                  "executed": False,
                                  "reason": "validacion",
                                  "validations": v}
                      self._ops.transition(operation_id=operation_id,
                                           new_status="VALIDATED",
                                           actor=actor)
                      self._ops.transition(operation_id=operation_id,
                                           new_status="APPROVED",
                                           actor=actor)
                      self._ops.transition(operation_id=operation_id,
                                           new_status="IN_PROGRESS",
                                           actor=actor)
                      final = self._ops.transition(
                          operation_id=operation_id,
                          new_status="COMPLETED", actor=actor)
                      self._track.append_event(
                          process_id=operation_id,
                          event_type="COMPLETED", actor=actor,
                          detail="operacion ejecutada")
                      return {"operation_id": operation_id,
                              "executed": True,
                              "status": final["status"],
                              "operation_number":
                                  final["operation_number"]}
          '''))

          forzar(UCO + "/validate_operation_use_case.py", D(r'''
              from __future__ import annotations
              from apps.nexo.domain.operations.operations_validation_engine import (
                  OperationsValidationEngine)
              from apps.nexo.domain.operations.operational_control_engine import (
                  OperationalControlEngine)

              class ValidateOperationUseCase:
                  """Valida operacion + corre controles de limite de
                  monto y duplicado. Todo queda registrado."""

                  def __init__(self, validations, controls):
                      self._val = validations
                      self._ctrl = controls

                  def execute(self, *, operation_id, amount,
                              description, amount_limit,
                              fingerprint="",
                              previous_fingerprints=None) -> dict:
                      v = self._val.validate_operation(
                          operation_id=operation_id,
                          amount=amount, description=description)
                      c1 = self._ctrl.register_control(
                          operation_id=operation_id,
                          control_type="AMOUNT_LIMIT")
                      r1 = self._ctrl.check_amount_limit(
                          control_id=c1["control_id"],
                          amount=amount, limit=amount_limit)
                      c2 = self._ctrl.register_control(
                          operation_id=operation_id,
                          control_type="DUPLICATE")
                      r2 = self._ctrl.check_duplicate(
                          control_id=c2["control_id"],
                          fingerprint=fingerprint,
                          previous_fingerprints=
                          previous_fingerprints)
                      ok = (v["valid"] and r1["passed"]
                            and r2["passed"])
                      return {"operation_id": operation_id,
                              "valid": ok,
                              "validation": v,
                              "amount_limit": r1,
                              "duplicate_check": r2}
          '''))

