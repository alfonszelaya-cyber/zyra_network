name: ZYRA D22 iconos oficiales desde tus imagenes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD22:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml pillow
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: Iconos y tarjetas
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          from PIL import Image
          ROOT = Path.cwd()
          SPY = ROOT / 'superapp.py'
          PT = ROOT / 'portal'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 'faseD22.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None):
              q = urllib.request.Request(url)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  r = OP.open(q, timeout=20)
                  return r.status, r.headers, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, None, str(e)
          orig = {'sp': SPY.read_bytes()}
          nuevos = []
          def revertir():
              try:
                  SPY.write_bytes(orig['sp'])
                  for n in nuevos:
                      p = PT / n
                      if p.exists():
                          p.unlink()
              except Exception:
                  pass
          EXT = ('.png', '.jpg', '.jpeg', '.webp')
          def imagen_en(carpeta):
              if not carpeta.is_dir():
                  return None
              mejor = None
              for c in sorted(carpeta.iterdir()):
                  if c.is_file() and c.suffix.lower() in EXT and c.stat().st_size > 20000:
                      if mejor is None or c.stat().st_size > mejor.stat().st_size:
                          mejor = c
              return mejor
          add('# D22 - ICONOS OFICIALES DESDE TUS IMAGENES')
          add('')
          add('## A1. Localizar las 9 imagenes')
          add('')
          APP = ROOT / 'aplicaciones'
          principal = None
          if APP.is_dir():
              otros = [x for x in APP.iterdir() if x.is_file()]
          else:
              otros = []
          for c in sorted(ROOT.iterdir()):
              if c.is_file() and c.suffix.lower() in EXT and c.stat().st_size > 200000:
                  if 'icon' not in c.name.lower():
                      principal = c
                      break
          MAPA = [('/mpe', 'mi_primer_empleo'), ('/agro', 'agro'),
                  ('/axis', 'eje'), ('/axis', 'axis'),
                  ('/semilla', 'semilla'), ('/nexo', 'nexo'),
                  ('/subastas', 'subastas'), ('/ciclo', 'ciclo_digital'),
                  ('/laboratorio', 'laboratorio')]
          fuentes = {}
          for pref, carpeta in MAPA:
              if pref in fuentes:
                  continue
              img = imagen_en(APP / carpeta)
              if img:
                  fuentes[pref] = img
                  add('- %s: %s (%d KB)' % (pref, img.relative_to(ROOT), img.stat().st_size // 1024))
              else:
                  add('- %s: IMAGEN NO ENCONTRADA en aplicaciones/%s' % (pref, carpeta))
          if principal:
              add('- PRINCIPAL (Z): %s (%d KB)' % (principal.name, principal.stat().st_size // 1024))
          gate('principal_encontrada', principal is not None)
          gate('apps_encontradas', len(fuentes) == 8)
          if principal is None:
              add('**NO ENCONTRE la imagen Z principal en la raiz. Nada editado.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('faseD22.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('SIN IMAGEN PRINCIPAL')
          add('')
          add('## A2. Generar iconos')
          add('')
          def cuadrada(im):
              w, h = im.size
              lado = min(w, h)
              return im.crop(((w - lado) // 2, (h - lado) // 2, (w - lado) // 2 + lado, (h - lado) // 2 + lado))
          pimg = cuadrada(Image.open(principal).convert('RGBA'))
          pimg.resize((192, 192), Image.LANCZOS).save(PT / 'icon-192.png')
          pimg.resize((512, 512), Image.LANCZOS).save(PT / 'icon-512.png')
          nuevos.extend(['icon-192.png', 'icon-512.png'])
          add('- icon-192.png e icon-512.png = tu Z en el cubo.')
          for pref, img in fuentes.items():
              nombre = 'icon-app' + pref.replace('/', '-') + '.png'
              im = cuadrada(Image.open(img).convert('RGBA'))
              im.resize((256, 256), Image.LANCZOS).save(PT / nombre)
              if nombre not in nuevos:
                  nuevos.append(nombre)
          add('- 8 iconos de app generados: %s' % ', '.join(n for n in nuevos if 'app' in n))
          gate('iconos_generados', True)
          add('')
          add('## A3. superapp.py: ruta de iconos + tarjetas con icono')
          add('')
          t0 = orig['sp'].decode('utf-8')
          hay_ruta = 'path.startswith("/icon-")' in t0
          hay_tarjetas = 'Abrir aplicacion' in t0
          MARCA_INI = '        if path in ("/", "/index.html"):'
          MARCA_FIN = '        if path == "/health":'
          n_i = t0.count(MARCA_INI)
          n_f = t0.count(MARCA_FIN)
          add('- portal: %d/%d | ruta iconos ya: %s | tarjetas ya: %s'
              % (n_i, n_f, hay_ruta, hay_tarjetas))
          ANCLA_LOOP = '        for prefix, info in APPS.items():'
          n_loop = t0.count(ANCLA_LOOP)
          gate('anclas', n_i == 1 and n_f == 1 and n_loop >= 1)
          if not (n_i == 1 and n_f == 1 and n_loop >= 1):
              add('**ANCHORS NO VALIDOS: nada editado.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('faseD22.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS - sin cambios')
          t = t0
          NUEVO_PORTAL = '\n'.join([
          '        if path in ("/", "/index.html"):',
          '            base = self._read_portal("index.html").decode("utf-8")',
          '            zid_s = self._sesion()',
          '            if zid_s:',
          '                estado = (',
          '                    \'<p class="estado ok">Conectado: \' + zid_s',
          '                    + \' &middot; <a href="/salir" style="color:#f85149">Salir</a></p>\')',
          '                tarjetas = ""',
          '                for _pref, _inf in APPS.items():',
          '                    _ic = "/icon-app" + _pref.replace("/", "-") + ".png"',
          '                    tarjetas += (',
          '                        \'<a class="opcion" href="\' + _pref + \'/">\'',
          '                        + \'<img src="\' + _ic + \'" alt="" style="width:46px;height:46px;border-radius:12px;display:block;margin-bottom:8px">\'',
          '                        + \'<b>\' + _inf["label"] + \'</b><span>Abrir aplicacion</span></a>\')',
          '                seccion = (',
          '                    \'<div class="menu">\' + tarjetas + \'</div>\'',
          '                    + \'<p class="tag" style="margin-top:20px;margin-bottom:8px">Verificador publico</p>\'',
          '                    + \'<div class="menu">\'',
          '                    + \'<a class="opcion" href="/verificar"><b>Verificar</b>\'',
          '                    + \'<span>Confirma la autenticidad de un documento</span></a>\'',
          '                    + \'</div>\')',
          '                i1 = base.find(\'<div class="menu">\')',
          '                i2 = base.find(\'</div>\', i1) + len(\'</div>\')',
          '                base = base[:i1] + seccion + base[i2:]',
          '            else:',
          '                estado = ""',
          '            base = base.replace("__ESTADO__", estado, 1)',
          '            self._send_html(200, base)',
          '            return',
          '',
          ])
          t = t[:t.find(MARCA_INI)] + NUEVO_PORTAL + t[t.find(MARCA_FIN):]
          if not hay_ruta:
              RUTA = '\n'.join([
              '        if path.startswith("/icon-") and path.endswith(".png"):',
              '            try:',
              '                datos_i = self._read_portal(path[1:])',
              '            except Exception:',
              '                self._send_html(404, NOT_FOUND_PAGE)',
              '                return',
              '            self._send(200, "image/png", datos_i)',
              '            return',
              '',
              ])
              p = t.find(ANCLA_LOOP)
              t = t[:p] + RUTA + t[p:]
              add('- ruta /icon-*.png agregada.')
          t_idx = (PT / 'index.html').read_text(encoding='utf-8')
          FAV = '<link rel="manifest" href="/manifest.json">'
          if FAV in t_idx and 'rel="icon"' not in t_idx:
              t_idx = t_idx.replace(FAV, FAV + '\n<link rel="icon" type="image/png" href="/icon-192.png">', 1)
              (PT / 'index.html').write_text(t_idx, encoding='utf-8')
              add('- favicon del portal.')
          if (PT / 'version.txt').exists():
              (PT / 'version.txt').write_text('ZYRA-2026.10.12-7\n', encoding='utf-8')
          SPY.write_text(t, encoding='utf-8')
          gate('ediciones', True)
          add('')
          add('## A4. Compilacion')
          add('')
          try:
              py_compile.compile(str(SPY), doraise=True)
              gate('compila', True)
              add('- OK')
          except Exception as e:
              gate('compila', False)
              add('- FALLO: %s' % e)
          add('')
          add('## A5. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zd22', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/sd22', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t1 = time.time()
          while time.time() - t1 < 45:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t1 = time.time()
              while time.time() - t1 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cu = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cu).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps', spv and len(apps) == 8)
          if spv:
              st, h, b = pedir(BSP + '/entrar', data=('zid=Z-DUENO-CI&clave=clave-ci-9999').encode())
              sc = (h.get('Set-Cookie') or '').split(';')[0] if h else ''
              gate('dueno_entrar', st == 303 and sc)
              if sc:
                  st, _h, b = pedir(BSP + '/', {'Cookie': sc})
                  gate('tarjetas_con_icono', st == 200 and 'icon-app' in b
                       and '/laboratorio/' in b and 'Conectado:' in b)
              st, h2, _b = pedir(BSP + '/icon-app-agro.png')
              gate('icono_app_sirve', st == 200 and 'image/png' in (h2.get('Content-Type') or ''))
              st, _h, _b = pedir(BSP + '/icon-192.png')
              gate('principal_sirve', st == 200)
              st, _h, _b = pedir(BSP + '/laboratorio/ui')
              gate('guard_intacto', st == 401)
          else:
              for g in ('dueno_entrar', 'tarjetas_con_icono', 'icono_app_sirve',
                        'principal_sirve', 'guard_intacto'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D22 VERIFICADO. Commit.**')
              add('')
              add('Icono principal = tu Z en el cubo. Cada tarjeta = su cubo 3D de neon.')
              add('Desinstala ZYRA del celular y agregala de nuevo.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('faseD22.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D22 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal index.html 2>/dev/null; git add superapp.py portal
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(D22): iconos oficiales por app desde las imagenes del dueno"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
