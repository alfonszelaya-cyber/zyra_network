    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parchear superapp.py con revD y validar (todo-o-nada)
        run: |
          python3 - <<'PYEOF'
          # =====================================================================
          # Parcheador revD para superapp.py (se ejecuta dentro del workflow).
          # Reglas:
          #   * Localiza superapp.py en el repo (unico archivo con bloque ZYRA-V6).
          #   * Reemplaza SOLO el contenido entre /*ZYRA-V6-BEGIN*/ y /*ZYRA-V6-END*/.
          #   * Verifica que TODO lo demas quede byte a byte igual (esqueleto).
          #   * Valida: py_compile del archivo y node --check del nucleo nuevo.
          #   * Si algo falla, sale con error y NO se publica nada (todo-o-nada).
          # =====================================================================
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys

          BEGIN = "/*ZYRA-V6-BEGIN*/"
          END = "/*ZYRA-V6-END*/"
          PROTECCIONES = ["docVencido", "nombreNoCoincide", "bioRechazada", "tipoDoc"]
          # build_yaml.py sustituye este None por el sha256 real del nucleo probado.
          # Si el pegado llega corrupto (aunque decodifique), el sha no cuadra y se
          # rechaza LIMPIO antes de tocar nada (todo-o-nada, como en revC).
          NUCLEO_SHA_ESPERADO = "2eac58b64518865a2cc5dc2c9078fa68fa6511a3f056a8813a07f55879786d77"


          def falla(msg):
              print("REV-D-ERROR: " + msg)
              sys.exit(1)


          def decodificar_nucleo():
              partes = [
                  os.environ.get("NUCLEO_B64_A", ""),
                  os.environ.get("NUCLEO_B64_B", ""),
                  os.environ.get("NUCLEO_B64_C", ""),
                  os.environ.get("NUCLEO_B64_D", ""),
              ]
              b64 = "".join(partes)
              b64 = "".join(b64.split())
              if not b64:
                  falla("base64 del nucleo vacio (revisa NUCLEO_B64_A..D)")
              try:
                  nuc = base64.b64decode(b64).decode("utf-8")
              except Exception as e:
                  falla("base64 del nucleo no decodifica: %r" % e)
              if NUCLEO_SHA_ESPERADO:
                  sha_real = hashlib.sha256(nuc.encode("utf-8")).hexdigest()
                  if sha_real != NUCLEO_SHA_ESPERADO:
                      falla("el nucleo llego CORROMPIDO (sha256 real %s, esperado %s); "
                            "vuelve a copiar el YAML completo y revisa las partes A-D"
                            % (sha_real, NUCLEO_SHA_ESPERADO))
                  print("REV-D: integridad del nucleo (sha256): OK")
              limpio = nuc.strip()
              while limpio.startswith("/*"):
                  fin = limpio.find("*/")
                  if fin < 0:
                      break
                  limpio = limpio[fin + 2:].lstrip()
              if not limpio.startswith("(function(){"):
                  falla("el nucleo debe iniciar con '(function(){' (tras comentarios)")
              if not limpio.endswith("})();"):
                  falla("el nucleo debe terminar con '})();'")
              if "</script" in nuc.lower():
                  falla("el nucleo no puede contener '</script'")
              if BEGIN in nuc or END in nuc:
                  falla("el nucleo no puede contener los marcadores ZYRA-V6")
              if "PYEOF" in nuc:
                  falla("el nucleo no puede contener la palabra PYEOF")
              ab = nuc.count("{") - nuc.count("}")
              par = nuc.count("(") - nuc.count(")")
              if ab != 0 or par != 0:
                  falla("llaves o parentesis desbalanceados en el nucleo ({:%+d} (:%+d)" % (ab, par))
              return nuc


          def buscar_superapp(raiz):
              candidatos = []
              excluye = {".git", "node_modules", "__pycache__", ".github"}
              for base, dirs, archivos in os.walk(raiz):
                  dirs[:] = [d for d in dirs if d not in excluye]
                  for a in archivos:
                      if a != "superapp.py":
                          continue
                      ruta = os.path.join(base, a)
                      try:
                          with open(ruta, "rb") as f:
                              datos = f.read()
                      except Exception:
                          continue
                      try:
                          texto = datos.decode("utf-8")
                      except Exception:
                          continue
                      if BEGIN in texto and END in texto:
                          candidatos.append(ruta)
              if len(candidatos) == 0:
                  falla("no encontre ningun superapp.py con bloque ZYRA-V6 en el repo")
              if len(candidatos) > 1:
                  falla("hay %d superapp.py con bloque ZYRA-V6: %s" % (len(candidatos), ", ".join(candidatos)))
              return candidatos[0]


          def correr(cmd):
              p = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              if p.returncode != 0:
                  falla("fallo %s:\n%s" % (" ".join(cmd), p.stdout.decode("utf-8", "replace")[-3000:]))
              return p.stdout.decode("utf-8", "replace")


          def main():
              raiz = sys.argv[1] if len(sys.argv) > 1 else "."
              nuc = decodificar_nucleo()

              if shutil.which("node") is None:
                  falla("node no esta disponible en el runner (necesario para validar sintaxis JS)")
              if shutil.which(sys.executable) is None:
                  falla("python no disponible")

              # node --check ANTES de tocar nada: si el nucleo no es JS valido,
              # se rechaza aqui y el archivo queda intacto (todo-o-nada).
              with open("/tmp/zyra_nucleo_revD.js", "w", encoding="utf-8") as f:
                  f.write(nuc)
              correr(["node", "--check", "/tmp/zyra_nucleo_revD.js"])
              print("REV-D: node --check del nucleo (antes de tocar el archivo): OK")

              ruta = buscar_superapp(raiz)
              print("REV-D: archivo objetivo: " + ruta)

              with open(ruta, "rb") as f:
                  datos = f.read()
              try:
                  original = datos.decode("utf-8")
              except Exception as e:
                  falla("superapp.py no es utf-8 valido: %r" % e)

              sha_antes = hashlib.sha256(datos).hexdigest()
              print("REV-D: sha256 antes: " + sha_antes)
              print("REV-D: tamano antes: %d caracteres / %d bytes" % (len(original), len(datos)))

              # Estado previo: marcadores unicos y py_compile del archivo original
              if original.count(BEGIN) != 1 or original.count(END) != 1:
                  falla("los marcadores ZYRA-V6 deben aparecer exactamente 1 vez cada uno (hay %d y %d)"
                        % (original.count(BEGIN), original.count(END)))
              i = original.index(BEGIN)
              j = original.index(END)
              if i >= j:
                  falla("orden de marcadores invalido: BEGIN despues de END")
              correr([sys.executable, "-m", "py_compile", ruta])
              print("REV-D: py_compile del original: OK")

              for p in PROTECCIONES:
                  n = original.count(p)
                  print("REV-D: proteccion base '%s': %d apariciones" % (p, n))

              # Esqueleto = archivo completo SIN el contenido del bloque (marcadores intactos)
              esqueleto_antes = original[: i + len(BEGIN)] + original[j:]

              # Bloque nuevo: nucleo revD completo como expresion IIFE entre marcadores
              reemplazo = original[: i + len(BEGIN)] + "\n" + nuc + "\n" + original[j:]
              nuevos = reemplazo.encode("utf-8")

              # Verificacion 1: el esqueleto no cambio (todo fuera del bloque intacto)
              nuevo_txt = reemplazo
              if nuevo_txt.count(BEGIN) != 1 or nuevo_txt.count(END) != 1:
                  falla("el resultado debe seguir teniendo marcadores unicos")
              i2 = nuevo_txt.index(BEGIN)
              j2 = nuevo_txt.index(END)
              esqueleto_despues = nuevo_txt[: i2 + len(BEGIN)] + nuevo_txt[j2:]
              if esqueleto_antes != esqueleto_despues:
                  falla("conservacion fallida: algo fuera del bloque cambio")

              # Verificacion 2: py_compile del resultado
              with open(ruta, "wb") as f:
                  f.write(nuevos)
              try:
                  correr([sys.executable, "-m", "py_compile", ruta])
              except SystemExit:
                  with open(ruta, "wb") as f:
                      f.write(datos)
                  raise
              print("REV-D: py_compile del parcheado: OK")

              # Verificacion 3: node --check del nucleo nuevo (sintaxis JS real)
              with open("/tmp/zyra_nucleo_revD.js", "w", encoding="utf-8") as f:
                  f.write(nuc)
              correr(["node", "--check", "/tmp/zyra_nucleo_revD.js"])
              print("REV-D: node --check del nucleo: OK")

              # Verificacion 4: protecciones base siguen presentes
              for p in PROTECCIONES:
                  n = nuevo_txt.count(p)
                  if n == 0:
                      with open(ruta, "wb") as f:
                          f.write(datos)
                      falla("la proteccion base '%s' desaparecio; parche revertido" % p)
                  print("REV-D: proteccion '%s' tras parche: %d" % (p, n))

              sha_despues = hashlib.sha256(nuevos).hexdigest()
              resumen = {
                  "rev": "revD",
                  "ok": True,
                  "archivo": ruta,
                  "sha256_antes": sha_antes,
                  "sha256_despues": sha_despues,
                  "caracteres_antes": len(original),
                  "caracteres_despues": len(nuevo_txt),
                  "nucleo_caracteres": len(nuc),
                  "nucleo_lineas": nuc.count("\n") + 1,
                  "esqueleto_intacto": True,
                  "marcadores_unicos": True,
                  "py_compile": "OK",
                  "node_check": "OK",
                  "reglas": [
                      "R1 paso1: solo formato del nombre",
                      "R2 paso2: FRENTE (lado con la cara); camara en marco pequeno",
                      "R3 paso3: REVERSO (direccion/MRZ); nombre mal -> paso 1; mala lectura -> queda en paso 3",
                      "R4 sin saltos ni reinicios: regresa solo al paso que fallo",
                      "R5 selfie: 3 intentos; tras 3 -> regresa al paso que dio la cara y se repite en orden",
                      "R6 claves iguales -> ZID; si no, se queda en paso 5",
                  ],
              }
              os.makedirs("zyra_resumen", exist_ok=True)
              with open("zyra_resumen/resumen_revD.txt", "w", encoding="utf-8") as f:
                  f.write(json.dumps(resumen, ensure_ascii=False, indent=2) + "\n")
              with open("/tmp/zyra_ruta", "w", encoding="utf-8") as f:
                  f.write(ruta)
              print("REV-D: conservacion byte a byte del resto del archivo: VERIFICADA")
              print("REV-D: tamano despues: %d caracteres / %d bytes" % (len(nuevo_txt), len(nuevos)))
              print("REV-D: sha256 despues: " + sha_despues)
              print("REV-D OK: nucleo revD insertado en el bloque marcado unico")
              print("REV-D: ================= RESUMEN PARA EL DUENO =================")
              try:
                  with open("zyra_resumen/resumen_revD.txt", encoding="utf-8") as f:
                      print(f.read())
              except Exception:
                  pass


          if __name__ == "__main__":
              main()
          PYEOF

      - name: Publicar revD (solo si todo valido)
        run: |
          RUTA=$(cat /tmp/zyra_ruta)
          test -f "$RUTA" || { echo "FALTA la ruta del archivo"; exit 1; }
          git config user.name "zyra-bot"
          git config user.email "actions@github.com"
          git add "$RUTA"
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "revD: registro por pasos correcto - regresa solo al paso que falla, frente/reverso verificados por cara y MRZ, 3 intentos de selfie, claves para ZID"
            git push origin HEAD
            echo "REV-D PUBLICADO"
          fi

      - name: Resumen revD (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra-revd-resumen
          path: zyra_resumen/
          if-no-files-found: ignore
