name: "ZYRA EX - regenerar los 3 tests + rutas faltantes (autocontenido, verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: world4d.py completo (citizens+fisica+camara+desastres)
        run: |
          cat > apps/laboratorio/routers/api/world4d.py <<'W4_EOF'
          """Rutas 4D: timeline, luz, interacciones, ciudadanos, fisica + camara orbital + desastres."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.infrastructure.providers.renderer_3d import CamaraOrbital
          from apps.laboratorio.permissions.policies.project_policy import PoliticaProyecto
          from apps.laboratorio.schemas.responses.envelopes import exito

          RUTA_TIMELINE = "/laboratorio/api/v1/scenes/{escena_id}/timeline"
          RUTA_LIGHTING = "/laboratorio/api/v1/scenes/{escena_id}/lighting"
          RUTA_INTERACCIONES = "/laboratorio/api/v1/scenes/{escena_id}/interactions"
          RUTA_CIT_POBLAR = "/laboratorio/api/v1/scenes/{escena_id}/citizens/populate"
          RUTA_CIT_PASO = "/laboratorio/api/v1/scenes/{escena_id}/citizens/step"
          RUTA_CIT_ESTADO = "/laboratorio/api/v1/scenes/{escena_id}/citizens"
          RUTA_CIT_EVACUAR = "/laboratorio/api/v1/scenes/{escena_id}/citizens/evacuate"
          RUTA_FIS_AGREGAR = "/laboratorio/api/v1/scenes/{escena_id}/physics/bodies"
          RUTA_FIS_IMPULSO = "/laboratorio/api/v1/scenes/{escena_id}/physics/bodies/{cuerpo_id}/impulse"
          RUTA_FIS_PASO = "/laboratorio/api/v1/scenes/{escena_id}/physics/step"
          RUTA_FIS_ESTADO = "/laboratorio/api/v1/scenes/{escena_id}/physics"
          RUTA_CAMARA = "/laboratorio/api/v1/scenes/{escena_id}/camara/orbital"
          RUTA_DESASTRE = "/laboratorio/api/v1/scenes/{escena_id}/desastre/simular"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_cuatro_d")
              ciudadanos = app.contenedor.obtener("motor_ciudadanos")
              fisica = app.contenedor.obtener("motor_fisico")
              motor_orbital = app.contenedor.obtener("motor_orbital")
              repo_escenas = app.contenedor.obtener("repo_escenas")
              repo_proyectos = app.contenedor.obtener("repo_proyectos")

              def _escena_verificada(ctx):
                  escena = repo_escenas.obtener_exigir(ctx.ruta_params["escena_id"])
                  proyecto = repo_proyectos.obtener_exigir(str(escena.proyecto_id))
                  PoliticaProyecto.exigir_ver(proyecto, ctx.identidad)
                  return escena

              def _crear_timeline(ctx):
                  return manejador.crear_timeline(ctx.identidad, ctx.ruta_params["escena_id"], ctx.json())

              def _obtener_timeline(ctx):
                  return manejador.obtener_timeline(ctx.identidad, ctx.ruta_params["escena_id"])

              def _crear_luz(ctx):
                  return manejador.crear_luz(ctx.identidad, ctx.ruta_params["escena_id"], ctx.json())

              def _obtener_luz(ctx):
                  return manejador.obtener_luz(ctx.identidad, ctx.ruta_params["escena_id"])

              def _crear_interaccion(ctx):
                  return manejador.crear_interaccion(ctx.identidad, ctx.ruta_params["escena_id"], ctx.json())

              def _listar_interacciones(ctx):
                  return manejador.listar_interacciones(ctx.identidad, ctx.ruta_params["escena_id"])

              def _poblar(ctx):
                  datos = ctx.json()
                  return exito(ciudadanos.poblar(datos.get("ciudadanos", []), datos.get("salidas", [])))

              def _paso_cit(ctx):
                  cuerpo = ctx.json_opcional()
                  return exito(ciudadanos.paso(float((cuerpo or {}).get("dt", 1.0))))

              def _estado_cit(ctx):
                  return exito(ciudadanos.estado_poblacion())

              def _evacuar(ctx):
                  return exito(ciudadanos.evacuar())

              def _fis_agregar(ctx):
                  datos = ctx.json()
                  return exito(fisica.agregar(
                      datos.get("id", "cuerpo-1"), datos.get("x", 0.0), datos.get("y", 0.0),
                      datos.get("w", 10.0), datos.get("h", 10.0),
                      datos.get("masa", 1.0), datos.get("rebote", 0.5)))

              def _fis_impulso(ctx):
                  datos = ctx.json()
                  return exito(fisica.impulso(ctx.ruta_params["cuerpo_id"], datos.get("vx", 0.0), datos.get("vy", 0.0)))

              def _fis_paso(ctx):
                  cuerpo = ctx.json_opcional()
                  return exito(fisica.paso(float((cuerpo or {}).get("dt", 0.016))))

              def _fis_estado(ctx):
                  return exito(fisica.estado())

              def _camara(ctx):
                  escena = _escena_verificada(ctx)
                  datos = ctx.json()
                  camara = CamaraOrbital(distancia=datos.get("distancia", 3.0))
                  camara.girar(float(datos.get("azimut", 0.0)), float(datos.get("elevacion", 35.0)))
                  resultado = motor_orbital.renderizar_orbital(
                      escena,
                      {"ancho": int(datos.get("ancho", 400)), "alto": int(datos.get("alto", 300))},
                      camara,
                  )
                  return 200, resultado.imagen_bytes, {
                      "Content-Type": "image/png",
                      "Cache-Control": "no-store",
                  }

              def _desastre(ctx):
                  _escena_verificada(ctx)
                  datos = ctx.json()
                  plan = ciudadanos.simular_desastre(
                      str(datos.get("tipo", "")),
                      datos.get("epicentro", [0, 0]),
                      datos.get("radio", 50.0),
                      datos.get("zonas_seguras", []),
                  )
                  outbox = app.contenedor.obtener("outbox")
                  outbox.encolar(
                      "laboratorio.desastre.simulado", "zyra/documents/seal",
                      {"titulo": "Simulacion de desastre: " + str(plan["tipo"]),
                       "contenido": {"plan": plan, "escena": ctx.ruta_params["escena_id"]}})
                  stats = outbox.estadisticas()
                  return exito({"plan": plan,
                                "red": {"evento": "laboratorio.desastre.simulado", "estado": stats}})

              app.registrar("POST", RUTA_TIMELINE, _crear_timeline, PermisoCodigo.EDITAR_4D, "Crear linea de tiempo")
              app.registrar("GET", RUTA_TIMELINE, _obtener_timeline, PermisoCodigo.VER, "Obtener linea de tiempo")
              app.registrar("POST", RUTA_LIGHTING, _crear_luz, PermisoCodigo.EDITAR_4D, "Crear programa de luz")
              app.registrar("GET", RUTA_LIGHTING, _obtener_luz, PermisoCodigo.VER, "Obtener programa de luz")
              app.registrar("POST", RUTA_INTERACCIONES, _crear_interaccion, PermisoCodigo.EDITAR_4D, "Crear zona de interaccion")
              app.registrar("GET", RUTA_INTERACCIONES, _listar_interacciones, PermisoCodigo.VER, "Listar interacciones")
              app.registrar("POST", RUTA_CIT_POBLAR, _poblar, PermisoCodigo.EDITAR_4D, "Poblar gemelo con ciudadanos")
              app.registrar("POST", RUTA_CIT_PASO, _paso_cit, PermisoCodigo.EDITAR_4D, "Paso de simulacion social")
              app.registrar("GET", RUTA_CIT_ESTADO, _estado_cit, PermisoCodigo.VER, "Estado de la poblacion")
              app.registrar("POST", RUTA_CIT_EVACUAR, _evacuar, PermisoCodigo.EDITAR_4D, "Evacuacion hacia salidas")
              app.registrar("POST", RUTA_FIS_AGREGAR, _fis_agregar, PermisoCodigo.EDITAR_4D, "Agregar cuerpo fisico")
              app.registrar("POST", RUTA_FIS_IMPULSO, _fis_impulso, PermisoCodigo.EDITAR_4D, "Impulso a un cuerpo")
              app.registrar("POST", RUTA_FIS_PASO, _fis_paso, PermisoCodigo.EDITAR_4D, "Paso de fisica")
              app.registrar("GET", RUTA_FIS_ESTADO, _fis_estado, PermisoCodigo.VER, "Estado del mundo fisico")
              app.registrar("POST", RUTA_CAMARA, _camara, PermisoCodigo.VER, "Vista orbital de la escena (PNG real)")
              app.registrar("POST", RUTA_DESASTRE, _desastre, PermisoCodigo.EDITAR_4D, "Simular desastre: zonas seguras + ayuda + evento a la Red")
          W4_EOF

      - name: presentations.py completo (remote + curso con exito)
        run: |
          cat > apps/laboratorio/routers/api/presentations.py <<'PRES_EOF'
          """Rutas de presentaciones + control remoto + MODO CURSO (EX-4)."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.schemas.responses.envelopes import exito
          from apps.laboratorio.shared.exceptions.domain_errors import EntidadNoEncontradaError

          RUTA_CREAR = "/laboratorio/api/v1/projects/{proyecto_id}/presentations"
          RUTA_ITEM = "/laboratorio/api/v1/presentations/{presentacion_id}"
          RUTA_PLAY = RUTA_ITEM + "/play"
          RUTA_SELLAR = RUTA_ITEM + "/seal"
          RUTA_SESIONES = "/laboratorio/api/v1/presentations/remote"
          RUTA_SESION = RUTA_SESIONES + "/{sesion_id}"
          RUTA_ACCION = RUTA_SESION + "/accion"
          RUTA_TOQUE = RUTA_SESION + "/tocar"
          RUTA_FRAME = RUTA_SESION + "/frame.svg"
          RUTA_VISTA = RUTA_SESION + "/view"
          RUTA_PROYECTAR = RUTA_SESION + "/proyectar"
          RUTA_CURSO_CREAR = "/laboratorio/api/v1/presentations/{presentacion_id}/curso"
          RUTA_CURSO_RESPONDER = "/laboratorio/api/v1/presentations/curso/{curso_id}/responder"
          RUTA_CURSO_CERTIFICAR = "/laboratorio/api/v1/presentations/curso/{curso_id}/certificar"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_presentaciones")
              remota = app.contenedor.obtener("presentacion_remota")
              modocurso = app.contenedor.obtener("modocurso")

              def _sesion_o_404(sesion_id):
                  try:
                      return remota.sesion(sesion_id)
                  except ValueError as exc:
                      raise EntidadNoEncontradaError(str(exc), sesion_id)

              def _crear(ctx):
                  return manejador.crear(ctx.identidad, ctx.ruta_params["proyecto_id"], ctx.json())

              def _listar(ctx):
                  return manejador.listar(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _obtener(ctx):
                  return manejador.obtener(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _reproducir(ctx):
                  return manejador.reproducir(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _sellar(ctx):
                  return manejador.sellar(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _crear_sesion(ctx):
                  datos = ctx.json()
                  return remota.crear_sesion(datos.get("presentacion_id", ""))

              def _listar_sesiones(ctx):
                  return remota.listar_sesiones()

              def _estado(ctx):
                  return _sesion_o_404(ctx.ruta_params["sesion_id"]).estado()

              def _accion(ctx):
                  datos = ctx.json()
                  accion = str(datos.get("accion", "")).strip()
                  sesion = _sesion_o_404(ctx.ruta_params["sesion_id"])
                  if accion == "avanzar":
                      return sesion.avanzar()
                  if accion == "retroceder":
                      return sesion.retroceder()
                  if accion == "ir_a":
                      return sesion.ir_a(datos.get("indice", 0))
                  if accion == "finalizar":
                      return sesion.finalizar()
                  raise ValueError("accion desconocida: " + repr(accion))

              def _tocar(ctx):
                  datos = ctx.json()
                  sesion = _sesion_o_404(ctx.ruta_params["sesion_id"])
                  return sesion.tocar_punto(datos.get("x", 0.0), datos.get("y", 0.0), str(datos.get("etiqueta", "")))

              def _frame(ctx):
                  sesion = _sesion_o_404(ctx.ruta_params["sesion_id"])
                  return 200, sesion.frame_holograma(), {"Content-Type": "image/svg+xml", "Cache-Control": "no-store"}

              def _vista(ctx):
                  sesion_id = ctx.ruta_params["sesion_id"]
                  _sesion_o_404(sesion_id)
                  base = "/laboratorio/api/v1/presentations/remote/" + sesion_id
                  html = ("<!doctype html><html lang='es'><head><meta charset='utf-8'>"
                          "<meta name='viewport' content='width=device-width, initial-scale=1'>"
                          "<title>Control</title><style>body{background:#0B1220;color:#E2E8F0;"
                          "font-family:system-ui,sans-serif;text-align:center;padding:16px}"
                          "button{font-size:22px;margin:6px;padding:14px 22px;border-radius:12px;"
                          "border:1px solid #1E293B;background:#111827;color:#93C5FD}"
                          "img{max-width:100%;border-radius:12px;border:1px solid #1E293B}</style></head><body>"
                          "<h3>Control de proyeccion</h3>"
                          "<img id='f' src='" + base + "/frame.svg'>"
                          "<div><button onclick='acc(\"retroceder\")'>&#9664; Atras</button>"
                          "<button onclick='acc(\"avanzar\")'>Siguiente &#9654;</button></div>"
                          "<p style='color:#94A3B8;font-size:13px'>Toca la imagen para marcar el punto a explicar</p>"
                          "<script>function acc(a){fetch('" + base + "/accion',{method:'POST',"
                          "headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:a})})"
                          ".then(r=>r.json()).then(refrescar)}"
                          "var f=document.getElementById('f');"
                          "f.addEventListener('click',function(e){var r=f.getBoundingClientRect();"
                          "var x=(e.clientX-r.left)*900/r.width;var y=(e.clientY-r.top)*700/r.height;"
                          "fetch('" + base + "/tocar',{method:'POST',headers:{'Content-Type':'application/json'},"
                          "body:JSON.stringify({x:x,y:y})}).then(()=>refrescar());});"
                          "function refrescar(){f.src='" + base + "/frame.svg?t='+Date.now();}"
                          "setInterval(refrescar,3000);</script></body></html>")
                  return 200, html.encode("utf-8"), {"Content-Type": "text/html; charset=utf-8"}

              def _proyectar(ctx):
                  return remota.proyectar_paso_actual(ctx.ruta_params["sesion_id"])

              def _curso_crear(ctx):
                  datos = ctx.json()
                  return exito(modocurso.crear_curso(
                      ctx.ruta_params["presentacion_id"],
                      datos.get("preguntas", []),
                      datos.get("umbral_aprobacion", 0.7)))

              def _curso_responder(ctx):
                  datos = ctx.json()
                  return exito(modocurso.responder(
                      ctx.ruta_params["curso_id"], ctx.identidad.zid,
                      datos.get("respuestas", [])))

              def _curso_certificar(ctx):
                  return exito(modocurso.certificar(ctx.ruta_params["curso_id"], ctx.identidad.zid))

              app.registrar("POST", RUTA_CREAR, _crear, PermisoCodigo.PRESENTAR, "Crear presentacion con pasos")
              app.registrar("GET", RUTA_CREAR, _listar, PermisoCodigo.VER, "Listar presentaciones")
              app.registrar("GET", RUTA_ITEM, _obtener, PermisoCodigo.VER, "Obtener presentacion")
              app.registrar("GET", RUTA_PLAY, _reproducir, PermisoCodigo.VER, "Reproducir slideshow real")
              app.registrar("POST", RUTA_SELLAR, _sellar, PermisoCodigo.PRESENTAR, "Sellar en ZYRA via outbox")
              app.registrar("POST", RUTA_SESIONES, _crear_sesion, PermisoCodigo.PRESENTAR, "Abrir sesion interactiva")
              app.registrar("GET", RUTA_SESIONES, _listar_sesiones, PermisoCodigo.VER, "Listar sesiones interactivas")
              app.registrar("GET", RUTA_SESION, _estado, PermisoCodigo.VER, "Estado de la sesion interactiva")
              app.registrar("POST", RUTA_ACCION, _accion, PermisoCodigo.PRESENTAR, "Accion de control")
              app.registrar("POST", RUTA_TOQUE, _tocar, PermisoCodigo.PRESENTAR, "Tocar punto a explicar")
              app.registrar("GET", RUTA_FRAME, _frame, PermisoCodigo.VER, "Frame holografico del paso actual")
              app.registrar("GET", RUTA_VISTA, _vista, PermisoCodigo.VER, "Vista de control desde telefono o PC")
              app.registrar("POST", RUTA_PROYECTAR, _proyectar, PermisoCodigo.PRESENTAR, "Proyectar paso actual")
              app.registrar("POST", RUTA_CURSO_CREAR, _curso_crear, PermisoCodigo.PRESENTAR, "Crear curso de capacitacion con evaluacion")
              app.registrar("POST", RUTA_CURSO_RESPONDER, _curso_responder, PermisoCodigo.VER, "Responder evaluacion del curso")
              app.registrar("POST", RUTA_CURSO_CERTIFICAR, _curso_certificar, PermisoCodigo.VER, "Certificado firmado + sellado en la Red")
          PRES_EOF

      - name: Cablear service_registry (modocurso + motor_orbital, idempotente)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/registry/services/service_registry.py")
          t = ruta.read_text(encoding="utf-8")
          lineas = t.splitlines(keepends=True)
          cambios = []

          def indice_de(condicion):
              for i, l in enumerate(lineas):
                  if condicion(l):
                      return i
              return -1

          if "ModoCurso" not in t:
              i = indice_de(lambda l: "presentation_remote import" in l and l.strip().startswith("from"))
              if i < 0:
                  raise SystemExit("FATAL: sin import ancla de presentation_remote")
              indent = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, indent + "from apps.laboratorio.infrastructure.providers.presentation_remote import ModoCurso\n")
              cambios.append("import ModoCurso")

          if "MotorRenderOrbital" not in t:
              i = indice_de(lambda l: "renderer_3d import" in l and l.strip().startswith("from"))
              if i < 0:
                  raise SystemExit("FATAL: sin import ancla de renderer_3d")
              indent = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, indent + "from apps.laboratorio.infrastructure.providers.renderer_3d import MotorRenderOrbital\n")
              cambios.append("import MotorRenderOrbital")

          if '"modocurso"' not in t:
              i = indice_de(lambda l: 'c.registrar("presentacion_remota"' in l)
              if i < 0:
                  raise SystemExit("FATAL: sin ancla presentacion_remota")
              indent = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, indent + 'c.registrar("modocurso", lambda _c: ModoCurso(_c.obtener("repo_presentaciones"), _c.obtener("outbox"), _c.obtener("firmador"), _c.obtener("cliente_zyra")))\n')
              cambios.append("servicio modocurso")

          if '"motor_orbital"' not in t:
              i = indice_de(lambda l: 'c.registrar("modocurso"' in l)
              if i < 0:
                  raise SystemExit("FATAL: sin ancla para motor_orbital")
              indent = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, indent + 'c.registrar("motor_orbital", lambda _c: MotorRenderOrbital())\n')
              cambios.append("servicio motor_orbital")

          t = "".join(lineas)
          for requerido in ("ModoCurso", "MotorRenderOrbital", '"modocurso"', '"motor_orbital"'):
              if requerido not in t:
                  raise SystemExit("FATAL: falta " + requerido)
          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("service_registry: " + ("; ".join(cambios) if cambios else "ya al dia") + " - verificado")
          PYEOF

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Escribir los 3 tests (con los fixes conocidos dentro)
        run: |
          cat > apps/laboratorio/tests/test_camara_orbital.py <<'TC2_EOF'
          """EX-3: camara orbital + render 2.5D determinista."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.renderer_3d import (
              CamaraOrbital,
              MotorRenderOrbital,
          )
          from apps.laboratorio.shared.exceptions.render_errors import EscenaVaciaError
          from apps.laboratorio.tests.conftest import OBJETOS, assert_2xx, construir_escena, construir_escena_vacia


          def test_girar_con_limites():
              cam = CamaraOrbital()
              cam.girar(90, 10)
              assert cam.estado()["azimut"] == 90.0
              assert cam.estado()["elevacion"] == 45.0
              cam.girar(0, 200)
              assert cam.estado()["elevacion"] == 85.0


          def test_distancia_validada():
              with pytest.raises(ValueError):
                  CamaraOrbital(distancia=0.5)
              with pytest.raises(ValueError):
                  CamaraOrbital(elevacion=120)


          def test_render_orbital_png_determinista():
              motor = MotorRenderOrbital()
              cam = CamaraOrbital()
              cam.girar(45, 40)
              r1 = motor.renderizar_orbital(construir_escena(), {"ancho": 200, "alto": 150}, cam)
              r2 = motor.renderizar_orbital(construir_escena(), {"ancho": 200, "alto": 150}, cam)
              assert bytes(r1.imagen_bytes[:8]) == b"\x89PNG\r\n\x1a\n"
              assert r1.imagen_bytes == r2.imagen_bytes
              assert "orbital" in r1.metadata["proyeccion"]
              assert bytes(r1.profundidad_bytes[:8]) == b"\x89PNG\r\n\x1a\n"


          def test_render_orbital_rechaza_escena_vacia():
              motor = MotorRenderOrbital()
              cam = CamaraOrbital()
              with pytest.raises(EscenaVaciaError):
                  motor.renderizar_orbital(construir_escena_vacia(), {}, cam)


          def test_camara_por_http(despachar):
              _s, _h, datos = despachar("POST", "/laboratorio/api/v1/projects", json.dumps({
                  "titulo": "Proy camara", "tipo": "negocio"}).encode("utf-8"))
              assert_2xx(_s, datos)
              proyecto_id = datos["datos"]["proyecto"]["id"]
              status, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/scenes",
                  json.dumps({"nombre": "S cam", "objetos": OBJETOS}).encode("utf-8"))
              assert_2xx(status, datos2)
              escena_id = datos2["datos"]["escena"]["id"]
              status3, headers3, _payload3 = despachar(
                  "POST", "/laboratorio/api/v1/scenes/" + escena_id + "/camara/orbital",
