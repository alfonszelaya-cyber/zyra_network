name: "RED-8 paso 1: auditoria Events (outbox/inbox) para puente inter-app (SOLO LECTURA)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: events/ estructura completa + outbox.py"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          base = Path("shared_engines/events")
          print("=== archivos events/ ===")
          for f in sorted(base.rglob("*.py")):
              if f.stat().st_size > 0:
                  print("  " + str(f)
                        + " (" + str(f.stat().st_size)
                        + "b)")
          print()
          p = base / "outbox.py"
          if p.exists():
              for i, l in enumerate(
                  p.read_text(
                      encoding="utf-8").splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          D1EOF

      - name: "Dump 2: inbox.py + contracts.py (catalogo de eventos, esquema)"
        run: |
          python3 - <<'D2EOF'
          from pathlib import Path
          for n in ("shared_engines/events/inbox.py",
                    "shared_engines/events/contracts.py"):
              p = Path(n)
              print()
              print("=== " + n + " ===")
              if p.exists():
                  for i, l in enumerate(
                      p.read_text(
                          encoding="utf-8").splitlines(), 1):
                      print(str(i).rjust(4) + ": " + l)
              else:
                  print("NO EXISTE")
          D2EOF

      - name: "Dump 3: como consumen outbox las apps HOY (AGRO ecosistema + AXIS outbox_bridge)"
        run: |
          python3 - <<'D3EOF'
          from pathlib import Path
          for f in sorted(Path("apps/agro").rglob("*.py")):
              if "/tests/" in str(f):
                  continue
              try:
                  txt = f.read_text(encoding="utf-8")
              except Exception:
                  continue
              if ("outbox" in txt and "enqueue" in txt):
                  print()
                  print("-- " + str(f))
                  lines = txt.splitlines()
                  for i, l in enumerate(lines, 1):
                      if ("outbox" in l.lower()
                              or "enqueue" in l):
                          print("  " + str(i).rjust(5)
                                + ": " + l.strip()[:120])
          print()
          print("-- apps/axis/life_history/outbox_bridge.py (ya lo conocemos; verificacion de eventos emitidos)")
          D3EOF

      - name: "Dump 4: procesamiento/entrega del outbox (quien drena la cola: dispatch/publish/claim)"
        run: |
          python3 - <<'D4EOF'
          from pathlib import Path
          print("=== menciones publish/dispatch/claim/pendiente en events/ y runtime/ ===")
          for f in sorted(
              Path("shared_engines/events").rglob("*.py")
          ) + sorted(
              Path("shared_engines/runtime").rglob("*.py")):
              try:
                  txt = f.read_text(encoding="utf-8")
              except Exception:
                  continue
              hits = [(i, l.strip()) for i, l in enumerate(
                  txt.splitlines(), 1)
                  if ("def publish" in l
                      or "def dispatch" in l
                      or "def claim" in l
                      or "def drain" in l
                      or "def pending" in l
                      or "published_at" in l
                      and "UPDATE" in l.upper())]
              if hits:
                  print()
                  print("-- " + str(f))
                  for i, l in hits[:15]:
                      print("  " + str(i).rjust(5)
                            + ": " + l[:120])
          D4EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
