name: ZYRA AXIS Block 10 Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write access_control.py
        run: |
          cat > apps/axis/life_history/access_control.py <<'AEOF'
          """AXIS granular access control."""
          from __future__ import annotations

          import unittest

          from apps.axis.life_history.permissions import (
              HISTORY_READERS,
              REGISTRY_OPERATORS,
          )

          OPERATIONS = {
              "birth.register": REGISTRY_OPERATORS,
              "birth.amend": REGISTRY_OPERATORS,
              "health.record": ("medico",),
              "justice.case": ("abogado", "gobierno"),
              "justice.status": ("abogado", "gobierno"),
              "security.report": ("policia", "gobierno"),
              "security.advance": ("policia", "gobierno"),
              "clearance.emit": REGISTRY_OPERATORS,
              "history.read": HISTORY_READERS,
              "zid.upgrade": REGISTRY_OPERATORS
              + ("biometric-enroll",),
          }


          def authorize(operation, role):
              allowed = OPERATIONS.get(operation)
              if allowed is None:
                  raise ValueError(
                      "unknown operation: " + operation
                  )
              return role in allowed


          class AccessControlTests(unittest.TestCase):
              def test_roles_allowed(self):
                  self.assertTrue(
                      authorize(
                          "birth.register",
                          "registrador_civil",
                      )
                  )
                  self.assertTrue(
                      authorize(
                          "health.record", "medico"
                      )
                  )
                  self.assertTrue(
                      authorize(
                          "clearance.emit", "gobierno"
                      )
                  )

              def test_roles_denied(self):
                  self.assertFalse(
                      authorize(
                          "clearance.emit", "paciente"
                      )
                  )
                  self.assertFalse(
                      authorize(
                          "security.report", "medico"
                      )
                  )

              def test_unknown_operation(self):
                  with self.assertRaises(ValueError):
                      authorize("hack.admin", "gobierno")


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          AEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/access_control.py').read()); print('access_control OK')"

      - name: Write clearance_ops.py
        run: |
          cat > apps/axis/life_history/clearance_ops.py <<'CEOF'
          """AXIS clearance ops - standalone HTTP surface."""
          from __future__ import annotations

          import json

          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import ClassVar
          from urllib.parse import urlparse

          from apps.axis.life_history.access_control import (
              authorize,
          )

          _CSS = (
              "body{font-family:system-ui;"
              "background:#0d1117;color:#e6edf3;"
              "padding:20px;margin:0}"
              ".card{background:#161b22;border:1px"
              " solid #30363d;border-radius:10px;"
              "padding:14px;margin-top:10px}"
              "input{width:100%;box-sizing:border-box;"
              "background:#0d1117;color:#e6edf3;"
              "border:1px solid #30363d;"
              "border-radius:6px;padding:8px;"
              "margin:4px 0}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px;"
              "border-radius:8px;width:100%;"
              "margin-top:6px}"
              ".ok{color:#3fb950}"
              ".bad{color:#f85149}"
          )


          def _page(title, body):
              return (
                  "<!DOCTYPE html><html><head>"
                  "<meta charset='utf-8'>"
                  "<title>"
                  + title
                  + "</title><style>"
                  + _CSS
                  + "</style></head><body>"
                  + body
                  + "</body></html>"
              )


          class ClearanceHandler(BaseHTTPRequestHandler):
              emitter: ClassVar[object] = None

              def log_message(self, fmt, *args):
                  return None

              def do_GET(self):
                  path = urlparse(self.path).path
                  if path == "/clr/emision":
                      self._show_form()
                      return
                  self._send_html(
                      404,
                      _page(
                          "404",
                          "<h1>No encontrado</h1>",
                      ),
                  )

              def do_POST(self):
                  path = urlparse(self.path).path
                  doc = self._read_form()
                  if path == "/clr/emision":
                      self._handle_emit(doc)
                      return
                  self._send_html(
                      404,
                      _page(
                          "404",
                          "<h1>No encontrado</h1>",
                      ),
                  )

              def _show_form(self):
                  body = (
                      "<h1>CERTIFICACION DE"
                      " ANTECEDENTES</h1>"
                      "<div class='card'>"
                      "<form method='POST'"
                      " action='/clr/emision'>"
                      "<input name='operator_account'"
                      " placeholder='Mi ID operador'>"
                      "<input name='operator_role'"
                      " placeholder='Mi rol (gobierno)'>"
                      "<input name='subject_zid'"
                      " placeholder='ZID del solicitante'>"
                      "<button>Emitir certificacion"
                      "</button>"
                      "</form></div>"
                  )
                  self._send_html(
                      200,
                      _page(
                          "AXIS - Certificaciones",
                          body,
                      ),
                  )

              def _handle_emit(self, doc):
                  emitter = type(self).emitter
                  role = str(
                      doc.get("operator_role", "")
                  ).strip()
                  try:
                      if not authorize(
                          "clearance.emit", role
                      ):
                          raise ValueError(
                              "rol no autorizado: "
                              + role
                          )
                      cert = emitter.emit(
                          operator_account=self._field(
                              doc, "operator_account"
                          ),
                          operator_role=role,
                          subject_zid=self._field(
                              doc, "subject_zid"
                          ),
                      )
                      finding = cert["finding"]
                      css = (
                          "ok"
                          if "SIN" in finding
                          else "bad"
                      )
                      cert_json = json.dumps(
                          {
                              "cert_id": cert["cert_id"],
                              "requester": cert[
                                  "requester"
                              ],
                              "subject_zid": cert[
                                  "subject_zid"
                              ],
                              "finding": finding,
                              "issued_at": cert[
                                  "issued_at"
                              ],
                              "signature": cert[
                                  "signature"
                              ],
                          }
                      )
                      body = (
                          "<h1>Certificacion emitida</h1>"
                          "<p>ID: <b>"
                          + cert["cert_id"]
                          + "</b></p>"
                          "<p>Resultado: <b class='"
                          + css
                          + "'>"
                          + finding
                          + "</b></p>"
                          "<p>Documento: <b>"
                          + str(
                              cert["document_id"] or "-"
                          )
                          + "</b></p>"
                          "<p class='" + css + "'>"
                          + cert_json
                          + "</p>"
                          "<a href='/clr/emision'>Volver</a>"
                      )
                      self._send_html(
                          200,
                          _page(
                              "AXIS - Certificacion",
                              body,
                          ),
                      )
                  except Exception as exc:
                      self._send_html(
                          403,
                          _page(
                              "Rechazado",
                              "<h1 class='bad'>Rechazada"
                              "</h1><p>"
                              + str(exc)
                              + "</p>"
                              "<a href='/clr/emision'>Volver</a>",
                          ),
                      )

              def _read_form(self):
                  length = self.headers.get(
                      "Content-Length"
                  )
                  raw = self.rfile.read(
                      int(length)
                  ).decode("utf-8")
                  doc: dict = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          k, v = pair.split("=", 1)
                          doc[k] = v.replace("+", " ")
                  return doc

              @staticmethod
              def _field(doc, key):
                  value = doc.get(key)
                  if (
                      not isinstance(value, str)
                      or not value.strip()
                  ):
                      raise ValueError("missing: " + key)
                  return value

              def _send_html(self, status, html):
                  body = html.encode("utf-8")
                  self.send_response(status)
                  self.send_header(
                      "Content-Type",
                      "text/html; charset=utf-8",
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body)),
                  )
                  self.end_headers()
                  self.wfile.write(body)


          class ClearanceServer(ThreadingHTTPServer):
              daemon_threads = True
              allow_reuse_address = True

              def __init__(self, address):
                  super().__init__(
                      address, ClearanceHandler
                  )

              @property
              def bound_port(self):
                  return int(self.server_address[1])


          def serve_clearance(
              emitter,
              *,
              host="127.0.0.1",
              port=0,
          ):
              ClearanceHandler.emitter = emitter
              return ClearanceServer((host, port))
          CEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/clearance_ops.py').read()); print('clearance_ops OK')"

      - name: Write clearance_ops test (HTTPError-aware)
        run: |
          cat > apps/axis/life_history/tests/test_clearance_ops.py <<'TEOF'
          """Clearance screen E2E."""
          from __future__ import annotations

          import threading
          import unittest

          from urllib.error import HTTPError
          from urllib.request import (
              Request,
              urlopen,
          )

          from apps.axis.life_history.clearance_ops import (
              serve_clearance,
          )
          from apps.axis.life_history.clearance_service import (
              ClearanceEmitter,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )


          class _FakeNet:
              def get(self, path):
                  return True, {"status": "ACTIVE"}, None

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-c"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return False, None, "unknown"


          class _Clock:
              def now(self):
                  import time

                  return time.time()


          class ClearanceOpsE2E(unittest.TestCase):
              def test_emit_and_denied(self):
                  db = SQLiteAdapter(":memory:")
                  net_db = SQLiteAdapter(":memory:")
                  life = LifeHistoryService(
                      store=LifeHistoryStore(
                          db, _Clock()
                      ),
                      client=_FakeNet(),
                  )
                  emitter = ClearanceEmitter(
                      store=db,
                      life=life,
                      client=_FakeNet(),
                      network_db=net_db,
                      master_key_hex="ab" * 32,
                  )
                  server = serve_clearance(emitter)
                  thread = threading.Thread(
                      target=server.serve_forever,
                      daemon=True,
                  )
                  thread.start()
                  base = (
                      "http://127.0.0.1:"
                      + str(server.bound_port)
                  )

                  def post(path, doc):
                      req = Request(
                          base + path,
                          data=(
                              "&".join(
                                  str(k)
                                  + "="
                                  + str(v)
                                  for k, v in doc.items()
                              )
                          ).encode("utf-8"),
                          method="POST",
                      )
                      try:
                          with urlopen(
                              req, timeout=10
                          ) as r:
                              return r.read().decode(
                                  "utf-8"
                              )
                      except HTTPError as exc:
                          return exc.read().decode(
                              "utf-8", "replace"
                          )

                  try:
                      ok_page = post(
                          "/clr/emision",
                          {
                              "operator_account": "AX-gob",
                              "operator_role": "gobierno",
                              "subject_zid": "ZID-suj-1",
                          },
                      )
                      self.assertIn(
                          "Certificacion emitida",
                          ok_page,
                      )
                      self.assertIn(
                          "SIN_REGISTROS_REPORTADOS",
                          ok_page,
                      )
                      denied = post(
                          "/clr/emision",
                          {
                              "operator_account": "AX-any",
                              "operator_role": "paciente",
                              "subject_zid": "ZID-suj-2",
                          },
                      )
                      self.assertIn(
                          "Rechazada", denied
                      )
                      rows = net_db.query_all(
                          "SELECT * FROM"
                          " clearance_requests"
                      )
                      self.assertEqual(1, len(rows))
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()
                      net_db.close()


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          TEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_clearance_ops.py').read()); print('test OK')"

      - name: 1/3 Clearance screen E2E
        run: python -m apps.axis.life_history.tests.test_clearance_ops -v

      - name: 2/3 Access control tests
        run: python -m apps.axis.life_history.access_control -v

      - name: 3/3 Full regression (all suites)
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q
          python -m apps.axis.life_history.tests.test_justice_service -q
          python -m apps.axis.life_history.tests.test_security_service -q
          python -m apps.axis.life_history.tests.test_ops_server -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "axis: clearance screen + granular permissions - AXIS complete"
            git push
          fi
