name: "RED-EXP-1 v2: fix PK doble + reubicar metodos dentro de ProfileRegistry"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - crear migracion v4 (si falta) o CORREGIR la PK doble (si ya fue escrita rota)"
        run: |
          python3 - <<'MEOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "identity_documents" not in t:
              ANCLA = (
                  '            " reason TEXT, unfreeze_code TEXT)",\n'
                  "        ),\n"
                  "    ),\n"
                  ")\n"
              )
              assert t.count(ANCLA) == 1, "ancla migraciones"
              NUEVO = (
                  '            " reason TEXT, unfreeze_code TEXT)",\n'
                  "        ),\n"
                  "    ),\n"
                  "    Migration(\n"
                  "        4,\n"
                  '        "network_identity_documents",\n'
                  "        (\n"
                  '            "CREATE TABLE IF NOT EXISTS identity_documents ("\n'
                  '            " document_id TEXT NOT NULL, zid TEXT NOT NULL,"\n'
                  '            " doc_type TEXT NOT NULL, doc_number TEXT NOT NULL,"\n'
                  '            " issuing_country TEXT NOT NULL, issuing_authority TEXT,"\n'
                  '            " issue_date TEXT, expiry_date TEXT, status TEXT NOT NULL,"\n'
                  '            " verification_status TEXT NOT NULL, verified_by TEXT,"\n'
                  '            " added_at REAL NOT NULL, PRIMARY KEY (zid, doc_type, doc_number))",\n'
                  '            "CREATE INDEX IF NOT EXISTS idx_docs_zid ON identity_documents (zid)",\n'
                  '            "CREATE UNIQUE INDEX IF NOT EXISTS idx_docs_docid ON identity_documents (document_id)",\n'
                  "        ),\n"
                  "    ),\n"
                  ")\n"
              )
              t = t.replace(ANCLA, NUEVO, 1)
              ast.parse(t)
              p.write_text(t, encoding="utf-8")
              print("OK 1: migracion v4 creada correcta")
              raise SystemExit(0)
          ROTA = '" document_id TEXT PRIMARY KEY, zid TEXT NOT NULL,"'
          if ROTA in t:
              assert t.count(ROTA) == 1
              t = t.replace(ROTA, '" document_id TEXT NOT NULL, zid TEXT NOT NULL,"', 1)
              VIDX = '"CREATE INDEX IF NOT EXISTS idx_docs_zid ON identity_documents (zid)"'
              assert t.count(VIDX) == 1
              t = t.replace(VIDX, (
                  '"CREATE INDEX IF NOT EXISTS idx_docs_zid ON identity_documents (zid)",\n'
                  '            "CREATE UNIQUE INDEX IF NOT EXISTS idx_docs_docid ON identity_documents (document_id)"'
              ), 1)
              ast.parse(t)
              p.write_text(t, encoding="utf-8")
              print("OK 1: PK doble corregida (compuesto + unique document_id)")
          else:
              print("SKIP 1 (migracion ya correcta)")
          MEOF

      - name: "Paso 2 - crear metodos (si faltan) o REUBICARlos dentro de ProfileRegistry (si quedaron en FrozenIdentityError)"
        run: |
          python3 - <<'CEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          METODOS_SRC = textwrap.dedent('''\
              def add_document(self, *, zid: str, doc_type: str, doc_number: str, issuing_country: str, issuing_authority: str = "", issue_date: str = "", expiry_date: str = "", verified: bool = False, verified_by: str = "") -> dict[str, object]:
                  """AX-EXP: anexa un documento oficial al expediente del ZID."""
                  import secrets
                  require_non_empty_str(zid, "zid")
                  require_non_empty_str(doc_type, "doc_type")
                  require_non_empty_str(doc_number, "doc_number")
                  require_non_empty_str(issuing_country, "issuing_country")
                  document_id = "DOCX-" + secrets.token_hex(5)
                  vstatus = "VERIFIED" if verified else "PENDING"
                  with self._db.transaction() as cursor:
                      cursor.execute("INSERT INTO identity_documents (document_id, zid, doc_type, doc_number, issuing_country, issuing_authority, issue_date, expiry_date, status, verification_status, verified_by, added_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)", (document_id, zid, doc_type, doc_number, issuing_country, issuing_authority, issue_date, expiry_date, "VALID", vstatus, verified_by, self._clock.now()))
                  self._audit.append(event_type="network.document.added", actor=zid, subject=document_id, payload={"type": doc_type, "country": issuing_country})
                  return {"document_id": document_id, "doc_type": doc_type, "status": "VALID", "verification_status": vstatus}

              def list_documents(self, *, zid: str) -> tuple[dict[str, object], ...]:
                  """AX-EXP: todos los documentos del expediente."""
                  rows = self._db.query_all("SELECT * FROM identity_documents WHERE zid = ? ORDER BY added_at", (zid,))
                  return tuple({"document_id": str(r["document_id"]), "doc_type": str(r["doc_type"]), "doc_number": str(r["doc_number"]), "issuing_country": str(r["issuing_country"]), "issuing_authority": str(r["issuing_authority"] or ""), "issue_date": str(r["issue_date"] or ""), "expiry_date": str(r["expiry_date"] or ""), "status": str(r["status"]), "verification_status": str(r["verification_status"]), "verified_by": str(r["verified_by"] or "")} for r in rows)

              def revoke_document(self, *, zid: str, document_id: str, reason: str = "") -> None:
                  """AX-EXP: pasa a REVOKED (robo/perdida) - queda en historial."""
                  require_non_empty_str(document_id, "document_id")
                  with self._db.transaction() as cursor:
                      cursor.execute("UPDATE identity_documents SET status = 'REVOKED' WHERE document_id = ? AND zid = ?", (document_id, zid))
                  self._audit.append(event_type="network.document.revoked", actor=zid, subject=document_id, payload={"reason": reason})

              def assurance_level(self, *, zid: str) -> dict[str, object]:
                  """AX-EXP: L0 self-asserted, L2 documento verificado, L4 documento+biometrica, L5 multiples paises."""
                  docs = self.list_documents(zid=zid)
                  verificados = [d for d in docs if d["verification_status"] == "VERIFIED" and d["status"] == "VALID"]
                  paises = set(d["issuing_country"] for d in verificados)
                  if not verificados:
                      nivel = 0
                  elif len(paises) >= 2:
                      nivel = 5
                  elif self._has_biometric_binding(zid):
                      nivel = 4
                  else:
                      nivel = 2
                  return {"zid": zid, "assurance_level": nivel, "verified_documents": len(verificados), "countries": sorted(paises)}

              def _has_biometric_binding(self, zid: str) -> bool:
                  try:
                      row = self._db.query_one("SELECT 1 FROM biometric_templates WHERE identity_zid = ? LIMIT 1", (zid,))
                      return row is not None
                  except Exception:
                      return False
          ''').rstrip("\n")

          cls_idx = t.find("class FrozenIdentityError")
          add_idx = t.find("    def add_document(")
          if add_idx > cls_idx:
              bloque = t[add_idx:].rstrip("\n")
              t = t[:add_idx].rstrip("\n") + "\n"
              cls_ls = t.find("class FrozenIdentityError")
              t = t[:cls_ls] + bloque + "\n\n\n" + t[cls_ls:]
              ast.parse(t)
              p.write_text(t, encoding="utf-8")
              print("OK 2: metodos REUBICADOS antes de FrozenIdentityError (AST valido)")
              raise SystemExit(0)
          if "def add_document(" in t:
              print("SKIP 2 (metodos ya en ProfileRegistry)")
              raise SystemExit(0)
          METODOS = textwrap.indent(METODOS_SRC, "    ")
          cls_ls = t.find("class FrozenIdentityError")
          assert cls_ls > 0, "no hay clase FrozenIdentityError; append al final"
          t = t[:cls_ls].rstrip("\n") + "\n\n" + METODOS + "\n\n\n" + t[cls_ls:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 2: metodos creados dentro de ProfileRegistry (AST valido)")
          CEOF

      - name: "Paso 3 - verificacion dura"
        run: |
          python3 -c "
          from shared_engines.network.portable_profile import (
              ProfileRegistry, FrozenIdentityError, age_of)
          for m in ('add_document', 'list_documents', 'revoke_document', 'assurance_level'):
              assert hasattr(ProfileRegistry, m), m
          assert not hasattr(FrozenIdentityError, 'add_document'), 'metodos mal ubicados'
          for m in ('register_app', 'set_field', 'universal_view',
                    'verification_verdict', 'grant_consent', 'freeze_zid'):
              assert hasattr(ProfileRegistry, m), m
          print('OK 3: expediente legal EN ProfileRegistry; FrozenIdentityError limpio; todo previo intacto')
          "

      - name: "Paso 4 - rutas HTTP (idempotente)"
        run: |
          python3 - <<'RTEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/runtime/capabilities_api.py")
          t = p.read_text(encoding="utf-8")
          if 's[1] == "documents"' in t and 's[2] == "add"' in t.replace("'", '"'):
              pass
          if 's == ["profile", "documents", "add"]' in t:
              print("SKIP 4 (rutas ya presentes)")
              raise SystemExit(0)
          ig = t.find("def _route_get(")
          assert ig >= 0
          ic = t.find("caps = type(self).caps", ig)
          assert ic > ig
          ic_ls = t.rfind("\n", 0, ic) + 1
          linea = t[ic_ls:ic]
          IND_G = linea[:len(linea) - len(linea.lstrip())]
          le = t.find("\n", ic) + 1
          GET_CUERPO = textwrap.dedent('''\
              if (
                  len(s) == 3
                  and s[0] == "profile"
                  and s[1] == "documents"
              ):
                  reg = caps.profiles
                  docs = reg.list_documents(zid=s[2])
                  asur = reg.assurance_level(zid=s[2])
                  self._ok({"documents": list(docs), "assurance": asur})
                  return
          ''')
          GET_R = textwrap.indent(GET_CUERPO.rstrip("\n"), IND_G) + "\n"
          t = t[:le] + GET_R + t[le:]
          print("OK GET /profile/documents/{zid}")
          marker = 'if s == ["consent", "grant"]:'
          idx = t.find(marker)
          assert idx >= 0, "ancla consent/grant"
          ls = t.rfind("\n", 0, idx) + 1
          linea = t[ls:idx]
          IND = linea[:len(linea) - len(linea.lstrip())]
          POST_CUERPO = textwrap.dedent('''\
              if s == ["profile", "documents", "add"]:
                  reg = caps.profiles
                  res = reg.add_document(
                      zid=self._req(doc, "zid"),
                      doc_type=self._req(doc, "doc_type"),
                      doc_number=self._req(doc, "doc_number"),
                      issuing_country=self._req(doc, "issuing_country"),
                      issuing_authority=str(doc.get("issuing_authority", "")),
                      issue_date=str(doc.get("issue_date", "")),
                      expiry_date=str(doc.get("expiry_date", "")),
                      verified=bool(doc.get("verified", False)),
                      verified_by=str(doc.get("verified_by", "")),
                  )
                  self._send(201, {"ok": True, "data": res})
                  return
              if s == ["profile", "documents", "revoke"]:
                  caps.profiles.revoke_document(
                      zid=self._req(doc, "zid"),
                      document_id=self._req(doc, "document_id"),
                      reason=str(doc.get("reason", "")))
                  self._send(200, {"ok": True})
                  return
          ''')
          BLOQUE = textwrap.indent(POST_CUERPO.rstrip("\n"), IND) + "\n"
          t = t[:ls] + BLOQUE + t[ls:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          tq2 = p.read_text(encoding="utf-8")
          assert ('s == ["profile", "documents", "add"]:' in tq2)
          print("OK 4: rutas expediente (AST valido)")
          RTEOF

      - name: "Paso 5 - test: Pedro DUI SV + pasaporte US, assurance 0->2->4->5, revocacion"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          target = Path("shared_engines/network/tests/test_portable_identity.py")
          assert target.exists()
          t = target.read_text(encoding="utf-8")
          if "test_expediente_legal_pedro" in t:
              print("SKIP 5 (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_expediente_legal_pedro(tmp_path) -> None:
                  """AX-EXP: Pedro con DUI (SV) + pasaporte (US) en el MISMO ZID. Assurance L2->L4->L5. Revocacion en historial."""
                  from shared_engines.network.portable_profile import (
                      ProfileRegistry)
                  from shared_engines.audit.chain import AuditTrail
                  from shared_engines.events.outbox import Outbox
                  from shared_engines.events.contracts import EventCatalog
                  from shared_engines.storage.database import SQLiteAdapter
                  from shared_engines.common.clocks import FrozenClock
                  db = SQLiteAdapter(tmp_path / "exp.db")
                  clock = FrozenClock()
                  reg = ProfileRegistry(db, clock, audit=AuditTrail(db, clock), outbox=Outbox(db, clock))
                  zid = "ZID-pedro-exp-00000001"
                  reg.set_field(zid=zid, field="display_name", value="Pedro Prueba", verified=True)
                  a0 = reg.assurance_level(zid=zid)
                  assert a0["assurance_level"] == 0, str(a0)
                  d1 = reg.add_document(zid=zid, doc_type="dui", doc_number="00000000-0", issuing_country="SV", issuing_authority="RNPN", issue_date="2015-01-01", expiry_date="2025-01-01", verified=True, verified_by="RNPN")
                  assert d1["document_id"].startswith("DOCX-")
                  a2 = reg.assurance_level(zid=zid)
                  assert a2["assurance_level"] == 2, str(a2)
                  db.execute("INSERT INTO biometric_templates (template_id, identity_zid, modality, template_enc, dims, created_at) VALUES ('T-1', ?, 'face', x'00', 1, 1)", (zid,))
                  a4 = reg.assurance_level(zid=zid)
                  assert a4["assurance_level"] == 4, str(a4)
                  d2 = reg.add_document(zid=zid, doc_type="passport", doc_number="US-PASS-777", issuing_country="US", issuing_authority="U.S. Department of State", issue_date="2024-01-01", expiry_date="2034-01-01", verified=True, verified_by="U.S. Dept of State")
                  a5 = reg.assurance_level(zid=zid)
                  assert a5["assurance_level"] == 5, str(a5)
                  assert a5["countries"] == ["SV", "US"], str(a5)
                  docs = reg.list_documents(zid=zid)
                  assert len(docs) == 2
                  tipos = sorted(d["doc_type"] for d in docs)
                  assert tipos == ["dui", "passport"], str(tipos)
                  reg.revoke_document(zid=zid, document_id=d2["document_id"], reason="perdida")
                  docs2 = reg.list_documents(zid=zid)
                  rev = [d for d in docs2 if d["document_id"] == d2["document_id"]]
                  assert rev[0]["status"] == "REVOKED"
                  a6 = reg.assurance_level(zid=zid)
                  assert a6["assurance_level"] == 2, str(a6)
                  print("OK AX-EXP: Pedro SV-DUI + US-pasaporte en un ZID, assurance 0->2->4->5, revocacion en historial")
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          target.write_text(t, encoding="utf-8")
          final = target.read_text(encoding="utf-8")
          assert "test_expediente_legal_pedro" in final
          print("OK 5: test expediente (AST valido)")
          TSEOF

      - name: "Paso 6 - GATE Red"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -10

      - name: "Paso 7 - GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso 8 - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-EXP-1 v2"
            echo '```'
            python3 -m pytest shared_engines/network/tests -vv --tb=long 2>&1 | tail -70 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-EXP-1: expediente legal - documents[] multiples por ZID + assurance L0-L5" -m "El ZID es un expediente legal completo: identity_documents (migracion v4) soporta MULTIPLES documentos oficiales por persona (DUI SV + pasaporte US + DPI GT en el mismo ZID), cada uno con tipo/numero/pais/autoridad emisora/fechas/estado/verification_status/verified_by. PK compuesto (zid, doc_type, doc_number) + UNIQUE document_id (v1 tenia doble PK). Metodos: add_document/list_documents/revoke_document/assurance_level (L0 self-asserted, L2 documento verificado, L4 +biometrica, L5 multiples paises). Metodos REUBICADOS dentro de ProfileRegistry (v1 los apendeo despues de FrozenIdentityError y quedaron anidados). Rutas: POST /profile/documents/add, /profile/documents/revoke, GET /profile/documents/{zid}+assurance. Test: Pedro DUI-SV + pasaporte-US en un ZID, assurance 0->2->4->5, revocacion en historial. DUI != ZID: el ZID vincula todas las identidades oficiales (regla 15)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
