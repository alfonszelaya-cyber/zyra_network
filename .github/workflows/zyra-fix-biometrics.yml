                  app_destino=d["app_destino"],
                  contrato=d["contrato"],
                  solicitante_zid=d["solicitante_zid"],
                  estado=d["estado"],
                  respuesta=d["respuesta"],
              )
              sol.creado_en = datetime.fromisoformat(d["creado_en"])
              sol.actualizado_en = datetime.fromisoformat(d["actualizado_en"])
              return sol


          def _indicador_desde_dict(d: dict) -> IndicadorNacional:
              ind = IndicadorNacional(
                  id=id_desde_texto("ind", d["id"]),
                  nombre=d["nombre"],
                  tipo=d["tipo"],
                  valor=int(d["valor"]),
                  origen=d["origen"],
                  estado=d["estado"],
                  sello_hash=d["sello_hash"],
              )
              ind.creado_en = datetime.fromisoformat(d["creado_en"])
              ind.actualizado_en = datetime.fromisoformat(d["actualizado_en"])
              return ind


          class NetworkRepository:
              def __init__(self, store):
                  if store is None:
                      raise ValueError("NetworkRepository requiere su store.")
                  self._store = store

              def agregar_solicitud(self, entidad) -> SolicitudRed:
                  if not isinstance(entidad, SolicitudRed):
                      raise ValueError("Se esperaba una SolicitudRed.")
                  self._store.insertar_solicitud(entidad)
                  return entidad

              def agregar_indicador(self, entidad) -> IndicadorNacional:
                  if not isinstance(entidad, IndicadorNacional):
                      raise ValueError("Se esperaba un IndicadorNacional.")
                  self._store.insertar_indicador(entidad)
                  return entidad

              def actualizar_solicitud(self, entidad) -> SolicitudRed:
                  if not self._store.actualizar_solicitud(entidad):
                      raise EntidadNoEncontradaError("Solicitud no encontrada.", str(entidad.id))
                  return entidad

              def actualizar_indicador(self, entidad) -> IndicadorNacional:
                  if not self._store.actualizar_indicador(entidad):
                      raise EntidadNoEncontradaError("Indicador no encontrado.", str(entidad.id))
                  return entidad

