name: "ZYRA NEXO E1a v3: balance import Decimal"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Migrar engines (balance con import Decimal)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)

          BASE = "apps/nexo/domain/accounting"

          def escribir(nombre, marca, content):
              try:
                  p = pathlib.Path(BASE) / nombre
                  if p.exists() and marca in p.read_text(encoding="utf-8"):
                      out("- **" + nombre + ": YA**")
                      return
                  ast.parse(content)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(content, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  out("- **" + nombre + ": OK**")
              except Exception:
                  out("- **" + nombre + ": ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          ENGINE = D(r'''
              # accounting_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from decimal import Decimal
              from typing import Dict, List, Optional
              import uuid

              from shared_engines.audit.chain import AuditTrail
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration,
                  MigrationRunner,
              )

              _MIGRATIONS = (
                  Migration(1, "accounting_entries", (
                      "CREATE TABLE IF NOT EXISTS accounting_entries ("
                      " entry_id TEXT PRIMARY KEY,"
                      " account_code TEXT NOT NULL,"
                      " amount TEXT NOT NULL,"
                      " entry_type TEXT NOT NULL,"
                      " description TEXT NOT NULL DEFAULT '',"
                      " reference_id TEXT,"
                      " metadata_json TEXT NOT NULL DEFAULT '{}',"
                      " status TEXT NOT NULL DEFAULT 'POSTED',"
                      " created_at REAL NOT NULL)",
                  )),
              )


              class AccountingEngine:
                  """Motor central contable (Decimal exacto,
                  persistente, auditado por la Red)."""

                  def __init__(self, db: Database, clock: Clock,
                               *, audit: AuditTrail) -> None:
                      self._db = db
                      self._clock = clock
                      self._audit = audit
                      MigrationRunner(db, "nexo.accounting", _MIGRATIONS).run(clock)

                  def validate_entry(self, account_code: str,
                                     amount, entry_type: str) -> bool:
                      if not account_code:
                          return False
                      try:
                          Decimal(str(amount))
                      except Exception:
                          return False
                      if Decimal(str(amount)) <= 0:
                          return False
                      return entry_type in ("DEBIT", "CREDIT")

                  def create_entry(self, *, account_code: str, amount,
                                   entry_type: str, description: str,
                                   reference_id: Optional[str] = None,
                                   metadata: Optional[dict] = None) -> dict:
                      if not self.validate_entry(account_code, amount, entry_type):
                          raise ValueError("Invalid accounting entry")
                      amt = Decimal(str(amount))
                      entry_id = f"ACC-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO accounting_entries"
                              " (entry_id, account_code, amount, entry_type,"
                              " description, reference_id, metadata_json,"
                              " status, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?, 'POSTED', ?)",
                              (entry_id, account_code, str(amt),
                               entry_type, description, reference_id,
                               str(metadata or {}), now))
                      self._audit.append(
                          event_type="nexo.accounting.entry_created",
                          actor="nexo", subject=entry_id,
                          payload={"account": account_code,
                                   "amount": str(amt),
                                   "type": entry_type})
                      return {"entry_id": entry_id,
                              "account_code": account_code,
                              "amount": str(amt),
                              "entry_type": entry_type,
                              "description": description,
                              "reference_id": reference_id,
                              "metadata": metadata or {},
                              "status": "POSTED",
                              "created_at": now}

                  def get_entry(self, entry_id: str) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM accounting_entries"
                          " WHERE entry_id = ?", (entry_id,))
                      return self._row_to_dict(row) if row else None

                  def get_entries(self) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM accounting_entries"
                          " ORDER BY created_at")
                      return [self._row_to_dict(r) for r in rows]

                  def get_entries_by_account(self, account_code: str) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM accounting_entries"
                          " WHERE account_code = ? ORDER BY created_at",
                          (account_code,))
                      return [self._row_to_dict(r) for r in rows]

                  def _row_to_dict(self, row) -> dict:
                      return {"entry_id": str(row["entry_id"]),
                              "account_code": str(row["account_code"]),
                              "amount": str(row["amount"]),
                              "entry_type": str(row["entry_type"]),
                              "description": str(row["description"]),
                              "reference_id": (str(row["reference_id"])
                                               if row["reference_id"] else None),
                              "status": str(row["status"]),
                              "created_at": float(row["created_at"])}

                  def calculate_account_balance(self, account_code: str) -> Decimal:
                      total = Decimal("0")
                      for e in self.get_entries_by_account(account_code):
                          amt = Decimal(e["amount"])
                          if e["entry_type"] == "DEBIT":
                              total += amt
                          else:
                              total -= amt
                      return total

                  def generate_summary(self) -> Dict:
                      debits = Decimal("0")
                      credits = Decimal("0")
                      for e in self.get_entries():
                          amt = Decimal(e["amount"])
                          if e["entry_type"] == "DEBIT":
                              debits += amt
                          else:
                              credits += amt
                      return {"entries": len(self.get_entries()),
                              "debits": str(debits),
                              "credits": str(credits),
                              "generated_at": self._clock.now()}
          ''')

          JOURNAL = D(r'''
              # journal_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from typing import Dict, List, Optional
              import uuid

              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration,
                  MigrationRunner,
              )

              _MIGRATIONS = (
                  Migration(1, "journal_entries", (
                      "CREATE TABLE IF NOT EXISTS journal_entries ("
                      " journal_id TEXT PRIMARY KEY,"
                      " entry_json TEXT NOT NULL,"
                      " registered_at REAL NOT NULL,"
                      " status TEXT NOT NULL DEFAULT 'POSTED')",
                  )),
              )


              class JournalEngine:
                  """Libro Diario contable persistente."""

                  def __init__(self, db: Database, clock: Clock,
                               *, outbox=None) -> None:
                      self._db = db
                      self._clock = clock
                      self._outbox = outbox
                      MigrationRunner(db, "nexo.journal", _MIGRATIONS).run(clock)

                  def register_entry(self, accounting_entry: dict) -> dict:
                      import json as _json
                      journal_id = f"JRN-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO journal_entries"
                              " (journal_id, entry_json,"
                              " registered_at, status)"
                              " VALUES (?, ?, ?, 'POSTED')",
                              (journal_id,
                               _json.dumps(accounting_entry, default=str),
                               now))
                      return {"journal_id": journal_id,
                              "entry": accounting_entry,
                              "registered_at": now,
                              "status": "POSTED"}

                  def get_entries(self) -> List[dict]:
                      import json as _json
                      rows = self._db.query_all(
                          "SELECT * FROM journal_entries"
                          " ORDER BY registered_at")
                      out = []
                      for r in rows:
                          out.append({
                              "journal_id": str(r["journal_id"]),
                              "entry": _json.loads(str(r["entry_json"])),
                              "registered_at": float(r["registered_at"]),
                              "status": str(r["status"])})
                      return out

                  def get_entry(self, journal_id: str) -> Optional[dict]:
                      for item in self.get_entries():
                          if item["journal_id"] == journal_id:
                              return item
                      return None

                  def get_entries_by_account(self, account_code: str) -> List[dict]:
                      return [i for i in self.get_entries()
                              if (i.get("entry", {}).get(
                                  "account_code") == account_code)]

                  def get_entries_by_reference(self, reference_id: str) -> List[dict]:
                      return [i for i in self.get_entries()
                              if (i.get("entry", {}).get(
                                  "reference_id") == reference_id)]

                  def generate_journal_report(self) -> Dict:
                      debit_count = 0
                      credit_count = 0
                      for item in self.get_entries():
                          et = (item.get("entry", {}).get(
                              "entry_type", ""))
                          if et == "DEBIT":
                              debit_count += 1
                          elif et == "CREDIT":
                              credit_count += 1
                      return {"journal_entries": len(self.get_entries()),
                              "debit_entries": debit_count,
                              "credit_entries": credit_count,
                              "generated_at": self._clock.now()}

                  def generate_metrics(self) -> Dict:
                      return {"entries": len(self.get_entries()),
                              "generated_at": self._clock.now()}
          ''')

          BALANCE = D(r'''
              # balance_engine.py - NEXO / ZYRA (migrado mejorado v3)
              from __future__ import annotations

              from decimal import Decimal

              from typing import Dict, List, Optional
              import uuid

              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration,
                  MigrationRunner,
              )

              _MIGRATIONS = (
                  Migration(1, "balance_records", (
                      "CREATE TABLE IF NOT EXISTS balance_records ("
                      " balance_id TEXT PRIMARY KEY,"
                      " total_debits TEXT NOT NULL,"
                      " total_credits TEXT NOT NULL,"
                      " net_balance TEXT NOT NULL,"
                      " generated_at REAL NOT NULL,"
                      " status TEXT NOT NULL DEFAULT 'CALCULATED')",
                  )),
              )


              class BalanceEngine:
                  """Motor de balances contables (Decimal)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.balance",
                                      _MIGRATIONS).run(clock)

                  def calculate_balance(self, entries: List[dict]) -> dict:
                      total_debits = Decimal("0")
                      total_credits = Decimal("0")
                      for entry in entries:
                          et = entry.get("entry_type", "")
                          amt = Decimal(str(entry.get("amount", "0")))
                          if et == "DEBIT":
                              total_debits += amt
                          elif et == "CREDIT":
                              total_credits += amt
                      balance_id = f"BAL-{uuid.uuid4()}"
                      now = self._clock.now()
                      neto = total_debits - total_credits
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO balance_records"
                              " (balance_id, total_debits,"
                              " total_credits, net_balance,"
                              " generated_at, status)"
                              " VALUES (?, ?, ?, ?, ?, 'CALCULATED')",
                              (balance_id, str(total_debits),
                               str(total_credits), str(neto), now))
                      return {"balance_id": balance_id,
                              "total_debits": str(total_debits),
                              "total_credits": str(total_credits),
                              "net_balance": str(neto),
                              "generated_at": now,
                              "status": "CALCULATED"}

                  def get_balances(self) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM balance_records"
                          " ORDER BY generated_at")
                      return [{"balance_id": str(r["balance_id"]),
                               "total_debits": str(r["total_debits"]),
                               "total_credits": str(r["total_credits"]),
                               "net_balance": str(r["net_balance"]),
                               "generated_at": float(r["generated_at"]),
                               "status": str(r["status"])}
                              for r in rows]

                  def get_last_balance(self) -> Optional[dict]:
                      bs = self.get_balances()
                      return bs[-1] if bs else None

                  def generate_balance_report(self) -> Dict:
                      return {"balances_generated":
                              len(self.get_balances()),
                              "latest_balance": self.get_last_balance(),
                              "generated_at": self._clock.now()}
          ''')

          VALIDATION = D(r'''
              # accounting_validation_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from decimal import Decimal
              from typing import Dict, List

              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration,
                  MigrationRunner,
              )

              _MIGRATIONS = (
                  Migration(1, "validation_history", (
                      "CREATE TABLE IF NOT EXISTS validation_history ("
                      " validation_id TEXT PRIMARY KEY,"
                      " validation_type TEXT NOT NULL,"
                      " result INTEGER NOT NULL,"
                      " details_json TEXT NOT NULL,"
                      " timestamp REAL NOT NULL)",
                  )),
              )


              class AccountingValidationEngine:
                  """Motor de validación contable (Decimal)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.validation",
                                      _MIGRATIONS).run(clock)

                  def _register(self, vtype: str, result: bool,
                                details: dict) -> None:
                      import uuid as _u
                      import json as _j
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO validation_history"
                              " (validation_id, validation_type,"
                              " result, details_json, timestamp)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (f"VAL-{_u.uuid4()}", vtype,
                               1 if result else 0,
                               _j.dumps(details, default=str), now))

                  def validate_account_code(self, account_code: str) -> bool:
                      result = bool(account_code
                                    and len(account_code) >= 3)
                      self._register("ACCOUNT_CODE", result,
                                     {"account_code": account_code})
                      return result

                  def validate_amount(self, amount) -> bool:
                      try:
                          result = (Decimal(str(amount)) > 0)
                      except Exception:
                          result = False
                      self._register("AMOUNT", result,
                                     {"amount": str(amount)})
                      return result

                  def validate_entry_type(self, entry_type: str) -> bool:
                      result = entry_type in ("DEBIT", "CREDIT")
                      self._register("ENTRY_TYPE", result,
                                     {"entry_type": entry_type})
                      return result

                  def validate_entry(self, entry: dict) -> Dict:
                      errors = []
                      if not self.validate_account_code(
                              entry.get("account_code", "")):
                          errors.append("INVALID_ACCOUNT_CODE")
                      if not self.validate_amount(
                              entry.get("amount", 0)):
                          errors.append("INVALID_AMOUNT")
                      if not self.validate_entry_type(
                              entry.get("entry_type", "")):
                          errors.append("INVALID_ENTRY_TYPE")
                      result = {"valid": len(errors) == 0,
                                "errors": errors,
                                "validated_at": self._clock.now()}
                      self._register("ACCOUNTING_ENTRY",
                                     result["valid"], result)
                      return result
          ''')

          REGISTRY = D(r'''
              # accounting_registry.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from typing import Dict, List, Optional
              import uuid

              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration,
                  MigrationRunner,
              )

              _MIGRATIONS = (
                  Migration(1, "accounting_registry", (
                      "CREATE TABLE IF NOT EXISTS accounting_registry ("
                      " entry_id TEXT PRIMARY KEY,"
                      " entry_json TEXT NOT NULL,"
                      " account_code TEXT NOT NULL DEFAULT '',"
                      " reference_id TEXT,"
                      " created_at REAL NOT NULL)",
                  )),
              )


              class AccountingRegistry:
                  """Registro central de asientos (persistente)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.registry",
                                      _MIGRATIONS).run(clock)

                  def register(self, entry: dict) -> dict:
                      import json as _j
                      entry_id = entry.get(
                          "entry_id", f"REG-{uuid.uuid4()}")
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT OR REPLACE INTO accounting_registry"
                              " (entry_id, entry_json, account_code,"
                              " reference_id, created_at)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (entry_id,
                               _j.dumps(entry, default=str),
                               str(entry.get("account_code", "")),
                               entry.get("reference_id"), now))
                      return entry

                  def get_all(self) -> List[dict]:
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM accounting_registry"
                          " ORDER BY created_at")
                      return [_j.loads(str(r["entry_json"]))
                              for r in rows]

                  def get_by_id(self, entry_id: str) -> Optional[dict]:
                      import json as _j
                      row = self._db.query_one(
                          "SELECT * FROM accounting_registry"
                          " WHERE entry_id = ?", (entry_id,))
                      return (_j.loads(str(row["entry_json"]))
                              if row else None)

                  def get_by_account(self, account_code: str) -> List[dict]:
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM accounting_registry"
                          " WHERE account_code = ?", (account_code,))
                      return [_j.loads(str(r["entry_json"]))
                              for r in rows]

                  def get_by_reference(self, reference_id: str) -> List[dict]:
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM accounting_registry"
                          " WHERE reference_id = ?", (reference_id,))
                      return [_j.loads(str(r["entry_json"]))
                              for r in rows]

                  def update(self, entry_id: str,
                             updates: Dict) -> Optional[dict]:
                      import json as _j
                      entry = self.get_by_id(entry_id)
                      if not entry:
                          return None
                      entry.update(updates)
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "UPDATE accounting_registry"
                              " SET entry_json = ? WHERE entry_id = ?",
                              (_j.dumps(entry, default=str), entry_id))
                      return entry

                  def delete(self, entry_id: str) -> bool:
                      row = self._db.query_one(
                          "SELECT entry_id FROM accounting_registry"
                          " WHERE entry_id = ?", (entry_id,))
                      if not row:
                          return False
                      self._db.execute(
                          "DELETE FROM accounting_registry"
                          " WHERE entry_id = ?", (entry_id,))
                      return True

                  def total_entries(self) -> int:
                      row = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM accounting_registry")
                      return int(row["n"]) if row else 0

                  def summary(self) -> Dict:
                      return {"entries": self.total_entries(),
                              "generated_at": self._clock.now()}
          ''')

          RECON = D(r'''
              # reconciliation_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from typing import Dict, List
              import uuid

              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration,
                  MigrationRunner,
              )

              _MIGRATIONS = (
                  Migration(1, "reconciliations", (
                      "CREATE TABLE IF NOT EXISTS reconciliations ("
                      " recon_id TEXT PRIMARY KEY,"
                      " matched INTEGER NOT NULL,"
                      " missing_in_bank INTEGER NOT NULL,"
                      " missing_in_internal INTEGER NOT NULL,"
                      " status TEXT NOT NULL,"
                      " generated_at REAL NOT NULL)",
                  )),
              )


              class ReconciliationEngine:
                  """Motor de conciliacion: interno vs
                  bancario, por clave (id + monto)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.recon",
                                      _MIGRATIONS).run(clock)

                  def reconcile(self, internal_records: List[dict],
                                bank_records: List[dict]) -> Dict:
                      def clave(item):
                          if isinstance(item, dict):
                              return (str(item.get("id",
                                      item.get("reference_id",
                                      item.get("entry_id", "")))),
                                      str(item.get("amount", "")))
                          return str(item)

                      bank_map = {}
                      for b in bank_records:
                          bank_map.setdefault(
                              clave(b), []).append(b)

                      matched = []
                      missing_bank = []
                      used = set()
                      for item in internal_records:
                          k = clave(item)
                          if k in bank_map and bank_map[k]:
                              matched.append(item)
                              used.add(id(bank_map[k].pop(0)))
                          else:
                              missing_bank.append(item)

                      missing_internal = [
                          b for b in bank_records
                          if id(b) not in used]

                      recon_id = f"REC-{uuid.uuid4()}"
                      status = ("RECONCILED"
                                if not missing_bank
                                and not missing_internal
                                else "DIFFERENCES_FOUND")
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO reconciliations"
                              " (recon_id, matched, missing_in_bank,"
                              " missing_in_internal, status, generated_at)"
                              " VALUES (?, ?, ?, ?, ?, ?)",
                              (recon_id, len(matched),
                               len(missing_bank),
                               len(missing_internal),
                               status, now))
                      return {"recon_id": recon_id,
                              "matched": len(matched),
                              "missing_in_bank": len(missing_bank),
                              "missing_in_internal":
                              len(missing_internal),
                              "internal_records":
                              len(internal_records),
                              "bank_records": len(bank_records),
                              "status": status,
                              "generated_at": now}
          ''')

          escribir("accounting_engine.py", "class AccountingEngine", ENGINE)
          escribir("journal_engine.py", "class JournalEngine", JOURNAL)
          escribir("balance_engine.py", "class BalanceEngine", BALANCE)
          escribir("accounting_validation_engine.py", "class AccountingValidationEngine", VALIDATION)
          escribir("accounting_registry.py", "class AccountingRegistry", REGISTRY)
          escribir("reconciliation_engine.py", "class ReconciliationEngine", RECON)

          # Verificacion: Decimal importado en balance
          try:
              btxt = (pathlib.Path(BASE) / "balance_engine.py").read_text(encoding="utf-8")
              out("- **verif: balance tiene import Decimal = " + str("from decimal import Decimal" in btxt) + "**")
          except Exception:
              pass

          try:
              initp = pathlib.Path(BASE) / "__init__.py"
              if not initp.exists():
                  initp.write_text("", encoding="utf-8")
          except Exception:
              pass

          # TEST corregido (Decimal vs Decimal)
          try:
              TEST = D(r'''
                  import pytest
                  from decimal import Decimal
                  from shared_engines.common.clocks import FrozenClock
                  from shared_engines.audit.chain import AuditTrail
                  from shared_engines.events.outbox import Outbox
                  from shared_engines.storage.database import SQLiteAdapter
                  from apps.nexo.domain.accounting.accounting_engine import AccountingEngine
                  from apps.nexo.domain.accounting.journal_engine import JournalEngine
                  from apps.nexo.domain.accounting.balance_engine import BalanceEngine
                  from apps.nexo.domain.accounting.accounting_validation_engine import AccountingValidationEngine
                  from apps.nexo.domain.accounting.accounting_registry import AccountingRegistry
                  from apps.nexo.domain.accounting.reconciliation_engine import ReconciliationEngine


                  def _db(tmp_path):
                      return SQLiteAdapter(tmp_path / "acc.db")


                  def test_create_entry_decimal(tmp_path) -> None:
                      db = _db(tmp_path)
                      eng = AccountingEngine(
                          db, FrozenClock(),
                          audit=AuditTrail(db, FrozenClock()))
                      e = eng.create_entry(
                          account_code="1101",
                          amount="100.00",
                          entry_type="DEBIT",
                          description="venta")
                      assert e["amount"] == "100.00"
                      assert e["status"] == "POSTED"
                      bal = eng.calculate_account_balance("1101")
                      assert bal == Decimal("100.00")
                      print("OK: asiento Decimal creado y balanceado")


                  def test_double_entry_journal_balance(tmp_path) -> None:
                      db = _db(tmp_path)
                      clock = FrozenClock()
                      eng = AccountingEngine(
                          db, clock,
                          audit=AuditTrail(db, clock))
                      jrn = JournalEngine(
                          db, clock,
                          outbox=Outbox(db, clock))
                      bal = BalanceEngine(db, clock)
                      d = eng.create_entry(
                          account_code="1101",
                          amount="500.00",
                          entry_type="DEBIT",
                          description="cobro")
                      c = eng.create_entry(
                          account_code="4001",
                          amount="500.00",
                          entry_type="CREDIT",
                          description="venta")
                      jrn.register_entry(d)
                      jrn.register_entry(c)
                      b = bal.calculate_balance([d, c])
                      assert Decimal(
                          b["net_balance"]) == Decimal("0")
                      assert Decimal(
                          b["total_debits"]) == Decimal(
                          b["total_credits"])
                      print("OK: partida doble DEBIT=CREDIT neto 0")


                  def test_validation_and_registry(tmp_path) -> None:
                      db = _db(tmp_path)
                      clock = FrozenClock()
                      val = AccountingValidationEngine(db, clock)
                      v = val.validate_entry({
                          "account_code": "AB",
                          "amount": -5,
                          "entry_type": "X"})
                      assert v["valid"] is False
                      assert len(v["errors"]) == 3
                      reg = AccountingRegistry(db, clock)
                      reg.register({
                          "entry_id": "ACC-1",
                          "account_code": "1101",
                          "amount": "50"})
                      assert reg.total_entries() == 1
                      assert reg.get_by_account("1101")
                      up = reg.update(
                          "ACC-1", {"status": "REVERSED"})
                      assert up["status"] == "REVERSED"
                      assert reg.delete("ACC-1") is True
                      assert reg.total_entries() == 0
                      print("OK: validacion + registry CRUD")


                  def test_reconciliation_match(tmp_path) -> None:
                      db = _db(tmp_path)
                      rec = ReconciliationEngine(
                          db, FrozenClock())
                      internos = [
                          {"id": "P1", "amount": "100"},
                          {"id": "P2", "amount": "200"}]
                      banco = [{"id": "P1", "amount": "100"}]
                      r = rec.reconcile(internos, banco)
                      assert r["matched"] == 1
                      assert r["missing_in_bank"] == 1
                      assert r["missing_in_internal"] == 0
                      assert r["status"] == "DIFFERENCES_FOUND"
                      print("OK: conciliacion detecta diferencias")
