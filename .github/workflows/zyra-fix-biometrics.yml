name: "ZYRA pilot: MPE biometric enrollment"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-pilot-mpe
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Apply MPE pilot patches
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path


          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)


          def read(p):
              f = Path(p)
              if not f.exists():
                  fail("file not found: " + p)
              return f.read_text(encoding="utf-8")


          def write(p, content):
              Path(p).write_text(content, encoding="utf-8")
              print("WROTE:", p)


          def insert_before(src, anchor, addition, marker, path):
              if marker in src:
                  print("SKIP (marker present):", path, "->", marker)
                  return src
              if anchor not in src:
                  fail("anchor not found in %s: %r" % (path, anchor))
              idx = src.index(anchor)
              print("INSERT before anchor in", path)
              return src[:idx] + addition + src[idx:]


          P_LINK = "apps/mi_primer_empleo/services/mpe_link.py"
          P_SERVER = "apps/mi_primer_empleo/server.py"
          P_API = "shared_engines/runtime/api.py"

          L = []
          L.append("    def enroll_user(")
          L.append("        self,")
          L.append("        *,")
          L.append("        display_name: str,")
          L.append("        doc_image_b64: str,")
          L.append("        selfie_image_b64: str,")
          L.append("        doc_kind: str | None = None,")
          L.append("        doc_country: str | None = None,")
          L.append("        doc_number: str | None = None,")
          L.append("    ) -> tuple[bool, dict | None, str | None]:")
          L.append("        payload: dict = {")
          L.append('            "kind": "person",')
          L.append('            "display_name": display_name,')
          L.append('            "actor": "mpe",')
          L.append('            "doc_image_b64": doc_image_b64,')
          L.append('            "selfie_image_b64": selfie_image_b64,')
          L.append("        }")
          L.append("        if doc_kind:")
          L.append('            payload["doc_kind"] = doc_kind')
          L.append("        if doc_country:")
          L.append('            payload["doc_country"] = doc_country')
          L.append("        if doc_number:")
          L.append('            payload["doc_number"] = doc_number')
          L.append("        return self._client.post(")
          L.append('            "/identity/enroll", payload')
          L.append("        )")
          L.append("")
          L.append("")
          LINK_ADD = "\n".join(L)

          F = []
          F.append("    def _register_form_html(self) -> str:")
          F.append('        return """<!DOCTYPE html>')
          F.append("<html>")
          F.append("<head>")
          F.append('<meta charset="utf-8">')
          F.append('<meta name="viewport" content="width=device-width, initial-scale=1">')
          F.append("<title>MPE Registro</title>")
          F.append("</head>")
          F.append('<body style="font-family:sans-serif;max-width:560px;margin:24px auto">')
          F.append("<h1>MPE - Registro</h1>")
          F.append('<form id="f" method="POST" action="/mpe/register">')
          F.append('<p>Nombre completo:<br><input name="name" required style="width:100%"></p>')
          F.append('<p>Tipo de cuenta:<br><select name="role"><option value="trabajador">Trabajador</option><option value="empresa">Empresa</option></select></p>')
          F.append('<p>Profesion (opcional):<br><input name="profession" style="width:100%"></p>')
          F.append('<fieldset><legend>1) Foto del documento</legend><input type="file" id="docFile" accept="image/*" capture="environment"></fieldset>')
          F.append("<fieldset><legend>2) Selfie en vivo</legend>")
          F.append('<video id="cam" width="240" height="180" autoplay playsinline muted></video><br>')
          F.append('<button type="button" id="snapBtn">Capturar selfie</button><br>')
          F.append('o desde archivo: <input type="file" id="selfieFile" accept="image/*" capture="user">')
          F.append("</fieldset>")
          F.append('<input type="hidden" name="doc_image_b64" id="docB64">')
          F.append('<input type="hidden" name="selfie_image_b64" id="selfieB64">')
          F.append('<p id="st">Estado: pendiente</p>')
          F.append('<button type="submit">Registrarme</button>')
          F.append("</form>")
          F.append('<canvas id="cv" style="display:none"></canvas>')
          F.append("<script>")
          F.append("(function(){")
          F.append("var doc=document.getElementById('docFile');")
          F.append("var slf=document.getElementById('selfieFile');")
          F.append("var vid=document.getElementById('cam');")
          F.append("var cv=document.getElementById('cv');")
          F.append("var cx=cv.getContext('2d');")
          F.append("var st=document.getElementById('st');")
          F.append("function upd(){st.textContent='Estado: doc='+(document.getElementById('docB64').value?'OK':'falta')+' | selfie='+(document.getElementById('selfieB64').value?'OK':'falta');}")
          F.append("function process(file,target){if(!file){return;}var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var max=800;var k=Math.min(1,max/Math.max(im.width,im.height));cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cx.drawImage(im,0,0,cv.width,cv.height);var d=cv.toDataURL('image/jpeg',0.72);document.getElementById(target).value=d.split(',')[1];upd();};im.src=r.result;};r.readAsDataURL(file);}")
          F.append("doc.addEventListener('change',function(){process(doc.files[0],'docB64');});")
          F.append("slf.addEventListener('change',function(){process(slf.files[0],'selfieB64');});")
          F.append("if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(function(s){vid.srcObject=s;}).catch(function(){st.textContent='Camara no disponible: use el archivo.';});}")
          F.append("document.getElementById('snapBtn').addEventListener('click',function(){if(!vid.videoWidth){st.textContent='Camara aun no lista.';return;}var w=480;var k=w/vid.videoWidth;cv.width=w;cv.height=Math.round(vid.videoHeight*k);cx.drawImage(vid,0,0,cv.width,cv.height);var d=cv.toDataURL('image/jpeg',0.72);document.getElementById('selfieB64').value=d.split(',')[1];upd();});")
          F.append("document.getElementById('f').addEventListener('submit',function(ev){if(!document.getElementById('docB64').value||!document.getElementById('selfieB64').value){ev.preventDefault();st.textContent='Falta foto del documento o selfie.';}});")
          F.append("})();")
          F.append("</script>")
          F.append("</body>")
          F.append('</html>"""')
          F.append("")
          F.append("")
          FORM_HTML = "\n".join(F)

          G = []
          G.append('            if path == "/mpe/register":')
          G.append("                self._send_html(")
          G.append("                    200,")
          G.append("                    self._register_form_html(),")
          G.append("                )")
          G.append("                return")
          G.append("")
          G.append("")
          GET_ROUTE_ADD = "\n".join(G)

          W = []
          W.append('        if role == "trabajador":')
          W.append("            doc_b64 = self._form_value(")
          W.append('                form, "doc_image_b64"')
          W.append("            )")
          W.append("            selfie_b64 = self._form_value(")
          W.append('                form, "selfie_image_b64"')
          W.append("            )")
          W.append("            if not doc_b64 or not selfie_b64:")
          W.append("                self._html_error(")
          W.append("                    400,")
          W.append('                    "se requiere foto del documento"')
          W.append('                    " y selfie",')
          W.append("                )")
          W.append("                return")
          W.append("            ok, data, _err = (")
          W.append("                self.link.enroll_user(")
          W.append("                    display_name=name,")
          W.append("                    doc_image_b64=doc_b64,")
          W.append("                    selfie_image_b64=selfie_b64,")
          W.append("                )")
          W.append("            )")
          W.append("            if not ok:")
          W.append("                self._html_error(")
          W.append("                    400,")
          W.append('                    "registro rechazado: " + str(_err),')
          W.append("                )")
          W.append("                return")
          W.append("        else:")
          W.append("            ok, data, _err = (")
          W.append("                self.link")
          W.append("                .register_company(")
          W.append("                    name")
          W.append("                )")
          W.append("            )")
          W.append("        if ok and data is not None:")
          W.append("            zid = _find_zid(data)")
          WORKER_NEW = "\n".join(W) + "\n"

          A = []
          A.append("        if (")
          A.append("            case.status != CASE_APPROVED")
          A.append("            and case.result is not None")
          A.append("            and case.result.duplicate_of is not None")
          A.append('            and str(case.result.duplicate_of).startswith("ZID-")')
          A.append("            and case.result.doc_match_score is not None")
          A.append("            and float(case.result.doc_match_score)")
          A.append('            >= float(getattr(engine._policy, "doc_auto", 0.55))')
          A.append("        ):")
          A.append("            existing_zid = str(case.result.duplicate_of)")
          A.append("            try:")
          A.append("                type(self).kernel.identity.require_identity(")
          A.append("                    existing_zid")
          A.append("                )")
          A.append("            except Exception:")
          A.append("                existing_zid = None")
          A.append("            if existing_zid is not None:")
          A.append("                self._ok(")
          A.append("                    {")
          A.append('                        "identity": {"zid": existing_zid},')
          A.append('                        "proofing": {')
          A.append('                            "case_id": case.case_id,')
          A.append('                            "status": case.status,')
          A.append('                            "linked": True,')
          A.append('                            "reason": "existing_identity_matched",')
          A.append("                        },")
          A.append("                    },")
          A.append("                    status=200,")
          A.append("                )")
          A.append("                return")
          A.append("")
          ANA_ADD = "\n".join(A) + "\n"

          link_src = read(P_LINK)
          link_src = insert_before(
              link_src,
              "    def register_company(",
              LINK_ADD,
              "def enroll_user",
              P_LINK,
          )

          server_src = read(P_SERVER)
          server_src = insert_before(
              server_src,
              '            if path == "/mpe/jobs":',
              GET_ROUTE_ADD,
              "self._register_form_html",
              P_SERVER,
          )
          server_src = insert_before(
              server_src,
              "    def _register(self) -> None:",
              FORM_HTML,
              "def _register_form_html",
              P_SERVER,
          )

          if "self.link.enroll_user" in server_src:
              print("SKIP worker block (marker present)")
          else:
              sl = server_src.splitlines(keepends=True)
              defs = [
                  i for i, x in enumerate(sl)
                  if x.rstrip("\r\n") == "    def _register(self) -> None:"
              ]
              if len(defs) != 1:
                  fail("def _register count %d (need 1)" % len(defs))
              d0 = defs[0]
              d1 = len(sl) - 1
              for i in range(d0 + 1, len(sl)):
                  if sl[i].startswith("    def "):
                      d1 = i
                      break
              win = sl[d0:d1 + 1]
              st = [
                  i for i, x in enumerate(win)
                  if x.rstrip("\r\n") == '        if role == "trabajador":'
              ]
              if len(st) != 1:
                  fail(
                      "worker start count %d inside _register (need 1)"
                      % len(st)
                  )
              s0 = st[0]
              en = [
                  i for i in range(s0 + 1, len(win))
                  if win[i].rstrip("\r\n") == "            zid = _find_zid(data)"
              ]
              if not en:
                  fail("worker end line not found inside _register")
              e0 = en[0]
              blk = "".join(win[s0:e0 + 1])
              if "register_user" not in blk or "register_company" not in blk:
                  fail("worker block sanity failed")
              new_win = win[:s0] + [WORKER_NEW] + win[e0 + 1:]
              server_src = (
                  "".join(sl[:d0])
                  + "".join(new_win)
                  + "".join(sl[d1 + 1:])
              )
              print("REPLACED worker block inside _register")

          api_src = read(P_API)
          if "existing_identity_matched" in api_src:
              print("SKIP api.py (marker present)")
          else:
              midx = api_src.index("def _handle_identity_enroll")
              mend = api_src.find("\n    def ", midx + 1)
              if mend == -1:
                  mend = len(api_src)
              seg = api_src[midx:mend]
              anc = "        if case.status != CASE_APPROVED:"
              if seg.count(anc) != 1:
                  fail("api anchor count %d (need 1)" % seg.count(anc))
              pos = midx + seg.index(anc)
              if "biometrics_gate" not in api_src[pos:pos + 1500]:
                  fail("api sanity failed")
              api_src = api_src[:pos] + ANA_ADD + api_src[pos:]
              print("INSERTED Ana-link block in api.py")

          compile(link_src, P_LINK, "exec")
          compile(server_src, P_SERVER, "exec")
          compile(api_src, P_API, "exec")
          print("COMPILE CHECK OK")

          write(P_LINK, link_src)
          write(P_SERVER, server_src)
          write(P_API, api_src)

          for marker in (
              "def _register_form_html",
              'if path == "/mpe/register":',
              "self.link.enroll_user",
          ):
              if marker not in Path(P_SERVER).read_text(encoding="utf-8"):
                  fail("post-check missing in server.py: " + marker)
          if "def enroll_user" not in Path(P_LINK).read_text(encoding="utf-8"):
              fail("post-check missing: mpe_link.enroll_user")
          if "existing_identity_matched" not in Path(P_API).read_text(encoding="utf-8"):
              fail("post-check missing: api.py linked identity")

          print("ALL PATCHES APPLIED OK")
          PYEOF

      - name: Syntax check
        run: |
          python3 -m py_compile apps/mi_primer_empleo/services/mpe_link.py apps/mi_primer_empleo/server.py shared_engines/runtime/api.py
          echo "SYNTAX OK"

      - name: Network biometrics self-test
        run: python3 -m shared_engines.security.biometrics -v

      - name: MPE tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/mi_primer_empleo/tests -q || true

      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add apps/mi_primer_empleo/services/mpe_link.py apps/mi_primer_empleo/server.py shared_engines/runtime/api.py
          if git diff --cached --quiet; then
            echo "No changes (already patched)."
          else
            git commit -m "MPE pilot: biometric enrollment via /identity/enroll" -m "mpe_link: +enroll_user. server: worker enrollment requires doc+selfie via /identity/enroll, new GET /mpe/register form. api: existing identity with matching doc returns same ZID (linked=true)."
            git push
          fi
