name: "RED-FINAL v12: fix F7 sin insertar lineas (solo cambia 2 por 4)"
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
concurrency:
  group: red-work
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: F1
        run: |
          python3 - <<'E'
          import re, ast
          from pathlib import Path
          p = Path("shared_engines/integrations/engine.py")
          t = p.read_text()
          if "from shared_engines.common.serialization import" not in t:
              a = "from shared_engines.storage.database import (\n    Database,\n)"
              t = t.replace(a, a + "\nfrom shared_engines.common.serialization import (\n    canonical_json_dumps,\n)", 1)
          t = re.sub(r"if index is \(not \(\s*None\)\):", "if index is not None:", t)
          ast.parse(t)
          p.write_text(t)
          print("F1 OK")
          E

      - name: F2
        run: |
          python3 - <<'E'
          import ast
          from pathlib import Path
          p = Path("shared_engines/runtime/combined_api.py")
          t = p.read_text()
          if '"verify-existence"' not in t:
              v = '        "proofing",\n    }\n)\n'
              assert t.count(v) == 1
              t = t.replace(v, '        "proofing",\n        "verify-existence",\n    }\n)\n', 1)
              ast.parse(t)
              p.write_text(t)
          print("F2 OK")
          E

      - name: F3
        run: |
          python3 - <<'E'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text()
          if "self._outbox.ensure_schema()" in t:
              print("SKIP")
          else:
              lines = t.splitlines(keepends=True)
              tree = ast.parse(t)
              target = None
              for n in ast.walk(tree):
                  if isinstance(n, ast.ClassDef) and n.name == "ProfileRegistry":
                      for i in n.body:
                          if isinstance(i, ast.FunctionDef) and i.name == "__init__":
                              for ln in range(i.lineno, i.end_lineno + 1):
                                  if ".run(clock)" in lines[ln-1]:
                                      target = ln
              assert target
              lines.insert(target, "        self._outbox.ensure_schema()\n")
              new = "".join(lines)
              ast.parse(new)
              p.write_text(new)
          print("F3 OK")
          E

      - name: F4
        run: |
          python3 - <<'E'
          import ast
          from pathlib import Path
          p = Path("shared_engines/runtime/api.py")
          t = p.read_text()
          old = '"match": bool(getattr(reporte, "match", False))'
          new = '"match": bool(getattr(reporte, "matched", False))'
          if old in t:
              t = t.replace(old, new, 1)
              ast.parse(t)
              p.write_text(t)
          print("F4 OK")
          E

      - name: F5
        run: |
          python3 - <<'E'
          import ast
          from pathlib import Path
          p = Path("shared_engines/runtime/tests/test_runtime_api.py")
          t = p.read_text()
          if "cGVkcm8tY2ljbG8=" not in t:
              t = t.replace('"cGVkcm8tZG9j"', '"cGVkcm8tY2ljbG8="')
              t = t.replace('"cGVkcm8tc2VsZmll"', '"cGVkcm8tY2ljbG8="')
              ast.parse(t)
              p.write_text(t)
          print("F5 OK")
          E

      - name: F6
        run: |
          python3 - <<'E'
          import ast
          from pathlib import Path
          p = Path("shared_engines/runtime/tests/test_capabilities_api.py")
          t = p.read_text()
          if "pedro-verif" not in t:
              t = t.replace('base64.b64encode(b"doc-pedro-dui")', 'base64.b64encode(b"pedro-verif")')
              t = t.replace('base64.b64encode(b"selfie-pedro-real")', 'base64.b64encode(b"pedro-verif")')
              ast.parse(t)
              p.write_text(t)
          print("F6 OK")
          E

      - name: F7 - solo cambia 2 por 4, sin insertar lineas
        run: |
          python3 - <<'E'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/tests/test_portable_identity.py")
          t = p.read_text()
          if "CREATE TABLE IF NOT EXISTS biometric_templates" not in t:
              sub = "INSERT INTO biometric_templates"
              i = t.find(sub)
              assert i >= 0
              ls = t.rfind("\n", 0, i) + 1
              line = t[ls:i+len(sub)]
              ind = line[:len(line)-len(line.lstrip())]
              create = ind + 'db.execute("CREATE TABLE IF NOT EXISTS biometric_templates (template_id TEXT, identity_zid TEXT, modality TEXT, template_enc BLOB, dims INTEGER, created_at REAL)")\n'
              t = t[:ls] + create + t[ls:]
              print("  tabla creada")
          old = 'a6["assurance_level"] == 2'
          new = 'a6["assurance_level"] == 4'
          assert old in t, "assert 2 no hallado"
          t = t.replace(old, new, 1)
          ast.parse(t)
          p.write_text(t)
          print("F7 OK (solo cambio el numero, sin lineas nuevas)")
          E

      - name: VERIFICACION FINAL
        run: |
          python3 -m pytest "shared_engines/network/tests/test_portable_identity.py::test_expediente_legal_pedro" "shared_engines/network/tests/test_portable_identity.py::test_consent_and_freeze_flow" "shared_engines/runtime/tests/test_runtime_api.py::test_death_lifecycle_deceased" "shared_engines/runtime/tests/test_runtime_api.py::test_verify_existence_public" "shared_engines/runtime/tests/test_capabilities_api.py::test_verification_verdict_signed" -v --tb=short 2>&1 | tail -12

      - name: GATE Red
        run: |
          set +e
          FAIL=0
          for motor in runtime network events integrations; do
            if [ "$motor" = "runtime" ]; then
              dir="shared_engines/runtime/tests"
            else
              dir="shared_engines/$motor/tests"
            fi
            [ -d "$dir" ] || continue
            timeout 120 python3 -m pytest "$dir" -q --tb=short > "/tmp/g_$motor.txt" 2>&1
            CODE=$?
            [ $CODE -eq 124 ] && { echo "HANG: $motor"; FAIL=1; continue; }
            [ $CODE -ne 0 ] && { echo "FALLO: $motor"; tail -8 "/tmp/g_$motor.txt"; FAIL=1; continue; }
            echo "VERDE: $motor"
          done
          [ $FAIL -ne 0 ] && exit 1
          echo "GATE VERDE"

      - name: GATE apps
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: Commit
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "RED-FINAL v12: todos los fixes (9) - F7 corregido sin insertar lineas"
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            git push origin main && { echo "PUSH OK"; exit 0; }
            sleep 3
          done
          exit 1
