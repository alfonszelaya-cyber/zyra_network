name: ZYRA AXIS Block 10

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair clearance_ops (remove broken leftovers)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/axis/life_history/"
              "clearance_ops.py"
          )
          src = path.read_text(encoding="utf-8")

          src = src.replace(
              "          ClearanceHandler._form = ClearanceHandler._form\n",
              "",
          )
          src = src.replace(
              "          ClearanceHandler._form_data = (\n"
              "              ClearanceHandler._form_data\n"
              "          )\n",
              "",
          )
          src = src.replace(
              "          ClearanceHandler._req = staticmethod(\n"
              "              ClearanceHandler._req\n"
              "          )\n",
              "",
          )
          src = src.replace(
              "          ClearanceHandler._form_data2 = (\n"
              "              ClearanceHandler._form_data2\n"
              "          )\n",
              "",
          )
          src = src.replace(
              "          ClearanceHandler._req = staticmethod(\n"
              "              ClearanceHandler._req\n"
              "          )\n",
              "",
          )
          src = src.replace(
              "def _form_data2(self) -> None:\n"
              "                  pass\n\n",
              "",
          )
          src = src.replace(
              "def _form_data2(self) -> None:\n"
              "              pass\n\n",
              "",
          )
          src = src.replace(
              "          def _form_data2(self) -> None:\n"
              "              pass\n",
              "",
          )
          src = src.replace(
              "def _form_data2(self) -> None:\n              pass\n",
              "",
          )
          src = src.replace(
              "def _form_data2(self) -> None:\n"
              "                  pass",
              "",
          )

          lines = src.split("\n")
          cleaned = []
          skip_next = 0
          for i, line in enumerate(lines):
              if skip_next > 0:
                  skip_next -= 1
                  continue
              if "_form_data2" in line:
                  if "def" in line:
                      skip_next = 1
                  continue
              if (
                  "ClearanceHandler._form" in line
                  and "def" not in line
              ):
                  continue
              if (
                  "ClearanceHandler._req" in line
                  and "def" not in line
              ):
                  continue
              cleaned.append(line)
          src = "\n".join(cleaned)

          src = src.replace(
              "self._req_static(",
              "_req_static(",
          )
          src = src.replace(
              "@staticmethod\n              def _req_static(doc, key) -> str:",
              "    @staticmethod\n    def _req_static(doc, key) -> str:",
          )

          path.write_text(src, encoding="utf-8")
          print("CLEANED")

          import ast

          ast.parse(src)
          print("SYNTAX OK")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/3 Clearance screen E2E
        run: python -m apps.axis.life_history.tests.test_clearance_ops -v

      - name: 2/3 Access control tests
        run: python -m apps.axis.life_history.access_control -v

      - name: 3/3 Full regression (all suites)
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q
          python -m apps.axis.life_history.tests.test_justice_service -q
          python -m apps.axis.life_history.tests.test_security_service -q
          python -m apps.axis.life_history.tests.test_ops_server -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "axis: clearance ops cleaned - complete"
            git push
          fi
