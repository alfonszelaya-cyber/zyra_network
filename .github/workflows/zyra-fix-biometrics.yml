name: "RED-RELAY v4: fix integrations (import) + network (ensure_schema) + runtime aislado por archivo"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Fix 1 - engine.py: importar canonical_json_dumps (SourceIndex.record lo usa y no estaba importado)"
        run: |
          python3 - <<'F1EOF'
          from pathlib import Path
          p = Path("shared_engines/integrations/engine.py")
          t = p.read_text(encoding="utf-8")
          if "canonical_json_dumps" in t and "from shared_engines.common.serialization import" in t:
              print("SKIP 1 (import ya presente)")
              raise SystemExit(0)
          ANCLA = "from shared_engines.storage.database import (\n    Database,\n)"
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla import " + str(cnt)
          t = t.replace(ANCLA, ANCLA + "from shared_engines.common.serialization import (\n    canonical_json_dumps,\n)", 1)
          import ast
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 1: canonical_json_dumps importado (AST valido)")
          F1EOF

      - name: "Fix 2 - network tests: ensure_schema del outbox en los 2 tests que usan db sin kernel"
        run: |
          python3 - <<'F2EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/tests/test_portable_identity.py")
          t = p.read_text(encoding="utf-8")
          n = t.count("outbox=Outbox(db, clock))")
          assert n == 2, "anclas outbox " + str(n) + " (esperaba 2)"
          t = t.replace(
              "outbox=Outbox(db, clock))",
              "outbox=Outbox(db, clock))\n                  outbox.ensure_schema()",
          )
          import ast as a
          a.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 2: ensure_schema agregado a los 2 tests (AST valido)")
          F2EOF

      - name: "Fix 3 - ProfileRegistry asegurara el schema del outbox (hardening real: el engine garantiza su dependencia)"
        run: |
          python3 - <<'F3EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "self._outbox.ensure_schema()" in t:
              print("SKIP 3 (hardening ya presente)")
              raise SystemExit(0)
          ANCLA = (
              "        MigrationRunner(\n"
              "            db,\n"
              '            "network_portable_profile",\n'
              "            _MIGRATIONS,\n"
              "        ).run(clock)"
          )
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla init " + str(cnt)
          t = t.replace(ANCLA, ANCLA + "\n        self._outbox.ensure_schema()", 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 3: ProfileRegistry asegura outbox schema (hardening, AST valido)")
          F3EOF

      - name: "Verificacion: sweep con fixtures guarda 25 snapshots + tests network reparados"
        run: |
          python3 - <<'VEOF'
          import json
          from pathlib import Path
          import tempfile
          from shared_engines.integrations.engine import (
              PublicSourceClient, SourceIndex,
              sweep_onec, sweep_marn, ONEC_ENDPOINTS,
              ARCGIS_SERVICES)
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          tmp = Path(tempfile.mkdtemp())
          geo = json.dumps({"type": "FeatureCollection", "features": [{"type": "Feature"}, {"type": "Feature"}]}).encode("utf-8")
          meta = json.dumps({"layers": [{"id": 0, "name": "a"}, {"id": 1, "name": "b"}]}).encode("utf-8")
          one = json.dumps([{"codigo": "0111101"}]).encode("utf-8")
          def opener(url):
              if url.endswith("?f=json"):
                  return meta
              if "/query" in url:
                  return geo
              if url.endswith(tuple(ONEC_ENDPOINTS)):
                  return one
              raise OSError("no simulada")
          cli = PublicSourceClient(clock=FrozenClock(), ttl_seconds=60.0, opener=opener)
          index = SourceIndex(SQLiteAdapter(tmp / "src.db"), FrozenClock())
          r1 = sweep_onec(cli, index)
          assert r1["ok"] == 7, str(r1)
          r2 = sweep_marn(cli, index, max_layers_per_service=2, pause_seconds=0)
          assert r2["layers_ok"] == 2 * len(ARCGIS_SERVICES["marn-geo"]), str(r2)
          rows = index._db.query_all("SELECT * FROM source_snapshots")
          assert len(rows) == 7 + 2 * len(ARCGIS_SERVICES["marn-geo"]), len(rows)
          print("OK sweep: " + str(len(rows)) + " snapshots durables")
          VEOF
          python3 -m pytest shared_engines/network/tests/test_portable_identity.py shared_engines/network/tests/test_document_exchange.py shared_engines/network/tests/test_life_history.py -q --tb=short 2>&1 | tail -4

      - name: "GATE runtime AISLADO POR ARCHIVO con timeout (el sospechoso del hang queda identificado)"
        run: |
          set +e
          for f in shared_engines/runtime/tests/test_*.py; do
            nombre=$(basename "$f" .py)
            timeout 90 python3 -m pytest "$f" -q --tb=line > "/tmp/rt_$nombre.txt" 2>&1
            CODE=$?
            if [ $CODE -eq 124 ]; then
              echo "HANG: $nombre"
            elif [ $CODE -ne 0 ]; then
              echo "FALLO: $nombre"
              tail -6 "/tmp/rt_$nombre.txt"
            else
              echo "VERDE: $nombre :: $(tail -1 /tmp/rt_$nombre.txt)"
            fi
          done
          echo "=============================="

      - name: "GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "SOLO SI FALLO: diagnostico al Resumen (incluye runtime aislado -vv del archivo culpable)"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-RELAY v4"
            echo
            for f in /tmp/rt_*.txt; do
              echo "#### $f"
              tail -15 "$f"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-RELAY v4: fixes de gate por motor - import faltante + ensure_schema + hardening ProfileRegistry" -m "Diagnostico exacto del gate por motor: (1) integrations test_sweep_all_sources 0 snapshots: SourceIndex.record usa canonical_json_dumps que NUNCA se importo en engine.py (el sweep lo tragaba silencioso) -> import anadido; (2) network test_consent/expediente: no such table events_outbox - los tests crean Outbox sin ensure_schema y sin kernel -> ensure_schema agregado a los tests + HARDENING real: ProfileRegistry.__init__ ahora asegura el schema del outbox el mismo (el engine garantiza su dependencia); (3) runtime HANG 120s: gate runtime dividido por archivo con timeout para identificar el test culpable exacto (sospechoso: el nuevo test de relay - su resultado aislado -vv queda en el Resumen). Scheduler + rutas + test de distribucion autonoma ya aplicados en runs previos."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
