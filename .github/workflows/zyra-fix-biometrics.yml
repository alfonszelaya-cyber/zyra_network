              load = storage_load_db(db,
                                     "BODEGA-CENTRAL")
              assert load["by_product"][0]["weight"] \
                  == 85.0
              assert load["by_product"][0]["rejected"] \
                  == 1.0
              print("OK A-6: cosecha (plan cancelado rechazado, regla 66) + lotes con calidad/rechazos + trazabilidad plan->cosecha->lote + carga por almacen")


          def test_a7_ganaderia_expediente_eventos(tmp_path) -> None:
              db = _db(tmp_path, "a7.db")
              with pytest.raises(ValueError):
                  register_animal_db(db, producer_id="P1",
                      species=" ")
              toro = register_animal_db(db,
                  producer_id="P1", species="BOVINO",
                  breed="simmental",
                  birth_date="2023-01-01",
                  created_at="2026-01-01")
              with pytest.raises(LookupError):
                  register_animal_db(db, producer_id="P1",
                      species="BOVINO", sire_id="NO")
              vaca = register_animal_db(db,
                  producer_id="P1", species="BOVINO",
                  created_at="2026-01-01")
              becerro = register_animal_db(db,
                  producer_id="P1", species="BOVINO",
                  sire_id=toro["animal_id"],
                  dam_id=vaca["animal_id"],
                  created_at="2026-02-01")
              gen = genealogy_of_db(db,
                                    becerro["animal_id"])
              assert gen["sire"]["animal_id"] \
                  == toro["animal_id"]
              assert gen["dam"]["animal_id"] \
                  == vaca["animal_id"]
              add_event_db(db, animal_id=toro["animal_id"],
                  kind="VACUNA", detail="aftosa",
                  event_date="2026-03-01")
              add_event_db(db, animal_id=toro["animal_id"],
                  kind="PESO", value=450.5,
                  event_date="2026-03-02")
              ev = events_of_db(db, toro["animal_id"])
              assert len(ev) == 2
              assert ev[1]["value"] == 450.5
              with pytest.raises(ValueError):
                  add_event_db(db,
                      animal_id=toro["animal_id"],
                      kind="BAÑO")
              add_event_db(db, animal_id=toro["animal_id"],
                  kind="MUERTE",
                  event_date="2026-03-10")
              assert animal_of_db(
                  toro["animal_id"])["status"] == "muerto"
              with pytest.raises(ValueError):
                  add_event_db(db,
                      animal_id=toro["animal_id"],
                      kind="PESO", value=1)
              vivos = animals_of_db(db, "P1",
