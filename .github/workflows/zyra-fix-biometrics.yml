name: "ZYRA FASE1 paso1: lectura quirurgica 4 criticos + fix datetime AGRO"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "[LECTURA] N-1: accounting_engine + journal completos"
        run: |
          python3 << 'PYEOF'
          import os, pathlib
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          for ruta in ("apps/nexo/domain/accounting/accounting_engine.py",
                       "apps/nexo/domain/accounting/journal_engine.py"):
              p = pathlib.Path(ruta)
              out("## ARCHIVO COMPLETO: " + ruta)
              if not p.exists():
                  out("- NO EXISTE")
                  continue
              out("```python")
              out(p.read_text(encoding="utf-8", errors="replace"))
              out("```")
          PYEOF
          exit 0

      - name: "[LECTURA] S-1: semilla server (secciones store/registro) + semilla_store completo"
        run: |
          python3 << 'PYEOF'
          import ast, os, pathlib, re
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          sp = pathlib.Path("apps/semilla/server.py")
          out("## server.py SEMILLA (" + str(sp.stat().st_size) + "b)")
          txt = sp.read_text(encoding="utf-8", errors="replace")
          out("### USO DE SemillaStore / stores (lineas con store)")
          for i, ln in enumerate(txt.split("\n"), 1):
              if re.search(r"\b(store|SemillaStore|StudentRegistry|sm_students|semilla_accounts)\b", ln):
                  out(str(i) + ": " + ln.strip()[:150])
          out("### RUTAS de registro/persona/enroll (def y rutas)")
          for i, ln in enumerate(txt.split("\n"), 1):
              if re.search(r"(def |enroll|register|/identity)", ln):
                  out(str(i) + ": " + ln.strip()[:150])
          st = pathlib.Path("apps/semilla/infrastructure/persistence/semilla_store.py")
          out("## ARCHIVO COMPLETO: " + str(st))
          out("```python")
          out(st.read_text(encoding="utf-8", errors="replace"))
          out("```")
          PYEOF
          exit 0

      - name: "[LECTURA] AX-1/AX-2: axis server (birth-register + apps/register) + 3 tests fallando + api birth-zid"
        run: |
          python3 << 'PYEOF'
          import ast, os, pathlib, re
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          sp = pathlib.Path("apps/axis/server.py")
          txt = sp.read_text(encoding="utf-8", errors="replace")
          lines = txt.split("\n")
          out("## axis/server.py — SECCION: birth-register")
          for i, ln in enumerate(lines, 1):
              if re.search(r"birth", ln, re.IGNORECASE):
                  out(str(i) + ": " + ln.strip()[:160])
          out("### bloque birth-register completo (funcion que lo maneja)")
          tree = ast.parse(txt)
          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef) and re.search(
                      r"birth", node.name, re.IGNORECASE):
                  out("**def " + node.name + "** lineas "
                      + str(node.lineno) + "-" + str(node.end_lineno))
                  out("```python")
                  out("\n".join(lines[node.lineno - 1:node.end_lineno]))
                  out("```")
          out("## axis/server.py — SECCION: apps/register y rate limit")
          for i, ln in enumerate(lines, 1):
              if re.search(r"(apps/register|RateLimiter|rate_limit|429)", ln):
                  out(str(i) + ": " + ln.strip()[:160])
          out("## shared_engines/runtime/api.py — SECCION birth-zid")
          ap = pathlib.Path("shared_engines/runtime/api.py")
          atxt = ap.read_text(encoding="utf-8", errors="replace")
          alines = atxt.split("\n")
          for i, ln in enumerate(alines, 1):
              if re.search(r"birth", ln, re.IGNORECASE):
                  out(str(i) + ": " + ln.strip()[:160])
          tree2 = ast.parse(atxt)
          for node in ast.walk(tree2):
              if isinstance(node, ast.FunctionDef) and re.search(
                      r"birth", node.name, re.IGNORECASE):
                  out("**def " + node.name + "** lineas "
                      + str(node.lineno) + "-" + str(node.end_lineno))
                  out("```python")
                  out("\n".join(alines[node.lineno - 1:node.end_lineno]))
                  out("```")
          out("## TESTS que fallan (completos)")
          for tf in ("apps/axis/tests/test_axis_stress.py",
                     "apps/axis/tests/test_axis_load.py"):
              p = pathlib.Path(tf)
              if p.exists():
                  out("### " + tf)
                  out("```python")
                  out(p.read_text(encoding="utf-8", errors="replace"))
                  out("```")
          base = pathlib.Path("apps/axis/tests")
          if base.exists():
              for p in sorted(base.rglob("test_*.py")):
                  t = p.read_text(encoding="utf-8", errors="replace")
                  if re.search(r"load_50_births|health_exam_followup|emergency_coordinated", t):
                      out("### " + str(p))
                      out("```python")
                      out(t)
                      out("```")
          lh = pathlib.Path("apps/axis/life_history/store.py")
          if lh.exists():
              out("## life_history/store.py — FIRMAS (register_birth, attach_zid)")
              ltxt = lh.read_text(encoding="utf-8", errors="replace")
              ltree = ast.parse(ltxt)
              for node in ast.walk(ltree):
                  if isinstance(node, ast.ClassDef):
                      for m in node.body:
                          if isinstance(m, ast.FunctionDef) and re.search(
                                  r"birth|attach_zid", m.name):
                              out("**" + node.name + "."
                                  + m.name + "** lineas "
                                  + str(m.lineno) + "-"
                                  + str(m.end_lineno))
          lsvc = pathlib.Path("apps/axis/life_history/service.py")
          if lsvc.exists():
              out("## life_history/service.py — COMENTARIOS sobre enroll/identity (para corregir doc)")
              for i, ln in enumerate(lsvc.read_text(
                      encoding="utf-8", errors="replace").split("\n"), 1):
                  if re.search(r"enroll|identity/enroll|biometric", ln,
                               re.IGNORECASE):
                      out(str(i) + ": " + ln.strip()[:160])
          sub = pathlib.Path("apps/subastas/services/subastas_link.py")
          if sub.exists():
              out("## subastas_link.py — COMENTARIOS enroll (para corregir doc)")
              for i, ln in enumerate(sub.read_text(
                      encoding="utf-8", errors="replace").split("\n"), 1):
                  if re.search(r"enroll|ONLY|born", ln, re.IGNORECASE):
                      out(str(i) + ": " + ln.strip()[:160])
          PYEOF
          exit 0

      - name: "[ESCRITURA] datetime timezone-aware AGRO (3 archivos, idempotente)"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          migrados = 0
          saltados = 0
          try:
              bp = pathlib.Path("apps/agro")
              for p in sorted(bp.rglob("*.py")):
                  try:
                      txt = p.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  if "datetime.utcnow()" not in txt:
                      continue
                  stripped = [ln.strip() for ln in txt.split("\n")]
                  caso_a = ("from datetime import datetime" in stripped)
                  caso_b = "import datetime" in stripped
                  if not (caso_a or caso_b):
                      saltados = saltados + 1
                      out("- " + str(p) + ": import no standard — SALTADO")
                      continue
                  new = txt
                  if caso_b:
                      new = new.replace(
                          "datetime.datetime.utcnow()",
                          "datetime.datetime.now(datetime.timezone.utc)")
                  new = new.replace("datetime.utcnow()",
                                    "datetime.now(timezone.utc)")
                  if caso_a and not caso_b:
                      lines = new.split("\n")
                      lines = [(ln.replace(
                          "from datetime import datetime",
                          "from datetime import datetime, timezone")
                          if ln.strip() == "from datetime import datetime"
                          else ln) for ln in lines]
                      new = "\n".join(lines)
                  try:
                      ast.parse(new)
                  except Exception:
                      saltados = saltados + 1
                      out("- " + str(p) + ": transform invalida — SALTADO")
                      continue
                  p.write_text(new, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  migrados = migrados + 1
          except Exception:
              out("ERROR: " + traceback.format_exc().strip())
          out("- **AGRO migrados: " + str(migrados) + " | saltados: "
              + str(saltados) + "**")
          out("## FIN paso 1 — con estos dumps hago los 4 criticos exactos en el run siguiente")
          PYEOF
          exit 0

      - name: "[LECTURA] verificar AGRO no rompio (33 tests)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ag.out 2>&1
          echo $? > /tmp/ag
          if [ "$(cat /tmp/ag)" = "0" ]; then echo "- AGRO tras migracion: ✅ (33 tests)" >> "$GITHUB_STEP_SUMMARY"; else echo "- AGRO: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### AGRO detalle"; echo '```'; tail -60 /tmp/ag.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[ESCRITURA git] commit solo si AGRO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/ag 2>/dev/null || echo 1)" != "0" ]; then
            log "**AGRO fallo — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "fix(AGRO): datetime timezone-aware (deprecated utcnow migrado, regla 61/74) + dumps de lectura para FASE 1 criticos"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — AGRO timezone corregido + dumps listos. Run siguiente: FASE 1 escritura (los 4 criticos con cirugia exacta).**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          exit 1
