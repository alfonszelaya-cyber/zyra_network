name: ZYRA Hardening Block 4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix test key (guaranteed 64 hex chars)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "network/transport/tcp_transport.py"
          )
          src = path.read_text(encoding="utf-8")

          start = src.find('_TEST_KEY = (')
          if start == -1:
              print("RESULT: no split key found (already fixed)")
          else:
              end = src.find(')', start)
              if end == -1:
                  raise SystemExit("parenthesis not found - aborting")
              replacement = '_TEST_KEY = "ab" * 32'
              fixed = (
                  src[:start]
                  + replacement
                  + src[end + 1:]
              )
              path.write_text(fixed, encoding="utf-8")
              print("RESULT: KEY FIXED")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest

      - name: 1/3 TCP transport tests
        run: python -m network.transport.tcp_transport -v

      - name: 2/3 Security regression (biometrics 13 + PAD)
        run: |
          pip install "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"
          python -m shared_engines.security.biometrics -v
          python - <<'PYEOF'
          import unittest

          loader = unittest.TestLoader()
          from shared_engines.security import (
              biometrics_face,
          )

          suite = loader.loadTestsFromName(
              "shared_engines.security.biometrics_face"
              ".LivenessHeuristicTests"
          )
          result = unittest.TextTestRunner(
              verbosity=1
          ).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print("PAD OK")
          PYEOF

      - name: 3/3 Runtime tests stay green
        run: python -m pytest shared_engines/runtime/tests -q

      - name: Commit key fix (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add network/transport/tcp_transport.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "transport: use guaranteed-64-hex test key"
            git push
          fi
