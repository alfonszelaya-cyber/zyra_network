name: "AGRO RUN B: GPT-7 permisos por rol + auditoria hash-chain"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - capa security real (carpetas existentes)"
        run: |
          python3 - <<'SECEOF'
          import textwrap
          from pathlib import Path

          FILES = {
              "apps/agro/security/operation_matrix.py": textwrap.dedent('''\
                  """AGRO - matriz rol -> operaciones (GPT-7).
                  Contrato unico de autorizacion: una operacion
                  solo es ejecutable si la matriz la autoriza
                  para el rol del actor."""
                  from __future__ import annotations

                  GOV_OPS = frozenset({
                      "producer.verify",
                      "aid.evaluate",
                      "aid.approve",
                      "aid.assign",
                      "aid.deliver",
                      "aid.confirm",
                  })
                  PRODUCER_OPS = frozenset({
                      "land.create",
                      "machinery.create",
                      "inventory.create",
                      "water.create",
                      "sale.create",
                      "sale.complete",
                      "risk.report",
                      "risk.resolve",
                      "production.create",
                  })
                  ALL_OPS = GOV_OPS | PRODUCER_OPS
                  ROLE_OPERATIONS = {
                      "gobierno": ALL_OPS,
                      "agricultor": PRODUCER_OPS,
                      "ganadero": PRODUCER_OPS,
                      "institucion": frozenset({"sale.create"}),
                      "banco": frozenset({"sale.create"}),
                  }

                  def allows(role, operation):
                      ops = ROLE_OPERATIONS.get(
                          str(role or "").strip(), frozenset()
                      )
                      return str(operation) in ops
              '''),
              "apps/agro/security/security_context.py": textwrap.dedent('''\
                  """AGRO - contexto de seguridad del actor."""
                  from __future__ import annotations


                  class SecurityContext:
                      def __init__(
                          self,
                          actor_id: str = "",
                          actor_role: str = "",
                      ) -> None:
                          self.actor_id = str(actor_id or "").strip()
                          self.actor_role = str(
                              actor_role or ""
                          ).strip()

                      @staticmethod
                      def from_headers(headers) -> "SecurityContext":
                          return SecurityContext(
                              actor_id=(
                                  headers.get("X-ZYRA-Actor-Id")
                                  or ""
                              ),
                              actor_role=(
                                  headers.get("X-ZYRA-Actor-Role")
                                  or ""
                              ),
                          )
              '''),
              "apps/agro/security/access_control.py": textwrap.dedent('''\
                  """AGRO - decision de acceso por matriz."""
                  from __future__ import annotations

                  from apps.agro.security.operation_matrix import (
                      allows as matrix_allows,
                  )


                  class AccessControl:
                      def check(
                          self, ctx, operation
                      ) -> tuple[bool, str]:
                          if not ctx.actor_role:
                              return (
                                  False,
                                  "actor sin rol declarado"
                                  " (header X-ZYRA-Actor-Role)",
                              )
                          if not matrix_allows(
                              ctx.actor_role, operation
                          ):
                              return (
                                  False,
                                  "rol sin permiso: "
                                  + ctx.actor_role
                                  + " / "
                                  + str(operation),
                              )
                          return (True, "ok")
              '''),
              "apps/agro/security/security_gateway.py": textwrap.dedent('''\
                  """AGRO - puerta de seguridad unica (GPT-7).
                  Toda operacion regulada pasa por aqui:
                  permitida o rechazada con motivo."""
                  from __future__ import annotations

                  from apps.agro.security.access_control import (
                      AccessControl,
                  )
                  from apps.agro.security.operation_matrix import (
                      ALL_OPS,
                  )
                  from apps.agro.security.security_context import (
                      SecurityContext,
                  )


                  class SecurityGateway:
                      def __init__(self) -> None:
                          self._access = AccessControl()

                      @staticmethod
                      def context(headers) -> SecurityContext:
                          return SecurityContext.from_headers(
                              headers
                          )

                      def check(
                          self, ctx, operation
                      ) -> tuple[bool, str]:
                          if str(operation) not in ALL_OPS:
                              return (True, "operacion no regulada")
                          return self._access.check(
                              ctx, operation
                          )
              '''),
              "apps/agro/modules/seguridad/auditoria/audit_service.py": textwrap.dedent('''\
                  """AGRO - auditoria resistente a modificaciones
                  (GPT-7): cadena de hash por evento. Alterar una
                  fila rompe la cadena y verify() lo detecta."""
                  from __future__ import annotations

                  import hashlib
                  import time as _t


                  class AuditChainService:
                      def __init__(self, db) -> None:
                          self._db = db
                          self._ensure()

                      def _ensure(self) -> None:
                          self._db.execute(
                              "CREATE TABLE IF NOT EXISTS"
                              " agro_audit_chain ("
                              " seq INTEGER PRIMARY KEY"
                              " AUTOINCREMENT,"
                              " ts TEXT NOT NULL,"
                              " actor TEXT NOT NULL,"
                              " role TEXT NOT NULL,"
                              " operation TEXT NOT NULL,"
                              " outcome TEXT NOT NULL,"
                              " prev_hash TEXT NOT NULL,"
                              " event_hash TEXT NOT NULL)"
                          )

                      def _last_hash(self) -> str:
                          for name in ("query_one", "query"):
                              fn = getattr(self._db, name, None)
                              if callable(fn):
                                  try:
                                      row = fn(
                                          "SELECT event_hash FROM"
                                          " agro_audit_chain ORDER"
                                          " BY seq DESC LIMIT 1"
                                      )
                                  except Exception:
                                      row = None
                                  if row:
                                      try:
                                          return str(
                                              row["event_hash"]
                                          )
                                      except Exception:
                                          try:
                                              return str(row[0])
                                          except Exception:
                                              return ""
                          return ""

                      def append(
                          self, *,
                          actor: str,
                          role: str,
                          operation: str,
                          outcome: str,
                      ) -> str:
                          prev = self._last_hash()
                          ts = _t.strftime(
                              "%Y-%m-%dT%H:%M:%SZ",
                              _t.gmtime(),
                          )
                          event_hash = hashlib.sha256(
                              (prev + "|" + ts + "|" + actor
                               + "|" + role + "|" + operation
                               + "|" + outcome).encode("utf-8")
                          ).hexdigest()
                          self._db.execute(
                              "INSERT INTO agro_audit_chain ("
                              " ts, actor, role, operation,"
                              " outcome, prev_hash, event_hash)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?)",
                              (ts, actor, role, operation,
                               outcome, prev, event_hash),
                          )
                          return event_hash

                      def verify(self) -> dict:
                          rows = []
                          for name in (
                              "query_all", "query", "fetchall"
                          ):
                              fn = getattr(self._db, name, None)
                              if callable(fn):
                                  try:
                                      got = fn(
                                          "SELECT seq, ts, actor,"
                                          " role, operation, outcome,"
                                          " prev_hash, event_hash FROM"
                                          " agro_audit_chain ORDER BY"
                                          " seq ASC"
                                      )
                                  except Exception:
                                      got = None
                                  if got:
                                      rows = list(got)
                                      break

                          def g(row, key, idx):
                              try:
                                  return str(row[key])
                              except Exception:
                                  try:
                                      return str(row[idx])
                                  except Exception:
                                      return ""

                          prev = ""
                          count = 0
                          broken_at = None
                          for row in rows:
                              try:
                                  seq = int(row["seq"])
                              except Exception:
                                  try:
                                      seq = int(row[0])
                                  except Exception:
                                      continue
                              ts = g(row, "ts", 1)
                              actor = g(row, "actor", 2)
                              role = g(row, "role", 3)
                              op = g(row, "operation", 4)
                              outcome = g(row, "outcome", 5)
                              ph = g(row, "prev_hash", 6)
                              eh = g(row, "event_hash", 7)
                              calc = hashlib.sha256(
                                  (ph + "|" + ts + "|" + actor
                                   + "|" + role + "|" + op
                                   + "|" + outcome).encode("utf-8")
                              ).hexdigest()
                              if ph != prev or eh != calc:
                                  broken_at = seq
                                  break
                              prev = eh
                              count += 1
                          return {
                              "ok": broken_at is None,
                              "entries": len(rows),
                              "verified": count,
                              "broken_at": broken_at,
                          }
              '''),
          }

          for path, content in FILES.items():
              p = Path(path)
              if not p.exists():
                  print("MISS", path)
                  continue
              compile(content, path, "exec")
              p.write_text(content, encoding="utf-8")
              print("OK", path)
          SECEOF

      - name: "Paso 2 - server: guardia de permisos + auditoria en cada POST + verify"
        run: |
          python3 - <<'SRVEOF'
          from pathlib import Path

          sp = Path("apps/agro/server.py")
          t = sp.read_text(encoding="utf-8")

          if "_ZYRA_SEC_V2" in t:
              print("SKIP server ya aplicado")
              raise SystemExit(0)

          HELPERS = [
              "    def _ZYRA_SEC_V2(self):\n",
              "        from apps.agro.security.security_gateway import (\n",
              "            SecurityGateway,\n",
              "        )\n",
              "        return SecurityGateway()\n",
              "\n",
              "    def _ZYRA_AUDIT_V2(self, operation, outcome):\n",
              "        from apps.agro.modules.seguridad.auditoria.audit_service import (\n",
              "            AuditChainService,\n",
              "        )\n",
              "        try:\n",
              "            svc = AuditChainService(\n",
              "                type(self).store._db\n",
              "            )\n",
              "            svc.append(\n",
              "                actor=(\n",
              "                    self.headers.get(\n",
              "                        \"X-ZYRA-Actor-Id\"\n",
              "                    ) or \"anon\"\n",
              "                ),\n",
              "                role=(\n",
              "                    self.headers.get(\n",
              "                        \"X-ZYRA-Actor-Role\"\n",
              "                    ) or \"-\"\n",
              "                ),\n",
              "                operation=operation,\n",
              "                outcome=outcome,\n",
              "            )\n",
              "        except Exception:\n",
              "            pass\n",
              "\n",
              "    def _ZYRA_AUDIT_VERIFY_V2(self):\n",
              "        from apps.agro.modules.seguridad.auditoria.audit_service import (\n",
              "            AuditChainService,\n",
              "        )\n",
              "        svc = AuditChainService(type(self).store._db)\n",
              "        return svc.verify()\n",
              "\n",
          ]

          anchor_post = "    def _post(self, s: list[str]) -> None:\n"
          if anchor_post not in t:
              print("MISS ancla _post")
              raise SystemExit(1)
          t = t.replace(anchor_post, "".join(HELPERS) + anchor_post, 1)
          print("OK helpers sec+audit")

          is_json_blk = (
              "        is_json = (\n"
              "            \"application/json\"\n"
              "            in content_type\n"
              "        )\n"
          )
          if is_json_blk not in t:
              print("MISS ancla is_json")
              raise SystemExit(1)

          GUARD = [
              "        _ZV5_OP = {\n",
              "            (\"producers\", \"verify\"): \"producer.verify\",\n",
              "            (\"aid\", \"eligibility\"): \"aid.evaluate\",\n",
              "            (\"government\", \"approve\"): \"aid.approve\",\n",
              "            (\"government\", \"assign\"): \"aid.assign\",\n",
              "            (\"government\", \"deliver\"): \"aid.deliver\",\n",
              "            (\"government\", \"confirm\"): \"aid.confirm\",\n",
              "            (\"land\",): \"land.create\",\n",
              "            (\"machinery\",): \"machinery.create\",\n",
              "            (\"inventory\",): \"inventory.create\",\n",
              "            (\"water\",): \"water.create\",\n",
              "            (\"sale\",): \"sale.create\",\n",
              "            (\"sale\", \"complete\"): \"sale.complete\",\n",
              "            (\"risk\",): \"risk.report\",\n",
              "            (\"risk\", \"resolve\"): \"risk.resolve\",\n",
              "            (\"production\",): \"production.create\",\n",
              "        }.get(tuple(s))\n",
              "        _ZV5_PATH = \"/agro/\" + \"/\".join(s)\n",
              "        _ZV5_GOV = {\n",
              "            \"producer.verify\",\n",
              "            \"aid.evaluate\",\n",
              "            \"aid.approve\",\n",
              "            \"aid.assign\",\n",
              "            \"aid.deliver\",\n",
              "            \"aid.confirm\",\n",
              "        }\n",
              "        if _ZV5_OP is not None:\n",
              "            _ZV5_CTX = self._ZYRA_SEC_V2().context(\n",
              "                self.headers\n",
              "            )\n",
              "            _ZV5_OK, _ZV5_MSG = (\n",
              "                self._ZYRA_SEC_V2().check(\n",
              "                    _ZV5_CTX, _ZV5_OP\n",
              "                )\n",
              "            )\n",
              "            if _ZV5_OP in _ZV5_GOV:\n",
              "                if _ZV5_CTX.actor_role != \"gobierno\":\n",
              "                    _ZV5_OK = False\n",
              "                    _ZV5_MSG = (\n",
              "                        \"operacion exclusiva del rol\"\n",
              "                        \" gobierno\"\n",
              "                    )\n",
              "            if not _ZV5_OK:\n",
              "                self._ZYRA_AUDIT_V2(\n",
              "                    _ZV5_PATH, \"denied\"\n",
              "                )\n",
              "                self._send(\n",
              "                    403,\n",
              "                    {\n",
              "                        \"ok\": False,\n",
              "                        \"error\": {\n",
              "                            \"type\": \"forbidden\",\n",
              "                            \"message\": _ZV5_MSG,\n",
              "                        },\n",
              "                    },\n",
              "                )\n",
              "                return\n",
              "        self._ZYRA_AUDIT_V2(_ZV5_PATH, \"allowed\")\n",
          ]
          t = t.replace(is_json_blk, is_json_blk + "".join(GUARD), 1)
          print("OK guardia matriz + auditoria en POST")

          anchor_home = "        if not s or s == [\"home\"]:\n"
          if anchor_home not in t:
              print("MISS ancla home")
              raise SystemExit(1)
          GETADD = [
              "        if s == [\"audit\", \"verify\"]:\n",
              "            self._send(\n",
              "                200,\n",
              "                {\n",
              "                    \"ok\": True,\n",
              "                    \"data\": (\n",
              "                        self._ZYRA_AUDIT_VERIFY_V2()\n",
              "                    ),\n",
              "                },\n",
              "            )\n",
              "            return\n",
          ]
          t = t.replace(anchor_home, "".join(GETADD) + anchor_home, 1)
          print("OK ruta audit/verify")

          compile(t, str(sp), "exec")
          sp.write_text(t, encoding="utf-8")
          print("OK server COMPLETO (compila)")
          SRVEOF

      - name: "Paso 3 - header gobierno en test de ayudas + test de seguridad nuevo"
        run: |
          python3 - <<'TSTEOF'
          import textwrap
          from pathlib import Path

          p = Path("apps/agro/tests/test_agro_aid_e2e.py")
          t = p.read_text(encoding="utf-8")
          old_h = (
              "        headers={\n"
              "            \"Content-Type\": \"application/json\"\n"
              "        },"
          )
          new_h = (
              "        headers={\n"
              "            \"Content-Type\": \"application/json\",\n"
              "            \"X-ZYRA-Actor-Role\": \"gobierno\"\n"
              "        },"
          )
          if old_h in t:
              t = t.replace(old_h, new_h)
              compile(t, str(p), "exec")
              p.write_text(t, encoding="utf-8")
              print("OK aid headers gobierno")
          else:
              print("SKIP aid headers (ya o formato distinto)")

          TEST = textwrap.dedent('''\
              """AGRO seguridad (GPT-7): permisos por rol e
              institucion via matriz, gobierno estricto en sus
              operaciones, auditoria hash-chain inviolable."""
              from __future__ import annotations

              import json
              import threading
              import time
              import urllib.error
              import urllib.request
              from pathlib import Path

              from shared_engines.common.clocks import FrozenClock
              from shared_engines.storage.database import SQLiteAdapter

              from apps.agro.infrastructure.network.network_client import (
                  NetworkClient,
              )
              from apps.agro.infrastructure.persistence.agro_store import (
                  AgroStore,
              )
              from apps.agro.server import serve_agro


              def _seed(name):
                  return (
                      name.strip().encode("utf-8").hex()
                      + "zyra" * 16
                  )[:64]


              def _post(base, path, doc, role=None):
                  headers = {"Content-Type": "application/json"}
                  if role:
                      headers["X-ZYRA-Actor-Role"] = role
                  req = urllib.request.Request(
                      base + path,
                      data=json.dumps(doc).encode(),
                      headers=headers,
                      method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=10) as r:
                          return r.status, r.read().decode()
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode()


              def _get(base, path):
                  with urllib.request.urlopen(base + path, timeout=10) as r:
                      return r.status, r.read().decode()


              def _boot():
                  dead = NetworkClient(
                      "http://127.0.0.1:1",
                      timeout_seconds=1.0,
                      max_retries=0,
                  )
                  store = AgroStore(
                      SQLiteAdapter(":memory:"), FrozenClock())
                  srv = serve_agro(store, dead)
                  threading.Thread(
                      target=srv.serve_forever, daemon=True).start()
                  time.sleep(0.4)
                  base = f"http://127.0.0.1:{srv.bound_port}"
                  return store, srv, base


              def _register(base, name):
                  st, body = _post(base, "/agro/producers", {
                      "name": name,
                      "producer_type": "agricultor",
                      "location": "Chalatenango",
                      "doc_image_b64": _seed(name),
                      "selfie_image_b64": _seed(name),
                  })
                  assert st == 201, body[:300]
                  return json.loads(body)["data"]["producer_id"]


              def test_gov_ops_require_gobierno_role(tmp_path: Path) -> None:
                  store, srv, base = _boot()
                  pid = _register(base, "Rosa Permisos")
                  st, body = _post(
                      base, "/agro/producers/verify",
                      {"producer_id": pid})
                  assert st == 403, body[:300]
                  assert "gobierno" in body
                  st, body = _post(
                      base, "/agro/producers/verify",
                      {"producer_id": pid}, role="gobierno")
                  assert st == 400, body[:300]


              def test_matrix_by_role_and_institution(
                  tmp_path: Path,
              ) -> None:
                  store, srv, base = _boot()
                  pid = _register(base, "Luis Matriz")
                  st, body = _post(
                      base, "/agro/land",
                      {"producer_id": pid, "location": "Norte",
                       "size_hectares": 5, "land_use": "maiz"},
                      role="banco")
                  assert st == 403, body[:300]
                  st, body = _post(
                      base, "/agro/land",
                      {"producer_id": pid, "location": "Norte",
                       "size_hectares": 5, "land_use": "maiz"},
                      role="agricultor")
                  assert st == 201, body[:300]


              def test_audit_chain_and_tamper_detection(
                  tmp_path: Path,
              ) -> None:
                  store, srv, base = _boot()
                  pid = _register(base, "Ana Auditoria")
                  _post(base, "/agro/land",
                        {"producer_id": pid, "location": "Sur",
                         "size_hectares": 3, "land_use": "frijol"},
                        role="agricultor")
                  st, body = _get(base, "/agro/audit/verify")
                  d = json.loads(body)["data"]
                  assert d["ok"] is True, str(d)
                  assert d["entries"] >= 2
                  store._db.execute(
                      "UPDATE agro_audit_chain SET"
                      " operation = 'HACKED'"
                      " WHERE seq = 1"
                  )
                  st, body = _get(base, "/agro/audit/verify")
                  d = json.loads(body)["data"]
                  assert d["ok"] is False, str(d)
                  assert d["broken_at"] == 1, str(d)
              ''')

          tp = Path("apps/agro/tests/test_agro_security.py")
          compile(TEST, str(tp), "exec")
          tp.write_text(TEST, encoding="utf-8")
          print("OK test_agro_security")
          TSTEOF

      - name: "Paso 4 - SMOKE: 403 sin rol / 403 banco / 201 agricultor / verify ok / tamper detectado"
        run: |
          python3 - <<'SMOKEEOF'
          import json
          import threading
          import time
          import urllib.error
          import urllib.request

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from apps.agro.infrastructure.network.network_client import NetworkClient
          from apps.agro.infrastructure.persistence.agro_store import AgroStore
          from apps.agro.server import serve_agro

          dead = NetworkClient("http://127.0.0.1:1", timeout_seconds=1.0, max_retries=0)
          store = AgroStore(SQLiteAdapter(":memory:"), FrozenClock())
          srv = serve_agro(store, dead)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base = f"http://127.0.0.1:{srv.bound_port}"

          def seed(n):
              return (n.strip().encode("utf-8").hex() + "zyra" * 16)[:64]

          def post(path, doc, role=None):
              h = {"Content-Type": "application/json"}
              if role:
                  h["X-ZYRA-Actor-Role"] = role
              req = urllib.request.Request(
                  base + path, data=json.dumps(doc).encode(),
                  headers=h, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          def get(path):
              with urllib.request.urlopen(base + path, timeout=10) as r:
                  return r.status, r.read().decode("utf-8", "replace")

          st, body = post("/agro/producers", {
              "name": "Smoke B", "producer_type": "agricultor",
              "location": "X", "doc_image_b64": seed("Smoke B"),
              "selfie_image_b64": seed("Smoke B")})
          print("register:", st)
          pid = json.loads(body)["data"]["producer_id"]

          st, _ = post("/agro/producers/verify", {"producer_id": pid})
          print("verify sin rol ->", st, "(esperado 403)")
          st, _ = post("/agro/producers/verify", {"producer_id": pid}, role="agricultor")
          print("verify con agricultor ->", st, "(esperado 403)")
          st, _ = post("/agro/producers/verify", {"producer_id": pid}, role="gobierno")
          print("verify con gobierno ->", st, "(esperado 400: pasa guardia, falla ZID offline)")
          land = {"producer_id": pid, "location": "N", "size_hectares": 1, "land_use": "maiz"}
          st, _ = post("/agro/land", land, role="banco")
          print("land con banco ->", st, "(esperado 403)")
          st, _ = post("/agro/land", land, role="agricultor")
          print("land con agricultor ->", st, "(esperado 201)")
          st, body = get("/agro/audit/verify")
          print("audit verify:", json.loads(body)["data"])
          store._db.execute("UPDATE agro_audit_chain SET operation='HACK' WHERE seq=1")
          st, body = get("/agro/audit/verify")
          print("audit tras tamper:", json.loads(body)["data"])
          print("SMOKE COMPLETADO")
          SMOKEEOF

      - name: "Paso 5 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN B: GPT-7 permisos + auditoria" -m "Matriz rol->operacion (gobierno estricto en sus ops, banco/institucion limitadas); auditoria hash-chain en cada POST con GET /agro/audit/verify que detecta manipulacion; test_agro_security (403/201/tamper); header gobierno en test de ayudas."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
