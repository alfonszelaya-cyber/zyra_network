name: ZYRA AXIS Block 9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Wire justice and security ops screens (additive)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path("apps/axis/server.py")
          src = path.read_text(encoding="utf-8")

          if "_screen_justicia_ops" in src:
              print("SERVER: already wired")
          else:
              get_anchor = (
                  '        if s[0] == "longitudinal":\n'
                  "            self._screen_longitudinal(s)\n"
                  "            return\n"
              )
              assert get_anchor in src, "get anchor missing"
              get_add = get_anchor + (
                  '        if s[0] == "justicia":\n'
                  "            self._screen_justicia_ops()\n"
                  "            return\n"
                  '        if s[0] == "seguridad-ops":\n'
                  "            self._screen_seguridad_ops()\n"
                  "            return\n"
              )
              src = src.replace(get_anchor, get_add, 1)

              post_anchor = (
                  '        if s == ["birth-register"]:\n'
                  "            self._birth_register(doc)\n"
                  "            return\n"
              )
              assert post_anchor in src, "post anchor missing"
              post_add = post_anchor + (
                  '        if s == ["case-extended"]:\n'
                  "            self._case_extended(doc)\n"
                  "            return\n"
                  '        if s == ["incident-extended"]:\n'
                  "            self._incident_extended(doc)\n"
                  "            return\n"
              )
              src = src.replace(post_anchor, post_add, 1)

              paneles = '            "<h2>Paneles</h2>"\n'
              assert paneles in src, "home anchor missing"
              home_add = (
                  '            "<h2>Justicia y Seguridad</h2>"\n'
                  "            \"<div class='card'>\"\n"
                  "            \"<a href='/axis/justicia'>\"\n"
                  "            \"<button>Operaciones de Justicia\"\n"
                  "            \"</button></a>\"\n"
                  "            \"<a href='/axis/seguridad-ops'>\"\n"
                  "            \"<button>Operaciones de Seguridad\"\n"
                  "            \"</button></a>\"\n"
                  "            \"</div>\"\n"
              )
              src = src.replace(paneles, home_add + paneles, 1)

              methods = '''    def _screen_justicia_ops(self) -> None:
        body = (
            "<h1>⚖️ Operaciones de Justicia</h1>"
            "<p>Nuevo caso judicial (se encadena al"
            " historial de vida del cliente).</p>"
            "<div class='card'>"
            "<form method='POST'"
            " action='/axis/case-extended'>"
            "<input name='client_account'"
            " placeholder='ID del cliente (AX-...)'>"
            "<input name='lawyer_account'"
            " placeholder='Mi ID abogado (AX-...)'>"
            "<select name='stage'>"
            "<option value='denuncia'>Denuncia</option>"
            "<option value='investigacion'>Investigacion</option>"
            "<option value='audiencia'>Audiencia</option>"
            "<option value='sentencia'>Sentencia</option>"
            "<option value='apelacion'>Apelacion</option>"
            "<option value='cerrado'>Cerrado</option>"
            "</select>"
            "<input name='detail'"
            " placeholder='Detalle del caso'>"
            "<button>Registrar caso</button>"
            "</form></div>"
            "<a href='/axis'><button"
            " class='gray'>Inicio</button></a>"
        )
        self._html(200, _page("AXIS - Justicia", body))

    def _screen_seguridad_ops(self) -> None:
        body = (
            "<h1>🛡️ Operaciones de Seguridad</h1>"
            "<p>Reportar incidente (evidencia sellada +"
            " cadena de custodia).</p>"
            "<div class='card'>"
            "<form method='POST'"
            " action='/axis/incident-extended'>"
            "<input name='police_account'"
            " placeholder='Mi ID (AX-...)'>"
            "<input name='subject_account'"
            " placeholder='ID del sujeto (AX-..., opcional)'>"
            "<input name='description'"
            " placeholder='Descripcion del incidente'>"
            "<button>Reportar incidente</button>"
            "</form></div>"
            "<a href='/axis'><button"
            " class='gray'>Inicio</button></a>"
        )
        self._html(200, _page("AXIS - Seguridad", body))

    def _case_extended(self, doc) -> None:
        svc = self._lh()
        from apps.axis.life_history.justice_service import (
            JusticeLifeService,
        )

        justice = JusticeLifeService(
            store=type(self).store, life=svc
        )
        case_id = "CASE-" + _uuid.uuid4().hex[:10]
        opened = justice.open_case(
            case_id=case_id,
            client_account=self._req(
                doc, "client_account"
            ),
            lawyer_account=self._req(
                doc, "lawyer_account"
            ),
            detail=self._req(doc, "detail"),
            stage=self._req(doc, "stage"),
        )
        chained = (
            "SI"
            if opened["life_chained"]
            else "NO"
        )
        body = (
            "<h1>⚖️ Caso judicial registrado</h1>"
            "<p>ID caso: <b>" + case_id + "</b></p>"
            "<p>Etapa: " + opened["stage"] + "</p>"
            "<p>Encadenado al historial de vida:"
            " <b>" + chained + "</b></p>"
            "<a href='/axis/justicia'><button>"
            "Registrar otro</button></a>"
            "<a href='/axis'><button"
            " class='gray'>Inicio</button></a>"
        )
        self._html(200, _page("AXIS - Caso", body))

    def _incident_extended(self, doc) -> None:
        svc = self._lh()
        from apps.axis.life_history.security_service import (
            SecurityLifeService,
        )

        security = SecurityLifeService(
            store=type(self).store, life=svc
        )
        incident_id = (
            "INC-" + _uuid.uuid4().hex[:10]
        )
        subject = doc.get("subject_account")
        subject = (
            str(subject).strip()
            if subject
            and str(subject).strip()
            else None
        )
        reported = security.report_incident(
            incident_id=incident_id,
            police_account=self._req(
                doc, "police_account"
            ),
            description=self._req(
                doc, "description"
            ),
            subject_account=subject,
        )
        chained = (
            "SI"
            if reported["life_chained"]
            else "NO"
        )
        body = (
            "<h1>🛡️ Incidente reportado</h1>"
            "<p>ID incidente: <b>"
            + incident_id
            + "</b></p>"
            "<p>Etapa: reportado</p>"
            "<p>Encadenado al historial de vida:"
            " <b>" + chained + "</b></p>"
            "<a href='/axis/seguridad-ops'><button>"
            "Reportar otro</button></a>"
            "<a href='/axis'><button"
            " class='gray'>Inicio</button></a>"
        )
        self._html(200, _page("AXIS - Incidente", body))

'''
              class_anchor = (
                  "class AxisServer(ThreadingHTTPServer):"
              )
              assert class_anchor in src, "server class missing"
              src = src.replace(
                  class_anchor,
                  methods + class_anchor,
                  1,
              )
              path.write_text(src, encoding="utf-8")
              print("SERVER: WIRED OK")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("SERVER SYNTAX OK")
          PYEOF

      - name: Write ops screens E2E test
        run: |
          cat > apps/axis/life_history/tests/test_ops_screens.py <<'ZQ1'
          """Justice & Security ops screens E2E."""
          from __future__ import annotations

          import threading
          import unittest
          from urllib.request import (
              Request,
              urlopen,
          )

          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )
          from apps.axis.server import serve_axis

          _SUBJECT = "ZID-subject-ops"
          _MOTHER = "ZID-mother-ops"


          class _FakeNetwork:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid in (_SUBJECT, _MOTHER):
                      return (
                          True,
                          {"status": "ACTIVE"},
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-ops"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return (False, None, "unknown")


          class OpsScreensE2E(unittest.TestCase):
              def test_screens_and_flows(self) -> None:
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )

                  db = SQLiteAdapter(":memory:")
                  clock = SystemClock()
                  life = LifeHistoryService(
                      store=LifeHistoryStore(db, clock),
                      client=_FakeNetwork(),
                  )
                  birth = (
                      life.register_birth_with_network(
                          registrar_account="AX-reg-1",
                          child_name="Sujeto Ops",
                          birth_date="1990-06-01",
                          birth_place="San Salvador",
                          sex="M",
                          mother_name="Madre Ops",
                          mother_zid=_MOTHER,
                      )
                  )
                  person_id = str(birth["person_id"])
                  life.attach_zid_with_audit(
                      person_id,
                      zid=_SUBJECT,
                      actor="biometric-enroll",
                  )
                  store = AxisStore(db, clock)
                  store.add_account(
                      account_id="AX-cli-ops",
                      zid=_SUBJECT,
                      name="Sujeto Ops",
                      role="paciente",
                  )
                  store.add_account(
                      account_id="AX-law-ops",
                      zid=None,
                      name="Abogado Ops",
                      role="abogado",
                  )
                  store.add_account(
                      account_id="AX-pol-ops",
                      zid=None,
                      name="Agente Ops",
                      role="policia",
                  )
                  server = serve_axis(
                      store,
                      _FakeNetwork(),
                      life_history_service=life,
                  )
                  thread = threading.Thread(
                      target=server.serve_forever,
                      daemon=True,
                  )
                  thread.start()
                  base = (
                      "http://127.0.0.1:"
                      f"{server.bound_port}"
                  )

                  def pf(path, doc):
                      req = Request(
                          base + path,
                          data=(
                              "&".join(
                                  str(k)
                                  + "="
                                  + str(v)
                                  for k, v in doc.items()
                              )
                          ).encode("utf-8"),
                          method="POST",
                      )
                      with urlopen(
                          req, timeout=10
                      ) as r:
                          return r.read().decode(
                              "utf-8"
                          )

                  def h(path):
                      with urlopen(
                          base + path, timeout=10
                      ) as r:
                          return r.read().decode(
                              "utf-8"
                          )

                  try:
                      just = h("/axis/justicia")
                      self.assertIn(
                          "Operaciones de Justicia",
                          just,
                      )
                      sec = h("/axis/seguridad-ops")
                      self.assertIn(
                          "Operaciones de Seguridad",
                          sec,
                      )
                      case_html = pf(
                          "/axis/case-extended",
                          {
                              "client_account": (
                                  "AX-cli-ops"
                              ),
                              "lawyer_account": (
                                  "AX-law-ops"
                              ),
                              "stage": "denuncia",
                              "detail": "robo",
                          },
                      )
                      self.assertIn(
                          "Caso judicial registrado",
                          case_html,
                      )
                      events = (
                          life._store.events_of(
                              person_id
                          )
                      )
                      types = [
                          e["event_type"]
                          for e in events
                      ]
                      self.assertIn(
                          "justice_case", types
                      )
                      inc_html = pf(
                          "/axis/incident-extended",
                          {
                              "police_account": (
                                  "AX-pol-ops"
                              ),
                              "subject_account": (
                                  "AX-cli-ops"
                              ),
                              "description": "robo",
                          },
                      )
                      self.assertIn(
                          "Incidente reportado",
                          inc_html,
                      )
                      events = (
                          life._store.events_of(
                              person_id
                          )
                      )
                      types = [
                          e["event_type"]
                          for e in events
                      ]
                      self.assertIn(
                          "security_incident",
                          types,
                      )
                      self.assertTrue(
                          life._store.events_verify(
                              person_id
                          )
                      )
                      home = h("/axis")
                      self.assertIn(
                          "Operaciones de Justicia",
                          home,
                      )
                      self.assertIn(
                          "Operaciones de Seguridad",
                          home,
                      )
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          ZQ1
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_ops_screens.py').read()); print('test_ops OK')"

      - name: 1/3 Ops screens E2E
        run: python -m apps.axis.life_history.tests.test_ops_screens -v

      - name: 2/3 Life History regression (all 25)
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q
          python -m apps.axis.life_history.tests.test_justice_service -q
          python -m apps.axis.life_history.tests.test_security_service -q

      - name: 3/3 Full regression (biometrics 13 + AXIS 7 + TCP 6)
        run: |
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit ops screens (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "axis: justice and security ops screens wired additively + E2E"
            git push
          fi
