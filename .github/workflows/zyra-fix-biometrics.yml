name: "RED-VERIF v6: autosuficiente (crea verdict + ruta + test en orden, verifica cada paso)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - crear verification_verdict en ProfileRegistry (si falta)"
        run: |
          python3 - <<'VEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "def verification_verdict(" in t:
              print("SKIP 1 (verdict ya presente)")
              raise SystemExit(0)
          CUERPO = textwrap.dedent('''\
              def verification_verdict(
                  self,
                  *,
                  app_id: str,
                  zid: str,
                  face_verdict: dict[str, object],
                  signer,
                  clock: Clock,
              ) -> dict[str, object]:
                  """AX-VERIF: EL veredicto de verificacion para bancos/consulados/empleadores. Une biometria 1:1 + universal_view + FIRMA de la Red (prueba verificable offline). Scope gobierna; acceso auditado."""
                  from shared_engines.common.serialization import canonical_json_dumps
                  import time as _time
                  require_non_empty_str(app_id, "app_id")
                  require_non_empty_str(zid, "zid")
                  base = self.universal_view(app_id=app_id, zid=zid)
                  match = bool(face_verdict.get("match"))
                  score = float(face_verdict.get("score", 0.0))
                  verdict = {
                      "zid": zid,
                      "verified_person": match,
                      "face_score": score,
                      "fields": base["fields"],
                      "levels": base["levels"],
                      "age": base["age"],
                      "verified_at": _time.time(),
                      "issuer": "zyra-network",
                  }
                  payload = canonical_json_dumps(verdict).encode("utf-8")
                  firma = signer.sign(payload)
                  verd = dict(verdict)
                  verd["signature"] = firma.hex()
                  self._audit.append(
                      event_type="network.verification.verdict",
                      actor=app_id,
                      subject=zid,
                      payload={"match": match, "score": score},
                  )
                  return verd
          ''')
          METODO = textwrap.indent(CUERPO.rstrip("\n"), "    ")
          t = t.rstrip("\n") + "\n\n" + METODO + "\n"
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 1: verification_verdict creado (AST valido)")
          VEOF

      - name: "Paso 2 - verificar metodo vivo (hasattr duro)"
        run: |
          python3 -c "
          from shared_engines.network.portable_profile import ProfileRegistry
          assert hasattr(ProfileRegistry, 'verification_verdict'), 'verdict NO quedo en la clase'
          for m in ('register_app', 'set_field', 'view_for_app', 'universal_view'):
              assert hasattr(ProfileRegistry, m), m
          print('OK 2: verification_verdict es metodo de ProfileRegistry; clase intacta')
          "

      - name: "Paso 3 - crear ruta POST /verification/person (si falta)"
        run: |
          python3 - <<'RTEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/runtime/api.py")
          t = p.read_text(encoding="utf-8")
          if 's == ["verification", "person"]' in t:
              print("SKIP 3 (ruta ya presente)")
              raise SystemExit(0)
          CUERPO = textwrap.dedent('''\
              elif s == ["verification", "person"]:
                  import base64 as _b64v
                  bio = getattr(type(self).kernel, "_biometrics", None)
                  if bio is None:
                      raise ApiError(503, "not_wired", "biometrics not configured")
                  zid_v = self._req(doc, "zid")
                  selfie_v = _b64v.b64decode(self._req(doc, "selfie_b64"))
                  reporte = bio.verify_face(zid_v, selfie_image=selfie_v, actor=self._req(doc, "actor_app"))
                  fv = {"match": bool(getattr(reporte, "match", False)), "score": float(getattr(reporte, "score", 0.0))}
                  verd = type(self).caps.profiles.verification_verdict(app_id=self._req(doc, "actor_app"), zid=zid_v, face_verdict=fv, signer=type(self).kernel.signer, clock=type(self).kernel.clock)
                  self._send(200, {"ok": True, "data": verd})
                  return
          ''')
          ANCLA = 'elif s == ["verification", "media", "verify"]:'
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla " + str(cnt)
          i = t.find(ANCLA)
          ls = t.rfind("\n", 0, i) + 1
          linea = t[ls:i]
          IND = linea[:len(linea) - len(linea.lstrip())]
          RUTA = textwrap.indent(CUERPO.rstrip("\n"), IND) + "\n"
          t = t[:ls] + RUTA + t[ls:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 3: ruta /verification/person (AST valido)")
          RTEOF

      - name: "Paso 4 - verificar ruta viva (import fresco del api)"
        run: |
          python3 -c "
          src = open('shared_engines/runtime/api.py').read()
          assert 's == [\"verification\", \"person\"]' in src
          import shared_engines.runtime.api
          print('OK 4: ruta presente y api.py compila')
          "

      - name: "Paso 5 - crear test e2e (si falta)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          target = Path("shared_engines/runtime/tests/test_capabilities_api.py")
          assert target.exists()
          t = target.read_text(encoding="utf-8")
          if "test_verification_verdict_signed" in t:
              print("SKIP 5 (test ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_verification_verdict_signed(tmp_path) -> None:
                  """AX-VERIF: enroll biometrico -> verify_face 1:1 -> veredicto firmado -> firma verificada offline."""
                  import base64
                  import json as _json
                  import threading
                  import time as _time
                  import urllib.error
                  import urllib.request
                  from shared_engines.storage.database import SQLiteAdapter
                  from shared_engines.common.clocks import FrozenClock
                  from shared_engines.runtime.config import RuntimeConfig
                  from shared_engines.runtime.kernel import ZyraKernel
                  from shared_engines.runtime.capabilities import ZyraCapabilities
                  from shared_engines.runtime.combined_api import serve_combined
                  from shared_engines.verification.signatures import Ed25519Signer, Ed25519Verifier
                  from shared_engines.security.biometrics import BiometricsEngine, BiometricsPolicy, DeterministicTestProvider, TemplateCipher
                  from shared_engines.network.portable_profile import ProfileRegistry
                  from shared_engines.audit.chain import AuditTrail
                  from shared_engines.events.outbox import Outbox
                  from shared_engines.common.serialization import canonical_json_dumps
                  net_db = SQLiteAdapter(":memory:")
                  signer, pub = Ed25519Signer.generate()
                  kernel = ZyraKernel(db=net_db, clock=FrozenClock(), signer=signer, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(db=net_db, clock=FrozenClock(), audit=kernel.audit, provider=DeterministicTestProvider(), cipher=TemplateCipher(master_key_hex="ab" * 32), policy=BiometricsPolicy(require_liveness=False, doc_reject=0.01, doc_review=0.02, doc_auto=0.03, dup_reject=0.98))
                  caps = ZyraCapabilities(net_db, FrozenClock(), identity=kernel.identity, signer=signer)
                  caps.profiles = ProfileRegistry(net_db, FrozenClock(), audit=AuditTrail(net_db, FrozenClock()), outbox=Outbox(net_db, FrozenClock()))
                  caps.profiles.register_app(app_id="banco-ny", display_name="Banco NY", scopes=("display_name", "national_id", "id_country", "id_type", "id_number", "nationality", "birth_date", "address"))
                  srv = serve_combined(kernel, caps, host="127.0.0.1", port=0)
                  threading.Thread(target=srv.serve_forever, daemon=True).start()
                  _time.sleep(0.3)
                  base = "http://127.0.0.1:" + str(srv.server_address[1])

                  def post(ruta, doc):
                      data = _json.dumps(doc).encode()
                      req = urllib.request.Request(base + ruta, data=data, method="POST", headers={"Content-Type": "application/json"})
                      try:
                          with urllib.request.urlopen(req, timeout=15) as r:
                              return r.status, _json.loads(r.read().decode())
                      except urllib.error.HTTPError as e:
                          return e.code, _json.loads(e.read().decode())

                  try:
                      selfie = base64.b64encode(b"selfie-pedro-real").decode("ascii")
                      docimg = base64.b64encode(b"doc-pedro-dui").decode("ascii")
                      st, r1 = post("/identity/enroll", {"kind": "person", "display_name": "Pedro Prueba", "actor": "banco-ny", "doc_image_b64": docimg, "selfie_image_b64": selfie})
                      assert st in (200, 201), str(st) + " " + str(r1)
                      zid = ((r1.get("data") or {}).get("identity") or {}).get("zid")
                      assert zid, str(r1)[:300]
                      reg = caps.profiles
                      reg.set_field(zid=zid, field="display_name", value="Pedro Prueba", verified=True)
                      reg.set_field(zid=zid, field="id_country", value="SV", verified=True)
                      reg.set_field(zid=zid, field="id_type", value="dui", verified=True)
                      reg.set_field(zid=zid, field="birth_date", value="1992-04-04", verified=True)
                      st, r2 = post("/verification/person", {"zid": zid, "selfie_b64": selfie, "actor_app": "banco-ny"})
                      assert st == 200, str(st) + " " + str(r2)[:400]
                      d = r2["data"]
                      assert d["verified_person"] is True, str(d)[:200]
                      assert d["fields"]["id_type"] == "dui"
                      assert d["age"] >= 30
                      assert d.get("signature")
                      verde = bytes.fromhex(d["signature"])
                      sin_firma = dict((k, v) for k, v in d.items() if k != "signature")
                      recom = canonical_json_dumps(sin_firma).encode("utf-8")
                      assert Ed25519Verifier(pub).verify(recom, verde) is True
                      print("OK AX-VERIF: veredicto firmado, verificable offline")
                  finally:
                      srv.shutdown()
                      srv.server_close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          target.write_text(t, encoding="utf-8")
          print("OK 5: test e2e escrito (AST valido)")
          TSEOF

      - name: "Paso 6 - GATE Red (incluye el test nuevo)"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -10

      - name: "Paso 7 - GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso 8 - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-VERIF v6"
            echo '```'
            python3 -m pytest shared_engines/runtime/tests/test_capabilities_api.py::test_verification_verdict_signed -vv --tb=long 2>&1 | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-VERIF: veredicto de verificacion firmado (verify_face 1:1 + universal_view + firma Ed25519 de la Red)" -m "LA consulta del banco/consulado/empleador: (1) verify_face - re-match 1:1 de la selfie fresca contra la plantilla cifrada del ZID (motor ya existia: what banks and apps will consume), (2) universal_view de RED-ID - quien es + documento tipado + edad derivada + niveles, (3) FIRMA Ed25519 de la Red sobre el veredicto entero -> el tercero guarda la prueba y la verifica OFFLINE con la public_pem. Scope gobierna (sin consentimiento fresco por consulta); cada acceso auditado (network.verification.verdict). Ruta: POST /verification/person {zid, selfie_b64, actor_app}. v6 autosuficiente: crea metodo+ruta+test en orden con verificacion dura tras cada paso (v1-v4 fallaban pero no habian guardado el metodo por el GATE)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
