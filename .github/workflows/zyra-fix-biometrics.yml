

name: ZYRA S4 auditoria real del codigo fuente del registro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Auditoria real del codigo
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          ROOT = Path.cwd()
          OUT = []
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              import os
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 's4.md').write_text('\n'.join(OUT), encoding='utf-8')
          add('# S4 - AUDITORIA REAL DEL CODIGO (los archivos, no mi version)')
          add('')
          t_sp = (ROOT / 'superapp.py').read_text(encoding='utf-8', errors='replace')
          t_reg = (ROOT / 'portal' / 'registro.html').read_text(encoding='utf-8', errors='replace')
          t_api = (ROOT / 'shared_engines' / 'runtime' / 'api.py').read_text(encoding='utf-8', errors='replace')
          t_enroll = (ROOT / 'shared_engines' / 'security' / 'biometrics.py').read_text(encoding='utf-8', errors='replace')

          add('## CODIGO 1: superapp.py — bloque completo /registro/nuevo (si existe)')
          add('')
          m = re.search(r'        if path == "/registro/nuevo":.*?return', t_sp, re.S)
          if m:
              add('```python')
              for l in m.group(0).splitlines():
                  add(l[:160])
              add('```')
          else:
              add('**NO EXISTE /registro/nuevo en superapp.py — esta es la causa raiz del Failed to fetch**')
              add('')
              add('### Rutas que SI existen en do_POST de superapp.py:')
              add('```python')
              ini = t_sp.find('    def do_POST(self):')
              if ini > -1:
                  zona = t_sp[ini:ini+3000]
                  for l in zona.splitlines():
                      if 'if path' in l or 'self._proxy' in l:
                          add(l.strip()[:140])
              add('```')
          add('')

          add('## CODIGO 2: registro.html — el fetch y que campos envia')
          add('')
          m = re.search(r'async function enviar\(ev\)\{.*?return false;\}', t_reg, re.S)
          if m:
              add('```javascript')
              for l in m.group(0).splitlines()[:40]:
                  add(l[:160])
              add('```')
          else:
              add('**funcion enviar NO encontrada en registro.html**')
          add('')
          add('### Campos que el formulario realmente envia:')
          add('```python')
          for pat in ('nombre', 'clave', 'doc_image_b64', 'selfie_image_b64',
                      'doc_back_b64', 'doc_type'):
              n = len(re.findall(r'"' + pat + r'":', t_reg))
              add('- %s: %d menciones' % (pat, n))
          add('```')
          add('')
          add('### Tamano de las capturas en el formulario:')
          add('- comprimir() presente: %s' % ('function comprimir' in t_reg))
          add('- maxLado usado: %s' % (re.findall(r'comprimir\([^,]+,(\d+)', t_reg)[:1]))
          add('- calidad selfie: %s' % (re.findall(r'toDataURL\("image/jpeg",([\d.]+)\)', t_reg)))
          add('')
          m2 = re.search(r'video id="cam".*?</video>', t_reg, re.S)
          add('- camara/video presente: %s' % (m2 is not None))
          m3 = re.search(r'getUserMedia\(\{[^}]+\}', t_reg)
          if m3:
              add('- configuracion de camara: %s' % m3.group(0)[:120])
          add('')

          add('## CODIGO 3: api.py — como ES REALMENTE /identity/enroll')
          add('')
          ini_e = t_api.find('def _handle_register_media')
          ini_i = t_api.find('def _handle_enroll')
          if ini_i == -1:
              ini_i = t_api.find('def _handle_register_identity')
          for nombre, ini in (('enroll/identity', ini_i), ('media', ini_e)):
              if ini > -1:
                  zona = t_api[ini:ini+2500]
                  add('### %s:' % nombre)
                  add('```python')
                  for l in zona.splitlines()[:45]:
                      add(l[:160])
                  add('```')
                  add('')
          campos_api = re.findall(r'_require_str\((?:doc|self)\w*,\s*"(\w+)"', t_api)
          add('- Campos OBLIGATORIOS que la API exige: %s' % campos_api[:15])
          add('')

          add('## CODIGO 4: biometrics.py — por que dice "not installed"')
          add('')
          for i, l in enumerate(t_enroll.splitlines()):
              if 'not installed' in l.lower() or 'biometrics_face' in l or 'PROVIDER' in l or 'insightface' in l.lower():
                  add('%d: %s' % (i + 1, l.strip()[:150]))
          add('')
          escribe()
          print('S4 OK')
          PYEOF
