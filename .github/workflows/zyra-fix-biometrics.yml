name: "RED-1 FIX v2: override _route_get de CombinedHandler sin query (TypeError 3 args) + regresion serve_combined"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - FIX en combined_api.py: _route_get acepta y pasa query (reemplazo exacto del bloque)"
        run: |
          python3 - <<'FIXEOF'
          import ast
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/combined_api.py")
          t = p.read_text(encoding="utf-8")
          if ("query: dict[str, list[str]] | None"
                  in t):
              print("SKIP (fix ya presente)")
              raise SystemExit(0)
          VIEJO = (
              "    def _route_get(\n"
              "        self, s: list[str]\n"
              "    ) -> None:\n"
              "        if s and s[0] in CAPS_GET_PREFIXES:\n"
              "            CapabilitiesApiHandler._route_get(\n"
              "                self, s\n"
              "            )\n"
              "            return\n"
              "        ZyraApiHandler._route_get(self, s)\n"
          )
          NUEVO = (
              "    def _route_get(\n"
              "        self,\n"
              "        s: list[str],\n"
              "        query: dict[str, list[str]] | None = None,\n"
              "    ) -> None:\n"
              "        if s and s[0] in CAPS_GET_PREFIXES:\n"
              "            CapabilitiesApiHandler._route_get(\n"
              "                self, s, query or {}\n"
              "            )\n"
              "            return\n"
              "        ZyraApiHandler._route_get(self, s)\n"
          )
          cnt = t.count(VIEJO)
          assert cnt == 1, (
              "bloque _route_get hallado "
              + str(cnt) + " veces (esperaba 1);"
              " ver forma real")
          t = t.replace(VIEJO, NUEVO, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          t2 = p.read_text(encoding="utf-8")
          assert ("query or {}" in t2)
          assert ("dict[str, list[str]] | None"
                  in t2)
          print("OK fix combined_api._route_get"
                " (acepta query y la pasa;"
                " AST valido)")

          q = Path(
              "shared_engines/runtime/"
              "capabilities_api.py")
          tq = q.read_text(encoding="utf-8")
          if "_cap_tb.print_exc()" in tq:
              print("SKIP print_exc (ya presente)")
          else:
              VIEJO2 = (
                  "        except Exception:\n"
              )
              c2 = tq.count(VIEJO2)
              assert c2 == 1, (
                  "ancla except hallada "
                  + str(c2))
              NUEVO2 = (
                  "        except Exception:\n"
                  "            import traceback"
                  " as _cap_tb\n"
                  "            _cap_tb.print_exc()\n"
              )
              tq = tq.replace(VIEJO2, NUEVO2, 1)
              ast.parse(tq)
              q.write_text(tq, encoding="utf-8")
              assert "_cap_tb.print_exc()" in q.read_text(
                  encoding="utf-8")
              print("OK print_exc en except generico"
                    " de capabilities_api"
                    " (observabilidad)")
          FIXEOF

      - name: "Paso B - test de regresion: GET /history + /trust via serve_combined (camino real de las apps)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/tests/"
              "test_capabilities_api.py")
          t = p.read_text(encoding="utf-8")
          if "test_history_via_serve_combined" in t:
              print("SKIP test (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_history_via_serve_combined(
                  tmp_path: Path,
              ) -> None:
                  """Regresion RED-1: el camino
                  real de las apps (serve_combined)
                  debe servir GET /history/{zid}
                  sin 500 (override _route_get de
                  CombinedHandler sin query)."""
                  import base64
                  import json as _json
                  import threading
                  import time
                  import urllib.error
                  import urllib.request
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  from shared_engines.runtime.config import (
                      RuntimeConfig)
                  from shared_engines.runtime.kernel import (
                      ZyraKernel)
                  from shared_engines.runtime.capabilities import (
                      ZyraCapabilities)
                  from shared_engines.runtime.combined_api import (
                      serve_combined)
                  from shared_engines.verification.signatures import (
                      Ed25519Signer)
                  from shared_engines.security.biometrics import (
                      BiometricsEngine, BiometricsPolicy,
                      DeterministicTestProvider,
                      TemplateCipher)
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None))
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(
                      db=net_db,
                      clock=FrozenClock(),
                      audit=kernel.audit,
                      provider=(
                          DeterministicTestProvider()),
                      cipher=TemplateCipher(
                          master_key_hex="ab" * 32),
                      policy=BiometricsPolicy(
                          require_liveness=False,
                          doc_reject=0.01,
                          doc_review=0.02,
                          doc_auto=0.03,
                          dup_reject=0.98))
                  caps = ZyraCapabilities(
                      net_db, FrozenClock(),
                      identity=kernel.identity,
                      signer=signer)
                  srv = serve_combined(
                      kernel, caps,
                      host="127.0.0.1", port=0)
                  threading.Thread(
                      target=srv.serve_forever,
                      daemon=True).start()
                  time.sleep(0.3)
                  base = ("http://127.0.0.1:"
                          + str(
                              srv.server_address[1]))
                  try:
                      req = urllib.request.Request(
                          base
                          + "/identity/enroll",
                          data=_json.dumps({
                              "kind": "person",
                              "display_name": (
                                  "RegUser"),
                              "actor": "reg",
                              "doc_image_b64": (
                                  base64.b64encode(
                                      b"reg-history"
                                  ).decode("ascii")),
                              "selfie_image_b64": (
                                  base64.b64encode(
                                      b"reg-history"
                                  ).decode("ascii")),
                          }).encode(),
                          method="POST",
                          headers={
                              "Content-Type":
                              "application/json"})
                      with urllib.request.urlopen(
                          req,
                          timeout=15) as r:
                          body = _json.loads(
                              r.read().decode())
                      zid = ((body.get("data")
                              or {}).get("identity")
                             or {}).get("zid")
                      assert zid

                      def _get(ruta):
                          try:
                              with urllib.request.urlopen(
                                  base + ruta,
                                  timeout=15
                              ) as r2:
                                  return (r2.status,
                                      _json.loads(
                                          r2.read().decode()))
                          except (
                              urllib.error.HTTPError
                          ) as e2:
                              return (e2.code,
                                  _json.loads(
                                      e2.read().decode()))

                      st, resp = _get(
                          "/history/" + zid)
                      assert st == 200, (
                          "history " + str(st)
                          + " " + str(resp))
                      assert resp["data"] == [], (
                          str(resp))
                      st, resp = _get(
                          "/trust/" + zid)
                      assert st == 200, (
                          "trust " + str(st)
                          + " " + str(resp))
                      print("regresion RED-1 OK:"
                            " /history y /trust"
                            " responden 200 via"
                            " serve_combined")
                  finally:
                      srv.shutdown()
                      srv.server_close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert "test_history_via_serve_combined" in final
          print("OK test regresion escrito (AST valido)")
          TSEOF

      - name: "Paso C - GATE nucleo Red (shared_engines completo)"
        run: |
          python3 -m pytest shared_engines -q -s --tb=short 2>&1 | tail -12

      - name: "Paso D - GATE apps (4 apps)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso E - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-1 v2"
            echo '```'
            python3 -m pytest shared_engines/runtime/tests/test_capabilities_api.py -vv --tb=long 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-1: fix 500 GET /history/{zid} - override _route_get de CombinedHandler sin query" -m "Causa exacta (Paso A de transparencia): capabilities_api._route llama self._route_get(segments, query) con 3 args, pero el override de CombinedHandler (combined_api.py) tiene firma vieja (self, s) de 2 -> TypeError 'takes 2 positional arguments but 3 were given' -> 500. Ademas el override delegaba sin query (2do bug latente). FIX: _route_get(self, s, query=None) que pasa query or {} a CapabilitiesApiHandler._route_get. POST no afectado (firmas coincidian - por eso documents/seal funcionaba). Afectadas: history/trust/profile/reputation/certificates GET via serve_combined (camino real de las 9 apps). + print_exc en except generico de capabilities_api (observabilidad) + test de regresion via serve_combined."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
