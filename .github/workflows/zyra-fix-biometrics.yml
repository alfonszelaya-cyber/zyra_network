name: "ZYRA RUN9 v3: fix dead terminal (bridge) + commit + MI AUDITORIA COMPLETA DE ENTREGA (inventario/duplicados/utcnow/nucleos/tablas)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias (cryptography explicito)
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[ESCRITURA] fix bridge: fail_outbox_db rechaza DEAD (terminal hasta retry) — idempotencia y enviado ya pasan"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          P = pathlib.Path("apps/agro/events/zyra_bridge.py")
          try:
              src = P.read_text(encoding="utf-8")
              old = ('''                  if str(row["status"]) == "enviado":
                      raise ValueError(
                          "no se falla un evento enviado")''')
              new = ('''                  if str(row["status"]) == "enviado":
                      raise ValueError(
                          "no se falla un evento enviado")
                  if str(row["status"]) == "dead":
                      raise ValueError(
                          "evento en dead-letter: use"
                          " retry_dead_db")''')
              if new in src:
                  out("- bridge: ya corregido")
              elif old in src:
                  P.write_text(src.replace(old, new, 1),
                               encoding="utf-8")
                  py_compile.compile(str(P), doraise=True)
                  out("- **bridge: fail_outbox_db ahora"
                      " rechaza DEAD (terminal hasta"
                      " retry) — OK**")
              else:
                  out("- bridge: patron no hallado")
          except Exception:
              out("- bridge fix ERROR")
              out("```\n" + __import__("traceback")
                  .format_exc().strip() + "\n```")
          exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests v3 (dead terminal ahora SÍ raise)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          cat > apps/nexo/tests/test_run9_gov.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.meta_government.national_intelligence_engine import (
              NationalIntelligenceEngine)


          def _env(tmp_path):
              db = SQLiteAdapter(tmp_path / "g.db")
              return db, NationalIntelligenceEngine(db,
                                                    FrozenClock())


          def test_capa_a_indicadores_vivos(tmp_path) -> None:
              db, gov = _env(tmp_path)
              with pytest.raises(ValueError):
                  gov.report_indicator(app=" ", indicator="x",
                                       value=1)
              with pytest.raises(ValueError):
                  gov.report_indicator(app="semilla",
                      indicator="x", value=-1)
              with pytest.raises(ValueError):
                  gov.report_indicator(app="semilla",
                      indicator="x", value=1,
                      severity="URGENTE")
              i1 = gov.report_indicator(app="semilla",
                  module="matricula", indicator="matriculados",
                  value=1250000, unit="alumnos",
                  territory="SAN_SALVADOR", trend="subiendo",
                  event_id="SEMILLA_1")
              assert i1["capa"] == "A"
              gov.report_indicator(app="agro",
                  indicator="sequia_zona_norte", value=1,
                  severity="CRITICA", trend="subiendo")
              assert len(gov.indicators_of("agro")) == 1
              gov.deactivate_indicator(i1["ind_id"])
              assert len(gov.indicators_of("semilla")) == 0
              print("OK Capa A: indicadores vivos con severidad/tendencia/territorio + desactivacion")


          def test_capa_b_alertas_con_recomendacion(tmp_path) -> None:
              db, gov = _env(tmp_path)
              with pytest.raises(ValueError):
                  gov.raise_national_alert(domain="alimentacion",
                      indicator="produccion_maiz",
                      current_value=82.0,
                      impact="deficit en 90 dias",
                      recommendation=" ")
              a = gov.raise_national_alert(domain="alimentacion",
                  indicator="produccion_maiz",
                  current_value=82.0,
                  impact="deficit alimentario en 90 dias",
                  recommendation="activar produccion alternativa"
                                 " e importar 50k ton",
                  responsible="Ministerio de Agricultura",
                  severity="CRITICA")
              assert a["capa"] == "B"
              assert len(gov.active_alerts_db()) == 1
              r = gov.resolve_national_alert(a["alert_id"],
                  note="produccion recuperada 12%")
              assert r["status"] == "resuelta"
              with pytest.raises(ValueError):
                  gov.resolve_national_alert(a["alert_id"])
              assert gov.active_alerts_db() == []
              print("OK Capa B: IMPACTO+RECOMENDACION+RESPONSABLE (regla 66) + resolucion unica")


          def test_capa_c_cadena_causal(tmp_path) -> None:
              db, gov = _env(tmp_path)
              e1 = gov.chain_event(source_app="agro",
                  event_type="SEQUIA_DETECTADA",
                  ref="ZONA-NORTE",
                  detail="deficit hidrico 40 dias",
                  severity="ALTA")
              e2 = gov.chain_event(source_app="agro",
                  event_type="PRODUCCION_MAIZ_REDUCIDA",
                  ref="ZONA-NORTE", detail="-18%",
                  prev_event=e1["ev_id"])
              e3 = gov.chain_event(source_app="subastas",
                  event_type="DEMANDA_MAIZ_AUMENTA",
                  ref="MAIZ", prev_event=e2["ev_id"])
              e4 = gov.chain_event(source_app="nexo",
                  event_type="PRECIO_MAIZ_AUMENTA",
                  ref="MAIZ", prev_event=e3["ev_id"])
              e5 = gov.chain_event(source_app="axis",
                  event_type="RIESGO_NUTRICIONAL_AUMENTA",
                  ref="ZONA-NORTE", prev_event=e4["ev_id"],
                  severity="CRITICA")
              with pytest.raises(LookupError):
                  gov.chain_event(source_app="agro",
                      event_type="X",
                      prev_event="NO-EXISTE")
              ch = gov.causal_chain(e5["ev_id"])
              assert ch["length"] == 5
              types = [c["event_type"] for c in ch["chain"]]
              assert types[0] == "SEQUIA_DETECTADA"
              assert types[-1] == "RIESGO_NUTRICIONAL_AUMENTA"
              print("OK Capa C: cadena causal cross-app recorrible (sequia->produccion->demanda->precio->riesgo)")


          def test_alarmas_amber_sismo_crisis(tmp_path) -> None:
              db, gov = _env(tmp_path)
              with pytest.raises(ValueError):
                  gov.raise_alarm(kind="ZYRA_AMBER",
                      subject="menor desaparecido")
              with pytest.raises(ValueError):
                  gov.raise_alarm(kind="TERROR", subject="x")
              am = gov.raise_alarm(kind="ZYRA_AMBER",
                  zone="ZONA-5", target="ZID-NENE-1",
                  subject="menor desaparecido ZID-NENE-1",
                  body="alerta a telefonos de la zona")
              assert am["kind"] == "ZYRA_AMBER"
              si = gov.raise_alarm(kind="SISMO",
                  zone="NACIONAL", subject="sismo 6.2 costa")
              assert len(gov.alarms_active_db()) == 2
              assert len(gov.alarms_active_db(
                  kind="ZYRA_AMBER")) == 1
              c = gov.clear_alarm(si["alarm_id"])
              assert c["status"] == "despejada"
              with pytest.raises(ValueError):
                  gov.clear_alarm(si["alarm_id"])
              snap = gov.national_snapshot()
              assert "capa_b_alertas" in snap
              assert "apps" in snap
              print("OK ALARMAS: ZYRA_AMBER exige ZID del menor (regla 78) + SISMO + despeje unico + snapshot nacional")
          TSEOF
          cat > apps/agro/tests/test_run9_seguridad.py << 'TSEOF'
          import pytest
          from shared_engines.storage.database import SQLiteAdapter
          from apps.agro.modules.seguridad.rbac_engine import (
              ensure_db, register_user_db, grant_db, check_db,
              open_session_db, session_ok_db, close_session_db,
              register_device_db, deactivate_device_db,
              issue_recovery_db, consume_recovery_db)
          from apps.agro.events.zyra_bridge import (
              ensure_db as eb, publish_outbox_db, mark_sent_db,
              fail_outbox_db, retry_dead_db, ingest_inbox_db,
              process_inbox_db, fail_inbox_db, reconcile_db)


          def test_a15_rbac_sesiones_dispositivos_recuperacion(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "s.db")
              ensure_db(db)
              with pytest.raises(ValueError):
                  register_user_db(db, name="X", role="alien")
              with pytest.raises(ValueError):
                  register_user_db(db, name="Prod",
                      role="productor")
              p = register_user_db(db, name="Juan Perez",
                  role="productor", zid="ZID-JUAN",
                  created_at="2026")
              assert check_db(db, user_id=p["user_id"],
                  resource="agro_productions",
                  action="write")["allowed"] is False
              grant_db(db, user_id=p["user_id"],
                  resource="agro_productions", action="write")
              assert check_db(db, user_id=p["user_id"],
                  resource="agro_productions",
                  action="read")["allowed"] is True
              assert check_db(db, user_id=p["user_id"],
                  resource="agro_aid_requests",
                  action="write")["allowed"] is False
              with pytest.raises(ValueError):
                  grant_db(db, user_id=p["user_id"],
                      resource="X", action="delete")
              with pytest.raises(ValueError):
                  open_session_db(db, user_id=p["user_id"],
                      ttl_seconds=0)
              s = open_session_db(db, user_id=p["user_id"],
                  ttl_seconds=100.0, created_at="2026")
              assert session_ok_db(db, s["session_id"],
                  now=50.0)["ok"] is True
              assert session_ok_db(db, s["session_id"],
                  now=150.0)["ok"] is False
              close_session_db(db, s["session_id"], now=60.0)
              assert session_ok_db(db, s["session_id"],
                  now=70.0)["ok"] is False
              with pytest.raises(ValueError):
                  close_session_db(db, s["session_id"],
                                   now=80.0)
              d = register_device_db(db, user_id=p["user_id"],
                  label="celular juan", created_at="2026")
              deactivate_device_db(db, d["device_id"])
              with pytest.raises(ValueError):
                  issue_recovery_db(db, user_id=p["user_id"],
                      code="1234")
              rc = issue_recovery_db(db, user_id=p["user_id"],
                  code="recuperacion-2026",
                  created_at="2026")
              assert "no se guarda en claro" in rc["note"]
              assert consume_recovery_db(
                  db, user_id=p["user_id"],
                  code="recuperacion-2026")["ok"] is True
              assert consume_recovery_db(
                  db, user_id=p["user_id"],
                  code="recuperacion-2026")["ok"] is False
              print("OK A-15: RBAC jerarquia + sesiones TTL + dispositivos + recuperacion un solo uso con hash (regla 63)")


          def test_a16_bridge_idempotencia_dlq(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "z.db")
              eb(db)
              e1 = publish_outbox_db(db,
                  event_type="AGRO_COSECHA_LOTE",
                  aggregate_id="LOT-1",
                  payload={"kg": 850.0},
                  idem_key="cosecha|LOT-1|2026-04-20",
                  created_at="2026-04-20")
              assert e1["duplicated"] is False
              e2 = publish_outbox_db(db,
                  event_type="AGRO_COSECHA_LOTE",
                  idem_key="cosecha|LOT-1|2026-04-20")
              assert e2["duplicated"] is True
              assert e2["event_id"] == e1["event_id"]
              with pytest.raises(ValueError):
                  publish_outbox_db(db, event_type="X",
                      idem_key=" ")
              mark_sent_db(db, e1["event_id"],
                  sent_at="2026")
              with pytest.raises(ValueError):
                  fail_outbox_db(db, e1["event_id"])
              e3 = publish_outbox_db(db,
                  event_type="AGRO_PLAGA_ALERTA",
                  aggregate_id="ZONA-5",
                  payload={"plaga": "langosta"},
                  idem_key="plaga|ZONA-5|2026-04-21",
                  created_at="2026-04-21")
              f1 = fail_outbox_db(db, e3["event_id"])
              assert f1["attempts"] == 1
              assert f1["status"] == "pendiente"
              f2 = fail_outbox_db(db, e3["event_id"])
              f3 = fail_outbox_db(db, e3["event_id"])
              assert f3["status"] == "dead"
              with pytest.raises(ValueError):
                  fail_outbox_db(db, e3["event_id"])
              rec = retry_dead_db(db, e3["event_id"])
              assert rec["status"] == "pendiente"
              with pytest.raises(ValueError):
                  retry_dead_db(db, e3["event_id"])
              i1 = ingest_inbox_db(db, source_app="nexo",
                  event_type="NEXO_PAGO_CONFIRMADO",
                  payload={"monto": 950.0},
                  idem_key="nexo|pago|A1",
                  created_at="2026-04-22")
              i2 = ingest_inbox_db(db, source_app="nexo",
                  event_type="NEXO_PAGO_CONFIRMADO",
                  idem_key="nexo|pago|A1")
              assert i2["duplicated"] is True
              process_inbox_db(db, i1["msg_id"], at="2026")
              with pytest.raises(ValueError):
                  process_inbox_db(db, i1["msg_id"])
              with pytest.raises(ValueError):
                  fail_inbox_db(db, i1["msg_id"])
              rec = reconcile_db(db)
              assert rec["outbox"].get("enviado", 0) == 1
              assert rec["inbox"].get("procesado", 0) == 1
              print("OK A-16: IDEMPOTENCIA (misma idem_key -> mismo event_id) + enviado no falla + DEAD ES TERMINAL hasta retry (fix) + inbox idempotente + reconciliacion")
          TSEOF
          python3 - << 'ASTEOF'
          import ast
          for f in ("apps/nexo/tests/test_run9_gov.py",
                    "apps/agro/tests/test_run9_seguridad.py"):
              ast.parse(open(f, encoding="utf-8").read())
              print("AST OK:", f)
          ASTEOF
          timeout 240 python3 -m pytest apps/nexo/tests/test_run9_gov.py apps/agro/tests/test_run9_seguridad.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/r9.out 2>&1
          echo $? > /tmp/r9
          if [ "$(cat /tmp/r9)" = "0" ]; then echo "- RUN 9 v3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- RUN 9 v3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### RUN 9 v3 detalle"; echo '```'; tail -100 /tmp/r9.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si todo verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/r9 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: rojo — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"
          else
            git commit -m "feat(RUN 9 v3): GOV-DATA 3 capas + alarmas ZYRA (Capa A/B/C + ZYRA_AMBER exige ZID regla 78) + A-15 AgroSecurity RBAC + A-16 AgroZyraBridge (idempotencia, dead-letter TERMINAL hasta retry — fix) + N-11 utcnow NEXO; N-8 eliminado por duplicado (ya existia)"
            [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
            log "**COMMIT OK**"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
            if [ $? -ne 0 ]; then
              git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
              if [ $? -ne 0 ]; then log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"; exit 1; fi
            fi
            log "**PUSH OK**"
          fi

      - name: "[AUDITORIA DE ENTREGA — la mia, completa, antes de entregar al dueno]"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# AUDITORIA DE ENTREGA ZYRA-BOT (pre-entrega al dueno)" >> "$SUM"
          echo "## 1) INVENTARIO TOTAL de archivos tocados por zyra-bot" >> "$SUM"
          { echo '```'; git log --author=zyra-bot --name-only --pretty=format:"COMMIT %h %s" | head -250; echo '```'; } >> "$SUM"
          echo "## 2) DETECCION DE CLASES DUPLICADAS entre apps" >> "$SUM"
          { echo '```'; grep -rhn "^class [A-Z]" apps --include="*.py" 2>/dev/null | grep -v __pycache__ | sed 's/^[0-9]*://; s/(.*//; s/:.*//' | awk '{$1=$1};1' | sort | uniq -c | sort -rn | awk '$1 > 1 {print $1, $2}' | head -30; echo '```'; } >> "$SUM"
          echo "### clases duplicadas en DETALLE (nombre -> archivos)" >> "$SUM"
          { echo '```'; for cls in $(grep -rhn "^class [A-Z]" apps --include="*.py" 2>/dev/null | grep -v __pycache__ | sed 's/^[0-9]*: *class //; s/(.*//; s/:.*//' | awk '{$1=$1};1' | sort -u); do files=$(grep -rln "^class $cls" apps --include="*.py" 2>/dev/null | grep -v __pycache__ | tr '\n' ' '); n=$(echo $files | wc -w); if [ "$n" -gt 1 ]; then echo "DUP: $cls -> $files"; fi; done; echo '```'; } >> "$SUM"
          echo "## 3) utcnow = 0 en las 5 apps" >> "$SUM"
          { echo '```'; for app in nexo semilla agro axis subastas; do n=$(grep -rn "datetime.utcnow\|default_factory=datetime.utcnow" apps/$app --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v tests/ | wc -l); echo "$app: $n"; done; echo '```'; } >> "$SUM"
          echo "## 4) INVENTARIO DE TABLAS creadas por zyra-bot (para cruce con su auditoria)" >> "$SUM"
          { echo '```'; git log --author=zyra-bot --name-only --pretty=format: | grep -v "^$" | sort -u | while read f; do [ -f "$f" ] || continue; grep -oh "CREATE TABLE IF NOT EXISTS [a-z_]*\|CREATE TABLE [a-z_]*" "$f" 2>/dev/null; done | sort -u; echo '```'; } >> "$SUM"
          echo "## 5) TESTS DE NUCLEO originales intactos (los preexistentes a zyra-bot no fueron modificados)" >> "$SUM"
          { echo '```'; git log --author=zyra-bot --name-only --pretty=format: | sort -u | grep -E "test_(nexo_core|ng[0-9]+|accounting|domain|finance|government|security|axis|service|subastas|agro|semilla)" | grep -v test_run9 | grep -v test_s[0-9] | grep -v test_a[0-9] | grep -v test_zid | grep -v test_ax_ | head -20; echo "(vacio = NINGUN test de nucleo original fue tocado por zyra-bot)"; echo '```'; } >> "$SUM"
          echo "## 6) RESUMEN DE EJECUCION" >> "$SUM"
          echo "- Regresion nexo: $(cat /tmp/x1 2>/dev/null || echo 1) (0=verde)" >> "$SUM"
          echo "- Regresion axis: $(cat /tmp/x2 2>/dev/null || echo 1)" >> "$SUM"
          echo "- Regresion agro: $(cat /tmp/x3 2>/dev/null || echo 1)" >> "$SUM"
          echo "- Regresion semilla: $(cat /tmp/x4 2>/dev/null || echo 1)" >> "$SUM"
          echo "- Tests nuevos RUN9: $(cat /tmp/r9 2>/dev/null || echo 1)" >> "$SUM"
          echo "## 7) PENDIENTES CONOCIDOS (para su auditoria decidir)" >> "$SUM"
          echo "- N-10: nexo module/operaciones vs domain/operations (mapa en run #583)" >> "$SUM"
          echo "- A-17: agro executive vs ejecutivo (mapa en run #583)" >> "$SUM"
          echo "- A-18: server.py agro 100KB refactor (regla 77)" >> "$SUM"
          echo "- A-19: 13 carpetas vacias agro" >> "$SUM"
          echo "## FIN AUDITORIA DE ENTREGA" >> "$SUM"
          exit 0
