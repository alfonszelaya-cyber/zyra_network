          """Recuperacion real tras fallos: outbox, red caida, crash."""
          import json
          import os
          import tempfile

          from apps.laboratorio.config.network.network_config import NetworkConfig
          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.infrastructure.network.zyra_client import ClienteZyra
          from apps.laboratorio.shared.exceptions.network_errors import RedNoDisponibleError
          from apps.laboratorio.tests.conftest import IDENTIDAD_HEADERS


          def test_evaluar_con_red_caida_deja_pendiente_en_outbox(despachar, app):
              salida = app.despachar(
                  "POST", "/laboratorio/api/v1/projects",
                  dict(IDENTIDAD_HEADERS),
                  json.dumps({"titulo": "Red caida", "tipo": "documento"}).encode("utf-8"),
              )
              assert salida[0] == 200
              proyecto_id = json.loads(salida[2].decode("utf-8"))["datos"]["proyecto"]["id"]
              esc_salida = app.despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/scenarios",
                  dict(IDENTIDAD_HEADERS),
                  json.dumps({
                      "tipo": "A",
                      "titulo": "Escenario A",
                      "parametros": {"costo": 40.0, "beneficio": 70.0, "riesgo": 25.0},
                  }).encode("utf-8"),
              )
              assert esc_salida[0] == 200, esc_salida
              escenario_id = json.loads(esc_salida[2].decode("utf-8"))["datos"]["escenario"]["id"]
              ev_salida = app.despachar(
                  "POST",
                  "/laboratorio/api/v1/projects/" + proyecto_id + "/scenarios/" + escenario_id + "/evaluate",
                  dict(IDENTIDAD_HEADERS), b"",
              )
              assert ev_salida[0] == 200
              datos = json.loads(ev_salida[2].decode("utf-8"))
              sellado = datos["datos"]["sellado"]
              assert sellado["estado"] in ("pendiente_red", "sellado_en_zyra", "error_red", "sin_carga")
              outbox = app.contenedor.obtener("outbox")
              stats = outbox.estadisticas()
              assert "pendiente" in stats


          def test_cliente_sin_config_degrada_honesto():
              cli = ClienteZyra(NetworkConfig.cargar())
              if cli.configurado:
                  return
              resp = cli.sellar_documento("t", "c")
              assert resp["sellado"] is False
              assert "motivo" in resp


          def test_app_recupera_tras_reinicio_con_bd_real():
              with tempfile.TemporaryDirectory() as tmp:
                  ruta = os.path.join(tmp, "recuperacion.db")
                  app1 = montar_aplicacion(ruta)
                  app1.despachar(
                      "POST", "/laboratorio/api/v1/projects",
                      dict(IDENTIDAD_HEADERS),
                      json.dumps({"titulo": "Sobreviviente", "tipo": "documento"}).encode("utf-8"),
                  )
                  del app1
                  app2 = montar_aplicacion(ruta)
                  salida = app2.despachar(
                      "GET", "/laboratorio/api/v1/projects",
                      dict(IDENTIDAD_HEADERS), b"",
                  )
                  assert salida[0] == 200
                  datos = json.loads(salida[2].decode("utf-8"))
                  titulos = [p["titulo"] for p in datos["datos"]["proyectos"]]
                  assert "Sobreviviente" in titulos
