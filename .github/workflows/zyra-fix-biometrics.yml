name: "CONSOL-3 v10 FINAL: ast.unparse (solucion definitiva de indentacion) + mixins + herencia + regresion 5 apps + auditoria"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[FASE 1] extraer 14 metodos con ast.unparse (codigo limpio columna 0 garantizado) + mixins + server sin ellos"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              tree = ast.parse(src)
              cls = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and \
                          node.name == "AgroApiHandler":
                      cls = node
                      break
              assert cls is not None, "clase no hallada"

              targets = ["_aid_payload", "_aid_network_seq",
                         "_aid_request", "_aid_eligibility",
                         "_aid_approve", "_aid_assign",
                         "_aid_deliver", "_aid_confirm",
                         "_screen_ayudas",
                         "_screen_ayudas_gobierno",
                         "_screen_producer",
                         "_screen_government",
                         "_screen_bank", "_home"]
              nodes = {n.name: n for n in cls.body
                       if isinstance(n, ast.FunctionDef)
                       and n.name in targets}
              assert len(nodes) == 14, \
                  str(len(nodes)) + "/14 — abort"

              # ast.unparse: codigo LIMPIO a columna 0,
              # sin importar como estaba anidado (solucion
              # definitiva de los IndentationError)
              aid_src = []
              scr_src = []
              for name in sorted(nodes):
                  node = nodes[name]
                  fn = "h_" + name[1:]
                  clean = ast.unparse(node).replace(
                      "def " + name + "(",
                      "def " + fn + "(self, ", 1) \
                      if not name.startswith("_aid") else \
                      ast.unparse(node).replace(
                          "def " + name + "(",
                          "def " + fn + "(", 1)
                  if name.startswith("_aid"):
                      aid_src.append(clean)
                  else:
                      scr_src.append(clean)
              out("- 14 metodos unparseados limpios")

              hdr = ('"""AGRO mixins (CONSOL-3 v10, regla'
                     ' 77)"""\n'
                     'from __future__ import'
                     ' annotations\n\n\n')
              am = pathlib.Path(
                  "apps/agro/routers/aid_mixin.py")
              am.write_text(hdr + "class AidMixin:\n"
                            + "\n\n".join(
                                textwrap.indent(s, "    ")
                                for s in aid_src),
                            encoding="utf-8")
              py_compile.compile(str(am), doraise=True)
              sm = pathlib.Path(
                  "apps/agro/routers/screens_mixin.py")
              sm.write_text(hdr + "class ScreensMixin:\n"
                            + "\n\n".join(
                                textwrap.indent(s, "    ")
                                for s in scr_src),
                            encoding="utf-8")
              py_compile.compile(str(sm), doraise=True)
              out("- mixins OK (AidMixin + ScreensMixin,"
                  " metodos re-imprimidos por ast.unparse)")
              import textwrap as _tw

              # eliminar del server (por posicion AST,
              # de atras hacia adelante)
              lines = src.splitlines(keepends=True)
              cuts = sorted(
                  [(n.lineno - 1, n.end_lineno)
                   for n in nodes.values()],
                  reverse=True)
              for lo, hi in cuts:
                  del lines[lo:hi]
              new_server = (
                  "from apps.agro.routers.aid_mixin import"
                  " AidMixin\n"
                  "from apps.agro.routers.screens_mixin"
                  " import ScreensMixin\n"
                  + "".join(lines))
              ast.parse(new_server)
              SP.write_text(new_server, encoding="utf-8")
              py_compile.compile(str(SP), doraise=True)
              out("- server: 2811 -> "
                  + str(len(new_server.splitlines()))
                  + " lineas + imports al tope")
              with open("/tmp/f1", "w") as f:
                  f.write("OK")
          except Exception:
              out("## CRASHEO F1 — revert")
              os.system("git checkout -- apps/agro/server.py"
                        " 2>/dev/null")
              os.system("rm -f apps/agro/routers/aid_mixin.py"
                        " apps/agro/routers/"
                        "screens_mixin.py 2>/dev/null")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              with open("/tmp/f1", "w") as f:
                  f.write("FAIL")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[FASE 2] herencia: reemplazo de la linea de clase por AST fresco"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              tree = ast.parse(src)
              cls = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and \
                          node.name == "AgroApiHandler":
                      cls = node
                      break
              assert cls is not None
              if any("AidMixin" in ast.unparse(b)
                     for b in cls.bases):
                  out("- herencia ya aplicada")
              else:
                  lines = src.splitlines(keepends=True)
                  idx = cls.lineno - 1
                  cl = lines[idx]
                  assert "class AgroApiHandler(" in cl, \
                      "clase multilinea: " + cl[:80]
                  lines[idx] = cl.replace(
                      "class AgroApiHandler(",
                      "class AgroApiHandler("
                      "AidMixin, ScreensMixin, ", 1)
                  new_src = "".join(lines)
                  ast.parse(new_src)
                  SP.write_text(new_src, encoding="utf-8")
                  py_compile.compile(str(SP),
                                     doraise=True)
                  out("- **herencia OK: AgroApiHandler("
                      "AidMixin, ScreensMixin,"
                      " BaseHTTPRequestHandler)**")

              n = len(pathlib.Path(
                  "apps/agro/server.py").read_text(
                  encoding="utf-8").splitlines())
              out("- server final: " + str(n) + " lineas"
                  " (de 2811)")
              with open("/tmp/f2", "w") as f:
                  f.write("OK")
          except Exception:
              out("## CRASHEO F2 — revert")
              os.system("git checkout -- apps/agro/server.py"
                        " 2>/dev/null")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              with open("/tmp/f2", "w") as f:
                  f.write("FAIL")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion COMPLETA de las 5 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=line > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          timeout 300 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x5.out 2>&1
          echo $? > /tmp/x5
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla" "x5 subastas"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            passed=$(grep -oE "[0-9]+ passed" /tmp/$1.out 2>/dev/null | tail -1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅ ($passed)" >> "$SUM"
            else
              echo "- REG $2: ❌ ($passed)" >> "$SUM"
              { echo "### $2 fallos"; echo '```'; tail -40 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ENTREGA] commit solo si las 5 apps verdes (marcadores /tmp)"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          ok=1
          for f in f1 f2 x1 x2 x3 x4 x5; do
            [ "$(cat /tmp/$f 2>/dev/null || echo FAIL)" = "OK" ] || ok=0
          done
          if [ "$ok" != "1" ]; then
            log "**CONSOL-3 BLOQUEADA — revert aplicado por las fases. Estado estable conservado.**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**CONSOL-3: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(CONSOL-3 v10 FINAL, regla 77): server.py AGRO 2811->reducido — 14 metodos extraidos con ast.unparse (codigo re-imprimido limpio a columna 0: solucion definitiva de los IndentationError) a AidMixin/ScreensMixin en routers/ + handler hereda de ambos (self._page/_send/store por herencia) + imports al tope + bases por AST fresco — regresion COMPLETA de 5 apps verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**CONSOL-3 v10 OK — SISTEMA CONSOLIDADO COMPLETO: NetworkClient unificado + server AGRO bajo regla 77 + 0 errores + 5 apps verdes. Solo quedan sus decisiones opcionales.**"
          exit 0
