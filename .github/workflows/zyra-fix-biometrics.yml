name: "AXIS AX-6 paso 1: auditoria tecnica (migraciones dispersas + utcnow + hilos sin apagar) - SOLO LECTURA"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: axis-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: datetime.utcnow() deprecado en apps/axis (archivo + linea exacta)"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          print("=== usages de datetime.utcnow / utcnow() en apps/axis ===")
          total = 0
          for f in sorted(Path("apps/axis").rglob("*.py")):
              try:
                  txt = f.read_text(encoding="utf-8")
              except Exception:
                  continue
              for i, l in enumerate(txt.splitlines(), 1):
                  if "utcnow" in l:
                      total += 1
                      print(str(f) + ":" + str(i)
                            + ": " + l.strip())
          print("TOTAL: " + str(total))
          D1EOF

      - name: "Dump 2: CREATE TABLE dispersos fuera de axis_store.py (migraciones a consolidar)"
        run: |
          python3 - <<'D2EOF'
          from pathlib import Path
          print("=== CREATE TABLE en apps/axis (excluye axis_store.py y tests) ===")
          for f in sorted(Path("apps/axis").rglob("*.py")):
              s = str(f)
              if "axis_store.py" in s or "/tests/" in s:
                  continue
              try:
                  txt = f.read_text(encoding="utf-8")
              except Exception:
                  continue
              hits = []
              for i, l in enumerate(txt.splitlines(), 1):
                  if "CREATE TABLE" in l.upper():
                      hits.append((i, l.strip()))
              if hits:
                  print()
                  print("-- " + s
                        + " (" + str(len(hits))
                        + " tablas) --")
                  for i, l in hits:
                      print("  " + str(i) + ": " + l[:110])
          print()
          print("=== axis_store.py: tablas que YA consolida ===")
          txt = Path(
              "apps/axis/infrastructure/persistence/axis_store.py"
          ).read_text(encoding="utf-8")
          for i, l in enumerate(txt.splitlines(), 1):
              if "CREATE TABLE" in l.upper():
                  print("  " + str(i) + ": " + l.strip()[:110])
          D2EOF

      - name: "Dump 3: tests que arrancan servidores (serve_forever) y si apagan o no"
        run: |
          python3 - <<'D3EOF'
          from pathlib import Path
          print("=== serve_forever/serve_axis/serve_combined/serve_clearance en tests ===")
          for f in sorted(
              Path("apps/axis/tests").rglob("*.py")
          ) + sorted(Path("apps/axis/life_history/tests").rglob("*.py")):
              txt = f.read_text(encoding="utf-8")
              arranca = "serve_forever" in txt or "serve_axis(" in txt
              if not arranca:
                  continue
              apaga = ("shutdown" in txt
                       and "server_close" in txt)
              print()
              print("-- " + str(f))
              print("   arranca servidor: SI")
              print("   apaga (shutdown+close): "
                    + ("SI" if apaga else "NO"))
          D3EOF

      - name: "Dump 4: como apagan los que SI apagan (patron a replicar) - clearance_ops como referencia"
        run: |
          python3 - <<'D4EOF'
          from pathlib import Path
          txt = Path(
              "apps/axis/life_history/tests/test_clearance_ops.py"
          ).read_text(encoding="utf-8")
          lines = txt.splitlines()
          for i, l in enumerate(lines, 1):
              if "shutdown" in l or "server_close" in l:
                  for n in range(max(0, i - 3),
                                 min(len(lines), i + 2)):
                      print(str(n + 1).rjust(4)
                            + ": " + lines[n])
                  print("---")
          D4EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
