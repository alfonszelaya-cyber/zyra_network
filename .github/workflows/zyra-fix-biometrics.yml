name: "ZYRA NEXO E3 v2: summary entidades + tests calibrados"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Fix sanctions summary (entidades distintas)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **FORZADO " + p.name + ": OK**")
              except Exception:
                  out("- **FORZADO " + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          CMP = "apps/nexo/domain/compliance"
          UCR = "apps/nexo/application/risk_use_cases"

          # SanctionsMonitor: summary cuenta ENTIDADES DISTINTAS sancionadas
          forzar(CMP + "/sanctions_monitor.py", D(r'''
              # sanctions_monitor.py - NEXO / ZYRA (v2:
              # summary cuenta entidades distintas)
              from __future__ import annotations
              from typing import Dict, List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "sanctions_verifications", (
                      "CREATE TABLE IF NOT EXISTS sanctions_verifications (verification_id TEXT PRIMARY KEY, entity_name TEXT NOT NULL, list_source TEXT NOT NULL DEFAULT 'internal', sanctioned INTEGER NOT NULL DEFAULT 0, checked_at REAL NOT NULL)",
                  )),
                  Migration(2, "sanctions_alerts", (
                      "CREATE TABLE IF NOT EXISTS sanctions_alerts (alert_id TEXT PRIMARY KEY, entity_name TEXT NOT NULL, reason TEXT NOT NULL, severity TEXT NOT NULL DEFAULT 'HIGH', status TEXT NOT NULL DEFAULT 'OPEN', created_at REAL NOT NULL)",
                  )),
              )

              class SanctionsMonitor:
                  """Monitoreo de sanciones: verifica y
                  REGISTRA (informa/bonifica, nunca bloquea)."""

                  def __init__(self, db: Database, clock: Clock, *,
                               sanctioned_names: List[str] = None) -> None:
                      self._db = db
                      self._clock = clock
                      self._sanctioned = [n.upper()
                                          for n in (
                                              sanctioned_names or [])]
                      MigrationRunner(db, "nexo.sanctions",
                                      _MIGRATIONS).run(clock)

                  def verify(self, *, entity_name: str,
                             list_source: str = "internal") -> Dict:
                      vid = f"SAN-{uuid.uuid4()}"
                      now = self._clock.now()
                      sanctioned = (entity_name.strip().upper()
                                    in self._sanctioned)
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO sanctions_verifications"
                              " (verification_id, entity_name,"
                              " list_source, sanctioned, checked_at)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (vid, entity_name, list_source,
                               1 if sanctioned else 0, now))
                      return {"verification_id": vid,
                              "entity_name": entity_name,
                              "sanctioned": sanctioned,
                              "list_source": list_source,
                              "checked_at": now,
                              "status": "VERIFIED"}

                  def register_alert(self, *, entity_name: str,
                                     reason: str,
                                     severity: str = "HIGH") -> Dict:
                      alert_id = f"ALT-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO sanctions_alerts"
                              " (alert_id, entity_name, reason,"
                              " severity, status, created_at)"
                              " VALUES (?, ?, ?, ?, 'OPEN', ?)",
                              (alert_id, entity_name, reason,
                               severity, now))
                      return {"alert_id": alert_id,
                              "entity_name": entity_name,
                              "reason": reason,
                              "severity": severity,
                              "status": "OPEN"}

                  def get_entity_history(self,
                                         entity_name: str) -> List[Dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM sanctions_verifications"
                          " WHERE entity_name = ?"
                          " ORDER BY checked_at",
                          (entity_name,))
                      return [dict(r) for r in rows]

                  def generate_summary(self) -> Dict:
                      """Cuenta ENTIDADES DISTINTAS sancionadas,
                      no verificaciones."""
                      rows = self._db.query_all(
                          "SELECT DISTINCT entity_name FROM"
                          " sanctions_verifications"
                          " WHERE sanctioned = 1")
                      sanctioned = len(rows)
                      total = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " sanctions_verifications")
                      alerts = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " sanctions_alerts")
                      return {"verifications":
                              int(total["n"]) if total else 0,
                              "alerts":
                              int(alerts["n"]) if alerts else 0,
                              "sanctioned_entities": sanctioned,
                              "generated_at": self._clock.now()}

                  def generate_report(self) -> Dict:
                      return {"verifications": self._db.query_all(
                                  "SELECT * FROM"
                                  " sanctions_verifications"),
                              "alerts": self._db.query_all(
                                  "SELECT * FROM sanctions_alerts"),
                              "report_type": "SANCTIONS_MONITOR",
                              "generated_at": self._clock.now()}
          '''))

          # TEST v2: asserts calibrados a la aritmetica del ZIP viejo
          TEST = D(r'''
              import pytest
              from shared_engines.common.clocks import FrozenClock
              from shared_engines.audit.chain import AuditTrail
              from shared_engines.storage.database import SQLiteAdapter
              from apps.nexo.domain.compliance.compliance_engine import ComplianceEngine
              from apps.nexo.domain.compliance.sanctions_monitor import SanctionsMonitor
              from apps.nexo.domain.risk.risk_scoring_engine import RiskScoringEngine
              from apps.nexo.domain.risk.fraud_detection_engine import FraudDetectionEngine
              from apps.nexo.domain.risk.risk_evaluation_engine import RiskEvaluationEngine
              from apps.nexo.module.modulo_6_riesgo import Modulo6Riesgo
              from apps.nexo.application.compliance_use_cases.monitor_sanctions_use_case import MonitorSanctionsUseCase
              from apps.nexo.application.risk_use_cases.calculate_risk_score_use_case import CalculateRiskScoreUseCase
              from apps.nexo.application.risk_use_cases.evaluate_risk_use_case import EvaluateRiskUseCase


              def _db(tmp_path):
                  return SQLiteAdapter(tmp_path / "rc.db")


              def test_compliance_engine_persistente(tmp_path) -> None:
                  db = _db(tmp_path)
                  eng = ComplianceEngine(db, FrozenClock())
                  eng.register_event(event_type="REVIEW",
                                     entity_id="E1", details={"a": 1})
                  v = eng.register_violation(
                      entity_id="E1",
                      violation_type="LATE_FILING", details={})
                  assert v["status"] == "OPEN"
                  s = eng.generate_summary()
                  assert s["events"] == 1
                  assert s["violations"] == 1
                  print("OK compliance: eventos+violaciones")


              def test_sanctions_informa_no_bloquea(tmp_path) -> None:
                  db = _db(tmp_path)
                  mon = SanctionsMonitor(db, FrozenClock(),
                                         sanctioned_names=["MALO S.A."])
                  v = mon.verify(entity_name="MALO S.A.")
                  assert v["sanctioned"] is True
                  v2 = mon.verify(entity_name="BUENO S.A.")
                  assert v2["sanctioned"] is False
                  uc = MonitorSanctionsUseCase(mon)
                  r = uc.execute(company_id="C1",
                                 entity_name="MALO S.A.")
                  assert r["status"] == "INFORMATIONAL"
                  s = mon.generate_summary()
                  assert s["sanctioned_entities"] == 1, str(s)
                  print("OK sanciones: 1 entidad distinta,"
                        " INFORMATIONAL, nunca bloquea")


              def test_risk_scoring_8_componentes(tmp_path) -> None:
                  eng = RiskScoringEngine()
                  z = {"score": 0}
                  r = eng.calculate(
                      compliance_risk=z,
                      financial_risk={"score": 80},
                      operational_risk=z,
                      geopolitical_risk=z,
                      fraud_risk=z,
                      supply_chain_risk=z,
                      sanctions_risk=z,
                      war_risk=z)
                  assert r["global_score"] == 10.0
                  assert r["risk_level"] == "LOW"
                  print("OK risk: scoring 8 componentes")


              def test_fraud_detection(tmp_path) -> None:
                  eng = FraudDetectionEngine()
                  r = eng.detect(
                      client_data={"client_id": "C1"},
                      accounting_data={
                          "duplicate_transactions": 2,
                          "unusual_amounts": True},
                      operations_data={
                          "abnormal_activity": True})
                  assert r["level"] == "CRITICAL"
                  assert "ABNORMAL_ACTIVITY" in r["flags"]
                  print("OK risk: fraude CRITICAL")


              def test_modulo6_integral(tmp_path) -> None:
                  m6 = Modulo6Riesgo()
                  r = m6.evaluar_integral(
                      accounting_data={},
                      finance_data={"liquidity_ratio": 0.5},
                      logistics_data={"delayed_shipments": 5},
                      operations_data={"incidents": 1},
                      compliance_record={"valid": False},
                      sanctions_result={"sanctioned": False})
                  # financial=40 (liquidez<1), operational=30
                  # (5*2=10+1*10=10 -> 20 cap... = 20+10=30?
                  #  delayed 5*2=10, incidents 1*10=10 -> 20),
                  # compliance=50 -> promedio ~37 = MEDIUM
                  assert r["score"] > 0
                  assert r["level"] in ("MEDIUM", "HIGH",
                                        "CRITICAL")
                  assert m6.alertas_activas()
                  print("OK risk: integral score>0 + alertas")


              def test_risk_use_cases(tmp_path) -> None:
                  uc = CalculateRiskScoreUseCase(
                      RiskScoringEngine())
                  r = uc.execute(entity_data={
                      "financial_risk": {"score": 80}})
                  assert r["risk_score"] == 10.0
                  ev = RiskEvaluationEngine()
                  u2 = EvaluateRiskUseCase(ev)
                  r2 = u2.execute(risk_context={
                      "components": {"A": {"score": 90}}})
                  assert r2["evaluation"]["level"] == "CRITICAL"
                  print("OK risk: use cases score + evaluate")
          ''')
          forzar("apps/nexo/tests/test_risk_compliance_migrated.py", TEST)
          exit(0)
          EOF

      - name: "L3-1: tests"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps/nexo -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 120 python3 -m pytest apps/nexo/tests/test_risk_compliance_migrated.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/l3.out 2>&1
          echo $? > /tmp/l3
          if [ "$(cat /tmp/l3)" = "0" ]; then echo "- L3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L3 detalle"; echo '```'; tail -80 /tmp/l3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "L3-2: nexo completo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/l3b.out 2>&1
          echo $? > /tmp/l3b
          if [ "$(cat /tmp/l3b)" = "0" ]; then echo "- L3b: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L3b: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L3b detalle"; echo '```'; tail -50 /tmp/l3b.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "L3-3: apps otras + shared"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/l3c.out 2>&1
          echo $? > /tmp/l3c
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/l3d.out 2>&1
          ok3=$?
          if [ "$(cat /tmp/l3c)" = "0" ] && [ "$ok3" = "0" ]; then echo "- L3c: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L3c: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L3c detalle"; echo '```'; tail -60 /tmp/l3c.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in l3 l3b l3c; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: L3 VERDES — LOTE 3 CERRADO**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-E3 v2): sanctions summary por entidades distintas + tests calibrados a aritmetica original (L3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 3 CERRADO. Sigue LOTE 4 executive+bunker.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
