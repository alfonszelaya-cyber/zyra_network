name: ZYRA S7 auditoria despacho de rutas (solo lectura)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  s7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar YAML del workflow
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml', encoding='utf-8')); print('YAML OK')"

      - name: S7 auditoria (reporte al Summary)
        run: |
          cat > /tmp/s7_audit.py << 'PYEOF'
          import os, re

          REPO = os.getcwd()
          OUT = []

          def P(s=""):
              OUT.append(str(s))

          def sec(t):
              P("")
              P("=" * 72)
              P("S7 >>> " + t)
              P("=" * 72)

          SKIP_DIRS = {".git", ".github", "__pycache__", "node_modules", ".venv", "venv"}

          def rel(p):
              return os.path.relpath(p, REPO).replace(os.sep, "/")

          PYS = []
          for root, dirs, files in os.walk(REPO):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for n in files:
                  if n.endswith(".py"):
                      PYS.append(os.path.join(root, n))
          PYS.sort()

          sec("0. ALCANCE")
          P("archivos .py escaneados: %d" % len(PYS))

          CAP = 150

          def grep(pattern, fixed=True, cap=CAP):
              res = []
              for p in PYS:
                  try:
                      with open(p, encoding="utf-8", errors="replace") as f:
                          for i, l in enumerate(f):
                              ok = (pattern in l) if fixed else (re.search(pattern, l) is not None)
                              if ok:
                                  res.append((p, i + 1, l.strip()))
                                  if len(res) >= cap:
                                      return res, True
                  except Exception:
                      pass
              return res, False

          def show(res, trunc):
              if not res:
                  P("SIN COINCIDENCIAS")
              for p, i, l in res:
                  P("%s:%d | %s" % (rel(p), i, l[:170]))
              if trunc:
                  P("(TRUNCADO en %d)" % CAP)

          def context_files(pattern, before, after, maxfiles):
              shown = 0
              for p in PYS:
                  try:
                      src = open(p, encoding="utf-8", errors="replace").read()
                  except Exception:
                      continue
                  if pattern not in src:
                      continue
                  lines = src.splitlines()
                  idxs = [i for i, l in enumerate(lines) if pattern in l]
                  P("--- %s | %d coincidencias | lineas %s ---" % (rel(p), len(idxs), [i + 1 for i in idxs[:6]]))
                  a = idxs[0]
                  for j in range(max(0, a - before), min(len(lines), a + after)):
                      P("%4d | %s" % (j + 1, lines[j]))
                  shown += 1
                  if shown >= maxfiles:
                      break
              if shown == 0:
                  P("SIN COINCIDENCIAS: " + pattern)

          sec("1. GREP 'enroll' en TODO el repo — ¿donde se registra la ruta?")
          r, t = grep("enroll")
          show(r, t)

          sec("2. GREP '_handle_identity_enroll' — ¿quien la llama ademas de su definicion?")
          r, t = grep("_handle_identity_enroll")
          show(r, t)

          sec("3. 'unknown route' — el 404 que viste en pantalla: de donde sale y como despacha")
          r, t = grep("unknown route")
          show(r, t)
          context_files("unknown route", 25, 35, 2)

          sec("4. 'biometrics_unavailable' — donde vive el mensaje de mantenimiento")
          context_files("biometrics_unavailable", 12, 18, 2)

          sec("5. 'face engine not installed' y 'not installed'")
          r, t = grep("face engine not installed")
          show(r, t)
          r, t = grep("not installed")
          show(r, t)

          sec("6. GREP 'ZYRA_BIOMETRICS_PROVIDER' — ¿existe en el codigo?")
          r, t = grep("ZYRA_BIOMETRICS_PROVIDER")
          show(r, t)

          sec("7. GREP 'submit_case' — ¿donde vive el motor de proofing?")
          r, t = grep("submit_case")
          show(r, t)

          sec("8. api.py — IMPORTS (lineas 1-80) y clases: ¿estan importados ProviderError/TemplateQualityError?")
          AP = os.path.join(REPO, "shared_engines", "runtime", "api.py")
          lines = []
          if os.path.exists(AP):
              lines = open(AP, encoding="utf-8", errors="replace").read().splitlines()
              P("total lineas api.py: %d" % len(lines))
              for i in range(min(80, len(lines))):
                  P("%4d | %s" % (i + 1, lines[i]))
              P("--- lineas con 'class ' ---")
              for i, l in enumerate(lines):
                  if "class " in l:
                      P("%4d | %s" % (i + 1, l.strip()[:170]))
          else:
              P("api.py NO encontrado en shared_engines/runtime/")

          sec("9. api.py — todas las lineas con '_handle_'")
          for i, l in enumerate(lines):
              if "_handle_" in l:
                  P("%4d | %s" % (i + 1, l.strip()[:170]))

          sec("10. api.py — lineas con 'route' (cap 100)")
          c = 0
          for i, l in enumerate(lines):
              if re.search(r"route", l, re.I):
                  P("%4d | %s" % (i + 1, l.strip()[:170]))
                  c += 1
                  if c >= 100:
                      P("(TRUNCADO)")
                      break
          if c == 0:
              P("ninguna linea con 'route' en api.py")

          sec("11. def do_POST / def do_GET — donde vive el despacho (contexto)")
          rpost, t1 = grep("def do_POST")
          show(rpost, t1)
          rget, t2 = grep("def do_GET")
          show(rget, t2)
          orden = []
          vistos = set()
          for p, i, l in rpost:
              if p not in vistos:
                  vistos.add(p)
                  orden.append((p, i))
          orden.sort(key=lambda x: 0 if x[0].endswith("runtime/api.py") else 1)
          hecho = 0
          for p, a in orden:
              if hecho >= 2:
                  break
              try:
                  lines2 = open(p, encoding="utf-8", errors="replace").read().splitlines()
              except Exception:
                  continue
              idxs = [j for j, l in enumerate(lines2) if "def do_POST" in l]
              if not idxs:
                  continue
              a = idxs[0]
              P("--- %s | def do_POST linea %d, contexto ---" % (rel(p), a + 1))
              for j in range(max(0, a - 10), min(len(lines2), a + 60)):
                  P("%4d | %s" % (j + 1, lines2[j]))
              hecho += 1

          sec("12. main.py — cables api/serve/enroll/BIOMETRICS/proofing/route")
          MP = os.path.join(REPO, "main.py")
          if os.path.exists(MP):
              mlines = open(MP, encoding="utf-8", errors="replace").read().splitlines()
              P("total lineas main.py: %d" % len(mlines))
              c2 = 0
              for i, l in enumerate(mlines):
                  if re.search(r"api|Api|serve|enroll|BIOMETRICS|proofing|route", l):
                      P("%4d | %s" % (i + 1, l.strip()[:170]))
                      c2 += 1
                      if c2 >= 120:
                          P("(TRUNCADO)")
                          break
          else:
              P("main.py no encontrado en raiz")

          sec("13. ARBOL shared_engines (archivos .py)")
          c3 = 0
          for root, dirs, files in os.walk(os.path.join(REPO, "shared_engines")):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for n in sorted(files):
                  if n.endswith(".py"):
                      P(rel(os.path.join(root, n)))
                      c3 += 1
                      if c3 >= 250:
                          P("(TRUNCADO)")
                          break

          sec("14. FIN — SOLO LECTURA, NINGUN ARCHIVO DEL PROYECTO FUE MODIFICADO")
          print("\n".join(OUT))
          PYEOF
          python3 /tmp/s7_audit.py > reporte_s7.txt 2>&1 || echo "EL SCRIPT TERMINO CON ERROR (ver arriba)" >> reporte_s7.txt
          {
            echo "## Reporte S7 — despacho de rutas de la Red (solo lectura)"
            echo ""
            echo '````'
            cat reporte_s7.txt
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          wc -c reporte_s7.txt

      - name: Guardar reporte como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-s7
          path: reporte_s7.txt
