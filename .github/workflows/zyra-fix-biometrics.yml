              "apps/agro/modules/produccion/rendimiento/yield_service.py": textwrap.dedent('''\
                  """AGRO - rendimiento (GPT-2): reporte que
                  compara lo planificado vs lo producido
                  por productor. Solo lectura."""
                  from __future__ import annotations


                  class YieldService:
                      def __init__(self, store) -> None:
                          self._store = store

                      def report(self, producer_id) -> dict:
                          planned = 0.0
                          plans = []
                          for name in (
                              "query_all", "query",
                              "fetchall",
                          ):
                              fn = getattr(
                                  self._store._db, name,
                                  None,
                              )
                              if callable(fn):
                                  try:
                                      got = fn(
                                          "SELECT plan_id, crop,"
                                          " planned_quantity,"
                                          " status FROM agro_plans"
                                          " WHERE producer_id = ?"
                                          " AND status ="
                                          " 'harvested'",
                                          (producer_id,),
                                      )
                                  except Exception:
                                      got = None
                                  if got:
                                      plans = list(got)
                                      break
                          for p in plans:
                              try:
                                  planned += float(
                                      p["planned_quantity"]
                                  )
                              except Exception:
                                  try:
                                      planned += float(p[2])
                                  except Exception:
                                      pass
                          produced = 0.0
                          for prod in (
                              self._store.list_productions()
                          ):
                              if str(
                                  prod.get("producer_id")
                              ) != str(producer_id):
                                  continue
                              try:
                                  produced += float(
                                      prod.get("quantity") or 0
                                  )
                              except Exception:
                                  pass
                          efficiency = None
                          if planned > 0:
                              efficiency = round(
                                  produced / planned, 4
                              )
                          return {
                              "producer_id": producer_id,
                              "planned_harvested":
                                  round(planned, 4),
                              "produced": round(
                                  produced, 4
                              ),
                              "efficiency": efficiency,
                          }
              '''),
              "apps/agro/modules/operaciones/incidencias/incident_service.py": textwrap.dedent('''\
                  """AGRO - incidencias operativas (GPT-2):
                  registro, listado abierto y resolucion."""
                  from __future__ import annotations

                  import uuid


                  class IncidentService:
                      def __init__(self, db) -> None:
                          self._db = db
                          self._db.execute(
                              "CREATE TABLE IF NOT EXISTS"
                              " agro_incidents ("
                              " incident_id TEXT PRIMARY"
                              " KEY,"
                              " producer_id TEXT NOT NULL,"
                              " unit_id TEXT,"
                              " kind TEXT NOT NULL,"
                              " severity TEXT NOT NULL,"
                              " detail TEXT,"
                              " status TEXT NOT NULL,"
                              " created_at TEXT,"
                              " resolved_at TEXT)"
                          )

                      def report(
                          self, *, producer_id,
                          unit_id=None, kind,
                          severity, detail="",
                      ) -> dict:
                          import time as _t
                          inc_id = (
                              "INCAG-"
                              + uuid.uuid4().hex[:10]
                          )
                          ts = _t.strftime(
                              "%Y-%m-%dT%H:%M:%SZ",
                              _t.gmtime(),
                          )
                          self._db.execute(
                              "INSERT INTO agro_incidents ("
                              " incident_id, producer_id,"
                              " unit_id, kind, severity,"
                              " detail, status,"
                              " created_at, resolved_at)"
                              " VALUES (?, ?, ?, ?, ?, ?,"
                              " 'open', ?, NULL)",
                              (inc_id, producer_id,
                               unit_id, kind, severity,
                               str(detail or ""), ts),
                          )
                          return {
                              "incident_id": inc_id,
                              "producer_id": producer_id,
                              "kind": kind,
                              "severity": severity,
                              "status": "open",
                          }

                      def open_of(
                          self, producer_id,
                      ) -> list:
                          for name in (
                              "query_all", "query",
                              "fetchall",
                          ):
                              fn = getattr(
                                  self._db, name, None
                              )
                              if callable(fn):
                                  try:
                                      got = fn(
                                          "SELECT incident_id,"
                                          " producer_id,"
                                          " unit_id, kind,"
                                          " severity, detail,"
                                          " status, created_at"
                                          " FROM"
                                          " agro_incidents WHERE"
                                          " producer_id = ? AND"
                                          " status = 'open'"
                                          " ORDER BY created_at",
                                          (producer_id,),
                                      )
                                  except Exception:
                                      got = None
                                  if got:
                                      return [
                                          dict(r) for r in got
                                      ]
                          return []

                      def resolve(
                          self, incident_id,
                      ) -> dict:
                          import time as _t
                          ts = _t.strftime(
                              "%Y-%m-%dT%H:%M:%SZ",
                              _t.gmtime(),
                          )
                          self._db.execute(
                              "UPDATE agro_incidents SET"
                              " status = 'resolved',"
                              " resolved_at = ? WHERE"
                              " incident_id = ?",
                              (ts, incident_id),
                          )
                          return {
                              "incident_id": incident_id,
                              "status": "resolved",
                          }
              '''),
          }

          for path, content in FILES.items():
              p = Path(path)
              if not p.exists():
                  print("MISS", path)
                  continue
              old = p.read_text(encoding="utf-8")
              cls_name = content.split("class ")[1].split("(")[0].strip()
              first_def = content.split("    def ")[1].split("(")[0].strip()
              if ("class " + cls_name) in old and ("def " + first_def) in old:
                  print("SKIP", path)
                  continue
              compile(content, path, "exec")
              p.write_text(content, encoding="utf-8")
              print("OK", path)
          SVCEOF

      - name: "Paso 2 - matriz de permisos: nuevas operaciones"
        run: |
          python3 - <<'MXEOF'
          from pathlib import Path
          p = Path("apps/agro/security/operation_matrix.py")
          t = p.read_text(encoding="utf-8")
          if "profile.update" in t:
              print("SKIP matrix (ya aplicado)")
              raise SystemExit(0)
          old_p = '    "production.create",\n})'
          new_p = (
              '    "production.create",\n'
              '    "profile.update",\n'
              '    "unit.create",\n'
              '    "document.submit",\n'
              '    "plan.create",\n'
              '    "plan.advance",\n'
              '    "incident.report",\n'
              '    "incident.resolve",\n'
              '}'
          )
          if old_p not in t:
              print("MISS producer_ops ancla")
              raise SystemExit(1)
          t = t.replace(old_p, new_p, 1)
          old_g = '    "aid.confirm",\n})'
          new_g = '    "aid.confirm",\n    "document.verify",\n})'
          if old_g not in t:
              print("MISS gov_ops ancla")
              raise SystemExit(1)
          t = t.replace(old_g, new_g, 1)
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          print("OK matrix ampliada")
          MXEOF

      - name: "Paso 3 - server: helper generico + guard + rutas + reportes"
        run: |
          python3 - <<'SRVEOF'
          from pathlib import Path

          sp = Path("apps/agro/server.py")
          t = sp.read_text(encoding="utf-8")

          if "_ZYRA_SVC_V2" in t:
              print("SKIP server ya aplicado")
              raise SystemExit(0)

          anchor_post = "    def _post(self, s: list[str]) -> None:\n"
          if anchor_post not in t:
              print("MISS ancla _post")
