name: "ZYRA RUN5a: auditoria AXIS (AX-4 justicia regla 79 + salud + policia + criminal + forense + evidencia) — solo lectura + baseline"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] mapa AXIS (arbol + lineas por archivo)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA AXIS (RUN 5b escritura)" >> "$SUM"
          echo "### arbol apps/axis (dirs 2 niveles)" >> "$SUM"
          { echo '```'; find apps/axis -maxdepth 2 -type d 2>/dev/null | grep -v __pycache__ | sort; echo '```'; } >> "$SUM"
          echo "### archivos .py con lineas (top 60)" >> "$SUM"
          { echo '```'; find apps/axis -name "*.py" 2>/dev/null | grep -v __pycache__ | while read f; do echo "$(wc -l < "$f") $f"; done | sort -rn | head -60; echo '```'; } >> "$SUM"
          echo "### carpetas VACIAS (sin .py ademas de __init__)" >> "$SUM"
          { echo '```'; find apps/axis -type d 2>/dev/null | grep -v __pycache__ | while read d; do n=$(find "$d" -maxdepth 1 -name "*.py" ! -name "__init__.py" 2>/dev/null | wc -l); if [ "$n" = "0" ]; then echo "VACIA: $d"; fi; done | head -50; echo '```'; } >> "$SUM"
          echo "### fin mapa" >> "$SUM"
          exit 0

      - name: "[LECTURA] fuentes completas de justicia/acceso/verificacion (AX-4 extiende esto)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## FUENTES life_history (AX-4)" >> "$SUM"
          for f in apps/axis/life_history/justice_service.py apps/axis/life_history/access_control.py apps/axis/life_history/verification.py apps/axis/life_history/clearance_service.py; do
            echo "### $f" >> "$SUM"
            { echo '```python'; cat "$f" 2>/dev/null; echo '```'; } >> "$SUM"
          done
          echo "### fin fuentes justicia" >> "$SUM"
          exit 0

      - name: "[LECTURA] firmas de TODO life_history + DDLs + tests de justicia"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## firmas class/def de life_history" >> "$SUM"
          { echo '```'; for f in apps/axis/life_history/*.py; do [ -f "$f" ] || continue; case "$f" in *__init__*|*tests*) continue;; esac; echo "== $f"; grep -n "^class \|    def \|^def " "$f" | head -25; done; echo '```'; } >> "$SUM"
          echo "## DDLs (CREATE TABLE) en apps/axis" >> "$SUM"
          { echo '```'; grep -rh "CREATE TABLE IF NOT EXISTS" apps/axis --include="*.py" 2>/dev/null | grep -v __pycache__ | sort -u; echo '```'; } >> "$SUM"
          echo "## test_judicial_automation.py COMPLETO (patron de test de justicia)" >> "$SUM"
          { echo '```python'; cat apps/axis/life_history/tests/test_judicial_automation.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## test_service.py (primeras 80 lineas — patron de test de vida)" >> "$SUM"
          { echo '```python'; head -80 apps/axis/life_history/tests/test_service.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## server de axis (donde hay rutas)" >> "$SUM"
          { echo '```'; find apps/axis -maxdepth 1 -name "*.py" -exec wc -l {} \; 2>/dev/null; grep -n "^class \|    def \|do_GET\|do_POST\|_route" apps/axis/server.py 2>/dev/null | head -40; echo '```'; } >> "$SUM"
          echo "## fin auditoria" >> "$SUM"
          exit 0

      - name: "[LECTURA] regresion 4 apps (baseline)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Sin cambios de codigo; fallar si regresion rota"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: regresion rota — REVISAR antes de RUN 5b**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**AUDITORIA COMPLETA — SIN CAMBIOS (correcto). RUN 5b: escribo AX-4..AX-9 con las fuentes impresas arriba (extendiendo justice_service y creando solo lo que falta, reglas 68/69).**"
            exit 0
          fi
          git commit -m "chore(auditoria): limpieza de caches tras regresion verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK (limpieza)**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK. RUN 5b listo.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
