name: ZYRA AXIS Block B

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix bridge - create its table
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/axis/life_history/"
              "outbox_bridge.py"
          )
          src = path.read_text(encoding="utf-8")

          if "CREATE TABLE IF NOT EXISTS" in src:
              print("RESULT: already fixed")
          else:
              anchor = (
                  "          class OutboxBridge:\n"
                  "              def __init__(self, *, life, outbox, clock):\n"
                  "                  self._life = life\n"
                  "                  self._outbox = outbox\n"
                  "                  self._clock = clock\n"
              )
              assert anchor in src, "anchor not found"
              fixed = anchor + (
                  "                  self._life._store._db.execute(\n"
                  "                      \"CREATE TABLE IF NOT EXISTS\"\n"
                  "                      \" life_outbox_sent (\"\n"
                  "                      \" event_id TEXT PRIMARY KEY,\"\n"
                  "                      \" sent_at REAL NOT NULL)\"\n"
                  "                  )\n"
              )
              src = src.replace(anchor, fixed, 1)
              path.write_text(src, encoding="utf-8")
              print("RESULT: TABLE CREATION ADDED")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("SYNTAX OK")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/3 Outbox bridge tests
        run: python -m pytest apps/axis/life_history/tests/test_outbox_bridge.py -v

      - name: 2/3 Life History regression
        run: |
          python -m pytest apps/axis/life_history/tests/test_service.py apps/axis/life_history/tests/test_verification.py apps/axis/life_history/tests/test_health_link.py apps/axis/life_history/tests/test_longitudinal_screen.py apps/axis/life_history/tests/test_justice_service.py apps/axis/life_history/tests/test_security_service.py apps/axis/life_history/tests/test_ops_server.py apps/axis/life_history/tests/test_clearance_ops.py apps/axis/life_history/tests/test_concurrency_recovery.py -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/outbox_bridge.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "outbox bridge: creates its sent-table on init"
            git push
          fi
