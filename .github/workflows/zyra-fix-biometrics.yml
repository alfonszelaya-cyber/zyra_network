name: "AGRO RUN E: GPT-5+6 recursos valorados con historial + riesgo umbrales/alertas/respuestas"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - servicios recursos+riesgo reforzados (append aditivo)"
        run: |
          python3 - <<'APPEOF'
          import textwrap
          from pathlib import Path

