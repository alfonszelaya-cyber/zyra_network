name: "ZYRA AUDIT 4 (veredicto 500)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Parche temporal 6 fixes (SOLO workspace, sin commit)
        run: |
          python3 << 'EOF'
          import pathlib, sys
          def parchar(ruta, viejo, nuevo, etiqueta, ya=None):
              p = pathlib.Path(ruta)
              src = p.read_text(encoding="utf-8")
              marca = ya if ya is not None else nuevo
              if marca in src:
                  print("[YA APLICADO] " + etiqueta); return
              n = src.count(viejo)
              if n != 1:
                  print("[ERROR] " + etiqueta + " ancla=" + str(n)); sys.exit(1)
              p.write_text(src.replace(viejo, nuevo, 1), encoding="utf-8")
              print("[OK] " + etiqueta)
          parchar("shared_engines/runtime/combined_api.py",
              '        "proofing",\n    }\n)',
              '        "proofing",\n        "verify-existence",\n    }\n)',
              "FIX-1", '        "verify-existence",\n')
          parchar("shared_engines/runtime/tests/test_runtime_api.py",
              '"selfie_image_b64": "cGVkcm8tc2VsZmll"',
              '"selfie_image_b64": "cGVkcm8tZG9j"',
              "FIX-2", '"doc_image_b64": "cGVkcm8tZG9j", "selfie_image_b64": "cGVkcm8tZG9j"')
          parchar("shared_engines/runtime/tests/test_capabilities_api.py",
              '        selfie = base64.b64encode(b"selfie-pedro-real").decode("ascii")\n        docimg = base64.b64encode(b"doc-pedro-dui").decode("ascii")',
              '        selfie = base64.b64encode(b"selfie-pedro-real").decode("ascii")\n        docimg = selfie',
              "FIX-3", 'docimg = selfie')
          v4 = ('    db = SQLiteAdapter(tmp_path / "exp.db")\n    clock = FrozenClock()\n    reg = ProfileRegistry(db, clock, audit=AuditTrail(db, clock), outbox=Outbox(db, clock))')
          n4 = ('    from shared_engines.runtime.config import RuntimeConfig\n    from shared_engines.runtime.kernel import ZyraKernel\n    from shared_engines.verification.signatures import Ed25519Signer\n    from shared_engines.security.biometrics import BiometricsEngine, BiometricsPolicy, DeterministicTestProvider, TemplateCipher\n    db = SQLiteAdapter(tmp_path / "exp.db")\n    clock = FrozenClock()\n    signer, _ = Ed25519Signer.generate()\n    kernel = ZyraKernel(db=db, clock=clock, signer=signer, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))\n    kernel.bootstrap_root()\n    kernel._biometrics = BiometricsEngine(db=db, clock=clock, audit=kernel.audit, provider=DeterministicTestProvider(), cipher=TemplateCipher(master_key_hex="ab" * 32), policy=BiometricsPolicy(require_liveness=False, doc_reject=0.01, doc_review=0.02, doc_auto=0.03, dup_reject=0.98))\n    reg = ProfileRegistry(db, clock, audit=AuditTrail(db, clock), outbox=Outbox(db, clock))')
          parchar("shared_engines/network/tests/test_portable_identity.py", v4, n4, "FIX-4", 'kernel.bootstrap_root()')
          parchar("shared_engines/integrations/engine.py",
              '                if index is (not (\n                        None)):',
              '                if index is not None:',
              "FIX-5", '                if index is not None:')
          v6 = ('        MigrationRunner(\n            db,\n            "integrations.sources",\n            _SOURCE_MIGRATIONS,\n        ).run(clock)')
          n6 = (v6 + '\n        self._db.execute(\n            "CREATE TABLE IF NOT EXISTS source_snapshots ("\n            " source_id TEXT NOT NULL,"\n            " url TEXT NOT NULL,"\n            " sha256 TEXT NOT NULL,"\n            " summary_json TEXT NOT NULL,"\n            " fetch_count INTEGER NOT NULL DEFAULT 1,"\n            " last_fetched REAL NOT NULL,"\n            " PRIMARY KEY (source_id, url))"\n        )')
          parchar("shared_engines/integrations/engine.py", v6, n6, "FIX-6", 'CREATE TABLE IF NOT EXISTS source_snapshots')
          print("FIXES TEMPORALES OK")
          EOF

      - name: Sonda 1 - sweep (confirmacion FIX-5/6)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import json, pathlib, tempfile
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.integrations.engine import (PublicSourceClient, SourceIndex, sweep_onec, sweep_marn, ONEC_ENDPOINTS)
          d = pathlib.Path(tempfile.mkdtemp())
          geo = json.dumps({"type":"FeatureCollection","features":[{"type":"Feature"},{"type":"Feature"}]}).encode()
          meta = json.dumps({"layers":[{"id":0,"name":"a"},{"id":1,"name":"b"}]}).encode()
          one = json.dumps([{"codigo":"0111101"}]).encode()
          def opener(url):
              if url.endswith("?f=json"): return meta
              if "/query" in url: return geo
              if url.endswith(tuple(ONEC_ENDPOINTS)): return one
              raise OSError("no simulada")
          cli = PublicSourceClient(clock=FrozenClock(), ttl_seconds=60.0, opener=opener)
          idx = SourceIndex(SQLiteAdapter(d / "s.db"), FrozenClock())
          r1 = sweep_onec(cli, idx)
          r2 = sweep_marn(cli, idx, max_layers_per_service=2, pause_seconds=0)
          rows = idx._db.query_all("SELECT * FROM source_snapshots")
          print("SWEEP rows esperadas 25 / obtenidas:", len(rows))
          EOF

      - name: Sonda 2 - veredicto con traceback real
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import base64, inspect, json, threading, time, traceback, urllib.request, urllib.error
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          from shared_engines.security.biometrics import BiometricsEngine, BiometricsPolicy, DeterministicTestProvider, TemplateCipher
          from shared_engines.network.portable_profile import ProfileRegistry
          from shared_engines.audit.chain import AuditTrail
          from shared_engines.events.outbox import Outbox

          def envolver(cls):
              for name in list(vars(cls)):
                  if name.startswith("__"): continue
                  fn = vars(cls)[name]
                  if not callable(fn): continue
                  def hacer(f, n):
                      def interno(*a, **k):
                          try:
                              return f(*a, **k)
                          except Exception:
                              print("@@@ EXCEPCION CRUZANDO", cls.__name__ + "." + n)
                              traceback.print_exc()
                              raise
                      return interno
                  setattr(cls, name, hacer(fn, name))

          try:
              from shared_engines.runtime import combined_api as _c
              from shared_engines.runtime import capabilities_api as _ca
              from shared_engines.runtime import api as _ra
              envolver(_c.CombinedHandler)
              envolver(_ca.CapabilitiesApiHandler)
              envolver(_ra.ZyraApiHandler)
              print("WRAPPERS INSTALADOS")
          except Exception:
              traceback.print_exc()

          net_db = SQLiteAdapter(":memory:")
          signer, pub = Ed25519Signer.generate()
          kernel = ZyraKernel(db=net_db, clock=FrozenClock(), signer=signer, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(db=net_db, clock=FrozenClock(), audit=kernel.audit, provider=DeterministicTestProvider(), cipher=TemplateCipher(master_key_hex="ab" * 32), policy=BiometricsPolicy(require_liveness=False, doc_reject=0.01, doc_review=0.02, doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(net_db, FrozenClock(), identity=kernel.identity, signer=signer)
          print("ATTRS DE caps:", json.dumps({k: type(v).__name__ for k, v in vars(caps).items()}))
          caps.profiles = ProfileRegistry(net_db, FrozenClock(), audit=AuditTrail(net_db, FrozenClock()), outbox=Outbox(net_db, FrozenClock()))
          caps.profiles.register_app(app_id="banco-ny", display_name="Banco NY", scopes=("display_name","national_id","id_country","id_type","id_number","nationality","birth_date","address"))
          srv = serve_combined(kernel, caps, host="127.0.0.1", port=0)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.3)
          base = "http://127.0.0.1:" + str(srv.server_address[1])

          def post(ruta, doc):
              data = json.dumps(doc).encode()
              req = urllib.request.Request(base + ruta, data=data, method="POST", headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode())

          selfie = base64.b64encode(b"selfie-pedro-real").decode("ascii")
          st, r1 = post("/identity/enroll", {"kind":"person","display_name":"Pedro Prueba","actor":"banco-ny","doc_image_b64":selfie,"selfie_image_b64":selfie})
          print("ENROLL:", st, json.dumps(r1)[:250])
          zid = ((r1.get("data") or {}).get("identity") or {}).get("zid")
          print("ZID:", zid)
          try:
              caps.profiles.set_field(zid=zid, field="display_name", value="Pedro Prueba", verified=True)
              caps.profiles.set_field(zid=zid, field="id_country", value="SV", verified=True)
              caps.profiles.set_field(zid=zid, field="id_type", value="dui", verified=True)
              caps.profiles.set_field(zid=zid, field="birth_date", value="1992-04-04", verified=True)
              print("SET_FIELD x4 OK")
          except Exception:
              traceback.print_exc()

          st, r2 = post("/verification/person", {"zid": zid, "selfie_b64": selfie, "actor_app": "banco-ny"})
          print("HTTP /verification/person ->", st, json.dumps(r2)[:400])

          print("CANDIDATOS EN caps:")
          for name in dir(caps):
              if name.startswith("_"): continue
              if any(k in name.lower() for k in ("verif","person","verdict")):
                  fn = getattr(caps, name)
                  if callable(fn):
                      try:
                          print("  ", name, inspect.signature(fn))
                      except (TypeError, ValueError):
                          print("  ", name)
          for name in dir(caps):
              if name.startswith("_"): continue
              if any(k in name.lower() for k in ("verif","person","verdict")):
                  fn = getattr(caps, name)
                  if not callable(fn): continue
                  try:
                      sig = inspect.signature(fn)
                  except (TypeError, ValueError):
                      continue
                  params = set(sig.parameters) - {"self"}
                  if params and params <= {"zid","selfie_b64","actor_app"}:
                      print("LLAMADA DIRECTA:", name, sorted(params))
                      try:
                          res = fn(**{p: {"zid": zid, "selfie_b64": selfie, "actor_app": "banco-ny"}[p] for p in params})
                          print("RESULTADO DIRECTO:", str(res)[:500])
                      except Exception:
                          traceback.print_exc()
          srv.shutdown()
          srv.server_close()
          EOF

      - name: Dump del handler de verificacion
        run: |
          CA="shared_engines/runtime/capabilities_api.py"
          CP="shared_engines/runtime/capabilities.py"
          ver() { echo ""; echo "##### $1 lineas $2-$3"; awk -v a="$2" -v b="$3" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' "$1" || true; }
          echo "=== CLASES Y DEFS EN capabilities_api.py ==="
          grep -n "^class \|    def \|^def " "$CA" | head -60 || true
          echo ""
          echo "=== ANCLAS 'person' ==="
          grep -n "person" "$CA" | head -15 || true
          for L in $(grep -n "person" "$CA" | head -3 | cut -d: -f1); do
            s=$((L-8)); [ "$s" -lt 1 ] && s=1 || true
            ver "$CA" "$s" $((L+90))
          done
          echo ""
          echo "=== ZYRACAPABILITIES: defs ==="
          grep -n "^class \|    def " "$CP" | head -40 || true
          LI=$(grep -n "def __init__" "$CP" | head -1 | cut -d: -f1 || true)
          if [ -n "$LI" ]; then
            s=$((LI-5)); [ "$s" -lt 1 ] && s=1 || true
            ver "$CP" "$s" $((LI+45))
          fi
          echo ""
          echo "=== DONDE SE FABRICA EL 500 ==="
          grep -rn "internal_error" shared_engines/runtime --include='*.py' | head -10 || true
          exit 0
