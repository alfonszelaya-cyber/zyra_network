name: ZYRA Hardening Block 1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest

      - name: Full suite (13 tests incl. hardening)
        run: python -m shared_engines.security.biometrics -v

      - name: Runtime existing tests must stay green
        run: python -m pytest shared_engines/runtime/tests -q
