name: "AGRO RUN G v2: fix helpers test + orden rutas sales/all"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - server: ruta sales/all especifica antes que la generica (si falta)"
        run: |
          python3 - <<'SVFEOF'
          from pathlib import Path

          sp = Path("apps/agro/server.py")
          t = sp.read_text(encoding="utf-8")

          if 's == ["sales", "all"]' in t:
              generica = (
                  '        if len(s) == 2 and s[0] == "sales":\n'
              )
              especifica = (
                  '        if s == ["sales", "all"]:\n'
              )
              # reordenar: especifica antes de generica
              bloque_gen = (
                  '        if len(s) == 2 and s[0] == "sales":\n'
                  "            rows = self._ZYRA_COM_D(\n"
                  "                \"apps.agro.modules.comercializacion.venta_simple.simple_sale_service\",\n"
                  "                \"sales_of_db\",\n"
                  "            )(type(self).store._db, s[1])\n"
                  "            self._send(\n"
                  "                200,\n"
                  "                {\"ok\": True, \"data\": {\"sales\": rows}},\n"
                  "            )\n"
                  "            return\n"
              )
              if bloque_gen in t:
                  bloque_esp = (
                      '        if s == ["sales", "all"]:\n'
                      "            rows = self._ZYRA_COM_D(\n"
                      "                \"apps.agro.modules.comercializacion.venta_simple.simple_sale_service\",\n"
                      "                \"sales_of_db\",\n"
                      "            )(type(self).store._db, None)\n"
                      "            self._send(\n"
                      "                200,\n"
                      "                {\"ok\": True, \"data\": {\"sales\": rows}},\n"
                      "            )\n"
                      "            return\n"
                  )
                  t = t.replace(bloque_gen, bloque_esp + bloque_gen, 1)
                  # eliminar la especifica vieja si estaba despues
                  bloque_esp_viejo = (
                      '        if s == ["sales", "all"]:\n'
                      "            rows = self._ZYRA_COM_D(\n"
                      "                \"apps.agro.modules.comercializacion.venta_simple.simple_sale_service\",\n"
                      "                \"sales_of_db\",\n"
                      "            )(type(self).store._db, None)\n"
                      "            self._send(\n"
                      "                200,\n"
                      "                {\"ok\": True, \"data\": {\"sales\": rows}},\n"
                      "            )\n"
                      "            return\n"
                  )
                  if t.count(bloque_esp) > 1:
                      primera = t.find(bloque_esp)
                      resto = t[:primera + len(bloque_esp)] + t[primera + len(bloque_esp):].replace(bloque_esp_viejo, "", 1)
                      t = resto
                  compile(t, str(sp), "exec")
                  sp.write_text(t, encoding="utf-8")
                  print("OK sales/all reordenada antes de la generica")
              else:
                  print("SKIP: bloque generico con formato distinto; revisar")
                  raise SystemExit(1)
          else:
              print("SKIP: sales/all ya correcta")
          SVFEOF

      - name: "Paso 2 - test: _get -> _gjp y sales/all verifica con _gjp"
        run: |
          python3 - <<'TFIXEOF'
          from pathlib import Path

          p = Path("apps/agro/tests/test_agro_superapp.py")
          t = p.read_text(encoding="utf-8")
          cambios = []

          if "_get(base + \"/agro/productor/" in t or '_get(\n' in t and "productor/" in t:
              pass

          # reemplazar llamadas rotas _get(base + ...) por _gjp
          import re as _re
          n = 0
          def fix_call(m):
              global n
              n += 1
              return "_gjp(" + m.group(1) + ")"
          t2 = _re.sub(
              r"_get\(\s*(base \+ [^)]+?)\s*\)",
              fix_call,
              t,
          )
          if n:
              t = t2
              cambios.append("OK " + str(n) + " llamadas _get->_gjp")

          # el assert de sales/all en el test de carga usa _gjp ya
          if cambios:
              compile(t, str(p), "exec")
              p.write_text(t, encoding="utf-8")
          for c in cambios:
              print(c)
          if not cambios:
              print("SKIP test (sin llamadas rotas)")
          TFIXEOF

      - name: "Paso 3 - verificacion interprete FRESCO"
        run: |
          python3 -c "
          from apps.agro.infrastructure.persistence.agro_migrations import run_agro_migrations, MIGRATIONS
          assert len(MIGRATIONS) >= 6
          from apps.agro.assets.translations.es import TEXTOS
          assert TEXTOS['panel_titulo'] == 'Mi Panel'
          from apps.agro.assets.templates.page_base import render_page
          assert 'DOCTYPE' in render_page('T', 'x')
          print('OK migraciones + assets')
          "

      - name: "Paso 4 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN G v2: fix firma test + orden ruta sales/all" -m "FIX1: llamadas _get(url) rotas -> _gjp(url) (firma correcta RUN F). FIX2: ruta sales/all ahora antes que la generica len(s)==2 (la generica capturaba 'all' como productor). 46/48 ya pasaban."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
