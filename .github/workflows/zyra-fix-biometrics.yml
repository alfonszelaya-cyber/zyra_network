name: ZYRA S20 auditoria desglose de datos y puertas de la Red (solo lectura)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  s20:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar YAML del workflow
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml', encoding='utf-8')); print('YAML OK')"

      - name: S20 auditoria
        run: |
          cat > /tmp/s20_audit.py << 'PYEOF'
          import os, re

          REPO = os.getcwd()
          OUT = []
          def P(s=""): OUT.append(str(s))
          def sec(t):
              P("")
              P("=" * 72)
              P("S20 >>> " + t)
              P("=" * 72)

          SKIP = {".git", ".github", "__pycache__", "node_modules", ".venv", "venv"}
          PYS = []
          JS = []
          for root, dirs, files in os.walk(REPO):
              dirs[:] = [d for d in dirs if d not in SKIP]
              for n in files:
                  p = os.path.join(root, n)
                  if n.endswith(".py"):
                      PYS.append(p)
                  elif n.endswith((".js", ".html")):
                      JS.append(p)
          PYS.sort(); JS.sort()

          P("archivos .py: %d | .js/.html: %d" % (len(PYS), len(JS)))

          def grep(pat, files, ci=True, cap=120):
              rx = re.compile(pat, re.I if ci else 0)
              res = []
              for p in files:
                  try:
                      with open(p, encoding="utf-8", errors="replace") as f:
                          for i, l in enumerate(f):
                              if rx.search(l):
                                  res.append((p, i + 1, l.strip()[:160]))
                                  if len(res) >= cap:
                                      return res, True
                  except Exception:
                      pass
              return res, False

          def show(res, trunc, relfrom=REPO):
              if not res:
                  P("SIN COINCIDENCIAS")
              for p, i, l in res:
                  P(os.path.relpath(p, relfrom).replace(os.sep, "/") + ":" + str(i) + " | " + l)
              if trunc:
                  P("(TRUNCADO)")

          def dump(path, a, b, label):
              try:
                  lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              except Exception as e:
                  P("no se pudo leer: " + repr(e)[:120]); return
              P("--- " + label + " | lineas %d a %d de %d ---" % (a + 1, min(b, len(lines)), len(lines)))
              for i in range(a, min(b, len(lines))):
                  P("%4d | %s" % (i + 1, lines[i]))

          sec("1. CAMPOS DE NACIMIENTO/EDAD en codigo Python")
          r, t = grep(r"\bdob\b|date_of_birth|birthdate|birth_date|fecha_nacimiento|birth", PYS, cap=140)
          show(r, t)

          sec("2. METADATA DE DOCUMENTO (doc_number/doc_country/doc_kind/doc_type)")
          r, t = grep(r"doc_number|doc_country|doc_kind|doc_type|document_number|numero_documento|id_number", PYS, cap=140)
          show(r, t)

          sec("3. MOTORES OCR presentes")
          r, t = grep(r"tesseract|easyocr|paddle|pyocr|ocr", PYS, cap=100)
          show(r, t)

          sec("4. CODIGO DE BARRAS / MRZ / PDF417 / AAMVA")
          r, t = grep(r"pdf417|zxing|barcode|BarcodeDetector|mrz|aamva", PYS + JS, cap=100)
          show(r, t)

          sec("5. MODELOS DE ROSTRO presentes en el repo")
          r, t = grep(r"sface|yunet|arcface|buffalo|scrfd|insightface|FaceRecognizerSF|FaceDetectorYN|mobilefacenet", PYS, cap=120)
          show(r, t)

          sec("6. LIVENESS / PARPADEO / VIVEZA")
          r, t = grep(r"liveness|blink|parpadeo|viveza", PYS, cap=100)
          show(r, t)

          sec("7. TODAS LAS PUERTAS DE LA RED — api.py _route/_route_get/_route_post COMPLETOS")
          AP = os.path.join(REPO, "shared_engines", "runtime", "api.py")
          if os.path.exists(AP):
              dump(AP, 99, 370, "api.py rutas")

          sec("8. PUERTA /proofing/submit — contrato completo")
          if os.path.exists(AP):
              dump(AP, 984, 1024, "api.py proofing submit")

          sec("9. INVENTARIO DE MOTORES DE IDENTIDAD (primera linea docstring)")
          IDIR = os.path.join(REPO, "shared_engines", "identity")
          if os.path.isdir(IDIR):
              for n in sorted(os.listdir(IDIR)):
                  if not n.endswith(".py"):
                      continue
                  p = os.path.join(IDIR, n)
                  try:
                      head = ""
                      for l in open(p, encoding="utf-8", errors="replace"):
                          if l.strip():
                              head = l.strip()[:150]
                              break
                  except Exception:
                      head = "?"
                  P("%-38s | %s" % (n, head))

          sec("10. minor_biometrics_engine.py (0-55) — menores con tutor")
          dump(os.path.join(IDIR, "minor_biometrics_engine.py"), 0, 55, "minor engine")

          sec("11. assurance_engine.py (0-50) — ¿que asegura?")
          dump(os.path.join(IDIR, "assurance_engine.py"), 0, 50, "assurance")

          sec("12. mi_zid_engine.py (0-40) y birth_registry_engine.py (0-40)")
          dump(os.path.join(IDIR, "mi_zid_engine.py"), 0, 40, "mi_zid")
          dump(os.path.join(IDIR, "birth_registry_engine.py"), 0, 40, "birth_registry")

          sec("13. QUE ENVIAN LAS APPS A /identity/enroll (contexto de cada llamada)")
          r, t = grep(r"identity/enroll", PYS, cap=40)
          for p, i, _l in r:
              if "/tests/" in p or "test_" in os.path.basename(p):
                  continue
              dump(p, max(0, i - 18), min(i + 12, i + 40), os.path.relpath(p, REPO) + " cerca de linea " + str(i))

          sec("14. PAYLOAD ACTUAL DEL SUPERAPP a enroll")
          SP = os.path.join(REPO, "superapp.py")
          if os.path.exists(SP):
              srcs = open(SP, encoding="utf-8", errors="replace").read().splitlines()
              hits = [i for i, l in enumerate(srcs) if "payload_e" in l or "doc_image_b64" in l]
              P("lineas con payload_e/doc_image_b64: " + str([i + 1 for i in hits[:20]]))
              for i in hits[:6]:
                  dump(SP, max(0, i - 4), i + 5, "superapp linea " + str(i + 1))

          sec("15. POLITICA DE UMBRALES (BiometricsPolicy) — la base de la decision")
          r, t = grep(r"class BiometricsPolicy", PYS, cap=10)
          for p, i, _l in r:
              dump(p, max(0, i - 6), i + 60, os.path.relpath(p, REPO))

          sec("16. LADO NAVEGADOR: deteccion de barra/ocr en portal")
          r, t = grep(r"barcode|tesseract|mrz|pdf417|ocr", JS, cap=60)
          show(r, t)

          sec("17. FIN — SOLO LECTURA, NADA MODIFICADO")
          print("\n".join(OUT))
          PYEOF
          python3 /tmp/s20_audit.py > reporte_s20.txt 2>&1 || echo "ERROR (ver arriba)" >> reporte_s20.txt
          {
            echo "## S20 — auditoria desglose de datos y puertas (solo lectura)"
            echo ""
            echo '````'
            cat reporte_s20.txt
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          wc -c reporte_s20.txt

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-s20
          path: reporte_s20.txt
