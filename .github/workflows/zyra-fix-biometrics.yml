name: ZYRA AXIS Block 8 - Security Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write security_service.py
        run: |
          cat > apps/axis/life_history/security_service.py <<'ZS1'
          """AXIS Security x Life History - additive module.

          Phase 4.1: police incidents with extended
          lifecycle, agency dispatch and custody chain,
          linked to life history (existence only - never
          sensitive detail).

          Incident lifecycle:
          reportado -> en_investigacion -> en_atencion ->
          resuelto -> archivado

          Custody chain reuses the AxisStore pattern:
          each custody action hashes the previous one, so
          the evidence trail is tamper-evident.
          """
          from __future__ import annotations

          import hashlib

          from apps.axis.life_history.service import (
              LifeHistoryService,
          )

          INCIDENT_STAGES = (
              "reportado",
              "en_investigacion",
              "en_atencion",
              "resuelto",
              "archivado",
          )

          SECURITY_AGENCIES = (
              "policia",
              "bomberos",
              "ambulancia",
              "fiscalia",
          )


          class SecurityLifeService:
              """Incidents chained to life history."""

              def __init__(
                  self,
                  *,
                  store,
                  life: LifeHistoryService | None,
              ) -> None:
                  self._store = store
                  self._life = life

              def _person_for_account(
                  self, account_id: str,
              ) -> str | None:
                  if self._life is None:
                      return None
                  try:
                      account = self._store.get_account(
                          account_id
                      )
                  except LookupError:
                      return None
                  zid = account.get("zid")
                  if not zid:
                      return None
                  row = self._life._store._db.query_one(
                      "SELECT person_id FROM life_persons"
                      " WHERE zid = ?",
                      (str(zid),),
                  )
                  if row is None:
                      return None
                  return str(row["person_id"])

              def report_incident(
                  self,
                  *,
                  incident_id: str,
                  police_account: str,
                  description: str,
                  sealed_doc: str | None = None,
                  subject_account: str | None = None,
              ) -> dict[str, object]:
                  """Registers the incident via AxisStore
                  (sealed evidence) and chains EXISTENCE
                  into the subject's life history when the
                  subject is a registry person."""
                  store_incident = (
                      self._store.add_incident(
                          incident_id=incident_id,
                          police_account=(
                              police_account
                          ),
                          description=description,
                          sealed_doc=sealed_doc,
                      )
                  )
                  person_id = None
                  if subject_account:
                      person_id = (
                          self._person_for_account(
                              subject_account
                          )
                      )
                  chained = False
                  if person_id is not None:
                      try:
                          self._life._store.add_life_event(
                              person_id,
                              actor=police_account,
                              event_type=(
                                  "security_incident"
                              ),
                              detail=(
                                  f"{incident_id}"
                                  " [reportado]"
                              ),
                          )
                          chained = True
                      except Exception:
                          chained = False
                  return {
                      **store_incident,
                      "stage": "reportado",
                      "subject_person_id": person_id,
                      "life_chained": chained,
                  }

              def advance_incident(
                  self,
                  *,
                  incident_id: str,
                  police_account: str,
                  to_stage: str,
                  note: str,
              ) -> dict[str, object]:
                  """Updates the incident description with
                  the new stage (append-style, the store
                  keeps history) and chains the STATUS."""
                  if to_stage not in INCIDENT_STAGES:
                      raise ValueError(
                          f"to_stage must be one of"
                          f" {INCIDENT_STAGES}"
                      )
                  updated = self._store.update_incident(
                      incident_id=incident_id,
                      description=(
                          f"[{to_stage}] {note}"
                      ),
                      sealed_doc=None,
                  )
                  person_id = (
                      self._incident_person(
                          incident_id
                      )
                  )
                  chained = False
                  if person_id is not None:
                      try:
                          self._life._store.add_life_event(
                              person_id,
                              actor=police_account,
                              event_type=(
                                  "security_status"
                              ),
                              detail=(
                                  f"{incident_id} ->"
                                  f" {to_stage}"
                              ),
                          )
                          chained = True
                      except Exception:
                          chained = False
                  return {
                      **updated,
                      "stage": to_stage,
                      "life_chained": chained,
                      "person_id": person_id,
                  }

              def add_custody(
                  self,
                  *,
                  incident_id: str,
                  actor_zid: str,
                  action: str,
                  document_id: str | None = None,
              ) -> dict[str, object]:
                  """Adds a custody chain entry for the
                  incident evidence (tamper-evident)."""
                  custody = (
                      self._store.add_evidence_custody(
                          evidence_id=incident_id,
                          actor_zid=actor_zid,
                          action=action,
                          document_id=document_id,
                      )
                  )
                  return {
                      **custody,
                      "chain_valid": (
                          self._store.verify_evidence_chain(
                              incident_id
                          )
                      ),
                  }

              def incident_status(
                  self, incident_id: str,
              ) -> dict[str, object]:
                  """Full incident view: stage, custody
                  chain verification, life link."""
                  description = (
                      self._incident_description(
                          incident_id
                      )
                  )
                  stage = "reportado"
                  if description and (
                      description.startswith("[")
                  ):
                      stage = description.split(
                          "]"
                      )[0][1:]
                  person_id = (
                      self._incident_person(
                          incident_id
                      )
                  )
                  return {
                      "incident_id": incident_id,
                      "stage": stage,
                      "description": description,
                      "person_id": person_id,
                      "custody_verified": (
                          self._store
                          .verify_evidence_chain(
                              incident_id
                          )
                      ),
                  }

              # ---------------------------------- internals

              def _incident_description(
                  self, incident_id: str,
              ) -> str | None:
                  try:
                      for i in (
                          self._store.list_incidents()
                      ):
                          if str(
                              i["incident_id"]
                          ) == incident_id:
                              return str(
                                  i["description"]
                              )
                  except Exception:
                      return None
                  return None

              def _incident_person(
                  self, incident_id: str,
              ) -> str | None:
                  row = self._store._db.query_one(
                      "SELECT person_id FROM"
                      " life_events WHERE event_type"
                      " = 'security_incident' AND"
                      " detail LIKE ? ORDER BY"
                      " occurred_at DESC LIMIT 1",
                      (f"{incident_id}%",),
                  )
                  if row is None:
                      return None
                  return str(row["person_id"])

              def _hash(
                  self, text: str,
              ) -> str:
                  return hashlib.sha256(
                      text.encode("utf-8")
                  ).hexdigest()
          ZS1
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/security_service.py').read()); print('security_service OK')"

      - name: Extend AxisStore with update_incident (additive migration + method)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/axis/infrastructure/persistence/"
              "axis_store.py"
          )
          src = path.read_text(encoding="utf-8")

          MARKER = "def update_incident"
          if MARKER in src:
              print("STORE: already extended")
          else:
              anchor = (
                  "    def incidents_of(\n"
              )
              assert anchor in src, "incidents_of not found"
              method = (
                  "    def update_incident(\n"
                  "        self,\n"
                  "        *,\n"
                  "        incident_id: str,\n"
                  "        description: str,\n"
                  "        sealed_doc: str | None,\n"
                  "    ) -> dict[str, object]:\n"
                  "        now = self._clock.now()\n"
                  "        with self._db.transaction() as cursor:\n"
                  "            cursor.execute(\n"
                  "                \"UPDATE axis_incidents SET\"\n"
                  "                \" description = ?,\"\n"
                  "                \" sealed_doc = ?\"\n"
                  "                \" WHERE incident_id = ?\",\n"
                  "                (\n"
                  "                    description,\n"
                  "                    sealed_doc,\n"
                  "                    incident_id,\n"
                  "                ),\n"
                  "            )\n"
                  "            if cursor.rowcount != 1:\n"
                  "                raise LookupError(\n"
                  "                    f\"unknown incident:\"\n"
                  "                    f\" {incident_id}\"\n"
                  "                )\n"
                  "        return {\n"
                  "            \"incident_id\": incident_id,\n"
                  "            \"description\": description,\n"
                  "            \"sealed_doc\": sealed_doc,\n"
                  "            \"updated_at\": now,\n"
                  "        }\n"
                  "\n"
              )
              src = src.replace(
                  anchor, method + anchor, 1
              )
              path.write_text(src, encoding="utf-8")
              print("STORE: EXTENDED")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("STORE SYNTAX OK")
          PYEOF

      - name: Write security E2E tests
        run: |
          cat > apps/axis/life_history/tests/test_security_service.py <<'ZS2'
          """Security x Life History E2E tests."""
          from __future__ import annotations

          import unittest

          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore,
          )
          from apps.axis.life_history.security_service import (
              SecurityLifeService,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )

          _SUBJECT_ZID = "ZID-subject-0001"
          _MOTHER_ZID = "ZID-mother-s"


          class _FakeNetwork:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid in (
                      _SUBJECT_ZID,
                      _MOTHER_ZID,
                  ):
                      return (
                          True,
                          {"status": "ACTIVE"},
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-s1"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return (False, None, "unknown")


          class SecurityLifeE2E(unittest.TestCase):
              def _boot(self):
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )
                  from shared_engines.storage.database import (
                      SQLiteAdapter,
                  )

                  db = SQLiteAdapter(":memory:")
                  clock = SystemClock()
                  life_store = LifeHistoryStore(db, clock)
                  life = LifeHistoryService(
                      store=life_store,
                      client=_FakeNetwork(),
                  )
                  birth = (
                      life.register_birth_with_network(
                          registrar_account=(
                              "AX-reg-1"
                          ),
                          child_name="Sujeto Nacido",
                          birth_date="1990-06-01",
                          birth_place="Soyapango",
                          sex="M",
                          mother_name="Madre S",
                          mother_zid=_MOTHER_ZID,
                      )
                  )
                  person_id = str(birth["person_id"])
                  life.attach_zid_with_audit(
                      person_id,
                      zid=_SUBJECT_ZID,
                      actor="biometric-enroll",
                  )
                  store = AxisStore(db, clock)
                  store.add_account(
                      account_id="AX-pol-s",
                      zid=None,
                      name="Agente S",
                      role="policia",
                  )
                  store.add_account(
                      account_id="AX-subj-s",
                      zid=_SUBJECT_ZID,
                      name="Sujeto Nacido",
                      role="paciente",
                  )
                  security = SecurityLifeService(
                      store=store, life=life
                  )
                  return (
                      store,
                      life,
                      security,
                      person_id,
                  )

              def test_incident_lifecycle_chained(
                  self,
              ) -> None:
                  store, life, security, person_id = (
                      self._boot()
                  )
                  reported = security.report_incident(
                      incident_id="INC-s1",
                      police_account="AX-pol-s",
                      description="robo reportado",
                      subject_account="AX-subj-s",
                  )
                  self.assertTrue(
                      reported["life_chained"]
                  )
                  advanced = security.advance_incident(
                      incident_id="INC-s1",
                      police_account="AX-pol-s",
                      to_stage="resuelto",
                      note="recuperado",
                  )
                  self.assertTrue(
                      advanced["life_chained"]
                  )
                  status = security.incident_status(
                      "INC-s1"
                  )
                  self.assertEqual(
                      "resuelto",
                      status["stage"],
                  )
                  events = life._store.events_of(
                      person_id
                  )
                  security_events = [
                      e["event_type"]
                      for e in events
                      if e["event_type"].startswith(
                          "security"
                      )
                  ]
                  self.assertEqual(
                      [
                          "security_incident",
                          "security_status",
                      ],
                      security_events,
                  )
                  self.assertTrue(
                      life._store.events_verify(
                          person_id
                      )
                  )

              def test_custody_chain(self) -> None:
                  store, life, security, _pid = (
                      self._boot()
                  )
                  security.report_incident(
                      incident_id="INC-s2",
                      police_account="AX-pol-s",
                      description="evidencia incautada",
                  )
                  c1 = security.add_custody(
                      incident_id="INC-s2",
                      actor_zid="ZID-pol-1",
                      action="recolectada",
                  )
                  self.assertTrue(
                      c1["chain_valid"]
                  )
                  c2 = security.add_custody(
                      incident_id="INC-s2",
                      actor_zid="ZID-pol-1",
                      action="trasladada a fiscalia",
                      document_id="DOC-s1",
                  )
                  self.assertTrue(
                      c2["chain_valid"]
                  )
                  status = security.incident_status(
                      "INC-s2"
                  )
                  self.assertTrue(
                      status["custody_verified"]
                  )

              def test_invalid_stage_rejected(
                  self,
              ) -> None:
                  store, life, security, _pid = (
                      self._boot()
                  )
                  security.report_incident(
                      incident_id="INC-s3",
                      police_account="AX-pol-s",
                      description="x",
                  )
                  with self.assertRaises(ValueError):
                      security.advance_incident(
                          incident_id="INC-s3",
                          police_account="AX-pol-s",
                          to_stage="desaparecido",
                          note="x",
                      )

              def test_unlinked_subject_degrades(
                  self,
              ) -> None:
                  store, life, security, _pid = (
                      self._boot()
                  )
                  reported = security.report_incident(
                      incident_id="INC-s4",
                      police_account="AX-pol-s",
                      description="sin sujeto",
                  )
                  self.assertFalse(
                      reported["life_chained"]
                  )
                  self.assertIsNone(
                      reported[
                          "subject_person_id"
                      ]
                  )


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          ZS2
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_security_service.py').read()); print('test_security OK')"

      - name: 1/3 Security service tests (4 E2E)
        run: python -m apps.axis.life_history.tests.test_security_service -v

      - name: 2/3 Life History regression (7+5+3+3+3+4)
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q
          python -m apps.axis.life_history.tests.test_justice_service -q

      - name: 3/3 Full regression (biometrics 13 + AXIS 7 + TCP 6)
        run: |
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit Security service (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "security: SecurityLifeService - extended incident lifecycle + custody chain + life-history link (4 E2E tests)"
            git push
          fi
