name: "ZYRA - AUDITORIA EXHAUSTIVA del estado real (solo lectura, todo en Summary)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Auditoria exhaustiva de estado real
        run: |
          python - <<'PYEOF'
          import ast, importlib, os, subprocess, sys, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append


          def finalizar():
              md = "\n".join(L)
              Path("auditoria_ex.md").write_text(md, encoding="utf-8")
              if summary:
                  salida = md
                  if len(salida) > 900000:
                      salida = salida[:900000] + "\n\n**(recorte - completo en artefacto)**"
                  with open(summary, "a") as fh:
                      fh.write(salida + "\n")
              sys.exit(0)


          A("# 🔍 AUDITORIA EXHAUSTIVA — estado real del repo\n")
          A("## 1. Existencia y contenido clave de archivos EX\n")
          verificadores = {
              "apps/laboratorio/infrastructure/providers/simulation_engine.py": "GemeloVivo",
              "apps/laboratorio/infrastructure/providers/presentation_remote.py": "class PresentacionRemota",
              "apps/laboratorio/infrastructure/providers/monte_carlo_engine.py": "class MotorMonteCarlo",
              "apps/laboratorio/infrastructure/providers/citizens_engine.py": "class MotorCiudadanos",
              "apps/laboratorio/infrastructure/providers/physics_engine.py": "class MotorFisico",
              "apps/laboratorio/infrastructure/providers/display_holo3d.py": "class MotorHolo3D",
              "apps/laboratorio/infrastructure/providers/renderer_photoreal.py": "class MotorRenderFotoreal",
              "apps/laboratorio/routers/api/decisions.py": "gemelo_vivo",
              "apps/laboratorio/routers/api/presentations.py": "presentacion_remota",
              "apps/laboratorio/registry/services/service_registry.py": "gemelo_vivo",
              "apps/laboratorio/infrastructure/api/app.py": "isinstance(resultado, dict)",
              "superapp.py": "_start_laboratorio",
          }
          for ruta, marca in verificadores.items():
              p = Path(ruta)
              if not p.is_file():
                  A("- ❌ NO EXISTE: " + ruta)
                  continue
              t = p.read_text(encoding="utf-8", errors="replace")
              tiene = "✅" if marca in t else "❌ FALTA '" + marca + "'"
              A("- " + tiene + " | " + ruta + " (" + str(len(t.splitlines())) + " lineas)")
          A("")

          A("## 2. Cableado en service_registry (que servicios estan registrados)\n")
          sr = Path("apps/laboratorio/registry/services/service_registry.py")
          if sr.is_file():
              t = sr.read_text(encoding="utf-8", errors="replace")
              for servicio in (
                  "gemelo_vivo", "presentacion_remota", "motor_monte_carlo",
                  "motor_ciudadanos", "motor_fisico", "salidas_universales",
                  "cache_global", "colector_eventos", "motor_ciudadanos",
              ):
                  A("- " + servicio + ": " + ("✅" if '"' + servicio + '"' in t else "❌ NO"))
          else:
              A("service_registry NO EXISTE")
          A("")

          A("## 3. Carpeta tests: archivos presentes\n")
          carpeta = Path("apps/laboratorio/tests")
          if carpeta.is_dir():
              for p in sorted(carpeta.glob("*.py")):
                  A("- " + p.name + " (" + str(len(p.read_text(errors='replace').splitlines())) + " lineas)")
          else:
              A("❌ LA CARPETA tests NO EXISTE EN EL REPO")
          A("")

          A("## 4. Montaje real de la app (traceback completo si falla)\n")
          try:
              mod = importlib.import_module("apps.laboratorio.infrastructure.api.app")
              app = mod.montar_aplicacion(":memory:")
              rutas = app.listar_rutas()
              A("montar_aplicacion OK · rutas: " + str(len(rutas)))
              gem = app.contenedor.obtener("gemelo_vivo")
              A("gemelo_vivo OK")
              remota = app.contenedor.obtener("presentacion_remota")
              A("presentacion_remota OK")
          except Exception:
              A("FALLO EL MONTAJE:")
              A("```")
              A(traceback.format_exc())
              A("```")
          A("")

          A("## 5. Suite completa corriendo AHORA (salida integra)\n")
          r = subprocess.run(
              [sys.executable, "-m", "pytest", "apps/laboratorio/tests", "-v", "--tb=long"],
              capture_output=True, text=True, timeout=600,
          )
          salida = (r.stdout or "") + (r.stderr or "")
          A("codigo de salida: " + str(r.returncode))
          A("```")
          A(salida[-8000:] if len(salida) > 8000 else salida)
          A("```")
          A("")

          A("## 6. Superapp boot real\n")
          try:
              sup = importlib.import_module("superapp")
              errores = sup.boot_apps()
              A("apps arriba: " + str(sorted(sup.APPS.keys())))
              A("errores: " + str(errores if errores else "(ninguno)"))
          except Exception:
              A("FALLO:")
              A("```")
              A(traceback.format_exc()[-1200:])
              A("```")
          A("")

          A("## 7. LO QUE SE NECESITA (diagnostico automatico)\n")
          faltantes_arch = [r for r, m in verificadores.items() if not Path(r).is_file()]
          if faltantes_arch:
              A("- Archivos que faltan (se regeneran autocontenidos): " + ", ".join(faltantes_arch))
          faltantes_marca = [
              r for r, m in verificadores.items()
              if Path(r).is_file() and m not in Path(r).read_text(errors="replace")
          ]
          if faltantes_marca:
              A("- Archivos incompletos (se reescriben completos): " + ", ".join(faltantes_marca))
          sr_t = sr.read_text(errors="replace") if sr.is_file() else ""
          sin_cablear = [s for s in ("gemelo_vivo", "presentacion_remota") if '"' + s + '"' not in sr_t]
          if sin_cablear:
              A("- Servicios sin cablear en service_registry: " + ", ".join(sin_cablear))
          if "1" == "1":
              A("- La suite arriba (seccion 5) define exactamente cuantos tests pasan y los fallos con traceback")
          A("")
          finalizar()
          PYEOF

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-ex
          path: auditoria_ex.md
