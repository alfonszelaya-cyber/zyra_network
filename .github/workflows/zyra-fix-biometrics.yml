name: "ZYRA - fix global ensamblar (un pase, sin condiciones que fallen)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parche:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Reemplazo global .ensamblar( -> .ensamblar_avi(
        run: |
          cat > /tmp/fix.py <<'FIX_EOF'
          from pathlib import Path

          ruta = Path("apps/laboratorio/tests/test_video_impresion.py")
          texto = ruta.read_text(encoding="utf-8")

          antes = texto.count(".ensamblar(")
          if antes > 0:
              texto = texto.replace(".ensamblar(", ".ensamblar_avi(")
              print("reemplazadas " + str(antes) + " llamadas")
          else:
              print("no hay llamadas a .ensamblar( - ya corregido")

          ruta.write_text(texto, encoding="utf-8")
          print("archivo escrito OK")
          FIX_EOF
          python /tmp/fix.py

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - fix global ensamblar"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit si pytest salio 0
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "SUITE EN ROJO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "fix: ensamblar -> ensamblar_avi (global)"
            git push
          fi
