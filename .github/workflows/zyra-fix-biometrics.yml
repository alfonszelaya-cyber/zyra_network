name: "ZYRA NEXO NG3+NG4 Accounting Core I y II (fix Decimal 2d)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] Inspeccion firmas engines existentes"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import os
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          out("## Firmas engines existentes (LECTURA, no se tocan)")
          def firma(modpath, clsname):
              try:
                  import importlib, inspect
                  m = importlib.import_module(modpath)
                  cls = getattr(m, clsname, None)
                  if cls is None:
                      out("- " + clsname + ": no encontrada")
                      return
                  ms = []
                  for n, f in vars(cls).items():
                      if callable(f) and not n.startswith("_"):
                          try:
                              ms.append(n + str(inspect.signature(f)))
                          except Exception:
                              ms.append(n)
                  out("- **" + clsname + "**: " + ", ".join(ms[:18]))
              except Exception as e:
                  out("- " + clsname + ": ERR " + str(e)[:120])
          for mod, cls in [
              ("apps.nexo.domain.accounting.accounting_engine",
               "AccountingEngine"),
              ("apps.nexo.domain.accounting.journal_engine",
               "JournalEngine"),
              ("apps.nexo.domain.finance.finanzas_total",
               "FinanzasTotal"),
              ("apps.nexo.domain.finance.declaration_engine",
               "DeclarationEngine")]:
              firma(mod, cls)
          PYEOF
          exit 0

      - name: "[ESCRITURA] Construir NG3 Accounting Core I"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          AC = "apps/nexo/domain/accounting"
          UCA = "apps/nexo/application/accounting_use_cases"

          forzar(AC + "/chart_of_accounts_engine.py", D(r'''
              """Chart of Accounts Engine - plan contable multi-pais
              configurable (NG3). Cuentas jerarquicas por pais con
              tipo y plantilla base. Persistente. Autocontenido."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              ACCOUNT_TYPES = ("ASSET", "LIABILITY", "EQUITY",
                               "INCOME", "EXPENSE")

              _MIGRATIONS = (
                  Migration(1, "nexo_chart_accounts", (
                      "CREATE TABLE IF NOT EXISTS nexo_chart_accounts (account_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, country TEXT NOT NULL DEFAULT 'SV', account_code TEXT NOT NULL, account_name TEXT NOT NULL, account_type TEXT NOT NULL, parent_code TEXT NOT NULL DEFAULT '', is_postable INTEGER NOT NULL DEFAULT 1, created_at REAL NOT NULL, UNIQUE(company_id, account_code))",
                  )),
              )

              class ChartOfAccountsEngine:
                  """Plan contable por empresa y pais."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.chart",
                                      _MIGRATIONS).run(clock)

                  def add_account(self, *, company_id, account_code,
                                  account_name, account_type,
                                  country="SV", parent_code="",
                                  is_postable=True) -> dict:
                      if account_type not in ACCOUNT_TYPES:
                          raise ValueError(
                              "tipo invalido: " + str(account_type))
                      aid = "COA-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_chart_accounts"
                              " (account_id, company_id, country,"
                              " account_code, account_name,"
                              " account_type, parent_code,"
                              " is_postable, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)",
                              (aid, company_id, country,
                               account_code, account_name,
                               account_type, parent_code,
                               1 if is_postable else 0, now))
                      return {"account_id": aid,
                              "company_id": company_id,
                              "account_code": account_code,
                              "account_name": account_name,
                              "account_type": account_type,
                              "country": country,
                              "parent_code": parent_code,
                              "is_postable": is_postable}

                  def install_template(self, *, company_id,
                                       country="SV") -> dict:
                      creadas = 0
                      base = [
                          ("1000", "Efectivo y equivalentes",
                           "ASSET", ""),
                          ("1100", "Cuentas por cobrar",
                           "ASSET", ""),
                          ("1500", "Activos fijos", "ASSET", ""),
                          ("2000", "Cuentas por pagar",
                           "LIABILITY", ""),
                          ("2100", "Impuestos por pagar",
                           "LIABILITY", ""),
                          ("3000", "Capital social", "EQUITY", ""),
                          ("3100", "Utilidades retenidas",
                           "EQUITY", ""),
                          ("4000", "Ingresos por ventas",
                           "INCOME", ""),
                          ("5000", "Costo de ventas",
                           "EXPENSE", ""),
                          ("6000", "Gastos operativos",
                           "EXPENSE", ""),
                          ("6100", "Gastos de personal",
                           "EXPENSE", "6000"),
                          ("6200", "Costos logisticos",
                           "EXPENSE", "6000"),
                      ]
                      for code, name, atype, parent in base:
                          self.add_account(
                              company_id=company_id,
                              account_code=code,
                              account_name=name,
                              account_type=atype,
                              country=country,
                              parent_code=parent)
                          creadas = creadas + 1
                      return {"company_id": company_id,
                              "country": country,
                              "accounts_created": creadas}

                  def get_account(self, company_id,
                                  account_code) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM nexo_chart_accounts"
                          " WHERE company_id = ? AND account_code"
                          " = ?", (company_id, account_code))
                      return self._row(row) if row else None

                  def _row(self, r) -> dict:
                      return {"account_id": str(r["account_id"]),
                              "company_id": str(r["company_id"]),
                              "country": str(r["country"]),
                              "account_code": str(r["account_code"]),
                              "account_name": str(r["account_name"]),
                              "account_type": str(r["account_type"]),
                              "parent_code": str(r["parent_code"]),
                              "is_postable": bool(r["is_postable"])}

                  def accounts_of(self, company_id,
                                  country="") -> List[dict]:
                      if country:
                          rows = self._db.query_all(
                              "SELECT * FROM nexo_chart_accounts"
                              " WHERE company_id = ? AND country = ?"
                              " ORDER BY account_code",
                              (company_id, country))
                      else:
                          rows = self._db.query_all(
                              "SELECT * FROM nexo_chart_accounts"
                              " WHERE company_id = ?"
                              " ORDER BY account_code",
                              (company_id,))
                      return [self._row(r) for r in rows]
          '''))

          forzar(AC + "/general_ledger_engine.py", D(r'''
              """General Ledger Engine - libro mayor (NG3).
              Movimientos por cuenta con debit/credit SIEMPRE
              cuantizados a 2 decimales (regla 61). Acepta un
              period_engine opcional: si un periodo esta cerrado,
              rechaza el movimiento (control de cierre real).
              Asientos balanced exigen cuadre exacto. Persistente."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _Q = "0.01"

              _MIGRATIONS = (
                  Migration(1, "nexo_gl_entries", (
                      "CREATE TABLE IF NOT EXISTS nexo_gl_entries (entry_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, period TEXT NOT NULL, account_code TEXT NOT NULL, debit TEXT NOT NULL DEFAULT '0', credit TEXT NOT NULL DEFAULT '0', cost_center TEXT NOT NULL DEFAULT '', source_ref TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                  )),
              )

              class GeneralLedgerEngine:
                  """Libro mayor persistente (Decimal 2 decimales)."""

                  def __init__(self, db, clock,
                               period_engine=None):
                      self._db = db
                      self._clock = clock
                      self._periods = period_engine
                      MigrationRunner(db, "nexo.gl",
                                      _MIGRATIONS).run(clock)

                  def _check_open(self, company_id, period):
                      if self._periods is not None:
                          gate = getattr(self._periods,
                                         "assert_open", None)
                          if callable(gate):
                              gate(company_id, period)

                  def post_entry(self, *, company_id, period,
                                 account_code, debit="0",
                                 credit="0", cost_center="",
                                 source_ref="") -> dict:
                      from decimal import Decimal as _D
                      self._check_open(company_id, period)
                      d = _D(str(debit)).quantize(_D(_Q))
                      c = _D(str(credit)).quantize(_D(_Q))
                      if d < 0 or c < 0:
                          raise ValueError(
                              "debit/credit no negativos")
                      if d == 0 and c == 0:
                          raise ValueError(
                              "movimiento vacio")
                      eid = "GL-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_gl_entries"
                              " (entry_id, company_id, period,"
                              " account_code, debit, credit,"
                              " cost_center, source_ref,"
                              " created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)",
                              (eid, company_id, period,
                               account_code, str(d), str(c),
                               cost_center, source_ref, now))
                      return {"entry_id": eid,
                              "company_id": company_id,
                              "period": period,
                              "account_code": account_code,
                              "debit": str(d), "credit": str(c),
                              "cost_center": cost_center,
                              "source_ref": source_ref}

                  def post_balanced(self, *, company_id, period,
                                    lines, source_ref="") -> dict:
                      from decimal import Decimal as _D
                      self._check_open(company_id, period)
                      activas = []
                      for l in lines:
                          d = _D(str(l.get("debit", "0")))
                          c = _D(str(l.get("credit", "0")))
                          if d != 0 or c != 0:
                              activas.append(l)
                      td = sum((_D(str(l.get("debit", "0")))
                                for l in activas), _D("0"))
                      tc = sum((_D(str(l.get("credit", "0")))
                                for l in activas), _D("0"))
                      if td != tc:
                          raise ValueError(
                              "asiento descuadrado: D="
                              + str(td) + " C=" + str(tc))
                      out = []
                      for l in activas:
                          out.append(self.post_entry(
                              company_id=company_id,
                              period=period,
                              account_code=l["account_code"],
                              debit=l.get("debit", "0"),
                              credit=l.get("credit", "0"),
                              cost_center=l.get("cost_center",
                                                ""),
                              source_ref=source_ref))
                      return {"posted": len(out),
                              "total_debit": str(td.quantize(
                                  _D(_Q))),
                              "total_credit": str(tc.quantize(
                                  _D(_Q))),
                              "entries": out}

                  def account_balance(self, company_id,
                                      account_code,
                                      period="") -> dict:
                      from decimal import Decimal as _D
                      if period:
                          row = self._db.query_one(
                              "SELECT"
                              " COALESCE(SUM(debit),'0') AS d,"
                              " COALESCE(SUM(credit),'0') AS c"
                              " FROM nexo_gl_entries WHERE"
                              " company_id = ? AND account_code = ?"
                              " AND period = ?",
                              (company_id, account_code, period))
                      else:
                          row = self._db.query_one(
                              "SELECT"
                              " COALESCE(SUM(debit),'0') AS d,"
                              " COALESCE(SUM(credit),'0') AS c"
                              " FROM nexo_gl_entries WHERE"
                              " company_id = ? AND account_code = ?",
                              (company_id, account_code))
                      d = _D(str(row["d"])) if row else _D("0")
                      c = _D(str(row["c"])) if row else _D("0")
                      bal = (d - c).quantize(_D(_Q))
                      return {"account_code": account_code,
                              "debit": str(d.quantize(_D(_Q))),
                              "credit": str(c.quantize(_D(_Q))),
                              "balance": str(bal)}

                  def trial_balance(self, company_id,
                                    period="") -> List[dict]:
                      from decimal import Decimal as _D
                      if period:
                          rows = self._db.query_all(
                              "SELECT account_code,"
                              " COALESCE(SUM(debit),'0') AS d,"
                              " COALESCE(SUM(credit),'0') AS c"
                              " FROM nexo_gl_entries WHERE"
                              " company_id = ? AND period = ?"
                              " GROUP BY account_code"
                              " ORDER BY account_code",
                              (company_id, period))
                      else:
                          rows = self._db.query_all(
                              "SELECT account_code,"
                              " COALESCE(SUM(debit),'0') AS d,"
                              " COALESCE(SUM(credit),'0') AS c"
                              " FROM nexo_gl_entries WHERE"
                              " company_id = ?"
                              " GROUP BY account_code"
                              " ORDER BY account_code",
                              (company_id,))
                      return [{"account_code": str(r["account_code"]),
                               "debit": str(_D(str(r["d"]))
                                         .quantize(_D(_Q))),
                               "credit": str(_D(str(r["c"]))
                                             .quantize(_D(_Q)))}
                              for r in rows]

                  def entries_of(self, company_id,
                                 account_code) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_gl_entries WHERE"
                          " company_id = ? AND account_code = ?"
                          " ORDER BY created_at",
                          (company_id, account_code))
                      return [{"entry_id": str(r["entry_id"]),
                               "period": str(r["period"]),
                               "debit": str(r["debit"]),
                               "credit": str(r["credit"]),
                               "source_ref": str(r["source_ref"])}
                              for r in rows]
          '''))

          forzar(AC + "/financial_statements_engine.py", D(r'''
              """Financial Statements Engine - estados financieros
              (NG3). Balance general, estado de resultados y flujo
              de efectivo desde el mayor. Montos SIEMPRE con 2
              decimales (regla 61). cuadra es bool nativo."""
              from __future__ import annotations
              from typing import Dict, List
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database

              _Q = "0.01"

              class FinancialStatementsEngine:
                  """Estados financieros desde el mayor."""

                  def __init__(self, db, clock,
                               chart=None, ledger=None,
                               treasury=None):
                      self._db = db
                      self._clock = clock
                      self._chart = chart
                      self._ledger = ledger
                      self._treasury = treasury

                  def income_statement(self, company_id,
                                       period) -> Dict:
                      from decimal import Decimal as _D
                      ingresos = _D("0")
                      gastos = _D("0")
                      detalle = {"INCOME": [], "EXPENSE": []}
                      if self._ledger is not None:
                          for row in self._ledger.trial_balance(
                                  company_id, period):
                              acct = (self._chart.get_account(
                                  company_id,
                                  row["account_code"])
                                  if self._chart else None)
                              atype = (acct["account_type"]
                                       if acct else "EXPENSE")
                              if atype == "INCOME":
                                  ingresos = (ingresos
                                              + _D(row["credit"])
                                              - _D(row["debit"]))
                                  detalle["INCOME"].append(row)
                              elif atype == "EXPENSE":
                                  gastos = (gastos
                                            + _D(row["debit"])
                                            - _D(row["credit"]))
                                  detalle["EXPENSE"].append(row)
                      utilidad = ingresos - gastos
                      q = lambda v: str(v.quantize(_D(_Q)))
                      return {"statement": "INCOME_STATEMENT",
                              "company_id": company_id,
                              "period": period,
                              "ingresos": q(ingresos),
                              "gastos": q(gastos),
                              "utilidad": q(utilidad),
                              "detalle": detalle,
                              "generated_at": self._clock.now()}

                  def balance_sheet(self, company_id,
                                    period) -> Dict:
                      from decimal import Decimal as _D
                      activos = _D("0")
                      pasivos = _D("0")
                      patrimonio = _D("0")
                      is_res = self.income_statement(company_id,
                                                     period)
                      utilidad = _D(is_res["utilidad"])
                      if self._ledger is not None:
                          for row in self._ledger.trial_balance(
                                  company_id, period):
                              acct = (self._chart.get_account(
                                  company_id,
                                  row["account_code"])
                                  if self._chart else None)
                              atype = (acct["account_type"]
                                       if acct else "")
                              if atype == "ASSET":
                                  activos = (activos
                                             + _D(row["debit"])
                                             - _D(row["credit"]))
                              elif atype == "LIABILITY":
                                  pasivos = (pasivos
                                             + _D(row["credit"])
                                             - _D(row["debit"]))
                              elif atype == "EQUITY":
                                  patrimonio = (patrimonio
                                                + _D(row["credit"])
                                                - _D(row["debit"]))
                      patrimonio_total = patrimonio + utilidad
                      q = lambda v: str(v.quantize(_D(_Q)))
                      return {"statement": "BALANCE_SHEET",
                              "company_id": company_id,
                              "period": period,
                              "activos": q(activos),
                              "pasivos": q(pasivos),
                              "patrimonio":
                                  q(patrimonio_total),
                              "utilidad_periodo": q(utilidad),
                              "cuadra": (activos
                                         == pasivos
                                         + patrimonio_total),
                              "generated_at": self._clock.now()}

                  def cash_flow(self, company_id, period) -> Dict:
                      from decimal import Decimal as _D
                      entradas = _D("0")
                      salidas = _D("0")
                      if self._treasury is not None:
                          tx = self._treasury.transactions_of(
                              company_id, period)
                          for t in tx:
                              v = _D(t["amount"])
                              if t["tx_type"] == "DEPOSIT":
                                  entradas = entradas + v
                              elif (t["tx_type"]
                                    == "WITHDRAWAL"):
                                  salidas = salidas + v
                      q = lambda v: str(v.quantize(_D(_Q)))
                      return {"statement": "CASH_FLOW",
                              "company_id": company_id,
                              "period": period,
                              "entradas": q(entradas),
                              "salidas": q(salidas),
                              "neto": q(entradas - salidas),
                              "generated_at": self._clock.now()}
          '''))

          forzar(AC + "/period_closing_engine.py", D(r'''
              """Period Closing Engine - cierres contables (NG3).
              Periodos OPEN/CLOSED: cierre con bloqueo, reapertura
              auditada, y asiento de cierre de resultado SIN lineas
              vacias (solo cuentas con movimiento)."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_periods", (
                      "CREATE TABLE IF NOT EXISTS nexo_periods (company_id TEXT NOT NULL, period TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'OPEN', closed_by TEXT, closed_at REAL, reopened_by TEXT, reopened_at REAL, PRIMARY KEY(company_id, period))",
                  )),
                  Migration(2, "nexo_period_close_events", (
                      "CREATE TABLE IF NOT EXISTS nexo_period_close_events (event_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, period TEXT NOT NULL, event_type TEXT NOT NULL, actor TEXT NOT NULL DEFAULT '', detail TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                  )),
              )

              class PeriodClosingEngine:
                  """Cierre y reapertura auditada de periodos."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.periods",
                                      _MIGRATIONS).run(clock)

                  def _log(self, cursor, company_id, period,
                           event_type, actor, detail=""):
                      cursor.execute(
                          "INSERT INTO nexo_period_close_events"
                          " (event_id, company_id, period,"
                          " event_type, actor, detail, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?)",
                          ("PCE-" + str(uuid.uuid4()), company_id,
                           period, event_type, actor, detail,
                           self._clock.now()))

                  def ensure_open(self, company_id, period) -> dict:
                      row = self._db.query_one(
                          "SELECT * FROM nexo_periods WHERE"
                          " company_id = ? AND period = ?",
                          (company_id, period))
                      if row is None:
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO nexo_periods"
                                  " (company_id, period, status)"
                                  " VALUES (?, ?, 'OPEN')",
                                  (company_id, period))
                              self._log(cursor, company_id, period,
                                        "CREATED", "system",
                                        "periodo creado abierto")
                      return self.get_period(company_id, period)

                  def get_period(self, company_id,
                                 period) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM nexo_periods WHERE"
                          " company_id = ? AND period = ?",
                          (company_id, period))
                      if not row:
                          return None
                      return {"company_id": str(row["company_id"]),
                              "period": str(row["period"]),
                              "status": str(row["status"]),
                              "closed_by": (str(row["closed_by"])
                                            if row["closed_by"]
                                            else None),
                              "reopened_by":
                                  (str(row["reopened_by"])
                                   if row["reopened_by"]
                                   else None)}

                  def assert_open(self, company_id, period) -> None:
                      p = self.get_period(company_id, period)
                      if p is not None and p["status"] != "OPEN":
                          raise ValueError(
                              "periodo cerrado: " + period)

                  def close_period(self, *, company_id, period,
                                   actor) -> dict:
                      p = self.get_period(company_id, period)
                      if p is None:
                          self.ensure_open(company_id, period)
                          p = self.get_period(company_id, period)
                      if p["status"] == "CLOSED":
                          raise ValueError(
                              "ya cerrado: " + period)
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "UPDATE nexo_periods SET"
                              " status = 'CLOSED', closed_by = ?,"
                              " closed_at = ? WHERE company_id = ?"
                              " AND period = ?",
                              (actor, now, company_id, period))
