name: "ZYRA AUDIT NEXO (Plan A sobre lo existente)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: P1 - arranque de NEXO (server/main)
        run: |
          {
          echo "## P1: archivos de arranque y raiz de la app"
          echo '```'
          ls apps/nexo/ | head -20 || true
          echo ""
          find apps/nexo -maxdepth 1 -name "*.py" | sort || true
          echo ""
          echo "--- server.py o main.py (primera zona)"
          for F in apps/nexo/server.py apps/nexo/main.py apps/nexo/app.py; do
            if [ -f "$F" ]; then
              echo "### $F (lineas 1-120)"
              awk '{printf "%5d| %s\n", NR, $0}' "$F" | head -120 || true
              break
            fi
          done
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P2 - que modulos tienen logica real
        run: |
          {
          echo "## P2: peso y contenido por modulo"
          echo '```'
          for D in apps/nexo/application/*/; do
            n=$(find "$D" -name "*.py" ! -name "__init__.py" | wc -l)
            [ "$n" -gt 0 ] && echo "$n archivos - $D"
          done || true
          echo ""
          echo "--- infrastructure/"
          find apps/nexo/infrastructure -name "*.py" ! -name "__init__.py" 2>/dev/null | head -10 || true
          echo ""
          echo "--- domain/"
          find apps/nexo/domain -name "*.py" ! -name "__init__.py" 2>/dev/null | head -10 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P3 - conexion con la Red (patron de wiring)
        run: |
          {
          echo "## P3: como toca NEXO a la Red/motores"
          echo '```'
          grep -rniE "zyra|shared_engines|PaymentsEngine|CurrencyEngine|http://127|localhost:8080" apps/nexo --include='*.py' | grep -v test | head -20 || true
          echo ""
          echo "--- zyra_link.py o similar en NEXO"
          find apps/nexo -name "*zyra*" -o -name "*link*" | head -5 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P4 - menus y paginas existentes
        run: |
          {
          echo "## P4: rutas/menus del server"
          echo '```'
          grep -rn "def .*page\|path ==\|startswith(\"/\|startswith('/" apps/nexo/server.py 2>/dev/null | head -40 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P5 - persistencia de NEXO (stores)
        run: |
          {
          echo "## P5: stores y tablas de NEXO"
          echo '```'
          find apps/nexo -name "*store*.py" -o -name "*repository*.py" | head -10 || true
          echo ""
          grep -rn "CREATE TABLE" apps/nexo --include='*.py' | head -20 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P6 - los 7 tests (linea base verde)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          {
          echo "## P6: tests actuales de NEXO"
          echo '```'
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short 2>&1 | tail -8 || true
          echo '```'
          echo "## nombres de tests"
          echo '```'
          grep -rn "def test_" apps/nexo/tests --include='*.py' | head -12 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
