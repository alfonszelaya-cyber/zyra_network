name: "ZYRA FASE1-a retry: N-1 (import os fix) + AX-1 + birth-zid solo menores + AGRO"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] N-1: create_balanced_entry canonico + journal cuadre"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/nexo/domain/accounting/accounting_engine.py",
                     D(r'''
                  """Motor central contable NEXO (Decimal exacto,
                  persistente, auditado por la Red).

                  REGLA CONTABLE UNICA (N-1, regla 61): TODO asiento
                  oficial DEBE estar cuadrado (sum DEBIT == sum
                  CREDIT).
                  - create_balanced_entry(): metodo CANONICO para
                    asientos oficiales (valida cuadre antes de
                    escribir, un group_id liga las piernas).
                  - post_balanced() en GeneralLedgerEngine: misma
                    regla en el libro mayor.
                  - create_entry(): PRIMITIVA de pierna individual
                    (un movimiento en una cuenta) — NO constituye
                    por si sola un asiento oficial."""
                  from __future__ import annotations

                  from decimal import Decimal
                  from typing import Dict, List, Optional
                  import uuid

                  from shared_engines.audit.chain import AuditTrail
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import Database
                  from shared_engines.storage.migrations import (
                      Migration,
                      MigrationRunner,
                  )

                  _MIGRATIONS = (
                      Migration(1, "accounting_entries", (
                          "CREATE TABLE IF NOT EXISTS accounting_entries ("
                          " entry_id TEXT PRIMARY KEY,"
                          " account_code TEXT NOT NULL,"
                          " amount TEXT NOT NULL,"
                          " entry_type TEXT NOT NULL,"
                          " description TEXT NOT NULL DEFAULT '',"
                          " reference_id TEXT,"
                          " metadata_json TEXT NOT NULL DEFAULT '{}',"
                          " status TEXT NOT NULL DEFAULT 'POSTED',"
                          " created_at REAL NOT NULL)",
                      )),
                  )


                  class AccountingEngine:
                      """Motor central contable (Decimal exacto,
                      persistente, auditado por la Red)."""

                      def __init__(self, db: Database, clock: Clock,
                                   *, audit: AuditTrail) -> None:
                          self._db = db
                          self._clock = clock
                          self._audit = audit
                          MigrationRunner(db, "nexo.accounting",
                                          _MIGRATIONS).run(clock)

                      def validate_entry(self, account_code: str,
                                         amount, entry_type: str) -> bool:
                          if not account_code:
                              return False
                          try:
                              Decimal(str(amount))
                          except Exception:
                              return False
                          if Decimal(str(amount)) <= 0:
                              return False
                          return entry_type in ("DEBIT", "CREDIT")

                      def create_entry(self, *, account_code: str, amount,
                                       entry_type: str, description: str,
                                       reference_id: Optional[str] = None,
                                       metadata: Optional[dict] = None) -> dict:
                          if not self.validate_entry(account_code, amount, entry_type):
                              raise ValueError("Invalid accounting entry")
                          amt = Decimal(str(amount))
                          entry_id = f"ACC-{uuid.uuid4()}"
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO accounting_entries"
                                  " (entry_id, account_code, amount, entry_type,"
                                  " description, reference_id, metadata_json,"
                                  " status, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, ?, 'POSTED', ?)",
                                  (entry_id, account_code, str(amt),
                                   entry_type, description, reference_id,
                                   str(metadata or {}), now))
                          self._audit.append(
                              event_type="nexo.accounting.entry_created",
                              actor="nexo", subject=entry_id,
                              payload={"account": account_code,
                                       "amount": str(amt),
                                       "type": entry_type})
                          return {"entry_id": entry_id,
                                  "account_code": account_code,
                                  "amount": str(amt),
                                  "entry_type": entry_type,
                                  "description": description,
                                  "reference_id": reference_id,
                                  "metadata": metadata or {},
                                  "status": "POSTED",
                                  "created_at": now}

                      def create_balanced_entry(self, *, lines,
                                                description: str,
                                                reference_id: Optional[str] = None,
                                                metadata: Optional[dict] = None) -> dict:
                          """METODO CANONICO (N-1): asiento oficial
                          cuadrado. Rechaza descuadre. Un group_id
                          liga todas las piernas del asiento."""
                          from decimal import Decimal as _D
                          if not lines or not isinstance(lines, list):
                              raise ValueError("lines requerido")
                          norm = []
                          for ln in lines:
                              code = str(ln.get("account_code",
                                                "")).strip()
                              try:
                                  amt = _D(str(ln.get("amount", "0")))
                              except Exception:
                                  raise ValueError("amount invalido")
                              et = str(ln.get("entry_type",
                                              "")).upper()
                              if not code or amt <= 0:
                                  raise ValueError("linea invalida")
                              if et not in ("DEBIT", "CREDIT"):
                                  raise ValueError(
                                      "entry_type invalido")
                              norm.append({"account_code": code,
                                           "amount": amt,
                                           "entry_type": et})
                          total_d = sum((l["amount"] for l in norm
                                         if l["entry_type"] == "DEBIT"),
                                        _D("0"))
                          total_c = sum((l["amount"] for l in norm
                                         if l["entry_type"] == "CREDIT"),
                                        _D("0"))
                          if total_d != total_c:
                              raise ValueError(
                                  "asiento descuadrado: DEBIT="
                                  + str(total_d) + " CREDIT="
                                  + str(total_c))
                          group_id = "GRP-" + str(uuid.uuid4())
                          meta = dict(metadata or {})
                          meta["group_id"] = group_id
                          out = []
                          for l in norm:
                              out.append(self.create_entry(
                                  account_code=l["account_code"],
                                  amount=l["amount"],
                                  entry_type=l["entry_type"],
                                  description=description,
                                  reference_id=reference_id,
                                  metadata=meta))
                          return {"group_id": group_id,
                                  "total": str(total_d.quantize(
                                      _D("0.01"))),
                                  "lines": len(out),
                                  "entries": out}

                      def get_entry(self, entry_id: str) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM accounting_entries"
                              " WHERE entry_id = ?", (entry_id,))
                          return self._row_to_dict(row) if row else None

                      def get_entries(self) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT * FROM accounting_entries"
                              " ORDER BY created_at")
                          return [self._row_to_dict(r) for r in rows]

                      def get_entries_by_account(self, account_code: str) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT * FROM accounting_entries"
                              " WHERE account_code = ? ORDER BY created_at",
                              (account_code,))
                          return [self._row_to_dict(r) for r in rows]

                      def _row_to_dict(self, row) -> dict:
                          return {"entry_id": str(row["entry_id"]),
                                  "account_code": str(row["account_code"]),
                                  "amount": str(row["amount"]),
                                  "entry_type": str(row["entry_type"]),
                                  "description": str(row["description"]),
                                  "reference_id": (str(row["reference_id"])
                                                   if row["reference_id"] else None),
                                  "status": str(row["status"]),
                                  "created_at": float(row["created_at"])}

                      def calculate_account_balance(self, account_code: str) -> Decimal:
                          total = Decimal("0")
                          for e in self.get_entries_by_account(account_code):
                              amt = Decimal(e["amount"])
                              if e["entry_type"] == "DEBIT":
                                  total += amt
                              else:
                                  total -= amt
                          return total

                      def generate_summary(self) -> Dict:
                          debits = Decimal("0")
                          credits = Decimal("0")
                          for e in self.get_entries():
                              amt = Decimal(e["amount"])
                              if e["entry_type"] == "DEBIT":
                                  debits += amt
                              else:
                                  credits += amt
                          return {"entries": len(self.get_entries()),
                                  "debits": str(debits),
                                  "credits": str(credits),
                                  "generated_at": self._clock.now()}
              '''))

              forzar("apps/nexo/domain/accounting/journal_engine.py",
                     D(r'''
                  """Libro Diario contable persistente.

                  N-1: si el asiento trae 'lines', se valida el
                  cuadre (sum DEBIT == sum CREDIT) antes de
                  registrarse. La pierna individual se acepta como
                  registro, pero el asiento OFICIAL va cuadrado."""
                  from __future__ import annotations

                  from typing import Dict, List, Optional
                  import uuid

                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import Database
                  from shared_engines.storage.migrations import (
                      Migration,
                      MigrationRunner,
                  )

                  _MIGRATIONS = (
                      Migration(1, "journal_entries", (
                          "CREATE TABLE IF NOT EXISTS journal_entries ("
                          " journal_id TEXT PRIMARY KEY,"
                          " entry_json TEXT NOT NULL,"
                          " registered_at REAL NOT NULL,"
                          " status TEXT NOT NULL DEFAULT 'POSTED')",
                      )),
                  )


                  class JournalEngine:
                      """Libro Diario contable persistente."""

                      def __init__(self, db: Database, clock: Clock,
                                   *, outbox=None) -> None:
                          self._db = db
                          self._clock = clock
                          self._outbox = outbox
                          MigrationRunner(db, "nexo.journal", _MIGRATIONS).run(clock)

                      def register_entry(self, accounting_entry: dict) -> dict:
                          import json as _json
                          from decimal import Decimal as _D
                          lines = accounting_entry.get("lines")
                          if lines:
                              td = sum((_D(str(l.get("amount", "0")))
                                        for l in lines
                                        if str(l.get("entry_type", ""))
                                        .upper() == "DEBIT"), _D("0"))
                              tc = sum((_D(str(l.get("amount", "0")))
                                        for l in lines
                                        if str(l.get("entry_type", ""))
                                        .upper() == "CREDIT"), _D("0"))
                              if td != tc:
                                  raise ValueError(
                                      "asiento descuadrado en journal:"
                                      " DEBIT=" + str(td) + " CREDIT="
                                      + str(tc))
                          journal_id = f"JRN-{uuid.uuid4()}"
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO journal_entries"
                                  " (journal_id, entry_json,"
                                  " registered_at, status)"
                                  " VALUES (?, ?, ?, 'POSTED')",
                                  (journal_id,
                                   _json.dumps(accounting_entry, default=str),
                                   now))
                          return {"journal_id": journal_id,
                                  "entry": accounting_entry,
                                  "registered_at": now,
                                  "status": "POSTED"}

                      def get_entries(self) -> List[dict]:
                          import json as _json
                          rows = self._db.query_all(
                              "SELECT * FROM journal_entries"
                              " ORDER BY registered_at")
                          out = []
                          for r in rows:
                              out.append({
                                  "journal_id": str(r["journal_id"]),
                                  "entry": _json.loads(str(r["entry_json"])),
                                  "registered_at": float(r["registered_at"]),
                                  "status": str(r["status"])})
                          return out

                      def get_entry(self, journal_id: str) -> Optional[dict]:
                          for item in self.get_entries():
                              if item["journal_id"] == journal_id:
                                  return item
                          return None

                      def get_entries_by_account(self, account_code: str) -> List[dict]:
                          return [i for i in self.get_entries()
                                  if (i.get("entry", {}).get(
                                      "account_code") == account_code)]

                      def get_entries_by_reference(self, reference_id: str) -> List[dict]:
                          return [i for i in self.get_entries()
                                  if (i.get("entry", {}).get(
                                      "reference_id") == reference_id)]

                      def generate_journal_report(self) -> Dict:
                          debit_count = 0
                          credit_count = 0
                          for item in self.get_entries():
                              et = (item.get("entry", {}).get(
                                  "entry_type", ""))
                              if et == "DEBIT":
                                  debit_count += 1
                              elif et == "CREDIT":
                                  credit_count += 1
                          return {"journal_entries": len(self.get_entries()),
                                  "debit_entries": debit_count,
                                  "credit_entries": credit_count,
                                  "generated_at": self._clock.now()}

                      def generate_metrics(self) -> Dict:
                          return {"entries": len(self.get_entries()),
                                  "generated_at": self._clock.now()}
              '''))
              out("## FIN N-1")
          except Exception:
              out("## N-1 ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] birth-zid SOLO menores (regla 78 estricta) + AX-1 docs"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              sp = pathlib.Path("shared_engines/runtime/api.py")
              txt = sp.read_text(encoding="utf-8")
              OLD = """    def _handle_birth_zid(self) -> None:
        doc = self._read_json()
        actor_zid = self._require_str(doc, "actor_zid")
        cert_hash = self._require_str(doc, "cert_hash")
        child_name = self._require_str(doc, "child_name")"""
              NEW = """    def _handle_birth_zid(self) -> None:
        doc = self._read_json()
        actor_zid = self._require_str(doc, "actor_zid")
        cert_hash = self._require_str(doc, "cert_hash")
        child_name = self._require_str(doc, "child_name")
        birth_date = self._require_str(doc, "birth_date")
        try:
            import datetime as _dt
            _bd = _dt.date.fromisoformat(birth_date)
        except Exception:
            raise ApiError(400, "invalid_birth_date",
                           "birth_date debe ser YYYY-MM-DD")
        _age = (_dt.date.today() - _bd).days / 365.25
        if _age >= 18.0:
            raise ApiError(403, "not_a_minor",
                           "birth-zid es EXCLUSIVO para menores de"
                           " edad (regla 78): un adulto debe"
                           " identificarse via /identity/enroll")"""
              if OLD in txt:
                  txt = txt.replace(OLD, NEW, 1)
                  ast.parse(txt)
                  sp.write_text(txt, encoding="utf-8")
                  py_compile.compile("shared_engines/runtime/api.py",
                                     doraise=True)
                  out("- **api.py: birth-zid ahora EXIGE birth_date y"
                      " valida MENOR de 18 (regla 78 estricta)**")
              elif "not_a_minor" in txt:
                  out("- api.py: ya aplica regla 78 — skip")
              else:
                  out("- api.py: patron OLD no hallado — dump requerido")
                  out("```python")
                  out(txt[txt.find("def _handle_birth_zid"):
                      txt.find("def _handle_birth_zid") + 1200])
                  out("```")

              sp2 = pathlib.Path("apps/axis/server.py")
              txt2 = sp2.read_text(encoding="utf-8")
              if '"birth_date"' in txt2 and "not_a_minor" not in txt2:
                  pat = """                    {
                        "actor_zid":
                        str(zid),
                        "cert_hash":
                        str(cert_hash),
                        "child_name":
                        str(child_name),
                    },"""
                  rep = """                    {
                        "actor_zid":
                        str(zid),
                        "cert_hash":
                        str(cert_hash),
                        "child_name":
                        str(child_name),
                        "birth_date":
                        str(birth.get("birth_date")),
                    },"""
                  if pat in txt2:
                      txt2 = txt2.replace(pat, rep, 1)
                      ast.parse(txt2)
                      sp2.write_text(txt2, encoding="utf-8")
                      py_compile.compile("apps/axis/server.py",
                                         doraise=True)
                      out("- **axis/server.py: _birth_zid_request envia"
                          " birth_date del recien nacido**")
                  else:
                      out("- axis/server.py: patron no hallado"
                          " (skip honesto)")

              CORRECT = ("# REGLA 78 (dueno): el ZID de un menor nace"
                         " via /identity/birth-zid SIN biometria"
                         " (partida de nacimiento como evidencia);"
                         " /identity/enroll es el enrolamiento"
                         " biometrico POSTERIOR que se vincula al"
                         " MISMO ZID. birth-zid es EXCLUSIVO para"
                         " menores de edad (regla 78).")
              for ruta, pats in [("apps/axis/life_history/service.py",
                                  ("identity/enroll", "must come")),
                                 ("apps/subastas/services/subastas_link.py",
                                  ("identity/enroll", "ONLY"))]:
                  p = pathlib.Path(ruta)
                  if not p.exists():
                      out("- " + ruta + ": NO EXISTE")
                      continue
                  lines = p.read_text(encoding="utf-8",
                                      errors="replace").split("\n")
                  changed = 0
                  for i, ln in enumerate(lines):
                      low = ln.lower()
                      if ("identity/enroll" in low
                              and any(x in low for x in pats)
                              and ln.strip().startswith("#")):
                          indent = ln[:len(ln) - len(ln.lstrip())]
                          lines[i] = indent + CORRECT
                          changed = changed + 1
                  if changed:
                      p.write_text("\n".join(lines),
                                   encoding="utf-8")
                      py_compile.compile(ruta, doraise=True)
                      out("- **" + ruta + ": " + str(changed)
                          + " comentarios -> regla 78**")
                  else:
                      out("- " + ruta + ": sin contradictorios (skip)")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] AGRO datetime el saltado (1 archivo)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          migrados = 0
          saltados = []
          try:
              for p in sorted(pathlib.Path("apps/agro").rglob("*.py")):
                  try:
                      txt = p.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  if "datetime.utcnow()" not in txt:
                      continue
                  stripped = [ln.strip() for ln in txt.split("\n")]
                  caso_a = ("from datetime import datetime" in stripped)
                  caso_b = "import datetime" in stripped
                  new = txt
                  if caso_b:
                      new = new.replace(
                          "datetime.datetime.utcnow()",
                          "datetime.datetime.now(datetime.timezone.utc)")
                  new = new.replace("datetime.utcnow()",
                                    "datetime.now(timezone.utc)")
                  if caso_a and not caso_b:
                      lines = new.split("\n")
                      lines = [(ln.replace(
                          "from datetime import datetime",
                          "from datetime import datetime, timezone")
                          if ln.strip() == "from datetime import datetime"
                          else ln) for ln in lines]
                      new = "\n".join(lines)
                  if "timezone" not in new and "datetime.now(" in new:
                      lines = new.split("\n")
                      for i, ln in enumerate(lines):
                          if "import datetime" in ln:
                              lines[i] = ("import datetime"
                                          .join(["", ""]))
                              lines[i] = ("import datetime as _dtmod")
                              new = "\n".join(lines)
                              break
                  try:
                      ast.parse(new)
                      if "timezone" not in new:
                          saltados.append(str(p))
                          continue
                      p.write_text(new, encoding="utf-8")
                      py_compile.compile(str(p), doraise=True)
                      migrados = migrados + 1
                      out("- **" + p.name + ": OK**")
                  except Exception:
                      saltados.append(str(p)
                                      + " (transform invalida)")
          except Exception:
              out("ERROR: " + traceback.format_exc().strip())
          out("- **AGRO migrados: " + str(migrados) + " | pendientes: "
              + str(len(saltados)) + "**")
          for s in saltados:
              out("    - " + s)
          PYEOF
          exit 0

      - name: "[ESCRITURA tests + LECTURA veredicto] N-1 tests + gates NEXO/AGRO"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/nexo/tests
          cat > apps/nexo/tests/test_n1_contabilidad_unica.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.accounting.accounting_engine import AccountingEngine
          from apps.nexo.domain.accounting.journal_engine import JournalEngine


          def _audit(tmp_path):
              from shared_engines.audit.chain import AuditTrail
              try:
                  return AuditTrail(SQLiteAdapter(tmp_path / "aud.db"))
              except TypeError:
                  try:
                      return AuditTrail(db=SQLiteAdapter(tmp_path / "aud.db"))
                  except Exception:
                      class _D:
                          def append(self, **kw):
                              return None
                      return _D()


          def _eng(tmp_path):
              return AccountingEngine(SQLiteAdapter(tmp_path / "a.db"),
                                      FrozenClock(),
                                      audit=_audit(tmp_path))


          def test_balanced_aceptado(tmp_path) -> None:
              eng = _eng(tmp_path)
              r = eng.create_balanced_entry(lines=[
                  {"account_code": "1000", "amount": "500",
                   "entry_type": "DEBIT"},
                  {"account_code": "4000", "amount": "500",
                   "entry_type": "CREDIT"},
              ], description="venta al contado",
                  reference_id="F-1")
              assert r["total"] == "500.00"
              assert r["lines"] == 2
              assert eng.calculate_account_balance(
                  "1000") == pytest.approx(500.0)
              print("OK N-1: asiento cuadrado aceptado con group_id")


          def test_descuadrado_rechazado(tmp_path) -> None:
              eng = _eng(tmp_path)
              with pytest.raises(ValueError):
                  eng.create_balanced_entry(lines=[
                      {"account_code": "1000", "amount": "500",
                       "entry_type": "DEBIT"},
                      {"account_code": "4000", "amount": "400",
                       "entry_type": "CREDIT"},
                  ], description="mal")
              with pytest.raises(ValueError):
                  eng.create_balanced_entry(lines=[],
                                            description="vacio")
              with pytest.raises(ValueError):
                  eng.create_balanced_entry(lines=[
                      {"account_code": "1000", "amount": "10",
                       "entry_type": "PIERNA"},
                      {"account_code": "4000", "amount": "10",
                       "entry_type": "CREDIT"},
                  ], description="tipo malo")
              print("OK N-1: descuadrado/vacio/tipo-malo rechazados")


          def test_pierna_individual_primitiva(tmp_path) -> None:
              eng = _eng(tmp_path)
              e = eng.create_entry(account_code="1000", amount="10",
                  entry_type="DEBIT", description="pierna")
              assert e["status"] == "POSTED"
              print("OK N-1: create_entry sigue como primitiva de pierna")


          def test_journal_valida_lines(tmp_path) -> None:
              j = JournalEngine(SQLiteAdapter(tmp_path / "j.db"),
                                FrozenClock())
              j.register_entry({"lines": [
                  {"account_code": "1000", "amount": "100",
                   "entry_type": "DEBIT"},
                  {"account_code": "4000", "amount": "100",
                   "entry_type": "CREDIT"},
              ]})
              with pytest.raises(ValueError):
                  j.register_entry({"lines": [
                      {"account_code": "1000", "amount": "100",
                       "entry_type": "DEBIT"},
                      {"account_code": "4000", "amount": "90",
                       "entry_type": "CREDIT"},
                  ]})
              j.register_entry({"account_code": "1000",
                                "amount": "5",
                                "entry_type": "DEBIT"})
              assert len(j.get_entries()) == 2
              print("OK journal: lines cuadradas exigidas + pierna suelta registrable")
          TSEOF
          timeout 300 python3 -m pytest apps/nexo/tests/test_n1_contabilidad_unica.py apps/nexo/tests/test_accounting_migrated.py apps/nexo/tests/test_ng3_accounting.py -q --timeout=45 --timeout-method=thread --tb=short > /tmp/n1.out 2>&1
          echo $? > /tmp/n1
          if [ "$(cat /tmp/n1)" = "0" ]; then echo "- N-1 contabilidad unica: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- N-1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### N-1 detalle"; echo '```'; tail -60 /tmp/n1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/nxn.out 2>&1
          echo $? > /tmp/nxn
          if [ "$(cat /tmp/nxn)" = "0" ]; then echo "- REG NEXO completo: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- REG NEXO: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### NEXO detalle"; echo '```'; tail -60 /tmp/nxn.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/agn.out 2>&1
          echo $? > /tmp/agn
          if [ "$(cat /tmp/agn)" = "0" ]; then echo "- REG AGRO: ✅ (33)" >> "$GITHUB_STEP_SUMMARY"; else echo "- REG AGRO: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### AGRO detalle"; echo '```'; tail -40 /tmp/agn.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si NEXO y AGRO verdes"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/n1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/nxn 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/agn 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: gates rojos — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo apps/axis apps/subastas apps/agro shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(FASE1-a): N-1 autoridad contable UNICA (create_balanced_entry canonico exige cuadre con group_id, journal valida lines cuadradas, create_entry documentado como primitiva de pierna — regla 61) + REGLA 78 ESTRICTA en la Red: /identity/birth-zid EXIGE birth_date y valida MENOR de 18 (un adulto NO puede crear ZID via partida), axis envia birth_date + documentacion unificada a regla 78 + AGRO datetime timezone-aware"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — N-1 + regla 78 estricta cerrados. Run siguiente: AX-2 (master key en tests emergencias) + S-1/S-4 matricula desde casa.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          exit 1
