name: ZYRA AXIS Block 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  axis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest

      - name: Patch AXIS E2E test (person -> organization)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/axis/tests/"
              "test_axis_emergencias_e2e.py"
          )
          src = path.read_text(encoding="utf-8")

          if '"kind": "organization"' in src:
              print("RESULT: already patched")
          else:
              fixed = src.replace(
                  '"kind": "person"',
                  '"kind": "organization"',
              )
              path.write_text(fixed, encoding="utf-8")
              print("RESULT: PATCHED OK")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("SYNTAX OK")
          PYEOF

      - name: AXIS tests (must be 7/7)
        run: python -m pytest apps/axis/tests -v

      - name: Security regression stays green (biometrics 13)
        run: python -m shared_engines.security.biometrics -v

      - name: Commit patch (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/tests/test_axis_emergencias_e2e.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "axis: E2E test subjects use organization kind (person requires biometric enroll)"
            git push
          fi
