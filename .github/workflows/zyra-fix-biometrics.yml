name: "ZYRA - AUDITORIA video_encoder + gov_data (solo lectura, 1 min)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Auditar estado real de los archivos del lote GOV
        run: |
          python - <<'PYEOF'
          import os, shutil, subprocess, sys
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append

          A("# 🔍 AUDITORIA — estado real GOV/video\n")

          A("## 1. video_encoder.py — que version esta en el repo\n")
          p = Path("apps/laboratorio/infrastructure/providers/video_encoder.py")
          if not p.is_file():
              A("- ❌ NO EXISTE")
          else:
              t = p.read_text(encoding="utf-8", errors="replace")
              A("- lineas: " + str(len(t.splitlines())))
              for marca in ("def ffmpeg_disponible", "def ensamblar_mp4",
                            "def ensamblar_avi", "class MotorVideo"):
                  A("  - " + marca + ": " + ("✅" if marca in t else "❌ FALTA"))
              A("- VERSION: " + ("NUEVA (con MP4/ffmpeg)" if "def ensamblar_mp4" in t
                                 else "VIEJA (solo AVI — necesita reescritura completa)"))
          A("")

          A("## 2. gov_data_engine.py\n")
          p = Path("apps/laboratorio/infrastructure/providers/gov_data_engine.py")
          if not p.is_file():
              A("- ❌ NO EXISTE (se reescribe completo)")
          else:
              t = p.read_text(encoding="utf-8", errors="replace")
              A("- ✅ existe (" + str(len(t.splitlines())) + " lineas)")
              A("  - class MotorGovData: " + ("✅" if "class MotorGovData" in t else "❌"))
          A("")

          A("## 3. decisions.py — rutas GOV\n")
          p = Path("apps/laboratorio/routers/api/decisions.py")
          if not p.is_file():
              A("- ❌ NO EXISTE")
          else:
              t = p.read_text(encoding="utf-8", errors="replace")
              A("- lineas: " + str(len(t.splitlines())))
              for marca in ("RUTA_GOV_INGESTAR", "RUTA_GOV_CAPA_A", "RUTA_GOV_CAPA_B",
                            'app.contenedor.obtener("gov_data")'):
                  A("  - " + marca + ": " + ("✅" if marca in t else "❌ FALTA (reescribir completo)"))
          A("")

          A("## 4. service_registry — cableado gov_data\n")
          p = Path("apps/laboratorio/registry/services/service_registry.py")
          if not p.is_file():
              A("- ❌ NO EXISTE")
          else:
              t = p.read_text(encoding="utf-8", errors="replace")
              A("- MotorGovData import: " + ("✅" if "MotorGovData" in t else "❌ NO (reescribir cableado)"))
              A('- servicio "gov_data": ' + ("✅" if '"gov_data"' in t else "❌ NO"))
          A("")

          A("## 5. Import real de video_encoder (el que fallo)\n")
          try:
              import importlib
              m = importlib.import_module("apps.laboratorio.infrastructure.providers.video_encoder")
              A("- ✅ import OK · exports: " + str([x for x in dir(m) if not x.startswith("_")]))
              A("- tiene ffmpeg_disponible: " + str(hasattr(m, "ffmpeg_disponible")))
              A("- tiene ensamblar_mp4: " + str(hasattr(m, "ensamblar_mp4")))
          except Exception as exc:
              A("- ❌ import FALLO: " + str(exc))
          A("")

          A("## 6. ffmpeg del sistema\n")
          A("- ffmpeg: " + ("✅ " + str(shutil.which("ffmpeg")) if shutil.which("ffmpeg") else "❌ no instalado"))
          A("")

          A("## 7. Suite corriendo AHORA\n")
          if Path("apps/laboratorio/tests").is_dir():
              r = subprocess.run([sys.executable, "-m", "pytest", "apps/laboratorio/tests",
                                  "-q", "--tb=line"], capture_output=True, text=True, timeout=600)
              salida = (r.stdout or "") + (r.stderr or "")
              A("codigo: " + str(r.returncode))
              A("```")
              A(salida[-3000:] if len(salida) > 3000 else salida)
              A("```")
          else:
              A("❌ carpeta tests no existe")
          A("")

          A("## 8. LO QUE SE NECESITA (automatico)\n")
          p = Path("apps/laboratorio/infrastructure/providers/video_encoder.py")
          if p.is_file() and "def ensamblar_mp4" not in p.read_text(errors="replace"):
              A("- video_encoder.py es la version VIEJA -> reescribir completo con ffmpeg_disponible + ensamblar_mp4 + ensamblar_avi (autocontenido)")
          p2 = Path("apps/laboratorio/infrastructure/providers/gov_data_engine.py")
          if not p2.is_file():
              A("- gov_data_engine.py no existe -> escribir completo")
          p3 = Path("apps/laboratorio/routers/api/decisions.py")
          if p3.is_file() and "RUTA_GOV_INGESTAR" not in p3.read_text(errors="replace"):
              A("- decisions.py no tiene rutas GOV -> reescribir completo")
          p4 = Path("apps/laboratorio/registry/services/service_registry.py")
          if p4.is_file() and '"gov_data"' not in p4.read_text(errors="replace"):
              A("- service_registry sin gov_data -> cablear")
          final = "\n".join(L)
          if summary:
              with open(summary, "a") as fh:
                  fh.write(final + "\n")
          sys.exit(0)
          PYEOF

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-gov
          path: auditoria_gov.md
