name: "ZYRA EX - parche final 3 fallos (quirurgico, verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parche:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Parches 1 y 3 (import json + exito en ruta del curso)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          # Parche 1: import json en test_camara_orbital.py
          ruta1 = Path("apps/laboratorio/tests/test_camara_orbital.py")
          t1 = ruta1.read_text(encoding="utf-8")
          if "import json" not in t1:
              t1 = t1.replace(
                  '"""EX-3: camara orbital + render 2.5D determinista."""\n',
                  '"""EX-3: camara orbital + render 2.5D determinista."""\nimport json\n',
                  1,
              )
              ruta1.write_text(t1, encoding="utf-8")
              print("parche 1: import json agregado")
          else:
              print("parche 1 ya presente")

          # Parche 3: exito() en la ruta _curso_crear de presentations.py
          ruta3 = Path("apps/laboratorio/routers/api/presentations.py")
          t3 = ruta3.read_text(encoding="utf-8")
          viejo3 = '''              def _curso_crear(ctx):
                  datos = ctx.json()
                  return modocurso.crear_curso(
                      ctx.ruta_params["presentacion_id"],
                      datos.get("preguntas", []),
                      datos.get("umbral_aprobacion", 0.7))
          '''
          nuevo3 = '''              def _curso_crear(ctx):
                  datos = ctx.json()
                  return exito(modocurso.crear_curso(
                      ctx.ruta_params["presentacion_id"],
                      datos.get("preguntas", []),
                      datos.get("umbral_aprobacion", 0.7)))
          '''
          if viejo3 in t3:
              if "from apps.laboratorio.schemas.responses.envelopes import exito" not in t3:
                  t3 = t3.replace(
                      "from apps.laboratorio.shared.exceptions.domain_errors import EntidadNoEncontradaError\n",
                      "from apps.laboratorio.shared.exceptions.domain_errors import EntidadNoEncontradaError\n"
                      "from apps.laboratorio.schemas.responses.envelopes import exito\n",
                      1,
                  )
                  print("parche 3b: import exito agregado")
              t3 = t3.replace(viejo3, nuevo3, 1)
              print("parche 3: ruta del curso envuelta en exito()")
          elif "return exito(modocurso.crear_curso(" in t3:
              print("parche 3 ya presente")
          else:
              raise SystemExit("FATAL: ruta _curso_crear no encontrada")

          ast.parse(t3)
          ruta3.write_text(t3, encoding="utf-8")
          print("presentations.py: sintaxis OK")
          PYEOF

      - name: Parche 2 - test de certificado con cliente falso (ruta completa de sellado)
        run: |
          python - <<'PYEOF'
          from pathlib import Path

          ruta = Path("apps/laboratorio/tests/test_curso_certificado.py")
          t = ruta.read_text(encoding="utf-8")

          viejo = '''          def _modo():
              return ModoCurso(_RepoFalso(), _OutboxFalso(),
                               Firmador("clave-de-test-1234567890abcd"), cliente=None)
          '''
          nuevo = '''          class _ClienteFalso:
              @staticmethod
              def entregar(destino, carga):
                  return {"sellado": True}

          def _modo():
              return ModoCurso(_RepoFalso(), _OutboxFalso(),
                               Firmador("clave-de-test-1234567890abcd"),
                               cliente=_ClienteFalso())
          '''
          if viejo in t:
              t = t.replace(viejo, nuevo, 1)
              print("parche 2 aplicado: cliente falso para ruta completa de sellado")
          elif "_ClienteFalso" in t:
              print("parche 2 ya presente")
          else:
              raise SystemExit("FATAL: _modo no encontrado tal cual")

          ruta.write_text(t, encoding="utf-8")
          print("test_curso_certificado.py: parche OK")
          PYEOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - parche final 3 fallos"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "EX: parche final (import json, exito en ruta curso, cliente falso en test de sellado)"
            git push
          fi
