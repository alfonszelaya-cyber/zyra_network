name: "REPORTE FINAL DEL SISTEMA COMPLETO: 9 apps + Red — inventario de TODO + tests de TODO + sintaxis de TODO + duplicados de TODO — sin importar quien lo creo"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "1) INVENTARIO TOTAL del sistema (9 apps + Red)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# INVENTARIO COMPLETO DEL SISTEMA ZYRA" >> "$SUM"
          echo "## Apps que existen" >> "$SUM"
          { echo '```'; ls -d apps/*/ 2>/dev/null | sed 's|apps/||;s|/||'; echo '```'; } >> "$SUM"
          echo "## Archivos .py por app (conteo)" >> "$SUM"
          { echo '```'; for app in $(ls -d apps/*/ 2>/dev/null | sed 's|apps/||;s|/||'); do n=$(find apps/$app -name "*.py" ! -path "*__pycache__*" 2>/dev/null | wc -l); l=$(find apps/$app -name "*.py" ! -path "*__pycache__*" 2>/dev/null | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}'); echo "$app: $n archivos, $l lineas"; done; echo "shared_engines:"; n=$(find shared_engines -name "*.py" ! -path "*__pycache__*" ! -path "*tests*" 2>/dev/null | wc -l); l=$(find shared_engines -name "*.py" ! -path "*__pycache__*" ! -path "*tests*" 2>/dev/null | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}'); echo "Red: $n archivos, $l lineas"; echo '```'; } >> "$SUM"
          echo "## Archivos >800 lineas (regla 77)" >> "$SUM"
          { echo '```'; find apps shared_engines -name "*.py" ! -path "*__pycache__*" ! -path "*tests*" 2>/dev/null | while read f; do n=$(wc -l < "$f"); if [ "$n" -gt 800 ]; then echo "$n $f"; fi; done | sort -rn | head -15; echo '```'; } >> "$SUM"
          echo "## Carpetas vacias" >> "$SUM"
          { echo '```'; find apps shared_engines -type d ! -path "*__pycache__*" ! -path "*tests*" 2>/dev/null | while read d; do n=$(find "$d" -maxdepth 1 -type f 2>/dev/null | wc -l); if [ "$n" = "0" ]; then echo "$d"; fi; done | head -20; echo '```'; } >> "$SUM"
          echo "## FIN inventario" >> "$SUM"
          exit 0

      - name: "2) SINTAXIS de TODO el sistema (cada archivo .py)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          ERRORS=0
          TOTAL=0
          echo "# SINTAXIS DE TODO EL SISTEMA" >> "$SUM"
          for f in $(find apps shared_engines -name "*.py" ! -path "*__pycache__*" 2>/dev/null); do
            TOTAL=$((TOTAL + 1))
            python3 -c "import ast; ast.parse(open('$f', encoding='utf-8').read())" 2>/dev/null || {
              ERRORS=$((ERRORS + 1))
              echo "- ERROR: $f" >> "$SUM"
            }
          done
          echo "- Total: $TOTAL archivos | Errores: $ERRORS" >> "$SUM"
          if [ "$ERRORS" = "0" ]; then
            echo "- LIMPIO: 0 errores de sintaxis" >> "$SUM"
          else
            echo "- ROJO: $ERRORS errores" >> "$SUM"
          fi
          echo "## FIN sintaxis" >> "$SUM"
          exit 0

      - name: "3) TABLAS de TODO el sistema (por app)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# TABLAS POR APP" >> "$SUM"
          for app in $(ls -d apps/*/ 2>/dev/null | sed 's|apps/||;s|/||'); do
            echo "## $app" >> "$SUM"
            { echo '```'; grep -roh "CREATE TABLE IF NOT EXISTS [a-z_]*\|CREATE TABLE [a-z_]*" apps/$app --include="*.py" 2>/dev/null | grep -v __pycache__ | sed 's/CREATE TABLE IF NOT EXISTS //;s/CREATE TABLE //' | sort -u; echo '```'; } >> "$SUM"
          done
          echo "## Red (shared_engines)" >> "$SUM"
          { echo '```'; grep -roh "CREATE TABLE IF NOT EXISTS [a-z_]*\|CREATE TABLE [a-z_]*" shared_engines --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v tests | sed 's/CREATE TABLE IF NOT EXISTS //;s/CREATE TABLE //' | sort -u; echo '```'; } >> "$SUM"
          echo "## FIN tablas" >> "$SUM"
          exit 0

      - name: "4) CLASES DUPLICADAS en TODO el sistema"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# CLASES DUPLICADAS (todas las apps + Red)" >> "$SUM"
          for f in $(find apps shared_engines -name "*.py" ! -path "*__pycache__*" ! -path "*tests*" 2>/dev/null); do
            grep -oh "^class [A-Za-z_]*" "$f" 2>/dev/null
          done | sort | uniq -c | sort -rn | awk '$1 > 1 {print $1, $2}' > /tmp/dup_classes.txt
          if [ -s /tmp/dup_classes.txt ]; then
            echo "## Clases que aparecen mas de una vez:" >> "$SUM"
            { echo '```'; cat /tmp/dup_classes.txt; echo '```'; } >> "$SUM"
            echo "## Detalle por clase:" >> "$SUM"
            while read n cls; do
              files=$(grep -rln "^class $cls\b" apps shared_engines --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v tests | head -6)
              echo "- $cls: $files" >> "$SUM"
            done < /tmp/dup_classes.txt
          else
            echo "- LIMPIO: 0 clases duplicadas" >> "$SUM"
          fi
          echo "## FIN clases" >> "$SUM"
          exit 0

      - name: "5) UTCNOW en TODO el sistema"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# UTCNOW (todas las apps + Red)" >> "$SUM"
          for app in $(ls -d apps/*/ 2>/dev/null | sed 's|apps/||;s|/||'); do
            n=$(grep -rn "datetime.utcnow" apps/$app --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v tests | wc -l)
            echo "- $app: $n" >> "$SUM"
          done
          n=$(grep -rn "datetime.utcnow" shared_engines --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v tests | wc -l)
          echo "- shared_engines: $n" >> "$SUM"
          echo "## FIN utcnow" >> "$SUM"
          exit 0

      - name: "6) REGRESION de TODAS las apps con tests"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          for pair in "nexo 45 x1" "axis 90 x2" "agro 45 x3" "semilla 45 x4" "subastas 45 x5" "ciclo_digital 45 x7" "mi_primer_empleo 45 x8"; do
            set -- $pair
            if [ -d "apps/$1/tests" ] && [ "$(ls apps/$1/tests/test_*.py 2>/dev/null | wc -l)" != "0" ]; then
              timeout 300 python3 -m pytest apps/$1/tests -q --timeout=$2 --timeout-method=thread --tb=line > /tmp/$3.out 2>&1
              echo $? > /tmp/$3
              passed=$(grep -oE "[0-9]+ passed" /tmp/$3.out 2>/dev/null | tail -1)
              failed=$(grep -oE "[0-9]+ failed" /tmp/$3.out 2>/dev/null | tail -1)
              if [ "$(cat /tmp/$3)" = "0" ]; then
                echo "- $1: VERDE ($passed passed)" >> "$SUM"
              else
                echo "- $1: ROJO ($passed passed, ${failed:-?} failed)" >> "$SUM"
                { echo "### $1 detalle"; echo '```'; tail -25 /tmp/$3.out; echo '```'; } >> "$SUM"
              fi
            else
              echo "- $1: sin tests" >> "$SUM"
            fi
          done
          timeout 240 python3 -m pytest shared_engines/identity/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x6.out 2>&1
          echo $? > /tmp/x6
          passed=$(grep -oE "[0-9]+ passed" /tmp/x6.out 2>/dev/null | tail -1)
          if [ "$(cat /tmp/x6)" = "0" ]; then
            echo "- Red: VERDE ($passed passed)" >> "$SUM"
          else
            echo "- Red: ROJO" >> "$SUM"
            tail -20 /tmp/x6.out >> "$SUM"
          fi
          exit 0

      - name: "7) GOV-DATA + National Intelligence (verificacion de que existe y funciona)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# GOV-DATA (Capa A/B/C + alarmas)" >> "$SUM"
          { echo '```'; ls apps/nexo/domain/meta_government/ 2>/dev/null; echo '```'; } >> "$SUM"
          { echo '```'; grep -n "class NationalIntelligenceEngine\|def report_indicator\|def raise_national_alert\|def chain_event\|def raise_alarm\|def national_snapshot" apps/nexo/domain/meta_government/national_intelligence_engine.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## FIN GOV-DATA" >> "$SUM"
          exit 0

      - name: "RESUMEN FINAL DEL SISTEMA"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# ==========================================" >> "$SUM"
          echo "# RESUMEN FINAL — SISTEMA ZYRA COMPLETO" >> "$SUM"
          echo "# ==========================================" >> "$SUM"
          echo "- Este reporte cubre TODO el sistema (9 apps + Red) sin importar quien creo cada archivo." >> "$SUM"
          echo "- Los pasos 1-7 arriba son la evidencia completa: inventario, sintaxis, tablas, duplicados, utcnow, regresion, GOV-DATA." >> "$SUM"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps shared_engines
          set +e
          if git diff --cached --quiet; then
            echo "SIN CAMBIOS" >> "$SUM"
          else
            git commit -m "chore(reporte final): limpieza de caches"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/push.log 2>&1 || git push origin "HEAD:main" > /tmp/push2.log 2>&1
          fi
          exit 0
