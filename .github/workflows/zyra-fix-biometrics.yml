          timeout 300 python3 -m pytest shared_engines/currency/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/p2.out 2>&1
          echo $? > /tmp/p2
          if [ "$(cat /tmp/p2)" = "0" ]; then echo "- P2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- P2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### P2 detalle"; echo '```'; tail -50 /tmp/p2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "P3: regresion shared_engines completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/p3.out 2>&1
          echo $? > /tmp/p3
          if [ "$(cat /tmp/p3)" = "0" ]; then echo "- P3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- P3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### P3 detalle"; echo '```'; tail -60 /tmp/p3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "P4: apps nexo + subastas intactas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/nexo/tests apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/p4.out 2>&1
          echo $? > /tmp/p4
          if [ "$(cat /tmp/p4)" = "0" ]; then echo "- P4: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- P4: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### P4 detalle"; echo '```'; tail -40 /tmp/p4.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in p1 p2 p3 p4; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: P1-P4 VERDES**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(RED-6): motor financiero transversal - SQL 1-linea, 4 tipos de comision (INTERNATIONAL/DOMESTIC/SERVICE + MARKETPLACE comprador/vendedor/etiqueta, placeholders del dueno), menu remesas, escrow 3 dias habiles, servicios, QR/barcode, telefono, cripto CoinGecko (P1-P4 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — RED-6 CERRADO.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2) — RED-6 CERRADO.**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
