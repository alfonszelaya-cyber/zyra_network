          escribir apps/laboratorio/infrastructure/providers/simulation_engine.py << 'ZYRA_EOF'
          """Motor de evolucion: proyeccion temporal REAL y determinista.

          Modelo documentado (a 1 anio por paso, i = 0..horizonte):
            beneficio_i = beneficio * (1 + crecimiento/100)^i
            costo_i     = costo * 0.98^i        (mejora de eficiencia 2% anual)
            riesgo_i    = min(100, riesgo * (1 + 0.01*i))
            puntaje_i   = min(100, 0.4*(100-costo_i) + 0.4*beneficio_i + 0.2*(100-riesgo_i))
          Metricas: punto de equilibrio (primer anio con beneficio > costo),
          ROI del horizonte (anios 1..H) y tendencia.
          """
          from apps.laboratorio.domain.scenario import Escenario


          class MotorEvolucionReal:
              """Proyecta un escenario A/B/C a lo largo del tiempo."""

              EFICIENCIA_ANUAL = 0.02
              RIESGO_ANUAL = 0.01

              def capacidades(self) -> dict:
                  return {
                      "horizonte_anios": (1, 30),
                      "crecimiento_pct": (-50, 200),
                      "modelo": "beneficio crece - costo mejora 2pct anual - riesgo +1pct anual",
                  }

              def ejecutar(self, escenario: Escenario, horizonte_anios: int, crecimiento_pct: float) -> dict:
                  if not isinstance(escenario, Escenario):
                      raise ValueError("Se esperaba un Escenario.")
                  if not (1 <= int(horizonte_anios) <= 30):
                      raise ValueError("horizonte_anios fuera de rango 1-30.")
                  if not (-50.0 <= float(crecimiento_pct) <= 200.0):
                      raise ValueError("crecimiento_pct fuera de rango -50 a 200.")
                  for clave in ("costo", "beneficio", "riesgo"):
                      if clave not in escenario.parametros:
                          raise ValueError("El escenario requiere el parametro " + clave)
                  costo0 = float(escenario.parametros["costo"])
                  beneficio0 = float(escenario.parametros["beneficio"])
                  riesgo0 = float(escenario.parametros["riesgo"])
                  factor_b = 1.0 + float(crecimiento_pct) / 100.0
                  serie = []
                  sum_beneficio = 0.0
                  sum_costo = 0.0
                  punto_equilibrio = 0
                  for i in range(int(horizonte_anios) + 1):
                      beneficio = beneficio0 * (factor_b ** i)
                      costo = costo0 * ((1.0 - self.EFICIENCIA_ANUAL) ** i)
                      riesgo = min(100.0, riesgo0 * (1.0 + self.RIESGO_ANUAL * i))
                      puntaje = min(
                          100.0,
                          0.4 * (100.0 - costo) + 0.4 * beneficio + 0.2 * (100.0 - riesgo),
                      )
                      if i >= 1:
                          sum_beneficio += beneficio
                          sum_costo += costo
                          if punto_equilibrio == 0 and beneficio > costo:
                              punto_equilibrio = i
                      serie.append({
                          "anio": i,
                          "costo": round(costo, 4),
                          "beneficio": round(beneficio, 4),
                          "riesgo": round(riesgo, 4),
                          "puntaje": round(puntaje, 4),
                      })
                  if sum_costo > 0:
                      roi = round((sum_beneficio - sum_costo) / sum_costo * 100.0, 2)
                  else:
                      roi = 0.0
                  inicial = serie[0]["puntaje"]
                  final = serie[-1]["puntaje"]
                  if final > inicial * 1.01:
                      tendencia = "creciente"
                  elif final < inicial * 0.99:
                      tendencia = "decreciente"
                  else:
                      tendencia = "estable"
                  metricas = {
                      "punto_equilibrio_anio": punto_equilibrio,
                      "roi_pct": roi,
                      "puntaje_inicial": inicial,
                      "puntaje_final": final,
                      "tendencia": tendencia,
                  }
                  return {"serie": serie, "metricas": metricas}
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/providers/comparison_engine.py << 'ZYRA_EOF'
          """Motor de comparacion: decision fundamentada con datos reales.

          Ordena participantes por puntaje oficial, declara ganador, calcula
          la brecha contra el segundo y el desglose por dimension.
          """
          DIMENSIONES = ("costo", "beneficio", "riesgo")


          class MotorComparacionReal:
              """Compara participantes y produce el veredicto con razones."""

              def capacidades(self) -> dict:
                  return {
                      "dimensiones": DIMENSIONES,
                      "criterio": "puntaje_total oficial (mayor gana)",
                      "nota": "menor costo y menor riesgo son mejores",
                  }

              def comparar(self, participantes: list) -> dict:
                  if not isinstance(participantes, list) or len(participantes) < 2:
                      raise ValueError("Se requieren al menos 2 participantes evaluados.")
                  ordenados = sorted(
                      participantes,
                      key=lambda p: float(p.get("puntaje", 0.0)),
                      reverse=True,
                  )
                  ganador = ordenados[0]
                  segundo = ordenados[1]
                  brecha = round(float(ganador["puntaje"]) - float(segundo["puntaje"]), 4)
                  detalle = {}
                  for dimension in DIMENSIONES:
                      mejor = None
                      for p in ordenados:
                          valor = (p.get("metricas") or {}).get(dimension)
                          if valor is None:
                              continue
                          valor = float(valor)
                          if mejor is None:
                              mejor = (p, valor)
                          else:
                              es_mejor = (
                                  valor < mejor[1] if dimension in ("costo", "riesgo")
                                  else valor > mejor[1]
                              )
                              if es_mejor:
                                  mejor = (p, valor)
                      if mejor is not None:
                          detalle[dimension] = {
                              "mejor": mejor[0].get("titulo", ""),
                              "valor": mejor[1],
                          }
                  return {
                      "participantes": ordenados,
                      "ganador": str(ganador.get("escenario_id", "")),
                      "brecha": brecha,
                      "detalle": detalle,
                  }
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/providers/optimization_engine.py << 'ZYRA_EOF'
          """Motor de optimizacion: reglas concretas y parametros calculados.

          Reglas oficiales (todas verificables sobre los parametros 0-100):
            costo > 50     -> reducir 20%
            riesgo > 40    -> mitigar 30%
            beneficio < 60 -> aumentar 15%
          Los resultados se acotan a 0-100. El puntaje proyectado se
          calcula con evaluate_scenario (formula oficial, sin duplicar).
          """
          from apps.laboratorio.domain.scenario import Escenario, evaluate_scenario
          from apps.laboratorio.shared.enums.scenario_type import ScenarioType
          from apps.laboratorio.shared.models.identifiers import nuevo_id

          REGLA_COSTO = {"umbral": 50.0, "factor": 0.80, "accion": "Reducir costo un 20%"}
          REGLA_RIESGO = {"umbral": 40.0, "factor": 0.70, "accion": "Mitigar riesgo un 30%"}
          REGLA_BENEFICIO = {"umbral": 60.0, "factor": 1.15, "accion": "Aumentar beneficio un 15%"}


          class MotorOptimizacionReal:
              """Sugiere mejoras con impacto estimado por dimension."""

              def capacidades(self) -> dict:
                  return {
                      "reglas": {
                          "costo": REGLA_COSTO,
                          "riesgo": REGLA_RIESGO,
                          "beneficio": REGLA_BENEFICIO,
                      },
                      "rango": "parametros acotados a 0-100",
                  }

              def sugerir(self, parametros: dict) -> dict:
                  if not isinstance(parametros, dict):
                      raise ValueError("Los parametros deben ser un objeto.")
                  for clave in ("costo", "beneficio", "riesgo"):
                      if clave not in parametros:
                          raise ValueError("Falta el parametro " + clave)
                      valor = parametros[clave]
                      if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                          raise ValueError("Parametro " + clave + " debe ser numerico.")
                  costo = float(parametros["costo"])
                  beneficio = float(parametros["beneficio"])
                  riesgo = float(parametros["riesgo"])
                  recomendaciones = []
                  nuevo_costo = costo
                  nuevo_beneficio = beneficio
                  nuevo_riesgo = riesgo
                  if costo > REGLA_COSTO["umbral"]:
                      nuevo_costo = round(costo * REGLA_COSTO["factor"], 4)
                      recomendaciones.append({
                          "dimension": "costo",
                          "accion": REGLA_COSTO["accion"],
                          "de": round(costo, 2),
                          "a": nuevo_costo,
                          "razon": "costo " + str(round(costo, 1)) + " supera el umbral 50",
                      })
                  if riesgo > REGLA_RIESGO["umbral"]:
                      nuevo_riesgo = round(riesgo * REGLA_RIESGO["factor"], 4)
                      recomendaciones.append({
                          "dimension": "riesgo",
                          "accion": REGLA_RIESGO["accion"],
                          "de": round(riesgo, 2),
                          "a": nuevo_riesgo,
                          "razon": "riesgo " + str(round(riesgo, 1)) + " supera el umbral 40",
                      })
                  if beneficio < REGLA_BENEFICIO["umbral"]:
                      nuevo_beneficio = min(100.0, round(beneficio * REGLA_BENEFICIO["factor"], 4))
                      recomendaciones.append({
                          "dimension": "beneficio",
                          "accion": REGLA_BENEFICIO["accion"],
                          "de": round(beneficio, 2),
                          "a": nuevo_beneficio,
                          "razon": "beneficio " + str(round(beneficio, 1)) + " esta bajo el umbral 60",
                      })
                  optimizados = {
                      "costo": max(0.0, min(100.0, nuevo_costo)),
                      "beneficio": max(0.0, min(100.0, nuevo_beneficio)),
                      "riesgo": max(0.0, min(100.0, nuevo_riesgo)),
                  }
                  return {"recomendaciones": recomendaciones, "parametros_optimizados": optimizados}

              def puntaje_proyectado(self, parametros_optimizados: dict) -> float:
                  """Puntaje oficial del escenario optimizado (sin duplicar formula)."""
                  temporal = Escenario(
                      id=nuevo_id("esc"),
                      proyecto_id=nuevo_id("proy"),
                      tipo=ScenarioType.A,
                      titulo="proyeccion temporal",
                      parametros=dict(parametros_optimizados),
                  )
                  return float(evaluate_scenario(temporal)["puntaje_total"])
