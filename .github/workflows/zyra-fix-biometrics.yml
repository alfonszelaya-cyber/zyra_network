name: "RED-RELAY paso 1: auditoria runtime (SOLO LECTURA) - donde enchufar el scheduler del cartero"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: kernel.py completo (wiring de engines, hilos, ciclo de vida)"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          p = Path("shared_engines/runtime/kernel.py")
          print("=== kernel.py ===")
          if p.exists():
              for i, l in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          else:
              print("NO EXISTE")
          D1EOF

      - name: "Dump 2: hay hilos/schedulers existentes en shared_engines (patron a seguir)"
        run: |
          python3 - <<'D2EOF'
          from pathlib import Path
          print("=== uso de threading.Timer/Thread/scheduler en shared_engines (fuera de tests) ===")
          for f in sorted(Path("shared_engines").rglob("*.py")):
              if "/tests/" in str(f):
                  continue
              try:
                  txt = f.read_text(encoding="utf-8")
              except Exception:
                  continue
              hits = [(i, l.strip()) for i, l in enumerate(txt.splitlines(), 1)
                      if ("threading.Thread" in l or "Timer(" in l
                          or "daemon=True" in l or "while True" in l)]
              if hits:
                  print()
                  print("-- " + str(f))
                  for i, l in hits[:10]:
                      print("  " + str(i).rjust(5) + ": " + l[:110])
          D2EOF

      - name: "Dump 3: donde se crea caps y bridge en serve_combined (punto de wireado del scheduler)"
        run: |
          python3 - <<'D3EOF'
          from pathlib import Path
          p = Path("shared_engines/runtime/combined_api.py")
          print("=== combined_api.py COMPLETO ===")
          for i, l in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
              print(str(i).rjust(4) + ": " + l)
          D3EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
