                  rep('RECHAZADO (RC=2) - NO se hace commit. Revise las secciones 3, 4 y 5.')
              rep('')
              escribir_salidas(rc)
              return rc

          if __name__ == '__main__':
              sys.exit(main())

          ZYRA_PY_EOF
          python "$RUNNER_TEMP/zyra_fix.py"

      - name: Artefacto (diff + informe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra-fix-informe
          path: |
            ${{ runner.temp }}/zyra_informe.md
            ${{ runner.temp }}/zyra_diff.patch
          if-no-files-found: warn

      - name: Commit y push (solo si APROBADO)
        if: steps.fix.outputs.rc == '0'
        run: |
          if git diff --quiet -- superapp.py; then
            echo "Sin cambios que confirmar (los parches ya estaban aplicados)."
          else
            git config user.name "zyra-fix-bot"
            git config user.email "zyra-fix-bot@users.noreply.github.com"
            git add superapp.py
            git commit -m "ZYRA-FIX v4: bloqueo por nombre y tipo de documento + biometria fail-closed + captura compacta + warmup anti-502"
            git push
          fi
