name: "AXIS AX-3 v8: revelar error real del 500 en ingesta (raw body + API del servicio)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - ley register_person"
        run: |
          python3 - <<'LAWEOF'
          from pathlib import Path
          p = Path(
              "apps/axis/services/axis_link.py")
          t = p.read_text(encoding="utf-8")
          if "biometria: use enroll_person" in t:
              print("SKIP ley")
              raise SystemExit(0)
          start = t.find(
              "    def register_person(")
          end = t.find(
              "    def enroll_person(")
          assert start >= 0 and end > start
          nuevo = (
              "    def register_person(\n"
              "        self, display_name: str\n"
              "    ) -> tuple[\n"
              "        bool, dict | None,\n"
              "        str | None\n"
              "    ]:\n"
              "        raise ValueError(\n"
              "            \"registro de persona\"\n"
              "            \" requiere biometria:\"\n"
              "            \" use enroll_person con\"\n"
              "            \" documento y selfie\"\n"
              "        )\n\n"
          )
          t = t[:start] + nuevo + t[end:]
          import ast
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK ley")
          LAWEOF

      - name: "Paso 1b - ley verificada por llamada real"
        run: |
          python3 -c "
          from apps.axis.services.axis_link import AxisLink
          try:
              AxisLink(None).register_person('X')
          except ValueError as e:
              assert 'biometria' in str(e), str(e)
              print('OK ley verificada')
          else:
              raise SystemExit('FALLO ley')
          "

      - name: "Paso 2 - REEMPLAZO EXACTO de serve_axis"
        run: |
          python3 - <<'SWEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          VIEJO = (
              "def serve_axis(\n"
              "    store: AxisStore,\n"
              "    client: NetworkClient,\n"
              "    *,\n"
              "    host: str = \"127.0.0.1\",\n"
              "    port: int = 0,\n"
              "    life_history_service=None,\n"
              ") -> AxisServer:\n"
              "    AxisApiHandler.store = store\n"
              "    AxisApiHandler.link = AxisLink(client)\n"
              "    AxisApiHandler.life_history_service = life_history_service\n"
              "    return AxisServer((host, port))\n"
          )
          NUEVO = (
              "def serve_axis(\n"
              "    store: AxisStore,\n"
              "    client: NetworkClient,\n"
              "    *,\n"
              "    host: str = \"127.0.0.1\",\n"
              "    port: int = 0,\n"
              "    life_history_service=None,\n"
              "    verify_service=None,\n"
              ") -> AxisServer:\n"
              "    if life_history_service is None:\n"
              "        from apps.axis.life_history.integration import build_life_history\n"
              "        life_history_service = build_life_history(\n"
              "            db=store._db,\n"
              "            clock=store._clock,\n"
              "            network_client=client,\n"
              "        )\n"
              "    AxisApiHandler.store = store\n"
              "    AxisApiHandler.link = AxisLink(client)\n"
              "    AxisApiHandler.life_history_service = life_history_service\n"
              "    AxisApiHandler.verify_service = verify_service\n"
              "    return AxisServer((host, port))\n"
          )
          if NUEVO in t:
              print("SKIP serve_axis (ya actualizado)")
          else:
              count = t.count(VIEJO)
              assert count == 1, (
                  "bloque hallado " + str(count)
                  + " veces (esperaba 1)")
              t = t.replace(VIEJO, NUEVO, 1)
              ast.parse(t)
              p.write_text(t, encoding="utf-8")
              assert NUEVO in p.read_text(encoding="utf-8")
              print("OK serve_axis reemplazado"
                    " (exacto, AST valido)")
          SWEOF

      - name: "Paso 3 - verificacion: server importa + arranque real con auto-wire"
        run: |
          python3 -c "
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.axis.infrastructure.persistence.axis_store import AxisStore
          from apps.axis.infrastructure.network.network_client import NetworkClient
          from apps.axis.server import serve_axis, AxisApiHandler
          store = AxisStore(SQLiteAdapter(':memory:'), SystemClock())
          client = NetworkClient('http://127.0.0.1:1', timeout_seconds=1.0, max_retries=0)
          srv = serve_axis(store, client)
          assert AxisApiHandler.life_history_service is not None, 'auto-wire fallo'
          print('OK: serve_axis arranca con auto-wire real')
          "

      - name: "Paso 4 - rutas audit/verify + verify generate/redeem"
        run: |
          python3 - <<'RTEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if '"audit", "verify"' not in t:
              ancla = '        if s == ["health"]:\n'
              assert ancla in t, "ancla health"
              GET = (
                  '        if s == ["audit", "verify"]:\n'
                  "            life = type(self).life_history_service\n"
                  "            if life is None:\n"
                  '                self._send(503, {"ok": False, "error": {"type": "not_wired"}})\n'
                  "                return\n"
                  "            ok_b, count = life._store.births_chain_verify()\n"
                  '            self._send(200, {"ok": True, "data": {"births_chain": {"ok": ok_b, "checked": count}}})\n'
                  "            return\n"
                  "        if len(s) == 3 and s[0] == \"audit\" and s[1] == \"verify\":\n"
                  "            life = type(self).life_history_service\n"
                  "            if life is None:\n"
                  '                self._send(503, {"ok": False, "error": {"type": "not_wired"}})\n'
                  "                return\n"
                  "            pid = s[2]\n"
                  '            self._send(200, {"ok": True, "data": {"person_id": pid, "events_chain_ok": life._store.events_verify(pid), "events": len(life._store.events_of(pid))}})\n'
                  "            return\n"
              )
              t = t.replace(ancla, GET + ancla, 1)
          if '"verify", "generate"' not in t:
              ancla = '        if s == ["emergencies"]:\n'
              assert ancla in t, "ancla emergencies"
              POST = (
                  '        if s == ["verify", "generate"]:\n'
                  "            svc = type(self).verify_service\n"
                  "            if svc is None:\n"
                  '                self._send(503, {"ok": False, "error": {"type": "not_wired"}})\n'
                  "                return\n"
                  "            from apps.axis.life_history.public_verify import NotAuthorizedError\n"
                  "            try:\n"
                  "                code = svc.generate_code(\n"
                  "                    subject_zid=self._req(doc, \"subject_zid\"),\n"
                  "                    operator_account=self._req(doc, \"operator_account\"),\n"
                  "                    operator_role=self._req(doc, \"operator_role\"),\n"
                  "                )\n"
                  "            except NotAuthorizedError as exc:\n"
                  '                self._send(403, {"ok": False, "error": {"type": "forbidden", "message": str(exc)}})\n'
                  "                return\n"
                  '            self._send(201, {"ok": True, "data": code})\n'
                  "            return\n"
                  '        if s == ["verify", "redeem"]:\n'
                  "            svc = type(self).verify_service\n"
                  "            if svc is None:\n"
                  '                self._send(503, {"ok": False, "error": {"type": "not_wired"}})\n'
                  "                return\n"
                  "            from apps.axis.life_history.public_verify import (\n"
                  "                NotAuthorizedError, CodeNotFoundError,\n"
                  "                CodeAlreadyUsedError, CodeExpiredError)\n"
                  "            try:\n"
                  "                cert = svc.redeem_code(\n"
                  "                    code=self._req(doc, \"code\"),\n"
                  "                    requester=self._req(doc, \"requester\"),\n"
                  "                    requester_role=self._req(doc, \"requester_role\"),\n"
                  "                )\n"
                  "            except NotAuthorizedError as exc:\n"
                  '                self._send(403, {"ok": False, "error": {"type": "forbidden", "message": str(exc)}})\n'
                  "                return\n"
                  "            except CodeNotFoundError as exc:\n"
                  '                self._send(404, {"ok": False, "error": {"type": "not_found", "message": str(exc)}})\n'
                  "                return\n"
                  "            except CodeAlreadyUsedError as exc:\n"
                  '                self._send(409, {"ok": False, "error": {"type": "already_used", "message": str(exc)}})\n'
                  "                return\n"
                  "            except CodeExpiredError as exc:\n"
                  '                self._send(410, {"ok": False, "error": {"type": "expired", "message": str(exc)}})\n'
                  "                return\n"
                  '            self._send(200, {"ok": True, "data": cert})\n'
                  "            return\n"
              )
              t = t.replace(ancla, POST + ancla, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          for req in ('"audit", "verify"', '"verify", "generate"', '"verify", "redeem"'):
              assert req in final, req
          print("OK rutas (AST valido)")
          RTEOF

      - name: "Paso 4b - FIX 500: anadir authorize a permissions.py"
        run: |
          python3 - <<'PEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/life_history/permissions.py")
          assert p.exists(), "permissions.py no existe"
          t = p.read_text(encoding="utf-8")
          if "def authorize(" in t:
              print("SKIP authorize ya existe")
              raise SystemExit(0)
          SHIM = (
              "\n\n"
              "def authorize(*args, **kwargs):\n"
              "    # True si el rol puede ejecutar la accion.\n"
              "    # authorize(accion, rol) o authorize(accion, role=rol).\n"
              "    action = kwargs.get(\"action\")\n"
              "    if action is None and args:\n"
              "        action = args[0]\n"
              "    role = kwargs.get(\"role\")\n"
              "    if role is None and len(args) >= 2:\n"
              "        role = args[1]\n"
              "    role = (role or \"\").strip()\n"
              "    if not role:\n"
              "        return False\n"
              "    if action == \"history.read\":\n"
              "        return role in HISTORY_READERS\n"
              "    if action == \"zid.upgrade\":\n"
              "        return role in ZID_UPGRADERS\n"
              "    return role in REGISTRY_OPERATORS\n"
          )
          t = t.rstrip("\n") + "\n" + SHIM
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          from apps.axis.life_history.permissions import (
              authorize,
          )
          assert authorize("censo.view", "gobierno") is True
          assert authorize("censo.view", "medico") is False
          assert authorize("history.read", "madre") is True
          assert authorize("x") is False
          print("OK authorize importable desde"
                " permissions (AST valido)")
          PEOF

      - name: "Paso 4c - smoke censo: 200 con gobierno / 403 sin rol"
        run: |
          python3 -c "
          import threading, time
          import urllib.error, urllib.request
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.axis.infrastructure.persistence.axis_store import AxisStore
          from apps.axis.infrastructure.network.network_client import NetworkClient
          from apps.axis.server import serve_axis
          store = AxisStore(SQLiteAdapter(':memory:'), SystemClock())
          client = NetworkClient('http://127.0.0.1:1', timeout_seconds=1.0, max_retries=0)
          srv = serve_axis(store, client)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base = 'http://127.0.0.1:' + str(srv.bound_port)
          def get(role):
              h = {'X-ZYRA-Actor-Role': role} if role else {}
              req = urllib.request.Request(base + '/axis/api/gobierno/censo', headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')
          st, body = get('gobierno')
          assert st == 200, 'CENSO FALLO -> HTTP ' + str(st) + ' BODY: ' + body[:600]
          st, body = get(None)
          assert st == 403, 'CENSO SIN ROL -> HTTP ' + str(st) + ' BODY: ' + body[:600]
          print('OK censo: 200 con gobierno / 403 sin rol')
          "

      - name: "Paso 5 - guardia DENTRO de la rama birth-register"
        run: |
          python3 - <<'GDGEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          OLD = (
              "        from apps.axis.life_history.access_control import authorize as _zax_auth\n"
              "        _zax_role = (self.headers.get(\"X-ZYRA-Actor-Role\") or \"\").strip()\n"
              "        if not _zax_role:\n"
              "            _zax_reg = str(doc.get(\"registrar_account\") or \"\")\n"
              "            if _zax_reg:\n"
              "                try:\n"
              "                    _zax_role = str(type(self).store.get_account(_zax_reg).get(\"role\"))\n"
              "                except LookupError:\n"
              "                    _zax_role = \"\"\n"
              "        try:\n"
              "            _zax_ok = _zax_auth(\"birth.register\", _zax_role)\n"
              "        except ValueError:\n"
              "            _zax_ok = False\n"
              "        if not _zax_ok:\n"
              "            self._html(403, _page(\"AXIS - Rechazado\", \"<h1>Sin autorizacion</h1><p>Solo registradores civiles (rol: \" + (_zax_role or \"ninguno\") + \").</p><a href='/axis'><button>Volver</button></a>\"))\n"
              "            return\n"
          )
          if OLD in t:
              t = t.replace(OLD, "", 1)
              print("guardia vieja (nivel metodo) eliminada")
          ancla = '        if s == ["birth-register"]:\n'
          if "_zax_auth" in t:
              ia = t.find(ancla)
              ga = t.find("_zax_auth", ia)
              if ga > ia:
                  print("SKIP guardia (ya dentro de la rama)")
                  raise SystemExit(0)
              raise SystemExit("ERROR: _zax_auth existe fuera de la rama; revisar server.py")
          assert ancla in t, "ancla birth-register no encontrada"
          i = t.find(ancla)
          j = t.find("\n", i) + 1
          GUARD = (
              "            from apps.axis.life_history.access_control import authorize as _zax_auth\n"
              "            _zax_role = (self.headers.get(\"X-ZYRA-Actor-Role\") or \"\").strip()\n"
              "            if not _zax_role:\n"
              "                _zax_reg = str((doc or {}).get(\"registrar_account\") or \"\")\n"
              "                if _zax_reg:\n"
              "                    try:\n"
              "                        _zax_role = str(type(self).store.get_account(_zax_reg).get(\"role\"))\n"
              "                    except LookupError:\n"
              "                        _zax_role = \"\"\n"
              "            try:\n"
              "                _zax_ok = _zax_auth(\"birth.register\", _zax_role)\n"
              "            except ValueError:\n"
              "                _zax_ok = False\n"
              "            if not _zax_ok:\n"
              "                self._html(403, _page(\"AXIS - Rechazado\", \"<h1>Sin autorizacion</h1><p>Solo registradores civiles (rol: \" + (_zax_role or \"ninguno\") + \").</p><a href='/axis'><button>Volver</button></a>\"))\n"
              "                return\n"
          )
          t = t[:j] + GUARD + t[j:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          t2 = p.read_text(encoding="utf-8")
          i2 = t2.find(ancla)
          g2 = t2.find("_zax_auth", i2)
          d2 = t2.find("_birth_register(", i2)
          assert 0 < g2 < d2, "la guardia debe quedar antes del dispatch"
          print("OK guardia DENTRO de la rama birth-register (AST valido)")
          GDGEOF

      - name: "Paso 5b - ZID automatico del recien nacido (enroll + update life_persons)"
        run: |
          python3 - <<'ZIDEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if "ZID automatico del recien nacido" in t:
              print("SKIP zid (ya presente)")
              raise SystemExit(0)
          ancla = '        if s == ["birth-register"]:\n'
          i = t.find(ancla)
          assert i >= 0, "ancla birth-register no encontrada"
          k = t.find("_birth_register(", i)
          assert k > i, "dispatch _birth_register no encontrado tras el ancla"
          ls = t.rfind("\n", 0, k) + 1
          le = t.find("\n", k) + 1
          linea = t[ls:le - 1]
          IND = linea[:len(linea) - len(linea.lstrip())]
          assert IND == "            ", (
              "indent inesperada del dispatch: " + repr(linea))
          es_return = linea.lstrip().startswith("return")
          EN = []
          UP = []

          def _en(s):
              EN.append(IND + s)

          def _up(s):
              UP.append(IND + s)

          _en("_zax_zid = None")
          _en("_zax_life = None")
          _en("_zax_name = \"\"")
          _en("try:")
          _en("    # ZID automatico del recien nacido (AX-3)")
          _en("    _zax_life = type(self).life_history_service")
          _en("    _zax_name = str((doc or {}).get(\"child_name\") or \"\")")
          _en("    if _zax_life is not None and _zax_name:")
          _en("        _zax_data = None")
          _en("        try:")
          _en("            import base64 as _zax_b64")
