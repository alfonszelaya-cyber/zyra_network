              assert tl["total_keyframes"] == 3
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/timeline", {
                  "duracion_s": 5,
                  "pistas": [{"objetivo": "x", "propiedad": "opacidad", "keyframes": [{"t": 0, "valor": "1"}]}],
              }, headers=H_DUENO)
              assert status == 400, "duplicado debe rechazar: " + str(status)
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/scenes/" + sid + "/timeline", headers=H_DUENO)
              assert status == 200 and cuerpo["datos"]["timeline"] is not None
              assert cuerpo["datos"]["timeline"]["total_keyframes"] == 3

          def t_timeline_invalido():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + ref["escena"]["id"] + "/timeline", {
                  "duracion_s": 5,
