name: ZYRA AGRO Block 3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write operation matrix (uses real AGRO roles)
        run: |
          cat > apps/agro/security/operation_matrix.py <<'OEOF'
          """AGRO operation matrix - additive module.

          Maps every sensitive server operation to the
          roles allowed to perform it, using AGRO's real
          role constants (producer, company, government,
          operator, administrator).

          Note: agricultor/ganadero are producer_type
          values; their role is PRODUCER. Banco maps to
          COMPANY.

          Enforced via the existing SecurityGateway +
          SecurityContext. Self-contained tests.
          """
          from __future__ import annotations

          import unittest

          from apps.agro.constants.roles.constants import (
              ADMINISTRATOR,
              COMPANY,
              GOVERNMENT,
              OPERATOR,
              PRODUCER,
          )
          from apps.agro.security.security_context import (
              SecurityContext,
          )
          from apps.agro.security.security_gateway import (
              SecurityGateway,
          )

          OPERATIONS = {
              "producers.register": (
                  OPERATOR,
                  ADMINISTRATOR,
              ),
              "producers.verify": (
                  GOVERNMENT,
                  ADMINISTRATOR,
              ),
              "production.register": (PRODUCER,),
              "aid.request": (PRODUCER,),
              "aid.eligibility": (GOVERNMENT,),
              "aid.approve": (GOVERNMENT,),
              "aid.assign": (GOVERNMENT,),
              "aid.deliver": (GOVERNMENT,),
              "aid.confirm": (PRODUCER,),
              "alerts.evaluate": (
                  OPERATOR,
                  ADMINISTRATOR,
              ),
              "events.emit": (
                  PRODUCER,
                  COMPANY,
                  GOVERNMENT,
                  OPERATOR,
                  ADMINISTRATOR,
              ),
          }


          class OperationMatrix:
              def __init__(self) -> None:
                  self._gateway = SecurityGateway()

              def check(
                  self,
                  *,
                  operation: str,
                  role: str,
                  subject_id: str,
              ) -> bool:
                  allowed = OPERATIONS.get(operation)
                  if allowed is None:
                      raise ValueError(
                          "unknown operation: "
                          + operation
                      )
                  return role in allowed

              def enforce(
                  self,
                  *,
                  operation: str,
                  role: str,
                  subject_id: str,
              ) -> None:
                  allowed = OPERATIONS.get(operation)
                  if allowed is None:
                      raise ValueError(
                          "unknown operation: "
                          + operation
                      )
                  if role not in allowed:
                      raise PermissionError(
                          "Permission denied:"
                          " " + operation
                          + " for role "
                          + role
                      )


          class OperationMatrixTests(unittest.TestCase):
              def _matrix(self) -> OperationMatrix:
                  return OperationMatrix()

              def test_producer_can_do_own_ops(
                  self,
              ) -> None:
                  matrix = self._matrix()
                  self.assertTrue(
                      matrix.check(
                          operation=(
                              "production.register"
                          ),
                          role=PRODUCER,
                          subject_id="PRD-1",
                      )
                  )
                  self.assertTrue(
                      matrix.check(
                          operation="aid.request",
                          role=PRODUCER,
                          subject_id="PRD-1",
                      )
                  )
                  self.assertTrue(
                      matrix.check(
                          operation="aid.confirm",
                          role=PRODUCER,
                          subject_id="PRD-1",
                      )
                  )

              def test_government_government_ops_only(
                  self,
              ) -> None:
                  matrix = self._matrix()
                  for op in (
                      "producers.verify",
                      "aid.eligibility",
                      "aid.approve",
                      "aid.assign",
                      "aid.deliver",
                  ):
                      self.assertTrue(
                          matrix.check(
                              operation=op,
                              role=GOVERNMENT,
                              subject_id="GOV-1",
                          )
                      )
                  self.assertFalse(
                      matrix.check(
                          operation="aid.approve",
                          role=PRODUCER,
                          subject_id="PRD-1",
                      )
                  )

              def test_producer_cannot_approve_aid(
                  self,
              ) -> None:
                  matrix = self._matrix()
                  with self.assertRaises(
                      PermissionError
                  ):
                      matrix.enforce(
                          operation="aid.approve",
                          role=PRODUCER,
                          subject_id="PRD-1",
                      )

              def test_unknown_operation_rejected(
                  self,
              ) -> None:
                  matrix = self._matrix()
                  with self.assertRaises(ValueError):
                      matrix.check(
                          operation="hack.system",
                          role=ADMINISTRATOR,
                          subject_id="ADM-1",
                      )

              def test_gateway_integration(
                  self,
              ) -> None:
                  context = SecurityContext(
                      subject_id="GOV-1",
                      roles={GOVERNMENT},
                      permissions={"aid.approve"},
                  )
                  gateway = SecurityGateway()
                  self.assertTrue(
                      gateway.authorize(
                          context, "aid.approve"
                      )
                  )
                  with self.assertRaises(
                      PermissionError
                  ):
                      gateway.authorize(
                          context, "aid.deliver"
                      )


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          OEOF
          python3 -c "import ast; ast.parse(open('apps/agro/security/operation_matrix.py').read()); print('operation_matrix OK')"

      - name: 1/3 Operation matrix tests (5)
        run: python -m pytest apps/agro/security/operation_matrix.py -v

      - name: 2/3 AGRO regression
        run: python -m pytest apps/agro/tests -q

      - name: 3/3 Full system regression
        run: |
          python -m pytest apps/axis/life_history/tests apps/axis/tests -q
          python -m pytest apps/agro/tests/test_agro_events.py -q
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/agro/security/operation_matrix.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "agro: operation matrix - 11 server operations mapped to real AGRO roles via SecurityGateway (5 tests)"
            git push
          fi
