name: ZYRA D4c registro con clave del usuario y ZID de la Red

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD4c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: Registro con clave del usuario y ZID de la Red
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          PORTAL = ROOT / 'portal'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD4c.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          class NoRedir(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(NoRedir)

          def pedir(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  resp = OPENER.open(req, timeout=15)
                  return resp.status, resp.headers, resp.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, None, str(e)

          sp_orig = SP_FILE.read_bytes()
          reg = PORTAL / 'registro.html'
          entrar = PORTAL / 'entrar_flow.html'
          originales = {'sp': sp_orig, 'reg': reg.read_bytes()}
          creados = []

          def revertir():
              try:
                  SP_FILE.write_bytes(originales['sp'])
                  reg.write_bytes(originales['reg'])
                  for c in creados:
                      p = ROOT / c
                      if p.exists():
                          p.unlink()
              except Exception:
                  pass

          t0sp = sp_orig.decode('utf-8')
          add('# D4c - REGISTRO: la Red crea el ZID, el usuario crea su clave')
          add('')
          add('Registro = solo lo que la Red pide en /identity/register.')
          add('El usuario crea SU clave. Con ZID + clave accede a las apps con permiso autorizado.')
          add('')

          add('## X1. Sonda del contrato: kind y campos que la Red exige')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d4c', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-d4c', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              try:
                  urllib.request.urlopen(BASE + '/health', timeout=2)
                  vivo = True
                  break
              except urllib.error.HTTPError:
                  vivo = True
                  break
              except Exception:
                  time.sleep(1.0)
          H = {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN}
          KIND = None
          respuesta_zid = None
          if vivo:
              for k in ('person', 'PERSON', 'individual', 'natural', 'humano', 'ciudadano'):
                  req = urllib.request.Request(BASE + '/identity/register', data=json.dumps({'kind': k, 'name': 'Sonda D4c'}).encode('utf-8'), headers=H, method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=8) as r:
                          st, cuerpo = r.status, r.read().decode('utf-8', errors='replace')
                  except urllib.error.HTTPError as e:
                      st, cuerpo = e.code, e.read().decode('utf-8', errors='replace')
                  add('- kind=%s -> %s | %s' % (k, st, cuerpo[:180]))
                  if st in (200, 201):
                      KIND = k
                      respuesta_zid = cuerpo
                      break
          gate('kind_encontrado', KIND is not None)
          if KIND is None:
              add('')
              add('**NINGUN kind paso: nada editado. Los errores de arriba son el contrato exacto.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseD4c.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              try:
                  if proc.poll() is None:
                      proc.terminate()
                      proc.wait(timeout=10)
              except Exception:
                  try:
                      proc.kill()
                  except Exception:
                      pass
              raise SystemExit('KIND NO ENCONTRADO - sin cambios')
          add('')
          try:
              j = json.loads(respuesta_zid)
              d = j.get('data', {})
              add('- Respuesta de la Red al crear: %s' % json.dumps(d, ensure_ascii=False)[:400])
              DATA['campos_respuesta'] = sorted(d.keys()) if isinstance(d, dict) else []
          except Exception:
              pass
          add('')

          add('## X2. Registro de la clave del usuario (donde se guarda)')
          add('')
          ruta_cred = None
          for ruta in ('/identity/credentials', '/identity/secret', '/auth/register', '/tokens'):
              req = urllib.request.Request(BASE + ruta, data=json.dumps({'zid': 'Z-SONDA', 'secret': 'x'}).encode('utf-8'), headers=H, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=6) as r:
                      st, cuerpo = r.status, r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  st, cuerpo = e.code, e.read().decode('utf-8', errors='replace')
              existe = st != 404
              add('- POST %s -> %s %s' % (ruta, st, 'EXISTE' if existe else 'no existe'))
              if existe and ruta_cred is None:
                  ruta_cred = ruta
          add('- Ruta de credenciales detectada: %s' % (ruta_cred or 'NINGUNA expuesta'))
          DATA['ruta_cred'] = ruta_cred
          add('')

          add('## X3. registro.html: formulario minimo + clave del usuario')
          add('')
          REG_LINES = [
          '<!doctype html>',
          '<html lang="es">',
          '<head>',
          '<meta charset="utf-8">',
          '<meta name="viewport" content="width=device-width, initial-scale=1">',
          '<title>Registro - ZYRA</title>',
          '<style>',
          'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;',
          'background:#0a0e27;color:#e6edf3;display:flex;flex-direction:column;',
          'align-items:center;padding:32px 16px;box-sizing:border-box}',
          '.caja{max-width:480px;width:100%;background:#11162b;',
          'border:1px solid #242c4f;border-radius:16px;padding:26px 22px;',
          'box-sizing:border-box}',
          'h1{margin:0 0 6px;font-size:22px;text-align:center}',
          'p{color:#8b949e;font-size:14px;line-height:1.5;margin:6px 0;text-align:center}',
          'label{display:block;font-size:13px;color:#8b949e;margin:12px 0 4px}',
          'input{width:100%;padding:12px;border-radius:10px;border:1px solid #30363d;',
          'background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px}',
          'button{width:100%;margin-top:18px;padding:14px;border-radius:12px;',
          'border:none;background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);',
          'color:#ffffff;font-size:16px;font-weight:700}',
          'a{color:#8b5cf6;text-decoration:none}',
          '#resp{margin-top:14px;text-align:center;word-break:break-all}',
          '.zid{color:#3fb950;font-weight:800;font-size:20px}',
          '.clv{color:#f0b429;font-weight:700}',
          '</style>',
          '</head>',
          '<body>',
          '<div class="caja">',
          '<h1>Registro de ciudadanos</h1>',
          '<p>Un solo registro para toda la vida. La Red crea tu <b>ZID unico e inmutable</b> con biometria y documento. Tu clave la creas TU: con ella entras a las apps que te sean autorizadas.</p>',
          '<form id="f" onsubmit="return enviar(event)">',
          '<label>Nombre completo</label>',
          '<input id="nombre" required>',
          '<label>Elige tu clave de acceso (para entrar a las apps)</label>',
          '<input id="clave" type="password" minlength="8" required>',
          '<label>Repite tu clave</label>',
          '<input id="clave2" type="password" minlength="8" required>',
          '<button id="bcrear">Crear mi ZID</button>',
          '</form>',
          '<div id="resp"></div>',
          '<p style="margin-top:16px"><a href="/">Volver</a> | <a href="/entrar">Ya tengo ZID</a></p>',
          '</div>',
          '<script>',
          'async function enviar(ev){ev.preventDefault();',
          'var c1=document.getElementById("clave").value,c2=document.getElementById("clave2").value;',
          'if(c1!==c2){document.getElementById("resp").innerHTML="<p style=\'color:#f85149\'>Las claves no coinciden.</p>";return false;}',
          'var r=await fetch("/registro/nuevo",{method:"POST",headers:{"Content-Type":"application/json"},',
          'body:JSON.stringify({nombre:document.getElementById("nombre").value,clave:c1})});',
          'var j=await r.json();',
          'if(j.ok&&j.zid){document.getElementById("resp").innerHTML='
          '"<p>Registro creado. Tu ZID unico:</p><p class=\'zid\'>"+j.zid+"</p>"'
          '+"{CLAVE_MSG}</p><p><a href=\'/entrar\'>Entrar con mi ZID y clave</a></p>";',
          'document.getElementById("f").reset();}',
          'else{document.getElementById("resp").innerHTML="<p style=\'color:#f85149\'>"+(j.error||"Error del registro")+"</p>";}',
          'return false;}',
          '</script>',
          '</body>',
          '</html>',
          ]
          REG = '\n'.join(REG_LINES)
          REG = REG.replace('"{CLAVE_MSG}</p>', '', 1)
          REG = REG.replace('"<p>Tu clave la creaste tu en el registro (no se muestra de nuevo).</p>"', '', 1)
          reg.write_text(REG + '\n', encoding='utf-8')
          add('- registro.html: nombre + clave (creada por el usuario, doble confirmacion).')
          add('- La biometria/documento vive en el flujo de la Red segun su diseno existente.')
          gate('registro_html', True)
          add('')

          add('## X4. superapp.py: /registro/nuevo llama a la Red y guarda la clave con hash')
          add('')
          ANCLA = '        if path == "/registro/nuevo":'
          tiene_viejo = ANCLA in t0sp
          add('- ancla /registro/nuevo existente: %d' % t0sp.count(ANCLA))
          if tiene_viejo:
              add('- ruta previa detectada (del D2b revertido no quedo, se crea de nuevo).')
          else:
              add('- se crea la ruta /registro/nuevo en do_POST.')
          add('')

          BLOQUE_POST = [
          '        if path == "/registro/nuevo":',
          '            if not ZYRA_URL:',
          '                self._send_html(503, ERROR_PAGE.replace("__MSG__", "Red no configurada"))',
          '                return',
          '            largo = int(self.headers.get("Content-Length", 0) or 0)',
          '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
          '            try:',
          '                datos = json.loads(crudo or "{}")',
          '            except Exception:',
          '                datos = {}',
          '            nombre = str(datos.get("nombre", "")).strip()',
          '            clave = str(datos.get("clave", ""))',
          '            if len(nombre) < 3 or len(clave) < 8:',
          '                self._send(400, "application/json", json.dumps({"ok": False, "error": "Nombre corto o clave menor de 8 caracteres"}).encode("utf-8"))',
          '                return',
          '            cliente = _SimpleClient(ZYRA_URL)',
          '            ok_r, datos_r, error_r = cliente.post("/identity/register", {"kind": __KIND__, "name": nombre})',
          '            if not ok_r:',
          '                self._send(502, "application/json", json.dumps({"ok": False, "error": "La Red rechazo el registro: " + str(error_r)[:200]}).encode("utf-8"))',
          '                return',
          '            zid = ""',
          '            if isinstance(datos_r, dict):',
          '                d = datos_r.get("data") or datos_r',
          '                if isinstance(d, dict):',
          '                    zid = str(d.get("zid") or d.get("identity_id") or d.get("id") or "")',
          '            if not zid:',
          '                self._send(500, "application/json", json.dumps({"ok": False, "error": "La Red no devolvio ZID"}).encode("utf-8"))',
          '                return',
          '            sal = secrets.token_hex(16)',
          '            hash_clave = hashlib.sha256((sal + clave).encode("utf-8")).hexdigest()',
          '            from shared_engines.storage.database import SQLiteAdapter',
          '            db_path = str(DATA_DIR / "credenciales.db")',
          '            import sqlite3',
          '            con = sqlite3.connect(db_path)',
          '            con.execute("CREATE TABLE IF NOT EXISTS credenciales (zid TEXT PRIMARY KEY, sal TEXT, hash TEXT)")',
          '            con.execute("INSERT OR REPLACE INTO credenciales VALUES (?, ?, ?)", (zid, sal, hash_clave))',
          '            con.commit()',
          '            con.close()',
          '            self._send(200, "application/json", json.dumps({"ok": True, "zid": zid}).encode("utf-8"))',
          '            return',
          '',
          ]
          BLOQUE_GET_REG = [
          '        if path == "/registro":',
          '            self._send_html(200, self._read_portal("registro.html").decode("utf-8"))',
          '            return',
          ]
          BLOQUE_ENTRAR_NUEVO = [
          '        if path == "/entrar":',
          '            largo = int(self.headers.get("Content-Length", 0) or 0)',
          '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
          '            from urllib.parse import unquote_plus as _uq',
          '            zid = ""',
          '            clave = ""',
          '            for par in crudo.split("&"):',
          '                if "=" in par:',
          '                    k, v = par.split("=", 1)',
          '                    if k == "zid":',
          '                        zid = _uq(v).strip()',
          '                    elif k == "clave":',
          '                        clave = _uq(v).strip()',
          '            owner = os.environ.get("ZYRA_OWNER_ZID", "")',
          '            clave_req = os.environ.get("ZYRA_CLAVE_DUENO", "")',
          '            if zid == owner and clave_req:',
          '                if clave != clave_req:',
          '                    self._send_html(403, self._pagina_entrar("Clave de dueno incorrecta."))',
          '                    return',
          '                self.send_response(303)',
          '                self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800; HttpOnly")',
          '                self.send_header("Location", "/")',
          '                self.end_headers()',
          '                return',
          '            import sqlite3',
          '            db_path = str(DATA_DIR / "credenciales.db")',
          '            cred = None',
          '            try:',
          '                con = sqlite3.connect(db_path)',
          '                fila = con.execute("SELECT sal, hash FROM credenciales WHERE zid = ?", (zid,)).fetchone()',
          '                con.close()',
          '                if fila:',
          '                    hash_calc = hashlib.sha256((fila[0] + clave).encode("utf-8")).hexdigest()',
          '                    if hash_calc == fila[1]:',
          '                        cred = zid',
          '            except Exception:',
          '                cred = None',
          '            if cred:',
          '                self.send_response(303)',
          '                self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800; HttpOnly")',
          '                self.send_header("Location", "/")',
          '                self.end_headers()',
          '                return',
          '            if not owner or not clave_req:',
          '                self._send_html(503, self._pagina_entrar("Acceso de dueno no configurado en el servidor."))',
          '                return',
          '            self._send_html(403, self._pagina_entrar(',
          '                "ZID no reconocido o clave incorrecta. Registrate primero en Registro."))',
          '            return',
          ]
          VIEJO_ENTRAR = [
          '        if path == "/entrar":',
          '            largo = int(self.headers.get("Content-Length", 0) or 0)',
          '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
          '            from urllib.parse import unquote_plus as _uq',
          '            zid = ""',
          '            clave = ""',
          '            for par in crudo.split("&"):',
          '                if "=" in par:',
          '                    k, v = par.split("=", 1)',
          '                    if k == "zid":',
          '                        zid = _uq(v).strip()',
          '                    elif k == "clave":',
          '                        clave = _uq(v).strip()',
          '            owner = os.environ.get("ZYRA_OWNER_ZID", "")',
          '            clave_req = os.environ.get("ZYRA_CLAVE_DUENO", "")',
          '            if not owner or not clave_req:',
          '                self._send_html(503, self._pagina_entrar(',
          '                    "Acceso no configurado en el servidor."))',
          '                return',
          '            if zid != owner:',
          '                self._send_html(403, self._pagina_entrar(',
          '                    "SOLO_EL_PROPIETARIO_PUEDE_ENTRAR. El registro publico llegara con la Red."))',
          '                return',
          '            if clave != clave_req:',
          '                self._send_html(403, self._pagina_entrar("Clave incorrecta."))',
          '                return',
          '            self.send_response(303)',
          '            self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800; HttpOnly")',
          '            self.send_header("Location", "/")',
          '            self.end_headers()',
          '            return',
          ]
          viejo_entrar = '\n'.join(VIEJO_ENTRAR)
          n_ve = t0sp.count(viejo_entrar)
          add('- bloque /entrar viejo localizado: %d' % n_ve)
          gate('bloque_entrar_unico', n_ve == 1)
          if n_ve != 1:
              add('**ENTRAR NO IDENTIFICADO: nada editado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseD4c.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              try:
                  if proc.poll() is None:
                      proc.terminate()
                      proc.wait(timeout=10)
              except Exception:
                  try:
                      proc.kill()
                  except Exception:
                      pass
              raise SystemExit('ENTRAR NO UNICO - sin cambios')
          t = t0sp
          t = t.replace(viejo_entrar, '\n'.join(BLOQUE_ENTRAR_NUEVO), 1)
          ancla_get = '        if path == "/verificar":'
          pos = t.find(ancla_get)
          t = t[:pos] + '\n'.join(BLOQUE_GET_REG) + '\n' + t[pos:]
          ancla_post = '    def do_POST(self):'
          pos = t.find(ancla_post)
          fin_def = t.find('\n\n    def log_message', pos)
          if fin_def == -1:
              fin_def = len(t)
          zona_post = t[pos:fin_def]
          insertar_post = '\n'.join(BLOQUE_POST) + '\n'
          nuevo_post = zona_post.replace('        if path == "/verify":', insertar_post + '        if path == "/verify":', 1)
          if nuevo_post == zona_post:
              nvp = '        for prefix, info in APPS.items():'
              pzp = zona_post.find(nvp)
              if pzp == -1:
                  gate('post_editado', False)
              else:
                  nuevo_post = zona_post[:pzp] + insertar_post + zona_post[pzp:]
                  gate('post_editado', True)
          else:
              gate('post_editado', True)
          t = t[:pos] + nuevo_post + t[fin_def:]
          t = t.replace('__KIND__', KIND, 1)
          ancla_import = 'import json\nimport os'
          if 'hashlib' not in t.split('def _sesion')[0]:
              t = t.replace('import json\nimport os', 'import hashlib\nimport json\nimport os', 1)
          if 'import secrets' not in t[:2000]:
              t = t.replace('import json\nimport os', 'import json\nimport os\nimport secrets', 1)
          SP_FILE.write_text(t, encoding='utf-8')
          add('- /entrar: dueno con su clave de Render, usuarios con ZID+clave de credenciales.db.')
          add('- /registro/nuevo: llama a la Red, guarda solo hash+sal de la clave.')
          add('- kind usado: ' + KIND)
          add('')

          add('## X5. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(SP_FILE), doraise=True)
              add('- py_compile: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## X6. PRUEBA COMPLETA: registrar, entrar con clave, app reconoce')
          add('')
          sp = None
          spv = False
          if comp and vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- superapp arriba: %s' % spv)
          gate('superapp_arriba', spv)
          zid_prima = ''
          if spv:
              req = urllib.request.Request(BSP + '/registro/nuevo', data=json.dumps({'nombre': 'Prima de Prueba', 'clave': 'clave-prima-9999'}).encode('utf-8'), headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      st, cuerpo = r.status, r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  st, cuerpo = e.code, e.read().decode('utf-8', errors='replace')
              try:
                  j = json.loads(cuerpo)
                  zid_prima = j.get('zid', '')
              except Exception:
                  j = {}
              add('- registrar prima -> %s | zid=%s' % (st, zid_prima or 'NINGUNO'))
              gate('prima_registrada', st == 200 and zid_prima)
              if zid_prima:
                  st, h, b = pedir(BSP + '/entrar', data=('zid=' + urllib.parse.quote(zid_prima) + '&clave=clave-prima-9999').encode('utf-8'))
                  sc = (h.get('Set-Cookie') or '').split(';')[0] if h else ''
                  entra = (st == 303 and sc)
                  add('- prima entra con su ZID+clave -> %s %s' % (st, 'OK' if entra else 'FALLO'))
                  gate('prima_entrar', entra)
                  if entra:
                      st, _h, b = pedir(BSP + '/laboratorio/ui', {'Cookie': sc})
                      add('- laboratorio con sesion de prima -> %s (200 esperado, rol espectador)' % st)
                      gate('prima_en_lab', st == 200)
                      st, _h, b = pedir(BSP + '/', {'Cookie': sc})
                      add('- portal muestra Conectado para prima -> %s' % ('OK' if ('Conectado: ' + zid_prima) in b else 'FALLO'))
                      gate('prima_conectada', ('Conectado: ' + zid_prima) in b)
              st, _h, b = pedir(BSP + '/entrar', data=('zid=' + zid_prima + '&clave=MALA').encode('utf-8'))
              add('- clave mala de la prima -> %s (403) %s' % (st, 'OK' if st == 403 else 'FALLO'))
              gate('prima_clave_mala', st == 403)
          else:
              gate('prima_registrada', False)
              gate('prima_entrar', False)
              gate('prima_en_lab', False)
              gate('prima_conectada', False)
              gate('prima_clave_mala', False)
          add('')

          criticos = ('kind_encontrado', 'bloque_entrar_unico', 'post_editado', 'compila', 'superapp_arriba', 'prima_registrada', 'prima_entrar', 'prima_en_lab', 'prima_conectada', 'prima_clave_mala')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos):
              revertir()
              add('## REVERSION APLICADA - restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES]
          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**REGISTRO COMPLETO VERIFICADO: la Red crea el ZID, el usuario su clave, entra y las apps lo reconocen. Commit.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseD4c.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D4c terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal/registro.html
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(registro): ZID de la Red + clave del usuario, acceso a apps con permiso"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseD4c-zyra
          path: faseD4c.json
          if-no-files-found: ignore
