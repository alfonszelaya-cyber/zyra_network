name: "ZYRA AUDIT RED-9 (IA plugable)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: P1 - ai/engine.py completo
        run: |
          {
          echo "## ai/engine.py COMPLETO (numerado)"
          echo '```python'
          awk '{printf "%5d| %s\n", NR, $0}' shared_engines/ai/engine.py 2>/dev/null | head -280 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P2 - estructura del modulo ai
        run: |
          {
          echo "## archivos ai + clases/defs"
          echo '```'
          find shared_engines/ai -name "*.py" | sort || true
          echo ""
          grep -rn "^class \|    def \|^def " shared_engines/ai --include='*.py' | grep -v tests | head -40 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P3 - patron de construccion en tests
        run: |
          {
          echo "## test_ai.py: tests y construccion del engine"
          echo '```python'
          grep -n "def test_" shared_engines/ai/tests/test_ai.py 2>/dev/null | head -20 || true
          echo ""
          L=$(grep -n "AIEngine(" shared_engines/ai/tests/test_ai.py | head -1 | cut -d: -f1 || true)
          if [ -n "$L" ]; then
            s=$((L-12)); [ "$s" -lt 1 ] && s=1
            awk -v a="$s" -v b="$((L+28))" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' shared_engines/ai/tests/test_ai.py
          fi
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P4 - rutas ai en la API (hay o no hay)
        run: |
          {
          echo "## rutas ai en API"
          echo '```'
          grep -n '"ai"\|ai/analyze\|_handle_ai\|AIEngine' shared_engines/runtime/api.py shared_engines/runtime/capabilities_api.py shared_engines/runtime/combined_api.py 2>/dev/null | head -12 || true
          echo "(vacio = no hay rutas, RED-9 las agrega)"
          echo '```'
          echo "## AIEngine en capabilities (ya instanciado?)"
          echo '```'
          grep -n "AIEngine" shared_engines/runtime/capabilities.py | head -5 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
