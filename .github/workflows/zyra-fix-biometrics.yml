name: "ZYRA FASE1-b2 dump RateLimiter + RuntimeConfig + emergencias_e2e (solo lectura para AX-2)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "[LECTURA] dump RateLimiter + RuntimeConfig + ZYRA_RATE_LIMIT"
        run: |
          python3 << 'PYEOF'
          import os, pathlib
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          out("## 1. combined_api.py COMPLETO (aqui vive el RateLimiter)")
          p = pathlib.Path("shared_engines/runtime/combined_api.py")
          if p.exists():
              out("```python")
              out(p.read_text(encoding="utf-8", errors="replace"))
              out("```")
          else:
              out("- NO EXISTE")
          out("## 2. config.py COMPLETO (RuntimeConfig)")
          p = pathlib.Path("shared_engines/runtime/config.py")
          if p.exists():
              out("```python")
              out(p.read_text(encoding="utf-8", errors="replace"))
              out("```")
          else:
              out("- NO EXISTE")
          out("## 3. Grep ZYRA_RATE_LIMIT / RateLimiter en shared_engines + axis")
          for base in ("shared_engines", "apps/axis"):
              bp = pathlib.Path(base)
              if not bp.exists():
                  continue
              for f in sorted(bp.rglob("*.py")):
                  try:
                      txt = f.read_text(encoding="utf-8",
                                        errors="replace")
                  except Exception:
                      continue
                  for i, ln in enumerate(txt.split("\n"), 1):
                      if ("ZYRA_RATE_LIMIT" in ln
                              or "RateLimiter(" in ln):
                          out("- " + str(f) + ":" + str(i)
                              + ": " + ln.strip()[:150])
          PYEOF
          exit 0

      - name: "[LECTURA] dump test_axis_emergencias_e2e.py COMPLETO (para AX-2)"
        run: |
          python3 << 'PYEOF'
          import os, pathlib
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          p = pathlib.Path("apps/axis/tests/test_axis_emergencias_e2e.py")
          out("## test_axis_emergencias_e2e.py COMPLETO (lineas 140-260)"
              " — las fallas estan en 169 y 220")
          if p.exists():
              lines = p.read_text(encoding="utf-8",
                                  errors="replace").split("\n")
              ini = max(0, len(lines) - 400)
              out("```python")
              out("\n".join(str(i + 1) + ": " + ln
                            for i, ln in enumerate(lines)))
              out("```")
          else:
              out("- NO EXISTE")
          PYEOF
          exit 0

      - name: "[LECTURA] confirmar linea exacta de los 2 asserts que fallan"
        run: |
          python3 << 'PYEOF'
          import os, pathlib, re
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          p = pathlib.Path("apps/axis/tests/test_axis_emergencias_e2e.py")
          if not p.exists():
              print("NO EXISTE", flush=True)
              raise SystemExit(0)
          SUM2 = os.environ.get("GITHUB_STEP_SUMMARY", "")
          lines = p.read_text(encoding="utf-8",
                              errors="replace").split("\n")
          out2 = SUM2
          def out(t):
              print(t, flush=True)
              if out2:
                  with open(out2, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          out("## Lineas exactas 160-230 del archivo (alrededor de los"
              " asserts 169 y 220)")
          out("```python")
          for i in range(159, min(230, len(lines))):
              out(str(i + 1) + ": " + lines[i])
          out("```")
          PYEOF
          exit 0
