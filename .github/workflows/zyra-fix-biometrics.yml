name: ZYRA S2n insercion definitiva sin reversion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseS2n:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography pyyaml pillow
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: D24 iconos
        run: |
          python3 - <<'PYEOF'
          from PIL import Image
          from pathlib import Path
          ROOT = Path.cwd()
          PT = ROOT / 'portal'
          APPS_DIR = ROOT / 'apps'
          EXT = ('.png', '.jpg', '.jpeg', '.webp')
          def imagen_en(carpeta):
              if not carpeta.is_dir():
                  return None
              mejor = None
              for c in sorted(carpeta.iterdir()):
                  if c.is_file() and c.suffix.lower() in EXT and c.stat().st_size > 20000:
                      if 'icon' not in c.name.lower():
                          if mejor is None or c.stat().st_size > mejor.stat().st_size:
                              mejor = c
              return mejor
          principal = None
          for c in sorted(ROOT.iterdir()):
              if c.is_file() and c.suffix.lower() in EXT and c.stat().st_size > 200000 and 'icon' not in c.name.lower():
                  principal = c
                  break
          if principal:
              im = Image.open(principal).convert('RGBA')
              w, h = im.size
              lado = min(w, h)
              im = im.crop(((w - lado) // 2, (h - lado) // 2, (w - lado) // 2 + lado, (h - lado) // 2 + lado))
              im.resize((192, 192), Image.LANCZOS).save(PT / 'icon-192.png')
              im.resize((512, 512), Image.LANCZOS).save(PT / 'icon-512.png')
              print('icono principal desde', principal.name)
          MAPA = [('/mpe', 'mi_primer_empleo'), ('/agro', 'agro'),
                  ('/axis', 'eje'), ('/semilla', 'semilla'),
                  ('/nexo', 'nexo'), ('/subastas', 'subastas'),
                  ('/ciclo', 'ciclo_digital'), ('/laboratorio', 'laboratorio')]
          for pref, carp in MAPA:
              img = imagen_en(APPS_DIR / carp)
              if img:
                  im = Image.open(img).convert('RGBA')
                  w, h = im.size
                  lado = min(w, h)
                  im = im.crop(((w - lado) // 2, (h - lado) // 2, (w - lado) // 2 + lado, (h - lado) // 2 + lado))
                  im.resize((256, 256), Image.LANCZOS).save(PT / ('icon-app' + pref.replace('/', '-') + '.png'))
                  print('icono', pref)
          print('Iconos OK')
          PYEOF
      - name: Rutas y pantalla subastas
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          ROOT = Path.cwd()
          SB = ROOT / 'apps' / 'subastas' / 'server.py'
          SPY = ROOT / 'superapp.py'
          t0 = SB.read_text(encoding='utf-8', errors='replace')
          t_sp = SPY.read_text(encoding='utf-8', errors='replace')
          RUTA = 'if path == "/subastas/permiso":'
          n = t0.count(RUTA)
          if n == 0:
              A = '    def do_POST(self) -> None:'
              HANDLER = '\n'.join([
              '        if path == "/subastas/permiso":',
              '            try:',
              '                zid_h = (self.headers.get("x-zyra-zid") or "").strip()',
              '                aprobado = bool(zid_h)',
              '                motivo = ""',
              '                if not aprobado:',
              '                    try:',
              '                        dd = self._read_json() or {}',
              '                    except Exception:',
              '                        dd = {}',
              '                    z = str(dd.get("zid", "")).strip()',
              '                    c = str(dd.get("clave", ""))',
              '                    owner = os.environ.get("ZYRA_OWNER_ZID", "")',
              '                    clave_o = os.environ.get("ZYRA_CLAVE_DUENO", "")',
              '                    if owner and z == owner and clave_o and c == clave_o:',
              '                        aprobado = True',
              '                    elif not owner or not clave_o:',
              '                        motivo = "Servidor sin credenciales de propietario configuradas"',
              '                    else:',
              '                        motivo = "ZID o clave no autorizados. Inicia sesion en la SuperApp."',
              '                if aprobado:',
              '                    self._send_json(200, {"aprobado": True, "rol": "comprador"})',
              '                else:',
              '                    self._send_json(200, {"aprobado": False, "error": motivo})',
              '            except Exception as exc:',
              '                self._send_json(200, {"aprobado": False, "error": "ERR: " + repr(exc)[:200]})',
              '            return',
              '',
              ])
              p = t0.find(A)
              fin = p + len(A) + 1
              t0 = t0[:fin] + HANDLER + t0[fin:]
              SB.write_text(t0, encoding='utf-8')
              print('ruta insertada')
          else:
              print('ruta ya presente')
          if 'if path in ("/", "/subastas", "/subastas/"):' in t0 and 'ERR home' not in t0:
              VIEJO_R = '            if path in ("/", "/subastas", "/subastas/"):'
              NUEVO_R = '\n'.join([
              '            if path in ("/", "/subastas", "/subastas/"):',
              '                try:',
              '                    self._send_html(200, self._home())',
              '                except Exception as exc:',
              '                    self._send_html(500, "<pre>ERR home: " + repr(exc)[:400] + "</pre>")',
              ])
              t0 = SB.read_text(encoding='utf-8', errors='replace')
              t0 = t0.replace(VIEJO_R + '\n                self._send_html(200, self._home())\n                return',
                              NUEVO_R + '\n                return', 1)
              SB.write_text(t0, encoding='utf-8')
              print('try/except raiz')
          import py_compile
          py_compile.compile(str(SB), doraise=True)
          py_compile.compile(str(SPY), doraise=True)
          print('compila OK')
          PYEOF
      - name: Commit SIEMPRE
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal apps/subastas/server.py
          git commit -m "feat(S2n): ruta permiso definitiva + iconos del dueno" || echo "sin cambios"
          git push
          echo "## Commit aplicado - ver en el celular" >> "$GITHUB_STEP_SUMMARY"
