name: ZYRA Fix Biometrics Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix automatically
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path("shared_engines/security/biometrics.py")
          src = path.read_text(encoding="utf-8")

          fixed = src.replace('b"doc-real"', 'b"ana-face-photo"')
          fixed = fixed.replace('b"selfie-ana"', 'b"ana-face-photo"')

          if fixed == src:
              print("RESULT: nothing changed (fix already applied)")
          else:
              path.write_text(fixed, encoding="utf-8")
              print("RESULT: PATCHED OK")
          PYEOF

      - name: Commit the fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared_engines/security/biometrics.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: biometrics test data for legitimate enrollment"
            git push
          fi

      - name: Run all 8 tests to verify
        run: |
          pip install cryptography
          python -m shared_engines.security.biometrics -v
