name: "AGRO SCAN TOTAL: clasificacion de cada archivo vivo/importado/duplicado/vacio (solo lectura)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - ESCAN TOTAL: cada archivo clasificado + duplicados exactos + candidatos a borrar"
        run: |
          python3 - <<'SCANEOF'
          import hashlib
          import re
          from collections import defaultdict
          from pathlib import Path

          OUT = "agro_scan_total.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          app = Path("apps/agro")

          # 1) recolectar todos los .py
          archivos = {}
          for p in sorted(app.rglob("*.py")):
              if "__pycache__" in p.parts:
                  continue
              t = p.read_text(
                  encoding="utf-8", errors="ignore")
              archivos[p] = t

          log("total archivos .py: " + str(len(archivos)))

          # 2) contenido (para detectar codigo real vs vacio)
          con_codigo = {
              p: t for p, t in archivos.items()
              if t.strip()
          }
          vacios = {
              p for p, t in archivos.items()
              if not t.strip()
          }

          # 3) grafo de imports (quien importa a quien)
          def resolve_rel(src, ndots, modpath):
              d = src.parent
              for _ in range(ndots - 1):
                  d = d.parent
              target = d
              if modpath:
                  target = d / modpath.replace(".", "/")
              for c in (target.with_suffix(".py"),
                        target / "__init__.py"):
                  if c.exists():
                      return c
              return None

          def resolve_abs(mod):
              base = Path(
                  mod.replace(".", "/"))
              for c in (base.with_suffix(".py"),
                        base / "__init__.py"):
                  if c.exists():
                      return c
              return None

          importado_por = defaultdict(set)
          for src, t in archivos.items():
              for m in re.finditer(
                  r'^\s*from\s+((?:\.)+)([\w\.]*)\s+import\s+(.+)$',
                  t, re.M):
                  ndots = len(m.group(1))
                  mod = m.group(2)
                  cands = []
                  if mod:
                      cands.append(
                          resolve_rel(src, ndots, mod))
                  for nm in [
                      x.strip().split(" as ")[0].strip()
                      for x in m.group(3).split(",")]:
                      cands.append(resolve_rel(
                          src, ndots,
                          (mod + "." + nm)
                          if mod else nm))
                  for c in cands:
                      if c and c != src:
                          importado_por[c].add(src)
              for m in re.finditer(
                  r'^\s*from\s+(apps\.agro[\w\.]*)\s+import\s+(.+)$',
                  t, re.M):
                  mod = m.group(1)
                  cands = [resolve_abs(mod)]
                  for nm in [
                      x.strip().split(" as ")[0].strip()
                      for x in m.group(2).split(",")]:
                      cands.append(
                          resolve_abs(mod + "." + nm))
                  for c in cands:
                      if c and c != src:
                          importado_por[c].add(src)
              for m in re.finditer(
                  r'__import__\(\s*"(apps\.agro[\w\.]*)"',
                  t):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      importado_por[c].add(src)
              for m in re.finditer(
                  r'^\s*import\s+(apps\.agro[\w\.]*)',
                  t, re.M):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      importado_por[c].add(src)

          # 4) alcanzables desde server.py
          def alcanzables():
              seen = set()
              work = [app / "server.py"]
              while work:
                  f = work.pop(0)
                  if f in seen or f not in archivos:
                      continue
                  seen.add(f)
                  for src in list(seen):
                      pass
                  for imp in importado_por.get(f, set()):
                      work.append(imp)
                  # caminar hacia adelante: quienes
                  # este archivo importa
                  t = archivos[f]
                  for m in re.finditer(
                      r'^\s*from\s+((?:\.)+)([\w\.]*)\s+import\s+(.+)$',
                      t, re.M):
                      ndots = len(m.group(1))
                      mod = m.group(2)
                      cands = []
                      if mod:
                          c = resolve_rel(f, ndots, mod)
                          if c:
                              cands.append(c)
                      for nm in [
                          x.strip().split(" as ")[0].strip()
                          for x in m.group(3).split(",")]:
                          c2 = resolve_rel(
                              f, ndots,
                              (mod + "." + nm)
                              if mod else nm)
                          if c2:
                              cands.append(c2)
                      for c in cands:
                          if c:
                              work.append(c)
                  for m in re.finditer(
                      r'^\s*from\s+(apps\.agro[\w\.]*)\s+import',
                      t, re.M):
                      c = resolve_abs(m.group(1))
                      if c:
                          work.append(c)
                  for m in re.finditer(
                      r'__import__\(\s*"(apps\.agro[\w\.]*)"',
                      t):
                      c = resolve_abs(m.group(1))
                      if c:
                          work.append(c)
                  for m in re.finditer(
                      r'^\s*import\s+(apps\.agro[\w\.]*)',
                      t, re.M):
                      c = resolve_abs(m.group(1))
                      if c:
                          work.append(c)
              return seen

          vivos = alcanzables()

          # 5) duplicados exactos por hash
          por_hash = defaultdict(list)
          for p, t in con_codigo.items():
              h = hashlib.sha256(
                  t.encode()).hexdigest()
              por_hash[h].append(p)
          dup_exactos = {
              h: ps for h, ps in por_hash.items()
              if len(ps) > 1
          }

          # 6) nombres duplicados (mismo basename con codigo)
          por_nombre = defaultdict(list)
          for p in con_codigo:
              por_nombre[p.name].append(p)
          dups_nombre = {
              n: ps for n, ps in por_nombre.items()
              if len(ps) > 1
          }

          # 7) carpetas paralelas (directorios solo-__init__)
          carpetas_huerfanas = []
          for sub in sorted(app.rglob("*")):
              if not sub.is_dir() or "__pycache__" in sub.parts:
                  continue
              pys = list(sub.iterdir())
              pys = [p for p in pys if p.suffix == ".py"]
              if not pys:
                  continue
              if all(
                  p.name == "__init__.py"
                  and not p.read_text(
                      encoding="utf-8",
                      errors="ignore").strip()
                  for p in pys
              ):
                  # paralela a otra con codigo?
                  hermano = None
                  for otro in con_codigo:
                      if otro.parent == sub.parent and (
                          otro.parent.name == sub.parent.name
                      ):
                          pass
                  carpetas_huerfanas.append(sub)

          log("======== ESCAN TOTAL AGRO ========")
          log("archivos .py: " + str(len(archivos)))
          log("  con codigo : " + str(len(con_codigo)))
          log("  vacios (__init__) : "
              + str(len(vacios)))
          log("  VIVOS desde server: "
              + str(len(vivos & set(con_codigo))))
          log("  importados (usados por otro): "
              + str(len([
                  p for p in con_codigo
                  if p in importado_por
                  and p not in vivos])))
          log("")

          log("======== DUPLICADOS EXACTOS (contenido identico) ========")
          if not dup_exactos:
              log("  NINGUNO")
          for h, ps in dup_exactos.items():
              log("  HASH " + h[:10] + ":")
              for p in ps:
                  log("      " + str(p.relative_to(app)))

          log("")
          log("======== NOMBRES DUPLICADOS (mismo nombre, distinto contenido) ========")
          for n in sorted(dups_nombre):
              log("  " + n + " x"
                  + str(len(dups_nombre[n]))
                  + ":")
              for p in sorted(dups_nombre[n]):
                  marca = "VIVO" if p in vivos else (
                      "importado"
                      if p in importado_por
                      else "sin-uso")
                  log("      ["
                      + marca + "] "
                      + str(p.relative_to(app)))

          log("")
          log("======== CARPETAS SOLO-__init__ (paralelas) ========")
          for c in carpetas_huerfanas:
              log("  " + str(c.relative_to(app)))

          log("")
          log("======== CANDIDATOS A ELIMINAR (con codigo, sin uso, no vivos, no importados, sin tests que los usen) ========")
          tests = {
              p for p in con_codigo
              if "tests" in p.parts
          }
          candidatos = []
          for p in con_codigo:
              if p in vivos or p in importado_por:
                  continue
              if p in tests:
                  continue
              # main.py raiz de app: huérfano conocido
              candidatos.append(p)
          for p in sorted(candidatos):
              log("  " + str(p.relative_to(app)))

          log("")
          log("======== ARCHIVOS VACIOS (solo __init__) ========")
          log("total: " + str(len(vacios))
              + " (estructura de la arquitectura,"
              " se conservan como scaffold)")
          rep.close()
          SCANEOF

      - name: "Paso 2 - veredicto por categoria + artifact"
        uses: actions/upload-artifact@v4
        with:
          name: agro-scan-total
          path: agro_scan_total.txt
          if-no-files-found: warn

      - name: "Resumen"
        run: |
          echo "=============================================="
          echo " ESCAN TOTAL AGRO (solo lectura)"
          echo " Revisa el log y el artifact:"
          echo "  - DUPLICADOS EXACTOS (contenido identico)"
          echo "  - NOMBRES duplicados con marca VIVO/importado/sin-uso"
          echo "  - Carpetas solo-__init__ paralelas"
          echo "  - CANDIDATOS a eliminar (con codigo, sin uso)"
          echo " Con ese reporte decidimos que se borra."
          echo "=============================================="
