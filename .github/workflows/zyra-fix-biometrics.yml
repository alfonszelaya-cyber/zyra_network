          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/registry/services/service_registry.py")
          t = ruta.read_text(encoding="utf-8")
          lineas = t.splitlines(keepends=True)
          cambios = []

          def idx(cond):
              for i, l in enumerate(lineas):
                  if cond(l):
                      return i
              return -1

          inserts_imports = []
          if "GemeloVivo" not in t:
              inserts_imports.append("from apps.laboratorio.infrastructure.providers.simulation_engine import GemeloVivo\n")
          if "ModoCurso" not in t:
              inserts_imports.append("from apps.laboratorio.infrastructure.providers.presentation_remote import ModoCurso, PresentacionRemota\n")
          elif "PresentacionRemota" not in t:
              inserts_imports.append("from apps.laboratorio.infrastructure.providers.presentation_remote import PresentacionRemota\n")
          if "MotorCiudadanos" not in t:
              inserts_imports.append("from apps.laboratorio.infrastructure.providers.citizens_engine import MotorCiudadanos\n")
          if "MotorFisico" not in t:
              inserts_imports.append("from apps.laboratorio.infrastructure.providers.physics_engine import MotorFisico\n")
          if "MotorRenderOrbital" not in t:
              inserts_imports.append("from apps.laboratorio.infrastructure.providers.renderer_3d import MotorRenderOrbital\n")
          if inserts_imports:
              i = idx(lambda l: "simulation_engine import" in l and l.strip().startswith("from"))
              if i < 0:
                  i = idx(lambda l: l.strip().startswith("from apps.laboratorio"))
              if i < 0:
                  raise SystemExit("FATAL: sin ancla de imports")
              indent = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              for j, imp in enumerate(inserts_imports):
                  lineas.insert(i + 1 + j, indent + imp)
              cambios.append("imports: " + str(len(inserts_imports)))

          servicios = [
              ('"gemelo_vivo"', 'c.registrar("gemelo_vivo", lambda _c: GemeloVivo())\n'),
              ('"motor_ciudadanos"', 'c.registrar("motor_ciudadanos", lambda _c: MotorCiudadanos())\n'),
              ('"motor_fisico"', 'c.registrar("motor_fisico", lambda _c: MotorFisico())\n'),
              ('"salidas_universales"', 'c.registrar("salidas_universales", lambda _c: _c.obtener("registro_motores").obtener("display_holo3d"))\n'),
              ('"presentacion_remota"', 'c.registrar("presentacion_remota", lambda _c: PresentacionRemota(_c.obtener("repo_presentaciones"), _c.obtener("salidas_universales")))\n'),
              ('"modocurso"', 'c.registrar("modocurso", lambda _c: ModoCurso(_c.obtener("repo_presentaciones"), _c.obtener("outbox"), _c.obtener("firmador"), _c.obtener("cliente_zyra")))\n'),
              ('"motor_orbital"', 'c.registrar("motor_orbital", lambda _c: MotorRenderOrbital())\n'),
          ]
          for marca, linea in servicios:
              if marca not in t:
                  i = -1
                  for cand in ('c.registrar("motor_monte_carlo"', 'c.registrar("modocurso"',
                               'c.registrar("presentacion_remota"', 'c.registrar("motor_fisico"',
                               'c.registrar("motor_ciudadanos"', 'c.registrar("gemelo_vivo"',
                               'c.registrar("bus"'):
                      i = idx(lambda l, cand=cand: cand in l)
                      if i >= 0:
                          break
                  if i < 0:
                      raise SystemExit("FATAL: sin ancla para " + marca)
                  indent = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
                  lineas.insert(i + 1, indent + linea)
                  cambios.append("servicio " + marca)

          t = "".join(lineas)
          for req in ("GemeloVivo", "ModoCurso", "PresentacionRemota", "MotorCiudadanos",
                      "MotorFisico", "MotorRenderOrbital", '"gemelo_vivo"', '"modocurso"',
                      '"presentacion_remota"', '"motor_orbital"', '"motor_ciudadanos"',
                      '"motor_fisico"', '"salidas_universales"'):
              if req not in t:
                  raise SystemExit("FATAL: falta " + req)
          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("service_registry: " + ("; ".join(cambios) if cambios else "ya al dia") + " - verificado")
          PYEOF

