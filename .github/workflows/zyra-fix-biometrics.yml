      - name: "[ESCRITURA tests + LECTURA veredicto] NG12 tests runtime + HTTP menus"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          mkdir -p apps/nexo/tests
          cat > apps/nexo/tests/test_ng12_runtime.py << 'TSEOF'
          import json, pathlib, pytest, threading, urllib.request, urllib.error
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.services.runtime import NexoRuntime
          from apps.nexo.services.menu_server_patch import apply_menu_routes

          def test_runtime_emit_status_classify(tmp_path):
              rt = NexoRuntime(db=SQLiteAdapter(tmp_path / "rt.db"),
                  clock=FrozenClock())
              r = rt.emit("NEXO_PAYMENT_RECEIVED",
                  company_id="EMP-1",
                  payload={"amount": "10"})
              assert r["buffered"] is True
              assert rt.bus.pending() == 1
              with pytest.raises(ValueError):
                  rt.emit("EVENTO_FALSO")
              c = rt.classify_document(
                  "factura de venta de servicios")
              assert c["category"] == "venta"
              st = rt.status()
              assert st["currency_mode"] == "static_fallback"
              assert st["events_pending"] == 1
              assert len(rt.drain_events()) == 1
              a = rt.audit_event(event="PRUEBA", actor="sys",
                  entity="EMP-1")
              assert a["recorded"] is True
              print("OK runtime: eventos+IA+audit+status")

          def test_menus_http_endpoint():
              class Dummy(BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(404)
                      self.end_headers()
                  def log_message(self, *a):
                      pass
              apply_menu_routes(Dummy)
              srv = HTTPServer(("127.0.0.1", 0), Dummy)
              port = srv.server_address[1]
              th = threading.Thread(target=srv.serve_forever,
                                    daemon=True)
              th.start()
              try:
                  with urllib.request.urlopen(
                          "http://127.0.0.1:%d/nexo/menus" % port,
                          timeout=5) as resp:
                      data = json.loads(resp.read().decode())
                  assert data["total"] == 149
                  with urllib.request.urlopen(
                          "http://127.0.0.1:%d/nexo/menus/"
                          "accounting.asientos" % port,
                          timeout=5) as resp:
                      one = json.loads(resp.read().decode())
                  assert one["menu_id"] == "accounting.asientos"
                  fell = False
                  try:
                      urllib.request.urlopen(
                          "http://127.0.0.1:%d/nexo/otra-cosa"
                          % port, timeout=5)
                      fell = True
                  except urllib.error.HTTPError as e:
                      fell = (e.code == 404)
                  assert fell is True
              finally:
                  srv.shutdown()
              print("OK HTTP menus: lista 149 + uno + fallthrough")

          def test_server_inyectado():
              src = (pathlib.Path(__file__).resolve().parents[1]
                     / "server.py").read_text(encoding="utf-8")
              assert "/nexo/menus" in src
              print("OK server.py: bloque /nexo/menus presente")
          TSEOF
          timeout 120 python3 -m pytest apps/nexo/tests/test_ng12_runtime.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/ng12.out 2>&1
          echo $? > /tmp/ng12
          if [ "$(cat /tmp/ng12)" = "0" ]; then echo "- NG12 runtime+HTTP menus: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- NG12: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### NG12 detalle"; echo '```'; tail -80 /tmp/ng12.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] NGX regresion completa (valida inyeccion server + datetime)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc1.out 2>&1
          echo $? > /tmp/ngxc1
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=short > /tmp/ngxc2.out 2>&1
          echo $? > /tmp/ngxc2
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc3.out 2>&1
          echo $? > /tmp/ngxc3
          for par in "ngxc1 nexo" "ngxc2 shared_engines" "ngxc3 subastas"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- NGX $2: ✅" >> "$SUM"
            else
              echo "- NGX $2: ❌" >> "$SUM"
              { echo "### NGX $2 detalle"; echo '```'; tail -100 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          if [ "$(cat /tmp/ngxc1)" = "0" ] && [ "$(cat /tmp/ngxc2)" = "0" ] && [ "$(cat /tmp/ngxc3)" = "0" ]; then echo 0 > /tmp/ngxc; else echo 1 > /tmp/ngxc; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si TODO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in ng11 ng12 ngxc; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: NG11+NG12 VERDES — CALIDAD + NEXO EN VIVO**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-NG11+NG12): Calidad (datetime timezone-aware, IdempotencyEngine persistente, 11 test files con glob-import prefix apps.nexo corregido + E2E contable) + Runtime vivo (NexoRuntime eventos/audit/currency/IA, menu_server_patch, inyeccion AST en server.py con join corregido sirviendo /nexo/menus, validada por regresion E2E del server real) (NG11+NG12 verdes — NEXO COMPLETO)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — NG11+NG12 CERRADOS. NEXO TERMINADO EN VERDE. Siguiente etapa: resto de apps (SEMILLA/SUBASTAS/FUTURO/LAB/MPE).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
