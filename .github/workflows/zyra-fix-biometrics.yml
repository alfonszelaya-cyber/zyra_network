name: "RED-4 v2: conectores fuentes publicas (PublicSourceClient + parsers) - import CAP en una linea"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - integrations/engine.py: append PublicSourceClient + parsers (aditivo, al final del archivo)"
        run: |
          python3 - <<'SEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/integrations/"
              "engine.py")
          t = p.read_text(encoding="utf-8")
          if "class PublicSourceClient" in t:
              print("SKIP (ya presente)")
              raise SystemExit(0)
          CUERPO = textwrap.dedent('''\
              class PublicSourceClient:
                  """AX-SOURCES: fetcher de
                  fuentes publicas con cache TTL
                  en memoria. La Red nunca
                  martilla a la fuente; si cae,
                  sirve cache con stale=True.
                  La Red transporta confianza,
                  no carga."""

                  def __init__(
                      self,
                      *,
                      clock: Clock,
                      timeout_seconds: float = (
                          15.0),
                      ttl_seconds: float = (
                          300.0),
                      opener: Callable[
                          [str], bytes] | None = (
                          None),
                  ) -> None:
                      self._clock = clock
                      self._timeout = (
                          timeout_seconds)
                      self._ttl = ttl_seconds
                      self._opener = (
                          opener
                          if opener is not None
                          else self._urlopen)
                      self._cache: dict[
                          str,
                          tuple[float, bytes],
                      ] = {}

                  def _urlopen(
                      self, url: str,
                  ) -> bytes:
                      import urllib.request
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                              "zyra-network/1.0"
                          },
                      )
                      with urllib.request.urlopen(
                          req,
                          timeout=self._timeout,
                      ) as r:
                          return r.read()

                  def fetch(
                      self, url: str,
                  ) -> tuple[bytes, bool]:
                      """Devuelve (body, stale)."""
                      now = self._clock.now()
                      hit = self._cache.get(url)
                      if hit is not None:
                          ts, body = hit
                          if (now - ts) < (
                                  self._ttl):
                              return (
                                  body, False)
                      try:
                          body = self._opener(
                              url)
                      except Exception:
                          if hit is not None:
                              return (
                                  hit[1], True)
                          raise
                      self._cache[url] = (
                          now, body)
                      return body, False


              def parse_geojson_summary(
                  body: bytes,
              ) -> dict[str, object]:
                  """Resumen ligero de capa
                  ArcGIS/GeoJSON."""
                  import hashlib
                  import json
                  data = json.loads(
                      body.decode("utf-8"))
                  if data.get("type") not in (
                      "FeatureCollection",
                      "Feature",
                  ):
                      raise ValueError(
                          "expected GeoJSON")
                  features = data.get(
                      "features", [])
                  if data.get("type") == (
                      "Feature"
                  ):
                      features = [data]
                  return {
                      "kind": "geojson",
                      "features": len(features),
                      "sha256": hashlib.sha256(
                          body).hexdigest(),
                  }


              def parse_json_source(
                  body: bytes,
              ) -> dict[str, object]:
                  """Resumen de fuente JSON
                  publica (ONEC etc.)."""
                  import hashlib
                  import json
                  data = json.loads(
                      body.decode("utf-8"))
                  if isinstance(data, list):
                      return {
                          "kind": "json",
                          "items": len(data),
                          "sha256": hashlib.sha256(
                              body).hexdigest(),
                      }
                  if isinstance(data, dict):
                      return {
                          "kind": "json",
                          "keys": sorted(
                              str(k) for k in
                              data.keys())[:12],
                          "sha256": hashlib.sha256(
                              body).hexdigest(),
                      }
                  raise ValueError(
                      "unexpected json shape")


              def parse_cap_alerts(
                  body: bytes,
              ) -> dict[str, object]:
                  """Resumen de alertas CAP
                  (XML de Proteccion Civil)."""
                  import hashlib
                  import xml.etree.ElementTree as ET
                  root = ET.fromstring(body)
                  parts = root.tag.split("}")
                  ns = (parts[0][1:]
                        if len(parts) == 2
                        else "")
                  q = (lambda tag:
                       ((ns + tag) if ns
                        else tag))
                  alerts = []
                  for info in root.iter(
                      q("info")
                  ):
                      ev = info.find(q("event"))
                      sev = info.find(
                          q("severity"))
                      alerts.append({
                          "event": (
                              ev.text
                              if ev is not None
                              else ""),
                          "severity": (
                              sev.text
                              if sev is not None
                              else ""),
                      })
                  return {
                      "kind": "cap",
                      "alerts": alerts[:20],
                      "count": len(alerts),
                      "sha256": hashlib.sha256(
                          body).hexdigest(),
                  }
          ''')
          BLOQUE = CUERPO.rstrip("\n")
          t = (t.rstrip("\n") + "\n\n"
               + BLOQUE + "\n")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK PublicSourceClient + 3 parsers"
                " (AST valido)")
          SEOF

      - name: "Paso B - verificacion dura inmediata"
        run: |
          python3 -c "
          from shared_engines.integrations.engine import (
              IntegrationsEngine, PublicSourceClient,
              parse_geojson_summary, parse_json_source,
              parse_cap_alerts)
          for m in ('register_adapter', 'register_handler',
                    'invoke', 'health'):
              assert hasattr(IntegrationsEngine, m), m
          for m in ('fetch',):
              assert hasattr(PublicSourceClient, m), m
          import json
          s = parse_geojson_summary(json.dumps({
              'type': 'FeatureCollection',
              'features': [{}, {}, {}]}).encode())
          assert s['features'] == 3
          assert s['kind'] == 'geojson'
          print('OK: clase + parsers vivos; engine intacto')
          "

      - name: "Paso C - tests (fixtures locales, cero llamadas reales)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/integrations/tests/"
              "test_integrations.py")
          t = p.read_text(encoding="utf-8")
          if ("test_public_source_cache"
                  "_and_stale" in t):
              print("SKIP tests (ya presentes)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_public_source_cache_and_stale(
                  tmp_path: Path,
              ) -> None:
                  """AX-SOURCES: cache TTL evita
                  martillar la fuente; si cae,
                  sirve cache con stale=True."""
                  import hashlib
                  from shared_engines.integrations.engine import (
                      PublicSourceClient)

                  class _Clock:
                      def __init__(self):
                          self.t = 1000.0

                      def now(self):
                          return self.t

                  llamadas = {"n": 0}
                  cuerpo = b'{"ok": true}'

                  def opener(url: str) -> bytes:
                      llamadas["n"] += 1
                      if llamadas["n"] == 2:
                          raise OSError("down")
                      return cuerpo

                  ck = _Clock()
                  cli = PublicSourceClient(
                      clock=ck,
                      ttl_seconds=60.0,
                      opener=opener)
                  b1, stale1 = cli.fetch(
                      "https://fuente.gob/data")
                  assert b1 == cuerpo
                  assert stale1 is False
                  b2, stale2 = cli.fetch(
                      "https://fuente.gob/data")
                  assert b2 == cuerpo
                  assert stale2 is False
                  assert llamadas["n"] == 1, (
                      "cache no uso el TTL")
                  ck.t = 1100.0
                  b3, stale3 = cli.fetch(
                      "https://fuente.gob/data")
                  assert b3 == cuerpo
                  assert stale3 is True
                  assert hashlib.sha256(
                      b3).hexdigest()


              def test_source_adapters_via_engine(
                  tmp_path: Path,
              ) -> None:
                  """AX-SOURCES: fuente publica =
                  adapter en IntegrationsEngine +
                  handler con parser ligero."""
                  import json
                  from shared_engines.integrations.engine import (
                      IntegrationsEngine,
                      parse_geojson_summary)

                  geojson = json.dumps({
                      "type": "FeatureCollection",
                      "features": [
                          {"type": "Feature"},
                          {"type": "Feature"},
                      ],
                  }).encode("utf-8")

                  engine = IntegrationsEngine(
                      SQLiteAdapter(
                          tmp_path / "src.db"),
                      FrozenClock())
                  engine.register_adapter(
                      adapter_id="marn-geo",
                      kind="http-geo",
                      endpoint=(
                          "https://geoportal"
                          ".marn.gob/arcgis"),
                      max_retries=2,
                  )

                  def marn_handler(
                      payload: bytes,
                  ) -> bytes:
                      resumen = (
                          parse_geojson_summary(
                              geojson))
                      return json.dumps(
                          resumen).encode(
                          "utf-8")

                  engine.register_handler(
                      adapter_id="marn-geo",
                      handler=marn_handler,
                  )
                  result = engine.invoke(
                      adapter_id="marn-geo",
                      payload=b"query",
                  )
                  assert result.attempts == 1
                  health = engine.health(
                      adapter_id="marn-geo")
                  assert health.calls == 1
                  assert health.failures == 0


              def test_parsers_lightweight(
                  tmp_path: Path,
              ) -> None:
                  """AX-SOURCES: parsers devuelven
                  RESUMEN + sha256 (Red ligera)."""
                  import json
                  from shared_engines.integrations.engine import (
                      parse_json_source,
                      parse_cap_alerts)

                  one = json.dumps([
                      {"codigo": "011101"},
                      {"codigo": "011102"},
                  ]).encode("utf-8")
                  r = parse_json_source(one)
                  assert r["items"] == 2
                  assert r["kind"] == "json"

                  cap = (
                      "<?xml version='1.0'?>"
                      "<alert>"
                      "<info><event>Lluvia"
                      "</event><severity>Moderate"
                      "</severity></info>"
                      "<info><event>Sequia"
                      "</event><severity>Severe"
                      "</severity></info>"
                      "</alert>"
                  ).encode("utf-8")
                  c = parse_cap_alerts(cap)
                  assert c["count"] == 2
                  assert c["alerts"][0][
                      "event"] == "Lluvia"
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert ("test_public_source_cache"
                  "_and_stale" in final)
          assert ("test_source_adapters"
                  "_via_engine" in final)
          assert "test_parsers_lightweight" in final
          print("OK tests AX-SOURCES (AST valido)")
          TSEOF

      - name: "Paso D - GATE Red (shared_engines completo)"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -8

      - name: "Paso E - GATE apps (4 apps)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso F - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-4 v2"
            echo '```'
            python3 -m pytest shared_engines/integrations/tests/test_integrations.py -vv --tb=long 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-4: conectores de fuentes publicas (PublicSourceClient TTL/stale + parsers GeoJSON/JSON/CAP)" -m "Patron confirmado por auditoria: IntegrationsEngine ya gobierna invocacion externa. RED-4 anade aditivamente: PublicSourceClient (cache TTL en memoria - la Red nunca martilla a la fuente; si cae sirve cache con stale=True) + parsers ligeros (geojson/json/cap) que devuelven RESUMEN + sha256 - la Red guarda el resumen verificado, el dataset va a la app duena (la Red transporta confianza, no carga). Fuentes 🟢: MARN ArcGIS, Proteccion Civil CAP, ONEC clasificadores, SIAM-MAG. Handlers reales se wirean en composition root al desplegar; tests 100% fixtures locales (cero llamadas reales a gobierno). Fix de v1: import xml.etree.ElementTree as ET en una sola linea (v1 lo partia y era SyntaxError)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
