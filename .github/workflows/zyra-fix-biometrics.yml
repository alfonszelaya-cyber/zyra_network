name: "ZYRA AUDIT 5 (diagnostico definitivo)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Rutas person/verification en api.py
        run: |
          echo "=== person ==="
          grep -n "person" shared_engines/runtime/api.py | head -20 || true
          echo "=== verification ==="
          grep -n "verification" shared_engines/runtime/api.py | head -25 || true
          exit 0

      - name: Inventario + fuentes clave (getsource)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import inspect, traceback, types
          from shared_engines.runtime import api as A

          print("========== INVENTARIO ZyraApiHandler ==========")
          for name, obj in vars(A.ZyraApiHandler).items():
              if name.startswith("__"):
                  continue
              if isinstance(obj, staticmethod):
                  kind = "STATIC"
              elif isinstance(obj, classmethod):
                  kind = "CLASS"
              elif isinstance(obj, types.FunctionType):
                  kind = "metodo"
              else:
                  print("  " + name + " [" + type(obj).__name__ + "]")
                  continue
              try:
                  sig = str(inspect.signature(obj.__func__))
              except Exception:
                  sig = "?"
              print("  " + name + sig + " [" + kind + "]")

          def dump(fn, label):
              print("")
              print("========== " + label + " ==========")
              try:
                  print(inspect.getsource(fn))
              except Exception:
                  traceback.print_exc()

          dump(A.ZyraApiHandler._route_post, "_route_post COMPLETO")
          dump(A.ZyraApiHandler._route, "_route COMPLETO")
          for m in ("_read_json", "_req", "_require_str"):
              if hasattr(A.ZyraApiHandler, m):
                  dump(getattr(A.ZyraApiHandler, m), m)

          print("")
          print("========== HANDLERS CON person/verdict/verify_face ==========")
          for name, obj in vars(A.ZyraApiHandler).items():
              if name.startswith("__"):
                  continue
              f = obj.__func__ if isinstance(obj, (staticmethod, classmethod)) else obj
              if not callable(f):
                  continue
              try:
                  src = inspect.getsource(f)
              except Exception:
                  continue
              low = src.lower()
              if "person" in low or "verdict" in low or "verify_face" in low:
                  print("----- " + name + " -----")
                  print(src)
          EOF
          exit 0

      - name: Sonda sweep definitiva
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import inspect, json, pathlib, tempfile, traceback
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.integrations.engine import (
              PublicSourceClient, SourceIndex,
              sweep_onec, sweep_marn, ONEC_ENDPOINTS)

          print("===== SourceIndex.record (fuente) =====")
          try:
              print(inspect.getsource(SourceIndex.record))
          except Exception:
              traceback.print_exc()
          print("===== SQLiteAdapter.transaction (fuente) =====")
          try:
              print(inspect.getsource(SQLiteAdapter.transaction))
          except Exception:
              traceback.print_exc()

          d = pathlib.Path(tempfile.mkdtemp())
          geo = json.dumps({"type": "FeatureCollection", "features": [{"type": "Feature"}, {"type": "Feature"}]}).encode()
          meta = json.dumps({"layers": [{"id": 0, "name": "a"}, {"id": 1, "name": "b"}]}).encode()
          one = json.dumps([{"codigo": "0111101"}]).encode()

          def opener(url):
              if url.endswith("?f=json"):
                  return meta
              if "/query" in url:
                  return geo
              if url.endswith(tuple(ONEC_ENDPOINTS)):
                  return one
              raise OSError("no simulada")

          cli = PublicSourceClient(clock=FrozenClock(), ttl_seconds=60.0, opener=opener)
          idx = SourceIndex(SQLiteAdapter(d / "a.db"), FrozenClock())

          print("===== RECORD DIRECTO (traceback si falla) =====")
          try:
              idx.record(source_id="probe", url="u1", sha256="s1", summary={"sha256": "s1"})
              print("RECORD DIRECTO OK rows:", len(idx._db.query_all("SELECT * FROM source_snapshots")))
          except Exception:
              traceback.print_exc()

          r1 = sweep_onec(cli, idx)
          r2 = sweep_marn(cli, idx, max_layers_per_service=2, pause_seconds=0)
          print("ONEC ok/total:", r1["ok"], r1["total"])
          print("MARN ok/total:", r2["layers_ok"], r2["layers_total"])
          malos = [e for e in (r1["endpoints"] + r2["results"]) if isinstance(e, dict) and e.get("ok") is False]
          print("ERRORES TRAGADOS (" + str(len(malos)) + "):")
          print(json.dumps(malos, default=str)[:2500])
          print("ROWS FINALES ESPERADAS 25 / OBTENIDAS:", len(idx._db.query_all("SELECT * FROM source_snapshots")))
          EOF
          exit 0

      - name: Sonda sanity enroll (SIN wrappers)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import base64, json, threading, time, urllib.request, urllib.error
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          from shared_engines.security.biometrics import BiometricsEngine, BiometricsPolicy, DeterministicTestProvider, TemplateCipher
          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(db=net_db, clock=FrozenClock(), signer=signer, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(db=net_db, clock=FrozenClock(), audit=kernel.audit, provider=DeterministicTestProvider(), cipher=TemplateCipher(master_key_hex="ab" * 32), policy=BiometricsPolicy(require_liveness=False, doc_reject=0.01, doc_review=0.02, doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(net_db, FrozenClock(), identity=kernel.identity, signer=signer)
          srv = serve_combined(kernel, caps, host="127.0.0.1", port=0)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.3)
          base = "http://127.0.0.1:" + str(srv.server_address[1])
          def post(ruta, doc):
              req = urllib.request.Request(base + ruta, data=json.dumps(doc).encode(), method="POST", headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode())
          s = base64.b64encode(b"selfie-pedro-real").decode("ascii")
          st, r1 = post("/identity/enroll", {"kind": "person", "display_name": "Pedro Prueba", "actor": "banco-ny", "doc_image_b64": s, "selfie_image_b64": s})
          print("ENROLL SIN WRAPPERS ->", st, json.dumps(r1)[:220])
          srv.shutdown()
          srv.server_close()
          EOF
          exit 0

      - name: Sonda veredicto definitiva (wrappers correctos + espias 500)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import base64, inspect, json, sys, threading, time, traceback, types, urllib.request, urllib.error
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.common.errors import EngineError
          from shared_engines.runtime import api as A
          from shared_engines.runtime import combined_api as C
          from shared_engines.runtime import responses as R
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          from shared_engines.security.biometrics import BiometricsEngine, BiometricsPolicy, DeterministicTestProvider, TemplateCipher
          from shared_engines.network.portable_profile import ProfileRegistry
          from shared_engines.audit.chain import AuditTrail
          from shared_engines.events.outbox import Outbox

          def tr(f, etiqueta):
              def interno(*a, **k):
                  try:
                      return f(*a, **k)
                  except Exception:
                      print("@@@ EXCEPCION EN " + etiqueta + ":")
                      traceback.print_exc()
                      raise
              return interno

          def envolver(cls):
              for name, obj in list(vars(cls).items()):
                  if name.startswith("__"):
                      continue
                  if isinstance(obj, staticmethod):
                      setattr(cls, name, staticmethod(tr(obj.__func__, cls.__name__ + "." + name + "[static]")))
                  elif isinstance(obj, classmethod):
                      setattr(cls, name, classmethod(tr(obj.__func__, cls.__name__ + "." + name + "[class]")))
                  elif isinstance(obj, types.FunctionType):
                      setattr(cls, name, tr(obj, cls.__name__ + "." + name))
              print("WRAPPER OK:", cls.__name__)

          envolver(A.ZyraApiHandler)
          envolver(C.CombinedHandler)
          envolver(__import__("shared_engines.runtime.capabilities_api", fromlist=["x"]).CapabilitiesApiHandler)

          orig_mee = R.map_engine_error
          def mee_spy(*a, **k):
              try:
                  if a and not isinstance(a[0], EngineError):
                      print("@@@ map_engine_error recibio NO-EngineError:")
                      traceback.print_exception(type(a[0]), a[0], a[0].__traceback__)
              except Exception:
                  pass
              return orig_mee(*a, **k)
          R.map_engine_error = mee_spy
          for m in (A, C):
              if hasattr(m, "map_engine_error"):
                  m.map_engine_error = mee_spy

          class ApiErrorSpy(R.ApiError):
              def __init__(self, *a, **k):
                  if a and a[0] == 500:
                      ei = sys.exc_info()
                      if ei and ei[0] is not None:
                          print("@@@ ApiError(500) fabricado; EXCEPCION ORIGINAL:")
                          traceback.print_exception(*ei)
                      else:
                          print("@@@ ApiError(500) fabricado fuera de except")
                  super().__init__(*a, **k)
          R.ApiError = ApiErrorSpy
          for m in (A, C):
              if hasattr(m, "ApiError"):
                  m.ApiError = ApiErrorSpy
          print("ESPIAS INSTALADOS")

          net_db = SQLiteAdapter(":memory:")
          signer, pub = Ed25519Signer.generate()
          kernel = ZyraKernel(db=net_db, clock=FrozenClock(), signer=signer, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(db=net_db, clock=FrozenClock(), audit=kernel.audit, provider=DeterministicTestProvider(), cipher=TemplateCipher(master_key_hex="ab" * 32), policy=BiometricsPolicy(require_liveness=False, doc_reject=0.01, doc_review=0.02, doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(net_db, FrozenClock(), identity=kernel.identity, signer=signer)
          caps.profiles = ProfileRegistry(net_db, FrozenClock(), audit=AuditTrail(net_db, FrozenClock()), outbox=Outbox(net_db, FrozenClock()))
          caps.profiles.register_app(app_id="banco-ny", display_name="Banco NY", scopes=("display_name", "national_id", "id_country", "id_type", "id_number", "nationality", "birth_date", "address"))
          print("KERNEL attrs con 'bio':", [a for a in vars(kernel) if "bio" in a.lower()])
          print("TRUST vars:", {k: type(v).__name__ for k, v in vars(caps.trust).items()})
          print("TRUST metodos publicos:")
          for name in dir(caps.trust):
              if name.startswith("_"):
                  continue
              fn = getattr(caps.trust, name)
              if callable(fn):
                  try:
                      print("   trust." + name + str(inspect.signature(fn)))
                  except (TypeError, ValueError):
                      print("   trust." + name)
          try:
              print("===== TRUSTFLOW FUENTE COMPLETA =====")
              print(inspect.getsource(type(caps.trust)))
          except Exception:
              traceback.print_exc()

          srv = serve_combined(kernel, caps, host="127.0.0.1", port=0)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.3)
          base = "http://127.0.0.1:" + str(srv.server_address[1])

          def post(ruta, doc):
              req = urllib.request.Request(base + ruta, data=json.dumps(doc).encode(), method="POST", headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode())

          selfie = base64.b64encode(b"selfie-pedro-real").decode("ascii")
          st, r1 = post("/identity/enroll", {"kind": "person", "display_name": "Pedro Prueba", "actor": "banco-ny", "doc_image_b64": selfie, "selfie_image_b64": selfie})
          print("ENROLL:", st, json.dumps(r1)[:200])
          zid = ((r1.get("data") or {}).get("identity") or {}).get("zid")
          print("ZID:", zid)
          caps.profiles.set_field(zid=zid, field="display_name", value="Pedro Prueba", verified=True)
          caps.profiles.set_field(zid=zid, field="id_country", value="SV", verified=True)
          caps.profiles.set_field(zid=zid, field="id_type", value="dui", verified=True)
          caps.profiles.set_field(zid=zid, field="birth_date", value="1992-04-04", verified=True)
          print("SET_FIELD x4 OK")
          st, r2 = post("/verification/person", {"zid": zid, "selfie_b64": selfie, "actor_app": "banco-ny"})
          print("HTTP /verification/person ->", st, json.dumps(r2)[:400])
          print("FIN SONDA VEREDICTO")
          srv.shutdown()
          srv.server_close()
          EOF
          exit 0
