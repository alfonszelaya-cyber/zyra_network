name: "ZYRA RUN3a: auditoria profunda NEXO (N-2..N-7) + AGRO (A-1..A-3) — solo lectura"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] NEXO — estructura, mayor general y firmas de dominios (para N-2..N-7)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA NEXO (RUN 3b escritura)" >> "$SUM"
          echo "### arbol domain (2 niveles)" >> "$SUM"
          { echo '```'; find apps/nexo/domain -maxdepth 2 -type d 2>/dev/null | sort; echo '```'; } >> "$SUM"
          echo "### archivos de engines por dominio contable" >> "$SUM"
          { echo '```'; for d in finance treasury receivables payables assets budget fiscal operations; do echo "-- domain/$d:"; ls apps/nexo/domain/$d 2>/dev/null; done; echo '```'; } >> "$SUM"
          echo "### GeneralLedgerEngine: FUENTE COMPLETA" >> "$SUM"
          GLFILE=$(grep -rl "class GeneralLedgerEngine" apps/nexo --include="*.py" 2>/dev/null | head -1)
          echo "archivo: $GLFILE" >> "$SUM"
          { echo '```python'; cat "$GLFILE" 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### firmas de engines de los 7 dominios (class + def)" >> "$SUM"
          { echo '```'; for d in finance treasury receivables payables assets budget fiscal; do for f in apps/nexo/domain/$d/*.py; do [ -f "$f" ] || continue; case "$f" in *__init__*) continue;; esac; echo "== $f"; grep -n "^class \|    def " "$f" | head -30; done; done; echo '```'; } >> "$SUM"
          echo "### usos de post_balanced y create_entry (quien llama a quien)" >> "$SUM"
          { echo '```'; grep -rn "post_balanced\|create_entry" apps/nexo --include="*.py" 2>/dev/null | grep -v "def post_balanced\|def create_entry" | head -40; echo '```'; } >> "$SUM"
          echo "### tests NEXO (lista)" >> "$SUM"
          { echo '```'; ls apps/nexo/tests/ 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### fin NEXO" >> "$SUM"
          exit 0

      - name: "[LECTURA] AGRO — utcnow, REAL/float, repos en memoria (para A-1..A-3)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA AGRO (RUN 3b escritura)" >> "$SUM"
          echo "### A-3: datetime.utcnow (archivo:linea + contexto)" >> "$SUM"
          { echo '```'; grep -rn "datetime.utcnow" apps/agro --include="*.py" 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### A-2: columnas REAL en CREATE TABLE (dinero como float)" >> "$SUM"
          { echo '```'; grep -rn "REAL" apps/agro --include="*.py" 2>/dev/null | grep -i "create\|price\|amount\|cost\|value\|offer\|total" | head -40; echo '```'; } >> "$SUM"
          echo "### A-2: conversiones float() sobre dinero" >> "$SUM"
          { echo '```'; grep -rn "float(" apps/agro --include="*.py" 2>/dev/null | head -30; echo '```'; } >> "$SUM"
          echo "### A-1: clases Repository (cuales son en memoria)" >> "$SUM"
          { echo '```'; grep -rln "class .*Repository" apps/agro --include="*.py" 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### firma de cada Repository (class + def)" >> "$SUM"
          { echo '```'; for f in $(grep -rln "class .*Repository" apps/agro --include="*.py" 2>/dev/null); do echo "== $f"; grep -n "^class \|    def " "$f" | head -20; done; echo '```'; } >> "$SUM"
          echo "### arbol apps/agro (2 niveles)" >> "$SUM"
          { echo '```'; find apps/agro -maxdepth 2 -type d 2>/dev/null | sort; echo '```'; } >> "$SUM"
          echo "### imports de decimal existentes (quien ya usa Decimal)" >> "$SUM"
          { echo '```'; grep -rln "from decimal import\|import decimal" apps/agro --include="*.py" 2>/dev/null | head -20; echo '```'; } >> "$SUM"
          echo "### fin AGRO" >> "$SUM"
          exit 0

      - name: "[LECTURA] regresion 4 apps (baseline verde antes de tocar NEXO/AGRO)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Sin cambios de codigo (auditoria); fallar si regresion rota"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: regresion rota — REVISAR antes de RUN 3b**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**AUDITORIA COMPLETA — SIN CAMBIOS (correcto). RUN 3b: escribo N-2..N-7 y A-1..A-3 con las fuentes impresas arriba.**"
            exit 0
          fi
          git commit -m "chore(auditoria): limpieza de caches tras regresion verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK (limpieza)**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK. RUN 3b listo.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
