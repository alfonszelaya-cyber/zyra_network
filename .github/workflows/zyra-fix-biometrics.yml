name: "ZYRA Auditoría Forense Biométrica (Nativo)"

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  audit_biometric_core:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout del Repo"
        uses: actions/checkout@v4

      # NO INSTALAMOS PYTHON NI LIBRERÍAS PARA ESTA FASE
      # Usamos bash puro para máxima estabilidad
      
      - name: "EXPLORACIÓN Y AUDITORÍA BIOMÉTRICA PROFUNDA"
        id: audit_step
        run: |
          echo "=========================================="
          echo "INICIANDO AUDITORÍA FORENSE NATIVA ZYRA"
          echo "FECHA: $(date)"
          echo "COMMIT: ${{ github.sha }}"
          echo "=========================================="
          
          mkdir -p /tmp/zyra_audit_reports
          
          # 1. Definir patrones críticos de búsqueda
          # Buscamos archivos que contengan estas palabras clave en su nombre o contenido
          PATTERNS="biometric|bio_id|face_recog|fingerprint|iris|voiceprint|zid_identity|register_person|credential_verify|security_engine|verification_core|sface|deepfake|liveness"
          
          echo "--- BUSCANDO ARCHIVOS CLAVE ---"
          # Primero buscamos por NOMBRE DE ARCHIVO
          find . -type f \( -name "*.py" \) | grep -E "$PATTERNS" > /tmp/zyra_audit_reports/files_by_name.txt || true
          
          # Si no encontramos muchos, buscamos por CONTENIDO dentro de los .py principales
          if [ $(wc -l < /tmp/zyra_audit_reports/files_by_name.txt) -lt 5 ]; then
             echo "[INFO] Pocos archivos por nombre. Escaneando contenido de todos los .py..."
             grep -rlE "$PATTERNS" --include="*.py" . > /tmp/zyra_audit_reports/files_by_content.txt || true
             cat /tmp/zyra_audit_reports/files_by_content.txt >> /tmp/zyra_audit_reports/files_found_combined.txt
          else
             cp /tmp/zyra_audit_reports/files_by_name.txt /tmp/zyra_audit_reports/files_found_combined.txt
          fi
          
          # Eliminar duplicados si los hay
          sort -u /tmp/zyra_audit_reports/files_found_combined.txt -o /tmp/zyra_audit_reports/final_list.txt
          
          TOTAL_FILES=$(wc -l < /tmp/zyra_audit_reports/final_list.txt)
          echo "TOTAL ARCHIVOS RELACIONADOS CON BIOMETRÍA ENCONTRADOS: $TOTAL_FILES"
          echo ""
          
          # 2. Analizar cada archivo encontrado
          while IFS= read -r file_path; do
            if [ -f "$file_path" ] && [ -s "$file_path" ]; then
              filename=$(basename "$file_path")
              echo ""
              echo "============================================================"
              echo "ARCHIVO: $filename"
              echo "RUTA: $file_path"
              echo "LÍNEAS: $(wc -l < "$file_path")"
              echo "============================================================"
              
              # A. Imports Críticos (¿Qué librerías usa?)
              echo "> IMPORTS:"
              grep -E "^import|^from" "$file_path" | head -n 15 || echo "(Sin imports obvios)"
              
              # B. Clases Principales (La estructura OOP)
              echo ""
              echo "> CLASES DEFINIDAS:"
              grep -E "^class\s+\w+" "$file_path" || echo "(No se detectaron clases top-level)"
              
              # C. Funciones/Métodos Públicos (La lógica de negocio)
              echo ""
              echo "> MÉTODOS/FUNCIONES PÚBLICAS:"
              # Mostramos las primeras 10 funciones definidas para ver la interfaz
              grep -E "^\s+(async\s+)?def\s+[a-zA-Z]\w*" "$file_path" | sed 's/^/  /' | head -n 10 || echo "(No se detectaron métodos públicos claros)"
              
              # D. Alertas de Seguridad Rápidas (Hardcoding)
              echo ""
              echo "> ALERTA SEGURIDAD (Strings sospechosos):"
              # Busca asignaciones directas de claves/passwords/tokens
              if grep -qiE "(api_key|secret|password|token|private_key)\s*=\s*[\"'][^\"']{8,}[\"']" "$file_path"; then
                 echo "[CRÍTICO] Posible secreto hardcoded detectado en este archivo."
                 grep -niE "(api_key|secret|password|token|private_key)\s*=\s*[\"'][^\"']{8,}[\"']" "$file_path" | head -n 3
              else
                 echo "OK: Sin secretos obvios en asignaciones simples."
              fi
              
              # E. Referencias a Modelos ONNX o Pesados
              echo ""
              echo "> REFERENCIAS A MODELOS/PESOS:"
              grep -iE "\.onnx|\.pb|\.h5|\.pt|model_|weights_" "$file_path" | head -n 5 || echo "(Sin referencias directas a modelos binarios)"
              
            elif [ ! -f "$file_path" ]; then
               echo "[ERROR] Ruta rota encontrada: $file_path"
            fi
          done < /tmp/zyra_audit_reports/final_list.txt
          
          echo ""
          echo "=========================================="
          echo "FIN DEL ESCANEO ESTÁTICO NATIVO"
          echo "=========================================="

      - name: "Subir Lista de Archivos Encontrados"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra_biometric_file_list
          path: /tmp/zyra_audit_reports/final_list.txt
          retention-days: 7
