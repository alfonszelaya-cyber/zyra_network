                      b = {"current": _D("0"),
                           "1-30": _D("0"),
                           "31-60": _D("0"),
                           "60+": _D("0")}
                      overdue = 0
                      for r in rows:
                          bal = (_D(str(r["amount"]))
                                 - _D(str(r["paid"])))
                          days = int((now
                                      - float(r["due_at"]))
                                     / 86400)
                          if days <= 0:
                              key = "current"
                          elif days <= 30:
                              key = "1-30"
                              overdue = overdue + 1
                          elif days <= 60:
                              key = "31-60"
                              overdue = overdue + 1
                          else:
                              key = "60+"
                              overdue = overdue + 1
                          b[key] = b[key] + bal
                      buckets = {k: str(v)
                                 for k, v in b.items()}
                      total = sum(b.values(), _D("0"))
                      return {"company_id": company_id,
                              "aging": buckets,
                              "total_open": str(total),
                              "overdue_invoices": overdue}

