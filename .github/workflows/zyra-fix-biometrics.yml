                          " quantity > 0 ORDER BY expiry_date,"
                          " rowid",
                          (str(producer_id), str(as_of)))
                      return [{"batch_id": str(
                                   r["batch_id"]),
                               "product": str(r["product"]),
                               "quantity": float(
                                   r["quantity"]),
                               "unit": str(r["unit"]),
                               "expiry_date": str(
                                   r["expiry_date"])}
                              for r in rows]
              '''))
              out("## FIN 5 engines A-4..A-8")
          except Exception:
              out("## ERROR")
