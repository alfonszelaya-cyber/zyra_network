      - name: E2E smoke (patron -> alerta -> investigacion -> bloqueo -> enforcement)
        run: |
          python3 - <<'EOF'
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import uuid

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-test"}, None)
                  return (False, None, "offline")


          def call(method, url, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(
                  url, data=data, method=method,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=5) as r:
                      return json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read()[:300].decode("utf-8", "replace")
                  raise AssertionError("HTTP %s en %s %s -> %s" % (e.code, method, url, body))


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          bad = "ZID-bad-" + uuid.uuid4().hex[:5]
          good = "ZID-good-" + uuid.uuid4().hex[:5]
          store.add_account(account_id=bad, zid=bad, name="Bad")
          store.add_account(account_id=good, zid=good, name="Good")
          store.add_listing(
              listing_id="LST-ok", seller_account=good, seller_zid=good,
              title="Item", description="d", base_price=10.0, document_id="DOC-x",
          )
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          r = call("POST", base + "/subastas/api/riesgo/scan",
                   {"account": bad, "orders_last_hour": 15,
                    "account_age_days": 2, "activity_count": 30,
                    "doc_duplicates": 1})
          assert r["ok"] and len(r["data"]["alerts"]) >= 3, r
          print("1. patrones detectados:", [a["pattern"] for a in r["data"]["alerts"]])

          inv = call("POST", base + "/subastas/api/riesgo/investigacion",
                     {"subject_account": bad, "hypothesis": "actividad fraudulenta",
                      "opener": "gob1"})
          assert inv["ok"] and inv["data"]["status"] == "open", inv
          print("2. investigacion abierta:", inv["data"]["inv_id"])

          blk = call("POST", base + "/subastas/api/riesgo/bloqueo",
                     {"subject_account": bad, "reason": "confirmado", "actor": "gob1"})
          assert blk["ok"] and blk["data"]["status"] == "active", blk
          print("3. cuenta bloqueada")

          try:
              call("POST", base + "/subastas/api/bids",
                   {"listing_id": "LST-ok", "bidder_account": bad, "amount": 20.0})
              raise SystemExit("FALLO: bloqueada pudo ofertar")
          except AssertionError as e:
              assert "bloqueada" in str(e), e
          print("4. bloqueada NO puede ofertar OK")

          ok = call("POST", base + "/subastas/api/bids",
                    {"listing_id": "LST-ok", "bidder_account": good, "amount": 20.0})
          assert ok["ok"], ok
          print("5. cuenta libre SI puede ofertar OK")

          html = urllib.request.urlopen(base + "/subastas/riesgo", timeout=5).read().decode("utf-8")
          assert "Escaneo de patrones" in html and bad in html
          nav = urllib.request.urlopen(base + "/subastas/menu", timeout=5).read().decode("utf-8")
          assert "Riesgo" in nav
          print("E2E SMOKE OK: patron -> alerta -> investigacion -> bloqueo -> enforcement")
          EOF

