name: "ZYRA MARKET (GRUPO B v2): Cartera RLock - fix deadlock"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-gb
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Paso 0 - asegurar carpeta motores"
        run: |
          python3 - <<'DETF'
          from pathlib import Path
          engines = Path("apps/subastas/modules/motores")
          engines.mkdir(parents=True, exist_ok=True)
          init = engines / "__init__.py"
          if not init.exists():
              init.write_text("", encoding="utf-8")
          print("MOTORES OK")
          DETF

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1a - cartera_store.py con RLock"
        run: |
          cat > "apps/subastas/modules/motores/cartera_store.py" <<'CF'
          """MOTOR CARTERA - Traslacion de dinero (NO banco).

          RLock (reentrante) porque deposit/transfer llaman a
          open_wallet dentro del candado. Sin deadlock."""
          from __future__ import annotations

          import threading
          import time
          import traceback
          import uuid


          def _now() -> str:
              return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


          def _nid(prefix: str) -> str:
              return prefix + uuid.uuid4().hex[:10]


          class CarteraStore:
              def __init__(self, db, clock) -> None:
                  self._db = db
                  self._clock = clock
                  self._lock = threading.RLock()
                  self._ensure_schema()

              def _ensure_schema(self) -> None:
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_wallet ("
                      " wal_id TEXT PRIMARY KEY,"
                      " account TEXT UNIQUE NOT NULL,"
                      " balance REAL NOT NULL DEFAULT 0,"
                      " currency TEXT NOT NULL DEFAULT 'USD',"
                      " created_at TEXT NOT NULL,"
                      " updated_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_wallet_moves ("
                      " mov_id TEXT PRIMARY KEY,"
                      " account TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " amount REAL NOT NULL,"
                      " counterparty TEXT,"
                      " note TEXT,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_fx_rates ("
                      " fx_id TEXT PRIMARY KEY,"
                      " from_cur TEXT NOT NULL,"
                      " to_cur TEXT NOT NULL,"
                      " rate REAL NOT NULL,"
                      " updated_by TEXT NOT NULL,"
                      " updated_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_escrow ("
                      " esc_id TEXT PRIMARY KEY,"
                      " order_ref TEXT NOT NULL,"
                      " from_a TEXT NOT NULL,"
                      " to_a TEXT NOT NULL,"
                      " amount REAL NOT NULL,"
                      " status TEXT NOT NULL,"
                      " created_at TEXT NOT NULL,"
                      " released_at TEXT)"
                  )

              def _run(self, sql, params=()):
                  if not params:
                      self._db.execute(sql)
                      return
                  try:
                      self._db.execute(sql, params)
                      return
                  except TypeError:
                      self._db.execute(self._inline(sql, params))

              @staticmethod
              def _inline(sql, params):
                  parts = sql.split("?")
                  if len(parts) != len(params) + 1:
                      return sql
                  assembled = parts[0]
                  for i, v in enumerate(params):
                      assembled += CarteraStore._literal(v)
                      assembled += parts[i + 1]
                  return assembled

              @staticmethod
              def _literal(value):
                  if value is None:
                      return "NULL"
                  if isinstance(value, bool):
                      return "1" if value else "0"
                  if isinstance(value, (int, float)):
                      return repr(value)
                  return "'" + str(value).replace("'", "''") + "'"

              def _rows(self, sql):
                  for name in ("query", "fetchall", "fetch_all", "fetch", "select"):
                      fn = getattr(self._db, name, None)
                      if callable(fn):
                          try:
                              rows = fn(sql)
                              if rows is not None:
                                  return list(rows)
                          except Exception:
                              continue
                  try:
                      cur = self._db.execute(sql)
                  except Exception:
                      return []
                  if cur is None:
                      return []
                  try:
                      return list(cur.fetchall())
                  except Exception:
                      return []

              @staticmethod
              def _field(row, key, index):
                  if isinstance(row, dict):
                      return row.get(key)
                  try:
                      return row[index]
                  except Exception:
                      return None

              @staticmethod
              def _req(value, name):
                  text = str(value or "").strip()
                  if not text:
                      raise ValueError("%s es obligatorio" % name)
                  return text

              def _wallet(self, account):
                  rows = self._rows(
                      "SELECT wal_id, balance, currency FROM sbs_wallet"
                      " WHERE account = " + self._literal(account)
                  )
                  if not rows:
                      return None
                  return {
                      "wal_id": self._field(rows[0], "a", 0),
                      "account": account,
                      "balance": float(self._field(rows[0], "b", 1) or 0),
                      "currency": self._field(rows[0], "c", 2),
                  }

              def _ensure_wallet_nolock(self, account, currency="USD"):
                  w = self._wallet(account)
                  if w is not None:
                      return w
                  wal_id = _nid("WAL-")
                  now = _now()
                  self._run(
                      "INSERT INTO sbs_wallet (wal_id, account, balance,"
                      " currency, created_at, updated_at)"
                      " VALUES (?, ?, 0, ?, ?, ?)",
                      (wal_id, account, str(currency or "USD"), now, now),
                  )
                  return self._wallet(account)

              def open_wallet(self, account, currency="USD"):
                  account = self._req(account, "account")
                  with self._lock:
                      return self._ensure_wallet_nolock(account, currency)

              def balance(self, account):
                  w = self._wallet(self._req(account, "account"))
                  if w is None:
                      return {"account": account, "balance": 0.0,
                              "currency": "USD"}
                  return {"account": account, "balance": w["balance"],
                          "currency": w["currency"]}

              def _move(self, account, kind, amount, counterparty=None, note=None):
                  self._run(
                      "INSERT INTO sbs_wallet_moves (mov_id, account, kind,"
                      " amount, counterparty, note, created_at)"
                      " VALUES (?, ?, ?, ?, ?, ?, ?)",
                      (_nid("MOV-"), account, kind, float(amount),
                       str(counterparty) if counterparty else None,
                       str(note) if note else None, _now()),
                  )

              def deposit(self, account, amount, note=None):
                  account = self._req(account, "account")
                  amt = float(amount)
                  if amt <= 0:
                      raise ValueError("monto debe ser positivo")
                  with self._lock:
                      self._ensure_wallet_nolock(account)
                      w = self._wallet(account)
                      new_bal = w["balance"] + amt
                      self._run(
                          "UPDATE sbs_wallet SET balance = " + repr(new_bal)
                          + ", updated_at = " + self._literal(_now())
                          + " WHERE account = " + self._literal(account)
                      )
                      self._move(account, "deposito", amt, None, note)
                      return self.balance(account)

              def transfer(self, *, from_a, to_a, amount, note=None):
                  from_a = self._req(from_a, "from_a")
                  to_a = self._req(to_a, "to_a")
                  amt = float(amount)
                  if amt <= 0:
                      raise ValueError("monto debe ser positivo")
                  if from_a == to_a:
                      raise ValueError("no puedes transferirte a ti mismo")
                  with self._lock:
                      w = self._wallet(from_a)
                      if w is None:
                          raise LookupError("cartera origen no existe: abre tu cartera")
                      if w["balance"] < amt:
                          raise ValueError("saldo insuficiente")
                      self._ensure_wallet_nolock(to_a)
                      nb_from = w["balance"] - amt
                      self._run(
                          "UPDATE sbs_wallet SET balance = " + repr(nb_from)
                          + ", updated_at = " + self._literal(_now())
                          + " WHERE account = " + self._literal(from_a)
                      )
                      self._run(
                          "UPDATE sbs_wallet SET balance = balance + " + repr(amt)
                          + ", updated_at = " + self._literal(_now())
                          + " WHERE account = " + self._literal(to_a)
                      )
                      self._move(from_a, "envio", -amt, to_a, note)
                      self._move(to_a, "recibo", amt, from_a, note)
                      return self.balance(from_a)

              def set_rate(self, *, from_cur, to_cur, rate, by):
                  from_cur = self._req(from_cur, "from_cur").upper()
                  to_cur = self._req(to_cur, "to_cur").upper()
                  rate = float(rate)
                  if rate <= 0:
                      raise ValueError("tasa debe ser positiva")
                  with self._lock:
                      row = self._rows(
                          "SELECT fx_id FROM sbs_fx_rates WHERE from_cur = "
                          + self._literal(from_cur)
                          + " AND to_cur = " + self._literal(to_cur)
                      )
                      if row:
                          fx_id = str(self._field(row[0], "a", 0))
                          self._run(
                              "UPDATE sbs_fx_rates SET rate = " + repr(rate)
                              + ", updated_by = " + self._literal(by)
                              + ", updated_at = " + self._literal(_now())
                              + " WHERE fx_id = " + self._literal(fx_id)
                          )
                      else:
                          fx_id = _nid("FX-")
                          self._run(
                              "INSERT INTO sbs_fx_rates (fx_id, from_cur,"
                              " to_cur, rate, updated_by, updated_at)"
                              " VALUES (?, ?, ?, ?, ?, ?)",
                              (fx_id, from_cur, to_cur, rate, by, _now()),
                          )
                      return {"fx_id": fx_id, "from": from_cur,
                              "to": to_cur, "rate": rate}

              def convert(self, amount, *, from_cur, to_cur):
                  from_cur = self._req(from_cur, "from_cur").upper()
                  to_cur = self._req(to_cur, "to_cur").upper()
                  amt = float(amount)
                  if from_cur == to_cur:
                      return {"amount": amt, "rate": 1.0,
                              "from": from_cur, "to": to_cur}
                  rows = self._rows(
                      "SELECT rate FROM sbs_fx_rates WHERE from_cur = "
                      + self._literal(from_cur)
                      + " AND to_cur = " + self._literal(to_cur)
                  )
                  if not rows:
                      raise LookupError(
                          "tasa %s a %s no configurada (gobierno debe definirla)"
                          % (from_cur, to_cur))
                  rate = float(self._field(rows[0], "a", 0))
                  return {"amount": round(amt * rate, 6), "rate": rate,
                          "from": from_cur, "to": to_cur}

              def escrow_hold(self, *, order_ref, from_a, to_a, amount):
                  order_ref = self._req(order_ref, "order_ref")
                  from_a = self._req(from_a, "from_a")
                  to_a = self._req(to_a, "to_a")
                  amt = float(amount)
                  if amt <= 0:
                      raise ValueError("monto debe ser positivo")
                  with self._lock:
                      w = self._wallet(from_a)
                      if w is None:
                          raise LookupError("cartera origen no existe")
                      if w["balance"] < amt:
                          raise ValueError("saldo insuficiente para escrow")
                      nb = w["balance"] - amt
                      self._run(
                          "UPDATE sbs_wallet SET balance = " + repr(nb)
                          + ", updated_at = " + self._literal(_now())
                          + " WHERE account = " + self._literal(from_a)
                      )
                      esc_id = _nid("ESC-")
                      self._run(
                          "INSERT INTO sbs_escrow (esc_id, order_ref, from_a,"
                          " to_a, amount, status, created_at, released_at)"
                          " VALUES (?, ?, ?, ?, ?, 'held', ?, NULL)",
                          (esc_id, order_ref, from_a, to_a, amt, _now()),
                      )
                      self._move(from_a, "escrow_retencion", -amt, to_a, order_ref)
                      return {"esc_id": esc_id, "status": "held",
                              "amount": amt}

              def escrow_release(self, esc_id):
                  esc_id = self._req(esc_id, "esc_id")
                  with self._lock:
                      rows = self._rows(
                          "SELECT to_a, amount, status FROM sbs_escrow"
                          " WHERE esc_id = " + self._literal(esc_id)
                      )
                      if not rows:
                          raise LookupError("escrow no encontrado")
                      status = str(self._field(rows[0], "c", 2))
                      if status != "held":
                          raise ValueError("escrow no esta retenido")
                      to_a = str(self._field(rows[0], "a", 0))
                      amt = float(self._field(rows[0], "b", 1))
                      self._ensure_wallet_nolock(to_a)
                      self._run(
                          "UPDATE sbs_wallet SET balance = balance + " + repr(amt)
                          + ", updated_at = " + self._literal(_now())
                          + " WHERE account = " + self._literal(to_a)
                      )
                      self._run(
                          "UPDATE sbs_escrow SET status = 'released',"
                          " released_at = " + self._literal(_now())
                          + " WHERE esc_id = " + self._literal(esc_id)
                      )
                      self._move(to_a, "escrow_liberacion", amt, None, esc_id)
                      return {"esc_id": esc_id, "status": "released",
                              "amount": amt}

              def moves_for(self, account, limit=30):
                  account = self._req(account, "account")
                  out = []
                  for row in self._rows(
                      "SELECT mov_id, kind, amount, counterparty, note, created_at"
                      " FROM sbs_wallet_moves WHERE account = "
                      + self._literal(account)
                      + " ORDER BY created_at DESC LIMIT " + str(int(limit))
                  ):
                      out.append({
                          "mov_id": self._field(row, "a", 0),
                          "kind": self._field(row, "b", 1),
                          "amount": self._field(row, "c", 2),
                          "counterparty": self._field(row, "d", 3),
                          "note": self._field(row, "e", 4),
                          "created_at": self._field(row, "f", 5),
                      })
                  return out


          def market_cartera_page(self) -> str:
              user = self._sess_user()
              if user is None:
                  body = "".join([
                      "<div class='card'><h2>Cartera</h2>",
                      "<p>Necesitas sesion.</p>",
                      "<p><a href='/subastas/inscripcion'><button>Entrar</button></a></p>",
                      "</div>",
                  ])
                  return self._page_wrap("ZYRA MARKET - Cartera", body)
              account = user["username"]
              bal = self.car.balance(account)
              moves = self.car.moves_for(account)
              m_rows = []
              for m in moves:
                  m_rows.append(
                      "<p>- [%s] %s: $%s (%s)</p>" % (
                          m["created_at"], m["kind"],
                          format(float(m["amount"] or 0), ".2f"),
                          m["counterparty"] or m["note"] or "-"))
              if not m_rows:
                  m_rows.append("<p>Sin movimientos.</p>")
              body = "".join([
                  "<div class='card'><h2>Mi Cartera</h2>",
                  "<p>Saldo: <b>$%s</b> (%s)</p>" % (
                      format(float(bal["balance"]), ".2f"), bal["currency"]),
                  "<p>MOTOR CARTERA: traslacion de dinero, no somos banco.</p>",
                  "</div>",
                  "<div class='card'><h2>Enviar dinero</h2>",
                  "<input id='wTo' placeholder='Cuenta destino'>",
                  "<input id='wAmt' type='number' step='0.01' placeholder='Monto'>",
                  "<input id='wNote' placeholder='Nota'>",
                  "<button id='btnSend'>Enviar</button>",
                  "</div>",
                  "<div class='card'><h2>Recargar (deposito)</h2>",
                  "<input id='dAmt' type='number' step='0.01' placeholder='Monto'>",
                  "<button id='btnDep'>Depositar</button>",
                  "</div>",
                  "<div class='card'><h2>Convertir moneda</h2>",
                  "<input id='cAmt' type='number' step='0.01' placeholder='Monto'>",
                  "<input id='cFrom' placeholder='De (USD/BTC/QTZ)'>",
                  "<input id='cTo' placeholder='A (USD/BTC/QTZ)'>",
                  "<button id='btnConv'>Convertir</button>",
                  "</div>",
                  "<div class='card'><h2>Movimientos</h2>",
                  "".join(m_rows),
                  "</div>",
                  "<p id='msg'></p>",
                  "<script>",
                  "function v(id){return document.getElementById(id).value;}",
                  "function num(id){var x=parseFloat(v(id));return isNaN(x)?0:x;}",
                  "function post(payload){",
                  "fetch('/subastas/api/cartera',{method:'POST',",
                  "headers:{'Content-Type':'application/json'},",
                  "body:JSON.stringify(payload)})",
                  ".then(function(r){return r.json();})",
                  ".then(function(d){if(d.ok){if(d.data&&d.data.converted){",
                  "document.getElementById('msg').textContent='Convertido: '+d.data.converted.amount;",
                  "}else{location.reload();}}",
                  "else{document.getElementById('msg').textContent='Error: '+(d.error||'');}})",
                  ".catch(function(e){document.getElementById('msg').textContent='Error: '+e;});}",
                  "document.getElementById('btnSend').addEventListener('click',function(){",
                  "post({action:'transfer',to:v('wTo'),amount:num('wAmt'),note:v('wNote')});});",
                  "document.getElementById('btnDep').addEventListener('click',function(){",
                  "post({action:'deposit',amount:num('dAmt')});});",
                  "document.getElementById('btnConv').addEventListener('click',function(){",
                  "post({action:'convert',amount:num('cAmt'),from:v('cFrom'),to:v('cTo')});});",
                  "</script>",
              ])
              return self._page_wrap("ZYRA MARKET - Cartera", body)


          def market_gov_cartera_page(self) -> str:
              user = self._sess_user()
              if user is None or user.get("role") not in ("gobierno", "admin"):
                  body = "<p>Solo gobierno/admin.</p>"
                  return self._page_wrap("ZYRA MARKET - Gov Cartera", body)
              body = "".join([
                  "<div class='card'><h2>Tasas de cambio</h2>",
                  "<input id='fFrom' placeholder='De (ej. USD)'>",
                  "<input id='fTo' placeholder='A (ej. BTC)'>",
                  "<input id='fRate' type='number' step='0.0001' placeholder='Tasa'>",
                  "<button id='btnRate'>Guardar tasa</button>",
                  "</div>",
                  "<p id='msg'></p>",
                  "<script>",
                  "document.getElementById('btnRate').addEventListener('click',function(){",
                  "function g(i){return document.getElementById(i).value;}",
                  "fetch('/subastas/api/gov-cartera',{method:'POST',",
                  "headers:{'Content-Type':'application/json'},",
                  "body:JSON.stringify({action:'set_rate',from_cur:g('fFrom'),to_cur:g('fTo'),rate:parseFloat(g('fRate'))})})",
                  ".then(function(r){return r.json();})",
                  ".then(function(d){if(d.ok){location.reload();}",
                  "else{document.getElementById('msg').textContent='Error: '+(d.error||'');}})",
                  ".catch(function(e){document.getElementById('msg').textContent='Error: '+e;});});",
                  "</script>",
              ])
              return self._page_wrap("ZYRA MARKET - Gov Cartera", body)


          def market_cartera_api(self) -> None:
              try:
                  user = self._sess_user()
                  if user is None:
                      self._send_json(401, {"ok": False, "error": "sesion requerida"})
                      return
                  account = user["username"]
                  doc = self._read_json()
                  if doc is None:
                      self._send_json(400, {"ok": False, "error": "invalid JSON"})
                      return
                  action = str(doc.get("action", ""))
                  if action == "open":
                      w = self.car.open_wallet(account)
                      self._send_json(200, {"ok": True, "data": w})
                      return
                  if action == "balance":
                      self._send_json(200, {"ok": True, "data": self.car.balance(account)})
                      return
                  if action == "deposit":
                      b = self.car.deposit(account, doc.get("amount", 0),
                                           note=doc.get("note"))
                      self._send_json(200, {"ok": True, "data": b})
                      return
                  if action == "transfer":
                      b = self.car.transfer(
                          from_a=account, to_a=str(doc.get("to", "")),
                          amount=doc.get("amount", 0), note=doc.get("note"))
                      self._send_json(200, {"ok": True, "data": b})
                      return
                  if action == "convert":
                      r = self.car.convert(
                          doc.get("amount", 0),
                          from_cur=str(doc.get("from", "USD")),
                          to_cur=str(doc.get("to", "USD")))
                      r["converted"] = True
                      self._send_json(200, {"ok": True, "data": r})
                      return
                  if action == "moves":
                      self._send_json(200, {"ok": True, "data": {
                          "moves": self.car.moves_for(account)}})
                      return
                  self._send_json(
                      400, {"ok": False, "error": "accion desconocida"}
                  )
              except Exception:
                  self._send_json(500, {
                      "ok": False, "error": "server error",
                      "trace": traceback.format_exc(),
                  })


          def market_gov_cartera_api(self) -> None:
              try:
                  user = self._sess_user()
                  if user is None or user.get("role") not in ("gobierno", "admin"):
                      self._send_json(403, {"ok": False, "error": "solo gobierno/admin"})
                      return
                  doc = self._read_json()
                  if doc is None:
                      self._send_json(400, {"ok": False, "error": "invalid JSON"})
                      return
                  action = str(doc.get("action", ""))
                  if action == "set_rate":
                      r = self.car.set_rate(
                          from_cur=str(doc.get("from_cur", "")),
                          to_cur=str(doc.get("to_cur", "")),
                          rate=doc.get("rate", 0),
                          by=user["username"])
                      self._send_json(200, {"ok": True, "data": r})
                      return
                  self._send_json(
                      400, {"ok": False, "error": "accion desconocida"}
                  )
              except Exception:
                  self._send_json(500, {
                      "ok": False, "error": "server error",
                      "trace": traceback.format_exc(),
                  })
          CF
          echo "cartera_store.py: $(wc -l < apps/subastas/modules/motores/cartera_store.py) lines"

      - name: "Paso 1b - traduccion_store.py (si falta)"
        run: |
          python3 - <<'CHK'
          from pathlib import Path
          p = Path("apps/subastas/modules/motores/traduccion_store.py")
          if p.exists() and "def translate" in p.read_text(encoding="utf-8"):
              print("SKIP: traduccion ya existe")
          else:
              print("FALTA traduccion: re-ejecutar el workflow GRUPO B v1")
              raise SystemExit(1)
          CHK

      - name: "Paso 1c - radar_motor.py (si falta)"
        run: |
          python3 - <<'CHK'
          from pathlib import Path
          p = Path("apps/subastas/modules/motores/radar_motor.py")
          if p.exists() and "def tokenize_finding" in p.read_text(encoding="utf-8"):
              print("SKIP: radar ya existe")
          else:
              print("FALTA radar: re-ejecutar el workflow GRUPO B v1")
              raise SystemExit(1)
          CHK

      - name: "Paso 2 - wire server.py (si falta, verifica RLock)"
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path

          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)

          P = "apps/subastas/server.py"
          txt = Path(P).read_text(encoding="utf-8")
          if "cartera_store" not in txt:
              print("FALTA wiring: re-ejecutar GRUPO B v1")
              raise SystemExit(1)
          print("OK: cartera ya wired")

          car = Path("apps/subastas/modules/motores/cartera_store.py").read_text(encoding="utf-8")
          if "RLock" not in car:
              fail("cartera_store.py no tiene RLock - el Paso 1 fallo")
          print("OK: RLock presente (deadlock muerto)")
          PYEOF

      - name: "Paso 3 - E2E motores (con cookies)"
        run: |
          python3 - <<'EOF'
          import http.cookiejar
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          import uuid
          import re as _re

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-" + uuid.uuid4().hex[:8]}, None)
                  if path == "/tokens/earn":
                      return (True, {"earned": 5}, None)
                  return (False, None, "offline")


          def make_opener():
              cj = http.cookiejar.CookieJar()
              return urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(cj)
              )


          def call(opener, method, url, payload=None, form=None, step=""):
              if form is not None:
                  data = urllib.parse.urlencode(form).encode()
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              else:
                  data = json.dumps(payload).encode() if payload is not None else None
                  headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with opener.open(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read()[:800].decode("utf-8", "replace")
                  raise AssertionError("PASO %s: HTTP %s %s -> %s" % (step, e.code, body))


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          opA = make_opener()
          aName = "ana" + uuid.uuid4().hex[:6]
          call(opA, "POST", base + "/subastas/registro", form={
              "username": aName, "password": "clave123",
              "display_name": "Ana Cartera", "role": "vendedor"}, step="1a")
          opB = make_opener()
          bName = "beto" + uuid.uuid4().hex[:6]
          call(opB, "POST", base + "/subastas/registro", form={
              "username": bName, "password": "clave123",
              "display_name": "Beto Cartera", "role": "comprador"}, step="1b")
          opG = make_opener()
          gName = "gov" + uuid.uuid4().hex[:6]
          call(opG, "POST", base + "/subastas/registro", form={
              "username": gName, "password": "clave123",
              "display_name": "Gobierno", "role": "gobierno"}, step="1c")
          print("1. cuentas A, B y gobierno OK")

          st, html = call(opA, "POST", base + "/subastas/api/cartera",
                          payload={"action": "deposit", "amount": 100}, step="2")
          assert '"balance": 100.0' in html, html[:400]
          print("2. deposito 100 OK (deadlock muerto)")

          st, html = call(opA, "POST", base + "/subastas/api/cartera",
                          payload={"action": "transfer", "to": bName,
                                   "amount": 30, "note": "pago prueba"}, step="3")
          assert '"balance": 70.0' in html, html[:400]
          print("3. envio A->B: saldo A=70 OK")

          st, html = call(opB, "POST", base + "/subastas/api/cartera",
                          payload={"action": "balance"}, step="4")
          assert '"balance": 30.0' in html, html[:400]
          print("4. B recibio 30 OK")

          st, html = call(opG, "POST", base + "/subastas/api/gov-cartera",
                          payload={"action": "set_rate", "from_cur": "USD",
                                   "to_cur": "BTC", "rate": 0.000015}, step="5")
          assert '"rate"' in html, html[:400]
          print("5. tasa USD->BTC OK")

          st, html = call(opA, "POST", base + "/subastas/api/cartera",
                          payload={"action": "convert", "amount": 100,
                                   "from": "USD", "to": "BTC"}, step="6")
          assert "rate" in html, html[:400]
          print("6. conversion tiempo real OK")

          try:
              call(opA, "POST", base + "/subastas/api/cartera",
                   payload={"action": "transfer", "to": bName,
                            "amount": 500}, step="7")
              raise SystemExit("FALLO: transferencia sin saldo aceptada")
          except AssertionError as e:
              assert "saldo insuficiente" in str(e), e
          print("7. sin saldo rechazado OK")

          st, html = call(opG, "POST", base + "/subastas/api/gov-traduccion",
                          payload={"action": "add_pair", "src_text": "hello",
                                   "src_lang": "en", "dst_lang": "es",
                                   "dst_text": "hola"}, step="8")
          assert '"dst": "hola"' in html, html[:400]
          print("8. traduccion par OK")

          st, html = call(opA, "POST", base + "/subastas/api/traduccion",
                          payload={"action": "translate", "text": "hello friend",
                                   "from": "en", "to": "es"}, step="9")
          assert "hola friend" in html, html[:400]
          print("9. traduccion OK")

          st, html = call(opA, "POST", base + "/subastas/api/radar",
                          payload={"action": "scan", "instance": "market",
                                   "summary": "escaneo vehiculos",
                                   "findings": [{"label": "camioneta 2019",
                                                 "score": 8.5}]}, step="10")
          assert "camioneta 2019" in html, html[:400]
          m = _re.search(r"FND-[a-f0-9]{10}", html)
          assert m, html[:400]
          fin_id = m.group(0)
          print("10. radar scan OK:", fin_id)

          st, html = call(opA, "POST", base + "/subastas/api/radar",
                          payload={"action": "tokenize", "fin_id": fin_id}, step="11")
          assert '"tokenized": true' in html, html[:400]
          print("11. tokenizado via red OK")

          st, html = call(opA, "GET", base + "/subastas/cartera", step="12")
          assert "Mi Cartera" in html and "70.00" in html
          print("12. pagina cartera OK")

          print("E2E SMOKE OK: GRUPO B completo (Cartera + Traduccion + Radar)")
          EOF

      - name: ZYRA MARKET tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/subastas/tests -q || true

      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (GRUPO B v2): Cartera RLock fix - deadlock eliminado" -m "Root cause of timeout: deposit/transfer acquired Lock then called open_wallet which re-acquired the same Lock = self-deadlock. Fixed with threading.RLock (reentrant). Timeout replaced by working deposits/transfers. Translation+radar already existed from v1."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
