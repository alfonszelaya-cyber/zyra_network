name: ZYRA AXIS Block 5 - Health Service + Longitudinal Life Link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write health_service.py
        run: |
          cat > apps/axis/life_history/health_service.py <<'ZH1'
          """AXIS Health x Life History - additive module.

          Phase 2.1: links the medical flow (exams, results,
          appointments) to the person's tamper-evident life
          history. A patient born in the civil registry gets
          every health event chained into their verifiable
          life record - the differentiator no other national
          system has.

          Offline-safe: if life_history is unavailable for a
          patient (not born in the registry), health flows
          work exactly as before and the link is skipped.
          """
          from __future__ import annotations

          from apps.axis.life_history.service import (
              LifeHistoryService,
          )


          class HealthLifeLink:
              """Bridges AxisStore medical operations to
              LifeHistory chain events."""

              def __init__(
                  self,
                  *,
                  store,
                  life: LifeHistoryService | None,
              ) -> None:
                  self._store = store
                  self._life = life

              def _person_for_account(
                  self, account_id: str,
              ) -> str | None:
                  """Resolves an AXIS account to a life_history
                  person via ZID match."""
                  if self._life is None:
                      return None
                  try:
                      account = self._store.get_account(
                          account_id
                      )
                  except LookupError:
                      return None
                  zid = account.get("zid")
                  if not zid:
                      return None
                  row = self._life._store._db.query_one(
                      "SELECT person_id FROM life_persons"
                      " WHERE zid = ?",
                      (str(zid),),
                  )
                  if row is None:
                      return None
                  return str(row["person_id"])

              def record_exam(
                  self,
                  *,
                  exam_id: str,
                  patient_account: str,
                  doctor_account: str,
                  exam_type: str,
              ) -> bool:
                  person_id = self._person_for_account(
                      patient_account
                  )
                  if person_id is None:
                      return False
                  try:
                      self._life._store.add_life_event(
                          person_id,
                          actor=doctor_account,
                          event_type="health_exam",
                          detail=f"{exam_id}: {exam_type}",
                      )
                      return True
                  except Exception:
                      return False

              def record_result(
                  self,
                  *,
                  result_id: str,
                  exam_id: str,
                  patient_account: str,
                  summary: str,
                  severity: str,
                  requires_followup: bool,
              ) -> bool:
                  person_id = self._person_for_account(
                      patient_account
                  )
                  if person_id is None:
                      return False
                  try:
                      self._life._store.add_life_event(
                          person_id,
                          actor="axis-health",
                          event_type="health_result",
                          detail=(
                              f"{result_id}: {summary}"
                              f" [{severity}]"
                              + (
                                  " followup"
                                  if requires_followup
                                  else ""
                              )
                          ),
                      )
                      return True
                  except Exception:
                      return False

              def record_appointment(
                  self,
                  *,
                  appointment_id: str,
                  patient_account: str,
                  reason: str,
                  scheduled_at: str,
              ) -> bool:
                  person_id = self._person_for_account(
                      patient_account
                  )
                  if person_id is None:
                      return False
                  try:
                      self._life._store.add_life_event(
                          person_id,
                          actor="axis-health",
                          event_type="health_appointment",
                          detail=(
                              f"{appointment_id}:"
                              f" {reason} @ {scheduled_at}"
                          ),
                      )
                      return True
                  except Exception:
                      return False

              def patient_longitudinal(
                  self, account_id: str,
              ) -> dict[str, object]:
                  """Full longitudinal view: account + life
                  person + chained events + verification."""
                  person_id = self._person_for_account(
                      account_id
                  )
                  if person_id is None:
                      return {
                          "account_id": account_id,
                          "life_linked": False,
                      }
                  person = self._life._store.get_person(
                      person_id
                  )
                  events = self._life._store.events_of(
                      person_id
                  )
                  return {
                      "account_id": account_id,
                      "life_linked": True,
                      "person_id": person_id,
                      "full_name": person["full_name"],
                      "zid": person["zid"],
                      "status": person["status"],
                      "events": list(events),
                      "chain_verified": (
                          self._life._store.events_verify(
                              person_id
                          )
                      ),
                  }
          ZH1
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/health_service.py').read()); print('health_service OK')"

      - name: Write reminders.py
        run: |
          cat > apps/axis/life_history/reminders.py <<'ZH2'
          """AXIS Health reminders - additive module.

          Active appointment reminders over the existing
          pending_reminders() store query. Idempotent:
          marking a reminder twice does not duplicate the
          life-history event.
          """
          from __future__ import annotations

          from apps.axis.life_history.health_service import (
              HealthLifeLink,
          )


          class ReminderService:
              def __init__(
                  self,
                  *,
                  store,
                  link: HealthLifeLink,
              ) -> None:
                  self._store = store
                  self._link = link
                  self._marked: set[str] = set()

              def due_reminders(
                  self,
              ) -> list[dict[str, object]]:
                  pending = self._store.pending_reminders()
                  out: list[dict[str, object]] = []
                  for item in pending:
                      out.append(
                          {
                              "appointment_id": item[
                                  "appointment_id"
                              ],
                              "patient_account": item[
                                  "patient_account"
                              ],
                              "reason": item["reason"],
                              "scheduled_at": item[
                                  "scheduled_at"
                              ],
                              "life_linked": (
                                  self._link
                                  ._person_for_account(
                                      item[
                                          "patient_account"
                                      ]
                                  )
                                  is not None
                              ),
                          }
                      )
                  return out

              def mark_reminded(
                  self,
                  *,
                  appointment_id: str,
                  patient_account: str,
                  scheduled_at: str,
              ) -> bool:
                  """Marks a reminder as sent and chains it
                  into life history once (idempotent)."""
                  key = appointment_id
                  if key in self._marked:
                      return False
                  self._marked.add(key)
                  return self._link.record_appointment(
                      appointment_id=appointment_id,
                      patient_account=patient_account,
                      reason="reminder_sent",
                      scheduled_at=scheduled_at,
                  )
          ZH2
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/reminders.py').read()); print('reminders OK')"

      - name: Write health E2E tests
        run: |
          cat > apps/axis/life_history/tests/test_health_link.py <<'ZH3'
          """Health x Life History E2E: birth -> exam ->
          result -> appointment -> reminder -> chained
          verifiable life history."""
          from __future__ import annotations

          import unittest

          from apps.axis.life_history.health_service import (
              HealthLifeLink,
          )
          from apps.axis.life_history.reminders import (
              ReminderService,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )

          _MOTHER = "ZID-mother-0001"


          class _FakeNetwork:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid == _MOTHER:
                      return (
                          True,
                          {"status": "ACTIVE"},
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-1"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return (False, None, "unknown")


          class HealthLifeE2E(unittest.TestCase):
              def _boot(self):
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )
                  from shared_engines.storage.database import (
                      SQLiteAdapter,
                  )

                  db = SQLiteAdapter(":memory:")
                  clock = SystemClock()
                  life_store = LifeHistoryStore(db, clock)
                  life = LifeHistoryService(
                      store=life_store,
                      client=_FakeNetwork(),
                  )
                  birth = (
                      life.register_birth_with_network(
                          registrar_account=(
                              "AX-reg-1"
                          ),
                          child_name="Bebe Link",
                          birth_date="2025-01-15",
                          birth_place="San Salvador",
                          sex="F",
                          mother_name="Maria",
                          mother_zid=_MOTHER,
                      )
                  )
                  life.attach_zid_with_audit(
                      str(birth["person_id"]),
                      zid="ZID-newborn-link",
                      actor="biometric-enroll",
                  )
                  return db, clock, life, birth

              def test_full_health_life_chain(self) -> None:
                  db, clock, life, birth = self._boot()
                  from apps.axis.infrastructure.persistence.axis_store import (
                      AxisStore,
                  )

                  store = AxisStore(db, clock)
                  store.add_account(
                      account_id="AX-pat-life",
                      zid="ZID-newborn-link",
                      name="Bebe Link",
                      role="paciente",
                  )
                  store.add_account(
                      account_id="AX-doc-life",
                      zid=None,
                      name="Dr Link",
                      role="medico",
                  )
                  link = HealthLifeLink(
                      store=store, life=life
                  )
                  person_id = str(birth["person_id"])
                  self.assertTrue(
                      link.record_exam(
                          exam_id="EXM-link1",
                          patient_account="AX-pat-life",
                          doctor_account="AX-doc-life",
                          exam_type="sangre",
                      )
                  )
                  self.assertTrue(
                      link.record_result(
                          result_id="RES-link1",
                          exam_id="EXM-link1",
                          patient_account="AX-pat-life",
                          summary="anemia detectada",
                          severity="media",
                          requires_followup=True,
                      )
                  )
                  self.assertTrue(
                      link.record_appointment(
                          appointment_id="APT-link1",
                          patient_account="AX-pat-life",
                          reason="control anemia",
                          scheduled_at="lunes 9am",
                      )
                  )
                  view = link.patient_longitudinal(
                      "AX-pat-life"
                  )
                  self.assertTrue(
                      view["life_linked"]
                  )
                  self.assertTrue(
                      view["chain_verified"]
                  )
                  self.assertEqual(
                      4,
                      len(view["events"]),
                  )
                  types = [
                      e["event_type"]
                      for e in view["events"]
                  ]
                  self.assertEqual(
                      [
                          "birth_registered",
                          "zid_biometric_upgrade",
                          "health_exam",
                          "health_result",
                      ],
                      types[:4],
                  )

              def test_reminders_idempotent(self) -> None:
                  db, clock, life, birth = self._boot()
                  from apps.axis.infrastructure.persistence.axis_store import (
                      AxisStore,
                  )

                  store = AxisStore(db, clock)
                  store.add_account(
                      account_id="AX-pat-rem",
                      zid="ZID-newborn-link",
                      name="Bebe Link",
                      role="paciente",
                  )
                  store.add_account(
                      account_id="AX-doc-rem",
                      zid=None,
                      name="Dr Rem",
                      role="medico",
                  )
                  link = HealthLifeLink(
                      store=store, life=life
                  )
                  reminders = ReminderService(
                      store=store, link=link
                  )
                  store.add_exam(
                      exam_id="EXM-rem",
                      patient_account="AX-pat-rem",
                      doctor_account="AX-doc-rem",
                      exam_type="vista",
                  )
                  store.add_exam_result(
                      result_id="RES-rem",
                      exam_id="EXM-rem",
                      summary="miope",
                      severity="baja",
                      requires_followup=True,
                      followup_reason="lentes",
                      sealed_doc=None,
                  )
                  store.create_appointment(
                      appointment_id="APT-rem",
                      patient_account="AX-pat-rem",
                      doctor_account="AX-doc-rem",
                      result_id="RES-rem",
                      reason="lentes",
                      scheduled_at="jueves 2pm",
                  )
                  due = reminders.due_reminders()
                  self.assertEqual(1, len(due))
                  self.assertTrue(
                      due[0]["life_linked"]
                  )
                  first = reminders.mark_reminded(
                      appointment_id="APT-rem",
                      patient_account="AX-pat-rem",
                      scheduled_at="jueves 2pm",
                  )
                  self.assertTrue(first)
                  second = reminders.mark_reminded(
                      appointment_id="APT-rem",
                      patient_account="AX-pat-rem",
                      scheduled_at="jueves 2pm",
                  )
                  self.assertFalse(second)
                  person_id = str(birth["person_id"])
                  events = store_life_events(
                      life, person_id
                  )
                  appointments = [
                      e
                      for e in events
                      if e["event_type"]
                      == "health_appointment"
                  ]
                  self.assertEqual(
                      1, len(appointments)
                  )

              def test_unlinked_patient_degrades(
                  self,
              ) -> None:
                  db, clock, life, _birth = self._boot()
                  from apps.axis.infrastructure.persistence.axis_store import (
                      AxisStore,
                  )

                  store = AxisStore(db, clock)
                  store.add_account(
                      account_id="AX-pat-ext",
                      zid=None,
                      name="Paciente Externo",
                      role="paciente",
                  )
                  link = HealthLifeLink(
                      store=store, life=life
                  )
                  self.assertFalse(
                      link.record_exam(
                          exam_id="EXM-ext",
                          patient_account=(
                              "AX-pat-ext"
                          ),
                          doctor_account="AX-doc",
                          exam_type="sangre",
                      )
                  )
                  view = link.patient_longitudinal(
                      "AX-pat-ext"
                  )
                  self.assertFalse(
                      view["life_linked"]
                  )


          def store_life_events(life, person_id):
              return life._store.events_of(person_id)


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          ZH3
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_health_link.py').read()); print('test_health_link OK')"

      - name: 1/3 Health link tests (3 E2E)
        run: python -m apps.axis.life_history.tests.test_health_link -v

      - name: 2/3 Life History regression (store 7 + service 5 + verification 3)
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q

      - name: 3/3 Full regression (biometrics 13 + PAD 3 + AXIS 7 + TCP 6)
        run: |
          python -m shared_engines.security.biometrics -q
          python -m apps.axis.tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit Health x Life History (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "health: HealthLifeLink + ReminderService - medical flow chained into verifiable life history (3 E2E tests)"
            git push
          fi
