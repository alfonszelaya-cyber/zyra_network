name: "RED-1 FIX: TypeError en _route_get de capabilities_api (3 args) + traceback en except + test regresion serve_combined"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - dump transparente: _route de capabilities_api (lineas 108-160)"
        run: |
          python3 - <<'DMPEOF'
          from pathlib import Path
          lines = Path(
              "shared_engines/runtime/capabilities_api.py"
          ).read_text(encoding="utf-8").splitlines()
          for n in range(107, min(160, len(lines))):
              print(str(n + 1).rjust(5) + ": "
                    + lines[n])
          DMPEOF

      - name: "Paso B - FIX: self._route_get(self, s) -> self._route_get(s) (+_route_post si igual) + print_exc en except generico"
        run: |
          python3 - <<'FIXEOF'
          import ast
          import re
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/capabilities_api.py")
          t = p.read_text(encoding="utf-8")

          # --- fix 1: llamadas con self duplicado ---
          patron_get = re.compile(
              r"self\._route_get\(\s*self\s*,"
              r"\s*([A-Za-z_]\w*)\s*,?\s*\)",
              re.S)
          patron_post = re.compile(
              r"self\._route_post\(\s*self\s*,"
              r"\s*([A-Za-z_]\w*)\s*,?\s*\)",
              re.S)
          n_get = len(patron_get.findall(t))
          n_post = len(patron_post.findall(t))
          ya = "self._route_get(s)" in t
          if n_get == 0 and ya:
              print("SKIP _route_get (ya corregido)")
          else:
              assert n_get == 1, (
                  "patron GET roto hallado "
                  + str(n_get) + " veces")
              t = patron_get.sub(
                  r"self._route_get(\1)", t, count=1)
              print("OK fix _route_get: (self, "
                    + "s) -> (s)")
          if n_post == 0:
              print("SKIP _route_post (sin patron roto"
                    " - ya correcto)")
          else:
              t = patron_post.sub(
                  r"self._route_post(\1)", t,
                  count=1)
              print("OK fix _route_post (mismo patron)")

          # --- fix 2: observabilidad en except generico ---
          if "_cap_tb.print_exc()" in t:
              print("SKIP print_exc (ya presente)")
          else:
              VIEJO = (
                  "        except Exception:\n"
              )
              cnt = t.count(VIEJO)
              assert cnt == 1, (
                  "ancla except hallada "
                  + str(cnt))
              NUEVO = (
                  "        except Exception:\n"
                  "            import traceback"
                  " as _cap_tb\n"
                  "            _cap_tb.print_exc()\n"
              )
              t = t.replace(VIEJO, NUEVO, 1)
              print("OK print_exc en except generico")

          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          t2 = p.read_text(encoding="utf-8")
          assert "self._route_get(s)" in t2
          assert "_cap_tb.print_exc()" in t2
          assert not patron_get.search(t2)
          print("OK fix aplicado (AST valido)")
          FIXEOF

      - name: "Paso C - test de regresion: GET /history/{zid} via serve_combined (camino real de las apps)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/tests/"
              "test_capabilities_api.py")
          t = p.read_text(encoding="utf-8")
          if "test_history_via_serve_combined" in t:
              print("SKIP test (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_history_via_serve_combined(
                  tmp_path: Path,
              ) -> None:
                  """Regresion RED-1: el camino
                  real de las apps (serve_combined)
                  debe servir GET /history/{zid}
                  sin 500 (TypeError de _route_get
                  con self duplicado)."""
                  import base64
                  import json as _json
                  import threading
                  import time
                  import urllib.error
                  import urllib.request
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  from shared_engines.runtime.config import (
                      RuntimeConfig)
                  from shared_engines.runtime.kernel import (
                      ZyraKernel)
                  from shared_engines.runtime.capabilities import (
                      ZyraCapabilities)
                  from shared_engines.runtime.combined_api import (
                      serve_combined)
                  from shared_engines.verification.signatures import (
                      Ed25519Signer)
                  from shared_engines.security.biometrics import (
                      BiometricsEngine, BiometricsPolicy,
                      DeterministicTestProvider,
                      TemplateCipher)
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None))
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(
                      db=net_db,
                      clock=FrozenClock(),
                      audit=kernel.audit,
                      provider=(
                          DeterministicTestProvider()),
                      cipher=TemplateCipher(
                          master_key_hex="ab" * 32),
                      policy=BiometricsPolicy(
                          require_liveness=False,
                          doc_reject=0.01,
                          doc_review=0.02,
                          doc_auto=0.03,
                          dup_reject=0.98))
                  caps = ZyraCapabilities(
                      net_db, FrozenClock(),
                      identity=kernel.identity,
                      signer=signer)
                  srv = serve_combined(
                      kernel, caps,
                      host="127.0.0.1", port=0)
                  threading.Thread(
                      target=srv.serve_forever,
                      daemon=True).start()
                  time.sleep(0.3)
                  base = ("http://127.0.0.1:"
                          + str(
                              srv.server_address[1]))
                  try:
                      req = urllib.request.Request(
                          base
                          + "/identity/enroll",
                          data=_json.dumps({
                              "kind": "person",
                              "display_name": (
                                  "RegUser"),
                              "actor": "reg",
                              "doc_image_b64": (
                                  base64.b64encode(
                                      b"reg-history"
                                  ).decode("ascii")),
                              "selfie_image_b64": (
                                  base64.b64encode(
                                      b"reg-history"
                                  ).decode("ascii")),
                          }).encode(),
                          method="POST",
                          headers={
                              "Content-Type":
                              "application/json"})
                      with urllib.request.urlopen(
                          req,
                          timeout=15) as r:
                          body = _json.loads(
                              r.read().decode())
                      zid = ((body.get("data")
                              or {}).get("identity")
                             or {}).get("zid")
                      assert zid

                      def _get(ruta):
                          try:
                              with urllib.request.urlopen(
                                  base + ruta,
                                  timeout=15
                              ) as r2:
                                  return (r2.status,
                                      _json.loads(
                                          r2.read().decode()))
                          except (
                              urllib.error.HTTPError
                          ) as e2:
                              return (e2.code,
                                  _json.loads(
                                      e2.read().decode()))

                      st, resp = _get(
                          "/history/" + zid)
                      assert st == 200, (
                          str(st) + " " + str(resp))
                      assert resp["data"] == [], (
                          str(resp))
                      st, resp = _get(
                          "/trust/" + zid)
                      assert st == 200, (
                          "trust tambien rota: "
                          + str(st))
                      print("regresion RED-1 OK:"
                            " /history y /trust 200"
                            " via serve_combined")
                  finally:
                      srv.shutdown()
                      srv.server_close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert "test_history_via_serve_combined" in final
          print("OK test regresion escrito (AST valido)")
          TSEOF

      - name: "Paso D - GATE nuclo Red (shared_engines completo)"
        run: |
          python3 -m pytest shared_engines -q -s --tb=short 2>&1 | tail -15

      - name: "Paso E - GATE apps (4 apps, como siempre)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso F - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-1"
            echo '```'
            python3 -m pytest shared_engines/runtime/tests/test_capabilities_api.py -vv --tb=long 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-1: fix 500 en GET /history/{zid} - TypeError self._route_get(self, s) con 3 args" -m "Causa confirmada por espia con traceback: CapabilitiesApiHandler._route llamaba self._route_get(self, s) -> el binding automatico + el self explicito = 3 argumentos a un metodo de 2 -> TypeError -> except generico -> 500 internal_error. Afectaba TODAS las rutas GET caps via serve_combined (history/trust/profile/reputation/certificates); el test oficial pasaba porque usa su propio harness. FIX: self._route_get(s) (y _route_post si tuviera el mismo patron) + traceback.print_exc() en el except generico (observabilidad permanente) + test de regresion que reproduce el camino real de las apps (serve_combined + enroll + GET /history + /trust)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
