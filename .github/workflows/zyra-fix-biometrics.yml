          echo "=== REGLA 6: VERIFICACION POR TIPO + E2E COMPLETA ==="
          python3 - << 'ZYRA_CHECK'
          import importlib
          import json
          import os
          import pathlib
          import sys
          import types

          pkg_apps = types.ModuleType("apps")
          pkg_apps.__path__ = ["apps"]
          sys.modules["apps"] = pkg_apps
          pkg_lab = types.ModuleType("apps.laboratorio")
          pkg_lab.__path__ = ["apps/laboratorio"]
          sys.modules["apps.laboratorio"] = pkg_lab

          from apps.laboratorio.application.services.template_check import verificar_plantillas
          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.infrastructure.database.migrations import aplicar_migraciones, version_actual
          from apps.laboratorio.infrastructure.database.connection import ConexionBD
          from apps.laboratorio.infrastructure.database.tables import TABLAS_ESPERADAS, tablas_existentes
          from apps.laboratorio.shared.contracts.apps_catalog import (
              APPS,
              contratos_de,
              existe as existe_app,
          )

          MANIFEST = "/tmp/lab_lote_9a.manifest"
          RESUMEN = os.environ.get("GITHUB_STEP_SUMMARY", "")

          def sum_write(texto=""):
              if RESUMEN:
                  with open(RESUMEN, "a", encoding="utf-8") as f:
                      f.write(texto + "\n")

          errores = 0
          objetivos = []
          with open(MANIFEST, encoding="utf-8") as f:
              for linea in f:
                  linea = linea.strip()
                  if linea:
                      ruta, estado = linea.split("|", 1)
                      objetivos.append((ruta, estado))

          sum_write("## ZYRA LABORATORIO - Lote 9A (Fase 9: red, contratos y GOV-DATA)")
          sum_write("")
          sum_write("### Escritura y verificacion por tipo (Reglas 1-3 y 6)")
          sum_write("")
          sum_write("| Archivo | Escritura | Verificacion |")
          sum_write("|---|---|---|")
          for ruta, estado in objetivos:
              marca = "OK"
              try:
                  p = pathlib.Path(ruta)
                  datos = p.read_bytes()
                  assert datos.strip(), "archivo vacio"
                  if ruta.endswith(".py"):
                      texto = datos.decode("utf-8")
                      compile(texto, ruta, "exec")
                      nombre = "apps.laboratorio." + ruta[len("apps/laboratorio/"):-3].replace("/", ".")
                      importlib.import_module(nombre)
                  elif ruta.endswith(".json"):
                      obj = json.loads(datos.decode("utf-8"))
                      assert isinstance(obj, dict), "json debe ser objeto"
                  elif ruta.endswith(".html"):
                      texto = datos.decode("utf-8")
                      assert "{{" in texto and "}}" in texto, "plantilla sin marcadores"
                  else:
                      raise ValueError("Tipo desconocido: " + ruta)
              except Exception as exc:
                  errores += 1
                  marca = "FALLO: " + type(exc).__name__ + ": " + str(exc)
              sum_write("| `" + ruta + "` | " + estado + " | " + marca + " |")

          app = montar_aplicacion(":memory:")
          H_DUENO = {"X-ZYRA-ZID": "ZID-DUENO-1", "X-ZYRA-ROLES": "LAB_CREADOR,LAB_ANALISTA,LAB_INTEGRADOR"}
          H_OTRO = {"X-ZYRA-ZID": "ZID-OTRO-2"}

          def llamada(metodo, ruta, cuerpo=None, headers=None):
              h = dict(headers or {})
              datos = b"" if cuerpo is None else json.dumps(cuerpo).encode("utf-8")
              status, headers_out, salida = app.despachar(metodo, ruta, h, datos)
              ctype = headers_out.get("Content-Type", "")
              if "json" in ctype:
                  try:
                      parsed = json.loads(salida.decode("utf-8"))
                  except Exception:
                      parsed = None
              else:
                  parsed = None
              return status, parsed, salida, headers_out

          resultados = []

          def check(nombre, funcion):
              global errores
              try:
                  funcion()
                  resultados.append(("OK", nombre))
              except Exception as exc:
                  errores += 1
                  resultados.append(("FALLO", nombre + " -> " + type(exc).__name__ + ": " + str(exc)))

          ref = {}

          def preparar():
              tmp = ConexionBD(":memory:")
              assert aplicar_migraciones(tmp) == 9
              assert version_actual(tmp) == 9
              for t in TABLAS_ESPERADAS:
                  assert t in tablas_existentes(tmp), "falta tabla " + t
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects", {
                  "titulo": "Datos para GOV-DATA", "tipo": "gobierno",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              ref["proyecto"] = cuerpo["datos"]["proyecto"]

          def t_catalogo():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/network/contracts", headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              datos = cuerpo["datos"]
              assert datos["total_apps"] == 9, "apps=" + str(datos["total_apps"])
              ids = {a["id"] for a in datos["contratos"]}
              assert ids == {"nexo", "agro", "semilla", "mpe", "axis", "subastas", "ciclo", "govdata", "superapp"}
              assert existe_app("nexo") and not existe_app("twitter")
              assert "costos-proyecto" in contratos_de("nexo")

          def t_solicitar():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/network/requests", {
                  "app_destino": "nexo", "contrato": "costos-proyecto",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              sol = cuerpo["datos"]["solicitud"]
              assert sol["app_destino"] == "nexo" and sol["contrato"] == "costos-proyecto"
              assert sol["estado"] == "pendiente", "estado=" + str(sol["estado"])
              assert "Encolada" in sol["respuesta"]
              ref["solicitud"] = sol
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/network/requests", {
                  "app_destino": "twitter", "contrato": "x",
              }, headers=H_DUENO)
              assert status == 400, "app invalida: " + str(status)
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/network/requests", {
                  "app_destino": "nexo", "contrato": "chisme",
              }, headers=H_DUENO)
              assert status == 400, "contrato invalido: " + str(status)
              assert "Validos" in cuerpo["error"]["mensaje"]

          def t_solicitar_403():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/network/requests", {
                  "app_destino": "agro", "contrato": "alertas",
              }, headers=H_OTRO)
              assert status == 403, "espectador no solicita: " + str(status)

          def t_publicar_indicador():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/network/indicators", {
                  "tipo": "proyectos", "valor": 1,
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              ind = cuerpo["datos"]["indicador"]
              assert ind["tipo"] == "proyectos" and ind["valor"] == 1
              assert ind["estado"] == "pendiente", "estado=" + str(ind["estado"])
              assert "pendiente_red" in cuerpo["datos"]["estado_envio"] or ind["estado"] == "pendiente"
              ref["indicador"] = ind
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/network/indicators", {
                  "tipo": "escenas", "valor": 5,
              }, headers=H_DUENO)
              assert status == 201
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/network/indicators", {
                  "tipo": "inexistente", "valor": 3,
              }, headers=H_DUENO)
              assert status == 400, "tipo invalido: " + str(status)
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/network/indicators", {
                  "tipo": "renders", "valor": -2,
              }, headers=H_DUENO)
              assert status == 400, "valor negativo: " + str(status)

          def t_listados_persistidos():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/network/contracts", headers=H_DUENO)
              assert status == 200
              datos = cuerpo["datos"]
              assert datos["total_solicitudes"] == 1
              assert datos["solicitudes"][0]["app_destino"] == "nexo"
              assert datos["total_indicadores"] == 2
              tipos = {i["tipo"] for i in datos["indicadores"]}
              assert tipos == {"proyectos", "escenas"}

          def t_outbox_real():
              outbox = app.contenedor.obtener("outbox")
              estadisticas = outbox.estadisticas()
              assert estadisticas["pendiente"] >= 3, "pendientes=" + str(estadisticas)

          def t_ui_red():
              status, _, html, _ = llamada("GET", "/laboratorio/ui/red", headers=H_DUENO)
              assert status == 200, "red status=" + str(status)
              texto = html.decode("utf-8")
              assert "EN VIVO" in texto
              assert texto.count('data-accion=') == 3, "Ley 3, hay " + str(texto.count('data-accion='))
              assert 'id="form-solicitud"' in texto and 'id="form-indicador"' in texto
              assert "NEXO" in texto and "GOV-DATA" in texto
              assert "nexo" in texto
              status, _, html, _ = llamada("GET", "/laboratorio/ui/red", headers=H_OTRO)
              assert status == 200
              texto = html.decode("utf-8")
              assert ">Red<" not in texto, "espectador no ve Red"
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/ui/red", headers=H_OTRO)
              assert status == 200 or status == 403

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              total = len(cuerpo["datos"]["rutas"])
              assert total == 70, "se esperaban 70 rutas (66 + 3 de red + 1 catalogo), hay " + str(total)
              ids_modulos = {m["id"] for m in cuerpo["datos"]["modulos"]}
              assert ids_modulos == {"capture", "simulation", "understanding", "design", "creation", "library", "world4d", "render", "presentation", "export", "projection", "display", "network"}, str(ids_modulos)

          def t_plantillas_completas():
              assert verificar_plantillas() == 19

          sum_write("")
          sum_write("### Pruebas end-to-end Fase 9 (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Migracion v9 + proyecto base", preparar)
          check("Catalogo de contratos: 9 apps con contratos", t_catalogo)
          check("Solicitar datos a NEXO via outbox (pendiente honesto)", t_solicitar)
          check("Solicitud con 403 a espectador", t_solicitar_403)
          check("Publicar indicador a GOV-DATA", t_publicar_indicador)
          check("Listados persistidos (solicitudes + indicadores)", t_listados_persistidos)
          check("Outbox real: 3+ pendientes honestos", t_outbox_real)
          check("UI Red EN VIVO con Ley 3 + rol", t_ui_red)
          check("Indice publico: 70 rutas, 13 modulos", t_indice_publico)
          check("19 plantillas verificadas", t_plantillas_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 9 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 9A aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
