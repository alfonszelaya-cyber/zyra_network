name: "ZYRA FIX v12: semilla base64 valida + resiliencia server AGRO"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-fix-biometrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 0 - Dump: enroll_producer de zyra_link AGRO (referencia)"
        run: |
          python3 - <<'DUMPEOF'
          from pathlib import Path
          p = Path("apps/agro/services/zyra_link.py")
          if not p.exists():
              print("zyra_link.py AGRO NO EXISTE")
              raise SystemExit(0)
          t = p.read_text(encoding="utf-8", errors="ignore")
          i = t.find("def enroll_producer")
          if i >= 0:
              print("===== zyra_link.py AGRO (region enroll_producer) =====")
              print(t[max(0, i - 500): i + 2500])
          else:
              print("enroll_producer no encontrado en zyra_link.py")
          DUMPEOF

      - name: "Paso 1 - parches: semilla valida + wire + resiliencia server AGRO"
        run: |
          python3 - <<'PATCHEOF'
          from pathlib import Path

          REPORT = []

          SEED_LINE = '        _seed = (str(doc.get("name", "x")).strip().encode("utf-8").hex() + "zyra" * 16)[:64]\n'

          OLD_V11 = '        _seed = ("zyra-" + str(doc.get("name", "x")).strip().encode("utf-8").hex())[:64]\n'
          OLD_V10_A = '        doc["doc_image_b64"] = "zyra" * 16\n'
          OLD_V10_B = '        doc["selfie_image_b64"] = "zyra" * 16\n'

          def block_for(url_suffix):
              return (
                  '    if url.endswith("' + url_suffix + '") and "doc_image_b64" not in doc:\n'
                  '        doc = dict(doc)\n'
                  '        _seed = (str(doc.get("name", "x")).strip().encode("utf-8").hex() + "zyra" * 16)[:64]\n'
                  '        doc["doc_image_b64"] = _seed\n'
                  '        doc["selfie_image_b64"] = _seed\n'
              )

          def inject_after_sig(txt, def_marker, injection):
              idx = txt.find(def_marker)
              if idx < 0:
                  raise ValueError("no encontrado: " + def_marker)
              lines = txt.splitlines(keepends=True)
              count = 0
              start_line = None
              for i, l in enumerate(lines):
                  if count + len(l) > idx:
                      start_line = i
                      break
                  count += len(l)
              if start_line is None:
                  raise ValueError("inicio no calculado")
              j = start_line
              while j < len(lines) and not lines[j].rstrip().endswith(":"):
                  j += 1
              if j >= len(lines):
                  raise ValueError("firma sin cierre")
              lines.insert(j + 1, injection)
              return "".join(lines)

          def fix_test(name, path, def_marker, url_suffix):
              p = Path(path)
              if not p.exists():
                  REPORT.append("MISS  " + name + " (" + path + " no existe)")
                  return
              txt = p.read_text(encoding="utf-8")
              try:
                  if OLD_V11 in txt:
                      new = txt.replace(OLD_V11, SEED_LINE)
                  elif OLD_V10_A in txt and OLD_V10_B in txt:
                      new = txt.replace(OLD_V10_A, SEED_LINE).replace(OLD_V10_B, '        doc["selfie_image_b64"] = _seed\n')
                  elif '_seed = (str(' in txt:
                      REPORT.append("SKIP  " + name + " (ya aplicado)")
                      return
                  else:
                      new = inject_after_sig(txt, def_marker, block_for(url_suffix))
                  compile(new, path, "exec")
                  p.write_text(new, encoding="utf-8")
                  REPORT.append("OK    " + name)
              except Exception as exc:
                  REPORT.append("MISS  " + name + " (" + str(exc) + ")")

          WIRE = (
              "        from shared_engines.security.biometrics import (\n"
              "            BiometricsEngine,\n"
              "            BiometricsPolicy,\n"
              "            DeterministicTestProvider,\n"
              "            TemplateCipher,\n"
              "        )\n"
              "        self.kernel._biometrics = BiometricsEngine(\n"
              "            db=self.net_db,\n"
              "            clock=FrozenClock(),\n"
              "            audit=self.kernel.audit,\n"
              "            provider=DeterministicTestProvider(),\n"
              "            cipher=TemplateCipher(\n"
              "                master_key_hex=\"ab\" * 32\n"
              "            ),\n"
              "            policy=BiometricsPolicy(\n"
              "                require_liveness=False,\n"
              "                doc_reject=0.01,\n"
              "                doc_review=0.02,\n"
              "                doc_auto=0.03,\n"
              "                dup_reject=0.98,\n"
              "            ),\n"
              "        )\n"
          )

          def fix_wire(name, path):
              p = Path(path)
              if not p.exists():
                  REPORT.append("MISS  " + name + " (" + path + " no existe)")
                  return
              txt = p.read_text(encoding="utf-8")
              try:
                  if "DeterministicTestProvider" in txt:
                      REPORT.append("SKIP  " + name + " (wire ya presente)")
                      return
                  anchor = "        self.kernel.bootstrap_root()\n"
                  if anchor not in txt:
                      raise ValueError("ancla bootstrap_root no encontrada")
                  new = txt.replace(anchor, anchor + WIRE, 1)
                  compile(new, path, "exec")
                  p.write_text(new, encoding="utf-8")
                  REPORT.append("OK    " + name)
              except Exception as exc:
                  REPORT.append("MISS  " + name + " (" + str(exc) + ")")

          fix_test("seed aid", "apps/agro/tests/test_agro_aid_e2e.py",
                   "def _post(url: str, doc: dict) -> dict:", "/agro/producers")
          fix_test("seed n1", "apps/agro/tests/test_agro_n1.py",
                   "def _post(", "/agro/producers")
          fix_test("seed roles", "apps/agro/tests/test_agro_roles.py",
                   "def _post(url, doc):", "/agro/register")

          fix_wire("wire aid", "apps/agro/tests/test_agro_aid_e2e.py")
          fix_wire("wire n1", "apps/agro/tests/test_agro_n1.py")

          NEW_LINES = [
              "            if not ok:\n",
              "                _errtxt = str(_error or \"\")\n",
              "                _low = _errtxt.lower()\n",
              "                _ZYRA_OFFLINE_ = any(\n",
              "                    m in _low\n",
              "                    for m in (\n",
              "                        \"urlopen error\",\n",
              "                        \"connection refused\",\n",
              "                        \"connection reset\",\n",
              "                        \"timed out\",\n",
              "                        \"timeout\",\n",
              "                        \"unreachable\",\n",
              "                        \"errno\",\n",
              "                        \"max retries\",\n",
              "                    )\n",
              "                )\n",
              "                if not _ZYRA_OFFLINE_:\n",
              "                    if is_json:\n",
              "                        raise ValueError(\n",
              "                            \"registro rechazado: \" + _errtxt\n",
              "                        )\n",
              "                    self._html(\n",
              "                        400,\n",
              "                        _page(\n",
              "                            \"AGRO - Registro rechazado\",\n",
              "                            \"<h1>Registro rechazado</h1>\"\n",
              "                            \"<p>\" + _errtxt + \"</p>\"\n",
              "                            \"<a href='/agro/home'>\"\n",
              "                            \"<button>Volver</button></a>\",\n",
              "                        ),\n",
              "                    )\n",
              "                    return\n",
              "                # Resiliencia (principio de la Red, probado\n",
              "                # en AGRO y NEXO): red inalcanzable -> la app\n",
              "                # vive por si sola. Registro local sin ZID;\n",
              "                # el ZID se vincula despues via super-app.\n",
              "                # Un rechazo ACTIVO de la red (biometria,\n",
              "                # duplicado) sigue rechazando: la ley no se\n",
              "                # abre.\n",
              "                row = store.add_producer(\n",
              "                    producer_id=producer_id,\n",
              "                    zid=None,\n",
              "                    name=name,\n",
              "                    producer_type=(\n",
              "                        producer_type\n",
              "                    ),\n",
              "                    role=role,\n",
              "                    location=location,\n",
              "                    synced=False,\n",
              "                )\n",
              "                if is_json:\n",
              "                    self._send(\n",
              "                        201,\n",
              "                        {\n",
              "                            \"ok\": True,\n",
              "                            \"data\": row,\n",
              "                        },\n",
              "                    )\n",
              "                else:\n",
              "                    self._html(\n",
              "                        200,\n",
              "                        _page(\n",
              "                            \"Registro listo\",\n",
              "                            \"<h1>Registro listo\"\n",
              "                            \"</h1><p>Tu ID: <b>\"\n",
              "                            + producer_id\n",
              "                            + \"</b></p>\"\n",
              "                            \"<a href='/agro/productor/\"\n",
              "                            + producer_id\n",
              "                            + \"'><button>Ir a mi\"\n",
              "                            \" panel</button></a>\",\n",
              "                        ),\n",
              "                    )\n",
              "                return\n",
          ]

          def fix_server(txt):
              if "_ZYRA_OFFLINE_" in txt:
                  return None
              lines = txt.splitlines(keepends=True)
              ie = None
              for i, l in enumerate(lines):
                  if "link.enroll_producer(" in l:
                      ie = i
                      break
              if ie is None:
                  raise ValueError("enroll_producer no encontrado en server")
              istart = None
              for i in range(ie, len(lines)):
                  if lines[i].strip() == "if not ok:":
                      istart = i
                      break
              if istart is None:
                  raise ValueError("if not ok no encontrado tras enroll")
              iend = None
              for i in range(istart + 1, len(lines)):
                  if lines[i].strip() == "return":
                      iend = i
                      break
              if iend is None:
                  raise ValueError("return del bloque no encontrado")
              out = lines[:istart] + NEW_LINES + lines[iend + 1:]
              return "".join(out)

          sp = Path("apps/agro/server.py")
          if not sp.exists():
              REPORT.append("MISS  server-resiliencia (apps/agro/server.py no existe)")
          else:
              txt = sp.read_text(encoding="utf-8")
              try:
                  res = fix_server(txt)
              except Exception as exc:
                  REPORT.append("MISS  server-resiliencia (" + str(exc) + ")")
              else:
                  if res is None:
                      REPORT.append("SKIP  server-resiliencia (ya aplicado)")
                  else:
                      try:
                          compile(res, "apps/agro/server.py", "exec")
                      except SyntaxError as exc:
                          REPORT.append("FAIL  server-resiliencia (syntax linea " + str(exc.lineno) + ")")
                      else:
                          sp.write_text(res, encoding="utf-8")
                          REPORT.append("OK    server-resiliencia")

          print("")
          print("======== REPORTE DE PARCHES ========")
          for r in REPORT:
              print(r)
          print("====================================")
          print("")
          for f in (
              "apps/agro/tests/test_agro_aid_e2e.py",
              "apps/agro/tests/test_agro_n1.py",
              "apps/agro/tests/test_agro_roles.py",
          ):
              p = Path(f)
              if p.exists():
                  t = p.read_text(encoding="utf-8")
                  guion = '"zyra-" +' in t
                  print(f"{f}: semilla_nueva={'_seed = (str(' in t)} | guion_viejo={guion} | wire={'DeterministicTestProvider' in t}")
          srv = Path("apps/agro/server.py")
          if srv.exists():
              t = srv.read_text(encoding="utf-8")
              print("server.py: resiliencia=" + str("_ZYRA_OFFLINE_" in t))
          PATCHEOF

      - name: "Paso 2 - SMOKE: 3 semillas -> 3 ZID + offline -> 201 local sin ZID"
        run: |
          python3 - <<'SMOKEEOF'
          import json
          import threading
          import time
          import urllib.error
          import urllib.request

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          from shared_engines.security.biometrics import (
              BiometricsEngine,
              BiometricsPolicy,
              DeterministicTestProvider,
              TemplateCipher,
          )
          from apps.agro.infrastructure.network.network_client import NetworkClient
          from apps.agro.infrastructure.persistence.agro_store import AgroStore
          from apps.agro.server import serve_agro

          def seed_for(name):
              return (name.strip().encode("utf-8").hex() + "zyra" * 16)[:64]

          db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=db, clock=FrozenClock(), signer=signer,
              config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=db, clock=FrozenClock(), audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(db, FrozenClock(), identity=kernel.identity, signer=signer)
          server = serve_combined(kernel, caps, host="127.0.0.1", port=0)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base = f"http://127.0.0.1:{server.server_address[1]}"

          for name in ("Jose Rural", "Nuevo Sin Verificar", "Ganadero Lopez"):
              body = {
                  "kind": "person",
                  "display_name": name,
                  "actor": "smoke",
                  "doc_image_b64": seed_for(name),
                  "selfie_image_b64": seed_for(name),
              }
              req = urllib.request.Request(
                  base + "/identity/enroll",
                  data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      print(f"enroll {name}: {r.status}")
              except urllib.error.HTTPError as e:
                  print(f"enroll {name}: {e.code} {e.read().decode()[:200]}")

          dead = NetworkClient("http://127.0.0.1:1", timeout_seconds=1.0, max_retries=0)
          srv = serve_agro(AgroStore(SQLiteAdapter(":memory:"), FrozenClock()), dead)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.4)
          abase = f"http://127.0.0.1:{srv.bound_port}"
          payload = {
              "name": "Maria Offline",
              "producer_type": "agricultora",
              "location": "Usulutan",
              "doc_image_b64": seed_for("Maria Offline"),
              "selfie_image_b64": seed_for("Maria Offline"),
          }
          req = urllib.request.Request(
              abase + "/agro/producers",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  print("OFFLINE /agro/producers:", r.status, r.read().decode()[:250])
          except urllib.error.HTTPError as e:
              print("OFFLINE /agro/producers:", e.code, e.read().decode()[:250])

          print("SMOKE COMPLETADO")
          SMOKEEOF

      - name: "Paso 3 - GATE COMPLETO: 4 apps sin exclusiones"
        run: |
          python3 -m pytest apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests apps/agro/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA FIX v12: semilla base64 valida + resiliencia AGRO" -m "Semilla sin guion (hex+relleno, 64 chars base64 validos); wire biometrico en ecosistemas aid/n1; server AGRO: red inalcanzable -> registro local sin ZID (principio de resiliencia), rechazo activo sigue rechazando; gate completo 4 apps."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
