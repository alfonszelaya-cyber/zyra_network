                                  " status, created_at FROM"
                                  " agro_plans WHERE"
                                  " producer_id = ?"
                                  " ORDER BY created_at",
                                  (producer_id,),
                              )
                          except Exception:
                              got = None
                          if got:
                              return [dict(r) for r in got]
                  return []
          ''')

