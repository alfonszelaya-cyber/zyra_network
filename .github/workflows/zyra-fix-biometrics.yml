name: ZYRA A3 descubrir acceso y menus del laboratorio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faseA3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography

      - name: Descubrir cabecera ZID y menus (solo lectura)
        run: |
          python3 - <<'PYEOF'
          import json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseA3.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _man

          def pedir(url, headers=None):
              req = urllib.request.Request(url)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=8) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, '', str(e)

          add('# A3 - DESCUBRIR ACCESO ZID Y MENUS DEL LABORATORIO (solo lectura)')
          add('')

          add('## E1. Como lee el ZID el laboratorio (codigo real)')
          add('')
          p = ROOT / 'apps' / 'laboratorio' / 'infrastructure' / 'security' / 'zid_auth.py'
          if p.exists():
              add('```python')
              for i, l in enumerate(p.read_text(encoding='utf-8', errors='replace').splitlines()[:80]):
                  add('%d: %s' % (i + 1, l.rstrip()[:150]))
              add('```')
          else:
              add('- zid_auth.py no existe en esa ruta; busco extraer_identidad...')
              for q in (ROOT / 'apps' / 'laboratorio').rglob('*.py'):
                  t = q.read_text(encoding='utf-8', errors='replace') if q.stat().st_size else ''
                  if 'def extraer_identidad' in t:
                      add('```python')
                      ls = t.splitlines()
                      idx = [i for i, l in enumerate(ls) if 'def extraer_identidad' in l][0]
                      for i in range(idx, min(idx + 40, len(ls))):
                          add('%d: %s' % (i + 1, ls[i].rstrip()[:150]))
                      add('```')
                      break
          add('')

          add('## E2. Experimento en vivo: que cabecera abre el panel')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-a3', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-a3', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _c, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _c, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- sistema arriba: red=%s superapp=%s' % (vivo, spv))
          add('')
          pruebas = [
              ('sin nada', {}),
              ('X-ZID', {'X-ZID': 'Z-TEST-0001'}),
              ('ZID', {'ZID': 'Z-TEST-0001'}),
              ('X-Lab-ZID', {'X-Lab-ZID': 'Z-TEST-0001'}),
              ('Authorization Bearer', {'Authorization': 'Bearer Z-TEST-0001'}),
              ('Cookie zid', {'Cookie': 'zid=Z-TEST-0001'}),
          ]
          gano = None
          if spv:
              for nombre, hdr in pruebas:
                  st, ct, cuerpo = pedir(BSP + '/laboratorio/ui', hdr)
                  es_html = 'text/html' in ct.lower()
                  add('- %s -> %s (%s) %s' % (nombre, st, 'HTML' if es_html else 'no-html', 'OK' if (st == 200 and es_html) else ''))
                  if st == 200 and es_html and gano is None:
                      gano = (nombre, hdr)
          add('')
          if gano:
              add('**CABERA QUE FUNCIONA: %s**' % gano[0])
          else:
              add('- Ninguna cabecera simple abrio el panel. El codigo de E1 dirá el formato exacto.')
          add('')

          add('## E3. Menus reales de la UI (para las tarjetas)')
          add('')
          if spv and gano:
              st, ct, cuerpo = pedir(BSP + '/laboratorio/ui', gano[1])
              ids = sorted(set(re.findall(r'/laboratorio/ui/([a-z0-9_\-]{2,40})', cuerpo)))
              add('- menu_id encontrados en la home: %d' % len(ids))
              for i in ids[:25]:
                  add('  - %s' % i)
              DATA['menus'] = ids
              tit = re.search(r'<title>([^<]{1,80})</title>', cuerpo)
              add('- titulo de la home: %s' % (tit.group(1) if tit else '?'))
              add('- tamano HTML de la home: %d bytes (interfaz real presente)' % len(cuerpo))
          elif spv:
              st, ct, cuerpo = pedir(BSP + '/laboratorio/ui')
              add('- sin cabecera valida, la home responde: %s (%s)' % (st, ct[:30] or cuerpo[:80]))
          add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          add('## Con esto se hace A4')
          add('')
          add('A4 = tarjetas funcionales: cada tarjeta lleva a su panel real, con la')
          add('pantalla de identificacion ZID integrada (si la cabecera lo permite via navegador).')
          add('')
          DATA['cabecera'] = gano[0] if gano else None
          Path('faseA3.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('A3 terminada. Cabecera:', gano[0] if gano else 'NINGUNA', '| menus:', len(DATA.get('menus', [])))
          PYEOF

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseA3-zyra
          path: faseA3.json
          if-no-files-found: ignore
