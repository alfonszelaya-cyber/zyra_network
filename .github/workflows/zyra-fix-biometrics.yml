name: "AXIS AX-7 AUDITORIA REAL COMPLETA (SOLO LECTURA): funciona/no funciona, duplicados, sintaxis, logica, carpetas utiles vs inutiles"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: axis-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "1. SINTAXIS: compilar TODOS los .py de apps/axis (errores exactos si hay)"
        run: |
          python3 - <<'S1EOF'
          from pathlib import Path
          import ast
          malos = []
          total = 0
          for f in sorted(Path("apps/axis").rglob("*.py")):
              total += 1
              try:
                  ast.parse(f.read_text(encoding="utf-8",
                      errors="replace"))
              except SyntaxError as e:
                  malos.append((str(f), e.lineno, e.msg))
          print("archivos escaneados: " + str(total))
          print("errores de sintaxis: " + str(len(malos)))
          for s, ln, m in malos:
              print("  ERROR " + s + ":" + str(ln)
                    + ": " + m)
          S1EOF

      - name: "2. IMPORTS REALES: todo modulo con codigo importa limpio? (funciona/no funciona)"
        run: |
          python3 - <<'S2EOF'
          from pathlib import Path
          import importlib, traceback
          base = Path("apps/axis")
          modulos = []
          for f in sorted(base.rglob("*.py")):
              if f.name == "__init__.py":
                  continue
              if f.stat().st_size == 0:
                  continue
              rel = f.relative_to(
                  Path(".")).with_suffix("")
              modulos.append(str(rel).replace("/", "."))
          ok = []
          mal = []
          for m in modulos:
              try:
                  importlib.import_module(m)
                  ok.append(m)
              except Exception as e:
                  mal.append((m,
                      type(e).__name__ + ": "
                      + str(e)[:120]))
          print("modulos con codigo: " + str(len(ok) + len(mal)))
          print("importan OK: " + str(len(ok)))
          print("IMPORT ROTO: " + str(len(mal)))
          for m, e in mal:
              print("  ROTO " + m + " -> " + e)
          S2EOF

      - name: "3. QUE ARCHIVOS USA EL SISTEMA VIVO (grafo de imports desde server/tests) vs islas sin uso"
        run: |
          python3 - <<'S3EOF'
          from pathlib import Path
          import ast
          base = Path("apps/axis")
          todos = {}
          for f in sorted(base.rglob("*.py")):
              if f.name == "__init__.py":
                  continue
              if f.stat().st_size == 0:
                  continue
              rel = "apps.axis." + str(
                  f.relative_to(base)).replace("/", ".")[:-3]
              todos[rel] = f
          vivos = set()
          raices = ["apps.axis.server",
                    "apps.axis.tests.test_axis",
                    "apps.axis.tests.test_axis_emergencias_e2e"]
          for lt in Path("apps/axis/life_history/tests").glob("test_*.py"):
              raices.append("apps.axis.life_history.tests."
                            + lt.stem)
          cola = list(raices)
          while cola:
              m = cola.pop()
              if m in vivos or m not in todos:
                  continue
              vivos.add(m)
              try:
                  tree = ast.parse(
                      todos[m].read_text(encoding="utf-8"))
              except Exception:
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          cola.append(a.name)
                  elif isinstance(node, ast.ImportFrom):
                      if node.module:
                          cola.append(node.module)
          print("=== ISLAS SIN USO (ni directa ni transitivamente desde server/tests): "
                + str(len(todos) - len(vivos & set(todos))) + " ===")
          for m in sorted(set(todos) - vivos):
              print("  ISLA: " + m)
          print()
          print("=== VIVOS (alcanzables): "
                + str(len(vivos & set(todos))) + " ===")
          for m in sorted(vivos & set(todos)):
              print("  VIVO: " + m)
          S3EOF

      - name: "4. NOMBRES DUPLICADOS + carpetas: sirven para crecimiento o son islas?"
        run: |
          python3 - <<'S4EOF'
          from pathlib import Path
          from collections import defaultdict
          por_nombre = defaultdict(list)
          for f in Path("apps/axis").rglob("*.py"):
              if f.name == "__init__.py":
                  continue
              por_nombre[f.name].append(str(f))
          dups = {k: v for k, v in por_nombre.items()
                  if len(v) > 1}
          print("=== DUPLICADOS DE NOMBRE: "
                + str(len(dups)) + " ===")
          for k, v in sorted(dups.items()):
              print("-- " + k)
              for p in v:
                  print("   " + p)
          print()
          base = Path("apps/axis")
          carpetas = defaultdict(lambda: [0, 0])
          for f in base.rglob("*.py"):
              rel = str(f.relative_to(base))
              top = rel.split("/")[0]
              if f.name == "__init__.py":
                  if f.stat().st_size == 0:
                      carpetas[top][1] += 1
              else:
                  carpetas[top][0] += 1
          print("=== CARPETAS RAIZ: codigo vs solo-__init__ ===")
          for k in sorted(carpetas):
              c, i = carpetas[k]
              print("  " + k + ": "
                    + str(c) + " archivos con codigo, "
                    + str(i) + " __init__ vacios")
          S4EOF

      - name: "5. LOGICA: imports cruzados rotos (from X import Y donde Y no existe)"
        run: |
          python3 - <<'S5EOF'
          from pathlib import Path
          import ast
          base = Path("apps/axis")
          rotos = []
          for f in sorted(base.rglob("*.py")):
              if f.stat().st_size == 0:
                  continue
              try:
                  tree = ast.parse(f.read_text(
                      encoding="utf-8"))
              except Exception:
                  continue
              for node in ast.walk(tree):
                  if not isinstance(node, ast.ImportFrom):
                      continue
                  mod = node.module or ""
                  if not mod.startswith("apps.axis"):
                      continue
                  ruta = Path(mod.replace(".", "/") + ".py")
                  paq = Path(mod.replace(".", "/"))
                  if ruta.exists():
                      destino = ruta
                  elif (paq / "__init__.py").exists():
                      destino = paq / "__init__.py"
                  else:
                      rotos.append((str(f), node.lineno,
                          "modulo no existe: " + mod))
                      continue
                  try:
                      dtree = ast.parse(destino.read_text(
                          encoding="utf-8"))
                  except Exception:
                      continue
                  definidos = set()
                  for d in ast.walk(dtree):
                      if isinstance(d, (ast.FunctionDef,
                                        ast.AsyncFunctionDef,
                                        ast.ClassDef)):
                          definidos.add(d.name)
                      elif isinstance(d, ast.Assign):
                          for t in d.targets:
                              if isinstance(t, ast.Name):
                                  definidos.add(t.id)
                  for a in node.names:
                      if a.name == "*":
                          continue
                      if a.name not in definidos:
                          rotos.append((str(f), node.lineno,
                              mod + "." + a.name
                              + " NO definido"))
          print("=== IMPORTS CRUZADOS ROTOS: "
                + str(len(rotos)) + " ===")
          for s, ln, m in rotos:
              print("  ROTO " + s + ":" + str(ln)
                    + ": " + m)
          S5EOF

      - name: "6. TESTS: estado real completo (4 apps)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=line 2>&1 | tail -6

      - name: "7. RESUMEN AUTOMATICO: que se va a borrar (propuesta, NO ejecuta nada)"
        run: |
          python3 - <<'S7EOF'
          from pathlib import Path
          import ast
          base = Path("apps/axis")
          todos = {}
          for f in sorted(base.rglob("*.py")):
              if f.name == "__init__.py":
                  continue
              if f.stat().st_size == 0:
                  continue
              rel = "apps.axis." + str(
                  f.relative_to(base)).replace("/", ".")[:-3]
              todos[rel] = f
          vivos = set()
          raices = ["apps.axis.server",
                    "apps.axis.tests.test_axis",
                    "apps.axis.tests.test_axis_emergencias_e2e"]
          for lt in Path("apps/axis/life_history/tests").glob("test_*.py"):
              raices.append("apps.axis.life_history.tests."
                            + lt.stem)
          cola = list(raices)
          while cola:
              m = cola.pop()
              if m in vivos or m not in todos:
                  continue
              vivos.add(m)
              try:
                  tree = ast.parse(
                      todos[m].read_text(encoding="utf-8"))
              except Exception:
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          cola.append(a.name)
                  elif isinstance(node, ast.ImportFrom):
                      if node.module:
                          cola.append(node.module)
          islas = sorted(set(todos) - vivos)
          carpetas_isla = set()
          for m in islas:
              partes = m.split(".")[2:-1]
              if partes:
                  carpetas_isla.add("/".join(partes))
          print("=== PROPUESTA DE BORRADO (pendiente de tu OK) ===")
          print()
          print("A) Archivos-isla sin uso (" + str(len(islas)) + "):")
          for m in islas:
              f = todos[m]
              print("   BORRAR? " + str(f)
                    + " (" + str(f.stat().st_size) + "b)")
          print()
          print("B) Carpetas que quedarian 100% vacias tras borrar A:")
          for c in sorted(carpetas_isla):
              print("   BORRAR? apps/axis/" + c + "/")
          print()
          print("C) __init__.py vacios en carpetas sin codigo: se cuentan en el run de ejecucion")
          print()
          print("NOTA: nada se borro. Esto es la propuesta para tu decision.")
          S7EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
