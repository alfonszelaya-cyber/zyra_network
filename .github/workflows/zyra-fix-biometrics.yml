          T1_EOF
          cat > apps/laboratorio/tests/test_ciclo_proyectos.py <<'T2_EOF'
          """Ciclo completo: crear proyecto -> escena -> generar artefacto."""
          import json

          from apps.laboratorio.tests.conftest import assert_2xx


          def _post(despachar, ruta, cuerpo):
              return despachar("POST", ruta, json.dumps(cuerpo).encode("utf-8"))


          def test_crear_proyecto_y_listar(despachar):
              status, _h, datos = _post(despachar, "/laboratorio/api/v1/projects", {
                  "titulo": "Proyecto de prueba",
                  "descripcion": "ciclo completo",
                  "tipo": "negocio",
              })
              assert_2xx(status, datos)
              proyecto = datos["datos"]["proyecto"]
              assert proyecto["titulo"] == "Proyecto de prueba"
              status2, _h2, lista = despachar("GET", "/laboratorio/api/v1/projects")
              assert_2xx(status2, lista)
              ids = [p["id"] for p in lista["datos"]["proyectos"]]
              assert proyecto["id"] in ids


          def test_crear_proyecto_sin_titulo_rechaza(despachar):
              status, _h, datos = _post(despachar, "/laboratorio/api/v1/projects", {"titulo": ""})
              assert status == 400
              assert datos["error"]["codigo"] == "valor_invalido"


          def test_crear_escena_y_generar_imagen(despachar):
              _s, _h, datos = _post(despachar, "/laboratorio/api/v1/projects", {
                  "titulo": "Con escena", "tipo": "negocio",
              })
              assert_2xx(_s, datos)
              proyecto_id = datos["datos"]["proyecto"]["id"]
              status, _h2, datos2 = _post(
                  despachar,
                  "/laboratorio/api/v1/projects/" + proyecto_id + "/scenes",
                  {
                      "nombre": "Escena 1",
                      "objetos": [
                          {"forma": "rect", "x": 5, "y": 5, "w": 40, "h": 20, "color": "#22D3EE", "capa": "fondo"},
                      ],
                  },
              )
              assert_2xx(status, datos2)
              escena_id = datos2["datos"]["escena"]["id"]
              status3, _h3, datos3 = _post(
                  despachar,
                  "/laboratorio/api/v1/scenes/" + escena_id + "/generate",
                  {"formato": "imagen"},
              )
              assert_2xx(status3, datos3)
              artefacto = datos3["datos"]["artefacto"]
              assert artefacto["formato"] == "imagen"
          T2_EOF
          cat > apps/laboratorio/tests/test_motores.py <<'T3_EOF'
          """Motores: render PBR, glTF/GLB, Monte Carlo, salidas universales."""
          import json
          import struct

          import pytest

          from apps.laboratorio.infrastructure.providers.generation_engine import MotorGeneracionReal
          from apps.laboratorio.infrastructure.providers.monte_carlo_engine import MotorMonteCarlo
          from apps.laboratorio.infrastructure.providers.renderer_photoreal import MotorRenderFotoreal
          from apps.laboratorio.infrastructure.providers.display_holo3d import MotorHolo3D
          from apps.laboratorio.infrastructure.providers.png_encoder import encode_png_rgb
          from apps.laboratorio.shared.exceptions.render_errors import EscenaVaciaError
          from apps.laboratorio.tests.conftest import construir_escena, construir_escena_vacia


          def test_pbr_genera_png_valido_con_profundidad():
              resultado = MotorRenderFotoreal().renderizar(construir_escena(), {"muestras": 1})
              assert bytes(resultado.imagen_bytes[:8]) == b"\x89PNG\r\n\x1a\n"
              assert bytes(resultado.profundidad_bytes[:8]) == b"\x89PNG\r\n\x1a\n"
              assert resultado.metadata["brdf"] == "GGX Cook-Torrance"
              assert resultado.metadata["tonemap"] == "ACES"


          def test_pbr_rechaza_escena_vacia():
              with pytest.raises(EscenaVaciaError):
                  MotorRenderFotoreal().renderizar(construir_escena_vacia(), {})


          def test_gltf_2_0_json_real():
              gltf = json.loads(
                  MotorGeneracionReal().generar(construir_escena(), "modelo").decode("utf-8")
              )
              assert gltf["asset"]["version"] == "2.0"
              assert len(gltf["meshes"]) == 2
              assert gltf["buffers"][0]["uri"].startswith("data:application/octet-stream;base64,")


          def test_glb_binario_real():
              glb = MotorGeneracionReal().generar(construir_escena(), "modelo_glb")
              magico, version, total = struct.unpack("<III", glb[:12])
              assert (magico, version, total) == (0x46546C67, 2, len(glb))
              largo_json, tipo_json = struct.unpack("<II", glb[12:20])
              assert tipo_json == 0x4E4F534A
              base = 20 + largo_json
              _largo_bin, tipo_bin = struct.unpack("<II", glb[base:base + 8])
              assert tipo_bin == 0x004E4942


          def test_monte_carlo_reproducible():
              mc = MotorMonteCarlo()
              config = {
                  "variables": {
                      "costo": {"dist": "normal", "media": 45.0, "desv": 8.0},
                      "beneficio": {"dist": "uniforme", "minimo": 55.0, "maximo": 90.0},
                      "riesgo": {"dist": "triangular", "minimo": 10.0, "modo": 30.0, "maximo": 70.0},
                  },
                  "corridas": 3000,
                  "semilla": 42,
              }
              r1 = mc.simular(config)
              r2 = mc.simular(config)
              assert r1 == r2
              assert r1["p5"] <= r1["p50"] <= r1["p95"]
              lo, hi = r1["ic95"]
              assert lo <= r1["media"] <= hi


          def test_monte_carlo_rechaza_distribucion_invalida():
              mc = MotorMonteCarlo()
              with pytest.raises(ValueError):
                  mc.simular({"variables": {
                      "costo": {"dist": "cuantica", "media": 1.0},
                      "beneficio": {"dist": "normal", "media": 2.0, "desv": 1.0},
                      "riesgo": {"dist": "normal", "media": 3.0, "desv": 1.0},
                  }})


          def test_salida_universal_web_pull():
              disp = MotorHolo3D()
              registro = disp.registrar_destino("web", "", "test-movil")
              frame = encode_png_rgb(8, 8, bytes(8 * 8 * 3))
              entrega = disp.presentar(frame, {})
              assert entrega["entregado"] is True
              recuperado, mime = disp.frame_actual(registro["id"])
              assert recuperado == frame
              assert mime == "image/png"


          def test_salida_universal_sin_destino_es_honesta():
              disp = MotorHolo3D()
              frame = encode_png_rgb(8, 8, bytes(8 * 8 * 3))
              entrega = disp.presentar(frame, {"tipo": "udp"})
              assert entrega["entregado"] is False
              assert "sin destino" in entrega["motivo"]
          T3_EOF
          cat > apps/laboratorio/tests/test_concurrencia.py <<'T5_EOF'
          """Concurrencia real: escrituras simultaneas sin corrupcion."""
          import json
          import threading

          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.infrastructure.cache import CacheTTL
          from apps.laboratorio.infrastructure.messaging.event_bus import BusEventos
          from apps.laboratorio.shared.interfaces.event_bus import Evento
          from apps.laboratorio.tests.conftest import IDENTIDAD_HEADERS, assert_2xx


          def test_10_hilos_crea_proyectos_simultaneos():
              app = montar_aplicacion(":memory:")
              resultados = []
              errores = []
              lock = threading.Lock()

              def _crear(indice):
                  try:
                      salida = app.despachar(
                          "POST", "/laboratorio/api/v1/projects",
                          dict(IDENTIDAD_HEADERS),
                          json.dumps({"titulo": "Hilo " + str(indice), "tipo": "negocio"}).encode("utf-8"),
                      )
                      with lock:
                          resultados.append(salida[0])
                  except Exception as exc:
                      with lock:
                          errores.append(str(exc))

              hilos = [threading.Thread(target=_crear, args=(i,)) for i in range(10)]
              for h in hilos:
                  h.start()
              for h in hilos:
                  h.join(timeout=30)
              assert not errores, errores
              assert len(resultados) == 10
              assert all(200 <= c < 300 for c in resultados), resultados


          def test_bus_aisla_fallos_y_no_pierde_eventos():
              bus = BusEventos()
              recibidos = []
              bus.suscribir("ev.x", lambda e: recibidos.append(e))

              def _fallador(_e):
                  raise RuntimeError("intencional")

              bus.suscribir("ev.x", _fallador)
              for i in range(20):
                  bus.publicar(Evento(nombre="ev.x", datos={"i": i}))
              assert len(recibidos) == 20


          def test_cache_ttl_concurrente_sin_excepciones():
              cache = CacheTTL(ttl_segundos=5.0, maxlen=100)

              def _escribir(indice):
                  for i in range(50):
                      cache.poner("k" + str(indice) + "-" + str(i), i)
                      cache.obtener("k" + str(indice) + "-" + str(i))

              hilos = [threading.Thread(target=_escribir, args=(i,)) for i in range(5)]
              for h in hilos:
                  h.start()
              for h in hilos:
                  h.join(timeout=30)
              assert cache.estadisticas()["entradas"] <= 100
          T5_EOF
          cat > apps/laboratorio/tests/test_persistencia.py <<'T4_EOF'
          """Persistencia real: los datos sobreviven entre instancias."""
          import json
          import os
          import tempfile

          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.tests.conftest import IDENTIDAD_HEADERS, assert_2xx


          def test_proyecto_sobrevive_reinicio_de_app():
              with tempfile.TemporaryDirectory() as tmp:
                  ruta_bd = os.path.join(tmp, "lab.db")
                  app1 = montar_aplicacion(ruta_bd)
                  salida = app1.despachar(
                      "POST", "/laboratorio/api/v1/projects",
                      dict(IDENTIDAD_HEADERS),
                      json.dumps({"titulo": "Persistente", "tipo": "negocio"}).encode("utf-8"),
                  )
                  assert_2xx(salida[0], salida[2][:300])
                  datos = json.loads(salida[2].decode("utf-8"))
                  proyecto_id = datos["datos"]["proyecto"]["id"]
                  app2 = montar_aplicacion(ruta_bd)
                  salida2 = app2.despachar(
                      "GET", "/laboratorio/api/v1/projects/" + proyecto_id,
                      dict(IDENTIDAD_HEADERS), b"",
                  )
                  assert_2xx(salida2[0], salida2[2][:300])
                  datos2 = json.loads(salida2[2].decode("utf-8"))
                  assert datos2["datos"]["proyecto"]["titulo"] == "Persistente"


          def test_historial_registra_operaciones():
              with tempfile.TemporaryDirectory() as tmp:
                  app1 = montar_aplicacion(os.path.join(tmp, "h.db"))
                  salida = app1.despachar(
                      "POST", "/laboratorio/api/v1/projects",
                      dict(IDENTIDAD_HEADERS),
                      json.dumps({"titulo": "Historial", "tipo": "negocio"}).encode("utf-8"),
                  )
                  assert_2xx(salida[0], salida[2][:300])
                  proyecto_id = json.loads(salida[2].decode("utf-8"))["datos"]["proyecto"]["id"]
                  repo = app1.contenedor.obtener("repo_historial")
                  entradas = repo.listar({"proyecto_id": proyecto_id}, 10, 0)
                  assert len(entradas) >= 1
          T4_EOF
          cat > apps/laboratorio/tests/test_seguridad_permisos.py <<'T6_EOF'
