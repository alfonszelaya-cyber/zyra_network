name: "ZYRA NEXO E3 v4: compliance+risk definitivo"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Forzar 36 archivos compliance+risk
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def wf(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          CMP = "apps/nexo/domain/compliance"
          RSK = "apps/nexo/domain/risk"
          UCC = "apps/nexo/application/compliance_use_cases"
          UCR = "apps/nexo/application/risk_use_cases"

          # ===== PUENTES (4) =====

          wf(CMP + "/compliance_registry.py", D(r'''
              """Compliance Registry - NEXO / ZYRA."""
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "compliance_registry", (
                      "CREATE TABLE IF NOT EXISTS compliance_registry (event_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, event_type TEXT NOT NULL, description TEXT NOT NULL DEFAULT '', period_id TEXT, created_at REAL NOT NULL)",
                  )),
              )

              class ComplianceRegistry:
                  """Registro central de cumplimiento."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.compliancereg", _MIGRATIONS).run(clock)

                  def store(self, event):
                      event_id = event.get("event_id", f"CMP-{uuid.uuid4()}")
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT OR REPLACE INTO compliance_registry"
                              " (event_id, company_id, event_type,"
                              " description, period_id, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?)",
                              (event_id, str(event.get("company_id", "")),
                               str(event.get("event_type", "")),
                               str(event.get("description", "")),
                               event.get("period_id"), now))
                      event["event_id"] = event_id
                      event["created_at"] = now
                      return event

                  def get_by_period(self, *, company_id, period_id):
                      rows = self._db.query_all(
                          "SELECT * FROM compliance_registry"
                          " WHERE company_id = ? AND period_id = ?"
                          " ORDER BY created_at",
                          (company_id, period_id))
                      return [dict(r) for r in rows]

                  def get_all(self):
                      return [dict(r) for r in self._db.query_all(
                          "SELECT * FROM compliance_registry ORDER BY created_at")]

                  def total(self):
                      row = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM compliance_registry")
                      return int(row["n"]) if row else 0
          '''))

          wf(CMP + "/compliance_validation_engine.py", D(r'''
              """Compliance Validation Engine - NEXO / ZYRA."""
              from __future__ import annotations
              from typing import Dict

              class ComplianceValidationEngine:
                  """Valida operaciones contra reglas basicas."""

                  def validate(self, *, operation_data):
                      violations = []
                      warnings = []
                      try:
                          amt = float(operation_data.get("amount", 0))
                      except Exception:
                          amt = 0
                      if amt <= 0:
                          violations.append("INVALID_AMOUNT")
                      if not operation_data.get("counterparty"):
                          warnings.append("NO_COUNTERPARTY")
                      if operation_data.get("sanctioned", False):
                          violations.append("SANCTIONED_COUNTERPARTY")
                      return {"is_valid": len(violations) == 0,
                              "violations": violations,
                              "warnings": warnings}
          '''))

          wf(RSK + "/risk_evaluation_engine.py", D(r'''
              """Risk Evaluation Engine - NEXO / ZYRA."""
              from __future__ import annotations
              from typing import Dict
              import uuid
              from datetime import datetime

              class RiskEvaluationEngine:
                  """Evalua contexto de riesgo."""

                  def evaluate(self, *, risk_context):
                      scores = [v.get("score", 0)
                                for v in risk_context.get("components", {}).values()
                                if isinstance(v, dict)]
                      if not scores:
                          scores = [int(risk_context.get("score", 0))]
                      global_score = round(sum(scores) / len(scores), 2)
                      if global_score >= 80:
                          level = "CRITICAL"
                      elif global_score >= 60:
                          level = "HIGH"
                      elif global_score >= 30:
                          level = "MEDIUM"
                      else:
                          level = "LOW"
                      return {"evaluation_id": f"EVL-{uuid.uuid4()}",
                              "global_score": global_score,
                              "level": level,
                              "components": risk_context.get("components", {}),
                              "generated_at": datetime.utcnow().isoformat(),
                              "status": "COMPLETED"}
          '''))

          wf(RSK + "/risk_reporting_engine.py", D(r'''
              """Risk Reporting Engine - NEXO / ZYRA."""
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid
              from datetime import datetime

              class RiskReportingEngine:
                  """Genera reportes de riesgo."""

                  def __init__(self):
                      self._reports = []

                  def generate_report(self, *, period, filters=None):
                      report = {"report_id": f"RRP-{uuid.uuid4()}",
                                "period": period,
                                "filters": filters or {},
                                "generated_at": datetime.utcnow().isoformat(),
                                "report_type": "RISK_REPORT",
                                "status": "GENERATED"}
                      self._reports.append(report)
                      return report

                  def get_reports(self):
                      return list(self._reports)
          '''))

          # ===== COMPLIANCE ENGINES (5) =====

          wf(CMP + "/compliance_engine.py", D(r'''
              """Compliance Engine - NEXO / ZYRA (persistente)."""
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "compliance_core", (
                      "CREATE TABLE IF NOT EXISTS compliance_core (item_id TEXT PRIMARY KEY, item_kind TEXT NOT NULL, entity_id TEXT NOT NULL, payload_json TEXT NOT NULL, created_at REAL NOT NULL)",
                  )),
              )

              class ComplianceEngine:
                  """Motor central de cumplimiento (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.compliance", _MIGRATIONS).run(clock)

                  def _insert(self, kind, entity_id, payload):
                      import json as _j
                      item_id = f"CMP-{uuid.uuid4()}"
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO compliance_core"
                              " (item_id, item_kind, entity_id, payload_json, created_at)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (item_id, kind, entity_id,
                               _j.dumps(payload, default=str),
                               self._clock.now()))
                      return item_id

                  def register_event(self, *, event_type, entity_id, details):
                      item_id = self._insert("EVENT", entity_id,
                                             {"event_type": event_type, **details})
                      return {"event_id": item_id, "event_type": event_type,
                              "entity_id": entity_id, "details": details,
                              "status": "REGISTERED"}

                  def register_violation(self, *, entity_id, violation_type, details):
                      item_id = self._insert("VIOLATION", entity_id,
                                             {"violation_type": violation_type, **details})
                      return {"violation_id": item_id, "entity_id": entity_id,
                              "violation_type": violation_type, "details": details,
                              "status": "OPEN"}

                  def create_alert(self, *, entity_id, level, message):
                      item_id = self._insert("ALERT", entity_id,
                                             {"level": level, "message": message})
                      return {"alert_id": item_id, "entity_id": entity_id,
                              "level": level, "message": message, "status": "ACTIVE"}

                  def get_events_by_entity(self, entity_id):
                      rows = self._db.query_all(
                          "SELECT * FROM compliance_core"
                          " WHERE entity_id = ? AND item_kind = 'EVENT'"
                          " ORDER BY created_at", (entity_id,))
                      return [dict(r) for r in rows]

                  def generate_summary(self):
                      rows = self._db.query_all(
                          "SELECT item_kind, COUNT(*) AS n"
                          " FROM compliance_core GROUP BY item_kind")
                      counts = {str(r["item_kind"]): int(r["n"]) for r in rows}
                      return {"events": counts.get("EVENT", 0),
                              "violations": counts.get("VIOLATION", 0),
                              "alerts": counts.get("ALERT", 0),
                              "generated_at": self._clock.now()}

                  def generate_report(self):
                      return {"summary": self.generate_summary(),
                              "report_type": "COMPLIANCE_REPORT",
                              "generated_at": self._clock.now()}
          '''))

          wf(CMP + "/audit_compliance_engine.py", D(r'''
              """Audit Compliance Engine - NEXO / ZYRA (persistente)."""
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid
              import json as _j
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "compliance_audits", (
                      "CREATE TABLE IF NOT EXISTS compliance_audits (audit_id TEXT PRIMARY KEY, scope_json TEXT NOT NULL, findings_json TEXT NOT NULL DEFAULT '[]', observations_json TEXT NOT NULL DEFAULT '[]', violations_json TEXT NOT NULL DEFAULT '[]', risk_level TEXT NOT NULL DEFAULT 'LOW', status TEXT NOT NULL DEFAULT 'COMPLETED', audit_date REAL NOT NULL)",
                  )),
              )

              class AuditComplianceEngine:
                  """Auditoria de cumplimiento (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.complianceaudit", _MIGRATIONS).run(clock)

                  def execute_audit(self, *, audit_scope):
                      audit_id = f"AUD-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO compliance_audits"
                              " (audit_id, scope_json, findings_json,"
                              " observations_json, violations_json,"
                              " risk_level, status, audit_date)"
                              " VALUES (?, ?, '[]', '[]', '[]', 'LOW', 'COMPLETED', ?)",
                              (audit_id, _j.dumps(audit_scope, default=str), now))
                      return {"audit_id": audit_id, "audit_scope": audit_scope,
                              "findings": [], "observations": [], "violations": [],
                              "risk_level": "LOW", "status": "COMPLETED",
                              "audit_date": now}

                  def _load(self, audit_id):
                      row = self._db.query_one(
                          "SELECT * FROM compliance_audits WHERE audit_id = ?",
                          (audit_id,))
                      if not row:
                          return None
                      return {"audit_id": str(row["audit_id"]),
                              "audit_scope": _j.loads(str(row["scope_json"])),
                              "findings": _j.loads(str(row["findings_json"])),
                              "observations": _j.loads(str(row["observations_json"])),
                              "violations": _j.loads(str(row["violations_json"])),
                              "risk_level": str(row["risk_level"]),
                              "status": str(row["status"]),
                              "audit_date": float(row["audit_date"])}

                  def _save(self, audit):
                      self._db.execute(
                          "UPDATE compliance_audits SET"
                          " findings_json = ?, observations_json = ?,"
                          " violations_json = ?, risk_level = ?"
                          " WHERE audit_id = ?",
                          (_j.dumps(audit["findings"], default=str),
                           _j.dumps(audit["observations"], default=str),
                           _j.dumps(audit["violations"], default=str),
                           audit["risk_level"], audit["audit_id"]))

                  def add_finding(self, audit_id, finding):
                      audit = self._load(audit_id)
                      if not audit:
                          return None
                      audit["findings"].append(finding)
                      self._save(audit)
                      return audit

                  def add_observation(self, audit_id, observation):
                      audit = self._load(audit_id)
                      if not audit:
                          return None
                      audit["observations"].append({
                          "created_at": self._clock.now(),
                          "message": observation})
                      self._save(audit)
                      return audit

                  def add_violation(self, audit_id, violation):
                      audit = self._load(audit_id)
                      if not audit:
                          return None
                      audit["violations"].append(violation)
                      n = len(audit["violations"])
                      if n >= 10:
                          audit["risk_level"] = "CRITICAL"
                      elif n >= 5:
                          audit["risk_level"] = "HIGH"
                      elif n >= 2:
                          audit["risk_level"] = "MEDIUM"
                      self._save(audit)
                      return audit

                  def audit_summary(self, audit_id):
                      audit = self._load(audit_id)
                      if not audit:
                          return None
                      return {"audit_id": audit["audit_id"],
                              "scope": audit["audit_scope"],
                              "findings": len(audit["findings"]),
                              "observations": len(audit["observations"]),
                              "violations": len(audit["violations"]),
                              "risk_level": audit["risk_level"],
                              "status": audit["status"]}

                  def generate_report(self, audit_id):
                      audit = self._load(audit_id)
                      if not audit:
                          return None
                      return {"audit": audit,
                              "report_type": "COMPLIANCE_AUDIT_REPORT",
                              "generated_at": self._clock.now()}
          '''))

          wf(CMP + "/compliance_reporting_engine.py", D(r'''
              """Compliance Reporting Engine - NEXO / ZYRA (persistente)."""
              from __future__ import annotations
              from typing import Dict, List
              import uuid
              import json as _j
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "compliance_reports", (
                      "CREATE TABLE IF NOT EXISTS compliance_reports (report_id TEXT PRIMARY KEY, report_type TEXT NOT NULL, data_json TEXT NOT NULL, generated_at REAL NOT NULL)",
                  )),
              )

              class ComplianceReportingEngine:
                  """Reportes de cumplimiento (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.compliancerep", _MIGRATIONS).run(clock)

                  def generate_report(self, *, report_data, report_type="COMPLIANCE"):
                      report_id = f"REP-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO compliance_reports"
                              " (report_id, report_type, data_json, generated_at)"
                              " VALUES (?, ?, ?, ?)",
                              (report_id, report_type,
                               _j.dumps(report_data, default=str), now))
                      return {"report_id": report_id, "generated_at": now,
                              "report_type": report_type, "data": report_data,
                              "status": "GENERATED"}

                  def generate_executive_report(self, *, events, alerts, violations):
                      return self.generate_report(
                          report_data={"events": len(events),
                                       "alerts": len(alerts),
                                       "violations": len(violations)},
                          report_type="EXECUTIVE_COMPLIANCE")

                  def get_reports(self):
                      rows = self._db.query_all(
                          "SELECT * FROM compliance_reports ORDER BY generated_at")
                      return [{"report_id": str(r["report_id"]),
                               "report_type": str(r["report_type"]),
                               "data": _j.loads(str(r["data_json"])),
                               "generated_at": float(r["generated_at"])}
                              for r in rows]

                  def generate_summary(self):
                      return {"reports": len(self.get_reports()),
                              "generated_at": self._clock.now()}
          '''))

          wf(CMP + "/regulatory_monitor.py", D(r'''
              """Regulatory Monitor - NEXO / ZYRA (persistente)."""
              from __future__ import annotations
              from typing import Dict, List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "regulatory_checks", (
                      "CREATE TABLE IF NOT EXISTS regulatory_checks (check_id TEXT PRIMARY KEY, jurisdiction TEXT NOT NULL, checked_at REAL NOT NULL, status TEXT NOT NULL DEFAULT 'COMPLETED')",
                  )),
                  Migration(2, "regulatory_alerts", (
                      "CREATE TABLE IF NOT EXISTS regulatory_alerts (alert_id TEXT PRIMARY KEY, jurisdiction TEXT NOT NULL, title TEXT NOT NULL, description TEXT NOT NULL DEFAULT '', severity TEXT NOT NULL DEFAULT 'MEDIUM', status TEXT NOT NULL DEFAULT 'OPEN', created_at REAL NOT NULL)",
                  )),
              )

              class RegulatoryMonitor:
                  """Monitoreo regulatorio (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.regmonitor", _MIGRATIONS).run(clock)

                  def monitor(self, *, jurisdiction):
                      check_id = f"REG-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO regulatory_checks"
                              " (check_id, jurisdiction, checked_at, status)"
                              " VALUES (?, ?, ?, 'COMPLETED')",
                              (check_id, jurisdiction, now))
                      return {"check_id": check_id, "jurisdiction": jurisdiction,
                              "checked_at": now, "changes_detected": False,
                              "status": "COMPLETED"}

                  def register_change(self, *, jurisdiction, title,
                                      description, severity="MEDIUM"):
                      alert_id = f"ALT-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO regulatory_alerts"
                              " (alert_id, jurisdiction, title, description,"
                              " severity, status, created_at)"
                              " VALUES (?, ?, ?, ?, ?, 'OPEN', ?)",
                              (alert_id, jurisdiction, title, description,
                               severity, now))
                      return {"alert_id": alert_id, "jurisdiction": jurisdiction,
                              "title": title, "severity": severity, "status": "OPEN"}

                  def get_alerts_by_jurisdiction(self, jurisdiction):
                      rows = self._db.query_all(
                          "SELECT * FROM regulatory_alerts"
                          " WHERE jurisdiction = ? ORDER BY created_at",
                          (jurisdiction,))
                      return [dict(r) for r in rows]

                  def generate_summary(self):
                      c = self._db.query_one("SELECT COUNT(*) AS n FROM regulatory_checks")
                      a = self._db.query_one("SELECT COUNT(*) AS n FROM regulatory_alerts")
                      return {"checks": int(c["n"]) if c else 0,
                              "alerts": int(a["n"]) if a else 0,
                              "generated_at": self._clock.now()}

                  def generate_report(self):
                      return {"checks": self._db.query_all("SELECT * FROM regulatory_checks"),
                              "alerts": self._db.query_all("SELECT * FROM regulatory_alerts"),
                              "report_type": "REGULATORY_MONITOR",
                              "generated_at": self._clock.now()}
          '''))

          wf(CMP + "/sanctions_monitor.py", D(r'''
              """Sanctions Monitor - NEXO / ZYRA (informa, no bloquea)."""
              from __future__ import annotations
              from typing import Dict, List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "sanctions_verifications", (
                      "CREATE TABLE IF NOT EXISTS sanctions_verifications (verification_id TEXT PRIMARY KEY, entity_name TEXT NOT NULL, list_source TEXT NOT NULL DEFAULT 'internal', sanctioned INTEGER NOT NULL DEFAULT 0, checked_at REAL NOT NULL)",
                  )),
                  Migration(2, "sanctions_alerts", (
                      "CREATE TABLE IF NOT EXISTS sanctions_alerts (alert_id TEXT PRIMARY KEY, entity_name TEXT NOT NULL, reason TEXT NOT NULL, severity TEXT NOT NULL DEFAULT 'HIGH', status TEXT NOT NULL DEFAULT 'OPEN', created_at REAL NOT NULL)",
                  )),
              )

              class SanctionsMonitor:
                  """Monitoreo de sanciones (informa/bonifica)."""

                  def __init__(self, db, clock, *, sanctioned_names=None):
                      self._db = db
                      self._clock = clock
                      self._sanctioned = [n.upper() for n in (sanctioned_names or [])]
                      MigrationRunner(db, "nexo.sanctions", _MIGRATIONS).run(clock)

                  def verify(self, *, entity_name, list_source="internal"):
                      vid = f"SAN-{uuid.uuid4()}"
                      now = self._clock.now()
                      sanctioned = entity_name.strip().upper() in self._sanctioned
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO sanctions_verifications"
                              " (verification_id, entity_name, list_source, sanctioned, checked_at)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (vid, entity_name, list_source,
                               1 if sanctioned else 0, now))
                      return {"verification_id": vid, "entity_name": entity_name,
                              "sanctioned": sanctioned, "list_source": list_source,
                              "checked_at": now, "status": "VERIFIED"}

                  def register_alert(self, *, entity_name, reason, severity="HIGH"):
                      alert_id = f"ALT-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO sanctions_alerts"
                              " (alert_id, entity_name, reason, severity, status, created_at)"
                              " VALUES (?, ?, ?, ?, 'OPEN', ?)",
                              (alert_id, entity_name, reason, severity, now))
                      return {"alert_id": alert_id, "entity_name": entity_name,
                              "reason": reason, "severity": severity, "status": "OPEN"}

                  def get_entity_history(self, entity_name):
                      rows = self._db.query_all(
                          "SELECT * FROM sanctions_verifications"
                          " WHERE entity_name = ? ORDER BY checked_at",
                          (entity_name,))
                      return [dict(r) for r in rows]

                  def generate_summary(self):
                      rows = self._db.query_all(
                          "SELECT DISTINCT entity_name FROM sanctions_verifications"
                          " WHERE sanctioned = 1")
                      total = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM sanctions_verifications")
                      alerts = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM sanctions_alerts")
                      return {"verifications": int(total["n"]) if total else 0,
                              "alerts": int(alerts["n"]) if alerts else 0,
                              "sanctioned_entities": len(rows),
                              "generated_at": self._clock.now()}

                  def generate_report(self):
                      return {"verifications": self._db.query_all(
                                  "SELECT * FROM sanctions_verifications"),
                              "alerts": self._db.query_all(
                                  "SELECT * FROM sanctions_alerts"),
                              "report_type": "SANCTIONS_MONITOR",
                              "generated_at": self._clock.now()}
          '''))

          # ===== RISK ENGINES (13, compactos calculadores) =====

          for RSK, name, cls, method, body in [
              ("risk_engine.py", "RiskEngine", "evaluate", "risk_components"),
          ]:
              pass

          # Simplemente escribo cada uno:

          wf(RSK + "/risk_engine.py", D(r'''
              """Risk Engine - NEXO / ZYRA."""
              from __future__ import annotations
              from datetime import datetime
              from typing import Dict, List
              import uuid

              class RiskEngine:
                  def __init__(self):
                      self._history = []

                  def evaluate(self, *, risk_components):
                      scores = [c.get("score", 0) for c in risk_components.values() if isinstance(c, dict)]
                      gs = round(sum(scores) / len(scores), 2) if scores else 0
                      level = "CRITICAL" if gs >= 80 else ("HIGH" if gs >= 60 else ("MEDIUM" if gs >= 30 else "LOW"))
