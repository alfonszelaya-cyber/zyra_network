              ev = Evaluacion(
                  id=nuevo_id("eva"), escenario_id=t_escenario_eval.e.id,
                  proyecto_id=t_proyecto_repo.p.id, metricas=t_escenario_eval.res,
                  nota="prueba",
              )
              repo.agregar(ev)
              halladas = repo.listar({"escenario_id": str(t_escenario_eval.e.id)})
              assert len(halladas) == 1
              assert abs(halladas[0].puntaje_total - 82.0) < 1e-6

          def t_historial_auditoria():
              hrepo = HistorialRepository(HistoryStore(t_migraciones.cx))
              h = EntradaHistorial(
                  id=nuevo_id("his"), proyecto_id=t_proyecto_repo.p.id,
                  autor_zid="ZID-OWNER-1", accion="proyecto.creado", detalle={"ok": True},
              )
              hrepo.agregar(h)
              entradas = hrepo.listar({"proyecto_id": str(t_proyecto_repo.p.id)})
              assert len(entradas) == 1 and entradas[0].accion == "proyecto.creado"
              arepo = AuditoriaRepository(AuditStore(t_migraciones.cx))
              arepo.registrar("ZID-OWNER-1", "lote.aplicado", "1A-3", "exito", {"pruebas": True})
              registros = arepo.listar(limite=10)
              assert registros[0]["resultado"] == "exito"

          def t_actualizar_eliminar():
              repo = t_proyecto_repo.repo
              p = t_proyecto_repo.p
              p.avanzar_etapa()
              repo.actualizar(p)
              p3 = repo.obtener_exigir(str(p.id))
              assert p3.etapa_actual.value == "fotografiar"
              assert repo.eliminar(str(p.id)) is True
              assert repo.obtener_por_id(str(p.id)) is None

          def t_politicas():
              assert PoliticaAcceso.tiene_permiso(RolCodigo.GOBERNADOR, PermisoCodigo.GOBIERNO_TOTAL)
              assert not PoliticaAcceso.tiene_permiso(RolCodigo.ESPECTADOR, PermisoCodigo.SIMULAR)
              assert PoliticaAcceso.tiene_permiso(RolCodigo.ANALISTA, PermisoCodigo.RENDERIZAR)
              try:
                  PoliticaAcceso.permisos_de("ROL_FALSO")
                  raise AssertionError("debia fallar")
              except ValueError:
                  pass
              assert PoliticaCalidad.resolucion_para("borrador").ancho == 640
              assert PoliticaCalidad.resolucion_para(RenderQuality.FOTORREAL).alto == 2160
              assert PoliticaCalidad.exige_profundidad("fotorreal") is True
              assert PoliticaRetencion.conservar_ultimas([1, 2, 3, 4], 2) == [3, 4]

          def t_decoradores():
              llamadas = []

              @idempotente
              def suma(a, b):
                  llamadas.append(1)
                  return a + b

              assert suma(1, 2) == 3
              assert suma(1, 2) == 3
              assert len(llamadas) == 1

              @cronometrado
              def pausa():
                  time.sleep(0.01)
                  return 42

              assert pausa() == 42
              assert pausa.ultima_duracion_ms >= 8.0

              @requiere_permiso(lambda c: c == PermisoCodigo.VER, PermisoCodigo.VER)
              def ver_ok():
                  return "veo"

              assert ver_ok() == "veo"

              @requiere_permiso(lambda c: False, PermisoCodigo.SIMULAR)
              def ver_no():
                  return "no"

              try:
                  ver_no()
                  raise AssertionError("debia denegar")
              except PermisoDenegadoError:
                  pass

              registro = []

              @auditado(registro.append)
              def buena():
                  return 7

              assert buena() == 7

              @auditado(registro.append)
              def mala():
                  raise ValueError("boom")

              try:
                  mala()
              except ValueError:
                  pass
              assert len(registro) == 2
              assert registro[0]["error"] is None
              assert "boom" in registro[1]["error"]

          def t_interfaces():
              try:
                  Repositorio()
                  raise AssertionError("ABC debia impedir instanciacion")
              except TypeError:
                  pass

              class RendererPrueba(Renderer):
                  def renderizar(self, escena, opciones):
                      return ResultadoRender(b"imagen", b"profundidad", 4, 4)

                  def capacidades(self):
                      return {"calidades": ["borrador"]}

              assert RendererPrueba().renderizar(None, {}).tiene_profundidad is True

              class DisplayPrueba(DisplayAdapter):
                  def kind(self):
                      return "pantalla"

                  def disponible(self):
                      return True

                  def capacidades(self):
                      return {"resoluciones": ["1920x1080"]}

                  def presentar(self, frame_bytes, config):
                      return {"presentado": True}

              assert DisplayPrueba().presentar(b"x", {})["presentado"] is True

              class SimPrueba(MotorSimulacion):
                  def ejecutar(self, escenario, horizonte):
                      return {"escenarios": 1}

              assert SimPrueba().ejecutar(t_proyecto_repo.p, {})["escenarios"] == 1

          def t_dto_adaptadores():
              r = Respuesta.exito({"x": 1})
              assert r.ok is True and r.to_dict()["datos"]["x"] == 1
              r2 = Respuesta.fallo("codigo_x", "mensaje")
              assert r2.to_dict()["error"]["codigo"] == "codigo_x"
              mi = MotorInfo(id="m1", nombre="svg", tipo="renderer", estado="disponible", version="1.0.0", capacidades=("svg",))
              assert mi.to_dict()["capacidades"] == ["svg"]
              ep = EstadoProyeccion(activa=False, superficie_id="sup_1", destino="proyector", fps=0.0)
              assert ep.to_dict()["activa"] is False
              motor = AdaptadorMotor("renderer_svg", "renderer", "1.0.0")
              assert motor.estado is EngineStatus.NO_DISPONIBLE
              motor.marcar_disponible()
              assert motor.reporte()["estado"] == "disponible"
              try:
                  motor.marcar_no_disponible(" ")
                  raise AssertionError("motivo vacio debia fallar")
              except ValueError:
                  pass
              assert AdaptadorFormato.extension("svg") == "svg"
              assert AdaptadorFormato.mime("pagina_html") == "text/html"
              assert AdaptadorFormato.es_binario("png") is True
              carga = AdaptadorMedia.validar_carga(b"abc", 1.0)
              assert carga["bytes"] == 3 and len(carga["hash"]) == 64

          def t_utilidades():
              datos_png = FIRMA_PNG + b"\x00\x00\x00\x0dIHDR" + struct.pack(">II", 4, 3) + b"\x00" * 5
              assert detectar_formato(datos_png) == "png"
              assert dimensiones_png(datos_png) == (4, 3)
              assert es_imagen_valida(datos_png) is True
              tmp = tempfile.mkdtemp(prefix="labfiles_")
              assert str(ruta_segura(tmp, "sub", "archivo.txt")).startswith(str(pathlib.Path(tmp).resolve()))
              try:
                  ruta_segura(tmp, "..", "escape.txt")
                  raise AssertionError("traversal debia fallar")
              except ValueError:
                  pass
              assert slug("ZYRA El Salvador") == "zyra-el-salvador"
              assert id_legible("proy", "ZYRA El Salvador").startswith("proy-zyra-el-salvador-")
              caja = bounding_box([(0, 0, 0), (1, 2, -1), (0.5, 1, 0)])
              assert caja == ((0.0, 0.0, -1.0), (1.0, 2.0, 0.0))
              assert contar_triangulos([0, 1, 2, 2, 1, 3]) == 2
              assert obtener_logger("pruebas").name == "laboratorio.pruebas"

          def t_config():
              assert DbConfig.cargar().ruta_archivo
              assert AppConfig.cargar().id_app == "laboratorio"
              assert RoutesConfig.cargar().prefijo_api.startswith("/laboratorio")
              assert len(ModulesConfig.cargar().modulos_activos) == 17
              assert NetworkConfig.cargar().reintentos >= 1
              assert SecurityConfig.cargar().largo_maximo_texto >= 1000
              assert SystemConfig.cargar().zona_horaria == "UTC"

          sum_write("")
          sum_write("### Pruebas funcionales (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")

          check("Migraciones y tablas", t_migraciones)
          check("Repositorio de proyectos (CRUD completo)", t_proyecto_repo)
          check("Escenario A/B/C + evaluate_scenario", t_escenario_eval)
          check("Evaluaciones persistidas", t_evaluacion_repo)
          check("Historial y auditoria", t_historial_auditoria)
          check("Actualizar + eliminar con cascada", t_actualizar_eliminar)
          check("Politicas (acceso, calidad, retencion)", t_politicas)
          check("Decoradores (idempotente, timed, permisos, auditado)", t_decoradores)
          check("Puertos (ABC + render con profundidad)", t_interfaces)
          check("DTOs y adaptadores base", t_dto_adaptadores)
          check("Utilidades (png, rutas, mallas, slug)", t_utilidades)
          check("Configuraciones (10 capas)", t_config)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")

          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores**")
          print(
              "VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, "
              + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores"
          )
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 1A-3 aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 1A-3: puertos, configs, BD, persistencia y repositorios"
            git push
          fi
