          import sys
          from pathlib import Path

          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)

          P = "apps/subastas/server.py"
          txt = Path(P).read_text(encoding="utf-8")
          if "inscripciones_ext" in txt:
              print("SKIP: ext ya wired")
              sys.exit(0)

          anchor = '_accounts_mod = _imp.import_module(\n    "apps.subastas.modules.002_inscripciones.inscripciones_store"\n)'
          if anchor not in txt:
              fail("anchor _accounts_mod no encontrado")
          ext_block = (
              anchor + "\n"
              '_iext_mod = _imp.import_module(\n'
              '    "apps.subastas.modules.002_inscripciones.inscripciones_ext"\n'
              ')\n'
              'InscripcionesExt = _iext_mod.InscripcionesExt\n'
              'market_ins_ext_page = _iext_mod.market_ins_ext_page\n'
              'market_gov_inscripcion_page = _iext_mod.market_gov_inscripcion_page\n'
              'market_entity_register = _iext_mod.market_entity_register\n'
              'market_doc_submit = _iext_mod.market_doc_submit\n'
              'market_pm_add = _iext_mod.market_pm_add\n'
              'market_verify_entity = _iext_mod.market_verify_entity\n'
              'market_verify_document = _iext_mod.market_verify_document'
          )
          txt = txt.replace(anchor, ext_block)
          print("IMPORT: ext OK")

          lines = txt.splitlines(keepends=True)

          def leading(line):
              return line[: len(line) - len(line.lstrip())]

          def find_one(stripped):
              hits = [i for i, l in enumerate(lines) if l.strip() == stripped]
              if len(hits) != 1:
                  fail("anchor x%d (need 1): %s" % (len(hits), stripped))
              return hits[0]

          i = find_one('("/subastas/inscripcion", "Inscripcion"),')
          ind = leading(lines[i])
          lines = lines[:i] + [ind + '("/subastas/mi-inscripcion", "Mi Inscripcion"),\n'] + lines[i:]
          print("NAV OK")

          i = find_one('if path == "/subastas/inscripcion":')
          ind = leading(lines[i])
          b = ind + "    "
          lines = lines[:i] + [
              ind + 'if path == "/subastas/mi-inscripcion":\n',
              b + "self._send_html(200, self.market_ins_ext_page())\n",
              b + "return\n",
              ind + 'if path == "/subastas/gov-inscripcion":\n',
              b + "self._send_html(200, self.market_gov_inscripcion_page())\n",
              b + "return\n",
          ] + lines[i:]
          print("GET routes OK")

          i = find_one('if path == "/subastas/login":')
          ind = leading(lines[i])
          b = ind + "    "
          lines = lines[:i] + [
              ind + 'if path == "/subastas/api/inscripcion/entidad":\n',
              b + "self.market_entity_register()\n",
              b + "return\n",
              ind + 'if path == "/subastas/api/inscripcion/documento":\n',
              b + "self.market_doc_submit()\n",
              b + "return\n",
              ind + 'if path == "/subastas/api/inscripcion/pago":\n',
              b + "self.market_pm_add()\n",
              b + "return\n",
              ind + 'if path == "/subastas/api/inscripcion/verificar-entidad":\n',
              b + "self.market_verify_entity()\n",
              b + "return\n",
              ind + 'if path == "/subastas/api/inscripcion/verificar-documento":\n',
              b + "self.market_verify_document()\n",
              b + "return\n",
          ] + lines[i:]
          print("POST routes OK")

          i = find_one('"disputes": _riesgo_inst,')
          ind = leading(lines[i])
          lines = lines[:i] + [
              ind + '"iext": _iext_inst,\n',
              ind + '"market_ins_ext_page": market_ins_ext_page,\n',
              ind + '"market_gov_inscripcion_page": market_gov_inscripcion_page,\n',
              ind + '"market_entity_register": market_entity_register,\n',
              ind + '"market_doc_submit": market_doc_submit,\n',
              ind + '"market_pm_add": market_pm_add,\n',
              ind + '"market_verify_entity": market_verify_entity,\n',
              ind + '"market_verify_document": market_verify_document,\n',
          ] + lines[i:]
          print("ATTACH OK")

          i = find_one("handler = type(")
          ind = leading(lines[i])
          lines = lines[:i] + [ind + "_iext_inst = InscripcionesExt(store._db, store._clock, client)\n"] + lines[i:]
          print("INSTANCE OK")

          out = "".join(lines)
          try:
              compile(out, P, "exec")
          except SyntaxError as e:
              print("COMPILE-FAIL:", e.msg, "line:", e.lineno)
              ls = out.splitlines()
              ln = e.lineno or 0
              for k in range(max(0, ln - 10), min(len(ls), ln + 6)):
                  mark = ">>" if k == ln - 1 else "  "
                  print("%s %4d| %s" % (mark, k + 1, ls[k]))
              fail("compile failed - NOTHING written")
          print("COMPILE OK")
          Path(P).write_text(out, encoding="utf-8")

          m = Path("apps/subastas/modules/002_inscripciones/inscripciones_ext.py").read_text(encoding="utf-8")
          try:
              compile(m, "inscripciones_ext.py", "exec")
          except SyntaxError as e:
              print("EXT FAIL:", e.msg, e.lineno)
              fail("ext compile")
          print("COMPILE OK ext")

          final = Path(P).read_text(encoding="utf-8")
          for mk in (
              "inscripciones_ext",
              '"iext": _iext_inst',
              '"/subastas/api/inscripcion/entidad"',
              '"/subastas/mi-inscripcion"',
          ):
              if mk not in final:
                  fail("post-check: " + mk)
          print("ALL OK")
          PYEOF

      - name: Step 3 - E2E (con cookies de sesion)
        run: |
          python3 - <<'EOF'
          import http.cookiejar
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          import uuid

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-" + uuid.uuid4().hex[:8]}, None)
                  return (False, None, "offline")


          def make_opener():
              cj = http.cookiejar.CookieJar()
              return urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(cj)
              )


          def call(opener, method, url, payload=None, form=None):
              if form is not None:
                  data = urllib.parse.urlencode(form).encode()
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              else:
                  data = json.dumps(payload).encode() if payload is not None else None
                  headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with opener.open(req, timeout=5) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read()[:400].decode("utf-8", "replace")
                  raise AssertionError("HTTP %s %s %s -> %s" % (e.code, method, url, body))


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          op_user = make_opener()
          call(op_user, "POST", base + "/subastas/registro", form={
              "username": "inv" + uuid.uuid4().hex[:6], "password": "clave123",
              "display_name": "Inversionista Test", "role": "vendedor"})
          print("1. cuenta de usuario creada")

          st, html = call(op_user, "GET", base + "/subastas/inscripcion")
          assert "Sesion activa" in html, "sin sesion: %s" % html[:300]
          print("2. sesion activa con cookie OK")

          st, html = call(op_user, "POST", base + "/subastas/api/inscripcion/entidad",
                          payload={"etype": "inversionista", "name": "Fondo ZYRA",
                                   "rep_name": "Ana Rep", "rep_doc": "DOC-INV-1"})
          assert "pending" in html, html[:300]
          print("3. inversionista registrado OK")

          st, html = call(op_user, "POST", base + "/subastas/api/inscripcion/entidad",
                          payload={"etype": "organizacion", "name": "Org Test",
                                   "rep_name": "Beto Rep", "rep_doc": "DOC-ORG-1"})
          assert "pending" in html
          print("4. organizacion registrada OK")

          st, html = call(op_user, "POST", base + "/subastas/api/inscripcion/documento",
                          payload={"doc_ref": "sha-ref-" + uuid.uuid4().hex[:6]})
          assert "sealed" in html or "network_doc_id" in html, html[:300]
          print("5. documento sellado en la Red OK")

          st, html = call(op_user, "POST", base + "/subastas/api/inscripcion/pago",
                          payload={"kind": "cartera", "label": "mi cartera", "make_default": True})
          assert "cartera" in html, html[:300]
          st, html = call(op_user, "POST", base + "/subastas/api/inscripcion/pago",
                          payload={"kind": "cripto", "label": "mi btc"})
          assert "cripto" in html
          print("6. metodos de pago multiples OK")

          st, html = call(op_user, "GET", base + "/subastas/mi-inscripcion")
          assert "Historial de mi inscripcion" in html
          assert "inversionista registrada" in html
          assert "documento" in html
          assert "Fondo ZYRA" in html
          print("7. historial completo + pagina Mi Inscripcion OK")

          print("E2E SMOKE OK: Bloque 3-RESTANTE completo")
          EOF

