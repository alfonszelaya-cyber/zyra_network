name: ZYRA AXIS Block 9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write builder script
        run: |
          cat > /tmp/build_ops.py <<'BEOF'
          from pathlib import Path

          path = Path("apps/axis/server.py")
          src = path.read_text(encoding="utf-8")

          if "_screen_justicia_ops" in src:
              print("SERVER: already wired")
              raise SystemExit(0)

          ga = (
              '        if s[0] == "life":\n'
              "            self._screen_life_person(s)\n"
              "            return\n"
          )
          assert ga in src, "ga missing"
          add_ga = ga + (
              '        if s[0] == "justicia":\n'
              "            self._screen_justicia_ops()\n"
              "            return\n"
              '        if s[0] == "seguridad-ops":\n'
              "            self._screen_seguridad_ops()\n"
              "            return\n"
          )
          src = src.replace(ga, add_ga, 1)

          pa = (
              '        if s == ["birth-register"]:\n'
              "            self._birth_register(doc)\n"
              "            return\n"
          )
          assert pa in src, "pa missing"
          add_pa = pa + (
              '        if s == ["case-extended"]:\n'
              "            self._case_extended(doc)\n"
              "            return\n"
              '        if s == ["incident-extended"]:\n'
              "            self._incident_extended(doc)\n"
              "            return\n"
          )
          src = src.replace(pa, add_pa, 1)

          pn = '            "<h2>Paneles</h2>"\n'
          assert pn in src, "pn missing"
          ha = (
              '            "<h2>Justicia y Seguridad</h2>"\n'
              "            \"<div class='card'>\"\n"
              "            \"<a href='/axis/justicia'>\"\n"
              "            \"<button>Justicia</button></a>\"\n"
              "            \"<a href='/axis/seguridad-ops'>\"\n"
              "            \"<button>Seguridad</button></a>\"\n"
              "            \"</div>\"\n"
          )
          src = src.replace(pn, ha + pn, 1)

          ca = "class AxisServer(ThreadingHTTPServer):"
          assert ca in src, "ca missing"

          m = (
              "    def _screen_justicia_ops(self) -> None:\n"
              "        body = (\n"
              '            "<h1>JUSTICIA</h1>"\n'
              '            "<p>Nuevo caso judicial.</p>"\n'
              "            \"<div class='card'>\"\n"
              "            \"<form method='POST'\"\n"
              "            \" action='/axis/case-extended'>\"\n"
              "            \"<input name='client_account'\"\n"
              "            \" placeholder='ID cliente'>\"\n"
              "            \"<input name='lawyer_account'\"\n"
              "            \" placeholder='Mi ID'>\"\n"
              "            \"<input name='detail'\"\n"
              "            \" placeholder='Detalle'>\"\n"
              "            \"<button>Registrar</button>\"\n"
              "            \"</form></div>\"\n"
              "            \"<a href='/axis'>Inicio</a>\"\n"
              "        )\n"
              "        self._html(\n"
              "            200,\n"
              "            _page(\n"
              '                "AXIS - Justicia",\n'
              "                body,\n"
              "            ),\n"
              "        )\n"
              "\n"
              "    def _screen_seguridad_ops(self) -> None:\n"
              "        body = (\n"
              '            "<h1>SEGURIDAD</h1>"\n'
              '            "<p>Reportar incidente.</p>"\n'
              "            \"<div class='card'>\"\n"
              "            \"<form method='POST'\"\n"
              "            \" action='/axis/incident-extended'>\"\n"
              "            \"<input name='police_account'\"\n"
              "            \" placeholder='Mi ID'>\"\n"
              "            \"<input name='subject_account'\"\n"
              "            \" placeholder='ID sujeto'>\"\n"
              "            \"<input name='description'\"\n"
              "            \" placeholder='Descripcion'>\"\n"
              "            \"<button>Reportar</button>\"\n"
              "            \"</form></div>\"\n"
              "            \"<a href='/axis'>Inicio</a>\"\n"
              "        )\n"
              "        self._html(\n"
              "            200,\n"
              "            _page(\n"
              '                "AXIS - Seguridad",\n'
              "                body,\n"
              "            ),\n"
              "        )\n"
              "\n"
              "    def _case_extended(self, doc) -> None:\n"
              "        from apps.axis.life_history.justice_service import (\n"
              "            JusticeLifeService,\n"
              "        )\n"
              "\n"
              "        justice = JusticeLifeService(\n"
              "            store=type(self).store,\n"
              "            life=self._lh(),\n"
              "        )\n"
              "        case_id = (\n"
              '            "CASE-"\n'
              "            + _uuid.uuid4().hex[:10]\n"
              "        )\n"
              "        opened = justice.open_case(\n"
              "            case_id=case_id,\n"
              "            client_account=self._req(\n"
              '                doc, "client_account"\n'
              "            ),\n"
              "            lawyer_account=self._req(\n"
              '                doc, "lawyer_account"\n'
              "            ),\n"
              "            detail=self._req(\n"
              '                doc, "detail"\n'
              "            ),\n"
              '            stage="denuncia",\n'
              "        )\n"
              "        chained = (\n"
              '            "SI"\n'
              '            if opened["life_chained"]\n'
              '            else "NO"\n'
              "        )\n"
              "        body = (\n"
              '            "<h1>Caso "</h1>\n'.replace(
                  "</h1>\n", ""
              )
              + case_id
              + '            "<p>Encadenado: "\n'
              "            + chained\n"
              '            + "</p>"\n'
              "            \"<a href='/axis/justicia'>\"\n"
              "            \"Volver</a>\"\n"
              "        )\n"
              "        self._html(\n"
              "            200,\n"
              "            _page(\n"
              '                "AXIS - Caso",\n'
              "                body,\n"
              "            ),\n"
              "        )\n"
          )
          m = m.replace(
              '            "<h1>Caso "</h1>\n',
              '            "<h1>Caso ",\n'
          )
          m = (
              "    def _case_extended(self, doc) -> None:\n"
              "        from apps.axis.life_history.justice_service import (\n"
              "            JusticeLifeService,\n"
              "        )\n"
              "\n"
              "        justice = JusticeLifeService(\n"
              "            store=type(self).store,\n"
              "            life=self._lh(),\n"
              "        )\n"
              "        case_id = (\n"
              '            "CASE-"\n'
              "            + _uuid.uuid4().hex[:10]\n"
              "        )\n"
              "        opened = justice.open_case(\n"
              "            case_id=case_id,\n"
              "            client_account=self._req(\n"
              '                doc, "client_account"\n'
              "            ),\n"
              "            lawyer_account=self._req(\n"
              '                doc, "lawyer_account"\n'
              "            ),\n"
              "            detail=self._req(\n"
              '                doc, "detail"\n'
              "            ),\n"
              '            stage="denuncia",\n'
              "        )\n"
              "        chained = (\n"
              '            "SI"\n'
              '            if opened["life_chained"]\n'
              '            else "NO"\n'
              "        )\n"
              "        body = (\n"
              '            "<h1>Caso "\n'
              "            + case_id\n"
              '            + "</h1>"\n'
              '            "<p>Encadenado: "\n'
              "            + chained\n"
              '            + "</p>"\n'
              "            \"<a href='/axis/justicia'>\"\n"
              "            \"Volver</a>\"\n"
              "        )\n"
              "        self._html(\n"
              "            200,\n"
              "            _page(\n"
              '                "AXIS - Caso",\n'
              "                body,\n"
              "            ),\n"
              "        )\n"
              "\n"
              "    def _incident_extended(self, doc) -> None:\n"
              "        from apps.axis.life_history.security_service import (\n"
              "            SecurityLifeService,\n"
              "        )\n"
              "\n"
              "        security = SecurityLifeService(\n"
              "            store=type(self).store,\n"
              "            life=self._lh(),\n"
              "        )\n"
              "        incident_id = (\n"
              '            "INC-"\n'
              "            + _uuid.uuid4().hex[:10]\n"
              "        )\n"
              "        subject = doc.get(\n"
              '            "subject_account"\n'
              "        )\n"
              "        subject = (\n"
              "            str(subject).strip()\n"
              "            if subject\n"
              "            and str(subject).strip()\n"
              "            else None\n"
              "        )\n"
              "        reported = (\n"
              "            security.report_incident(\n"
              "                incident_id=incident_id,\n"
              "                police_account=self._req(\n"
              '                    doc, "police_account"\n'
              "                ),\n"
              "                description=self._req(\n"
              '                    doc, "description"\n'
              "                ),\n"
              "                subject_account=subject,\n"
              "            )\n"
              "        )\n"
              "        chained = (\n"
              '            "SI"\n'
              '            if reported["life_chained"]\n'
              '            else "NO"\n'
              "        )\n"
              "        body = (\n"
              '            "<h1>Incidente "\n'
              "            + incident_id\n"
              '            + "</h1>"\n'
              '            "<p>Encadenado: "\n'
              "            + chained\n"
              '            + "</p>"\n'
              "            \"<a href='/axis/seguridad-ops'>\"\n"
              "            \"Volver</a>\"\n"
              "        )\n"
              "        self._html(\n"
              "            200,\n"
              "            _page(\n"
              '                "AXIS - Incidente",\n'
              "                body,\n"
              "            ),\n"
              "        )\n"
              "\n"
          )

          src = src.replace(
              ca,
              m + ca,
              1,
          )
          path.write_text(src, encoding="utf-8")
          print("WIRED OK")

          import ast

          ast.parse(src)
          print("SYNTAX OK")
          BEOF
          python3 /tmp/build_ops.py

      - name: Write ops E2E test
        run: |
          cat > apps/axis/life_history/tests/test_ops_screens.py <<'QEOF'
          """Ops screens E2E."""
          from __future__ import annotations
          import threading
          import unittest
          from urllib.request import (
              Request,
              urlopen,
          )
          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )
          from apps.axis.server import serve_axis

          _SUBJECT = "ZID-subject-ops"
          _MOTHER = "ZID-mother-ops"


          class _FakeNetwork:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid in (_SUBJECT, _MOTHER):
                      return (
                          True,
                          {"status": "ACTIVE"},
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-ops"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return (False, None, "unknown")


          class OpsScreensE2E(unittest.TestCase):
              def test_screens_and_flows(self) -> None:
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )
                  from shared_engines.storage.database import (
                      SQLiteAdapter,
                  )

                  db = SQLiteAdapter(":memory:")
                  clock = SystemClock()
                  life = LifeHistoryService(
                      store=LifeHistoryStore(
                          db, clock
                      ),
                      client=_FakeNetwork(),
                  )
                  birth = (
                      life.register_birth_with_network(
                          registrar_account=(
                              "AX-reg-1"
                          ),
                          child_name="Sujeto Ops",
                          birth_date="1990-06-01",
                          birth_place="San Salvador",
                          sex="M",
                          mother_name="Madre Ops",
                          mother_zid=_MOTHER,
                      )
                  )
                  person_id = str(
                      birth["person_id"]
                  )
                  life.attach_zid_with_audit(
                      person_id,
                      zid=_SUBJECT,
                      actor="biometric-enroll",
                  )
                  store = AxisStore(db, clock)
                  store.add_account(
                      account_id="AX-cli-ops",
                      zid=_SUBJECT,
                      name="Sujeto Ops",
                      role="paciente",
                  )
                  store.add_account(
                      account_id="AX-law-ops",
                      zid=None,
                      name="Abogado Ops",
                      role="abogado",
                  )
                  store.add_account(
                      account_id="AX-pol-ops",
                      zid=None,
                      name="Agente Ops",
                      role="policia",
                  )
                  server = serve_axis(
                      store,
                      _FakeNetwork(),
                      life_history_service=life,
                  )
                  thread = threading.Thread(
                      target=server.serve_forever,
                      daemon=True,
                  )
                  thread.start()
                  base = (
                      "http://127.0.0.1:"
                      + str(server.bound_port)
                  )

                  def pf(path, doc):
                      req = Request(
                          base + path,
                          data=(
                              "&".join(
                                  str(k)
                                  + "="
                                  + str(v)
                                  for k, v in (
                                      doc.items()
                                  )
                              )
                          ).encode("utf-8"),
                          method="POST",
                      )
                      with urlopen(
                          req, timeout=10
                      ) as r:
                          return r.read().decode(
                              "utf-8"
                          )

                  def h(path):
                      with urlopen(
                          base + path,
                          timeout=10,
                      ) as r:
                          return r.read().decode(
                              "utf-8"
                          )

                  try:
                      just = h("/axis/justicia")
                      self.assertIn(
                          "JUSTICIA", just
                      )
                      sec = h(
                          "/axis/seguridad-ops"
                      )
                      self.assertIn(
                          "SEGURIDAD", sec
                      )
                      case_html = pf(
                          "/axis/case-extended",
                          {
                              "client_account": (
                                  "AX-cli-ops"
                              ),
                              "lawyer_account": (
                                  "AX-law-ops"
                              ),
                              "detail": "robo",
                          },
                      )
                      self.assertIn(
                          "Caso", case_html
                      )
                      types = [
                          e["event_type"]
                          for e in (
                              life._store.events_of(
                                  person_id
                              )
                          )
                      ]
                      self.assertIn(
                          "justice_case", types
                      )
                      inc_html = pf(
                          "/axis/incident-extended",
                          {
                              "police_account": (
                                  "AX-pol-ops"
                              ),
                              "subject_account": (
                                  "AX-cli-ops"
                              ),
                              "description": (
                                  "robo"
                              ),
                          },
                      )
                      self.assertIn(
                          "Incidente", inc_html
                      )
                      types = [
                          e["event_type"]
                          for e in (
                              life._store.events_of(
                                  person_id
                              )
                          )
                      ]
                      self.assertIn(
                          "security_incident",
                          types,
                      )
                      self.assertTrue(
                          life._store.events_verify(
                              person_id
                          )
                      )
                      home = h("/axis")
                      self.assertIn(
                          "Justicia", home
                      )
                      self.assertIn(
                          "Seguridad", home
                      )
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          QEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_ops_screens.py').read()); print('test OK')"

      - name: 1/3 Ops screens E2E
        run: python -m apps.axis.life_history.tests.test_ops_screens -v

      - name: 2/3 Life History regression
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q
          python -m apps.axis.life_history.tests.test_justice_service -q
          python -m apps.axis.life_history.tests.test_security_service -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "axis: justice and security ops screens + E2E"
            git push
          fi
