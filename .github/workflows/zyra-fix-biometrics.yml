name: ZYRA D17 icono 3D cubo de cristal como la referencia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: Icono 3D isometrico
        run: |
          python3 - <<'PYEOF'
          import math, struct, zlib
          from pathlib import Path
          PT = Path.cwd() / 'portal'
          OUT, GATES = [], []
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              Path('faseD17.md').write_text('\n'.join(OUT), encoding='utf-8')
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
          def ck(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          C30 = math.cos(math.pi / 6)
          def hexa(v):
              return max(0, min(255, int(v)))
          def mez(a, b, k):
              return a + (b - a) * k
          def icono3d(size):
              ih = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              cx = size / 2.0
              r = size * 0.30
              cy = size * 0.44
              top = (cx, cy - r)
              left = (cx - r * C30, cy - r * 0.5)
              right = (cx + r * C30, cy - r * 0.5)
              centro = (cx, cy)
              botl = (cx - r * C30, cy + r * 0.5)
              botr = (cx + r * C30, cy + r * 0.5)
              bottom = (cx, cy + r)
              caras = []
              caras.append({'O': top, 'U': (left[0] - top[0], left[1] - top[1]),
                            'V': (right[0] - top[0], right[1] - top[1]),
                            'c1': (168, 130, 255), 'c2': (99, 150, 255), 'lum': 1.0})
              caras.append({'O': left, 'U': (centro[0] - left[0], centro[1] - left[1]),
                            'V': (botl[0] - left[0], botl[1] - left[1]),
                            'c1': (96, 62, 205), 'c2': (205, 80, 180), 'lum': 0.62})
              caras.append({'O': centro, 'U': (right[0] - centro[0], right[1] - centro[1]),
                            'V': (bottom[0] - centro[0], bottom[1] - centro[1]),
                            'c1': (70, 120, 250), 'c2': (235, 95, 170), 'lum': 0.85})
              aristas = [(top, left), (top, right), (left, centro), (right, centro),
                         (centro, bottom), (botl, bottom), (botr, bottom),
                         (left, botl), (right, botr), (centro, left), (centro, right)]
              y_base = botl[1]
              filas = []
              glow_r = size * 0.05
              for y in range(size):
                  fila = bytearray()
                  fila.append(0)
                  for x in range(size):
                      px = x + 0.5
                      py = y + 0.5
                      br, bg, bb = 6, 9, 24
                      en_cara = None
                      uv = None
                      for cara in caras:
                          dx = px - cara['O'][0]
                          dy = py - cara['O'][1]
                          det = cara['U'][0] * cara['V'][1] - cara['U'][1] * cara['V'][0]
                          if abs(det) < 1e-9:
                              continue
                          u = (dx * cara['V'][1] - dy * cara['V'][0]) / det
                          v = (cara['U'][0] * dy - cara['U'][1] * dx) / det
                          if -0.002 <= u <= 1.002 and -0.002 <= v <= 1.002:
                              en_cara = cara
                              uv = (min(1.0, max(0.0, u)), min(1.0, max(0.0, v)))
                              break
                      if en_cara:
                          u, v = uv
                          r_c = mez(en_cara['c1'][0], en_cara['c2'][0], (u + v) / 2.0)
                          g_c = mez(en_cara['c1'][1], en_cara['c2'][1], (u + v) / 2.0)
                          b_c = mez(en_cara['c1'][2], en_cara['c2'][2], (u + v) / 2.0)
                          lum = en_cara['lum']
                          luz = 0.78 + 0.34 * (1.0 - abs(u - v))
                          r_c *= lum * luz
                          g_c *= lum * luz
                          b_c *= lum * luz
                          brillo_borde = min(u, v, 1 - u, 1 - v)
                          if brillo_borde < 0.03:
                              r_c, g_c, b_c = 150, 235, 255
                          elif brillo_borde < 0.08:
                              k = 1.0 - (brillo_borde - 0.03) / 0.05
                              r_c = mez(r_c, 120, k * 0.5)
                              g_c = mez(g_c, 215, k * 0.5)
                              b_c = mez(b_c, 255, k * 0.5)
                          if en_cara is caras[2]:
                              zu, zv = u, v
                              es_z = False
                              if 0.24 <= zu <= 0.76 and (0.16 <= zv <= 0.28 or 0.72 <= zv <= 0.84):
                                  es_z = True
                              if 0.16 < zv < 0.84:
                                  tz = (zv - 0.16) / 0.68
                                  cxz = 0.76 - tz * 0.52
                                  if abs(zu - cxz) < 0.055:
                                      es_z = True
                              if es_z:
                                  r_c, g_c, b_c = 255, 255, 255
                          fila += bytes((hexa(r_c), hexa(g_c), hexa(b_c), 255))
                          continue
                      dmin = 1e9
                      for a, b in aristas:
                          ax, ay = a
                          bx, by = b
                          vx, vy = bx - ax, by - ay
                          len2 = vx * vx + vy * vy
                          if len2 < 1e-9:
                              continue
                          t = ((px - ax) * vx + (py - ay) * vy) / len2
                          t = max(0.0, min(1.0, t))
                          dx = px - (ax + t * vx)
                          dy = py - (ay + t * vy)
                          d = math.sqrt(dx * dx + dy * dy)
                          if d < dmin:
                              dmin = d
                      if dmin < glow_r:
                          k = 1.0 - dmin / glow_r
                          ne = k * k * 110
                          br = hexa(br + ne * 0.35)
                          bg = hexa(bg + ne * 0.85)
                          bb = hexa(bb + ne)
                          fila += bytes((br, bg, bb, 255))
                          continue
                      if y > y_base:
                          dy_base = (y - y_base) / float(size - y_base)
                          cx_r = abs(px - cx) / (r * C30)
                          if cx_r < 1.0:
                              k = (1.0 - cx_r) * (1.0 - dy_base) * 0.55
                              br = hexa(br + k * 60)
                              bg = hexa(bg + k * 30)
                              bb = hexa(bb + k * 140)
                          fila += bytes((br, bg, bb, 255))
                          continue
                      fila += bytes((br, bg, bb, 255))
                  filas.append(bytes(fila))
              raw = b''.join(filas)
              return b'\x89PNG\r\n\x1a\n' + ck(b'IHDR', ih) + ck(b'IDAT', zlib.compress(raw, 9)) + ck(b'IEND', b'')
          add('# D17 - ICONO 3D CUBO DE CRISTAL (estilo referencia)')
          add('')
          i1 = PT / 'icon-192.png'
          i2 = PT / 'icon-512.png'
          o1, o2 = i1.read_bytes(), i2.read_bytes()
          try:
              i1.write_bytes(icono3d(192))
              i2.write_bytes(icono3d(512))
              ok1 = i1.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n' and len(i1.read_bytes()) > 1000
              ok2 = i2.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n' and len(i2.read_bytes()) > 2000
              gate('icono_3d', ok1 and ok2)
              add('- 192px: %d bytes | 512px: %d bytes' % (len(i1.read_bytes()), len(i2.read_bytes())))
              add('- Cubo isometrico: cara superior morado-azul clara, izquierda morado-rosa oscuro,')
              add('  derecha azul-rosa con la Z blanca, aristas de neon cian con glow,')
              add('  reflejo en la base. Estilo cubo de cristal de tu referencia.')
          except Exception as e:
              i1.write_bytes(o1)
              i2.write_bytes(o2)
              gate('icono_3d', False)
              add('- FALLO: %s' % e)
          add('')
          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS. Sin commit.**')
          else:
              add('**ICONO 3D LISTO. Commit. Desinstala ZYRA del celular y agregala de nuevo para verlo.**')
          escribe()
          print('D17 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portal/icon-192.png portal/icon-512.png
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(icono): cubo de cristal 3D isometrico con neon, estilo referencia"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
