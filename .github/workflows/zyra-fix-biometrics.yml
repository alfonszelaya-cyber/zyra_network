# ZYRA REV E v6 - parche del nucleo de registro ZID (todo-o-nada)
#
# Arreglo: paso 1 sin errores al escribir, sin salto automatico, pasos por clase
#
# COMO SE USA (importante):
#  1) En GitHub: Add file > Upload files y sube ESTE archivo tal cual a .github/workflows/
#     (reemplaza el que este). NO lo abras con otras apps ni lo re-guardes: se dania.
#  2) Actions > ZYRA fix biometricos REV E > Run workflow.
#  3) Verde = publicado. El nucleo viaja partido en lineas cortas: si el telefono
#     mete saltos de linea extra, el parche los limpia y verifica el SHA. Si el
#     archivo se dania de verdad, el run falla con mensaje claro y NO publica nada.

