              bus = NexoMessageBus(clock=FrozenClock())
              res = bus.publish(ev)
              assert res["buffered"] is True
              assert res["delivered_to_network"] is False
              taken = bus.drain()
              assert len(taken) == 1 and bus.pending() == 0
