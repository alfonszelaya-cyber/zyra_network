name: "ZYRA - parche 1 linea validacion MP4 (verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parche:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Parche - validar ftyp en posicion estandar (bytes 4-8)
        run: |
          cat > /tmp/fix_mp4.py <<'FIX_EOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/infrastructure/providers/video_encoder.py")
          texto = ruta.read_text(encoding="utf-8")

          viejo = 'if b"ftypmp42" not in mp4[:32]:'
          nuevo = 'if mp4[4:8] != b"ftyp":'

          if viejo in texto:
              texto = texto.replace(viejo, nuevo, 1)
              print("parche aplicado: validacion ftyp estandar (brand isom/mp42/avc1 todos validos)")
          elif nuevo in texto:
              print("parche ya presente")
          else:
              raise SystemExit("FATAL: linea de validacion no encontrada")

          ast.parse(texto)
          ruta.write_text(texto, encoding="utf-8")
          print("video_encoder.py: sintaxis OK")
          FIX_EOF
          python /tmp/fix_mp4.py

      - name: Correr la suite + verificar MP4 real
        run: |
          python - <<'PYEOF'
          from apps.laboratorio.infrastructure.providers.video_encoder import (
              MotorVideo, ffmpeg_disponible,
          )
          from apps.laboratorio.infrastructure.providers.png_encoder import encode_png_rgb

          print("ffmpeg disponible:", ffmpeg_disponible())
          frames = [encode_png_rgb(64, 48, bytes(bytes((100, 150, 200)) * (64 * 48)))
                    for _ in range(6)]
          if ffmpeg_disponible():
              res = MotorVideo().ensamblar_mp4(frames, fps=12)
              encabezado = res["video"][:12]
              print("primeros 12 bytes:", encabezado)
              assert encabezado[4:8] == b"ftyp", encabezado
              print("MP4 H.264 REAL OK:", res["bytes"], "bytes")
          res_avi = MotorVideo().ensamblar_avi(frames, fps=12)
          assert res_avi["video"][:4] == b"RIFF"
          print("AVI respaldo OK:", res_avi["bytes"], "bytes")
          PYEOF
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - parche MP4"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "GOV-DATA + MP4: validacion ftyp en posicion estandar ISO-BMFF"
            git push
          fi
