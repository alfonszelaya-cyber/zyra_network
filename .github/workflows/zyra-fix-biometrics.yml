name: "RED-DEATH paso 1: auditoria transiciones de identidad + registro de defuncion (SOLO LECTURA)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: identity/registry.py completo (como valida y aplica transiciones)"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          p = Path("shared_engines/identity/registry.py")
          print("=== identity/registry.py ===")
          if p.exists():
              for i, l in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          else:
              print("NO EXISTE")
          D1EOF

      - name: "Dump 2: life_history/store.py - metodos de cadena (para register_death)"
        run: |
          python3 - <<'D2EOF'
          import inspect
          from pathlib import Path
          p = Path("apps/axis/life_history/store.py")
          txt = p.read_text(encoding="utf-8")
          print("=== metodos publicos del LifeHistoryStore ===")
          import ast as _a
          tree = _a.parse(txt)
          for node in _a.walk(tree):
              if isinstance(node, _a.ClassDef):
                  print("-- clase " + node.name)
                  for m in node.body:
                      if isinstance(m, _a.FunctionDef) and not m.name.startswith("_"):
                          print("   def " + m.name)
          print()
          print("=== add_life_event completo (el patron para register_death) ===")
          lines = txt.splitlines()
          ini = None
          for i, l in enumerate(lines, 1):
              if "def add_life_event" in l:
                  ini = i
                  break
          if ini:
              for n in range(ini - 1, min(ini + 50, len(lines))):
                  print(str(n + 1).rjust(4) + ": " + lines[n])
          D2EOF

      - name: "Dump 3: donde se usan IdentityStatus en transiciones HTTP (la ruta transition)"
        run: |
          python3 - <<'D3EOF'
          from pathlib import Path
          p = Path("shared_engines/runtime/api.py")
          lines = p.read_text(encoding="utf-8").splitlines()
          for i, l in enumerate(lines, 1):
              if "transition" in l.lower():
                  print(str(i).rjust(5) + ": " + l.strip()[:120])
          D3EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
