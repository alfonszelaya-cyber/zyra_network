name: ZYRA S6 fix /registro/nuevo (NameError dr)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  s6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar YAML del workflow
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml', encoding='utf-8')); print('YAML OK')"

      - name: S6 parche quirurgico de superapp.py
        run: |
          cat > /tmp/s6_fix.py << 'PYEOF'
          import os, sys, py_compile

          RUTA = os.path.join(os.getcwd(), "superapp.py")
          with open(RUTA, encoding="utf-8") as f:
              src = f.read()

          I12 = " " * 12
          I16 = " " * 16
          I20 = " " * 20
          I24 = " " * 24

          DEAD = "\n".join([
              I12 + 'zid = ""',
              I12 + "if isinstance(dr, dict):",
              I16 + 'dx = dr.get("data") or dr',
              I16 + "if isinstance(dx, dict):",
              I20 + 'zid = str(dx.get("zid") or dx.get("identity_id") or dx.get("id") or "")',
          ])

          NEW = "\n".join([
              I12 + 'zid = locals().get("zid", "")',
              I12 + "if not zid and status_e in (200, 201) and isinstance(je_, dict):",
              I16 + 'dx2 = je_.get("data") or je_',
              I16 + "if isinstance(dx2, dict):",
              I20 + 'zid = str(dx2.get("zid") or dx2.get("identity_id") or dx2.get("id") or "")',
              I20 + 'if not zid and isinstance(dx2.get("identity"), dict):',
              I24 + 'zid = str(dx2["identity"].get("zid") or "")',
          ])

          c_dead = src.count(DEAD)
          c_dr = src.count("isinstance(dr")
          c_new = src.count('locals().get("zid"')
          print("GATES ANTES | DEAD=%d isinstance_dr=%d ya_parche=%d" % (c_dead, c_dr, c_new))

          if c_dead == 0 and c_dr == 0 and c_new == 1:
              print("YA APLICADO — no se toca ni se commitea nada")
              sys.exit(0)

          if c_dead != 1 or c_dr != 1:
              print("ANCLAS NO COINCIDEN — NO SE ESCRIBE NADA. Contexto:")
              for i, l in enumerate(src.splitlines()):
                  if "dr" in l and ("isinstance" in l or "dr.get" in l):
                      print("%4d | %s" % (i + 1, l))
              sys.exit(1)

          nuevo = src.replace(DEAD, NEW, 1)

          ok1 = nuevo.count("isinstance(dr") == 0
          ok2 = nuevo.count('dr.get("data")') == 0
          ok3 = nuevo.count('locals().get("zid"') == 1
          ok4 = nuevo.count('dx2["identity"].get("zid")') == 1
          print("GATES DESPUES | %s %s %s %s" % (ok1, ok2, ok3, ok4))
          if not (ok1 and ok2 and ok3 and ok4):
              print("GATE POST FALLO — NO SE ESCRIBE NADA")
              sys.exit(1)

          with open(RUTA, "w", encoding="utf-8") as f:
              f.write(nuevo)

          py_compile.compile(RUTA, doraise=True)
          print("COMPILACION OK")

          lines = nuevo.splitlines()
          for i, l in enumerate(lines):
              if 'locals().get("zid"' in l:
                  print("--- BLOQUE CORREGIDO, linea %d ---" % (i + 1))
                  for j in range(max(0, i - 3), min(len(lines), i + 12)):
                      print("%4d | %s" % (j + 1, lines[j]))
                  break
          print("S6 PATCH OK")
          PYEOF
          python3 /tmp/s6_fix.py > /tmp/s6_out.txt 2>&1
          RC=$?
          cat /tmp/s6_out.txt
          {
            echo "## S6 — fix /registro/nuevo en superapp.py"
            echo ""
            echo '````'
            cat /tmp/s6_out.txt
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Commit del arreglo
        run: |
          if git diff --quiet -- superapp.py; then
            echo "Sin cambios: ya estaba aplicado."
          else
            git config user.name "zyra-ci"
            git config user.email "zyra-ci@users.noreply.github.com"
            git add superapp.py
            git commit -m "S6: fix NameError dr en /registro/nuevo + extraccion identity.zid"
            git push
          fi
