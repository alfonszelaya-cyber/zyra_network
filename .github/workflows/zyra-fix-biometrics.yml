name: "AGRO audit: sales/all (SOLO LECTURA) - codigo real + como usa el test + estado HTTP"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: agro-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: menciones sales/all en apps/agro (codigo + tests + rutas)"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          for f in sorted(Path("apps/agro").rglob("*.py")):
              try:
                  txt = f.read_text(encoding="utf-8")
              except Exception:
                  continue
              hits = []
              for i, l in enumerate(txt.splitlines(), 1):
                  if "sales/all" in l or "sales_all" in l:
                      hits.append((i, l.strip()))
              if hits:
                  print()
                  print("-- " + str(f)
                        + " (" + str(len(hits))
                        + " hits)")
                  for i, l in hits[:15]:
                      print("  " + str(i).rjust(5)
                            + ": " + l[:120])
          D1EOF

      - name: "Dump 2: como funciona hoy sales (persistencia): metodos del store/servicio"
        run: |
          python3 - <<'D2EOF'
          import inspect
          from pathlib import Path
          base = Path("apps/agro")
          dudosos = [f for f in base.rglob("*.py")
                     if ("sales" in f.name
                         or "market" in f.name
                         or "comerc" in f.name)]
          print("archivos candidatos:")
          for f in dudosos:
              print("  " + str(f))
          print()
          for f in dudosos:
              try:
                  tree = __import__("ast").parse(
                      f.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for node in __import__("ast").walk(tree):
                  if isinstance(node,
                      (__import__("ast").ClassDef,)):
                      metodos = [n.name for n in node.body
                          if isinstance(n,
                          (__import__("ast").FunctionDef,))]
                      if any("sales" in m
                             or "list" in m
                             for m in metodos):
                          print("-- "
                              + str(f) + " :: "
                              + node.name)
                          for m in metodos:
                              print("     "
                                  + m)
          D2EOF

      - name: "Dump 3: rutas HTTP existentes de AGRO (server: donde se agregarian sales/all)"
        run: |
          python3 - <<'D3EOF'
          from pathlib import Path
          for nombre in ("apps/agro/server.py",
                         "apps/agro/super_server.py",
                         "apps/agro/api.py"):
              p = Path(nombre)
              if not p.exists():
                  continue
              lines = p.read_text(
                  encoding="utf-8").splitlines()
              print()
              print("=== " + nombre
                    + " (GET routes + sales) ===")
              for i, l in enumerate(lines, 1):
                  if ("_get(" in l
                          or "sales" in l
                          or "def _api" in l
                          or "def _route" in l):
                      print(str(i).rjust(5)
                            + ": " + l[:120])
              break
          D3EOF

      - name: "Dump 4: el test que cubre sales hoy (que exige)"
        run: |
          python3 - <<'D4EOF'
          from pathlib import Path
          for f in sorted(
              Path("apps/agro").rglob("test_*.py")):
              txt = f.read_text(encoding="utf-8")
              if "sales" in txt:
                  print()
                  print("======== " + str(f)
                        + " (fragmentos con sales) ========")
                  lines = txt.splitlines()
                  mostradas = set()
                  for i, l in enumerate(lines, 1):
                      if "sales" in l:
                          for n in range(max(0, i - 4),
                                         min(len(lines),
                                             i + 5)):
                              if n not in mostradas:
                                  print(str(n + 1).rjust(5)
                                        + ": " + lines[n])
                                  mostradas.add(n)
                          print("---")
                          if len(mostradas) > 120:
                              break
          D4EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
