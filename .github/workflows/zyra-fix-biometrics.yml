name: "AGRO RUN BC PLUS: GPT-7+1+2 con logica real conectada y reforzada"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - zyra_link: conector al motor transversal de conversion de la Red"
        run: |
          python3 - <<'LKEOF'
          from pathlib import Path
          p = Path("apps/agro/services/zyra_link.py")
          t = p.read_text(encoding="utf-8")
          if "quote_to_usd" in t:
              print("SKIP zyra_link (ya aplicado)")
              raise SystemExit(0)
          lines = [
              "\n",
              "    def quote_to_usd(\n",
              "        self, *, requester_zid: str,\n",
              "        amount: str, currency: str,\n",
              "    ) -> tuple[bool, dict | None, str | None]:\n",
              "        \"\"\"Conector al motor transversal de la\n",
              "        Red (currency engine): cotizacion firmada\n",
              "        en vivo hacia USD. AGRO nunca convierte\n",
              "        por su cuenta: la conversion es de la\n",
              "        Red.\"\"\"\n",
              "        return self._client.post(\n",
              "            \"/currency/quote\",\n",
              "            {\n",
              "                \"base\": str(\n",
              "                    currency or \"USD\"\n",
              "                ).upper(),\n",
              "                \"quote_ccy\": \"USD\",\n",
              "                \"requester_zid\": (\n",
              "                    requester_zid\n",
              "                ),\n",
              "            },\n",
              "        )\n",
          ]
          t = t.rstrip("\n") + "\n" + "".join(lines)
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          print("OK zyra_link quote_to_usd")
          LKEOF

      - name: "Paso 2 - servicios reforzados (append aditivo a archivos reales)"
        run: |
          python3 - <<'APPEOF'
          import textwrap
          from pathlib import Path

          APPENDS = {}

          APPENDS["apps/agro/modules/productores/perfil/profile_service.py"] = textwrap.dedent('''\


              # ---- additive PLUS (GPT-1): perfil con validacion e historial ----
              def _agro_valid_phone(phone):
                  digits = "".join(
                      c for c in str(phone or "") if c.isdigit()
                  )
                  return 7 <= len(digits) <= 15


              def get_profile_db(db, producer_id):
                  for name in ("query_one", "query"):
                      fn = getattr(db, name, None)
                      if callable(fn):
                          try:
                              row = fn(
                                  "SELECT producer_id, phone,"
                                  " location, notes, updated_at"
                                  " FROM agro_producer_profiles"
                                  " WHERE producer_id = ?",
                                  (producer_id,),
                              )
                          except Exception:
                              row = None
                          if row:
                              return dict(row)
                  return {
                      "producer_id": producer_id,
                      "phone": "",
                      "location": "",
                      "notes": "",
                  }


              def update_profile_db(
                  db, *, producer_id,
                  phone="", location="",
                  notes="", actor="anon",
              ):
                  import time as _t
                  if phone and not _agro_valid_phone(phone):
                      raise ValueError(
                          "telefono invalido (7-15 digitos)"
                      )
                  db.execute(
                      "CREATE TABLE IF NOT EXISTS"
                      " agro_producer_profiles ("
                      " producer_id TEXT PRIMARY KEY,"
                      " phone TEXT, location TEXT,"
                      " notes TEXT, updated_at TEXT)"
                  )
                  db.execute(
                      "CREATE TABLE IF NOT EXISTS"
                      " agro_profile_history ("
                      " hid INTEGER PRIMARY KEY"
                      " AUTOINCREMENT,"
                      " producer_id TEXT NOT NULL,"
                      " actor TEXT NOT NULL,"
                      " changed TEXT NOT NULL,"
                      " at TEXT NOT NULL)"
                  )
                  prev = get_profile_db(db, producer_id)
                  changed = []
                  for field in ("phone", "location", "notes"):
                      if str(prev.get(field) or "") != str(
                          locals().get(field) or ""
                      ):
                          changed.append(field)
                  ts = _t.strftime(
                      "%Y-%m-%dT%H:%M:%SZ", _t.gmtime()
                  )
                  db.execute(
                      "INSERT INTO"
                      " agro_producer_profiles ("
                      " producer_id, phone, location,"
                      " notes, updated_at)"
                      " VALUES (?, ?, ?, ?, ?)"
                      " ON CONFLICT(producer_id)"
                      " DO UPDATE SET phone ="
                      " excluded.phone, location ="
                      " excluded.location, notes ="
                      " excluded.notes, updated_at ="
                      " excluded.updated_at",
                      (producer_id, phone, location,
                       notes, ts),
                  )
                  db.execute(
                      "INSERT INTO agro_profile_history ("
                      " producer_id, actor, changed, at)"
                      " VALUES (?, ?, ?, ?)",
                      (producer_id, str(actor),
                       ",".join(changed) or "none", ts),
                  )
                  return {
                      "producer_id": producer_id,
                      "phone": phone,
                      "location": location,
                      "notes": notes,
                      "updated_at": ts,
                      "changed": changed,
                  }


              def get_profile_history_db(
                  db, producer_id, limit=50,
              ):
                  for name in ("query_all", "query", "fetchall"):
                      fn = getattr(db, name, None)
                      if callable(fn):
                          try:
                              got = fn(
                                  "SELECT hid, producer_id,"
                                  " actor, changed, at FROM"
                                  " agro_profile_history WHERE"
                                  " producer_id = ? ORDER BY"
                                  " hid DESC LIMIT ?",
                                  (producer_id, int(limit)),
                              )
                          except Exception:
                              got = None
                          if got:
                              return [dict(r) for r in got]
                  return []
          ''')

