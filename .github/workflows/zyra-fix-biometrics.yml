name: "ZYRA EX Run 2C - presentacion interactiva corregida y autocontenida"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Escribir simulation_engine.py completo (evolucion + GemeloVivo)
        run: |
          cat > apps/laboratorio/infrastructure/providers/simulation_engine.py <<'SIM_EOF'
          """Motor de evolucion + GEMELO DIGITAL EN VIVO."""
          from apps.laboratorio.domain.scenario import Escenario

          TIPOS_FUENTE = ("sensor", "api", "csv", "manual")


          class MotorEvolucionReal:
              EFICIENCIA_ANUAL = 0.02
              RIESGO_ANUAL = 0.01

              def capacidades(self) -> dict:
                  return {
                      "horizonte_anios": (1, 30),
                      "crecimiento_pct": (-50, 200),
                      "modelo": "beneficio crece - costo mejora 2pct anual - riesgo +1pct anual",
                  }

              def ejecutar(self, escenario: Escenario, horizonte_anios: int, crecimiento_pct: float) -> dict:
                  if not isinstance(escenario, Escenario):
                      raise ValueError("Se esperaba un Escenario.")
                  if not (1 <= int(horizonte_anios) <= 30):
                      raise ValueError("horizonte_anios fuera de rango 1-30.")
                  if not (-50.0 <= float(crecimiento_pct) <= 200.0):
                      raise ValueError("crecimiento_pct fuera de rango -50 a 200.")
                  for clave in ("costo", "beneficio", "riesgo"):
                      if clave not in escenario.parametros:
                          raise ValueError("El escenario requiere el parametro " + clave)
                  costo0 = float(escenario.parametros["costo"])
                  beneficio0 = float(escenario.parametros["beneficio"])
                  riesgo0 = float(escenario.parametros["riesgo"])
                  factor_b = 1.0 + float(crecimiento_pct) / 100.0
                  serie = []
                  sum_beneficio = 0.0
                  sum_costo = 0.0
                  punto_equilibrio = 0
                  for i in range(int(horizonte_anios) + 1):
                      beneficio = beneficio0 * (factor_b ** i)
                      costo = costo0 * ((1.0 - self.EFICIENCIA_ANUAL) ** i)
                      riesgo = min(100.0, riesgo0 * (1.0 + self.RIESGO_ANUAL * i))
                      puntaje = min(100.0, 0.4 * (100.0 - costo) + 0.4 * beneficio + 0.2 * (100.0 - riesgo))
                      if i >= 1:
                          sum_beneficio += beneficio
                          sum_costo += costo
                          if punto_equilibrio == 0 and beneficio > costo:
                              punto_equilibrio = i
                      serie.append({"anio": i, "costo": round(costo, 4), "beneficio": round(beneficio, 4), "riesgo": round(riesgo, 4), "puntaje": round(puntaje, 4)})
                  roi = round((sum_beneficio - sum_costo) / sum_costo * 100.0, 2) if sum_costo > 0 else 0.0
                  inicial = serie[0]["puntaje"]
                  final = serie[-1]["puntaje"]
                  if final > inicial * 1.01:
                      tendencia = "creciente"
                  elif final < inicial * 0.99:
                      tendencia = "decreciente"
                  else:
                      tendencia = "estable"
                  return {"serie": serie, "metricas": {
                      "punto_equilibrio_anio": punto_equilibrio, "roi_pct": roi,
                      "puntaje_inicial": inicial, "puntaje_final": final, "tendencia": tendencia,
                  }}


          class GemeloVivo:
              """Gemelo digital en vivo: fuentes reales -> estado -> alertas."""

              def __init__(self):
                  self._fuentes = {}
                  self._historico = {}
                  self._actualizaciones = 0

              def capacidades(self) -> dict:
                  return {"tipos_fuente": TIPOS_FUENTE, "salidas": ("estado", "delta", "alertas_por_umbral", "historico")}

              def registrar_fuente(self, id_fuente, tipo, valor, umbral_alto=None, umbral_bajo=None, etiqueta="") -> dict:
                  id_limpio = str(id_fuente or "").strip()
                  if not id_limpio:
                      raise ValueError("id_fuente requerido.")
                  if tipo not in TIPOS_FUENTE:
                      raise ValueError("tipo desconocido: " + repr(tipo) + ". Validos: " + ", ".join(TIPOS_FUENTE))
                  if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                      raise ValueError("valor inicial debe ser numerico.")
                  fuente = {"id": id_limpio, "tipo": tipo, "valor": float(valor), "anterior": float(valor),
                            "umbral_alto": None, "umbral_bajo": None, "etiqueta": str(etiqueta or "")[:80], "actualizaciones": 0}
                  if umbral_alto is not None:
                      if isinstance(umbral_alto, bool) or not isinstance(umbral_alto, (int, float)):
                          raise ValueError("umbral_alto debe ser numerico.")
                      fuente["umbral_alto"] = float(umbral_alto)
                  if umbral_bajo is not None:
                      if isinstance(umbral_bajo, bool) or not isinstance(umbral_bajo, (int, float)):
                          raise ValueError("umbral_bajo debe ser numerico.")
                      fuente["umbral_bajo"] = float(umbral_bajo)
                  if fuente["umbral_alto"] is not None and fuente["umbral_bajo"] is not None and fuente["umbral_bajo"] >= fuente["umbral_alto"]:
                      raise ValueError("umbral_bajo debe ser menor que umbral_alto.")
                  self._fuentes[id_limpio] = fuente
                  self._historico[id_limpio] = [float(valor)]
                  return dict(fuente)

              def actualizar(self, id_fuente, valor) -> dict:
                  id_limpio = str(id_fuente or "").strip()
                  fuente = self._fuentes.get(id_limpio)
                  if fuente is None:
                      raise ValueError("Fuente no registrada: " + id_limpio)
                  if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                      raise ValueError("valor debe ser numerico.")
                  valor = float(valor)
                  anterior = fuente["valor"]
                  fuente["anterior"] = anterior
                  fuente["valor"] = valor
                  fuente["actualizaciones"] += 1
                  self._actualizaciones += 1
                  historico = self._historico.setdefault(id_limpio, [])
                  historico.append(valor)
                  if len(historico) > 500:
                      del historico[:-500]
                  alertas = []
                  if fuente["umbral_alto"] is not None and valor > fuente["umbral_alto"]:
                      alertas.append({"tipo": "umbral_alto_superado", "valor": valor, "umbral": fuente["umbral_alto"], "exceso": round(valor - fuente["umbral_alto"], 6)})
                  if fuente["umbral_bajo"] is not None and valor < fuente["umbral_bajo"]:
                      alertas.append({"tipo": "umbral_bajo_superado", "valor": valor, "umbral": fuente["umbral_bajo"], "deficit": round(fuente["umbral_bajo"] - valor, 6)})
                  return {"id": id_limpio, "valor_anterior": anterior, "valor_nuevo": valor,
                          "delta": round(valor - anterior, 6), "alertas": alertas, "actualizaciones": self._actualizaciones}

              def estado(self) -> dict:
                  fuentes = []
                  for id_ in sorted(self._fuentes):
                      fuente = dict(self._fuentes[id_])
                      fuente["ultimo_delta"] = round(fuente["valor"] - fuente["anterior"], 6)
                      fuentes.append(fuente)
                  return {"fuentes": fuentes, "total_fuentes": len(fuentes),
                          "actualizaciones_totales": self._actualizaciones,
                          "historico_puntos": sum(len(v) for v in self._historico.values())}

              def historico(self, id_fuente, limite=50) -> dict:
                  id_limpio = str(id_fuente or "").strip()
                  if id_limpio not in self._fuentes:
                      raise ValueError("Fuente no registrada: " + id_limpio)
                  serie = list(self._historico.get(id_limpio, []))
                  return {"id": id_limpio, "puntos": len(serie), "valores": serie[-int(limite):]}
          SIM_EOF

      - name: Escribir decisions.py con rutas del gemelo
        run: |
          cat > apps/laboratorio/routers/api/decisions.py <<'DEC_EOF'
          """Rutas API de decisiones - simulacion, comparacion, optimizacion, Monte Carlo y gemelo en vivo."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.schemas.responses.envelopes import exito

          RUTA_SIMULAR = "/laboratorio/api/v1/projects/{proyecto_id}/simulate"
          RUTA_SIMS = "/laboratorio/api/v1/projects/{proyecto_id}/simulations"
          RUTA_COMPARAR = "/laboratorio/api/v1/projects/{proyecto_id}/compare"
          RUTA_COMPARACION = "/laboratorio/api/v1/comparisons/{comparacion_id}"
          RUTA_INFORME = RUTA_COMPARACION + "/report.html"
          RUTA_OPTIMIZAR = "/laboratorio/api/v1/scenarios/{escenario_id}/optimize"
          RUTA_APLICAR = "/laboratorio/api/v1/optimizations/{optimizacion_id}/apply"
          RUTA_MONTE = "/laboratorio/api/v1/projects/{proyecto_id}/monte-carlo"
          RUTA_MONTE_COMPARA = "/laboratorio/api/v1/projects/{proyecto_id}/monte-carlo/comparar"
          RUTA_GEMELO_FUENTES = "/laboratorio/api/v1/twin/sources"
          RUTA_GEMELO_FUENTE = "/laboratorio/api/v1/twin/sources/{fuente_id}"
          RUTA_GEMELO_HISTORICO = "/laboratorio/api/v1/twin/sources/{fuente_id}/history"
          RUTA_GEMELO_ESTADO = "/laboratorio/api/v1/twin"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_decisiones")
              motor_mc = app.contenedor.obtener("motor_monte_carlo")
              gemelo = app.contenedor.obtener("gemelo_vivo")

              def _simular(ctx):
                  return manejador.simular(ctx.identidad, ctx.ruta_params["proyecto_id"], ctx.json())

              def _sims(ctx):
                  return manejador.listar_simulaciones(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _comparar(ctx):
                  return manejador.comparar(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _comparacion(ctx):
                  return manejador.obtener_comparacion(ctx.identidad, ctx.ruta_params["comparacion_id"])

              def _informe(ctx):
                  return manejador.informe_comparacion(ctx.identidad, ctx.ruta_params["comparacion_id"])

              def _optimizar(ctx):
                  return manejador.optimizar(ctx.identidad, ctx.ruta_params["escenario_id"])

              def _aplicar(ctx):
                  return manejador.aplicar(ctx.identidad, ctx.ruta_params["optimizacion_id"], ctx.json_opcional())

              def _monte(ctx):
                  return exito(motor_mc.simular(ctx.json()))

              def _monte_compara(ctx):
                  return exito(motor_mc.comparar(ctx.json()))

              def _gem_registrar(ctx):
                  datos = ctx.json()
                  return exito(gemelo.registrar_fuente(
                      datos.get("id", ""), str(datos.get("tipo", "sensor")).strip(),
                      datos.get("valor", 0.0), datos.get("umbral_alto"),
                      datos.get("umbral_bajo"), str(datos.get("etiqueta", "")),
                  ))

              def _gem_actualizar(ctx):
                  datos = ctx.json()
                  return exito(gemelo.actualizar(ctx.ruta_params["fuente_id"], datos.get("valor")))

              def _gem_historico(ctx):
                  return exito(gemelo.historico(ctx.ruta_params["fuente_id"]))

              def _gem_estado(ctx):
                  return exito(gemelo.estado())

              app.registrar("POST", RUTA_SIMULAR, _simular, PermisoCodigo.SIMULAR, "Simular evolucion temporal")
              app.registrar("GET", RUTA_SIMS, _sims, PermisoCodigo.VER, "Listar simulaciones")
              app.registrar("POST", RUTA_COMPARAR, _comparar, PermisoCodigo.COMPARAR, "Comparar escenarios evaluados")
              app.registrar("GET", RUTA_COMPARACION, _comparacion, PermisoCodigo.VER, "Obtener comparacion")
              app.registrar("GET", RUTA_INFORME, _informe, PermisoCodigo.VER, "Informe HTML de la comparacion")
              app.registrar("POST", RUTA_OPTIMIZAR, _optimizar, PermisoCodigo.OPTIMIZAR, "Sugerir optimizacion")
              app.registrar("POST", RUTA_APLICAR, _aplicar, PermisoCodigo.OPTIMIZAR, "Aplicar optimizacion como escenario nuevo")
              app.registrar("POST", RUTA_MONTE, _monte, PermisoCodigo.SIMULAR, "Monte Carlo reproducible con IC95 y convergencia")
              app.registrar("POST", RUTA_MONTE_COMPARA, _monte_compara, PermisoCodigo.COMPARAR, "Comparar configuraciones con Monte Carlo")
              app.registrar("POST", RUTA_GEMELO_FUENTES, _gem_registrar, PermisoCodigo.SIMULAR, "Registrar fuente real del gemelo")
              app.registrar("POST", RUTA_GEMELO_FUENTE, _gem_actualizar, PermisoCodigo.SIMULAR, "Actualizar valor real de una fuente")
              app.registrar("GET", RUTA_GEMELO_HISTORICO, _gem_historico, PermisoCodigo.VER, "Historico real de una fuente")
              app.registrar("GET", RUTA_GEMELO_ESTADO, _gem_estado, PermisoCodigo.VER, "Estado del gemelo digital en vivo")
          DEC_EOF

      - name: Escribir presentation_remote.py (str() en ids + Escena3D real)
        run: |
          cat > apps/laboratorio/infrastructure/providers/presentation_remote.py <<'PR_EOF'
          """PRESENTACION HOLOGRAFICA INTERACTIVA.

          Control y proyeccion son INDEPENDIENTES: la proyeccion sale por
          la salida universal (HDMI/framebuffer, UDP, web); el control se
          abre en cualquier navegador (telefono, PC, tablet). El telefono
          es el tactil: tocas el punto a explicar y queda anotado en la
          proyeccion. Cada accion queda en historial auditable.
          """
          import time

          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.hologram_engine import MotorHolograma
          from apps.laboratorio.shared.models.identifiers import nuevo_id

          ACCIONES_VALIDAS = ("avanzar", "retroceder", "ir_a", "tocar_punto", "finalizar")


          def _escapar(texto):
              return str(texto).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


          def _escena_para_holograma(nombre):
              """Escena3D REAL para el MotorHolograma (varias firmas)."""
              try:
                  return Escena3D(nombre=nombre, ancho=900, alto=700, objetos=[])
              except TypeError:
                  try:
                      return Escena3D(nombre, 900, 700, [])
                  except Exception:
                      esc = Escena3D.__new__(Escena3D)
                      for atributo, valor in (
                          ("nombre", nombre), ("ancho", 900), ("alto", 700), ("objetos", []),
                      ):
                          setattr(esc, atributo, valor)
                      return esc


          class SesionPresentacion:
              def __init__(self, id_sesion, presentacion, proyector):
                  self.id = str(id_sesion)
                  self._presentacion = presentacion
                  self._proyector = proyector
                  self._holograma = MotorHolograma()
                  self.paso_actual = 0
                  self.activa = True
                  self.anotaciones = []
                  self.historial = []
                  self.iniciada_en = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

              def _pasos(self):
                  return list(getattr(self._presentacion, "pasos", []) or [])

              def total_pasos(self):
                  return len(self._pasos())

              def _registrar(self, accion, detalle):
                  entrada = {"accion": str(accion), "detalle": dict(detalle or {}),
                             "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
                  self.historial.append(entrada)
                  return entrada

              def _paso_datos(self):
                  pasos = self._pasos()
                  if not pasos:
                      return {"indice": 0, "total": 0, "titulo": "", "contenido": ""}
                  paso = pasos[min(self.paso_actual, len(pasos) - 1)]
                  try:
                      datos = paso.a_dict() if hasattr(paso, "a_dict") else dict(paso)
                  except Exception:
                      datos = {"titulo": str(getattr(paso, "titulo", ""))}
                  datos["indice"] = self.paso_actual
                  datos["total"] = len(pasos)
                  return datos

              def avanzar(self):
                  total = self.total_pasos()
                  if self.paso_actual < total - 1:
                      self.paso_actual += 1
                  self._registrar("avanzar", {"paso": self.paso_actual})
                  return {"paso": self.paso_actual, "total": total}

              def retroceder(self):
                  if self.paso_actual > 0:
                      self.paso_actual -= 1
                  self._registrar("retroceder", {"paso": self.paso_actual})
                  return {"paso": self.paso_actual, "total": self.total_pasos()}

              def ir_a(self, indice):
                  indice = int(indice)
                  total = self.total_pasos()
                  if not 0 <= indice < total:
                      raise ValueError("indice fuera de rango 0.." + str(total - 1))
                  self.paso_actual = indice
                  self._registrar("ir_a", {"paso": indice})
                  return {"paso": self.paso_actual, "total": total}

              def tocar_punto(self, x, y, etiqueta=""):
                  xv = float(x)
                  yv = float(y)
                  if xv < 0 or yv < 0:
                      raise ValueError("coordenadas no pueden ser negativas.")
                  anotacion = {"id": "anot-" + str(len(self.anotaciones) + 1).zfill(4),
                               "paso": self.paso_actual, "x": round(xv, 2), "y": round(yv, 2),
                               "etiqueta": str(etiqueta or "")[:200],
                               "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
                  self.anotaciones.append(anotacion)
                  self._registrar("tocar_punto", {"paso": self.paso_actual, "x": anotacion["x"], "y": anotacion["y"]})
                  return dict(anotacion)

              def anotaciones_del_paso(self, indice=None):
                  indice = self.paso_actual if indice is None else int(indice)
                  return [dict(a) for a in self.anotaciones if a["paso"] == indice]

              def frame_holograma(self):
                  paso = self._paso_datos()
                  titulo = str(paso.get("titulo", "") or ("Paso " + str(paso["indice"] + 1)))
                  svg = self._holograma.generar(_escena_para_holograma(titulo))
                  texto = str(paso.get("contenido", "") or paso.get("descripcion", "") or "")
                  marcas = []
                  if texto:
                      y = 60
                      for i in range(0, min(len(texto), 240), 60):
                          marcas.append('<text x="24" y="' + str(y) + '" fill="#E2E8F0" font-size="16" font-family="sans-serif">' + _escapar(texto[i:i + 60]) + "</text>")
                          y += 24
                  for a in self.anotaciones_del_paso():
                      marcas.append('<circle cx="' + str(a["x"]) + '" cy="' + str(a["y"]) + '" r="10" fill="none" stroke="#F59E0B" stroke-width="3"><animate attributeName="r" values="6;14;6" dur="1.6s" repeatCount="indefinite"/></circle>')
                  if marcas and "</svg>" in svg:
                      svg = svg.replace("</svg>", "".join(marcas) + "</svg>", 1)
                  return svg.encode("utf-8")

              def estado(self):
                  return {"sesion": str(self.id), "activa": self.activa, "paso_actual": self.paso_actual,
                          "total_pasos": self.total_pasos(), "anotaciones_total": len(self.anotaciones),
                          "anotaciones_paso": self.anotaciones_del_paso(), "iniciada_en": self.iniciada_en,
                          "paso": self._paso_datos()}

              def finalizar(self):
                  self.activa = False
                  self._registrar("finalizar", {"anotaciones": len(self.anotaciones)})
                  return {"sesion": str(self.id), "duracion_pasos": self.total_pasos(),
                          "anotaciones": len(self.anotaciones), "historial": list(self.historial)}


          class PresentacionRemota:
              def __init__(self, repo_presentaciones, proyector):
                  self._repo = repo_presentaciones
                  self._proyector = proyector
                  self._sesiones = {}

              def capacidades(self):
                  return {"control": ("telefono", "pc", "tablet"), "acciones": ACCIONES_VALIDAS,
                          "proyeccion": "MotorHolo3D salida universal (independiente del control)",
                          "tactil": "el navegador de control es el tactil"}

              def crear_sesion(self, presentacion_id):
                  id_limpio = str(presentacion_id or "").strip()
                  if not id_limpio:
                      raise ValueError("presentacion_id requerido.")
                  presentacion = self._repo.obtener_exigir(id_limpio)
                  id_sesion = str(nuevo_id("ses"))
                  sesion = SesionPresentacion(id_sesion, presentacion, self._proyector)
                  self._sesiones[id_sesion] = sesion
                  return {"sesion": id_sesion, "presentacion": id_limpio,
                          "total_pasos": sesion.total_pasos(),
                          "vista_control": "/laboratorio/api/v1/presentations/remote/" + id_sesion + "/view"}

              def sesion(self, id_sesion):
                  sesion = self._sesiones.get(str(id_sesion or "").strip())
                  if sesion is None:
                      raise ValueError("Sesion desconocida: " + str(id_sesion))
                  return sesion

              def listar_sesiones(self):
                  return {"activas": [{"sesion": str(sid), "paso": s.paso_actual, "total": s.total_pasos()}
                                       for sid, s in sorted(self._sesiones.items()) if s.activa],
                          "total": len(self._sesiones)}

              def proyectar_paso_actual(self, id_sesion):
                  sesion = self.sesion(id_sesion)
                  frame = sesion.frame_holograma()
                  entrega = self._proyector.presentar(frame, {"tipo": "web"})
                  return {"sesion": str(sesion.id), "paso": sesion.paso_actual, "proyeccion": entrega}
          PR_EOF

      - name: Escribir presentations.py con control remoto
        run: |
          cat > apps/laboratorio/routers/api/presentations.py <<'PRES_EOF'
          """Rutas API de presentaciones + control remoto holografico."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.shared.exceptions.domain_errors import EntidadNoEncontradaError

          RUTA_CREAR = "/laboratorio/api/v1/projects/{proyecto_id}/presentations"
          RUTA_ITEM = "/laboratorio/api/v1/presentations/{presentacion_id}"
          RUTA_PLAY = RUTA_ITEM + "/play"
          RUTA_SELLAR = RUTA_ITEM + "/seal"
          RUTA_SESIONES = "/laboratorio/api/v1/presentations/remote"
          RUTA_SESION = RUTA_SESIONES + "/{sesion_id}"
          RUTA_ACCION = RUTA_SESION + "/accion"
          RUTA_TOQUE = RUTA_SESION + "/tocar"
          RUTA_FRAME = RUTA_SESION + "/frame.svg"
          RUTA_VISTA = RUTA_SESION + "/view"
          RUTA_PROYECTAR = RUTA_SESION + "/proyectar"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_presentaciones")
              remota = app.contenedor.obtener("presentacion_remota")

              def _crear(ctx):
                  return manejador.crear(ctx.identidad, ctx.ruta_params["proyecto_id"], ctx.json())

              def _listar(ctx):
                  return manejador.listar(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _obtener(ctx):
                  return manejador.obtener(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _reproducir(ctx):
                  return manejador.reproducir(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _sellar(ctx):
                  return manejador.sellar(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _sesion_o_404(sesion_id):
                  try:
                      return remota.sesion(sesion_id)
                  except ValueError as exc:
                      raise EntidadNoEncontradaError(str(exc), sesion_id)

              def _crear_sesion(ctx):
                  datos = ctx.json()
                  return remota.crear_sesion(datos.get("presentacion_id", ""))

              def _listar_sesiones(ctx):
                  return remota.listar_sesiones()

              def _estado(ctx):
                  return _sesion_o_404(ctx.ruta_params["sesion_id"]).estado()

              def _accion(ctx):
                  datos = ctx.json()
                  accion = str(datos.get("accion", "")).strip()
                  sesion = _sesion_o_404(ctx.ruta_params["sesion_id"])
                  if accion == "avanzar":
                      return sesion.avanzar()
                  if accion == "retroceder":
                      return sesion.retroceder()
                  if accion == "ir_a":
                      return sesion.ir_a(datos.get("indice", 0))
                  if accion == "finalizar":
                      return sesion.finalizar()
                  raise ValueError("accion desconocida: " + repr(accion))

              def _tocar(ctx):
                  datos = ctx.json()
                  sesion = _sesion_o_404(ctx.ruta_params["sesion_id"])
                  return sesion.tocar_punto(datos.get("x", 0.0), datos.get("y", 0.0), str(datos.get("etiqueta", "")))

              def _frame(ctx):
                  sesion = _sesion_o_404(ctx.ruta_params["sesion_id"])
                  return 200, sesion.frame_holograma(), {"Content-Type": "image/svg+xml", "Cache-Control": "no-store"}

              def _vista(ctx):
                  sesion_id = ctx.ruta_params["sesion_id"]
                  _sesion_o_404(sesion_id)
                  base = "/laboratorio/api/v1/presentations/remote/" + sesion_id
                  html = ("<!doctype html><html lang='es'><head><meta charset='utf-8'>"
                          "<meta name='viewport' content='width=device-width, initial-scale=1'>"
                          "<title>Control</title><style>body{background:#0B1220;color:#E2E8F0;"
                          "font-family:system-ui,sans-serif;text-align:center;padding:16px}"
                          "button{font-size:22px;margin:6px;padding:14px 22px;border-radius:12px;"
                          "border:1px solid #1E293B;background:#111827;color:#93C5FD}"
                          "img{max-width:100%;border-radius:12px;border:1px solid #1E293B}</style></head><body>"
                          "<h3>Control de proyeccion</h3>"
                          "<img id='f' src='" + base + "/frame.svg'>"
                          "<div><button onclick='acc(\"retroceder\")'>&#9664; Atras</button>"
                          "<button onclick='acc(\"avanzar\")'>Siguiente &#9654;</button></div>"
                          "<p style='color:#94A3B8;font-size:13px'>Toca la imagen para marcar el punto a explicar</p>"
                          "<script>function acc(a){fetch('" + base + "/accion',{method:'POST',"
                          "headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:a})})"
                          ".then(r=>r.json()).then(refrescar)}"
                          "var f=document.getElementById('f');"
                          "f.addEventListener('click',function(e){var r=f.getBoundingClientRect();"
                          "var x=(e.clientX-r.left)*900/r.width;var y=(e.clientY-r.top)*700/r.height;"
                          "fetch('" + base + "/tocar',{method:'POST',headers:{'Content-Type':'application/json'},"
                          "body:JSON.stringify({x:x,y:y})}).then(()=>refrescar());});"
                          "function refrescar(){f.src='" + base + "/frame.svg?t='+Date.now();}"
                          "setInterval(refrescar,3000);</script></body></html>")
                  return 200, html.encode("utf-8"), {"Content-Type": "text/html; charset=utf-8"}

              def _proyectar(ctx):
                  return remota.proyectar_paso_actual(ctx.ruta_params["sesion_id"])

              app.registrar("POST", RUTA_CREAR, _crear, PermisoCodigo.PRESENTAR, "Crear presentacion con pasos")
              app.registrar("GET", RUTA_CREAR, _listar, PermisoCodigo.VER, "Listar presentaciones")
              app.registrar("GET", RUTA_ITEM, _obtener, PermisoCodigo.VER, "Obtener presentacion")
              app.registrar("GET", RUTA_PLAY, _reproducir, PermisoCodigo.VER, "Reproducir slideshow real")
              app.registrar("POST", RUTA_SELLAR, _sellar, PermisoCodigo.PRESENTAR, "Sellar en ZYRA via outbox")
              app.registrar("POST", RUTA_SESIONES, _crear_sesion, PermisoCodigo.PRESENTAR, "Abrir sesion interactiva")
              app.registrar("GET", RUTA_SESIONES, _listar_sesiones, PermisoCodigo.VER, "Listar sesiones interactivas")
              app.registrar("GET", RUTA_SESION, _estado, PermisoCodigo.VER, "Estado de la sesion interactiva")
              app.registrar("POST", RUTA_ACCION, _accion, PermisoCodigo.PRESENTAR, "Accion de control")
              app.registrar("POST", RUTA_TOQUE, _tocar, PermisoCodigo.PRESENTAR, "Tocar punto a explicar")
              app.registrar("GET", RUTA_FRAME, _frame, PermisoCodigo.VER, "Frame holografico del paso actual")
              app.registrar("GET", RUTA_VISTA, _vista, PermisoCodigo.VER, "Vista de control desde telefono o PC")
              app.registrar("POST", RUTA_PROYECTAR, _proyectar, PermisoCodigo.PRESENTAR, "Proyectar paso actual")
          PRES_EOF

      - name: Cablear service_registry (verificado)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/registry/services/service_registry.py")
          t = ruta.read_text(encoding="utf-8")
          lineas = t.splitlines(keepends=True)
          cambios = []

          if "GemeloVivo" not in t:
              for i, l in enumerate(lineas):
                  if "simulation_engine import" in l and l.strip().startswith("from"):
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(i + 1, indent + "from apps.laboratorio.infrastructure.providers.simulation_engine import GemeloVivo\n")
                      cambios.append("import GemeloVivo")
                      break

          if "presentation_remote" not in t:
              for i, l in enumerate(lineas):
                  if "simulation_engine import" in l and l.strip().startswith("from"):
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(i + 1, indent + "from apps.laboratorio.infrastructure.providers.presentation_remote import PresentacionRemota\n")
                      cambios.append("import PresentacionRemota")
                      break

          if '"gemelo_vivo"' not in t:
              insertado = False
              for i, l in enumerate(lineas):
                  if 'c.registrar("motor_monte_carlo"' in l:
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(i + 1, indent + 'c.registrar("gemelo_vivo", lambda _c: GemeloVivo())\n')
                      insertado = True
                      cambios.append("servicio gemelo_vivo")
                      break
              if not insertado:
                  raise SystemExit("FATAL: sin ancla para gemelo_vivo")

          if '"presentacion_remota"' not in t:
              insertado = False
              for i, l in enumerate(lineas):
                  if 'c.registrar("gemelo_vivo"' in l:
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(i + 1, indent + 'c.registrar("presentacion_remota", lambda _c: PresentacionRemota(_c.obtener("repo_presentaciones"), _c.obtener("salidas_universales")))\n')
                      insertado = True
                      cambios.append("servicio presentacion_remota")
                      break
              if not insertado:
                  raise SystemExit("FATAL: sin ancla para presentacion_remota")

          t = "".join(lineas)
          for requerido in ("GemeloVivo", "PresentacionRemota", '"gemelo_vivo"', '"presentacion_remota"'):
              if requerido not in t:
                  raise SystemExit("FATAL: falta " + requerido)
          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("service_registry: " + ("; ".join(cambios) if cambios else "ya al dia") + " - verificado")
          PYEOF

