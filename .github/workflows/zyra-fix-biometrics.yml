name: "AGRO RUN B.1: header de rol agricultor en tests existentes"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - headers de rol en _post de test_agro_superapp y test_agro_n1"
        run: |
          python3 - <<'PATCHEOF'
          from pathlib import Path

          # ---- test_agro_superapp.py ----
          p1 = Path("apps/agro/tests/test_agro_superapp.py")
          t1 = p1.read_text(encoding="utf-8")
          old1 = 'headers={"Content-Type": "application/json"},'
          new1 = (
              'headers={\n'
              '                          "Content-Type": "application/json",\n'
              '                          "X-ZYRA-Actor-Role": "agricultor",\n'
              '                      },'
          )
          if "X-ZYRA-Actor-Role" in t1:
              print("SKIP superapp (rol ya presente)")
          elif old1 in t1:
              t1 = t1.replace(old1, new1)
              compile(t1, str(p1), "exec")
              p1.write_text(t1, encoding="utf-8")
              print("OK superapp header agricultor")
          else:
              print("MISS superapp (formato no encontrado)")

          # ---- test_agro_n1.py ----
          p2 = Path("apps/agro/tests/test_agro_n1.py")
          t2 = p2.read_text(encoding="utf-8")
          old2 = (
              "        headers={\n"
              "            \"Content-Type\":\n"
              "            \"application/json\"\n"
              "        },"
          )
          new2 = (
              "        headers={\n"
              "            \"Content-Type\":\n"
              "            \"application/json\",\n"
              "            \"X-ZYRA-Actor-Role\":\n"
              "            \"agricultor\",\n"
              "        },"
          )
          if "X-ZYRA-Actor-Role" in t2:
              print("SKIP n1 (rol ya presente)")
          elif old2 in t2:
              t2 = t2.replace(old2, new2)
              compile(t2, str(p2), "exec")
              p2.write_text(t2, encoding="utf-8")
              print("OK n1 header agricultor")
          else:
              print("MISS n1 (formato no encontrado)")
          PATCHEOF

      - name: "Paso 2 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN B.1: rol agricultor en tests existentes" -m "Los tests superapp y n1 operan como productores legitimos: declaran su rol via X-ZYRA-Actor-Role para pasar la matriz de permisos (GPT-7)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
