name: "AUDITORIA COMPLETA server.py AGRO (2811 lineas completas, parte 1 y 2) — solo lectura"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "[AUDITORIA server.py AGRO] PARTE 1: lineas 1-1500 completas"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# server.py AGRO — PARTE 1 (lineas 1-1500)" >> "$SUM"
          { echo '```python'; sed -n '1,1500p' apps/agro/server.py; echo '```'; } >> "$SUM"
          exit 0

      - name: "[AUDITORIA server.py AGRO] PARTE 2: lineas 1501-2811 completas"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# server.py AGRO — PARTE 2 (lineas 1501-2811)" >> "$SUM"
          { echo '```python'; sed -n '1501,2811p' apps/agro/server.py; echo '```'; } >> "$SUM"
          exit 0

      - name: "[VEREDICTO] sin cambios — auditoria pura"
        if: always()
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA server.py COMPLETA impresa arriba (ambas partes, lineas completas)." >> "$SUM"
          echo "## Con este mapa completo se hace el refactor CORRECTO en un solo intento, o se decide no hacerlo." >> "$SUM"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          exit 0
