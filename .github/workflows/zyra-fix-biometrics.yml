          echo "=== REGLA 6: VERIFICACION POR TIPO + E2E COMPLETA ==="
          python3 - << 'ZYRA_CHECK'
          import importlib
          import json
          import os
          import pathlib
          import sys
          import types

          pkg_apps = types.ModuleType("apps")
          pkg_apps.__path__ = ["apps"]
          sys.modules["apps"] = pkg_apps
          pkg_lab = types.ModuleType("apps.laboratorio")
          pkg_lab.__path__ = ["apps/laboratorio"]
          sys.modules["apps.laboratorio"] = pkg_lab

          from apps.laboratorio.application.services.template_check import verificar_plantillas
          from apps.laboratorio.application.workflows.photoreal_ladder import EscaleraFotoreal
          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.infrastructure.database.migrations import aplicar_migraciones, version_actual
          from apps.laboratorio.infrastructure.database.connection import ConexionBD
          from apps.laboratorio.infrastructure.database.tables import TABLAS_ESPERADAS, tablas_existentes
          from apps.laboratorio.infrastructure.providers.png_encoder import encode_png_gray, encode_png_rgb
          from apps.laboratorio.shared.utilities.image_utils import (
              detectar_formato,
              dimensiones_png,
          )

          MANIFEST = "/tmp/lab_lote_6a.manifest"
          RESUMEN = os.environ.get("GITHUB_STEP_SUMMARY", "")

          def sum_write(texto=""):
              if RESUMEN:
                  with open(RESUMEN, "a", encoding="utf-8") as f:
                      f.write(texto + "\n")

          errores = 0
          objetivos = []
          with open(MANIFEST, encoding="utf-8") as f:
              for linea in f:
                  linea = linea.strip()
                  if linea:
                      ruta, estado = linea.split("|", 1)
                      objetivos.append((ruta, estado))

          sum_write("## ZYRA LABORATORIO - Lote 6A (Fase 6: escalera fotoreal + profundidad)")
          sum_write("")
          sum_write("### Escritura y verificacion por tipo (Reglas 1-3 y 6)")
          sum_write("")
          sum_write("| Archivo | Escritura | Verificacion |")
          sum_write("|---|---|---|")
          for ruta, estado in objetivos:
              marca = "OK"
              try:
                  p = pathlib.Path(ruta)
                  datos = p.read_bytes()
                  assert datos.strip(), "archivo vacio"
                  if ruta.endswith(".py"):
                      texto = datos.decode("utf-8")
                      compile(texto, ruta, "exec")
                      nombre = "apps.laboratorio." + ruta[len("apps/laboratorio/"):-3].replace("/", ".")
                      importlib.import_module(nombre)
                  elif ruta.endswith(".json"):
                      obj = json.loads(datos.decode("utf-8"))
                      assert isinstance(obj, dict), "json debe ser objeto"
                  elif ruta.endswith(".html"):
                      texto = datos.decode("utf-8")
                      assert "{{" in texto and "}}" in texto, "plantilla sin marcadores"
                  else:
                      raise ValueError("Tipo desconocido: " + ruta)
              except Exception as exc:
                  errores += 1
                  marca = "FALLO: " + type(exc).__name__ + ": " + str(exc)
              sum_write("| `" + ruta + "` | " + estado + " | " + marca + " |")

          app = montar_aplicacion(":memory:")
          H_DUENO = {"X-ZYRA-ZID": "ZID-DUENO-1", "X-ZYRA-ROLES": "LAB_CREADOR,LAB_ANALISTA"}
          H_OTRO = {"X-ZYRA-ZID": "ZID-OTRO-2"}

          def llamada(metodo, ruta, cuerpo=None, headers=None):
              h = dict(headers or {})
              datos = b"" if cuerpo is None else json.dumps(cuerpo).encode("utf-8")
              status, headers_out, salida = app.despachar(metodo, ruta, h, datos)
              ctype = headers_out.get("Content-Type", "")
              if "json" in ctype:
                  try:
                      parsed = json.loads(salida.decode("utf-8"))
                  except Exception:
                      parsed = None
              else:
                  parsed = None
              return status, parsed, salida, headers_out

          resultados = []

          def check(nombre, funcion):
              global errores
              try:
                  funcion()
                  resultados.append(("OK", nombre))
              except Exception as exc:
                  errores += 1
                  resultados.append(("FALLO", nombre + " -> " + type(exc).__name__ + ": " + str(exc)))

          ref = {}

          def preparar():
              tmp = ConexionBD(":memory:")
              assert aplicar_migraciones(tmp) == 6
              assert version_actual(tmp) == 6
              for t in TABLAS_ESPERADAS:
                  assert t in tablas_existentes(tmp), "falta tabla " + t
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects", {
                  "titulo": "Torre ZYRA", "tipo": "arquitectura",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              ref["proyecto"] = cuerpo["datos"]["proyecto"]
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/scenes", {
                  "nombre": "Volumen real", "ancho": 800, "alto": 600,
                  "objetos": [
                      {"forma": "rect", "color": "#1E3A8A", "x": 0, "y": 300, "w": 800, "h": 300, "capa": "fondo"},
                      {"forma": "rect", "color": "#2563EB", "x": 350, "y": 150, "w": 100, "h": 250, "capa": "medio"},
                      {"forma": "circle", "color": "#38BDF8", "cx": 400, "cy": 130, "r": 40, "capa": "frente"},
                      {"forma": "texto", "color": "#E2E8F0", "x": 40, "y": 560, "contenido": "ZYRA 2026", "capa": "frente"},
                  ],
              }, headers=H_DUENO)
              assert status == 201, "escena: " + str(status)
              ref["escena"] = cuerpo["datos"]["escena"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + ref["escena"]["id"] + "/lighting", {
                  "pasos": [{"t": 0, "color": "#F8FAFC", "intensidad": 0.7}],
                  "ambientar_fondo": True,
              }, headers=H_DUENO)
              assert status == 201, "luz: " + str(status)

          def t_render_borrador():
              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/render", {"quality": "borrador"}, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              r = cuerpo["datos"]["render"]
              assert r["calidad"] == "borrador" and r["formato"] == "svg"
              assert r["tiene_profundidad"] is False, "borrador no produce profundidad"
              assert r["duracion_ms"] >= 0
              ref["r_borrador"] = r

          def t_render_alta_png_real():
              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/render", {"quality": "alta"}, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              r = cuerpo["datos"]["render"]
              assert r["calidad"] == "alta" and r["formato"] == "png"
              assert r["ancho"] == 1920 and r["alto"] == 1080
              assert r["tiene_profundidad"] is True
              assert len(r["hash_sha256"]) == 64
              ref["r_alta"] = r

          def t_render_3d():
              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/render", {"quality": "3d"}, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              ref["r_3d"] = cuerpo["datos"]["render"]

          def t_render_fotoreal_4k():
              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/render", {"quality": "fotorreal"}, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              r = cuerpo["datos"]["render"]
              assert r["ancho"] == 3840 and r["alto"] == 2160
              assert r["tiene_profundidad"] is True
              ref["r_foto"] = r

          def t_descargar_png_valido():
              rid = ref["r_alta"]["id"]
              status, _, datos, headers_out = llamada("GET", "/laboratorio/api/v1/renders/" + rid, headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              assert headers_out["Content-Type"] == "image/png"
              assert detectar_formato(datos) == "png", "PNG real requerido"
              assert dimensiones_png(datos) == (1920, 1080), "dimensiones=" + str(dimensiones_png(datos))
              rid = ref["r_foto"]["id"]
              status, _, datos, _ = llamada("GET", "/laboratorio/api/v1/renders/" + rid, headers=H_DUENO)
              assert status == 200 and dimensiones_png(datos) == (3840, 2160)
              rid = ref["r_3d"]["id"]
              status, _, datos, _ = llamada("GET", "/laboratorio/api/v1/renders/" + rid + "/depth.png", headers=H_DUENO)
              assert status == 200, "depth status=" + str(status)
              assert detectar_formato(datos) == "png"
              ancho, alto = dimensiones_png(datos)
              assert (ancho, alto) == (1920, 1080), "depth dimensiones=" + str((ancho, alto))
              status, _, datos, headers_out = llamada("GET", "/laboratorio/api/v1/renders/" + ref["r_borrador"]["id"], headers=H_DUENO)
              assert status == 200 and headers_out["Content-Type"] == "image/svg+xml"
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/renders/" + ref["r_borrador"]["id"] + "/depth.png", headers=H_DUENO)
              assert status == 400, "borrador sin profundidad debe 400: " + str(status)

          def t_render_calidad_invalida():
              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/render", {"quality": "ultra"}, headers=H_DUENO)
              assert status == 400, "calidad invalida: " + str(status)

          def t_listar_y_403():
              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/scenes/" + sid + "/renders", headers=H_DUENO)
              assert status == 200 and cuerpo["datos"]["total"] == 4, "total=" + str(cuerpo["datos"]["total"])
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/render", {"quality": "alta"}, headers=H_OTRO)
              assert status == 403, "espectador no renderiza: " + str(status)
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/renders/" + ref["r_alta"]["id"], headers=H_OTRO)
              assert status == 403, "espectador no descarga render ajeno: " + str(status)

          def t_ui_renderizar():
              status, _, html, _ = llamada("GET", "/laboratorio/ui/renderizar", headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              texto = html.decode("utf-8")
              assert "EN VIVO" in texto
              assert texto.count('data-accion=') == 3, "Ley 3, hay " + str(texto.count('data-accion='))
              assert 'id="form-render"' in texto
              assert 'value="fotorreal"' in texto
              assert "1920x1080" in texto, "render real listado con resolucion"
              assert "prof: si" in texto, "profundidad listada"
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/ui/renderizar", headers=H_OTRO)
              assert status == 403, "espectador sin panel render: " + str(status)

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              total = len(cuerpo["datos"]["rutas"])
              assert total == 49, "se esperaban 49 rutas (45 + 4 de render), hay " + str(total)
              ids_modulos = {m["id"] for m in cuerpo["datos"]["modulos"]}
              assert ids_modulos == {"capture", "simulation", "understanding", "design", "creation", "library", "world4d", "render"}, str(ids_modulos)

          def t_escalerayencoder_unitarios():
              enc = encode_png_rgb(4, 2, bytes(24))
              assert detectar_formato(enc) == "png" and dimensiones_png(enc) == (4, 2)
              gris = encode_png_gray(4, 2, bytes(8))
              assert detectar_formato(gris) == "png"
              escalera = EscaleraFotoreal()
              caps = escalera.capacidades()
              assert caps["profundidad"]["borrador"] is False
              assert caps["profundidad"]["fotorreal"] is True
              assert caps["resoluciones"]["fotorreal"] == [3840, 2160]

          def t_plantillas_completas():
              assert verificar_plantillas() == 14

          sum_write("")
          sum_write("### Pruebas end-to-end Fase 6 (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Migracion v6 + escena con luz", preparar)
          check("Render borrador: SVG sin profundidad", t_render_borrador)
          check("Render alta: PNG 1920x1080 real + profundidad", t_render_alta_png_real)
          check("Render 3D: perspectiva + profundidad", t_render_3d)
          check("Render fotorreal: 4K iluminado + profundidad", t_render_fotoreal_4k)
          check("Descargar PNGs validos + depth.png + SVG", t_descargar_png_valido)
          check("Calidad invalida rechazada (400)", t_render_calidad_invalida)
          check("Listar renders + 403 espectador", t_listar_y_403)
          check("UI renderizar EN VIVO con Ley 3", t_ui_renderizar)
          check("Indice publico: 49 rutas, 8 modulos", t_indice_publico)
          check("Encoder PNG + escalera unitarios", t_escalerayencoder_unitarios)
          check("14 plantillas verificadas", t_plantillas_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 6 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 6A aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 6A - Fase 6 escalera fotoreal con PNG real y profundidad"
            git push
          fi
