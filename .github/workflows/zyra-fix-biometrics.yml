name: "ZYRA FASE1-c fix: matricula desde casa con formulario COMPLETO (2 encargados SE-3)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] home_registration_engine con formulario completo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/domain/student/home_registration_engine.py",
                     D(r'''
                  """Home Registration Engine - matricula desde casa
                  (S-4, flujo del dueno + regla 78 + SE-3 COMPLETO).

                  FORMULARIO COMPLETO desde el celular (requisito del
                  dueno: la familia llena TODO, no un formulario
                  parcial):
                  - responsable (padre/madre/tutor) con ZID verificado
                    por la Red
                  - 2 encargados de retiro autorizados (SIEMPRE, SE-3)
                  - contacto de emergencia
                  - menor con su ZID de NACIMIENTO si ya existe
                    (regla 78: SEMILLA lo CONSUME — jamas crea otro)
                  - sin documentos NO impide iniciar (MINED lo
                    permite) -> zid_status=NONE
                  - seleccion escuela/grado/turno -> el sistema busca
                    seccion con CUPO (SIN_CUPOS si no hay)
                  - la escuela confirma -> expediente canonico en
                    StudentRegistryEngine (S-1: unica fuente) + cupo
                    reclamado + matricula ACTIVA."""
                  from __future__ import annotations
                  from typing import Dict, List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import Database
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_home_registrations", (
                          "CREATE TABLE IF NOT EXISTS sm_home_registrations (request_id TEXT PRIMARY KEY, responsable_zid TEXT NOT NULL, responsable_name TEXT NOT NULL, relation TEXT NOT NULL, student_id TEXT, child_name TEXT NOT NULL, birth_date TEXT NOT NULL DEFAULT '', child_zid TEXT NOT NULL DEFAULT '', child_zid_status TEXT NOT NULL DEFAULT 'NONE', institution_id TEXT NOT NULL, level TEXT NOT NULL, grade TEXT NOT NULL, turn TEXT NOT NULL DEFAULT 'MATUTINA', classroom_id TEXT NOT NULL DEFAULT '', pickup_json TEXT NOT NULL DEFAULT '[]', emergency_json TEXT NOT NULL DEFAULT '[]', status TEXT NOT NULL DEFAULT 'PENDING_DOCS', note TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                      )),
                  )

                  class HomeRegistrationEngine:
                      """Matricula desde casa (formulario completo)."""

                      def __init__(self, db, clock,
                                   student_registry,
                                   classroom_engine,
                                   enrollment_engine):
                          self._db = db
                          self._clock = clock
                          self._students = student_registry
                          self._cls = classroom_engine
                          self._enr = enrollment_engine
                          MigrationRunner(db, "sm.homereg",
                                          _MIGRATIONS).run(clock)

                      def start_request(self, *, responsable_zid,
                                        responsable_name, relation,
                                        child_name,
                                        authorized_pickup,
                                        emergency_contacts,
                                        birth_date="",
                                        child_zid="",
                                        child_zid_status="NONE",
                                        institution_id, level,
                                        grade, turn="MATUTINA") -> dict:
                          """Pasos 1-3 del flujo: responsable + menor +
                          formulario completo + seleccion de escuela.
                          Valida SE-3 desde la solicitud."""
                          if not str(responsable_zid).strip():
                              raise ValueError("responsable_zid"
                                               " requerido (la Red"
                                               " verifica al"
                                               " responsable)")
                          if relation not in ("PADRE", "MADRE",
                                              "TUTOR"):
                              raise ValueError("relation invalida")
                          if not str(child_name).strip():
                              raise ValueError(
                                  "child_name requerido")
                          pick = list(authorized_pickup or [])
                          emg = list(emergency_contacts or [])
                          if len(pick) < 2:
                              raise ValueError(
                                  "minimo 2 encargados de retiro"
                                  " autorizados (SE-3)")
                          if len(emg) < 1:
                              raise ValueError(
                                  "minimo 1 contacto de emergencia"
                                  " (SE-3)")
                          if not str(institution_id).strip():
                              raise ValueError(
                                  "institution_id requerido")
                          if str(child_zid_status) not in ("NONE",
                                                           "PROVISIONAL",
                                                           "VERIFIED"):
                              raise ValueError(
                                  "child_zid_status invalido")
                          rid = "SMHOM-" + str(uuid.uuid4())
                          now = self._clock.now()
                          options = self._cls.available_sections(
                              institution_id=institution_id,
                              school_year="2026", level=level,
                              grade=grade)
                          elegida = None
                          for op in options:
                              if op["turn"] == turn:
                                  elegida = op
                                  break
                          if elegida is None and options:
                              elegida = options[0]
                          if elegida is None:
                              estado = "SIN_CUPOS"
                              cid = ""
                          else:
                              estado = "PENDING_ESCUELA"
                              cid = elegida["classroom_id"]
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_home_registrations"
                                  " (request_id, responsable_zid,"
                                  " responsable_name, relation,"
                                  " student_id, child_name,"
                                  " birth_date, child_zid,"
                                  " child_zid_status, institution_id,"
                                  " level, grade, turn, classroom_id,"
                                  " pickup_json, emergency_json,"
                                  " status, note, created_at,"
                                  " updated_at)"
                                  " VALUES (?, ?, ?, ?, '', ?, ?, ?,"
                                  " ?, ?, ?, ?, ?, ?, ?, ?, ?, '',"
                                  " ?, ?)",
                                  (rid, str(responsable_zid),
                                   str(responsable_name).strip(),
                                   relation, str(child_name).strip(),
                                   str(birth_date), str(child_zid),
                                   str(child_zid_status),
                                   str(institution_id), level,
                                   str(grade), str(turn), cid,
                                   _j.dumps(pick, default=str),
                                   _j.dumps(emg, default=str),
                                   estado, now, now))
                          return self.get_request(rid)

                      def get_request(self, request_id
                                      ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_home_registrations"
                              " WHERE request_id = ?",
                              (request_id,))
                          if not row:
                              return None
                          return {"request_id":
                                      str(row["request_id"]),
                                  "responsable_zid":
                                      str(row["responsable_zid"]),
                                  "relation": str(row["relation"]),
                                  "student_id":
                                      str(row["student_id"]),
                                  "child_name":
                                      str(row["child_name"]),
                                  "child_zid":
                                      str(row["child_zid"]),
                                  "child_zid_status":
                                      str(row["child_zid_status"]),
                                  "institution_id":
                                      str(row["institution_id"]),
                                  "level": str(row["level"]),
                                  "grade": str(row["grade"]),
                                  "turn": str(row["turn"]),
                                  "classroom_id":
                                      str(row["classroom_id"]),
                                  "authorized_pickup": _j.loads(
                                      str(row["pickup_json"])),
                                  "emergency_contacts": _j.loads(
                                      str(row["emergency_json"])),
                                  "status": str(row["status"]),
                                  "note": str(row["note"])}

                      def confirm_by_school(self, request_id,
                                            director_actor) -> dict:
                          """La escuela valida -> expediente canonico
                          (StudentRegistryEngine) con el formulario
                          COMPLETO -> cupo reclamado -> ACTIVA."""
                          row = self._db.query_one(
                              "SELECT * FROM sm_home_registrations"
                              " WHERE request_id = ?",
                              (request_id,))
                          if not row:
                              raise KeyError(request_id)
                          estado = str(row["status"])
                          if estado == "SIN_CUPOS":
                              raise ValueError(
                                  "no se puede confirmar:"
                                  " SIN_CUPOS")
                          if estado != "PENDING_ESCUELA":
                              raise ValueError("estado: " + estado)
                          est = self._students.register(
                              full_name=str(row["child_name"]),
                              level=str(row["level"]),
                              grade=str(row["grade"]),
                              institution_id=str(
                                  row["institution_id"]),
                              tutores=[{"name": str(
                                  row["responsable_name"]),
                                  "relation": str(row["relation"]),
                                  "zid": str(row["responsable_zid"])}],
                              authorized_pickup=_j.loads(
                                  str(row["pickup_json"])),
                              emergency_contacts=_j.loads(
                                  str(row["emergency_json"])),
                              zid=str(row["child_zid"]),
                              zid_status=str(row["child_zid_status"]))
                          self._cls.claim_seat(
                              str(row["classroom_id"]),
                              est["student_id"])
                          enr = self._enr.enroll(
                              student_id=est["student_id"],
                              classroom_id=str(row["classroom_id"]),
                              school_year="2026")
                          self._db.execute(
                              "UPDATE sm_home_registrations SET"
                              " student_id = ?, status = 'ACTIVA',"
                              " note = ?, updated_at = ? WHERE"
                              " request_id = ?",
                              (est["student_id"],
                               "matriculado por "
                               + str(director_actor),
                               self._clock.now(), request_id))
                          return {"request_id": request_id,
                                  "student": est,
                                  "enrollment": enr,
                                  "status": "ACTIVA"}

                      def pending_requests(self,
                                           institution_id
                                           ) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT request_id FROM"
                              " sm_home_registrations WHERE"
                              " institution_id = ? AND status ="
                              " 'PENDING_ESCUELA' ORDER BY rowid",
                              (institution_id,))
                          return [self.get_request(
                              str(r["request_id"]))
                              for r in rows]
              '''))
              out("## FIN builder")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests con formulario completo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_s1s4_home.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.student.student_registry_engine import StudentRegistryEngine
          from apps.semilla.domain.classroom.classroom_engine import ClassroomEngine
          from apps.semilla.domain.academic.enrollment_engine import EnrollmentEngine
          from apps.semilla.domain.student.home_registration_engine import HomeRegistrationEngine

          PICK = [{"name": "Tia Maria", "relation": "TIA", "phone": "7777-1111"},
                  {"name": "Abuelo Jose", "relation": "ABUELO", "phone": "7777-2222"}]
          EMG = [{"name": "Mama Lopez", "relation": "MADRE", "phone": "911"}]

          def _setup(tmp_path):
              db = SQLiteAdapter(tmp_path / "s.db")
              clock = FrozenClock()
              students = StudentRegistryEngine(db, clock)
              cls = ClassroomEngine(db, clock)
              man = cls.create(name="1A-M", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=30)
              tar = cls.create(name="1A-T", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="VESPERTINA", capacity=30)
              en = EnrollmentEngine(db, clock, classroom_engine=cls)
              home = HomeRegistrationEngine(db, clock,
                  student_registry=students, classroom_engine=cls,
                  enrollment_engine=en)
              return home, cls, en

          def test_flujo_completo_con_zid_nacimiento(tmp_path) -> None:
              home, cls, en = _setup(tmp_path)
              r = home.start_request(
                  responsable_zid="ZID-PADRE-1",
                  responsable_name="Padre Perez",
                  relation="PADRE", child_name="Nino Nuevo",
                  birth_date="2019-05-10",
                  child_zid="ZID-BABY-1",
                  child_zid_status="VERIFIED",
                  institution_id="INST-1", level="BASICA",
                  grade="1", turn="MATUTINA",
                  authorized_pickup=PICK, emergency_contacts=EMG)
              assert r["status"] == "PENDING_ESCUELA"
              assert r["child_zid"] == "ZID-BABY-1"
              conf = home.confirm_by_school(
                  r["request_id"], director_actor="DIR-1")
              assert conf["status"] == "ACTIVA"
              est = conf["student"]
              assert est["zid"] == "ZID-BABY-1"
              assert est["zid_status"] == "VERIFIED"
              assert est["tutores"][0]["zid"] == "ZID-PADRE-1"
              assert len(est["authorized_pickup"]) == 2
              assert (cls.get(r["classroom_id"])["enrolled"]) == 1
              print("OK flujo: responsable ZID + menor con ZID de nacimiento (regla 78) + formulario completo -> expediente canonico + cupo")

          def test_sin_documentos_no_impide(tmp_path) -> None:
              home, cls, en = _setup(tmp_path)
              r = home.start_request(
                  responsable_zid="ZID-PADRE-2",
                  responsable_name="Madre Gomez",
                  relation="MADRE", child_name="Menor Sin Docs",
                  institution_id="INST-1", level="BASICA",
                  grade="1", turn="MATUTINA",
                  authorized_pickup=PICK, emergency_contacts=EMG)
              assert r["status"] == "PENDING_ESCUELA"
              assert r["child_zid"] == ""
              assert r["child_zid_status"] == "NONE"
              conf = home.confirm_by_school(
                  r["request_id"], director_actor="DIR-1")
              est = conf["student"]
              assert est["zid"] == ""
              assert est["zid_status"] == "NONE"
              print("OK sin documentos: NO impide matricula (MINED) — zid pendiente")

          def test_validaciones_formulario(tmp_path) -> None:
              home, cls, en = _setup(tmp_path)
              with pytest.raises(ValueError):
                  home.start_request(responsable_zid="",
                      responsable_name="X", relation="PADRE",
                      child_name="Y", institution_id="INST-1",
                      level="BASICA", grade="1",
                      authorized_pickup=PICK, emergency_contacts=EMG)
              with pytest.raises(ValueError):
                  home.start_request(responsable_zid="ZID-R",
                      responsable_name="X", relation="PRIMO",
                      child_name="Y", institution_id="INST-1",
                      level="BASICA", grade="1",
                      authorized_pickup=PICK, emergency_contacts=EMG)
              with pytest.raises(ValueError):
                  home.start_request(responsable_zid="ZID-R",
                      responsable_name="X", relation="PADRE",
                      child_name="Y", institution_id="INST-1",
                      level="BASICA", grade="1",
                      authorized_pickup=PICK[:1],
                      emergency_contacts=EMG)
              with pytest.raises(ValueError):
                  home.start_request(responsable_zid="ZID-R",
                      responsable_name="X", relation="PADRE",
                      child_name="Y", institution_id="INST-1",
                      level="BASICA", grade="1",
                      authorized_pickup=PICK, emergency_contacts=[])
              print("OK validaciones: responsable+relation+2 encargados+emergencia obligatorios (SE-3 en la solicitud)")

          def test_sin_cupos_no_confirma_y_escuela_ve_pendientes(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "s2.db")
              clock = FrozenClock()
              students = StudentRegistryEngine(db, clock)
              cls = ClassroomEngine(db, clock)
              lleno = cls.create(name="LLENA", institution_id="INST-8",
                  school_year="2026", level="BASICA", grade="2",
                  section="A", turn="MATUTINA", capacity=1)
              tar = cls.create(name="LIBRE", institution_id="INST-8",
                  school_year="2026", level="BASICA", grade="2",
                  section="A", turn="VESPERTINA", capacity=5)
              en = EnrollmentEngine(db, clock, classroom_engine=cls)
              en.enroll(student_id="OTRO-1",
                  classroom_id=lleno["classroom_id"],
                  school_year="2026")
              home = HomeRegistrationEngine(db, clock,
                  student_registry=students, classroom_engine=cls,
                  enrollment_engine=en)
              r = home.start_request(responsable_zid="ZID-R2",
                  responsable_name="Alguien", relation="PADRE",
                  child_name="Z", institution_id="INST-8",
                  level="BASICA", grade="2", turn="MATUTINA",
                  authorized_pickup=PICK, emergency_contacts=EMG)
              assert r["status"] == "SIN_CUPOS"
              with pytest.raises(ValueError):
                  home.confirm_by_school(r["request_id"],
                      director_actor="DIR-8")
              pend = home.pending_requests("INST-8")
              assert len(pend) == 0
              print("OK SIN_CUPOS: no se confirma (matricula completa es completa)")
          TSEOF
          timeout 180 python3 -m pytest apps/semilla/tests/test_s1s4_home.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/s14.out 2>&1
          echo $? > /tmp/s14
          if [ "$(cat /tmp/s14)" = "0" ]; then echo "- S-1/S-4: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- S-1/S-4: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### S-1/S-4 detalle"; echo '```'; tail -80 /tmp/s14.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si SEMILLA verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/s14 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: SEMILLA roja — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/semilla
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(SEMILLA S-1/S-4): HomeRegistrationEngine con FORMULARIO COMPLETO desde casa (requisito del dueno): responsable con ZID verificado + 2 encargados de retiro + emergencia (SE-3 desde la solicitud) + menor con ZID de NACIMIENTO (regla 78: SEMILLA lo consume) o sin documentos (NO impide, MINED) + busqueda de seccion con cupo (SIN_CUPOS) + escuela confirma -> expediente canonico StudentRegistryEngine + cupo reclamado + matricula ACTIVA + cola de pendientes (S-1: sm_students fuente unica)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — S-1/S-4 CERRADOS. Run siguiente: S-2/S-3 cuadros por rol (alumnos/profesores/directores/MINISTERIO).**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
