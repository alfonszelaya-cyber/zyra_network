                  period="P1", score="9.567", teacher_id="TEA-1")
              assert (ev.average_of("STU-E",
                  subject="Matematica")["average"] == "9.57")
              with pytest.raises(ValueError):
                  ev.register(student_id="STU-E", subject="X",
                      period="P1", score="11")
              with pytest.raises(ValueError):
                  ev.register(student_id="STU-E", subject="X",
                      period="P1", score="-1")
              print("OK evaluaciones: Decimal 2d HALF_UP + escala 0-10")

          def test_curriculo_mined_plantilla(tmp_path) -> None:
              cur = CurriculumEngine(
                  SQLiteAdapter(tmp_path / "cu.db"), FrozenClock())
              r = cur.install_template()
              assert r["subjects_created"] == 91
              bas = cur.subjects_of("BASICA", "3")
              names = [x["subject"] for x in bas]
              assert "Matematica" in names and "Lenguaje" in names
              par = cur.subjects_of("PARVULARIA", "Kinder")
              assert len(par) == 4
              med = cur.subjects_of("MEDIA", "1 Bachillerato")
              assert len(med) == 8
              print("OK curriculo: 91 materias exactas en 3 niveles")
          TSEOF
          timeout 180 python3 -m pytest apps/semilla/tests/test_sm1_registro.py apps/semilla/tests/test_sm2_tutor.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/sm.out 2>&1
          echo $? > /tmp/sm12
          if [ "$(cat /tmp/sm12)" = "0" ]; then echo "- SM1+SM2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- SM1+SM2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### SM1+SM2 detalle"; echo '```'; tail -100 /tmp/sm.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps (intocables)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 shared_engines" "x3 subastas" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -100 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          if [ "$(cat /tmp/x1)" = "0" ] && [ "$(cat /tmp/x2)" = "0" ] && [ "$(cat /tmp/x3)" = "0" ] && [ "$(cat /tmp/x4)" = "0" ]; then echo 0 > /tmp/xall; else echo 1 > /tmp/xall; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si TODO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in sm12 xall; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: SM1+SM2 VERDES — REGISTRO EDUCATIVO + TUTOR IA CORAZON**"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/semilla
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(SEMILLA-SM1+SM2): Registro educativo (instituciones, estudiantes con tutores+2 encargados+emergencias obligatorios, referencia ZID SE-2, official_refs source/verification elevable SE-5, aulas con cupos transaccionales llena=COMPLETADA, matricula valida cupo con alternativas por turno, asistencia con alerta AUSENTE, evaluaciones Decimal 2d con alerta, historial hash-chain, alert engine, incident engine) + Tutor IA corazon (pistas graduales que explican sin resolver, modo examen bloqueado, dificultad dinamica, insights al maestro con deteccion correcta de riesgo real vs sin datos, curriculo 91 materias 3 niveles) (SM1+SM2 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — SM1+SM2 CERRADOS. Sigue SM3 talento+economia y SM4 emocional+familia.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
