                      base + "/agro/equipment/" + pid
                  )
                  assert len(body["data"]["equipment"]) == 1

                  st, body = _pj(
                      base + "/agro/infrastructure",
                      {
                          "producer_id": pid,
                          "kind": "bodega",
                          "location": "Norte",
                      },
