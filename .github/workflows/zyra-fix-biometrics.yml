name: "AUDIT: tracebacks completos de los 2 fallos restantes (SOLO LECTURA)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Traceback 1: verification_verdict (el 500 - donde falla internamente)"
        run: |
          python3 -m pytest "shared_engines/runtime/tests/test_capabilities_api.py::test_verification_verdict_signed" -vv --tb=long 2>&1 | tail -80 || true

      - name: "Traceback 2: expediente (el assert 4==2 - contexto completo)"
        run: |
          python3 -m pytest "shared_engines/network/tests/test_portable_identity.py::test_expediente_legal_pedro" -vv --tb=long 2>&1 | tail -60 || true

      - name: "Dump: VerifyReport (atributos reales) + una prueba manual de verify_face"
        run: |
          python3 - <<'DEOF'
          import inspect
          from shared_engines.security.biometrics import VerifyReport
          print("=== VerifyReport campos ===")
          print(inspect.signature(VerifyReport.__init__) if hasattr(VerifyReport, "__init__") else "dataclass")
          try:
              print(inspect.getsource(VerifyReport))
          except Exception:
              pass
          print()
          print("=== prueba manual verify_face con DeterministicTestProvider ===")
          import base64, threading, time
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.security.biometrics import (
              BiometricsEngine, BiometricsPolicy,
              DeterministicTestProvider, TemplateCipher)
          from shared_engines.audit.chain import AuditTrail
          from shared_engines.events.outbox import Outbox
          from shared_engines.events.contracts import EventCatalog
          db = SQLiteAdapter(":memory:")
          clock = FrozenClock()
          audit = AuditTrail(db, clock)
          outbox = Outbox(db, clock)
          outbox.ensure_schema()
          cat = EventCatalog()
          for et in ("identity.registered", "identity.status_changed",
                     "network.document.sealed",
                     "network.signature.requested",
                     "network.document.signed",
                     "network.document.rejected"):
              cat.register(et)
          bio = BiometricsEngine(
              db=db, clock=clock, audit=audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(master_key_hex="ab" * 32),
              policy=BiometricsPolicy(require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          seed = base64.b64encode(b"pedro-verif").decode("ascii")
          case = bio.submit_case(
              display_name="Pedro", actor="t",
              doc_image=base64.b64decode(seed),
              selfie_image=base64.b64decode(seed))
          print("case:", case.status, case.case_id)
          bound = bio.bind_identity(case.case_id, zid="ZID-manual-1", actor="t")
          print("bound:", bound.status)
          report = bio.verify_face(
              "ZID-manual-1",
              selfie_image=base64.b64decode(seed),
              actor="t")
          print("VERIFY REPORT COMPLETO:")
          print(repr(report))
          print("atributos:", [a for a in dir(report) if not a.startswith("_")])
          DEOF

      - name: "Contexto"
        run: |
          git log --oneline -3
