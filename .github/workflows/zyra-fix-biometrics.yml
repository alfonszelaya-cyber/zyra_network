name: "ZYRA NEXO NG9 family office extras (solo NG9)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] NG9 engines + use cases"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          FO = "apps/nexo/domain/family_office"
          UF = "apps/nexo/application/family_office_use_cases"

          try:
              forzar(FO + "/real_estate_engine.py", D(r'''
                  """Real Estate Engine - bienes raices (NG9).
                  Decimal 2d, persistente, autocontenido."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _Q = "0.01"

                  _MIGRATIONS = (
                      Migration(1, "nexo_fo_real_estate", (
                          "CREATE TABLE IF NOT EXISTS nexo_fo_real_estate (asset_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, name TEXT NOT NULL, value TEXT NOT NULL DEFAULT '0', property_type TEXT NOT NULL DEFAULT '', location TEXT NOT NULL DEFAULT '', area_m2 TEXT NOT NULL DEFAULT '', status TEXT NOT NULL DEFAULT 'ACTIVE', created_at REAL NOT NULL)",
                      )),
                  )

                  class RealEstateEngine:
                      """Bienes raices del family office."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "nexo.fo.re",
                                          _MIGRATIONS).run(clock)

                      def register(self, *, company_id, name,
                                   value, property_type="",
                                   location="",
                                   area_m2="") -> dict:
                          from decimal import Decimal as _D
                          val = _D(str(value)).quantize(_D(_Q))
                          aid = "RE-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO"
                                  " nexo_fo_real_estate"
                                  " (asset_id, company_id, name,"
                                  " value, property_type,"
                                  " location, area_m2, status,"
                                  " created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, ?,"
                                  " 'ACTIVE', ?)",
                                  (aid, company_id, name,
                                   str(val), str(property_type),
                                   str(location), str(area_m2),
                                   now))
                          return self.get(aid)

                      def _row(self, r) -> dict:
                          from decimal import Decimal as _D
                          return {"asset_id":
                                      str(r["asset_id"]),
                                  "company_id":
                                      str(r["company_id"]),
                                  "name": str(r["name"]),
                                  "value": str(_D(
                                      str(r["value"])
                                      ).quantize(_D(_Q))),
                                  "property_type":
                                      str(r["property_type"]),
                                  "location": str(r["location"]),
                                  "area_m2": str(r["area_m2"]),
                                  "status": str(r["status"])}

                      def get(self,
                              asset_id) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM"
                              " nexo_fo_real_estate WHERE"
                              " asset_id = ?", (asset_id,))
                          return self._row(row) if row else None

                      def list_for(self,
                                   company_id) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT asset_id FROM"
                              " nexo_fo_real_estate WHERE"
                              " company_id = ?"
                              " ORDER BY created_at",
                              (company_id,))
                          return [self.get(
                              str(r["asset_id"]))
                              for r in rows]

                      def total_value(self,
                                      company_id) -> str:
                          from decimal import Decimal as _D
                          rows = self._db.query_all(
                              "SELECT value FROM"
                              " nexo_fo_real_estate WHERE"
                              " company_id = ? AND"
                              " status = 'ACTIVE'",
                              (company_id,))
                          total = _D("0")
                          for r in rows:
                              total = (total
                                       + _D(str(r["value"])))
                          return str(total.quantize(_D(_Q)))

                      def update_value(self, asset_id,
                                       new_value) -> dict:
                          from decimal import Decimal as _D
                          val = _D(str(new_value)
                                   ).quantize(_D(_Q))
                          self._db.execute(
                              "UPDATE nexo_fo_real_estate"
                              " SET value = ? WHERE"
                              " asset_id = ?",
                              (str(val), asset_id))
                          return self.get(asset_id)

                      def deactivate(self, asset_id) -> dict:
                          self._db.execute(
                              "UPDATE nexo_fo_real_estate"
                              " SET status = 'INACTIVE' WHERE"
                              " asset_id = ?", (asset_id,))
                          return self.get(asset_id)
              '''))

