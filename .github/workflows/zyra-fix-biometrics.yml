name: "AUDIT: como quedaron las rutas insertadas en api.py + traceback completo de los 2 fallos"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: api.py alrededor de verify-existence y verification/person (como quedaron INSERTADAS)"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          lines = Path("shared_engines/runtime/api.py").read_text(encoding="utf-8").splitlines()
          for objetivo in ("verify-existence", "verification", "person"):
              print()
              print("=== menciones de: " + objetivo + " ===")
              for i, l in enumerate(lines, 1):
                  if objetivo in l:
                      for n in range(max(0, i - 4), min(len(lines), i + 6)):
                          print(str(n + 1).rjust(5) + ": " + lines[n])
                      print("---")
          print()
          print("=== los 2 anchors originales (contexto) ===")
          for i, l in enumerate(lines, 1):
              if ('segments == ["verify"]' in l
                  or 's == ["verification"' in l and "media" in l):
                  for n in range(max(0, i - 3), min(len(lines), i + 3)):
                      print(str(n + 1).rjust(5) + ": " + lines[n])
                  print("---")
          D1EOF

      - name: "Dump 2: los 2 tests fallidos con traceback LONG (la URL exacta que da 404)"
        run: |
          python3 -m pytest shared_engines/runtime/tests/test_runtime_api.py::test_death_lifecycle_deceased shared_engines/runtime/tests/test_runtime_api.py::test_verify_existence_public -vv --tb=long 2>&1 | tail -90 || true
          python3 -m pytest shared_engines/runtime/tests/test_capabilities_api.py::test_verification_verdict_signed -vv --tb=long 2>&1 | tail -50 || true

      - name: "Dump 3: a donde llega realmente cada ruta (prueba de enrutado en vivo)"
        run: |
          python3 - <<'D3EOF'
          import json, threading, time
          import urllib.error, urllib.request
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(db=net_db, clock=FrozenClock(), signer=signer, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          kernel.bootstrap_root()
          caps = ZyraCapabilities(net_db, FrozenClock(), identity=kernel.identity, signer=signer)
          srv = serve_combined(kernel, caps, host="127.0.0.1", port=0)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.3)
          base = "http://127.0.0.1:" + str(srv.server_address[1])
          zid_real = kernel.identity.register_identity(kind=__import__("shared_engines.identity.contracts", fromlist=["IdentityKind"]).IdentityKind.PERSON, display_name="Ruta", actor="t").zid
          for ruta in (
              "/verify-existence/" + zid_real,
              "/verify-existence/ZID-falso-000",
              "/identity/" + zid_real,
          ):
              try:
                  with urllib.request.urlopen(base + ruta, timeout=10) as r:
                      print("GET " + ruta + " -> " + str(r.status) + " " + r.read().decode()[:150])
              except urllib.error.HTTPError as e:
                  print("GET " + ruta + " -> " + str(e.code) + " " + e.read().decode()[:150])
          srv.shutdown()
          srv.server_close()
          D3EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
