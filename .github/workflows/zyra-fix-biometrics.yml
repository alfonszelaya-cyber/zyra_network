name: "ZYRA RUN1d v2: S-4 matricula desde casa por HTTP (rutas reales /semilla/api/*)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] S-4: router HTTP de matricula desde casa (logica pura testeable)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/routers/student/home_registration_router.py",
                     D(r'''
                  """Home Registration Router (S-4) - API de
                  matricula desde casa.

                  Rutas reales (bajo el prefijo del server):
                    POST /semilla/api/home-registration
                         -> start (formulario completo SE-3;
                          SIN_CUPOS del turno pedido -> 409
                          con alternativas)
                    GET  /semilla/api/home-registration/{id}
                    POST /semilla/api/home-registration/{id}/confirm
                    GET  /semilla/api/home-registrations
                         ?institution_id=...

                  Logica PURA (dict in -> (codigo, dict) out):
                  server.py delega aqui; los tests la ejercitan
                  sin red. Regla 78: el menor trae su ZID de
                  NACIMIENTO si existe (SEMILLA lo CONSUME,
                  jamas crea otro); sin documentos NO impide
                  iniciar. SE-3: 2 encargados de retiro + 1 de
                  emergencia. Nada falso (regla 66): errores
                  honestos 400/404/405/409/503."""
                  from __future__ import annotations
                  from typing import Tuple
                  from apps.semilla.domain.student.student_registry_engine import (
                      StudentRegistryEngine)
                  from apps.semilla.domain.student.home_registration_engine import (
                      HomeRegistrationEngine)
                  from apps.semilla.domain.classroom.classroom_engine import (
                      ClassroomEngine)
                  from apps.semilla.domain.academic.enrollment_engine import (
                      EnrollmentEngine)

                  _REQ = ("responsable_zid", "responsable_name",
                          "relation", "child_name",
                          "institution_id", "level", "grade")


                  class HomeRegistrationRouter:
                      """API matricula desde casa (S-4)."""

                      def __init__(self, db, clock):
                          reg = StudentRegistryEngine(db, clock)
                          cls = ClassroomEngine(db, clock)
                          enr = EnrollmentEngine(
                              db, clock, classroom_engine=cls)
                          self._hr = HomeRegistrationEngine(
                              db, clock, student_registry=reg,
                              classroom_engine=cls,
                              enrollment_engine=enr)

                      @staticmethod
                      def _err(code, msg) -> Tuple[int, dict]:
                          return (int(code),
                                  {"ok": False,
                                   "error": str(msg)})

                      # ---------- operaciones ----------

                      def start(self, doc) -> Tuple[int, dict]:
                          if not isinstance(doc, dict):
                              return self._err(
                                  400, "body JSON requerido")
                          missing = [
                              f for f in _REQ
                              if not str(doc.get(f, "")).strip()]
                          if missing:
                              return self._err(
                                  400, "faltan campos: "
                                  + ", ".join(missing))
                          try:
                              r = self._hr.start_request(
                                  responsable_zid=str(
                                      doc.get("responsable_zid",
                                              "")),
                                  responsable_name=str(
                                      doc.get("responsable_name",
                                              "")),
                                  relation=str(
                                      doc.get("relation", "")),
                                  child_name=str(
                                      doc.get("child_name", "")),
                                  birth_date=str(
                                      doc.get("birth_date", "")),
                                  child_zid=str(
                                      doc.get("child_zid", "")),
                                  child_zid_status=str(
                                      doc.get("child_zid_status",
                                              "NONE") or "NONE"),
                                  institution_id=str(
                                      doc.get("institution_id",
                                              "")),
                                  level=str(doc.get("level", "")),
                                  grade=str(doc.get("grade", "")),
                                  turn=str(doc.get("turn",
                                                   "MATUTINA")
                                           or "MATUTINA"),
                                  authorized_pickup=list(
                                      doc.get("authorized_pickup")
                                      or []),
                                  emergency_contacts=list(
                                      doc.get(
                                          "emergency_contacts")
                                      or []))
                          except ValueError as e:
                              return self._err(400, str(e))
                          if r.get("status") == "SIN_CUPOS":
                              return (409, {
                                  "ok": False,
                                  "error": "SIN_CUPOS",
                                  "note": str(r.get("note", "")),
                                  "request": r})
                          return (201, {"ok": True,
                                        "request": r})

                      def get(self, request_id
                              ) -> Tuple[int, dict]:
                          r = self._hr.get_request(
                              str(request_id or ""))
                          if not r:
                              return self._err(
                                  404,
                                  "solicitud no encontrada")
                          return (200, {"ok": True,
                                        "request": r})

                      def confirm(self, request_id, doc
                                  ) -> Tuple[int, dict]:
                          d = doc if isinstance(doc, dict) else {}
                          actor = str(
                              d.get("director_actor", "")
                              or d.get("actor", "")
                              or "escuela")
                          try:
                              res = self._hr.confirm_by_school(
                                  str(request_id or ""),
                                  director_actor=actor)
                          except KeyError:
                              return self._err(
                                  404,
                                  "solicitud no encontrada")
                          except ValueError as e:
                              msg = str(e)
                              code = (409 if "SIN_CUPOS" in msg
                                      else 400)
                              return self._err(code, msg)
                          return (200, dict({"ok": True},
                                            **res))

                      def pending(self, institution_id
                                  ) -> Tuple[int, dict]:
                          rows = self._hr.pending_requests(
                              str(institution_id or ""))
                          return (200, {"ok": True,
                                        "pending": rows,
                                        "count": len(rows)})

                      # ---------- dispatch ----------

                      def dispatch(self, *, method, segs,
                                   query=None,
                                   doc=None) -> Tuple[int, dict]:
                          """segs SIN prefijos semilla/api (ej:
                          ['home-registration', '{id}',
                          'confirm'])."""
                          q = query or {}

                          def q1(k):
                              v = q.get(k)
                              if isinstance(v, list):
                                  return str(v[0]) if v else ""
                              return str(v or "")

                          try:
                              m = str(method or "GET").upper()
                              if segs[:1] == \
                                      ["home-registrations"]:
                                  if m != "GET":
                                      return self._err(
                                          405, "solo GET")
                                  return self.pending(
                                      q1("institution_id"))
                              if segs[:1] == \
                                      ["home-registration"]:
                                  rest = list(segs[1:])
                                  if not rest:
                                      if m == "POST":
                                          return self.start(doc)
                                      return self._err(
                                          405, "solo POST")
                                  rid = str(rest[0])
                                  if (len(rest) >= 2
                                          and rest[1] == "confirm"):
                                      if m != "POST":
                                          return self._err(
                                              405, "solo POST")
                                      return self.confirm(rid,
                                                          doc)
                                  if m == "GET":
                                      return self.get(rid)
                                  return self._err(405,
                                                   "solo GET")
                              return self._err(
                                  404, "ruta desconocida")
                          except Exception as e:
                              return self._err(
                                  500, "error interno: " + str(e))
              '''))
              out("## FIN router S-4")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] wiring v2 en server.py (prefijo real /semilla/api + repair v1 + revert total si falla)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, re, subprocess, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          P = pathlib.Path("apps/semilla/server.py")
          try:
              src = P.read_text(encoding="utf-8")
              orig = src
              if "_HR_V2" in src:
                  out("- wiring: YA V2 (idempotente)")
                  open("/tmp/hr_wired", "w").write("yes")
                  raise SystemExit(0)
              lines = src.splitlines(keepends=True)
              if "_hr_wants" in src:
                  out("- wiring v1 detectado (prefijo"
                      " equivocado) — REPARANDO a v2")
                  lines = [
                      ln for ln in lines
                      if not re.match(
                          r"^\s*if self\._hr_wants\(\):\s*$",
                          ln)
                      and not re.match(
                          r"^\s*return self\._hr_handle\("
                          r".*\)\s*$", ln)]
                  start = end = None
                  for i, ln in enumerate(lines):
                      if ln.startswith(
                              "    def _hr_wants(self)"):
                          start = i
                      if (ln.startswith("class SemillaServer")
                              and start is not None):
                          end = i
                          break
                  if start is not None and end is not None:
                      del lines[start:end]
                  text = "".join(lines)
                  ast.parse(text)
                  lines = text.splitlines(keepends=True)
              text = "".join(lines)
              tree = ast.parse(text)
              handler = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and \
                          node.name == "SemillaApiHandler":
                      handler = node
                      break
              if handler is None:
                  raise RuntimeError("no SemillaApiHandler")
              has_api_get = has_api_post = False
              docname = None
              for n in handler.body:
                  if isinstance(n, ast.FunctionDef):
                      if n.name == "_api_get":
                          has_api_get = True
                      if n.name == "_api_post":
                          has_api_post = True
                          for sub in ast.walk(n):
                              if (isinstance(sub, ast.Call)
                                      and isinstance(sub.func,
                                                     ast.Attribute)
                                      and sub.func.attr ==
                                      "_advance_route"
                                      and sub.args
                                      and isinstance(
                                          sub.args[0], ast.Name)):
                                  docname = sub.args[0].id
              if not has_api_get or not has_api_post:
                  raise RuntimeError("no _api_get/_api_post")
              if docname is None:
                  raise RuntimeError("nombre de doc no hallado")
              if text.count('"unknown api route"') < 2:
                  raise RuntimeError(
                      "fallbacks no encontrados (2)")
              if not any(ln.startswith("class SemillaServer")
                         for ln in lines):
                  raise RuntimeError("no class SemillaServer")

              def span(name):
                  start = None
                  for i, ln in enumerate(lines):
                      if re.match(r"^    def " + name + r"\(",
                                  ln):
                          start = i
                          break
                  if start is None:
                      raise RuntimeError("span " + name)
                  end = len(lines)
                  for j in range(start + 1, len(lines)):
                      if re.match(r"^    (def |async def |@)",
                                  lines[j]):
                          end = j
                          break
                  return (start, end)

              def inject(methodname, call):
                  sp = span(methodname)
                  idx = None
                  for i in range(sp[0], sp[1]):
                      if '"unknown api route"' in lines[i]:
                          idx = i
                  if idx is None:
                      raise RuntimeError(
                          "no fallback en " + methodname)
                  st = idx
                  while st > sp[0] and not re.match(
                          r"\s*self\.", lines[st]):
                      st -= 1
                  if not re.match(r"\s*self\.", lines[st]):
                      raise RuntimeError(
                          "inicio de statement no hallado en "
                          + methodname)
                  indent = re.match(r"(\s*)",
                                    lines[st]).group(1)
                  branch = (indent + "if self._hr_wants():\n"
                            + indent + "    " + call + "\n")
                  lines.insert(st, branch)

              inject("_api_get",
                     'return self._hr_handle(None, "GET")')
              inject("_api_post",
                     "return self._hr_handle(" + docname
                     + ', "POST")')

              METHODS = '''
    def _hr_segs(self) -> list:
        """S-4 v2: segmentos SIN prefijos semilla/api
        (el server real sirve TODO bajo /semilla/...)."""
        from urllib.parse import urlparse
        segs = [p for p in urlparse(
            self.path).path.split("/") if p]
        while segs and segs[0] in ("semilla", "api"):
            segs = segs[1:]
        return segs

    def _hr_wants(self) -> bool:
        segs = self._hr_segs()
        return bool(segs) and segs[0] in (
            "home-registration",
            "home-registrations")  # _HR_V2

    def _hr_router(self):
        """Router S-4 sobre la MISMA db/clock del store
        del server (cacheado por handler)."""
        st = getattr(self, "store", None)
        if st is None:
            return None
        cached = getattr(self, "_hr_router_obj", None)
        if cached is not None:
            return cached
        try:
            from apps.semilla.routers.student.home_registration_router import (
                HomeRegistrationRouter,
            )
            obj = HomeRegistrationRouter(st._db, st._clock)
        except Exception:
            return None
        self._hr_router_obj = obj
        return obj

    def _hr_compute(self, doc, method):
        """Puro: (code, payload) para el path actual."""
        from urllib.parse import urlparse, parse_qs
        u = urlparse(self.path)
        r = self._hr_router()
        if r is None:
            return (503, {"ok": False,
                          "error": "matricula desde casa"
                                   " no disponible"})
        return r.dispatch(method=str(method),
                          segs=self._hr_segs(),
                          query=parse_qs(u.query), doc=doc)

    def _hr_handle(self, doc, method):
        """Responde JSON (primitivas de
        BaseHTTPRequestHandler — sin depender de helpers
        privados del server)."""
        import json as _hrjson
        code, payload = self._hr_compute(doc, method)
        body = _hrjson.dumps(
            payload, default=str).encode("utf-8")
        self.send_response(int(code))
        self.send_header("Content-Type",
                         "application/json")
        self.send_header("Content-Length",
                         str(len(body)))
        self.end_headers()
        self.wfile.write(body)
'''
              at = None
              for i, ln in enumerate(lines):
                  if ln.startswith("class SemillaServer"):
                      at = i
                      break
              lines.insert(at, METHODS)
              new = "".join(lines)
              ast.parse(new)
              P.write_text(new, encoding="utf-8")
              py_compile.compile(str(P), doraise=True)
              env = dict(os.environ)
              env["PYTHONPATH"] = (
                  os.getcwd() + ":" + os.getcwd()
                  + "/shared_engines")
              r = subprocess.run(
                  ["python3", "-c",
                   "import apps.semilla.server"],
                  capture_output=True, text=True, env=env)
              if r.returncode != 0:
                  raise RuntimeError(
                      "import fallo: " + r.stderr[-500:])
              open("/tmp/hr_wired", "w").write("yes")
              out("- **server.py: WIRING V2 APLICADO**"
                  " (rutas S-4 en /semilla/api/* antes del"
                  " fallback; doc=" + docname + ")")
          except SystemExit:
              pass
          except Exception:
              try:
                  P.write_text(orig, encoding="utf-8")
              except Exception:
                  pass
              open("/tmp/hr_wired", "w").write("no")
              out("- **server.py: WIRING DIFERIDO (revertido"
                  " intacto) — router S-4 sigue committeable**")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
          finally:
              try:
                  py_compile.compile(str(P), doraise=True)
              except Exception:
                  pass
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests router S-4 + wiring con rutas reales"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_s4_http_router.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.classroom.classroom_engine import ClassroomEngine
          from apps.semilla.infrastructure.persistence.semilla_store import SemillaStore
          from apps.semilla.routers.student.home_registration_router import HomeRegistrationRouter

          PICK2 = [{"name": "Mama", "relation": "MADRE"},
                   {"name": "Papa", "relation": "PADRE"}]
          EMG = [{"name": "Tio", "relation": "TIO", "phone": "911"}]

          def _env(tmp_path, cap_manana=30, cap_tarde=5):
              db = SQLiteAdapter(tmp_path / "r.db")
              clock = FrozenClock()
              cls = ClassroomEngine(db, clock)
              man = cls.create(name="1A", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=cap_manana)
              tar = cls.create(name="1T", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="VESPERTINA", capacity=cap_tarde)
              r = HomeRegistrationRouter(db, clock)
              return db, cls, man, tar, r

          def _doc(**over):
              base = {"responsable_zid": "ZID-PADRE-1",
                  "responsable_name": "Padre Perez",
                  "relation": "PADRE", "child_name": "Nino HTTP",
                  "birth_date": "2019-05-10",
                  "child_zid": "ZID-BABY-9",
                  "child_zid_status": "VERIFIED",
                  "institution_id": "INST-1", "level": "BASICA",
                  "grade": "1", "turn": "MATUTINA",
                  "authorized_pickup": PICK2,
                  "emergency_contacts": EMG}
              base.update(over)
              return base

          def test_start_confirm_flujo_completo(tmp_path) -> None:
              db, cls, man, tar, r = _env(tmp_path)
              code, p = r.dispatch(method="POST",
                  segs=["home-registration"], doc=_doc())
              assert code == 201 and p["ok"] is True
              rid = p["request"]["request_id"]
              code2, p2 = r.dispatch(method="POST",
                  segs=["home-registration", rid, "confirm"],
                  doc={"director_actor": "DIR-1"})
              assert code2 == 200 and p2["status"] == "ACTIVA"
              assert p2["student"]["zid"] == "ZID-BABY-9"
              assert p2["student"]["zid_status"] == "VERIFIED"
              assert p2["student"]["tutores"][0]["zid"] == "ZID-PADRE-1"
              assert cls.get(man["classroom_id"])["enrolled"] == 1
              code3, p3 = r.dispatch(method="GET",
                  segs=["home-registration", rid])
              assert code3 == 200
              assert p3["request"]["status"] == "ACTIVA"
              code4, p4 = r.dispatch(method="GET",
                  segs=["home-registrations"],
                  query={"institution_id": ["INST-1"]})
              assert code4 == 200 and p4["count"] == 0
              print("OK HTTP-flow: start 201 -> confirm 200 ACTIVA -> ZID nacimiento (regla 78) -> cupo UNA vez -> detalle -> pendientes")

          def test_sin_cupos_409_con_alternativas(tmp_path) -> None:
              db, cls, man, tar, r = _env(tmp_path, cap_manana=1, cap_tarde=5)
              code, p = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(child_zid="", child_zid_status="NONE"))
              assert code == 201
              rid = p["request"]["request_id"]
              r.dispatch(method="POST",
                  segs=["home-registration", rid, "confirm"],
                  doc={"director_actor": "D"})
              code2, p2 = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(responsable_zid="ZID-2",
                           child_name="Segundo",
                           child_zid="",
                           child_zid_status="NONE"))
              assert code2 == 409
              assert "MATUTINA COMPLETADA" in p2["note"]
              assert "VESPERTINA" in p2["note"]
              code3, p3 = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(responsable_zid="ZID-3",
                           child_name="Tercero",
                           child_zid="", child_zid_status="NONE",
                           turn="VESPERTINA"))
              assert code3 == 201
              rid3 = p3["request"]["request_id"]
              code4, p4 = r.dispatch(method="POST",
                  segs=["home-registration", rid3, "confirm"],
                  doc={"director_actor": "D"})
              assert code4 == 200
              assert p4["enrollment"]["turn"] == "VESPERTINA"
              print("OK SIN_CUPOS: 409 con alternativas y la tarde SI recibe")

          def test_errores_honestos(tmp_path) -> None:
              db, cls, man, tar, r = _env(tmp_path)
              code, p = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(responsable_zid=""))
              assert code == 400 and "faltan campos" in p["error"]
              code2, p2 = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(relation="PRIMO"))
              assert code2 == 400
              code3, p3 = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(authorized_pickup=PICK2[:1]))
              assert code3 == 400 and "retiro" in p3["error"]
              code4, p4 = r.dispatch(method="GET",
                  segs=["home-registration", "NO-EXISTS"])
              assert code4 == 404
              code5, p5 = r.dispatch(method="GET",
                  segs=["home-registration"])
              assert code5 == 405
              code6, p6 = r.dispatch(method="GET",
                  segs=["otra-cosa"])
              assert code6 == 404
              print("OK honesto: 400/404/405 — nada falso (regla 66)")

          def test_wiring_rutas_reales_semilla_api(tmp_path) -> None:
              import apps.semilla.server as srv
              if not hasattr(srv.SemillaApiHandler,
                             "_hr_compute"):
                  pytest.skip("wiring no aplicado en este run")
              db = SQLiteAdapter(tmp_path / "w.db")
              st = SemillaStore(db, FrozenClock())
              h = object.__new__(srv.SemillaApiHandler)
              h.store = st
              h.path = "/semilla/api/home-registration"
              assert srv.SemillaApiHandler._hr_wants(h) is True
              h.path = "/semilla/api/home-registrations?institution_id=INST-1"
              assert srv.SemillaApiHandler._hr_wants(h) is True
              h.path = "/api/home-registration"
              assert srv.SemillaApiHandler._hr_wants(h) is True
              h.path = "/semilla/api/profile/ACC-1"
              assert srv.SemillaApiHandler._hr_wants(h) is False
              h.path = "/semilla/api/health"
              assert srv.SemillaApiHandler._hr_wants(h) is False
              h.path = "/semilla/register"
              assert srv.SemillaApiHandler._hr_wants(h) is False
              h.path = "/semilla/api/home-registration"
              code, p = srv.SemillaApiHandler._hr_compute(
                  h, _doc(), "POST")
              assert code == 201
              rid = p["request"]["request_id"]
              h.path = ("/semilla/api/home-registration/"
                        + rid + "/confirm")
              code2, p2 = srv.SemillaApiHandler._hr_compute(
                  h, {"director_actor": "DIR-9"}, "POST")
              assert code2 == 200 and p2["status"] == "ACTIVA"
              h.path = "/semilla/api/home-registrations?institution_id=INST-1"
              code3, p3 = srv.SemillaApiHandler._hr_compute(
                  h, None, "GET")
              assert code3 == 200 and p3["count"] == 0
              h2 = object.__new__(srv.SemillaApiHandler)
              h2.store = None
              h2.path = "/semilla/api/home-registration"
              code4, p4 = srv.SemillaApiHandler._hr_compute(
                  h2, _doc(), "POST")
              assert code4 == 503
              print("OK wiring REAL con rutas /semilla/api/*: start/confirm/pending por el server vivo + 503 honesto; rutas existentes (profile/health/register) NO capturadas")
          TSEOF
          timeout 240 python3 -m pytest apps/semilla/tests/test_s4_http_router.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/s4h.out 2>&1
          echo $? > /tmp/s4h
          if [ "$(cat /tmp/s4h)" = "0" ]; then echo "- S-4 HTTP: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- S-4 HTTP: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### S-4 HTTP detalle"; echo '```'; tail -80 /tmp/s4h.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si SEMILLA verde"
        if: always()
