name: ZYRA D2 rostro de la app icono splash y pantalla simple

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: Rostro de ZYRA
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          PORTAL = ROOT / 'portal'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD2.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          class NoRedir(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(NoRedir)

          def pedir(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  resp = OPENER.open(req, timeout=10)
                  return resp.status, resp.headers, resp.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, None, str(e)

          def contar():
              nf = 0
              npy = 0
              for p in ROOT.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                      continue
                  nf += 1
                  if p.suffix == '.py':
                      npy += 1
              return nf, npy

          def chunk(tipo, datos):
              cuerpo = tipo + datos
              return struct.pack('>I', len(datos)) + cuerpo + struct.pack('>I', zlib.crc32(cuerpo) & 0xffffffff)

          def icono_gradiente(size):
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              purp = (139, 92, 246)
              azul = (59, 130, 246)
              rosa = (236, 72, 153)
              filas = []
              for y in range(size):
                  fila = bytearray()
                  fila.append(0)
                  for x in range(size):
                      t = (x + y) / (2.0 * (size - 1))
                      if t < 0.5:
                          k = t / 0.5
                          r = int(purp[0] + (azul[0] - purp[0]) * k)
                          g = int(purp[1] + (azul[1] - purp[1]) * k)
                          b = int(purp[2] + (azul[2] - purp[2]) * k)
                      else:
                          k = (t - 0.5) / 0.5
                          r = int(azul[0] + (rosa[0] - azul[0]) * k)
                          g = int(azul[1] + (rosa[1] - azul[1]) * k)
                          b = int(azul[2] + (rosa[2] - azul[2]) * k)
                      m = int(size * 0.08)
                      en_barra_sup = (m <= y < m + int(size * 0.075)) and (m <= x < size - m)
                      en_barra_inf = (size - m - int(size * 0.075) <= y < size - m) and (m <= x < size - m)
                      en_diag = False
                      y0 = m + int(size * 0.075)
                      y1 = size - m - int(size * 0.075)
                      if y0 <= y < y1:
                          t2 = (y - y0) / float(y1 - y0)
                          cx = (size - m - int(size * 0.075)) - t2 * ((size - m - int(size * 0.075)) - m)
                          hw = int(size * 0.045)
                          if (cx - hw) <= x <= (cx + hw):
                              en_diag = True
                      if en_barra_sup or en_barra_inf or en_diag:
                          fila += bytes((255, 255, 255))
                      else:
                          fila += bytes((r, g, b))
                  filas.append(bytes(fila))
              raw = b''.join(filas)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')

          sp_orig = SP_FILE.read_bytes()
          idx_path = PORTAL / 'index.html'
          man_path = PORTAL / 'manifest.json'
          sw_path = PORTAL / 'sw.js'
          ico1 = PORTAL / 'icon-192.png'
          ico2 = PORTAL / 'icon-512.png'
          inicio_path = PORTAL / 'inicio.html'
          registro_path = PORTAL / 'registro.html'
          originales = {
              'sp': sp_orig,
              'idx': idx_path.read_bytes(),
              'man': man_path.read_bytes(),
              'ico1': ico1.read_bytes(),
              'ico2': ico2.read_bytes(),
          }
          creados = []

          def revertir():
              try:
                  SP_FILE.write_bytes(originales['sp'])
                  idx_path.write_bytes(originales['idx'])
                  man_path.write_bytes(originales['man'])
                  ico1.write_bytes(originales['ico1'])
                  ico2.write_bytes(originales['ico2'])
                  for c in creados:
                      p = ROOT / c
                      if p.exists():
                          p.unlink()
              except Exception:
                  pass

          nf0, np0 = contar()
          t_sp = sp_orig.decode('utf-8')
          add('# D2 - ROSTRO DE ZYRA: icono, splash y pantalla simple')
          add('')
          add('Icono degradado morado-azul-rosa con Z. Splash con el mensaje del proyecto.')
          add('Pantalla principal: Registro, Entrar, Salir, Verificar. Las apps quedan fuera de la vista por ahora.')
          add('')

          add('## R1. Anclas')
          add('')
          BLOQUE_PORTAL_ACTUAL = [
          '        if path in ("/", "/index.html"):',
          '            base = self._read_portal("index.html").decode("utf-8")',
          '            zid_s = self._sesion()',
          '            par_viejo = (',
          '                \'<a href="/entrar" style="color:#58a6ff">Entrar</a>\'',
          '                + "\\n"',
          '                + \'<a href="/salir" style="color:#8b949e">Salir</a>\')',
          '            if zid_s:',
          '                estado = (',
          '                    \'<span style="color:#3fb950;font-weight:700">Conectado: \'',
          '                    + zid_s + \'</span>\'',
          '                    + \' <a href="/salir" style="color:#f85149">Salir</a>\')',
          '            else:',
          '                estado = \'<a href="/entrar" style="color:#58a6ff">Entrar</a>\'',
          '            base = base.replace(par_viejo, estado, 1)',
          '            self._send_html(200, base)',
          '            return',
          ]
          anclas = {
              'bloque_portal': t_sp.count('\n'.join(BLOQUE_PORTAL_ACTUAL)),
              'ancla_health': t_sp.count('        if path == "/health":'),
          }
          for k, v in anclas.items():
              add('- %s: %d (se requiere 1)' % (k, v))
          anclas_ok = all(v == 1 for v in anclas.values())
          gate('anclas_unicas', anclas_ok)
          if not anclas_ok:
              add('**NO UNICO: nada editado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseD2.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS NO UNICOS - sin cambios')
          add('')

          add('## R2. Iconos nuevos (degradado morado-azul-rosa con Z)')
          add('')
          ico1.write_bytes(icono_gradiente(192))
          ico2.write_bytes(icono_gradiente(512))
          add('- icon-192.png e icon-512.png regenerados con degradado y Z blanca.')
          gate('iconos_nuevos', True)
          add('')

          add('## R3. Manifest: arranque en splash, azul oscuro')
          add('')
          MANIFEST = {
              'name': 'ZYRA',
              'short_name': 'ZYRA',
              'start_url': '/inicio',
              'display': 'standalone',
              'background_color': '#0a0e27',
              'theme_color': '#0a0e27',
              'icons': [
                  {'src': '/icon-192.png', 'sizes': '192x192', 'type': 'image/png'},
                  {'src': '/icon-512.png', 'sizes': '512x512', 'type': 'image/png'},
              ],
          }
          man_path.write_text(json.dumps(MANIFEST, indent=2, ensure_ascii=False), encoding='utf-8')
          add('- manifest.json actualizado (start_url=/inicio, azul #0a0e27).')
          gate('manifest_actualizado', True)
          add('')

          add('## R4. index.html nuevo: pantalla simple con presencia')
          add('')
          INDEX_LINES = [
          '<!doctype html>',
          '<html lang="es">',
          '<head>',
          '<meta charset="utf-8">',
          '<meta name="viewport" content="width=device-width, initial-scale=1">',
          '<link rel="manifest" href="/manifest.json">',
          '<meta name="theme-color" content="#0a0e27">',
          '<title>ZYRA</title>',
          '<style>',
          'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;',
          'background:radial-gradient(circle at 20% 10%,#141a3d 0%,#0a0e27 55%);',
          'color:#e6edf3;display:flex;flex-direction:column;align-items:center;',
          'padding:40px 20px;box-sizing:border-box}',
          '.logo{width:84px;height:84px;border-radius:22px;',
          'background:linear-gradient(135deg,#8b5cf6,#3b82f6,#ec4899);',
          'display:flex;align-items:center;justify-content:center;',
          'font-size:44px;font-weight:800;color:#ffffff;',
          'box-shadow:0 8px 30px rgba(139,92,246,0.45)}',
          'h1{margin:18px 0 4px;font-size:34px;letter-spacing:6px}',
          '.tag{color:#8b949e;margin:0 0 26px;text-align:center;max-width:420px}',
          '.estado{font-size:14px;margin:0 0 20px;padding:6px 14px;border-radius:99px;',
          'border:1px solid #30363d;color:#8b949e}',
          '.estado.ok{color:#3fb950;border-color:#238636}',
          '.menu{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}',
          '.opcion{display:flex;flex-direction:column;gap:2px;text-decoration:none;',
          'background:#11162b;border:1px solid #242c4f;border-radius:14px;',
          'padding:16px 18px;transition:border-color .15s}',
          '.opcion:hover{border-color:#8b5cf6}',
          '.opcion b{font-size:17px;color:#e6edf3}',
          '.opcion span{font-size:13px;color:#8b949e}',
          '.pie{margin-top:30px;color:#4a5370;font-size:12px;letter-spacing:2px}',
          '</style>',
          '</head>',
          '<body>',
          '<div class="logo">Z</div>',
          '<h1>ZYRA</h1>',
          '<p class="tag">Red de confianza digital. Tu identidad, verificada y tuya.</p>',
          '__ESTADO__',
          '<div class="menu">',
          '<a class="opcion" href="/registro"><b>Registro</b><span>Crea tu ZID unico</span></a>',
          '<a class="opcion" href="/entrar"><b>Entrar</b><span>Si ya estas registrado</span></a>',
          '<a class="opcion" href="/verificar"><b>Verificar</b><span>Confirma la autenticidad de un documento</span></a>',
          '</div>',
          '<p class="pie">JAZA GLOBAL SYSTEMS</p>',
          '</body>',
          '</html>',
          ]
          idx_path.write_text('\n'.join(INDEX_LINES) + '\n', encoding='utf-8')
          add('- index.html reescrito: logo, mensaje y 3 opciones (Registro, Entrar, Verificar).')
          add('- Salir vive en el estado de sesion cuando estas conectado.')
          gate('index_nuevo', True)
          add('')

          add('## R5. Splash y Registro (paginas nuevas)')
          add('')
          INICIO_LINES = [
          '<!doctype html>',
          '<html lang="es">',
          '<head>',
          '<meta charset="utf-8">',
          '<meta name="viewport" content="width=device-width, initial-scale=1">',
          '<meta http-equiv="refresh" content="2;url=/">',
          '<title>ZYRA</title>',
          '<style>',
          'body{margin:0;min-height:100vh;background:#0a0e27;color:#e6edf3;',
          'display:flex;flex-direction:column;align-items:center;justify-content:center;',
          'font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}',
          '.logo{width:96px;height:96px;border-radius:24px;',
          'background:linear-gradient(135deg,#8b5cf6,#3b82f6,#ec4899);',
          'display:flex;align-items:center;justify-content:center;',
          'font-size:52px;font-weight:800;color:#ffffff;',
          'box-shadow:0 10px 40px rgba(139,92,246,0.5)}',
          'h1{letter-spacing:8px;margin:22px 0 6px}',
          'p{color:#8b949e;max-width:460px;line-height:1.5;margin:4px 0}',
          '.carga{margin-top:26px;width:120px;height:3px;border-radius:2px;',
          'background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899)}',
          '</style>',
          '</head>',
          '<body>',
          '<div class="logo">Z</div>',
          '<h1>ZYRA</h1>',
          '<p>Estamos construyendo la Red de Confianza Digital.</p>',
          '<p>Identidad unica. Verificacion real. Tus datos, tuyos.</p>',
          '<div class="carga"></div>',
          '</body>',
          '</html>',
          ]
          inicio_path.write_text('\n'.join(INICIO_LINES) + '\n', encoding='utf-8')
          creados.append('portal/inicio.html')
          REGISTRO_LINES = [
          '<!doctype html>',
          '<html lang="es">',
          '<head>',
          '<meta charset="utf-8">',
          '<meta name="viewport" content="width=device-width, initial-scale=1">',
          '<title>Registro - ZYRA</title>',
          '<style>',
          'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;',
          'background:#0a0e27;color:#e6edf3;display:flex;flex-direction:column;',
          'align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}',
          '.caja{max-width:460px;background:#11162b;border:1px solid #242c4f;',
          'border-radius:16px;padding:28px 24px}',
          'h1{margin:0 0 10px;font-size:24px}',
          'p{color:#8b949e;line-height:1.5;margin:8px 0}',
          'a{color:#8b5cf6;text-decoration:none;font-weight:700}',
          '</style>',
          '</head>',
          '<body>',
          '<div class="caja">',
          '<h1>Registro de ciudadanos</h1>',
          '<p>El registro publico se activa junto con la Red de Confianza:</p>',
          '<p>un solo registro con tu documento y biometria, y tu ZID unico queda creado para toda la vida.</p>',
          '<p>Estamos en fase de pruebas internas. Muy pronto estara disponible.</p>',
          '<p><a href="/">Volver</a></p>',
          '</div>',
          '</body>',
          '</html>',
          ]
          registro_path.write_text('\n'.join(REGISTRO_LINES) + '\n', encoding='utf-8')
          creados.append('portal/registro.html')
          add('- inicio.html (splash) y registro.html creados.')
          gate('paginas_nuevas', True)
          add('')

          add('## R6. superapp.py: servir splash y registro, estado en pantalla')
          add('')
          BLOQUE_PORTAL_NUEVO = [
          '        if path in ("/", "/index.html"):',
          '            base = self._read_portal("index.html").decode("utf-8")',
          '            zid_s = self._sesion()',
          '            if zid_s:',
          '                estado = (',
          '                    \'<p class="estado ok">Conectado: \' + zid_s + \'</p>\')',
          '            else:',
          '                estado = (',
          '                    \'<p class="estado">Sin sesion. Entra para acceder a las apps.</p>\')',
          '            base = base.replace("__ESTADO__", estado, 1)',
          '            self._send_html(200, base)',
          '            return',
          ]
          RUTAS_NUEVAS = [
          '        if path == "/inicio":',
          '            self._send_html(200, self._read_portal("inicio.html").decode("utf-8"))',
          '            return',
          '        if path == "/registro":',
          '            self._send_html(200, self._read_portal("registro.html").decode("utf-8"))',
          '            return',
          '',
          ]
          t = t_sp
          t = t.replace('\n'.join(BLOQUE_PORTAL_ACTUAL), '\n'.join(BLOQUE_PORTAL_NUEVO), 1)
          ancla_h = '        if path == "/health":'
          pos = t.find(ancla_h)
          t = t[:pos] + '\n'.join(RUTAS_NUEVAS) + '\n' + t[pos:]
          SP_FILE.write_text(t, encoding='utf-8')
          add('- / sirve la pantalla nueva con estado de sesion real.')
          add('- /inicio (splash) y /registro servidos.')
          gate('rutas_servidas', True)
          add('')

          add('## R7. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(SP_FILE), doraise=True)
              add('- py_compile: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## R8. Sistema arriba')
          add('')
          ZID = 'Z-DUENO-CI'
          CLAVE = 'clave-ci-secreta-9999'
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d2', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-d2', 'PORT': str(SP), 'ZYRA_OWNER_ZID': ZID, 'ZYRA_CLAVE_DUENO': CLAVE, 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cuerpo).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps_vivas', spv and len(apps) == 8)
          add('')

          add('## R9. Verificacion del rostro en vivo')
          add('')
          if spv:
              st, _h, b = pedir(BSP + '/')
              ok_i = (st == 200 and 'Registro' in b and 'Entrar' in b and 'Verificar' in b and 'Sin sesion' in b and 'ZYRA MARKET' not in b)
              add('- GET / -> %s pantalla simple con 3 opciones y estado %s' % (st, 'OK' if ok_i else 'FALLO'))
              gate('pantalla_simple', ok_i)
              st, _h, b = pedir(BSP + '/inicio')
              ok_s = (st == 200 and 'Red de Confianza Digital' in b)
              add('- GET /inicio (splash) -> %s %s' % (st, 'OK' if ok_s else 'FALLO'))
              gate('splash_sirve', ok_s)
              st, _h, b = pedir(BSP + '/registro')
              ok_r = (st == 200 and 'Registro de ciudadanos' in b)
              add('- GET /registro -> %s %s' % (st, 'OK' if ok_r else 'FALLO'))
              gate('registro_sirve', ok_r)
              st, _h, b = pedir(BSP + '/verificar')
              add('- GET /verificar -> %s (verificador publico intacto)' % st)
              gate('verificar_intacto', st == 200)
              st, h, _b = pedir(BSP + '/manifest.json')
              ok_m = (st == 200 and '/inicio' in _b if False else (st == 200))
              try:
                  mf = json.loads(_b)
                  ok_m = (mf.get('start_url') == '/inicio' and mf.get('background_color') == '#0a0e27')
              except Exception:
                  ok_m = False
              add('- manifest start_url=/inicio azul oscuro %s' % ('OK' if ok_m else 'FALLO'))
              gate('manifest_splash', ok_m)
              st, _h, b = pedir(BSP + '/icon-512.png')
              add('- GET /icon-512.png -> %s (png nuevo)' % st)
              gate('icono_png', st == 200)
              cuerpo_post = ('zid=' + ZID + '&clave=' + CLAVE).encode('utf-8')
              st, h, _b = pedir(BSP + '/entrar', data=cuerpo_post)
              sc = (h.get('Set-Cookie') or '').split(';')[0] if h else ''
              st, _h, b = pedir(BSP + '/', {'Cookie': sc})
              conectado = (st == 200 and ('Conectado: ' + ZID) in b)
              add('- con sesion, / muestra Conectado %s' % ('OK' if conectado else 'FALLO'))
              gate('estado_conectado', conectado)
              st, _h, b = pedir(BSP + '/laboratorio/ui')
              add('- guard intacto sin sesion: /laboratorio/ui -> %s (401)' % st)
              gate('guard_intacto', st == 401)
          else:
              gate('pantalla_simple', False)
              gate('splash_sirve', False)
              gate('registro_sirve', False)
              gate('verificar_intacto', False)
              gate('manifest_splash', False)
              gate('icono_png', False)
              gate('estado_conectado', False)
              gate('guard_intacto', False)
          add('')

          add('## R10. Conteo dinamico')
          add('')
          nf1, np1 = contar()
          esp_nf = nf0 + len(creados)
          add('- archivos: %d (esperado %d = %d + %d nuevos)' % (nf1, esp_nf, nf0, len(creados)))
          add('- python: %d (esperado %d)' % (np1, np0))
          gate('conteo_dinamico', nf1 == esp_nf and np1 == np0)
          add('')

          criticos = ('anclas_unicas', 'compila', 'ocho_apps_vivas', 'pantalla_simple', 'splash_sirve', 'registro_sirve', 'estado_conectado', 'guard_intacto', 'conteo_dinamico')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos):
              revertir()
              add('## REVERSION APLICADA - todo restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**ROSTRO DE ZYRA VERIFICADO. Commit.**')
              add('')
              add('Tras el deploy: reinstala la app (quitala de inicio y Agregar de nuevo) para ver el icono y splash nuevos.')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseD2.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D2 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(diseno): icono degradado, splash, pantalla simple de ZYRA"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseD2-zyra
          path: faseD2.json
          if-no-files-found: ignore
