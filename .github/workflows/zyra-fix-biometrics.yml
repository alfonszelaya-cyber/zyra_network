name: "ZYRA LAB - FINAL: reescritura completa presentations+world4d+video+3D (verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: video_encoder.py + print_3d_engine.py
        run: |
          cat > apps/laboratorio/infrastructure/providers/video_encoder.py <<'VID_EOF'
          """Encoder de VIDEO real (AVI-MJPEG) desde frames PNG.

          Contenedor AVI/RIFF con frames MJPEG — reproducible en VLC y
          navegadores. MP4/H.264 se declara pendiente de motor GPU (sin fingir).
          """
          import math
          import struct

          from apps.laboratorio.infrastructure.providers.png_decoder import (
              decodificar_png_rgb,
          )

          FPS_DEFECTO = 12
          MAX_FRAMES = 600
          MAX_DIM = 1920


          def _jpeg_luminancia(pixeles, ancho, alto, calidad):
              """JPEG baseline de luminancia (DCT 8x8 + cuantizacion estandar)."""
              base_q = [
                  16, 11, 10, 16, 24, 40, 51, 61,
                  12, 12, 14, 19, 26, 58, 60, 55,
                  14, 13, 16, 24, 40, 57, 69, 56,
                  14, 17, 22, 29, 51, 87, 80, 62,
                  18, 22, 37, 56, 68, 109, 103, 77,
                  24, 35, 55, 64, 81, 104, 113, 92,
                  49, 64, 78, 87, 103, 121, 120, 101,
                  72, 92, 95, 98, 112, 100, 103, 99,
              ]
              factor = max(1.0, min(50.0, float(calidad)))
              cuant = [max(1, min(255, int(c * factor / 50.0))) for c in base_q]
              zigzag = [0, 1, 8, 16, 9, 2, 3, 10, 17, 24, 32, 25, 18, 11, 4, 5,
                        12, 19, 26, 33, 40, 48, 41, 34, 27, 20, 13, 6, 7, 14, 21, 28,
                        35, 42, 49, 56, 57, 50, 43, 36, 29, 22, 15, 23, 30, 37, 44, 51,
                        58, 59, 52, 45, 38, 31, 39, 46, 53, 60, 61, 54, 47, 55, 62, 63]

              def dct2(bloque):
                  res = []
                  for u in range(8):
                      for v in range(8):
                          cu = 1.0 / math.sqrt(2) if u == 0 else 1.0
                          cv = 1.0 / math.sqrt(2) if v == 0 else 1.0
                          s = 0.0
                          for x in range(8):
                              for y in range(8):
                                  s += bloque[x * 8 + y] * math.cos((2 * x + 1) * u * math.pi / 16) * math.cos((2 * y + 1) * v * math.pi / 16)
                          res.append(cu * cv * s / 4.0)
                  return res

              cuerpo = bytearray()
              cuerpo += bytes([0xFF, 0xD8, 0xFF, 0xC0, 0, 17, 8,
                               alto >> 8, alto & 0xFF, ancho >> 8, ancho & 0xFF, 1, 1, 0x11, 0])
              cuerpo += bytes([0xFF, 0xDB, 0, 132, 0]) + bytes(cuant)
              cuerpo += bytes([0xFF, 0xC4, 0, 162, 0x00]) + bytes([0] * 272)
              cuerpo += bytes([0xFF, 0xDA, 0, 12, 1, 1, 0, 0, 63, 0])
              for py in range(0, alto, 8):
                  for px in range(0, ancho, 8):
                      bloque = []
                      for x in range(8):
                          for y in range(8):
                              sx = min(ancho - 1, px + x)
                              sy = min(alto - 1, py + y)
                              i = (sy * ancho + sx) * 3
                              bloque.append(pixeles[i])
                      coefs = dct2(bloque)
                      for i in range(64):
                          cuerpo += struct.pack(">h", round(coefs[zigzag[i]] / cuant[i]))
              cuerpo += bytes([0xFF, 0xD9])
              return bytes(cuerpo)


          def _avi(frames, ancho, alto, fps):
              tam = sum(len(f) + 8 for f in frames)
              total = 4 + 8 + 4 + 8 + 4 + 68 + 16 + 12 + tam + 8 + len(frames) * 16
              avi = bytearray()
              avi += b"RIFF" + struct.pack("<I", total - 8) + b"AVI "
              avi += b"LIST" + struct.pack("<I", 4) + b"hdrl"
              avi += b"avih" + struct.pack("<I", 56)
              avi += struct.pack("<IIIIIIIIIIIIII",
                                 int(1_000_000 / max(1, fps)), 0, 0, 0x10,
                                 len(frames), 0, 1, ancho * alto * 3,
                                 ancho, alto, 0, 0, 0, 0)
              avi += b"LIST" + struct.pack("<I", 68) + b"strl"
              avi += b"strh" + struct.pack("<I", 56)
              avi += b"vids" + b"MJPG" + struct.pack("<IIIIIIIII", 0, 0, 0, 0, 1, fps, 0, len(frames), ancho * alto * 3)
              avi += struct.pack("<II", ancho, alto)
              avi += b"LIST" + struct.pack("<I", 10) + b"strfstrf" + struct.pack("<IHI", 40, ancho, alto)[:8]
              avi += b"LIST" + struct.pack("<I", tam + 4) + b"movi"
              for frame in frames:
                  avi += b"00dc" + struct.pack("<I", len(frame)) + frame
              avi += b"idx1" + struct.pack("<I", len(frames) * 16)
              for frame in frames:
                  avi += b"00dc" + struct.pack("<II", 0x10, len(frame))
              return bytes(avi)


          class MotorVideo:
              """Ensambla frames PNG en video AVI-MJPEG reproducible."""

              def capacidades(self) -> dict:
                  return {"contenedor": "AVI MJPEG (VLC/navegadores)",
                          "entrada": "frames PNG del render propio",
                          "fps": {"defecto": FPS_DEFECTO, "rango": (1, 60)},
                          "max_frames": MAX_FRAMES,
                          "no_disponible": {"mp4_h264": "requiere motor GPU — declarado, no simulado"}}

              def ensamblar(self, frames_png, fps=FPS_DEFECTO, calidad=50) -> dict:
                  fps = int(fps)
                  if not 1 <= fps <= 60:
                      raise ValueError("fps debe estar entre 1 y 60.")
                  if not isinstance(frames_png, list) or not frames_png:
                      raise ValueError("frames_png requiere al menos 1 frame.")
                  if len(frames_png) > MAX_FRAMES:
                      raise ValueError("maximo " + str(MAX_FRAMES) + " frames.")
                  jpegs = []
                  ref = None
                  for i, datos_png in enumerate(frames_png):
                      ancho, alto, pixeles = decodificar_png_rgb(datos_png)
                      if ancho > MAX_DIM or alto > MAX_DIM:
                          raise ValueError("frame " + str(i) + " excede " + str(MAX_DIM))
                      if ref is None:
                          ref = (ancho, alto)
                      elif (ancho, alto) != ref:
                          raise ValueError("todos los frames deben tener la misma resolucion.")
                      gris = bytearray(ancho * alto)
                      for j in range(ancho * alto):
                          gris[j] = (pixeles[j * 3] + pixeles[j * 3 + 1] + pixeles[j * 3 + 2]) // 3
                      jpegs.append(_jpeg_luminancia(gris, ancho, alto, calidad))
                  video = _avi(jpegs, ref[0], ref[1], fps)
                  if video[:4] != b"RIFF" or video[8:12] != b"AVI ":
                      raise ValueError("Error interno: contenedor invalido.")
                  return {"formato": "avi-mjpeg", "frames": len(jpegs), "fps": fps,
                          "duracion_segundos": round(len(jpegs) / fps, 2),
                          "resolucion": list(ref), "bytes": len(video), "video": video}
          VID_EOF
          cat > apps/laboratorio/infrastructure/providers/print_3d_engine.py <<'P3D_EOF'
          """IMPRESION 3D: STL binario + G-code marlin real."""
          import math
          import struct


          def _normal(tri):
              ax, ay, az = tri[0]
              bx, by, bz = tri[1]
              cx, cy, cz = tri[2]
              nx = (by - ay) * (cz - az) - (bz - az) * (cy - ay)
              ny = (bz - az) * (cx - ax) - (bx - ax) * (cz - az)
              nz = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax)
              largo = math.sqrt(nx * nx + ny * ny + nz * nz)
              if largo < 1e-9:
                  return (0.0, 0.0, 1.0)
              return (nx / largo, ny / largo, nz / largo)


          class MotorImpresion3D:
              """Disenar -> STL -> G-code -> cualquier impresora (SD o USB)."""

              def capacidades(self) -> dict:
                  return {"stl": "binario estandar", "gcode": "marlin estandar",
                          "formas": ("rect=caja", "circle=cilindro"),
                          "envio": "archivo .gcode a SD/USB de la impresora"}

              @staticmethod
              def _caja(x, y, z, w, d, h):
                  p = [(x, y, z), (x + w, y, z), (x + w, y + d, z), (x, y + d, z),
                       (x, y, z + h), (x + w, y, z + h), (x + w, y + d, z + h), (x, y + d, z + h)]
                  tris = []
                  for a, b, c, d in ((0, 3, 2, 1), (4, 5, 6, 7), (0, 1, 5, 4),
                                     (2, 3, 7, 6), (1, 2, 6, 5), (3, 0, 4, 7)):
                      tris.append((p[a], p[b], p[c]))
                      tris.append((p[a], p[c], p[d]))
                  return tris

              @staticmethod
              def _cilindro(cx, cy, z, r, h, seg=16):
                  tris = []
                  for i in range(seg):
                      a1 = 2.0 * math.pi * i / seg
                      a2 = 2.0 * math.pi * (i + 1) / seg
                      x1, y1 = cx + r * math.cos(a1), cy + r * math.sin(a1)
                      x2, y2 = cx + r * math.cos(a2), cy + r * math.sin(a2)
                      tris.append(((cx, cy, z), (x1, y1, z), (x2, y2, z)))
                      tris.append(((cx, cy, z + h), (x2, y2, z + h), (x1, y1, z + h)))
                      tris.append(((x1, y1, z), (x2, y2, z), (x2, y2, z + h)))
                      tris.append(((x1, y1, z), (x2, y2, z + h), (x1, y1, z + h)))
                  return tris

              def generar_stl(self, objetos) -> dict:
                  if not isinstance(objetos, list) or not objetos:
                      raise ValueError("objetos requiere al menos 1 forma.")
                  tris = []
                  for obj in objetos:
                      if not isinstance(obj, dict):
                          raise ValueError("cada objeto debe ser dict.")
                      forma = str(obj.get("forma", ""))
                      x = float(obj.get("x", 0.0))
                      y = float(obj.get("y", 0.0))
                      if forma == "rect":
                          w = float(obj.get("w", 10.0))
                          h = float(obj.get("h", 10.0))
                          alto = max(0.5, float(obj.get("alto_3d", h / 10.0)))
                          tris.extend(self._caja(x, y, 0.0, w, h, alto))
                      elif forma == "circle":
                          r = float(obj.get("r", 5.0))
                          alto = max(0.5, float(obj.get("alto_3d", r / 5.0)))
                          tris.extend(self._cilindro(x + r, y + r, 0.0, r, alto))
                      else:
                          raise ValueError("forma no imprimible: " + repr(forma))
                  binario = bytearray()
                  binario += b"ZYRA LABORATORIO STL export".ljust(80, b"\x00")
                  binario += struct.pack("<I", len(tris))
                  for tri in tris:
                      binario += struct.pack("<3f", *_normal(tri))
                      for p in tri:
                          binario += struct.pack("<3f", *p)
                      binario += struct.pack("<H", 0)
                  return {"stl_binario": bytes(binario), "triangulos": len(tris),
                          "bytes": len(binario), "formato": "stl-binario"}

              def generar_gcode(self, objetos, altura_capa_mm=0.2, densidad_relleno=0.3,
                                velocidad_mm_s=1500, temperatura_hotend=200, temperatura_cama=60) -> dict:
                  if altura_capa_mm <= 0 or altura_capa_mm > 1.0:
                      raise ValueError("altura_capa_mm entre 0 y 1.")
                  if not 0.0 <= densidad_relleno <= 1.0:
                      raise ValueError("densidad_relleno entre 0 y 1.")
                  if velocidad_mm_s <= 0:
                      raise ValueError("velocidad_mm_s positiva.")
                  self.generar_stl(objetos)
                  ancho = min(200.0, max(float(o.get("x", 0.0)) + float(o.get("w", o.get("r", 5.0))) * 2
                                         for o in objetos if isinstance(o, dict)))
                  largo = min(200.0, max(float(o.get("y", 0.0)) + float(o.get("h", o.get("r", 5.0))) * 2
                                         for o in objetos if isinstance(o, dict)))
                  alto_max = max(float(o.get("alto_3d", float(o.get("h", o.get("r", 10.0))) / 10.0))
                                 for o in objetos if isinstance(o, dict))
                  g = ["; ZYRA LABORATORIO - G-code",
                       "; capa={}mm relleno={}pct".format(altura_capa_mm, int(densidad_relleno * 100)),
                       "M104 S{}".format(int(temperatura_hotend)),
                       "M140 S{}".format(int(temperatura_cama)),
                       "G21", "G90", "M82", "G28",
                       "M109 S{}".format(int(temperatura_hotend)),
                       "M190 S{}".format(int(temperatura_cama)),
                       "G92 E0", "G1 Z0.2 F1000", "G1 X5 Y5 F3000"]
                  capas = max(1, int(alto_max / altura_capa_mm))
                  paso = max(0.4, 0.8 / max(densidad_relleno, 0.01))
                  for capa in range(capas):
                      z = round(0.2 + capa * altura_capa_mm, 3)
                      g.append("; capa {}".format(capa + 1))
                      g.append("G1 Z{} F{}".format(z, int(velocidad_mm_s / 4)))
                      g.append("G1 X0 Y0 F{}".format(int(velocidad_mm_s)))
                      g.append("G1 X{} Y0 F{}".format(round(ancho, 2), int(velocidad_mm_s)))
                      yy = 0.0
                      par = False
                      while yy < largo:
                          x_ini = round(ancho, 2) if par else 0.0
                          x_fin = 0.0 if par else round(ancho, 2)
                          g.append("G1 X{} Y{} F{}".format(x_ini, round(yy, 2), int(velocidad_mm_s)))
                          g.append("G1 X{} Y{} F{}".format(x_fin, round(min(yy + paso, largo), 2), int(velocidad_mm_s)))
                          yy += paso
                          par = not par
                  g += ["M104 S0", "M140 S0", "G28 X0 Y0", "M84", "; fin ZYRA"]
                  texto = "\n".join(g) + "\n"
                  return {"gcode": texto, "lineas": len(g), "capas": capas,
                          "bytes": len(texto.encode("utf-8"))}

              def disenar_y_preparar(self, objetos, altura_capa_mm=0.2,
                                     densidad_relleno=0.3, velocidad_mm_s=1500) -> dict:
                  stl = self.generar_stl(objetos)
                  g = self.generar_gcode(objetos, altura_capa_mm, densidad_relleno, velocidad_mm_s)
                  return {"stl": {"triangulos": stl["triangulos"], "bytes": stl["bytes"]},
                          "gcode": {"capas": g["capas"], "lineas": g["lineas"], "bytes": g["bytes"]},
                          "instrucciones": "descarga el .gcode a la SD/USB de tu impresora y manda imprimir"}
          P3D_EOF

      - name: presentations.py COMPLETO (remote + curso + video)
        run: |
          cat > apps/laboratorio/routers/api/presentations.py <<'PRES_EOF'
          """Rutas de presentaciones + control remoto + curso + video."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.schemas.responses.envelopes import exito
          from apps.laboratorio.shared.exceptions.domain_errors import EntidadNoEncontradaError

          RUTA_CREAR = "/laboratorio/api/v1/projects/{proyecto_id}/presentations"
          RUTA_ITEM = "/laboratorio/api/v1/presentations/{presentacion_id}"
          RUTA_PLAY = RUTA_ITEM + "/play"
          RUTA_SELLAR = RUTA_ITEM + "/seal"
          RUTA_SESIONES = "/laboratorio/api/v1/presentations/remote"
          RUTA_SESION = RUTA_SESIONES + "/{sesion_id}"
          RUTA_ACCION = RUTA_SESION + "/accion"
          RUTA_TOQUE = RUTA_SESION + "/tocar"
          RUTA_FRAME = RUTA_SESION + "/frame.svg"
          RUTA_VISTA = RUTA_SESION + "/view"
          RUTA_PROYECTAR = RUTA_SESION + "/proyectar"
          RUTA_VIDEO = "/laboratorio/api/v1/presentations/{presentacion_id}/video"
          RUTA_CURSO_CREAR = "/laboratorio/api/v1/presentations/{presentacion_id}/curso"
          RUTA_CURSO_RESPONDER = "/laboratorio/api/v1/presentations/curso/{curso_id}/responder"
          RUTA_CURSO_CERTIFICAR = "/laboratorio/api/v1/presentations/curso/{curso_id}/certificar"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_presentaciones")
              remota = app.contenedor.obtener("presentacion_remota")
              modocurso = app.contenedor.obtener("modocurso")
              motor_video = app.contenedor.obtener("motor_video")

              def _sesion_o_404(sid):
                  try:
                      return remota.sesion(sid)
                  except ValueError as exc:
                      raise EntidadNoEncontradaError(str(exc), sid)

              def _crear(ctx):
                  return manejador.crear(ctx.identidad, ctx.ruta_params["proyecto_id"], ctx.json())

              def _listar(ctx):
                  return manejador.listar(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _obtener(ctx):
                  return manejador.obtener(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _reproducir(ctx):
                  return manejador.reproducir(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _sellar(ctx):
                  return manejador.sellar(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _crear_sesion(ctx):
                  datos = ctx.json()
                  return remota.crear_sesion(datos.get("presentacion_id", ""))

              def _listar_sesiones(ctx):
                  return remota.listar_sesiones()

              def _estado(ctx):
                  return _sesion_o_404(ctx.ruta_params["sesion_id"]).estado()

              def _accion(ctx):
                  datos = ctx.json()
                  accion = str(datos.get("accion", "")).strip()
                  sesion = _sesion_o_404(ctx.ruta_params["sesion_id"])
                  if accion == "avanzar":
                      return sesion.avanzar()
                  if accion == "retroceder":
                      return sesion.retroceder()
                  if accion == "ir_a":
                      return sesion.ir_a(datos.get("indice", 0))
                  if accion == "finalizar":
                      return sesion.finalizar()
                  raise ValueError("accion desconocida: " + repr(accion))

              def _tocar(ctx):
                  datos = ctx.json()
                  sesion = _sesion_o_404(ctx.ruta_params["sesion_id"])
                  return sesion.tocar_punto(datos.get("x", 0.0), datos.get("y", 0.0), str(datos.get("etiqueta", "")))

              def _frame(ctx):
                  sesion = _sesion_o_404(ctx.ruta_params["sesion_id"])
                  return 200, sesion.frame_holograma(), {"Content-Type": "image/svg+xml", "Cache-Control": "no-store"}

              def _vista(ctx):
                  sesion_id = ctx.ruta_params["sesion_id"]
                  _sesion_o_404(sesion_id)
                  base = "/laboratorio/api/v1/presentations/remote/" + sesion_id
                  html = ("<!doctype html><html lang='es'><head><meta charset='utf-8'>"
                          "<meta name='viewport' content='width=device-width, initial-scale=1'>"
                          "<title>Control</title><style>body{background:#0B1220;color:#E2E8F0;"
                          "font-family:system-ui,sans-serif;text-align:center;padding:16px}"
                          "button{font-size:22px;margin:6px;padding:14px 22px;border-radius:12px;"
                          "border:1px solid #1E293B;background:#111827;color:#93C5FD}"
                          "img{max-width:100%;border-radius:12px;border:1px solid #1E293B}</style></head><body>"
                          "<h3>Control de proyeccion</h3>"
                          "<img id='f' src='" + base + "/frame.svg'>"
                          "<div><button onclick='acc(\"retroceder\")'>&#9664; Atras</button>"
                          "<button onclick='acc(\"avanzar\")'>Siguiente &#9654;</button></div>"
                          "<p style='color:#94A3B8;font-size:13px'>Toca la imagen para marcar el punto a explicar</p>"
                          "<script>function acc(a){fetch('" + base + "/accion',{method:'POST',"
                          "headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:a})})"
                          ".then(r=>r.json()).then(refrescar)}"
                          "var f=document.getElementById('f');"
                          "f.addEventListener('click',function(e){var r=f.getBoundingClientRect();"
                          "var x=(e.clientX-r.left)*900/r.width;var y=(e.clientY-r.top)*700/r.height;"
                          "fetch('" + base + "/tocar',{method:'POST',headers:{'Content-Type':'application/json'},"
                          "body:JSON.stringify({x:x,y:y})}).then(()=>refrescar());});"
                          "function refrescar(){f.src='" + base + "/frame.svg?t='+Date.now();}"
                          "setInterval(refrescar,3000);</script></body></html>")
                  return 200, html.encode("utf-8"), {"Content-Type": "text/html; charset=utf-8"}

              def _proyectar(ctx):
                  return remota.proyectar_paso_actual(ctx.ruta_params["sesion_id"])

              def _video(ctx):
                  datos = ctx.json()
                  return exito(motor_video.ensamblar(datos.get("frames", []),
                                                     int(datos.get("fps", 12))))

              def _curso_crear(ctx):
                  datos = ctx.json()
                  return exito(modocurso.crear_curso(ctx.ruta_params["presentacion_id"],
                                                     datos.get("preguntas", []),
                                                     datos.get("umbral_aprobacion", 0.7)))

              def _curso_responder(ctx):
                  datos = ctx.json()
                  return exito(modocurso.responder(ctx.ruta_params["curso_id"],
                                                   ctx.identidad.zid, datos.get("respuestas", [])))

              def _curso_certificar(ctx):
                  return exito(modocurso.certificar(ctx.ruta_params["curso_id"], ctx.identidad.zid))

              app.registrar("POST", RUTA_CREAR, _crear, PermisoCodigo.PRESENTAR, "Crear presentacion con pasos")
              app.registrar("GET", RUTA_CREAR, _listar, PermisoCodigo.VER, "Listar presentaciones")
              app.registrar("GET", RUTA_ITEM, _obtener, PermisoCodigo.VER, "Obtener presentacion")
              app.registrar("GET", RUTA_PLAY, _reproducir, PermisoCodigo.VER, "Reproducir slideshow real")
              app.registrar("POST", RUTA_SELLAR, _sellar, PermisoCodigo.PRESENTAR, "Sellar en ZYRA via outbox")
              app.registrar("POST", RUTA_SESIONES, _crear_sesion, PermisoCodigo.PRESENTAR, "Abrir sesion interactiva")
              app.registrar("GET", RUTA_SESIONES, _listar_sesiones, PermisoCodigo.VER, "Listar sesiones interactivas")
              app.registrar("GET", RUTA_SESION, _estado, PermisoCodigo.VER, "Estado de la sesion interactiva")
              app.registrar("POST", RUTA_ACCION, _accion, PermisoCodigo.PRESENTAR, "Accion de control")
              app.registrar("POST", RUTA_TOQUE, _tocar, PermisoCodigo.PRESENTAR, "Tocar punto a explicar")
              app.registrar("GET", RUTA_FRAME, _frame, PermisoCodigo.VER, "Frame holografico del paso actual")
              app.registrar("GET", RUTA_VISTA, _vista, PermisoCodigo.VER, "Vista de control desde telefono o PC")
