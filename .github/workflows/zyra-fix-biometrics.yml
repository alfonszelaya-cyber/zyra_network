      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si todo verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/r4b 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: rojo — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(AGRO A-4..A-8): LandGeoEngine (GIS parcela: coordenadas/suelo/riego/area efectiva + uso historico por temporada + rotacion de cultivos + resumen por productor) + AgronomyEngine (capas del ciclo agronomico sobre planes existentes: insumos semilla/fertilizante/agroquimico con dosis, plagas con tratamiento y cierre protegido, inspecciones con resultado, resumen agronomico) + HarvestEngine (cosecha ligada a plan — plan CANCELADO rechazado regla 66; lotes con peso/grado/rechazos/almacen; trazabilidad plan->cosecha->lote; carga por almacen) + LivestockEngine (expediente por animal con genealogia sire/dam verificada, eventos VACUNA/TRATAMIENTO/PESO/MOVIMIENTO/MUERTE — muerte cambia status y bloquea posteriores, resumen vivos/muertos por especie) + InventoryBatchEngine (lotes con entry_seq y vencimiento, consumo FIFO por entrada y FEFO por vencimiento con CASE SQL, stock insuficiente honesto, movimientos IN/OUT trazables, reporte de vencidos) — regla 68: 5 carpetas EXISTENTES; leccion c: DDL de agro_area_lands/agro_plans recreado IF NOT EXISTS con esquema exacto de la auditoria; regla 76: ORDER BY rowid/entry_seq"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — A-4..A-8 CERRADOS (5/11 de AGRO avanzado). RUN 4c: A-9..A-14 (maquinaria horas/mantenimiento, riego balance, contratos/liquidacion, exportacion completa, riesgo agrícola unificado, gobierno elegibilidad/duplicados).**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
