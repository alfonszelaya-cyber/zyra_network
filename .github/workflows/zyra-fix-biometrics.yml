name: "ZYRA RUN3c: A-2 prep frontera de dinero (shared/money.py regla 61 HALF_UP) + auditoria fuentes para RUN 3d"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] fuentes de dinero AGRO + riesgo NEXO (RUN 3d conversiones + N-7)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA RUN 3d — fuentes de dinero AGRO (A-2)" >> "$SUM"
          for f in apps/agro/modules/comercializacion/mercado/market_service.py apps/agro/modules/comercializacion/venta_simple/simple_sale_service.py apps/agro/modules/produccion/planificacion/planning_service.py apps/agro/modules/recursos_y_activos/valoracion/valuation_service.py apps/agro/shared/utils.py; do
            echo "### $f" >> "$SUM"
            { echo '```python'; cat "$f" 2>/dev/null; echo '```'; } >> "$SUM"
          done
          echo "## AUDITORIA RUN 3d — riesgo NEXO (N-7)" >> "$SUM"
          echo "### archivos domain/risk" >> "$SUM"
          { echo '```'; ls apps/nexo/domain/risk/ 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### firmas de engines de riesgo" >> "$SUM"
          { echo '```'; for f in apps/nexo/domain/risk/*.py; do [ -f "$f" ] || continue; case "$f" in *__init__*) continue;; esac; echo "== $f"; grep -n "^class \|    def " "$f" | head -30; done; echo '```'; } >> "$SUM"
          echo "### fuentes completas de riesgo (hasta 3 archivos)" >> "$SUM"
          { echo '```python'; for f in $(ls apps/nexo/domain/risk/*.py 2>/dev/null | grep -v __init__ | head -3); do echo "== $f"; cat "$f"; done; echo '```'; } >> "$SUM"
          echo "### como usan el riesgo los tests existentes" >> "$SUM"
          { echo '```'; grep -n "import\|Risk\|risk" apps/nexo/tests/test_risk.py 2>/dev/null | head -30; echo '```'; } >> "$SUM"
          echo "### fin auditoria" >> "$SUM"
          exit 0

      - name: "[ESCRITURA] A-2 prep: shared/money.py (frontera de dinero regla 61)"
        if: always()
        run: |
          if [ -d "apps/agro/shared" ] && [ ! -f "apps/agro/shared/__init__.py" ]; then
            : > apps/agro/shared/__init__.py
            echo "init creado: apps/agro/shared/__init__.py (carpeta existente, marcador de paquete)"
          fi
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/agro/shared/money.py",
                     D(r'''
                  """money.py (A-2 prep) - FRONTERA DE DINERO de
                  AGRO (regla 61: montos SIEMPRE Decimal 2d,
                  fiscal = HALF_UP).

                  D2(value) -> Decimal cuantizado a 0.01 con
                  HALF_UP (acepta str/int/Decimal/float via
                  str(); rechaza inválidos con ValueError
                  honesto — NUNCA NaN/inf silencioso).
                  money_str(value) -> str 2d (lo que se guarda
                  en TEXT de la db).
                  is_positive_money(value) -> bool seguro
                  (reemplaza el patron float(value) > 0 de
                  shared/utils.py en la frontera).
                  safe_float(value) -> float SOLO DESPUES de
                  cuantizar (para columnas SQLite REAL hasta
                  la migracion completa del 3d).
                  sum_money(iterable) -> str 2d (suma exacta,
                  sin acumulacion de error binario).

                  RUN 3d convertira los 4 services de dinero
                  (market/simple_sale/valuation/planning) a
                  usar esta frontera en escritura y lectura."""
                  from __future__ import annotations
                  from decimal import Decimal, InvalidOperation, \
                      ROUND_HALF_UP

                  _Q = Decimal("0.01")


                  def D2(value) -> Decimal:
                      try:
                          d = Decimal(str(value))
                      except (InvalidOperation, TypeError,
                              ValueError):
                          raise ValueError(
                              "monto invalido: " + repr(value))
                      if not d.is_finite():
                          raise ValueError(
                              "monto no finito: " + repr(value))
                      return d.quantize(_Q,
                                        rounding=ROUND_HALF_UP)


                  def money_str(value) -> str:
                      return str(D2(value))


                  def is_positive_money(value) -> bool:
                      try:
                          return D2(value) > Decimal("0.00")
                      except ValueError:
                          return False


                  def safe_float(value) -> float:
                      """Solo tras cuantizar (frontera REAL)."""
                      return float(D2(value))


                  def sum_money(values) -> str:
                      total = Decimal("0.00")
                      for v in (values or []):
                          total += D2(v)
                      return str(total)
              '''))
              out("## FIN money helper")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests frontera de dinero"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          cat > apps/agro/tests/test_money_helper.py << 'TSEOF'
          import pytest
          from decimal import Decimal
          from apps.agro.shared.money import (
              D2, money_str, is_positive_money, safe_float,
              sum_money)


          def test_d2_half_up_regla61() -> None:
              assert money_str("2.675") == "2.68"
              assert money_str("1.005") == "1.01"
              assert money_str("-1.239") == "-1.24"
              assert money_str(3) == "3.00"
              assert money_str("10") == "10.00"
              assert D2(Decimal("7.129")) == Decimal("7.13")
              assert str(D2("2.5")) == "2.50"
              print("OK A-2 prep: D2 cuantiza 2d con HALF_UP (regla 61) desde str/int/Decimal")


          def test_d2_rechaza_invalidos_honesto() -> None:
              with pytest.raises(ValueError):
                  D2("abc")
              with pytest.raises(ValueError):
                  D2(None)
              with pytest.raises(ValueError):
                  D2(float("nan"))
              with pytest.raises(ValueError):
                  D2(float("inf"))
              print("OK A-2 prep: montos invalidos -> ValueError honesto (regla 66: nunca NaN/inf silencioso)")


          def test_is_positive_y_suma() -> None:
              assert is_positive_money("0.01") is True
              assert is_positive_money("0.00") is False
              assert is_positive_money("-5") is False
              assert is_positive_money("junk") is False
              assert sum_money(["0.1", "0.2"]) == "0.30"
              assert sum_money(["1.005", "2.005"]) == "3.02"
              assert sum_money([]) == "0.00"
              assert sum_money(None) == "0.00"
              print("OK A-2 prep: is_positive seguro (reemplaza float()>0) + suma exacta sin error binario")


          def test_safe_float_tras_cuantizar() -> None:
              assert safe_float("12.345") == 12.35
              assert safe_float("7") == 7.0
              with pytest.raises(ValueError):
                  safe_float("junk")
              print("OK A-2 prep: safe_float SOLO despues de cuantizar (frontera REAL hasta migracion 3d)")
          TSEOF
          python3 - << 'ASTEOF'
          import ast
          ast.parse(open("apps/agro/tests/test_money_helper.py",
                         encoding="utf-8").read())
          print("AST OK test_money_helper.py")
          ASTEOF
          timeout 180 python3 -m pytest apps/agro/tests/test_money_helper.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/r3c.out 2>&1
          echo $? > /tmp/r3c
          if [ "$(cat /tmp/r3c)" = "0" ]; then echo "- RUN 3c (money helper): ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- RUN 3c: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### RUN 3c detalle"; echo '```'; tail -80 /tmp/r3c.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si todo verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/r3c 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: rojo — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(AGRO A-2 prep): shared/money.py — FRONTERA DE DINERO (D2 Decimal 2d HALF_UP regla 61; money_str para TEXT; is_positive_money reemplaza el patron float()>0; safe_float solo tras cuantizar para columnas REAL hasta migracion 3d; sum_money exacta sin error binario; ValueError honesto en invalidos/NaN/inf regla 66) + auditoria LECTURA de las 4 fuentes de dinero (market/simple_sale/valuation/planning) y domain/risk NEXO para las conversiones y N-7 del RUN 3d"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — A-2 prep CERRADA. RUN 3d: convertir los 4 services de dinero a la frontera money.py (con las fuentes impresas arriba) + N-7 riesgo unificado.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
