name: ZYRA D28 icono con franja neon aprobada

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD28:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pillow
      - name: Franja neon sobre tu cubo
        run: |
          python3 - <<'PYEOF'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          PT = Path.cwd() / 'portal'
          def marco(size, grosor=14):
              base = Image.open(PT / 'icon-512.png').convert('RGBA').resize((size, size), Image.LANCZOS)
              lienzo = Image.new('RGBA', (size, size), (0, 0, 0, 255))
              m = grosor
              interior = base.resize((size - m * 2, size - m * 2), Image.LANCZOS)
              brillo = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              db = ImageDraw.Draw(brillo)
              db.rounded_rectangle((2, 2, size - 2, size - 2), radius=size // 5,
                                   outline=(80, 200, 255, 255), width=grosor + 4)
              db.rounded_rectangle((6, 6, size - 6, size - 6), radius=size // 5,
                                   outline=(236, 72, 153, 255), width=grosor - 4)
              brillo = brillo.filter(ImageFilter.GaussianBlur(6))
              lienzo = Image.alpha_composite(lienzo, brillo)
              lienzo.paste(interior, (m, m), interior)
              dl = ImageDraw.Draw(lienzo)
              dl.rounded_rectangle((m, m, size - m, size - m), radius=size // 5,
                                   outline=(140, 220, 255, 255), width=5)
              return lienzo
          i1 = PT / 'icon-192.png'
          i2 = PT / 'icon-512.png'
          marco(192).save(i1)
          marco(512).save(i2)
          print('iconos con franja OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portal/icon-192.png portal/icon-512.png
          git commit -m "fix(D28): franja neon aprobada restaurada" || echo "sin cambios"
          git push
          echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
