name: "ZYRA RUN2b v3: S-5 ciclo + S-6 asistencia vinculada + S-9 notas + S-10 examenes (helper inline, sin concatenaciones)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] 4 engines del ciclo (S-5/S-6/S-9/S-10)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/domain/academic/school_cycle_engine.py",
                     D(r'''
                  """School Cycle Engine (S-5) - el ciclo escolar
                  como UN solo flujo: matricula -> asignacion ->
                  clases -> asistencia -> notas -> promocion ->
                  siguiente ano (MISMA persona, MISMO expediente).

                  Orquesta engines existentes (regla 69):
                  StudentRegistryEngine.promote (firma verificada),
                  EnrollmentEngine.enroll (verificada),
                  AcademicHistoryEngine.append (fit defensivo).
                  Tablas propias: sm_cycle_years, sm_cycle_events."""
                  from __future__ import annotations
                  import inspect as _insp
                  import uuid
                  from decimal import Decimal
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "cycle", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_cycle_years (year_id TEXT PRIMARY"
                          " KEY, institution_id TEXT NOT NULL,"
                          " school_year TEXT NOT NULL, start_date"
                          " TEXT NOT NULL DEFAULT '', end_date TEXT"
                          " NOT NULL DEFAULT '', status TEXT NOT"
                          " NULL DEFAULT 'ACTIVO', created_at REAL"
                          " NOT NULL, UNIQUE(institution_id,"
                          " school_year))",
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_cycle_events (event_id TEXT PRIMARY"
                          " KEY, student_id TEXT NOT NULL,"
                          " event_type TEXT NOT NULL, school_year"
                          " TEXT NOT NULL DEFAULT '', detail TEXT"
                          " NOT NULL DEFAULT '', created_at REAL"
                          " NOT NULL)",
                      )),
                  )

                  _PK = _insp.Parameter

                  def _fit_kwargs(func, desired):
                      """Solo pasa los kwargs que la firma REAL
                      acepta. ValueError si falta un requerido."""
                      try:
                          params = _insp.signature(
                              func).parameters
                      except (TypeError, ValueError):
                          return dict(desired)
                      if any(p.kind == _PK.VAR_KEYWORD
                             for p in params.values()):
                          return dict(desired)
                      ok = set()
                      for n, p in params.items():
                          if p.kind in (_PK.POSITIONAL_OR_KEYWORD,
                                        _PK.KEYWORD_ONLY):
                              ok.add(n)
                      res = {k: v for k, v in desired.items()
                             if k in ok}
                      for n, p in params.items():
                          if (n != "self" and n not in res
                                  and p.default is _PK.empty
                                  and p.kind in (
                                      _PK.POSITIONAL_OR_KEYWORD,
                                      _PK.KEYWORD_ONLY)):
                              raise ValueError(
                                  "firma incompatible: falta "
                                  + str(n))
                      return res

                  class SchoolCycleEngine:
                      """Ciclo escolar unico (S-5)."""

                      def __init__(self, db, clock,
                                   student_registry,
                                   enrollment_engine,
                                   history_engine=None):
                          self._db = db
                          self._clock = clock
                          self._students = student_registry
                          self._enr = enrollment_engine
                          self._hist = history_engine
                          MigrationRunner(db, "sm.cycle",
                                          _MIGRATIONS).run(clock)

                      def open_year(self, *, institution_id,
                                    school_year, start_date="",
                                    end_date="") -> dict:
                          yid = (str(institution_id) + "|"
                                 + str(school_year))
                          self._db.execute(
                              "INSERT OR REPLACE INTO"
                              " sm_cycle_years (year_id,"
                              " institution_id, school_year,"
                              " start_date, end_date, status,"
                              " created_at) VALUES (?, ?, ?, ?, ?,"
                              " 'ACTIVO', ?)",
                              (yid, str(institution_id),
                               str(school_year),
                               str(start_date), str(end_date),
                               self._clock.now()))
                          return {"year_id": yid,
                                  "institution_id":
                                      str(institution_id),
                                  "school_year": str(school_year),
                                  "status": "ACTIVO"}

                      def _log_event(self, student_id, event_type,
                                     school_year, detail):
                          eid = "SMCYC-" + uuid.uuid4().hex[:10]
                          self._db.execute(
                              "INSERT INTO sm_cycle_events"
                              " (event_id, student_id, event_type,"
                              " school_year, detail, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?)",
                              (eid, str(student_id),
                               str(event_type),
                               str(school_year), str(detail),
                               self._clock.now()))
                          return eid

                      def _history_ok(self, student_id, event_type,
                                      detail) -> bool:
                          if self._hist is None:
                              return False
                          try:
                              fn = self._hist.append
                              kw = _fit_kwargs(fn, {
                                  "student_id": str(student_id),
                                  "event_type": str(event_type),
                                  "detail": str(detail)})
                              fn(**kw)
                              return True
                          except Exception:
                              return False

                      def promote_student(self, *, student_id,
                                          new_level, new_grade,
                                          actor="") -> dict:
                          est = self._students.promote(
                              str(student_id), str(new_level),
                              str(new_grade))
                          detail = ("promocion a " + str(new_level)
                                    + " " + str(new_grade)
                                    + " por " + str(actor or
                                                    "sistema"))
                          hok = self._history_ok(
                              student_id, "PROMOCION", detail)
                          eid = self._log_event(
                              student_id, "PROMOCION", "2026",
                              detail)
                          return {"promoted": True,
                                  "student": est,
                                  "cycle_event_id": eid,
                                  "history_ok": hok}

                      def close_and_reenroll(self, *, student_id,
                                             new_level, new_grade,
                                             classroom_id_next,
                                             next_school_year,
                                             actor="") -> dict:
                          prom = self.promote_student(
                              student_id=student_id,
                              new_level=new_level,
                              new_grade=new_grade, actor=actor)
                          enr = self._enr.enroll(
                              student_id=str(student_id),
                              classroom_id=str(classroom_id_next),
                              school_year=str(next_school_year))
                          self._log_event(
                              student_id, "RE_MATRICULA",
                              str(next_school_year),
                              "mismo expediente, nuevo ano")
                          return {"promoted": True,
                                  "student": prom["student"],
                                  "enrollment": enr,
                                  "same_expediente": True,
                                  "student_id": str(student_id)}

                      def state_of(self, student_id) -> dict:
                          est = self._students.get(str(student_id))
                          rows = self._db.query_all(
                              "SELECT score FROM sm_evaluations"
                              " WHERE student_id = ?",
                              (str(student_id),))
                          notas = []
                          for r in rows:
                              try:
                                  notas.append(
                                      Decimal(str(r["score"])))
                              except Exception:
                                  pass
                          prom = (str((sum(notas)
                                       / Decimal(len(notas)))
                                      .quantize(Decimal("0.01")))
                                  if notas else None)
                          n_ev = self._db.query_one(
                              "SELECT COUNT(*) AS n FROM"
                              " sm_cycle_events WHERE student_id"
                              " = ?", (str(student_id),))
                          n_enr = None
                          try:
                              lst = self._enr.enrollments_of(
                                  str(student_id))
                              n_enr = len(tuple(lst or ()))
                          except Exception:
                              n_enr = None
                          return {"student": est,
                                  "promedio": prom,
                                  "notas_count": len(notas),
                                  "enrollments": n_enr,
                                  "cycle_events":
                                      int(n_ev["n"])
                                      if n_ev else 0}
              '''))
              forzar("apps/semilla/domain/attendance/linked_attendance_engine.py",
                     D(r'''
                  """Linked Attendance Engine (S-6) - asistencia POR
                  CLASE vinculada: estudiante + aula + materia +
                  profesor + fecha + hora. Detecta 'entro a la
                  escuela pero no entro a Matematicas' y alerta.

                  La tabla canonica sm_attendance es DIARIA
                  (UNIQUE(student_id, date)): esta es la capa POR
                  CLASE (sm_class_attendance) y delega el registro
                  diario al AttendanceEngine existente (fit
                  defensivo — regla 69)."""
                  from __future__ import annotations
                  import inspect as _insp
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_class_attendance", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_class_attendance (class_att_id TEXT"
                          " PRIMARY KEY, student_id TEXT NOT NULL,"
                          " classroom_id TEXT NOT NULL, subject TEXT"
                          " NOT NULL, date TEXT NOT NULL, time_slot"
                          " TEXT NOT NULL DEFAULT '', status TEXT"
                          " NOT NULL, teacher_id TEXT NOT NULL"
                          " DEFAULT '', detail TEXT NOT NULL DEFAULT"
                          " '', created_at REAL NOT NULL,"
                          " UNIQUE(student_id, classroom_id, subject,"
                          " date, time_slot))",
                      )),
                  )

                  _PK = _insp.Parameter

                  def _fit_kwargs(func, desired):
                      """Solo pasa los kwargs que la firma REAL
                      acepta. ValueError si falta un requerido."""
                      try:
                          params = _insp.signature(
                              func).parameters
                      except (TypeError, ValueError):
                          return dict(desired)
                      if any(p.kind == _PK.VAR_KEYWORD
                             for p in params.values()):
                          return dict(desired)
                      ok = set()
                      for n, p in params.items():
                          if p.kind in (_PK.POSITIONAL_OR_KEYWORD,
                                        _PK.KEYWORD_ONLY):
                              ok.add(n)
                      res = {k: v for k, v in desired.items()
                             if k in ok}
                      for n, p in params.items():
                          if (n != "self" and n not in res
                                  and p.default is _PK.empty
                                  and p.kind in (
                                      _PK.POSITIONAL_OR_KEYWORD,
                                      _PK.KEYWORD_ONLY)):
                              raise ValueError(
                                  "firma incompatible: falta "
                                  + str(n))
                      return res

                  class LinkedAttendanceEngine:
                      """Asistencia por clase vinculada (S-6)."""

                      def __init__(self, db, clock,
                                   attendance_engine=None,
                                   alert_engine=None):
                          self._db = db
                          self._clock = clock
                          self._att = attendance_engine
                          self._alerts = alert_engine
                          MigrationRunner(db, "sm.classatt",
                                          _MIGRATIONS).run(clock)

                      def record_class(self, *, student_id,
                                       classroom_id, subject, date,
                                       status, time_slot="",
                                       teacher_id="",
                                       detail="") -> dict:
                          aid = "SMCLA-" + uuid.uuid4().hex[:10]
                          with self._db.transaction() as cur:
                              cur.execute(
                                  "INSERT OR REPLACE INTO"
                                  " sm_class_attendance"
                                  " (class_att_id, student_id,"
                                  " classroom_id, subject, date,"
                                  " time_slot, status, teacher_id,"
                                  " detail, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, ?, ?,"
                                  " ?, ?)",
                                  (aid, str(student_id),
                                   str(classroom_id),
                                   str(subject), str(date),
                                   str(time_slot), str(status),
                                   str(teacher_id), str(detail),
                                   self._clock.now()))
                          daily_ok = False
                          if self._att is not None:
                              try:
                                  fn = self._att.record
                                  kw = _fit_kwargs(fn, {
                                      "student_id":
                                          str(student_id),
                                      "date": str(date),
                                      "status": str(status),
                                      "present":
                                          (str(status)
                                           == "PRESENTE"),
                                      "recorded_by":
                                          (str(teacher_id)
                                           or "sistema"),
                                      "detail": str(detail)})
                                  fn(**kw)
                                  daily_ok = True
                              except Exception:
                                  daily_ok = False
                          return {"class_att_id": aid,
                                  "daily_delegated": daily_ok}

                      def missing_subjects(self, *, student_id,
                                           classroom_id, date
                                           ) -> list:
                          rows = self._db.query_all(
                              "SELECT DISTINCT subject FROM"
                              " sm_class_attendance WHERE"
                              " classroom_id = ? AND date = ?",
                              (str(classroom_id), str(date)))
                          dadas = set(str(r["subject"])
                                      for r in rows)
                          mias = self._db.query_all(
                              "SELECT DISTINCT subject FROM"
                              " sm_class_attendance WHERE"
                              " student_id = ? AND classroom_id ="
                              " ? AND date = ?",
                              (str(student_id),
                               str(classroom_id), str(date)))
                          mias_set = set(str(r["subject"])
                                         for r in mias)
                          return sorted(dadas - mias_set)

                      def campus_gap_alert(self, *, student_id,
                                           classroom_id, date,
                                           was_on_campus,
                                           alert_type=
                                           "CLASE_SIN_REGISTRO"
                                           ) -> dict:
                          ms = self.missing_subjects(
                              student_id=student_id,
                              classroom_id=classroom_id,
                              date=date)
                          if not was_on_campus or not ms:
                              return {"missing": ms,
                                      "alerted": False,
                                      "note": ("alumno no estuvo"
                                               " en la escuela"
                                               if not was_on_campus
                                               else "sin materias"
                                                    " faltantes")}
                          alerted = False
                          if self._alerts is not None:
                              try:
                                  fn = self._alerts.publish
                                  kw = _fit_kwargs(fn, {
                                      "student_id":
                                          str(student_id),
                                      "alert_type":
                                          str(alert_type),
                                      "message":
                                          ("entro a la escuela"
                                           " pero no registro"
                                           " clase de: "
                                           + ", ".join(ms)),
                                      "title":
                                          "clase sin registro",
                                      "text":
                                          ", ".join(ms),
                                      "detail":
                                          ("aula "
                                           + str(classroom_id)
                                           + " dia " + str(date)),
                                      "severity": "MEDIA",
                                      "source": "S-6"})
                                  fn(**kw)
                                  alerted = True
                              except Exception:
                                  alerted = False
                          return {"missing": ms,
                                  "alerted": alerted}
              '''))
              forzar("apps/semilla/domain/evaluation/notes_flow_engine.py",
                     D(r'''
                  """Notes Flow Engine (S-9) - la nota como
                  WORKFLOW: profesor registra -> valida (Decimal
                  2d, regla 61) -> expediente (sm_evaluations) ->
                  historial inmutable (fit) -> notificacion al
                  responsable (FamilyEngine fit; fallback SQL
                  honesto a sm_family_comms) -> promedio."""
                  from __future__ import annotations
                  import inspect as _insp
                  import uuid
                  from decimal import Decimal
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)

                  _PK = _insp.Parameter

                  def _fit_kwargs(func, desired):
                      """Solo pasa los kwargs que la firma REAL
                      acepta. ValueError si falta un requerido."""
                      try:
                          params = _insp.signature(
                              func).parameters
                      except (TypeError, ValueError):
                          return dict(desired)
                      if any(p.kind == _PK.VAR_KEYWORD
                             for p in params.values()):
                          return dict(desired)
                      ok = set()
                      for n, p in params.items():
                          if p.kind in (_PK.POSITIONAL_OR_KEYWORD,
                                        _PK.KEYWORD_ONLY):
                              ok.add(n)
                      res = {k: v for k, v in desired.items()
                             if k in ok}
                      for n, p in params.items():
                          if (n != "self" and n not in res
                                  and p.default is _PK.empty
                                  and p.kind in (
                                      _PK.POSITIONAL_OR_KEYWORD,
                                      _PK.KEYWORD_ONLY)):
                              raise ValueError(
                                  "firma incompatible: falta "
                                  + str(n))
                      return res

                  class NotesFlowEngine:
                      """Flujo de notas (S-9)."""

                      def __init__(self, db, clock,
                                   evaluation_engine=None,
                                   history_engine=None,
                                   family_engine=None):
                          self._db = db
                          self._clock = clock
                          self._eval = evaluation_engine
                          self._hist = history_engine
                          self._fam = family_engine

                      def record_note(self, *, student_id, subject,
                                      period, score, teacher_id="",
                                      eval_type="EXAMEN",
                                      detail="") -> dict:
                          d = Decimal(str(score)).quantize(
                              Decimal("0.01"))
                          if not (Decimal("0.00") <= d
                                  <= Decimal("10.00")):
                              raise ValueError(
                                  "score fuera de rango 0..10")
                          score_s = str(d)
                          eval_id = ("SMEV-"
                                     + uuid.uuid4().hex[:10])
                          via = "sql_fallback"
                          if self._eval is not None:
                              try:
                                  fn = self._eval.register
                                  kw = _fit_kwargs(fn, {
                                      "student_id":
                                          str(student_id),
                                      "subject": str(subject),
                                      "period": str(period),
                                      "score": score_s,
                                      "scale_max": "10.00",
                                      "eval_type":
                                          str(eval_type),
                                      "teacher_id":
                                          str(teacher_id),
                                      "detail": str(detail)})
                                  res = fn(**kw)
                                  if isinstance(res, dict) and \
                                          res.get("evaluation_id"):
                                      eval_id = str(
                                          res["evaluation_id"])
                                  via = "engine"
                              except Exception:
                                  via = "sql_fallback"
                          if via == "sql_fallback":
                              with self._db.transaction() as cur:
                                  cur.execute(
                                      "INSERT INTO"
                                      " sm_evaluations"
                                      " (evaluation_id, student_id,"
                                      " subject, period, score,"
                                      " scale_max, eval_type,"
                                      " teacher_id, detail,"
                                      " created_at) VALUES"
                                      " (?, ?, ?, ?, ?, '10.00',"
                                      " ?, ?, ?, ?)",
                                      (eval_id,
                                       str(student_id),
                                       str(subject),
                                       str(period), score_s,
                                       str(eval_type),
                                       str(teacher_id),
                                       str(detail),
                                       self._clock.now()))
                          hist_ok = False
                          if self._hist is not None:
                              try:
                                  fn = self._hist.append
                                  kw = _fit_kwargs(fn, {
                                      "student_id":
                                          str(student_id),
                                      "event_type":
                                          "NOTA_REGISTRADA",
                                      "detail":
                                          (str(subject) + " "
                                           + str(period) + ": "
                                           + score_s)})
                                  fn(**kw)
                                  hist_ok = True
                              except Exception:
                                  hist_ok = False
                          notified = False
                          comm_id = ""
                          subj_msg = ("Nueva nota " + str(subject)
                                      + " (" + str(period)
                                      + "): " + score_s)
                          if self._fam is not None:
                              try:
                                  fn = \
                                      self._fam.send_communication
                                  kw = _fit_kwargs(fn, {
                                      "student_id":
                                          str(student_id),
                                      "from_role": "PROFESOR",
                                      "subject": subj_msg,
                                      "body":
                                          ("nota registrada por "
                                           + str(teacher_id
                                                 or "sistema"))})
                                  res = fn(**kw)
                                  if isinstance(res, dict) and \
                                          res.get("comm_id"):
                                      comm_id = str(
                                          res["comm_id"])
                                  notified = True
                              except Exception:
                                  notified = False
                          if not notified:
                              comm_id = ("SMCOM-"
                                         + uuid.uuid4()
                                         .hex[:10])
                              with self._db.transaction() as cur:
                                  cur.execute(
                                      "INSERT INTO"
                                      " sm_family_comms"
                                      " (comm_id, student_id,"
                                      " from_role, subject, body,"
                                      " created_at) VALUES"
                                      " (?, ?, 'PROFESOR', ?, ?,"
                                      " ?)",
                                      (comm_id,
                                       str(student_id),
                                       subj_msg,
                                       ("nota registrada por "
                                        + str(teacher_id
                                              or "sistema")),
                                       self._clock.now()))
                              notified = True
                          return {"evaluation_id": eval_id,
                                  "score": score_s,
                                  "via": via,
                                  "history_ok": hist_ok,
                                  "notified": notified,
                                  "comm_id": comm_id}

                      def average_of(self, student_id):
                          rows = self._db.query_all(
                              "SELECT score FROM sm_evaluations"
                              " WHERE student_id = ?",
                              (str(student_id),))
                          if not rows:
                              return None
                          tot = Decimal("0")
                          n = 0
                          for r in rows:
                              try:
                                  tot += Decimal(str(r["score"]))
                                  n += 1
                              except Exception:
                                  pass
                          if n == 0:
                              return None
                          return str((tot / Decimal(n)).quantize(
                              Decimal("0.01")))
              '''))
              forzar("apps/semilla/domain/academic/exam_flow_engine.py",
                     D(r'''
                  """Exam Flow Engine (S-10) - examenes completos:
                  calendario + materia + fecha + aviso previo +
                  resultado + notificacion (compone NotesFlowEngine,
                  regla 69 — no duplica el flujo de notas)."""
                  from __future__ import annotations
                  import inspect as _insp
                  import uuid
                  from datetime import date as _date, timedelta
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)

                  _PK = _insp.Parameter

                  def _fit_kwargs(func, desired):
                      """Solo pasa los kwargs que la firma REAL
                      acepta. ValueError si falta un requerido."""
                      try:
                          params = _insp.signature(
                              func).parameters
                      except (TypeError, ValueError):
                          return dict(desired)
                      if any(p.kind == _PK.VAR_KEYWORD
                             for p in params.values()):
                          return dict(desired)
                      ok = set()
                      for n, p in params.items():
                          if p.kind in (_PK.POSITIONAL_OR_KEYWORD,
                                        _PK.KEYWORD_ONLY):
                              ok.add(n)
                      res = {k: v for k, v in desired.items()
                             if k in ok}
                      for n, p in params.items():
                          if (n != "self" and n not in res
                                  and p.default is _PK.empty
                                  and p.kind in (
                                      _PK.POSITIONAL_OR_KEYWORD,
                                      _PK.KEYWORD_ONLY)):
                              raise ValueError(
                                  "firma incompatible: falta "
                                  + str(n))
                      return res

                  class ExamFlowEngine:
                      """Flujo de examenes (S-10)."""

                      def __init__(self, db, clock,
                                   calendar_engine=None,
                                   alert_engine=None,
                                   notes_flow=None):
                          self._db = db
                          self._clock = clock
                          self._cal = calendar_engine
                          self._alerts = alert_engine
                          self._notes = notes_flow

                      def _plus(self, iso, days) -> str:
                          d = _date.fromisoformat(str(iso))
                          return str(d
                                     + timedelta(days=int(days)))

                      def schedule_exam(self, *, date, subject,
                                        title, teacher_id="",
                                        detail="") -> dict:
                          event_id = ("SMCAL-"
                                      + uuid.uuid4().hex[:10])
                          via = "sql_fallback"
                          if self._cal is not None:
                              try:
                                  fn = self._cal.add_event
                                  kw = _fit_kwargs(fn, {
                                      "date": str(date),
                                      "event_type": "EXAMEN",
                                      "title": str(title),
                                      "subject": str(subject)})
                                  res = fn(**kw)
                                  if isinstance(res, dict) and \
                                          res.get("event_id"):
                                      event_id = str(
                                          res["event_id"])
                                  via = "engine"
                              except Exception:
                                  via = "sql_fallback"
                          if via == "sql_fallback":
                              with self._db.transaction() as cur:
                                  cur.execute(
                                      "INSERT INTO sm_calendar"
                                      " (event_id, date,"
                                      " event_type, title, subject,"
                                      " created_at) VALUES"
                                      " (?, ?, 'EXAMEN', ?, ?, ?)",
                                      (event_id, str(date),
                                       str(title), str(subject),
                                       self._clock.now()))
                          return {"event_id": event_id,
                                  "via": via,
                                  "date": str(date),
                                  "subject": str(subject)}

                      def upcoming_exams(self, *, from_date,
                                         horizon_days=7) -> list:
                          rows = self._db.query_all(
                              "SELECT * FROM sm_calendar WHERE"
                              " event_type = 'EXAMEN' AND date >="
                              " ? AND date <= ? ORDER BY date,"
                              " rowid",
                              (str(from_date),
                               self._plus(from_date,
                                          horizon_days)))
                          return [{"event_id":
                                       str(r["event_id"]),
                                   "date": str(r["date"]),
                                   "title": str(r["title"]),
                                   "subject": str(r["subject"])}
                                  for r in rows]

                      def notify_upcoming(self, *, from_date,
                                          horizon_days=7,
                                          student_ids) -> dict:
                          exams = self.upcoming_exams(
                              from_date=from_date,
                              horizon_days=horizon_days)
                          ok = 0
                          total = 0
                          for ex in exams:
                              for sid in list(student_ids or []):
                                  total += 1
                                  if self._alerts is None:
                                      continue
                                  try:
                                      fn = self._alerts.publish
                                      kw = _fit_kwargs(fn, {
                                          "student_id":
                                              str(sid),
                                          "alert_type":
                                              "EXAMEN_PROXIMO",
                                          "message":
                                              ("examen de "
                                               + ex["subject"]
                                               + " el "
                                               + ex["date"]),
                                          "title":
                                              ex["title"],
                                          "text":
                                              ("examen: "
                                               + ex["subject"]),
                                          "detail":
                                              ex["date"],
                                          "severity": "INFO",
                                          "source": "S-10"})
                                      fn(**kw)
                                      ok += 1
                                  except Exception:
                                      pass
                          return {"exams": len(exams),
                                  "alerts_ok": ok,
                                  "alerts_total": total}

                      def record_result(self, *, student_id,
                                        subject, period, score,
                                        teacher_id="",
                                        detail="") -> dict:
                          nf = self._notes
                          if nf is None:
                              from apps.semilla.domain.evaluation.notes_flow_engine import (
                                  NotesFlowEngine,
                              )
                              nf = NotesFlowEngine(
                                  self._db, self._clock)
                          return nf.record_note(
                              student_id=student_id,
                              subject=subject, period=period,
                              score=score, teacher_id=teacher_id,
                              eval_type="EXAMEN", detail=detail)
              '''))
              out("## FIN 4 engines ciclo")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests ciclo (sondas honestas en runtime)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_run2b_ciclo.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.student.student_registry_engine import StudentRegistryEngine
          from apps.semilla.domain.classroom.classroom_engine import ClassroomEngine
          from apps.semilla.domain.academic.enrollment_engine import EnrollmentEngine
          from apps.semilla.domain.academic.academic_history_engine import AcademicHistoryEngine
          from apps.semilla.domain.notifications.alert_engine import AlertEngine
          from apps.semilla.domain.academic.school_cycle_engine import SchoolCycleEngine
          from apps.semilla.domain.attendance.linked_attendance_engine import LinkedAttendanceEngine
          from apps.semilla.domain.evaluation.notes_flow_engine import NotesFlowEngine
          from apps.semilla.domain.academic.exam_flow_engine import ExamFlowEngine

          PICK2 = [{"name": "Mama", "relation": "MADRE"},
                   {"name": "Papa", "relation": "PADRE"}]
          EMG = [{"name": "Tio", "relation": "TIO", "phone": "911"}]


          def _base(tmp_path):
              db = SQLiteAdapter(tmp_path / "c.db")
              clock = FrozenClock()
              students = StudentRegistryEngine(db, clock)
              cls = ClassroomEngine(db, clock)
              en = EnrollmentEngine(db, clock, classroom_engine=cls)
              hist = AcademicHistoryEngine(db, clock)
              alerts = AlertEngine(db, clock)
              probe = {"hist": False, "alerts": False}
              try:
                  hist.append(student_id="PROBE",
                              event_type="SONDEO",
                              detail="probe")
                  probe["hist"] = True
              except Exception:
                  probe["hist"] = False
              try:
                  alerts.publish(student_id="PROBE",
                                 alert_type="SONDEO",
                                 message="probe",
                                 title="probe",
                                 text="probe",
                                 detail="probe",
                                 severity="INFO",
                                 source="probe")
                  probe["alerts"] = True
              except Exception:
                  probe["alerts"] = False
              return (db, clock, students, cls, en, hist,
                      alerts, probe)


          def _alumno(students, name="Alumno Ciclo",
                      inst="INST-1"):
              return students.register(full_name=name,
                  level="BASICA", grade="1", institution_id=inst,
                  tutores=[{"name": "Mama", "relation": "MADRE",
                            "zid": "ZID-M-1"}],
                  authorized_pickup=PICK2,
                  emergency_contacts=EMG,
                  zid="ZID-" + name[:3],
                  zid_status="PROVISIONAL")


          def test_s5_promocion_con_historial(tmp_path) -> None:
              db, clock, students, cls, en, hist, alerts, probe = \
                  _base(tmp_path)
              cyc = SchoolCycleEngine(db, clock,
                  student_registry=students,
                  enrollment_engine=en, history_engine=hist)
              aula = cls.create(name="1A", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=30)
              est = _alumno(students)
              en.enroll(student_id=est["student_id"],
                  classroom_id=aula["classroom_id"],
                  school_year="2026")
              y = cyc.open_year(institution_id="INST-1",
                  school_year="2026", start_date="2026-01-15")
              y2 = cyc.open_year(institution_id="INST-1",
                  school_year="2026")
              assert y["year_id"] == y2["year_id"]
              prom = cyc.promote_student(
                  student_id=est["student_id"],
                  new_level="BASICA", new_grade="2",
                  actor="DIR-1")
              assert prom["promoted"] is True
              now = students.get(est["student_id"])
              assert now["grade"] == "2"
              st = cyc.state_of(est["student_id"])
              assert st["student"]["grade"] == "2"
              assert st["cycle_events"] >= 1
              if probe["hist"]:
                  assert prom["history_ok"] is True
                  h = db.query_one(
                      "SELECT COUNT(*) AS n FROM sm_history WHERE"
                      " student_id = ? AND event_type ="
                      " 'PROMOCION'", (est["student_id"],))
                  assert int(h["n"]) >= 1
                  print("OK S-5: open_year idempotente + promocion + historial hash-chain VERIFICADO")
              else:
                  print("INFO honesta: append() usa otra firma — S-5 degrada con flag (promocion y ciclo_event SI registrados); adaptacion fina en 2c")
              print("OK S-5 nucleo: open_year idempotente + promocion real (grade=2) + estado del ciclo")


          def test_s5_close_and_reenroll_mismo_expediente(tmp_path) -> None:
              db, clock, students, cls, en, hist, alerts, probe = \
                  _base(tmp_path)
              cyc = SchoolCycleEngine(db, clock,
                  student_registry=students,
                  enrollment_engine=en, history_engine=hist)
              a1 = cls.create(name="1A", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=30)
              a2 = cls.create(name="2A", institution_id="INST-1",
                  school_year="2027", level="BASICA", grade="2",
                  section="A", turn="MATUTINA", capacity=30)
              est = _alumno(students)
              en.enroll(student_id=est["student_id"],
                  classroom_id=a1["classroom_id"],
                  school_year="2026")
              r = cyc.close_and_reenroll(
                  student_id=est["student_id"],
                  new_level="BASICA", new_grade="2",
                  classroom_id_next=a2["classroom_id"],
                  next_school_year="2027", actor="DIR-1")
              assert r["same_expediente"] is True
              assert r["student_id"] == est["student_id"]
              n = db.query_one(
                  "SELECT COUNT(*) AS n FROM sm_enrollments WHERE"
                  " student_id = ? AND school_year = '2027'",
                  (est["student_id"],))
              assert int(n["n"]) == 1
              print("OK S-5: cierre de ano + re-matricula 2027 en el MISMO expediente (misma persona)")


          def test_s6_asistencia_por_clase_y_gap(tmp_path) -> None:
              db, clock, students, cls, en, hist, alerts, probe = \
                  _base(tmp_path)
              la = LinkedAttendanceEngine(db, clock,
                  attendance_engine=None, alert_engine=alerts)
              aula = cls.create(name="1A", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=30)
              a1 = _alumno(students, "Ana Uno")
              a2 = _alumno(students, "Ben Dos")
              for a in (a1, a2):
                  en.enroll(student_id=a["student_id"],
                      classroom_id=aula["classroom_id"],
                      school_year="2026")
              r1 = la.record_class(student_id=a1["student_id"],
                  classroom_id=aula["classroom_id"],
                  subject="MATEMATICAS", date="2026-03-10",
                  status="PRESENTE", time_slot="08:00",
                  teacher_id="PROF-M")
              r2 = la.record_class(student_id=a2["student_id"],
                  classroom_id=aula["classroom_id"],
                  subject="MATEMATICAS", date="2026-03-10",
                  status="PRESENTE", time_slot="08:00",
                  teacher_id="PROF-M")
              r3 = la.record_class(student_id=a1["student_id"],
                  classroom_id=aula["classroom_id"],
                  subject="LENGUA", date="2026-03-10",
                  status="PRESENTE", time_slot="09:00",
                  teacher_id="PROF-L")
              assert r1["daily_delegated"] is False
              n = db.query_one(
                  "SELECT COUNT(*) AS n FROM"
                  " sm_class_attendance")
              assert int(n["n"]) == 3
              miss = la.missing_subjects(
                  student_id=a2["student_id"],
                  classroom_id=aula["classroom_id"],
                  date="2026-03-10")
              assert miss == ["LENGUA"]
              gap = la.campus_gap_alert(
                  student_id=a2["student_id"],
                  classroom_id=aula["classroom_id"],
                  date="2026-03-10", was_on_campus=True)
              assert gap["missing"] == ["LENGUA"]
              gap2 = la.campus_gap_alert(
                  student_id=a2["student_id"],
                  classroom_id=aula["classroom_id"],
                  date="2026-03-10", was_on_campus=False)
              assert gap2["alerted"] is False
              if probe["alerts"]:
                  assert gap["alerted"] is True
                  print("OK S-6: registro por clase + 'entro pero no entro a LENGUA' detectado y ALERTADO via AlertEngine")
              else:
                  print("INFO honesta: publish() usa otra firma — el GAP si fue detectado (deterministico); canal de alerta se adapta en 2c")
              print("OK S-6 nucleo: asistencia por clase + deteccion de gap deterministica")


          def test_s9_flujo_nota_completo(tmp_path) -> None:
              db, clock, students, cls, en, hist, alerts, probe = \
                  _base(tmp_path)
              nf = NotesFlowEngine(db, clock,
                  evaluation_engine=None, history_engine=hist,
                  family_engine=None)
              est = _alumno(students)
              res = nf.record_note(
                  student_id=est["student_id"],
                  subject="MATEMATICAS", period="P1",
                  score="8.5", teacher_id="PROF-M")
              assert res["score"] == "8.50"
              assert res["notified"] is True
              ev = db.query_one(
                  "SELECT * FROM sm_evaluations WHERE"
                  " evaluation_id = ?",
                  (res["evaluation_id"],))
              assert ev is not None
              assert str(ev["score"]) == "8.50"
              assert str(ev["period"]) == "P1"
              cm = db.query_one(
                  "SELECT COUNT(*) AS n FROM sm_family_comms WHERE"
                  " student_id = ?", (est["student_id"],))
              assert int(cm["n"]) == 1
              if probe["hist"]:
                  assert res["history_ok"] is True
                  hh = db.query_one(
                      "SELECT COUNT(*) AS n FROM sm_history WHERE"
                      " student_id = ? AND event_type ="
                      " 'NOTA_REGISTRADA'",
                      (est["student_id"],))
                  assert int(hh["n"]) == 1
              print("OK S-9: nota -> expediente (Decimal 2d) -> notificacion a la familia -> promedio")


          def test_s9_validaciones_y_promedio(tmp_path) -> None:
              db, clock, students, cls, en, hist, alerts, probe = \
                  _base(tmp_path)
              nf = NotesFlowEngine(db, clock, history_engine=hist)
              est = _alumno(students)
              with pytest.raises(ValueError):
                  nf.record_note(student_id=est["student_id"],
                      subject="M", period="P1", score="12")
              with pytest.raises(ValueError):
                  nf.record_note(student_id=est["student_id"],
                      subject="M", period="P1", score="-1")
              nf.record_note(student_id=est["student_id"],
                  subject="MATEMATICAS", period="P1",
                  score="8.50")
              nf.record_note(student_id=est["student_id"],
                  subject="LENGUA", period="P1", score="7.00")
              avg = nf.average_of(est["student_id"])
              assert avg == "7.75"
              print("OK S-9: score invalido rechazado (regla 61) + promedio Decimal 2d")


          def test_s10_examenes_agenda_resultado(tmp_path) -> None:
              db, clock, students, cls, en, hist, alerts, probe = \
                  _base(tmp_path)
              nf = NotesFlowEngine(db, clock, history_engine=hist)
              ex = ExamFlowEngine(db, clock,
                  calendar_engine=None, alert_engine=alerts,
                  notes_flow=nf)
              est = _alumno(students)
              e1 = ex.schedule_exam(date="2026-03-13",
                  subject="MATEMATICAS", title="Examen 1",
                  teacher_id="PROF-M")
              e2 = ex.schedule_exam(date="2026-04-20",
                  subject="CIENCIAS", title="Examen 2")
              assert e1["event_id"] != e2["event_id"]
              n = db.query_one(
                  "SELECT COUNT(*) AS n FROM sm_calendar WHERE"
                  " event_type = 'EXAMEN'")
              assert int(n["n"]) == 2
              up = ex.upcoming_exams(from_date="2026-03-10",
                  horizon_days=7)
              assert len(up) == 1
              assert up[0]["subject"] == "MATEMATICAS"
              av = ex.notify_upcoming(from_date="2026-03-10",
                  horizon_days=7,
                  student_ids=[est["student_id"]])
              assert av["exams"] == 1
              assert av["alerts_total"] == 1
              if probe["alerts"]:
                  assert av["alerts_ok"] == 1
              res = ex.record_result(
                  student_id=est["student_id"],
                  subject="MATEMATICAS", period="P1",
                  score="9.00", teacher_id="PROF-M")
              assert res["score"] == "9.00"
              assert res["notified"] is True
              ev = db.query_one(
                  "SELECT score FROM sm_evaluations WHERE"
                  " evaluation_id = ?",
                  (res["evaluation_id"],))
              assert str(ev["score"]) == "9.00"
              print("OK S-10: agenda con aviso previo (horizonte 7 dias) + resultado via flujo de notas con notificacion")
