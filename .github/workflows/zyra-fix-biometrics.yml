          MAX_FEED = 500


          class _EnvolturaMotor:
              """Adapta un motor existente al registro con estado honesto."""

              def __init__(self, nombre, motor, disponible, motivo="", tipo="motor"):
                  self.nombre = str(nombre)
                  self._motor = motor
                  self._disponible = bool(disponible)
                  self._motivo = "" if disponible else str(motivo)
                  self._tipo = str(tipo)

              def capacidades(self) -> dict:
                  if hasattr(self._motor, "capacidades"):
                      return self._motor.capacidades()
                  return {}

              def reporte(self) -> dict:
                  return {
                      "nombre": self.nombre,
                      "tipo": self._tipo,
                      "estado": "disponible" if self._disponible else "no_disponible",
                      "version": "1.0.0",
                      "capacidades": tuple(self.capacidades().keys()),
                      "motivo": self._motivo,
                  }


          class ColectorEventos:
              """Buffer circular del feed de eventos (monkey-patch aditivo del bus)."""

              def __init__(self, maxlen: int = MAX_FEED):
                  if int(maxlen) < 1:
                      raise ValueError("maxlen debe ser mayor o igual a 1.")
                  self._feed = deque(maxlen=int(maxlen))
                  self._secuencia = 0
                  self._notificador = Notificador()

              def conectar(self, bus: BusEventos) -> int:
                  """Patch aditivo: cada publicacion del bus entra al feed."""
                  if bus is None:
                      raise ValueError("ColectorEventos requiere el bus real.")
                  publicar_original = bus.publicar

                  def publicar_con_feed(evento):
                      entregados = publicar_original(evento)
                      try:
                          nombre = getattr(evento, "nombre", str(type(evento).__name__))
                          datos = getattr(evento, "datos", {})
                          self._registrar(nombre, dict(datos or {}))
                      except Exception:
                          pass
                      return entregados

                  bus.publicar = publicar_con_feed
                  return 1

              def _registrar(self, nombre: str, datos: dict) -> int:
                  import time as _time
                  self._secuencia += 1
                  self._feed.append({
                      "seq": self._secuencia,
                      "evento": str(nombre)[:120],
                      "datos": datos,
                      "momento": _time.strftime(
                          "%Y-%m-%dT%H:%M:%SZ", _time.gmtime()
                      ),
                  })
                  return self._secuencia

              def historial(self, desde: int = 0, limite: int = 50) -> dict:
                  if int(desde) < 0:
                      raise ValueError("desde no puede ser negativo.")
                  if int(limite) < 1 or int(limite) > MAX_FEED:
                      raise ValueError(
                          "limite debe estar entre 1 y " + str(MAX_FEED)
                      )
                  todos = list(self._feed)
                  seleccion = [
                      e for e in todos if int(e["seq"]) > int(desde)
                  ][: int(limite)]
                  return {
                      "total": self._secuencia,
                      "devueltos": len(seleccion),
                      "cursor_sugerido": (
                          seleccion[-1]["seq"] if seleccion else int(desde)
                      ),
                      "eventos": seleccion,
                  }

              def notificar_evento(self, evento, mensaje: str = "") -> dict:
                  return self._notificador.notificar(evento, mensaje)


          class Contenedor:
              def __init__(self):
                  self._fabricas = {}
                  self._instancias = {}

              def registrar(self, nombre, fabrica, unico=True):
                  if not nombre or not callable(fabrica):
                      raise ValueError("Servicio requiere nombre y fabrica callable.")
                  if nombre in self._fabricas:
                      raise ValueError("Servicio duplicado: " + nombre)
                  self._fabricas[nombre] = (fabrica, bool(unico))

              def obtener(self, nombre):
                  if nombre not in self._fabricas:
                      raise ValueError("Servicio no registrado: " + nombre)
                  fabrica, unico = self._fabricas[nombre]
                  if unico and nombre in self._instancias:
                      return self._instancias[nombre]
                  instancia = fabrica(self)
                  if unico:
                      self._instancias[nombre] = instancia
                  return instancia

              def contiene(self, nombre) -> bool:
                  return nombre in self._fabricas

              def nombres(self) -> tuple:
                  return tuple(sorted(self._fabricas))


          def _capacidades_honestas() -> DisponibilidadCapacidades:
              capacidades = DisponibilidadCapacidades()
