name: ZYRA A2 portada del laboratorio como app normal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseA2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias minimas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography

      - name: Cambiar raiz del laboratorio de JSON a pagina normal
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          LAB = ROOT / 'apps' / 'laboratorio'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)
          OBJETIVO = {'ruta': None}

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseA2.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO - archivo restaurado')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _manejador

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def pedir(url):
              try:
                  with urllib.request.urlopen(url, timeout=8) as r:
                      return r.status, r.headers.get('Content-Type', ''), \
                             r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, '', str(e)

          add('# A2 - PORTADA DEL LABORATORIO (pagina normal, no JSON)')
          add('')
          add('Solo cambia lo que muestra la raiz. El resto del laboratorio intacto.')
          add('')

          add('## D1. Busqueda del registro de la ruta raiz')
          add('')
          PAT = re.compile(
              r'registrar\s*\(\s*["\']GET["\']\s*,\s*["\'](/laboratorio)["\']\s*,\s*'
              r'([A-Za-z_][A-Za-z0-9_]*)')
          cands = []
          for p in LAB.rglob('*.py'):
              if '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              try:
                  if p.stat().st_size == 0:
                      continue
              except OSError:
                  continue
              t = txt(p)
              for m in PAT.finditer(t):
                  linea_no = t.count('\n', 0, m.start()) + 1
                  linea = t.splitlines()[linea_no - 1]
                  cands.append({'archivo': str(p.relative_to(ROOT)),
                                'linea': linea_no,
                                'handler': m.group(2),
                                'texto': linea.strip()[:150],
                                'indice': 'Indice' in linea})
          add('- Candidatas encontradas: %d' % len(cands))
          for c in cands:
              add('  - %s:%d handler=%s %s' % (c['archivo'], c['linea'],
                  c['handler'], '(INDICE)' if c['indice'] else ''))
              add('    `%s`' % c['texto'])
          elegida = None
          for c in cands:
              if c['indice']:
                  elegida = c
                  break
          if elegida is None and len(cands) == 1:
              elegida = cands[0]
          if elegida is None:
              add('')
              add('- **PATRON NO IDENTIFICADO con certeza. Nada editado, nada guardado.**')
              add('- Con la lista de arriba se identifica la ruta exacta en el proximo run.')
              gate('ruta_identificada', False)
              DATA['candidatas'] = cands
              Path('faseA2.json').write_text(
                  json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
                  encoding='utf-8')
              escribe()
              raise SystemExit('RUTA NO IDENTIFICADA - sin cambios')
          OBJETIVO['ruta'] = elegida
          archivo = ROOT / elegida['archivo']
          add('')
          add('- **ELEGIDA:** %s:%d handler=%s' % (elegida['archivo'],
              elegida['linea'], elegida['handler']))
          gate('ruta_identificada', True)
          add('')

          original = archivo.read_bytes()
          texto = original.decode('utf-8')

          def revertir():
              try:
                  archivo.write_bytes(original)
              except Exception:
                  pass

          add('## D2. Edicion: la raiz sirve pagina normal')
          add('')
          if '_portada_html_lab' in texto:
              ya = True
              add('- Ya aplicado antes (idempotente, sin cambios).')
          else:
              ya = False
              nuevos = PAT.findall(texto)
              add('- Coincidencias del patron en el archivo: %d (se requiere 1)' % len(nuevos))
              if len(nuevos) != 1:
                  add('- **AMBIGUO: nada editado.**')
                  gate('edicion_unica', False)
              else:
                  INSERT = [
                  'def _portada_html_lab(ctx):',
                  '    modulos = ["Captura", "Creacion", "Diseno", "Exportar",',
                  '               "Biblioteca", "Presentar", "Proyeccion", "Renderizar",',
                  '               "Simulacion", "Comprension", "Mundo 4D"]',
                  '    tarjetas = "".join(',
                  '        \'<div class="mod">\' + m + \'</div>\' for m in modulos)',
                  '    html = (',
                  '        "<!doctype html><html lang=\\"es\\"><head><meta charset=\\"utf-8\\">"',
                  '        "<meta name=\\"viewport\\" content=\\"width=device-width, initial-scale=1\\">"',
                  '        "<title>LABORATORIO</title>"',
                  '        "<style>body{font-family:system-ui,sans-serif;background:#0d1117;'
                  'color:#e6edf3;max-width:720px;margin:0 auto;padding:24px 16px}"',
                  '        "h1{font-size:28px}.mod{background:#161b22;border:1px solid #30363d;"',
                  '        "border-radius:10px;padding:12px 14px;margin:8px 0}"',
                  '        ".mut{color:#8b949e}</style></head><body>"',
                  '        "<div id=\\"lab-portada\\"></div>"',
                  '        "<h1>LABORATORIO</h1>"',
                  '        "<p class=\\"mut\\">Experimentos, simulaciones y proyecciones'
                  ' dentro de ZYRA Network.</p>"',
                  '        + tarjetas +',
                  '        "<p class=\\"mut\\">ZYRA Network</p>"',
                  '        "</body></html>")',
                  '    return 200, html.encode("utf-8"), '
                  '{"Content-Type": "text/html; charset=utf-8"}',
                  ]
                  m = PAT.search(texto)
                  nuevo_texto = PAT.sub(r'\1_portada_html_lab', texto, count=1)
                  pos_def = nuevo_texto.find('_portada_html_lab')
                  ini_linea = nuevo_texto.rfind('\n', 0, pos_def) + 1
                  linea_reg = nuevo_texto[ini_linea:nuevo_texto.find(
                      '\n', ini_linea)]
                  indent = linea_reg[:len(linea_reg) - len(linea_reg.lstrip())]
                  bloque = '\n'.join(
                      (indent + ln) if ln else '' for ln in INSERT)
                  nuevo_texto = (nuevo_texto[:ini_linea] + bloque + '\n'
                                 + nuevo_texto[ini_linea:])
                  archivo.write_text(nuevo_texto, encoding='utf-8')
                  add('- Registro rewired a _portada_html_lab (mismos argumentos,'
                      ' mismo acceso que tenia).')
                  add('- Funcion de portada insertada con indent %d espacios.'
                      % len(indent))
                  gate('edicion_unica', True)
          add('')

          add('## D3. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(archivo), doraise=True)
              add('- py_compile: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
              revertir()
              add('- Archivo restaurado.')
          gate('compila', comp)
          add('')

          add('## D4. Arranque real del sistema')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN,
                      'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-a2f',
                      'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-a2f',
                      'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT),
                                  env=env, stdout=subprocess.DEVNULL,
                                  stderr=subprocess.STDOUT)
          sproc = None
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _c, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp_vivo = False
          apps = []
          if vivo:
              sproc = subprocess.Popen([sys.executable, 'superapp.py'],
                                       cwd=str(ROOT), env=env,
                                       stdout=subprocess.DEVNULL,
                                       stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sproc.poll() is not None:
                      break
                  st, _c, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      sp_vivo = True
                      try:
                          apps = list(json.loads(cuerpo).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red: %s | superapp: %s | apps: %d' % (vivo, sp_vivo, len(apps)))
          gate('sistema_arriba', vivo and sp_vivo and len(apps) == 8)
          add('')

          add('## D5. Comportamiento verificado')
          add('')
          res = {}
          if sp_vivo and not ya:
              pruebas = [
                  ('portada_con_barra', BSP + '/laboratorio/', 200, 'text/html', 'lab-portada'),
                  ('portada_sin_barra', BSP + '/laboratorio', 200, 'text/html', 'lab-portada'),
              ]
              for nombre, url, st_esp, ct_esp, marca in pruebas:
                  st, ct, cuerpo = pedir(url)
                  ok = (st == st_esp) and (ct_esp in ct.lower()) and (marca in cuerpo)
                  res[nombre] = bool(ok)
                  add('- %s: GET %s -> %s %s | %s' % (nombre, url.replace(BSP, ''),
                      st, ct[:25], 'OK' if ok else 'FALLO'))
              gate('portada_html', res.get('portada_con_barra') and
                   res.get('portada_sin_barra'))
              st, ct, cuerpo = pedir(BSP + '/laboratorio/ui')
              guard = (st == 401) and ('zid_ausente' in cuerpo)
              add('- panel /laboratorio/ui -> %s (guard ZID intacto: %s)' % (st, guard))
              gate('resto_intacto', guard)
          elif ya:
              add('- Ya aplicado: solo verificacion ligera.')
              st, ct, cuerpo = pedir(BSP + '/laboratorio/')
              ok = (st == 200 and 'text/html' in ct.lower()
                    and 'lab-portada' in cuerpo)
              add('- GET /laboratorio/ -> %s | %s' % (st, 'OK' if ok else 'FALLO'))
              gate('portada_html', ok)
              gate('resto_intacto', True)
          else:
              gate('portada_html', False)
              gate('resto_intacto', False)
          add('')

          criticos = ('edicion_unica', 'compila', 'sistema_arriba',
                      'portada_html', 'resto_intacto')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos) and not ya:
              revertir()
              add('## REVERSION APLICADA - archivo restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p in (sproc, proc):
              try:
                  if p and p.poll() is None:
                      p.terminate()
                      p.wait(timeout=10)
              except Exception:
                  try:
                      p.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**PORTADA VERIFICADA. Commit. Render desplegara automatico y'
                  ' el laboratorio se vera como app normal.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          DATA['elegida'] = elegida
          Path('faseA2.json').write_text(
              json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
              encoding='utf-8')
          escribe()
          print('A2 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          ARCHIVO=$(git diff --name-only | head -1)
          git add -A apps/laboratorio
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(laboratorio): portada HTML en la raiz en lugar de catalogo JSON"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios que commitear" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseA2-zyra
          path: faseA2.json
          if-no-files-found: ignore
