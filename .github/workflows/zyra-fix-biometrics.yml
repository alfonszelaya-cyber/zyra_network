name: ZYRA D18 icono desde la imagen del dueno

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD18:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pillow
      - name: Convertir imagen del dueno a iconos
        run: |
          python3 - <<'PYEOF'
          from PIL import Image
          from pathlib import Path
          PT = Path.cwd() / 'portal'
          maestro = PT / 'icon-master.png'
          OUT, GATES = [], []
          def add(s=''):
              OUT.append(str(s))
          if not maestro.exists():
              add('**NO EXISTE portal/icon-master.png**')
              add('Sube tu imagen con ese nombre exacto y vuelve a ejecutar.')
              escribe = Path('faseD18.md').write_text('\n'.join(OUT), encoding='utf-8')
              raise SystemExit('FALTA LA IMAGEN')
          img = Image.open(maestro).convert('RGBA')
          w, h = img.size
          lado = min(w, h)
          izq = (w - lado) // 2
          sup = (h - lado) // 2
          img = img.crop((izq, sup, izq + lado, sup + lado))
          img.resize((192, 192), Image.LANCZOS).save(PT / 'icon-192.png')
          img.resize((512, 512), Image.LANCZOS).save(PT / 'icon-512.png')
          ok1 = (PT / 'icon-192.png').stat().st_size > 500
          ok2 = (PT / 'icon-512.png').stat().st_size > 1000
          add('# D18 - ICONO DESDE TU IMAGEN')
          add('')
          add('- imagen maestra: %dx%d' % (w, h))
          add('- icon-192: %s | icon-512: %s' % ('OK' if ok1 else 'FALLO', 'OK' if ok2 else 'FALLO'))
          GATES.append(ok1 and ok2)
          add('')
          add('**ICONO = TU IMAGEN EXACTA.** Desinstala ZYRA del celular y agregala de nuevo.' if all(GATES) else 'FALLO')
          Path('faseD18.md').write_text('\n'.join(OUT), encoding='utf-8')
          print('OK' if all(GATES) else 'FALLO')
          if not all(GATES):
              raise SystemExit('FALLO')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portal/icon-192.png portal/icon-512.png
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(icono): imagen 3D elegida por el dueno"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
