          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ng2c1.out 2>&1
          echo $? > /tmp/ng2c1
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=short > /tmp/ng2c2.out 2>&1
          echo $? > /tmp/ng2c2
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ng2c3.out 2>&1
          echo $? > /tmp/ng2c3
          for par in "ng2c1 nexo" "ng2c2 shared_engines" "ng2c3 subastas"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- NG2c $2: ✅" >> "$SUM"
            else
              echo "- NG2c $2: ❌" >> "$SUM"
              { echo "### NG2c $2 detalle"; echo '```'; tail -100 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          if [ "$(cat /tmp/ng2c1)" = "0" ] && [ "$(cat /tmp/ng2c2)" = "0" ] && [ "$(cat /tmp/ng2c3)" = "0" ]; then echo 0 > /tmp/ng2c; else echo 1 > /tmp/ng2c; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in ng2a ng2b ng2c; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: NG2 VERDES — OPERATIONS CONTABLE (migrado mejorado)**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-NG2): Operations contable migrado mejorado del viejo (5 engines persistentes: ciclo de vida con numeracion por empresa y maquina de estados estricta, controles de monto/duplicado, validaciones con id unico por fila, metricas Decimal por periodo, trazabilidad de procesos) + 6 use cases reparados (firmas que el viejo llamaba no existian) + use case costo logistico contable (regla 70) (NG2 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — NG2 CERRADO. Sigue NG3 Accounting Core I.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
