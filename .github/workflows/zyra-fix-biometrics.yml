name: "ZYRA RUN2a v2: S-7 asignacion automatica + smoke HTTP corregido + auditoria ciclo para 2b"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] S-7: auto_assignment_engine (validado 4/4 en run anterior)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/domain/academic/auto_assignment_engine.py",
                     D(r'''
                  """Auto Assignment Engine (S-7) - asignacion
                  automatica de matricula.

                  Flujo del dueno: encuentra escuela -> comprueba
                  grado/jornada/CUPO REAL -> selecciona seccion/
                  aula -> confirma matricula (enroll: el cupo se
                  reclama UNA SOLA VEZ).

                  - Si el alumno tiene institucion en su expediente
                    canonico, SOLO busca ahi (la escuela del
                    expediente manda).
                  - Si no, DESCUBRE escuelas con secciones de ese
                    nivel/grado y cupo disponible (via
                    available_sections, que solo devuelve secciones
                    CON cupo — verificado en fix2).
                  - Respeta la preferencia de turno en orden;
                    JAMAS asigna un turno fuera del orden pedido.
                  - NO_CUPOS honesto (regla 66): nota con lo
                    intentado y turnos con cupo por escuela.
                  - preview(): muestra el plan SIN enrollar.

                  Solo APIs verificadas en verde: available_sections,
                  enroll, get (StudentRegistryEngine)."""
                  from __future__ import annotations
                  from typing import Dict, List, Optional
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)

                  _TURNS = ("MATUTINA", "VESPERTINA",
                            "NOCTURNA")


                  class AutoAssignmentEngine:
                      """Asignacion automatica (S-7)."""

                      def __init__(self, db, clock,
                                   student_registry,
                                   classroom_engine,
                                   enrollment_engine):
                          self._db = db
                          self._clock = clock
                          self._students = student_registry
                          self._cls = classroom_engine
                          self._enr = enrollment_engine

                      def _instituciones(self, *, student_id,
                                         institution_id,
                                         school_year, level,
                                         grade) -> List[str]:
                          if str(institution_id).strip():
                              return [str(institution_id)]
                          est = self._students.get(
                              str(student_id))
                          home = str((est or {}).get(
                              "institution_id") or "")
                          if home:
                              return [home]
                          rows = self._db.query_all(
                              "SELECT DISTINCT institution_id"
                              " FROM sm_classrooms WHERE"
                              " school_year = ? AND level = ?"
                              " AND grade = ?",
                              (str(school_year),
                               str(level), str(grade)))
                          return sorted(set(
                              str(r["institution_id"])
                              for r in rows))

                      def _opciones(self, iid, *, school_year,
                                    level, grade) -> List[dict]:
                          try:
                              return list(
                                  self._cls.available_sections(
                                      institution_id=iid,
                                      school_year=str(school_year),
                                      level=str(level),
                                      grade=str(grade)))
                          except Exception:
                              return []

                      def preview(self, *, student_id, level,
                                  grade, turn_order=None,
                                  institution_id="",
                                  school_year="2026") -> dict:
                          """Plan sin enrollar (lectura)."""
                          orden = [t for t in (
                              turn_order or list(_TURNS))]
                          iids = self._instituciones(
                              student_id=student_id,
                              institution_id=institution_id,
                              school_year=school_year,
                              level=level, grade=grade)
                          plan = []
                          for iid in iids:
                              ops = self._opciones(
                                  iid, school_year=school_year,
                                  level=level, grade=grade)
                              plan.append({
                                  "institution_id": iid,
                                  "turnos_con_cupo": sorted(
                                      set(str(o["turn"])
                                          for o in ops)),
                                  "secciones": [
                                      {"classroom_id":
                                           str(o["classroom_id"]),
                                       "turn": str(o["turn"])}
                                      for o in ops]})
                          return {"student_id":
                                      str(student_id),
                                  "level": str(level),
                                  "grade": str(grade),
                                  "turn_order": orden,
                                  "plan": plan}

                      def assign(self, *, student_id, level,
                                 grade, turn_order=None,
                                 institution_id="",
                                 school_year="2026") -> dict:
                          """Asigna: escuela -> turno pedido ->
                          seccion con cupo -> enroll (cupo UNA
                          vez). NO_CUPOS honesto si nada aplica."""
                          orden = [str(t).upper() for t in (
                              turn_order or list(_TURNS))]
                          iids = self._instituciones(
                              student_id=student_id,
                              institution_id=institution_id,
                              school_year=school_year,
                              level=level, grade=grade)
                          tried = []
                          for iid in iids:
                              ops = self._opciones(
                                  iid, school_year=school_year,
                                  level=level, grade=grade)
                              for turno in orden:
                                  for op in ops:
                                      if str(op["turn"]) \
                                              != turno:
                                          continue
                                      enr = self._enr.enroll(
                                          student_id=str(
                                              student_id),
                                          classroom_id=str(
                                              op["classroom_id"]),
                                          school_year=str(
                                              school_year))
                                      return {
                                          "status": "ASIGNADO",
                                          "student_id": str(
                                              student_id),
                                          "institution_id": iid,
                                          "classroom_id": str(
                                              op["classroom_id"]),
                                          "turn": turno,
                                          "enrollment": enr}
                              tried.append({
                                  "institution_id": iid,
                                  "turnos_con_cupo": sorted(
                                      set(str(o["turn"])
                                          for o in ops)),
                                  "turnos_pedidos": orden})
                          return {
                              "status": "NO_CUPOS",
                              "student_id": str(student_id),
                              "level": str(level),
                              "grade": str(grade),
                              "turn_order": orden,
                              "tried": tried,
                              "note": ("sin seccion con cupo"
                                       " para " + str(level)
                                       + " " + str(grade)
                                       + " en turnos "
                                       + ", ".join(orden)
                                       + " (escuelas"
                                         " intentadas: "
                                       + str(len(tried))
                                       + ")")}
              '''))
              out("## FIN builder S-7")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[LECTURA] fuentes COMPLETAS de los 7 engines del ciclo (RUN 2b)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA 2b — fuentes completas (firmas exactas, sin asumir)" >> "$SUM"
          for f in apps/semilla/domain/attendance/attendance_engine.py apps/semilla/domain/evaluation/evaluation_engine.py apps/semilla/domain/notifications/alert_engine.py apps/semilla/domain/notifications/incident_engine.py apps/semilla/domain/family/family_engine.py apps/semilla/domain/academic/academic_history_engine.py apps/semilla/domain/academic/calendar_engine.py; do
            echo "### $f" >> "$SUM"
            { echo '```python'; cat "$f" 2>/dev/null; echo '```'; } >> "$SUM"
          done
          echo "### fin auditoria 2b" >> "$SUM"
          exit 0

      - name: "[ESCRITURA tests] smoke HTTP (CORREGIDO: constantes, sin dict anidado fragil) + tests S-7"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_s7_autoassign.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.student.student_registry_engine import StudentRegistryEngine
          from apps.semilla.domain.classroom.classroom_engine import ClassroomEngine
          from apps.semilla.domain.academic.enrollment_engine import EnrollmentEngine
          from apps.semilla.domain.academic.auto_assignment_engine import AutoAssignmentEngine

          PICK2 = [{"name": "Mama", "relation": "MADRE"},
                   {"name": "Papa", "relation": "PADRE"}]
          EMG = [{"name": "Tio", "relation": "TIO", "phone": "911"}]

          def _env(tmp_path):
              db = SQLiteAdapter(tmp_path / "a.db")
              clock = FrozenClock()
              students = StudentRegistryEngine(db, clock)
              cls = ClassroomEngine(db, clock)
              en = EnrollmentEngine(db, clock, classroom_engine=cls)
              s7 = AutoAssignmentEngine(db, clock,
                  student_registry=students,
                  classroom_engine=cls, enrollment_engine=en)
              return db, students, cls, en, s7

          def _alumno(students, **over):
              kw = {"full_name": "Alumno S7", "level": "BASICA",
                    "grade": "1", "institution_id": "",
                    "tutores": [{"name": "Mama",
                                 "relation": "MADRE",
                                 "zid": "ZID-M-7"}],
                    "authorized_pickup": PICK2,
                    "emergency_contacts": EMG,
                    "zid": "ZID-S7", "zid_status": "PROVISIONAL"}
              kw.update(over)
              return students.register(**kw)

          def test_asigna_escuela_indicada_preferencia_turno(tmp_path) -> None:
              db, students, cls, en, s7 = _env(tmp_path)
              am = cls.create(name="1A", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=2)
              at = cls.create(name="1T", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="VESPERTINA", capacity=5)
              est = _alumno(students)
              r = s7.assign(student_id=est["student_id"],
                  level="BASICA", grade="1")
              assert r["status"] == "ASIGNADO"
              assert r["turn"] == "MATUTINA"
              assert r["classroom_id"] == am["classroom_id"]
              assert cls.get(am["classroom_id"])["enrolled"] == 1
              assert cls.get(at["classroom_id"])["enrolled"] == 0
              pv = s7.preview(student_id=est["student_id"],
                  level="BASICA", grade="1")
              assert any(p["turnos_con_cupo"] == ["MATUTINA",
                         "VESPERTINA"] for p in pv["plan"])
              print("OK S-7: asigna en la escuela indicada, preferencia MATUTINA primero, cupo contado UNA vez, preview sin enrollar")

          def test_respeta_expediente_del_alumno(tmp_path) -> None:
              db, students, cls, en, s7 = _env(tmp_path)
              a1 = cls.create(name="1A-A", institution_id="INST-A",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=1)
              b1 = cls.create(name="1B-B", institution_id="INST-B",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=30)
              est = _alumno(students, institution_id="INST-A")
              r = s7.assign(student_id=est["student_id"],
                  level="BASICA", grade="1")
              assert r["status"] == "ASIGNADO"
              assert r["institution_id"] == "INST-A"
              assert cls.get(b1["classroom_id"])["enrolled"] == 0
              print("OK S-7: la escuela del expediente manda aunque otra tenga mas cupo")

          def test_descubre_escuela_con_cupo(tmp_path) -> None:
              db, students, cls, en, s7 = _env(tmp_path)
              b1 = cls.create(name="2B", institution_id="INST-B",
                  school_year="2026", level="BASICA", grade="2",
                  section="A", turn="VESPERTINA", capacity=3)
              est = _alumno(students)
              r = s7.assign(student_id=est["student_id"],
                  level="BASICA", grade="2",
                  turn_order=["MATUTINA", "VESPERTINA"])
              assert r["status"] == "ASIGNADO"
              assert r["institution_id"] == "INST-B"
              assert r["turn"] == "VESPERTINA"
              print("OK S-7: sin escuela indicada DESCUBRE la que tiene cupo real y respeta el orden de turnos")

          def test_no_cupos_honesto(tmp_path) -> None:
              db, students, cls, en, s7 = _env(tmp_path)
              a1 = cls.create(name="3A", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="3",
                  section="A", turn="MATUTINA", capacity=1)
              en.enroll(student_id="OTRO-X",
                  classroom_id=a1["classroom_id"],
                  school_year="2026")
              est = _alumno(students)
              r = s7.assign(student_id=est["student_id"],
                  level="BASICA", grade="3")
              assert r["status"] == "NO_CUPOS"
              assert "MATUTINA" in r["note"]
              assert r["tried"][0]["turnos_con_cupo"] == []
              assert cls.get(a1["classroom_id"])["enrolled"] == 1
              print("OK S-7 honesto (regla 66): aula llena -> NO_CUPOS con nota clara, jamas inventa cupo")
          TSEOF
          cat > apps/semilla/tests/test_1e_smoke_http.py << 'TSEOF'
          import json
          import pathlib
          import threading
          import urllib.error
          import urllib.request
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.infrastructure.persistence.semilla_store import SemillaStore
          from apps.semilla.domain.classroom.classroom_engine import ClassroomEngine
          from apps.semilla.server import serve_semilla

          PICK2 = [{"name": "Mama", "relation": "MADRE"},
                   {"name": "Papa", "relation": "PADRE"}]
          EMG = [{"name": "Tio", "relation": "TIO", "phone": "911"}]


          class _DummyClient:
              pass


          def _call(base, path, method="GET", doc=None):
              data = None
              headers = {}
              if doc is not None:
                  data = json.dumps(doc).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path,
                  data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req,
                                              timeout=10) as r:
                      return (r.status, json.loads(
                          r.read().decode("utf-8")))
              except urllib.error.HTTPError as e:
                  return (e.code, json.loads(
                      e.read().decode("utf-8")))


          def _doc():
              return {
                  "responsable_zid": "ZID-PADRE-SM",
                  "responsable_name": "Padre Smoke",
                  "relation": "PADRE",
                  "child_name": "Nino Smoke",
                  "birth_date": "2019-05-10",
                  "child_zid": "ZID-BABY-SM",
                  "child_zid_status": "VERIFIED",
                  "institution_id": "INST-1",
                  "level": "BASICA",
                  "grade": "1",
                  "turn": "MATUTINA",
                  "authorized_pickup": PICK2,
                  "emergency_contacts": EMG}


          def test_smoke_http_punta_a_punta(tmp_path) -> None:
              src = pathlib.Path(
                  "apps/semilla/server.py").read_text(
                  encoding="utf-8")
              if "_HR_V2" not in src:
                  pytest.skip("wiring S-4 no presente")
              db = SQLiteAdapter(tmp_path / "s.db")
              st = SemillaStore(db, FrozenClock())
              cls = ClassroomEngine(db, FrozenClock())
              cls.create(name="1A", institution_id="INST-1",
                  school_year="2026", level="BASICA",
                  grade="1", section="A", turn="MATUTINA",
                  capacity=30)
              cls.create(name="1T", institution_id="INST-1",
                  school_year="2026", level="BASICA",
                  grade="1", section="A", turn="VESPERTINA",
                  capacity=5)
              server = serve_semilla(st, _DummyClient(),
                  host="127.0.0.1", port=0)
              base = ("http://127.0.0.1:"
                      + str(server.bound_port))
              t = threading.Thread(
                  target=server.serve_forever, daemon=True)
              t.start()
              try:
                  code, health = _call(base,
                      "/semilla/api/health")
                  assert code == 200
                  assert health["ok"] is True
                  code, p = _call(base,
                      "/semilla/api/home-registration",
                      method="POST", doc=_doc())
                  assert code == 201
                  rid = p["request"]["request_id"]
                  code2, p2 = _call(base,
                      "/semilla/api/home-registration/"
                      + rid + "/confirm", method="POST",
                      doc={"director_actor": "DIR-SM"})
                  assert code2 == 200
                  assert p2["status"] == "ACTIVA"
                  assert p2["student"]["zid"] == "ZID-BABY-SM"
                  code3, p3 = _call(base,
                      "/semilla/api/home-registrations"
                      "?institution_id=INST-1")
                  assert code3 == 200
                  assert p3["count"] == 0
                  code4, p4 = _call(base,
                      "/semilla/api/home-registration",
                      method="POST", doc={})
                  assert code4 == 400
                  print("OK SMOKE HTTP REAL: socket vivo -> health 200 -> start 201 -> confirm 200 ACTIVA (ZID nacimiento, cupo UNA vez) -> pendientes -> 400 honesto")
              finally:
                  server.shutdown()
                  server.server_close()
                  t.join(timeout=5)
          TSEOF
          python3 - << 'ASTEOF'
          import ast
          for f in ("apps/semilla/tests/test_1e_smoke_http.py",
                    "apps/semilla/tests/test_s7_autoassign.py"):
              ast.parse(open(f, encoding="utf-8").read())
              print("AST OK:", f)
          ASTEOF
          timeout 240 python3 -m pytest apps/semilla/tests/test_1e_smoke_http.py -vv --tb=long --timeout=60 --timeout-method=thread > /tmp/smoke.out 2>&1
          echo $? > /tmp/smoke
          timeout 240 python3 -m pytest apps/semilla/tests/test_s7_autoassign.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/s7.out 2>&1
          echo $? > /tmp/s7
          if [ "$(cat /tmp/smoke)" = "0" ]; then echo "- Smoke HTTP (1e): ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- Smoke HTTP (1e): ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### Smoke detalle"; echo '```'; tail -60 /tmp/smoke.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$(cat /tmp/s7)" = "0" ]; then echo "- S-7: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- S-7: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### S-7 detalle"; echo '```'; tail -60 /tmp/s7.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si todo verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/smoke 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/s7 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: rojo — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/semilla
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(SEMILLA RUN2a v2): S-7 AutoAssignmentEngine (asignacion automatica: escuela del expediente manda, descubrimiento por cupo real, orden de turnos, enroll cupo UNA vez, NO_CUPOS honesto, preview sin enrollar) + smoke HTTP REAL punta a punta corregido (constantes PICK2/EMG en vez de dict anidado — el typo ]} del run anterior era sintaxis del TEST, el engine nunca estuvo roto) + guarda AST de tests antes de pytest + auditoria de fuentes completas de los 7 engines del ciclo para RUN 2b"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — S-4 PUNTA A PUNTA (smoke real) + S-7 CERRADOS. RUN 2b: S-5 ciclo + S-6 asistencia vinculada + S-9 notas + S-10 examenes, con las firmas EXACTAS de los 7 engines impresas arriba.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
