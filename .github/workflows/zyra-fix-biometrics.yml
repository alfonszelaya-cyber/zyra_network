name: "ZYRA RED-EXP-2: full_legal_view consular"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir full_legal_view + test consular
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          METODO = (
              '\n'
              '    def full_legal_view(\n'
              '        self,\n'
              '        *,\n'
              '        zid: str,\n'
              '    ) -> dict[str, object]:\n'
              '        """RED-EXP-2: expediente\n'
              '        legal completo para\n'
              '        consulados y autoridades.\n'
              '        Universalidad (un ZID,\n'
              '        cualquier autoridad),\n'
              '        frescura visible por campo,\n'
              '        ciclo de vida de documentos,\n'
              '        consentimientos y estado de\n'
              '        congelamiento. Informa, no\n'
              '        juzga: la vigencia de fechas\n'
              '        la marca cada documento."""\n'
              '        require_non_empty_str(\n'
              '            zid, "zid")\n'
              '        now = self._clock.now()\n'
              '        campos = self._db.query_all(\n'
              '            "SELECT field, value, level,"\n'
              '            " updated_at FROM"\n'
              '            " profile_fields"\n'
              '            " WHERE zid = ?"\n'
              '            " ORDER BY field",\n'
              '            (zid,))\n'
              '        identity_fields = tuple(\n'
              '            {\n'
              '                "field": str(\n'
              '                    r["field"]),\n'
              '                "value": str(\n'
              '                    r["value"]),\n'
              '                "level": str(\n'
              '                    r["level"]),\n'
              '                "updated_at": float(\n'
              '                    r["updated_at"]),\n'
              '                "age_seconds": round(\n'
              '                    now - float(\n'
              '                        r["updated_at"]),\n'
              '                    3),\n'
              '            }\n'
              '            for r in campos)\n'
              '        rows_doc = self._db.query_all(\n'
              '            "SELECT document_id,"\n'
              '            " doc_type, doc_number,"\n'
              '            " issuing_country, status,"\n'
              '            " verification_status,"\n'
              '            " expiry_date, added_at"\n'
              '            " FROM identity_documents"\n'
              '            " WHERE zid = ?"\n'
              '            " ORDER BY added_at",\n'
              '            (zid,))\n'
              '        documents = tuple(\n'
              '            {\n'
              '                "document_id": str(\n'
              '                    r["document_id"]),\n'
              '                "doc_type": str(\n'
              '                    r["doc_type"]),\n'
              '                "doc_number": str(\n'
              '                    r["doc_number"]),\n'
              '                "issuing_country": str(\n'
              '                    r["issuing_country"]),\n'
              '                "status": str(\n'
              '                    r["status"]),\n'
              '                "verification_status": str(\n'
              '                    r["verification_status"]),\n'
              '                "expiry_date": str(\n'
              '                    r["expiry_date"] or ""),\n'
              '                "added_at": float(\n'
              '                    r["added_at"]),\n'
              '                "age_seconds": round(\n'
              '                    now - float(\n'
              '                        r["added_at"]),\n'
              '                    3),\n'
              '            }\n'
              '            for r in rows_doc)\n'
              '        assurance = (\n'
              '            self.assurance_level(\n'
              '                zid=zid))\n'
              '        consents = self.consents_of(\n'
              '            zid=zid)\n'
              '        activos = [\n'
              '            c for c in consents\n'
              '            if not c["revoked"]\n'
              '            and c["expires_at"] > now]\n'
              '        revocados = [\n'
              '            d for d in documents\n'
              '            if d["status"] == "REVOKED"]\n'
              '        self._audit.append(\n'
              '            event_type=(\n'
              '                "network.legal_view"\n'
              '                ".generated"),\n'
              '            actor=zid,\n'
              '            subject=zid,\n'
              '            payload={\n'
              '                "docs": len(documents),\n'
              '                "fields": len(\n'
              '                    identity_fields),\n'
              '            })\n'
              '        return {\n'
              '            "zid": zid,\n'
              '            "generated_at": now,\n'
              '            "identity_fields": (\n'
              '                identity_fields),\n'
              '            "documents": documents,\n'
              '            "assurance": assurance,\n'
              '            "consents": consents,\n'
              '            "frozen": bool(\n'
              '                self.is_frozen(\n'
              '                    zid=zid)),\n'
              '            "legal_summary": {\n'
              '                "countries": assurance[\n'
              '                    "countries"],\n'
              '                "verified_documents": int(\n'
              '                    assurance[\n'
              '                        "verified_documents"]),\n'
              '                "revoked_documents": len(\n'
              '                    revocados),\n'
              '                "active_consents": len(\n'
              '                    activos),\n'
              '            },\n'
              '        }\n'
              '\n'
          )
          p = pathlib.Path("shared_engines/network/portable_profile.py")
          src = p.read_text(encoding="utf-8")
          if "def full_legal_view" in src:
              out("- **EXP2 metodo: YA**")
          else:
              tree = ast.parse(src)
              fin = None
              for node in tree.body:
                  if (isinstance(node, ast.ClassDef)
                          and node.name == "ProfileRegistry"):
                      fin = node.end_lineno
              if fin is None:
                  raise RuntimeError("clase ProfileRegistry no hallada")
              lineas = src.splitlines(keepends=True)
              nuevo = "".join(lineas[:fin]) + METODO + "".join(lineas[fin:])
              ast.parse(nuevo)
              p.write_text(nuevo, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              out("- **EXP2 metodo: OK (insertado al final de la clase por AST)**")
          TEST = (
              '\n'
              '\n'
              'def test_full_legal_view_consular(\n'
              '    tmp_path,\n'
              ') -> None:\n'
              '    """RED-EXP-2: vista legal\n'
              '    completa para consulados:\n'
              '    frescura por campo, ciclo de\n'
              '    vida de documentos, assurance,\n'
              '    consentimientos, congelamiento."""\n'
              '    from shared_engines.network.portable_profile import (\n'
              '        ProfileRegistry)\n'
              '    from shared_engines.audit.chain import (\n'
              '        AuditTrail)\n'
              '    from shared_engines.events.outbox import (\n'
              '        Outbox)\n'
              '    from shared_engines.storage.database import (\n'
              '        SQLiteAdapter)\n'
              '    from shared_engines.common.clocks import (\n'
              '        FrozenClock)\n'
              '    from shared_engines.runtime.config import (\n'
              '        RuntimeConfig)\n'
              '    from shared_engines.runtime.kernel import (\n'
              '        ZyraKernel)\n'
              '    from shared_engines.verification.signatures import (\n'
              '        Ed25519Signer)\n'
              '    from shared_engines.security.biometrics import (\n'
              '        BiometricsEngine, BiometricsPolicy,\n'
              '        DeterministicTestProvider, TemplateCipher)\n'
              '    db = SQLiteAdapter(\n'
              '        tmp_path / "exp2.db")\n'
              '    clock = FrozenClock()\n'
              '    signer, _ = Ed25519Signer.generate()\n'
              '    kernel = ZyraKernel(\n'
              '        db=db, clock=clock,\n'
              '        signer=signer,\n'
              '        config=RuntimeConfig(\n'
              '            host="127.0.0.1", port=0,\n'
              '            api_token=None))\n'
              '    kernel.bootstrap_root()\n'
              '    kernel._biometrics = BiometricsEngine(\n'
              '        db=db, clock=clock,\n'
              '        audit=kernel.audit,\n'
              '        provider=DeterministicTestProvider(),\n'
              '        cipher=TemplateCipher(\n'
              '            master_key_hex="ab" * 32),\n'
              '        policy=BiometricsPolicy(\n'
              '            require_liveness=False,\n'
              '            doc_reject=0.01,\n'
              '            doc_review=0.02,\n'
              '            doc_auto=0.03,\n'
              '            dup_reject=0.98))\n'
              '    reg = ProfileRegistry(\n'
              '        db, clock,\n'
              '        audit=AuditTrail(db, clock),\n'
              '        outbox=Outbox(db, clock))\n'
              '    reg.register_app(\n'
              '        app_id="consulado-sv",\n'
              '        display_name="Consulado SV",\n'
              '        scopes=("display_name",\n'
              '                "id_country"))\n'
              '    zid = "ZID-exp2-00000001"\n'
              '    reg.set_field(\n'
              '        zid=zid, field="display_name",\n'
              '        value="Pedro Exp2",\n'
              '        verified=True)\n'
              '    reg.set_field(\n'
              '        zid=zid, field="id_country",\n'
              '        value="SV", verified=True)\n'
              '    reg.set_field(\n'
              '        zid=zid, field="id_type",\n'
              '        value="dui", verified=True)\n'
              '    reg.set_field(\n'
              '        zid=zid, field="birth_date",\n'
              '        value="1992-04-04",\n'
              '        verified=True)\n'
              '    reg.add_document(\n'
              '        zid=zid, doc_type="dui",\n'
              '        doc_number="00000000-0",\n'
              '        issuing_country="SV",\n'
              '        verified=True,\n'
              '        verified_by="RNPN")\n'
              '    d2 = reg.add_document(\n'
              '        zid=zid, doc_type="passport",\n'
              '        doc_number="US-PASS-9",\n'
              '        issuing_country="US",\n'
              '        verified=True,\n'
              '        verified_by="StateDept")\n'
              '    reg.revoke_document(\n'
              '        zid=zid,\n'
              '        document_id=d2["document_id"],\n'
              '        reason="perdida")\n'
              '    reg.grant_consent(\n'
              '        zid=zid,\n'
              '        app_id="consulado-sv",\n'
              '        fields=("display_name",\n'
              '                "id_country"),\n'
              '        face_score=0.99)\n'
              '    vista = reg.full_legal_view(\n'
              '        zid=zid)\n'
              '    assert vista["zid"] == zid, (\n'
              '        str(vista)[:200])\n'
              '    assert len(\n'
              '        vista["identity_fields"]) == 4\n'
              '    for f in vista["identity_fields"]:\n'
              '        assert "age_seconds" in f\n'
              '        assert "level" in f\n'
              '    docs = vista["documents"]\n'
              '    assert len(docs) == 2\n'
              '    estados = sorted(\n'
              '        d["status"] for d in docs)\n'
              '    assert estados == [\n'
              '        "REVOKED", "VALID"], str(estados)\n'
              '    ls = vista["legal_summary"]\n'
              '    assert ls["revoked_documents"] == 1\n'
              '    assert ls["verified_documents"] == 1\n'
              '    assert (vista["assurance"]\n'
              '            ["assurance_level"] == 2), (\n'
              '        str(vista["assurance"]))\n'
              '    assert len(vista["consents"]) >= 1\n'
              '    assert vista["frozen"] is False\n'
              '    assert vista["generated_at"] > 0\n'
              '    print("OK RED-EXP-2: full_legal_view"\n'
              '          " con frescura por campo,"\n'
              '          " ciclo de vida, assurance,"\n'
              '          " consentimientos y congelamiento")\n'
          )
          t = pathlib.Path("shared_engines/network/tests/test_portable_identity.py")
          tsrc = t.read_text(encoding="utf-8")
          if "test_full_legal_view_consular" in tsrc:
              out("- **EXP2 test: YA**")
          else:
              if not tsrc.endswith("\n"):
                  tsrc += "\n"
              tsrc = tsrc + TEST
              ast.parse(tsrc)
              t.write_text(tsrc, encoding="utf-8")
              py_compile.compile(str(t), doraise=True)
              out("- **EXP2 test: OK**")
          EOF

      - name: "E1: test full_legal_view"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 120 python3 -m pytest "shared_engines/network/tests/test_portable_identity.py::test_full_legal_view_consular" -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/e1.out 2>&1
          echo $? > /tmp/e1
          if [ "$(cat /tmp/e1)" = "0" ]; then echo "- E1 full_legal_view: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- E1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### E1 detalle"; echo '```'; tail -60 /tmp/e1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "E2: suite portable_identity completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 300 python3 -m pytest shared_engines/network/tests/test_portable_identity.py -q --timeout=45 --timeout-method=thread --tb=short > /tmp/e2.out 2>&1
          echo $? > /tmp/e2
          if [ "$(cat /tmp/e2)" = "0" ]; then echo "- E2 portable_identity: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- E2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### E2 detalle"; echo '```'; tail -50 /tmp/e2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "E3: regresion shared_engines completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/e3.out 2>&1
          echo $? > /tmp/e3
          if [ "$(cat /tmp/e3)" = "0" ]; then echo "- E3 shared_engines: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- E3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### E3 detalle"; echo '```'; tail -60 /tmp/e3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in e1 e2 e3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: E1+E2+E3 VERDES**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(RED-EXP-2): full_legal_view consular - frescura por campo, ciclo de vida, auditada (E1-E3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/p1.out 2> /tmp/p1.err
          if [ $? -eq 0 ]; then log "**PUSH OK — PUNTO 3 (RED-EXP-2) CERRADO.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/p1.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/p2.out 2> /tmp/p2.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2) — PUNTO 3 CERRADO.**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/p2.err; echo '```'; } >> "$SUM"
          exit 1
