              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              luz = cuerpo["datos"]["lighting"]
              assert len(luz["pasos"]) == 3
              assert luz["color_dominate"] == "#22D3EE"
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/lighting", {
                  "pasos": [{"t": 0, "color": "rojo", "intensidad": 1}],
