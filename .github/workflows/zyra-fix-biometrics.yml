name: "ZYRA RUN8b: auditoria COMPLETA de shared_engines (Red=auditoria obligatoria regla del dueno) + fix 1 linea test R-2 + verificacion no-colision"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] AUDITORIA COMPLETA shared_engines (la Red es delicada: sin tocar nada, mapa + colisiones)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA RED (obligatoria — regla del dueno)" >> "$SUM"
          echo "### arbol shared_engines (3 niveles)" >> "$SUM"
          { echo '```'; find shared_engines -maxdepth 3 -type d 2>/dev/null | grep -v __pycache__ | sort; echo '```'; } >> "$SUM"
          echo "### TODOS los archivos py con lineas" >> "$SUM"
          { echo '```'; find shared_engines -name "*.py" 2>/dev/null | grep -v __pycache__ | while read f; do echo "$(wc -l < "$f") $f"; done | sort -rn | head -50; echo '```'; } >> "$SUM"
          echo "### engines de identidad existentes (class+def)" >> "$SUM"
          { echo '```'; for f in shared_engines/identity/*.py; do [ -f "$f" ] || continue; case "$f" in *__init__*|*tests*) continue;; esac; echo "== $f"; grep -n "^class \|    def \|^def " "$f" | head -20; done; echo '```'; } >> "$SUM"
          echo "### posibles COLISIONES con mis 7 nuevos (mismos nombres de clase o tabla zid_*)" >> "$SUM"
          { echo '```'; echo "-- clases existentes:"; grep -rhn "^class " shared_engines/identity shared_engines/protocol --include="*.py" 2>/dev/null | grep -v __pycache__ | sort -u; echo "-- tablas zid_* existentes ANTES de mis engines:"; grep -rn "zid_" shared_engines --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v "birth_registry_engine\|guardian_link_engine\|biometric_lifecycle_engine\|representation_engine\|capability_engine\|signatures_engine\|network_registry_engine\|test_zid_red" | head -20; echo '```'; } >> "$SUM"
          echo "### imports de identity desde las apps (quien consume hoy)" >> "$SUM"
          { echo '```'; grep -rn "from shared_engines.identity\|import shared_engines.identity\|from shared_engines.protocol" apps --include="*.py" 2>/dev/null | grep -v __pycache__ | head -15; echo '```'; } >> "$SUM"
          echo "### veredicto colision" >> "$SUM"
          COL=$(grep -rln "class BirthRegistryEngine\|class GuardianLinkEngine\|class BiometricLifecycleEngine\|class RepresentationEngine\|class CapabilityEngine\|class SessionSignatureEngine\|class NetworkRegistryEngine" shared_engines --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v "birth_registry_engine.py\|guardian_link_engine.py\|biometric_lifecycle_engine.py\|representation_engine.py\|capability_engine.py\|signatures_engine.py\|network_registry_engine.py" | wc -l)
          echo "clases duplicadas fuera de mis archivos: $COL (0=limpio)" >> "$SUM"
          echo "### fin auditoria" >> "$SUM"
          exit 0

      - name: "[ESCRITURA] fix 1 linea test R-2 (role requerido en validaciones) + verificacion de integridad de los 7 engines existentes"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          P = pathlib.Path("shared_engines/identity/tests/test_zid_red.py")
          try:
              src = P.read_text(encoding="utf-8")
              old = ('''              with pytest.raises(ValueError):
                  gl.link(guardian_zid=" ", minor_zid="ZID-M")''')
              new = ('''              with pytest.raises(ValueError):
                  gl.link(guardian_zid=" ",
                          minor_zid="ZID-M",
                          role="TUTOR")
              with pytest.raises(ValueError):
                  gl.link(guardian_zid="ZID-P",
                          minor_zid="ZID-M",
                          role=" ")''')
              if new in src:
                  out("- test R-2: ya corregido")
              elif old in src:
                  P.write_text(src.replace(old, new, 1),
                               encoding="utf-8")
                  py_compile.compile(str(P), doraise=True)
                  out("- **test R-2: OK (2 validaciones con"
                      " role completo)**")
              else:
                  out("- test R-2: patron no hallado"
                      " (revisar)")
          except Exception:
              out("- test fix ERROR")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
          MY7 = ["birth_registry_engine.py",
                 "guardian_link_engine.py",
                 "biometric_lifecycle_engine.py",
                 "representation_engine.py",
                 "capability_engine.py",
                 "signatures_engine.py",
                 "network_registry_engine.py"]
          ok = True
          for f in MY7:
              for base in ("shared_engines/identity/",
                           "shared_engines/protocol/"
                           "sessions/"):
                  p = pathlib.Path(base + f)
                  if p.exists():
                      try:
                          py_compile.compile(str(p),
                                             doraise=True)
                      except Exception:
                          ok = False
                          out("- **" + f + ": COMPILE FAIL**")
          out("- **integridad 7 engines: "
              + ("OK (compilan, nada pisado)" if ok
                 else "FALLO") + "**")
          exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests Red (misma suite + fix R-2)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 240 python3 -m pytest shared_engines/identity/tests/test_zid_red.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/r8.out 2>&1
          echo $? > /tmp/r8
          if [ "$(cat /tmp/r8)" = "0" ]; then echo "- RUN 8b (Red/ZID): ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- RUN 8b: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### RUN 8b detalle"; echo '```'; tail -100 /tmp/r8.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps + Red"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si todo verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/r8 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: rojo — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "fix(RED RUN8b): auditoria COMPLETA de shared_engines ANTES de tocar (regla nueva del dueno: Red = auditoria obligatoria SIEMPRE, la Red alimenta todas las apps) + mapa de colisiones (0 clases duplicadas verificadas) + fix test R-2 (link() exige role — 2 validaciones completas) + verificacion de integridad de los 7 engines de R-1..R-9 (compilan, nada existente pisado)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — RED/ZID VERIFICADO CON AUDITORIA (R-1..R-9 + no-colision). RUN 9 FINAL: calidad (N-8/10/11 + A-15..19) + GOV-DATA 3 capas + alarmas ZYRA — cierre del plan.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
