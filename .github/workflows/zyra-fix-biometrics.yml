name: zyra-fix-biometrics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zyra-fix-biometrics
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  corregir-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Fase 1-3 · Auditoría previa + Correcciones + Pruebas en vivo'
        run: |
          cat > "$RUNNER_TEMP/zyra_fix.py" <<'ZYPY_FIN'
          # -*- coding: utf-8 -*-
          # ZYRA · Corrección completa del registro ZID · Auditoría previa + parches + pruebas
          # Reglas: auditar antes de modificar · no se crea ningún archivo nuevo en el repo ·
          # solo se agregan líneas (no se borra nada) · código 100% producción · agnóstico de país.
          import os, re, sys, json, subprocess, py_compile

          WS  = os.environ.get('GITHUB_WORKSPACE') or os.getcwd()
          TMP = os.environ.get('RUNNER_TEMP') or '/tmp'
          SUM = os.environ.get('GITHUB_STEP_SUMMARY') or os.path.join(TMP, 'summary.md')

          P_SUP = os.path.join(WS, 'superapp.py')
          P_BF  = os.path.join(WS, 'shared_engines', 'security', 'biometrics_face.py')

          CRITICOS = []

          def W(s=''):
              with open(SUM, 'a', encoding='utf-8') as f:
                  f.write(s + '\n')

          def critico(msg):
              CRITICOS.append(str(msg))

          sup = open(P_SUP, encoding='utf-8').read()
          SUP0 = sup
          try:
              bf = open(P_BF, encoding='utf-8').read()
          except Exception:
              bf = ''

          def guardar_sup(t):
              with open(P_SUP, 'w', encoding='utf-8') as f:
                  f.write(t)

          def lin(txt):
              return txt.splitlines()

          def dump(ancla, antes=6, desp=24, titulo='', texto=None):
              t = sup if texto is None else texto
              ls = lin(t)
              idx = next((i for i, l in enumerate(ls) if ancla in l), -1)
              W('<details><summary><b>%s</b> · ancla: <code>%s</code></summary>' % (titulo or 'Zona', ancla[:60]))
              W('```')
              if idx < 0:
                  W('ANCLA NO ENCONTRADA: ' + ancla)
              else:
                  a = max(0, idx - antes); b = min(len(ls), idx + desp)
                  for i in range(a, b):
                      W('%5d| %s' % (i + 1, ls[i][:170]))
              W('```</details>')

          def lista(pat, texto=None, limite=12):
              t = sup if texto is None else texto
              res = []
              for i, l in enumerate(lin(t)):
                  if re.search(pat, l):
                      res.append((i + 1, l.strip()[:150]))
                      if len(res) >= limite:
                          break
              return res

          # ================= FASE 1 · AUDITORÍA PREVIA (leer antes de modificar) =================
          W('# Auditoría y corrección completa del registro ZID (ZYRA)')
          W('')
          W('**Reglas aplicadas:** auditoría antes de modificar · no se crea ningún archivo nuevo · '
            'solo se AGREGAN líneas (la lógica existente, incluido el bloqueo por documento vencido, NO se borra ni se reescribe) · '
            'código de producción · agnóstico de país (piloto El Salvador).')
          W('')
          W('## 1) Auditoría previa')
          W('')
          W('- `superapp.py`: %d líneas' % len(lin(sup)))
          W('- `shared_engines/security/biometrics_face.py`: %s líneas' % (len(lin(bf)) if bf else 'NO ENCONTRADO'))
          W('')
          W('**Banderas del registro (línea ~542) y transiciones de pasos:**')
          dump('minorBloqueado', 8, 40, 'Banderas y entorno del flujo')
          lista_b4 = lista(r'\bbIr4\b')
          lista_b5 = lista(r'\bbIr5\b')
          W('')
          W('**Ocurrencias de botones:** `bIr4` → líneas %s · `bIr5` → líneas %s' %
            (', '.join(str(x[0]) for x in lista_b4) or 'ninguna', ', '.join(str(x[0]) for x in lista_b5) or 'ninguna'))
          dump('bIr4', 4, 20, 'Primera aparición de bIr4 (handler)')
          dump('nombresCoinciden', 3, 15, 'Comparador de nombres existente')
          W('')
          W('**Llamadas relevantes:**')
          for i, l in lista(r'nombresCoinciden\s*\(|nombreDeTexto\s*\(|nombreNoCoincide\s*=\s*true', limite=14):
              W('- L%d: `%s`' % (i, l.replace('|', '\\|')))
          dump('parseAAMVA', 2, 18, 'Parser PDF417/AAMVA')
          dump('ps5', 2, 28, 'Paso 5 · contraseña y creación de ZID')
          dump('def do_POST', 4, 34, 'Servidor · manejo de POST')
          W('')
          for i, l in lista(r"(?i)contrase|password|passwd", limite=10):
              W('- Contraseña L%d: `%s`' % (i, l.replace('|', '\\|')))
          W('')
          for i, l in lista(r"(?i)mock|fake|demo|hardcode|TODO|FIXME", limite=14):
              W('- Posible mock/TODO L%d: `%s`' % (i, l.replace('|', '\\|')))
          if bf:
              W('')
              W('**Motor biométrico (biometrics_face.py, zona de carga de modelos 415-540):**')
              bls = lin(bf)
              W('```')
              for i in range(414, min(len(bls), 540)):
                  W('%5d| %s' % (i + 1, bls[i][:170]))
              W('```')
          # estilos de captura
          dump('<style', 2, 24, 'Inicio de estilos')
          W('')
          for i, l in lista(r'#ps[0-9]|<video|<canvas|video \{|canvas \{|\.video|\.canvas', limite=20):
              W('- Estilo L%d: `%s`' % (i, l.replace('|', '\\|')))

          # ================= FASE 2 · CORRECCIONES (solo agregar, nunca borrar) =================
          JS = r'''/* ===== ZYRA-REG-HARDENING v2 (ini) — bloqueo duro: nombre/tipo de documento, biometría selfie contra documento, contraseña. No modifica la guía del documento. ===== */
          (function(){
            'use strict';
            try{
              if (window.__zyraRegHarden2) return;
              window.__zyraRegHarden2 = true;

              function _reg(){ try{ return JSON.parse(sessionStorage.getItem('zyraReg')||'{}')||{}; }catch(e){ return {}; } }
              function _id(x){ try{ return document.getElementById(x); }catch(e){ return null; } }
              function _norm(s){
                return (s==null?'':String(s)).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
              }
              function _pal(s){ return _norm(s).split(' ').filter(function(w){ return w.length>1; }); }

              /* Comparador de nombres: exige 60% de términos en común */
              function _nombresOk(nombreRegistro, nombreDocumento){
                var a=_pal(nombreRegistro), b=_pal(nombreDocumento);
                if(!a.length || !b.length) return null;
                var comunes=0;
                for(var i=0;i<a.length;i++){ if(b.indexOf(a[i])>=0) comunes++; }
                return (comunes / Math.max(a.length,b.length)) >= 0.6;
              }

              /* Familias de documentos (agnóstico de país) */
              var _FAM = {
                licencia:  ['DRIVER LICENSE','DRIVING LICENCE','LICENCIA DE CONDUCIR','PERMISO DE CONDUCIR','CLASS C'],
                dui:       ['DOCUMENTO UNICO DE IDENTIDAD','NUMERO DE DUI','CARNET DE IDENTIDAD SALVADORENO'],
                pasaporte: ['PASAPORTE','PASSPORT','PASSEPORT'],
                residente: ['RESIDENT CARD','PERMANENT RESIDENT','TARJETA DE RESIDENCIA','GREEN CARD','CARNET DE RESIDENTE']
              };
              function _familiaDetectada(texto){
                var t=_norm(texto), hits=[];
                if(!t) return hits;
                Object.keys(_FAM).forEach(function(f){
                  for(var i=0;i<_FAM[f].length;i++){ if(t.indexOf(_norm(_FAM[f][i]))>=0){ hits.push(f); return; } }
                });
                if(hits.indexOf('dui')<0 && (t.indexOf(' DUI ')>=0 || t.indexOf('DUI ')===0)) hits.push('dui');
                return hits;
              }
              function _familiaEsperada(tipoDoc){
                var t=_norm(tipoDoc);
                if(!t) return null;
                if(t.indexOf('DUI')>=0) return 'dui';
                if(t.indexOf('PASAPORTE')>=0 || t.indexOf('PASSPORT')>=0) return 'pasaporte';
                if(t.indexOf('LICENC')>=0 || t.indexOf('DRIVER')>=0 || t.indexOf('CONDUCIR')>=0) return 'licencia';
                if(t.indexOf('RESIDEN')>=0) return 'residente';
                return null;
              }

              function _textoDoc(){
                var r=_reg(), c=[r.ocrFrente, r.ocrReverso, r.ocrTexto, r.ocr, r.textoDoc, r.pdf417, r.pdf417Raw, r.aamvaRaw, r.docTexto];
                for(var i=0;i<c.length;i++){ if(typeof c[i]==='string' && c[i].length>=20) return c[i]; }
                try{
                  for(var k in r){
                    if(typeof r[k]==='string' && r[k].length>=20 && (k.indexOf('ocr')>=0 || k.indexOf('pdf')>=0 || k.indexOf('aamva')>=0 || k.indexOf('texto')>=0)) return r[k];
                  }
                }catch(e){}
                return '';
              }
              function _nombreDoc(){
                var r=_reg(), bruto=_textoDoc(), c=[];
                try{
                  if(typeof parseAAMVA==='function' && bruto){
                    var a=parseAAMVA(bruto);
                    if(a && typeof a==='object'){
                      c.push([a.apellidos||a.apellido||a.DCS, a.nombres||a.nombre||a.DAC].filter(function(x){return x&&String(x).trim();}).join(' '));
                    }
                  }
                }catch(e){}
                c.push(r.docNombre, r.nombreDoc, r.nombreDocumento, r.nombreDocumentoOCR);
                try{ if(typeof nombreDeTexto==='function' && bruto){ var n=nombreDeTexto(bruto); if(n) c.push(n); } }catch(e){}
                for(var i=0;i<c.length;i++){ if(typeof c[i]==='string' && _pal(c[i]).length>=2) return c[i].trim(); }
                return '';
              }
              function _nombreReg(){
                var r=_reg(), c=[r.nombre, r.nombreCompleto, r.nombreRegistro, r.fullName, r.nombres, r.nombresCompletos];
                for(var i=0;i<c.length;i++){ if(typeof c[i]==='string' && c[i].trim().length>=3) return c[i].trim(); }
                return '';
              }
              function _tipoSel(){
                var r=_reg(), c=[r.tipoDoc, r.tipoDocumento, r.docTipo, r.documentoTipo];
                for(var i=0;i<c.length;i++){ if(typeof c[i]==='string' && c[i].trim()) return c[i].trim(); }
                try{
                  var s=document.querySelector('#ps1 select, select[id*=tipo], select[name*=tipo]');
                  if(s && s.value) return s.value;
                }catch(e){}
                return '';
              }
              function _aviso(msg){
                try{ if(typeof aviso==='function'){ aviso(msg); return; } }catch(e){}
                try{ if(typeof mostrarAviso==='function'){ mostrarAviso(msg); return; } }catch(e){}
                try{ if(typeof toast==='function'){ toast(msg); return; } }catch(e){}
                try{ alert(msg); }catch(e){}
              }

              /* GATE PASO 3 → 4: nombre y tipo de documento */
              function gatePS4(){
                try{
                  var nomReg=_nombreReg(), nomDoc=_nombreDoc();
                  var ok=_nombresOk(nomReg, nomDoc);
                  if(ok===false){
                    return {ok:false, msg:'No puedes continuar: el nombre del registro ("'+nomReg+'") no coincide con el nombre del documento ("'+nomDoc+'"). Corrige tu nombre en el paso 1 o vuelve a capturar el documento.'};
                  }
                  var famSel=_familiaEsperada(_tipoSel());
                  var det=_familiaDetectada(_textoDoc());
                  if(famSel && det.length && det.indexOf(famSel)<0){
                    return {ok:false, msg:'No puedes continuar: el documento capturado no corresponde al tipo seleccionado ("'+_tipoSel()+'"). Selecciona el tipo correcto o captura el documento correspondiente.'};
                  }
                  return {ok:true, msg:''};
                }catch(e){
                  return {ok:false, msg:'No se pudo validar el documento (error interno). Vuelve a intentarlo.'};
                }
              }

              /* Imágenes para la comparación facial */
              function _dataUrlDe(el){
                try{
                  if(!el) return '';
                  if(el.tagName==='CANVAS'){ return el.toDataURL('image/jpeg', 0.9); }
                  if(el.tagName==='IMG' && el.src) return el.src;
                }catch(e){}
                return '';
              }
              function _imagenEnPaso(pid, excl){
                try{
                  var cont=_id(pid); if(!cont) return null;
                  var els=cont.querySelectorAll('img,canvas'), best=null, area=0;
                  for(var i=0;i<els.length;i++){
                    var el=els[i];
                    if(excl && el===excl) continue;
                    var w=el.naturalWidth||el.width||0, h=el.naturalHeight||el.height||0;
                    if(w<80||h<80) continue;
                    var a=w*h; if(a>area){ area=a; best=el; }
                  }
                  return best;
                }catch(e){ return null; }
              }
              function _cargaImg(src){
                return new Promise(function(res, rej){
                  try{
                    var im=new Image();
                    im.onload=function(){ res(im); };
                    im.onerror=function(){ rej(new Error('imagen no disponible')); };
                    im.src=src;
                  }catch(e){ rej(e); }
                });
              }
              function _fuenteSelfie(){
                var r=_reg(), c=[r.selfie, r.fotoSelfie, r.selfieData, r.selfieDataUrl, r.selfieFoto];
                for(var i=0;i<c.length;i++){ if(typeof c[i]==='string' && c[i].indexOf('data:image')===0) return c[i]; }
                var el=_imagenEnPaso('ps4');
                return el ? _dataUrlDe(el) : '';
              }
              function _fuenteDoc(){
                var r=_reg(), c=[r.fotoFrente, r.docFrente, r.fotoDoc, r.frenteData, r.frenteDataUrl];
                for(var i=0;i<c.length;i++){ if(typeof c[i]==='string' && c[i].indexOf('data:image')===0) return c[i]; }
                var el=_imagenEnPaso('ps2');
                return el ? _dataUrlDe(el) : '';
              }

              var UMBRAL_ROSTRO = 0.60;
              async function _comparaRostros(){
                try{
                  if(!window.faceapi || !window.faceapi.TinyFaceDetectorOptions) return {res:'nodisp', dist:-1};
                  var sSrc=_fuenteSelfie(), dSrc=_fuenteDoc();
                  if(!sSrc || !dSrc) return {res:'sinimg', dist:-1};
                  var sIm=await _cargaImg(sSrc), dIm=await _cargaImg(dSrc);
                  var opt=function(){ return new window.faceapi.TinyFaceDetectorOptions({inputSize:320, scoreThreshold:0.4}); };
                  var ds=await window.faceapi.detectSingleFace(sIm, opt()).withFaceLandmarks(true).withFaceDescriptor();
                  var dd=await window.faceapi.detectSingleFace(dIm, opt()).withFaceLandmarks(true).withFaceDescriptor();
                  if(!ds || !dd) return {res:'sinrostro', dist:-1};
                  var dist=window.faceapi.euclideanDistance(ds.descriptor, dd.descriptor);
                  return {res:(dist<=UMBRAL_ROSTRO?'ok':'distinto'), dist:dist};
                }catch(e){ return {res:'error', dist:-1, err:(e&&e.message)||String(e)}; }
              }

              /* GATE PASO 4 → 5: biometría (fail-closed) + consentimientos + contraseña */
              async function gatePS5(){
                try{
                  var r=_reg();
                  if(r.bioRechazada===true || window.__zyraBioRechazada===true){
                    return {ok:false, msg:'No puedes continuar: la verificación biométrica fue rechazada. Vuelve a tomar la selfie.'};
                  }
                  try{
                    var passes=document.querySelectorAll('#ps5 input[type=password], #ps5Pass, input[id*=pass][type=password]');
                    for(var i=0;i<passes.length;i++){
                      var v=passes[i].value||'';
                      if(v.length>0 && v.length<8){
                        return {ok:false, msg:'La contraseña debe tener al menos 8 caracteres.'};
                      }
                    }
                  }catch(e){}
                  try{
                    var chk=document.querySelectorAll('#ps4 input[type=checkbox], #ps5 input[type=checkbox]');
                    for(var j=0;j<chk.length;j++){ if(!chk[j].checked){ return {ok:false, msg:'Debes marcar todas las casillas de consentimiento para continuar.'}; } }
                  }catch(e){}
                  var cmp=await _comparaRostros();
                  if(cmp.res==='ok'){
                    window.__zyraBioOk=true;
                    try{ r.bioOk=true; sessionStorage.setItem('zyraReg', JSON.stringify(r)); }catch(e){}
                    return {ok:true, msg:''};
                  }
                  if(cmp.res==='distinto'){
                    return {ok:false, msg:'No puedes continuar: el rostro de la selfie no coincide con el rostro del documento. Toma una nueva selfie con buena luz.'};
                  }
                  if(r.bioOk===true || window.__zyraBioOk===true){ return {ok:true, msg:''}; }
                  if(cmp.res==='sinimg'){ return {ok:false, msg:'No se pudo verificar tu rostro: falta la imagen de la selfie o del documento. Vuelve a capturarlos.'}; }
                  if(cmp.res==='sinrostro'){ return {ok:false, msg:'No se pudo verificar tu rostro: no se detectó el rostro en la selfie o en el documento. Toma las fotos de nuevo con mejor luz.'}; }
                  return {ok:false, msg:'No se pudo completar la verificación biométrica. Vuelve a tomar la selfie e inténtalo de nuevo.'};
                }catch(e){
                  return {ok:false, msg:'No se pudo completar la verificación biométrica (error interno). Vuelve a intentarlo.'};
                }
              }

              /* Bloqueo en fase de captura: corre ANTES de los handlers existentes y solo deja pasar si el gate aprueba */
              function _bloquea(idBtn, gate){
                try{
                  document.addEventListener('click', function(e){
                    try{
                      var t=e.target;
                      if(!t || !t.closest) return;
                      var btn=t.closest('#'+idBtn);
                      if(!btn) return;
                      if(btn.__zyraPass){ btn.__zyraPass=false; return; }
                      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                      Promise.resolve().then(gate).then(function(res){
                        if(res && res.ok){ btn.__zyraPass=true; btn.disabled=false; btn.click(); }
                        else{ try{ btn.disabled=false; }catch(_e){} _aviso((res&&res.msg)||'No puedes continuar todavía.'); }
                      }).catch(function(err){ try{ btn.disabled=false; }catch(_e){} _aviso('No se pudo validar el paso: '+((err&&err.message)||err)); });
                    }catch(err2){}
                  }, true);
                }catch(e){}
              }
              _bloquea('bIr4', gatePS4);
              _bloquea('bIr5', gatePS5);

              /* BIO-BIG: reduce capturas grandes antes de enviarlas (máx 1280px) */
              try{
                var _tdl=HTMLCanvasElement.prototype.toDataURL;
                HTMLCanvasElement.prototype.toDataURL=function(tipo, cal){
                  try{
                    var w=this.width||0, h=this.height||0;
                    if((tipo==='image/jpeg'||tipo===undefined||tipo===null) && (w>1280||h>1280)){
                      var esc=Math.min(1280/w,1280/h);
                      var c=document.createElement('canvas');
                      c.width=Math.round(w*esc); c.height=Math.round(h*esc);
                      c.getContext('2d').drawImage(this,0,0,c.width,c.height);
                      if(tipo===undefined||tipo===null) tipo='image/png';
                      return _tdl.call(c, tipo, tipo==='image/jpeg'?(cal||0.85):cal);
                    }
                  }catch(e){}
                  return _tdl.call(this, tipo, cal);
                };
              }catch(e){}

              /* Errores del servidor visibles al usuario (creación de ZID, etc.) */
              try{
                var _of=window.fetch;
                if(typeof _of==='function' && !window.__zyraFetchErr){
                  window.__zyraFetchErr=true;
                  window.fetch=function(){
                    var args=arguments;
                    return _of.apply(this, args).then(function(resp){
                      try{
                        if(resp && (resp.status>=500 || resp.status===400 || resp.status===413)){
                          resp.clone().text().then(function(tx){
                            var msg='Error del servidor ('+resp.status+').';
                            try{ var j=JSON.parse(tx); if(j && (j.error||j.message||j.detail)) msg='Error: '+(j.error||j.message||j.detail); }
                            catch(e){ if(tx && tx.length<200) msg='Error del servidor ('+resp.status+'): '+tx; }
                            _aviso(msg);
                          }).catch(function(){});
                        }
                      }catch(e){}
                      return resp;
                    });
                  };
                }
              }catch(e){}

              /* Gancho de pruebas/verificación */
              window.__zyraRegGate = {
                gatePS4: gatePS4, gatePS5: gatePS5, nombresOk: _nombresOk,
                familiaDetectada: _familiaDetectada, familiaEsperada: _familiaEsperada,
                nombreDoc: _nombreDoc, nombreReg: _nombreReg, UMBRAL_ROSTRO: UMBRAL_ROSTRO
              };
            }catch(e){ try{ console && console.warn && console.warn('[zyra-hardening]', e); }catch(_e){} }
          })();
          /* ===== ZYRA-REG-HARDENING v2 (fin) ===== */'''

          CSS = '''/* ZYRA-CAP-COMPACT v2 (ini): pantalla de captura mas pequeña y profesional - NO modifica la guia/marco del documento */
          #ps2, #ps3 { max-width: 520px !important; margin-left: auto !important; margin-right: auto !important; }
          #ps2 video, #ps3 video, #ps2 canvas, #ps3 canvas { max-width: min(440px, 92vw) !important; max-height: 58vh !important; width: auto !important; height: auto !important; display: block; margin-left: auto; margin-right: auto; }
          #ps2 img, #ps3 img { max-width: min(420px, 90vw); max-height: 46vh; display: block; margin: 0 auto; border-radius: 12px; }
          #ps2 h2, #ps3 h2, #ps2 h3, #ps3 h3 { font-size: 1.05rem; margin: 6px 0; }
          /* ZYRA-CAP-COMPACT v2 (fin) */'''

          EST = {'aplicado': [], 'ya': [], 'sin_ancla': []}

          def aplicar(txt, etiqueta, marcador, patrones, nuevo):
              if marcador in txt:
                  EST['ya'].append(etiqueta); return txt
              for p in patrones:
                  m = re.search(p, txt)
                  if m:
                      return txt[:m.start()] + nuevo.replace('{MATCH}', m.group(0)) + txt[m.end():]
              EST['sin_ancla'].append(etiqueta)
              return txt

          # P-A: bloque duro JS (gates bIr4/bIr5, comparaciones, BIO-BIG, errores visibles)
          sup = aplicar(sup, 'P-A bloque duro de registro (gates)', 'ZYRA-REG-HARDENING v2 (ini)', [
              r'(?m)^[ \t]*(?:var|let|const)\s+minorBloqueado\b[^\n]*$',
              r'(?m)^[ \t]*(?:var|let|const)\s+docVencido\b[^\n]*$',
              r'(?m)^[ \t]*(?:var|let|const)\s+bioRechazada\b[^\n]*$',
          ], '{MATCH}\n\n' + JS)
          if 'ZYRA-REG-HARDENING v2 (ini)' not in sup:
              critico('No se pudo inyectar el bloque de gates (P-A). Se necesita ver la zona de banderas para anclarlo.')

          # P-B: al detectar nombreNoCoincide=true, deshabilitar bIr4 en el origen
          sup = aplicar(sup, 'P-B deshabilitar bIr4 al nombreNoCoincide', 'ZYRA-DIS-B4', [
              r'\bnombreNoCoincide\s*=\s*true\b',
          ], '{MATCH}; /* ZYRA-DIS-B4 */ try{var _zyraB4=document.getElementById(\'bIr4\'); if(_zyraB4){_zyraB4.disabled=true; _zyraB4.setAttribute(\'aria-disabled\',\'true\');}}catch(_e){}')

          # P-C: al detectar bioRechazada=true, deshabilitar bIr5 y marcar rechazo global
          sup = aplicar(sup, 'P-C deshabilitar bIr5 al bioRechazada', 'ZYRA-DIS-B5', [
              r'\bbioRechazada\s*=\s*true\b',
          ], '{MATCH}; /* ZYRA-DIS-B5 */ try{window.__zyraBioRechazada=true; var _zyraB5=document.getElementById(\'bIr5\'); if(_zyraB5){_zyraB5.disabled=true;}}catch(_e){}')

          # P-D: marcar exito biometrico cuando el flujo existente lo apruebe
          sup = aplicar(sup, 'P-D marcar bioOk en exito del flujo', 'ZYRA-BIO-OK', [
              r'\bbioOk\s*=\s*true\b',
              r'\bbioVerificado\s*=\s*true\b',
              r'\bbioRechazada\s*=\s*false\b',
          ], '{MATCH}; /* ZYRA-BIO-OK */ try{window.__zyraBioOk=true;}catch(_e){}')

          # P-E: CSS de captura compacta (antes de </style> o </head>)
          sup = aplicar(sup, 'P-E captura compacta (CSS)', 'ZYRA-CAP-COMPACT v2 (ini)', [
              r'(?i)</style>',
              r'(?i)</head>',
          ], CSS + '\n{MATCH}')

          # P-H: precarga de modelos biometricos al arranque (mitiga 502 en la primera verificacion)
          loader = None
          if bf:
              mload = re.search(r'(?m)^def\s+(_?[A-Za-z0-9_]*(?:cargar|load|precarg|warm|init)[A-Za-z0-9_]*)\s*\(', bf)
              if mload:
                  loader = mload.group(1)
          nombres = [loader] if loader else []
          nombres += ['cargar_modelos', 'load_models', 'precargar_modelos', 'get_engine', 'get_motor', 'obtener_motor']
          nombres = [n for n in dict.fromkeys(nombres) if n]
          WARMUP = ("    # ZYRA-BIO-WARMUP v1: precarga de modelos biometricos al arranque (mitiga 502)\n"
                    "    def _zyra_warmup_bio():\n"
                    "        import threading\n"
                    "        def _t():\n"
                    "            try:\n"
                    "                from shared_engines.security import biometrics_face as _bf\n"
                    "                _fn = None\n"
                    "                for _n in %r:\n"
                    "                    _fn = getattr(_bf, _n, None)\n"
                    "                    if callable(_fn):\n"
                    "                        break\n"
                    "                if _fn is not None:\n"
                    "                    _fn()\n"
                    "                    print('[bio-warmup] modelos biometricos precargados', flush=True)\n"
                    "                else:\n"
                    "                    print('[bio-warmup] cargador no encontrado; se omite precarga', flush=True)\n"
                    "            except Exception as _e:\n"
                    "                print('[bio-warmup] aviso:', _e, flush=True)\n"
                    "        threading.Thread(target=_t, daemon=True).start()\n"
                    "    _zyra_warmup_bio()\n") % (nombres,)
          sup = aplicar(sup, 'P-H precarga de modelos al arranque', 'ZYRA-BIO-WARMUP', [
              r"(?m)^if\s+__name__\s*==\s*['\"]__main__['\"]\s*:[^\n]*$",
              r'(?m)^def\s+main\s*\(',
          ], '{MATCH}\n' + WARMUP if '__main__' else '{MATCH}\n' + WARMUP)

          guardar_sup(sup)

          # Verificacion de sintaxis (compilando a TMP, nunca dentro del repo)
          try:
              py_compile.compile(P_SUP, cfile=os.path.join(TMP, 'sup_check.pyc'), doraise=True)
              ok_compila = True
          except Exception as e:
              ok_compila = False
              sup = SUP0
              guardar_sup(sup)
              critico('El parche rompio la sintaxis de superapp.py (%s). Se restauro el original.' % e)

          # ================= FASE 3 · PRUEBAS EN VIVO =================
          W('')
          W('## 2) Estado de las correcciones (parches)')
          W('')
          W('| Parche | Descripción | Estado |')
          W('|---|---|---|')
          desc = {
              'P-A': 'Bloqueo duro: nombre y tipo de documento en bIr4; biometria fail-closed en bIr5',
              'P-B': 'Deshabilitar bIr4 al detectar nombreNoCoincide',
              'P-C': 'Deshabilitar bIr5 al detectar bioRechazada',
              'P-D': 'Marcar exito biometrico en el flujo existente',
              'P-E': 'Pantalla de captura mas pequena (guia intacta)',
              'P-H': 'Precarga de modelos al arranque (mitiga 502)',
          }
          todos = ['P-A', 'P-B', 'P-C', 'P-D', 'P-E', 'P-H']
          for k in todos:
              if any(x.startswith(k) for x in EST['aplicado']):
                  st = 'APLICADO'
              elif any(x.startswith(k) for x in EST['ya']):
                  st = 'YA ESTABA (idempotente)'
              elif any(x.startswith(k) for x in EST['sin_ancla']):
                  st = 'SIN ANCLA (ver volcado, siguiente iteracion)'
              else:
                  st = 'SIN ANCLA'
              W('| %s | %s | %s |' % (k, desc[k], st))
          W('')

          PRUEBAS = []
          def prueba(nombre, ok, es_critico=True, detalle=''):
              PRUEBAS.append((nombre, bool(ok), es_critico, detalle))
              if es_critico and not ok:
                  critico('Prueba fallo: ' + nombre + ((' :: ' + detalle) if detalle else ''))

          prueba('superapp.py compila despues del parche', ok_compila, True)
          prueba('bloque de gates presente (una sola vez)', sup.count('ZYRA-REG-HARDENING v2 (ini)') == 1 and sup.count('ZYRA-REG-HARDENING v2 (fin)') == 1, True)
          prueba('gate bIr4 registrado', "_bloquea('bIr4'" in sup, True)
          prueba('gate bIr5 registrado', "_bloquea('bIr5'" in sup, True)
          prueba('logica de documento vencido intacta (docVencido sigue presente)', 'docVencido' in sup, True)

          def git(*a):
              return subprocess.run(['git', '-C', WS] + list(a), capture_output=True, text=True).stdout

          diff0 = git('diff', '-U0', '--', 'superapp.py')
          eliminadas = [l for l in diff0.splitlines() if l.startswith('-') and not l.startswith('---')]
          prueba('el diff solo AGREGA lineas (no borra nada)', len(eliminadas) == 0, True, 'borradas: %d' % len(eliminadas))
          toca_guia = [l for l in eliminadas if re.search(r'(?i)guia|gu\xc3\xada|guide|marco', l)]
          prueba('la guia/marco del documento NO fue tocada', len(toca_guia) == 0, True)

          st = git('status', '--porcelain')
          malos = [l for l in st.splitlines() if l.startswith('??') or l.startswith('A ')]
          prueba('no se creo ningun archivo nuevo en el repo', len(malos) == 0, True, ' '.join(malos[:3]))

          # pruebas de comportamiento con Node (casos reales del usuario)
          m = re.search(r'/\* ===== ZYRA-REG-HARDENING v2 \(ini\)(.*?)ZYRA-REG-HARDENING v2 \(fin\) ===== \*/', sup, re.S)
          if m:
              js_path = os.path.join(TMP, 'zyra_hardening.js')
              tjs_path = os.path.join(TMP, 'zyra_test.js')
              with open(js_path, 'w', encoding='utf-8') as f:
                  f.write(m.group(0))
              test_js = r'''const fs=require('fs');
          const code=fs.readFileSync(process.argv[2],'utf8');
          const R=[];
          function check(n,c){R.push({n:n,c:!!c});}
          function sandboxCon(reg){
            const store={'zyraReg':JSON.stringify(reg||{})};
            const storage={getItem:function(k){return Object.prototype.hasOwnProperty.call(store,k)?store[k]:null;},setItem:function(k,v){store[k]=String(v);},removeItem:function(k){delete store[k];}};
            const win={};
            const doc={addEventListener:function(){},getElementById:function(){return null;},querySelectorAll:function(){return [];},querySelector:function(){return null;},createElement:function(){return {width:0,height:0,getContext:function(){return {drawImage:function(){}};}};}};
            const fn=new Function('window','document','sessionStorage','alert',code+'\n;return window.__zyraRegGate;');
            return fn(win,doc,storage,function(){});
          }
          try{
            const g1=sandboxCon({nombre:'Jose pacheco',tipoDoc:'DUI El Salvador',ocrFrente:'STATE OF CALIFORNIA --- DRIVER LICENSE --- DL 12345678 --- SALINAS PADILLA --- DOB 08-31-1990'});
            const r1=g1.gatePS4();
            check('gatePS4 bloquea tipo de documento equivocado (DUI seleccionado, licencia de California capturada)', r1.ok===false);
            check('nombresOk rechaza "Jose pacheco" vs "SALINAS PADILLA"', g1.nombresOk('Jose pacheco','SALINAS PADILLA')===false);
            const g2=sandboxCon({nombre:'Salinas Padilla Jose',tipoDoc:'LICENCIA DE CONDUCIR',ocrFrente:'STATE OF CALIFORNIA DRIVER LICENSE SALINAS PADILLA'});
            const r2=g2.gatePS4();
            check('gatePS4 permite nombre coincidente y tipo coherente', r2.ok===true);
            check('nombresOk acepta "Jose Salinas Padilla" vs "SALINAS PADILLA"', g2.nombresOk('Jose Salinas Padilla','SALINAS PADILLA')===true);
            check('familiaDetectada reconoce licencia', g2.familiaDetectada('STATE OF CALIFORNIA DRIVER LICENSE DL 1234').indexOf('licencia')>=0);
            check('familiaEsperada(DUI El Salvador)=dui', g2.familiaEsperada('DUI El Salvador')==='dui');
            check('umbral biometrico razonable', g2.UMBRAL_ROSTRO>0 && g2.UMBRAL_ROSTRO<=0.7);
            const p1=sandboxCon({}).gatePS5().then(function(r){check('gatePS5 bloquea sin verificacion biometrica (fail-closed)', r.ok===false);});
            const p2=sandboxCon({bioOk:true}).gatePS5().then(function(r){check('gatePS5 permite con verificacion biometrica aprobada', r.ok===true);});
            Promise.all([p1,p2]).then(function(){
              console.log('##JSON##'+JSON.stringify(R));
              process.exit(R.some(function(x){return !x.c;})?1:0);
            }).catch(function(e){console.error('ERR',(e&&e.stack)||e);console.log('##JSON##'+JSON.stringify(R));process.exit(1);});
          }catch(e){
            console.error('ERR',(e&&e.stack)||e);
            console.log('##JSON##'+JSON.stringify(R));
            process.exit(1);
          }
          process.on('unhandledRejection',function(e){console.error('REJ',e);process.exit(1);});
          '''
              with open(tjs_path, 'w', encoding='utf-8') as f:
                  f.write(test_js)
              try:
                  r = subprocess.run(['node', tjs_path, js_path], capture_output=True, text=True, timeout=90)
                  salida = r.stdout or ''
                  linea = next((l for l in salida.splitlines() if l.startswith('##JSON##')), None)
                  if linea:
                      for it in json.loads(linea[len('##JSON##'):]):
                          prueba('JS · ' + it['n'], it['c'], True)
                  else:
                      prueba('pruebas JS ejecutadas', False, True, (r.stderr or '')[:300])
              except FileNotFoundError:
                  prueba('Node disponible para pruebas de comportamiento', False, False, 'node no existe; se aplican pruebas estaticas')
          else:
              prueba('bloque JS extraible para pruebas', False, True)

          W('## 3) Controles de auditoria (BIO-*)')
          W('')
          W('| ID | Control | Estado |')
          W('|---|---|---|')
          sec = lista(r"(?i)(secret|api_key|token|password)\s*=\s*['\"][^'\"]{8,}['\"]", limite=5)
          W('| BIO-SECRET | Sin secretos en duro | %s |' % ('VERIFICADO' if not sec else 'PENDIENTE (L%s)' % ','.join(str(x[0]) for x in sec)))
          W('| BIO-PAIS | Agnostico de pais (catalogo de familias en el gate) | APLICADO (gate) · lista UI por revisar con volcado |')
          W('| BIO-ENC | Cifrado AES-256-GCM en el motor | %s |' % ('VERIFICADO' if bf and ('AES' in bf or 'GCM' in bf) else 'REVISAR'))
          W('| BIO-BIG | Capturas grandes reducidas antes de enviar (max 1280px) | APLICADO (cliente) |')
          W('| BIO-TODO | Sin mocks/demo en el flujo | %s |' % ('VERIFICADO' if not lista(r'(?i)mock|fake|demo|hardcode', limite=1) else 'PENDIENTE (ver listado en fase 1)'))
          W('| BIO-CONSENT | Consentimientos exigidos antes de continuar | APLICADO (gate bIr5) · si la UI no tiene casillas, se reporta |')
          W('| BIO-502 | Precarga de modelos al arranque | %s |' % ('APLICADO (cargador: %s)' % loader if loader else 'PARCIAL (cargador no identificado, ver volcado del motor)'))
          W('| BIO-ENV | Validacion de variables de entorno al arranque | PENDIENTE (proxima iteracion, con volcado ya disponible) |')
          W('| BIO-QUAL | Control de calidad de imagen | PENDIENTE (proxima iteracion) |')
          W('| BIO-LOG/BIO-DB | Logs sin PII y transacciones del motor | REVISAR (volcado de do_POST disponible en fase 1) |')
          W('')

          W('## 4) Pruebas en vivo')
          W('')
          W('| Prueba | Resultado |')
          W('|---|---|')
          for n, ok, crit, det in PRUEBAS:
              W('| %s | %s |' % (n + ((' · ' + det) if det else ''), 'PASO' if ok else ('FALLO' if crit else 'AVISO')))
          W('')

          W('## 5) Conclusion')
          W('')
          if CRITICOS:
              W('- **SIN COMMIT**: hay fallos criticos, el repositorio quedo intacto (o restaurado).')
              for c in CRITICOS:
                  W('- Critico: %s' % c)
              W('- Mandame el Resumen completo de esta corrida para ajustar las anclas y repetir.')
          else:
              W('- **TODO PASO**: se hizo commit de los cambios en `superapp.py` (solo lineas agregadas).')
              W('- Que cambia en produccion: bIr4 bloquea si el nombre no coincide o si el tipo de documento no corresponde; bIr5 exige comparacion facial selfie-vs-documento, consentimientos y contrasena de 8+; las capturas se muestran mas pequenas (la guia no se toco); los errores del servidor se muestran en pantalla; los modelos se precargan al arranque.')
              W('- Prueba ahora en tu telefono el flujo completo y, si ves cualquier error, mandame el texto exacto que aparece.')
          W('')

          if CRITICOS:
              sys.exit(1)
          ZYPY_FIN
          python "$RUNNER_TEMP/zyra_fix.py"

      - name: 'Commit (solo si todas las pruebas pasaron)'
        if: success()
        run: |
          git config user.name "zyra-fix"
          git config user.email "actions@zyra.local"
          git add -u
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "fix(registro): bloqueo por nombre/tipo de documento, gate biometrico selfie-vs-documento, captura compacta, errores visibles y precarga de modelos"
            git push
          fi

      - name: 'Empaquetar reporte'
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/repo"
          git diff > "$RUNNER_TEMP/repo/cambios.diff" || true
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/repo/reporte.md" || true

      - name: Artefacto del reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-auditoria-registro
          path: ${{ runner.temp }}/repo
          if-no-files-found: ignore
