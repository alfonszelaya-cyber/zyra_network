name: ZYRA S2l auditoria del permiso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s2l:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography
      - name: Auditoria permiso
        run: |
          python3 - <<'PYEOF'
          import json, os, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          OUT = []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 's2l.md').write_text('\n'.join(OUT), encoding='utf-8')
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  with urllib.request.urlopen(q, timeout=20) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, str(e)
          try:
              t = (ROOT / 'apps' / 'subastas' / 'server.py').read_text(encoding='utf-8', errors='replace')
              ls = t.splitlines()
              add('# S2l - AUDITORIA DEL PERMISO')
              add('')
              add('## Q1. La ruta condicion existe en server.py?')
              add('')
              ruta = 'if path == "/subastas/permiso":'
              n = t.count(ruta)
              add('- `if path == "/subastas/permiso":` en server.py: **%d** (0 = LA RUTA NO EXISTE)' % n)
              add('')
              add('## Q2. Donde aparecen menciones (JS vs ruta real)')
              add('')
              for i, l in enumerate(ls):
                  if 'permiso' in l.lower():
                      add('- linea %d: %s' % (i + 1, l.strip()[:130]))
              add('')
              add('## Q3. Prueba en vivo: POST /subastas/permiso')
              add('')
              env = dict(os.environ)
              env.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                          'ZYRA_DATA_DIR': '/tmp/zs2l', 'ZYRA_PORT': str(NP),
                          'SUPERAPP_DATA_DIR': '/tmp/ss2l', 'PORT': str(PS),
                          'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                          'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
              proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env,
                                      stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              vivo = False
              tv = time.time()
              while time.time() - tv < 40:
                  if proc.poll() is not None:
                      break
                  st, _b = pedir(BASE + '/health')
                  if st is not None:
                      vivo = True
                      break
                  time.sleep(1.0)
              sp = None
              spv = False
              if vivo:
                  sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env,
                                        stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
                  tv = time.time()
                  while time.time() - tv < 70:
                      if sp.poll() is not None:
                          break
                      st, _b = pedir(BSP + '/health')
                      if st == 200:
                          spv = True
                          break
                      time.sleep(1.5)
              add('- red=%s superapp=%s' % (vivo, spv))
              if spv:
                  cuerpo = json.dumps({'zid': 'Z-DUENO-CI', 'clave': 'clave-ci-9999'}).encode()
                  st, b = pedir(BSP + '/subastas/permiso', data=cuerpo)
                  add('- POST /subastas/permiso -> HTTP %s' % st)
                  add('- cuerpo respuesta: `%s`' % b[:300])
                  add('')
                  if n == 0:
                      add('**CONFIRMADO: la ruta NO existe en server.py. El POST cae al 404 del app.**')
                      add('Eso explica permiso_ok FALLO. El fix (S2m) inserta el manejador')
                      add('con ancla `if path == "/subastas/permiso":` conteo=0 y el contexto exacto de do_POST.')
              else:
                  add('- sistema no arranco')
              try:
                  if proc.poll() is None:
                      proc.terminate()
                      proc.wait(timeout=10)
              except Exception:
                  try:
                      proc.kill()
                  except Exception:
                      pass
          except Exception as e:
              add('ERROR: %s' % e)
          escribe()
          print('S2l OK')
          PYEOF
