name: ZYRA - Auditoría integral (resultado en Summary)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar auditoría y publicar Summary
        run: |
          python3 - <<'PYEOF'
          import ast, hashlib, json, os, re
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          SKIP = {'.git','.hg','.svn','.idea','.vscode','node_modules','.venv','venv','.mypy_cache','.pytest_cache','.ruff_cache'}
          MAXHASH = 2 * 1024 * 1024

          REF = {'entradas_totales':10478,'archivos':6968,'python_total':4506,'python_con_contenido':1963,'python_cero_bytes':2543,'pyc':2394,'errores_sintaxis':0,'directorios_sin_contenido':1971}

          REF_APPS = {'agro':(578,434,336,98,144),'axis':(592,528,63,465,63),'ciclo_digital':(122,110,21,89,12),'futuro_os':(119,119,15,104,0),'laboratorio':(1171,432,321,111,717),'mi_primer_empleo':(136,125,12,113,11),'nexo':(1702,1035,496,539,666),'semilla':(581,439,97,342,141),'subastas':(756,711,42,669,44)}

          OFICIALES = {
           'AGRO':['agro'],'ARQUEOLOGIA_DIGITAL':['arqueologia_digital'],'AXIS':['axis'],
           'CONTROLADOR_ESPACIOS':['controlador_espacios','controlador_de_espacios'],
           'DECISIONES_REALES':['decisiones_reales'],'GOVERNANCE_PORTAL':['governance_portal'],
           'MI_PRIMER_EMPLEO':['mi_primer_empleo','mpe'],'NEXO':['nexo'],'PRUEBAS':['pruebas'],
           'RECICLAJE_DIGITAL':['reciclaje_digital'],'REDNEW':['rednew','red_new'],
           'SECURITY_COMMAND':['security_command'],'SEMILLA':['semilla'],'SHARED_DOMAIN':['shared_domain'],
           'SUBASTAS':['subastas'],'CEREBROTIC':['cerebrotic']}
          EXTRAS = ['ciclo_digital','futuro_os','laboratorio']

          def scan(base):
              dirs, files = [], []
              for dp, dn, fn in os.walk(base):
                  dn[:] = sorted(d for d in dn if d not in SKIP)
                  p = Path(dp)
                  dirs.append(p)
                  files.extend(p / f for f in fn)
              return dirs, files

          def empty_dirs(dirs, files):
              sin = set(dirs)
              for f in files:
                  try:
                      if f.stat().st_size > 0:
                          p = f.parent
                          while p in sin:
                              sin.discard(p)
                              p = p.parent
                  except OSError:
                      pass
              return sin

          def sha(f):
              h = hashlib.sha256()
              try:
                  with f.open('rb') as fh:
                      for b in iter(lambda: fh.read(65536), b''):
                          h.update(b)
              except OSError:
                  return ''
              return h.hexdigest()

          def txt(f):
              try:
                  return f.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def norm(s):
              return s.lower().replace('-', '_').replace(' ', '_')

          def rel(f):
              try:
                  return str(f.relative_to(ROOT))
              except ValueError:
                  return str(f)

          def size0(f):
              try:
                  return f.stat().st_size == 0
              except OSError:
                  return False

          if not (ROOT / 'main.py').exists() and not (ROOT / 'apps').is_dir():
              print('AVISO: la raiz no contiene main.py ni apps/. Verifica la estructura esperada.')

          dirs, files = scan(ROOT)
          py = [f for f in files if f.suffix == '.py']
          pyc = [f for f in files if f.suffix.lower() == '.pyc']
          py0 = sum(1 for f in py if size0(f))

          synerr = []
          for f in py:
              try:
                  b = f.read_bytes()
              except OSError:
                  continue
              if not b.strip():
                  continue
              try:
                  ast.parse(b.decode('utf-8', errors='replace'), filename=str(f))
              except SyntaxError as e:
                  synerr.append((rel(f), 'linea %s: %s' % (e.lineno, e.msg)))
              except Exception as e:
                  synerr.append((rel(f), str(e)))

          sin = empty_dirs(dirs, files)
          por_area = Counter()
          for d in sin:
              r = rel(d)
              parts = Path(r).parts
              por_area[parts[0] if parts else '.'] += 1

          byt = defaultdict(list)
          for f in files:
              if f.suffix.lower() == '.pyc':
                  continue
              try:
                  s = f.stat().st_size
              except OSError:
                  continue
              if 0 < s <= MAXHASH:
                  byt[s].append(f)
          hgr = defaultdict(list)
          for s, lst in byt.items():
              if len(lst) < 2:
                  continue
              for f in lst:
                  h = sha(f)
                  if h:
                      hgr[h].append((f, s))
          dups = []
          for h, it in hgr.items():
              if len(it) > 1:
                  dups.append({'n': len(it), 'bytes': it[0][1] * (len(it) - 1),
                               'rutas': sorted(rel(f) for f, _ in it)})
          dups.sort(key=lambda g: -g['bytes'])

          def groups(suffixes):
              out = []
              for g in dups:
                  hit = [r for r in g['rutas'] if r.lower().endswith(tuple(suffixes))]
                  if len(hit) >= 2:
                      out.append(hit)
              return out

          g_net = groups(('network_client.py',))
          g_js = groups(('verificar.js', 'app.js'))
          g_disc = groups(('service_discovery.py',))

          SECRETS = [
           ('clave_privada_embebida', re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----')),
           ('posible_secreto_en_codigo', re.compile(r"(?im)^\s*(?:ZYRA_ROOT_KEY|ZYRA_API_TOKEN|API_KEY|API_TOKEN|SECRET|SECRET_KEY|PASSWORD|PASSWD|ACCESS_TOKEN)\s*[:=]\s*[\"'][^\"']{8,}[\"']")),
           ('url_con_credenciales', re.compile(r"(?i)\w+://[^/\s:@\"']+:([^/\s@\"']{4,})@"))]
          TEXT_EXT = {'.py','.js','.ts','.json','.yaml','.yml','.toml','.ini','.cfg','.sh','.bat','.md','.txt'}
          secr = []
          for f in files:
              if f.suffix.lower() not in TEXT_EXT and not f.name.startswith('.env'):
                  continue
              t = txt(f)
              for nombre, pat in SECRETS:
                  for m in pat.finditer(t):
                      secr.append({'archivo': rel(f), 'linea': t.count('\n', 0, m.start()) + 1, 'patron': nombre})

          cli = []
          for f in py:
              if 'client' not in f.name.lower():
                  continue
              t = txt(f)
              cli.append({'archivo': rel(f), 'auth': bool(re.search(r'(?i)authorization', t))})
          cli_sin = [c['archivo'] for c in cli if not c['auth']]

          srv = {}
          for n in ('main.py', 'shared_engines/runtime/api.py', 'shared_engines/runtime/combined_api.py', 'shared_engines/runtime/capabilities_api.py'):
              p = ROOT / n
              if p.exists():
                  t = txt(p)
                  srv[n] = {'token': bool(re.search(r'(?i)zyra_api_token', t)),
                            'require': bool(re.search(r'(?i)require_token', t)),
                            'authorization': bool(re.search(r'(?i)authorization', t))}

          apps_dir = ROOT / 'apps'
          carpetas = sorted([d for d in apps_dir.iterdir() if d.is_dir()]) if apps_dir.is_dir() else []
          apps = {}
          for c in carpetas:
              sd, sf = scan(c)
              spy = [f for f in sf if f.suffix == '.py']
              c0 = sum(1 for f in spy if size0(f))
              apps[c.name] = {'total': len(sf), 'py': len(spy), 'con': len(spy) - c0,
                              'cero': c0, 'pyc': len([f for f in sf if f.suffix.lower() == '.pyc']),
                              'dirs_vacios': len(empty_dirs(sd, sf)),
                              'tests': len([f for f in spy if f.name.startswith('test_') or f.name.endswith('_test.py')])}

          cn = {norm(c.name): c.name for c in carpetas}
          pres, fal = [], []
          for of, alias in OFICIALES.items():
              hit = next((cn[a] for a in alias if a in cn), None)
              if hit:
                  pres.append(of)
              else:
                  fal.append(of)
          extras = [e for e in EXTRAS if e in cn]
          alias_todos = {a for al in OFICIALES.values() for a in al}
          sin_clas = [c.name for c in carpetas if norm(c.name) not in alias_todos and norm(c.name) not in EXTRAS]

          sp = txt(ROOT / 'superapp.py')
          sp_det = []
          if sp:
              for of, alias in OFICIALES.items():
                  if any(('"' + a + '"') in sp or ("'" + a + "'") in sp for a in alias):
                      sp_det.append(of)

          rd = {}
          if (ROOT / 'render.yaml').exists():
              t = txt(ROOT / 'render.yaml')
              rd = {'servicios': re.findall(r'(?m)^\s*-\s*name:\s*([\w-]+)', t),
                    'planes': sorted(set(re.findall(r'(?i)plan:\s*([\w-]+)', t))),
                    'disco': bool(re.search(r'(?im)^\s*(?:disks?:|disk:)', t)),
                    'mount': bool(re.search(r'(?i)mountPath', t))}

          mig = 0
          vdir = ROOT / 'migrations' / 'versions'
          if vdir.is_dir():
              mig = sum(1 for x in vdir.iterdir() if x.is_file())

          def est(n):
              p = ROOT / n
              if not p.exists():
                  return 'ausente'
              try:
                  return 'vacio' if p.stat().st_size == 0 else 'con_contenido'
              except OSError:
                  return 'error'

          cfg = {n: est(n) for n in ('.env.example', '.gitignore', 'README.md', 'LICENSE', 'CONTRIBUTING.md', 'CODE_OF_CONDUCT.md', 'CONTRACTS.md', 'ARCHITECTURE.md', 'NAMESPACE_MANIFEST.md')}

          tests = [f for f in py if f.name.startswith('test_') or f.name.endswith('_test.py') or f.name == 'conftest.py']
          wfdir = ROOT / '.github' / 'workflows'
          ci = sorted(rel(x) for x in wfdir.glob('*')) if wfdir.is_dir() else []

          nm = []
          pman = ROOT / 'NAMESPACE_MANIFEST.md'
          if pman.exists():
              pat = re.compile(r'([\w./-]+)\s*\|+\s*(ACTIVA|ACTIVO|ACTIVE|ESTABLE|FUTURO|FUTURE|PLANIFICAD\w*|PLANNED|RESERVAD\w*|RESERVED|DEPRECAT\w*|DEPRECATED|EXPERIMENTAL|PARCIAL)', re.I)
              estados = {}
              for ln in txt(pman).splitlines():
                  m = pat.search(ln)
                  if m:
                      estados[m.group(1)] = m.group(2).upper()
              for ns, st in estados.items():
                  ruta = ns.strip('` ').strip('/')
                  if '/' not in ruta:
                      continue
                  d = ROOT / ruta
                  activo = st in ('ACTIVO', 'ACTIVA', 'ACTIVE', 'ESTABLE')
                  futuro = st.startswith(('FUTURO', 'FUTURE', 'RESERVAD', 'PLANIFICAD', 'PLANNED'))
                  if not d.is_dir():
                      if activo:
                          nm.append({'ns': ns, 'estado': st, 'problema': 'activo pero ruta inexistente'})
                      continue
                  con = 0
                  for x in d.rglob('*.py'):
                      try:
                          if x.stat().st_size > 0:
                              con += 1
                      except OSError:
                          pass
                  if futuro and con:
                      nm.append({'ns': ns, 'estado': st, 'problema': 'marcado futuro pero tiene %d .py con contenido' % con})
                  elif activo and not con:
                      nm.append({'ns': ns, 'estado': st, 'problema': 'marcado activo sin implementacion'})

          act = {'entradas_totales': len(dirs) + len(files), 'archivos': len(files),
                 'python_total': len(py), 'python_con_contenido': len(py) - py0,
                 'python_cero_bytes': py0, 'pyc': len(pyc),
                 'errores_sintaxis': len(synerr), 'directorios_sin_contenido': len(sin)}
          comp = {k: {'previa': v, 'actual': act[k], 'delta': act[k] - v} for k, v in REF.items()}

          comp_apps = {}
          for n, a in apps.items():
              r = REF_APPS.get(norm(n))
              if r:
                  keys = ('total', 'py', 'con', 'cero', 'pyc')
                  comp_apps[n] = {k: {'previa': rv, 'actual': a[k], 'delta': a[k] - rv} for k, rv in zip(keys, r)}

          REP = {
           'meta': {'fecha': datetime.now(timezone.utc).isoformat(timespec='seconds'), 'raiz': str(ROOT)},
           'comparacion': comp,
           'sintaxis_errores': synerr,
           'directorios_sin_contenido': {'total': len(sin), 'por_area': dict(por_area.most_common(40))},
           'duplicados': {'total_grupos': len(dups), 'cliente_red': g_net, 'js_portal': g_js, 'service_discovery': g_disc, 'top': dups[:100]},
           'seguridad': {'secretos': secr, 'clientes_sin_authorization': cli_sin, 'servidor': srv},
           'apps': apps, 'delta_apps': comp_apps,
           'oficiales': {'presentes': pres, 'faltantes': fal, 'extras': extras, 'sin_clasificar': sin_clas},
           'superapp_detecta': sp_det,
           'despliegue': {'render': rd, 'migraciones_versions': mig, 'config': cfg, 'ci': ci},
           'archivos_de_prueba': len(tests),
           'namespace_manifiesto': nm}

          S = []
          def add(x=''):
              S.append(x)

          add('# AUDITORÍA TÉCNICA — ZYRA NETWORK')
          add('')
          add('- Fecha UTC: ' + REP['meta']['fecha'])
          add('- Método: análisis estático de solo lectura (no certifica ejecución ni integraciones externas)')
          add('')
          add('## 1. Comparación con la auditoría previa (ZIP)')
          add('')
          add('| Métrica | Previa ZIP | Actual repo | Delta |')
          add('|---|---|---|---|')
          for k, v in comp.items():
              add('| %s | %s | %s | %+d |' % (k, v['previa'], v['actual'], v['delta']))
          add('')
          if act['pyc'] == 0:
              add('> .pyc = 0: los cachés compilados no están commiteados en el repo (la auditoría previa los contaba porque estaban dentro del ZIP).')
              add('')
          add('## 2. Sintaxis Python')
          add('')
          add(f"Errores: **{len(synerr)}** (previa: 0)")
          for a, e in synerr[:30]:
              add(f'- `{a}` — {e}')
          add('')
          add('## 3. Directorios sin contenido')
          add('')
          add(f"Total: **{len(sin)}** (previa: 1971)")
          add('')
          add('| Área raíz | Dirs vacíos |')
          add('|---|---|')
          for a, n in por_area.most_common(25):
              add(f'| {a} | {n} |')
          add('')
          add('## 4. Duplicados por contenido (sin .pyc)')
          add('')
          add(f"Grupos: **{len(dups)}**")
          if g_net:
              add('- Cliente de red duplicado: ' + ', '.join('`%s`' % r for r in g_net[0]))
          if g_js:
              add('- JS de portal duplicado: ' + ', '.join('`%s`' % r for r in g_js[0]))
          if g_disc:
              add('- Service discovery duplicado: ' + ', '.join('`%s`' % r for r in g_disc[0]))
          add('')
          add('| Copias | Bytes redundantes | Rutas (hasta 6) |')
          add('|---|---|---|')
          for g in dups[:15]:
              add('| %s | %s | %s |' % (g['n'], g['bytes'], '<br>'.join('`%s`' % r for r in g['rutas'][:6])))
          add('')
          add('## 5. Seguridad')
          add('')
          add(f"Posibles secretos embebidos: **{len(secr)}** (el valor no se imprime)")
          for h in secr[:30]:
              add(f"- `{h['archivo']}:{h['linea']}` — {h['patron']}")
          add('')
          add(f"Clientes HTTP sin header Authorization: **{len(cli_sin)}**")
          for c in cli_sin[:30]:
              add(f'- `{c}`')
          add('')
          if srv:
              add('Servidor (menciones de token/auth):')
              for n, v in srv.items():
                  add(f"- `{n}` → token={v['token']}, require={v['require']}, authorization={v['authorization']}")
              add('')
          add('## 6. Aplicaciones (apps/)')
          add('')
          add('| App | Archivos | Python | Con contenido | Cero bytes | .pyc | Dirs vacíos | Pruebas |')
          add('|---|---|---|---|---|---|---|---|')
          for n, a in apps.items():
              add('| %s | %s | %s | %s | %s | %s | %s | %s |' % (n, a['total'], a['py'], a['con'], a['cero'], a['pyc'], a['dirs_vacios'], a['tests']))
          add('')
          add('### Delta vs auditoría previa (previa → actual)')
          add('')
          add('| App | Archivos | Python | Con contenido | Cero | .pyc |')
          add('|---|---|---|---|---|---|')
          for n, m in comp_apps.items():
              c = ' | '.join('%s→%s (%+d)' % (x['previa'], x['actual'], x['delta']) for x in m.values())
              add('| %s | %s |' % (n, c))
          add('')
          add('- Oficiales presentes en apps/: ' + (', '.join(pres) or 'ninguna'))
          add(f"- **Oficiales FALTANTES en apps/ ({len(fal)}):** " + (', '.join(fal) or 'ninguna'))
          add('- Extras presentes: ' + (', '.join(extras) or 'ninguna'))
          add('- Sin clasificar: ' + (', '.join(sin_clas) or 'ninguna'))
          if sp:
              add('- SuperApp detecta en código: ' + (', '.join(sp_det) or 'ninguna'))
              add('- Oficiales NO detectadas en SuperApp: ' + (', '.join(o for o in OFICIALES if o not in sp_det) or 'ninguna'))
          add('')
          add('## 7. Despliegue, migraciones y configuración')
          add('')
          if rd:
              add(f"- render.yaml: servicios={rd['servicios']}, planes={rd['planes']}, **disco_persistente={rd['disco']}**")
          else:
              add('- render.yaml: ausente')
          add(f'- migrations/versions: {mig} archivos')
          add(f'- Archivos de prueba detectados: {len(tests)}')
          add(f'- CI workflows: {ci if ci else "NINGUNO"}')
          add('')
          add('| Archivo | Estado |')
          add('|---|---|')
          for k, v in cfg.items():
              add(f'| `{k}` | {v} |')
          add('')
          add('## 8. NAMESPACE_MANIFEST vs código real')
          add('')
          if nm:
              add(f"Contradicciones: **{len(nm)}**")
              for x in nm[:30]:
                  add(f"- `{x['ns']}` ({x['estado']}): {x['problema']}")
          else:
              add('Sin contradicciones detectadas (o manifiesto ausente / sin formato de tabla).')
          add('')
          add('## 9. Pendientes para homologación')
          add('')
          pend = []
          if dups: pend.append('Definir fuente canónica por cada grupo de duplicados.')
          if cli_sin: pend.append('Alinear autenticación cliente-servidor (token end-to-end).')
          if rd and not rd['disco']: pend.append('Configurar persistencia real (disco) en el despliegue.')
          if secr: pend.append('Revisar posibles secretos detectados y rotar si son reales.')
          if cfg.get('.env.example') != 'con_contenido': pend.append('Completar `.env.example`.')
          if cfg.get('.gitignore') != 'con_contenido': pend.append('Completar `.gitignore` (secretos, datos, cachés, artefactos).')
          if mig == 0: pend.append('Establecer línea base de migraciones en `migrations/versions/`.')
          if fal: pend.append('Mapear/crear estructura de las apps oficiales faltantes: ' + ', '.join(fal) + '.')
          if sin_clas: pend.append('Clasificar carpetas extra (¿oficial, laboratorio o heredada?): ' + ', '.join(sin_clas) + '.')
          if nm: pend.append('Sincronizar NAMESPACE_MANIFEST con el estado real del código.')
          if synerr: pend.append('Corregir errores de sintaxis listados arriba.')
          for i, p in enumerate(pend, 1):
              add(f'{i}. {p}')
          if not pend:
              add('Sin pendientes estructurales detectados por esta auditoría estática.')
          add('')
          add('---')
          add('*Auditoría estática automática. El comportamiento en ejecución se certifica aparte, con pruebas reales.*')

          md = '\n'.join(S)
          out = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if out:
              Path(out).write_text(md, encoding='utf-8')
              print('Summary escrito correctamente')
          else:
              Path('audit_report.md').write_text(md, encoding='utf-8')
              print('audit_report.md escrito localmente')
          Path('audit_report.json').write_text(json.dumps(REP, ensure_ascii=False, indent=2, default=str), encoding='utf-8')

          print('')
          print('===== RESUMEN =====')
          for k, v in comp.items():
              print('  %-28s %7s -> %7s (%+d)' % (k, v['previa'], v['actual'], v['delta']))
          print('  duplicados(grupos)         %6d' % len(dups))
          print('  clientes sin Authorization %6d' % len(cli_sin))
          print('  posibles secretos          %6d' % len(secr))
          print('  apps oficiales faltantes   %6d' % len(fal))
          PYEOF

      - name: Subir reporte JSON (artefacto descargable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-zyra
          path: audit_report.json
