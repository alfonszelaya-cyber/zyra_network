name: "ZYRA AUDIT EXP-2 (base para full_legal_view)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Mapa legal/consular en el repo
        run: |
          {
          echo "## Mapa legal/consular/expediente"
          echo '```'
          echo "=== menciones legal/consul/view ==="
          grep -rniE "legal_view|consular|consulat|full_legal" shared_engines apps --include='*.py' | head -20 || true
          echo "(vacio = no existe aun, se construye de cero)"
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Inventario publico de ProfileRegistry
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import inspect
          from shared_engines.network.portable_profile import ProfileRegistry
          print("## Metodos publicos de ProfileRegistry (con firma)")
          print("```")
          for n in sorted(dir(ProfileRegistry)):
              if n.startswith("_"):
                  continue
              f = getattr(ProfileRegistry, n)
              if callable(f):
                  try:
                      print(n + str(inspect.signature(f)))
                  except (TypeError, ValueError):
                      print(n)
          print("```")
          print("## RED-EXP-1 / expediente: docstrings")
          print("```")
          for n in sorted(dir(ProfileRegistry)):
              if n.startswith("_"):
                  continue
              f = getattr(ProfileRegistry, n)
              if callable(f) and f.__doc__:
                  print("--- " + n + ": " + f.__doc__.strip().splitlines()[0])
          print("```")
          EOF
          exit 0

      - name: Fuente de las funciones clave del expediente
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import inspect
          from shared_engines.network.portable_profile import ProfileRegistry
          for m in ("assurance_level", "list_documents", "add_document",
                    "revoke_document", "consents_of", "set_field",
                    "fields_of", "legal_view", "full_legal_view"):
              f = getattr(ProfileRegistry, m, None)
              print("## Fuente: " + m)
              print("```python")
              if f is None:
                  print("(NO EXISTE - RED-EXP-2 la creara)")
              else:
                  print(inspect.getsource(f))
              print("```")
          EOF
          exit 0

      - name: Tablas disponibles (para la vista)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.verification.signatures import Ed25519Signer
          db = SQLiteAdapter(":memory:")
          s, _ = Ed25519Signer.generate()
          k = ZyraKernel(db=db, clock=FrozenClock(), signer=s, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          k.bootstrap_root()
          print("## Tablas que existen tras bootstrap (materia prima de la vista)")
          print("```")
          rows = db._conn.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").fetchall()
          for r in rows:
              print(r[0])
          print("```")
          print("## Columnas de profile_fields, identity_documents, profile_consents")
          print("```")
          for t in ("profile_fields", "identity_documents", "profile_consents", "zid_freezes"):
              print("--- " + t)
              try:
                  for r in db._conn.execute(f"PRAGMA table_info({t})").fetchall():
                      print("   " + str(r[1]) + " | " + str(r[2]) + " | notnull=" + str(r[3]))
              except Exception as e:
                  print("   error: " + str(e))
          print("```")
          EOF
          exit 0

      - name: Test expediente actual (regresion viva)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          {
          echo "## test_expediente_legal_pedro (estado actual)"
          echo '```'
          timeout 120 python3 -m pytest "shared_engines/network/tests/test_portable_identity.py::test_expediente_legal_pedro" -q --tb=short --timeout=45 --timeout-method=thread 2>&1 | tail -10 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
