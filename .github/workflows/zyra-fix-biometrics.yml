                  self._cx.ejecutar(
                      "INSERT INTO lab_network_requests (id, app_destino, contrato, "
                      "solicitante_zid, estado, respuesta, creado_en, actualizado_en) "
                      "VALUES (?,?,?,?,?,?,?,?)",
                      (str(solicitud.id), solicitud.app_destino, solicitud.contrato,
                       solicitud.solicitante_zid, solicitud.estado, solicitud.respuesta,
                       solicitud.creado_en.isoformat(), solicitud.actualizado_en.isoformat()),
                  )

              def actualizar_solicitud(self, solicitud) -> bool:
                  cursor = self._cx.ejecutar(
                      "UPDATE lab_network_requests SET estado = ?, respuesta = ?, "
                      "actualizado_en = ? WHERE id = ?",
                      (solicitud.estado, solicitud.respuesta,
                       solicitud.actualizado_en.isoformat(), str(solicitud.id)),
