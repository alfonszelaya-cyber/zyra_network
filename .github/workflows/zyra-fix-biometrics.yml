name: "ZYRA pilot: AGRO + AXIS biometric enrollment"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-pilot-agro-axis
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Apply AGRO and AXIS patches
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path


          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)


          def read_lines(p):
              f = Path(p)
              if not f.exists():
                  fail("file not found: " + p)
              return f.read_text(encoding="utf-8").splitlines(keepends=True)


          def to_text(lines):
              return "".join(lines)


          def leading(line):
              return line[: len(line) - len(line.lstrip())]


          def insert_before(lines, anchor_stripped, block, marker, path):
              if marker in to_text(lines):
                  print("SKIP (marker present):", path, "->", marker)
                  return lines
              idxs = [i for i, l in enumerate(lines) if l.strip() == anchor_stripped]
              if len(idxs) != 1:
                  fail("anchor count %d (need 1) in %s: %r" % (len(idxs), path, anchor_stripped))
              i = idxs[0]
              ind = leading(lines[i])
              new = [(ind + t + "\n") if t else "\n" for t in block]
              print("INSERT before %r in %s" % (anchor_stripped, path))
              return lines[:i] + new + lines[i:]


          def replace_call(lines, pattern, pre_stripped, block, marker, path):
              if marker in to_text(lines):
                  print("SKIP (marker present):", path, "->", marker)
                  return lines
              n = len(pattern)
              hits = []
              for i in range(1, len(lines) - n):
                  if lines[i - 1].strip() != pre_stripped:
                      continue
                  window = [lines[j].strip() for j in range(i, i + n)]
                  if window == pattern:
                      hits.append(i)
              if len(hits) != 1:
                  fail("call pattern count %d (need 1) in %s" % (len(hits), path))
              i = hits[0]
              ind = leading(lines[i])
              new = [(ind + t + "\n") if t else "\n" for t in block]
              print("REPLACE call block in %s" % path)
              return lines[: i - 1] + new + lines[i + n:]


          P_AGRO_LINK = "apps/agro/services/zyra_link.py"
          P_AGRO_SRV = "apps/agro/server.py"
          P_AXIS_LINK = "apps/axis/services/axis_link.py"
          P_AXIS_SRV = "apps/axis/server.py"

          AGRO_LINK_BLOCK = [
              "def enroll_producer(",
              "    self,",
              "    *,",
              "    display_name: str,",
              "    doc_image_b64: str,",
              "    selfie_image_b64: str,",
              "    doc_kind: str | None = None,",
              "    doc_country: str | None = None,",
              "    doc_number: str | None = None,",
              ") -> tuple[bool, dict | None, str | None]:",
              "    payload: dict = {",
              "        \"kind\": \"person\",",
              "        \"display_name\": display_name,",
              "        \"actor\": \"agro\",",
              "        \"doc_image_b64\": doc_image_b64,",
              "        \"selfie_image_b64\": selfie_image_b64,",
              "    }",
              "    if doc_kind:",
              "        payload[\"doc_kind\"] = doc_kind",
              "    if doc_country:",
              "        payload[\"doc_country\"] = doc_country",
              "    if doc_number:",
              "        payload[\"doc_number\"] = doc_number",
              "    return self._client.post(",
              "        \"/identity/enroll\", payload",
              "    )",
              "",
              "",
          ]

          AXIS_LINK_BLOCK = [
              "def enroll_person(",
              "    self,",
              "    *,",
              "    display_name: str,",
              "    doc_image_b64: str,",
              "    selfie_image_b64: str,",
              "    doc_kind: str | None = None,",
              "    doc_country: str | None = None,",
              "    doc_number: str | None = None,",
              ") -> tuple[bool, dict | None, str | None]:",
              "    payload: dict = {",
              "        \"kind\": \"person\",",
              "        \"display_name\": display_name,",
              "        \"actor\": \"axis\",",
              "        \"doc_image_b64\": doc_image_b64,",
              "        \"selfie_image_b64\": selfie_image_b64,",
              "    }",
              "    if doc_kind:",
              "        payload[\"doc_kind\"] = doc_kind",
              "    if doc_country:",
              "        payload[\"doc_country\"] = doc_country",
              "    if doc_number:",
              "        payload[\"doc_number\"] = doc_number",
              "    return self._client.post(",
              "        \"/identity/enroll\", payload",
              "    )",
              "",
              "",
          ]


          def find_zid_block(fname):
              return [
                  "def " + fname + "(obj):",
                  "    if isinstance(obj, dict):",
                  "        for k, v in obj.items():",
                  "            if (",
                  "                str(k).lower() == \"zid\"",
                  "                and isinstance(v, str)",
                  "                and v.startswith(\"ZID-\")",
                  "            ):",
                  "                return v",
                  "        for v in obj.values():",
                  "            found = " + fname + "(v)",
                  "            if found is not None:",
                  "                return found",
                  "    elif isinstance(obj, list):",
                  "        for item in obj:",
                  "            found = " + fname + "(item)",
                  "            if found is not None:",
                  "                return found",
                  "    return None",
                  "",
              ]


          def missing_photos_block(app, back_path):
              return [
                  "if not (",
                  "    str(doc.get(\"doc_image_b64\") or \"\")",
                  "    and str(doc.get(\"selfie_image_b64\") or \"\")",
                  "):",
                  "    self._html(",
                  "        400,",
                  "        _page(",
                  "            \"" + app + " - Registro\",",
                  "            \"<h1>Faltan las fotos</h1>\"",
                  "            \"<p>Por ley el registro requiere\"",
                  "            \" foto del documento y selfie en vivo.</p>\"",
                  "            \"<a href='" + back_path + "'>\"",
                  "            \"<button>Volver</button></a>\",",
                  "        ),",
                  "    )",
                  "    return",
                  "",
              ]


          def rejected_block(app, back_path):
              return [
                  "if not ok:",
                  "    self._html(",
                  "        400,",
                  "        _page(",
                  "            \"" + app + " - Registro rechazado\",",
                  "            \"<h1>Registro rechazado</h1>\"",
                  "            \"<p>\"",
                  "            + str(_error)",
                  "            + \"</p>\"",
                  "            \"<a href='" + back_path + "'>\"",
                  "            \"<button>Volver</button></a>\",",
                  "        ),",
                  "    )",
                  "    return",
              ]


          def enroll_call_block(link_method):
              return [
                  "ok, data, _error = (",
                  "    link." + link_method + "(",
                  "        display_name=name,",
                  "        doc_image_b64=str(",
                  "            doc.get(\"doc_image_b64\") or \"\"",
                  "        ),",
                  "        selfie_image_b64=str(",
                  "            doc.get(\"selfie_image_b64\") or \"\"",
                  "        ),",
                  "    )",
                  ")",
              ]


          def form_block(p):
              d, s, c, v, cv, st = p + "Doc", p + "Selfie", p + "Cam", p + "Cv", p + "DocB64", p + "SelfieB64"
              stid = p + "St"
              return [
                  "\"<fieldset><legend>1) Foto del documento (por ley)</legend><input type='file' id='" + d + "' accept='image/*' capture='environment'></fieldset>\"",
                  "\"<fieldset><legend>2) Selfie en vivo</legend>\"",
                  "\"<video id='" + c + "' width='240' height='180' autoplay playsinline muted></video><br>\"",
                  "\"<button type='button' id='" + p + "Snap'>Capturar selfie</button><br>\"",
                  "\"o desde archivo: <input type='file' id='" + s + "' accept='image/*' capture='user'>\"",
                  "\"</fieldset>\"",
                  "\"<input type='hidden' name='doc_image_b64' id='" + cv + "'>\"",
                  "\"<input type='hidden' name='selfie_image_b64' id='" + st + "'>\"",
                  "\"<canvas id='" + v + "' style='display:none'></canvas>\"",
                  "\"<p id='" + stid + "'>Estado: pendiente</p>\"",
                  "\"<script>\"",
                  "\"(function(){\"",
                  "\"var doc=document.getElementById('" + d + "');\"",
                  "\"var slf=document.getElementById('" + s + "');\"",
                  "\"var vid=document.getElementById('" + c + "');\"",
                  "\"var cvv=document.getElementById('" + v + "');\"",
                  "\"var cx=cvv.getContext('2d');\"",
                  "\"var st=document.getElementById('" + stid + "');\"",
                  "\"function upd(){st.textContent='Estado: doc='+(document.getElementById('" + cv + "').value?'OK':'falta')+' | selfie='+(document.getElementById('" + st + "').value?'OK':'falta');}\"",
                  "\"function process(file,target){if(!file){return;}var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var max=800;var k=Math.min(1,max/Math.max(im.width,im.height));cvv.width=Math.round(im.width*k);cvv.height=Math.round(im.height*k);cx.drawImage(im,0,0,cvv.width,cvv.height);var d=cvv.toDataURL('image/jpeg',0.72);document.getElementById(target).value=d.split(',')[1];upd();};im.src=r.result;};r.readAsDataURL(file);}\"",
                  "\"doc.addEventListener('change',function(){process(doc.files[0],'" + cv + "');});\"",
                  "\"slf.addEventListener('change',function(){process(slf.files[0],'" + st + "');});\"",
                  "\"if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(function(s){vid.srcObject=s;}).catch(function(){st.textContent='Camara no disponible: use el archivo.';});}\"",
                  "\"document.getElementById('" + p + "Snap').addEventListener('click',function(){if(!vid.videoWidth){st.textContent='Camara aun no lista.';return;}var w=480;var k=w/vid.videoWidth;cvv.width=w;cvv.height=Math.round(vid.videoHeight*k);cx.drawImage(vid,0,0,cvv.width,cvv.height);var d=cvv.toDataURL('image/jpeg',0.72);document.getElementById('" + st + "').value=d.split(',')[1];upd();});\"",
                  "\"})();\"",
                  "\"</script>\"",
              ]


          agro_link = read_lines(P_AGRO_LINK)
          agro_link = insert_before(
              agro_link,
              "def complete_trust(",
              AGRO_LINK_BLOCK,
              "def enroll_producer",
              P_AGRO_LINK,
          )

          agro_srv = read_lines(P_AGRO_SRV)
          agro_srv = replace_call(
              agro_srv,
              [
                  "ok, data, _error = (",
                  "link.register_producer_zid(",
                  "name",
                  ")",
                  ")",
                  "if ok and data is not None:",
                  "zid = str(data.get(\"zid\"))",
              ],
              "zid: str | None = None",
              (
                  ["zid: str | None = None"]
                  + missing_photos_block("AGRO", "/agro/home")
                  + find_zid_block("_agro_find_zid")
                  + enroll_call_block("enroll_producer")
                  + rejected_block("AGRO", "/agro/home")
                  + [
                      "if data is not None:",
                      "    zid = _agro_find_zid(data)",
                  ]
              ),
              "link.enroll_producer",
              P_AGRO_SRV,
          )
          agro_srv = insert_before(
              agro_srv,
              "\"<button>Registrarme en la\"",
              form_block("agro"),
              "agroDocB64",
              P_AGRO_SRV,
          )

          axis_link = read_lines(P_AXIS_LINK)
          axis_link = insert_before(
              axis_link,
              "def record_file_event(",
              AXIS_LINK_BLOCK,
              "def enroll_person",
              P_AXIS_LINK,
          )

          axis_srv = read_lines(P_AXIS_SRV)
          axis_srv = replace_call(
              axis_srv,
              [
                  "ok, data, _error = (",
                  "link.register_person(name)",
                  ")",
                  "if ok and data is not None:",
                  "zid = str(data.get(\"zid\"))",
              ],
              "zid: str | None = None",
              (
                  ["zid: str | None = None"]
                  + missing_photos_block("AXIS", "/axis/home")
                  + find_zid_block("_axis_find_zid")
                  + enroll_call_block("enroll_person")
                  + rejected_block("AXIS", "/axis/home")
                  + [
                      "if data is not None:",
                      "    zid = _axis_find_zid(data)",
                  ]
              ),
              "link.enroll_person",
              P_AXIS_SRV,
          )
          axis_srv = insert_before(
              axis_srv,
              "\"<button>Crear cuenta\"",
              form_block("axis"),
              "axisDocB64",
              P_AXIS_SRV,
          )

          compile(to_text(agro_link), P_AGRO_LINK, "exec")
          compile(to_text(agro_srv), P_AGRO_SRV, "exec")
          compile(to_text(axis_link), P_AXIS_LINK, "exec")
          compile(to_text(axis_srv), P_AXIS_SRV, "exec")
          print("COMPILE CHECK OK")

          write = Path.write_text
          Path(P_AGRO_LINK).write_text(to_text(agro_link), encoding="utf-8")
          Path(P_AGRO_SRV).write_text(to_text(agro_srv), encoding="utf-8")
          Path(P_AXIS_LINK).write_text(to_text(axis_link), encoding="utf-8")
          Path(P_AXIS_SRV).write_text(to_text(axis_srv), encoding="utf-8")
          print("WROTE: 4 files")

          checks = [
              (P_AGRO_LINK, "def enroll_producer"),
              (P_AGRO_SRV, "link.enroll_producer"),
              (P_AGRO_SRV, "agroDocB64"),
              (P_AXIS_LINK, "def enroll_person"),
              (P_AXIS_SRV, "link.enroll_person"),
              (P_AXIS_SRV, "axisDocB64"),
          ]
          for path, marker in checks:
              if marker not in Path(path).read_text(encoding="utf-8"):
                  fail("post-check missing in %s: %s" % (path, marker))

          print("ALL PATCHES APPLIED OK")
          PYEOF

      - name: Syntax check
        run: |
          python3 -m py_compile apps/agro/services/zyra_link.py apps/agro/server.py apps/axis/services/axis_link.py apps/axis/server.py
          echo "SYNTAX OK"

      - name: Network biometrics self-test
        run: python3 -m shared_engines.security.biometrics -v

      - name: AGRO tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/agro/tests -q || true

      - name: AXIS tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/axis/tests -q || true

      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add apps/agro/services/zyra_link.py apps/agro/server.py apps/axis/services/axis_link.py apps/axis/server.py
          if git diff --cached --quiet; then
            echo "No changes (already patched)."
          else
            git commit -m "AGRO + AXIS: biometric enrollment via /identity/enroll" -m "Both apps: person registration now requires doc+selfie and calls /identity/enroll. Fixed zid extraction (nested response). Forms with camera capture added to home. Roles unchanged. AXIS life_history (newborns) untouched."
            git push
          fi
