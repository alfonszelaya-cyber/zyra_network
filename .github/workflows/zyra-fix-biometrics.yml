              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/generate", {"formato": "naked3d"}, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              ref["naked3d"] = cuerpo["datos"]["artefacto"]
              assert ref["naked3d"]["formato"] == "naked3d"

          def t_generar_holograma():
              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/generate", {"formato": "holograma"}, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              ref["holograma"] = cuerpo["datos"]["artefacto"]

          def t_generar_oligrama():
              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/generate", {"formato": "oligrama"}, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              ref["oligrama"] = cuerpo["datos"]["artefacto"]

          def t_descargar_4d():
              aid = ref["naked3d"]["id"]
              status, _, datos, headers_out = llamada("GET", "/laboratorio/api/v1/artifacts/" + aid, headers=H_DUENO)
              assert status == 200 and headers_out["Content-Type"].startswith("image/svg+xml")
              texto = datos.decode("utf-8")
              assert "animateTransform" in texto and 'data-capa="frente"' in texto
              assert 'data-capa="fondo"' in texto and 'data-capa="medio"' in texto
              aid = ref["holograma"]["id"]
              status, _, datos, _ = llamada("GET", "/laboratorio/api/v1/artifacts/" + aid, headers=H_DUENO)
              assert status == 200
              texto = datos.decode("utf-8")
              assert "url(#glow" in texto and "polygon" in texto and "animate" in texto
              aid = ref["oligrama"]["id"]
              status, _, datos, _ = llamada("GET", "/laboratorio/api/v1/artifacts/" + aid, headers=H_DUENO)
              assert status == 200
              texto = datos.decode("utf-8")
              for app in ("ZYRA", "NEXO", "AGRO", "SEMILLA", "MPE", "AXIS", "SUBASTAS", "CICLO-DIGITAL", "LABORATORIO"):
                  assert ">" + app + "<" in texto, "nodo ausente: " + app
              assert "stroke-dashoffset" in texto, "flujo animado en aristas"

          def t_formato_completo_escena_invalida():
              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/generate", {"formato": "video_mp4"}, headers=H_DUENO)
              assert status == 400 and "fase 6" in cuerpo["error"]["mensaje"]

          def t_ui_cuatro_d():
              status, _, html, _ = llamada("GET", "/laboratorio/ui/cuatro_d", headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              texto = html.decode("utf-8")
              assert "EN VIVO" in texto
              assert texto.count('data-accion=') == 3, "Ley 3, hay " + str(texto.count('data-accion='))
              assert 'id="form-timeline"' in texto and 'id="form-luz"' in texto and 'id="form-interaccion"' in texto
              assert "Volumen de la torre" in texto
              assert "12.0s @ 24fps" in texto, "timeline real listada"
              assert "#22D3EE" in texto, "luz real listada"
              assert "Torre al hacer clic" in texto, "interaccion real listada"
              status, _, html, _ = llamada("GET", "/laboratorio/ui/crear", headers=H_DUENO)
              texto = html.decode("utf-8")
              assert "Naked-3D" in texto and "Holograma" in texto and "Oligrama" in texto

          def t_ui_sin_acceso_otro():
              # CORREGIDO: el espectador solo tiene el menu inicio, por lo que
              # el panel 4D le devuelve 403 (politica correcta de roles).
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/ui/cuatro_d", headers=H_OTRO)
              assert status == 403, "espectador no accede al panel 4D: " + str(status)
              # Y por API tampoco puede editar el 4D.
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + ref["escena"]["id"] + "/timeline", {
                  "duracion_s": 5,
                  "pistas": [{"objetivo": "x", "propiedad": "opacidad", "keyframes": [{"t": 0, "valor": "1"}]}],
              }, headers=H_OTRO)
              assert status == 403, "espectador no edita 4D: " + str(status)

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              total = len(cuerpo["datos"]["rutas"])
              assert total == 38, "se esperaban 38 rutas (32 + 6 de 4D), hay " + str(total)
              ids_modulos = {m["id"] for m in cuerpo["datos"]["modulos"]}
              assert ids_modulos == {"capture", "simulation", "understanding", "design", "creation", "library", "world4d"}, str(ids_modulos)

          def t_motores_unitarios():
              n3 = MotorNaked3D()
              assert n3.capacidades()["amplitudes_px"]["frente"] == 28
              hol = MotorHolograma()
              assert "haz_conico" in hol.capacidades()["elementos"]
              oli = MotorOligrama()
              caps = oli.capacidades()
              assert len(caps["nodos"]) == 8 and caps["flujo_animado"] is True

          def t_plantillas_completas():
              assert verificar_plantillas() == 10

          sum_write("")
          sum_write("### Pruebas end-to-end Fase 4 (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Migracion v4 + datos base", preparar)
          check("Escena con capas de profundidad", t_crear_escena_con_capas)
          check("Timeline: crear, keyframes, duplicado 400", t_timeline)
          check("Timeline con propiedad invalida (400)", t_timeline_invalido)
          check("Luz: pasos, color dominante, invalidos", t_luz)
          check("Interaccion: crear, listar, invalidas", t_interaccion)
          check("Generar naked3d (parallax 3 capas)", t_generar_naked3d)
          check("Generar holograma (haz y glow)", t_generar_holograma)
          check("Generar oligrama (mapa ZYRA)", t_generar_oligrama)
          check("Descargar 4D: contenido real verificado", t_descargar_4d)
          check("video_mp4 sigue honesto (fase 6)", t_formato_completo_escena_invalida)
          check("UI cuatro_d EN VIVO con Ley 3 + datos reales", t_ui_cuatro_d)
          check("Espectador bloqueado en panel y API (403 x2)", t_ui_sin_acceso_otro)
          check("Indice publico: 38 rutas, 7 modulos", t_indice_publico)
          check("Motores unitarios (capacidades)", t_motores_unitarios)
          check("10 plantillas verificadas", t_plantillas_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 4 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 4Ab aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 4Ab - Fase 4 con test de espectador corregido a 403"
            git push
          fi
