              def test_load_basic_throughput(
                  tmp_path: Path,
              ) -> None:
                  import time as _t
                  dead = NetworkClient(
                      "http://127.0.0.1:1",
                      timeout_seconds=1.0,
                      max_retries=0,
                  )
                  srv = serve_agro(
                      AgroStore(
                          SQLiteAdapter(":memory:"), FrozenClock()
                      ),
                      dead,
                  )
                  threading.Thread(
                      target=srv.serve_forever, daemon=True
                  ).start()
                  time.sleep(0.4)
                  base = f"http://127.0.0.1:{srv.bound_port}"
                  pids = []
                  inicio = _t.time()
                  for i in range(30):
                      st, body = _pj(
                          base + "/agro/producers",
                          {
                              "name": "Carga " + str(i),
                              "producer_type":
                              "agricultor",
                              "location": "Zona "
                              + str(i),
                              "doc_image_b64": _seed(
                                  "Carga " + str(i)
                              ),
                              "selfie_image_b64": _seed(
                                  "Carga " + str(i)
                              ),
                          },
                      )
                      assert st == 201, str(body)
                      pids.append(
                          body["data"]["producer_id"]
                      )
                  duracion_reg = _t.time() - inicio

                  inicio = _t.time()
                  for i, pid in enumerate(pids[:15]):
                      st, body = _pj(
                          base + "/agro/sale/publish",
                          {
                              "producer_id": pid,
                              "product": "maiz",
                              "quantity": 10 + i,
                              "currency": "USD",
                          },
                      )
                      assert st == 201, str(body)
                  duracion_ventas = _t.time() - inicio

                  st, body = _gjp(
                      base + "/agro/sales/all"
                  )
                  ventas = body["data"]["sales"]
                  assert len(ventas) == 15, str(
                      len(ventas)
                  )
                  print(
                      "CARGA: 30 registros en",
                      round(duracion_reg, 2), "s |",
                      "15 ventas en",
                      round(duracion_ventas, 2), "s",
                  )
                  assert duracion_reg < 60
                  assert duracion_ventas < 60
              ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert "test_acceptance_full_producer_journey" in escrito
          assert "test_load_basic_throughput" in escrito
          print("OK tests en disco")
          T3EOF

      - name: "Paso 5 - verificacion interprete FRESCO"
        run: |
          python3 -c "
          from apps.agro.infrastructure.persistence.agro_migrations import run_agro_migrations, MIGRATIONS
          assert len(MIGRATIONS) >= 6
          from apps.agro.assets.translations.es import TEXTOS
          assert TEXTOS['panel_titulo'] == 'Mi Panel'
          from apps.agro.assets.templates.page_base import render_page
          assert 'DOCTYPE' in render_page('T', 'x')
          print('OK import fresco: migraciones + assets completos')
          "

      - name: "Paso 6 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN G v3: autocontenido completo" -m "Leccion RUN F aplicada: run autocontenido. Migraciones versionadas (6), assets traducciones+plantilla, ruta sales/all antes de generica, tests de aceptacion (flujo completo con textos UI) y carga (30+15) con firma _gjp correcta; verificacion en disco + import fresco."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
