name: ZYRA fix biometricos REV D

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zyra-fix-biometrics.yml'

permissions:
  contents: write

concurrency:
  group: zyra-fix-biometrics
  cancel-in-progress: true

jobs:
  revd:
    name: Parchear nucleo de registro (REV D)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NUC_A: 
      NUC_B: 
      NUC_C: 
      NUC_D: 
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Parchear superapp.py (todo o nada)
        run: |
          set -e
          python3 - <<'PYEOF'
          import base64, hashlib, os, py_compile, re, shutil, sys
          from pathlib import Path

          def fail(msg):
              print('ERROR: ' + msg)
              sys.exit(1)

          parts = [os.environ.get('NUC_' + k, '') for k in ('A', 'B', 'C', 'D')]
          b64 = ''.join(parts).replace('\n', '').replace('\r', '').strip()
          if not re.fullmatch(r'[A-Za-z0-9+/=]+', b64):
              fail('El nucleo recibido no es base64 valido')
          try:
              js = base64.b64decode(b64).decode('utf-8')
          except Exception as e:
              fail('No pude decodificar el nucleo: %r' % e)
          if len(js) < 5000:
              fail('El nucleo decodificado es demasiado corto (%d bytes)' % len(js))
          SHA_OK = '18722285c2afd5e25c06041c407c99b4232237eff70d5c5c98a16f58100abc9d'
          if hashlib.sha256(js.encode('utf-8')).hexdigest() != SHA_OK:
              fail('El nucleo recibido NO coincide con el SHA esperado: el YAML se corrompio al copiarlo. Usa el archivo original completo, sin recortes.')
          for req in ('ZYRA-REVD', 'function detectarLado', 'function simNombres', 'function mrzNombres', 'function verificar'):
              if req not in js:
                  fail('Falta en el nucleo: ' + req)

          cands = [p for p in Path('.').rglob('superapp.py') if '.git' not in p.parts]
          if len(cands) == 0:
              fail('No encontre superapp.py en el repositorio')
          if len(cands) > 1:
              fail('Encontre varias copias de superapp.py: ' + ', '.join(str(c) for c in cands))
          ruta = cands[0]
          src = ruta.read_text(encoding='utf-8')

          B = '/*ZYRA-V6-BEGIN*/'
          E = '/*ZYRA-V6-END*/'
          if src.count(B) != 1 or src.count(E) != 1:
              fail('Los marcadores del nucleo no son unicos: BEGIN=%d END=%d' % (src.count(B), src.count(E)))
          i = src.index(B)
          j = src.index(E)
          if j <= i:
              fail('Los marcadores estan en orden incorrecto')
          old = src[i + len(B):j]
          pre = src[:i + len(B)]
          post = src[j:]
          oldc = re.sub(r'\s+', '', old)
          if not re.fullmatch(r'[A-Za-z0-9+/=]*', oldc):
              fail('El nucleo actual entre los marcadores NO es base64 (es otro formato); aborto para no romper nada')
          if len(oldc) < 100:
              fail('El nucleo actual parece vacio o demasiado corto (%d chars)' % len(oldc))

          nuevo = pre + b64 + post
          if nuevo[:len(pre)] != pre or nuevo[-len(post):] != post:
              fail('Fallo la conservacion fuera del bloque')
          for tok in ('bAbrirF', 'bCapF', 'galF', 'bAbrirA', 'bCapA', 'bIr4', 'bIr5', 'tipoDoc', 'nombreNoCoincide', 'bioRechazada', 'docVencido', 'ps5', 'clave2', 'Tesseract'):
              if nuevo.count(tok) < src.count(tok):
                  fail('El parche quito referencias de: ' + tok)

          py_compile.compile(str(ruta), cfile='/tmp/zyra_base.pyc', doraise=True)
          tmp = Path('/tmp/zyra_superapp_new.py')
          tmp.write_text(nuevo, encoding='utf-8')
          py_compile.compile(str(tmp), cfile='/tmp/zyra_new.pyc', doraise=True)
          shutil.copyfile(str(tmp), str(ruta))

          js_sha = hashlib.sha256(js.encode('utf-8')).hexdigest()
          lineas = [
              '## ZYRA REV D - resultado del parche',
              '- Archivo parchado: `' + str(ruta) + '`',
              '- Linea del bloque marcado: ' + str(src[:i].count('\n') + 1),
              '- Nucleo anterior: ' + str(len(oldc)) + ' chars (base64)',
              '- Nucleo nuevo: ' + str(len(b64)) + ' chars base64 / ' + str(len(js)) + ' bytes JS',
              '- SHA256 del JS nuevo: `' + js_sha + '`',
              '- py_compile: OK (antes y despues)',
              '- Conservacion fuera del bloque: OK (byte a byte)',
              '- Resultado: PATCH_OK',
          ]
          print('\n'.join(lineas))
          s = os.environ.get('GITHUB_STEP_SUMMARY')
          if s:
              with open(s, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(lineas) + '\n\n')
          print('PATCH_OK')
          PYEOF

      - name: Publicar solo si todo valido
        run: |
          set -e
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios: el nucleo REV D ya estaba aplicado"
            echo "Sin cambios: el nucleo REV D ya estaba aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "ZYRA REV D: nucleo de registro (regreso al paso exacto, MRZ del reverso, preview chico, pasaporte 1 lado)"
            git push
            echo "Publicada revision REV D (commit $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          fi
