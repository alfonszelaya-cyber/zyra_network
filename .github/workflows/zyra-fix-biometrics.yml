name: "ZYRA GOV - decisions completo + cableado por script-file (verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: gov_data_engine.py
        run: |
          cat > apps/laboratorio/infrastructure/providers/gov_data_engine.py <<'GOV_EOF'
          """GOV-DATA: Panel Nacional en Tiempo Real (capas A y B)."""
          import time
          from collections import deque

          MAX_EVENTOS = 2000
          UMBRAL_ALERTA = 10.0
          DOMINIOS = {
              "educacion": ("SEMILLA",),
              "agro": ("AGRO",),
              "salud_justicia": ("AXIS",),
              "economia": ("NEXO",),
              "comercio": ("SUBASTAS",),
              "laboratorio": ("LABORATORIO",),
          }


          class MotorGovData:
              def __init__(self):
                  self._eventos = deque(maxlen=MAX_EVENTOS)
                  self._indicadores = {}
                  self._secuencia = 0

              def capacidades(self) -> dict:
                  return {"capa_a": "panel operativo por app",
                          "capa_b": "inteligencia nacional con recomendacion",
                          "fuente": "eventos reales de la Red",
                          "dominios": sorted(DOMINIOS.keys())}

              def _app_de_evento(self, nombre_evento) -> str:
                  prefijo = str(nombre_evento).split(".")[0].upper()
                  for dominio, apps in DOMINIOS.items():
                      if prefijo in apps:
                          return dominio
                  return "otro"

              def ingestar(self, nombre_evento, datos=None, app=None) -> dict:
                  if not nombre_evento or not str(nombre_evento).strip():
                      raise ValueError("nombre_evento requerido.")
                  datos = dict(datos or {})
                  self._secuencia += 1
                  registro = {"seq": self._secuencia,
                              "evento": str(nombre_evento)[:150],
                              "app": str(app or self._app_de_evento(nombre_evento)),
                              "datos": datos,
                              "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
                  self._eventos.append(registro)
                  clave = registro["app"] + "." + str(nombre_evento)
                  actual = self._indicadores.get(clave)
                  if actual is None:
                      self._indicadores[clave] = {"app": registro["app"],
                                                  "indicador": str(nombre_evento)[:150],
                                                  "conteo": 1, "ultimo_valor": None,
                                                  "anterior_valor": None,
                                                  "momento": registro["momento"]}
                  else:
                      actual["anterior_valor"] = actual["ultimo_valor"]
                      actual["conteo"] += 1
                      actual["momento"] = registro["momento"]
                  valor = datos.get("valor")
                  if isinstance(valor, (int, float)) and not isinstance(valor, bool):
                      actual = self._indicadores[clave]
                      actual["anterior_valor"] = actual["ultimo_valor"]
                      actual["ultimo_valor"] = float(valor)
                  return registro

              def capa_a(self) -> dict:
                  filas = []
                  for clave in sorted(self._indicadores):
                      ind = dict(self._indicadores[clave])
                      delta = None
                      if ind["ultimo_valor"] is not None and ind["anterior_valor"] is not None:
                          delta = round(ind["ultimo_valor"] - ind["anterior_valor"], 4)
                      gravedad = "alerta" if (delta is not None and abs(delta) >= UMBRAL_ALERTA) else "normal"
                      ind["delta"] = delta
                      ind["gravedad"] = gravedad
                      filas.append(ind)
                  return {"indicadores": filas, "total": len(filas),
                          "eventos_ingestados": self._secuencia}

              def capa_b(self) -> dict:
                  dominios = {}
                  for clave, ind in self._indicadores.items():
                      dominios.setdefault(ind["app"], []).append(ind)
                  consolidado = []
                  for dominio in sorted(dominios):
                      indicadores = dominios[dominio]
                      alertas = sum(1 for i in indicadores
                                    if i["ultimo_valor"] is not None
                                    and i["anterior_valor"] is not None
                                    and abs(i["ultimo_valor"] - i["anterior_valor"]) >= UMBRAL_ALERTA)
                      if alertas >= 3:
                          gravedad = "critica"
                          recomendacion = "Intervencion inmediata en " + dominio + ": " + str(alertas) + " indicadores con cambio brusco."
                      elif alertas >= 1:
                          gravedad = "alerta"
                          recomendacion = "Monitorear " + dominio + ": " + str(alertas) + " indicador(es) con cambio significativo."
                      else:
                          gravedad = "normal"
                          recomendacion = dominio + " estable: sin accion requerida."
                      consolidado.append({"dominio": dominio, "indicadores": len(indicadores),
                                          "eventos": sum(i["conteo"] for i in indicadores),
                                          "alertas": alertas, "gravedad": gravedad,
                                          "recomendacion": recomendacion})
                  return {"dominios": consolidado, "total_dominios": len(consolidado),
                          "dominios_en_alerta": sum(1 for d in consolidado if d["gravedad"] != "normal")}

              def historial(self, limite=100) -> dict:
                  limite = max(1, min(1000, int(limite)))
                  eventos = list(self._eventos)
                  return {"total": len(eventos), "eventos": eventos[-limite:]}
          GOV_EOF

      - name: decisions.py REESCRITO COMPLETO con GOV
        run: |
          cat > apps/laboratorio/routers/api/decisions.py <<'DEC_EOF'
          """Rutas de decisiones + gemelo en vivo + GOV-DATA panel nacional."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.schemas.responses.envelopes import exito

          RUTA_SIMULAR = "/laboratorio/api/v1/projects/{proyecto_id}/simulate"
          RUTA_SIMS = "/laboratorio/api/v1/projects/{proyecto_id}/simulations"
          RUTA_COMPARAR = "/laboratorio/api/v1/projects/{proyecto_id}/compare"
          RUTA_COMPARACION = "/laboratorio/api/v1/comparisons/{comparacion_id}"
          RUTA_INFORME = RUTA_COMPARACION + "/report.html"
          RUTA_OPTIMIZAR = "/laboratorio/api/v1/scenarios/{escenario_id}/optimize"
          RUTA_APLICAR = "/laboratorio/api/v1/optimizations/{optimizacion_id}/apply"
          RUTA_MONTE = "/laboratorio/api/v1/projects/{proyecto_id}/monte-carlo"
          RUTA_MONTE_COMPARA = "/laboratorio/api/v1/projects/{proyecto_id}/monte-carlo/comparar"
          RUTA_GEMELO_FUENTES = "/laboratorio/api/v1/twin/sources"
          RUTA_GEMELO_FUENTE = "/laboratorio/api/v1/twin/sources/{fuente_id}"
          RUTA_GEMELO_HISTORICO = "/laboratorio/api/v1/twin/sources/{fuente_id}/history"
          RUTA_GEMELO_ESTADO = "/laboratorio/api/v1/twin"
          RUTA_GOV_INGESTAR = "/laboratorio/api/v1/gov/eventos"
          RUTA_GOV_CAPA_A = "/laboratorio/api/v1/gov/capa-a"
          RUTA_GOV_CAPA_B = "/laboratorio/api/v1/gov/capa-b"
          RUTA_GOV_HISTORIAL = "/laboratorio/api/v1/gov/historial"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_decisiones")
              motor_mc = app.contenedor.obtener("motor_monte_carlo")
              gemelo = app.contenedor.obtener("gemelo_vivo")
              gov = app.contenedor.obtener("gov_data")

              def _simular(ctx):
                  return manejador.simular(ctx.identidad, ctx.ruta_params["proyecto_id"], ctx.json())

              def _sims(ctx):
                  return manejador.listar_simulaciones(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _comparar(ctx):
                  return manejador.comparar(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _comparacion(ctx):
                  return manejador.obtener_comparacion(ctx.identidad, ctx.ruta_params["comparacion_id"])

              def _informe(ctx):
                  return manejador.informe_comparacion(ctx.identidad, ctx.ruta_params["comparacion_id"])

              def _optimizar(ctx):
                  return manejador.optimizar(ctx.identidad, ctx.ruta_params["escenario_id"])

              def _aplicar(ctx):
                  return manejador.aplicar(ctx.identidad, ctx.ruta_params["optimizacion_id"], ctx.json_opcional())

              def _monte(ctx):
                  return exito(motor_mc.simular(ctx.json()))

              def _monte_compara(ctx):
                  return exito(motor_mc.comparar(ctx.json()))

              def _gem_registrar(ctx):
                  datos = ctx.json()
                  return exito(gemelo.registrar_fuente(
                      datos.get("id", ""), str(datos.get("tipo", "sensor")).strip(),
                      datos.get("valor", 0.0), datos.get("umbral_alto"),
                      datos.get("umbral_bajo"), str(datos.get("etiqueta", ""))))

              def _gem_actualizar(ctx):
                  datos = ctx.json()
                  return exito(gemelo.actualizar(ctx.ruta_params["fuente_id"], datos.get("valor")))

              def _gem_historico(ctx):
                  return exito(gemelo.historico(ctx.ruta_params["fuente_id"]))

              def _gem_estado(ctx):
                  return exito(gemelo.estado())

              def _gov_ingestar(ctx):
                  datos = ctx.json()
                  return exito(gov.ingestar(datos.get("evento", ""),
                                            datos.get("datos", {}), datos.get("app")))

              def _gov_capa_a(ctx):
                  return exito(gov.capa_a())

              def _gov_capa_b(ctx):
                  return exito(gov.capa_b())

              def _gov_historial(ctx):
                  return exito(gov.historial(int(ctx.query.get("limite", "100"))))

              app.registrar("POST", RUTA_SIMULAR, _simular, PermisoCodigo.SIMULAR, "Simular evolucion temporal")
              app.registrar("GET", RUTA_SIMS, _sims, PermisoCodigo.VER, "Listar simulaciones")
              app.registrar("POST", RUTA_COMPARAR, _comparar, PermisoCodigo.COMPARAR, "Comparar escenarios evaluados")
              app.registrar("GET", RUTA_COMPARACION, _comparacion, PermisoCodigo.VER, "Obtener comparacion")
              app.registrar("GET", RUTA_INFORME, _informe, PermisoCodigo.VER, "Informe HTML de la comparacion")
              app.registrar("POST", RUTA_OPTIMIZAR, _optimizar, PermisoCodigo.OPTIMIZAR, "Sugerir optimizacion")
              app.registrar("POST", RUTA_APLICAR, _aplicar, PermisoCodigo.OPTIMIZAR, "Aplicar optimizacion como escenario nuevo")
              app.registrar("POST", RUTA_MONTE, _monte, PermisoCodigo.SIMULAR, "Monte Carlo reproducible")
              app.registrar("POST", RUTA_MONTE_COMPARA, _monte_compara, PermisoCodigo.COMPARAR, "Comparar con Monte Carlo")
              app.registrar("POST", RUTA_GEMELO_FUENTES, _gem_registrar, PermisoCodigo.SIMULAR, "Registrar fuente real del gemelo")
              app.registrar("POST", RUTA_GEMELO_FUENTE, _gem_actualizar, PermisoCodigo.SIMULAR, "Actualizar valor real de una fuente")
              app.registrar("GET", RUTA_GEMELO_HISTORICO, _gem_historico, PermisoCodigo.VER, "Historico real de una fuente")
              app.registrar("GET", RUTA_GEMELO_ESTADO, _gem_estado, PermisoCodigo.VER, "Estado del gemelo digital en vivo")
              app.registrar("POST", RUTA_GOV_INGESTAR, _gov_ingestar, PermisoCodigo.VER, "Ingestar evento real al panel nacional")
              app.registrar("GET", RUTA_GOV_CAPA_A, _gov_capa_a, PermisoCodigo.VER, "GOV-DATA capa A: panel operativo por app")
              app.registrar("GET", RUTA_GOV_CAPA_B, _gov_capa_b, PermisoCodigo.VER, "GOV-DATA capa B: inteligencia nacional con recomendaciones")
              app.registrar("GET", RUTA_GOV_HISTORIAL, _gov_historial, PermisoCodigo.VER, "Historial de eventos del panel")
          DEC_EOF

      - name: Cablear service_registry (script como archivo, verificado)
        run: |
          cat > /tmp/patch_sr.py <<'PATCH_EOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/registry/services/service_registry.py")
          texto = ruta.read_text(encoding="utf-8")
          lineas = texto.splitlines(keepends=True)

          def buscar(condicion):
              for i, linea in enumerate(lineas):
                  if condicion(linea):
                      return i
              return -1

          if "MotorGovData" not in texto:
              i = buscar(lambda l: "presentation_remote import" in l and l.strip().startswith("from"))
              if i < 0:
                  raise SystemExit("FATAL: sin ancla de imports")
              sangria = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, sangria + "from apps.laboratorio.infrastructure.providers.gov_data_engine import MotorGovData\n")
              print("import MotorGovData agregado")

          texto = "".join(lineas)

          if '"gov_data"' not in texto:
              i = buscar(lambda l: 'c.registrar("modocurso"' in l)
              if i < 0:
                  i = buscar(lambda l: 'c.registrar("presentacion_remota"' in l)
              if i < 0:
                  raise SystemExit("FATAL: sin ancla de servicios")
              sangria = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, sangria + 'c.registrar("gov_data", lambda _c: MotorGovData())\n')
              print("servicio gov_data agregado")

          texto = "".join(lineas)
          if "MotorGovData" not in texto or '"gov_data"' not in texto:
              raise SystemExit("FATAL: verificacion final fallo")
          ast.parse(texto)
          ruta.write_text(texto, encoding="utf-8")
          print("service_registry verificado: sintaxis OK")
          PATCH_EOF
          python /tmp/patch_sr.py

      - name: Escribir pruebas GOV-DATA
        run: |
          cat > apps/laboratorio/tests/test_gov_data.py <<'TG_EOF'
          """GOV-DATA: panel nacional en tiempo real desde eventos reales."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.gov_data_engine import MotorGovData
          from apps.laboratorio.tests.conftest import assert_2xx


          def test_ingestar_evento_real():
              gov = MotorGovData()
              reg = gov.ingestar("semilla.matriculada", {"valor": 120}, app="educacion")
              assert reg["app"] == "educacion"
              assert gov.capa_a()["total"] == 1


          def test_evento_sin_nombre_rechaza():
              with pytest.raises(ValueError):
                  MotorGovData().ingestar("")


          def test_capa_a_delta_y_gravedad():
              gov = MotorGovData()
              gov.ingestar("nexo.factura", {"valor": 100})
              gov.ingestar("nexo.factura", {"valor": 115})
              ind = gov.capa_a()["indicadores"][0]
              assert ind["delta"] == 15.0
              assert ind["gravedad"] == "alerta"


          def test_capa_b_recomendacion_critica():
              gov = MotorGovData()
              for i in range(3):
                  gov.ingestar("agro.cosecha", {"valor": 50 + i * 12})
                  gov.ingestar("agro.venta", {"valor": 20 + i * 15})
                  gov.ingestar("agro.plaga", {"valor": 5 + i * 3})
              dominio = [d for d in gov.capa_b()["dominios"] if d["dominio"] == "agro"][0]
              assert dominio["gravedad"] == "critica"
              assert "Intervencion" in dominio["recomendacion"]


          def test_dominio_normal_sin_accion():
              gov = MotorGovData()
              gov.ingestar("subastas.venta", {"valor": 50})
              d = [d for d in gov.capa_b()["dominios"] if d["dominio"] == "otro"][0]
              assert d["gravedad"] == "normal"
              assert "estable" in d["recomendacion"]


          def test_historial_limitado():
              gov = MotorGovData()
              for i in range(10):
                  gov.ingestar("axis.emergencia", {"valor": i})
              hist = gov.historial(5)
              assert hist["total"] == 10
              assert len(hist["eventos"]) == 5


          def test_gov_por_http(app, despachar):
              status, _h, datos = despachar(
                  "POST", "/laboratorio/api/v1/gov/eventos",
                  json.dumps({"evento": "semilla.alerta.dropout", "datos": {"valor": 5},
                              "app": "educacion"}).encode("utf-8"))
              assert_2xx(status, datos)
              status2, _h2, datos2 = despachar("GET", "/laboratorio/api/v1/gov/capa-a")
              assert_2xx(status2, datos2)
              assert datos2["datos"]["total"] >= 1
              status3, _h3, datos3 = despachar("GET", "/laboratorio/api/v1/gov/capa-b")
              assert_2xx(status3, datos3)
              assert datos3["datos"]["total_dominios"] >= 1
              assert app.contenedor.obtener("outbox") is not None
          TG_EOF

      - name: Correr la suite + verificar MP4 real
        run: |
          python - <<'PYEOF'
          from apps.laboratorio.infrastructure.providers.video_encoder import MotorVideo, ffmpeg_disponible
          from apps.laboratorio.infrastructure.providers.png_encoder import encode_png_rgb

          print("ffmpeg disponible:", ffmpeg_disponible())
          frames = [encode_png_rgb(64, 48, bytes(bytes((100, 150, 200)) * (64 * 48))) for _ in range(6)]
          if ffmpeg_disponible():
              res = MotorVideo().ensamblar_mp4(frames, fps=12)
              assert b"ftypmp42" in res["video"][:32]
              print("MP4 H.264 REAL OK:", res["bytes"], "bytes")
          res_avi = MotorVideo().ensamblar_avi(frames, fps=12)
          assert res_avi["video"][:4] == b"RIFF"
          print("AVI respaldo OK:", res_avi["bytes"], "bytes")
          PYEOF
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - GOV-DATA + MP4"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "GOV-DATA capas A+B + MP4/H.264 real via ffmpeg"
            git push
          fi
