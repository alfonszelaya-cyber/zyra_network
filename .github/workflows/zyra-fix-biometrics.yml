      - name: "Paso C - GATE con visibilidad AXZ completa (4 apps)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q -s --tb=short > /tmp/pytest_out.txt 2>&1
          CODE=$?
          echo "===== AXZ TRACE ====="
          grep -E "AXZ-(STEP|WARN)" /tmp/pytest_out.txt || true
          echo "===== RESUMEN ====="
          tail -8 /tmp/pytest_out.txt
