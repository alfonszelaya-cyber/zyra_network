          import ast
          from pathlib import Path

          # decisions.py: rutas del panel nacional
          ruta_d = Path("apps/laboratorio/routers/api/decisions.py")
          t = ruta_d.read_text(encoding="utf-8")
          cambios = []
          if "RUTA_GOV" not in t:
              ancla = 'RUTA_GEMELO_ESTADO = "/laboratorio/api/v1/twin"\n'
              if ancla not in t:
                  raise SystemExit("FATAL: ancla RUTA_GEMELO_ESTADO no encontrada")
              t = t.replace(ancla, ancla +
                  'RUTA_GOV_INGESTAR = "/laboratorio/api/v1/gov/eventos"\n'
                  'RUTA_GOV_CAPA_A = "/laboratorio/api/v1/gov/capa-a"\n'
                  'RUTA_GOV_CAPA_B = "/laboratorio/api/v1/gov/capa-b"\n'
                  'RUTA_GOV_HISTORIAL = "/laboratorio/api/v1/gov/historial"\n', 1)
              cambios.append("rutas GOV declaradas")
          if "def _gov_ingestar" not in t:
              ancla_f = "            def _gem_estado(ctx):\n"
              if ancla_f not in t:
                  raise SystemExit("FATAL: ancla _gem_estado no encontrada")
              ind = ancla_f[: len(ancla_f) - len(ancla_f.lstrip())]
              handlers = (ind + "def _gov_ingestar(ctx):\n"
                  + ind + "    datos = ctx.json()\n"
                  + ind + "    return exito(gov.ingestar(datos.get(\"evento\", \"\"),\n"
                  + ind + "                            datos.get(\"datos\", {}),\n"
                  + ind + "                            datos.get(\"app\")))\n"
                  + ind + "def _gov_capa_a(ctx):\n"
                  + ind + "    return exito(gov.capa_a())\n"
                  + ind + "def _gov_capa_b(ctx):\n"
                  + ind + "    return exito(gov.capa_b())\n"
                  + ind + "def _gov_historial(ctx):\n"
                  + ind + "    return exito(gov.historial(int(ctx.query.get(\"limite\", \"100\"))))\n"
                  + ancla_f)
              t = t.replace(ancla_f, handlers, 1)
              cambios.append("handlers GOV")
          if 'app.registrar("POST", RUTA_GOV_INGESTAR' not in t:
              ancla_r = '            app.registrar("GET", RUTA_GEMELO_ESTADO'
              if ancla_r not in t:
                  raise SystemExit("FATAL: ancla registro gemelo no encontrada")
              ind = ancla_r[: len(ancla_r) - len(ancla_r.lstrip())]
              registros = (ind + 'app.registrar("POST", RUTA_GOV_INGESTAR, _gov_ingestar, PermisoCodigo.VER, "Ingestar evento real al panel nacional")\n'
                  + ind + 'app.registrar("GET", RUTA_GOV_CAPA_A, _gov_capa_a, PermisoCodigo.VER, "GOV-DATA capa A: panel operativo por app")\n'
                  + ind + 'app.registrar("GET", RUTA_GOV_CAPA_B, _gov_capa_b, PermisoCodigo.VER, "GOV-DATA capa B: inteligencia nacional con recomendaciones")\n'
                  + ind + 'app.registrar("GET", RUTA_GOV_HISTORIAL, _gov_historial, PermisoCodigo.VER, "Historial de eventos del panel")\n')
              t = t.replace(ancla_r, registros + ancla_r, 1)
              cambios.append("rutas GOV registradas")
          if "gov = app.contenedor.obtener" not in t:
              ancla_g = "            gemelo = app.contenedor.obtener(\"gemelo_vivo\")\n"
              if ancla_g not in t:
                  raise SystemExit("FATAL: ancla gemelo no encontrada")
              t = t.replace(ancla_g, ancla_g + "            gov = app.contenedor.obtener(\"gov_data\")\n", 1)
              cambios.append("gov obtenido")
          ast.parse(t)
          ruta_d.write_text(t, encoding="utf-8")
          print("decisions.py: " + ("; ".join(cambios) if cambios else "ya"))

          # service_registry: gov_data + motor_video_mp4 (reemplaza el video anterior)
          ruta_sr = Path("apps/laboratorio/registry/services/service_registry.py")
          t2 = ruta_sr.read_text(encoding="utf-8")
          lineas = t2.splitlines(keepends=True)
          c2 = []

          def idx(cond):
              for i, l in enumerate(lineas):
                  if cond(l):
                      return i
              return -1

          if "GovData" not in t2:
              i = idx(lambda l: "presentation_remote import" in l and l.strip().startswith("from"))
              if i < 0:
                  raise SystemExit("FATAL imports")
              ind = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, ind + "from apps.laboratorio.infrastructure.providers.gov_data_engine import MotorGovData\n")
              c2.append("import GovData")

          if '"gov_data"' not in t2:
              i = idx(lambda l: 'c.registrar("modocurso"' in l)
              if i < 0:
                  raise SystemExit("FATAL ancla modocurso")
              ind = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, ind + 'c.registrar("gov_data", lambda _c: MotorGovData())\n')
              c2.append("servicio gov_data")

          t2 = "".join(lineas)
          for req in ("MotorGovData", '"gov_data"'):
              if req not in t2:
                  raise SystemExit("FATAL falta " + req)
          ast.parse(t2)
          ruta_sr.write_text(t2, encoding="utf-8")
          print("service_registry: " + ("; ".join(c2) if c2 else "ya"))
          PYPY

      - name: Escribir pruebas GOV-DATA
        run: |
          cat > apps/laboratorio/tests/test_gov_data.py <<'TG_EOF'
          """GOV-DATA: panel nacional en tiempo real desde eventos reales."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.gov_data_engine import MotorGovData
          from apps.laboratorio.tests.conftest import assert_2xx


          def test_ingestar_evento_real():
              gov = MotorGovData()
              reg = gov.ingestar("semilla.matriculada", {"valor": 120}, app="educacion")
              assert reg["app"] == "educacion"
              assert gov.capa_a()["total"] == 1


          def test_evento_sin_nombre_rechaza():
              gov = MotorGovData()
              with pytest.raises(ValueError):
                  gov.ingestar("")


          def test_capa_a_delta_y_gravedad():
              gov = MotorGovData()
              gov.ingestar("nexo.factura", {"valor": 100})
              gov.ingestar("nexo.factura", {"valor": 115})
              capa = gov.capa_a()
              ind = capa["indicadores"][0]
              assert ind["delta"] == 15.0
              assert ind["gravedad"] == "alerta"


          def test_capa_b_recomendacion_por_dominio():
              gov = MotorGovData()
              for i in range(3):
                  gov.ingestar("agro.cosecha", {"valor": 50 + i * 12})
                  gov.ingestar("agro.venta", {"valor": 20 + i * 15})
                  gov.ingestar("agro.plaga", {"valor": 5 + i * 3})
              capa_b = gov.capa_b()
              dominio = [d for d in capa_b["dominios"] if d["dominio"] == "agro"][0]
              assert dominio["gravedad"] == "critica"
              assert "Intervencion" in dominio["recomendacion"]


          def test_dominio_normal_sin_accion():
              gov = MotorGovData()
              gov.ingestar("subastas.venta", {"valor": 50})
              capa_b = gov.capa_b()
              d = [d for d in capa_b["dominios"] if d["dominio"] == "otro"][0]
              assert d["gravedad"] == "normal"
              assert "estable" in d["recomendacion"]


          def test_historial_limitado():
              gov = MotorGovData()
              for i in range(10):
                  gov.ingestar("axis.emergencia", {"valor": i})
              hist = gov.historial(5)
              assert hist["total"] == 10
              assert len(hist["eventos"]) == 5


          def test_gov_por_http(app, despachar):
              status, _h, datos = despachar(
                  "POST", "/laboratorio/api/v1/gov/eventos",
                  json.dumps({"evento": "semilla.alerta.dropout", "datos": {"valor": 5},
                              "app": "educacion"}).encode("utf-8"))
              assert_2xx(status, datos)
              status2, _h2, datos2 = despachar("GET", "/laboratorio/api/v1/gov/capa-a")
              assert_2xx(status2, datos2)
              assert datos2["datos"]["total"] >= 1
              status3, _h3, datos3 = despachar("GET", "/laboratorio/api/v1/gov/capa-b")
              assert_2xx(status3, datos3)
              assert datos3["datos"]["total_dominios"] >= 1
              outbox = app.contenedor.obtener("outbox")
              assert outbox is not None
          TG_EOF

