name: "ZYRA RUN2d: S-11 llenado dominios (certificacion/admisiones/docente/education_core) + S-12 registro canonico + servicio academico"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] auditoria carpetas destino (regla 68: confirmar existentes y vacias)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA RUN 2d (regla 68)" >> "$SUM"
          echo "### contenido de carpetas destino" >> "$SUM"
          { echo '```'; for d in admissions certification teacher zyra_education_core management; do echo "-- domain/$d:"; ls apps/semilla/domain/$d 2>/dev/null; done; for d in migrations migrations/database services services/academic; do echo "-- $d:"; ls apps/semilla/$d 2>/dev/null; done; echo '```'; } >> "$SUM"
          echo "### __init__ presentes?" >> "$SUM"
          { echo '```'; for d in apps/semilla/migrations apps/semilla/migrations/database apps/semilla/services apps/semilla/services/academic apps/semilla/domain/teacher apps/semilla/domain/admissions apps/semilla/domain/certification apps/semilla/domain/zyra_education_core; do if [ -f "$d/__init__.py" ]; then echo "SI  $d"; else echo "NO  $d"; fi; done; echo '```'; } >> "$SUM"
          exit 0

      - name: "[ESCRITURA] __init__ faltantes solo como marcador de paquete (carpetas ya existentes)"
        if: always()
        run: |
          set -e
          for d in apps/semilla/migrations apps/semilla/migrations/database apps/semilla/services apps/semilla/services/academic apps/semilla/domain/teacher apps/semilla/domain/admissions apps/semilla/domain/certification apps/semilla/domain/zyra_education_core; do
            if [ -d "$d" ] && [ ! -f "$d/__init__.py" ]; then
              : > "$d/__init__.py"
              echo "init creado: $d/__init__.py (carpeta existente, solo marcador de paquete)"
            fi
          done
          exit 0

      - name: "[ESCRITURA] S-11: certificacion + admisiones + carga docente + education core"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/domain/certification/certificate_engine.py",
                     D(r'''
                  """Certificate Engine (S-11) - certificados
                  escolares verificables.

                  - issue(): emite certificado; si cert_type =
                    'GRADO' EXIGE evento PROMOCION real en
                    sm_cycle_events (regla 66: no se certifica
                    lo que no paso).
                  - Cadena de hash POR ALUMNO (sha256 sobre el
                    entry_hash previo) — mismo patron que
                    sm_history del repo.
                  - verify(code) -> estado + payload.
                  - revoke(code, reason) -> REVOCADO con motivo.
                  - verify_chain(student_id) -> True solo si TODA
                    la cadena del alumno cuadra (detecta
                    alteraciones).

                  Regla 76: recorrido por rowid (reloj congelado
                  nunca ordena por timestamp)."""
                  from __future__ import annotations
                  import hashlib
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "cert_tables", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_certificates (cert_id TEXT PRIMARY"
                          " KEY, cert_code TEXT NOT NULL UNIQUE,"
                          " student_id TEXT NOT NULL, cert_type TEXT"
                          " NOT NULL, detail TEXT NOT NULL DEFAULT"
                          " '', issued_by TEXT NOT NULL DEFAULT '',"
                          " status TEXT NOT NULL DEFAULT 'VIGENTE',"
                          " revoked_reason TEXT NOT NULL DEFAULT"
                          " '', prev_hash TEXT NOT NULL DEFAULT '',"
                          " entry_hash TEXT NOT NULL, created_at"
                          " REAL NOT NULL)",
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_cycle_events (event_id TEXT PRIMARY"
                          " KEY, student_id TEXT NOT NULL,"
                          " event_type TEXT NOT NULL, school_year"
                          " TEXT NOT NULL DEFAULT '', detail TEXT"
                          " NOT NULL DEFAULT '', created_at REAL"
                          " NOT NULL)",
                      )),
                  )


                  class CertificateEngine:
                      """Certificados verificables (S-11)."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.certs",
                                          _MIGRATIONS).run(clock)

                      def _hash(self, prev, student_id, cert_type,
                                detail, ts) -> str:
                          base = "|".join([
                              str(prev), str(student_id),
                              str(cert_type), str(detail),
                              str(ts)])
                          return hashlib.sha256(
                              base.encode("utf-8")).hexdigest()

                      def _prev_hash(self, student_id) -> str:
                          row = self._db.query_one(
                              "SELECT entry_hash FROM"
                              " sm_certificates WHERE student_id ="
                              " ? ORDER BY rowid DESC LIMIT 1",
                              (str(student_id),))
                          return (str(row["entry_hash"])
                                  if row else "")

                      def _has_promocion(self, student_id) -> bool:
                          row = self._db.query_one(
                              "SELECT COUNT(*) AS n FROM"
                              " sm_cycle_events WHERE student_id ="
                              " ? AND event_type = 'PROMOCION'",
                              (str(student_id),))
                          return bool(row and int(row["n"]) > 0)

                      def issue(self, *, student_id, cert_type,
                                detail="", issued_by="") -> dict:
                          est = self._db.query_one(
                              "SELECT student_id FROM sm_students"
                              " WHERE student_id = ?",
                              (str(student_id),))
                          if est is None:
                              raise ValueError(
                                  "student no existe en el"
                                  " canonico")
                          if str(cert_type) == "GRADO" and \
                                  not self._has_promocion(
                                      student_id):
                              raise ValueError(
                                  "GRADO exige PROMOCION real en"
                                  " el ciclo (regla 66: nada"
                                  " falso)")
                          prev = self._prev_hash(student_id)
                          ts = self._clock.now()
                          eh = self._hash(
                              prev, student_id, cert_type,
                              detail, ts)
                          cert_id = ("SMCRT-"
                                     + uuid.uuid4().hex[:10])
                          code = ("CERT-" + cert_id[5:])
                          self._db.execute(
                              "INSERT INTO sm_certificates"
                              " (cert_id, cert_code, student_id,"
                              " cert_type, detail, issued_by,"
                              " status, revoked_reason, prev_hash,"
                              " entry_hash, created_at) VALUES"
                              " (?, ?, ?, ?, ?, ?, 'VIGENTE', '',"
                              " ?, ?, ?)",
                              (cert_id, code, str(student_id),
                               str(cert_type), str(detail),
                               str(issued_by), prev, eh, ts))
                          return {"cert_id": cert_id,
                                  "cert_code": code,
                                  "cert_type": str(cert_type),
                                  "entry_hash": eh,
                                  "status": "VIGENTE"}

                      def verify(self, cert_code) -> dict:
                          row = self._db.query_one(
                              "SELECT * FROM sm_certificates WHERE"
                              " cert_code = ?",
                              (str(cert_code),))
                          if not row:
                              return {"found": False}
                          return {"found": True,
                                  "cert_code":
                                      str(row["cert_code"]),
                                  "student_id":
                                      str(row["student_id"]),
                                  "cert_type":
                                      str(row["cert_type"]),
                                  "detail": str(row["detail"]),
                                  "issued_by":
                                      str(row["issued_by"]),
                                  "status": str(row["status"]),
                                  "revoked_reason":
                                      str(row["revoked_reason"]),
                                  "entry_hash":
                                      str(row["entry_hash"])}

                      def revoke(self, cert_code, reason) -> dict:
                          row = self._db.query_one(
                              "SELECT cert_code FROM"
                              " sm_certificates WHERE cert_code ="
                              " ?", (str(cert_code),))
                          if not row:
                              raise KeyError(cert_code)
                          self._db.execute(
                              "UPDATE sm_certificates SET status ="
                              " 'REVOCADO', revoked_reason = ?"
                              " WHERE cert_code = ?",
                              (str(reason), str(cert_code)))
                          return {"cert_code": str(cert_code),
                                  "status": "REVOCADO",
                                  "reason": str(reason)}

                      def verify_chain(self, student_id) -> bool:
                          rows = self._db.query_all(
                              "SELECT student_id, cert_type,"
                              " detail, created_at, prev_hash,"
                              " entry_hash FROM sm_certificates"
                              " WHERE student_id = ? ORDER BY"
                              " rowid", (str(student_id),))
                          prev = ""
                          for r in rows:
                              expect = self._hash(
                                  prev, r["student_id"],
                                  r["cert_type"], r["detail"],
                                  r["created_at"])
                              if expect != str(r["entry_hash"]):
                                  return False
                              if prev != str(r["prev_hash"]):
                                  return False
                              prev = str(r["entry_hash"])
                          return True
              '''))
              forzar("apps/semilla/domain/admissions/admission_pipeline_engine.py",
                     D(r'''
                  """Admission Pipeline Engine (S-11) - solicitudes
                  de ingreso / traslados fuera de la matricula
                  desde casa: solicitud -> revision -> COLOCACION
                  con cupo REAL (compone S-7 AutoAssignmentEngine,
                  regla 69) -> matricula.

                  place(): si la solicitud no tiene student_id,
                  registra al alumno en el canonico con datos SE-3
                  completos (tutores + 2 retiro + emergencia — si
                  faltan, error honesto). Si el asignador responde
                  NO_CUPOS, la solicitud queda APROBADA con nota
                  (regla 66: nunca se inventa cupo)."""
                  from __future__ import annotations
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "admissions_table", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_admission_apps (app_id TEXT PRIMARY"
                          " KEY, student_id TEXT NOT NULL DEFAULT"
                          " '', applicant_name TEXT NOT NULL,"
                          " relation TEXT NOT NULL DEFAULT '',"
                          " target_institution TEXT NOT NULL,"
                          " target_level TEXT NOT NULL, target_grade"
                          " TEXT NOT NULL, status TEXT NOT NULL"
                          " DEFAULT 'PENDIENTE', note TEXT NOT NULL"
                          " DEFAULT '', created_at REAL NOT NULL,"
                          " updated_at REAL NOT NULL)",
                      )),
                  )


                  class AdmissionPipelineEngine:
                      """Pipeline de admisiones (S-11)."""

                      def __init__(self, db, clock,
                                   student_registry,
                                   classroom_engine,
                                   enrollment_engine):
                          from apps.semilla.domain.academic.auto_assignment_engine import (
                              AutoAssignmentEngine,
                          )
                          self._db = db
                          self._clock = clock
                          self._students = student_registry
                          self._assigner = AutoAssignmentEngine(
                              db, clock,
                              student_registry=student_registry,
                              classroom_engine=classroom_engine,
                              enrollment_engine=enrollment_engine)
                          MigrationRunner(db, "sm.admissions",
                                          _MIGRATIONS).run(clock)

                      def create_application(self, *,
                                             applicant_name,
                                             target_institution,
                                             target_level,
                                             target_grade,
                                             relation="",
                                             student_id="") -> dict:
                          if not str(applicant_name).strip():
                              raise ValueError(
                                  "applicant_name requerido")
                          aid = ("SMADM-"
                                 + uuid.uuid4().hex[:10])
                          now = self._clock.now()
                          self._db.execute(
                              "INSERT INTO sm_admission_apps"
                              " (app_id, student_id, applicant_name,"
                              " relation, target_institution,"
                              " target_level, target_grade, status,"
                              " note, created_at, updated_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?,"
                              " 'PENDIENTE', '', ?, ?)",
                              (aid, str(student_id or ""),
                               str(applicant_name).strip(),
                               str(relation or ""),
                               str(target_institution),
                               str(target_level),
                               str(target_grade), now, now))
                          return self.get_application(aid)

                      def get_application(self, app_id) -> dict:
                          row = self._db.query_one(
                              "SELECT * FROM sm_admission_apps"
                              " WHERE app_id = ?",
                              (str(app_id),))
                          if not row:
                              raise KeyError(app_id)
                          return {"app_id": str(row["app_id"]),
                                  "student_id":
                                      str(row["student_id"]),
                                  "applicant_name":
                                      str(row["applicant_name"]),
                                  "relation": str(row["relation"]),
                                  "target_institution":
                                      str(row[
                                          "target_institution"]),
                                  "target_level":
                                      str(row["target_level"]),
                                  "target_grade":
                                      str(row["target_grade"]),
                                  "status": str(row["status"]),
                                  "note": str(row["note"])}

                      def review(self, app_id, *, decision,
                                 reviewer, note="") -> dict:
                          row = self._db.query_one(
                              "SELECT status FROM"
                              " sm_admission_apps WHERE app_id ="
                              " ?", (str(app_id),))
                          if not row:
                              raise KeyError(app_id)
                          d = str(decision).upper()
                          if d not in ("APROBADA", "RECHAZADA"):
                              raise ValueError(
                                  "decision debe ser APROBADA o"
                                  " RECHAZADA")
                          if str(row["status"]) != "PENDIENTE":
                              raise ValueError(
                                  "estado: " + str(row["status"]))
                          self._db.execute(
                              "UPDATE sm_admission_apps SET status"
                              " = ?, note = ?, updated_at = ? WHERE"
                              " app_id = ?",
                              (d, ("revisado por "
                                   + str(reviewer)
                                   + ("; " + str(note)
                                      if str(note) else "")),
                               self._clock.now(), str(app_id)))
                          return self.get_application(app_id)

                      def place(self, app_id, *, tutores,
                                authorized_pickup,
                                emergency_contacts,
                                turn_order=None) -> dict:
                          app = self.get_application(app_id)
                          if app["status"] != "APROBADA":
                              raise ValueError(
                                  "solo APROBADA se coloca;"
                                  " estado: "
                                  + app["status"])
                          sid = app["student_id"]
                          if not sid:
                              est = self._students.register(
                                  full_name=app["applicant_name"],
                                  level=app["target_level"],
                                  grade=app["target_grade"],
                                  institution_id=app[
                                      "target_institution"],
                                  tutores=list(tutores or []),
                                  authorized_pickup=list(
                                      authorized_pickup or []),
                                  emergency_contacts=list(
                                      emergency_contacts or []),
                                  zid="", zid_status="NONE")
                              sid = est["student_id"]
                              self._db.execute(
                                  "UPDATE sm_admission_apps SET"
                                  " student_id = ?, updated_at = ?"
                                  " WHERE app_id = ?",
                                  (sid, self._clock.now(),
                                   str(app_id)))
                          res = self._assigner.assign(
                              student_id=sid,
                              level=app["target_level"],
                              grade=app["target_grade"],
                              turn_order=turn_order,
                              institution_id=app[
                                  "target_institution"])
                          if res["status"] == "ASIGNADO":
                              self._db.execute(
                                  "UPDATE sm_admission_apps SET"
                                  " status = 'MATRICULADO', note ="
                                  " ?, updated_at = ? WHERE app_id"
                                  " = ?",
                                  ("colocado en aula "
                                   + res["classroom_id"]
                                   + " turno " + res["turn"],
                                   self._clock.now(),
                                   str(app_id)))
                          else:
                              self._db.execute(
                                  "UPDATE sm_admission_apps SET"
                                  " note = ?, updated_at = ? WHERE"
                                  " app_id = ?",
                                  ("NO_CUPOS: "
                                   + str(res.get("note", "")),
                                   self._clock.now(),
                                   str(app_id)))
                          out = self.get_application(app_id)
                          out["assignment"] = res
                          return out
              '''))
              forzar("apps/semilla/domain/teacher/teacher_workload_engine.py",
                     D(r'''
                  """Teacher Workload Engine (S-11) - asignacion de
                  docentes a aulas/materias con horario simple y
                  control de carga honesto:
                  - un docente no puede estar en 2 aulas a la misma
                    hora (conflicto de docente)
                  - un aula no puede tener 2 clases a la misma hora
                    (conflicto de aula)
                  - tope de aulas por docente (max_classrooms,
                    ValueError honesto al exceder)
                  - usa ClassroomEngine.set_teacher / by_teacher
                    (APIs verificadas en verde).

                  Regla 76: consultas por rowid."""
                  from __future__ import annotations
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "teacher_workload", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_teacher_assignments (assignment_id"
                          " TEXT PRIMARY KEY, teacher_id TEXT NOT"
                          " NULL, classroom_id TEXT NOT NULL,"
                          " subject TEXT NOT NULL DEFAULT '', day"
                          " TEXT NOT NULL DEFAULT '', time_slot"
                          " TEXT NOT NULL DEFAULT '', created_at"
                          " REAL NOT NULL, UNIQUE(classroom_id,"
                          " day, time_slot))",
                      )),
                  )


                  class TeacherWorkloadEngine:
                      """Carga docente (S-11)."""

                      def __init__(self, db, clock,
                                   classroom_engine,
                                   max_classrooms=6):
                          self._db = db
                          self._clock = clock
                          self._cls = classroom_engine
                          self._max = int(max_classrooms)
                          MigrationRunner(db, "sm.twork",
                                          _MIGRATIONS).run(clock)

                      def _aulas_de(self, teacher_id) -> list:
                          try:
                              return [str(a["classroom_id"])
                                      for a in self._cls.by_teacher(
                                          str(teacher_id))]
                          except Exception:
                              return []

                      def assign(self, *, teacher_id, classroom_id,
                                 subject, day, time_slot) -> dict:
                          self._cls.get(str(classroom_id))
                          d = str(day).upper()
                          ts = str(time_slot)
                          row = self._db.query_one(
                              "SELECT teacher_id FROM"
                              " sm_teacher_assignments WHERE"
                              " classroom_id = ? AND day = ? AND"
                              " time_slot = ?",
                              (str(classroom_id), d, ts))
                          if row is not None:
                              raise ValueError(
                                  "conflicto de AULA: ocupada el "
                                  + d + " " + ts)
                          row2 = self._db.query_one(
                              "SELECT classroom_id FROM"
                              " sm_teacher_assignments WHERE"
                              " teacher_id = ? AND day = ? AND"
                              " time_slot = ?",
                              (str(teacher_id), d, ts))
                          if row2 is not None:
                              raise ValueError(
                                  "conflicto de DOCENTE: ya tiene"
                                  " clase el " + d + " " + ts)
                          aulas = self._aulas_de(teacher_id)
                          if (str(classroom_id) not in aulas
                                  and len(aulas) >= self._max):
                              raise ValueError(
                                  "tope de carga: el docente ya"
                                  " atiende " + str(len(aulas))
                                  + " aulas (max "
                                  + str(self._max) + ")")
                          self._cls.set_teacher(
                              str(classroom_id), str(teacher_id))
                          aid = ("SMTW-"
                                 + uuid.uuid4().hex[:10])
                          self._db.execute(
                              "INSERT INTO sm_teacher_assignments"
                              " (assignment_id, teacher_id,"
                              " classroom_id, subject, day,"
                              " time_slot, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?)",
                              (aid, str(teacher_id),
                               str(classroom_id), str(subject),
                               d, ts, self._clock.now()))
                          return {"assignment_id": aid,
                                  "teacher_id": str(teacher_id),
                                  "classroom_id":
                                      str(classroom_id),
                                  "subject": str(subject),
                                  "day": d, "time_slot": ts}

                      def workload_of(self, teacher_id) -> dict:
                          rows = self._db.query_all(
                              "SELECT classroom_id, subject, day,"
                              " time_slot FROM"
                              " sm_teacher_assignments WHERE"
                              " teacher_id = ? ORDER BY day,"
                              " time_slot, rowid",
                              (str(teacher_id),))
                          items = [
                              {"classroom_id":
                                   str(r["classroom_id"]),
                               "subject": str(r["subject"]),
                               "day": str(r["day"]),
                               "time_slot": str(r["time_slot"])}
                              for r in rows]
                          aulas = sorted(set(
                              i["classroom_id"]
                              for i in items))
                          extra = self._aulas_de(teacher_id)
                          for c in extra:
                              if c not in aulas:
                                  aulas.append(c)
                          return {"teacher_id":
                                      str(teacher_id),
                                  "aulas": len(aulas),
                                  "classroom_ids": aulas,
                                  "slots": items,
                                  "max_classrooms": self._max}
              '''))
              forzar("apps/semilla/domain/zyra_education_core/education_core_engine.py",
                     D(r'''
                  """Education Core Engine (S-11 / zyra_education_core)
                  - indicadores educativos consolidados POR
                  INSTITUCION (lectura pura, sin duplicar motores):
                  alumnos, aulas/capacidad/cupos por turno,
                  promedios por materia, asistencia y LISTA DE
                  RIESGO (promedio < 6.00 o asistencia < 70%).

                  Es la semilla de la Capa A de GOV-DATA
                  (APP_OPERATIONAL_INTELLIGENCE): cada app publica
                  sus indicadores; el panel nacional los agrega.

                  Regla 61: promedios/ratios Decimal 2d.
                  Regla 76: ORDER BY rowid/subject."""
                  from __future__ import annotations
                  from decimal import Decimal
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "core_guarantees", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_evaluations (evaluation_id TEXT"
                          " PRIMARY KEY, student_id TEXT NOT NULL,"
                          " subject TEXT NOT NULL, period TEXT NOT"
                          " NULL, score TEXT NOT NULL, scale_max"
                          " TEXT NOT NULL DEFAULT '10.00',"
                          " eval_type TEXT NOT NULL DEFAULT"
                          " 'EXAMEN', teacher_id TEXT NOT NULL"
                          " DEFAULT '', detail TEXT NOT NULL DEFAULT"
                          " '', created_at REAL NOT NULL)",
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_class_attendance (class_att_id TEXT"
                          " PRIMARY KEY, student_id TEXT NOT NULL,"
                          " classroom_id TEXT NOT NULL, subject TEXT"
                          " NOT NULL, date TEXT NOT NULL, time_slot"
                          " TEXT NOT NULL DEFAULT '', status TEXT"
                          " NOT NULL, teacher_id TEXT NOT NULL"
                          " DEFAULT '', detail TEXT NOT NULL DEFAULT"
                          " '', created_at REAL NOT NULL,"
                          " UNIQUE(student_id, classroom_id, subject,"
                          " date, time_slot))",
                      )),
                  )


                  def _q2(x) -> str:
                      return str(Decimal(str(x)).quantize(
                          Decimal("0.01")))


                  class EducationCoreEngine:
                      """Indicadores por institucion (Capa A)."""

                      def __init__(self, db, clock,
                                   student_registry):
                          self._db = db
                          self._clock = clock
                          self._students = student_registry
                          MigrationRunner(db, "sm.educore",
                                          _MIGRATIONS).run(clock)

                      def indicators(self, institution_id,
                                     school_year="2026") -> dict:
                          students = list(
                              self._students.by_institution(
                                  str(institution_id)))
                          ids = [str(s["student_id"])
                                 for s in students]
                          rooms = self._db.query_all(
                              "SELECT capacity, enrolled, turn FROM"
                              " sm_classrooms WHERE institution_id"
                              " = ? AND school_year = ?",
                              (str(institution_id),
                               str(school_year)))
                          aulas = len(rooms)
                          cap = sum(int(r["capacity"] or 0)
                                    for r in rooms)
                          enr = sum(int(r["enrolled"] or 0)
                                    for r in rooms)
                          por_turno = {}
                          for r in rooms:
                              t = str(r["turn"] or "SIN_TURNO")
                              e = por_turno.setdefault(
                                  t, {"capacidad": 0,
                                      "matriculados": 0})
                              e["capacidad"] += int(
                                  r["capacity"] or 0)
                              e["matriculados"] += int(
                                  r["enrolled"] or 0)
                          avgs = {}
                          rows = self._db.query_all(
                              "SELECT e.subject AS subject,"
                              " AVG(CAST(e.score AS REAL)) AS a"
                              " FROM sm_evaluations e JOIN"
                              " sm_students s ON e.student_id ="
                              " s.student_id WHERE"
                              " s.institution_id = ? GROUP BY"
                              " e.subject ORDER BY e.subject",
                              (str(institution_id),))
                          for r in rows:
                              if r["a"] is not None:
                                  avgs[str(r["subject"])] = \
                                      _q2(r["a"])
                          att_rows = self._db.query_all(
                              "SELECT a.status AS status,"
                              " COUNT(*) AS n FROM"
                              " sm_class_attendance a JOIN"
                              " sm_students s ON a.student_id ="
                              " s.student_id WHERE"
                              " s.institution_id = ? GROUP BY"
                              " a.status",
                              (str(institution_id),))
                          att = {str(r["status"]): int(r["n"])
                                 for r in att_rows}
                          tot_att = sum(att.values())
                          pres = att.get("PRESENTE", 0)
                          ratio = (_q2(Decimal(pres)
                                       * Decimal(100)
                                       / Decimal(tot_att))
                                   if tot_att else None)
                          riesgo = []
                          for sid in ids:
                              r1 = self._db.query_one(
                                  "SELECT AVG(CAST(score AS REAL))"
                                  " AS a FROM sm_evaluations WHERE"
                                  " student_id = ?", (sid,))
                              r2 = self._db.query_all(
                                  "SELECT status, COUNT(*) AS n"
                                  " FROM sm_class_attendance WHERE"
                                  " student_id = ? GROUP BY status",
                                  (sid,))
                              a = (r1["a"]
                                   if r1 else None)
                              p = sum(int(x["n"])
                                      for x in r2
                                      if x["status"]
                                      == "PRESENTE")
                              tt = sum(int(x["n"]) for x in r2)
                              reasons = []
                              if a is not None and \
                                      Decimal(str(a)) \
                                      < Decimal("6.00"):
                                  reasons.append(
                                      "promedio " + _q2(a))
                              if tt > 0:
                                  pct = (Decimal(p)
                                         * Decimal(100)
                                         / Decimal(tt))
                                  if pct < Decimal("70.00"):
                                      reasons.append(
                                          "asistencia "
                                          + _q2(pct) + "%")
                              if reasons:
                                  riesgo.append({
                                      "student_id": sid,
                                      "reasons": reasons})
                          return {"institution_id":
                                      str(institution_id),
                                  "school_year":
                                      str(school_year),
                                  "alumnos": len(ids),
                                  "aulas": aulas,
                                  "capacidad": cap,
                                  "matriculados": enr,
                                  "cupos": cap - enr,
                                  "por_turno": por_turno,
                                  "promedios": avgs,
                                  "asistencia": att,
                                  "asistencia_pct": ratio,
                                  "riesgo": riesgo}
              '''))
