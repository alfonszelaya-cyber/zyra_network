name: ZYRA AXIS Block 7 - Justice Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write justice_service.py
        run: |
          cat > apps/axis/life_history/justice_service.py <<'ZJ1'
          """AXIS Justice x Life History - additive module.

          Phase 3.1: judicial case management with extended
          lifecycle and life-history chaining.

          Extended case lifecycle (beyond the basic
          proceso/libre/preso/cerrado in AxisStore):
          denuncia -> investigacion -> audiencia ->
          sentencia -> apelacion -> cerrado

          Life-history link: a legal case of a person born
          in the civil registry is chained into their
          verifiable life record (justice_note events),
          respecting that only case EXISTENCE and STATUS go
          to the chain - never sensitive case detail.
          """
          from __future__ import annotations

          from apps.axis.life_history.service import (
              LifeHistoryService,
          )

          JUSTICE_STAGES = (
              "denuncia",
              "investigacion",
              "audiencia",
              "sentencia",
              "apelacion",
              "cerrado",
          )


          class JusticeLifeService:
              """Judicial cases chained to life history."""

              def __init__(
                  self,
                  *,
                  store,
                  life: LifeHistoryService | None,
              ) -> None:
                  self._store = store
                  self._life = life

              def _person_for_account(
                  self, account_id: str,
              ) -> str | None:
                  if self._life is None:
                      return None
                  try:
                      account = self._store.get_account(
                          account_id
                      )
                  except LookupError:
                      return None
                  zid = account.get("zid")
                  if not zid:
                      return None
                  row = self._life._store._db.query_one(
                      "SELECT person_id FROM life_persons"
                      " WHERE zid = ?",
                      (str(zid),),
                  )
                  if row is None:
                      return None
                  return str(row["person_id"])

              def open_case(
                  self,
                  *,
                  case_id: str,
                  client_account: str,
                  lawyer_account: str,
                  detail: str,
                  stage: str = "denuncia",
              ) -> dict[str, object]:
                  """Registers the case in AxisStore with the
                  extended stage and chains the case
                  EXISTENCE into the client's life history."""
                  if stage not in JUSTICE_STAGES:
                      raise ValueError(
                          f"stage must be one of"
                          f" {JUSTICE_STAGES}"
                      )
                  store_case = self._store.add_legal_case(
                      case_id=case_id,
                      client_account=client_account,
                      lawyer_account=lawyer_account,
                      status="proceso",
                      detail=f"[{stage}] {detail}",
                      sealed_doc=None,
                  )
                  person_id = self._person_for_account(
                      client_account
                  )
                  chained = False
                  if person_id is not None:
                      try:
                          self._life._store.add_life_event(
                              person_id,
                              actor=lawyer_account,
                              event_type="justice_case",
                              detail=(
                                  f"{case_id} open"
                                  f" [{stage}]"
                              ),
                          )
                          chained = True
                      except Exception:
                          chained = False
                  return {
                      **store_case,
                      "stage": stage,
                      "life_chained": chained,
                      "person_id": person_id,
                  }

              def advance_case(
                  self,
                  *,
                  case_id: str,
                  lawyer_account: str,
                  to_stage: str,
                  note: str,
              ) -> dict[str, object]:
                  """Advances the case to the next stage and
                  chains the STATUS (not the note) into the
                  life history."""
                  if to_stage not in JUSTICE_STAGES:
                      raise ValueError(
                          f"to_stage must be one of"
                          f" {JUSTICE_STAGES}"
                      )
                  current = self._store.get_case(case_id)
                  detail = str(current["detail"])
                  closed = to_stage == "cerrado"
                  updated = self._store.update_case_status(
                      case_id=case_id,
                      status=(
                          "cerrado" if closed else "proceso"
                      ),
                      detail=f"[{to_stage}] {note}",
                      sealed_doc=None,
                  )
                  person_id = self._person_for_account(
                      str(current["client_account"])
                  )
                  chained = False
                  if person_id is not None:
                      try:
                          self._life._store.add_life_event(
                              person_id,
                              actor=lawyer_account,
                              event_type=(
                                  "justice_status"
                              ),
                              detail=(
                                  f"{case_id} ->"
                                  f" {to_stage}"
                              ),
                          )
                          chained = True
                      except Exception:
                          chained = False
                  return {
                      **updated,
                      "stage": to_stage,
                      "previous_stage": (
                          detail
                      ),
                      "life_chained": chained,
                      "person_id": person_id,
                  }

              def case_expediente(
                  self, case_id: str,
              ) -> dict[str, object]:
                  """Full judicial file: case + client life
                  view + chain verification."""
                  case = self._store.get_case(case_id)
                  person_id = self._person_for_account(
                      str(case["client_account"])
                  )
                  life_view: dict[str, object] | None = (
                      None
                  )
                  if person_id is not None:
                      person = (
                          self._life._store.get_person(
                              person_id
                          )
                      )
                      life_view = {
                          "person_id": person_id,
                          "full_name": person[
                              "full_name"
                          ],
                          "events": len(
                              self._life._store.events_of(
                                  person_id
                              )
                          ),
                          "chain_verified": (
                              self._life._store
                              .events_verify(person_id)
                          ),
                      }
                  return {
                      "case": case,
                      "life": life_view,
                  }
          ZJ1
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/justice_service.py').read()); print('justice_service OK')"

      - name: Write justice E2E tests
        run: |
          cat > apps/axis/life_history/tests/test_justice_service.py <<'ZJ2'
          """Justice x Life History E2E tests."""
          from __future__ import annotations

          import unittest

          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore,
          )
          from apps.axis.life_history.justice_service import (
              JusticeLifeService,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )

          _CLIENT_ZID = "ZID-client-0001"


          class _FakeNetwork:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid == _CLIENT_ZID:
                      return (
                          True,
                          {"status": "ACTIVE"},
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-j1"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return (False, None, "unknown")


          class JusticeLifeE2E(unittest.TestCase):
              def _boot(self):
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )
                  from shared_engines.storage.database import (
                      SQLiteAdapter,
                  )

                  db = SQLiteAdapter(":memory:")
                  clock = SystemClock()
                  life_store = LifeHistoryStore(db, clock)
                  life = LifeHistoryService(
                      store=life_store,
                      client=_FakeNetwork(),
                  )
                  birth = (
                      life.register_birth_with_network(
                          registrar_account=(
                              "AX-reg-1"
                          ),
                          child_name="Cliente Nacido",
                          birth_date="1995-03-10",
                          birth_place="San Salvador",
                          sex="M",
                          mother_name="Madre C",
                          mother_zid="ZID-mother-c",
                      )
                  )
                  person_id = str(birth["person_id"])
                  life.attach_zid_with_audit(
                      person_id,
                      zid=_CLIENT_ZID,
                      actor="biometric-enroll",
                  )
                  store = AxisStore(db, clock)
                  store.add_account(
                      account_id="AX-cli-j",
                      zid=_CLIENT_ZID,
                      name="Cliente Nacido",
                      role="paciente",
                  )
                  store.add_account(
                      account_id="AX-law-j",
                      zid=None,
                      name="Abogado J",
                      role="abogado",
                  )
                  justice = JusticeLifeService(
                      store=store, life=life
                  )
                  return (
                      store,
                      life,
                      justice,
                      person_id,
                  )

              def test_case_lifecycle_chained(
                  self,
              ) -> None:
                  store, life, justice, person_id = (
                      self._boot()
                  )
                  opened = justice.open_case(
                      case_id="CASE-j1",
                      client_account="AX-cli-j",
                      lawyer_account="AX-law-j",
                      detail="robo con violencia",
                      stage="denuncia",
                  )
                  self.assertTrue(
                      opened["life_chained"]
                  )
                  advanced = justice.advance_case(
                      case_id="CASE-j1",
                      lawyer_account="AX-law-j",
                      to_stage="sentencia",
                      note="condena parcial",
                  )
                  self.assertTrue(
                      advanced["life_chained"]
                  )
                  closed = justice.advance_case(
                      case_id="CASE-j1",
                      lawyer_account="AX-law-j",
                      to_stage="cerrado",
                      note="cumplida",
                  )
                  self.assertEqual(
                      "cerrado",
                      closed["stage"],
                  )
                  self.assertEqual(
                      "cerrado",
                      closed["status"],
                  )
                  events = life._store.events_of(
                      person_id
                  )
                  justice_events = [
                      e["event_type"]
                      for e in events
                      if e["event_type"].startswith(
                          "justice"
                      )
                  ]
                  self.assertEqual(
                      [
                          "justice_case",
                          "justice_status",
                          "justice_status",
                      ],
                      justice_events,
                  )
                  self.assertTrue(
                      life._store.events_verify(
                          person_id
                      )
                  )

              def test_invalid_stage_rejected(
                  self,
              ) -> None:
                  store, life, justice, _pid = (
                      self._boot()
                  )
                  with self.assertRaises(ValueError):
                      justice.open_case(
                          case_id="CASE-bad",
                          client_account="AX-cli-j",
                          lawyer_account="AX-law-j",
                          detail="x",
                          stage="venganza",
                      )

              def test_expediente_with_life_view(
                  self,
              ) -> None:
                  store, life, justice, person_id = (
                      self._boot()
                  )
                  justice.open_case(
                      case_id="CASE-j2",
                      client_account="AX-cli-j",
                      lawyer_account="AX-law-j",
                      detail="estafa",
                      stage="investigacion",
                  )
                  file = justice.case_expediente(
                      "CASE-j2"
                  )
                  self.assertEqual(
                      "CASE-j2",
                      file["case"]["case_id"],
                  )
                  self.assertIsNotNone(
                      file["life"]
                  )
                  self.assertTrue(
                      file["life"][
                          "chain_verified"
                      ]
                  )

              def test_unlinked_client_degrades(
                  self,
              ) -> None:
                  store, life, justice, _pid = (
                      self._boot()
                  )
                  store.add_account(
                      account_id="AX-cli-ext",
                      zid=None,
                      name="Cliente Externo",
                      role="paciente",
                  )
                  opened = justice.open_case(
                      case_id="CASE-ext",
                      client_account="AX-cli-ext",
                      lawyer_account="AX-law-j",
                      detail="x",
                      stage="denuncia",
                  )
                  self.assertFalse(
                      opened["life_chained"]
                  )
                  self.assertIsNone(
                      opened["person_id"]
                  )


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          ZJ2
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_justice_service.py').read()); print('test_justice OK')"

      - name: 1/3 Justice service tests (4 E2E)
        run: python -m apps.axis.life_history.tests.test_justice_service -v

      - name: 2/3 Life History regression (7+5+3+3+3)
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q

      - name: 3/3 Full regression (biometrics 13 + AXIS 7 + TCP 6)
        run: |
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit Justice service (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "justice: JusticeLifeService - extended case lifecycle chained into life history (4 E2E tests)"
            git push
          fi
