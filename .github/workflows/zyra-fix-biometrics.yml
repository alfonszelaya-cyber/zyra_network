name: "CONSOL-3: server.py AGRO regla 77 (fase A: handlers de emergencias/registro/nacimientos a routers/) + regresion inmediata + revert si rompe"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias (cryptography explicito)
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[LECTURA] mapa de rutas y handlers del server AGRO"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## MAPA server.py AGRO (2811 lineas)" >> "$SUM"
          echo "### metodos de la clase handler (donde empieza/termina cada uno)" >> "$SUM"
          { echo '```'; grep -n "    def " apps/agro/server.py | head -50; echo '```'; } >> "$SUM"
          echo "### imports del server" >> "$SUM"
          { echo '```'; grep -n "^from \|^import " apps/agro/server.py | head -30; echo '```'; } >> "$SUM"
          echo "### routers/ existentes" >> "$SUM"
          { echo '```'; find apps/agro/routers -name "*.py" 2>/dev/null | head -15; echo '```'; } >> "$SUM"
          echo "### fin mapa" >> "$SUM"
          exit 0

      - name: "[ESCRITURA] FASE A: extraer bloque de emergencias+nacimientos a routers/ (bloques completos verificados, server.py original respaldado)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              lines = src.splitlines(keepends=True)
              backup = pathlib.Path("apps/agro/server_backup_original.py")
              backup.write_text(src, encoding="utf-8")
              py_compile.compile(str(backup), doraise=True)
              out("- server original respaldado en"
                  " server_backup_original.py (revert"
                  " garantizado)")

              tree = ast.parse(src)
              cls = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and \
                          "Handler" in node.name:
                      cls = node
                      break
              if cls is None:
                  raise RuntimeError("no handler class")
              out("- handler: " + cls.name
                  + " (lineas aprox "
                  + str(cls.end_lineno - cls.lineno) + ")")

              # metodos a extraer (los que delegan a engines
              # de dominio, verificados en mapa LECTURA):
              targets = ["_emergency_create",
                         "_emergency_dispatch",
                         "_emergency_resolve",
                         "_screen_emergencias",
                         "_birth_zid_request",
                         "_birth_register",
                         "_screen_registro_civil",
                         "_screen_life_person",
                         "_screen_longitudinal"]
              found = {}
              for node in cls.body:
                  if isinstance(node, (ast.FunctionDef,
                                       ast.AsyncFunctionDef)) \
                          and node.name in targets:
                      found[node.name] = (node.lineno,
                                          node.end_lineno)
              out("- encontrados "
                  + str(len(found)) + "/" + str(len(targets))
                  + " metodos objetivo: "
                  + ", ".join(sorted(found)))
              if len(found) < 5:
                  raise RuntimeError(
                      "menos de 5 metodos objetivo: no se"
                      " refactoriza a ciegas (regla del"
                      " dueno: auditar antes)")

              # construir modulo router con los metodos
              # extraidos como funciones libres que reciben
              # el handler (self) como primer parametro
              parts = []
              for name in sorted(found):
                  lo, hi = found[name]
                  body = "".join(lines[lo-1:hi])
                  # dedent 4 (estaban dentro de la clase)
                  body = "\n".join(
                      ln[4:] if ln.startswith("    ") else ln
                      for ln in body.splitlines())
                  fn = "def h_" + name[1:] + "(handler_self" \
                       + body[body.find("(") + 1:body.find(")")+1] \
                       .replace("self,", "", 1).lstrip(" ,") \
                       + ")" + body[body.find(")")+1:]
                  # reconstruir con firma limpia
                  sig_start = body.find("def ")
                  params = body[body.find("(",
                          sig_start)+1:body.find(")",
                          sig_start)]
                  params_clean = params.replace(
                      "self, ", "").replace("self", "")
                  parts.append(
                      "def h_" + name[1:] + "(handler_self, "
                      + params_clean.strip(" ,") + ")"
                      + body[body.find(")")+1:])
              router_src = (
                  '"""Emergency & birth routers (CONSOL-3 fase A)\n'
                  '- extraidos del server.py AGRO (regla 77)\n'
                  '- las funciones reciben el handler como\n'
                  '  primer parametro (mismo acceso a store,\n'
                  '  link, _html, _send) — comportamiento\n'
                  '  identico, codigo reubicado.'\n
                  '"""'.replace("'\n","'\n") + '\n'
                  'from __future__ import annotations\n\n'
                  + "\n\n".join(parts) + "\n")
              rp = pathlib.Path(
                  "apps/agro/routers/emergency_birth_router.py")
              rp.parent.mkdir(parents=True, exist_ok=True)
              rp.write_text(router_src, encoding="utf-8")
              py_compile.compile(str(rp), doraise=True)
              out("- **router creado: emergency_birth_router.py"
                  " (" + str(len(parts)) + " funciones)**")

              # reescribir server.py: los metodos extraidos
              # se reemplazan por delegaciones
              new_lines = list(lines)
              for name in sorted(found, key=lambda n: -found[n][0]):
                  lo, hi = found[name]
                  params = src[src.find("(", src.find(
                      "def " + name)):src.find(")",
                      src.find("def " + name))]
                  params_clean = params.strip("()").replace(
                      "self, ", "").replace("self", "")
                  call_args = params_clean
                  deleg = ("    from apps.agro.routers."
                           "emergency_birth_router import h_"
                           + name[1:] + "\n"
                           "    return h_" + name[1:] + "(self"
                           + (", " + call_args if call_args
                              else "") + ")\n")
                  new_lines[lo-1:hi] = [deleg]
              new_src = "".join(new_lines)
              ast.parse(new_src)
              SP.write_text(new_src, encoding="utf-8")
              py_compile.compile(str(SP), doraise=True)
              out("- **server.py refactorizado: "
                  + str(len(found)) + " metodos -> delegaciones"
                  " (lineas nuevas: "
                  + str(len(new_src.splitlines())) + ")**")
              out("- reduccion: 2811 -> "
                  + str(len(new_src.splitlines()))
                  + " lineas (fase A)")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO — revert automatico")
              try:
                  bak = pathlib.Path(
                      "apps/agro/server_backup_original.py")
                  if bak.exists():
                      SP.write_text(
                          bak.read_text(encoding="utf-8"),
                          encoding="utf-8")
                      out("- server.py RESTAURADO desde backup")
              except Exception:
                  pass
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion AGRO completa (valida el refactor)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — refactor VALIDADO" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed) — REVERT del refactor" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -50 /tmp/x3.out; echo '```'; } >> "$SUM"
            cp apps/agro/server_backup_original.py apps/agro/server.py
            echo "- server.py RESTAURADO (estado estable anterior)" >> "$SUM"
          fi
          exit 0

      - name: "[ENTREGA] commit solo si AGRO verde con el refactor"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**CONSOL-3 fase A BLOQUEADA — server.py revertido al estado estable. El refactor se reintenta por bloques mas pequenos en el proximo run.**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**CONSOL-3: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(CONSOL-3 fase A, regla 77): server.py AGRO 2811->reducido — handlers de emergencias + registro civil + nacimientos extraidos a routers/emergency_birth_router.py como funciones libres (reciben el handler, comportamiento identico) + server original respaldado en server_backup_original.py (revert garantizado) + regresion AGRO completa verde validando el refactor — fases siguientes: los demas bloques de handlers"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**CONSOL-3 FASE A OK — server.py reducido y validado. FASE B siguiente (siguiente bloque de handlers) hasta dejar el server bajo regla 77. SISTEMA: CONSOL-1 ✅ CONSOL-2 ✅ CONSOL-3 en curso.**"
          exit 0
