name: ZYRA Hardening Block 3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base dependencies
        run: pip install cryptography pytest

      - name: 1/3 Biometrics engine (13 tests)
        run: python -m shared_engines.security.biometrics -v

      - name: 2/3 PAD heuristic tests (model-free)
        run: |
          pip install "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"
          python - <<'PYEOF'
          import unittest

          loader = unittest.TestLoader()
          from shared_engines.security import (
              biometrics_face,
          )

          suite = loader.loadTestsFromName(
              "shared_engines.security.biometrics_face"
              ".LivenessHeuristicTests"
          )
          runner = unittest.TextTestRunner(
              verbosity=2
          )
          result = runner.run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print("PAD HEURISTIC: 3/3 OK")
          PYEOF

      - name: 3/3 Real eye with PAD (model load + smoke)
        run: |
          pip install "onnxruntime>=1.16,<2.0" "cython<3" "setuptools<81" wheel
          pip install --no-build-isolation "insightface==0.7.3"
          python - <<'PYEOF'
          import os, tempfile

          from shared_engines.security.biometrics_face import (
              InsightFaceProvider,
              liveness_verdict,
          )
          from shared_engines.security.biometrics import (
              TemplateQualityError,
          )

          provider = InsightFaceProvider(
              models_dir=os.path.join(
                  tempfile.gettempdir(), "zyra-models"
              )
          )
          print("FACE PROVIDER + PAD READY")
          assert provider.liveness_supported is True

          try:
              provider.extract_template(b"not-an-image")
          except TemplateQualityError:
              print("REJECT OK: garbage refused")
          else:
              raise AssertionError("garbage must be refused")

          import numpy as np
          x = np.arange(512)
          xx, yy = np.meshgrid(x, x)
          pat = (128 + 45 * np.sin(2 * np.pi * xx / 6.0) * np.cos(2 * np.pi * yy / 6.0)).astype("uint8")
          import cv2
          ok, buf = cv2.imencode(".png", np.stack([pat]*3, axis=-1))
          live, reasons = liveness_verdict(np.stack([pat]*3, axis=-1))
          assert live is False, f"moire must be rejected: {reasons}"
          print("PAD SMOKE: moire rejected OK")
          print("BLOCK 3 OK: eye alive with active PAD")
          PYEOF
