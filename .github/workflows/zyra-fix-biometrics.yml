name: "ZYRA NEXO E5b v2: import-check antes de test"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Escribir modulos 8+9 y verificar imports ANTES del test
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def wf(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
                  return True
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")
                  return False

          # ===== MODULO 8: simplificado, emit a nivel modulo =====
          M8 = D(r'''
              """Modulo 8 Gobierno del Sistema."""
              from __future__ import annotations
              from typing import Dict, List
              from datetime import datetime

              _gov8_events = []

              def emit(event_name, payload=None):
                  _gov8_events.append({"event": event_name,
                                       "payload": payload or {},
                                       "timestamp": datetime.utcnow().isoformat()})

              def get_gov8_events():
                  return list(_gov8_events)

              SUBDOMINIOS_M8 = [
                  "Nucleo de Gobierno",
                  "Control de Versiones Avanzado",
                  "Gobierno de Cambios",
                  "Auditoria Suprema",
                  "Rollback & Recuperacion",
                  "Gestion de Incidentes Criticos",
                  "Escalamiento Inteligente",
                  "Gobierno de ZYRA",
                  "Modo Crisis / Emergencia",
                  "Cumplimiento & Soberania",
                  "Supervision ROOT Suprema",
                  "Congelacion & Sellado",
              ]

              class Modulo8Gobierno:
                  """Gobierno del Sistema: 12 subdominios."""

                  def __init__(self, audit=None):
                      self._audit = audit

                  def registrar(self, subdominio, accion):
                      emit("M8_" + subdominio.upper().replace(" ", "_"),
                           {"accion": accion})
                      registro = {"modulo": "M8",
                                  "subdominio": subdominio,
                                  "accion": accion,
                                  "timestamp": datetime.utcnow().isoformat()}
                      return registro

                  def nucleo_gobierno(self):
                      return self.registrar("Nucleo de Gobierno",
                                            "Estado Transversal Permanente")

                  def control_versiones(self):
                      return self.registrar("Control de Versiones Avanzado",
                                            "Versionado Global")

                  def gobierno_cambios(self):
                      return self.registrar("Gobierno de Cambios",
                                            "Aprobacion Escalonada")

                  def auditoria_suprema(self):
                      return self.registrar("Auditoria Suprema",
                                            "Auditoria Total del Sistema")

                  def rollback_recuperacion(self):
                      return self.registrar("Rollback & Recuperacion",
                                            "Recuperacion Post-Incidente")

                  def gestion_incidentes(self):
                      return self.registrar("Gestion de Incidentes Criticos",
                                            "Clasificacion de Severidad")

                  def escalamiento_inteligente(self):
                      return self.registrar("Escalamiento Inteligente",
                                            "Escalamiento Automatico")

                  def gobierno_zyra(self):
                      return self.registrar("Gobierno de ZYRA",
                                            "Limites de Autonomia")

                  def modo_crisis(self):
                      return self.registrar("Modo Crisis / Emergencia",
                                            "Congelacion de Operaciones")

                  def cumplimiento_soberania(self):
                      return self.registrar("Cumplimiento & Soberania",
                                            "Cumplimiento Legal Global")

                  def supervision_root(self):
                      return self.registrar("Supervision ROOT Suprema",
                                            "Vista Total del Sistema")

                  def congelacion_sellado(self):
                      return self.registrar("Congelacion & Sellado",
                                            "Sellado de Estado")

                  def get_subdominios(self):
                      return list(SUBDOMINIOS_M8)

                  def get_events(self):
                      return get_gov8_events()
          ''')

          # ===== MODULO 9: simplificado, emit a nivel modulo =====
          M9 = D(r'''
              """Modulo 9 Meta Gobierno y Soberania."""
              from __future__ import annotations
              from typing import Dict, List
              from datetime import datetime

              _meta9_events = []

              def emit(event_name, payload=None):
                  _meta9_events.append({"event": event_name,
                                        "payload": payload or {},
                                        "timestamp": datetime.utcnow().isoformat()})

              def get_meta9_events():
                  return list(_meta9_events)

              SUBMENUS_M9 = {
                  "SOBERANIA_DEL_SISTEMA": ["Independencia Operativa",
                      "Aislamiento por Jurisdiccion",
                      "Control de Dependencias Externas",
                      "Autonomia por Pais",
                      "Modo Soberano Offline"],
                  "META_CONTROL_DE_VERSIONES": ["Versionado Multilinea",
                      "Versionado por Jurisdiccion",
                      "Versionado de Estados",
                      "Versionado de Modelos ZYRA",
                      "Linea Temporal Inmutable"],
                  "AUDITORIA_META_TOTAL": ["Auditoria de Auditorias",
                      "Auditoria de Decisiones Humanas",
                      "Auditoria de Decisiones ZYRA",
                      "Auditoria de Crisis",
                      "Registro Inmutable Global"],
                  "GOBIERNO_DE_GOBIERNOS": ["Reglas de Estados",
                      "Reglas de Emergencia",
                      "Reglas Supra-Legales",
                      "Jerarquia de Autoridades",
                      "Resolucion de Conflictos Normativos"],
                  "CONTINUIDAD_ABSOLUTA": ["Operacion Continua",
                      "Auto-Recuperacion", "Redundancia Logica",
                      "Redundancia Geografica", "Persistencia ZYRA"],
                  "META_GESTION_DE_CRISIS": ["Crisis Sistemica",
                      "Crisis Financiera Global", "Crisis Legal Estatal",
                      "Crisis Tecnologica", "Simulacion de Supervivencia"],
                  "ESCALAMIENTO_SUPREMO": ["Escalamiento Autonomo ZYRA",
                      "Escalamiento Consejo Humano",
                      "Escalamiento ROOT Supremo", "Emergencia Total"],
                  "GOBIERNO_DE_LA_IA": ["Limites de Evolucion",
                      "Control de Aprendizaje",
                      "Autorizacion de Auto-Mejora", "Apagado Etico"],
                  "ETICA_LEY_CONFIANZA": ["Principios Eticos",
                      "Compatibilidad Legal Global",
                      "Transparencia Controlada", "Evidencia Moral"],
                  "SUPERVISION_SUPRA_ROOT": ["Vista Omnisciente",
                      "Control Transversal", "Decision Final",
                      "Firma Suprema"],
                  "SELLADO_DE_CIVILIZACION_DIGITAL": ["Congelacion Total",
                      "Sellado de Estados", "Archivo Historico",
                      "Referencia Canonica"],
              }

              class Modulo9MetaGobierno:
                  """Meta Gobierno: 11 subdominios de soberania."""

                  def __init__(self, audit=None):
                      self._audit = audit

                  def get_subdominios(self):
                      return list(SUBMENUS_M9.keys())

                  def entrar(self, subdominio):
                      items = SUBMENUS_M9.get(subdominio, [])
                      emit("M9_" + subdominio, {"total": len(items)})
                      return {"subdominio": subdominio,
                              "items": items, "total": len(items)}

                  def zyra_in(self):
                      emit("MODULO_9_ENTRADA")

                  def zyra_out(self):
                      emit("MODULO_9_SALIDA")

                  def get_events(self):
                      return get_meta9_events()
          ''')

          # ESCRIBIR AMBOS
          wf("apps/nexo/module/modulo_8_gobierno.py", M8)
          wf("apps/nexo/module/modulo_9_meta_gobierno.py", M9)

          try:
              ip = pathlib.Path("apps/nexo/module") / "__init__.py"
              if not ip.exists():
                  ip.write_text("", encoding="utf-8")
          except Exception:
              pass

          # ===== IMPORT CHECK ANTES DE ESCRIBIR EL TEST =====
          import_ok = False
          try:
              import sys as _s
              _s.path.insert(0, ".")
              from apps.nexo.module.modulo_8_gobierno import (
                  emit as _e8, get_gov8_events as _g8,
                  Modulo8Gobierno as _M8)
              from apps.nexo.module.modulo_9_meta_gobierno import (
                  emit as _e9, get_meta9_events as _g9,
                  Modulo9MetaGobierno as _M9, SUBMENUS_M9 as _S9)
              # Probar que emit funciona de verdad
              _e8("CHECK_M8")
              _e9("CHECK_M9")
              assert len(_g8()) > 0
              assert len(_g9()) > 0
              assert len(_S9) == 11
              import_ok = True
              out("- **IMPORT CHECK: OK (emit + get_events + 11 subdominios verificados)**")
          except Exception:
              import_ok = False
              out("- **IMPORT CHECK: FALLO**")
              out("```\n" + traceback.format_exc().strip() + "\n```")

          # SOLO escribir el test si el import check paso
          if import_ok:
              TEST = D(r'''
                  """Tests L5b: modulos 8 y 9."""
                  from __future__ import annotations
                  from apps.nexo.module.modulo_8_gobierno import (
                      emit as emit8, get_gov8_events,
                      Modulo8Gobierno)
                  from apps.nexo.module.modulo_9_meta_gobierno import (
                      emit as emit9, get_meta9_events,
                      Modulo9MetaGobierno, SUBMENUS_M9)

                  def test_modulo8_12_subdominios() -> None:
                      m8 = Modulo8Gobierno()
                      subs = m8.get_subdominios()
                      assert len(subs) == 12, str(subs)
                      r = m8.nucleo_gobierno()
                      assert r["modulo"] == "M8"
                      r2 = m8.modo_crisis()
                      assert r2["subdominio"] == "Modo Crisis / Emergencia"
                      print("OK m8: 12 subdominios")

                  def test_modulo8_eventos() -> None:
                      emit8("M8_TEST")
                      events = get_gov8_events()
                      assert events[-1]["event"] == "M8_TEST"
                      print("OK m8: eventos")

                  def test_modulo9_11_subdominios() -> None:
                      subs = Modulo9MetaGobierno().get_subdominios()
                      assert len(subs) == 11, str(subs)
                      r = Modulo9MetaGobierno().entrar("SOBERANIA_DEL_SISTEMA")
                      assert r["total"] == 5
                      events = get_meta9_events()
                      assert events[-1]["event"] == "M9_SOBERANIA_DEL_SISTEMA"
                      print("OK m9: 11 subdominios + entrar")

                  def test_modulo9_zeroin_out() -> None:
                      m9 = Modulo9MetaGobierno()
                      m9.zyra_in()
                      m9.zyra_out()
                      events = get_meta9_events()
                      tipos = [e["event"] for e in events]
                      assert "MODULO_9_ENTRADA" in tipos
                      assert "MODULO_9_SALIDA" in tipos
                      print("OK m9: zyra_in/zyra_out")
              ''')
              try:
                  ast.parse(TEST)
                  p = pathlib.Path("apps/nexo/tests/test_modulos_89.py")
                  p.write_text(TEST, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  out("- **tests: OK (escritos tras import check OK)**")
              except Exception:
                  out("- **tests: ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")
          else:
              out("- **IMPORT CHECK FALLO: test NO escrito, revisa el error arriba**")
          exit(0)
          PYEOF

      - name: "L5b-1: tests modulos 8+9"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          if [ ! -f apps/nexo/tests/test_modulos_89.py ]; then
            echo "- L5b: SKIPPED (import check fallo, test no escrito)" >> "$GITHUB_STEP_SUMMARY"
            echo "1" > /tmp/l5b
            exit 0
          fi
          find apps/nexo -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 120 python3 -m pytest apps/nexo/tests/test_modulos_89.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/l5b.out 2>&1
          echo $? > /tmp/l5b
          if [ "$(cat /tmp/l5b)" = "0" ]; then echo "- L5b: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L5b: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L5b detalle"; echo '```'; tail -80 /tmp/l5b.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "L5b-2: nexo completo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/l5bb.out 2>&1
          echo $? > /tmp/l5bb
          if [ "$(cat /tmp/l5bb)" = "0" ]; then echo "- L5b2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L5b2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L5b2 detalle"; echo '```'; tail -50 /tmp/l5bb.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "L5b-3: apps otras + shared"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/l5c.out 2>&1
          echo $? > /tmp/l5c
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/l5d.out 2>&1
          ok3=$?
          if [ "$(cat /tmp/l5c)" = "0" ] && [ "$ok3" = "0" ]; then echo "- L5c: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L5c: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L5c detalle"; echo '```'; tail -60 /tmp/l5c.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in l5b l5bb l5c; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: L5b VERDES — MODULOS 8+9 MIGRADOS**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-E5b v2): modulos 8+9 - emit/get_events a nivel modulo, import check antes del test (L5b verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 5 COMPLETO. Sigue LOTE 6.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
