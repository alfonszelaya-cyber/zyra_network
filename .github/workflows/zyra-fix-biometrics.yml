      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AXIS AX-3 CERRADO: test e2e gobierno 100% estricto + visibilidad AXZ" -m "La sonda in-proc confirmo que register_birth_with_network funciona y serializa; el gate llevaba 2 runs verdes. Se reactivan los asserts duros de ingesta (201) y verify publico (403/201/200/409). El gate ahora imprime el trace AXZ-STEP completo (antes lo tapaba el ruido de teardown). Si todo pasa: AX-1+AX-2+AX-3 cerrados al 100% estricto; sigue AX-4."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
