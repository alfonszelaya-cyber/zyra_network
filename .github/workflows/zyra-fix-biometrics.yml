              suma("")
              suma("### 0) Nota de esta version")
              suma("- El nucleo v6 viaja CODIFICADO (base64 dentro de un solo bloque) y se inserta en UN unico punto: ya no hay modo de romper cadenas de Python (causa del rechazo de la corrida #947).")
