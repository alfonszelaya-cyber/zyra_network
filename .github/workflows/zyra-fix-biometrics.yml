name: "ZYRA EX - ModoCurso + orbital + desastres + tests (autocontenido, verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: presentation_remote.py con ModoCurso
        run: |
          cat > apps/laboratorio/infrastructure/providers/presentation_remote.py <<'PR_EOF'
          """Presentacion holografica interactiva + MODO CURSO (EX-4)."""
          import json
          import time

          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.hologram_engine import MotorHolograma
          from apps.laboratorio.shared.models.identifiers import nuevo_id

          ACCIONES_VALIDAS = ("avanzar", "retroceder", "ir_a", "tocar_punto", "finalizar")


          def _escapar(t):
              return str(t).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


          def _escena_holo(nombre):
              try:
                  return Escena3D(nombre=nombre, ancho=900, alto=700, objetos=[])
              except TypeError:
                  try:
                      return Escena3D(nombre, 900, 700, [])
                  except Exception:
                      esc = Escena3D.__new__(Escena3D)
                      for a, v in (("nombre", nombre), ("ancho", 900), ("alto", 700), ("objetos", [])):
                          setattr(esc, a, v)
                      return esc


          class SesionPresentacion:
              def __init__(self, id_sesion, presentacion, proyector):
                  self.id = str(id_sesion)
                  self._presentacion = presentacion
                  self._proyector = proyector
                  self._holograma = MotorHolograma()
                  self.paso_actual = 0
                  self.activa = True
                  self.anotaciones = []
                  self.historial = []
                  self.iniciada_en = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

              def _pasos(self):
                  return list(getattr(self._presentacion, "pasos", []) or [])

              def total_pasos(self):
                  return len(self._pasos())

              def _registrar(self, accion, detalle):
                  e = {"accion": str(accion), "detalle": dict(detalle or {}),
                       "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
                  self.historial.append(e)
                  return e

              def _paso_datos(self):
                  pasos = self._pasos()
                  if not pasos:
                      return {"indice": 0, "total": 0, "titulo": "", "contenido": ""}
                  paso = pasos[min(self.paso_actual, len(pasos) - 1)]
                  try:
                      datos = paso.a_dict() if hasattr(paso, "a_dict") else dict(paso)
                  except Exception:
                      datos = {"titulo": str(getattr(paso, "titulo", ""))}
                  datos["indice"] = self.paso_actual
                  datos["total"] = len(pasos)
                  return datos

              def avanzar(self):
                  total = self.total_pasos()
                  if self.paso_actual < total - 1:
                      self.paso_actual += 1
                  self._registrar("avanzar", {"paso": self.paso_actual})
                  return {"paso": self.paso_actual, "total": total}

              def retroceder(self):
                  if self.paso_actual > 0:
                      self.paso_actual -= 1
                  self._registrar("retroceder", {"paso": self.paso_actual})
                  return {"paso": self.paso_actual, "total": self.total_pasos()}

              def ir_a(self, indice):
                  indice = int(indice)
                  total = self.total_pasos()
                  if not 0 <= indice < total:
                      raise ValueError("indice fuera de rango 0.." + str(total - 1))
                  self.paso_actual = indice
                  self._registrar("ir_a", {"paso": indice})
                  return {"paso": self.paso_actual, "total": total}

              def tocar_punto(self, x, y, etiqueta=""):
                  xv, yv = float(x), float(y)
                  if xv < 0 or yv < 0:
                      raise ValueError("coordenadas no pueden ser negativas.")
                  a = {"id": "anot-" + str(len(self.anotaciones) + 1).zfill(4),
                       "paso": self.paso_actual, "x": round(xv, 2), "y": round(yv, 2),
                       "etiqueta": str(etiqueta or "")[:200],
                       "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
                  self.anotaciones.append(a)
                  self._registrar("tocar_punto", {"paso": self.paso_actual, "x": a["x"], "y": a["y"]})
                  return dict(a)

              def anotaciones_del_paso(self, indice=None):
                  indice = self.paso_actual if indice is None else int(indice)
                  return [dict(a) for a in self.anotaciones if a["paso"] == indice]

              def frame_holograma(self):
                  paso = self._paso_datos()
                  titulo = str(paso.get("titulo", "") or ("Paso " + str(paso["indice"] + 1)))
                  svg = self._holograma.generar(_escena_holo(titulo)).decode("utf-8")
                  texto = str(paso.get("contenido", "") or paso.get("descripcion", "") or "")
                  marcas = []
                  if texto:
                      y = 60
                      for i in range(0, min(len(texto), 240), 60):
                          marcas.append('<text x="24" y="' + str(y) + '" fill="#E2E8F0" font-size="16" font-family="sans-serif">' + _escapar(texto[i:i + 60]) + "</text>")
                          y += 24
                  for a in self.anotaciones_del_paso():
                      marcas.append('<circle cx="' + str(a["x"]) + '" cy="' + str(a["y"]) + '" r="10" fill="none" stroke="#F59E0B" stroke-width="3"><animate attributeName="r" values="6;14;6" dur="1.6s" repeatCount="indefinite"/></circle>')
                  if marcas and "</svg>" in svg:
                      svg = svg.replace("</svg>", "".join(marcas) + "</svg>", 1)
                  return svg.encode("utf-8")

              def estado(self):
                  return {"sesion": str(self.id), "activa": self.activa, "paso_actual": self.paso_actual,
                          "total_pasos": self.total_pasos(), "anotaciones_total": len(self.anotaciones),
                          "anotaciones_paso": self.anotaciones_del_paso(), "iniciada_en": self.iniciada_en,
                          "paso": self._paso_datos()}

              def finalizar(self):
                  self.activa = False
                  self._registrar("finalizar", {"anotaciones": len(self.anotaciones)})
                  return {"sesion": str(self.id), "duracion_pasos": self.total_pasos(),
                          "anotaciones": len(self.anotaciones), "historial": list(self.historial)}


          class PresentacionRemota:
              def __init__(self, repo_presentaciones, proyector):
                  self._repo = repo_presentaciones
                  self._proyector = proyector
                  self._sesiones = {}

              def capacidades(self):
                  return {"control": ("telefono", "pc", "tablet"), "acciones": ACCIONES_VALIDAS,
                          "proyeccion": "MotorHolo3D salida universal",
                          "tactil": "el navegador de control es el tactil"}

              def crear_sesion(self, presentacion_id):
                  pid = str(presentacion_id or "").strip()
                  if not pid:
                      raise ValueError("presentacion_id requerido.")
                  presentacion = self._repo.obtener_exigir(pid)
                  sid = str(nuevo_id("ses"))
                  self._sesiones[sid] = SesionPresentacion(sid, presentacion, self._proyector)
                  return {"sesion": sid, "presentacion": pid,
                          "total_pasos": self._sesiones[sid].total_pasos(),
                          "vista_control": "/laboratorio/api/v1/presentations/remote/" + sid + "/view"}

              def sesion(self, id_sesion):
                  s = self._sesiones.get(str(id_sesion or "").strip())
                  if s is None:
                      raise ValueError("Sesion desconocida: " + str(id_sesion))
                  return s

              def listar_sesiones(self):
                  return {"activas": [{"sesion": str(k), "paso": v.paso_actual, "total": v.total_pasos()}
                                       for k, v in sorted(self._sesiones.items()) if v.activa],
                          "total": len(self._sesiones)}

              def proyectar_paso_actual(self, id_sesion):
                  sesion = self.sesion(id_sesion)
                  frame = sesion.frame_holograma()
                  canal = "web-sesion-" + str(sesion.id)
                  if not any(d.get("nombre") == canal
                             for d in self._proyector.listar_destinos().get("destinos", [])):
                      self._proyector.registrar_destino("web", "", canal)
                  return {"sesion": str(sesion.id), "paso": sesion.paso_actual,
                          "proyeccion": self._proyector.presentar(frame, {})}


          class ModoCurso:
              """Capacitacion: evaluacion real + certificado firmado y sellado en la Red."""

              def __init__(self, repo_presentaciones, outbox, firmador, cliente=None):
                  self._repo = repo_presentaciones
                  self._outbox = outbox
                  self._firmador = firmador
                  self._cliente = cliente
                  self._cursos = {}

              def capacidades(self):
                  return {"evaluacion": "opcion multiple con calificacion automatica",
                          "certificado": "firmado (HMAC) + sellado en ZYRA via outbox"}

              def crear_curso(self, presentacion_id, preguntas, umbral_aprobacion=0.7):
                  pid = str(presentacion_id or "").strip()
                  if not pid:
                      raise ValueError("presentacion_id requerido.")
                  presentacion = self._repo.obtener_exigir(pid)
                  if not isinstance(preguntas, list) or not preguntas:
                      raise ValueError("preguntas requiere al menos 1.")
                  limpias = []
                  for i, p in enumerate(preguntas):
                      if not isinstance(p, dict):
                          raise ValueError("pregunta " + str(i) + " debe ser objeto.")
                      texto = str(p.get("texto", "")).strip()
                      opciones = list(p.get("opciones", []))
                      correcta = p.get("correcta")
                      if not texto or len(opciones) < 2 or isinstance(correcta, bool) \
                              or not isinstance(correcta, int) or not 0 <= correcta < len(opciones):
                          raise ValueError("pregunta " + str(i) + " invalida.")
                      limpias.append({"texto": texto[:300],
                                      "opciones": [str(o)[:120] for o in opciones],
                                      "correcta": correcta})
                  umbral = float(umbral_aprobacion)
                  if not 0.0 < umbral <= 1.0:
                      raise ValueError("umbral_aprobacion entre 0 y 1.")
                  cid = str(nuevo_id("cur"))
                  self._cursos[cid] = {"id": cid, "presentacion_id": pid,
                                       "titulo": str(getattr(presentacion, "titulo", ""))[:120],
                                       "preguntas": limpias, "umbral": umbral, "resultados": {}}
                  return {"curso": cid, "presentacion": pid, "preguntas": len(limpias), "umbral": umbral}

              def _curso(self, cid):
                  curso = self._cursos.get(str(cid or "").strip())
                  if curso is None:
                      raise ValueError("Curso desconocido: " + str(cid))
                  return curso

              def responder(self, curso_id, zid, respuestas):
                  curso = self._curso(curso_id)
                  if not isinstance(respuestas, list) or len(respuestas) != len(curso["preguntas"]):
                      raise ValueError("respuestas debe tener " + str(len(curso["preguntas"])) + " valores.")
                  detalle = []
                  aciertos = 0
                  for i, (preg, resp) in enumerate(zip(curso["preguntas"], respuestas)):
                      ok = isinstance(resp, int) and not isinstance(resp, bool) and resp == preg["correcta"]
                      aciertos += 1 if ok else 0
                      detalle.append({"pregunta": i, "correcta": ok})
                  puntaje = round(aciertos / len(curso["preguntas"]), 4)
                  aprobado = puntaje >= curso["umbral"]
                  curso["resultados"][str(zid)] = {"puntaje": puntaje, "aprobado": aprobado}
                  return {"curso": str(curso["id"]), "zid": str(zid),
                          "puntaje": puntaje, "aprobado": aprobado, "detalle": detalle}

              def certificar(self, curso_id, zid):
                  curso = self._curso(curso_id)
                  z = str(zid or "").strip()
                  if not z:
                      raise ValueError("zid requerido.")
                  resultado = curso["resultados"].get(z)
                  if resultado is None:
                      raise ValueError("El ZID no ha respondido el curso.")
                  if not resultado["aprobado"]:
                      raise ValueError("Curso no aprobado: " + str(resultado["puntaje"])
                                       + " < " + str(curso["umbral"]))
                  contenido = json.dumps(
                      {"curso": str(curso["id"]), "presentacion": curso["presentacion_id"],
                       "titulo": curso["titulo"], "zid": z, "puntaje": resultado["puntaje"]},
                      sort_keys=True)
                  firma = self._firmador.firmar_documento("cert-" + str(curso["id"]) + "-" + z, contenido)
                  self._outbox.encolar("laboratorio.curso.certificado", "zyra/documents/seal",
                                       {"titulo": "Certificado: " + curso["titulo"], "contenido": contenido})
                  if self._cliente is not None:
                      self._outbox.procesar(self._cliente.entregar)
                  stats = self._outbox.estadisticas()
                  if stats.get("enviado", 0) > 0:
                      estado = "sellado_en_zyra"
                  elif stats.get("error", 0) > 0:
                      estado = "error_red"
                  else:
                      estado = "pendiente_red"
                  return {"certificado": firma, "estado_red": estado, "outbox": stats}
          PR_EOF

      - name: citizens_engine.py con desastres + renderer_3d.py con orbital
        run: |
          cat > apps/laboratorio/infrastructure/providers/citizens_engine.py <<'CIT_EOF'
          """Ciudadanos simulados + SIMULACION DE DESASTRES (EX-DES)."""
          import math

          CELULA = 50.0
          UMBRAL_AGLO = 6
          VEL_DEFECTO = 1.4
          ESTADOS = ("en_ruta", "en_punto", "evacuando")
          DESASTRES = {
              "terremoto": {"multiplicador": 2.0, "ayuda": ("rescate urbano", "albergues", "atencion medica")},
              "inundacion": {"multiplicador": 1.3, "ayuda": ("botes de rescate", "albergues en altura", "agua potable")},
              "incendio": {"multiplicador": 1.8, "ayuda": ("bomberos", "rutas libres de humo", "atencion respiratoria")},
              "erupcion": {"multiplicador": 1.5, "ayuda": ("mascarillas", "evacuacion amplio radio", "refugios cerrados")},
          }


          def _num(v, n):
              if isinstance(v, bool) or not isinstance(v, (int, float)):
                  raise ValueError(n + " debe ser numerico.")
              return float(v)


          class Ciudadano:
              __slots__ = ("id", "nombre", "rol", "x", "y", "velocidad", "agenda", "indice", "estado", "color")

              def __init__(self, id_c, nombre, rol, x, y, velocidad, agenda, color="#38BDF8"):
                  self.id = str(id_c)
                  self.nombre = str(nombre)[:80]
                  self.rol = str(rol)[:40]
                  self.x = _num(x, "x")
                  self.y = _num(y, "y")
                  if velocidad <= 0:
                      raise ValueError("velocidad debe ser positiva.")
                  self.velocidad = float(velocidad)
                  if not agenda:
                      raise ValueError("agenda requiere al menos un punto.")
                  self.agenda = [(_num(p[0], "ax"), _num(p[1], "ay")) for p in agenda]
                  self.indice = 0
                  self.estado = "en_ruta"
                  self.color = str(color)[:7]

              def a_dict(self):
                  return {"id": self.id, "nombre": self.nombre, "rol": self.rol,
                          "x": round(self.x, 3), "y": round(self.y, 3),
                          "velocidad": round(self.velocidad, 3), "estado": self.estado,
                          "destino": list(self.agenda[self.indice]), "color": self.color}


          class MotorCiudadanos:
              def __init__(self):
                  self._todos = []
                  self._salidas = []
                  self._tiempo = 0.0

              def capacidades(self):
                  return {"origenes": ("descripcion", "foto", "escaneo"), "estados": ESTADOS,
                          "desastres": sorted(DESASTRES.keys())}

              def poblar(self, ciudadanos, salidas=None) -> dict:
                  if not isinstance(ciudadanos, list) or not ciudadanos:
                      raise ValueError("ciudadanos requiere lista con al menos 1.")
                  self._todos = []
                  self._salidas = [(_num(s[0], "sx"), _num(s[1], "sy")) for s in (salidas or [])]
                  self._tiempo = 0.0
                  for i, esp in enumerate(ciudadanos):
                      if not isinstance(esp, dict):
                          raise ValueError("ciudadanos[" + str(i) + "] debe ser objeto.")
                      origen = str(esp.get("origen", "descripcion")).strip()
                      if origen == "descripcion":
                          nombre = str(esp.get("nombre", "")).strip()
                          if not nombre:
                              raise ValueError("descripcion requiere nombre.")
                          rol = str(esp.get("rol", "peaton"))
                          color = str(esp.get("color", "#38BDF8"))
                      elif origen == "foto":
                          nombre = str(esp.get("nombre", "Foto-" + str(i + 1)))
                          rol = str(esp.get("rol", "peaton"))
                          color = str(esp.get("color_foto", esp.get("color", "#F59E0B")))
                      elif origen == "escaneo":
                          nombre = str(esp.get("nombre", "Escaneado-" + str(i + 1)))
                          rol = "visitante"
                          if not esp.get("puntos"):
                              raise ValueError("escaneo requiere puntos.")
                          color = "#EC4899"
                      else:
                          raise ValueError("origen desconocido: " + repr(origen))
                      x = _num(esp.get("x", 0.0), "x")
                      y = _num(esp.get("y", 0.0), "y")
                      vel = _num(esp.get("velocidad", VEL_DEFECTO), "velocidad")
                      agenda = esp.get("agenda") or [[x, y]]
                      self._todos.append(Ciudadano("cit-" + str(i + 1).zfill(5), nombre, rol, x, y, vel, agenda, color))
                  return {"poblacion": len(self._todos), "salidas": len(self._salidas)}

              def paso(self, dt=1.0) -> dict:
                  dt = _num(dt, "dt")
                  if dt <= 0 or dt > 10.0:
                      raise ValueError("dt entre 0 y 10.")
                  self._tiempo += dt
                  for c in self._todos:
                      dx = c.agenda[c.indice][0] - c.x
                      dy = c.agenda[c.indice][1] - c.y
                      dist = math.hypot(dx, dy)
                      if dist < 0.5:
                          c.indice = (c.indice + 1) % len(c.agenda)
                      else:
                          paso = min(c.velocidad * dt, dist)
                          c.x += dx / dist * paso
                          c.y += dy / dist * paso
                      if c.estado != "evacuando":
                          c.estado = "en_ruta"
                  return {"tiempo": round(self._tiempo, 3), "poblacion": len(self._todos),
                          "aglomeraciones": self._aglomeraciones()}

              def _aglomeraciones(self):
                  celdas = {}
                  for c in self._todos:
                      k = (int(c.x // CELULA), int(c.y // CELULA))
                      celdas.setdefault(k, []).append(c.id)
                  return [{"celda": list(k), "cantidad": len(v), "ciudadanos": v[:20]}
                          for k, v in sorted(celdas.items()) if len(v) >= UMBRAL_AGLO]

              def evacuar(self) -> dict:
                  if not self._salidas:
                      raise ValueError("evacuar requiere salidas.")
                  for c in self._todos:
                      mejor = min(self._salidas, key=lambda s: math.hypot(s[0] - c.x, s[1] - c.y))
                      c.agenda = [mejor]
                      c.indice = 0
                      c.estado = "evacuando"
                      c.velocidad = c.velocidad * 1.6
                  return {"evacuando": len(self._todos), "salidas": len(self._salidas)}

              def declarar_zonas_seguras(self, zonas) -> dict:
                  if not isinstance(zonas, list) or not zonas:
                      raise ValueError("zonas_seguras requiere al menos 1.")
                  limpias = []
                  for z in zonas:
                      if not (isinstance(z, (list, tuple)) and len(z) == 3):
                          raise ValueError("cada zona debe ser [x, y, radio].")
                      x, y, r = _num(z[0], "zx"), _num(z[1], "zy"), _num(z[2], "zr")
                      if r <= 0:
                          raise ValueError("radio positivo requerido.")
                      limpias.append((x, y, r))
                  self._zonas = limpias
                  return {"zonas_seguras": len(limpias)}

              def simular_desastre(self, tipo, epicentro, radio_afectacion, zonas_seguras) -> dict:
                  spec = DESASTRES.get(str(tipo or "").strip())
                  if spec is None:
                      raise ValueError("desastre desconocido: " + repr(tipo)
                                       + ". Validos: " + ", ".join(sorted(DESASTRES)))
                  if not (isinstance(epicentro, (list, tuple)) and len(epicentro) == 2):
                      raise ValueError("epicentro debe ser [x, y].")
                  ex, ey = _num(epicentro[0], "ex"), _num(epicentro[1], "ey")
                  radio = _num(radio_afectacion, "radio")
                  if radio <= 0:
                      raise ValueError("radio positivo.")
                  self.declarar_zonas_seguras(zonas_seguras)
                  afectados = 0
                  t_max = 0.0
                  for c in self._todos:
                      if math.hypot(c.x - ex, c.y - ey) <= radio:
                          afectados += 1
                          zx, zy, _zr = min(self._zonas, key=lambda s: math.hypot(s[0] - c.x, s[1] - c.y))
                          c.agenda = [(zx, zy)]
                          c.indice = 0
                          c.estado = "evacuando"
                          c.velocidad = c.velocidad * spec["multiplicador"]
                          if c.velocidad > 0:
                              t_max = max(t_max, math.hypot(zx - c.x, zy - c.y) / c.velocidad)
                  return {"tipo": tipo, "epicentro": [ex, ey], "radio_afectacion": radio,
                          "afectados": afectados, "poblacion": len(self._todos),
                          "zonas_seguras": [list(z) for z in self._zonas],
                          "ayuda_necesaria": list(spec["ayuda"]),
                          "pasos_estimados_evacuacion": round(t_max, 2)}

              def estado_poblacion(self) -> dict:
                  return {"tiempo": round(self._tiempo, 3), "poblacion": len(self._todos),
                          "ciudadanos": [c.a_dict() for c in self._todos[:200]],
                          "salidas": [list(s) for s in self._salidas]}

              def total(self) -> int:
                  return len(self._todos)
          CIT_EOF
          cat > apps/laboratorio/infrastructure/providers/renderer_3d.py <<'R3_EOF'
          """Motor 3D: perspectiva + CAMARA ORBITAL (mismo archivo)."""
          import math

          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.renderer_raster import (
              PROFUNDIDAD_POR_CAPA, RasterizadorBase, hex_a_rgb,
          )
          from apps.laboratorio.shared.adapters.engine_adapter import AdaptadorMotor
          from apps.laboratorio.shared.exceptions.render_errors import (
              EscenaVaciaError, RenderFallidoError,
          )
          from apps.laboratorio.shared.interfaces.renderer import Renderer, ResultadoRender

          Z_POR_CAPA = {"fondo": 2.0, "medio": 1.0, "frente": 0.2}
          DISTANCIA_FOCAL = 3.0


          class MotorRender3D(AdaptadorMotor, Renderer):
              def __init__(self):
                  AdaptadorMotor.__init__(self, "renderer_3d", "renderer", "1.0.0")
                  self.marcar_disponible()

              def capacidades(self) -> dict:
                  return {"calidades": ["3d"], "profundidad": True,
                          "proyeccion": "perspectiva con punto de fuga central", "z_por_capa": Z_POR_CAPA}

              @staticmethod
              def _proyectar(valor, centro, z):
                  escala = DISTANCIA_FOCAL / (DISTANCIA_FOCAL + z)
                  return centro + (valor - centro) * escala

              def renderizar(self, escena, opciones) -> ResultadoRender:
                  if not isinstance(escena, Escena3D):
                      raise RenderFallidoError("Se esperaba una Escena3D.")
                  if not escena.es_renderizable:
                      raise EscenaVaciaError("La escena no tiene objetos.")
                  ancho = int(opciones.get("ancho", escena.ancho))
                  alto = int(opciones.get("alto", escena.alto))
                  cx, cy = ancho / 2.0, alto / 2.0
                  lienzo = RasterizadorBase(ancho, alto, (15, 23, 42))
                  sx = ancho / escena.ancho
                  sy = alto / escena.alto
                  escala_texto = max(2, int(round(min(sx, sy) * 2)))
                  for capa in ("fondo", "medio", "frente"):
                      z = Z_POR_CAPA[capa]
                      depth_val = PROFUNDIDAD_POR_CAPA[capa]
                      for obj in escena.objetos:
                          if obj.get("capa", "medio") != capa:
                              continue
                          color = hex_a_rgb(obj["color"])
                          if obj["forma"] == "rect":
                              x1 = self._proyectar(obj["x"] * sx, cx, z)
                              y1 = self._proyectar(obj["y"] * sy, cy, z)
                              x2 = self._proyectar((obj["x"] + obj["w"]) * sx, cx, z)
                              y2 = self._proyectar((obj["y"] + obj["h"]) * sy, cy, z)
                              lienzo.rect(x1, y1, x2 - x1, y2 - y1, color, depth_val)
                          elif obj["forma"] == "circle":
                              cxp = self._proyectar(obj["cx"] * sx, cx, z)
                              cyp = self._proyectar(obj["cy"] * sy, cy, z)
                              rp = obj["r"] * min(sx, sy) * (DISTANCIA_FOCAL / (DISTANCIA_FOCAL + z))
                              lienzo.circle(cxp, cyp, rp, color, depth_val)
                          else:
                              lienzo.texto(self._proyectar(obj["x"] * sx, cx, z),
                                           self._proyectar(obj["y"] * sy, cy, z),
                                           obj["contenido"], color, depth_val, escala_texto)
                  return ResultadoRender(
                      imagen_bytes=lienzo.imagen_png(), profundidad_bytes=lienzo.profundidad_png(),
                      ancho=ancho, alto=alto,
                      metadata={"formato": "png", "motor": "renderer_3d",
                                "profundidad": True, "proyeccion": "perspectiva"})


          class CamaraOrbital:
              def __init__(self, distancia=3.0, azimut=0.0, elevacion=35.0):
                  d = float(distancia)
                  if not 1.0 <= d <= 10.0:
                      raise ValueError("distancia entre 1 y 10.")
                  self.distancia = d
                  self.azimut = float(azimut) % 360.0
                  e = float(elevacion)
                  if not 5.0 <= e <= 85.0:
                      raise ValueError("elevacion entre 5 y 85.")
                  self.elevacion = e

              def girar(self, d_azimut, d_elevacion) -> dict:
                  self.azimut = (self.azimut + float(d_azimut)) % 360.0
                  self.elevacion = max(5.0, min(85.0, self.elevacion + float(d_elevacion)))
                  return self.estado()

              def zoom(self, factor) -> dict:
                  self.distancia = max(1.0, min(10.0, self.distancia * float(factor)))
                  return self.estado()

              def estado(self) -> dict:
                  return {"azimut": round(self.azimut, 2), "elevacion": round(self.elevacion, 2),
                          "distancia": round(self.distancia, 3)}


          class MotorRenderOrbital(AdaptadorMotor):
              def __init__(self):
                  AdaptadorMotor.__init__(self, "renderer_orbital", "renderer", "1.0.0")
                  self.marcar_disponible()

              def capacidades(self) -> dict:
                  return {"proyeccion": "orbital 2.5D", "profundidad": True, "determinista": True}

              @staticmethod
              def _transformar(px, py, cx, cy, cos_a, sin_a, el, escala):
                  dx, dy = px - cx, py - cy
                  return (cx + (dx * cos_a - dy * sin_a) * escala,
                          cy + (dx * sin_a + dy * cos_a) * el * escala)

              def renderizar_orbital(self, escena, opciones, camara) -> ResultadoRender:
                  if not isinstance(escena, Escena3D):
                      raise RenderFallidoError("Se esperaba una Escena3D.")
                  if not escena.es_renderizable:
                      raise EscenaVaciaError("La escena no tiene objetos.")
                  if not isinstance(camara, CamaraOrbital):
                      raise RenderFallidoError("Se esperaba una CamaraOrbital.")
                  ancho = int(opciones.get("ancho", escena.ancho))
                  alto = int(opciones.get("alto", escena.alto))
                  lienzo = RasterizadorBase(ancho, alto, (15, 23, 42))
                  sx = ancho / escena.ancho
                  sy = alto / escena.alto
                  cx, cy = ancho / 2.0, alto / 2.0
                  az = math.radians(camara.azimut)
                  el = math.sin(math.radians(camara.elevacion))
                  cos_a, sin_a = math.cos(az), math.sin(az)
                  f = camara.distancia
                  for capa in ("fondo", "medio", "frente"):
                      z = Z_POR_CAPA[capa] + (1.0 - el) * 0.5
                      escala = f / (f + z)
                      depth_val = PROFUNDIDAD_POR_CAPA[capa]
                      for obj in escena.objetos:
                          if obj.get("capa", "medio") != capa:
                              continue
                          color = hex_a_rgb(obj["color"])
                          if obj["forma"] == "rect":
                              x1, y1 = self._transformar(obj["x"] * sx, obj["y"] * sy, cx, cy, cos_a, sin_a, el, escala)
                              x2, y2 = self._transformar((obj["x"] + obj["w"]) * sx, (obj["y"] + obj["h"]) * sy, cx, cy, cos_a, sin_a, el, escala)
                              lienzo.rect(min(x1, x2), min(y1, y2), abs(x2 - x1), abs(y2 - y1), color, depth_val)
                          elif obj["forma"] == "circle":
                              px, py = self._transformar(obj["cx"] * sx, obj["cy"] * sy, cx, cy, cos_a, sin_a, el, escala)
                              lienzo.circle(px, py, obj["r"] * min(sx, sy) * escala, color, depth_val)
                          else:
                              px, py = self._transformar(obj["x"] * sx, obj["y"] * sy, cx, cy, cos_a, sin_a, el, escala)
                              lienzo.texto(px, py, obj["contenido"], color, depth_val,
                                           max(2, int(round(min(sx, sy) * 2))))
                  return ResultadoRender(
                      imagen_bytes=lienzo.imagen_png(), profundidad_bytes=lienzo.profundidad_png(),
                      ancho=ancho, alto=alto,
                      metadata={"formato": "png", "motor": "renderer_orbital",
                                "proyeccion": "orbital 2.5D", "azimut": camara.azimut,
                                "elevacion": camara.elevacion, "distancia": camara.distancia,
                                "profundidad": True})
          R3_EOF

