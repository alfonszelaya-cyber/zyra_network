name: "ZYRA RED-5: ErApiRateProvider en vivo"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir proveedor + tests
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          PROVEEDOR = (
              '\n'
              '\n'
              'class ErApiRateProvider(RateProvider):\n'
              '    """RED-5: tasas en vivo de\n'
              '    open.er-api.com (fuente publica,\n'
              '    160+ monedas, CA incluida).\n'
              '    Falla honesto: RateUnavailableError."""\n'
              '\n'
              '    name = "open.er-api.com"\n'
              '\n'
              '    def __init__(\n'
              '        self,\n'
              '        *,\n'
              '        ttl_seconds: float = 3600.0,\n'
              '        timeout_seconds: float = 10.0,\n'
              '    ) -> None:\n'
              '        self._ttl = ttl_seconds\n'
              '        self._timeout = timeout_seconds\n'
              '\n'
              '    def fetch(\n'
              '        self,\n'
              '        pair: CurrencyPair,\n'
              '        clock: Clock,\n'
              '    ) -> Quote:\n'
              '        import json as _json\n'
              '        import urllib.request as _ur\n'
              '        base = pair.base.upper()\n'
              '        quote_ccy = pair.quote.upper()\n'
              '        url = (\n'
              '            "https://open.er-api.com"\n'
              '            "/v6/latest/" + base)\n'
              '        try:\n'
              '            req = _ur.Request(\n'
              '                url,\n'
              '                headers={\n'
              '                    "User-Agent":\n'
              '                    "zyra-network"})\n'
              '            with _ur.urlopen(\n'
              '                    req,\n'
              '                    timeout=(\n'
              '                        self._timeout)) as r:\n'
              '                data = _json.loads(\n'
              '                    r.read().decode("utf-8"))\n'
              '        except Exception as exc:\n'
              '            raise RateUnavailableError(\n'
              '                "er-api fetch failed: "\n'
              '                + type(exc).__name__\n'
              '                + ": " + str(exc)[:80]) from exc\n'
              '        rates = (\n'
              '            data.get("conversion_rates")\n'
              '            or data.get("rates") or {})\n'
              '        raw = rates.get(quote_ccy)\n'
              '        if raw is None:\n'
              '            raise RateUnavailableError(\n'
              '                "er-api has no rate for "\n'
              '                + pair.normalized)\n'
              '        try:\n'
              '            rate = Decimal(str(raw))\n'
              '        except Exception as exc:\n'
              '            raise RateUnavailableError(\n'
              '                "er-api rate not decimal") from exc\n'
              '        if not rate.is_finite() or rate <= 0:\n'
              '            raise RateUnavailableError(\n'
              '                "er-api rate not positive")\n'
              '        now = clock.now()\n'
              '        return Quote(\n'
              '            pair=pair,\n'
              '            rate=rate,\n'
              '            quoted_at=now,\n'
              '            expires_at=(now + self._ttl),\n'
              '            source=self.name,\n'
              '        )\n'
          )
          p = pathlib.Path("shared_engines/currency/rates.py")
          src = p.read_text(encoding="utf-8")
          if "class ErApiRateProvider" in src:
              out("- **R5 proveedor: YA**")
          else:
              if not src.endswith("\n"):
                  src += "\n"
              src = src + PROVEEDOR
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              out("- **R5 proveedor: OK**")

          TESTS = (
              '\n'
              '\n'
              'class _FakeResponse:\n'
              '    def __init__(self, payload: bytes) -> None:\n'
              '        self._p = payload\n'
              '\n'
              '    def __enter__(self):\n'
              '        return self\n'
              '\n'
              '    def __exit__(self, *a):\n'
              '        return False\n'
              '\n'
              '    def read(self) -> bytes:\n'
              '        return self._p\n'
              '\n'
              '\n'
              'def test_erapi_provider_parses_live_shape(\n'
              '    tmp_path, monkeypatch,\n'
              ') -> None:\n'
              '    """RED-5: proveedor publico\n'
              '    (mockeado): JSON real de er-api\n'
              '    -> Quote exacta en Decimal."""\n'
              '    import json as _json\n'
              '    import urllib.request as _ur\n'
              '    from shared_engines.currency.rates import (\n'
              '        ErApiRateProvider)\n'
              '    payload = _json.dumps({\n'
              '        "result": "success",\n'
              '        "conversion_rates": {\n'
              '            "EUR": 0.888752,\n'
              '            "GTQ": 7.637735,\n'
              '            "HNL": 26.845764,\n'
              '        },\n'
              '    }).encode()\n'
              '\n'
              '    def fake_urlopen(req, timeout=None):\n'
              '        return _FakeResponse(payload)\n'
              '\n'
              '    monkeypatch.setattr(\n'
              '        _ur, "urlopen", fake_urlopen)\n'
              '    clock = FrozenClock()\n'
              '    q = ErApiRateProvider().fetch(\n'
              '        CurrencyPair("USD", "GTQ"), clock)\n'
              '    assert (q.rate\n'
              '            == Decimal("7.637735")), str(q)\n'
              '    assert q.source == "open.er-api.com"\n'
              '    assert q.expires_at > q.quoted_at\n'
              '    print("OK RED-5: er-api parsea y"\n'
              '          " fabrica Quote Decimal exacta")\n'
              '\n'
              '\n'
              'def test_erapi_provider_raises_when_down(\n'
              '    tmp_path, monkeypatch,\n'
              ') -> None:\n'
              '    import urllib.request as _ur\n'
              '    from shared_engines.currency.rates import (\n'
              '        ErApiRateProvider)\n'
              '\n'
              '    def boom(req, timeout=None):\n'
              '        raise OSError("down")\n'
              '\n'
              '    monkeypatch.setattr(\n'
              '        _ur, "urlopen", boom)\n'
              '    with pytest.raises(RateUnavailableError):\n'
              '        ErApiRateProvider().fetch(\n'
              '            CurrencyPair("USD", "EUR"),\n'
              '            FrozenClock())\n'
              '\n'
              '\n'
              'def test_provider_chain_falls_back_to_erapi(\n'
              '    tmp_path, monkeypatch,\n'
              ') -> None:\n'
              '    """RED-5: cadena con proveedor\n'
              '    muerto + er-api: el fallback\n'
              '    entrega la Quote."""\n'
              '    import json as _json\n'
              '    import urllib.request as _ur\n'
              '    from shared_engines.currency.rates import (\n'
              '        ErApiRateProvider, ProviderChain)\n'
              '    payload = _json.dumps({\n'
              '        "conversion_rates": {"EUR": 0.9},\n'
              '    }).encode()\n'
              '\n'
              '    def fake_urlopen(req, timeout=None):\n'
              '        return _FakeResponse(payload)\n'
              '\n'
              '    monkeypatch.setattr(\n'
              '        _ur, "urlopen", fake_urlopen)\n'
              '    chain = ProviderChain(\n'
              '        [_Dead(), ErApiRateProvider()])\n'
              '    q = chain.fetch(\n'
              '        CurrencyPair("USD", "EUR"),\n'
              '        FrozenClock())\n'
              '    assert q.rate == Decimal("0.9")\n'
              '    assert q.source == "open.er-api.com"\n'
              '    print("OK RED-5: cadena con fallback"\n'
              '          " a proveedor vivo funciona")\n'
          )
          t = pathlib.Path("shared_engines/currency/tests/test_currency.py")
          tsrc = t.read_text(encoding="utf-8")
          if "test_erapi_provider_parses_live_shape" in tsrc:
              out("- **R5 tests: YA**")
          else:
              if not tsrc.endswith("\n"):
                  tsrc += "\n"
              tsrc = tsrc + TESTS
              ast.parse(tsrc)
              t.write_text(tsrc, encoding="utf-8")
              py_compile.compile(str(t), doraise=True)
              out("- **R5 tests: OK**")
          EOF

      - name: "C1: tests er-api nuevos"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 120 python3 -m pytest shared_engines/currency/tests/test_currency.py -vv -k "erapi or er_api or falls_back" --tb=long --timeout=45 --timeout-method=thread > /tmp/c1.out 2>&1
          echo $? > /tmp/c1
          if [ "$(cat /tmp/c1)" = "0" ]; then echo "- C1 er-api tests: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- C1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### C1 detalle"; echo '```'; tail -60 /tmp/c1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "C2: suite currency completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 300 python3 -m pytest shared_engines/currency/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/c2.out 2>&1
          echo $? > /tmp/c2
          if [ "$(cat /tmp/c2)" = "0" ]; then echo "- C2 currency: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- C2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### C2 detalle"; echo '```'; tail -50 /tmp/c2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "C3: regresion shared_engines completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/c3.out 2>&1
          echo $? > /tmp/c3
          if [ "$(cat /tmp/c3)" = "0" ]; then echo "- C3 shared_engines: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- C3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### C3 detalle"; echo '```'; tail -60 /tmp/c3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in c1 c2 c3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: C1+C2+C3 VERDES**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(RED-5): ErApiRateProvider tasas en vivo open.er-api.com + tests mockeados (C1-C3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/p1.out 2> /tmp/p1.err
          if [ $? -eq 0 ]; then log "**PUSH OK — PUNTO 4 (RED-5 CURRENCY EN VIVO) CERRADO.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/p1.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/p2.out 2> /tmp/p2.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2) — PUNTO 4 CERRADO.**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/p2.err; echo '```'; } >> "$SUM"
          exit 1
