name: "AUDIT runtime: que test falla en el gate (SOLO LECTURA)"
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: "Runtime tests uno por uno (nombre + resultado de cada uno)"
        run: |
          set +e
          for f in shared_engines/runtime/tests/test_*.py; do
            nombre=$(basename "$f" .py)
            timeout 90 python3 -m pytest "$f" -q --tb=line > "/tmp/rt_$nombre.txt" 2>&1
            CODE=$?
            if [ $CODE -eq 124 ]; then
              echo "HANG: $nombre (90s)"
            elif [ $CODE -ne 0 ]; then
              echo "FALLO: $nombre"
              tail -10 "/tmp/rt_$nombre.txt"
            else
              echo "VERDE: $nombre"
            fi
          done
      - name: "Si hay fallo, traceback completo del test culpable"
        if: failure()
        run: |
          python3 -m pytest shared_engines/runtime/tests -v --tb=long 2>&1 | grep -A 40 "FAILED\|ERROR" | head -80 || true
