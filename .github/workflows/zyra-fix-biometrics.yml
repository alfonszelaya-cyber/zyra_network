name: ZYRA D1d acceso fail closed con prueba de 3 caminos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD1d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: Reescritura del acceso con 3 pruebas de camino
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD1d.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          class NoRedir(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(NoRedir)

          def pedir(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  resp = OPENER.open(req, timeout=10)
                  return resp.status, resp.headers, resp.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, None, str(e)

          sp_orig = SP_FILE.read_bytes()
          t0sp = sp_orig.decode('utf-8')

          def revertir():
              try:
                  SP_FILE.write_bytes(sp_orig)
              except Exception:
                  pass

          add('# D1d - ACCESO FAIL-CLOSED (bloque /entrar reescrito completo)')
          add('')

          add('## G1. Localizacion del bloque a reemplazar')
          add('')
          MARCA_INI = '        if path == "/entrar":'
          MARCA_FIN = '        if path == "/salir":'
          n_ini = t0sp.count(MARCA_INI)
          n_fin = t0sp.count(MARCA_FIN)
          add('- marca inicio: %d | marca fin: %d' % (n_ini, n_fin))
          ok_anclas = (n_ini == 1 and n_fin == 1)
          gate('anclas_unicas', ok_anclas)
          if not ok_anclas:
              add('**NO UNICO: nada editado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseD1d.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS NO UNICOS - sin cambios')
          pos_ini = t0sp.find(MARCA_INI)
          pos_fin = t0sp.find(MARCA_FIN)
          add('- bloque /entrar identificado: lineas %d a %d' % (
              t0sp.count('\n', 0, pos_ini) + 1,
              t0sp.count('\n', 0, pos_fin) + 1))
          add('')

          add('## G2. Reescritura del bloque /entrar (logica lineal simple)')
          add('')
          NUEVO = [
          '        if path == "/entrar":',
          '            largo = int(self.headers.get("Content-Length", 0) or 0)',
          '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
          '            from urllib.parse import unquote_plus as _uq',
          '            zid = ""',
          '            clave = ""',
          '            for par in crudo.split("&"):',
          '                if "=" in par:',
          '                    k, v = par.split("=", 1)',
          '                    if k == "zid":',
          '                        zid = _uq(v).strip()',
          '                    elif k == "clave":',
          '                        clave = _uq(v).strip()',
          '            owner = os.environ.get("ZYRA_OWNER_ZID", "")',
          '            clave_req = os.environ.get("ZYRA_CLAVE_DUENO", "")',
          '            if not owner or not clave_req:',
          '                self._send_html(503, self._pagina_entrar(',
          '                    "Acceso no configurado en el servidor."))',
          '                return',
          '            if zid != owner:',
          '                self._send_html(403, self._pagina_entrar(',
          '                    "SOLO_EL_PROPIETARIO_PUEDE_ENTRAR. El registro publico llegara con la Red."))',
          '                return',
          '            if clave != clave_req:',
          '                self._send_html(403, self._pagina_entrar("Clave incorrecta."))',
          '                return',
          '            self.send_response(303)',
          '            self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800; HttpOnly")',
          '            self.send_header("Location", "/")',
          '            self.end_headers()',
          '            return',
          '',
          ]
          nuevo_bloque = '\n'.join(NUEVO) + '\n'
          t = t0sp[:pos_ini] + nuevo_bloque + t0sp[pos_fin:]
          SP_FILE.write_text(t, encoding='utf-8')
          add('- bloque /entrar reescrito: 40 lineas simples, un solo return de exito.')
          gate('bloque_reescrito', True)
          add('')

          add('## G3. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(SP_FILE), doraise=True)
              add('- py_compile: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## G4. Sistema arriba')
          add('')
          ZID = 'Z-DUENO-CI'
          CLAVE = 'clave-ci-secreta-9999'
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d1d', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-d1d', 'PORT': str(SP), 'ZYRA_OWNER_ZID': ZID, 'ZYRA_CLAVE_DUENO': CLAVE, 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cuerpo).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps_vivas', spv and len(apps) == 8)
          add('')

          add('## G5. TRES CAMINOS de /entrar')
          add('')
          cookie_ok = ''
          if spv:
              st, h, b = pedir(BSP + '/entrar', data=('zid=' + ZID + '&clave=' + CLAVE).encode('utf-8'))
              sc = (h.get('Set-Cookie') or '') if h else ''
              ok1 = (st == 303 and ('zyra_zid=' + ZID) in sc)
              cookie_ok = sc.split(';')[0] if ok1 else ''
              add('- camino 1 dueno+clave correcta -> %s | cookie=%s %s' % (st, cookie_ok or 'NINGUNA', 'OK' if ok1 else 'FALLO'))
              gate('camino_dueno_303', ok1)
              st, h, b = pedir(BSP + '/entrar', data=('zid=' + ZID + '&clave=mala').encode('utf-8'))
              add('- camino 2 clave mala -> %s (403) %s' % (st, 'OK' if st == 403 else 'FALLO'))
              gate('camino_clave_mala_403', st == 403)
              st, h, b = pedir(BSP + '/entrar', data=('zid=Pedro&clave=1234').encode('utf-8'))
              add('- camino 3 zid cualquiera -> %s (403) %s' % (st, 'OK' if st == 403 else 'FALLO'))
              gate('camino_otro_zid_403', st == 403)
              if cookie_ok:
                  st, _h, b = pedir(BSP + '/', {'Cookie': cookie_ok})
                  conectado = (st == 200 and ('Conectado: ' + ZID) in b)
                  add('- portal muestra Conectado %s' % ('OK' if conectado else 'FALLO'))
                  gate('portal_muestra_estado', conectado)
                  st, h2, b = pedir(BSP + '/salir', {'Cookie': cookie_ok})
                  sc2 = (h2.get('Set-Cookie') or '') if h2 else ''
                  salio = (st == 303 and 'Max-Age=0' in sc2)
                  add('- /salir -> %s con cookie borrada %s' % (st, 'OK' if salio else 'FALLO'))
                  gate('salir_funciona', salio)
              else:
                  gate('portal_muestra_estado', False)
                  gate('salir_funciona', False)
          else:
              gate('camino_dueno_303', False)
              gate('camino_clave_mala_403', False)
              gate('camino_otro_zid_403', False)
              gate('portal_muestra_estado', False)
              gate('salir_funciona', False)
          add('')

          criticos = ('anclas_unicas', 'compila', 'ocho_apps_vivas', 'camino_dueno_303', 'camino_clave_mala_403', 'camino_otro_zid_403', 'portal_muestra_estado', 'salir_funciona')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos):
              revertir()
              add('## REVERSION APLICADA - archivo restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**ACCESO SEGURO VERIFICADO EN LOS 3 CAMINOS. Commit.**')
              add('')
              add('En Render: ZYRA_OWNER_ZID=Z-ALFONSZELAYA y ZYRA_CLAVE_DUENO=tu clave secreta.')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseD1d.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D1d terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(seguridad): acceso fail-closed con 3 caminos verificados"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseD1d-zyra
          path: faseD1d.json
          if-no-files-found: ignore
