name: ZYRA S8 prueba en vivo Red + registro (sin cambios en el repo)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  s8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar YAML del workflow
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml', encoding='utf-8')); print('YAML OK')"

      - name: S8 pruebas en vivo
        run: |
          cat > /tmp/s8_live.sh << 'SHEOF'
          #!/bin/bash
          NET="https://zyra-network-or16.onrender.com"
          SUP="https://zyra-superapp.onrender.com"
          PNG="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="

          echo "== S8 PRUEBA EN VIVO (sin secretos, sin cambios en el repo) =="

          NET_OK=0
          for i in 1 2 3; do
            C=$(curl -sS -m 90 -o /tmp/w -w "%{http_code}" "$NET/health" 2>/dev/null)
            echo "W1 Red /health intento $i -> HTTP $C : $(head -c 200 /tmp/w)"
            if [ "$C" = "200" ]; then NET_OK=1; break; fi
            sleep 15
          done

          SUP_OK=0
          for i in 1 2 3; do
            C=$(curl -sS -m 90 -o /tmp/w -w "%{http_code}" "$SUP/health" 2>/dev/null)
            echo "W2 SuperApp /health intento $i -> HTTP $C : $(head -c 200 /tmp/w)"
            if [ "$C" = "200" ]; then SUP_OK=1; break; fi
            sleep 15
          done

          T3=""
          T4=""

          if [ "$NET_OK" = "1" ]; then
            echo ""
            echo "--- T1: GET Red / (exactamente lo que vio tu navegador) ---"
            C=$(curl -sS -m 90 -o /tmp/b -w "%{http_code}" "$NET/" 2>/dev/null)
            echo "HTTP $C : $(head -c 300 /tmp/b)"
            echo "(la Red es API pura: GET / responde 404 unknown route POR DISENO, no es falla)"

            echo ""
            echo "--- T2: POST Red /identity/ruta-falsa-s8 (linea base del 404) ---"
            C=$(curl -sS -m 90 -o /tmp/b -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{}' "$NET/identity/ruta-falsa-s8" 2>/dev/null)
            echo "HTTP $C : $(head -c 300 /tmp/b)"

            echo ""
            echo "--- T3: POST Red /identity/enroll con {} sin token ---"
            C=$(curl -sS -m 90 -o /tmp/b -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{}' "$NET/identity/enroll" 2>/dev/null)
            T3="$C $(head -c 300 /tmp/b)"
            echo "HTTP $C : $(head -c 300 /tmp/b)"
          else
            echo "W1: LA RED NO RESPONDIO tras 3 intentos (caida o cold start largo)"
          fi

          if [ "$SUP_OK" = "1" ]; then
            echo ""
            echo "--- T4: CADENA COMPLETA igual que tu celular: POST SuperApp /registro/nuevo ---"
            DATA="{\"nombre\":\"ZZ-TEST-S8-BORRAR\",\"clave\":\"prueba12345\",\"doc_image_b64\":\"$PNG\",\"selfie_image_b64\":\"$PNG\"}"
            C=$(curl -sS -m 150 -o /tmp/b -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "$DATA" "$SUP/registro/nuevo" 2>/dev/null)
            T4="$C $(head -c 500 /tmp/b)"
            echo "HTTP $C : $(head -c 500 /tmp/b)"
            echo "(datos falsos marcados TEST; biometria apagada = imposible crear ZID real)"
          else
            echo "W2: LA SUPERAPP NO RESPONDIO tras 3 intentos"
          fi

          echo ""
          echo "================== VEREDICTO =================="

          C3="${T3%% *}"

          if [ -n "$T4" ]; then
            case "$T4" in
              *"mantenimiento"*)
                echo ">>> CADENA COMPLETA FUNCIONANDO. Tu celular ya puede registrar: vera el cartel 'BIOMETRIA EN MANTENIMIENTO' (se quita con tu decision pendiente: plan 2GB + ZYRA_BIOMETRICS_PROVIDER=real). Siguiente: compresion de fotos."
                ;;
              *'"unknown route"'*)
                echo ">>> 404 REAL CONFIRMADO: el enrutador combinado de la Red desplegada NO pasa /identity/enroll al manejador. Siguiente paso S9: conectar la ruta (cambio aditivo, nada se toca)."
                ;;
              *"no devolvio ZID"*)
                echo ">>> La Red respondio OK pero el ZID no vino en la forma esperada. El BODY de T4 de arriba dice la forma exacta — copiarlo."
                ;;
              *"proofing"*|*"approve"*)
                echo ">>> EL MOTOR BIOMETRICO ESTA ACTIVO y rechazo las fotos de prueba (son 1 pixel, no personas). Probar registro con tu DUI real ahora mismo."
                ;;
              *"zid"*)
                echo ">>> ZID CREADO EN LA PRUEBA. Avisar al dueño de inmediato (no deberia pasar con biometria apagada)."
                ;;
              *"Sin conexion"*|*"timed out"*)
                echo ">>> La SuperApp no alcanzo a la Red en este intento (cold start). Relanzar el workflow."
                ;;
              *)
                echo ">>> Respuesta no clasificada — copiar el BODY de T4 y mandarlo completo."
                ;;
            esac
          else
            echo ">>> T4 no se ejecuto: SuperApp no respondio. Revisar W2 y relanzar."
          fi

          if [ -n "$T3" ]; then
            if [ "$C3" = "404" ]; then
              echo "T3: 404 en /identity/enroll — misma respuesta que la ruta falsa: ruta NO activa en el despliegue."
            elif [ "$C3" = "400" ] || [ "$C3" = "422" ]; then
              echo "T3: la ruta EXISTE (pidio campos obligatorios)."
            elif [ "$C3" = "401" ] || [ "$C3" = "403" ]; then
              echo "T3: la ruta EXISTE y esta protegida por token (no dio 404)."
            else
              echo "T3: HTTP $C3 — revisar body arriba."
            fi
          fi

          echo ""
          echo "== FIN S8 =="
          SHEOF
          bash /tmp/s8_live.sh 2>&1 | tee s8_reporte.txt
          {
            echo "## S8 — prueba en vivo de la Red y del registro"
            echo ""
            echo '````'
            cat s8_reporte.txt
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-s8
          path: s8_reporte.txt
