name: ZYRA LABORATORIO - Lote 1A-1 (enums LAB-CORE y value objects)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar, escribir y verificar (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          echo "=== REGLA 1: AUDITORIA PREVIA (solo lectura) ==="
          OBJETIVOS="apps/laboratorio/__init__.py apps/laboratorio/shared/enums/scenario_type.py apps/laboratorio/shared/enums/creation_type.py apps/laboratorio/shared/enums/pipeline_stage.py apps/laboratorio/shared/enums/project_status.py apps/laboratorio/shared/enums/engine_status.py apps/laboratorio/shared/enums/export_format.py apps/laboratorio/shared/enums/display_kind.py apps/laboratorio/shared/enums/certainty.py apps/laboratorio/shared/value_objects/geometry.py apps/laboratorio/shared/value_objects/color.py"
          for f in $OBJETIVOS; do
            if [ -s "$f" ]; then
              echo "PROTEGIDO (ya tiene codigo, NO se toca): $f"
            else
              echo "LIBRE: $f"
            fi
          done
          echo "=== REGLAS 2-3: ESCRITURA SOLO EN CARPETAS EXISTENTES ==="
          mkdir -p apps/laboratorio/shared/enums apps/laboratorio/shared/value_objects
          cat > apps/laboratorio/__init__.py << 'ZYRA_EOF'
          """ZYRA LABORATORIO - Simulacion, diseno, creacion 4D y visualizacion.

          App especializada de ZYRA Network, con identidad propia e independiente.
          Entrada publica unica: ZYRA SuperApp (login ZID, menu por rol).
          Este modulo declara la identidad oficial de la aplicacion.
          """

          APP_ID = "laboratorio"
          APP_NOMBRE = "ZYRA LABORATORIO"
          APP_VERSION = "0.1.0"
          APP_DESCRIPCION = "Simulacion, diseno, creacion 4D y visualizacion inmersiva"
          ZYRA_EOF
          cat > apps/laboratorio/shared/enums/scenario_type.py << 'ZYRA_EOF'
          """Tipos de escenario del motor de simulacion (LAB-CORE)."""

          from enum import Enum


          class ScenarioType(str, Enum):
              """Escenarios comparables A/B/C definidos por el propietario."""

              A = "A"
              B = "B"
              C = "C"

              @classmethod
              def validar(cls, valor: str) -> "ScenarioType":
                  """Convierte y valida un texto a ScenarioType (A, B o C)."""
                  if not isinstance(valor, str):
                      raise ValueError("El tipo de escenario debe ser texto: A, B o C.")
                  limpio = valor.strip().upper()
                  try:
                      return cls(limpio)
                  except ValueError:
                      raise ValueError(
                          "Tipo de escenario invalido: " + repr(valor) + ". Use A, B o C."
                      )
          ZYRA_EOF
          cat > apps/laboratorio/shared/enums/creation_type.py << 'ZYRA_EOF'
          """Los 11 tipos de creacion oficiales de LABORATORIO."""

          from enum import Enum


          class CreationType(str, Enum):
              """Dominios de creacion: todo proyecto nace con UN tipo oficial."""

              PRESENTACION = "presentacion"
              ARQUITECTURA = "arquitectura"
              NEGOCIO = "negocio"
              LEY = "ley"
              APP = "app"
              AGRO = "agro"
              EMPLEO = "empleo"
              INFRAESTRUCTURA = "infraestructura"
              EDUCACION = "educacion"
              PRODUCTO = "producto"
              GOBIERNO = "gobierno"

              @classmethod
              def validar(cls, valor: str) -> "CreationType":
                  """Convierte y valida un texto a CreationType."""
                  if not isinstance(valor, str):
                      raise ValueError("El tipo de creacion debe ser texto.")
                  limpio = valor.strip().lower()
                  try:
                      return cls(limpio)
                  except ValueError:
                      validos = ", ".join(t.value for t in cls)
                      raise ValueError(
                          "Tipo de creacion invalido: " + repr(valor)
                          + ". Validos: " + validos
                      )
          ZYRA_EOF
          cat > apps/laboratorio/shared/enums/pipeline_stage.py << 'ZYRA_EOF'
          """Cadena de creacion D1: las 20 etapas oficiales en orden exacto."""

          from enum import Enum


          class PipelineStage(str, Enum):
              """Orden oficial e inmutable de la cadena de LABORATORIO."""

              DESCRIBIR = "describir"
              FOTOGRAFIAR = "fotografiar"
              ESCANEAR = "escanear"
              MEDIR = "medir"
              IMPORTAR = "importar"
              COMPRENDER = "comprender"
              DISENAR = "disenar"
              CREAR = "crear"
              SIMULAR = "simular"
              PROBAR = "probar"
              COMPARAR = "comparar"
              OPTIMIZAR = "optimizar"
              TRES_D = "3d"
              CUATRO_D = "4d"
              FOTORREALISMO = "fotorrealismo"
              PRESENTACION = "presentacion"
              PROYECCION = "proyeccion"
              LIGHT_FIELD = "light_field"
              HOLOGRAFIA = "holografia"
              AR_VR = "ar_vr"

              @classmethod
              def cadena_completa(cls) -> list:
                  """Devuelve la cadena D1 completa en su orden oficial."""
                  return [etapa.value for etapa in cls]

              @classmethod
              def validar(cls, valor: str) -> "PipelineStage":
                  """Convierte y valida un texto a PipelineStage."""
                  if not isinstance(valor, str):
                      raise ValueError("La etapa debe ser texto.")
                  limpio = valor.strip().lower()
                  try:
                      return cls(limpio)
                  except ValueError:
                      validos = ", ".join(t.value for t in cls)
                      raise ValueError(
                          "Etapa invalida: " + repr(valor) + ". Validas: " + validos
                      )
          ZYRA_EOF
          cat > apps/laboratorio/shared/enums/project_status.py << 'ZYRA_EOF'
          """Estados del ciclo de vida de un proyecto de LABORATORIO."""

          from enum import Enum


          class ProjectStatus(str, Enum):
              """Ciclo de vida: todo proyecto esta exactamente en UN estado."""

              BORRADOR = "borrador"
              EN_COMPRESION = "en_compresion"
              EN_DISENO = "en_diseno"
              EN_CREACION = "en_creacion"
              EN_SIMULACION = "en_simulacion"
              EN_RENDER = "en_render"
              EN_PRESENTACION = "en_presentacion"
              EN_PROYECCION = "en_proyeccion"
              ENTREGADO = "entregado"
              ARCHIVADO = "archivado"
          ZYRA_EOF
          cat > apps/laboratorio/shared/enums/engine_status.py << 'ZYRA_EOF'
          """Estados de un motor registrado en el registro de motores."""

          from enum import Enum


          class EngineStatus(str, Enum):
              """Ley 1 de LABORATORIO: un motor JAMAS finge exito.

              Si el hardware o la capacidad no existen, el motor se registra
              con estado NO_DISPONIBLE y lo reporta con honestidad total.
              """

              DISPONIBLE = "disponible"
              NO_DISPONIBLE = "no_disponible"
              EN_MANTENIMIENTO = "en_mantenimiento"
              ERROR = "error"
          ZYRA_EOF
          cat > apps/laboratorio/shared/enums/export_format.py << 'ZYRA_EOF'
          """Formatos de exportacion de LABORATORIO."""

          from enum import Enum


          class ExportFormat(str, Enum):
              """Salidas que los motores de exportacion pueden producir."""

              SVG = "svg"
              PNG = "png"
              JPEG = "jpeg"
              VIDEO_MP4 = "video_mp4"
              PAGINA_HTML = "pagina_html"
              MODELO_3D = "modelo_3d"
              BUNDLE_VERIFICABLE = "bundle_verificable"
              DOSSIER = "dossier"
          ZYRA_EOF
          cat > apps/laboratorio/shared/enums/display_kind.py << 'ZYRA_EOF'
          """Destinos de salida de la Display Abstraction."""

          from enum import Enum


          class DisplayKind(str, Enum):
              """El mismo contenido puede salir por cualquiera de estos destinos.

              La arquitectura es invertida: primero el mundo (SCENE/WORLD),
              despues el render, y al final el destino de salida sustituible.
              """

              PANTALLA = "pantalla"
              PROYECTOR = "proyector"
              HOLOGRAFICO = "holografico"
              LIGHT_FIELD = "light_field"
              AR = "ar"
              VR = "vr"
              FUTURO = "futuro"
          ZYRA_EOF
          cat > apps/laboratorio/shared/enums/certainty.py << 'ZYRA_EOF'
          """Niveles de certeza para informacion procesada (estandar ZYRA)."""

          from enum import Enum


          class Certainty(str, Enum):
              """Toda informacion derivada declara su nivel de certeza."""

              EVIDENCIA_ENCONTRADA = "evidencia_encontrada"
              EVIDENCIA_VERIFICADA = "evidencia_verificada"
              RECONSTRUCCION = "reconstruccion"
              INFERENCIA = "inferencia"
              INCERTIDUMBRE = "incertidumbre"
          ZYRA_EOF
          cat > apps/laboratorio/shared/value_objects/geometry.py << 'ZYRA_EOF'
          """Objetos de valor geometricos inmutables para el mundo 3D/4D."""

          import math
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Point3D:
              """Punto en el espacio 3D."""

              x: float = 0.0
              y: float = 0.0
              z: float = 0.0

              def sumar_vector(self, vector: "Vector3D") -> "Point3D":
                  """Devuelve el punto desplazado por un vector."""
                  return Point3D(self.x + vector.x, self.y + vector.y, self.z + vector.z)

              def distancia_a(self, otro: "Point3D") -> float:
                  """Distancia euclidiana a otro punto."""
                  return math.sqrt(
                      (self.x - otro.x) ** 2
                      + (self.y - otro.y) ** 2
                      + (self.z - otro.z) ** 2
                  )


          @dataclass(frozen=True)
          class Vector3D:
              """Vector (direccion y magnitud) en el espacio 3D."""

              x: float = 0.0
              y: float = 0.0
              z: float = 0.0

              def __add__(self, otro: "Vector3D") -> "Vector3D":
                  return Vector3D(self.x + otro.x, self.y + otro.y, self.z + otro.z)

              def __sub__(self, otro: "Vector3D") -> "Vector3D":
                  return Vector3D(self.x - otro.x, self.y - otro.y, self.z - otro.z)

              def escalar(self, factor: float) -> "Vector3D":
                  """Multiplica el vector por un escalar."""
                  return Vector3D(self.x * factor, self.y * factor, self.z * factor)

              def longitud(self) -> float:
                  """Magnitud del vector."""
                  return math.sqrt(self.x ** 2 + self.y ** 2 + self.z ** 2)

              def normalizar(self) -> "Vector3D":
                  """Devuelve el vector con longitud 1.0."""
                  magnitud = self.longitud()
                  if magnitud == 0.0:
                      raise ValueError("No se puede normalizar un vector de longitud cero.")
                  return Vector3D(
                      self.x / magnitud, self.y / magnitud, self.z / magnitud
                  )

              def producto_punto(self, otro: "Vector3D") -> float:
                  """Producto punto con otro vector."""
                  return self.x * otro.x + self.y * otro.y + self.z * otro.z


          @dataclass(frozen=True)
          class Quaternion:
              """Orientacion 3D como quaternion (x, y, z, w)."""

              x: float = 0.0
              y: float = 0.0
              z: float = 0.0
              w: float = 1.0

              def longitud(self) -> float:
                  """Magnitud del quaternion."""
                  return math.sqrt(
                      self.x ** 2 + self.y ** 2 + self.z ** 2 + self.w ** 2
                  )

              def normalizar(self) -> "Quaternion":
                  """Devuelve el quaternion normalizado (rotacion valida)."""
                  magnitud = self.longitud()
                  if magnitud == 0.0:
                      raise ValueError(
                          "No se puede normalizar un quaternion de longitud cero."
                      )
                  return Quaternion(
                      self.x / magnitud,
                      self.y / magnitud,
                      self.z / magnitud,
                      self.w / magnitud,
                  )
          ZYRA_EOF
          cat > apps/laboratorio/shared/value_objects/color.py << 'ZYRA_EOF'
          """Color RGBA inmutable con componentes normalizadas (0.0 a 1.0)."""

          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Color:
              """Color RGBA usado por materiales, luces y renders."""

              r: float = 1.0
              g: float = 1.0
              b: float = 1.0
              a: float = 1.0

              def __post_init__(self):
                  for nombre in ("r", "g", "b", "a"):
                      valor = getattr(self, nombre)
                      if not 0.0 <= valor <= 1.0:
                          raise ValueError(
                              "Componente " + nombre + " fuera de rango: "
                              + str(valor) + ". Debe estar entre 0.0 y 1.0."
                          )

              @classmethod
              def desde_rgb255(cls, r: int, g: int, b: int, a: int = 255) -> "Color":
                  """Crea un Color desde componentes enteras 0-255."""
                  for nombre, valor in (("r", r), ("g", g), ("b", b), ("a", a)):
                      if not 0 <= valor <= 255:
                          raise ValueError(
                              "Componente " + nombre
                              + " fuera de rango 0-255: " + str(valor)
                          )
                  return cls(r / 255.0, g / 255.0, b / 255.0, a / 255.0)

              def a_rgb255(self) -> tuple:
                  """Devuelve (r, g, b) enteras en 0-255."""
                  return (
                      round(self.r * 255),
                      round(self.g * 255),
                      round(self.b * 255),
                  )

              def a_hex(self) -> str:
                  """Devuelve el color como texto #RRGGBB."""
                  r, g, b = self.a_rgb255()
                  return "#" + format(r, "02X") + format(g, "02X") + format(b, "02X")

              @classmethod
              def negro(cls) -> "Color":
                  """Color negro opaco."""
                  return cls(0.0, 0.0, 0.0, 1.0)

              @classmethod
              def blanco(cls) -> "Color":
                  """Color blanco opaco."""
                  return cls(1.0, 1.0, 1.0, 1.0)
          ZYRA_EOF
          echo "=== REGLA 6: VERIFICACION DE SINTAXIS (compile de cada archivo) ==="
          python3 - << 'ZYRA_CHECK'
          import pathlib
          import sys
          base = pathlib.Path("apps/laboratorio")
          objetivos = [
              "__init__.py",
              "shared/enums/scenario_type.py",
              "shared/enums/creation_type.py",
              "shared/enums/pipeline_stage.py",
              "shared/enums/project_status.py",
              "shared/enums/engine_status.py",
              "shared/enums/export_format.py",
              "shared/enums/display_kind.py",
              "shared/enums/certainty.py",
              "shared/value_objects/geometry.py",
              "shared/value_objects/color.py",
          ]
          errores = 0
          for rel in objetivos:
              ruta = base / rel
              try:
                  compile(ruta.read_text(encoding="utf-8"), str(ruta), "exec")
                  print("OK     " + rel)
              except Exception as exc:
                  errores = errores + 1
                  print("FALLO  " + rel + " -> " + str(exc))
          if errores:
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          print("VERIFICACION COMPLETA: 0 errores en 11 archivos")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 1A-1 aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 1A-1: enums LAB-CORE y value objects"
            git push
          fi
