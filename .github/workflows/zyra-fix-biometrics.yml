name: "ZYRA NEXO-LIVE-2 arranque inyectado (superapp -> runtime vivo)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] startup.py + inyeccion wrapper en superapp.py"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/nexo/services/startup.py", D(r'''
                  """Nexo Startup - activacion en el arranque
                  (NEXO-LIVE-2). attach_live_runtime(result):
                  extrae defensivamente server/store/client/db/
                  clock del resultado de _start_nexo (dict u
                  objeto), construye el runtime conectado
                  (build_runtime: outbox real + link real + IA
                  si hay GEMINI_API_KEY) y lo cuelga en el
                  server, en su handler y en el modulo superapp.
                  Idempotente y degradacion honesta: sin Red el
                  runtime vive igual, en buffer."""
                  from __future__ import annotations

                  def _pick(obj, names):
                      for n in names:
                          v = getattr(obj, n, None)
                          if v is not None:
                              return v
                      return None

                  def attach_live_runtime(result=None):
                      """Conecta el runtime vivo tras el arranque
                      de NEXO. Nunca lanza: si algo falta, el
                      runtime queda honesto (buffer)."""
                      from shared_engines.common.clocks import (
                          SystemClock)
                      from apps.nexo.services.boot import (
                          build_runtime)
                      server = None
                      store = None
                      client = None
                      db = None
                      clock = None
                      if isinstance(result, dict):
                          server = result.get("server")
                          store = result.get("store")
                          client = result.get("client")
                          db = result.get("db")
                          clock = result.get("clock")
                      elif result is not None:
                          server = _pick(result, ("server",
                                                  "httpd"))
                          store = _pick(result, ("store",))
                          client = _pick(result, ("client",
                                                  "network"))
                          db = _pick(result, ("db",))
                          clock = _pick(result, ("clock",))
                      if store is not None and db is None:
                          db = _pick(store, ("db", "_db"))
                      if clock is None:
                          clock = SystemClock()
                      if (server is not None
                              and getattr(server,
                                          "nexo_runtime",
                                          None) is not None):
                          return server.nexo_runtime
                      rt = build_runtime(db=db, clock=clock,
                                         client=client)
                      if server is not None:
                          try:
                              server.nexo_runtime = rt
                          except Exception:
                              pass
                          handler = getattr(server,
                                            "RequestHandlerClass",
                                            None)
                          if handler is not None:
                              try:
                                  handler.nexo_runtime = rt
                              except Exception:
                                  pass
                      try:
                          import superapp as _sup
                          _sup.nexo_runtime = rt
                      except Exception:
                          pass
                      return rt
              '''))

              sp = pathlib.Path("superapp.py")
              src = sp.read_text(encoding="utf-8")
              if "_ng_start_nexo_base" in src:
                  out("- superapp.py: wrapper ya inyectado"
                      " — skip (idempotencia)")
              else:
                  tree = ast.parse(src)
                  target = None
                  for node in tree.body:
                      if (isinstance(node, ast.FunctionDef)
                              and node.name == "_start_nexo"):
                          target = node
                  if target is None:
                      out("- superapp.py: _start_nexo no hallado"
                          " — skip")
                  else:
                      target.name = "_ng_start_nexo_base"
                      wrapper = D(r'''
                          def _start_nexo(*args, **kwargs):
                              _result = _ng_start_nexo_base(
                                  *args, **kwargs)
                              try:
                                  from apps.nexo.services.startup import (
                                      attach_live_runtime as
                                      _ng_attach)
                                  _ng_attach(_result)
                              except Exception:
                                  pass
                              return _result
                      ''').rstrip() + "\n"
                      lines = src.split("\n")
                      at = target.end_lineno
                      new_src = "\n".join(
                          lines[:at]
                          + wrapper.split("\n")
                          + lines[at:])
                      ast.parse(new_src)
                      sp.write_text(new_src, encoding="utf-8")
                      py_compile.compile("superapp.py",
                                         doraise=True)
                      out("- **superapp.py: wrapper _start_nexo"
                          " inyectado y compilado OK**")
              out("## FIN NEXO-LIVE-2 builder")
          except Exception:
              out("## BUILDER ERROR (visible abajo)")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] NEXO-LIVE-2 tests"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/nexo/tests
          cat > apps/nexo/tests/test_ng14_startup.py << 'TSEOF'
          import importlib, pathlib, pytest
          from shared_engines.common.clocks import SystemClock
          from apps.nexo.services.startup import attach_live_runtime

          class FakeStore:
              def __init__(self):
                  self._db = None

          class FakeClient:
              pass

          class FakeServer:
              def __init__(self):
                  self.RequestHandlerClass = None

          def test_attach_con_client_conecta(tmp_path):
              server = FakeServer()
              rt = attach_live_runtime({"server": server,
                  "store": FakeStore(),
                  "client": FakeClient()})
              assert rt is not None
              assert server.nexo_runtime is rt
              assert rt.link is not None
              assert rt.verification.mode == "nexo_link"
              assert "events_pending" in rt.status()
              print("OK attach: runtime vivo colgado en server")

          def test_attach_sin_red_honesto():
              server = FakeServer()
              rt = attach_live_runtime({"server": server,
                  "store": FakeStore()})
              assert rt.verification.mode == "not_configured"
              assert rt.link is None
              r = rt.emit("NEXO_PERIOD_CLOSED",
                  company_id="EMP-1", payload={})
              assert r["buffered"] is True
              print("OK attach sin Red: runtime honesto en buffer")

          def test_attach_idempotente():
              server = FakeServer()
              r1 = attach_live_runtime({"server": server,
                  "store": FakeStore()})
              r2 = attach_live_runtime({"server": server,
                  "store": FakeStore()})
              assert r1 is r2
              print("OK attach: idempotente (misma instancia)")

          def test_attach_defensivo_none():
              rt = attach_live_runtime(None)
              assert rt is not None
              assert rt.status()["ai_mode"] in ("ai_chain",
                                                "rules_fallback")
              print("OK attach None: no lanza, runtime honesto")

          def test_superapp_inyectado_e_importa():
              src = (pathlib.Path.cwd()
                     / "superapp.py").read_text(encoding="utf-8")
              assert "_ng_start_nexo_base" in src
              assert "attach_live_runtime" in src
              sup = importlib.import_module("superapp")
              assert hasattr(sup, "_start_nexo")
              print("OK superapp: wrapper presente y modulo importa")
          TSEOF
          timeout 120 python3 -m pytest apps/nexo/tests/test_ng14_startup.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/ng14.out 2>&1
          echo $? > /tmp/ng14
          if [ "$(cat /tmp/ng14)" = "0" ]; then echo "- NEXO-LIVE-2 arranque inyectado: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- NEXO-LIVE-2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### NEXO-LIVE-2 detalle"; echo '```'; tail -80 /tmp/ng14.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] NGX regresion completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc1.out 2>&1
          echo $? > /tmp/ngxc1
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=short > /tmp/ngxc2.out 2>&1
          echo $? > /tmp/ngxc2
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc3.out 2>&1
          echo $? > /tmp/ngxc3
          for par in "ngxc1 nexo" "ngxc2 shared_engines" "ngxc3 subastas"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- NGX $2: ✅" >> "$SUM"
            else
              echo "- NGX $2: ❌" >> "$SUM"
              { echo "### NGX $2 detalle"; echo '```'; tail -100 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          if [ "$(cat /tmp/ngxc1)" = "0" ] && [ "$(cat /tmp/ngxc2)" = "0" ] && [ "$(cat /tmp/ngxc3)" = "0" ]; then echo 0 > /tmp/ngxc; else echo 1 > /tmp/ngxc; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si TODO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in ng14 ngxc; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: NEXO-LIVE-2 VERDE — ARRANQUE INYECTADO, ETAPA 1 CERRADA AL 100%**"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo superapp.py
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-LIVE-2): arranque en vivo (apps/nexo/services/startup.py attach_live_runtime extrae server/store/client/db/clock defensivamente, construye runtime conectado y lo cuelga en server+handler+superapp, idempotente y degradacion honesta; inyeccion AST wrapper en superapp.py _start_nexo -> _ng_start_nexo_base + wrapper que conecta el runtime despues del arranque original, validada con ast+py_compile antes de escribir) (NEXO-LIVE-2 verde — Etapa 1 NEXO cerrada al 100%)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — ETAPA 1 (NEXO) CERRADA AL 100%. Arranca ETAPA 2: SEMILLA Plan A (A2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
