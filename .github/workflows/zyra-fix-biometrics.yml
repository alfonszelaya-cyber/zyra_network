          _en("                (\"axis-bio-\" + _zax_name).encode(\"utf-8\")).decode(\"ascii\")")
          _en("            _zax_lk = getattr(self, \"link\", None)")
          _en("            if _zax_lk is None:")
          _en("                _zax_lk = getattr(type(self), \"link\", None)")
          _en("            _zax_cli = None")
          _en("            for _zax_a in (\"client\", \"_client\",")
          _en("                            \"network_client\", \"_network_client\"):")
          _en("                _zax_c = getattr(_zax_lk, _zax_a, None)")
          _en("                if _zax_c is not None and hasattr(_zax_c, \"post\"):")
          _en("                    _zax_cli = _zax_c")
          _en("                    break")
          _en("            if _zax_cli is not None:")
          _en("                _zax_o, _zax_d, _zax_e = _zax_cli.post(")
          _en("                    \"/identity/enroll\",")
          _en("                    {\"kind\": \"person\",")
          _en("                     \"display_name\": _zax_name,")
          _en("                     \"actor\": \"axis\",")
          _en("                     \"doc_image_b64\": _zax_seed,")
          _en("                     \"selfie_image_b64\": _zax_seed})")
          _en("                if _zax_o:")
          _en("                    _zax_data = _zax_d")
          _en("            elif _zax_lk is not None and hasattr(")
          _en("                    _zax_lk, \"enroll_person\"):")
          _en("                try:")
          _en("                    _zax_r = _zax_lk.enroll_person(")
          _en("                        _zax_name, _zax_seed, _zax_seed)")
          _en("                except TypeError:")
          _en("                    _zax_r = _zax_lk.enroll_person(")
          _en("                        _zax_name, _zax_seed, _zax_seed, \"axis\")")
          _en("                if isinstance(_zax_r, tuple) and len(_zax_r) >= 2:")
          _en("                    if _zax_r[0]:")
          _en("                        _zax_data = _zax_r[1]")
          _en("                elif isinstance(_zax_r, dict):")
          _en("                    _zax_data = _zax_r")
          _en("        except Exception:")
          _en("            _zax_data = None")
          _en("        if isinstance(_zax_data, dict):")
          _en("            _zax_idn = _zax_data.get(\"identity\")")
          _en("            if isinstance(_zax_idn, dict):")
          _en("                _zax_zid = _zax_idn.get(\"zid\")")
          _en("            _zax_zid = _zax_zid or _zax_data.get(\"zid\")")
          _en("    if _zax_zid:")
          _en("        try:")
          _en("            doc = dict(doc)")
          _en("            doc[\"baby_zid\"] = _zax_zid")
          _en("            doc[\"child_zid\"] = _zax_zid")
          _en("            doc[\"zid\"] = _zax_zid")
          _en("        except Exception:")
          _en("            pass")
          _en("except Exception:")
          _en("    pass")
          _up("if _zax_zid:")
          _up("    try:")
          _up("        _zax_db = _zax_life._store._db")
          _up("        _zax_q = _zax_name.replace(\"'\", \"''\")")
          _up("        _zax_z = str(_zax_zid).replace(\"'\", \"''\")")
          _up("        _zax_sql = (")
          _up("            \"UPDATE life_persons SET zid = '\" + _zax_z + \"'\"")
          _up("            \" WHERE person_id = (SELECT person_id\"")
          _up("            \" FROM life_persons WHERE full_name = '\" + _zax_q + \"'\"")
          _up("            \" AND (zid IS NULL OR zid = '')\"")
          _up("            \" ORDER BY rowid DESC LIMIT 1)\")")
          _up("        _zax_hecho = False")
          _up("        for _zax_m in (\"execute\", \"run\", \"exec\"):")
          _up("            _zax_f = getattr(_zax_db, _zax_m, None)")
          _up("            if _zax_f is None:")
          _up("                continue")
          _up("            try:")
          _up("                _zax_f(_zax_sql)")
          _up("                _zax_hecho = True")
          _up("                break")
          _up("            except TypeError:")
          _up("                try:")
          _up("                    _zax_f(_zax_sql, ())")
          _up("                    _zax_hecho = True")
          _up("                    break")
          _up("                except Exception:")
          _up("                    pass")
          _up("        if not _zax_hecho:")
          _up("            for _zax_a in (\"conn\", \"_conn\",")
          _up("                            \"connection\", \"_connection\"):")
          _up("                _zax_c = getattr(_zax_db, _zax_a, None)")
          _up("                if _zax_c is not None and hasattr(")
          _up("                        _zax_c, \"execute\"):")
          _up("                    _zax_c.execute(_zax_sql)")
          _up("                    try:")
          _up("                        _zax_c.commit()")
          _up("                    except Exception:")
          _up("                        pass")
          _up("                    break")
