name: ZYRA AXIS Block 5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/3 Health link tests (3 E2E)
        run: python -m apps.axis.life_history.tests.test_health_link -v

      - name: 2/3 Life History regression
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit Health x Life History (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "health: HealthLifeLink + ReminderService - medical flow chained into life history (5 events certified)"
            git push
          fi
