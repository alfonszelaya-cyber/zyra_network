                      service="semilla.matricula")
              g = rep.grant(guardian_zid="ZID-TUT",
                  minor_zid="ZID-MENOR",
                  service="semilla.matricula",
                  granted_by="APP-SEMILLA")
              assert g["service"] == "semilla.matricula"
              assert rep.can_act("ZID-TUT", "ZID-MENOR",
                  "semilla.matricula") is True
              assert rep.can_act("ZID-TUT", "ZID-MENOR",
                  "axis.salud") is False
              rep.grant(guardian_zid="ZID-TUT",
                  minor_zid="ZID-MENOR", service="*")
              assert rep.can_act("ZID-TUT", "ZID-MENOR",
                  "axis.salud") is True
              rep.revoke(g["rep_id"], reason="ajuste de alcance")
              assert rep.can_act("ZID-TUT", "ZID-MENOR",
                  "semilla.matricula") is True
              assert len(rep.representations_of(
                  "ZID-MENOR")) == 2
              print("OK R-5: representacion exige vinculo tutor (regla 66) + alcance por servicio + comodin * + revocacion")


          def test_r6_capabilities_zid_app_recurso_accion(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "c.db")
              cap = CapabilityEngine(db, FrozenClock())
              with pytest.raises(ValueError):
                  cap.grant(zid=" ", app="semilla",
                      resource="sm_students", action="read")
              with pytest.raises(ValueError):
                  cap.grant(zid="ZID-1", app="semilla",
                      resource="sm_students",
                      action="borrar")
              g = cap.grant(zid="ZID-1", app="semilla",
                  resource="sm_students", action="read")
              assert g["cap_id"]
              assert cap.can("ZID-1", "semilla",
                  "sm_students", "read") is True
              assert cap.can("ZID-1", "semilla",
                  "sm_students", "write") is False
              gw = cap.grant(zid="ZID-1", app="semilla",
                  resource="sm_students", action="write",
                  expires_at=1.0)
              assert cap.can("ZID-1", "semilla",
                  "sm_students", "write") is False
              ga = cap.grant(zid="ZID-1", app="semilla",
                  resource="sm_students", action="admin")
              assert cap.can("ZID-1", "semilla",
                  "sm_students", "write") is True
              cap.revoke(ga["cap_id"], reason="exceso")
              assert cap.can("ZID-1", "semilla",
                  "sm_students", "admin") is False
              assert len(cap.caps_of("ZID-1")) == 3
              print("OK R-6: jerarquia read<write<admin + expiracion + revocacion + caps por ZID")


          def test_r9_sesiones_firmas(tmp_path) -> None:
              from shared_engines.protocol.sessions.signatures_engine import (
                  SessionSignatureEngine)
              db = SQLiteAdapter(tmp_path / "s.db")
              ss = SessionSignatureEngine(db, FrozenClock())
              with pytest.raises(ValueError):
                  ss.open_session(zid=" ")
              s = ss.open_session(zid="ZID-1",
                  app="semilla", ttl_seconds=100.0)
              assert s["status"] == "abierta"
              sg = ss.sign(s["session_id"],
                  message="matricular a ZID-NENE")
              assert len(sg["seal"]) == 64
              with pytest.raises(ValueError):
                  ss.sign(s["session_id"], message=" ")
              v = ss.verify(sg["sig_id"],
                  message="matricular a ZID-NENE")
              assert v["valid"] is True
              v2 = ss.verify(sg["sig_id"],
                  message="mensaje cambiado")
              assert v2["valid"] is False
              ss.close_session(s["session_id"])
              with pytest.raises(ValueError):
                  ss.sign(s["session_id"], message="tardio")
              with pytest.raises(ValueError):
                  ss.close_session(s["session_id"])
              assert len(ss.sessions_of("ZID-1")) == 1
              print("OK R-9: sesiones con expiracion + firmas de mensajes con sello + verificacion (mensaje alterado detectado) + cierre terminal")


          def test_n9_registro_red(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "n.db")
              nr = NetworkRegistryEngine(db, FrozenClock())
              r1 = nr.register(engine_name="BirthRegistryEngine",
                  module_path="shared_engines.identity."
                              "birth_registry_engine",
                  namespace="zid.birth", version="1")
              assert r1["engine_name"]
              nr.register(engine_name="BirthRegistryEngine",
                  module_path="shared_engines.identity."
                              "birth_registry_engine",
                  namespace="zid.birth", version="2")
              g = nr.get("BirthRegistryEngine")
              assert g["found"] is True
              assert g["version"] == "2"
              assert nr.get("NO-EXISTE")["found"] is False
              assert len(nr.all_engines()) == 1
              print("OK N-9 parcial: registro central de engines de la Red con version y discovery")
          TSEOF
          mkdir -p shared_engines/identity/tests shared_engines/protocol
          touch shared_engines/identity/tests/__init__.py
          timeout 240 python3 -m pytest shared_engines/identity/tests/test_zid_red.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/r8.out 2>&1
          echo $? > /tmp/r8
          if [ "$(cat /tmp/r8)" = "0" ]; then echo "- RUN 8 (Red/ZID): ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- RUN 8: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### RUN 8 detalle"; echo '```'; tail -100 /tmp/r8.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si todo verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/r8 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: rojo — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(RED/ZID R-1..R-9 — 7 engines CLASE en shared_engines, unico dueno del ZID R-8): BirthRegistryEngine (nacimiento completo madre/padre por ZID, evidencia con hash/provenance/revocacion, certificado hash-chain por nacido, bind ZID UNICO regla 78) · GuardianLinkEngine (relacion tutor<->menor CANONICA MADRE/PADRE/TUTOR/REPRESENTANTE/ENCARGADO con UNIQUE(rol), revocacion con motivo, is_guardian para TODAS las apps — regla 69) · BiometricLifecycleEngine (nace PENDING regla 78, enrolamiento al MISMO ZID EXIGE tutor activo — proteccion menores, template hash jamas raw regla 63, actualizacion por crecimiento, revocacion total) · RepresentationEngine (adulto actua POR menor para SERVICIO especifico o *, exige vinculo tutor, expiracion, revocacion, can_act canonico) · CapabilityEngine (ZID->app->permiso->datos->accion con jerarquia read<write<admin, expiracion, revocacion) · SessionSignatureEngine en protocol/sessions/signatures (R-9: sesiones con TTL, firmas de mensajes con sello sha256 verificable) · NetworkRegistryEngine (N-9 parcial: registro central de engines con version y discovery) — patron clase MigrationRunner probado; reglas 63/66/68/76/78"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — RED/ZID CERRADO (R-1..R-9). RUN 9 FINAL: calidad (N-8/10/11 + A-15..19) + GOV-DATA 3 capas + alarmas — cierre del plan de 85 puntos.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
