name: "AXIS AX-3 fix: header de rol en helper de tests (anclas robustas)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - header gobierno en _ax1_post_form (ancla robusta)"
        run: |
          python3 - <<'FIXEOF'
          from pathlib import Path
          p = Path(
              "apps/axis/tests/test_axis.py")
          t = p.read_text(encoding="utf-8")
          if "X-ZYRA-Actor-Role" in t:
              print("SKIP (header ya presente)")
              raise SystemExit(0)
          i = t.find("def _ax1_post_form(")
          assert i >= 0, (
              "helper _ax1_post_form no hallado")
          limite = t.find("\ndef ", i + 10)
          if limite < 0:
              limite = len(t)
          j = t.find('method="POST"', i, limite)
          assert j >= 0, (
              "method POST no hallado en helper")
          k = t.find("\n", j)
          ins = (
              "\n        headers={\n"
              "            \"X-ZYRA-Actor-Role\":"
              " \"gobierno\",\n"
              "        },"
          )
          t = t[:k] + ins + t[k:]
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert "X-ZYRA-Actor-Role" in escrito
          print("OK header gobierno anadido"
                " al helper (verificado en disco)")
          FIXEOF

      - name: "Paso 2 - verificacion interprete fresco"
        run: |
          python3 -c "
          import apps.axis.server as s
          t = open('apps/axis/server.py').read()
          assert '_ZAX3_GUARD' in t
          print('OK guardia viva + tests con rol')
          "

      - name: "Paso 3 - dump test_axis.py (para guardia completa AX-3b)"
        run: |
          python3 - <<'DMPEOF'
          from pathlib import Path
          p = Path(
              "apps/axis/tests/test_axis.py")
          t = p.read_text(
              encoding="utf-8", errors="ignore")
          print("===== test_axis.py ("
                + str(len(t.splitlines()))
                + " lineas) =====")
          print(t)
          DMPEOF

      - name: "Paso 4 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AXIS AX-3 fix: rol gobierno en helper de tests" -m "FIX: parche por anclas robustas (def _ax1_post_form + method=POST dentro del helper, sin depender de indentacion); los tests AX-1 ahora envian X-ZYRA-Actor-Role: gobierno para pasar la guardia del Registro Civil (REGISTRY_OPERATORS de permissions.py preexistente)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
