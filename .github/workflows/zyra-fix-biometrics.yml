name: "RED-RELAY v5: import con newline + hardening ProfileRegistry (ensure_schema) + gates aislados"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Fix 1 - engine.py: import canonical_json_dumps (CON newline entre imports)"
        run: |
          python3 - <<'F1EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/integrations/engine.py")
          t = p.read_text(encoding="utf-8")
          if "canonical_json_dumps" in t:
              print("SKIP 1 (ya presente)")
              raise SystemExit(0)
          ANCLA = "from shared_engines.storage.database import (\n    Database,\n)"
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla import " + str(cnt)
          t = t.replace(
              ANCLA,
              ANCLA + "\nfrom shared_engines.common.serialization import (\n    canonical_json_dumps,\n)",
              1,
          )
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 1: canonical_json_dumps importado (AST valido)")
          F1EOF

      - name: "Fix 2 - HARDENING: ProfileRegistry.__init__ asegura el schema del outbox (raiz del no-such-table)"
        run: |
          python3 - <<'F2EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "self._outbox.ensure_schema()" in t:
              print("SKIP 2 (hardening ya presente)")
              raise SystemExit(0)
          ANCLA = (
              "        MigrationRunner(\n"
              "            db,\n"
              '            "network_portable_profile",\n'
              "            _MIGRATIONS,\n"
              "        ).run(clock)"
          )
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla init " + str(cnt)
          t = t.replace(ANCLA, ANCLA + "\n        self._outbox.ensure_schema()", 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 2: ProfileRegistry asegura outbox schema (AST valido)")
          F2EOF

      - name: "Verificacion: sweep snapshots durables + network tests verdes"
        run: |
          python3 - <<'VEOF'
          import json
          from pathlib import Path
          import tempfile
          from shared_engines.integrations.engine import (
              PublicSourceClient, SourceIndex,
              sweep_onec, sweep_marn, ONEC_ENDPOINTS,
              ARCGIS_SERVICES)
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          tmp = Path(tempfile.mkdtemp())
          geo = json.dumps({"type": "FeatureCollection", "features": [{"type": "Feature"}, {"type": "Feature"}]}).encode("utf-8")
          meta = json.dumps({"layers": [{"id": 0, "name": "a"}, {"id": 1, "name": "b"}]}).encode("utf-8")
          one = json.dumps([{"codigo": "0111101"}]).encode("utf-8")
          def opener(url):
              if url.endswith("?f=json"):
                  return meta
              if "/query" in url:
                  return geo
              if url.endswith(tuple(ONEC_ENDPOINTS)):
                  return one
              raise OSError("no simulada")
          cli = PublicSourceClient(clock=FrozenClock(), ttl_seconds=60.0, opener=opener)
          index = SourceIndex(SQLiteAdapter(tmp / "src.db"), FrozenClock())
          r1 = sweep_onec(cli, index)
          assert r1["ok"] == 7, str(r1)
          r2 = sweep_marn(cli, index, max_layers_per_service=2, pause_seconds=0)
          assert r2["layers_ok"] == 2 * len(ARCGIS_SERVICES["marn-geo"]), str(r2)
          rows = index._db.query_all("SELECT * FROM source_snapshots")
          assert len(rows) == 7 + 2 * len(ARCGIS_SERVICES["marn-geo"]), len(rows)
          print("OK sweep: " + str(len(rows)) + " snapshots durables")
          VEOF
          python3 -m pytest shared_engines/network/tests -q --tb=short 2>&1 | tail -4

      - name: "GATE runtime AISLADO POR ARCHIVO (timeout 90s c/u - identifica el hang exacto)"
        run: |
          set +e
          shopt -s nullglob
          FAIL=0
          for f in shared_engines/runtime/tests/test_*.py; do
            nombre=$(basename "$f" .py)
            timeout 90 python3 -m pytest "$f" -q --tb=line > "/tmp/rt_$nombre.txt" 2>&1
            CODE=$?
            if [ $CODE -eq 124 ]; then
              echo "HANG: $nombre (90s)"
              FAIL=1
            elif [ $CODE -ne 0 ]; then
              echo "FALLO: $nombre"
              tail -8 "/tmp/rt_$nombre.txt"
              FAIL=1
            else
              echo "VERDE: $nombre :: $(tail -1 /tmp/rt_$nombre.txt)"
            fi
          done
          echo "=============================="
          if [ $FAIL -ne 0 ]; then
            echo "GATE ROJO"
            exit 1
          fi
          echo "GATE runtime VERDE"
          exit 0

      - name: "GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-RELAY v5"
            shopt -s nullglob
            for f in /tmp/rt_*.txt; do
              echo
              echo "#### $f"
              tail -15 "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-RELAY v5: fixes del gate por motor - import canonical_json_dumps + hardening outbox schema" -m "Diagnostico del gate por motor aplicado: (1) integrations 0 snapshots: SourceIndex.record usa canonical_json_dumps sin importarlo -> import anadido CON newline (v4 generaba )from sin separador -> SyntaxError; ast.parse antes de write protegio el repo), (2) network no-such-table events_outbox: HARDENING raiz - ProfileRegistry.__init__ ahora llama self._outbox.ensure_schema() el mismo (el engine garantiza su dependencia; no parches de tests), (3) runtime HANG: gate runtime dividido POR ARCHIVO con timeout 90s c/u -> el Resumen muestra el archivo culpable exacto. RelayScheduler + serve_combined(bridge) + rutas bridge/status/relay + sources/sweep ya aplicados en runs previos (idempotentes)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
