          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.institution.institution_registry_engine import InstitutionRegistryEngine
          from apps.semilla.domain.institution.institution_verification_engine import InstitutionVerificationEngine
          from apps.semilla.domain.government.governance_engine import GovernanceEngine
          from apps.semilla.domain.analytics.analytics_engine import AnalyticsEngine
          from apps.semilla.domain.reports.report_engine import SemillaReportEngine
          from apps.semilla.domain.student.student_registry_engine import StudentRegistryEngine
          from apps.semilla.domain.academic.enrollment_engine import EnrollmentEngine
          from apps.semilla.domain.classroom.classroom_engine import ClassroomEngine
          from apps.semilla.domain.evaluation.evaluation_engine import EvaluationEngine

          def test_verificacion_institucion_elevable(tmp_path) -> None:
              ve = InstitutionVerificationEngine(
                  SQLiteAdapter(tmp_path / "v.db"), FrozenClock())
              d = ve.submit_document(institution_id="INST-1",
                  document_ref="RESOLUCION-MINED-2026-001")
              assert d["status"] == "PENDING"
              assert d["document_hash"] != ""
              e1 = ve.elevate(d["verify_id"],
                  new_status="INSTITUTION_VERIFIED",
                  verified_by="DIRECTOR-1")
              assert e1["status"] == "INSTITUTION_VERIFIED"
              e2 = ve.elevate(d["verify_id"],
                  new_status="MINED_VERIFIED",
                  verified_by="MINED-DEPTO")
              assert e2["status"] == "MINED_VERIFIED"
              with pytest.raises(ValueError):
                  ve.elevate(d["verify_id"],
                      new_status="PENDING", verified_by="x")
              print("OK verificacion institucion: PENDING->INSTITUTION->MINED elevable sin degradar")

          def test_gobernanza_supervision_politicas(tmp_path) -> None:
              go = GovernanceEngine(
                  SQLiteAdapter(tmp_path / "g.db"), FrozenClock())
              sup = go.supervise(institution_id="INST-1",
                  supervisor="Supervisor Zona 3",
                  findings="documentacion en orden")
              assert sup["status"] == "OPEN"
              c = go.close_supervision(sup["supervision_id"])
              assert c["status"] == "CLOSED"
              p = go.create_policy(title="Uso de IA en aulas",
                  scope="NATIONAL", detail="reglas de uso")
              assert p["status"] == "DRAFT"
              a = go.activate_policy(p["policy_id"])
              assert a["status"] == "ACTIVE"
              with pytest.raises(ValueError):
                  go.supervise(institution_id="INST-2",
                               supervisor="")
              print("OK gobernanza: supervision abrir/cerrar + politicas DRAFT->ACTIVE")

          def test_dashboard_ministerial(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "md.db")
              clock = FrozenClock()
              reg = InstitutionRegistryEngine(db, clock)
              inst = reg.register(name="Escuela Central",
                  levels=["BASICA"])
              st = StudentRegistryEngine(db, clock)
              TUT = [{"name": "Padre", "relation": "PADRE"}]
              PICK = [{"name": "Tia", "relation": "TIA"},
                      {"name": "Abuelo", "relation": "ABUELO"}]
              EMG = [{"name": "Mama", "relation": "MADRE"}]
              for i in range(3):
                  st.register(full_name="Alumno " + str(i),
                      level="BASICA", grade=str(i + 1),
                      institution_id=inst["institution_id"],
                      tutores=TUT, authorized_pickup=PICK,
                      emergency_contacts=EMG)
              cls = ClassroomEngine(db, clock)
              room = cls.create(name="Aula 1",
                  institution_id=inst["institution_id"],
                  school_year="2026", level="BASICA", grade="1",
                  capacity=30)
              en = EnrollmentEngine(db, clock, classroom_engine=cls)
              s1 = st.by_institution(inst["institution_id"])[0]
              en.enroll(student_id=s1["student_id"],
                  classroom_id=room["classroom_id"],
                  school_year="2026")
              go = GovernanceEngine(db, clock)
              dash = go.ministry_dashboard(registry=reg,
                  enrollment_engine=en)
              assert dash["institutions"] == 1
              assert dash["enrolled_2026"] == 1
              print("OK dashboard ministerial: instituciones + matriculados reales")

          def test_analitica_estudiante_escuela_nacion(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "an.db")
              clock = FrozenClock()
              ev = EvaluationEngine(db, clock)
              reg = StudentRegistryEngine(db, clock)
              TUT = [{"name": "Padre", "relation": "PADRE"}]
              PICK = [{"name": "Tia", "relation": "TIA"},
                      {"name": "Abuelo", "relation": "ABUELO"}]
              EMG = [{"name": "Mama", "relation": "MADRE"}]
              inst1 = reg.register(name="Escuela A")
              ids1 = []
              for i in range(2):
                  s = reg.register(full_name="A" + str(i),
                      level="BASICA", grade="1",
                      institution_id=inst1["institution_id"],
                      tutores=TUT, authorized_pickup=PICK,
                      emergency_contacts=EMG)
                  ids1.append(s["student_id"])
              ev.register(student_id=ids1[0], subject="Matematica",
                  period="P1", score="9.0")
              ev.register(student_id=ids1[0], subject="Lenguaje",
                  period="P1", score="8.0")
              ev.register(student_id=ids1[1], subject="Matematica",
                  period="P1", score="7.0")
              an = AnalyticsEngine(db, clock, evaluation_engine=ev,
                  student_registry=reg)
              sr = an.student_report(ids1[0])
              assert sr["average"] == "8.50"
              assert sr["best_subject"] == "Matematica"
              assert sr["weak_subject"] == "Lenguaje"
              sch = an.school_report(ids1, inst1["institution_id"])
              assert sch["students"] == 2
              assert sch["school_average"] == "8.00"
              nat = an.national_report([inst1["institution_id"]],
                  reg)
              assert nat["institutions"] == 1
              assert nat["national_average"] == "8.00"
              print("OK analitica: estudiante 8.50 + escuela 8.00 + nacional (Decimal 2d)")

          def test_reportes_semilla(tmp_path) -> None:
              rep = SemillaReportEngine(
                  SQLiteAdapter(tmp_path / "r.db"), FrozenClock())
              r = rep.generate(report_type="SCHOOL_MONTHLY",
                  institution_id="INST-1", period="2026-03",
                  data={"promedio": "8.00", "asistencia": "95"})
              assert r["report_id"].startswith("SMRPT-")
              got = rep.get(r["report_id"])
              assert got["data"]["promedio"] == "8.00"
              assert len(rep.list_of("INST-1")) == 1
              with pytest.raises(ValueError):
                  rep.generate(report_type="", data={"a": 1})
              with pytest.raises(ValueError):
                  rep.generate(report_type="X", data=None)
              print("OK reportes: generar + recuperar + validar")
          TSEOF
          cat > apps/semilla/tests/test_sm6_eventos_red.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from apps.semilla.events.contracts import (make_event,
              SEMILLA_TALENT_DETECTED, is_valid_event)
          from apps.semilla.infrastructure.messaging.message_bus import SemillaMessageBus
          from apps.semilla.services.semilla_bridge import SemillaBridge

          def test_catalogo_eventos_semilla() -> None:
              assert is_valid_event(SEMILLA_TALENT_DETECTED)
              ev = make_event(SEMILLA_TALENT_DETECTED,
                  student_id="STU-1",
                  payload={"category": "MATEMATICAS"})
              assert ev["event"] == SEMILLA_TALENT_DETECTED
              assert ev["source"] == "semilla"
              with pytest.raises(ValueError):
                  make_event("EVENTO_FALSO")
              print("OK catalogo: eventos SEMILLA_* validados")

          def test_bus_publish_drain() -> None:
              bus = SemillaMessageBus(clock=FrozenClock())
              ev = make_event(SEMILLA_TALENT_DETECTED,
                  student_id="STU-2")
              r = bus.publish(ev)
              assert r["buffered"] is True
              assert r["delivered_to_network"] is False
              assert bus.pending() == 1
              taken = bus.drain()
              assert len(taken) == 1 and bus.pending() == 0
              print("OK bus: publish/drain/pending (degradacion honesta)")

          def test_bridge_sin_link_honesto() -> None:
              br = SemillaBridge(clock=FrozenClock())
              st = br.status()
              assert st["link_available"] is False
              r = br.emit("SEMILLA_TALENT_DETECTED",
                  student_id="STU-3",
                  payload={"category": "ARTE"})
              assert r["buffered"] is True
              f = br.feed_talent(student_id="STU-3",
                  category="ARTE", detail="dibujo avanzado")
              assert f["network_history"] is False
              print("OK bridge sin link: buffer honesto, nunca falso OK")

          def test_bridge_con_link_real() -> None:
              llamadas = []
              class FakeLink:
                  def record_milestone(self, student_id, kind,
                                       detail):
                      llamadas.append((student_id, kind, detail))
                      return {"ok": True}
              br = SemillaBridge(semilla_link=FakeLink(),
                  clock=FrozenClock())
              f = br.feed_talent(student_id="STU-4",
                  category="MATEMATICAS",
                  detail="olimpiada nacional")
              assert f["network_history"] is True
              assert llamadas[0][1] == "talento"
              f2 = br.feed_certification(student_id="STU-4",
                  title="Bachillerato", detail="promedio 9")
              assert f2["network_history"] is True
              assert llamadas[1][1] == "certificacion"
              assert len(br.drain_events()) == 2
              print("OK bridge con link: talento/certificacion -> historial de la Red")

          def test_bridge_status() -> None:
              br = SemillaBridge(clock=FrozenClock())
              st = br.status()
              assert "events_pending" in st
              assert "link_available" in st
              print("OK bridge status: observabilidad")
