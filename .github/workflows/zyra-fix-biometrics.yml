name: "ZYRA AUDIT 3 (indice snapshots)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Estado del repo
        run: |
          echo "=== ULTIMOS 10 COMMITS ==="
          git --no-pager log --oneline -10 || true
          echo ""
          echo "=== SIN COMMIT ==="
          git status --short || true
          exit 0

      - name: Estado de los 4 fixes anteriores
        run: |
          echo "=== FIX-1 CORE_PREFIXES (esperado: verify-existence) ==="
          grep -nF '"verify-existence",' shared_engines/runtime/combined_api.py || echo "NO APLICADO"
          echo "=== FIX-2 semillas death (esperado: selfie == doc) ==="
          grep -nF '"selfie_image_b64": "cGVkcm8tZG9j"' shared_engines/runtime/tests/test_runtime_api.py || echo "NO APLICADO"
          echo "=== FIX-3 semillas verdict (esperado: docimg = selfie) ==="
          grep -nF 'docimg = selfie' shared_engines/runtime/tests/test_capabilities_api.py || echo "NO APLICADO"
          echo "=== FIX-4 schema expediente (esperado: bootstrap_root) ==="
          grep -nF 'kernel.bootstrap_root()' shared_engines/network/tests/test_portable_identity.py || echo "NO APLICADO"

      - name: Los 4 tests anteriores (estado actual)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          t() {
            echo ""
            echo "##### $1"
            timeout 120 python3 -m pytest "$1" -q --tb=line 2>&1 | tail -8 || true
          }
          t "shared_engines/runtime/tests/test_runtime_api.py::test_verify_existence_public" || true
          t "shared_engines/runtime/tests/test_runtime_api.py::test_death_lifecycle_deceased" || true
          t "shared_engines/runtime/tests/test_capabilities_api.py::test_verification_verdict_signed" || true
          t "shared_engines/network/tests/test_portable_identity.py::test_expediente_legal_pedro" || true
          exit 0

      - name: Motor - la zona decisiva (560-680 y 780-900)
        run: |
          E="shared_engines/integrations/engine.py"
          ver() {
            echo ""
            echo "##### $1 lineas $2-$3"
            awk -v a="$2" -v b="$3" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' "$1" || true
          }
          ver "$E" 560 680
          ver "$E" 780 900
          echo ""
          echo "=== TODOS LOS INSERT INTO DEL MOTOR ==="
          grep -n "INSERT INTO" "$E" || true
          echo ""
          echo "=== TODAS LAS MENCIONES DE source_snapshots EN EL REPO ==="
          grep -rn "source_snapshots" shared_engines --include='*.py' || true
          echo ""
          echo "=== FLUSH/BUFFER ==="
          grep -n "flush" "$E" || echo "sin flush"
          exit 0

      - name: Tests de calibracion (145-270)
        run: |
          T="shared_engines/integrations/tests/test_integrations.py"
          awk 'NR>=145 && NR<=270 {printf "%5d| %s\n", NR, $0}' "$T" || true
          exit 0

      - name: Run del archivo (confirmacion)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          timeout 120 python3 -m pytest shared_engines/integrations/tests/test_integrations.py -q --tb=line 2>&1 | tail -15 || true
          exit 0
