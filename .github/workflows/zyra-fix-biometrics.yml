                  "from apps.laboratorio.infrastructure.repositories.comparison_repository import ComparisonRepository\n"
                  "from apps.laboratorio.infrastructure.repositories.optimization_repository import OptimizationRepository\n"
              )
              c2 = c2.replace(a_imp, nuevos_imp + a_imp)
              a_reg = '    c.obtener("suscriptor_zyra")'
              assert a_reg in c2, "ancla registro ausente"
              nuevos_reg = (
                  '    c.registrar("simulation_store", lambda _c: SimulationStore(conexion))\n'
                  '    c.registrar("comparison_store", lambda _c: ComparisonStore(conexion))\n'
                  '    c.registrar("optimization_store", lambda _c: OptimizationStore(conexion))\n'
                  '    c.registrar("repo_simulaciones", lambda _c: SimulationRepository(_c.obtener("simulation_store")))\n'
