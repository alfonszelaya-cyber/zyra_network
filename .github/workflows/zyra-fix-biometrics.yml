      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Verificacion completa (glTF GLB Monte Carlo y montaje)
        run: |
          python - <<'PYEOF'
          import ast, importlib, json, os, struct, sys, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append
          A("# Lote glTF 2.0 + GLB + Monte Carlo — resultado\n")

          archivos = [
              "apps/laboratorio/infrastructure/providers/monte_carlo_engine.py",
              "apps/laboratorio/infrastructure/providers/generation_engine.py",
              "apps/laboratorio/routers/api/decisions.py",
              "apps/laboratorio/registry/services/service_registry.py",
          ]
          for ruta in archivos:
              try:
                  ast.parse(Path(ruta).read_text(encoding="utf-8", errors="replace"))
                  A("- sintaxis OK: " + ruta)
              except SyntaxError as e:
                  A("- sintaxis FALLO: " + ruta + " -> " + str(e))
                  if summary:
                      with open(summary, "a") as fh:
                          fh.write("\n".join(L) + "\n")
                  sys.exit(1)
          A("")

          class _EscenaPrueba:
              nombre = "prueba-glTF"
              ancho = 200
              alto = 150
              es_renderizable = True
              objetos = [
                  {"forma": "rect", "x": 10, "y": 20, "w": 80, "h": 50, "color": "#3B82F6", "capa": "fondo"},
                  {"forma": "circle", "cx": 140, "cy": 75, "r": 30, "color": "#F59E0B", "capa": "medio"},
                  {"forma": "texto", "x": 15, "y": 110, "contenido": "ZYRA", "color": "#E2E8F0", "capa": "frente"},
              ]

          A("## 1. glTF 2.0 JSON real")
          A("```")
          try:
              from apps.laboratorio.infrastructure.providers.generation_engine import MotorGeneracionReal

              motor = MotorGeneracionReal()
              datos = motor.generar(_EscenaPrueba(), "modelo")
              gltf = json.loads(datos.decode("utf-8"))
              A("asset.version: " + str(gltf["asset"]["version"]))
              if gltf["asset"]["version"] != "2.0":
                  A("FALLO: version glTF incorrecta")
                  sys.exit(1)
              A("meshes: " + str(len(gltf["meshes"])) + " (rect + circle, texto excluido declarado)")
              if len(gltf["meshes"]) != 2:
                  A("FALLO: se esperaban 2 mallas")
                  sys.exit(1)
              A("nodes: " + str(len(gltf["nodes"])) + " · accessors: " + str(len(gltf["accessors"])) + " · bufferViews: " + str(len(gltf["bufferViews"])))
              A("materials: " + str(len(gltf["materials"])) + " · textos declarados en extras: " + str(len(gltf["extras"]["objetos_texto"])))
              for acc in gltf["accessors"]:
                  if acc["type"] == "VEC3":
                      if len(acc["min"]) != 3 or len(acc["max"]) != 3:
                          A("FALLO: accessor POSITION sin min/max de 3")
                          sys.exit(1)
              if "uri" not in gltf["buffers"][0] or not gltf["buffers"][0]["uri"].startswith("data:application/octet-stream;base64,"):
                  A("FALLO: buffer embebido ausente")
                  sys.exit(1)
              A("buffer embebido base64: OK · byteLength: " + str(gltf["buffers"][0]["byteLength"]))
              A("glTF 2.0 JSON REAL CORRECTO")
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-1800:])
              sys.exit(1)
          A("```")
          A("")

          A("## 2. GLB binario real")
          A("```")
          try:
              glb = motor.generar(_EscenaPrueba(), "modelo_glb")
              magico, version, total = struct.unpack("<III", glb[:12])
              A("magic: " + hex(magico) + " version: " + str(version) + " total: " + str(total))
              if magico != 0x46546C67 or version != 2 or total != len(glb):
                  A("FALLO: cabecera GLB invalida")
                  sys.exit(1)
              largo_json, tipo_json = struct.unpack("<II", glb[12:20])
              if tipo_json != 0x4E4F534A:
                  A("FALLO: chunk JSON invalido")
                  sys.exit(1)
              gltf2 = json.loads(glb[20:20 + largo_json].decode("utf-8"))
              base = 20 + largo_json
              largo_bin, tipo_bin = struct.unpack("<II", glb[base:base + 8])
              if tipo_bin != 0x004E4942:
                  A("FALLO: chunk BIN invalido")
                  sys.exit(1)
              bin_data = glb[base + 8:base + 8 + largo_bin]
              A("chunk JSON: " + str(largo_json) + " bytes · chunk BIN: " + str(largo_bin) + " bytes")
              if largo_bin < gltf2["buffers"][0]["byteLength"]:
                  A("FALLO: BIN menor que buffer declarado")
                  sys.exit(1)
              if len(gltf2["meshes"]) != 2:
                  A("FALLO: mallas GLB incorrectas")
                  sys.exit(1)
              A("GLB BINARIO REAL CORRECTO (abrible en Blender/three.js)")
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-1800:])
              sys.exit(1)
          A("```")
          A("")

          A("## 3. Monte Carlo real (reproducible y con IC95)")
          A("```")
          try:
              from apps.laboratorio.infrastructure.providers.monte_carlo_engine import MotorMonteCarlo

              mc = MotorMonteCarlo()
              config = {
                  "variables": {
                      "costo": {"dist": "normal", "media": 45.0, "desv": 8.0},
                      "beneficio": {"dist": "uniforme", "minimo": 55.0, "maximo": 90.0},
                      "riesgo": {"dist": "triangular", "minimo": 10.0, "modo": 30.0, "maximo": 70.0},
                  },
                  "corridas": 5000,
                  "semilla": 42,
                  "umbral": 55.0,
              }
              r1 = mc.simular(config)
              r2 = mc.simular(config)
              A("n=" + str(r1["n"]) + " media=" + str(r1["media"]) + " p50=" + str(r1["p50"]))
              if r1 != r2:
                  A("FALLO: misma semilla dio resultados distintos")
                  sys.exit(1)
              A("reproducibilidad con semilla: OK")
              if not (r1["p5"] <= r1["p25"] <= r1["p50"] <= r1["p75"] <= r1["p95"]):
                  A("FALLO: percentiles desordenados")
                  sys.exit(1)
              A("percentiles ordenados: OK")
              lo, hi = r1["ic95"]
              if not (lo <= r1["media"] <= hi):
                  A("FALLO: media fuera de su IC95")
                  sys.exit(1)
              A("IC95 contiene la media: OK " + str(r1["ic95"]))
              A("prob_alcanza_umbral: " + str(r1["prob_alcanza_umbral"]) + " · acotados: " + str(r1["valores_acotados"]))
              A("convergencia (10 lotes): " + str(r1["convergencia"]))
              if len(r1["convergencia"]) != 10:
                  A("FALLO: convergencia incompleta")
                  sys.exit(1)
              comp = mc.comparar([
                  {"nombre": "optimista", "variables": config["variables"], "corridas": 2000, "semilla": 7},
                  {"nombre": "pesimista", "variables": {
                      "costo": {"dist": "normal", "media": 70.0, "desv": 5.0},
                      "beneficio": {"dist": "uniforme", "minimo": 30.0, "maximo": 55.0},
                      "riesgo": {"dist": "triangular", "minimo": 40.0, "modo": 60.0, "maximo": 90.0},
                  }, "corridas": 2000, "semilla": 7},
              ])
              A("comparar ganador: " + comp["ganador"] + " brecha: " + str(comp["brecha"]))
              if comp["ganador"] != "optimista":
                  A("FALLO: ranking inesperado")
                  sys.exit(1)
              try:
                  mc.simular({"variables": {"costo": {"dist": "cuantica"}}})
                  A("FALLO: distribucion invalida debia rechazarse")
                  sys.exit(1)
              except ValueError:
                  A("distribucion invalida rechazada: OK")
              A("MONTE CARLO REAL CORRECTO")
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-1800:])
              sys.exit(1)
          A("```")
          A("")

          A("## 4. Montaje completo (17 motores y 72 rutas)")
          A("```")
          try:
              mod = importlib.import_module(
                  "apps.laboratorio.registry.services.service_registry"
              )
              c = mod.construir_contenedor(":memory:")
              salud = c.obtener("estado_salud").estado()
              appmod = importlib.import_module(
                  "apps.laboratorio.infrastructure.api.app"
              )
              app = appmod.montar_aplicacion(":memory:")
              rutas = app.listar_rutas()
              A("health motores: " + str(salud["motores_total"]) + " total / " + str(salud["motores_disponibles"]) + " disponibles")
              A("rutas montadas: " + str(len(rutas)))
              ok = True
              if salud.get("motores_total") != 17:
                  A("FALLO: motores != 17")
                  ok = False
              if salud.get("motores_disponibles") != 17:
                  A("FALLO: disponibles != 17")
                  ok = False
              if len(rutas) != 72:
                  A("FALLO: rutas != 72")
                  ok = False
              monte_rutas = [r for r in rutas if "monte-carlo" in str(r.get("patron", ""))]
              if len(monte_rutas) != 2:
                  A("FALLO: rutas monte-carlo ausentes")
                  ok = False
              if ok:
                  A("MONTAJE COMPLETO CORRECTO")
              else:
                  sys.exit(1)
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-1800:])
              sys.exit(1)
          A("```")

          md = "\n".join(L)
          if summary:
              with open(summary, "a") as fh:
                  fh.write(md + "\n")
          print(md)
          PYEOF

