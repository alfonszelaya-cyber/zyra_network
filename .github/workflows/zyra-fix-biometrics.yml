name: "ZYRA NEXO NG7+NG8 dominios de servicio + seguridad e identidad"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] NG7a customer service adaptadores + notificaciones"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          CS = "apps/nexo/domain/customer_service"
          UCC = "apps/nexo/application/customer_service_use_cases"
          NO = "apps/nexo/domain/notifications"
          UCN = "apps/nexo/application/notifications_use_cases"

          forzar(CS + "/ticket_engine.py", D(r'''
              """Nexo Ticket Engine - adaptador fino (regla 69).
              La persistencia vive en el SupportEngine transversal
              (shared_engines.support). Este adaptador fija app_id
              = nexo y expone las operaciones de tickets."""
              from __future__ import annotations
              from typing import List, Optional

              class NexoTicketEngine:
                  """Tickets de NEXO via motor transversal."""

                  def __init__(self, support_engine,
                               app_id="nexo"):
                      self._support = support_engine
                      self._app = app_id

                  @property
                  def mode(self) -> str:
                      return "transversal_support"

                  def open_ticket(self, *, title,
                                  description="",
                                  client_id="",
                                  priority="NORMAL") -> dict:
                      if not str(title).strip():
                          raise ValueError(
                              "titulo requerido")
                      return self._support.create_ticket(
                          app_id=self._app, title=title,
                          description=description,
                          client_id=client_id,
                          priority=priority)

                  def get(self, ticket_id) -> Optional[dict]:
                      return self._support.get_ticket(
                          ticket_id)

                  def assign(self, *, ticket_id,
                             agent_id) -> dict:
                      return self._support.assign_ticket(
                          ticket_id=ticket_id,
                          agent_id=agent_id)

                  def resolve(self, *, ticket_id,
                              resolution) -> dict:
                      return self._support.resolve_ticket(
                          ticket_id=ticket_id,
                          resolution=resolution)

                  def close(self, ticket_id) -> dict:
                      return self._support.close_ticket(
                          ticket_id)

                  def open_tickets(self) -> List[dict]:
                      return self._support.get_open_tickets(
                          self._app)

                  def all_tickets(self) -> List[dict]:
                      return self._support.get_tickets_by_app(
                          self._app)
          '''))

          forzar(CS + "/escalation_engine.py", D(r'''
              """Nexo Escalation Engine - adaptador de escalamiento
              cross-app desde NEXO (Modulo 10 del viejo diseno)."""
              from __future__ import annotations
              from typing import List

              class NexoEscalationEngine:
                  """Escalamientos NEXO -> otras apps."""

                  def __init__(self, support_engine,
                               app_id="nexo"):
                      self._support = support_engine
                      self._app = app_id

                  def escalate(self, *, ticket_id, to_app,
                               level="HIGH",
                               reason="") -> dict:
                      return self._support.escalate_ticket(
                          ticket_id=ticket_id, to_app=to_app,
                          level=level, reason=reason)

                  def open_escalated(self) -> List[dict]:
                      return [t for t in
                              self._support.get_open_tickets(
                                  self._app)
                              if t["status"] == "ESCALATED"]
          '''))

          forzar(CS + "/satisfaction_engine.py", D(r'''
              """Nexo Satisfaction Engine - adaptador de
              satisfaccion y feedback (delega al transversal)."""
              from __future__ import annotations

              class NexoSatisfactionEngine:
                  """Satisfaccion de clientes NEXO."""

                  def __init__(self, support_engine,
                               app_id="nexo"):
                      self._support = support_engine
                      self._app = app_id

                  def register(self, *, ticket_id, client_id,
                               score,
                               comments="") -> dict:
                      if score < 1 or score > 10:
                          raise ValueError(
                              "score entre 1 y 10")
                      return self._support.register_feedback(
                          ticket_id=ticket_id,
                          client_id=client_id, score=score,
                          comments=comments)

                  def average(self) -> dict:
                      return self._support.average_satisfaction(
                          self._app)
          '''))

          forzar(CS + "/service_history_engine.py", D(r'''
              """Nexo Service History Engine - historial de
              servicio NEXO: distribucion de estados y recientes
              (lee del transversal)."""
              from __future__ import annotations
              from typing import Dict, List

              class NexoServiceHistoryEngine:
                  """Historial y distribucion de tickets."""

                  def __init__(self, support_engine,
                               app_id="nexo"):
                      self._support = support_engine
                      self._app = app_id

                  def status_distribution(self) -> Dict[str, int]:
                      tickets = self._support.get_tickets_by_app(
                          self._app)
                      dist = {}
                      for t in tickets:
                          st = t["status"]
                          dist[st] = dist.get(st, 0) + 1
                      return dist

                  def recent(self, limit=20) -> List[dict]:
                      return self._support.get_tickets_by_app(
                          self._app)[:limit]

                  def ticket_history(self,
                                     ticket_id) -> dict:
                      t = self._support.get_ticket(ticket_id)
                      if not t:
                          return {"found": False}
                      return {"found": True,
                              "ticket": t,
                              "age_status":
                                  t["status"]}
          '''))

          forzar(CS + "/support_case_engine.py", D(r'''
              """Nexo Support Case Engine - casos transversales
              que incluyen NEXO (delega al transversal)."""
              from __future__ import annotations

              class NexoSupportCaseEngine:
                  """Casos cross-app con NEXO incluido."""

                  def __init__(self, support_engine,
                               app_id="nexo"):
                      self._support = support_engine
                      self._app = app_id

                  def open_case(self, *, apps_involved, title,
                                case_data=None) -> dict:
                      apps = [self._app] + [a for a in
                              apps_involved
                              if a != self._app]
                      return (self._support.
                              create_cross_app_case(
                                  apps_involved=apps,
                                  title=title,
                                  case_data=case_data))
          '''))

          forzar(CS + "/customer_feedback_engine.py", D(r'''
              """Nexo Feedback Engine - feedback de clientes NEXO
              con resumen (delega al transversal)."""
              from __future__ import annotations

              class NexoFeedbackEngine:
                  """Feedback NEXO + resumen agregado."""

                  def __init__(self, support_engine,
                               app_id="nexo"):
                      self._support = support_engine
                      self._app = app_id

                  def register(self, *, ticket_id, client_id,
                               score, comments="") -> dict:
                      return self._support.register_feedback(
                          ticket_id=ticket_id,
                          client_id=client_id, score=score,
                          comments=comments)

                  def summary(self) -> dict:
                      avg = (self._support.
                             average_satisfaction(
                                 self._app))
                      tickets = (self._support.
                                 get_tickets_by_app(
                                     self._app))
                      return {"tickets": len(tickets),
                              "satisfaction": avg}
          '''))

          forzar(CS + "/customer_service_engine.py", D(r'''
              """Nexo Customer Service Engine - fachada que compone
              los adaptadores NEXO sobre el SupportEngine
              transversal (regla 69: un solo motor, cero duplicar)."""
              from __future__ import annotations
              from apps.nexo.domain.customer_service.ticket_engine import (
                  NexoTicketEngine)
              from apps.nexo.domain.customer_service.escalation_engine import (
                  NexoEscalationEngine)
              from apps.nexo.domain.customer_service.satisfaction_engine import (
                  NexoSatisfactionEngine)
              from apps.nexo.domain.customer_service.support_case_engine import (
                  NexoSupportCaseEngine)
              from apps.nexo.domain.customer_service.service_history_engine import (
                  NexoServiceHistoryEngine)

              class NexoCustomerServiceEngine:
                  """Fachada de atencion al cliente NEXO."""

                  def __init__(self, support_engine,
                               app_id="nexo"):
                      self._support = support_engine
                      self.tickets = NexoTicketEngine(
                          support_engine, app_id)
                      self.escalations = NexoEscalationEngine(
                          support_engine, app_id)
                      self.satisfaction = NexoSatisfactionEngine(
                          support_engine, app_id)
                      self.cases = NexoSupportCaseEngine(
                          support_engine, app_id)
                      self.history = NexoServiceHistoryEngine(
                          support_engine, app_id)

                  def service_report(self) -> dict:
                      dist = self.history.status_distribution()
                      return {"report_type":
                                  "NEXO_SERVICE_REPORT",
                              "tickets_total":
                                  sum(dist.values()),
                              "status_distribution": dist,
                              "open_tickets":
                                  len(self.tickets.open_tickets()),
                              "satisfaction":
                                  self.satisfaction.average()}
          '''))

          forzar(UCC + "/create_ticket_use_case.py", D(r'''
              from __future__ import annotations

              class CreateTicketUseCase:
                  """Crea ticket con validacion de titulo."""

                  def __init__(self, ticket_engine):
                      self._eng = ticket_engine

                  def execute(self, *, title, description="",
                              client_id="",
                              priority="NORMAL") -> dict:
                      return self._eng.open_ticket(
                          title=title, description=description,
                          client_id=client_id,
                          priority=priority)
          '''))

          forzar(UCC + "/assign_ticket_use_case.py", D(r'''
              from __future__ import annotations

              class AssignTicketUseCase:
                  """Asigna agente a un ticket."""

                  def __init__(self, ticket_engine):
                      self._eng = ticket_engine

                  def execute(self, *, ticket_id,
                              agent_id) -> dict:
                      t = self._eng.get(ticket_id)
                      if not t:
                          raise KeyError(ticket_id)
                      return self._eng.assign(
                          ticket_id=ticket_id,
                          agent_id=agent_id)
          '''))

          forzar(UCC + "/close_ticket_use_case.py", D(r'''
              from __future__ import annotations

              class CloseTicketUseCase:
                  """Resuelve con nota y cierra el ticket."""

                  def __init__(self, ticket_engine):
                      self._eng = ticket_engine

                  def execute(self, *, ticket_id,
                              resolution) -> dict:
                      if not str(resolution).strip():
                          raise ValueError(
                              "resolution requerida")
                      self._eng.resolve(ticket_id=ticket_id,
                          resolution=resolution)
                      return self._eng.close(ticket_id)
          '''))

          forzar(UCC + "/escalate_ticket_use_case.py", D(r'''
              from __future__ import annotations

              class EscalateTicketUseCase:
                  """Escala ticket NEXO a otra app."""

                  def __init__(self, escalation_engine):
                      self._eng = escalation_engine

                  def execute(self, *, ticket_id, to_app,
                              level="HIGH",
                              reason="") -> dict:
                      return self._eng.escalate(
                          ticket_id=ticket_id, to_app=to_app,
                          level=level, reason=reason)
          '''))

          forzar(UCC + "/register_feedback_use_case.py", D(r'''
              from __future__ import annotations

              class RegisterFeedbackUseCase:
                  """Registra feedback con validacion 1-10."""

                  def __init__(self, satisfaction_engine):
                      self._eng = satisfaction_engine

                  def execute(self, *, ticket_id, client_id,
                              score, comments="") -> dict:
                      return self._eng.register(
                          ticket_id=ticket_id,
                          client_id=client_id, score=score,
                          comments=comments)
          '''))

          forzar(UCC + "/calculate_satisfaction_use_case.py", D(r'''
              from __future__ import annotations

              class CalculateSatisfactionUseCase:
                  """Calcula satisfaccion promedio NEXO."""

                  def __init__(self, satisfaction_engine):
                      self._eng = satisfaction_engine

                  def execute(self) -> dict:
                      return self._eng.average()
          '''))

          forzar(UCC + "/generate_service_report_use_case.py", D(r'''
              from __future__ import annotations

              class GenerateServiceReportUseCase:
                  """Reporte de servicio: distribucion + apertura +
                  satisfaccion (repara el reporte del viejo que
                  apuntaba a engines inexistentes)."""

                  def __init__(self, cs_facade):
                      self._cs = cs_facade

                  def execute(self) -> dict:
                      return self._cs.service_report()
          '''))

          forzar(NO + "/notification_engine.py", D(r'''
              """Nexo Notification Engine - notificaciones NEXO
              (persistente). Cola PENDING -> SENT/FAILED con
              reintentos. Canal por adaptador inyectado
              (duck-typing: Brevo/FCM de integrations); sin
              adaptador -> not_configured honesto."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_notifications", (
                      "CREATE TABLE IF NOT EXISTS nexo_notifications (notification_id TEXT PRIMARY KEY, company_id TEXT NOT NULL DEFAULT '', channel TEXT NOT NULL DEFAULT 'in_app', recipient TEXT NOT NULL, subject TEXT NOT NULL, body TEXT NOT NULL DEFAULT '', status TEXT NOT NULL DEFAULT 'PENDING', attempts INTEGER NOT NULL DEFAULT 0, error TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL, sent_at REAL)",
                  )),
              )

              class NexoNotificationEngine:
                  """Notificaciones NEXO (cola persistente)."""

                  def __init__(self, db, clock, channel=None):
                      self._db = db
                      self._clock = clock
                      self._channel = channel
                      MigrationRunner(db, "nexo.notify",
                                      _MIGRATIONS).run(clock)

                  def create_notification(self, *, recipient,
                                          subject, body="",
                                          channel="in_app",
                                          company_id="") -> dict:
                      if not str(recipient).strip():
                          raise ValueError(
                              "recipient requerido")
                      if not str(subject).strip():
                          raise ValueError(
                              "subject requerido")
                      nid = "NTF-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_notifications"
                              " (notification_id, company_id,"
                              " channel, recipient, subject, body,"
                              " status, attempts, error,"
                              " created_at, sent_at)"
                              " VALUES (?, ?, ?, ?, ?, ?,"
                              " 'PENDING', 0, '', ?, NULL)",
                              (nid, company_id, channel,
                               recipient, subject, body, now))
                      return self.get(nid)

                  def get(self, notification_id) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM nexo_notifications"
                          " WHERE notification_id = ?",
                          (notification_id,))
                      if not row:
                          return None
                      return {"notification_id":
                                  str(row["notification_id"]),
                              "company_id":
                                  str(row["company_id"]),
                              "channel": str(row["channel"]),
                              "recipient": str(row["recipient"]),
                              "subject": str(row["subject"]),
                              "body": str(row["body"]),
                              "status": str(row["status"]),
                              "attempts": int(row["attempts"]),
                              "error": str(row["error"]),
                              "created_at":
                                  float(row["created_at"]),
                              "sent_at": (float(row["sent_at"])
                                          if row["sent_at"]
                                          else None)}

                  def pending(self, limit=50) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT notification_id FROM"
                          " nexo_notifications WHERE"
                          " status = 'PENDING'"
                          " ORDER BY created_at LIMIT ?",
                          (limit,))
                      return [self.get(str(r["notification_id"]))
                              for r in rows]

                  def _send_channel(self, n) -> dict:
                      if self._channel is None:
                          return {"ok": False,
                                  "error": "not_configured"}
                      for name in ("send", "notify", "push"):
                          m = getattr(self._channel, name, None)
                          if callable(m):
                              try:
                                  r = m(recipient=n["recipient"],
                                        subject=n["subject"],
                                        body=n["body"])
                                  return {"ok": True,
                                          "result": (r if
                                                     isinstance(r, dict)
                                                     else
                                                     {"raw": str(r)})}
                              except TypeError:
                                  continue
                              except Exception as e:
                                  return {"ok": False,
                                          "error": str(e)[:200]}
                      return {"ok": False,
                              "error": "canal sin metodo send"}

                  def dispatch(self, notification_id) -> dict:
                      n = self.get(notification_id)
                      if not n:
                          raise KeyError(notification_id)
                      if n["status"] == "SENT":
                          return n
                      r = self._send_channel(n)
                      now = self._clock.now()
                      if r["ok"]:
                          self._db.execute(
                              "UPDATE nexo_notifications SET"
                              " status = 'SENT', sent_at = ?,"
                              " attempts = attempts + 1 WHERE"
                              " notification_id = ?",
                              (now, notification_id))
                      else:
                          self._db.execute(
                              "UPDATE nexo_notifications SET"
                              " status = 'FAILED', error = ?,"
                              " attempts = attempts + 1 WHERE"
                              " notification_id = ?",
                              (r.get("error", ""),
                               notification_id))
                      return self.get(notification_id)

                  def retry_failed(self) -> int:
                      rows = self._db.query_all(
                          "SELECT notification_id FROM"
                          " nexo_notifications WHERE"
                          " status = 'FAILED' LIMIT 50")
                      count = 0
                      for r in rows:
                          got = self.get(
                              str(r["notification_id"]))
                          self._db.execute(
                              "UPDATE nexo_notifications SET"
                              " status = 'PENDING' WHERE"
                              " notification_id = ?",
                              (got["notification_id"],))
                          count = count + 1
                      return count
          '''))

          forzar(NO + "/notification_registry.py", D(r'''
              """Nexo Notification Registry - consultas agregadas."""
              from __future__ import annotations
              from typing import Dict
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database

              class NexoNotificationRegistry:
                  """Consultas agregadas de notificaciones."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock

                  def counts_by_status(self) -> Dict[str, int]:
                      rows = self._db.query_all(
                          "SELECT status, COUNT(*) AS c FROM"
                          " nexo_notifications GROUP BY status")
                      return {str(r["status"]): int(r["c"])
                              for r in rows}

                  def counts_by_channel(self) -> Dict[str, int]:
                      rows = self._db.query_all(
                          "SELECT channel, COUNT(*) AS c FROM"
                          " nexo_notifications GROUP BY channel")
                      return {str(r["channel"]): int(r["c"])
                              for r in rows}
          '''))

          forzar(UCN + "/create_notification_use_case.py", D(r'''
              from __future__ import annotations

              class CreateNotificationUseCase:
                  """Crea notificacion validada."""

                  def __init__(self, notification_engine):
                      self._eng = notification_engine

                  def execute(self, *, recipient, subject,
                              body="", channel="in_app",
                              company_id="") -> dict:
                      return self._eng.create_notification(
                          recipient=recipient, subject=subject,
                          body=body, channel=channel,
                          company_id=company_id)
          '''))

          forzar(UCN + "/dispatch_notification_use_case.py", D(r'''
              from __future__ import annotations

              class DispatchNotificationUseCase:
                  """Despacha una notificacion o todas las
                  pendientes. Resultado honesto si no hay canal."""

                  def __init__(self, notification_engine):
                      self._eng = notification_engine

                  def execute(self, *,
                              notification_id=None) -> dict:
                      if notification_id:
                          return {"dispatched":
                                      self._eng.dispatch(
                                          notification_id)}
                      pend = self._eng.pending()
                      results = []
                      for n in pend:
                          results.append(self._eng.dispatch(
                              n["notification_id"]))
                      sent = sum(1 for r in results
                                 if r["status"] == "SENT")
                      return {"processed": len(results),
                              "sent": sent,
                              "results": results}
          '''))

          out("## FIN NG7a: customer service + notificaciones")
          exit(0)
          PYEOF

      - name: "[ESCRITURA] NG7b search + workflow + reports + analytics + sync"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          SE = "apps/nexo/domain/search"
          WF = "apps/nexo/domain/workflow"
          RE = "apps/nexo/domain/reports"
          AN = "apps/nexo/domain/analytics"
          SY = "apps/nexo/domain/synchronization"
          URR = "apps/nexo/application/reports_use_cases"
          URA = "apps/nexo/application/analytics_use_cases"

          forzar(SE + "/search_engine.py", D(r'''
              """Nexo Search Engine - indice de busqueda interno
              (NG7). Indexa entidades NEXO y busca por terminos con
              puntaje. Persistente."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              ENTITY_TYPES = ("COMPANY", "OPERATION", "DOCUMENT",
                              "INVOICE", "PAYMENT", "TICKET",
                              "REPORT", "GENERAL")

              _MIGRATIONS = (
                  Migration(1, "nexo_search_index", (
                      "CREATE TABLE IF NOT EXISTS nexo_search_index (doc_id TEXT PRIMARY KEY, entity_type TEXT NOT NULL DEFAULT 'GENERAL', entity_ref TEXT NOT NULL, title TEXT NOT NULL, content TEXT NOT NULL DEFAULT '', company_id TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                  )),
              )

              class NexoSearchEngine:
                  """Indice y busqueda por terminos con puntaje."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.search",
                                      _MIGRATIONS).run(clock)

                  def index(self, *, entity_ref, title,
                            content="", entity_type="GENERAL",
                            company_id="") -> dict:
                      if entity_type not in ENTITY_TYPES:
                          entity_type = "GENERAL"
                      did = "IDX-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_search_index"
                              " (doc_id, entity_type, entity_ref,"
                              " title, content, company_id,"
                              " created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?)",
                              (did, entity_type, entity_ref,
                               title, content, company_id, now))
                      return {"doc_id": did,
                              "entity_type": entity_type,
                              "entity_ref": entity_ref,
                              "title": title}

