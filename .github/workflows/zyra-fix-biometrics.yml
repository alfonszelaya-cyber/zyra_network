                          return None
                      return {"account_id": str(row["account_id"]),
                              "company_id":
                                  str(row["company_id"]),
                              "account_name":
                                  str(row["account_name"]),
                              "account_kind":
                                  str(row["account_kind"]),
                              "currency": str(row["currency"]),
                              "balance": str(_D(
