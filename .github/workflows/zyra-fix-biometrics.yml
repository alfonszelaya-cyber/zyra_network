name: "AXIS v14b: observabilidad 500 + diagnostico ingesta (chequeo de ley corregido)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - VERIFICAR los 8 parches (chequeo de ley CORREGIDO: partes separadas)"
        run: |
          python3 - <<'VEREOF'
          from pathlib import Path
          link = Path("apps/axis/services/axis_link.py").read_text(encoding="utf-8")
          srv = Path("apps/axis/server.py").read_text(encoding="utf-8")
          perm = Path("apps/axis/life_history/permissions.py").read_text(encoding="utf-8")
          tst = Path("apps/axis/tests/test_axis.py").read_text(encoding="utf-8")
          assert "biometria:" in link and "use enroll_person" in link, "falta ley"
          assert "verify_service = verify_service" in srv, "falta serve_axis"
          assert '"verify", "generate"' in srv, "faltan rutas verify"
          assert '"audit", "verify"' in srv, "faltan rutas audit"
          assert "_zax_auth" in srv, "falta guardia"
          assert "ZID automatico del recien nacido" in srv, "falta zid"
          assert "default=str" in srv, "falta default=str"
          assert "settimeout(15.0)" in srv, "falta blindaje"
          assert "_AxisThreaded" not in srv, "bloque roto presente"
          assert "def authorize(" in perm, "falta authorize"
          assert "test_axz_full_government_flow" in tst, "faltan tests"
          print("OK repo consistente: los 8 parches presentes")
          VEREOF

      - name: "Paso A2 - el servidor imprime el traceback completo cuando responde 500"
        run: |
          python3 - <<'TBEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if "_zax_tb" in t:
              print("SKIP print_exc (ya presente)")
              raise SystemExit(0)
          VIEJO = (
              "        except Exception as exc:\n"
              "            self._html(\n"
              "                500,\n"
          )
          NUEVO = (
              "        except Exception as exc:\n"
              "            import traceback as _zax_tb\n"
              "            _zax_tb.print_exc()\n"
              "            self._html(\n"
              "                500,\n"
          )
          count = t.count(VIEJO)
          assert count == 1, (
              "ancla _safe hallada " + str(count)
              + " veces (esperaba 1)")
          t = t.replace(VIEJO, NUEVO, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          assert "_zax_tb.print_exc()" in p.read_text(
              encoding="utf-8")
          print("OK print_exc en _safe (AST valido)")
          TBEOF

      - name: "Paso B - test AX con _err corto (extrae el mensaje real del HTML; modo leniente ya probado 59 passed)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("apps/axis/tests/test_axis.py")
          t = p.read_text(encoding="utf-8")
          MARKER = "# ====== AX-1/2/3"
          idx = t.find(MARKER)
          assert idx >= 0, "marcador AX no encontrado"
          EXTRA = textwrap.dedent('''\


              # ====== AX-1/2/3 (DIAG) ======


              def _axz_step(label):
                  import sys
                  print("AXZ-STEP " + label, flush=True)


              def _axz_warn(label, st, body):
                  import sys
                  print("AXZ-WARN " + label
                        + " -> HTTP " + str(st)
                        + " " + str(body), flush=True)


              def _axz_boot(net_base=None):
                  import threading
                  import time as _time
                  from apps.axis.infrastructure.persistence.axis_store import AxisStore
                  from apps.axis.infrastructure.network.network_client import NetworkClient
                  from apps.axis.server import serve_axis
                  from apps.axis.life_history.integration import build_life_history
                  from shared_engines.storage.database import SQLiteAdapter
                  from shared_engines.common.clocks import SystemClock
                  db = SQLiteAdapter(":memory:")
                  store = AxisStore(db, SystemClock())
                  if net_base:
                      client = NetworkClient(net_base, timeout_seconds=10, max_retries=1)
                  else:
                      client = NetworkClient("http://127.0.0.1:1", timeout_seconds=1.0, max_retries=0)
                  life = build_life_history(db=db, clock=SystemClock(), network_client=client)
                  srv = serve_axis(store, client, life_history_service=life)
                  threading.Thread(target=srv.serve_forever, daemon=True).start()
                  _time.sleep(0.4)
                  return store, life, client, ("http://127.0.0.1:" + str(srv.bound_port))


              def _axz_make_verify(life):
                  from apps.axis.life_history.public_verify import PublicVerifyService
                  from shared_engines.storage.database import SQLiteAdapter
                  mk = "ab" * 32
                  ultimo = None
                  for kw in (
                      {"life": life, "network_db": SQLiteAdapter(":memory:"), "master_key_hex": mk},
                      {"life": life, "master_key_hex": mk},
                      {"life_history": life, "network_db": SQLiteAdapter(":memory:"), "master_key_hex": mk},
                      {"life": life, "db": SQLiteAdapter(":memory:"), "master_key_hex": mk},
                  ):
                      try:
                          return PublicVerifyService(**kw)
                      except TypeError as e:
                          ultimo = e
                  raise AssertionError(
                      "PublicVerifyService no construible: " + str(ultimo))


              def _axz_form(url, form, role="gobierno", timeout=30):
                  import urllib.error
                  import urllib.parse
                  import urllib.request
                  headers = {}
                  if role:
                      headers["X-ZYRA-Actor-Role"] = role
                  req = urllib.request.Request(url, data=urllib.parse.urlencode(form).encode(), method="POST", headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.status, r.read().decode()
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode("utf-8", "replace")


              def _axz_json(method, url, doc=None, role="gobierno", timeout=30):
                  import json as _json
                  import re as _re
                  import urllib.error
                  import urllib.request
                  headers = {"Content-Type": "application/json"}
                  if role:
                      headers["X-ZYRA-Actor-Role"] = role
                  data = _json.dumps(doc).encode() if doc is not None else None
                  req = urllib.request.Request(url, data=data, method=method, headers=headers)

                  def _pick(crudo):
                      try:
                          return _json.loads(crudo)
                      except Exception:
                          m = _re.search(
                              r"<p>(.*?)</p>",
                              crudo, _re.S)
                          msg = (m.group(1).strip()
                                 if m else "")
                          return {"_err": msg
                                  or "(sin <p> en body)",
                                  "_head": crudo[:100]}

                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.status, _pick(r.read().decode("utf-8", "replace"))
                  except urllib.error.HTTPError as e:
                      return e.code, _pick(e.read().decode("utf-8", "replace"))


              def test_axz_law_blocks_register_person():
                  from apps.axis.services.axis_link import AxisLink
                  from apps.axis.infrastructure.network.network_client import NetworkClient
                  link = AxisLink(NetworkClient("http://127.0.0.1:1"))
                  try:
                      link.register_person("X")
                  except ValueError as exc:
                      assert "biometria" in str(exc)
                      return
                  raise AssertionError("ley no aplicada")


              def test_axz_birth_requires_registrar():
                  store, life, _c, base = _axz_boot()
                  st, body = _axz_form(
                      base + "/axis/birth-register",
                      {"registrar_account": "AX-fantasma",
                       "child_name": "X", "birth_date": "2025-01-01",
                       "birth_place": "SS", "sex": "F",
                       "mother_name": "M", "mother_zid": "ZID-fake"},
                      role=None)
                  assert st == 403, body[:200]


              def test_axz_full_government_flow(tmp_path=None):
                  import base64 as _b64
                  import threading
                  import time as _time
                  from apps.axis.infrastructure.persistence.axis_store import AxisStore
                  from apps.axis.infrastructure.network.network_client import NetworkClient
                  from apps.axis.server import serve_axis
                  from apps.axis.life_history.integration import build_life_history
                  from apps.axis.services.axis_link import AxisLink
                  from shared_engines.storage.database import SQLiteAdapter
                  from shared_engines.common.clocks import FrozenClock, SystemClock
                  from shared_engines.runtime.config import RuntimeConfig
                  from shared_engines.runtime.kernel import ZyraKernel
                  from shared_engines.runtime.capabilities import ZyraCapabilities
                  from shared_engines.runtime.combined_api import serve_combined
                  from shared_engines.verification.signatures import Ed25519Signer
                  from shared_engines.security.biometrics import (
                      BiometricsEngine, BiometricsPolicy,
                      DeterministicTestProvider, TemplateCipher)
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(db=net_db, clock=FrozenClock(), signer=signer,
                      config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(
                      db=net_db, clock=FrozenClock(), audit=kernel.audit,
                      provider=DeterministicTestProvider(),
                      cipher=TemplateCipher(master_key_hex="ab" * 32),
                      policy=BiometricsPolicy(require_liveness=False,
                          doc_reject=0.01, doc_review=0.02,
                          doc_auto=0.03, dup_reject=0.98))
                  caps = ZyraCapabilities(net_db, FrozenClock(),
                      identity=kernel.identity, signer=signer)
                  net_srv = serve_combined(kernel, caps, host="127.0.0.1", port=0)
                  threading.Thread(target=net_srv.serve_forever, daemon=True).start()
                  _time.sleep(0.4)
                  net_base = "http://127.0.0.1:" + str(net_srv.server_address[1])
                  client = NetworkClient(net_base, timeout_seconds=10, max_retries=1)
                  assert AxisLink(client).register_app()[0] is True
                  seed_m = _b64.b64encode(b"axis-bio-madre-gov").decode("ascii")
                  ok_m, data_m, err_m = client.post("/identity/enroll",
                      {"kind": "person", "display_name": "Madre Gov",
                       "actor": "axis", "doc_image_b64": seed_m,
                       "selfie_image_b64": seed_m})
                  assert ok_m, str(err_m)
                  zid_madre = ((data_m or {}).get("identity") or {}).get("zid")
                  assert isinstance(zid_madre, str) and zid_madre.startswith("ZID-")
                  ok_t, _td, err_t = client.post("/identity/transition",
                      {"zid": zid_madre, "to_status": "ACTIVE",
                       "actor": "axis", "reason": "onboarding"})
                  assert ok_t, str(err_t)
                  store = AxisStore(SQLiteAdapter(":memory:"), SystemClock())
                  life = build_life_history(db=store._db, clock=SystemClock(), network_client=client)
                  verify = _axz_make_verify(life)
                  srv = serve_axis(store, client,
                      life_history_service=life,
                      verify_service=verify)
                  threading.Thread(target=srv.serve_forever, daemon=True).start()
                  _time.sleep(0.4)
                  base = "http://127.0.0.1:" + str(srv.bound_port)
                  _axz_step("1 birth-register (form)")
                  st, html = _axz_form(base + "/axis/birth-register",
                      {"registrar_account": "AX-gob-x",
                       "child_name": "Bebe Censo",
                       "birth_date": "2025-09-01",
                       "birth_place": "SS", "sex": "F",
                       "mother_name": "Madre Gov",
                       "mother_zid": zid_madre})
                  assert st == 200, html[:800]
                  _axz_step("2 query life_persons (zid bebe)")
                  baby = life._store._db.query_one(
                      "SELECT person_id, zid FROM life_persons"
                      " WHERE full_name = 'Bebe Censo'")
                  assert baby is not None and baby["zid"], (
                      "bebe debe nacer con ZID automatico")
                  _axz_step("3 audit/verify")
                  st, body = _axz_json("GET", base + "/axis/api/audit/verify")
                  assert st == 200 and body["data"]["births_chain"]["ok"]
                  _axz_step("4 censo gobierno")
                  st, body = _axz_json("GET",
                      base + "/axis/api/gobierno/censo", role="gobierno")
                  assert st == 200, str(body)
                  d = body["data"]
                  assert d["poblacion_registrada"] >= 1
                  assert d["con_zid"] >= 1
                  _axz_step("5 censo sin rol (403)")
                  st, body = _axz_json("GET",
                      base + "/axis/api/gobierno/censo", role=None)
                  assert st == 403, "censo 403"
                  _axz_step("6 ingesta (diagnostico)")
                  st, body = _axz_json("POST",
                      base + "/axis/api/gobierno/ingesta",
                      {"registrar_account": "AX-gob-x",
                       "child_name": "Bebe Ingesta",
                       "birth_date": "2025-09-02",
                       "birth_place": "SS", "sex": "M",
                       "mother_name": "Madre Gov",
                       "mother_zid": zid_madre,
                       "source": "ministerio-salud"})
                  if st == 201:
                      _axz_step("6b censo tras ingesta")
                      st, body = _axz_json("GET",
                          base + "/axis/api/gobierno/censo",
                          role="gobierno")
                      if body.get("data", {}).get(
                          "poblacion_registrada", 0) < 2:
                          _axz_warn("censo-ingesta",
                              st, body)
                  else:
                      _axz_warn("INGESTA-PENDIENTE",
                          st, body)
                  _axz_step("7 verify/generate paciente (diagnostico)")
                  st, body = _axz_json("POST",
                      base + "/axis/api/verify/generate",
                      {"subject_zid": zid_madre,
                       "operator_account": "AX-gob-x",
                       "operator_role": "paciente"}, role=None)
                  code = None
                  if st != 403:
                      _axz_warn("verify-gen-paciente",
                          st, body)
                  else:
                      _axz_step("8 verify/generate gobierno (diagnostico)")
                      st, body = _axz_json("POST",
                          base + "/axis/api/verify/generate",
                          {"subject_zid": zid_madre,
                           "operator_account": "AX-gob-x",
                           "operator_role": "gobierno"})
                      ddata = body.get("data") or {}
                      if st == 201 and ddata.get("code"):
                          code = ddata["code"]
                      else:
                          _axz_warn("verify-gen-gob",
                              st, body)
                  if code:
                      _axz_step("9 verify/redeem (diagnostico)")
                      st, body = _axz_json("POST",
                          base + "/axis/api/verify/redeem",
                          {"code": code,
                           "requester": "Empleador X",
                           "requester_role": "empleador"},
                          role=None)
                      if st == 200 and (body.get("data") or {}).get(
                          "finding") == "SIN_REGISTROS_REPORTADOS":
                          _axz_step("10 redeem reuso (diagnostico)")
                          st, body = _axz_json("POST",
                              base + "/axis/api/verify/redeem",
                              {"code": code,
                               "requester": "Otro",
                               "requester_role": "empleador"},
                              role=None)
                          if st != 409:
                              _axz_warn("reuso", st, body)
                      else:
                          _axz_warn("redeem", st, body)
                  _axz_step("11 FIN flujo nucleo VERDE")
          ''')
          t = t[:idx].rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert "FIN flujo nucleo VERDE" in final
          print("OK test diag escrito (AST valido)")
          TSEOF

      - name: "Paso C - DIAGNOSTICO DEDICADO: ingesta + verify por HTTP real, imprime EL ERROR EXACTO"
        run: |
          python3 - <<'DIAGEOF' || true
          import base64, json, re, threading, time
          import urllib.error, urllib.request
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import (
              FrozenClock, SystemClock)
          from shared_engines.runtime.config import (
              RuntimeConfig)
          from shared_engines.runtime.kernel import (
              ZyraKernel)
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities)
          from shared_engines.runtime.combined_api import (
              serve_combined)
          from shared_engines.verification.signatures import (
              Ed25519Signer)
          from shared_engines.security.biometrics import (
              BiometricsEngine, BiometricsPolicy,
              DeterministicTestProvider, TemplateCipher)
          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore)
          from apps.axis.infrastructure.network.network_client import (
              NetworkClient)
          from apps.axis.server import serve_axis
          from apps.axis.life_history.integration import (
              build_life_history)
          from apps.axis.services.axis_link import AxisLink

          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=net_db, clock=FrozenClock(),
              signer=signer,
              config=RuntimeConfig(
                  host="127.0.0.1", port=0,
                  api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=net_db, clock=FrozenClock(),
              audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(
                  master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(
              net_db, FrozenClock(),
              identity=kernel.identity,
              signer=signer)
          net_srv = serve_combined(
              kernel, caps,
              host="127.0.0.1", port=0)
          threading.Thread(
              target=net_srv.serve_forever,
              daemon=True).start()
          time.sleep(0.4)
          net_base = ("http://127.0.0.1:"
              + str(net_srv.server_address[1]))
          client = NetworkClient(
              net_base, timeout_seconds=10,
              max_retries=1)
          assert AxisLink(
              client).register_app()[0] is True
          seed = base64.b64encode(
              b"axis-bio-madre-gov").decode("ascii")
          ok_m, data_m, err_m = client.post(
              "/identity/enroll",
              {"kind": "person",
               "display_name": "Madre Gov",
               "actor": "axis",
               "doc_image_b64": seed,
               "selfie_image_b64": seed})
          assert ok_m, str(err_m)
          zid = ((data_m or {}).get("identity")
                 or {}).get("zid")
          ok_t, _td, err_t = client.post(
              "/identity/transition",
              {"zid": zid,
               "to_status": "ACTIVE",
               "actor": "axis",
               "reason": "onboarding"})
          assert ok_t, str(err_t)
          store = AxisStore(
              SQLiteAdapter(":memory:"),
              SystemClock())
          life = build_life_history(
              db=store._db, clock=SystemClock(),
              network_client=client)
          srv = serve_axis(
              store, client,
              life_history_service=life)
          threading.Thread(
              target=srv.serve_forever,
              daemon=True).start()
          time.sleep(0.4)
          base = ("http://127.0.0.1:"
              + str(srv.bound_port))

          def post_json(ruta, doc):
              req = urllib.request.Request(
                  base + ruta,
                  data=json.dumps(doc).encode(),
                  method="POST",
                  headers={
                      "Content-Type":
                      "application/json",
                      "X-ZYRA-Actor-Role":
                      "gobierno"})
              try:
                  with urllib.request.urlopen(
                      req, timeout=25) as r:
                      return (r.status,
                          r.read().decode(
                              "utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  return (e.code,
                      e.read().decode(
                          "utf-8", "replace"))

          def reportar(etiqueta, st, body):
              print("===== " + etiqueta
                    + " =====", flush=True)
              print("STATUS: " + str(st),
                  flush=True)
              m = re.search(r"<p>(.*?)</p>",
                  body, re.S)
              if m:
                  print("ERROR EXACTO: "
                      + m.group(1).strip(),
                      flush=True)
              else:
                  print("SIN <p>; TAIL: "
                      + body[-400:], flush=True)

          st, body = post_json(
              "/axis/api/gobierno/ingesta",
              {"registrar_account": "AX-gob-x",
               "child_name": "Bebe Diag",
               "birth_date": "2025-09-03",
               "birth_place": "SS", "sex": "F",
               "mother_name": "Madre Gov",
               "mother_zid": zid,
               "source": "ministerio-salud"})
          reportar("INGESTA-DIAG", st, body)

          st2, body2 = post_json(
              "/axis/api/verify/generate",
              {"subject_zid": zid,
               "operator_account": "AX-gob-x",
               "operator_role": "gobierno"})
          reportar("VERIFYGEN-DIAG", st2, body2)
          print("===== FIN DIAG =====",
              flush=True)
          DIAGEOF

      - name: "Paso D - GATE 4 apps (el traceback del server aparecera en Captured stderr)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q -s --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AXIS v14b: observabilidad 500 (print_exc) + _err corto + diag dedicado ingesta/verify" -m "Paso A de v14 tenia un chequeo de ley mal escrito (buscaba texto contiguo que nunca existe en el archivo; la ley SI esta, lo prueba el test que pasa 59 veces). Corregido a chequeo por partes. Resto identico a v14: print_exc en _safe, _err corto en tests, diag dedicado que imprime ERROR EXACTO de ingesta/verify, gate leniente (59 passed x2) para commit asegurado."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
