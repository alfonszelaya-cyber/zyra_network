          """Repositorio de solicitudes de red e indicadores."""
          from datetime import datetime

          from apps.laboratorio.domain.contract import SolicitudRed
          from apps.laboratorio.domain.indicator import IndicadorNacional
          from apps.laboratorio.shared.exceptions.domain_errors import EntidadNoEncontradaError
          from apps.laboratorio.shared.models.identifiers import id_desde_texto


          def _solicitud_desde_dict(d: dict) -> SolicitudRed:
              sol = SolicitudRed(
                  id=id_desde_texto("sol", d["id"]),
                  app_destino=d["app_destino"],
                  contrato=d["contrato"],
                  solicitante_zid=d["solicitante_zid"],
                  estado=d["estado"],
                  respuesta=d["respuesta"],
              )
              sol.creado_en = datetime.fromisoformat(d["creado_en"])
              sol.actualizado_en = datetime.fromisoformat(d["actualizado_en"])
              return sol


          def _indicador_desde_dict(d: dict) -> IndicadorNacional:
              ind = IndicadorNacional(
                  id=id_desde_texto("ind", d["id"]),
                  nombre=d["nombre"],
                  tipo=d["tipo"],
                  valor=int(d["valor"]),
                  origen=d["origen"],
                  estado=d["estado"],
                  sello_hash=d["sello_hash"],
              )
              ind.creado_en = datetime.fromisoformat(d["creado_en"])
              ind.actualizado_en = datetime.fromisoformat(d["actualizado_en"])
              return ind


          class NetworkRepository:
              def __init__(self, store):
                  if store is None:
                      raise ValueError("NetworkRepository requiere su store.")
                  self._store = store

              def agregar_solicitud(self, entidad) -> SolicitudRed:
                  if not isinstance(entidad, SolicitudRed):
                      raise ValueError("Se esperaba una SolicitudRed.")
                  self._store.insertar_solicitud(entidad)
                  return entidad

              def agregar_indicador(self, entidad) -> IndicadorNacional:
                  if not isinstance(entidad, IndicadorNacional):
                      raise ValueError("Se esperaba un IndicadorNacional.")
                  self._store.insertar_indicador(entidad)
                  return entidad

              def actualizar_solicitud(self, entidad) -> SolicitudRed:
                  if not self._store.actualizar_solicitud(entidad):
                      raise EntidadNoEncontradaError("Solicitud no encontrada.", str(entidad.id))
                  return entidad

              def actualizar_indicador(self, entidad) -> IndicadorNacional:
                  if not self._store.actualizar_indicador(entidad):
                      raise EntidadNoEncontradaError("Indicador no encontrado.", str(entidad.id))
                  return entidad

              def listar_solicitudes(self) -> list:
                  return [self._solicitud_resumen(f) for f in self._store.listar_solicitudes()]

              def listar_indicadores(self) -> list:
                  return [self._indicador_resumen(f) for f in self._store.listar_indicadores()]

              @staticmethod
              def _solicitud_resumen(f) -> dict:
                  return {
                      "id": f["id"],
                      "app_destino": f["app_destino"],
                      "contrato": f["contrato"],
                      "solicitante_zid": f["solicitante_zid"],
                      "estado": f["estado"],
                      "respuesta": f["respuesta"],
                      "creado_en": f["creado_en"],
                  }

              @staticmethod
              def _indicador_resumen(f) -> dict:
                  return {
                      "id": f["id"],
                      "nombre": f["nombre"],
                      "tipo": f["tipo"],
                      "valor": int(f["valor"]),
                      "origen": f["origen"],
                      "estado": f["estado"],
                      "sello_hash": f["sello_hash"],
                      "creado_en": f["creado_en"],
