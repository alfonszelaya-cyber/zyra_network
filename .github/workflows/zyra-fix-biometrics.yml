name: "ZYRA AUDIT: verificacion completa de la red (solo lectura, no modifica)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - SUITE GENERAL: pytest por areas (nucleo + cada app)"
        run: |
          python3 - <<'SUITEEOF'
          import subprocess
          import sys
          from pathlib import Path

          OUT = "audit_suite.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          areas = []
          sr = Path("shared_engines")
          if sr.exists():
              areas.append("shared_engines")
          tr = Path("tests")
          if tr.exists():
              areas.append("tests")
          apps_root = Path("apps")
          if apps_root.exists():
              for d in sorted(apps_root.iterdir()):
                  if d.is_dir() and d.name != "__pycache__":
                      areas.append("apps/" + d.name)

          log("======== SUITE GENERAL POR AREAS ========")
          resumen = {}
          for area in areas:
              cmd = [sys.executable, "-m", "pytest", area,
                     "-q", "--tb=no", "-p", "no:cacheprovider"]
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True,
                                     timeout=600)
                  out = (r.stdout or "").strip().splitlines()
                  tail = out[-1] if out else "(sin salida)"
                  if r.returncode == 5:
                      log(area + " : SIN TESTS")
                      resumen[area] = ("sin_tests", 0, 0)
                  elif r.returncode == 0:
                      log(area + " : OK   | " + tail)
                      resumen[area] = ("ok", 0, 0)
                  else:
                      log(area + " : FALLO| " + tail)
                      resumen[area] = ("fallo", 0, 0)
                      r2 = subprocess.run(
                          [sys.executable, "-m", "pytest", area,
                           "-q", "--tb=line", "-p", "no:cacheprovider"],
                          capture_output=True, text=True, timeout=600)
                      for l in (r2.stdout or "").splitlines():
                          ls = l.strip()
                          if ls.startswith(("FAILED", "ERROR")) or ls.startswith(("apps/", "shared_engines/", "tests/")) and "::" in ls:
                              log("    " + ls)
              except subprocess.TimeoutExpired:
                  log(area + " : TIMEOUT (>600s)")
                  resumen[area] = ("timeout", 0, 0)

          log("======== FIN SUITE POR AREAS ========")
          rep.close()
          SUITEEOF

      - name: "Paso 2 - MAPA DE APPS: codigo real vs esqueleto + conexion a la red"
        run: |
          python3 - <<'MAPAEOF'
          from pathlib import Path

          OUT = "audit_mapa.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          ENDPOINTS = (
              "/identity/enroll",
              "/identity/register",
              "/reputation/record",
              "/history/append",
              "/trust/complete",
              "/verification/credentials",
              "/apps/register",
              "/tokens/earn",
              "/documents/seal",
          )

          log("======== MAPA DE APPS ========")
          apps_root = Path("apps")
          apps = sorted([d for d in apps_root.iterdir()
                         if d.is_dir() and d.name != "__pycache__"])
          for app in apps:
              pys = [p for p in app.rglob("*.py")
                     if "__pycache__" not in p.parts]
              real = [p for p in pys if p.read_text(
                  encoding="utf-8", errors="ignore").strip()]
              vacios = [p for p in pys if p not in real]
              tests = [p for p in real if p.name.startswith("test_")]
              has_server = any(p.name == "server.py" for p in real)
              links = [p.name for p in real if p.name.endswith("_link.py")]
              has_nc = any(p.name == "network_client.py" for p in real)

              log("")
              log("--- APP: " + app.name + " ---")
              log("  archivos .py totales : " + str(len(pys)))
              log("  con codigo real      : " + str(len(real)))
              log("  vacios (__init__)    : " + str(len(vacios)))
              log("  tests                : " + str(len(tests)))
              log("  server.py            : " + str(has_server))
              log("  *_link.py            : " + str(len(links)))
              log("  network_client.py    : " + str(has_nc))

              mods_vacios = []
              for sub in sorted(app.rglob("*")):
                  if not sub.is_dir() or "__pycache__" in sub.parts:
                      continue
                  sps = [p for p in sub.iterdir() if p.suffix == ".py"]
                  if sps and all(
                          p.name == "__init__.py" and
                          not p.read_text(encoding="utf-8",
                                          errors="ignore").strip()
                          for p in sps):
                      mods_vacios.append(str(sub))
              if mods_vacios:
                  log("  MODULOS VACIOS (solo __init__): " + str(len(mods_vacios)))
                  for m in mods_vacios[:12]:
                      log("      " + m)
                  if len(mods_vacios) > 12:
                      log("      ... y " + str(len(mods_vacios) - 12) + " mas")

              texto = ""
              for p in real:
                  try:
                      texto = texto + p.read_text(
                          encoding="utf-8", errors="ignore")
                  except Exception:
                      pass
              usados = [e for e in ENDPOINTS if '"' + e + '"' in texto
                        or "'" + e + "'" in texto]
              if usados:
                  log("  consume de la red    : " + ", ".join(usados))
              else:
                  log("  consume de la red    : (ningun endpoint directo)")
          log("")
          log("======== FIN MAPA DE APPS ========")
          rep.close()
          MAPAEOF

      - name: "Paso 3 - SALUD DE LA RED: kernel + health + enroll biometrico"
        run: |
          python3 - <<'SALUDEOF'
          import base64
          import json
          import threading
          import time
          import urllib.error
          import urllib.request

          OUT = "audit_red.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          from shared_engines.security.biometrics import (
              BiometricsEngine,
              BiometricsPolicy,
              DeterministicTestProvider,
              TemplateCipher,
          )

          log("======== SALUD DE LA RED ========")
          db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=db, clock=FrozenClock(), signer=signer,
              config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          kernel.bootstrap_root()
          log("kernel bootstrap: OK (root=" + str(kernel.root_zid) + ")")

          kernel._biometrics = BiometricsEngine(
              db=db, clock=FrozenClock(), audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          log("biometrics wired (provider de prueba): OK")

          caps = ZyraCapabilities(db, FrozenClock(),
                                  identity=kernel.identity, signer=signer)
          server = serve_combined(kernel, caps, host="127.0.0.1", port=0)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base = f"http://127.0.0.1:{server.server_address[1]}"

          with urllib.request.urlopen(base + "/health", timeout=10) as r:
              h = json.loads(r.read().decode())
          comps = {c["component"]: c["status"]
                   for c in h["data"]["components"]}
          log("health overall: " + str(h["data"]["overall"]["status"]))
          log("componentes: " + json.dumps(comps))

          seed = base64.b64encode(b"zyra-audit-probe").decode("ascii")
          body = {
              "kind": "person",
              "display_name": "Auditoria Red",
              "actor": "audit",
              "doc_image_b64": seed,
              "selfie_image_b64": seed,
          }
          req = urllib.request.Request(
              base + "/identity/enroll",
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  d = json.loads(r.read().decode())
                  zid = d["data"]["identity"]["zid"]
                  log("enroll biometrico: " + str(r.status)
                      + " ZID=" + zid)
          except urllib.error.HTTPError as e:
              log("enroll biometrico: RECHAZADO " + str(e.code)
                  + " " + e.read().decode()[:200])

          req2 = urllib.request.Request(
              base + "/identity/register",
              data=json.dumps({"kind": "person",
                               "display_name": "Bypass",
                               "actor": "audit"}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req2, timeout=10) as r:
                  log("puerta legacy con persona: ACEPTO (¡REVISAR!)")
          except urllib.error.HTTPError as e:
              log("puerta legacy con persona: rechazada "
                  + str(e.code) + " (ley activa, correcto)")

          log("======== FIN SALUD DE LA RED ========")
          rep.close()
          SALUDEOF

      - name: "Paso 4 - RESUMEN FINAL DE AUDITORIA + artifact"
        uses: actions/upload-artifact@v4
        with:
          name: zyra-audit-reporte
          path: |
            audit_suite.txt
            audit_mapa.txt
            audit_red.txt
          if-no-files-found: warn

      - name: "Resumen en consola"
        run: |
          echo "=========================================="
          echo " AUDITORIA ZYRA COMPLETADA (solo lectura)"
          echo " Reportes: audit_suite.txt / audit_mapa.txt"
          echo "           / audit_red.txt (artifact)"
          echo " Clasificacion: lo que falta de codigo es"
          echo " trabajo de desarrollo; lo externo"
          echo " (servidores, permisos, instituciones,"
          echo " proveedores) es requisito de activacion,"
          echo " NO defecto del sistema."
          echo "=========================================="
