      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Correr la suite completa de LABORATORIO
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          exit ${PIPESTATUS[0]}

      - name: Publicar resultado de la suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-laboratorio
          path: pytest_salida.txt

      - name: Commit y push automatico
        run: |
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio/tests
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "RUM 6: suite completa de pruebas de LABORATORIO (motores, API, persistencia, concurrencia, seguridad, recuperacion, idempotencia)"
            git push
          fi
