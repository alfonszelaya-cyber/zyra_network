name: ZYRA Fase 8 suite CI permanente

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fase8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pytest pyyaml

      - name: Crear suite CI y auto-probarla
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, subprocess, sys, traceback
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          GATES = []

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('fase8.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _manejador

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def contar():
              nf = 0
              npy = 0
              for p in ROOT.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                      continue
                  nf += 1
                  if p.suffix == '.py':
                      npy += 1
              return nf, npy

          SINTAXIS = [
          'import ast, sys',
          'from pathlib import Path',
          '',
          'ROOT = Path(__file__).resolve().parents[1]',
          'SKIP = {".git", "__pycache__"}',
          'errores = []',
          'total = 0',
          'for p in ROOT.rglob("*.py"):',
          '    if SKIP & set(p.parts):',
          '        continue',
          '    total += 1',
          '    try:',
          '        ast.parse(p.read_bytes())',
          '    except SyntaxError as e:',
          '        errores.append("%s linea %s: %s" % (p.relative_to(ROOT), e.lineno, e.msg))',
          'print("python revisados: %d | errores de sintaxis: %d" % (total, len(errores)))',
          'for e in errores[:20]:',
          '    print("  " + e)',
          'sys.exit(1 if errores else 0)',
          ]

          BOOT = [
          'import json, os, secrets, subprocess, sys, time',
          'import urllib.request, urllib.error',
          'from pathlib import Path',
          '',
          'ROOT = Path(__file__).resolve().parents[1]',
          "TOKEN = 'ci-token-' + secrets.token_hex(16)",
          'KEY = secrets.token_hex(32)',
          'NP, SP = 8765, 8766',
          "BASE = 'http://127.0.0.1:%d' % NP",
          "BSP = 'http://127.0.0.1:%d' % SP",
          'ENV = dict(os.environ)',
          "ENV.update({'ZYRA_ROOT_KEY': KEY, 'ZYRA_API_TOKEN': TOKEN,",
          "            'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/ci-zyra',",
          "            'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/ci-super',",
          "            'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})",
          '',
          'def espera(url, segundos):',
          '    t0 = time.time()',
          '    while time.time() - t0 < segundos:',
          '        try:',
          '            with urllib.request.urlopen(url, timeout=3) as r:',
          "                return r.status, r.read().decode('utf-8', errors='replace')",
          '        except urllib.error.HTTPError as e:',
          '            return e.code, ""',
          '        except Exception:',
          '            time.sleep(1.2)',
          '    return None, ""',
          '',
          'procs = []',
          'ok = True',
          'try:',
          "    p1 = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=ENV,",
          '                          stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)',
          '    procs.append(p1)',
          "    st, _ = espera(BASE + '/health', 40)",
          "    print('red health: %s' % st)",
          '    if st is None:',
          '        ok = False',
          "    p2 = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=ENV,",
          '                          stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)',
          '    procs.append(p2)',
          "    st2, cuerpo = espera(BSP + '/health', 70)",
          "    print('superapp health: %s' % st2)",
          '    apps = []',
          '    if st2 == 200:',
          '        try:',
          "            apps = list(json.loads(cuerpo).get('apps', {}).keys())",
          '        except Exception:',
          '            apps = []',
          "    print('apps vivas: %s' % apps)",
          '    if st2 != 200 or len(apps) != 8:',
          '        ok = False',
          'finally:',
          '    for p in procs:',
          '        try:',
          '            if p.poll() is None:',
          '                p.terminate()',
          '                p.wait(timeout=10)',
          '        except Exception:',
          '            try:',
          '                p.kill()',
          '            except Exception:',
          '                pass',
          "print('CI BOOT: %s' % ('OK' if ok else 'FALLO'))",
          'sys.exit(0 if ok else 1)',
          ]

          CIYML = [
          'name: ZYRA CI',
          '',
          'on:',
          '  push:',
          '    branches: [main]',
          '  workflow_dispatch:',
          '',
          'permissions:',
          '  contents: read',
          '',
          'jobs:',
          '  ci:',
          '    runs-on: ubuntu-latest',
          '    timeout-minutes: 25',
          '    steps:',
          '      - name: Descargar repositorio',
          '        uses: actions/checkout@v4',
          '',
          '      - name: Configurar Python',
          '        uses: actions/setup-python@v5',
          '        with:',
          '          python-version: "3.11"',
          '',
          '      - name: Instalar minimo',
          '        run: |',
          '          python -m pip install --upgrade pip',
          '          python -m pip install --quiet cryptography pytest',
          '',
          '      - name: Sintaxis de todo el repositorio',
          '        run: python3 tools/ci_sintaxis.py',
          '',
          '      - name: Tests de invariantes',
          '        run: python3 -m pytest tests/test_portal_js_sync.py tests/test_namespace_manifest.py -q',
          '',
          '      - name: Tests de AXIS (suite conocida buena)',
          '        run: python3 -m pytest apps/axis -q --tb=short -p no:cacheprovider',
          '        env:',
          '          PYTHONPATH: ${{ github.workspace }}',
          '',
          '      - name: Arranque real de red y superapp',
          '        run: python3 tools/ci_boot.py',
          '        env:',
          '          PYTHONPATH: ${{ github.workspace }}',
          ]

          nf0, np0 = contar()
          add('# FASE 8 - SUITE CI PERMANENTE')
          add('')
          add('Crea la CI que corre SIEMPRE en cada push: sintaxis total, invariantes,')
          add('tests de AXIS y arranque real de red+superapp. Auto-probada aqui antes de commitear.')
          add('')
          add('## B1. Creacion de archivos')
          add('')
          td = ROOT / 'tools'
          td.mkdir(exist_ok=True)
          f1 = td / 'ci_sintaxis.py'
          f2 = td / 'ci_boot.py'
          f3 = ROOT / '.github' / 'workflows' / 'ci.yml'
          f1.write_text('\n'.join(SINTAXIS) + '\n', encoding='utf-8')
          f2.write_text('\n'.join(BOOT) + '\n', encoding='utf-8')
          f3.write_text('\n'.join(CIYML) + '\n', encoding='utf-8')
          add('- creado tools/ci_sintaxis.py')
          add('- creado tools/ci_boot.py')
          add('- creado .github/workflows/ci.yml')
          add('')

          add('## B2. Auto-prueba: compilacion de herramientas')
          add('')
          comp = True
          try:
              py_compile.compile(str(f1), doraise=True)
              py_compile.compile(str(f2), doraise=True)
              add('- py_compile herramientas: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('herramientas_compilan', comp)
          add('')

          add('## B3. Auto-prueba: ci_sintaxis.py sobre el repo real')
          add('')
          envx = dict(os.environ)
          envx['PYTHONPATH'] = str(ROOT)
          r1 = subprocess.run([sys.executable, str(f1)], cwd=str(ROOT),
                              capture_output=True, text=True, timeout=300)
          add('```')
          for l in (r1.stdout or '').splitlines()[:8]:
              add(l)
          add('```')
          gate('sintaxis_selftest', r1.returncode == 0)
          add('')

          add('## B4. Auto-prueba: ci_boot.py (arranque real de red + superapp)')
          add('')
          try:
              r2 = subprocess.run([sys.executable, str(f2)], cwd=str(ROOT), env=envx,
                                  capture_output=True, text=True, timeout=240)
              add('```')
              for l in (r2.stdout or '').splitlines()[:12]:
                  add(l)
              add('```')
              gate('boot_selftest', r2.returncode == 0)
          except Exception as e:
              add('- FALLO: %s' % e)
              gate('boot_selftest', False)
          add('')

          add('## B5. Validacion del YAML de la CI')
          add('')
          yaml_ok = False
          try:
              import yaml
              doc = yaml.safe_load(f3.read_text(encoding='utf-8'))
              yaml_ok = isinstance(doc, dict) and 'jobs' in doc and 'ci' in doc.get('jobs', {})
              add('- ci.yml parsea correctamente y tiene el job ci: %s' % yaml_ok)
          except Exception as e:
              add('- FALLO parseando ci.yml: %s' % e)
          gate('ci_yaml_valido', yaml_ok)
          add('')

          add('## B6. Conteo dinamico')
          add('')
          nf1, np1 = contar()
          add('- python: %d (esperado %d = %d + 2 herramientas)' % (np1, np0 + 2, np0))
          add('- archivos: %d (esperado %d = %d + 3)' % (nf1, nf0 + 3, nf0))
          gate('conteo_dinamico', np1 == np0 + 2 and nf1 == nf0 + 3)
          add('')

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**Suite CI auto-probada. Commit aplicado. Desde ahora cada push ejecuta ZYRA CI.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('fase8.json').write_text(
              json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
              encoding='utf-8')
          escribe()
          print('Fase 8 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ci.yml tools
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "ci: suite permanente (sintaxis total, invariantes, axis, arranque real)"
            git push
            echo "## Commit aplicado - el push dispara ZYRA CI por primera vez" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios (CI ya existe)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase8-zyra
          path: fase8.json
          if-no-files-found: ignore
