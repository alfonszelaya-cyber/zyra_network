name: "ZYRA Auditoría Forense Biométrica"

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: write

jobs:
  audit_biometric_core:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout del Repo"
        uses: actions/checkout@v4

      - name: "Instalar Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Instalar Dependencias Básicas de Auditoría"
        run: |
          pip install pyyaml astroid tree-sitter-tree-sitter-language-pack
      
      - name: "EXPLORACIÓN Y AUDITORÍA BIOMÉTRICA PROFUNDA"
        id: audit_step
        run: |
          echo "=========================================="
          echo "INICIANDO AUDITORÍA FORENSE DE REGISTRO BIOMÉTRICO ZYRA"
          echo "FECHA: $(date)"
          echo "COMMIT: ${{ github.sha }}"
          echo "=========================================="
          
          # 1. Crear directorio temporal para reportes
          mkdir -p /tmp/zyra_audit_reports
          
          # 2. Definir patrones de búsqueda críticos para identidad/biometría
          PATTERNS="biometric|bio_id|face_recog|fingerprint|iris|voiceprint|zid_identity|register_person|credential_verify|security_engine|verification_core"
          
          echo "--- BUSCANDO ARCHIVOS CLAVE ---"
          find . -type f \( -name "*.py" \) | grep -E "$PATTERNS" > /tmp/zyra_audit_reports/files_found.txt || true
          
          if [ ! -s /tmp/zyra_audit_reports/files_found.txt ]; then
            echo "[ADVERTENCIA] No se encontraron archivos coincidentes con patrones biométricos explícitos."
            echo "Intentando buscar en shared_engines/security y apps/nexo..."
            find ./shared_engines/security ./apps/nexo -type f -name "*.py" > /tmp/zyra_audit_reports/files_found.txt || true
          fi
          
          cat /tmp/zyra_audit_reports/files_found.txt
          
          # 3. Analizar cada archivo encontrado
          echo ""
          echo "--- ANÁLISIS ESTÁTICO DE ESTRUCTURA ---"
          
          while IFS= read -r file_path; do
            if [ -f "$file_path" ]; then
              filename=$(basename "$file_path")
              echo ""
              echo "============================================================"
              echo "ARCHIVO ANALIZADO: $filename"
              echo "RUTA COMPLETA: $file_path"
              echo "============================================================"
              
              # A. Mostrar imports críticos (dependencias externas)
              echo "> IMPORTS EXTERNOS DETECTADOS:"
              grep -E "^import|^from" "$file_path" | grep -v "__future__" | head -n 20 || echo "(Sin imports visibles al inicio)"
              
              # B. Mostrar Clases definidas
              echo ""
              echo "> CLASES DEFINIDAS EN ESTE MÓDULO:"
              grep -E "^class\s+\w+" "$file_path" || echo "(No se detectaron clases top-level)"
              
              # C. Mostrar Funciones Públicas (posibles endpoints o métodos core)
              echo ""
              echo "> FUNCIONES MÉTODO PÚBLICOS (def ...):"
              # Busca def que no empiecen con _ (privadas) para ver la interfaz real
              grep -E "^\s+def\s+[a-zA-Z]\w*" "$file_path" | sed 's/^/  /' || echo "(No se detectaron métodos públicos claros)"
              
              # D. Detectar posibles hardcodes de claves o configuraciones sensibles
              echo ""
              echo "> ALERTA SEGURIDAD (Buscando strings sospechosos):"
              grep -iE "(api_key|secret|password|token|private_key)\s*=\s*[\"']" "$file_path" && echo "[CRÍTICO] Posible secreto hardcoded arriba!" || echo "OK: Sin secretos obvios en asignaciones simples."
              
              # E. Conteo de líneas y complejidad básica
              lines_count=$(wc -l < "$file_path")
              echo ""
              echo "> METADATOS: Líneas totales = $lines_count"
              
              # Guardar copia limpia para descarga posterior si es necesario
              cp "$file_path" "/tmp/zyra_audit_reports/${filename}.backup"
            else
              echo "[ERROR] Ruta rota o no existe: $file_path"
            fi
          done < /tmp/zyra_audit_reports/files_found.txt
          
          echo ""
          echo "=========================================="
          echo "FIN DEL ESCANEO ESTÁTICO"
          echo "=========================================="
          
          # Subir artefactos opcionales para inspección manual futura
          ls -la /tmp/zyra_audit_reports/

      - name: "Generar Resumen Ejecutivo para Log"
        if: always()
        run: |
          echo "::notice::Auditoría completada. Revisa los logs anteriores para detalles técnicos."
          echo "::warning::Si ves 'CRÍTICO' en seguridad, detén cualquier despliegue inmediato."
          
      - name: "Subir Reporte Detallado (Artefacto)"
        uses: actions/upload-artifact@v4
        with:
          name: zyra_biometric_forensic_report_${{ github.run_number }}
          path: /tmp/zyra_audit_reports/
          retention-days: 7
