name: "ZYRA MARKET (Bloque 2-RESTANTE v3): 009 completo en su carpeta"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-b2r
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Evidencia - carpetas reales de modules"
        run: |
          echo "=== apps/subastas/modules/ (real) ==="
          ls -1 apps/subastas/modules/

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Relocate stores to their modules (git mv only)
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import sys
          from pathlib import Path


          def fail(msg):
              print("RELOCATE-ERROR:", msg)
              sys.exit(1)


          pairs = [
              (
                  "apps/subastas/infrastructure/persistence/disputes_store.py",
                  "apps/subastas/modules/009_riesgo_proteccion/riesgo_store.py",
              ),
              (
                  "apps/subastas/infrastructure/persistence/accounts_store.py",
                  "apps/subastas/modules/002_inscripciones/inscripciones_store.py",
              ),
          ]

          for src, dst in pairs:
              if not Path(src).exists():
                  if Path(dst).exists():
                      print("SKIP (already moved):", dst)
                      continue
                  fail("source missing: " + src)
              if not Path(dst).parent.exists():
                  fail("dest folder does not exist: " + str(Path(dst).parent))
              if Path(dst).exists():
                  fail("dest already exists: " + dst)
              r = subprocess.run(["git", "mv", src, dst], capture_output=True, text=True)
              if r.returncode != 0:
                  fail("git mv failed %s -> %s : %s" % (src, dst, r.stderr))
              print("MOVED:", src, "->", dst)
          print("RELOCATE OK")
          PYEOF

      - name: Write riesgo_store.py (009 COMPLETO)
        run: |
          cat > apps/subastas/modules/009_riesgo_proteccion/riesgo_store.py <<'RSF'
          """ZYRA MARKET - Modulo 009 Riesgo y Proteccion.

          Disputas completas + reembolsos + banderas + PATRONES de
          fraude + ALERTAS automaticas + INVESTIGACIONES + BLOQUEOS
          de cuenta. Cuenta bloqueada: no puja, no publica, no
          compra. HTML patron join."""
          from __future__ import annotations

          import threading
          import time
          import uuid


          def _now() -> str:
              return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


          def _nid(prefix: str) -> str:
              return prefix + uuid.uuid4().hex[:10]


          EDITABLE = ("open", "under_review", "appeal_window")


          class RiesgoStore:
              def __init__(self, db, clock) -> None:
                  self._db = db
                  self._clock = clock
                  self._lock = threading.Lock()
                  self._ensure_schema()

              def _ensure_schema(self) -> None:
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_disputes ("
                      " dispute_id TEXT PRIMARY KEY,"
                      " order_id TEXT NOT NULL,"
                      " opener_account TEXT NOT NULL,"
                      " role TEXT NOT NULL,"
                      " reason TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " decision TEXT,"
                      " refund_amount REAL,"
                      " created_at TEXT NOT NULL,"
                      " updated_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_dispute_events ("
                      " event_id TEXT PRIMARY KEY,"
                      " dispute_id TEXT NOT NULL,"
                      " actor_account TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " content TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_refunds ("
                      " refund_id TEXT PRIMARY KEY,"
                      " dispute_id TEXT,"
                      " order_id TEXT NOT NULL,"
                      " amount REAL NOT NULL,"
                      " status TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_fraud_flags ("
                      " flag_id TEXT PRIMARY KEY,"
                      " subject_account TEXT NOT NULL,"
                      " reason TEXT NOT NULL,"
                      " severity TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_fraud_alerts ("
                      " alert_id TEXT PRIMARY KEY,"
                      " subject_account TEXT NOT NULL,"
                      " pattern TEXT NOT NULL,"
                      " detail TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_investigations ("
                      " inv_id TEXT PRIMARY KEY,"
                      " subject_account TEXT NOT NULL,"
                      " hypothesis TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " conclusion TEXT,"
                      " created_at TEXT NOT NULL,"
                      " updated_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_investigation_events ("
                      " event_id TEXT PRIMARY KEY,"
                      " inv_id TEXT NOT NULL,"
                      " actor TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " content TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_blocks ("
                      " block_id TEXT PRIMARY KEY,"
                      " subject_account TEXT NOT NULL,"
                      " reason TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " created_at TEXT NOT NULL,"
                      " released_at TEXT)"
                  )

              def _run(self, sql, params=()):
                  if not params:
                      self._db.execute(sql)
                      return
                  try:
                      self._db.execute(sql, params)
                      return
                  except TypeError:
                      self._db.execute(self._inline(sql, params))

              @staticmethod
              def _inline(sql, params):
                  parts = sql.split("?")
                  if len(parts) != len(params) + 1:
                      return sql
                  assembled = parts[0]
                  for i, v in enumerate(params):
                      assembled += RiesgoStore._literal(v)
                      assembled += parts[i + 1]
                  return assembled

              @staticmethod
              def _literal(value):
                  if value is None:
                      return "NULL"
                  if isinstance(value, bool):
                      return "1" if value else "0"
                  if isinstance(value, (int, float)):
                      return repr(value)
                  return "'" + str(value).replace("'", "''") + "'"

              def _rows(self, sql):
                  for name in ("query", "fetchall", "fetch_all", "fetch", "select"):
                      fn = getattr(self._db, name, None)
                      if callable(fn):
                          try:
                              rows = fn(sql)
                              if rows is not None:
                                  return list(rows)
                          except Exception:
                              continue
                  try:
                      cur = self._db.execute(sql)
                  except Exception:
                      return []
                  if cur is None:
                      return []
                  try:
                      return list(cur.fetchall())
                  except Exception:
                      return []

              @staticmethod
              def _field(row, key, index):
                  if isinstance(row, dict):
                      return row.get(key)
                  try:
                      return row[index]
                  except Exception:
                      return None

              @staticmethod
              def _req(value, name):
                  text = str(value or "").strip()
                  if not text:
                      raise ValueError("%s es obligatorio" % name)
                  return text

              def _add_event(self, dispute_id, actor_account, kind, content):
                  self._run(
                      "INSERT INTO sbs_dispute_events (event_id, dispute_id,"
                      " actor_account, kind, content, created_at)"
                      " VALUES (?, ?, ?, ?, ?, ?)",
                      (_nid("DVE-"), dispute_id, actor_account, kind, content, _now()),
                  )

              def open_dispute(self, *, order_id, opener_account, role, reason):
                  order_id = self._req(order_id, "order_id")
                  opener_account = self._req(opener_account, "opener_account")
                  role = self._req(role, "role")
                  reason = self._req(reason, "reason")
                  with self._lock:
                      dispute_id = _nid("DSP-")
                      now = _now()
                      self._run(
                          "INSERT INTO sbs_disputes (dispute_id, order_id,"
                          " opener_account, role, reason, status, decision,"
                          " refund_amount, created_at, updated_at)"
                          " VALUES (?, ?, ?, ?, ?, 'open', NULL, NULL, ?, ?)",
                          (dispute_id, order_id, opener_account, role, reason, now, now),
                      )
                      self._add_event(
                          dispute_id, opener_account, "message",
                          "apertura de disputa: %s" % reason,
                      )
                      return self.get_dispute(dispute_id)

              def add_event(self, dispute_id, *, actor_account, kind, content):
                  dispute_id = self._req(dispute_id, "dispute_id")
                  actor_account = self._req(actor_account, "actor_account")
                  kind = self._req(kind, "kind")
                  content = self._req(content, "content")
                  if kind not in ("evidence", "message"):
                      raise ValueError("kind debe ser evidence o message")
                  with self._lock:
                      row = self._dispute_row(dispute_id)
                      if row is None:
                          raise LookupError("disputa no encontrada: %s" % dispute_id)
                      status = str(self._field(row, "s", 5))
                      if status not in EDITABLE:
                          raise ValueError("la disputa esta %s" % status)
                      self._add_event(dispute_id, actor_account, kind, content)
                  return self.get_dispute(dispute_id)

              def _dispute_row(self, dispute_id):
                  rows = self._rows(
                      "SELECT dispute_id, order_id, opener_account, role, reason,"
                      " status, decision, refund_amount, created_at, updated_at"
                      " FROM sbs_disputes WHERE dispute_id = "
                      + self._literal(dispute_id)
                  )
                  if not rows:
                      return None
                  return rows[0]

              def get_dispute(self, dispute_id):
                  row = self._dispute_row(self._req(dispute_id, "dispute_id"))
                  if row is None:
                      raise LookupError("disputa no encontrada: %s" % dispute_id)
                  events = []
                  for e in self._rows(
                      "SELECT event_id, actor_account, kind, content, created_at"
                      " FROM sbs_dispute_events WHERE dispute_id = "
                      + self._literal(dispute_id)
                      + " ORDER BY created_at ASC"
                  ):
                      events.append({
                          "event_id": self._field(e, "a", 0),
                          "actor_account": self._field(e, "b", 1),
                          "kind": self._field(e, "c", 2),
                          "content": self._field(e, "d", 3),
                          "created_at": self._field(e, "e", 4),
                      })
                  refunds = []
                  for r in self._rows(
                      "SELECT refund_id, order_id, amount, status, created_at"
                      " FROM sbs_refunds WHERE dispute_id = "
                      + self._literal(dispute_id)
                      + " ORDER BY created_at ASC"
                  ):
                      refunds.append({
                          "refund_id": self._field(r, "a", 0),
                          "order_id": self._field(r, "b", 1),
                          "amount": self._field(r, "c", 2),
                          "status": self._field(r, "d", 3),
                          "created_at": self._field(r, "e", 4),
                      })
                  return {
                      "dispute_id": self._field(row, "a", 0),
                      "order_id": self._field(row, "b", 1),
                      "opener_account": self._field(row, "c", 2),
                      "role": self._field(row, "d", 3),
                      "reason": self._field(row, "e", 4),
                      "status": self._field(row, "f", 5),
                      "decision": self._field(row, "g", 6),
                      "refund_amount": self._field(row, "h", 7),
                      "created_at": self._field(row, "i", 8),
                      "updated_at": self._field(row, "j", 9),
                      "events": events,
                      "refunds": refunds,
                  }

              def list_disputes(self, status=None):
                  sql = (
                      "SELECT dispute_id, order_id, opener_account, role, reason,"
                      " status, decision, refund_amount, created_at, updated_at"
                      " FROM sbs_disputes"
                  )
                  if status:
                      sql += " WHERE status = " + self._literal(str(status))
                  sql += " ORDER BY created_at DESC"
                  out = []
                  for row in self._rows(sql):
                      out.append({
                          "dispute_id": self._field(row, "a", 0),
                          "order_id": self._field(row, "b", 1),
                          "opener_account": self._field(row, "c", 2),
                          "role": self._field(row, "d", 3),
                          "reason": self._field(row, "e", 4),
                          "status": self._field(row, "f", 5),
                          "decision": self._field(row, "g", 6),
                          "refund_amount": self._field(row, "h", 7),
                          "created_at": self._field(row, "i", 8),
                          "updated_at": self._field(row, "j", 9),
                      })
                  return out

              def _set_status(self, dispute_id, status, decision=None, refund_amount=None):
                  self._run(
                      "UPDATE sbs_disputes SET status = "
                      + self._literal(status)
                      + ", decision = "
                      + self._literal(decision)
                      + ", refund_amount = "
                      + self._literal(refund_amount)
                      + ", updated_at = "
                      + self._literal(_now())
                      + " WHERE dispute_id = "
                      + self._literal(dispute_id)
                  )

              def mediate(self, dispute_id, *, arbiter, note):
                  arbiter = self._req(arbiter, "arbiter")
                  note = self._req(note, "note")
                  with self._lock:
                      row = self._dispute_row(dispute_id)
                      if row is None:
                          raise LookupError("disputa no encontrada")
                      status = str(self._field(row, "f", 5))
                      if status not in ("open", "under_review"):
                          raise ValueError("no se puede mediar en estado %s" % status)
                      decision = self._field(row, "g", 6)
                      refund_amount = self._field(row, "h", 7)
                      self._set_status(dispute_id, "under_review", decision, refund_amount)
                      self._add_event(dispute_id, arbiter, "mediation", "mediacion: %s" % note)
                  return self.get_dispute(dispute_id)

              def decide(self, dispute_id, *, arbiter, approve, note, refund_amount):
                  arbiter = self._req(arbiter, "arbiter")
                  note = self._req(note, "note")
                  amount = float(refund_amount or 0)
                  with self._lock:
                      row = self._dispute_row(dispute_id)
                      if row is None:
                          raise LookupError("disputa no encontrada")
                      status = str(self._field(row, "f", 5))
                      order_id = str(self._field(row, "b", 1))
                      if status not in ("open", "under_review"):
                          raise ValueError("no se puede decidir en estado %s" % status)
                      decision = "approved" if approve else "rejected"
                      self._set_status(
                          dispute_id, "decided", decision,
                          amount if approve else None,
                      )
                      self._add_event(
                          dispute_id, arbiter, "decision",
                          "decision: %s — %s" % (decision, note),
                      )
                      if approve and amount > 0:
                          self._run(
                              "INSERT INTO sbs_refunds (refund_id, dispute_id,"
                              " order_id, amount, status, created_at)"
                              " VALUES (?, ?, ?, ?, 'executed', ?)",
                              (_nid("RFD-"), dispute_id, order_id, amount, _now()),
                          )
                  return self.get_dispute(dispute_id)

              def appeal(self, dispute_id, *, appellant, reason):
                  appellant = self._req(appellant, "appellant")
                  reason = self._req(reason, "reason")
                  with self._lock:
                      row = self._dispute_row(dispute_id)
                      if row is None:
                          raise LookupError("disputa no encontrada")
                      status = str(self._field(row, "f", 5))
                      if status != "decided":
                          raise ValueError("solo se apela una decision (estado %s)" % status)
                      decision = self._field(row, "g", 6)
                      refund_amount = self._field(row, "h", 7)
                      self._set_status(dispute_id, "appeal_window", decision, refund_amount)
                      self._add_event(dispute_id, appellant, "appeal", "apelacion: %s" % reason)
                  return self.get_dispute(dispute_id)

              def resolve_appeal(self, dispute_id, *, arbiter, uphold, note):
                  arbiter = self._req(arbiter, "arbiter")
                  note = self._req(note, "note")
                  with self._lock:
                      row = self._dispute_row(dispute_id)
                      if row is None:
                          raise LookupError("disputa no encontrada")
                      status = str(self._field(row, "f", 5))
                      decision = str(self._field(row, "g", 6) or "")
                      if status != "appeal_window":
                          raise ValueError("sin apelacion abierta (estado %s)" % status)
                      if uphold:
                          self._set_status(dispute_id, "final", decision)
                          self._add_event(
                              dispute_id, arbiter, "decision",
                              "apelacion resuelta: se mantiene %s — %s" % (decision, note),
                          )
                      else:
                          self._set_status(dispute_id, "final", "overturned")
                          self._run(
                              "UPDATE sbs_refunds SET status = 'reversed'"
                              " WHERE dispute_id = " + self._literal(dispute_id)
                          )
                          self._add_event(
                              dispute_id, arbiter, "decision",
                              "apelacion resuelta: decision revertida — %s" % note,
                          )
                  return self.get_dispute(dispute_id)

              def flag_fraud(self, *, subject_account, reason, severity):
                  subject_account = self._req(subject_account, "subject_account")
                  reason = self._req(reason, "reason")
                  severity = str(severity or "media").strip() or "media"
                  if severity not in ("baja", "media", "alta"):
                      raise ValueError("severity debe ser baja, media o alta")
                  with self._lock:
                      flag_id = _nid("FRD-")
                      self._run(
                          "INSERT INTO sbs_fraud_flags (flag_id, subject_account,"
                          " reason, severity, status, created_at)"
                          " VALUES (?, ?, ?, ?, 'open', ?)",
                          (flag_id, subject_account, reason, severity, _now()),
                      )
                      return {
                          "flag_id": flag_id,
                          "subject_account": subject_account,
                          "severity": severity,
                          "status": "open",
                      }

              def list_fraud(self):
                  out = []
                  for row in self._rows(
                      "SELECT flag_id, subject_account, reason, severity,"
                      " status, created_at FROM sbs_fraud_flags"
                      " ORDER BY created_at DESC"
                  ):
                      out.append({
                          "flag_id": self._field(row, "a", 0),
                          "subject_account": self._field(row, "b", 1),
                          "reason": self._field(row, "c", 2),
                          "severity": self._field(row, "d", 3),
                          "status": self._field(row, "e", 4),
                          "created_at": self._field(row, "f", 5),
                      })
                  return out

              def scan_patterns(self, *, account, orders_last_hour, account_age_days, activity_count, doc_duplicates):
                  """Reglas: >10 ordenes/hora; cuenta <7 dias con >20
                  actividades; documentos duplicados >=1."""
                  account = self._req(account, "account")
                  alerts = []
                  if float(orders_last_hour or 0) > 10:
                      alerts.append(("velocidad_ordenes", "mas de 10 ordenes en una hora"))
                  if float(account_age_days or 999) < 7 and float(activity_count or 0) > 20:
                      alerts.append(("cuenta_nueva_alta_actividad", "cuenta menor a 7 dias con mas de 20 actividades"))
                  if float(doc_duplicates or 0) >= 1:
                      alerts.append(("documento_duplicado", "documentos coincidentes detectados"))
                  created = []
                  with self._lock:
                      for pattern, detail in alerts:
                          alert_id = _nid("ALR-")
                          self._run(
                              "INSERT INTO sbs_fraud_alerts (alert_id,"
                              " subject_account, pattern, detail, created_at)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (alert_id, account, pattern, detail, _now()),
                          )
                          created.append({"alert_id": alert_id, "pattern": pattern, "detail": detail})
                  return created

              def list_alerts(self):
                  out = []
                  for row in self._rows(
                      "SELECT alert_id, subject_account, pattern, detail, created_at"
                      " FROM sbs_fraud_alerts ORDER BY created_at DESC"
                  ):
                      out.append({
                          "alert_id": self._field(row, "a", 0),
                          "subject_account": self._field(row, "b", 1),
                          "pattern": self._field(row, "c", 2),
                          "detail": self._field(row, "d", 3),
                          "created_at": self._field(row, "e", 4),
                      })
                  return out

              def open_investigation(self, *, subject_account, hypothesis, opener):
                  subject_account = self._req(subject_account, "subject_account")
                  hypothesis = self._req(hypothesis, "hypothesis")
                  opener = self._req(opener, "opener")
                  with self._lock:
                      inv_id = _nid("INV-")
                      now = _now()
                      self._run(
                          "INSERT INTO sbs_investigations (inv_id, subject_account,"
                          " hypothesis, status, conclusion, created_at, updated_at)"
                          " VALUES (?, ?, ?, 'open', NULL, ?, ?)",
                          (inv_id, subject_account, hypothesis, now, now),
                      )
                      self._run(
                          "INSERT INTO sbs_investigation_events (event_id, inv_id,"
                          " actor, kind, content, created_at)"
                          " VALUES (?, ?, ?, 'message', ?, ?)",
                          (_nid("IVE-"), inv_id, opener, "apertura: %s" % hypothesis, now),
                      )
                      return self.get_investigation(inv_id)

              def _inv_row(self, inv_id):
                  rows = self._rows(
                      "SELECT inv_id, subject_account, hypothesis, status,"
                      " conclusion, created_at, updated_at"
                      " FROM sbs_investigations WHERE inv_id = "
                      + self._literal(inv_id)
                  )
                  if not rows:
                      return None
                  return rows[0]

              def get_investigation(self, inv_id):
                  row = self._inv_row(self._req(inv_id, "inv_id"))
                  if row is None:
                      raise LookupError("investigacion no encontrada: %s" % inv_id)
                  events = []
                  for e in self._rows(
                      "SELECT actor, kind, content, created_at"
                      " FROM sbs_investigation_events WHERE inv_id = "
                      + self._literal(inv_id)
                      + " ORDER BY created_at ASC"
                  ):
                      events.append({
                          "actor": self._field(e, "a", 0),
                          "kind": self._field(e, "b", 1),
                          "content": self._field(e, "c", 2),
                          "created_at": self._field(e, "d", 3),
                      })
                  return {
                      "inv_id": self._field(row, "a", 0),
                      "subject_account": self._field(row, "b", 1),
                      "hypothesis": self._field(row, "c", 2),
                      "status": self._field(row, "d", 3),
                      "conclusion": self._field(row, "e", 4),
                      "events": events,
                  }

              def list_investigations(self):
                  out = []
                  for row in self._rows(
                      "SELECT inv_id, subject_account, hypothesis, status,"
                      " conclusion, created_at, updated_at"
                      " FROM sbs_investigations ORDER BY created_at DESC"
                  ):
                      out.append({
                          "inv_id": self._field(row, "a", 0),
                          "subject_account": self._field(row, "b", 1),
                          "hypothesis": self._field(row, "c", 2),
                          "status": self._field(row, "d", 3),
                          "conclusion": self._field(row, "e", 4),
                      })
                  return out

              def close_investigation(self, inv_id, *, actor, conclusion, block=False, block_reason=None):
                  inv_id = self._req(inv_id, "inv_id")
                  actor = self._req(actor, "actor")
                  conclusion = self._req(conclusion, "conclusion")
                  with self._lock:
                      row = self._inv_row(inv_id)
                      if row is None:
                          raise LookupError("investigacion no encontrada")
                      self._run(
                          "UPDATE sbs_investigations SET status = 'closed',"
                          " conclusion = " + self._literal(conclusion)
                          + ", updated_at = " + self._literal(_now())
                          + " WHERE inv_id = " + self._literal(inv_id)
                      )
                      self._run(
                          "INSERT INTO sbs_investigation_events (event_id, inv_id,"
                          " actor, kind, content, created_at)"
                          " VALUES (?, ?, ?, 'conclusion', ?, ?)",
                          (_nid("IVE-"), inv_id, actor, conclusion, _now()),
                      )
                      subject = str(self._field(row, "b", 1))
                      if block:
                          self._block_internal(subject, self._req(block_reason or conclusion, "block_reason"))
                  return self.get_investigation(inv_id)

              def _block_internal(self, subject_account, reason):
                  block_id = _nid("BLK-")
                  self._run(
                      "INSERT INTO sbs_blocks (block_id, subject_account,"
                      " reason, status, created_at, released_at)"
                      " VALUES (?, ?, ?, 'active', ?, NULL)",
                      (block_id, subject_account, reason, _now()),
                  )
                  return block_id

              def block_account(self, *, subject_account, reason, actor):
                  subject_account = self._req(subject_account, "subject_account")
                  reason = self._req(reason, "reason")
                  self._req(actor, "actor")
                  with self._lock:
                      block_id = self._block_internal(subject_account, reason)
                  return {"block_id": block_id, "subject_account": subject_account, "status": "active"}

              def is_blocked(self, account):
                  account = str(account or "").strip()
                  if not account:
                      return False
                  rows = self._rows(
                      "SELECT block_id FROM sbs_blocks WHERE subject_account = "
                      + self._literal(account)
                      + " AND status = 'active' LIMIT 1"
                  )
                  return bool(rows)

              def list_blocks(self):
                  out = []
                  for row in self._rows(
                      "SELECT block_id, subject_account, reason, status,"
                      " created_at, released_at FROM sbs_blocks"
                      " ORDER BY created_at DESC"
                  ):
                      out.append({
                          "block_id": self._field(row, "a", 0),
                          "subject_account": self._field(row, "b", 1),
                          "reason": self._field(row, "c", 2),
                          "status": self._field(row, "d", 3),
                          "created_at": self._field(row, "e", 4),
                          "released_at": self._field(row, "f", 5),
                      })
                  return out


