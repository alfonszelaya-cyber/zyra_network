          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
