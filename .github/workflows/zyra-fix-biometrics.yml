name: ZYRA A4b acceso directo y codigo del proxy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faseA4b:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography

      - name: Acceso directo al laboratorio y dump del proxy
        run: |
          python3 - <<'PYEOF'
          import json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)
          ZID = 'Z-PRUEBA-CI-0001'

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseA4b.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _man

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def pedir(url, headers=None):
              req = urllib.request.Request(url)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=8) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, '', str(e)

          add('# A4b - ACCESO DIRECTO (sin proxy) + CODIGO DEL PROXY')
          add('')
          add('Si el acceso directo con x-zyra-zid abre la UI, el laboratorio esta')
          add('confirmado y la unica edicion necesaria es en _proxy de superapp.py.')
          add('')

          add('## D1. Sistema arriba')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-a4b', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-a4b', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _c, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          salud = {}
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _c, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          salud = json.loads(cuerpo).get('apps', {})
                      except Exception:
                          salud = {}
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(salud)))
          add('')

          add('## D2. Puerto interno del laboratorio (lo publica /health)')
          add('')
          lab_info = salud.get('/laboratorio', {})
          puerto = lab_info.get('port')
          add('- informacion: %s' % json.dumps(lab_info)[:200])
          gate_tiene_puerto = isinstance(puerto, int)
          add('- puerto interno: %s' % puerto)
          add('')

          abierto = False
          menus = []
          if gate_tiene_puerto:
              add('## D3. ACCESO DIRECTO con x-zyra-zid (sin pasar por el proxy)')
              add('')
              INT = 'http://127.0.0.1:%d' % puerto
              hdr = {'x-zyra-zid': ZID}
              st, ct, cuerpo = pedir(INT + '/laboratorio/ui', hdr)
              es_html = 'text/html' in ct.lower()
              abierto = (st == 200 and es_html)
              add('- GET interno /laboratorio/ui -> %s (%s) %s' % (st, 'HTML' if es_html else ct[:20], 'ABRE' if abierto else ''))
              if abierto:
                  add('')
                  add('**CONFIRMADO: el laboratorio funciona con x-zyra-zid. La pieza que falta es el proxy de la SuperApp.**')
                  add('')
                  add('## D4. Menus reales de la UI')
                  add('')
                  menus = sorted(set(re.findall(r'/laboratorio/ui/([a-z0-9_\-]{2,40})', cuerpo)))
                  add('- menu_id: %d' % len(menus))
                  for m in menus[:30]:
                      add('  - %s' % m)
                  DATA['menus'] = menus
                  if menus:
                      st2, ct2, c2 = pedir(INT + '/laboratorio/ui/' + menus[0], hdr)
                      add('- panel %s -> %s (%s)' % (menus[0], st2, 'HTML' if 'html' in ct2.lower() else ct2[:20]))
              else:
                  add('- cuerpo de la respuesta: %s' % cuerpo[:200])
          else:
              add('## D3. Sin puerto interno: no se puede probar directo')
          gate('laboratorio_abre_directo', abierto)
          add('')

          add('## D5. Codigo del proxy de superapp.py (para la edicion exacta)')
          add('')
          ls = txt(ROOT / 'superapp.py').splitlines()
          add('```python')
          for i in range(240, min(400, len(ls))):
              add('%d: %s' % (i + 1, ls[i].rstrip()[:150]))
          add('```')
          add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          add('## Siguiente (A4c)')
          add('')
          add('1. El proxy inyecta x-zyra-zid y x-zyra-roles en lo que reenvia a las apps.')
          add('2. La portada del laboratorio gana un formulario simple de identificacion (ZID)')
          add('   y sus tarjetas pasan a apuntar a los menus reales.')
          add('3. Nota honesta: ese puente permite VER la UI con un ZID. La validacion real')
          add('   del ZID contra la Red es parte del trabajo estructural ZID/SSO que ya')
          add('   tienes en la guia; aqui se abre la puerta, no se falsifica la llave.')
          add('')

          DATA['abierto'] = abierto
          Path('faseA4b.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('A4b terminada. Abierto directo:', abierto, '| menus:', len(menus))
          PYEOF

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseA4b-zyra
          path: faseA4b.json
          if-no-files-found: ignore
