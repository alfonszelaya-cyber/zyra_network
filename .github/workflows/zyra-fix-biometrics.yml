              for menu, marca in checks.items():
                  status, _, html, _ = llamada("GET", "/laboratorio/ui/" + menu, headers=H_DUENO)
                  assert status == 200, menu + " status=" + str(status)
                  texto = html.decode("utf-8")
                  assert "EN VIVO" in texto, menu + " debe estar EN VIVO"
                  assert texto.count('data-accion=') == 3, menu + " Ley 3, hay " + str(texto.count('data-accion='))
                  assert marca in texto, menu + " falta " + marca
              status, _, html, _ = llamada("GET", "/laboratorio/ui/simular", headers=H_DUENO)
              texto = html.decode("utf-8")
              assert "ROI" in texto, "metricas reales de simulacion listadas"
              status, _, html, _ = llamada("GET", "/laboratorio/ui/comparar", headers=H_DUENO)
              texto = html.decode("utf-8")
              assert "informe" in texto and "Plan mejorado" in texto
              status, _, html, _ = llamada("GET", "/laboratorio/ui/optimizar", headers=H_DUENO)
              texto = html.decode("utf-8")
              assert "aplicada" in texto and "data-aplicar" not in texto.replace("data-aplicar=\"", "X", 1)

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              total = len(cuerpo["datos"]["rutas"])
              assert total == 45, "se esperaban 45 rutas (38 + 7 de decision), hay " + str(total)

          def t_motores_unitarios():
              motor = MotorEvolucionReal()
              caps = motor.capacidades()
              assert caps["horizonte_anios"] == (1, 30)
              op = MotorOptimizacionReal()
              s = op.sugerir({"costo": 60, "beneficio": 50, "riesgo": 50})
              assert s["parametros_optimizados"]["costo"] == 48.0
              assert s["parametros_optimizados"]["riesgo"] == 35.0
              assert s["parametros_optimizados"]["beneficio"] == 57.5

          def t_plantillas_completas():
              assert verificar_plantillas() == 13

          sum_write("")
          sum_write("### Pruebas end-to-end Fase 5 (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Migracion v5 + proyecto con 3 escenarios evaluados", preparar)
          check("Simular evolucion: equilibrio, ROI, tendencia", t_simular)
          check("Simulacion con horizonte/crecimiento invalidos (400)", t_simular_invalido)
          check("Comparar: ganador B con brecha 9.0", t_comparar)
          check("Informe HTML descargable", t_informe_html)
          check("Comparar sin evaluaciones rechazado (400)", t_comparar_sin_evaluaciones)
          check("Optimizar: 3 reglas y proyeccion 36 a 47.6", t_optimizar)
          check("Escenario ya optimizado rechazado (400)", t_optimizar_sin_margen)
          check("Aplicar: escenario C real con puntaje 47.6", t_aplicar)
          check("403 espectador en comparar y optimizar", t_permisos_403)
          check("UI: 4 paneles de decision EN VIVO con Ley 3", t_ui_paneles_fase5)
          check("Indice publico: 45 rutas", t_indice_publico)
          check("Motores unitarios verificados", t_motores_unitarios)
          check("13 plantillas verificadas", t_plantillas_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 5 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 5A aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 5A - Fase 5 motor de decision simular probar comparar optimizar"
            git push
          fi
