name: "ZYRA NEXO E1b v2: reparar 4 archivos finance"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Escribir 4 finance faltantes
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)

          FIN = "apps/nexo/domain/finance"

          MASTER = D(r'''
              # Zyra_finance_master.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from decimal import Decimal
              from typing import Dict
              import uuid

              from apps.nexo.domain.accounting.accounting_engine import (
                  AccountingEngine)
              from apps.nexo.domain.accounting.balance_engine import (
                  BalanceEngine)
              from apps.nexo.domain.accounting.journal_engine import (
                  JournalEngine)
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database


              class ZyraFinanceMaster:
                  """Motor Financiero Maestro (Decimal,
                  sobre engines persistentes)."""

                  def __init__(self, db: Database, clock: Clock, *,
                               audit=None) -> None:
                      self.accounting_engine = AccountingEngine(
                          db, clock, audit=audit)
                      self.balance_engine = BalanceEngine(db, clock)
                      self.journal_engine = JournalEngine(db, clock)
                      self._clock = clock

                  def _calculate_totals(self) -> Dict:
                      entries = self.accounting_engine.get_entries()
                      revenue = Decimal("0")
                      expenses = Decimal("0")
                      for entry in entries:
                          amount = Decimal(str(entry.get("amount", "0")))
                          if entry.get("entry_type") == "CREDIT":
                              revenue += amount
                          else:
                              expenses += amount
                      profit = revenue - expenses
                      return {"revenue": str(revenue),
                              "expenses": str(expenses),
                              "taxes": str(Decimal("0")),
                              "profit": str(profit)}

                  def generar_reporte_maestro(self) -> Dict:
                      totals = self._calculate_totals()
                      return {"report_id": f"FIN-{uuid.uuid4()}",
                              "generated_at": self._clock.now(),
                              "report_type": "MASTER_FINANCIAL",
                              "revenue": totals["revenue"],
                              "expenses": totals["expenses"],
                              "taxes": totals["taxes"],
                              "profit": totals["profit"],
                              "total_entries": len(
                                  self.accounting_engine.get_entries()),
                              "status": "GENERATED"}

                  def dashboard_snapshot(self) -> Dict:
                      report = self.generar_reporte_maestro()
                      return {"generated_at": report["generated_at"],
                              "revenue": report["revenue"],
                              "expenses": report["expenses"],
                              "profit": report["profit"],
                              "status": "ACTIVE"}

                  def summary(self) -> Dict:
                      report = self.generar_reporte_maestro()
                      return {"report_id": report["report_id"],
                              "profit": report["profit"],
                              "entries": report["total_entries"],
                              "generated_at": report["generated_at"]}
          ''')

          DECLARATION = D(r'''
              # declaration_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from typing import Dict, List, Optional
              import uuid

              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration,
                  MigrationRunner,
              )

              _MIGRATIONS = (
                  Migration(1, "fiscal_declarations", (
                      "CREATE TABLE IF NOT EXISTS fiscal_declarations ("
                      " declaration_id TEXT PRIMARY KEY,"
                      " declaration_json TEXT NOT NULL,"
                      " declaration_type TEXT NOT NULL DEFAULT '',"
                      " status TEXT NOT NULL DEFAULT 'REGISTERED',"
                      " created_at REAL NOT NULL)",
                  )),
              )


              class DeclarationEngine:
                  """Motor de declaraciones fiscales
                  (persistente, Hacienda-ready)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.declaration",
                                      _MIGRATIONS).run(clock)

                  def add_declaration(self, declaration: Dict) -> Dict:
                      import json as _j
                      did = f"DEC-{uuid.uuid4()}"
                      now = self._clock.now()
                      dtype = str(declaration.get("type", ""))
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO fiscal_declarations"
                              " (declaration_id, declaration_json,"
                              " declaration_type, status, created_at)"
                              " VALUES (?, ?, ?, 'REGISTERED', ?)",
                              (did, _j.dumps(declaration, default=str),
                               dtype, now))
                      return {"declaration_id": did,
                              "declaration": declaration,
                              "status": "REGISTERED",
                              "created_at": now}

                  def get_all_declarations(self) -> List[Dict]:
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM fiscal_declarations"
                          " ORDER BY created_at")
                      return [{"declaration_id": str(r["declaration_id"]),
                               "declaration": _j.loads(
                                   str(r["declaration_json"])),
                               "status": str(r["status"]),
                               "created_at": float(r["created_at"])}
                              for r in rows]

                  def get_declaration(self, declaration_id: str) -> Optional[Dict]:
                      for d in self.get_all_declarations():
                          if d["declaration_id"] == declaration_id:
                              return d
                      return None

                  def get_declarations_by_type(self, declaration_type: str) -> List[Dict]:
                      return [d for d in self.get_all_declarations()
                              if d["declaration"].get("type")
                              == declaration_type]

                  def get_summary(self) -> Dict:
                      return {"total_declarations":
                              len(self.get_all_declarations()),
                              "generated_at": self._clock.now()}

                  def generate_report(self) -> Dict:
                      return {"report_type": "FISCAL_DECLARATIONS",
                              "records": len(self.get_all_declarations()),
                              "summary": self.get_summary(),
                              "generated_at": self._clock.now()}
          ''')

          FISCAL_DOC = D(r'''
              # document_fiscal_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from typing import Dict, List, Optional
              import uuid

              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration,
                  MigrationRunner,
              )

              _MIGRATIONS = (
                  Migration(1, "fiscal_documents", (
                      "CREATE TABLE IF NOT EXISTS fiscal_documents ("
                      " document_id TEXT PRIMARY KEY,"
                      " document_json TEXT NOT NULL,"
                      " pais TEXT NOT NULL DEFAULT '',"
                      " cliente_id TEXT NOT NULL DEFAULT '',"
                      " status TEXT NOT NULL DEFAULT 'ISSUED',"
                      " created_at REAL NOT NULL)",
                  )),
                  Migration(2, "fiscal_simulations", (
                      "CREATE TABLE IF NOT EXISTS fiscal_simulations ("
                      " simulation_id TEXT PRIMARY KEY,"
                      " simulation_json TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                  )),
              )


              class FiscalDocumentEngine:
                  """Documentos fiscales: simulacion
                  + emision (persistente)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.fiscaldoc",
                                      _MIGRATIONS).run(clock)

                  def simular_documento(self, document: Dict) -> Dict:
                      import json as _j
                      total = (document.get("totales", {})
                               .get("total", 0))
                      valid = True
                      risk = "LOW"
                      observations = []
                      try:
                          if float(total) <= 0:
                              valid = False
                              risk = "HIGH"
                              observations.append("INVALID_TOTAL")
                      except Exception:
                          valid = False
                          risk = "HIGH"
                          observations.append("INVALID_TOTAL")
                      sid = f"SIM-{uuid.uuid4()}"
                      record = {"simulation_id": sid,
                                "created_at": self._clock.now(),
                                "valid": valid, "risk": risk,
                                "observations": observations,
                                "preview": document}
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO fiscal_simulations"
                              " (simulation_id, simulation_json,"
                              " created_at) VALUES (?, ?, ?)",
                              (sid, _j.dumps(record, default=str),
                               self._clock.now()))
                      return record

                  def generar_documento(self, document: Dict) -> Dict:
                      import json as _j
                      did = f"DOC-{uuid.uuid4()}"
                      now = self._clock.now()
                      pais = str(document.get("pais", ""))
                      cliente = str((document.get("cliente", {})
                                     .get("id", "")))
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO fiscal_documents"
                              " (document_id, document_json,"
                              " pais, cliente_id, status, created_at)"
                              " VALUES (?, ?, ?, ?, 'ISSUED', ?)",
                              (did, _j.dumps(document, default=str),
                               pais, cliente, now))
                      return {"document_id": did,
                              "created_at": now,
                              "status": "ISSUED",
                              "document": document}

                  def get_all_documents(self) -> List[Dict]:
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM fiscal_documents"
                          " ORDER BY created_at")
                      return [{"document_id": str(r["document_id"]),
                               "created_at": float(r["created_at"]),
                               "status": str(r["status"]),
                               "document": _j.loads(
                                   str(r["document_json"]))}
                              for r in rows]

                  def get_document(self, document_id: str) -> Optional[Dict]:
                      for d in self.get_all_documents():
                          if d["document_id"] == document_id:
                              return d
                      return None

                  def documentos_por_pais(self, pais: str) -> List[Dict]:
                      return [d for d in self.get_all_documents()
                              if d["document"].get("pais") == pais]

                  def documentos_por_cliente(self, cliente_id: str) -> List[Dict]:
                      return [d for d in self.get_all_documents()
                              if (d["document"].get("cliente", {})
                                  .get("id") == cliente_id)]

                  def get_summary(self) -> Dict:
                      return {"documents": len(self.get_all_documents()),
                              "generated_at": self._clock.now()}
          ''')

          TAX = D(r'''
              # tax_declarations.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from decimal import Decimal
              from typing import Dict, List, Optional

              from apps.nexo.domain.accounting.accounting_engine import (
                  AccountingEngine)
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database


              class TaxDeclarationsEngine:
                  """Motor Fiscal (Decimal, sobre el
                  AccountingEngine persistente)."""

                  def __init__(self, db: Database, clock: Clock, *,
                               accounting_engine: AccountingEngine = None,
                               audit=None) -> None:
                      self.accounting_engine = (
                          accounting_engine
                          or AccountingEngine(
                              db, clock, audit=audit))
                      self._db = db
                      self._clock = clock

                  def calcular_acumulados(self,
                                          company_id: Optional[str] = None) -> Dict:
                      ingresos = Decimal("0")
                      gastos = Decimal("0")
                      for entry in self.accounting_engine.get_entries():
                          amount = Decimal(str(entry.get("amount", "0")))
                          if entry.get("entry_type") == "CREDIT":
                              ingresos += amount
                          else:
                              gastos += amount
                      utilidad = ingresos - gastos
                      return {"ingresos": str(ingresos),
                              "gastos": str(gastos),
                              "utilidad": str(utilidad)}

                  def generar_declaracion_mensual(self, *,
                      company_id: str, jurisdiction: str,
                      month: int, year: int) -> Dict:
                      acumulados = self.calcular_acumulados(company_id)
                      return {"declaration_id": f"TAX-{month}-{year}-{company_id}",
                              "company_id": company_id,
                              "jurisdiction": jurisdiction,
                              "month": month, "year": year,
                              "acumulados": acumulados,
                              "status": "GENERATED",
                              "created_at": self._clock.now()}

                  def get_summary(self) -> Dict:
                      return {"generated_at": self._clock.now()}
          ''')

          for nombre, marca, contenido in (
              (FIN + "/Zyra_finance_master.py", "class ZyraFinanceMaster", MASTER),
              (FIN + "/declaration_engine.py", "class DeclarationEngine", DECLARATION),
              (FIN + "/document_fiscal_engine.py", "class FiscalDocumentEngine", FISCAL_DOC),
              (FIN + "/tax_declarations.py", "class TaxDeclarationsEngine", TAX),
          ):
              try:
                  p = pathlib.Path(nombre)
                  if p.exists() and marca in p.read_text(encoding="utf-8"):
                      out("- **" + nombre.split("/")[-1] + ": YA**")
                      continue
                  ast.parse(contenido)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  out("- **" + nombre.split("/")[-1] + ": OK**")
              except Exception:
                  out("- **" + nombre.split("/")[-1] + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          try:
              ip = pathlib.Path(FIN) / "__init__.py"
              if not ip.exists():
                  ip.write_text("", encoding="utf-8")
              lista = sorted(f.name for f in pathlib.Path(FIN).iterdir())
              out("- **carpeta finance contiene:** " + str(lista))
          except Exception:
              pass
          exit(0)
          EOF

      - name: "B1: tests finance + use cases"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          if [ ! -f apps/nexo/tests/test_finance_migrated.py ]; then
          cat > apps/nexo/tests/test_finance_migrated.py << 'PYEOF'
          import pytest
          from decimal import Decimal
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.audit.chain import AuditTrail
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.accounting.accounting_engine import AccountingEngine
          from apps.nexo.domain.accounting.journal_engine import JournalEngine
          from apps.nexo.domain.finance.Zyra_finance_master import ZyraFinanceMaster
          from apps.nexo.domain.finance.declaration_engine import DeclarationEngine
          from apps.nexo.domain.finance.document_fiscal_engine import FiscalDocumentEngine
          from apps.nexo.domain.finance.finanzas_total import FinanzasTotal
          from apps.nexo.domain.finance.tax_declarations import TaxDeclarationsEngine
          from apps.nexo.application.accounting_use_cases.create_journal_entry_use_case import CreateJournalEntryUseCase
          from apps.nexo.application.accounting_use_cases.validate_accounting_use_case import ValidateAccountingUseCase
          from apps.nexo.application.accounting_use_cases.reconcile_accounts_use_case import ReconcileAccountsUseCase


          def _db(tmp_path):
              return SQLiteAdapter(tmp_path / "fin.db")


          def test_finance_master_pnl(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              master = ZyraFinanceMaster(db, clock, audit=AuditTrail(db, clock))
              master.accounting_engine.create_entry(account_code="4001", amount="1000.00", entry_type="CREDIT", description="venta")
              master.accounting_engine.create_entry(account_code="5001", amount="400.00", entry_type="DEBIT", description="costo")
              r = master.generar_reporte_maestro()
              assert Decimal(r["revenue"]) == Decimal("1000.00")
              assert Decimal(r["profit"]) == Decimal("600.00")
              print("OK: finance master PNL 1000-400=600")


          def test_tax_declarations(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              tax = TaxDeclarationsEngine(db, clock, audit=AuditTrail(db, clock))
              tax.accounting_engine.create_entry(account_code="4001", amount="2000.00", entry_type="CREDIT", description="venta")
              tax.accounting_engine.create_entry(account_code="5001", amount="800.00", entry_type="DEBIT", description="gasto")
              acc = tax.calcular_acumulados()
              assert Decimal(acc["ingresos"]) == Decimal("2000.00")
              assert Decimal(acc["utilidad"]) == Decimal("1200.00")
              d = tax.generar_declaracion_mensual(company_id="C1", jurisdiction="SV", month=1, year=2026)
              assert d["status"] == "GENERATED"
              print("OK: fiscal acumulados + declaracion mensual")


          def test_fiscal_documents(tmp_path) -> None:
              db = _db(tmp_path)
              eng = FiscalDocumentEngine(db, FrozenClock())
              sim = eng.simular_documento({"totales": {"total": 100}, "pais": "SV"})
              assert sim["valid"] is True
              bad = eng.simular_documento({"totales": {"total": 0}})
              assert bad["valid"] is False
              doc = eng.generar_documento({"totales": {"total": 100}, "pais": "SV", "cliente": {"id": "C1"}})
              assert doc["status"] == "ISSUED"
              assert len(eng.documentos_por_pais("SV")) == 1
              print("OK: fiscal docs simulacion + emision")


          def test_finanzas_total(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              ft = FinanzasTotal(db, clock, audit=AuditTrail(db, clock))
              ft.accounting_engine.create_entry(account_code="4001", amount="500.00", entry_type="CREDIT", description="v")
              ft.accounting_engine.create_entry(account_code="5001", amount="300.00", entry_type="DEBIT", description="e")
              r = ft.generar_reporte_maestro()
              assert Decimal(r["metricas"]["ganancia_neta"]) == Decimal("200.00")
              assert r["asientos_contables"] == 2
              print("OK: finanzas_total ganancia 200")


          def test_use_case_journal_entry(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              eng = AccountingEngine(db, clock, audit=AuditTrail(db, clock))
              jrn = JournalEngine(db, clock)
              uc = CreateJournalEntryUseCase(eng, jrn)
              r = uc.execute(company_id="C1", debit_account="1101", credit_account="4001", amount="250.00", description="venta", created_by="contador")
              assert Decimal(r["amount"]) == Decimal("250.00")
              assert r["debit"]["entry_type"] == "DEBIT"
              assert r["credit"]["entry_type"] == "CREDIT"
              print("OK: use case partida doble 250")


          def test_use_case_validate(tmp_path) -> None:
              db = _db(tmp_path)
              uc = ValidateAccountingUseCase(AccountingValidationEngine(db, FrozenClock()))
              r = uc.execute(journal_entry={"account_code": "1101", "amount": "50", "entry_type": "DEBIT"})
              assert r["valid"] is True
              print("OK: use case validate")
          PYEOF
          fi
          timeout 120 python3 -m pytest apps/nexo/tests/test_finance_migrated.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/b1.out 2>&1
          echo $? > /tmp/b1
          if [ "$(cat /tmp/b1)" = "0" ]; then echo "- B1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- B1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### B1 detalle"; echo '```'; tail -80 /tmp/b1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "B2: nexo completo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/b2.out 2>&1
          echo $? > /tmp/b2
          if [ "$(cat /tmp/b2)" = "0" ]; then echo "- B2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- B2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### B2 detalle"; echo '```'; tail -50 /tmp/b2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "B3: apps otras + shared"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/b3.out 2>&1
          echo $? > /tmp/b3
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/b3b.out 2>&1
          ok3=$?
          if [ "$(cat /tmp/b3)" = "0" ] && [ "$ok3" = "0" ]; then echo "- B3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- B3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### B3 detalle"; echo '```'; tail -60 /tmp/b3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in b1 b2 b3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: B1-B3 VERDES — LOTE 1b COMPLETO**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-E1b): finance migrado completo (FinanceMaster, DeclarationEngine, FiscalDocumentEngine, TaxDeclarations, FinanzasTotal) + 6 use cases contables (B1-B3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 1b CERRADO. Sigue LOTE 2 clients.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
