                          " accumulated_depreciation = ? WHERE"
                          " asset_id = ?", (str(new_dep),
                                            asset_id))
                      return self.get_asset(asset_id)

                  def dispose(self, *, asset_id, reason="") -> dict:
                      self._db.execute(
                          "UPDATE nexo_fixed_assets SET"
                          " status = 'DISPOSED' WHERE"
                          " asset_id = ?", (asset_id,))
