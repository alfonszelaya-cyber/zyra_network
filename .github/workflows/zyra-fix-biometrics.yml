name: ZYRA Auditoría Biométrica del Registro

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyra-audit-biometrica
  cancel-in-progress: false

jobs:
  auditoria:
    name: Red + Registro biométrico (solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Ejecutar auditoría (solo lectura, no crea nada en el repo)
        run: |
          cat > "$RUNNER_TEMP/auditoria_biometrica.py" << 'PYEOF'
          # -*- coding: utf-8 -*-
          # ZYRA Auditoría Biométrica del Registro de Persona — SOLO LECTURA.
          # No crea ni modifica ningún archivo dentro del repositorio.
          import os, re, json, sqlite3, sys, datetime, warnings
          from collections import Counter, defaultdict

          ROOT = os.path.abspath(sys.argv[1]) if len(sys.argv) > 1 else os.getcwd()
          OUT = os.path.abspath(sys.argv[2]) if len(sys.argv) > 2 else "/tmp"
          os.makedirs(OUT, exist_ok=True)
          FECHA = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          SKIP_DIRS = {".git", "node_modules", "__pycache__", ".venv", "venv", "env", "dist", "build", ".github", ".idea", ".vscode", ".cache"}
          TEXT_EXT = {".py", ".yml", ".yaml", ".json", ".txt", ".md", ".sql", ".html", ".js", ".sh", ".cfg", ".ini", ".toml", ".xml", ".css", ".env", ".example", ".csv"}
          MODEL_EXT = {".onnx", ".pth", ".pt", ".tflite", ".pb", ".h5", ".pkl", ".joblib", ".safetensors"}
          DB_EXT = {".db", ".sqlite", ".sqlite3"}

          findings = []
          def add(cat, sev, fid, msg, file=""):
              findings.append({"cat": cat, "sev": sev, "id": fid, "msg": msg, "file": file})

          def read_text(path, limit=1500000):
              try:
                  if os.path.getsize(path) > limit:
                      return ""
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      return f.read()
              except Exception:
                  return ""

          def safe(fn, label, default):
              try:
                  return fn()
              except Exception as e:
                  add("calidad", "blue", "AUD-ERR", "Sección '" + label + "' con problema: " + str(e)[:140])
                  return default

          def zone_of(rel):
              parts = rel.split("/")
              if parts[0] == "shared_engines" and len(parts) >= 2:
                  return "shared_engines/" + parts[1]
              if parts[0] == "apps" and len(parts) >= 2:
                  return "apps/" + parts[1]
              if parts[0] in ("shared_engines", "apps"):
                  return parts[0]
              return "raíz/otros"

          def S1_inventario():
              files = []
              for dp, dn, fn in os.walk(ROOT):
                  dn[:] = [d for d in dn if d not in SKIP_DIRS]
                  for f in fn:
                      p = os.path.join(dp, f)
                      try:
                          sz = os.path.getsize(p)
                      except OSError:
                          continue
                      files.append((os.path.relpath(p, ROOT).replace(os.sep, "/"), sz))
              def subdirs(prefix):
                  out = set()
                  for r, _ in files:
                      if r.startswith(prefix):
                          parts = r.split("/")
                          if len(parts) >= 2 and (len(parts) > 2 or "." not in parts[1]):
                              out.add(parts[1])
                  return sorted(out)
              return {"files": files, "total_files": len(files),
                      "total_mb": round(sum(s for _, s in files) / 1048576.0, 1),
                      "py_all": [r for r, s in files if r.lower().endswith(".py")],
                      "engines": subdirs("shared_engines/"), "apps": subdirs("apps/")}

          CONTENT_BIO = re.compile(r"(biometr|biomic|\bfacial\b|\bface\b|\bfaces\b|rostro|fingerprint|huella|dactilar|\biris\b|liveness|viveza|selfie|enroll|enrolamiento|sface|insightface|deepface|prueba\s+de\s+vida|\bonnx)", re.I)
          NAME_CORE = re.compile(r"(biometr|facial|face|rostro|fingerprint|huella|dactilar|iris|liveness|viveza|selfie|enroll|enrol|sface|voiceprint|voz|identidad|identity|zid|kyc|credencial|credential)", re.I)
          CORE_DIRS = ("shared_engines/security/", "shared_engines/verification/", "shared_engines/verifier/", "shared_engines/authority/")

          def S2_biometrico():
              txt = {}
              bio_named, bio_content = [], []
              for r, s in all_files:
                  ext = os.path.splitext(r)[1].lower()
                  base = os.path.basename(r)
                  if ext in MODEL_EXT or NAME_CORE.search(base):
                      bio_named.append(r)
                  t = ""
                  if ext in TEXT_EXT and s < 1500000:
                      t = read_text(os.path.join(ROOT, r))
                      if r.endswith(".py"):
                          txt[r] = t
                  if t and CONTENT_BIO.search(t):
                      bio_content.append(r)
              bio_all = sorted(set(bio_named) | set(bio_content))
              bp = set(r for r in bio_all if r.endswith(".py"))
              bp |= set(r for r in py_all if r.startswith(CORE_DIRS))
              bp |= set(r for r in py_all if "/identity" in r.lower() or "/identidad" in r.lower())
              for x in ("main.py", "superapp.py"):
                  if x in py_all and x not in txt:
                      txt[x] = read_text(os.path.join(ROOT, x))
              return {"txt": txt, "bio_all": bio_all, "bio_py": sorted(bp)}

          STAGES = [
              ("1. Captura de imagen / selfie", re.compile(r"(capture|captura|videocapture|webcam|c[aá]mara|camera|selfie|upload)", re.I)),
              ("2. Control de calidad de captura", re.compile(r"(blur|desenfoqu|calidad|quality|brillo|brightness|contraste|resoluci[oó]n|min_?face|confianza|confidence)", re.I)),
              ("3. Prueba de vida (liveness)", re.compile(r"(liveness|viveza|spoof|prueba\s+de\s+vida)", re.I)),
              ("4. Extracción de plantilla / embedding", re.compile(r"(embed|descriptor|plantilla|template|sface|recogni|encoding)", re.I)),
              ("5. Almacenamiento biométrico", re.compile(r"(insert\s+into|sqlite|executemany|almacen|persist|guardar|\bsave\b)", re.I)),
              ("6. Vinculación con ZID / identidad", re.compile(r"(\bzid\b|identidad|identity)", re.I)),
              ("7. Verificación / comparación 1:1", re.compile(r"(verif|verify|\bmatch|comparaci|similarity|similitud|cosine|euclid)", re.I)),
          ]

          def S3_flujo():
              scan = set(bio_py)
              for x in ("main.py", "superapp.py"):
                  if x in py_all:
                      scan.add(x)
              scan = sorted(scan)
              status = []
              for name, rx in STAGES:
                  hits = [r for r in scan if rx.search(txt.get(r, "") or "")]
                  status.append({"etapa": name, "ok": bool(hits), "evidencia": hits[:3]})
                  if not hits:
                      add("flujo", "orange", "BIO-FLOW", "Etapa del registro biométrico NO detectada en el código: " + name)
              return status

          ROUTE = re.compile(r"@(?:app|router|api|blueprint|bp)\.(?:route|get|post|put|delete|patch)\s*\(\s*[\"']([^\"']{1,120})[\"']", re.I)

          def S3b_rutas():
              out = []
              scan = sorted(set(bio_py) | {x for x in ("main.py", "superapp.py") if x in py_all})
              for r in scan:
                  for m in ROUTE.finditer(txt.get(r, "") or ""):
                      out.append({"file": r, "ruta": m.group(1)})
              return out

          PLACEHOLDER_VAL = re.compile(r"(tu_|your_|xxx|changeme|change_me|example|sample|placeholder|dummy|fake|mi_clave|my_key|aqu[ií]|valor_|clave_|inserte|qwerty|asdf|abcd|123456|password123|secreto|\$\{|\{\{|<[^>]{0,40}>)", re.I)
          SECRET_NAMED = [
              (re.compile(r"AKIA[0-9A-Z]{16}"), "credencial estilo AWS (AKIA...)"),
              (re.compile(r"ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}"), "token de GitHub"),
              (re.compile(r"-----BEGIN[A-Z ]*PRIVATE KEY-----"), "clave privada embebida"),
              (re.compile(r"AIza[0-9A-Za-z_\-]{30,}"), "clave de API de Google"),
              (re.compile(r"\bsk-[A-Za-z0-9]{20,}"), "clave de API estilo sk-..."),
          ]
          KV_SECRET = re.compile(r"(?:api[_-]?key|apikey|secret|token|password|passwd|pwd|private[_-]?key)\s*[=:]\s*[\"']([^\"']{12,})[\"']", re.I)

          def S4_secretos():
              hits = []
              for r, s in all_files:
                  ext = os.path.splitext(r)[1].lower()
                  if ext not in TEXT_EXT or s > 1500000:
                      continue
                  t = read_text(os.path.join(ROOT, r))
                  if not t:
                      continue
                  kinds = []
                  for rx, k in SECRET_NAMED:
                      if rx.search(t):
                          kinds.append(k)
                  for m in KV_SECRET.finditer(t):
                      v = m.group(1)
                      if len(v) >= 12 and not PLACEHOLDER_VAL.search(v) and any(c.isdigit() for c in v):
                          kinds.append("secreto embebido (clave=valor)")
                          break
                  if kinds:
                      hits.append((r, sorted(set(kinds))[0]))
              return hits

          def S4b_env():
              rep = {}
              for r, s in all_files:
                  b = os.path.basename(r).lower()
                  if b.startswith(".env") or b.endswith(".env"):
                      vals = []
                      for line in read_text(os.path.join(ROOT, r), 200000).splitlines():
                          line = line.strip()
                          if not line or line.startswith("#") or "=" not in line:
                              continue
                          k, v = line.split("=", 1)
                          v = v.strip().strip("\"'")
                          if len(v) >= 14 and any(c.isdigit() for c in v) and any(c.isalpha() for c in v) and not PLACEHOLDER_VAL.search(v):
                              vals.append(k.strip())
                      rep[r] = vals
              return rep

          STORE = re.compile(r"(insert\s+into|executemany|sqlite3?\.connect|imwrite|\.save\(|open\s*\([^)]*[\"']wb[\"'])", re.I)
          ENC = re.compile(r"(encrypt|cifrad|cipher|fernet|\baes\b|sha\d|hash|salt|\brsa\b|\becc\b|pbkdf|bcrypt|argon|seal)", re.I)

          def S4c_cifrado():
              out = []
              for r in bio_py:
                  t = txt.get(r, "") or ""
                  if t and STORE.search(t) and CONTENT_BIO.search(t) and not ENC.search(t):
                      out.append(r)
              return out

          BIO_COL = re.compile(r"(template|plantilla|\bface|rostro|biometr|huella|selfie|\bfoto\b|photo|imagen|embed|voiceprint)", re.I)
          SAFE_COL = re.compile(r"(hash|_enc|cipher|cifr|digest|token|salt)", re.I)

          def S4d_bd():
              rep = []
              for r, s in all_files:
                  if os.path.splitext(r)[1].lower() not in DB_EXT or s > 200000000:
                      continue
                  entry = {"db": r, "tablas": 0, "biometricas": []}
                  try:
                      con = sqlite3.connect("file:" + os.path.join(ROOT, r) + "?mode=ro", uri=True)
                      cur = con.cursor()
                      tabs = cur.execute("SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'").fetchall()
                      entry["tablas"] = len(tabs)
                      for name, sql in tabs:
                          sq = sql or ""
                          if BIO_COL.search(sq):
                              entry["biometricas"].append(name)
                              if not SAFE_COL.search(sq):
                                  add("seguridad", "orange", "BIO-DB", "BD '" + r + "' tabla '" + name + "' guarda columnas biométricas aparentemente SIN cifrado/hash", r)
                      con.close()
                  except Exception as e:
                      entry["error"] = str(e)[:120]
                  rep.append(entry)
              if not rep:
                  add("seguridad", "blue", "BIO-DB", "Sin archivos de BD dentro del repo (las bases viven fuera; no se pudo inspeccionar el esquema)")
              return rep

          AUTH = re.compile(r"(auth|token|jwt|session|login|Depends|middleware|api[_-]?key|x-api-key|permission|permiso)", re.I)

          def S4e_auth():
              out, seen = [], set()
              for e in routes:
                  f = e["file"]
                  if f in seen:
                      continue
                  seen.add(f)
                  t = txt.get(f, "") or ""
                  if t and not AUTH.search(t):
                      out.append(f)
              return out

          CONSENT = re.compile(r"(consent|consentimiento|privacidad|privacy|gdpr|rgpd|habeas|minimizaci[oó]n)", re.I)
          RETENTION = re.compile(r"(retenci[oó]n|retention|expir|purga|purge|borrado\s+de\s+datos|derecho\s+al\s+olvido|delete\s+from)", re.I)
          LEAK = re.compile(r"(print|logger|logging)\s*\(.{0,100}(image|imagen|template|plantilla|embed|selfie|foto|face|rostro|base64|b64)", re.I)

          def S5_privacidad():
              consent = [r for r in bio_py if CONSENT.search(txt.get(r, "") or "")]
              reten = [r for r in bio_py if RETENTION.search(txt.get(r, "") or "")]
              leaks = [r for r in bio_py if LEAK.search(txt.get(r, "") or "")]
              IMG_EXT = {".jpg", ".jpeg", ".png", ".webp", ".bmp"}
              imgs = [r for r, s in all_files if os.path.splitext(r)[1].lower() in IMG_EXT and s > 100000 and re.search(r"(selfie|face|rostro|huella|biometr|captura)", os.path.basename(r), re.I)]
              return {"consent": consent, "reten": reten, "leaks": leaks, "imgs": imgs}

          COUNTRY = re.compile(r"(el\s+salvador|salvadoreñ|\+503)", re.I)
          I18N = re.compile(r"(i18n|gettext|babel|\blocale\b|translations|traducciones|\blang\b|language)", re.I)

          def S6_pais():
              country, i18n = [], []
              for r, s in all_files:
                  ext = os.path.splitext(r)[1].lower()
                  if ext not in TEXT_EXT or s > 1500000:
                      continue
                  t = txt.get(r, "") or read_text(os.path.join(ROOT, r))
                  if not t:
                      continue
                  if I18N.search(t):
                      i18n.append(r)
                  if r.endswith(".py") and COUNTRY.search(t):
                      country.append(r)
              return {"country": country, "i18n": i18n}

          FAKE = re.compile(r"\b(mock|mocked|fake|dummy|simulado|simulada|hardcoded|hard-coded|placeholder)\b", re.I)
          TODO = re.compile(r"\b(TODO|FIXME|XXX)\b")
          IMP = re.compile(r"^\s*(?:import|from)\s+([A-Za-z0-9_]+)", re.M)
          IMP2PKG = {"cv2": "opencv", "onnxruntime": "onnxruntime", "onnx": "onnx", "insightface": "insightface", "deepface": "deepface", "dlib": "dlib", "mediapipe": "mediapipe", "face_recognition": "face_recognition", "numpy": "numpy"}

          def S7_produccion():
              fake, todo = [], []
              for r in bio_py:
                  t = txt.get(r, "") or ""
                  if not t:
                      continue
                  n1 = len(FAKE.findall(t))
                  n2 = len(TODO.findall(t))
                  if n1:
                      fake.append((r, n1))
                  if n2:
                      todo.append((r, n2))
              req = ""
              for cand in ("requirements.txt", "requirements-render.txt"):
                  p = os.path.join(ROOT, cand)
                  if os.path.exists(p):
                      req += read_text(p, 300000).lower()
              used = set()
              for r in bio_py:
                  for m in IMP.finditer(txt.get(r, "") or ""):
                      if m.group(1) in IMP2PKG:
                          used.add(m.group(1))
              missing = set()
              for mod in used:
                  pkg = IMP2PKG[mod]
                  if pkg not in req and mod not in req:
                      missing.add(mod + " (paquete: " + pkg + ")")
              return {"fake": sorted(fake, key=lambda x: -x[1]), "todo": sorted(todo, key=lambda x: -x[1]), "missing": sorted(missing), "usadas": sorted(used)}

          def S8_sintaxis():
              targets = sorted(set(bio_py) | {x for x in ("main.py", "superapp.py") if x in py_all})
              bad = []
              for r in targets:
                  p = os.path.join(ROOT, r)
                  try:
                      src = open(p, "r", encoding="utf-8", errors="ignore").read()
                  except Exception as ex:
                      bad.append((r, "ERROR: no se pudo leer: " + str(ex)[:120]))
                      continue
                  with warnings.catch_warnings(record=True) as wl:
                      warnings.simplefilter("always")
                      try:
                          compile(src, r, "exec")
                      except SyntaxError as ex:
                          bad.append((r, "ERROR de sintaxis línea " + str(ex.lineno) + ": " + str(ex.msg or "")[:140]))
                          continue
                      except Exception as ex:
                          bad.append((r, "ERROR: " + str(ex)[:140]))
                          continue
                  ws = [str(w.message) for w in wl if "escape" in str(w.message).lower() or "syntax" in str(w.message).lower()]
                  if ws:
                      bad.append((r, "aviso de sintaxis: " + ws[0][:150]))
              return bad

          def S8b_archivos():
              big_o = sorted([(r, s) for r, s in all_files if s > 10485760], key=lambda x: -x[1])
              big_b = [(r, s) for r, s in all_files if 2097152 < s <= 10485760]
              empties = [r for r, s in all_files if s == 0]
              non_init = [e for e in empties if os.path.basename(e) != "__init__.py"]
              models = [(r, s) for r, s in all_files if os.path.splitext(r)[1].lower() in MODEL_EXT]
              mrep = []
              for r, s in sorted(models, key=lambda x: -x[1])[:12]:
                  stem = os.path.splitext(os.path.basename(r))[0]
                  refs = sum(1 for t in txt.values() if stem in t)
                  mrep.append({"modelo": r, "mb": round(s / 1048576.0, 1), "referencias_en_codigo": refs})
              return {"big_o": big_o, "big_b": big_b, "non_init": non_init, "init_e": len(empties) - len(non_init), "models": mrep}

          # ── Ejecutar secciones ──
          inv = safe(S1_inventario, "inventario", {"files": [], "total_files": 0, "total_mb": 0, "py_all": [], "engines": [], "apps": []})
          all_files = inv["files"]
          total_files = inv["total_files"]
          total_mb = inv["total_mb"]
          py_all = inv["py_all"]
          engines = inv["engines"]
          apps = inv["apps"]

          bio = safe(S2_biometrico, "detección biométrica", {"txt": {}, "bio_all": [], "bio_py": []})
          txt = bio["txt"]
          bio_all = bio["bio_all"]
          bio_py = bio["bio_py"]
          HAS_BIO = len(bio_py) > 0
          zone_counts = Counter()
          for r in bio_all:
              zone_counts[zone_of(r)] += 1

          stage_status = safe(S3_flujo, "flujo", [])
          routes = safe(S3b_rutas, "rutas", [])
          secretos = safe(S4_secretos, "secretos", [])
          env_report = safe(S4b_env, "archivos env", {})
          noenc = safe(S4c_cifrado, "cifrado", [])
          db_report = safe(S4d_bd, "bases de datos", [])
          noauth = safe(S4e_auth, "autenticación", [])
          priv = safe(S5_privacidad, "privacidad", {"consent": [], "reten": [], "leaks": [], "imgs": []})
          pais = safe(S6_pais, "país", {"country": [], "i18n": []})
          prod = safe(S7_produccion, "producción", {"fake": [], "todo": [], "missing": [], "usadas": []})
          bad_compile = safe(S8_sintaxis, "sintaxis", [])
          archivos = safe(S8b_archivos, "archivos", {"big_o": [], "big_b": [], "non_init": [], "init_e": 0, "models": []})
          model_report = archivos["models"]

          # ── Convertir resultados en hallazgos ──
          if not HAS_BIO:
              add("flujo", "orange", "BIO-NONE", "No se detectaron archivos del área biométrica — verifica que el módulo esté en el repo y en la rama correcta")

          for r, k in secretos[:12]:
              add("seguridad", "red", "BIO-SECRET", "Posible secreto real embebido (" + k + ") — valor oculto; rota la credencial y pásala a variables de entorno", r)

          for r, vals in env_report.items():
              if vals:
                  add("seguridad", "red", "BIO-ENV", "El archivo " + r + " tiene valores que parecen REALES en: " + ", ".join(vals[:5]) + " — rota esas credenciales ya", r)
              else:
                  add("seguridad", "blue", "BIO-ENV", "Archivo de entorno presente pero SIN valores reales (plantilla válida) — la alerta anterior queda descartada", r)

          for r in noenc[:10]:
              add("seguridad", "orange", "BIO-ENC", "Módulo biométrico guarda datos sin evidencia de cifrado/hash — plantillas e imágenes deben cifrarse o guardarse como hash", r)

          for f in noauth[:10]:
              add("seguridad", "orange", "BIO-AUTH", "Archivo con rutas de registro/verificación sin evidencia de autenticación ni permisos", f)

          if HAS_BIO and not priv["consent"]:
              add("privacidad", "orange", "BIO-CONSENT", "Ningún módulo del registro biométrico menciona consentimiento/privacidad — obligatorio antes de usar personas reales")
          elif priv["consent"]:
              add("privacidad", "blue", "BIO-CONSENT", "Se detecta consentimiento/privacidad en " + str(len(priv["consent"])) + " módulo(s) — verifica consentimiento explícito guardado con evidencia")

          if HAS_BIO and not priv["reten"]:
              add("privacidad", "blue", "BIO-RETEN", "Sin política de retención/eliminación de datos biométricos detectada — define tiempo de guardado y borrado")

          for f in priv["leaks"][:8]:
              add("privacidad", "blue", "BIO-LOG", "Posible impresión/registro de datos biométricos en logs — nunca loguear imágenes ni plantillas", f)

          for f in priv["imgs"][:8]:
              add("privacidad", "orange", "BIO-IMG", "Posible imagen biométrica de persona real dentro del repo — no debe versionarse", f)

          for f in pais["country"][:12]:
              add("pais", "orange", "BIO-PAIS", "Código atado a El Salvador (país/teléfono fijos) — para multi-país debe venir de configuración", f)

          if not pais["i18n"]:
              add("pais", "blue", "BIO-I18N", "Sin capa i18n/idiomas detectada — adaptar a otros países hoy exige editar código")

          for f, n in prod["fake"][:10]:
              add("calidad", "orange", "BIO-PROD", "Código biométrico con marcadores demo/fake/mock (" + str(n) + ") — tu regla: 100% producción, nada falso", f)

          for f, n in prod["todo"][:8]:
              add("calidad", "blue", "BIO-TODO", "Tareas pendientes marcadas en el código (" + str(n) + " TODO/FIXME)", f)

          if prod["missing"]:
              add("calidad", "orange", "BIO-DEPS", "Dependencias biométricas usadas pero NO declaradas en requirements*.txt: " + ", ".join(prod["missing"][:6]))

          for f, err in bad_compile[:12]:
              add("calidad", "orange", "BIO-QUAL", err, f)

          for f, s in archivos["big_o"][:8]:
              add("calidad", "orange", "BIO-BIG", "Archivo muy grande (" + str(round(s / 1048576.0, 1)) + " MB) — frena el clonado; usa Git LFS o descárgalo al ejecutar", f)

          if archivos["non_init"]:
              add("calidad", "blue", "BIO-EMPTY", str(len(archivos["non_init"])) + " archivo(s) vacío(s) fuera de __init__.py (ej: " + ", ".join(archivos["non_init"][:5]) + ")")
          elif archivos["init_e"]:
              add("calidad", "blue", "BIO-EMPTY", str(archivos["init_e"]) + " __init__.py vacíos — normal en Python, sin acción")

          # ── Pendientes de la auditoría anterior (#932) ──
          pend = []
          envex = next((r for r in env_report.keys() if os.path.basename(r).lower() == ".env.example"), None)
          if envex is None:
              pend.append((".env.example", "OK — ya no está en el repo"))
          elif env_report.get(envex):
              pend.append((".env.example", "CRÍTICO — contiene valores que parecen reales: " + ", ".join(env_report[envex][:4])))
          else:
              pend.append((".env.example", "OK — plantilla sin valores reales (sospecha anterior descartada)"))
          sp = next((e for f, e in bad_compile if f == "superapp.py"), "")
          if "superapp.py" in py_all:
              if sp and ("ERROR" in sp or "invalid escape" in sp or "escape" in sp):
                  pend.append(("superapp.py (escape \\s)", "PENDIENTE — " + sp[:110]))
              else:
                  pend.append(("superapp.py (escape \\s)", "OK — sin errores ni avisos de sintaxis"))
          else:
              pend.append(("superapp.py", "no está en el repo"))
          sf = next((m for m in model_report if "sface" in str(m.get("modelo", "")).lower()), None)
          if sf:
              pend.append(("modelo sface (36 MB)", "sigue en el repo: " + str(sf["modelo"]) + " (" + str(sf["mb"]) + " MB)"))
          else:
              pend.append(("modelo sface (36 MB)", "OK — ya no está (o cambió de nombre)"))
          n_empty = len(archivos["non_init"]) + archivos["init_e"]
          pend.append(("archivos vacíos", "antes 15 → ahora " + str(n_empty)))

          # ── Notas ──
          PEN = {"red": 18, "orange": 8, "blue": 2}
          CATS = ["seguridad", "flujo", "privacidad", "pais", "calidad"]
          scores = {c: 100 for c in CATS}
          blue_n = defaultdict(int)
          for f in findings:
              d = PEN[f["sev"]]
              if f["sev"] == "blue":
                  blue_n[f["cat"]] += 1
                  if blue_n[f["cat"]] > 5:
                      d = 0
              scores[f["cat"]] = max(0, scores[f["cat"]] - d)
          W = {"seguridad": 0.30, "flujo": 0.20, "privacidad": 0.20, "pais": 0.10, "calidad": 0.20}
          overall = int(round(sum(scores[c] * W[c] for c in CATS)))
          def sem(n):
              return "🟢" if n >= 90 else ("🟡" if n >= 70 else "🔴")
          CAT_LABEL = {"seguridad": "🔐 Seguridad biométrica", "flujo": "⚙️ Flujo de registro", "privacidad": "🛡️ Privacidad y consentimiento", "pais": "🌎 Adaptabilidad multi-país", "calidad": "🧪 Calidad y producción"}

          # ── Informe ──
          sev_rank = {"red": 0, "orange": 1, "blue": 2}
          findings_sorted = sorted(findings, key=lambda f: (sev_rank[f["sev"]], f["cat"], f["id"]))
          cnt = {c: Counter(f["sev"] for f in findings if f["cat"] == c) for c in CATS}

          L = []
          A = L.append
          A("# 🔍 ZYRA — Auditoría Biométrica del Registro de Persona")
          A("")
          A("- **Fecha:** " + FECHA)
          A("- **Alcance:** toda la red + área de registro biométrico (SOLO LECTURA: no se creó ni modificó ningún archivo del repositorio)")
          A("- **Nota general del registro biométrico: " + str(overall) + "/100 " + sem(overall) + "**")
          A("")
          A("## 📊 Notas por categoría")
          A("")
          A("| Categoría | Nota | 🔴 | 🟠 | 🔵 |")
          A("|---|---|---|---|---|")
          for c in CATS:
              k = cnt[c]
              A("| " + CAT_LABEL[c] + " | " + str(scores[c]) + "/100 " + sem(scores[c]) + " | " + str(k.get("red", 0)) + " | " + str(k.get("orange", 0)) + " | " + str(k.get("blue", 0)) + " |")
          A("")
          A("## 🧬 Inventario de la red")
          A("")
          A("- Archivos totales: " + str(total_files) + " (" + str(total_mb) + " MB)")
          A("- Archivos Python: " + str(len(py_all)))
          A("- Motores en shared_engines (" + str(len(engines)) + "): " + ", ".join(engines))
          A("- Apps (" + str(len(apps)) + "): " + ", ".join(apps))
          A("- Archivos del área biométrica detectados: " + str(len(bio_all)) + " (de ellos " + str(len(bio_py)) + " .py analizados a fondo)")
          A("")
          A("### Dónde vive el área biométrica")
          A("")
          A("| Zona | Archivos |")
          A("|---|---|")
          for z, n in zone_counts.most_common(15):
              A("| " + z + " | " + str(n) + " |")
          A("")
          A("## ⚙️ Flujo de registro biométrico (7 etapas)")
          A("")
          A("| Etapa | Estado | Evidencia |")
          A("|---|---|---|")
          for st in stage_status:
              A("| " + st["etapa"] + " | " + ("✅ detectada" if st["ok"] else "❌ NO detectada") + " | " + (", ".join(st["evidencia"]) or "-") + " |")
          det = sum(1 for s in stage_status if s["ok"])
          A("")
          A("**Etapas detectadas: " + str(det) + "/7.**")
          A("")
          if routes:
              A("## 🚪 Rutas/endpoints de registro y verificación (" + str(len(routes)) + ")")
              A("")
              A("| Ruta | Archivo |")
              A("|---|---|")
              for e in routes[:25]:
                  A("| " + e["ruta"] + " | " + e["file"] + " |")
              if len(routes) > 25:
                  A("| ... | (+" + str(len(routes) - 25) + " más en el JSON del artefacto) |")
              A("")
          if model_report:
              A("## 🧠 Modelos de IA detectados")
              A("")
              A("| Modelo | Tamaño | Referencias en código |")
              A("|---|---|---|")
              for m in model_report:
                  A("| " + str(m["modelo"]) + " | " + str(m["mb"]) + " MB | " + str(m["referencias_en_codigo"]) + " |")
              A("")
          if db_report:
              A("## 🗄️ Bases de datos dentro del repo")
              A("")
              for d in db_report:
                  extra = ""
                  if d.get("biometricas"):
                      extra = ", biométricas: " + ", ".join(d["biometricas"])
                  if d.get("error"):
                      extra += " — error: " + d["error"]
                  A("- **" + d["db"] + "** — tablas: " + str(d.get("tablas", "?")) + extra)
              A("")
          A("## 🚨 Hallazgos (" + str(len(findings)) + ")")
          A("")
          if not findings_sorted:
              A("Sin hallazgos. 🎉")
          for f in findings_sorted:
              icon = {"red": "🔴", "orange": "🟠", "blue": "🔵"}[f["sev"]]
              A("- " + icon + " **" + f["id"] + "** — " + f["msg"] + ("" if not f["file"] else "  \n  ↳ `" + f["file"] + "`"))
          A("")
          A("## 📌 Pendientes de la auditoría anterior (#932)")
          A("")
          for k, v in pend:
              A("- **" + k + "**: " + v)
          A("")
          A("---")
          A("_Auditoría de solo lectura generada automáticamente. No se crearon ni modificaron archivos en el repositorio._")
          md = "\n".join(L)

          with open(os.path.join(OUT, "informe-biometrico.md"), "w", encoding="utf-8") as f:
              f.write(md)
          data = {"fecha": FECHA, "nota_general": overall, "notas": scores, "categorias": CAT_LABEL,
                  "inventario": {"archivos": total_files, "mb": total_mb, "python": len(py_all), "motores": engines, "apps": apps},
                  "biometrico": {"archivos": len(bio_all), "py_analizados": len(bio_py), "zonas": dict(zone_counts)},
                  "etapas": stage_status, "rutas": routes[:80], "modelos": model_report, "bd": db_report,
                  "hallazgos": findings_sorted, "pendientes": [{"item": k, "estado": v} for k, v in pend]}
          with open(os.path.join(OUT, "informe-biometrico.json"), "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          summ = os.environ.get("GITHUB_STEP_SUMMARY")
          if summ:
              with open(summ, "a", encoding="utf-8") as f:
                  f.write(md + "\n")

          # ── Anotaciones de GitHub ──
          def one_line(s):
              return s.replace("\n", " ").replace("\r", " ").replace("::", "-")
          emitted = {"error": 0, "warning": 0, "notice": 0}
          CAPS = {"error": 8, "warning": 10, "notice": 8}
          for f in findings_sorted:
              kind = {"red": "error", "orange": "warning", "blue": "notice"}[f["sev"]]
              if emitted[kind] >= CAPS[kind]:
                  continue
              emitted[kind] += 1
              title = one_line("[" + f["id"] + "] " + f["msg"])[:110].replace(",", " -")
              props = "title=" + title
              if f["file"]:
                  props += ",file=" + f["file"] + ",line=1"
              print("::" + kind + " " + props + "::" + one_line(f["msg"])[:180])

          # ── Resumen de consola ──
          print("")
          print("════════════════════════════════════════════════")
          print("🔍 ZYRA AUDITORÍA BIOMÉTRICA — RESULTADO")
          print("════════════════════════════════════════════════")
          print("🎯 Nota del registro biométrico: " + str(overall) + "/100 " + sem(overall))
          print("📊 " + str(total_files) + " archivos (" + str(total_mb) + " MB) · biométricos: " + str(len(bio_all)) + " (" + str(len(bio_py)) + " .py analizados)")
          for c in CATS:
              k = cnt[c]
              print(CAT_LABEL[c] + ": " + str(scores[c]) + "/100 " + sem(scores[c]) + " (🔴" + str(k.get("red", 0)) + " 🟠" + str(k.get("orange", 0)) + " 🔵" + str(k.get("blue", 0)) + ")")
          det = sum(1 for s in stage_status if s["ok"])
          faltan = [s["etapa"] for s in stage_status if not s["ok"]]
          print("⚙️ Etapas del flujo detectadas: " + str(det) + "/7" + ("" if not faltan else " — faltan: " + "; ".join(faltan)))
          print("")
          print("Hallazgos principales:")
          shown = 0
          for f in findings_sorted:
              if shown >= 14:
                  break
              if f["sev"] == "blue" and shown >= 8:
                  break
              icon = {"red": "🔴", "orange": "🟠", "blue": "🔵"}[f["sev"]]
              print(icon + " " + f["id"] + " " + f["msg"] + ("" if not f["file"] else " → " + f["file"]))
              shown += 1
          rest = len(findings_sorted) - shown
          if rest > 0:
              print("  (+" + str(rest) + " hallazgos más — detalle completo en el informe)")
          print("")
          print("Pendientes de la auditoría anterior:")
          for k, v in pend:
              print("- " + k + ": " + v)
          print("════════════════════════════════════════════════")
          print("📥 Informe completo: artefacto informe-biometrico")
          print("📤 Copia este bloque y envíalo de vuelta al chat")
          print("════════════════════════════════════════════════")
          PYEOF
          python3 "$RUNNER_TEMP/auditoria_biometrica.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Guardar informe como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: informe-biometrico
          path: |
            ${{ runner.temp }}/informe-biometrico.md
            ${{ runner.temp }}/informe-biometrico.json
          if-no-files-found: warn
          retention-days: 30
