name: "ZYRA RUN4a: auditoria profunda AGRO avanzado (A-4..A-14) — solo lectura + baseline"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] mapa completo de modulos AGRO (que existe ya por area A-4..A-14)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA A-4..A-14 — mapa de modulos AGRO" >> "$SUM"
          echo "### arbol modules (3 niveles, archivos .py con lineas)" >> "$SUM"
          { echo '```'; find apps/agro/modules -name "*.py" 2>/dev/null | grep -v __pycache__ | while read f; do echo "$(wc -l < "$f") $f"; done | sort -rn | head -80; echo '```'; } >> "$SUM"
          echo "### firmas de services por area (class + def)" >> "$SUM"
          { echo '```'; for area in produccion recursos_y_activos comercializacion gobierno riesgo insumos_y_apoyos operaciones; do echo "===== AREA: $area"; for f in $(find apps/agro/modules/$area -name "*.py" 2>/dev/null | grep -v __pycache__ | sort); do echo "-- $f"; grep -n "^class \|    def \|^def " "$f" | head -22; done; done; echo '```'; } >> "$SUM"
          echo "### fin mapa" >> "$SUM"
          exit 0

      - name: "[LECTURA] esquemas de tablas AGRO ya creadas (CREATE TABLE completos)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA A-4..A-14 — tablas existentes (DDL completos)" >> "$SUM"
          { echo '```python'; grep -rh "CREATE TABLE IF NOT EXISTS" apps/agro --include="*.py" 2>/dev/null | grep -v __pycache__ | sort -u; echo '```'; } >> "$SUM"
          echo "### fin tablas" >> "$SUM"
          exit 0

      - name: "[LECTURA] fuentes completas de los services nucleares (los que A-4..A-14 extenderian)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA A-4..A-14 — fuentes nucleares" >> "$SUM"
          for f in apps/agro/infrastructure/persistence/agro_store.py apps/agro/infrastructure/persistence/agro_area_store.py; do
            echo "### $f" >> "$SUM"
            { echo '```python'; head -c 12000 "$f" 2>/dev/null; echo '```'; } >> "$SUM"
          done
          echo "### agro_migrations.py (primeras 200 lineas)" >> "$SUM"
          { echo '```python'; head -200 apps/agro/infrastructure/persistence/agro_migrations.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### fin fuentes" >> "$SUM"
          exit 0

      - name: "[LECTURA] regresion 4 apps (baseline verde)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Sin cambios de codigo; fallar si regresion rota"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: regresion rota — REVISAR antes de RUN 4b**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**AUDITORIA COMPLETA — SIN CAMBIOS (correcto). RUN 4b: escribo A-4..A-14 con el mapa real (extendiendo lo que existe, creando solo lo que falta).**"
            exit 0
          fi
          git commit -m "chore(auditoria): limpieza de caches tras regresion verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK (limpieza)**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK. RUN 4b listo.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
