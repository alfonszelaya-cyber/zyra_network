              module, title, opts_pipe = MENUS[rel]
              mid = rel[:-3].replace("/", ".")
              opts = ", ".join('"' + o + '"'
                               for o in opts_pipe.split("|"))
              content = (
                  '"""Menu: ' + title + ' - NEXO / ZYRA.\n'
                  '\n'
                  'Modulo ' + module + '. Opciones reales del\n'
                  'ecosistema NEXO; wiring de acciones en NG12.\n'
                  '"""\n'
                  'MODULE = "' + module + '"\n'
                  'MENU_ID = "' + mid + '"\n'
                  'TITLE = "' + title + '"\n'
                  'OPTIONS = [' + opts + ']\n'
                  '\n'
                  '\n'
                  'def menu() -> dict:\n'
                  '    """Definicion del menu (data puro)."""\n'
                  '    return {"module": MODULE,\n'
                  '            "menu_id": MENU_ID,\n'
                  '            "title": TITLE,\n'
                  '            "options": [{"key": str(i + 1),\n'
                  '                         "label": opt}\n'
                  '                        for i, opt\n'
                  '                        in enumerate(OPTIONS)]}\n')
              forzar("apps/nexo/module/" + rel, content)

          forzar("apps/nexo/module/__init__.py", (
              '"""Menu Registry de modulos NEXO (NG10).\n'
              '\n'
              'Descubre los menu.py con contenido de los modulos.\n'
              'Regla 70: operaciones/logistica EXCLUIDO (SUBASTAS).\n'
              'Archivos vacios se saltan (regla 53/68).\n'
              '"""\n'
              'from pathlib import Path\n'
              'import importlib\n'
              '\n'
              '_BASE = Path(__file__).parent\n'
              '_EXCLUDED = ("operaciones/logistica",)\n'
              '\n'
              '\n'
              'def discover_menus() -> list:\n'
              '    """Descubre y devuelve todos los menus.\n'
              '\n'
              '    Cada entrada: module, menu_id, title, options,\n'
              '    path. Robusto: un menu roto no rompe el resto.\n'
              '    """\n'
              '    menus = []\n'
              '    for p in sorted(_BASE.rglob("menu.py")):\n'
              '        try:\n'
              '            if p.stat().st_size <= 1:\n'
              '                continue\n'
              '            rel = p.relative_to(_BASE).as_posix()\n'
              '            if any(rel.startswith(x)\n'
              '                   for x in _EXCLUDED):\n'
              '                continue\n'
              '            mod = importlib.import_module(\n'
              '                "apps.nexo.module."\n'
              '                + rel[:-3].replace("/", "."))\n'
              '            fn = getattr(mod, "menu", None)\n'
              '            if not callable(fn):\n'
              '                continue\n'
              '            entry = fn()\n'
              '            entry["path"] = rel\n'
              '            menus.append(entry)\n'
              '        except Exception:\n'
              '            continue\n'
              '    return menus\n'))

          forzar("apps/nexo/routers/__init__.py",
                 '"""Routers NEXO."""\n')

          forzar("apps/nexo/routers/modules_router.py", D(r'''
              """Nexo Modules Router - menus como data para HTTP
              (NG10). El wiring a server.py ocurre en NG12 con
              audit-first (la estructura del server ya se descargo
              al Summary en este run)."""
              from __future__ import annotations
              from apps.nexo.module import discover_menus

              def list_menus(module="", limit=500) -> dict:
                  """Lista de menus, opcionalmente por modulo."""
                  menus = discover_menus()
                  if module:
                      menus = [m for m in menus
                               if m["module"] == module]
                  return {"total": len(menus),
                          "menus": menus[:limit]}

              def get_menu(menu_id):
                  """Un menu por id, o None."""
                  for m in discover_menus():
                      if m["menu_id"] == menu_id:
                          return m
                  return None
          '''))

          out("## FIN NG10: " + str(len(MENUS)) + " menus + registry + router")
          exit(0)
