name: "RED-DEATH v3: seeds identicos doc/selfie (la puerta biometrica rechazo datos distintos - el anti-fraude funciona)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Fix 1 - death test: mismo seed para doc y selfie (como todos los tests verdes)"
        run: |
          python3 - <<'F1EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/runtime/tests/test_runtime_api.py")
          t = p.read_text(encoding="utf-8")
          n1 = t.count('"cGVkcm8tZG9j"')
          n2 = t.count('"cGVkcm8tc2VsZmll"')
          assert n1 == 1 and n2 == 1, ("seeds " + str(n1) + "/" + str(n2))
          t = t.replace('"cGVkcm8tZG9j"', '"cGVkcm8tY2ljbG8="')
          t = t.replace('"cGVkcm8tc2VsZmll"', '"cGVkcm8tY2ljbG8="')
          import ast as a
          a.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 1: death test con seed identico doc/selfie (AST valido)")
          F1EOF

      - name: "Fix 2 - verification test: mismo seed para doc y selfie (preventivo, mismo patron)"
        run: |
          python3 - <<'F2EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/runtime/tests/test_capabilities_api.py")
          t = p.read_text(encoding="utf-8")
          n1 = t.count('b"doc-pedro-dui"')
          n2 = t.count('b"selfie-pedro-real"')
          if n1 == 1 and n2 == 1:
              t = t.replace('base64.b64encode(b"doc-pedro-dui")', 'base64.b64encode(b"pedro-verif")')
              t = t.replace('base64.b64encode(b"selfie-pedro-real")', 'base64.b64encode(b"pedro-verif")')
              import ast as a
              a.parse(t)
              p.write_text(t, encoding="utf-8")
              print("OK 2: verification test con seed identico (AST valido)")
          else:
              print("SKIP 2 (" + str(n1) + "/" + str(n2) + " - revisar)")
          F2EOF

      - name: "GATE runtime AISLADO POR ARCHIVO (timeout 90s)"
        run: |
          set +e
          shopt -s nullglob
          FAIL=0
          for f in shared_engines/runtime/tests/test_*.py; do
            nombre=$(basename "$f" .py)
            timeout 90 python3 -m pytest "$f" -q --tb=line > "/tmp/rt_$nombre.txt" 2>&1
            CODE=$?
            if [ $CODE -eq 124 ]; then
              echo "HANG: $nombre (90s)"
              FAIL=1
            elif [ $CODE -ne 0 ]; then
              echo "FALLO: $nombre"
              tail -8 "/tmp/rt_$nombre.txt"
              FAIL=1
            else
              echo "VERDE: $nombre :: $(tail -1 /tmp/rt_$nombre.txt)"
            fi
          done
          echo "=============================="
          if [ $FAIL -ne 0 ]; then
            echo "GATE ROJO"
            exit 1
          fi
          echo "GATE runtime VERDE"
          exit 0

      - name: "GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-DEATH v3"
            shopt -s nullglob
            for f in /tmp/rt_*.txt; do
              echo
              echo "#### $f"
              tail -20 "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-DEATH v3: seeds identicos doc/selfie en tests (la puerta biometrica rechazo datos distintos - el anti-fraude funciona)" -m "El 422 doc_match_below_threshold es la puerta biometrica FUNCIONANDO: el DeterministicTestProvider compara doc vs selfie y rechaza por debajo del umbral - los tests nuevos usaban seeds DISTINTOS para doc y selfie (todos los tests verdes usan el mismo). Fix: seeds identicos en death test y verification test. Esto DEMUESTRA el anti-fraude: con un documento que no coincide con la cara, el enroll es rechazado. Registro tambien la leccion: seeds de test = mismo valor para doc_image_b64 y selfie_image_b64."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
