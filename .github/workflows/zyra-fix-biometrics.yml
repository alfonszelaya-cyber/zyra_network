name: "ETAPA 3 ID-a: auditoria COMPLETA de shared_engines/identity (archivo por archivo, firmas + contenido) — SOLO LECTURA, base para ID-1..15 sin duplicar"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "[ID-a] AUDITORIA COMPLETA identity/ — cada archivo con firmas y contenido clave"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# AUDITORIA identity/ (Etapa 3 Bloque ID)" >> "$SUM"
          echo "## inventario" >> "$SUM"
          { echo '```'; find shared_engines/identity -name "*.py" ! -name "__init__.py" ! -path "*tests*" 2>/dev/null | while read f; do echo "$(wc -l < "$f") $f"; done | sort -rn; echo '```'; } >> "$SUM"
          for f in shared_engines/identity/engine.py shared_engines/identity/registry.py shared_engines/identity/contracts.py shared_engines/identity/errors.py; do
            echo "## $f COMPLETO" >> "$SUM"
            { echo '```python'; cat "$f" 2>/dev/null; echo '```'; } >> "$SUM"
          done
          for f in $(find shared_engines/identity -name "*.py" ! -name "__init__.py" ! -path "*tests*" ! -name "engine.py" ! -name "registry.py" ! -name "contracts.py" ! -name "errors.py" 2>/dev/null); do
            echo "## $f COMPLETO" >> "$SUM"
            { echo '```python'; cat "$f" 2>/dev/null; echo '```'; } >> "$SUM"
          done
          echo "## tests existentes de identity (para no romper)" >> "$SUM"
          { echo '```'; find shared_engines/identity/tests -name "*.py" 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## MIS engines ya creados (de runs previos, si existen en el repo)" >> "$SUM"
          { echo '```'; ls shared_engines/identity/ 2>/dev/null | grep -E "guardian|birth|minor|representation|network_reg"; echo '```'; } >> "$SUM"
          echo "## FIN auditoria identity" >> "$SUM"
          exit 0

      - name: "[VEREDICTO] sin cambios — auditoria pura para planificar ID-1..15"
        if: always()
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## Con este mapa completo se planifica el Bloque ID SIN duplicar (regla 69): lo que ya existe se extiende, lo que falta se crea con su aprobacion." >> "$SUM"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          exit 0
