name: "ZYRA EX - parche unico (canal web de sesion)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parche:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Parche - proyectar_paso_actual garantiza canal web de la sesion
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/infrastructure/providers/presentation_remote.py")
          t = ruta.read_text(encoding="utf-8")

          viejo = '''              def proyectar_paso_actual(self, id_sesion):
                  sesion = self.sesion(id_sesion)
                  frame = sesion.frame_holograma()
                  entrega = self._proyector.presentar(frame, {"tipo": "web"})
                  return {"sesion": str(sesion.id), "paso": sesion.paso_actual, "proyeccion": entrega}
          '''
          nuevo = '''              def proyectar_paso_actual(self, id_sesion):
                  sesion = self.sesion(id_sesion)
                  frame = sesion.frame_holograma()
                  canal = "web-sesion-" + str(sesion.id)
                  if not any(
                      d.get("nombre") == canal
                      for d in self._proyector.listar_destinos().get("destinos", [])
                  ):
                      self._proyector.registrar_destino("web", "", canal)
                  entrega = self._proyector.presentar(frame, {})
                  return {"sesion": str(sesion.id), "paso": sesion.paso_actual, "proyeccion": entrega}
          '''
          if viejo in t:
              t = t.replace(viejo, nuevo, 1)
              print("parche aplicado: canal web de sesion auto-registrado")
          elif 'canal = "web-sesion-' in t:
              print("parche ya presente")
          else:
              raise SystemExit("FATAL: metodo proyectar_paso_actual no encontrado tal cual")

          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("presentation_remote.py: sintaxis OK")
          PYEOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - parche canal web de sesion"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "EX: proyeccion de sesion con canal web garantizado (auto-registro)"
            git push
          fi
