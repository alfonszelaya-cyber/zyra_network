            "ui.titulo_opcional": "Titulo (opcional: si lo dejas vacio usamos la primera linea)",
            "ui.tipo_auto": "Detectar automaticamente",
            "ui.placeholder_doc": "Pega aqui tu documento completo. Primera linea = titulo del proyecto. El resto = descripcion.",
            "ui.crear_doc": "Crear proyecto desde documento"
          }
          ZYRA_EOF
          echo "=== REGLA 6: VERIFICACION SINTAXIS + IMPORTS + E2E HTTP + UI + DOCUMENTOS ==="
          python3 - << 'ZYRA_CHECK'
          import importlib
          import json
          import os
          import pathlib
          import sys
          import types

          pkg_apps = types.ModuleType("apps")
          pkg_apps.__path__ = ["apps"]
          sys.modules["apps"] = pkg_apps
          pkg_lab = types.ModuleType("apps.laboratorio")
          pkg_lab.__path__ = ["apps/laboratorio"]
          sys.modules["apps.laboratorio"] = pkg_lab

          from apps.laboratorio.application.services.document_parser import parsear_documento
          from apps.laboratorio.application.services.template_check import verificar_plantillas
          from apps.laboratorio.application.services.ui_fases import FASE_POR_MENU
          from apps.laboratorio.application.services.ui_service import (
              cargar_plantilla,
              render_home,
              render_panel,
              textos,
          )
          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.infrastructure.security.html_sanitizer import escapar
          from apps.laboratorio.infrastructure.services.template_render import (
              render,
              validar_plantilla,
          )

          MANIFEST = "/tmp/lab_lote_1a5.manifest"
          RESUMEN = os.environ.get("GITHUB_STEP_SUMMARY", "")

          def sum_write(texto=""):
              if RESUMEN:
                  with open(RESUMEN, "a", encoding="utf-8") as f:
                      f.write(texto + "\n")

          errores = 0
          objetivos = []
          with open(MANIFEST, encoding="utf-8") as f:
              for linea in f:
                  linea = linea.strip()
                  if linea:
                      ruta, estado = linea.split("|", 1)
                      objetivos.append((ruta, estado))

          sum_write("## ZYRA LABORATORIO - Lote 1A-5 (UI real + capturador de documentos)")
          sum_write("")
          sum_write("### Escritura y verificacion (Reglas 1-3 y 6)")
          sum_write("")
          sum_write("| Archivo | Escritura | Verificacion |")
          sum_write("|---|---|---|")
          for ruta, estado in objetivos:
              nombre = "apps.laboratorio." + ruta[len("apps/laboratorio/"):-3].replace("/", ".")
              marca = "OK"
              try:
                  codigo = pathlib.Path(ruta).read_text(encoding="utf-8")
                  compile(codigo, ruta, "exec")
                  importlib.import_module(nombre)
              except Exception as exc:
                  errores += 1
                  marca = "FALLO: " + type(exc).__name__ + ": " + str(exc)
              sum_write("| `" + ruta + "` | " + estado + " | " + marca + " |")

          app = montar_aplicacion(":memory:")
          H_DUENO = {"X-ZYRA-ZID": "ZID-DUENO-1", "X-ZYRA-ROLES": "LAB_CREADOR,LAB_ANALISTA"}
          H_GOBERNADOR = {"X-ZYRA-ZID": "ZID-GOB-9", "X-ZYRA-ROLES": "LAB_GOBERNADOR"}
          H_OTRO = {"X-ZYRA-ZID": "ZID-OTRO-2"}

          def llamada(metodo, ruta, cuerpo=None, headers=None):
              h = dict(headers or {})
              datos = b"" if cuerpo is None else json.dumps(cuerpo).encode("utf-8")
              status, headers_out, salida = app.despachar(metodo, ruta, h, datos)
              ctype = headers_out.get("Content-Type", "")
              if "json" in ctype:
                  try:
                      parsed = json.loads(salida.decode("utf-8"))
                  except Exception:
                      parsed = None
              else:
                  parsed = None
              return status, parsed, salida, headers_out

          resultados = []

          def check(nombre, funcion):
              global errores
              try:
                  funcion()
                  resultados.append(("OK", nombre))
              except Exception as exc:
                  errores += 1
                  resultados.append(("FALLO", nombre + " -> " + type(exc).__name__ + ": " + str(exc)))

          pid_ref = {}

          def preparar_datos():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects", {
                  "titulo": "ZYRA El Salvador", "tipo": "presentacion",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              pid_ref["proyecto"] = cuerpo["datos"]["proyecto"]
              base = "/laboratorio/api/v1/projects/" + pid_ref["proyecto"]["id"] + "/scenarios"
              status, cuerpo, _, _ = llamada("POST", base, {
                  "tipo": "A", "titulo": "Linea base", "parametros": {"costo": 20, "beneficio": 80, "riesgo": 10},
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status)

          def t_ui_sin_zid():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/ui")
              assert status == 401, "status=" + str(status)

          def t_ui_home_creador():
              status, _, html, headers_out = llamada("GET", "/laboratorio/ui", headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              assert headers_out["Content-Type"].startswith("text/html")
              texto = html.decode("utf-8")
              assert "ZYRA LABORATORIO" in texto
              assert ">Capturar<" in texto, "creador debe ver Capturar"
              assert ">Gobierno<" not in texto, "creador NO debe ver Gobierno"
              assert "ZYRA El Salvador" in texto, "proyecto real debe listarse"
              assert "form-documento" in texto, "capturador de documentos debe estar en el home"
              assert escapar("ZID-DUENO-1") in texto

          def t_ui_home_gobernador():
              status, _, html, _ = llamada("GET", "/laboratorio/ui", headers=H_GOBERNADOR)
              assert status == 200, "status=" + str(status)
              texto = html.decode("utf-8")
              assert ">Gobierno<" in texto
              assert ">Red<" in texto
              assert "form-documento" in texto

          def t_ui_home_espectador():
              status, _, html, _ = llamada("GET", "/laboratorio/ui", headers=H_OTRO)
              assert status == 200, "status=" + str(status)
              texto = html.decode("utf-8")
              assert ">Capturar<" not in texto
              assert ">Inicio<" in texto
              assert "form-documento" not in texto, "espectador no debe ver el capturador"

          def t_ui_panel_simular():
              status, _, html, _ = llamada("GET", "/laboratorio/ui/simular", headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              texto = html.decode("utf-8")
              assert "Escenarios" in texto
              assert texto.count('data-accion=') == 3, "Ley 3: simular debe tener exactamente 3 botones vivos"
              assert "ZYRA El Salvador" in texto
              assert "EN VIVO" in texto

          def t_ui_panel_honesto():
              status, _, html, _ = llamada("GET", "/laboratorio/ui/capturar", headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              texto = html.decode("utf-8")
              assert texto.count('class="btn') == 3, "Ley 3: capturar debe tener exactamente 3 botones"
              assert "disabled" in texto and "F2" in texto

          def t_ui_panel_403():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/ui/gobierno", headers=H_OTRO)
              assert status == 403, "status=" + str(status)

          def t_ui_menu_404():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/ui/noexiste", headers=H_DUENO)
              assert status == 404, "status=" + str(status)

          def t_ui_assets():
              status, _, datos, headers_out = llamada("GET", "/laboratorio/ui/assets/logo.svg", headers=H_DUENO)
              assert status == 200 and headers_out["Content-Type"] == "image/svg+xml"
              assert b"<svg" in datos
              status, _, datos, headers_out = llamada("GET", "/laboratorio/ui/assets/icons.svg", headers=H_DUENO)
              assert status == 200 and b"i-simular" in datos
              status, _, datos, headers_out = llamada("GET", "/laboratorio/ui/assets/tokens.json", headers=H_DUENO)
              assert status == 200 and b"botones_por_vista" in datos
              status, _, datos, headers_out = llamada("GET", "/laboratorio/ui/assets/es.json", headers=H_DUENO)
              assert status == 200 and b"crear_doc" in datos
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/ui/assets/otro.png", headers=H_DUENO)
              assert status == 404

          def t_ui_ley3_y_subs():
              status, _, html, _ = llamada("GET", "/laboratorio/ui/crear?sub=Video", headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              texto = html.decode("utf-8")
              assert ">Video<" in texto and "tab activo" in texto
              assert texto.count('class="btn') == 3
              assert "F3" in texto

          def t_parse_preview_ley():
              texto = (
                  "Ley de Fomento Digital\n"
                  "Articulo 1: Se crea el sistema nacional de datos.\n"
                  "Articulo 2: Toda institucion publicara indicadores mensuales."
              )
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/parse-document", {"documento": texto}, headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              datos = cuerpo["datos"]["parseo"]
              assert datos["tipo"] == "ley", "tipo=" + datos["tipo"]
              assert datos["tipo_detectado"] is True
              assert datos["titulo"] == "Ley de Fomento Digital"
              assert datos["palabras"] > 10

          def t_crear_desde_documento_agro():
              texto = (
                  "Finca Los Andes\n"
                  "Cultivo de cafe y ganado mayor.\n"
                  "Parcela de 40 manzanas con riego por goteo.\n"
                  "Cosecha de granadilla en temporada seca."
              )
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/documents/create-project", {"documento": texto}, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              proy = cuerpo["datos"]["proyecto"]
              assert proy["tipo"] == "agro", "tipo=" + proy["tipo"]
              assert proy["titulo"] == "Finca Los Andes"
              assert proy["etapa"] == "describir"
              assert "documento" in proy["etiquetas"]
              assert cuerpo["datos"]["documento"]["tipo_detectado"] is True
              assert cuerpo["datos"]["documento"]["palabras"] >= 10

          def t_crear_con_override():
              texto = (
                  "Propuesta Mixta\n"
                  "Documento que combina varios temas distintos sin dominio claro."
              )
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/documents/create-project", {
                  "documento": texto, "titulo": "Proyecto con titulo manual", "tipo": "negocio",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              proy = cuerpo["datos"]["proyecto"]
              assert proy["titulo"] == "Proyecto con titulo manual"
              assert proy["tipo"] == "negocio"

          def t_documento_corto_rechazado():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/parse-document", {"documento": "corto"}, headers=H_DUENO)
              assert status == 400, "status=" + str(status)

          def t_parse_requiere_rol():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/parse-document", {"documento": "x" * 50}, headers=H_OTRO)
              assert status == 403, "status=" + str(status)

          def t_parser_unitario_varios():
              casos = {
                  "Escuela de Robotica\nEstudiantes de secundaria aprenderan con becas y clases sabatinas.": "educacion",
                  "Carretera Costera del Sur\nPuente y obra civil de 30 kilometros con drenaje.": "infraestructura",
                  "App de Bolsa\nLos usuarios veran su portafolio en la plataforma movil.": "app",
              }
              for texto, esperado in casos.items():
                  p = parsear_documento(texto)
                  assert p["tipo"] == esperado, texto[:30] + " -> " + p["tipo"] + " (esperado " + esperado + ")"
              p = parsear_documento("Texto completamente neutro sin terminos especiales de ningun dominio conocido aqui dentro.")
              assert p["tipo"] == "presentacion" and p["tipo_detectado"] is False

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              assert cuerpo["ok"] is True
              total = len(cuerpo["datos"]["rutas"])
              assert total == 12, "se esperaban 12 rutas, hay " + str(total)
              ids_modulos = {m["id"] for m in cuerpo["datos"]["modulos"]}
              assert ids_modulos == {"capture", "simulation"}, str(ids_modulos)

          def t_plantillas_validas():
              assert verificar_plantillas() == 4
              base = cargar_plantilla("base.html")
              claves = validar_plantilla(base)
              assert "nav" in claves and "contenido" in claves
              html = render(base, {
                  "titulo": "T", "nav": "<b>NAV</b>", "contenido": "<i>OK</i>",
                  "rol_nombre": "R", "zid": "Z&Z", "roles": "R1",
              })
              assert "<b>NAV</b>" in html and "Z&amp;Z" in html
              assert textos()["ui.nuevo_proyecto"] == "Nuevo proyecto"

          def t_fases_completas():
              from apps.laboratorio.registry.menus.menu_tree import ids as ids_menus
              for id_menu in ids_menus():
                  if id_menu != "inicio":
                      assert id_menu in FASE_POR_MENU, "fase ausente para " + id_menu
              assert FASE_POR_MENU["simular"] == 1

          sum_write("")
          sum_write("### Pruebas end-to-end HTTP + UI + Documentos (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Datos base: proyecto + escenario A", preparar_datos)
          check("UI exige ZID (401)", t_ui_sin_zid)
          check("Home creador: menu filtrado + proyecto + capturador", t_ui_home_creador)
          check("Home gobernador ve todo + capturador", t_ui_home_gobernador)
          check("Home espectador: solo lectura, sin capturador", t_ui_home_espectador)
          check("Panel simular EN VIVO con Ley 3 (3 botones)", t_ui_panel_simular)
          check("Panel capturar honesto: 3 botones F2", t_ui_panel_honesto)
          check("Panel prohibido por rol (403)", t_ui_panel_403)
          check("Menu inexistente (404)", t_ui_menu_404)
          check("Assets reales: logo, iconos, tokens, textos", t_ui_assets)
          check("Submenues con tabs + Ley 3 en crear/Video", t_ui_ley3_y_subs)
          check("Parseo de ley: tipo ley detectado", t_parse_preview_ley)
          check("Crear proyecto desde documento de finca (agro)", t_crear_desde_documento_agro)
          check("Crear con titulo y tipo manual (override)", t_crear_con_override)
          check("Documento corto rechazado (400)", t_documento_corto_rechazado)
          check("Parseo requiere rol (403 espectador)", t_parse_requiere_rol)
          check("Parser unitario: educacion, infraestructura, app, default", t_parser_unitario_varios)
          check("Indice publico: 12 rutas, modulos capture+simulation", t_indice_publico)
          check("Plantillas validas con auto-escape", t_plantillas_validas)
          check("Fases declaradas para los 18 menus", t_fases_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 1 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 1A-5 aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 1A-5: UI real, capturador de documentos y Ley 3 verificada"
            git push
          fi
