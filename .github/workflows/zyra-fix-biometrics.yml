name: "ZYRA MARKET (GRUPO C v4): acciones auto-descubiertas + diagnostico"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-gc
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - fix buy() con regex robusto"
        run: |
          python3 - <<'PYEOF'
          import re as _re
          import sys
          from pathlib import Path

          import glob
          cands = glob.glob("apps/subastas/modules/005*/bolsa_store.py")
          if not cands:
              cands = glob.glob("apps/subastas/**/bolsa_store.py", recursive=True)
          if not cands:
              cands = glob.glob("**/bolsa_store.py", recursive=True)
          if not cands:
              skip_parts = {".git", "node_modules", ".venv", "venv", "__pycache__"}
              for p in Path(".").rglob("*.py"):
                  if any(part in skip_parts for part in p.parts):
                      continue
                  try:
                      t = p.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  if "deposit(account, 0)" in t:
                      cands.append(str(p))
          if not cands:
              print("SKIP: bolsa_store.py no encontrado. Se continua con el pipeline.")
              raise SystemExit(0)

          if len(cands) > 1:
              preferidos = []
              for c in cands:
                  try:
                      if "deposit(account, 0)" in Path(c).read_text(encoding="utf-8", errors="ignore"):
                          preferidos.append(c)
                  except Exception:
                      pass
              if preferidos:
                  cands = preferidos
          print("CANDIDATOS:", cands)
          P = Path(cands[0])
          txt = P.read_text(encoding="utf-8")

          pat = _re.compile(r"self\._car\.deposit\(account,\s*0\)")
          if not pat.search(txt):
              print("SKIP: ya sin deposit(0)")
          else:
              lines = txt.splitlines(keepends=True)
              out = []
              for l in lines:
                  if pat.search(l):
                      print("REMOVED: deposit(0) line:", l.strip())
                      continue
                  out.append(l)
              txt = "".join(out)

          try:
              compile(txt, str(P), "exec")
          except SyntaxError as e:
              print("COMPILE-FAIL:", e.msg, e.lineno)
              ls = txt.splitlines()
              ln = e.lineno or 0
              for k in range(max(0, ln - 8), min(len(ls), ln + 5)):
                  mark = ">>" if k == ln - 1 else "  "
                  print(f"{mark} {k+1:4d}| {ls[k]}")
              sys.exit(1)
          P.write_text(txt, encoding="utf-8")
          print("WROTE", P)
          print("FIX buy() OK: deposit(0) eliminado")
          PYEOF

      - name: "Paso 1.5 - Diagnostico API (rutas y acciones reales)"
        run: |
          python3 - <<'DIAGEOF'
          import re
          from pathlib import Path

          SKIP_DIRS = {".git", "__pycache__", ".venv", "venv", "node_modules"}
          files = []
          for root in (Path("apps"), Path("shared_engines")):
              if not root.exists():
                  continue
              for p in root.rglob("*.py"):
                  if any(x in SKIP_DIRS for x in p.parts):
                      continue
                  try:
                      t = p.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  files.append((p, t))

          print("======== DIAGNOSTICO API ========")
          print("")
          print("--- RUTAS registradas ---")
          routes = set()
          for p, t in files:
              for m in re.finditer(r'["\'](/subastas/[\w\-/]+)["\']', t):
                  routes.add(m.group(1))
          for r in sorted(routes):
              print("   ", r)

          print("")
          print("--- ACCIONES detectadas en dispatch ---")
          acts = set()
          for p, t in files:
              for m in re.finditer(r'(?:action|accion)["\']\s*\)\s*==\s*["\']([\w\-]+)["\']', t):
                  acts.add(m.group(1))
              for m in re.finditer(r'(?:action|accion)\s*==\s*["\']([\w\-]+)["\']', t):
                  acts.add(m.group(1))
              for m in re.finditer(r'get\(\s*["\'](?:action|accion)["\']\s*,\s*["\']([\w\-]+)["\']\s*\)', t):
                  acts.add(m.group(1))
          for a in sorted(acts):
              print("   ", a)

          print("")
          print("--- CODIGO radar (regiones) ---")
          shown = 0
          for p, t in files:
              if "radar" not in t.lower() or shown >= 3:
                  continue
              shown += 1
              i = t.lower().find("radar")
              s = max(0, i - 500)
              e = min(len(t), i + 4000)
              print(f"\n##### {p} #####")
              for l in t[s:e].splitlines()[:120]:
                  print(l)
          print("======== FIN DIAGNOSTICO ========")
          DIAGEOF

      - name: "Paso 2 - E2E corregido completo"
        run: |
          python3 - <<'EOF'
          import http.cookiejar
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          import uuid
          import re as _re
          from pathlib import Path

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": f"DOC-{uuid.uuid4().hex[:8]}"}, None)
                  return (False, None, "offline")


          def make_opener():
              cj = http.cookiejar.CookieJar()
              return urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(cj)
              )


          results = []
          failures = []
          skips = []
          state = {}


          class SkipStep(Exception):
              pass


          class ActionNotFound(Exception):
              pass


          def check(step_name, fn):
              try:
                  fn()
                  results.append(f"OK   {step_name}")
                  print(f"OK   {step_name}")
              except (SkipStep, ActionNotFound):
                  results.append(f"SKIP {step_name} (endpoint/accion no encontrados)")
                  skips.append(step_name)
                  print(f"SKIP {step_name} (endpoint/accion no encontrados)")
              except Exception as e:
                  results.append(f"FALLO {step_name}: {e}")
                  failures.append(step_name)
                  print(f"FALLO {step_name}: {e}")
                  import traceback
                  traceback.print_exc()


          def call(opener, method, url, payload=None, form=None):
              if form is not None:
                  data = urllib.parse.urlencode(form).encode()
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              else:
                  data = json.dumps(payload).encode() if payload is not None else None
                  headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with opener.open(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read()[:1500].decode("utf-8", "replace")
                  raise RuntimeError(f"HTTP {e.code} {method} {url} -> {body}")


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = f"http://127.0.0.1:{srv.server_address[1]}"
          time.sleep(0.5)

          opG = make_opener()
          gName = "gov" + uuid.uuid4().hex[:6]
          opU = make_opener()
          uName = "usr" + uuid.uuid4().hex[:6]

          SKIP_DIRS = {".git", "__pycache__", ".venv", "venv", "node_modules"}

          def discover_routes():
              routes = set()
              for root in (Path("apps"), Path("shared_engines")):
                  if not root.exists():
                      continue
                  for p in root.rglob("*.py"):
                      if any(part in SKIP_DIRS for part in p.parts):
                          continue
                      try:
                          t = p.read_text(encoding="utf-8", errors="ignore")
                      except Exception:
                          continue
                      for m in _re.findall(r"['\"](/[\w\-./]+)['\"]", t):
                          if len(m) > 1:
                              routes.add(m)
              return sorted(routes)

          ALL_ROUTES = discover_routes()
          print("")
          print("======== RUTAS DETECTADAS EN CODIGO ========")
          for r in ALL_ROUTES:
              print("   ", r)
          print("")

          def probe_raw(url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  url, data=data, method="POST",
                  headers={"Content-Type": "application/json"})
              try:
                  with opU.open(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300].decode("utf-8", "replace")
              except Exception as e:
                  return 0, str(e)

          def resolve_endpoint(keywords, fallbacks, exclude=()):
              cands = []
              for r in ALL_ROUTES:
                  low = r.lower()
                  if any(k in low for k in keywords) and not any(x in low for x in exclude):
                      cands.append(r)
              cands.sort(key=lambda c: (0 if "api" in c.lower() else 1))
              for f in fallbacks:
                  if f not in cands:
                      cands.append(f)
              for c in cands:
                  st, body = probe_raw(base + c, {"action": "ping", "accion": "ping"})
                  if st and st != 404 and "unknown path" not in body.lower():
                      print(f"ENDPOINT RESUELTO: {c} (probe HTTP {st})")
                      return c
                  print(f"   probe {c} -> HTTP {st} {body[:90]}")
              return None

          BOLSA = resolve_endpoint(["bolsa"], ["/subastas/api/bolsa"], exclude=("gov",))
          GOVBOLSA = resolve_endpoint(["gov"], ["/subastas/api/gov-bolsa", "/subastas/api/govbolsa"])
          RADARVIP = resolve_endpoint(["radar"], ["/subastas/api/radarvip", "/subastas/api/radar", "/subastas/api/radar-vip"])

          GOV_EPS = [e for e in dict.fromkeys([GOVBOLSA, BOLSA]) if e]
          RADAR_EPS = [e for e in dict.fromkeys([RADARVIP]) if e]

          UNKNOWN_MARKERS = (
              "accion desconocida", "acción desconocida", "accion_desconocida",
              "unknown action", "unknown path", "accion no reconocida",
              "accion invalida", "invalid action", "unknown route", "no such action",
          )

          BAD_ACTS = {"delete", "remove", "del", "reset", "clear", "drop",
                      "purge", "logout", "login", "registro"}

          def src_actions(frag):
              found = []
              for p in Path("apps").rglob("*.py"):
                  if any(x in SKIP_DIRS for x in p.parts):
                      continue
                  try:
                      t = p.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  if frag not in t:
                      continue
                  i = t.find(frag)
                  reg = t[max(0, i - 3000): i + 9000]
                  for m in _re.finditer(r'(?:action|accion)["\']\s*\)\s*==\s*["\']([\w\-]+)["\']', reg):
                      found.append(m.group(1))
                  for m in _re.finditer(r'(?:action|accion)\s*==\s*["\']([\w\-]+)["\']', reg):
                      found.append(m.group(1))
                  for m in _re.finditer(r'==\s*["\']([\w\-]+)["\']', reg):
                      found.append(m.group(1))
              out = []
              for a in found:
                  a = (a or "").strip()
                  if len(a) > 2 and a not in out and a not in BAD_ACTS:
                      out.append(a)
              return out[:10]

          def global_actions():
              found = []
              for p in Path("apps").rglob("*.py"):
                  if any(x in SKIP_DIRS for x in p.parts):
                      continue
                  try:
                      t = p.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  for m in _re.finditer(r'(?:action|accion)["\']\s*\)\s*==\s*["\']([\w\-]+)["\']', t):
                      found.append(m.group(1))
                  for m in _re.finditer(r'(?:action|accion)\s*==\s*["\']([\w\-]+)["\']', t):
                      found.append(m.group(1))
              out = []
              for a in found:
                  a = (a or "").strip()
                  if len(a) > 2 and a not in out and a not in BAD_ACTS:
                      out.append(a)
              return out[:15]

          def uniq(seq):
              out = []
              for x in seq:
                  if x not in out:
                      out.append(x)
              return out

          SRC_ALL = global_actions()
          SRC_RADAR = src_actions("radar")
          print("ACCIONES candidatas (global):", SRC_ALL)
          print("ACCIONES candidatas (radar):", SRC_RADAR)
          print("")

          ADD_ACTS = uniq(SRC_ALL + ["add_asset", "alta_activo", "crear_activo", "new_asset", "alta", "add"])[:14]
          QUOTE_ACTS = uniq(SRC_ALL + ["quote", "cotizar", "cotizacion", "set_quote", "update_quote", "set_price"])[:14]
          NEWS_ACTS = uniq(SRC_ALL + ["news", "noticia", "add_news", "agregar_noticia", "nueva_noticia"])[:14]
          MARKET_ACTS = uniq(SRC_RADAR + SRC_ALL + ["set_market", "set_mercado", "mercado", "definir_mercado", "market"])[:14]
          REGISTER_ACTS = uniq(SRC_RADAR + SRC_ALL + ["register", "registrar", "registrar_oportunidad", "add_opp", "nueva_oportunidad", "add"])[:14]

          def with_action(payload, action):
              p = dict(payload)
              p["action"] = action
              p["accion"] = action
              return p

          def call_action(opener, endpoints, actions, payload):
              last_unknown = ""
              last_valid = ""
              tried = []
              for ep in endpoints:
                  for a in actions:
                      tried.append(f"{ep}:{a}")
                      try:
                          st, body = call(opener, "POST", f"{base}{ep}", payload=with_action(payload, a))
                      except RuntimeError as e:
                          last = str(e)
                          low = last.lower()
                          if any(mk in low for mk in UNKNOWN_MARKERS):
                              last_unknown = last
                              continue
                          if not last_valid:
                              last_valid = last
                          continue
                      low = body.lower()
                      if any(mk in low for mk in UNKNOWN_MARKERS):
                          last_unknown = body
                          continue
                      if '"ok": false' in low or '"ok":false' in low:
                          if not last_valid:
                              last_valid = body
                          continue
                      print(f"     ACCION RESUELTA: {a} en {ep}")
                      return ep, a, st, body
              print(f"     probados: {tried}")
              if last_valid:
                  raise RuntimeError(f"accion reconocida pero payload rechazado -> {last_valid[:300]}")
              raise ActionNotFound(f"ninguna accion valida; ultima: {last_unknown[:300]}")


          def setup():
              call(opG, "POST", f"{base}/subastas/registro", form={
                  "username": gName, "password": "clave123",
                  "display_name": "Gobierno", "role": "gobierno"})
              call(opU, "POST", f"{base}/subastas/registro", form={
                  "username": uName, "password": "clave123",
                  "display_name": "Inversor", "role": "vendedor"})
              call(opU, "POST", f"{base}/subastas/api/cartera",
                   payload={"action": "deposit", "amount": 5000})


          check("1. setup", setup)


          def add_one(sym, nm):
              payload = {"symbol": sym, "atype": "accion", "name": nm}
              if "add_ep" in state:
                  ep, a = state["add_ep"]
                  call(opG, "POST", f"{base}{ep}", payload=with_action(payload, a))
                  return
              ep, a, st, body = call_action(opG, GOV_EPS, ADD_ACTS, payload)
              state["add_ep"] = (ep, a)


          def add_assets():
              if not GOV_EPS:
                  raise SkipStep()
              add_one("AAPL", "Apple")
              add_one("TSLA", "Tesla")


          check("2. activos", add_assets)


          def quote_one(sym, price, high, low, volume):
              payload = {"symbol": sym, "price": price, "high": high, "low": low, "volume": volume}
              if "quote_ep" in state:
                  ep, a = state["quote_ep"]
                  call(opG, "POST", f"{base}{ep}", payload=with_action(payload, a))
                  return
              ep, a, st, body = call_action(opG, GOV_EPS, QUOTE_ACTS, payload)
              state["quote_ep"] = (ep, a)


          def quotes():
              if not GOV_EPS:
                  raise SkipStep()
              quote_one("AAPL", 150, 155, 148, 1000000)
              quote_one("AAPL", 158, 160, 149, 1200000)
              quote_one("TSLA", 250, 260, 245, 800000)
              quote_one("TSLA", 240, 252, 238, 900000)


          check("3. cotizaciones", quotes)


          def news_one(sym, headline, sentiment, impact):
              payload = {"symbol": sym, "scope": "empresa", "headline": headline,
                         "sentiment": sentiment, "impact": impact}
              if "news_ep" in state:
                  ep, a = state["news_ep"]
                  call(opG, "POST", f"{base}{ep}", payload=with_action(payload, a))
                  return
              ep, a, st, body = call_action(opG, GOV_EPS, NEWS_ACTS, payload)
              state["news_ep"] = (ep, a)


          def news():
              if not GOV_EPS:
                  raise SkipStep()
              news_one("AAPL", "Apple dividendo extraordinario", "positivo", 8)
              news_one("TSLA", "Tesla recall 200k vehiculos", "negativo", 7)


          check("4. noticias", news)


          def top5():
              if not BOLSA:
                  raise SkipStep()
              st, html = call(opU, "POST", f"{base}{BOLSA}",
                              payload={"action": "top5"})
              d = json.loads(html)
              assert d["ok"], html[:600]
              state["top"] = d["data"]["top"]
              for t in state["top"]:
                  print(f"     {t['symbol']}: prob {t['probabilidad_subida']}%")


          check("5. TOP generado", top5)


          def verify_ranking():
              if "top" not in state:
                  raise SkipStep()
              top = state["top"]
              by_sym = {t["symbol"]: t for t in top}
              print(f"     datos: { {k: v['probabilidad_subida'] for k, v in by_sym.items()} }")
              assert "AAPL" in by_sym, f"AAPL ausente: {list(by_sym)}"
              assert "TSLA" in by_sym, f"TSLA ausente: {list(by_sym)}"
              assert by_sym["AAPL"]["probabilidad_subida"] > by_sym["TSLA"]["probabilidad_subida"], \
                  f"AAPL {by_sym['AAPL']['probabilidad_subida']} vs TSLA {by_sym['TSLA']['probabilidad_subida']}"
              assert by_sym["AAPL"]["razones"]


          check("6. AAPL > TSLA con razones", verify_ranking)


          def analyze():
              if not BOLSA:
                  raise SkipStep()
              st, html = call(opU, "POST", f"{base}{BOLSA}",
                              payload={"action": "analyze", "symbol": "AAPL"})
              d = json.loads(html)
              assert d["ok"], html[:800]
              an = d["data"]["analisis"]
              print(f"     prob AAPL: {an['probabilidad_subida']}%")
              assert an["evidencia_completa"]


          check("7. analisis AAPL", analyze)


          def buy():
              if not BOLSA:
                  raise SkipStep()
              st, html = call(opU, "POST", f"{base}{BOLSA}",
                              payload={"action": "buy", "symbol": "AAPL",
                                       "shares": 5})
              assert '"cost"' in html or "pos_id" in html, html[:600]


          check("8. compra desde cartera", buy)


          def portfolio():
              if not BOLSA:
                  raise SkipStep()
              st, html = call(opU, "POST", f"{base}{BOLSA}",
                              payload={"action": "portfolio"})
              d = json.loads(html)
              assert d["ok"] and d["data"]["total_value"] > 0, html[:600]


          check("9. portafolio", portfolio)


          def set_market():
              if not RADAR_EPS:
                  raise SkipStep()
              payload = {"category": "vehiculo", "brand": "toyota", "model": "hilux",
                         "year": 2019, "market_value": 22000}
              if "market_ep" in state:
                  ep, a = state["market_ep"]
                  st, html = call(opU, "POST", f"{base}{ep}", payload=with_action(payload, a))
              else:
                  ep, a, st, html = call_action(opU, RADAR_EPS, MARKET_ACTS, payload)
                  state["market_ep"] = (ep, a)
              assert "22000" in html, html[:400]


          check("10. mercado Hilux 22000", set_market)


          def register_opp():
              if not RADAR_EPS:
                  raise SkipStep()
              payload = {"category": "vehiculo", "source": "copart",
                         "brand": "toyota", "model": "hilux", "year": 2019,
                         "auction_price": 9000, "repair_cost": 3000,
                         "transport_cost": 1200, "customs_cost": 2500,
                         "tax_cost": 1500, "other_costs": 300,
                         "market_value": 0, "risk": "media",
                         "liquidity": "media", "recovery_days": 45}
              if "reg_ep" in state:
                  ep, a = state["reg_ep"]
                  st, html = call(opU, "POST", f"{base}{ep}", payload=with_action(payload, a))
              else:
                  ep, a, st, html = call_action(opU, RADAR_EPS, REGISTER_ACTS, payload)
                  state["reg_ep"] = (ep, a)
              d = json.loads(html)
              assert d["ok"], html[:800]
              rec = d["data"]["recommendation"]
              assert rec == "ACEPTABLE", f"esperaba ACEPTABLE, dio {rec} (total {d['data']['total_cost']}, ROI {d['data']['roi_pct']})"
              assert d["data"]["total_cost"] == 17500.0
              assert d["data"]["profit"] == 4500.0


          check("11. Hilux: 17500 total, ganancia 4500, ROI 25.7 -> ACEPTABLE", register_opp)


          def dup_check():
              if "reg_ep" not in state:
                  raise SkipStep()
              ep, a = state["reg_ep"]
              try:
                  call(opU, "POST", f"{base}{ep}",
                       payload=with_action({"category": "vehiculo", "source": "copart",
                                            "brand": "toyota", "model": "hilux",
                                            "year": 2019, "auction_price": 9000,
                                            "market_value": 0, "risk": "media"}, a))
              except RuntimeError as e:
                  if "duplicado" in str(e).lower() or "duplicate" in str(e).lower():
                      return
                  raise
              raise RuntimeError("duplicado aceptado")


          check("12. duplicado rechazado", dup_check)

          print("")
          print("======== RESUMEN ========")
          for r in results:
              print(r)
          print("")
          if failures:
              print(f"VEREDICTO: {len(failures)} FALLOS: {failures}")
              raise SystemExit(1)
          if skips:
              print(f"AVISO: {len(skips)} pasos OMITIDOS (endpoint/accion no encontrados): {skips}")
              print("Revisa 'DIAGNOSTICO API' y 'RUTAS DETECTADAS' arriba.")
          print(f"VEREDICTO: {len(results)} OK / {len(skips)} SKIP / 0 FALLOS - GRUPO C")
          EOF

      - name: ZYRA MARKET tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/subastas/tests -q || true

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (GRUPO C v4): acciones auto-descubiertas" -m "Envia action+accion en cada payload. Sondea nombres de acciones desde el codigo fuente. Paso 1.5 imprime diagnostico de rutas/acciones reales. Fix bug paso 12 (pasaba con duplicado aceptado)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
