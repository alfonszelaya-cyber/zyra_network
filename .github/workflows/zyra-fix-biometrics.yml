              "red.html",
          )


          def verificar_plantillas() -> int:
              """Valida que las 19 plantillas existan y sean legibles."""
              total = 0
              for nombre in PLANTILLAS_OFICIALES:
                  cargar_plantilla(nombre)
                  total += 1
              return total
          ZYRA_EOF
