name: ZYRA S2c nombres reales de funciones de subastas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s2c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Defs y raiz
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          ROOT = Path.cwd()
          t = (ROOT / 'apps' / 'subastas' / 'server.py').read_text(encoding='utf-8', errors='replace')
          ls = t.splitlines()
          OUT = []
          def add(s=''):
              OUT.append(str(s))
          add('# S2c - DEFS REALES DE server.py (subastas)')
          add('')
          add('## Todas las funciones def de la clase:')
          add('```python')
          for i, l in enumerate(ls):
              if re.match(r'    def \w+', l):
                  add('%d: %s' % (i + 1, l.strip()[:120]))
          add('```')
          add('')
          add('## La ruta raiz /subastas/ y a que funcion llama:')
          add('```python')
          for i, l in enumerate(ls):
              if '/subastas' in l and ('menu' in l or 'path ==' in l):
                  add('%d: %s' % (i + 1, l.strip()[:130]))
          add('```')
          add('')
          add('## Primeras 20 lineas de la funcion que genera la pagina raiz')
          add('(buscamos page o home o index):')
          add('```python')
          candidata = None
          for i, l in enumerate(ls):
              if re.match(r'    def \w*(page|home|index|principal)\w*', l, re.I):
                  candidata = i
                  break
          if candidata is not None:
              for j in range(candidata, min(candidata + 20, len(ls))):
                  add('%d: %s' % (j + 1, ls[j].rstrip()[:150]))
          else:
              add('(no hay funcion con page/home/index en el nombre)')
          add('```')
          add('')
          add('## Como se llama la ruta /subastas/ (contexto alrededor de linea 237):')
          add('```python')
          for j in range(225, min(250, len(ls))):
              add('%d: %s' % (j + 1, ls[j].rstrip()[:150]))
          add('```')
          Path('s2c.md').write_text('\n'.join(OUT), encoding='utf-8')
          print('S2c OK')
          PYEOF
