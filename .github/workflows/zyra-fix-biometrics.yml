name: "AXIS AX-4: catalogo tipado (11 eventos) + POST /axis/api/network/sync"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - VERIFICAR estado del repo (AX-1/2/3 cerrados)"
        run: |
          python3 - <<'VEREOF'
          from pathlib import Path
          link = Path("apps/axis/services/axis_link.py").read_text(encoding="utf-8")
          srv = Path("apps/axis/server.py").read_text(encoding="utf-8")
          perm = Path("apps/axis/life_history/permissions.py").read_text(encoding="utf-8")
          tst = Path("apps/axis/tests/test_axis.py").read_text(encoding="utf-8")
          assert "biometria:" in link and "use enroll_person" in link, "falta ley"
          assert "verify_service = verify_service" in srv, "falta serve_axis"
          assert '"gobierno", "ingesta"' in srv, "falta ingesta"
          assert "register_birth_with_network" in srv, "falta rama ingesta"
          assert "def validate_event_type" not in Path(
              "apps/axis/life_history/outbox_bridge.py").read_text(
              encoding="utf-8"), "catalogo ya presente (ok si skip)"
          assert "def _lh(" in srv, "falta _lh"
          assert "test_axz_full_government_flow" in tst, "faltan tests AX"
          print("OK repo consistente (base AX-3)")
          VEREOF

      - name: "Paso B - catalogo tipado en outbox_bridge.py (9 + emergency/evidence, aditivo)"
        run: |
          python3 - <<'CATEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/life_history/outbox_bridge.py")
          assert p.exists(), "outbox_bridge.py no existe"
          t = p.read_text(encoding="utf-8")
          if "def validate_event_type" in t:
              print("SKIP catalogo (ya presente)")
              raise SystemExit(0)
          ANCHOR = (
              '    "security_status": "life.security.event",\n'
              "}\n"
          )
          cnt = t.count(ANCHOR)
          assert cnt == 1, (
              "ancla catalogo hallada " + str(cnt)
              + " (esperaba 1)")
          ADD = (
              '    "security_status": "life.security.event",\n'
              "}\n"
              "\n"
              "# AX-4: catalogo tipado completo"
              " (9 eventos AXIS + emergency/evidence).\n"
              '_EVENT_TO_LIFE["emergency"] ='
              ' "life.emergency.event"\n'
              '_EVENT_TO_LIFE["evidence"] ='
              ' "life.evidence.event"\n'
              "\n"
              "EVENT_CATALOG = _EVENT_TO_LIFE\n"
              "\n"
              "\n"
              "def validate_event_type(event_type):\n"
              '    """True si el tipo esta en el'
              ' catalogo (validacion antes de'
              ' emitir)."""\n'
              "    return str(event_type)"
              " in EVENT_CATALOG\n"
          )
          t = t.replace(ANCHOR, ADD, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          from apps.axis.life_history.outbox_bridge import (
              EVENT_CATALOG, validate_event_type)
          assert len(EVENT_CATALOG) == 11, str(
              sorted(EVENT_CATALOG.keys()))
          assert validate_event_type(
              "birth_registered") is True
          assert validate_event_type(
              "otro") is False
          print("OK catalogo tipado (11 eventos,"
                " AST valido, import fresco)")
          CATEOF

      - name: "Paso C - serve_axis outbox_bridge + ruta POST /axis/api/network/sync"
        run: |
          python3 - <<'SRVEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if "outbox_bridge=None," in t:
              print("SKIP serve_axis (ya tiene outbox_bridge)")
          else:
              SIG = (
                  "    life_history_service=None,\n"
                  "    verify_service=None,\n"
                  ") -> AxisServer:\n"
              )
              cnt = t.count(SIG)
              assert cnt == 1, (
                  "firma serve_axis hallada " + str(cnt))
              t = t.replace(
                  SIG,
                  "    life_history_service=None,\n"
                  "    verify_service=None,\n"
                  "    outbox_bridge=None,\n"
                  ") -> AxisServer:\n",
                  1,
              )
              ASIG = (
                  "    AxisApiHandler.verify_service = verify_service\n"
                  "    return AxisServer((host, port))\n"
              )
              cnt = t.count(ASIG)
              assert cnt == 1, (
                  "asignacion serve_axis hallada " + str(cnt))
              t = t.replace(
                  ASIG,
                  "    AxisApiHandler.verify_service = verify_service\n"
                  "    AxisApiHandler.outbox_bridge = outbox_bridge\n"
                  "    return AxisServer((host, port))\n",
                  1,
              )
              print("OK serve_axis con outbox_bridge")
          if '"network", "sync"' in t:
              print("SKIP ruta sync (ya presente)")
          else:
              ANCHOR = (
                  "        store = type(self).store\n"
                  "        doc = self._read_json()\n"
                  '        if s == ["gobierno", "ingesta"]:\n'
              )
              cnt = t.count(ANCHOR)
              assert cnt == 1, (
                  "ancla _api_post hallada " + str(cnt))
              BRANCH = (
                  '        if s == ["network", "sync"]:\n'
                  "            from apps.axis.life_history.permissions import (\n"
                  "                authorize,\n"
                  "            )\n"
                  "            role = (\n"
                  "                self.headers.get(\n"
                  '                    "X-ZYRA-Actor-Role"\n'
                  '                ) or ""\n'
                  "            )\n"
                  "            if not authorize(\n"
                  '                "network.sync", role\n'
                  "            ):\n"
                  "                self._send(\n"
                  "                    403,\n"
                  "                    {\n"
                  '                        "ok": False,\n'
                  '                        "error": {\n'
                  '                            "type": "forbidden",\n'
                  '                            "message":\n'
                  '                            "sync solo"\n'
                  '                            " gobierno/registro",\n'
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            bridge = (\n"
                  "                type(self).outbox_bridge\n"
                  "            )\n"
                  "            if bridge is None:\n"
                  "                self._send(\n"
                  "                    503,\n"
                  "                    {\n"
                  '                        "ok": False,\n'
                  '                        "error": {\n'
                  '                            "type":\n'
                  '                            "not_wired",\n'
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            result = (\n"
                  "                bridge.sync_pending()\n"
                  "            )\n"
                  "            self._send(\n"
                  "                200,\n"
                  "                {\n"
                  '                    "ok": True,\n'
                  '                    "data": result,\n'
                  "                },\n"
                  "            )\n"
                  "            return\n"
              )
              t = t.replace(
                  ANCHOR,
                  "        store = type(self).store\n"
                  "        doc = self._read_json()\n"
                  + BRANCH
                  + '        if s == ["gobierno", "ingesta"]:\n',
                  1,
              )
              print("OK ruta network/sync insertada")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          t2 = p.read_text(encoding="utf-8")
          assert "AxisApiHandler.outbox_bridge" in t2
          assert t2.count('if s == ["network", "sync"]:') == 1
          print("OK server AX-4 (AST valido)")
          SRVEOF

      - name: "Paso D - test AX-4 (catalogo + sync e2e con nacimiento real)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("apps/axis/tests/test_axis.py")
          t = p.read_text(encoding="utf-8")
          if "test_axz_network_sync_catalog" in t:
              print("SKIP test AX-4 (ya en repo)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              # ====== AX-4 (ECOSISTEMA) ======


              def _axz4_fake_outbox():
                  class _Fake:
                      def __init__(self):
                          self.items = []

                      def enqueue(self, event):
                          self.items.append(event)
                          return True
                  return _Fake()


              def test_axz_network_sync_catalog():
                  import base64 as _b64
                  import threading
                  import time as _time
                  from apps.axis.infrastructure.persistence.axis_store import AxisStore
                  from apps.axis.infrastructure.network.network_client import NetworkClient
                  from apps.axis.server import serve_axis, AxisApiHandler
                  from apps.axis.life_history.integration import build_life_history
                  from apps.axis.life_history.outbox_bridge import (
                      EVENT_CATALOG, validate_event_type,
                      OutboxBridge)
                  from apps.axis.services.axis_link import AxisLink
                  from shared_engines.storage.database import SQLiteAdapter
                  from shared_engines.common.clocks import FrozenClock, SystemClock
                  from shared_engines.runtime.config import RuntimeConfig
                  from shared_engines.runtime.kernel import ZyraKernel
                  from shared_engines.runtime.capabilities import ZyraCapabilities
                  from shared_engines.runtime.combined_api import serve_combined
                  from shared_engines.verification.signatures import Ed25519Signer
                  from shared_engines.security.biometrics import (
                      BiometricsEngine, BiometricsPolicy,
                      DeterministicTestProvider, TemplateCipher)

                  _axz_step("AX4-1 catalogo tipado")
                  esperados = {
                      "birth_registered",
                      "zid_biometric_upgrade",
                      "health_exam", "health_result",
                      "health_appointment",
                      "justice_case", "justice_status",
                      "security_incident",
                      "security_status",
                      "emergency", "evidence",
                  }
                  assert esperados.issubset(
                      set(EVENT_CATALOG.keys())), str(
                      sorted(EVENT_CATALOG.keys()))
                  assert validate_event_type(
                      "birth_registered") is True
                  assert validate_event_type(
                      "no_existe") is False

                  _axz_step("AX4-2 red real + axis")
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(db=net_db, clock=FrozenClock(), signer=signer,
                      config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(
                      db=net_db, clock=FrozenClock(), audit=kernel.audit,
                      provider=DeterministicTestProvider(),
                      cipher=TemplateCipher(master_key_hex="ab" * 32),
                      policy=BiometricsPolicy(require_liveness=False,
                          doc_reject=0.01, doc_review=0.02,
                          doc_auto=0.03, dup_reject=0.98))
                  caps = ZyraCapabilities(net_db, FrozenClock(),
                      identity=kernel.identity, signer=signer)
                  net_srv = serve_combined(kernel, caps, host="127.0.0.1", port=0)
                  threading.Thread(target=net_srv.serve_forever, daemon=True).start()
                  _time.sleep(0.4)
                  net_base = "http://127.0.0.1:" + str(net_srv.server_address[1])
                  client = NetworkClient(net_base, timeout_seconds=10, max_retries=1)
                  assert AxisLink(client).register_app()[0] is True

                  store = AxisStore(SQLiteAdapter(":memory:"), SystemClock())
                  life = build_life_history(db=store._db, clock=SystemClock(), network_client=client)

                  AxisApiHandler.outbox_bridge = None
                  srv0 = serve_axis(store, client, life_history_service=life)
                  threading.Thread(target=srv0.serve_forever, daemon=True).start()
                  _time.sleep(0.4)
                  base0 = "http://127.0.0.1:" + str(srv0.bound_port)
                  st, body = _axz_json("POST",
                      base0 + "/axis/api/network/sync",
                      {}, role="gobierno")
                  assert st == 503, "sin bridge " + str(st) + " " + str(body)
                  _axz_step("AX4-3 sync sin bridge 503 OK")

                  fake = _axz4_fake_outbox()
                  bridge = OutboxBridge(
                      life=life, outbox=fake,
                      clock=SystemClock())
                  srv = serve_axis(store, client,
                      life_history_service=life,
                      outbox_bridge=bridge)
                  threading.Thread(target=srv.serve_forever, daemon=True).start()
                  _time.sleep(0.4)
                  base = "http://127.0.0.1:" + str(srv.bound_port)

                  seed_m = _b64.b64encode(
                      b"axis-bio-madre-outbox").decode("ascii")
                  ok_m, data_m, err_m = client.post(
                      "/identity/enroll",
                      {"kind": "person",
                       "display_name": "Madre Outbox",
                       "actor": "axis",
                       "doc_image_b64": seed_m,
                       "selfie_image_b64": seed_m})
                  assert ok_m, str(err_m)
                  zid_madre = ((data_m or {}).get(
                      "identity") or {}).get("zid")
                  assert isinstance(zid_madre, str) and zid_madre.startswith("ZID-")
                  ok_t, _td, err_t = client.post(
                      "/identity/transition",
                      {"zid": zid_madre,
                       "to_status": "ACTIVE",
                       "actor": "axis",
                       "reason": "onboarding"})
                  assert ok_t, str(err_t)

                  _axz_step("AX4-4 nacimiento (fuente de eventos)")
                  st, html = _axz_form(base + "/axis/birth-register",
                      {"registrar_account": "AX-gob-x",
                       "child_name": "Bebe Outbox",
                       "birth_date": "2025-09-04",
                       "birth_place": "SS", "sex": "F",
                       "mother_name": "Madre Outbox",
                       "mother_zid": zid_madre})
                  assert st == 200, html[:500]
                  baby = life._store._db.query_one(
                      "SELECT person_id FROM life_persons"
                      " WHERE full_name = 'Bebe Outbox'")
                  assert baby is not None
                  evs = life._store.events_of(
                      str(baby["person_id"]))
                  print("AXZ-STEP AX4 eventos tras"
                        " nacimiento = " + str(len(evs)),
                        flush=True)

                  _axz_step("AX4-5 sync 1 (emision)")
                  st, body = _axz_json("POST",
                      base + "/axis/api/network/sync",
                      {}, role="gobierno")
                  assert st == 200, "sync1 " + str(st) + " " + str(body)
                  d = body["data"]
                  assert "emitted" in d and "skipped" in d, str(body)
                  if evs:
                      assert d["emitted"] >= 1, str(body)
                  print("AXZ-RESULT SYNC1=" + str(d), flush=True)

                  _axz_step("AX4-6 sync 2 (dedup)")
                  st, body = _axz_json("POST",
                      base + "/axis/api/network/sync",
                      {}, role="gobierno")
                  assert st == 200, "sync2 " + str(st) + " " + str(body)
                  assert body["data"]["emitted"] == 0, str(body)
                  if evs:
                      assert body["data"]["skipped"] >= 1, str(body)
                  print("AXZ-RESULT SYNC2=" + str(body["data"]), flush=True)

                  _axz_step("AX4-7 sync sin rol 403")
                  st, body = _axz_json("POST",
                      base + "/axis/api/network/sync",
                      {}, role=None)
                  assert st == 403, "sin rol " + str(st) + " " + str(body)
                  _axz_step("AX4-8 FIN: AX-4 cerrado (catalogo + sync e2e)")
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert "test_axz_network_sync_catalog" in final
          print("OK test AX-4 escrito (AST valido)")
          TSEOF

      - name: "Paso E - GATE 4 apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q -s --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AXIS AX-4: catalogo tipado de eventos (11) + POST /axis/api/network/sync" -m "Catálogo tipado en outbox_bridge.py: los 9 tipos existentes (intactos) + emergency + evidence, alias público EVENT_CATALOG y validate_event_type() (validación antes de emitir). server.py: serve_axis acepta outbox_bridge=None (patrón verify_service) y _api_post expone POST /axis/api/network/sync con guarda authorize (gobierno/registro → 403 si no, 503 not_wired si sin bridge, 200 con sync_pending). Test e2e: catálogo 11 tipos, sync 503 sin bridge, nacimiento real en Red → sync emite (dedup por event_id en 2ª llamada) y 403 sin rol. Nota: el cableado del outbox real del kernel se hará cuando se expose su API; la ruta responde 503 not_wired hasta entonces. Solo archivos existentes."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
