                      from decimal import Decimal as _D
                      inv = self.get_invoice(invoice_id)
                      if not inv:
                          raise KeyError(invoice_id)
                      pay = _D(str(amount))
                      if pay <= 0:
                          raise ValueError("abono positivo")
                      bal = _D(inv["balance"])
                      if pay > bal:
                          raise ValueError(
