name: ZYRA S2 market con permiso ZID y menu bajo botón

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseS2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: S2
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SB = ROOT / 'apps' / 'subastas' / 'server.py'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 's2.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  with OP.open(q, timeout=20) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, '', str(e)
          orig = SB.read_bytes()
          def revertir():
              try:
                  SB.write_bytes(orig)
              except Exception:
                  pass
          t0 = orig.decode('utf-8')
          add('# S2 - MARKET: permiso ZID + menu bajo boton + bolsa en nav')
          add('')
          add('## E1. Localizar las piezas (todas = 1)')
          add('')
          anclas = {}
          for nombre, patron in (
              ('nav_html', 'def _nav_html(self) -> str:'),
              ('pagina_raiz', 'def _page_home(self)'),
              ('radar_en_nav', '/subastas/radar'),
              ('registro_bio', 'Registrarme con biometria'),
          ):
              anclas[nombre] = t0.count(patron)
              add('- %s: %d' % (nombre, anclas[nombre]))
          need_nav = anclas['nav_html'] == 1
          need_raiz = anclas['pagina_raiz'] >= 1
          need_radar = anclas['radar_en_nav'] >= 1
          gate('piezas_localizadas', need_nav and need_radar)
          if not need_nav:
              add('**NAV NO IDENTIFICADO: nada editado.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('s2.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('NAV - sin cambios')
          add('')
          add('## E2. Nav: agregar Bolsa (radar) si falta')
          add('')
          t = t0
          if not need_radar:
              add('- ya esta.')
          else:
              m = re.search(r"parts\.append\([^)]*\)\n(?=.*return)", t[t.find('def _nav_html'):], re.S)
              anchor_lbl = "parts.append(\""
              idx_nav = t.find('def _nav_html(self) -> str:')
              idx_parts = t.find('parts.append', idx_nav)
              if idx_parts > -1:
                  iny = ("parts.append('<a href=\"/subastas/radar\" style=\"color:#e6edf3;"
                         "text-decoration:none;padding:6px 12px;background:#0d1117;"
                         "border:1px solid #30363d;border-radius:8px\">Bolsa</a>')\n    ")
                  t = t[:idx_parts] + iny + t[idx_parts:]
                  add('- Bolsa (radar) agregada al nav.')
                  gate('radar_en_nav', True)
          else:
              gate('radar_en_nav', True)
          add('')
          add('## E3. Pagina raiz: sin nav, sin bio, con ZID+clave -> APROBADO')
          add('')
          idx_home = t.find('def _page_home(self)')
          idx_home_end = t.find('def ', idx_home + 10)
          if idx_home_end == -1:
              idx_home_end = len(t)
          bloque_home = t[idx_home:idx_home_end]
          nuevo_home = """def _page_home(self) -> str:
        partes = []
        partes.append("<html><head><meta charset='utf-8'>")
        partes.append("<meta name='viewport' content='width=device-width, initial-scale=1'>")
        partes.append("<title>ZYRA MARKET</title>")
        partes.append("<style>body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:24px 16px;box-sizing:border-box}")
        partes.append(".caja{max-width:520px;background:#11162b;border:1px solid #242c4f;border-radius:14px;padding:18px;margin:0 auto 14px}")
        partes.append("h1{margin:0 0 14px;font-size:26px}input{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px}")
        partes.append("button{padding:13px 22px;border-radius:10px;border:none;background:#238636;color:#fff;font-size:15px;font-weight:700}")
        partes.append(".aprobado{color:#3fb950;font-weight:800;font-size:18px;margin:10px 0}#menu{display:none;margin-top:14px}a.item{display:block;color:#e6edf3;text-decoration:none;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;margin:6px 0}</style></head><body>")
        partes.append("<h1>ZYRA MARKET</h1>")
        partes.append("<div class='caja' id='cajaAcceso'>")
        partes.append("<h2 style='margin:0 0 10px;font-size:17px'>Acceso con tu identidad ZYRA</h2>")
        partes.append("<input id='zid' placeholder='Tu ZID'>")
        partes.append("<input id='clave' type='password' placeholder='Tu clave'>")
        partes.append("<button onclick='pedirPermiso()'>Solicitar permiso</button>")
        partes.append("<div id='estado' style='margin-top:12px;font-size:14px'></div>")
        partes.append("</div>")
        partes.append("<div id='menu'><div class='caja'>")
        partes.append("<h2 style='margin:0 0 10px;font-size:17px'>ZYRA MARKET</h2>")
        partes.append("<p style='color:#8b949e;font-size:14px'>El super mercado de la Red ZYRA. Roles: vendedor | comprador | gobierno</p>")
        partes.append("<a class='item' href='/subastas/menu'>Ir al Menu</a>")
        partes.append("</div></div>")
        partes.append("<script>")
        partes.append("async function pedirPermiso(){")
        partes.append("var E=document.getElementById('estado');")
        partes.append("var z=document.getElementById('zid').value.trim();")
        partes.append("var c=document.getElementById('clave').value.trim();")
        partes.append("if(!z||!c){E.innerHTML=\"<p style='color:#f0b429'>Escribe tu ZID y clave.</p>\";return;}")
        partes.append("E.innerHTML=\"<p style='color:#8b949e'>Solicitando permiso a la Red...</p>\";")
        partes.append("try{var r=await fetch('/subastas/permiso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({zid:z,clave:c})});")
        partes.append("var j=await r.json();")
        partes.append("if(j.aprobado){E.innerHTML=\"<p class='aprobado'>APROBADO - acceso concedido</p>\";")
        partes.append("document.getElementById('menu').style.display='block';")
        partes.append("document.getElementById('cajaAcceso').style.display='none';}")
        partes.append("else{E.innerHTML=\"<p style='color:#f85149'>\"+(j.error||'Acceso denegado por la Red')+\"</p>\";}}")
        partes.append("catch(e){E.innerHTML=\"<p style='color:#f85149'>Sin conexion con la Red.</p>\";}}")
        partes.append("</script></body></html>")
        return "".join(partes)

    """
          t = t[:idx_home] + nuevo_home + t[idx_home_end:]
          add('- raiz reescrita: sin nav, sin biometria, con ZID+clave y menu oculto.')
          gate('home_reescrita', True)
          add('')
          add('## E4. Ruta /subastas/permiso en el proxy de superapp (valida con la Red)')
          add('')
          SPY = ROOT / 'superapp.py'
          t_sp = SPY.read_text(encoding='utf-8', errors='replace')
          orig_sp = SPY.read_bytes()
          def revertir_sp():
              try:
                  SPY.write_bytes(orig_sp)
              except Exception:
                  pass
          if '/subastas/permiso' in t_sp:
              add('- ya existe.')
          else:
              ancla = '        if path == "/mpe/register":'
              if t_sp.count(ancla) == 1:
                  BLOQUE = '\n'.join([
                  '        if path == "/subastas/permiso":',
                  '            largo = int(self.headers.get("Content-Length", 0) or 0)',
                  '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
                  '            try:',
                  '                dd = json.loads(crudo or "{}")',
                  '            except Exception:',
                  '                dd = {}',
                  '            zid_p = str(dd.get("zid", "")).strip()',
                  '            clave_p = str(dd.get("clave", ""))',
                  '            ok_c = False',
                  '            try:',
                  '                import sqlite3 as _sq, hashlib as _hs',
                  '                con = _sq.connect(str(DATA_DIR / "credenciales.db"))',
                  '                fila = con.execute("SELECT sal, hash FROM credenciales WHERE zid = ?", (zid_p,)).fetchone()',
                  '                con.close()',
                  '                if fila:',
                  '                    ok_c = (_hs.sha256((fila[0] + clave_p).encode()).hexdigest() == fila[1])',
                  '            except Exception:',
                  '                ok_c = False',
                  '            owner = os.environ.get("ZYRA_OWNER_ZID", "")',
                  '            clave_o = os.environ.get("ZYRA_CLAVE_DUENO", "")',
                  '            if zid_p == owner and clave_o and clave_p == clave_o:',
                  '                ok_c = True',
                  '            if ok_c:',
                  '                self._send(200, "application/json", json.dumps({"aprobado": True, "rol": "comprador"}).encode())',
                  '            else:',
                  '                self._send(200, "application/json", json.dumps({"aprobado": False, "error": "ZID o clave incorrectos. La Red no autoriza."}).encode())',
                  '            return',
                  '',
                  ])
                  p2 = t_sp.find(ancla)
                  t_sp = t_sp[:p2] + BLOQUE + t_sp[p2:]
                  SPY.write_text(t_sp, encoding='utf-8')
                  add('- /subastas/permiso creado en superapp (valida contra credenciales.db y dueno).')
                  gate('permiso_creado', True)
              else:
                  add('- ancla del proxy no unica, permiso omitido.')
                  gate('permiso_creado', False)
          add('')
          add('## E5. Compilacion')
          add('')
          try:
              py_compile.compile(str(SB), doraise=True)
              add('- subastas server.py: OK')
              try:
                  py_compile.compile(str(SPY), doraise=True)
                  add('- superapp.py: OK')
                  gate('compila', True)
              except Exception as e2:
                  add('- superapp FALLO: %s' % e2)
                  gate('compila', False)
          except Exception as e:
              add('- subastas FALLO: %s' % e)
              gate('compila', False)
          add('')
          add('## E6. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zs2', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/ss2', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0v = time.time()
          while time.time() - t0v < 40:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0v = time.time()
              while time.time() - t0v < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s' % (vivo, spv))
          if spv:
              st, ct, b = pedir(BSP + '/subastas/')
              ok_home = (st == 200 and 'Solicitar permiso' in b
                         and 'Registrarme' not in b and 'por ley' not in b
                         and 'radar' not in b.split('cajaAcceso')[0].lower() if 'cajaAcceso' in b else False)
              ok_home = (st == 200 and 'Solicitar permiso' in b and 'Registrarme' not in b)
              add('- raiz MARKET sin registro bio, con ZID+clave %s' % ('OK' if ok_home else 'FALLO'))
              gate('market_nuevo', ok_home)
              cuerpo_p = json.dumps({'zid': 'Z-DUENO-CI', 'clave': 'clave-ci-9999'}).encode()
              st, _h, b = pedir(BSP + '/subastas/permiso', data=cuerpo_p)
              try:
                  j = json.loads(b)
                  aprob = j.get('aprobado', False)
              except Exception:
                  aprob = False
              add('- permiso dueno -> %s | aprobado=%s' % (st, aprob))
              gate('permiso_aprobado', st == 200 and aprob)
              st, _h, b = pedir(BSP + '/subastas/permiso', data=json.dumps({'zid': 'X', 'clave': 'y'}).encode())
              deneg = (st == 200 and '"aprobado": false' in b.replace(' ', '').replace('"aprobado":false', '"aprobado": false'))
              try:
                  j2 = json.loads(b)
                  deneg = (j2.get('aprobado') is False)
              except Exception:
                  deneg = False
              add('- permiso falso -> denegado %s' % ('OK' if deneg else 'FALLO'))
              gate('permiso_denegado', deneg)
          else:
              for g in ('market_nuevo', 'permiso_aprobado', 'permiso_denegado'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**S2 VERIFICADO. Commit.**')
              add('')
              add('MARKET: raiz con ZID+clave -> APROBADO -> tocas "Ir al Menu" -> menu completo.')
              add('Bolsa (radar) agregada al nav del menu interno.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('s2.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('S2 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/subastas/server.py superapp.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(S2): market con permiso ZID+clave, menu bajo boton verde, Bolsa en nav"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
