name: "ZYRA RED-5 paso 2 (contratos + esqueleto proveedor)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Fuente completa rates.py y contracts.py
        run: |
          {
          echo "## currency/rates.py COMPLETO"
          echo '```python'
          awk '{printf "%5d| %s\n", NR, $0}' shared_engines/currency/rates.py || true
          echo '```'
          echo "## currency/contracts.py COMPLETO"
          echo '```python'
          awk '{printf "%5d| %s\n", NR, $0}' shared_engines/currency/contracts.py || true
          echo '```'
          echo "## engine.py lineas 314-380 (_fetch_quote, la zona oculta)"
          echo '```python'
          awk 'NR>=314 && NR<=380 {printf "%5d| %s\n", NR, $0}' shared_engines/currency/engine.py || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Sonda de construccion de Quote (prueba real de campos)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import inspect
          import json
          import urllib.request
          from shared_engines.currency.contracts import Quote, CurrencyPair
          from shared_engines.currency.rates import RateProvider

          print("## Quote y RateProvider: contratos exactos")
          print("```python")
          print(inspect.getsource(Quote))
          print(inspect.getsource(RateProvider))
          try:
              print(inspect.getsource(__import__(
                  "shared_engines.currency.rates",
                  fromlist=["x"]).StaticTableRateProvider))
          except Exception as e:
              print("StaticTableRateProvider no visible:", e)
          print("```")
          print("## Prueba: fabricar Quote real desde er-api en vivo")
          print("```")
          try:
              req = urllib.request.Request(
                  "https://open.er-api.com/v6/latest/USD",
                  headers={"User-Agent": "zyra-network"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  d = json.loads(r.read().decode())
              rates = d.get("conversion_rates") or d.get("rates") or {}
              print("rates ok:", len(rates),
                    "| EUR:", rates.get("EUR"),
                    "| GTQ:", rates.get("GTQ"))
              import time
              q = Quote(
                  pair=CurrencyPair("USD", "EUR"),
                  rate=str(rates["EUR"]),
                  quoted_at=float(d.get("time_last_update_unix", time.time())),
                  source="open.er-api.com",
                  expires_at=float(d.get("time_next_update_unix", time.time() + 86400)),
              )
              print("QUOTE FABRICADO OK:", q.pair.normalized,
                    "| rate:", q.rate, "| fuente:", q.source)
              print("CAMPOS CONFIRMADOS: pair, rate(str), quoted_at(float), source(str), expires_at(float)")
          except TypeError as te:
              print("FIRMA DISTINTA:", te)
          except Exception as e:
              print("fallo red/parse:", type(e).__name__, str(e)[:120])
          print("```")
          EOF
          exit 0
