              echo ">>> MOTOR ACTIVO. Prueba con TU DUI y TU cara (v32)."
              echo ">>> Filtros que vas a ver bloqueando donde deben:"
              echo ">>>   reverso en paso frontal / frontal en paso reverso"
              echo ">>>   documento vencido / menor / nombre no coincide"
              echo ">>>   selfie con rostro distinto al documento (paso 4)"
              echo ">>> Si el motor rechaza al final: razon + puntaje visibles. Pegamelos."
            else
              echo ">>> Red: $B — pegame este bloque."
            fi
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Guardar"
        if: always()
