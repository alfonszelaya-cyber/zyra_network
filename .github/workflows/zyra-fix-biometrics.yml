/* ================= estado del flujo ================= */
var EST={paso:1, tipo:'desconocido', necesitaReverso:true, nombreOk:false, frenteOk:false, reversoOk:false, selfieOk:false, intentos:3, frenteImg:'', reversoImg:'', selfieImg:'', escrito:''};
var streams={};
var HINTS={};

function clasificarTipo(){
  var sel=$('tipoDoc'), txt='';
  if(sel){
    var op=sel.options && sel.options[sel.selectedIndex];
    txt=(op&&op.text?op.text:'')+' '+(sel.value||'');
  }
  txt=txt.toLowerCase();
  if(/pasaporte|passport/.test(txt)){ return {k:'pasaporte', reverso:false}; }
  if(/salvador|\bdui\b/.test(txt)){ return {k:'dui', reverso:true}; }
  if(/guatemala|guate/.test(txt)){ return {k:'gt', reverso:true}; }
  if(/nicaragua/.test(txt)){ return {k:'ni', reverso:true}; }
  if(/honduras/.test(txt)){ return {k:'hn', reverso:true}; }
  if(/usa|estados unidos|licencia|license|driver/.test(txt)){ return {k:'usa', reverso:true}; }
  if(/otro|other/.test(txt)){ return {k:'otro', reverso:true}; }
  return {k:'desconocido', reverso:true};
}

/* ================= mensajes y ayudas ================= */
function msg(id,texto,color){
  var el=$(id);
  if(!el && HINTS[id]){ el=HINTS[id]; }
