name: "AGRO RUN C: GPT-1/2 perfil+unidades+documentos+produccion por etapas"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - servicios reales en stubs existentes (GPT-1/2)"
        run: |
          python3 - <<'SVCEOF'
          import textwrap
          from pathlib import Path

          FILES = {
              "apps/agro/modules/productores/perfil/profile_service.py": textwrap.dedent('''\
                  """AGRO - perfil del productor (GPT-1):
                  actualizacion operativa del perfil sin
                  tocar la tabla canonica del store."""
                  from __future__ import annotations


                  class ProfileService:
                      def __init__(self, db) -> None:
                          self._db = db
                          self._db.execute(
                              "CREATE TABLE IF NOT EXISTS"
                              " agro_producer_profiles ("
                              " producer_id TEXT PRIMARY KEY,"
                              " phone TEXT,"
                              " location TEXT,"
                              " notes TEXT,"
                              " updated_at TEXT)"
                          )

                      def update_profile(
                          self, *, producer_id,
                          phone="", location="",
                          notes="",
                      ) -> dict:
                          import time as _t
                          ts = _t.strftime(
                              "%Y-%m-%dT%H:%M:%SZ",
                              _t.gmtime(),
                          )
                          self._db.execute(
                              "INSERT INTO"
                              " agro_producer_profiles ("
                              " producer_id, phone,"
                              " location, notes,"
                              " updated_at)"
                              " VALUES (?, ?, ?, ?, ?)"
                              " ON CONFLICT(producer_id)"
                              " DO UPDATE SET phone ="
                              " excluded.phone,"
                              " location ="
                              " excluded.location,"
                              " notes ="
                              " excluded.notes,"
                              " updated_at ="
                              " excluded.updated_at",
                              (producer_id, phone,
                               location, notes, ts),
                          )
                          return {
                              "producer_id": producer_id,
                              "phone": phone,
                              "location": location,
                              "notes": notes,
                              "updated_at": ts,
                          }

                      def get_profile(
                          self, producer_id,
                      ) -> dict:
                          for name in (
                              "query_one", "query"
                          ):
                              fn = getattr(
                                  self._db, name, None
                              )
                              if callable(fn):
                                  try:
                                      row = fn(
                                          "SELECT producer_id,"
                                          " phone, location,"
                                          " notes, updated_at"
                                          " FROM"
                                          " agro_producer_profiles"
                                          " WHERE producer_id = ?",
                                          (producer_id,),
                                      )
                                  except Exception:
                                      row = None
                                  if row:
                                      try:
                                          return dict(row)
                                      except Exception:
                                          pass
                          return {
                              "producer_id": producer_id,
                              "phone": "",
                              "location": "",
                              "notes": "",
                          }
              '''),
              "apps/agro/modules/productores/unidades_productivas/unit_service.py": textwrap.dedent('''\
