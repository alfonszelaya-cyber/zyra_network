              for rel in sorted(MENUS):
                  module, title, opts_pipe = MENUS[rel]
                  mid = rel[:-3].replace("/", ".")
                  opts = ", ".join('"' + o + '"'
                                   for o in opts_pipe.split("|"))
                  content = (
                      '"""Menu: ' + title + ' - NEXO / ZYRA.\n'
                      '\n'
                      'Modulo ' + module + '. Opciones reales del\n'
                      'ecosistema NEXO; wiring de acciones en NG12.\n'
                      '"""\n'
                      'MODULE = "' + module + '"\n'
                      'MENU_ID = "' + mid + '"\n'
                      'TITLE = "' + title + '"\n'
                      'OPTIONS = [' + opts + ']\n'
                      '\n'
                      '\n'
                      'def menu() -> dict:\n'
                      '    """Definicion del menu (data puro)."""\n'
                      '    return {"module": MODULE,\n'
                      '            "menu_id": MENU_ID,\n'
                      '            "title": TITLE,\n'
                      '            "options": [{"key": str(i + 1),\n'
                      '                         "label": opt}\n'
                      '                        for i, opt\n'
                      '                        in enumerate(OPTIONS)]}\n')
                  forzar("apps/nexo/module/" + rel, content)

              forzar("apps/nexo/module/__init__.py", D(r'''
                  """Menu Registry de modulos NEXO (NG10).

                  Descubre los menu.py con contenido de los modulos.
                  Regla 70: operaciones/logistica EXCLUIDO (SUBASTAS).
                  Archivos vacios se saltan (regla 53/68)."""
                  from pathlib import Path
                  import importlib

                  _BASE = Path(__file__).parent
                  _EXCLUDED = ("operaciones/logistica",)

                  def discover_menus() -> list:
                      """Descubre y devuelve todos los menus."""
                      menus = []
                      for p in sorted(_BASE.rglob("menu.py")):
                          try:
                              if p.stat().st_size <= 1:
                                  continue
                              rel = p.relative_to(
                                  _BASE).as_posix()
                              if any(rel.startswith(x)
                                     for x in _EXCLUDED):
                                  continue
                              mod = importlib.import_module(
                                  "apps.nexo.module."
                                  + rel[:-3].replace("/", "."))
                              fn = getattr(mod, "menu", None)
                              if not callable(fn):
                                  continue
                              entry = fn()
                              entry["path"] = rel
                              menus.append(entry)
                          except Exception:
                              continue
                      return menus
              '''))

              forzar("apps/nexo/routers/__init__.py",
                     '"""Routers NEXO."""\n')

              forzar("apps/nexo/routers/modules_router.py", D(r'''
                  """Nexo Modules Router - menus como data para
                  HTTP (NG10). El wiring a server.py ocurre en
                  NG12 con audit-first."""
                  from __future__ import annotations
                  from apps.nexo.module import discover_menus

                  def list_menus(module="", limit=500) -> dict:
                      """Lista de menus por modulo o todos."""
                      menus = discover_menus()
                      if module:
                          menus = [m for m in menus
                                   if m["module"] == module]
                      return {"total": len(menus),
                              "menus": menus[:limit]}

                  def get_menu(menu_id):
                      """Un menu por id, o None."""
                      for m in discover_menus():
                          if m["menu_id"] == menu_id:
                              return m
                      return None
              '''))

              out("## FIN NG10: " + str(len(MENUS))
                  + " menus + registry + router")
          except Exception:
              out("## NG10 BUILDER ERROR (visible)")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[LECTURA] NG9a tests family office extras"
