          try:
              for rel in sorted(MENUS):
                  module, title, opts_pipe = MENUS[rel]
                  mid = rel[:-8].replace("/", ".")
                  opts = ", ".join('"' + o + '"'
                                   for o in opts_pipe.split("|"))
                  content = (
                      '"""Menu: ' + title + ' - NEXO / ZYRA.\n'
                      '\n'
                      'Modulo ' + module + '. Opciones reales del\n'
                      'ecosistema NEXO; wiring de acciones en NG12.\n'
                      '"""\n'
                      'MODULE = "' + module + '"\n'
                      'MENU_ID = "' + mid + '"\n'
                      'TITLE = "' + title + '"\n'
                      'OPTIONS = [' + opts + ']\n'
                      '\n'
                      '\n'
                      'def menu() -> dict:\n'
                      '    """Definicion del menu (data puro)."""\n'
                      '    return {"module": MODULE,\n'
                      '            "menu_id": MENU_ID,\n'
                      '            "title": TITLE,\n'
                      '            "options": [{"key": str(i + 1),\n'
                      '                         "label": opt}\n'
                      '                        for i, opt\n'
                      '                        in enumerate(OPTIONS)]}\n')
                  forzar("apps/nexo/module/" + rel, content)

              forzar("apps/nexo/module/__init__.py", D(r'''
                  """Menu Registry de modulos NEXO (NG10).

                  Descubre los menu.py con contenido de los modulos.
                  Regla 70: operaciones/logistica EXCLUIDO (SUBASTAS).
                  Archivos vacios se saltan (regla 53/68)."""
                  from pathlib import Path
                  import importlib

                  _BASE = Path(__file__).parent
                  _EXCLUDED = ("operaciones/logistica",)

                  def discover_menus() -> list:
                      """Descubre y devuelve todos los menus."""
                      menus = []
                      for p in sorted(_BASE.rglob("menu.py")):
                          try:
                              if p.stat().st_size <= 1:
                                  continue
                              rel = p.relative_to(
                                  _BASE).as_posix()
                              if any(rel.startswith(x)
                                     for x in _EXCLUDED):
                                  continue
                              mod = importlib.import_module(
                                  "apps.nexo.module."
                                  + rel[:-3].replace("/", "."))
                              fn = getattr(mod, "menu", None)
                              if not callable(fn):
                                  continue
                              entry = fn()
                              entry["path"] = rel
                              menus.append(entry)
                          except Exception:
                              continue
                      return menus
              '''))

              forzar("apps/nexo/routers/__init__.py",
                     '"""Routers NEXO."""\n')

              forzar("apps/nexo/routers/modules_router.py", D(r'''
                  """Nexo Modules Router - menus como data para
                  HTTP (NG10). El wiring a server.py ocurre en
                  NG12 con audit-first."""
                  from __future__ import annotations
                  from apps.nexo.module import discover_menus

                  def list_menus(module="", limit=500) -> dict:
                      """Lista de menus por modulo o todos."""
                      menus = discover_menus()
                      if module:
                          menus = [m for m in menus
                                   if m["module"] == module]
                      return {"total": len(menus),
                              "menus": menus[:limit]}

                  def get_menu(menu_id):
                      """Un menu por id, o None."""
                      for m in discover_menus():
                          if m["menu_id"] == menu_id:
                              return m
                      return None
              '''))

              out("## FIN NG10: " + str(len(MENUS))
                  + " menus (menu_id sin sufijo .menu) + registry"
                  + " + router")
          except Exception:
              out("## NG10 BUILDER ERROR (visible abajo)")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[LECTURA] NG10a tests menus y registry"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps/nexo -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/nexo/tests
          cat > apps/nexo/tests/test_ng10_menus.py << 'TSEOF'
          import pytest
          from apps.nexo.module import discover_menus
          from apps.nexo.routers.modules_router import (list_menus,
                                                        get_menu)

          def test_registry_descubre_149() -> None:
              menus = discover_menus()
              assert len(menus) == 149
              ids = [m["menu_id"] for m in menus]
              assert len(set(ids)) == 149
              for m in menus:
                  assert m["title"].strip()
                  assert len(m["options"]) >= 1
                  for o in m["options"]:
                      assert o["key"] and o["label"]
                  assert not m["menu_id"].endswith(".menu")
              print("OK registry: 149 menus unicos, ids sin sufijo")

          def test_regla70_sin_logistica() -> None:
              menus = discover_menus()
              logi = [m for m in menus
                      if "logistica" in m["path"]]
              assert logi == []
              ops = list_menus(module="operaciones")
              assert ops["total"] == 12
              for m in ops["menus"]:
                  assert "logistica" not in m["path"]
              print("OK regla 70: cero menus de logistica en NEXO")

          def test_router_y_menus_clave() -> None:
              m = get_menu("accounting.asientos")
              assert m is not None
              assert m["module"] == "accounting"
              labels = " ".join(o["label"].lower()
                                for o in m["options"])
              assert "asiento" in labels
              assert get_menu("no.existe") is None
              total = list_menus()["total"]
              assert total == 149
              r = list_menus(module="risk")
              assert r["total"] == 14
              fo = list_menus(module="family_office")
              assert fo["total"] == 17
              print("OK router: list/get + modulos clave con conteo exacto")
          TSEOF
          timeout 120 python3 -m pytest apps/nexo/tests/test_ng10_menus.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/ng10a.out 2>&1
          echo $? > /tmp/ng10a
          if [ "$(cat /tmp/ng10a)" = "0" ]; then echo "- NG10a menus+registry: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- NG10a: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### NG10a detalle"; echo '```'; tail -80 /tmp/ng10a.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] NGX regresion"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc1.out 2>&1
          echo $? > /tmp/ngxc1
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=short > /tmp/ngxc2.out 2>&1
          echo $? > /tmp/ngxc2
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc3.out 2>&1
          echo $? > /tmp/ngxc3
          for par in "ngxc1 nexo" "ngxc2 shared_engines" "ngxc3 subastas"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- NGX $2: ✅" >> "$SUM"
            else
              echo "- NGX $2: ❌" >> "$SUM"
              { echo "### NGX $2 detalle"; echo '```'; tail -100 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          if [ "$(cat /tmp/ngxc1)" = "0" ] && [ "$(cat /tmp/ngxc2)" = "0" ] && [ "$(cat /tmp/ngxc3)" = "0" ]; then echo 0 > /tmp/ngxc; else echo 1 > /tmp/ngxc; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si TODO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in ng10a ngxc; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: NG10 VERDE — 149 MENUS + REGISTRY + ROUTER (ids correctos)**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-NG10): 149 menus de modulos con MENU_ID correcto (sin sufijo .menu — fix rel[:-8]), opciones reales del ecosistema (regla 70: cero logistica) + menu registry discover_menus + modules router HTTP-ready para wiring NG12 (NG10 verde)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — NG10 CERRADO. Sigue NG11 calidad (datetime, idempotencia, tests vacios).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
