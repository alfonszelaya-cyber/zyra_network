name: "ZYRA: SuperApp (portal + proxy 7 apps) + render 2 servicios"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-superapp
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml

      - name: Create superapp + portal + render.yaml
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          SUPERAPP = r'''"""ZYRA SuperApp: una sola entrada bonita.

          Arranca los 7 servidores internos (cada uno con su
          store y su cliente de red, independientes entre si)
          y los expone bajo UNA sola entrada publica:
          - /              portal (menu de apps + verificador)
          - /verificar     verificador publico (gratis)
          - /verify        proxy a la Red (servicio zyra-network)
          - /mpe /agro /axis /semilla /nexo /subastas /ciclo
                           proxy a cada app interna
          - /health        estado del servicio

          La Red ZYRA sigue siendo un servicio aparte (entrada
          HTTP para bancos/empresas). Este proceso solo la
          consume via ZYRA_URL o ZYRA_HOST.
          """
          from __future__ import annotations

          import json
          import os
          import threading
          import urllib.error
          import urllib.request
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from pathlib import Path

          ROOT = Path(
              os.path.dirname(os.path.abspath(__file__))
          )
          DATA_DIR = Path(
              os.environ.get("SUPERAPP_DATA_DIR")
              or (ROOT / "data")
          )
          DATA_DIR.mkdir(parents=True, exist_ok=True)

          PORT = int(
              os.environ.get("PORT")
              or os.environ.get("SUPERAPP_PORT")
              or 8080
          )

          ZYRA_URL = (
              os.environ.get("ZYRA_URL")
              or (
                  "https://" + os.environ["ZYRA_HOST"]
                  if os.environ.get("ZYRA_HOST")
                  else ""
              )
          ).rstrip("/")

          APPS: dict = {}


          def _db(name: str):
              from shared_engines.storage.database import (
                  SQLiteAdapter,
              )
              return SQLiteAdapter(
                  str(DATA_DIR / name),
                  busy_timeout_ms=10_000,
              )


          def _clock():
              from shared_engines.common.clocks import (
                  SystemClock,
              )
              return SystemClock()


          class _SimpleClient:
              """Fallback client (same contract as the
              per-app NetworkClient: never raises)."""

              def __init__(self, base_url: str) -> None:
                  self._base = base_url.rstrip("/")

              def get(self, path: str):
                  return self._call("GET", path)

              def post(self, path: str, payload: dict):
                  return self._call("POST", path, payload)

              def _call(self, method, path, payload=None):
                  if not self._base:
                      return (False, None, "ZYRA_URL not configured")
                  data = (
                      json.dumps(payload).encode("utf-8")
                      if payload is not None
                      else None
                  )
                  try:
                      request = urllib.request.Request(
                          self._base + path,
                          data=data,
                          method=method,
                          headers={
                              "Content-Type": "application/json"
                          },
                      )
                      with urllib.request.urlopen(
                          request, timeout=15
                      ) as response:
                          body = json.loads(
                              response.read().decode("utf-8")
                          )
                      if body.get("ok") is True:
                          return (True, body.get("data"), None)
                      error = body.get("error", {})
                      return (
                          False,
                          None,
                          str(error.get("message", "rejected")),
                      )
                  except Exception as exc:
                      return (False, None, str(exc))


          def _start_mpe():
              from apps.mi_primer_empleo.infrastructure.persistence.mpe_store import (
                  MpeStore,
              )
              from apps.mi_primer_empleo.infrastructure.network.network_client import (
                  NetworkClient,
              )
              from apps.mi_primer_empleo.server import (
                  serve_mpe,
              )
              store = MpeStore(_db("mpe.db"), _clock())
              client = NetworkClient(ZYRA_URL)
              server = serve_mpe(
                  store, client, host="127.0.0.1", port=0
              )
              return server, "Mi Primer Empleo"


          def _start_agro():
              from apps.agro.infrastructure.persistence.agro_store import (
                  AgroStore,
              )
              from apps.agro.infrastructure.network.network_client import (
                  NetworkClient,
              )
              from apps.agro.server import serve_agro
              store = AgroStore(_db("agro.db"), _clock())
              client = NetworkClient(ZYRA_URL)
              server = serve_agro(
                  store, client, host="127.0.0.1", port=0
              )
              return server, "AGRO"


          def _start_axis():
              from apps.axis.infrastructure.persistence.axis_store import (
                  AxisStore,
              )
              from apps.axis.infrastructure.network.network_client import (
                  NetworkClient,
              )
              from apps.axis.life_history.integration import (
                  build_life_history,
              )
              from apps.axis.server import serve_axis
              db = _db("axis.db")
              clock = _clock()
              store = AxisStore(db, clock)
              client = NetworkClient(ZYRA_URL)
              lh = build_life_history(
                  db=db, clock=clock, network_client=client
              )
              server = serve_axis(
                  store,
                  client,
                  host="127.0.0.1",
                  port=0,
                  life_history_service=lh,
              )
              return server, "AXIS"


          def _start_semilla():
              from apps.semilla.infrastructure.persistence.semilla_store import (
                  SemillaStore,
              )
              from apps.semilla.infrastructure.network.network_client import (
                  NetworkClient,
              )
              from apps.semilla.server import (
                  serve_semilla,
              )
              store = SemillaStore(_db("semilla.db"), _clock())
              client = NetworkClient(ZYRA_URL)
              server = serve_semilla(
                  store, client, host="127.0.0.1", port=0
              )
              return server, "SEMILLA"


          def _start_nexo():
              from apps.nexo.infrastructure.persistence.nexo_store import (
                  NexoStore,
              )
              from apps.nexo.infrastructure.network.network_client import (
                  NetworkClient,
              )
              from apps.nexo.server import serve_nexo
              store = NexoStore(_db("nexo.db"), _clock())
              client = NetworkClient(ZYRA_URL)
              server = serve_nexo(
                  store, client, host="127.0.0.1", port=0
              )
              return server, "NEXO"


          def _start_subastas():
              from apps.subastas.infrastructure.persistence.subastas_store import (
                  SubastasStore,
              )
              from apps.subastas.server import (
                  serve_subastas,
              )
              try:
                  from apps.subastas.infrastructure.network.network_client import (
                      NetworkClient,
                  )
                  client = NetworkClient(ZYRA_URL)
              except Exception:
                  client = _SimpleClient(ZYRA_URL)
              store = SubastasStore(_db("subastas.db"), _clock())
              server = serve_subastas(
                  store, client, host="127.0.0.1", port=0
              )
              return server, "SUBASTAS"


          def _start_ciclo():
              from apps.ciclo_digital.infrastructure.persistence.ciclo_store import (
                  CicloStore,
              )
              from apps.ciclo_digital.infrastructure.network.network_client import (
                  NetworkClient,
              )
              from apps.ciclo_digital.server import (
                  serve_ciclo,
              )
              store = CicloStore(_db("ciclo.db"), _clock())
              client = NetworkClient(ZYRA_URL)
              server = serve_ciclo(
                  store, client, host="127.0.0.1", port=0
              )
              return server, "CICLO-DIGITAL"


          STARTERS = [
              ("/mpe", _start_mpe),
              ("/agro", _start_agro),
              ("/axis", _start_axis),
              ("/semilla", _start_semilla),
              ("/nexo", _start_nexo),
              ("/subastas", _start_subastas),
              ("/ciclo", _start_ciclo),
          ]


          def boot_apps() -> list:
              errors = []
              for prefix, starter in STARTERS:
                  try:
                      server, label = starter()
                      port = int(server.server_address[1])
                      threading.Thread(
                          target=server.serve_forever,
                          daemon=True,
                      ).start()
                      APPS[prefix] = {
                          "port": port,
                          "label": label,
                      }
                      print(
                          "[superapp] " + label
                          + " up on 127.0.0.1:" + str(port)
                          + " at " + prefix + "/*"
                      )
                  except Exception as exc:
                      errors.append(prefix + ": " + str(exc))
                      print(
                          "[superapp] " + prefix
                          + " FAILED: " + str(exc)
                      )
              return errors


          ERROR_PAGE = (
              "<html><head><meta charset='utf-8'>"
              "<title>ZYRA</title></head>"
              "<body style='font-family:sans-serif;background:#0d1117;color:#e6edf3;padding:32px'>"
              "<h1>ZYRA</h1><p>__MSG__</p>"
              "<p><a href='/' style='color:#8b949e'>Volver al portal</a></p>"
              "</body></html>"
          )

          NOT_FOUND_PAGE = ERROR_PAGE.replace(
              "__MSG__", "Ruta desconocida."
          )


          class PortalHandler(BaseHTTPRequestHandler):
              server_version = "ZYRA-SuperApp/1.0"

              def _send(
                  self,
                  status: int,
                  content_type: str,
                  payload: bytes,
              ) -> None:
                  self.send_response(status)
                  self.send_header(
                      "Content-Type", content_type
                  )
                  self.send_header(
                      "Content-Length", str(len(payload))
                  )
                  self.end_headers()
                  self.wfile.write(payload)

              def _send_html(
                  self, status: int, html: str
              ) -> None:
                  self._send(
                      status,
                      "text/html; charset=utf-8",
                      html.encode("utf-8"),
                  )

              def _read_portal(self, name: str) -> bytes:
                  return (ROOT / "portal" / name).read_bytes()

              def _proxy(self, target: str) -> None:
                  length = int(
                      self.headers.get(
                          "Content-Length", 0
                      )
                      or 0
                  )
                  body = (
                      self.rfile.read(length)
                      if length > 0
                      else None
                  )
                  headers = {}
                  ct = self.headers.get("Content-Type")
                  if ct:
                      headers["Content-Type"] = ct
                  request = urllib.request.Request(
                      target,
                      data=body,
                      method=self.command,
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(
                          request, timeout=180
                      ) as resp:
                          payload = resp.read()
                          self._send(
                              resp.status,
                              resp.headers.get(
                                  "Content-Type",
                                  "text/html; charset=utf-8",
                              ),
                              payload,
                          )
                  except urllib.error.HTTPError as exc:
                      try:
                          payload = exc.read()
                      except Exception:
                          payload = b""
                      ct2 = (
                          exc.headers.get(
                              "Content-Type",
                              "text/html; charset=utf-8",
                          )
                          if exc.headers
                          else "text/html; charset=utf-8"
                      )
                      self._send(exc.code, ct2, payload)
                  except Exception as exc:
                      self._send_html(
                          502,
                          ERROR_PAGE.replace(
                              "__MSG__",
                              "La app no esta disponible"
                              " ahora: " + str(exc),
                          ),
                      )

              def do_GET(self) -> None:
                  path = self.path.split("?", 1)[0]
                  if path in ("/", "/index.html"):
                      self._send_html(
                          200,
                          self._read_portal(
                              "index.html"
                          ).decode("utf-8"),
                      )
                      return
                  if path == "/health":
                      apps = {
                          p: {
                              "label": v["label"],
                              "port": v["port"],
                          }
                          for p, v in APPS.items()
                      }
                      payload = json.dumps(
                          {
                              "ok": True,
                              "service": "zyra-superapp",
                              "apps": apps,
                          }
                      ).encode("utf-8")
                      self._send(
                          200, "application/json", payload
                      )
                      return
                  if path == "/verificar":
                      self._send_html(
                          200,
                          self._read_portal(
                              "verificar.html"
                          ).decode("utf-8"),
                      )
                      return
                  if path == "/verificar.js":
                      self._send(
                          200,
                          "application/javascript; charset=utf-8",
                          self._read_portal("verificar.js"),
                      )
                      return
                  for prefix, info in APPS.items():
                      if path == prefix or path.startswith(
                          prefix + "/"
                      ):
                          self._proxy(
                              "http://127.0.0.1:"
                              + str(info["port"])
                              + self.path
                          )
                          return
                  self._send_html(404, NOT_FOUND_PAGE)

              def do_POST(self) -> None:
                  path = self.path.split("?", 1)[0]
                  if path == "/verify":
                      if not ZYRA_URL:
                          self._send_html(
                              503,
                              ERROR_PAGE.replace(
                                  "__MSG__",
                                  "ZYRA_URL no configurada",
                              ),
                          )
                          return
                      self._proxy(ZYRA_URL + "/verify")
                      return
                  for prefix, info in APPS.items():
                      if path == prefix or path.startswith(
                          prefix + "/"
                      ):
                          self._proxy(
                              "http://127.0.0.1:"
                              + str(info["port"])
                              + self.path
                          )
                          return
                  self._send_html(404, NOT_FOUND_PAGE)

              def log_message(self, fmt, *args) -> None:
                  print("[superapp] " + (fmt % args))


          def main() -> None:
              print(
                  "[superapp] data dir:", str(DATA_DIR)
              )
              if not ZYRA_URL:
                  print(
                      "[superapp] WARNING: ZYRA_URL/ZYRA_HOST"
                      " no configurada - apps degradadas"
                  )
              errors = boot_apps()
              if errors:
                  print(
                      "[superapp] STARTUP ERRORS:", errors
                  )
              httpd = ThreadingHTTPServer(
                  ("0.0.0.0", PORT), PortalHandler
              )
              print(
                  "[superapp] LIVE on port " + str(PORT)
                  + " - apps: " + str(list(APPS.keys()))
              )
              try:
                  httpd.serve_forever()
              except KeyboardInterrupt:
                  pass
              finally:
                  httpd.server_close()


          if __name__ == "__main__":
              main()
          '''

          SUPERAPP = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in SUPERAPP.splitlines()
          )

          PORTAL = r'''<!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ZYRA - Super App</title>
          <style>
          body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:24px}
          .wrap{max-width:900px;margin:0 auto}
          h1{font-size:1.6rem}
          p.sub{color:#8b949e}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
          a.card{display:block;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;color:#e6edf3;text-decoration:none}
          a.card:hover{border-color:#238636}
          .card h2{margin:0 0 6px;font-size:1.05rem}
          .card p{margin:0;color:#8b949e;font-size:.85rem}
          .soon{opacity:.45}
          .law{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin-top:18px;color:#8b949e;font-size:.85rem}
          </style>
          </head>
          <body>
          <div class="wrap">
          <h1>🛡️ ZYRA - Super App</h1>
          <p class="sub">Una sola entrada. Identidad única con biometría (documento + selfie, por ley). Tu historial viaja contigo entre las apps.</p>
          <div class="grid">
          <a class="card" href="/mpe/home"><h2>💼 Mi Primer Empleo</h2><p>Empleos, propuestas y credenciales laborales</p></a>
          <a class="card" href="/agro/home"><h2>🌾 AGRO</h2><p>Productores, ayudas y precios justos</p></a>
          <a class="card" href="/axis/home"><h2>🏥 AXIS</h2><p>Salud, justicia y seguridad</p></a>
          <a class="card" href="/semilla/home"><h2>🌱 SEMILLA</h2><p>Educación con historial verificado</p></a>
          <a class="card" href="/nexo/home"><h2>💠 NEXO</h2><p>Núcleo contable y fiscal</p></a>
          <a class="card" href="/subastas"><h2>🔨 SUBASTAS</h2><p>Marketplace con confianza</p></a>
          <a class="card" href="/ciclo/home"><h2>♻️ CICLO-DIGITAL</h2><p>Reciclaje y arqueología</p></a>
          <a class="card soon"><h2>🧪 LABORATORIO</h2><p>Próximamente</p></a>
          <a class="card soon"><h2>🤖 FUTURO-OS</h2><p>Próximamente</p></a>
          <a class="card" href="/verificar"><h2>🔍 Verificador Público</h2><p>¿Un certificado es auténtico? Verificación criptográfica gratis</p></a>
          </div>
          <div class="law">Empresas y bancos: la consulta técnica es por la entrada HTTP de la Red (verificación gratis; historial de personas solo premium).</div>
          </div>
          </body>
          </html>
          '''

          PORTAL = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in PORTAL.splitlines()
          )

          VER_HTML = r'''<!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ZYRA - Verificador Público</title>
          <style>
          body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;display:flex;justify-content:center;padding:24px}
          .card{max-width:720px;width:100%}
          h1{font-size:1.4rem}
          textarea{width:100%;height:180px;background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:12px;font-family:monospace;font-size:.8rem}
          button{margin-top:12px;background:#238636;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:1rem;cursor:pointer}
          #result{margin-top:16px;padding:16px;border-radius:8px;display:none}
          .ok{background:#0f2417;border:1px solid #238636}
          .bad{background:#2d1216;border:1px solid #da3633}
          small,a{color:#8b949e}
          </style>
          </head>
          <body>
          <div class="card">
          <h1>🛡️ ZYRA - Verificador Público</h1>
          <p>Pega aquí un certificado (attestation) emitido por la Red. La verificación es <b>offline y criptográfica</b>: no se consulta ninguna base de datos.</p>
          <textarea id="blob" placeholder='{"format":"zyra.attestation.v1",...}'></textarea>
          <button onclick="verify()">Verificar autenticidad</button>
          <div id="result"></div>
          <p><small>Zyra Network - infraestructura de confianza digital de JAZA Global Systems.</small></p>
          <p><a href="/">← Volver a ZYRA</a></p>
          </div>
          <script src="/verificar.js"></script>
          </body>
          </html>
          '''

          VER_HTML = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in VER_HTML.splitlines()
          )

          VER_JS = r'''async function verify() {
            const blob = document.getElementById("blob").value.trim();
            const box = document.getElementById("result");
            if (!blob) { box.className="bad"; box.style.display="block";
              box.textContent="Pega un certificado primero."; return; }
            box.style.display="block";
            box.textContent="Verificando...";
            try {
              const res = await fetch("/verify", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({attestation: blob})
              });
              const payload = await res.json();
              const d = payload.data || payload.error || {};
              if (payload.ok && d.valid) {
                box.className = "ok";
                box.innerHTML = "<b>✓ AUTÉNTICO</b><br>" +
                  "Motivo: " + d.reason + "<br>" +
                  "ID: " + (d.attestation_id || "-") + "<br>" +
                  "Sujeto: " + (d.subject_zid || "-") + "<br>" +
                  "Declaración: " + (d.claim || "-") + "<br>" +
                  "Huella de clave: " + (d.key_fingerprint || "-");
              } else {
                box.className = "bad";
                box.innerHTML = "<b>✗ NO VÁLIDO</b><br>" +
                  "Motivo: " + (d.reason || d.message || "desconocido");
              }
            } catch (e) {
              box.className = "bad";
              box.textContent = "Error contactando la Red: " + e;
            }
          }
          '''

          VER_JS = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in VER_JS.splitlines()
          )

          RENDER = '''services:
            - type: web
              name: zyra-network
              runtime: python
              plan: free
              buildCommand: |
                pip install --upgrade pip
                pip install -r requirements.txt
              startCommand: python main.py
              healthCheckPath: /health
              envVars:
                - key: PYTHON_VERSION
                  value: "3.12.4"
                - key: ZYRA_PORT
                  value: "10000"
                - key: ZYRA_DATA_DIR
                  value: "/opt/render/project/src/data"
                - key: ZYRA_ROOT_KEY
                  sync: false
                - key: ZYRA_API_TOKEN
                  sync: false

            - type: web
              name: zyra-superapp
              runtime: python
              plan: free
              buildCommand: |
                pip install --upgrade pip
                pip install -r requirements.txt
              startCommand: python superapp.py
              healthCheckPath: /health
              envVars:
                - key: PYTHON_VERSION
                  value: "3.12.4"
                - key: SUPERAPP_DATA_DIR
                  value: "/opt/render/project/src/data"
                - key: ZYRA_HOST
                  fromService:
                    name: zyra-network
                    type: web
                    property: host
          '''

          RENDER = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in RENDER.splitlines()
          )

          Path("superapp.py").write_text(SUPERAPP, encoding="utf-8")
          Path("portal").mkdir(exist_ok=True)
          Path("portal/index.html").write_text(PORTAL, encoding="utf-8")
          Path("portal/verificar.html").write_text(VER_HTML, encoding="utf-8")
          Path("portal/verificar.js").write_text(VER_JS, encoding="utf-8")
          Path("render.yaml").write_text(RENDER, encoding="utf-8")

          import yaml
          yaml.safe_load(RENDER)

          for p, marker in (
              ("superapp.py", "def main"),
              ("superapp.py", "def boot_apps"),
              ("portal/index.html", "Mi Primer Empleo"),
              ("portal/verificar.html", "Verificar autenticidad"),
              ("portal/verificar.js", "/verify"),
              ("render.yaml", "zyra-superapp"),
          ):
              assert marker in Path(p).read_text(encoding="utf-8"), p
          assert "/tmp/zyra-data" not in Path("render.yaml").read_text(encoding="utf-8")

          print("FILES CREATED OK: superapp.py, portal/3, render.yaml")
          PYEOF

      - name: Compile + import smoke
        run: |
          python3 -m py_compile superapp.py
          python3 - <<'EOF'
          import importlib
          mods = [
              "apps.mi_primer_empleo.server",
              "apps.agro.server",
              "apps.axis.server",
              "apps.semilla.server",
              "apps.nexo.server",
              "apps.subastas.server",
              "apps.ciclo_digital.server",
          ]
          for m in mods:
              importlib.import_module(m)
          import superapp
          print("SMOKE OK: 7 app modules + superapp import clean")
          EOF

      - name: Boot smoke (7 apps live in CI)
        run: |
          python3 - <<'EOF'
          import json
          import os
          import threading
          import time
          import urllib.request

          os.environ["PORT"] = "8123"
          import superapp

          threading.Thread(
              target=superapp.main, daemon=True
          ).start()
          data = None
          for _ in range(30):
              time.sleep(1)
              try:
                  data = json.loads(
                      urllib.request.urlopen(
                          "http://127.0.0.1:8123/health",
                          timeout=5,
                      ).read()
                  )
                  break
              except Exception:
                  continue
          assert data is not None, "superapp did not come up"
          print("HEALTH:", json.dumps(data))
          apps = data.get("apps", {})
          assert len(apps) == 7, "expected 7 apps, got: " + str(list(apps.keys()))
          html = urllib.request.urlopen(
              "http://127.0.0.1:8123/", timeout=5
          ).read().decode("utf-8")
          assert "ZYRA" in html
          ver = urllib.request.urlopen(
              "http://127.0.0.1:8123/verificar", timeout=5
          ).read().decode("utf-8")
          assert "Verificar autenticidad" in ver
          print("SUPERAPP SMOKE OK: portal + verificador + 7 apps booted")
          EOF

      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add superapp.py portal render.yaml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA SuperApp: single pretty entrance (portal + proxy for 7 apps) + render.yaml 2 services" -m "superapp.py boots the 7 internal app servers independently (own stores + network clients) and proxies them under one entrance with portal and public verifier. render.yaml: zyra-network (HTTP entrance) + zyra-superapp, ZYRA_HOST auto-wired via fromService."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK (attempt $i)"
              exit 0
            fi
            echo "push failed, retry $i"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
