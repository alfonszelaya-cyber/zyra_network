name: ZYRA Fase 6a arranque real y autenticacion end to end

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fase6a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cablear token en render y arrancar la red de verdad
        run: |
          python3 - <<'PYEOF'
          import importlib.util, json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          GATES = []

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('fase6a.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO')
              add('')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _manejador

          def gate(nombre, ok):
              GATES.append((nombre, bool(ok)))
              add('- gate %s: %s' % (nombre, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def contar():
              nf = 0
              np = 0
              for p in ROOT.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                      continue
                  nf += 1
                  if p.suffix == '.py':
                      np += 1
              return nf, np

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          add('# FASE 6a - ARRANQUE REAL DE LA RED + AUTH END TO END')
          add('')
          add('Paso 4 de tu linea: render real y pruebas reales. Esta fase:')
          add('1. Cablea ZYRA_API_TOKEN al servicio superapp en render.yaml.')
          add('2. ARRANCA main.py con clave raiz generada y REQUIRE_TOKEN=1.')
          add('3. Prueba con el cliente canonico: Bearer -> ok significa cadena completa demostrada.')
          add('4. Descubre las rutas reales de la API para disenar el flujo ZID completo (6b).')
          add('')
          add('El arranque en CI es REPORTAJE esta primera vez: si falta una dependencia')
          add('pesada (biometria opcional), se reporta exacta y se corrige en 6b.')
          add('')

          nf0, np0 = contar()
          add('## Snapshot inicial')
          add('')
          add('- archivos: %d | python: %d' % (nf0, np0))
          add('')

          add('## R1. render.yaml: ZYRA_API_TOKEN para superapp')
          add('')
          ry = ROOT / 'render.yaml'
          lineas = ry.read_text(encoding='utf-8').splitlines()
          idx_sp = None
          for i, l in enumerate(lineas):
              if 'name: zyra-superapp' in l:
                  idx_sp = i
                  break
          ya = False
          editado = False
          if idx_sp is not None and 'ZYRA_API_TOKEN' in '\n'.join(lineas[idx_sp:]):
              ya = True
          if idx_sp is None:
              add('- FALLO: seccion zyra-superapp no encontrada. Nada editado.')
          elif ya:
              add('- Ya presente (idempotente, sin cambios).')
              editado = True
          else:
              idx_prop = None
              for i in range(idx_sp, len(lineas)):
                  if 'property: host' in lineas[i]:
                      idx_prop = i
                      break
              if idx_prop is None:
                  add('- FALLO: bloque fromService no encontrado. Nada editado.')
              else:
                  ins = ['      - key: ZYRA_API_TOKEN', '        sync: false']
                  lineas[idx_prop + 1:idx_prop + 1] = ins
                  ry.write_text('\n'.join(lineas) + '\n', encoding='utf-8')
                  editado = True
                  add('- Insertado ZYRA_API_TOKEN (sync: false) en zyra-superapp.')
                  add('- La SuperApp y las 8 apps ya leen esa variable desde las fases 3/4c.')
          gate('render_yaml_token_superapp', editado)
          add('')

          add('## R2. Descubrimiento de rutas de la API')
          add('')
          rutas = set()
          for rel in ('shared_engines/runtime/api.py',
                      'shared_engines/runtime/combined_api.py',
                      'shared_engines/runtime/capabilities_api.py',
                      'main.py'):
              t = txt(ROOT / rel)
              for m in re.finditer(r'"(/[a-z0-9_/\-]{1,50})"', t):
                  rutas.add(m.group(1))
          rutas = sorted(rutas)
          add('- Rutas descubiertas: %d' % len(rutas))
          for r in rutas[:60]:
              add('  - `%s`' % r)
          gate('rutas_descubiertas', len(rutas) >= 3)
          add('')

          add('## R3. ARRANQUE REAL de main.py')
          add('')
          clave = secrets.token_hex(32)
          token = 'smoke-token-0123456789abcdef0123456789abcd'
          datadir = Path('/tmp/zyra-data-ci')
          datadir.mkdir(parents=True, exist_ok=True)
          env = dict(os.environ)
          env['ZYRA_ROOT_KEY'] = clave
          env['ZYRA_API_TOKEN'] = token
          env['ZYRA_REQUIRE_TOKEN'] = '1'
          env['ZYRA_DATA_DIR'] = str(datadir)
          env['ZYRA_PORT'] = '8765'
          env['PYTHONUNBUFFERED'] = '1'
          proc = None
          boot_ok = False
          salidas = []
          try:
              proc = subprocess.Popen(
                  [sys.executable, 'main.py'], cwd=str(ROOT), env=env,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          except Exception as e:
              add('- No se pudo lanzar el proceso: %s' % e)
          if proc is not None:
              inicio = time.time()
              vivo = False
              while time.time() - inicio < 45:
                  if proc.poll() is not None:
                      add('- El proceso termino durante el arranque (codigo %s).' % proc.returncode)
                      break
                  try:
                      req = urllib.request.Request('http://127.0.0.1:8765/health')
                      urllib.request.urlopen(req, timeout=3)
                      vivo = True
                      break
                  except urllib.error.HTTPError as e:
                      vivo = True
                      salidas.append(('estado_sin_auth', int(e.code)))
                      break
                  except Exception:
                      time.sleep(1.5)
              dur = round(time.time() - inicio, 1)
              if vivo:
                  boot_ok = True
                  add('- **SERVIDOR ARRIBA en %s s** (127.0.0.1:8765, REQUIRE_TOKEN=1).' % dur)
              elif proc.poll() is None:
                  add('- Sin respuesta en 45 s. Se captura el log y se detiene.')
              resto = ''
              if proc.poll() is not None or not vivo:
                  try:
                      resto = proc.stdout.read().decode('utf-8', errors='replace')
                  except Exception:
                      resto = '(log no disponible)'
                  ultimas = [l for l in resto.splitlines() if l.strip()][-25:]
                  add('')
                  add('Log de arranque (ultimas lineas):')
                  add('```')
                  for l in ultimas:
                      add(l[:160])
                  add('```')
          add('')

          add('## R4. Prueba de auth end to end con el cliente canonico')
          add('')
          estado_sin = None
          if boot_ok:
              try:
                  req = urllib.request.Request('http://127.0.0.1:8765/health')
                  urllib.request.urlopen(req, timeout=5)
                  estado_sin = 200
              except urllib.error.HTTPError as e:
                  estado_sin = int(e.code)
              except Exception as e:
                  estado_sin = 'error: %s' % e
              add('- /health SIN token: %s (con REQUIRE_TOKEN=1 lo esperado es 401)' % estado_sin)
              spec = importlib.util.spec_from_file_location(
                  'nc_e2e', str(ROOT / 'shared_engines' / 'network' / 'network_client.py'))
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              cliente = mod.NetworkClient(
                  'http://127.0.0.1:8765', api_token=token, timeout_seconds=5, max_retries=1)
              ok, datos, error = cliente.get('/health')
              add('- /health CON cliente canonico + Bearer: ok=%s datos=%s error=%s' % (ok, datos, error))
              e2e = bool(ok)
              if e2e:
                  add('')
                  add('**CADENA COMPLETA DEMOSTRADA: cliente canonico -> header Bearer -> servidor valida con hmac -> ok.**')
              gate('auth_end_to_end', e2e)
          else:
              add('- No ejecutada: el servidor no arranco (ver R3). Se diagnostica en 6b.')
          add('')

          if proc is not None:
              try:
                  if proc.poll() is None:
                      proc.terminate()
                      proc.wait(timeout=10)
              except Exception:
                  try:
                      proc.kill()
                  except Exception:
                      pass

          add('## R5. Conteo dinamico')
          add('')
          nf1, np1 = contar()
          add('- archivos: %d (esperado %d - solo render.yaml editado)' % (nf1, nf0))
          add('- python: %d (esperado %d)' % (np1, np0))
          gate('conteo_estable', nf1 == nf0 and np1 == np0)
          add('')

          add('## Decisiones del propietario para 6b')
          add('')
          add('1. **Disco persistente**: Render NO ofrece discos en plan free. Para que los ZID')
          add('   y historiales sobrevivan a los despliegues hace falta plan Starter (~USD 7/mes')
          add('   por servicio, x2 servicios). Si te quedas en free, los datos son efimeros.')
          add('2. **Consulta publica ligera**: tu vision dice que "existe Pedro? activo/no" es')
          add('   publica. Hoy REQUIRE_TOKEN es todo-o-nada. En 6b diseno la ruta publica')
          add('   separada de las operaciones protegidas (cambio de codigo, no solo config).')
          add('')

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. El commit se aborta.**' % ', '.join(fallos))
          else:
              add('**Gates OK. Commit del cambio de render.yaml.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          DATA['boot'] = boot_ok
          DATA['estado_sin_auth'] = str(estado_sin)
          DATA['rutas'] = rutas[:100]
          Path('fase6a.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')

          escribe()
          print('Fase 6a terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON - commit abortado')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A render.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "deploy(render): ZYRA_API_TOKEN cableado al servicio superapp"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios (ya cableado)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase6a-zyra
          path: fase6a.json
          if-no-files-found: ignore
