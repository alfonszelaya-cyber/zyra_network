          def serve_subastas(
              store: SubastasStore,
              client: object,
              *,
              host: str = "127.0.0.1",
              port: int = 0,
          ) -> ThreadingHTTPServer:
              handler = type(
                  "BoundSubastasHandler",
                  (SubastasApiHandler,),
                  {
                      "store": store,
                      "net_client": client,
                      "commerce": CommerceStore(store._db, store._clock),
                  },
              )
              server = ThreadingHTTPServer((host, port), handler)
              server.bound_port = server.server_address[1]
              return server
          SBSFILE
          echo "server.py written: $(wc -l < apps/subastas/server.py) lines"

      - name: Compile check
        run: |
          python3 - <<'EOF'
          import sys
          src = open("apps/subastas/server.py").read()
          try:
              compile(src, "server.py", "exec")
              print("COMPILE OK")
          except SyntaxError as e:
              lines = src.splitlines()
              ln = e.lineno or 0
              for k in range(max(0, ln - 8), min(len(lines), ln + 5)):
                  mark = ">>" if k == ln - 1 else "  "
                  print("%s %4d| %s" % (mark, k + 1, lines[k]))
              sys.exit(1)
          EOF

      - name: Boot smoke (market pages live)
        run: |
          python3 - <<'EOF'
          import threading
          import time
          import urllib.request
          import uuid

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-test"}, None)
                  return (False, None, "offline")


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          acc = "ZID-smoke-" + uuid.uuid4().hex[:6]
          store.add_account(account_id=acc, zid=acc, name="Smoke")
          store.add_listing(
              listing_id="LST-smoke1",
              seller_account=acc,
              seller_zid=acc,
              title="Test Item",
              description="desc",
              base_price=10.0,
              document_id="DOC-x",
          )
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)
          for path, must in (
              ("/subastas", "ZYRA MARKET"),
              ("/subastas/menu", "Soy vendedor"),
              ("/subastas/vendedor", "Cerrar subasta"),
              ("/subastas/comprador", "Ofertar en una subasta"),
              ("/subastas/operaciones", "Reputacion mutua"),
              ("/subastas/gobierno", "Resumen del mercado"),
              ("/subastas/listings", "Test Item"),
          ):
              html = urllib.request.urlopen(base + path, timeout=5).read().decode("utf-8")
              assert must in html, path + " missing: " + must
              assert "SUBASTAS</h1>" not in html
          print("BOOT SMOKE OK: menu + 5 role pages + listings all render as ZYRA MARKET")
          EOF

