name: "CONSOL-3 v8 FINAL: mixins (ya validados) + herencia por AST (reemplazo por POSICION, no por texto — causa del 'decl clase no hallada') + regresion"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[ESCRITURA] mixins (si ya no existen se regeneran) + herencia por AST posicional"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          def dedent_min(bodies):
              mins = []
              for b in bodies:
                  m = None
                  for ln in b.splitlines():
                      if not ln.strip():
                          continue
                      sp = len(ln) - len(ln.lstrip(" "))
                      if m is None or sp < m:
                          m = sp
                  mins.append(m if m is not None else 0)
              out = []
              for b, m in zip(bodies, mins):
                  lines = []
                  for ln in b.splitlines():
                      if ln.strip():
                          lines.append(ln[m:])
                      else:
                          lines.append("")
                  out.append("\n".join(lines) + "\n")
              return out

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              tree = ast.parse(src)
              cls = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and \
                          "Handler" in node.name:
                      cls = node
                      break
              if cls is None:
                  raise RuntimeError("no handler")
              CLSNAME = cls.name
              out("- handler encontrado: " + CLSNAME
                  + " (linea " + str(cls.lineno) + ")")

              am = pathlib.Path(
                  "apps/agro/routers/aid_mixin.py")
              sm = pathlib.Path(
                  "apps/agro/routers/screens_mixin.py")

              targets = ["_aid_payload", "_aid_network_seq",
                         "_aid_request", "_aid_eligibility",
                         "_aid_approve", "_aid_assign",
                         "_aid_deliver", "_aid_confirm",
                         "_screen_ayudas",
                         "_screen_ayudas_gobierno",
                         "_screen_producer",
                         "_screen_government",
                         "_screen_bank", "_home"]
              nodes = {}
              for node in cls.body:
                  if isinstance(node, (ast.FunctionDef,
                                       ast.AsyncFunctionDef)) \
                          and node.name in targets:
                      nodes[node.name] = node
              out("- metodos target: " + str(len(nodes))
                  + "/14 | mixins ya existen: "
                  + str(am.exists()) + "/" + str(sm.exists()))

              if am.exists() and sm.exists() and \
                      len(nodes) == 0:
                  out("- mixins ya generados y server ya"
                      " limpio — solo falta herencia")
              elif len(nodes) < 14:
                  raise RuntimeError(
                      "estado intermedio inesperado —"
                      " limpiar y reintentar")
              else:
                  # generar mixins
                  lines = src.splitlines(keepends=True)
                  aid_bodies = []
                  scr_bodies = []
                  cut = []
                  for name, node in nodes.items():
                      cut.append((node.lineno - 1,
                                  node.end_lineno))
                      full = "".join(
                          lines[node.lineno-1:
                                node.end_lineno])
                      if name.startswith("_aid"):
                          aid_bodies.append(full)
                      else:
                          scr_bodies.append(full)
                  aid_ded = dedent_min(aid_bodies)
                  scr_ded = dedent_min(scr_bodies)
                  aid_m = [textwrap.indent(b, "    ")
                           for b in aid_ded]
                  scr_m = [textwrap.indent(b, "    ")
                           for b in scr_ded]
                  hdr = ('"""AGRO mixins (CONSOL-3 v8,'
                         ' regla 77)"""\n'
                         'from __future__ import'
                         ' annotations\n\n\n')
                  am.parent.mkdir(parents=True,
                                  exist_ok=True)
                  am.write_text(
                      hdr + "class AidMixin:\n"
                      + "\n".join(aid_m),
                      encoding="utf-8")
                  py_compile.compile(str(am), doraise=True)
                  sm.write_text(
                      hdr + "class ScreensMixin:\n"
                      + "\n".join(scr_m),
                      encoding="utf-8")
                  py_compile.compile(str(sm), doraise=True)
                  out("- **mixins generados OK**")

                  # borrar metodos del server (atras hacia
                  # adelante, POR POSICION AST)
                  items = sorted(nodes.items(),
                                 key=lambda kv:
                                     -kv[1].lineno)
                  for name, node in items:
                      lo = node.lineno - 1
                      hi = node.end_lineno
                      # detectar decoradores encima
                      if lo > 0 and \
                              lines[lo-1].strip()\
                              .startswith("@"):
                          lo -= 1
                      del lines[lo:hi]
                  src = "".join(lines)

              # HERENCIA POR AST (posicional, no texto):
              src = "".join(lines) if "mixins ya" not in \
                  out.__doc__ else src
              tree2 = ast.parse(src)
              cls2 = None
              for node in tree2.body:
                  if isinstance(node, ast.ClassDef) and \
                          node.name == CLSNAME:
                      cls2 = node
                      break
              if cls2 is None:
                  raise RuntimeError("clase desaparecio")
              if any(b.asname is None and
                     isinstance(b, ast.Name) and
                     b.id in ("AidMixin", "ScreensMixin")
                     for b in cls2.bases) or \
                     any("AidMixin" in ast.unparse(b)
                         for b in cls2.bases):
                  out("- herencia: YA aplicada")
              else:
                  line_no = cls2.lineno - 1
                  ls = src.rfind("\n", 0,
                                 sum(len(l) + 1 for l in
                                     src.splitlines()
                                     [:line_no]))
                  # insertar bases en la linea de clase:
                  # reconstruimos la linea de la clase
                  lines2 = src.splitlines(keepends=True)
                  cl_line = lines2[line_no]
                  # quitar la linea original y agregar la
                  # nueva con las bases extra
                  base_txt = ast.unparse(
                      cls2.bases[0]) if cls2.bases else ""
                  new_line = cl_line.replace(
                      "class " + CLSNAME,
                      "class " + CLSNAME
                      + "(AidMixin, ScreensMixin)", 1)
                  if new_line == cl_line:
                      # bases ya con parentesis anidados:
                      # insertar despues del primer (
                      p = cl_line.find("(")
                      new_line = (cl_line[:p+1]
                                  + "AidMixin, ScreensMixin, "
                                  + cl_line[p+1:])
                  lines2[line_no] = new_line
                  # agregar imports al inicio (despues de
                  # __future__)
                  imp_line = ("from apps.agro.routers."
                              "aid_mixin import AidMixin\n"
                              "from apps.agro.routers."
                              "screens_mixin import"
                              " ScreensMixin\n")
                  fi = None
                  for i, ln in enumerate(lines2):
                      if "__future__" in ln:
                          fi = i + 1
                          break
                  if fi is None:
                      fi = 0
                  lines2.insert(fi, imp_line)
                  new_src = "".join(lines2)
                  ast.parse(new_src)
                  SP.write_text(new_src, encoding="utf-8")
                  py_compile.compile(str(SP), doraise=True)
                  out("- **herencia aplicada POR POSICION"
                      " AST (no por texto) — causa del"
                      " 'decl clase no hallada'"
                      " corregida**")

              py_compile.compile(str(SP), doraise=True)
              n_now = len(src.splitlines()) \
                  if "mixins ya" in str(locals()) else \
                  len(new_src.splitlines())
              out("- server lineas ahora: "
                  + str(len(pathlib.Path(
                      "apps/agro/server.py").read_text(
                      encoding="utf-8").splitlines())))
              with open("/tmp/consol3_ok", "w") as f:
                  f.write("OK")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO — revert automatico")
              os.system("git checkout -- apps/agro/server.py"
                        " 2>/dev/null")
              os.system("rm -f apps/agro/routers/aid_mixin.py"
                        " apps/agro/routers/screens_mixin.py"
                        " 2>/dev/null")
              out("- restaurado")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              with open("/tmp/consol3_ok", "w") as f:
                  f.write("FAIL")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion AGRO completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — mixins + herencia VALIDADOS (incluye los 5 HTTP)" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed)" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -50 /tmp/x3.out; echo '```'; } >> "$SUM"
            git checkout -- apps/agro/server.py 2>/dev/null
            rm -f apps/agro/routers/aid_mixin.py apps/agro/routers/screens_mixin.py
            echo "- RESTAURADO (57 tests estable)" >> "$SUM"
            echo "FAIL" > /tmp/consol3_ok
          fi
          exit 0

      - name: "[ENTREGA] commit solo si marcador OK + AGRO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/consol3_ok 2>/dev/null || echo FAIL)" != "OK" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**CONSOL-3 v8 BLOQUEADA — restaurado (57 tests).**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**CONSOL-3: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(CONSOL-3 v8, regla 77): server.py AGRO — mixins AidMixin/ScreensMixin + herencia aplicada POR POSICION AST (reemplazo de linea de clase por AST, no por texto — causa del 'decl clase no hallada' resuelta definitivamente) + idempotente (detecta mixins ya generados y server ya limpio) + regresion AGRO verde con los 5 HTTP"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**CONSOL-3 v8 OK — server.py AGRO cumple regla 77. SISTEMA CONSOLIDADO COMPLETO.**"
          exit 0
