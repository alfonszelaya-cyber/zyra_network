name: ZYRA D2b instalacion registro y actualizacion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD2b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: Pantalla limpia, instalacion, registro real y version
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          PORTAL = ROOT / 'portal'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD2b.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          class NoRedir(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(NoRedir)

          def pedir(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  resp = OPENER.open(req, timeout=10)
                  return resp.status, resp.headers, resp.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, None, str(e)

          def contar():
              nf = 0
              npy = 0
              for p in ROOT.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                      continue
                  nf += 1
                  if p.suffix == '.py':
                      npy += 1
              return nf, npy

          sp_orig = SP_FILE.read_bytes()
          idx = PORTAL / 'index.html'
          reg = PORTAL / 'registro.html'
          swf = PORTAL / 'sw.js'
          verf = PORTAL / 'version.txt'
          originales = {
              'sp': sp_orig,
              'idx': idx.read_bytes(),
              'reg': reg.read_bytes(),
              'sw': swf.read_bytes(),
          }
          creados = []

          def revertir():
              try:
                  SP_FILE.write_bytes(originales['sp'])
                  idx.write_bytes(originales['idx'])
                  reg.write_bytes(originales['reg'])
                  swf.write_bytes(originales['sw'])
                  for c in creados:
                      p = ROOT / c
                      if p.exists():
                          p.unlink()
              except Exception:
                  pass

          nf0, np0 = contar()
          t_sp = sp_orig.decode('utf-8')
          add('# D2b - INSTALACION, REGISTRO REAL Y ACTUALIZACION')
          add('')
          add('Snapshot inicial: archivos=%d python=%d' % (nf0, np0))
          add('')

          add('## T1. Anclas (exactamente 1 cada una)')
          add('')
          BLOQUE_PORTAL_VIEJO = [
          '        if path in ("/", "/index.html"):',
          '            base = self._read_portal("index.html").decode("utf-8")',
          '            zid_s = self._sesion()',
          '            if zid_s:',
          '                estado = (',
          '                    \'<p class="estado ok">Conectado: \' + zid_s + \'</p>\')',
          '            else:',
          '                estado = (',
          '                    \'<p class="estado">Sin sesion. Entra para acceder a las apps.</p>\')',
          '            base = base.replace("__ESTADO__", estado, 1)',
          '            self._send_html(200, base)',
          '            return',
          ]
          anclas = {
              'bloque_portal': t_sp.count('\n'.join(BLOQUE_PORTAL_VIEJO)),
              'ancla_health': t_sp.count('        if path == "/health":'),
          }
          for k, v in anclas.items():
              add('- %s: %d (se requiere 1)' % (k, v))
          anclas_ok = all(v == 1 for v in anclas.values())
          gate('anclas_unicas', anclas_ok)
          if not anclas_ok:
              add('**NO UNICO: nada editado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseD2b.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS NO UNICOS - sin cambios')
          add('')

          add('## T2. index.html nuevo: limpio, con instalar y actualizar')
          add('')
          INDEX_LINES = [
          '<!doctype html>',
          '<html lang="es">',
          '<head>',
          '<meta charset="utf-8">',
          '<meta name="viewport" content="width=device-width, initial-scale=1">',
          '<link rel="manifest" href="/manifest.json">',
          '<meta name="theme-color" content="#0a0e27">',
          '<title>ZYRA</title>',
          '<style>',
          'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;',
          'background:radial-gradient(circle at 20% 10%,#141a3d 0%,#0a0e27 55%);',
          'color:#e6edf3;display:flex;flex-direction:column;align-items:center;',
          'padding:40px 20px;box-sizing:border-box}',
          '.logo{width:84px;height:84px;border-radius:22px;',
          'background:linear-gradient(135deg,#8b5cf6,#3b82f6,#ec4899);',
          'display:flex;align-items:center;justify-content:center;',
          'font-size:44px;font-weight:800;color:#ffffff;',
          'box-shadow:0 8px 30px rgba(139,92,246,0.45)}',
          'h1{margin:18px 0 4px;font-size:34px;letter-spacing:6px}',
          '.tag{color:#8b949e;margin:0 0 26px;text-align:center;max-width:420px}',
          '.estado{font-size:14px;margin:0 0 20px;padding:6px 14px;border-radius:99px;',
          'border:1px solid #238636;color:#3fb950}',
          '.menu{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}',
          '.opcion{display:flex;flex-direction:column;gap:2px;text-decoration:none;',
          'background:#11162b;border:1px solid #242c4f;border-radius:14px;',
          'padding:16px 18px;transition:border-color .15s}',
          '.opcion:hover{border-color:#8b5cf6}',
          '.opcion b{font-size:17px;color:#e6edf3}',
          '.opcion span{font-size:13px;color:#8b949e}',
          '#btn-instalar{display:none;width:100%;max-width:420px;margin-top:12px;',
          'padding:14px;border-radius:14px;border:none;background:#238636;',
          'color:#ffffff;font-size:16px;font-weight:700}',
          '#banner-act{display:none;width:100%;max-width:420px;margin-top:16px;',
          'background:#1f2a44;border:1px solid #8b5cf6;border-radius:14px;',
          'padding:14px;text-align:center}',
          '#banner-act button{margin-top:8px;padding:10px 22px;border-radius:10px;',
          'border:none;background:linear-gradient(90deg,#8b5cf6,#ec4899);',
          'color:#ffffff;font-weight:700;font-size:15px}',
          '.pie{margin-top:30px;color:#4a5370;font-size:12px;letter-spacing:2px}',
          '</style>',
          '</head>',
          '<body>',
          '<div class="logo">Z</div>',
          '<h1>ZYRA</h1>',
          '<p class="tag">Red de confianza digital. Tu identidad, verificada y tuya.</p>',
          '__ESTADO__',
          '<div class="menu">',
          '<a class="opcion" href="/registro"><b>Registro</b><span>Crea tu ZID unico</span></a>',
          '<a class="opcion" href="/entrar"><b>Entrar</b><span>Si ya estas registrado</span></a>',
          '<a class="opcion" href="/verificar"><b>Verificar</b><span>Confirma la autenticidad de un documento</span></a>',
          '</div>',
          '<button id="btn-instalar" onclick="instalarApp()">Instalar app</button>',
          '<div id="banner-act"><div>Nueva version disponible</div>',
          '<button onclick="aplicarActualizacion()">Actualizar</button></div>',
          '<p class="pie">JAZA GLOBAL SYSTEMS</p>',
          '<script>',
          'var _zp=null;',
          "window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_zp=e;document.getElementById('btn-instalar').style.display='block';});",
          'function instalarApp(){if(_zp){_zp.prompt();_zp=null;}}',
          "if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}",
          "fetch('/version').then(function(r){return r.text();}).then(function(v){",
          "v=v.trim();var g=localStorage.getItem('zyra_ver');",
          'if(g&&g!==v){document.getElementById("banner-act").style.display="block";}',
          'if(!g){localStorage.setItem("zyra_ver",v);}});',
          'function aplicarActualizacion(){fetch("/version").then(function(r){return r.text();}).then(function(v){localStorage.setItem("zyra_ver",v.trim());location.reload();});}',
          '</script>',
          '</body>',
          '</html>',
          ]
          idx.write_text('\n'.join(INDEX_LINES) + '\n', encoding='utf-8')
          add('- index.html: sin linea de sin sesion; instalar y actualizar integrados.')
          gate('index_nuevo', True)
          add('')

          add('## T3. registro.html: formulario real')
          add('')
          REG_LINES = [
          '<!doctype html>',
          '<html lang="es">',
          '<head>',
          '<meta charset="utf-8">',
          '<meta name="viewport" content="width=device-width, initial-scale=1">',
          '<title>Registro - ZYRA</title>',
          '<style>',
          'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;',
          'background:#0a0e27;color:#e6edf3;display:flex;flex-direction:column;',
          'align-items:center;padding:32px 16px;box-sizing:border-box}',
          '.caja{max-width:460px;width:100%;background:#11162b;',
          'border:1px solid #242c4f;border-radius:16px;padding:26px 22px;',
          'box-sizing:border-box}',
          'h1{margin:0 0 6px;font-size:22px}',
          'p{color:#8b949e;font-size:14px;line-height:1.5;margin:6px 0}',
          'label{display:block;font-size:13px;color:#8b949e;margin:12px 0 4px}',
          'input{width:100%;padding:12px;border-radius:10px;border:1px solid #30363d;',
          'background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px}',
          'button{width:100%;margin-top:18px;padding:14px;border-radius:12px;',
          'border:none;background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);',
          'color:#ffffff;font-size:16px;font-weight:700}',
          'a{color:#8b5cf6;text-decoration:none}',
          '</style>',
          '</head>',
          '<body>',
          '<div class="caja">',
          '<h1>Registro de ciudadanos</h1>',
          '<p>Un solo registro para toda la vida. La Red crea tu ZID unico.</p>',
          '<form method="POST" action="/registro/nuevo">',
          '<label>Nombre completo</label>',
          '<input name="nombre" required>',
          '<label>Documento (DUI o pasaporte)</label>',
          '<input name="documento" required>',
          '<label>Fecha de nacimiento</label>',
          '<input name="fecha" type="date" required>',
          '<label>Correo</label>',
          '<input name="correo" type="email" required>',
          '<button>Crear mi ZID</button>',
          '</form>',
          '<p style="margin-top:14px">La biometria se activa con la Red. Menores de edad: registro por partida, alcaldia y padres.</p>',
          '<p><a href="/">Volver</a></p>',
          '</div>',
          '</body>',
          '</html>',
          ]
          reg.write_text('\n'.join(REG_LINES) + '\n', encoding='utf-8')
          add('- registro.html: formulario que envia a la Red.')
          gate('registro_form', True)
          add('')

          add('## T4. sw.js limpio y version.txt')
          add('')
          SW_LINES = [
              "var CACHE='zyra-v3';",
              "self.addEventListener('install',function(e){self.skipWaiting();});",
              "self.addEventListener('activate',function(e){e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}).then(function(){return self.clients.claim();}));});",
              "self.addEventListener('fetch',function(e){});",
          ]
          swf.write_text('\n'.join(SW_LINES) + '\n', encoding='utf-8')
          verf.write_text('ZYRA-2026.10.12-1\n', encoding='utf-8')
          creados.append('portal/version.txt')
          add('- sw.js v3 sin cache. version.txt creado (banner solo cuando cambie).')
          gate('sw_version', True)
          add('')

          add('## T5. superapp.py: estado, /version y /registro/nuevo')
          add('')
          BLOQUE_PORTAL_NUEVO = [
          '        if path in ("/", "/index.html"):',
          '            base = self._read_portal("index.html").decode("utf-8")',
          '            zid_s = self._sesion()',
          '            estado = ""',
          '            if zid_s:',
          '                estado = (',
          '                    \'<p class="estado ok">Conectado: \' + zid_s',
          '                    + \' &middot; <a href="/salir" style="color:#f85149">Salir</a></p>\')',
          '            base = base.replace("__ESTADO__", estado, 1)',
          '            self._send_html(200, base)',
          '            return',
          ]
          RUTAS_NUEVAS = [
          '        if path == "/version":',
          '            try:',
          '                datos_v = self._read_portal("version.txt")',
          '            except Exception:',
          '                datos_v = b"0"',
          '            self._send(200, "text/plain; charset=utf-8", datos_v)',
          '            return',
          '        if path == "/registro/nuevo":',
          '            if not ZYRA_URL:',
          '                self._send_html(503, ERROR_PAGE.replace("__MSG__", "Red no configurada"))',
          '                return',
          '            largo = int(self.headers.get("Content-Length", 0) or 0)',
          '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
          '            from urllib.parse import unquote_plus as _uq',
          '            campos = {}',
          '            for par in crudo.split("&"):',
          '                if "=" in par:',
          '                    k, v = par.split("=", 1)',
          '                    campos[k] = _uq(v).strip()',
          '            cliente = _SimpleClient(ZYRA_URL)',
          '            ok_r, datos_r, error_r = cliente.post("/identity/register", {',
          '                "kind": "persona",',
          '                "name": campos.get("nombre", ""),',
          '                "document": campos.get("documento", ""),',
          '                "birth_date": campos.get("fecha", ""),',
          '                "email": campos.get("correo", ""),',
          '            })',
          '            if ok_r and isinstance(datos_r, dict):',
          '                zid = datos_r.get("zid") or datos_r.get("identity_id") or ""',
          '                if zid:',
          '                    html_ok = (',
          '                        "<!doctype html><html lang=\'es\'><head><meta charset=\'utf-8\'>"',
          '                        "<meta name=\'viewport\' content=\'width=device-width, initial-scale=1\'>"',
          '                        "<title>Tu ZID</title><style>body{font-family:system-ui;"',
          '                        "background:#0a0e27;color:#e6edf3;display:flex;min-height:100vh;"',
          '                        "align-items:center;justify-content:center;padding:24px;"',
          '                        "box-sizing:border-box;text-align:center}.caja{max-width:460px;"',
          '                        "background:#11162b;border:1px solid #242c4f;border-radius:16px;"',
          '                        "padding:28px 24px}b{color:#3fb950;font-size:24px;"',
          '                        "word-break:break-all}a{color:#8b5cf6}</style></head>"',
          '                        "<body><div class=\'caja\'><h1>Tu ZID unico</h1>"',
          '                        "<p>Guarda este codigo. Es tu identidad en toda la Red:</p>"',
          '                        "<b>" + zid + "</b>"',
          '                        "<p><a href=\'/entrar\'>Entrar con mi ZID</a> | "',
          '                        "<a href=\'/\'>Volver</a></p></div></body></html>")',
          '                    self._send_html(200, html_ok)',
          '                    return',
          '            msg = error_r or (json.dumps(datos_r, ensure_ascii=False)[:300] if datos_r else "sin respuesta de la Red")',
          '            html_er = (',
          '                "<!doctype html><html lang=\'es\'><head><meta charset=\'utf-8\'>"',
          '                "<meta name=\'viewport\' content=\'width=device-width, initial-scale=1\'>"',
          '                "<title>Registro</title><style>body{font-family:system-ui;"',
          '                "background:#0a0e27;color:#e6edf3;display:flex;min-height:100vh;"',
          '                "align-items:center;justify-content:center;padding:24px;"',
          '                "box-sizing:border-box;text-align:center}.caja{max-width:460px;"',
          '                "background:#11162b;border:1px solid #242c4f;border-radius:16px;"',
          '                "padding:28px 24px}code{color:#f85149;word-break:break-all}"',
          '                "a{color:#8b5cf6}</style></head><body><div class=\'caja\'>"',
          '                "<h1>La Red responde</h1>"',
          '                "<p>El registro necesita estos datos del contrato:</p>"',
          '                "<code>" + str(msg) + "</code>"',
          '                "<p><a href=\'/registro\'>Volver al formulario</a></p></div></body></html>")',
          '            self._send_html(200, html_er)',
          '            return',
          '',
          ]
          t = t_sp
          t = t.replace('\n'.join(BLOQUE_PORTAL_VIEJO), '\n'.join(BLOQUE_PORTAL_NUEVO), 1)
          pos = t.find('        if path == "/health":')
          t = t[:pos] + '\n'.join(RUTAS_NUEVAS) + '\n' + t[pos:]
          SP_FILE.write_text(t, encoding='utf-8')
          add('- portal sin linea de sin sesion; Conectado solo cuando hay sesion.')
          add('- /version y /registro/nuevo (proxy al registro de la Red) servidos.')
          gate('rutas_nuevas', True)
          add('')

          add('## T6. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(SP_FILE), doraise=True)
              add('- py_compile: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## T7. Sistema arriba')
          add('')
          ZID = 'Z-DUENO-CI'
          CLAVE = 'clave-ci-secreta-9999'
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d2b', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-d2b', 'PORT': str(SP), 'ZYRA_OWNER_ZID': ZID, 'ZYRA_CLAVE_DUENO': CLAVE, 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cuerpo).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps_vivas', spv and len(apps) == 8)
          add('')

          add('## T8. Verificacion en vivo')
          add('')
          if spv:
              st, _h, b = pedir(BSP + '/')
              ok_i = (st == 200 and 'Registro' in b and 'Entrar' in b and 'Verificar' in b and 'btn-instalar' in b and 'banner-act' in b and 'Sin sesion' not in b and 'ZYRA MARKET' not in b)
              add('- GET / -> %s pantalla limpia con instalar y actualizar %s' % (st, 'OK' if ok_i else 'FALLO'))
              gate('pantalla_limpia', ok_i)
              st, _h, b = pedir(BSP + '/version')
              ok_v = (st == 200 and 'ZYRA-' in b)
              add('- GET /version -> %s %s' % (st, 'OK' if ok_v else 'FALLO'))
              gate('version_sirve', ok_v)
              st, _h, b = pedir(BSP + '/registro')
              ok_r = (st == 200 and 'nombre' in b and 'documento' in b and '/registro/nuevo' in b)
              add('- GET /registro -> %s formulario real %s' % (st, 'OK' if ok_r else 'FALLO'))
              gate('registro_formulario', ok_r)
              cuerpo_post = 'nombre=Prueba+CI&documento=00000000-0&fecha=1990-01-01&correo=prueba%40ci.test'
              st, _h, b = pedir(BSP + '/registro/nuevo', data=cuerpo_post.encode('utf-8'))
              contrato = (st == 200 and ('Tu ZID unico' in b or 'La Red responde' in b))
              add('- POST /registro/nuevo -> %s (ZID creado o contrato de la Red) %s' % (st, 'OK' if contrato else 'FALLO'))
              gate('registro_fluye', contrato)
              st, _h, b = pedir(BSP + '/inicio')
              add('- GET /inicio (splash) -> %s' % st)
              gate('splash_sirve', st == 200)
              st, h, _b = pedir(BSP + '/entrar', data=('zid=' + ZID + '&clave=' + CLAVE).encode('utf-8'))
              sc = (h.get('Set-Cookie') or '').split(';')[0] if h else ''
              st, _h, b = pedir(BSP + '/', {'Cookie': sc})
              conectado = (st == 200 and ('Conectado: ' + ZID) in b and 'Salir' in b)
              add('- con sesion muestra Conectado y Salir %s' % ('OK' if conectado else 'FALLO'))
              gate('estado_conectado', conectado)
              st, _h, b = pedir(BSP + '/')
              limpio = (st == 200 and 'Conectado:' not in b and 'Sin sesion' not in b)
              add('- sin sesion la pantalla no menciona sesion %s' % ('OK' if limpio else 'FALLO'))
              gate('sin_linea_sesion', limpio)
              st, _h, b = pedir(BSP + '/laboratorio/ui')
              add('- guard intacto: /laboratorio/ui -> %s (401)' % st)
              gate('guard_intacto', st == 401)
          else:
              gate('pantalla_limpia', False)
              gate('version_sirve', False)
              gate('registro_formulario', False)
              gate('registro_fluye', False)
              gate('splash_sirve', False)
              gate('estado_conectado', False)
              gate('sin_linea_sesion', False)
              gate('guard_intacto', False)
          add('')

          add('## T9. Conteo dinamico')
          add('')
          nf1, np1 = contar()
          esp_nf = nf0 + len(creados)
          add('- archivos: %d (esperado %d = %d + %d)' % (nf1, esp_nf, nf0, len(creados)))
          add('- python: %d (esperado %d)' % (np1, np0))
          gate('conteo_dinamico', nf1 == esp_nf and np1 == np0)
          add('')

          criticos = ('anclas_unicas', 'compila', 'ocho_apps_vivas', 'pantalla_limpia', 'version_sirve', 'registro_formulario', 'registro_fluye', 'estado_conectado', 'guard_intacto', 'conteo_dinamico')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos):
              revertir()
              add('## REVERSION APLICADA - todo restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**VERIFICADO. Commit.**')
              add('')
              add('Tras el deploy: quita la app vieja del celular y Agrega de nuevo (icono nuevo). El boton Instalar aparecera si tu navegador lo permite. Para actualizar en el futuro: la app mostrara el banner solo cuando subamos la version.')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseD2b.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D2b terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(designo): instalar de vuelta, registro real, banner de version"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseD2b-zyra
          path: faseD2b.json
          if-no-files-found: ignore
