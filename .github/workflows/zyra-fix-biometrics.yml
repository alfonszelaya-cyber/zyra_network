name: ZYRA Fase 9 auditoria de interfaces de las 8 apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fase9:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias minimas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography

      - name: Mapa de interfaces de las apps
        run: |
          python3 - <<'PYEOF'
          import json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)
          APPS = ['/mpe', '/agro', '/axis', '/semilla', '/nexo',
                  '/subastas', '/ciclo', '/laboratorio']

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('fase9.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _manejador

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def pedir(url):
              try:
                  with urllib.request.urlopen(url, timeout=8) as r:
                      ct = r.headers.get('Content-Type', '')
                      cuerpo = r.read().decode('utf-8', errors='replace')
                      return r.status, ct, cuerpo
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', errors='replace')[:500]
              except Exception as e:
                  return None, '', str(e)

          add('# FASE 9 - AUDITORIA DE INTERFACES (app normal vs API cruda)')
          add('')
          add('Regla nivel pro: backend JSON = motor (correcto). Frontend HTML = lo que')
          add('el usuario necesita. Se mapea que sirve cada app en su raiz y donde')
          add('esta la UI del laboratorio que su propio catalogo menciona.')
          add('')

          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN,
                      'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-9',
                      'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-9',
                      'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env,
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.STDOUT)
          sproc = None
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _ct, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          add('## I1. Sistema arriba')
          add('')
          add('- red: %s' % vivo)
          sproc = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT),
                                   env=env, stdout=subprocess.DEVNULL,
                                   stderr=subprocess.STDOUT)
          sp_vivo = False
          t0 = time.time()
          while time.time() - t0 < 70:
              if sproc.poll() is not None:
                  break
              st, _ct, _b = pedir(BSP + '/health')
              if st == 200:
                  sp_vivo = True
                  break
              time.sleep(1.5)
          add('- superapp: %s' % sp_vivo)
          gate('sistema_arriba', vivo and sp_vivo)
          add('')

          add('## I2. Que sirve cada app en su raiz')
          add('')
          add('| App | HTTP | Content-Type | Tipo | Titulo o primera señal |')
          add('|---|---|---|---|---|')
          tipos = {}
          for a in APPS:
              st, ct, cuerpo = pedir(BSP + a + '/')
              es_html = 'text/html' in ct.lower()
              es_json = 'json' in ct.lower() or cuerpo.strip().startswith('{')
              tipo = 'HTML' if es_html else ('JSON' if es_json else 'OTRO')
              tipos[a] = tipo
              titulo = ''
              if es_html:
                  m = re.search(r'<title>([^<]{1,60})</title>', cuerpo)
                  if m:
                      titulo = m.group(1)
                  else:
                      mh = re.search(r'<h1[^>]*>([^<]{1,60})</h1>', cuerpo)
                      if mh:
                          titulo = mh.group(1)
              elif es_json:
                  n = len(re.findall(r'"patron"', cuerpo))
                  titulo = 'JSON (%d entradas de catalogo)' % n if n else 'JSON'
              add('| %s | %s | %s | **%s** | %s |' % (a, st, ct[:30], tipo, titulo[:50]))
          DATA['tipos_raiz'] = tipos
          html_en_raiz = [a for a, t in tipos.items() if t == 'HTML']
          add('')
          add('- Apps con HTML en raiz: %d de 8 (%s)' % (len(html_en_raiz), html_en_raiz))
          add('- Apps con JSON crudo en raiz: %s' % [a for a, t in tipos.items() if t == 'JSON'])
          add('')
          add('> Nota: JSON en raiz NO es defecto del motor. Es que la puerta de entrada')
          add('> para humanos no esta definida en esa app. El motor sigue siendo usable por API.')
          add('')

          add('## I3. Donde esta la UI del laboratorio (su catalogo la menciona)')
          add('')
          uis = []
          for ruta in ('/laboratorio/ui', '/laboratorio/ui/menu',
                       '/laboratorio/panel', '/laboratorio/index.html',
                       '/laboratorio/api/v1/ui/menu'):
              st, ct, cuerpo = pedir(BSP + ruta)
              tipo = 'HTML' if 'text/html' in ct.lower() else (
                  'JSON' if 'json' in ct.lower() or cuerpo.strip().startswith('{') else '?')
              uis.append((ruta, st, tipo))
              add('- GET %s -> %s (%s) %s' % (ruta, st, tipo, cuerpo[:80].replace('\n', ' ')))
          add('')
          ui_ok = any(st == 200 and t == 'HTML' for _r, st, t in uis)
          gate('ui_laboratorio_localizada', ui_ok)
          if not ui_ok:
              add('')
              add('Buscando en el codigo del laboratorio donde define su UI...')
              src = ROOT / 'apps' / 'laboratorio'
              hits = []
              for p in src.rglob('*.py'):
                  try:
                      if p.stat().st_size == 0:
                          continue
                      t = p.read_text(encoding='utf-8', errors='replace')
                  except OSError:
                      continue
                  for i, ln in enumerate(t.splitlines()):
                      if re.search(r'(?i)(text/html|<html|<h1|ui/menu|index\.html)', ln):
                          hits.append('%s:%d: %s' % (p.relative_to(ROOT), i + 1, ln.strip()[:120]))
                          if len(hits) >= 12:
                              break
                  if len(hits) >= 12:
                      break
              add('')
              add('```python')
              for h in hits:
                  add(h)
              add('```')
          add('')

          add('## I4. Elementos interactivos en las interfaces HTML encontradas')
          add('')
          for a in html_en_raiz[:8]:
              st, ct, cuerpo = pedir(BSP + a + '/')
              if st != 200 or 'text/html' not in ct.lower():
                  continue
              forms = len(re.findall(r'<form', cuerpo))
              inputs = len(re.findall(r'<input', cuerpo))
              botones = len(re.findall(r'<button', cuerpo))
              enlaces = len(re.findall(r'<a\s', cuerpo))
              add('- %s: %d forms, %d inputs, %d botones, %d enlaces' % (a, forms, inputs, botones, enlaces))
          add('')

          add('## I5. El portal de la superapp: la entrada unica de la vision')
          add('')
          st, ct, cuerpo = pedir(BSP + '/')
          es_html = 'text/html' in ct.lower()
          tarjetas = len(re.findall(r'class="card', cuerpo)) if es_html else 0
          soon = len(re.findall(r'soon', cuerpo)) if es_html else 0
          add('- GET / -> %s (%s) | tarjetas=%d | marcadas soon=%d' % (st, 'HTML' if es_html else '?', tarjetas, soon))
          gate('portal_html', es_html and tarjetas >= 8)
          add('')

          for p in (sproc, proc):
              try:
                  if p and p.poll() is None:
                      p.terminate()
                      p.wait(timeout=10)
              except Exception:
                  try:
                      p.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s.**' % ', '.join(fallos))
          else:
              add('**Mapa completo. Con estos datos se disenian las interfaces que faltan (9b).**')
          add('')
          add('## Plan 9b segun estos datos')
          add('')
          add('1. Para apps con JSON en raiz: crear puerta HTML (panel) que consuma su propia API.')
          add('2. Laboratorio: conectar su UI existente a la raiz o enlazarla desde el portal.')
          add('3. Portal de la superapp: enlaces directos a los paneles HTML de cada app.')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          DATA['tipos'] = tipos
          Path('fase9.json').write_text(
              json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
              encoding='utf-8')
          escribe()
          print('Fase 9 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase9-zyra
          path: fase9.json
          if-no-files-found: ignore
