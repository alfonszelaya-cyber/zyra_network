# ZYRA-FIX v6 - registro ZID (orden de pasos obligatorio)
# Paso 1 - verifica que superapp.py base compile (lo repara desde el historial si no)
# Paso 2 - aplica el parche v6 CODIFICADO en un unico punto y valida TODO antes de publicar
# Paso 3 - commit solo si TODO pasa; si algo falla, no se publica nada
name: zyra-fix-biometrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paso 1 - Verificar base estable de superapp.py
        run: |
          set -e
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          rm -rf __pycache__
          BASE_OK=0
          if python3 -m py_compile superapp.py 2>/dev/null; then
            BASE_OK=1
            echo "- superapp.py actual compila (estado estable confirmado)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- superapp.py NO compila; restaurando desde el historial..." >> "$GITHUB_STEP_SUMMARY"
            git checkout HEAD -- superapp.py 2>/dev/null || true
            if python3 -m py_compile superapp.py 2>/dev/null; then
              BASE_OK=1
              echo "- restaurado desde HEAD: OK" >> "$GITHUB_STEP_SUMMARY"
            else
              i=1
              while [ $i -le 12 ] && [ $BASE_OK -eq 0 ]; do
                if git checkout "HEAD~$i" -- superapp.py 2>/dev/null; then
                  if python3 -m py_compile superapp.py 2>/dev/null; then
                    BASE_OK=1
                    echo "- restaurado desde HEAD~$i: OK" >> "$GITHUB_STEP_SUMMARY"
                  fi
                else
                  break
                fi
                i=$((i+1))
              done
            fi
          fi
          rm -rf __pycache__
          if [ "$BASE_OK" -ne 1 ]; then
            echo "## Veredicto - BASE IRREPARABLE (RC=3). Se requiere revision manual." >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
          if ! git diff --quiet -- superapp.py; then
            git add superapp.py
            git commit -m "ZYRA-FIX v6 punto 1 - restaurar superapp.py estable y verificable"
            git push origin HEAD
            echo "- superapp.py restaurado y PUBLICADO. La pagina funciona aunque todo lo demas falle." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Base lista: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Paso 2 - Aplicar parche v6 y validar
        run: |
          mkdir -p _zyra
          python3 <<'PYEOF'
