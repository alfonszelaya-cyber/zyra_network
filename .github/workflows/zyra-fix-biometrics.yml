name: "ZYRA MARKET (Bloque 2 v7): test corregido - tercero oferta"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-b2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Estado (relocate/wiring ya aplicados?)
        run: |
          echo "=== 009 ==="
          ls -1 apps/subastas/modules/009_riesgo_proteccion/ 2>/dev/null
          echo "=== wired? ==="
          grep -c "riesgo_store" apps/subastas/server.py || echo "0"

      - name: E2E (vendedor no puja lo propio + todo el ciclo 009)
        run: |
          python3 - <<'EOF'
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import uuid

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-test"}, None)
                  return (False, None, "offline")


          def call(method, url, payload=None, form=None):
              if form is not None:
                  from urllib.parse import urlencode
                  data = urlencode(form).encode()
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              else:
                  data = json.dumps(payload).encode() if payload is not None else None
                  headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=5) as r:
                      return json.loads(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  body = e.read()[:600].decode("utf-8", "replace")
                  raise AssertionError("HTTP %s %s %s -> %s" % (e.code, method, url, body))


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          seller = "ZID-sell-" + uuid.uuid4().hex[:5]
          bad = "ZID-bad-" + uuid.uuid4().hex[:5]
          buyer = "ZID-buy-" + uuid.uuid4().hex[:5]
          store.add_account(account_id=seller, zid=seller, name="S")
          store.add_account(account_id=bad, zid=bad, name="Bad")
          store.add_account(account_id=buyer, zid=buyer, name="Buyer")
          store.add_listing(
              listing_id="LST-ok", seller_account=seller, seller_zid=seller,
              title="Item", description="d", base_price=10.0, document_id="DOC-x",
          )
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          r = call("POST", base + "/subastas/api/riesgo/scan",
                   {"account": bad, "orders_last_hour": 15,
                    "account_age_days": 2, "activity_count": 30, "doc_duplicates": 1})
          assert r["ok"] and len(r["data"]["alerts"]) >= 3, r
          print("1. patrones OK:", [a["pattern"] for a in r["data"]["alerts"]])

          blk = call("POST", base + "/subastas/api/riesgo/bloqueo",
                     {"subject_account": bad, "reason": "confirmado", "actor": "gob1"})
          assert blk["ok"], blk
          print("2. bloqueo OK")

          for label, fn in (
              ("ofertar", lambda: call("POST", base + "/subastas/api/bids",
                   {"listing_id": "LST-ok", "bidder_account": bad, "amount": 20.0})),
              ("publicar", lambda: call("POST", base + "/subastas/listing", form={
                   "seller_account": bad, "title": "X", "base_price": "5"})),
              ("comprar", lambda: call("POST", base + "/subastas/api/orders",
                   {"listing_id": "LST-ok", "buyer_account": bad, "source": "direct"})),
          ):
              try:
                  fn()
                  raise SystemExit("FALLO: bloqueada pudo " + label)
              except AssertionError as e:
                  assert "bloqueada" in str(e), e
              print("3. bloqueada NO puede " + label)

          ok = call("POST", base + "/subastas/api/bids",
                    {"listing_id": "LST-ok", "bidder_account": buyer, "amount": 20.0})
          assert ok["ok"], ok
          print("4. comprador tercero SI puede ofertar OK")

          try:
              call("POST", base + "/subastas/api/bids",
                   {"listing_id": "LST-ok", "bidder_account": seller, "amount": 25.0})
              raise SystemExit("FALLO: vendedor pudo pujar lo propio")
          except AssertionError as e:
              assert "seller cannot bid" in str(e), e
          print("5. regla antifraude original intacta (vendedor no puja lo propio) OK")

          html = urllib.request.urlopen(base + "/subastas/riesgo", timeout=5).read().decode()
          assert "Escaneo de patrones" in html and bad in html
          nav = urllib.request.urlopen(base + "/subastas/menu", timeout=5).read().decode()
          assert "Riesgo" in nav
          print("E2E SMOKE OK: 009 completo + antifraude original intacto")
          EOF

      - name: ZYRA MARKET tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/subastas/tests -q || true

      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (Bloque 2 v7): E2E con tercero - sistema verificado completo" -m "Test fix: previous run proved system works (block enforcement + original anti-fraud rule 'seller cannot bid own listing' both fired correctly). Now 3 accounts: seller/blocked/third-buyer. All 009 features verified in CI."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
