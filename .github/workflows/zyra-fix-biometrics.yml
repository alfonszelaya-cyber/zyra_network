name: ZYRA RUM 5 - Feed de eventos en vivo + Cache TTL real (auto-escritor)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Escribir infrastructure/cache/__init__.py (Cache TTL real)
        run: |
          cat > apps/laboratorio/infrastructure/cache/__init__.py <<'CACHE_EOF'
          """Cache TTL en memoria: real, con expiracion y estadisticas.

          - time.monotonic (inmune a cambios de reloj del sistema)
          - expiracion perezosa en lectura + barrido en escritura
          - maxlen con eviction FIFO
          - estadisticas honestas: hits, misses, expiraciones, evictions
          - seguro para hilos (Lock)
          """
          import threading
          import time


          class CacheTTL:
              """Cache clave->valor con TTL en segundos."""

              def __init__(self, ttl_segundos: float = 60.0, maxlen: int = 1000):
                  ttl = float(ttl_segundos)
                  if ttl <= 0:
                      raise ValueError("ttl_segundos debe ser positivo.")
                  if int(maxlen) < 1:
                      raise ValueError("maxlen debe ser mayor o igual a 1.")
                  self._ttl = ttl
                  self._maxlen = int(maxlen)
                  self._datos = {}
                  self._vencimientos = {}
                  self._orden = []
                  self._lock = threading.Lock()
                  self._hits = 0
                  self._misses = 0
                  self._expiraciones = 0
                  self._evictions = 0

              @staticmethod
              def _ahora() -> float:
                  return time.monotonic()

              def _purgar_interno(self, ahora: float) -> None:
                  vencidas = [
                      clave for clave, vence in self._vencimientos.items()
                      if vence <= ahora
                  ]
                  for clave in vencidas:
                      self._datos.pop(clave, None)
                      self._vencimientos.pop(clave, None)
                      try:
                          self._orden.remove(clave)
                      except ValueError:
                          pass
                      self._expiraciones += 1
                  while len(self._orden) > self._maxlen:
                      vieja = self._orden.pop(0)
                      self._datos.pop(vieja, None)
                      self._vencimientos.pop(vieja, None)
                      self._evictions += 1

              def obtener(self, clave):
                  with self._lock:
                      ahora = self._ahora()
                      self._purgar_interno(ahora)
                      vence = self._vencimientos.get(clave)
                      if vence is None or vence <= ahora:
                          self._misses += 1
                          return None
                      self._hits += 1
                      return self._datos[clave]

              def poner(self, clave, valor) -> None:
                  with self._lock:
                      ahora = self._ahora()
                      self._purgar_interno(ahora)
                      if clave not in self._datos:
                          self._orden.append(clave)
                      self._datos[clave] = valor
                      self._vencimientos[clave] = ahora + self._ttl
                      while len(self._orden) > self._maxlen:
                          vieja = self._orden.pop(0)
                          self._datos.pop(vieja, None)
                          self._vencimientos.pop(vieja, None)
                          self._evictions += 1

              def invalidar(self, clave) -> bool:
                  with self._lock:
                      if clave in self._datos:
                          del self._datos[clave]
                          self._vencimientos.pop(clave, None)
                          try:
                              self._orden.remove(clave)
                          except ValueError:
                              pass
                          return True
                      return False

              def vaciar(self) -> None:
                  with self._lock:
                      self._datos.clear()
                      self._vencimientos.clear()
                      self._orden.clear()

              def estadisticas(self) -> dict:
                  with self._lock:
                      self._purgar_interno(self._ahora())
                      total = self._hits + self._misses
                      ratio = (
                          round(self._hits / total, 4) if total > 0 else 0.0
                      )
                      return {
                          "entradas": len(self._datos),
                          "maxlen": self._maxlen,
                          "ttl_segundos": self._ttl,
                          "hits": self._hits,
                          "misses": self._misses,
                          "hit_ratio": ratio,
                          "expiraciones": self._expiraciones,
                          "evictions": self._evictions,
                      }
          CACHE_EOF

      - name: Escribir events/system/__init__.py (eventos de ciclo de vida)
        run: |
          cat > apps/laboratorio/events/system/__init__.py <<'SYS_EOF'
          """Eventos de sistema: ciclo de vida real de LABORATORIO."""
          from dataclasses import dataclass, field
          from datetime import datetime, timezone

          EVENTO_ARRANCADO = "laboratorio.sistema.arrancado"
          EVENTO_HEALTH = "laboratorio.sistema.health"


          @dataclass(frozen=True)
          class EventoSistema:
              """Evento de sistema con momento real y detalle serializable."""

              nombre: str
              detalle: dict = field(default_factory=dict)
              momento: str = ""

              @classmethod
              def crear(cls, nombre: str, detalle: dict = None) -> "EventoSistema":
                  if not nombre or not str(nombre).strip():
                      raise ValueError("El evento de sistema requiere nombre.")
                  return cls(
                      nombre=str(nombre).strip(),
                      detalle=dict(detalle or {}),
                      momento=datetime.now(timezone.utc).isoformat(),
                  )


          def evento_arrancado(app_id: str, rutas: int, motores: int) -> EventoSistema:
              """Evento de arranque con datos reales del montaje."""
              if not app_id or not str(app_id).strip():
                  raise ValueError("app_id requerido para el evento de arranque.")
              return EventoSistema.crear(EVENTO_ARRANCADO, {
                  "app": str(app_id),
                  "rutas": int(rutas),
                  "motores": int(motores),
              })


          def evento_health(estado: dict) -> EventoSistema:
              """Evento con el snapshot de salud real de la app."""
              if not isinstance(estado, dict):
                  raise ValueError("El evento health requiere el estado real (dict).")
              return EventoSistema.crear(EVENTO_HEALTH, {
                  "ok": bool(estado.get("ok")),
                  "motores_total": int(estado.get("motores_total", 0)),
                  "motores_disponibles": int(estado.get("motores_disponibles", 0)),
              })
          SYS_EOF

      - name: Escribir events/notifications/__init__.py (notificador real)
        run: |
          cat > apps/laboratorio/events/notifications/__init__.py <<'NOTIF_EOF'
          """Notificaciones: canal real de eventos hacia el operador.

          Registro en memoria (circular) + via logging. Sin fingir envios:
          cada notificacion declara el canal por el que realmente salio.
          """
          import logging
          import threading
          from collections import deque

          from apps.laboratorio.events.system import EventoSistema

          CANAL_LOG = "log"
          CANAL_MEMORIA = "memoria"
          MAX_NOTIFICACIONES = 500


          class Notificador:
              """Registra notificaciones reales en memoria y en el log."""

              def __init__(self, maxlen: int = MAX_NOTIFICACIONES):
                  if int(maxlen) < 1:
                      raise ValueError("maxlen debe ser mayor o igual a 1.")
                  self._historial = deque(maxlen=int(maxlen))
                  self._lock = threading.Lock()
                  self._logger = logging.getLogger("laboratorio.notificaciones")
                  self._contador = 0

              def notificar(self, evento: EventoSistema, mensaje: str = "") -> dict:
                  if not isinstance(evento, EventoSistema):
                      raise ValueError("notificar requiere un EventoSistema.")
                  texto = str(mensaje or "").strip() or evento.nombre
                  with self._lock:
                      self._contador += 1
                      registro = {
                          "id": "notif-" + str(self._contador).zfill(6),
                          "evento": evento.nombre,
                          "mensaje": texto[:300],
                          "momento": evento.momento,
                          "canal": CANAL_MEMORIA,
                          "detalle": dict(evento.detalle),
                      }
                      self._historial.append(registro)
                  self._logger.info(
                      "[laboratorio] " + evento.nombre + ": " + texto
                  )
                  return dict(registro)

              def historial(self, desde: int = 0, limite: int = 50) -> dict:
                  if int(desde) < 0:
                      raise ValueError("desde no puede ser negativo.")
                  if int(limite) < 1 or int(limite) > 500:
                      raise ValueError("limite debe estar entre 1 y 500.")
                  with self._lock:
                      todos = list(self._historial)
                  seleccion = [
                      n for n in todos
                      if int(n["id"].split("-")[1]) > int(desde)
                  ]
                  return {
                      "total": len(todos),
                      "devueltas": len(seleccion[: int(limite)]),
                      "notificaciones": seleccion[: int(limite)],
                      "canales": (CANAL_MEMORIA, CANAL_LOG),
                  }
          NOTIF_EOF

      - name: Escribir routers/internal/__init__.py (rutas internas de feed y cache)
        run: |
          cat > apps/laboratorio/routers/internal/__init__.py <<'INT_EOF'
          """Rutas internas de LABORATORIO: feed de eventos y cache.

          El feed permite a navegadores y moviles obtener eventos en vivo
          por cursor (polling eficiente, sin instalar nada).
          """
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.schemas.responses.envelopes import exito

          RUTA_EVENTOS = "/laboratorio/api/v1/events"
          RUTA_CACHE_STATS = "/laboratorio/api/v1/cache/stats"


          def registrar_rutas_internas(app) -> None:
              colector = app.contenedor.obtener("colector_eventos")
              cache = app.contenedor.obtener("cache_global")

              def _eventos(ctx):
                  desde = ctx.query.get("desde", "0")
                  limite = ctx.query.get("limite", "50")
                  try:
                      desde_num = int(desde)
                  except ValueError:
                      desde_num = 0
                  try:
                      limite_num = int(limite)
                  except ValueError:
                      limite_num = 50
                  return exito(colector.historial(desde_num, limite_num))

              def _cache(ctx):
                  return exito(cache.estadisticas())

              app.registrar(
                  "GET", RUTA_EVENTOS, _eventos,
                  PermisoCodigo.VER,
                  "Feed de eventos en vivo con cursor (polling)",
              )
              app.registrar(
                  "GET", RUTA_CACHE_STATS, _cache,
                  PermisoCodigo.VER,
                  "Estadisticas reales de la cache TTL",
              )
          INT_EOF

