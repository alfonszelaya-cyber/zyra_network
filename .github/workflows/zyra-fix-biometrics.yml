name: "ETAPA 3 ID-b v2: 4 engines del Bloque ID via cat heredoc directo (patron que nunca falla) + tests + regresion"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "Engine 1: ZidRecoveryEngine (ID-13)"
        if: always()
        run: |
          cat > shared_engines/identity/recovery_engine.py << 'EOF'
          """ZID Recovery Engine (ID-13) - codigos de
          recuperacion para un ZID: N codigos de UNA vez
          (se muestran SOLO al emitir, se guardan
          hasheados - regla 63), con expiracion.
          Reglas 63/66/76."""
          from __future__ import annotations
          import hashlib, uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_recovery", (
                  "CREATE TABLE IF NOT EXISTS zid_recovery ("
                  " code_id TEXT PRIMARY KEY, zid TEXT NOT NULL,"
                  " code_hash TEXT NOT NULL, expires_at REAL NOT"
                  " NULL, used INTEGER NOT NULL DEFAULT 0,"
                  " created_at REAL NOT NULL)",
                  "CREATE INDEX ix_rec_zid ON zid_recovery"
                  " (zid)",
              )),
          )


          def _sha(t):
              return hashlib.sha256(
                  t.encode("utf-8")).hexdigest()


          class ZidRecoveryEngine:
              """Codigos de recuperacion de un ZID."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.recovery",
                                  _MIGRATIONS).run(clock)

              def issue_codes(self, *, zid, count=3,
                              ttl_seconds=2592000.0):
                  if not str(zid).strip():
                      raise ValueError("zid requerido")
                  if int(count) < 1 or int(count) > 10:
                      raise ValueError("count 1..10")
                  now = self._clock.now()
                  exp = now + float(ttl_seconds)
                  clear = []
                  for _ in range(int(count)):
                      code = ("ZREC-"
                              + uuid.uuid4().hex[:12])
                      self._db.execute(
                          "INSERT INTO zid_recovery (code_id,"
                          " zid, code_hash, expires_at, used,"
                          " created_at) VALUES (?, ?, ?, ?, 0, ?)",
                          ("ZRC-" + uuid.uuid4().hex[:10],
                           str(zid), _sha(code), exp, now))
                      clear.append(code)
                  return {"codes": clear,
                          "note": "guarde estos codigos:"
                                  " no se vuelven a mostrar"
                                  " (regla 63)"}

              def recover(self, *, zid, code):
                  now = self._clock.now()
                  row = self._db.query_one(
                      "SELECT code_id, expires_at, used FROM"
                      " zid_recovery WHERE zid = ? AND"
                      " code_hash = ?",
                      (str(zid), _sha(str(code))))
                  if row is None:
                      return {"ok": False,
                              "reason": "codigo invalido"}
                  if int(row["used"]) == 1:
                      return {"ok": False,
                              "reason": "codigo ya usado"}
                  if float(row["expires_at"]) <= now:
                      return {"ok": False,
                              "reason": "codigo expirado"}
                  self._db.execute(
                      "UPDATE zid_recovery SET used = 1 WHERE"
                      " code_id = ?", (str(row["code_id"]),))
                  return {"ok": True, "zid": str(zid)}

              def valid_remaining(self, zid):
                  row = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM zid_recovery"
                      " WHERE zid = ? AND used = 0 AND"
                      " expires_at > ?",
                      (str(zid), self._clock.now()))
                  return int(row["n"])
          EOF
          python3 -m py_compile shared_engines/identity/recovery_engine.py && echo "recovery_engine: OK"

      - name: "Engine 2: TrustRegistryEngine (ID-6)"
        if: always()
        run: |
          cat > shared_engines/identity/trust_registry_engine.py << 'EOF'
          """Trust Registry Engine (ID-6) - registro de
          emisores/autoridades CONFIADAS de la Red: quien
          puede firmar credenciales. Reglas 63/66/76."""
          from __future__ import annotations
          import json, uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_trust_issuers", (
                  "CREATE TABLE IF NOT EXISTS"
                  " zid_trust_issuers ("
                  " issuer_id TEXT PRIMARY KEY,"
                  " name TEXT NOT NULL,"
                  " kind TEXT NOT NULL,"
                  " scopes_json TEXT NOT NULL DEFAULT '[]',"
                  " status TEXT NOT NULL DEFAULT 'trusted',"
                  " revoked_reason TEXT NOT NULL DEFAULT '',"
                  " created_at REAL NOT NULL)",
              )),
          )
          _KINDS = ("GOBIERNO", "HOSPITAL", "REGISTRO",
                    "BANCO", "EDUCACION", "EXTERNO")


          class TrustRegistryEngine:
              """Registro de emisores confiables (ID-6)."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.trustreg",
                                  _MIGRATIONS).run(clock)

              def register(self, *, issuer_id, name, kind,
                           scopes=None):
                  if not str(issuer_id).strip() or \
                          not str(name).strip():
                      raise ValueError(
                          "issuer_id y name requeridos")
                  k = str(kind).upper()
                  if k not in _KINDS:
                      raise ValueError("kind debe ser "
                                       + "/".join(_KINDS))
                  dup = self._db.query_one(
                      "SELECT issuer_id FROM"
                      " zid_trust_issuers WHERE issuer_id = ?",
                      (str(issuer_id),))
                  if dup is not None:
                      raise ValueError(
                          "emisor ya registrado (regla 66)")
                  self._db.execute(
                      "INSERT INTO zid_trust_issuers (issuer_id,"
                      " name, kind, scopes_json, status,"
                      " created_at) VALUES (?, ?, ?, ?,"
                      " 'trusted', ?)",
                      (str(issuer_id), str(name), k,
                       json.dumps(list(scopes or [])),
                       self._clock.now()))
                  return {"issuer_id": str(issuer_id),
                          "status": "trusted"}

              def is_trusted(self, issuer_id, scope=None):
                  row = self._db.query_one(
                      "SELECT status, scopes_json FROM"
                      " zid_trust_issuers WHERE issuer_id = ?",
                      (str(issuer_id),))
                  if row is None:
                      return False
                  if str(row["status"]) != "trusted":
                      return False
                  if scope:
                      scopes = json.loads(str(
                          row["scopes_json"] or "[]"))
                      if scopes and str(scope) not in scopes:
                          return False
                  return True

              def revoke(self, issuer_id, *, reason):
                  row = self._db.query_one(
                      "SELECT status FROM zid_trust_issuers"
                      " WHERE issuer_id = ?",
                      (str(issuer_id),))
                  if row is None:
                      raise KeyError(issuer_id)
                  if str(row["status"]) != "trusted":
                      raise ValueError("ya revocado")
                  if not str(reason).strip():
                      raise ValueError("motivo obligatorio")
                  self._db.execute(
                      "UPDATE zid_trust_issuers SET status ="
                      " 'revoked', revoked_reason = ? WHERE"
                      " issuer_id = ?",
                      (str(reason), str(issuer_id)))
                  return {"issuer_id": str(issuer_id),
                          "status": "revoked"}

              def trusted_of(self, kind=None):
                  if kind:
                      rows = self._db.query_all(
                          "SELECT issuer_id, name, kind FROM"
                          " zid_trust_issuers WHERE status ="
                          " 'trusted' AND kind = ? ORDER BY"
                          " rowid", (str(kind).upper(),))
                  else:
                      rows = self._db.query_all(
                          "SELECT issuer_id, name, kind FROM"
                          " zid_trust_issuers WHERE status ="
                          " 'trusted' ORDER BY rowid")
                  return [{"issuer_id": str(r["issuer_id"]),
                           "name": str(r["name"]),
                           "kind": str(r["kind"])}
                          for r in rows]
          EOF
          python3 -m py_compile shared_engines/identity/trust_registry_engine.py && echo "trust_registry_engine: OK"

      - name: "Engine 3: ZidVaultEngine (ID-4)"
        if: always()
        run: |
          cat > shared_engines/identity/vault_engine.py << 'EOF'
          """ZID Vault Engine (ID-4) - bodega de secretos por
          ZID: sellado con cifrado de flujo stdlib (sha256
          keystream) + HMAC de integridad. JAMAS en claro
          (regla 63). Reglas 63/66/76."""
          from __future__ import annotations
          import hashlib, hmac, os, uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_vault", (
                  "CREATE TABLE IF NOT EXISTS zid_vault ("
                  " zid TEXT NOT NULL, skey TEXT NOT NULL,"
                  " sealed TEXT NOT NULL, nonce TEXT NOT NULL,"
                  " mac TEXT NOT NULL, created_at REAL NOT"
                  " NULL, PRIMARY KEY (zid, skey))",
              )),
          )


          def _keystream(master_key, nonce, length):
              out = b""
              counter = 0
              while len(out) < length:
                  out += hashlib.sha256(
                      (str(master_key) + "|" + str(nonce)
                       + "|" + str(counter)).encode()).digest()
                  counter += 1
              return out[:length]


          def _seal(master_key, nonce, plaintext):
              pt = plaintext.encode("utf-8")
              ks = _keystream(master_key, nonce, len(pt))
              return bytes(a ^ b for a, b in
                           zip(pt, ks)).hex()


          def _open_sealed(master_key, nonce, sealed_hex):
              ct = bytes.fromhex(sealed_hex)
              ks = _keystream(master_key, nonce, len(ct))
              return bytes(a ^ b for a, b in
                           zip(ct, ks)).decode("utf-8")


          def _mac(master_key, zid, skey, sealed):
              return hmac.new(
                  str(master_key).encode(),
                  (str(zid) + "|" + str(skey) + "|"
                   + str(sealed)).encode(),
                  hashlib.sha256).hexdigest()


          class ZidVaultEngine:
              """Bodega de secretos por ZID (ID-4)."""

              def __init__(self, db: Database, clock: Clock,
                           master_key=None):
                  self._db = db
                  self._clock = clock
                  self._master = (str(master_key)
                                  if master_key
                                  else os.environ.get(
                                      "ZYRA_ROOT_KEY", "")
                                  or "zyra-default-dev-key")
                  MigrationRunner(db, "zid.vault",
                                  _MIGRATIONS).run(clock)

              def store_secret(self, *, zid, skey, plaintext):
                  if not str(zid).strip() or \
                          not str(skey).strip():
                      raise ValueError(
                          "zid y skey requeridos")
                  if not str(plaintext).strip():
                      raise ValueError(
                          "plaintext requerido (regla 66)")
                  nonce = os.urandom(16).hex()
                  sealed = _seal(self._master, nonce,
                                 str(plaintext))
                  mac = _mac(self._master, str(zid),
                             str(skey), sealed)
                  self._db.execute(
                      "INSERT OR REPLACE INTO zid_vault (zid,"
                      " skey, sealed, nonce, mac, created_at)"
                      " VALUES (?, ?, ?, ?, ?, ?)",
                      (str(zid), str(skey), sealed, nonce,
                       mac, self._clock.now()))
                  return {"zid": str(zid), "skey": str(skey)}

              def read_secret(self, *, zid, skey):
                  row = self._db.query_one(
                      "SELECT sealed, nonce, mac FROM zid_vault"
                      " WHERE zid = ? AND skey = ?",
                      (str(zid), str(skey)))
                  if row is None:
                      return {"found": False}
                  mac = _mac(self._master, str(zid),
                             str(skey), str(row["sealed"]))
                  if mac != str(row["mac"]):
                      return {"found": True,
                              "tampered": True}
                  pt = _open_sealed(self._master,
                                    str(row["nonce"]),
                                    str(row["sealed"]))
                  return {"found": True, "plaintext": pt,
                          "tampered": False}

              def delete_secret(self, *, zid, skey):
                  row = self._db.query_one(
                      "SELECT skey FROM zid_vault WHERE zid ="
                      " ? AND skey = ?",
                      (str(zid), str(skey)))
                  if row is None:
                      raise KeyError(skey)
                  self._db.execute(
                      "DELETE FROM zid_vault WHERE zid = ? AND"
                      " skey = ?", (str(zid), str(skey)))
                  return {"deleted": str(skey)}

              def keys_of(self, zid):
                  rows = self._db.query_all(
                      "SELECT skey FROM zid_vault WHERE zid ="
                      " ? ORDER BY rowid", (str(zid),))
                  return [str(r["skey"]) for r in rows]
          EOF
          python3 -m py_compile shared_engines/identity/vault_engine.py && echo "vault_engine: OK"

      - name: "Engine 4: TrustGraphEngine (ID-14)"
        if: always()
        run: |
          cat > shared_engines/identity/trust_graph_engine.py << 'EOF'
          """Trust Graph Engine (ID-14) - grafo de confianza
          entre entidades: vinculos dirigidos con peso 0..100,
          vecinos, trust_path (BFS), trust_score. Reglas 66/76."""
          from __future__ import annotations
          import uuid
          from shared_engines.common.clocks import Clock
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration, MigrationRunner)

          _MIGRATIONS = (
              Migration(1, "zid_tg", (
                  "CREATE TABLE IF NOT EXISTS zid_tg_entities ("
                  " ent_id TEXT PRIMARY KEY, zid TEXT NOT NULL"
                  " DEFAULT '', name TEXT NOT NULL, kind TEXT NOT"
                  " NULL DEFAULT 'person', created_at REAL NOT"
                  " NULL)",
                  "CREATE TABLE IF NOT EXISTS zid_tg_edges ("
                  " edge_id TEXT PRIMARY KEY, src TEXT NOT NULL,"
                  " dst TEXT NOT NULL, relation TEXT NOT NULL"
                  " DEFAULT '', weight INTEGER NOT NULL DEFAULT"
                  " 50, created_at REAL NOT NULL)",
              )),
          )
          _KINDS = ("person", "organization", "device",
                    "institution")


          class TrustGraphEngine:
              """Grafo de confianza (ID-14)."""

              def __init__(self, db: Database, clock: Clock):
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "zid.tgraph",
                                  _MIGRATIONS).run(clock)

              def add_entity(self, *, name, kind="person",
                             zid=""):
                  if not str(name).strip():
                      raise ValueError("name requerido")
                  k = str(kind).lower()
                  if k not in _KINDS:
                      raise ValueError("kind debe ser "
                                       + "/".join(_KINDS))
                  eid = "ZTE-" + uuid.uuid4().hex[:10]
                  self._db.execute(
                      "INSERT INTO zid_tg_entities (ent_id,"
                      " zid, name, kind, created_at)"
                      " VALUES (?, ?, ?, ?, ?)",
                      (eid, str(zid), str(name), k,
                       self._clock.now()))
                  return {"ent_id": eid}

              def link(self, *, src, dst, relation="",
                       weight=50):
                  for eid in (src, dst):
                      row = self._db.query_one(
                          "SELECT ent_id FROM zid_tg_entities"
                          " WHERE ent_id = ?", (str(eid),))
                      if row is None:
                          raise LookupError(
                              "entidad no encontrada: "
                              + str(eid))
                  if str(src) == str(dst):
                      raise ValueError(
                          "auto-vinculo invalido")
                  w = int(weight)
                  if w < 0 or w > 100:
                      raise ValueError("weight 0..100")
                  eid = "ZTEG-" + uuid.uuid4().hex[:10]
                  self._db.execute(
                      "INSERT INTO zid_tg_edges (edge_id, src,"
                      " dst, relation, weight, created_at)"
                      " VALUES (?, ?, ?, ?, ?, ?)",
                      (eid, str(src), str(dst), str(relation),
                       w, self._clock.now()))
                  return {"edge_id": eid, "weight": w}

              def neighbors(self, ent_id):
                  rows = self._db.query_all(
                      "SELECT dst, relation, weight FROM"
                      " zid_tg_edges WHERE src = ? ORDER BY"
                      " rowid", (str(ent_id),))
                  return [{"ent_id": str(r["dst"]),
                           "relation": str(r["relation"]),
                           "weight": int(r["weight"])}
                          for r in rows]

              def trust_path(self, src, dst, max_depth=4):
                  if str(src) == str(dst):
                      return {"path": [str(src)],
                              "found": True}
                  visited = {str(src)}
                  queue = [[str(src)]]
                  while queue:
                      path = queue.pop(0)
                      if len(path) > max_depth + 1:
                          break
                      last = path[-1]
                      for e in self.neighbors(last):
                          nxt = e["ent_id"]
                          if nxt == str(dst):
                              path.append(nxt)
                              return {"path": path,
                                      "found": True}
                          if nxt not in visited:
                              visited.add(nxt)
                              queue.append(path + [nxt])
                  return {"path": [], "found": False}

              def trust_score(self, ent_id):
                  inn = self._db.query_all(
                      "SELECT weight FROM zid_tg_edges WHERE"
                      " dst = ?", (str(ent_id),))
                  if not inn:
                      return {"ent_id": str(ent_id),
                              "score": None,
                              "note": "sin vinculos"
                                      " entrantes"}
                  w = [int(r["weight"]) for r in inn]
                  return {"ent_id": str(ent_id),
                          "score": sum(w) // len(w),
                          "links": len(w)}
          EOF
          python3 -m py_compile shared_engines/identity/trust_graph_engine.py && echo "trust_graph_engine: OK"

      - name: "Tests de los 4 engines"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p shared_engines/identity/tests
          touch shared_engines/identity/tests/__init__.py
          cat > shared_engines/identity/tests/test_id_block.py << 'EOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.identity.recovery_engine import ZidRecoveryEngine
          from shared_engines.identity.trust_registry_engine import TrustRegistryEngine
          from shared_engines.identity.vault_engine import ZidVaultEngine
          from shared_engines.identity.trust_graph_engine import TrustGraphEngine


          def test_id13_recovery(tmp_path):
              db = SQLiteAdapter(tmp_path / "r.db")
              eng = ZidRecoveryEngine(db, FrozenClock())
              with pytest.raises(ValueError):
                  eng.issue_codes(zid=" ", count=1)
              with pytest.raises(ValueError):
                  eng.issue_codes(zid="ZID-1", count=11)
              r = eng.issue_codes(zid="ZID-1", count=3)
              assert len(r["codes"]) == 3
              assert eng.valid_remaining("ZID-1") == 3
              ok = eng.recover(zid="ZID-1", code=r["codes"][0])
              assert ok["ok"] is True
              bad = eng.recover(zid="ZID-1", code=r["codes"][0])
              assert bad["ok"] is False
              assert eng.valid_remaining("ZID-1") == 2
              print("OK ID-13: codigos un solo uso hasheados (regla 63)")


          def test_id6_trust_registry(tmp_path):
              db = SQLiteAdapter(tmp_path / "t.db")
              eng = TrustRegistryEngine(db, FrozenClock())
              with pytest.raises(ValueError):
                  eng.register(issuer_id=" ", name="X",
                               kind="GOBIERNO")
              with pytest.raises(ValueError):
                  eng.register(issuer_id="I", name="X",
                               kind="ALIEN")
              eng.register(issuer_id="ISS-1", name="MINED",
                           kind="EDUCACION")
              with pytest.raises(ValueError):
                  eng.register(issuer_id="ISS-1", name="dup",
                               kind="BANCO")
              assert eng.is_trusted("ISS-1") is True
              eng.revoke("ISS-1", reason="caso")
              assert eng.is_trusted("ISS-1") is False
              with pytest.raises(ValueError):
                  eng.revoke("ISS-1", reason="x")
              print("OK ID-6: emisores, dup rechazada, revocacion")


          def test_id4_vault(tmp_path):
              db = SQLiteAdapter(tmp_path / "v.db")
              eng = ZidVaultEngine(db, FrozenClock(),
                  master_key="clave-maestra")
              with pytest.raises(ValueError):
                  eng.store_secret(zid=" ", skey="k",
                                   plaintext="v")
              with pytest.raises(ValueError):
                  eng.store_secret(zid="ZID-1", skey="k",
                                   plaintext=" ")
              eng.store_secret(zid="ZID-1", skey="pin",
                  plaintext="secreto-123")
              r = eng.read_secret(zid="ZID-1", skey="pin")
              assert r["plaintext"] == "secreto-123"
              row = db.query_one(
                  "SELECT sealed FROM zid_vault WHERE"
                  " skey = 'pin'")
              assert "secreto-123" not in str(row["sealed"])
              eng.store_secret(zid="ZID-1", skey="pin",
                  plaintext="nuevo")
              r2 = eng.read_secret(zid="ZID-1", skey="pin")
              assert r2["plaintext"] == "nuevo"
              eng.delete_secret(zid="ZID-1", skey="pin")
              assert eng.read_secret(zid="ZID-1",
                  skey="pin")["found"] is False
              with pytest.raises(KeyError):
                  eng.delete_secret(zid="ZID-1",
                                    skey="noexiste")
              print("OK ID-4: sellado sin claro (regla 63) + update + delete")


          def test_id14_trust_graph(tmp_path):
              db = SQLiteAdapter(tmp_path / "g.db")
              eng = TrustGraphEngine(db, FrozenClock())
              e1 = eng.add_entity(name="Sujeto A",
                  zid="ZID-A")
              with pytest.raises(ValueError):
                  eng.add_entity(name=" ", kind="person")
              e2 = eng.add_entity(name="Org B",
                  kind="organization")
              e3 = eng.add_entity(name="Ent C")
              with pytest.raises(ValueError):
                  eng.add_entity(name="X", kind="alien")
              with pytest.raises(LookupError):
                  eng.link(src=e1["ent_id"], dst="NO")
              eng.link(src=e1["ent_id"], dst=e2["ent_id"],
                  relation="opera", weight=80)
              with pytest.raises(ValueError):
                  eng.link(src=e1["ent_id"],
                      dst=e1["ent_id"])
              with pytest.raises(ValueError):
                  eng.link(src=e1["ent_id"],
                      dst=e2["ent_id"], weight=150)
              assert len(eng.neighbors(e1["ent_id"])) == 1
              p = eng.trust_path(src=e1["ent_id"],
                  dst=e2["ent_id"])
              assert p["found"] is True
              s = eng.trust_score(e2["ent_id"])
              assert s["score"] == 80
              assert eng.trust_score(e3["ent_id"])[
                  "score"] is None
              print("OK ID-14: entidades + vinculos con peso + BFS + score")
          EOF
          python3 -c "import ast; ast.parse(open('shared_engines/identity/tests/test_id_block.py', encoding='utf-8').read()); print('AST OK')"
          timeout 240 python3 -m pytest shared_engines/identity/tests/test_id_block.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/idb.out 2>&1
          echo $? > /tmp/idb
          passed=$(grep -oE "[0-9]+ passed" /tmp/idb.out 2>/dev/null | tail -1)
          if [ "$(cat /tmp/idb)" = "0" ]; then
            echo "- ID-b: OK ($passed passed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ID-b: FALLO" >> "$GITHUB_STEP_SUMMARY"
            { echo '```'; tail -60 /tmp/idb.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: "Regresion identity + 5 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 240 python3 -m pytest shared_engines/identity/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x6.out 2>&1
          echo $? > /tmp/x6
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=line > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          timeout 300 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x5.out 2>&1
          echo $? > /tmp/x5
          for par in "x6 Red" "x1 nexo" "x2 axis" "x3 agro" "x4 semilla" "x5 subastas"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            passed=$(grep -oE "[0-9]+ passed" /tmp/$1.out 2>/dev/null | tail -1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: OK ($passed)" >> "$SUM"
            else
              echo "- REG $2: FALLO ($passed)" >> "$SUM"
              { echo "### $2"; echo '```'; tail -30 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "Commit si todo verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          ok=1
          for f in idb x6 x1 x2 x3 x4 x5; do
            [ "$(cat /tmp/$f 2>/dev/null || echo 1)" = "0" ] || ok=0
          done
          if [ "$ok" != "1" ]; then
            echo "BLOQUEADA — ver arriba" >> "$SUM"
            for f in recovery_engine.py trust_registry_engine.py vault_engine.py trust_graph_engine.py; do
              rm -f shared_engines/identity/$f 2>/dev/null
            done
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          if git diff --cached --quiet; then
            echo "SIN CAMBIOS" >> "$SUM"
            exit 0
          fi
          git commit -m "feat(ETAPA 3 ID-b): 4 engines del Bloque ID via cat heredoc directo (patron sin fallos) — RecoveryEngine (ID-13: codigos un solo uso hasheados regla 63) · TrustRegistryEngine (ID-6: emisores confiables, dup rechazada) · ZidVaultEngine (ID-4: secretos sellados keystream+HMAC, jamas claro regla 63) · TrustGraphEngine (ID-14: entidades, vinculos peso 0..100, BFS path, score) — patron clase+MigrationRunner; reglas 63/66/76"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/push.log 2>&1 || git push origin "HEAD:main" > /tmp/push2.log 2>&1
          echo "ID-b OK (4 de 15 del Bloque ID). ID-c siguiente: Consent Ledger (ID-3) + Presentation (ID-7) + Governance (ID-5) + Assurance (ID-1)." >> "$SUM"
          exit 0
