name: "ZYRA EX Run 2 - Presentacion holografica interactiva + fix cableado robusto"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Fix cableado gemelo_vivo (busqueda por contenido, sin indentacion fija)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/registry/services/service_registry.py")
          t = ruta.read_text(encoding="utf-8")
          lineas = t.splitlines(keepends=True)
          cambios = []

          tiene_import = any("GemeloVivo" in l and "simulation_engine" in l for l in lineas)
          if not tiene_import:
              for i, l in enumerate(lineas):
                  if "simulation_engine import" in l and l.strip().startswith("from"):
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(i + 1, indent + "from apps.laboratorio.infrastructure.providers.simulation_engine import GemeloVivo\n")
                      cambios.append("import GemeloVivo")
                      break

          if '"gemelo_vivo"' not in t:
              insertado = False
              for i, l in enumerate(lineas):
                  if 'c.registrar("motor_monte_carlo"' in l:
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(i + 1, indent + 'c.registrar("gemelo_vivo", lambda _c: GemeloVivo())\n')
                      insertado = True
                      cambios.append("servicio gemelo_vivo")
                      break
              if not insertado:
                  for i, l in enumerate(lineas):
                      if 'c.registrar("bus"' in l:
                          indent = l[: len(l) - len(l.lstrip())]
                          lineas.insert(i + 1, indent + 'c.registrar("gemelo_vivo", lambda _c: GemeloVivo())\n')
                          insertado = True
                          cambios.append("servicio gemelo_vivo (ancla bus)")
                          break
              if not insertado:
                  raise SystemExit("FATAL: no se encontro ancla para gemelo_vivo")

          t = "".join(lineas)
          if '"gemelo_vivo"' not in t:
              raise SystemExit("FATAL: gemelo_vivo no quedo en el archivo")
          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("service_registry: " + ("; ".join(cambios) if cambios else "ya al dia") + " - verificado")
          PYEOF

      - name: Escribir presentation_remote.py (presentacion holografica interactiva)
        run: |
          cat > apps/laboratorio/infrastructure/providers/presentation_remote.py <<'PR_EOF'
          """PRESENTACION HOLOGRAFICA INTERACTIVA (LG-EX4 + LG-EX6).

          Tu caso de uso completo:
            - presentas desde telefono, PC o HDMI
            - la salida universal (MotorHolo3D) proyecta en cualquier superficie
            - tu avatar explica cada paso
            - controlas desde el telefono: pasar/retroceder/ir a paso
            - tocas el PUNTO que quieres explicar (x, y) y queda anotado en vivo

          Sin fingir: la superficie proyectada no es tactil fisicamente;
          el tactil real es tu telefono (vista de control incluida) y cada
          toque queda registrado con coordenadas reales sobre el paso.

          Determinista y auditable: cada accion queda en el historial de
          la sesion con momento real.
          """
          import time

          from apps.laboratorio.infrastructure.providers.hologram_engine import MotorHolograma
          from apps.laboratorio.shared.models.identifiers import nuevo_id

          ACCIONES_VALIDAS = ("avanzar", "retroceder", "ir_a", "tocar_punto", "iniciar", "finalizar")


          class SesionPresentacion:
              """Sesion viva de una presentacion proyectada."""

              def __init__(self, id_sesion, presentacion, proyector):
                  self.id = str(id_sesion)
                  self._presentacion = presentacion
                  self._proyector = proyector
                  self._holograma = MotorHolograma()
                  self.paso_actual = 0
                  self.activa = True
                  self.anotaciones = []
                  self.historial = []
                  self.iniciada_en = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

              def _pasos(self) -> list:
                  return list(getattr(self._presentacion, "pasos", []) or [])

              def total_pasos(self) -> int:
                  return len(self._pasos())

              def _registrar(self, accion, detalle) -> dict:
                  entrada = {
                      "accion": str(accion),
                      "detalle": dict(detalle or {}),
                      "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  }
                  self.historial.append(entrada)
                  return entrada

              def _paso_datos(self) -> dict:
                  pasos = self._pasos()
                  if not pasos:
                      return {"indice": 0, "total": 0, "titulo": "", "contenido": "", "duracion_segundos": 0}
                  paso = pasos[min(self.paso_actual, len(pasos) - 1)]
                  try:
                      datos = paso.a_dict() if hasattr(paso, "a_dict") else dict(paso)
                  except Exception:
                      datos = {"titulo": str(getattr(paso, "titulo", ""))}
                  datos["indice"] = self.paso_actual
                  datos["total"] = len(pasos)
                  return datos

              def avanzar(self) -> dict:
                  total = self.total_pasos()
                  if self.paso_actual < total - 1:
                      self.paso_actual += 1
                  entrada = self._registrar("avanzar", {"paso": self.paso_actual})
                  return {"paso": self.paso_actual, "total": total, "historial": entrada}

              def retroceder(self) -> dict:
                  if self.paso_actual > 0:
                      self.paso_actual -= 1
                  entrada = self._registrar("retroceder", {"paso": self.paso_actual})
                  return {"paso": self.paso_actual, "total": self.total_pasos(), "historial": entrada}

              def ir_a(self, indice) -> dict:
                  indice = int(indice)
                  total = self.total_pasos()
                  if not 0 <= indice < total:
                      raise ValueError("indice fuera de rango 0.." + str(total - 1))
                  self.paso_actual = indice
                  self._registrar("ir_a", {"paso": indice})
                  return {"paso": self.paso_actual, "total": total}

              def tocar_punto(self, x, y, etiqueta="") -> dict:
                  xv = float(x)
                  yv = float(y)
                  if xv < 0 or yv < 0:
                      raise ValueError("coordenadas del punto no pueden ser negativas.")
                  anotacion = {
                      "id": "anot-" + str(len(self.anotaciones) + 1).zfill(4),
                      "paso": self.paso_actual,
                      "x": round(xv, 2),
                      "y": round(yv, 2),
                      "etiqueta": str(etiqueta or "")[:200],
                      "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  }
                  self.anotaciones.append(anotacion)
                  self._registrar("tocar_punto", {"paso": self.paso_actual, "x": anotacion["x"], "y": anotacion["y"]})
                  return dict(anotacion)

              def anotaciones_del_paso(self, indice=None) -> list:
                  indice = self.paso_actual if indice is None else int(indice)
                  return [dict(a) for a in self.anotaciones if a["paso"] == indice]

              def frame_holograma(self) -> bytes:
                  """SVG holografico del paso actual con sus anotaciones."""
                  paso = self._paso_datos()
                  titulo = str(paso.get("titulo", "") or "Paso " + str(paso["indice"] + 1))
                  svg = self._holograma.generar(_EscenaProxy(titulo))
                  texto = str(paso.get("contenido", "") or paso.get("descripcion", "") or "")
                  if texto and "</svg>" in svg:
                      lineas = []
                      for i in range(0, min(len(texto), 240), 60):
                          lineas.append(texto[i:i + 60])
                      marcas = []
                      y = 60
                      for linea in lineas:
                          marcas.append(
                              '<text x="24" y="' + str(y) + '" fill="#E2E8F0" '
                              'font-size="16" font-family="sans-serif">'
                              + _escapar(linea) + "</text>"
                          )
                          y += 24
                      for a in self.anotaciones_del_paso():
                          marcas.append(
                              '<circle cx="' + str(a["x"]) + '" cy="' + str(a["y"])
                              + '" r="10" fill="none" stroke="#F59E0B" stroke-width="3">'
                              '<animate attributeName="r" values="6;14;6" dur="1.6s" repeatCount="indefinite"/>'
                              "</circle>"
                          )
                      svg = svg.replace("</svg>", "".join(marcas) + "</svg>", 1)
                  return svg.encode("utf-8")

              def estado(self) -> dict:
                  return {
                      "sesion": self.id,
                      "activa": self.activa,
                      "paso_actual": self.paso_actual,
                      "total_pasos": self.total_pasos(),
                      "anotaciones_total": len(self.anotaciones),
                      "anotaciones_paso": self.anotaciones_del_paso(),
                      "iniciada_en": self.iniciada_en,
                      "paso": self._paso_datos(),
                  }

              def finalizar(self) -> dict:
                  self.activa = False
                  self._registrar("finalizar", {"anotaciones": len(self.anotaciones)})
                  return {
                      "sesion": self.id,
                      "duracion_pasos": self.total_pasos(),
                      "anotaciones": len(self.anotaciones),
                      "historial": list(self.historial),
                  }


          class _EscenaProxy:
              """Proxy minimo que MotorHolograma espera (nombre + dimensiones)."""

              def __init__(self, nombre):
                  self.nombre = nombre
                  self.ancho = 900
                  self.alto = 700


          def _escapar(texto: str) -> str:
              return (
                  str(texto)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )


          class PresentacionRemota:
              """Gestor de sesiones interactivas sobre presentaciones reales."""

              def __init__(self, repo_presentaciones, proyector):
                  self._repo = repo_presentaciones
                  self._proyector = proyector
                  self._sesiones = {}

              def capacidades(self) -> dict:
                  return {
                      "control": ("telefono", "pc", "hdmi"),
                      "acciones": ACCIONES_VALIDAS,
                      "proyeccion": "MotorHolo3D salida universal (cualquier superficie)",
                      "avatar": "MotorAvatar existente por paso con foto",
                      "tactil": "el telefono es el tactil: tocas el punto y se anota en la proyeccion",
                  }

              def crear_sesion(self, presentacion_id) -> dict:
                  id_limpio = str(presentacion_id or "").strip()
                  if not id_limpio:
                      raise ValueError("presentacion_id requerido.")
                  presentacion = self._repo.obtener_exigir(id_limpio)
                  id_sesion = nuevo_id("ses")
                  sesion = SesionPresentacion(id_sesion, presentacion, self._proyector)
                  self._sesiones[id_sesion] = sesion
                  return {
                      "sesion": id_sesion,
                      "presentacion": id_limpio,
                      "total_pasos": sesion.total_pasos(),
                      "vista_control": "/laboratorio/api/v1/presentations/remote/" + id_sesion + "/view",
                  }

              def sesion(self, id_sesion) -> SesionPresentacion:
                  sesion = self._sesiones.get(str(id_sesion or "").strip())
                  if sesion is None:
                      raise ValueError("Sesion desconocida: " + str(id_sesion))
                  return sesion

              def listar_sesiones(self) -> dict:
                  return {
                      "activas": [
                          {"sesion": sid, "paso": s.paso_actual, "total": s.total_pasos()}
                          for sid, s in sorted(self._sesiones.items()) if s.activa
                      ],
                      "total": len(self._sesiones),
                  }

              def proyectar_paso_actual(self, id_sesion) -> dict:
                  sesion = self.sesion(id_sesion)
                  frame = sesion.frame_holograma()
                  entrega = self._proyector.presentar(frame, {"tipo": "web"})
                  return {
                      "sesion": id_sesion,
                      "paso": sesion.paso_actual,
                      "proyeccion": entrega,
                  }
          PR_EOF

      - name: Reforzar routers/api/presentations.py (control remoto completo)
        run: |
          cat > apps/laboratorio/routers/api/presentations.py <<'PRES_EOF'
          """Rutas API de presentaciones + control remoto holografico."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.shared.exceptions.domain_errors import EntidadNoEncontradaError

          RUTA_CREAR = "/laboratorio/api/v1/projects/{proyecto_id}/presentations"
          RUTA_ITEM = "/laboratorio/api/v1/presentations/{presentacion_id}"
          RUTA_PLAY = RUTA_ITEM + "/play"
          RUTA_SELLAR = RUTA_ITEM + "/seal"
          RUTA_SESIONES = "/laboratorio/api/v1/presentations/remote"
          RUTA_SESION = RUTA_SESIONES + "/{sesion_id}"
          RUTA_ACCION = RUTA_SESION + "/accion"
          RUTA_TOQUE = RUTA_SESION + "/tocar"
          RUTA_FRAME = RUTA_SESION + "/frame.svg"
          RUTA_VISTA = RUTA_SESION + "/view"
          RUTA_PROYECTAR = RUTA_SESION + "/proyectar"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_presentaciones")
              remota = app.contenedor.obtener("presentacion_remota")

              def _crear(ctx):
                  return manejador.crear(ctx.identidad, ctx.ruta_params["proyecto_id"], ctx.json())

              def _listar(ctx):
                  return manejador.listar(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _obtener(ctx):
                  return manejador.obtener(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _reproducir(ctx):
                  return manejador.reproducir(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _sellar(ctx):
                  return manejador.sellar(ctx.identidad, ctx.ruta_params["presentacion_id"])

              def _crear_sesion(ctx):
                  datos = ctx.json()
                  return remota.crear_sesion(datos.get("presentacion_id", ""))

              def _listar_sesiones(ctx):
                  return remota.listar_sesiones()

              def _estado(ctx):
                  try:
                      return remota.sesion(ctx.ruta_params["sesion_id"]).estado()
                  except ValueError as exc:
                      raise EntidadNoEncontradaError(str(exc), ctx.ruta_params["sesion_id"])

              def _accion(ctx):
                  datos = ctx.json()
                  accion = str(datos.get("accion", "")).strip()
                  try:
                      sesion = remota.sesion(ctx.ruta_params["sesion_id"])
                  except ValueError as exc:
                      raise EntidadNoEncontradaError(str(exc), ctx.ruta_params["sesion_id"])
                  if accion == "avanzar":
                      return sesion.avanzar()
                  if accion == "retroceder":
                      return sesion.retroceder()
                  if accion == "ir_a":
                      return sesion.ir_a(datos.get("indice", 0))
                  if accion == "finalizar":
                      return sesion.finalizar()
                  raise ValueError(
                      "accion desconocida: " + repr(accion)
                      + ". Validas: avanzar, retroceder, ir_a, finalizar"
                  )

              def _tocar(ctx):
                  datos = ctx.json()
                  try:
                      sesion = remota.sesion(ctx.ruta_params["sesion_id"])
                  except ValueError as exc:
                      raise EntidadNoEncontradaError(str(exc), ctx.ruta_params["sesion_id"])
                  return sesion.tocar_punto(
                      datos.get("x", 0.0), datos.get("y", 0.0),
                      str(datos.get("etiqueta", "")),
                  )

              def _frame(ctx):
                  try:
                      sesion = remota.sesion(ctx.ruta_params["sesion_id"])
                  except ValueError as exc:
                      raise EntidadNoEncontradaError(str(exc), ctx.ruta_params["sesion_id"])
                  return 200, sesion.frame_holograma(), {
                      "Content-Type": "image/svg+xml",
                      "Cache-Control": "no-store",
                  }

              def _vista(ctx):
                  sesion_id = ctx.ruta_params["sesion_id"]
                  try:
                      sesion = remota.sesion(sesion_id)
                  except ValueError as exc:
                      raise EntidadNoEncontradaError(str(exc), sesion_id)
                  html = (
                      "<!doctype html><html lang='es'><head><meta charset='utf-8'>"
                      "<meta name='viewport' content='width=device-width, initial-scale=1'>"
                      "<title>Control " + sesion_id + "</title>"
                      "<style>body{background:#0B1220;color:#E2E8F0;font-family:system-ui,sans-serif;"
                      "text-align:center;padding:16px}button{font-size:22px;margin:6px;padding:14px 22px;"
                      "border-radius:12px;border:1px solid #1E293B;background:#111827;color:#93C5FD}"
                      "img{max-width:100%;border-radius:12px;border:1px solid #1E293B}</style></head><body>"
                      "<h3>Control de proyeccion</h3>"
                      "<img id='f' src='/laboratorio/api/v1/presentations/remote/" + sesion_id + "/frame.svg'>"
                      "<div><button onclick='acc(\"retroceder\")'>&#9664; Atras</button>"
                      "<button onclick='acc(\"avanzar\")'>Siguiente &#9654;</button></div>"
                      "<p style='color:#94A3B8;font-size:13px'>Toca la imagen para marcar el punto a explicar</p>"
                      "<script>"
                      "function acc(a){fetch('/laboratorio/api/v1/presentations/remote/" + sesion_id + "/accion',"
                      "{method:'POST',headers:{'Content-Type':'application/json'},"
                      "body:JSON.stringify({accion:a})}).then(r=>r.json()).then(refrescar)}"
                      "var f=document.getElementById('f');"
                      "f.addEventListener('click',function(e){"
                      "var r=f.getBoundingClientRect();"
                      "var x=(e.clientX-r.left)*900/r.width;var y=(e.clientY-r.top)*700/r.height;"
                      "fetch('/laboratorio/api/v1/presentations/remote/" + sesion_id + "/tocar',"
                      "{method:'POST',headers:{'Content-Type':'application/json'},"
                      "body:JSON.stringify({x:x,y:y})}).then(()=>refrescar());});"
                      "function refrescar(){f.src='/laboratorio/api/v1/presentations/remote/"
                      + sesion_id + "/frame.svg?t='+Date.now();}"
                      "setInterval(refrescar,3000);"
                      "</script></body></html>"
                  )
                  return 200, html.encode("utf-8"), {"Content-Type": "text/html; charset=utf-8"}

              def _proyectar(ctx):
                  return remota.proyectar_paso_actual(ctx.ruta_params["sesion_id"])

              app.registrar("POST", RUTA_CREAR, _crear, PermisoCodigo.PRESENTAR, "Crear presentacion con pasos")
              app.registrar("GET", RUTA_CREAR, _listar, PermisoCodigo.VER, "Listar presentaciones")
              app.registrar("GET", RUTA_ITEM, _obtener, PermisoCodigo.VER, "Obtener presentacion")
              app.registrar("GET", RUTA_PLAY, _reproducir, PermisoCodigo.VER, "Reproducir slideshow real")
              app.registrar("POST", RUTA_SELLAR, _sellar, PermisoCodigo.PRESENTAR, "Sellar en ZYRA via outbox")
              app.registrar("POST", RUTA_SESIONES, _crear_sesion, PermisoCodigo.PRESENTAR, "Abrir sesion interactiva de presentacion")
              app.registrar("GET", RUTA_SESIONES, _listar_sesiones, PermisoCodigo.VER, "Listar sesiones interactivas")
              app.registrar("GET", RUTA_SESION, _estado, PermisoCodigo.VER, "Estado de la sesion interactiva")
              app.registrar("POST", RUTA_ACCION, _accion, PermisoCodigo.PRESENTAR, "Accion de control (avanzar/retroceder/ir_a/finalizar)")
              app.registrar("POST", RUTA_TOQUE, _tocar, PermisoCodigo.PRESENTAR, "Tocar punto a explicar (x, y)")
              app.registrar("GET", RUTA_FRAME, _frame, PermisoCodigo.VER, "Frame holografico del paso actual")
              app.registrar("GET", RUTA_VISTA, _vista, PermisoCodigo.VER, "Vista de control desde telefono o PC")
              app.registrar("POST", RUTA_PROYECTAR, _proyectar, PermisoCodigo.PRESENTAR, "Proyectar paso actual via salida universal")
          PRES_EOF

      - name: Cablear presentacion_remota (busqueda por contenido, verificado)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/registry/services/service_registry.py")
          t = ruta.read_text(encoding="utf-8")
          lineas = t.splitlines(keepends=True)
          cambios = []

          if "presentation_remote" not in t:
              for i, l in enumerate(lineas):
                  if "simulation_engine import" in l and l.strip().startswith("from"):
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(
                          i + 1,
                          indent + "from apps.laboratorio.infrastructure.providers.presentation_remote import PresentacionRemota\n",
                      )
                      cambios.append("import PresentacionRemota")
                      break

          if '"presentacion_remota"' not in t:
              insertado = False
              for i, l in enumerate(lineas):
                  if 'c.registrar("gemelo_vivo"' in l or 'c.registrar("motor_monte_carlo"' in l:
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(
                          i + 1,
                          indent + 'c.registrar("presentacion_remota", lambda _c: PresentacionRemota(_c.obtener("repo_presentaciones"), _c.obtener("salidas_universales")))\n',
                      )
                      insertado = True
                      cambios.append("servicio presentacion_remota")
                      break
              if not insertado:
                  raise SystemExit("FATAL: sin ancla para presentacion_remota")

          t = "".join(lineas)
          if '"presentacion_remota"' not in t:
              raise SystemExit("FATAL: presentacion_remota no quedo cableada")
          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("service_registry: " + ("; ".join(cambios) if cambios else "ya al dia") + " - verificado")
          PYEOF

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Escribir pruebas (gemelo reparado + presentacion interactiva)
        run: |
          cat > apps/laboratorio/tests/test_gemelo_vivo.py <<'TG_EOF'
          """Gemelo digital en vivo - datos reales, deltas y alertas honestas."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.simulation_engine import GemeloVivo
          from apps.laboratorio.tests.conftest import assert_2xx


          def test_registrar_y_actualizar_con_delta():
              gem = GemeloVivo()
              gem.registrar_fuente("sensor-rio", "sensor", 2.0, umbral_alto=5.0)
              res = gem.actualizar("sensor-rio", 3.5)
              assert res["valor_anterior"] == 2.0
              assert res["valor_nuevo"] == 3.5
              assert res["delta"] == 1.5
              assert res["alertas"] == []


          def test_alerta_umbral_alto_y_bajo():
              gem = GemeloVivo()
              gem.registrar_fuente("rio", "sensor", 3.0, umbral_alto=5.0, umbral_bajo=1.0)
              alta = gem.actualizar("rio", 6.0)
              assert alta["alertas"][0]["tipo"] == "umbral_alto_superado"
              baja = gem.actualizar("rio", 0.5)
              assert baja["alertas"][0]["tipo"] == "umbral_bajo_superado"


          def test_fuente_no_registrada_rechaza():
              gem = GemeloVivo()
              with pytest.raises(ValueError):
                  gem.actualizar("fantasma", 1.0)


          def test_tipo_invalido_y_umbrales_invalidos_rechazan():
              gem = GemeloVivo()
              with pytest.raises(ValueError):
                  gem.registrar_fuente("a", "telepatia", 1.0)
              with pytest.raises(ValueError):
                  gem.registrar_fuente("b", "sensor", 1.0, umbral_alto=5.0, umbral_bajo=5.0)


          def test_estado_y_historico_reales():
              gem = GemeloVivo()
              gem.registrar_fuente("api-sismos", "api", 1.0)
              gem.actualizar("api-sismos", 2.0)
              gem.actualizar("api-sismos", 4.0)
              estado = gem.estado()
              assert estado["total_fuentes"] == 1
              assert estado["actualizaciones_totales"] == 2
              hist = gem.historico("api-sismos")
              assert hist["valores"] == [1.0, 2.0, 4.0]


          def test_gemelo_por_http(despachar):
              cuerpo = json.dumps({
                  "id": "sensor-aforo", "tipo": "sensor", "valor": 10.0,
                  "umbral_alto": 20.0, "etiqueta": "aforo parque",
              }).encode("utf-8")
              status, _h, datos = despachar(
                  "POST", "/laboratorio/api/v1/twin/sources", cuerpo,
              )
              assert_2xx(status, datos)
              cuerpo2 = json.dumps({"valor": 25.0}).encode("utf-8")
              status2, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/twin/sources/sensor-aforo", cuerpo2,
              )
              assert_2xx(status2, datos2)
              alertas = datos2["datos"]["alertas"]
              assert alertas and alertas[0]["tipo"] == "umbral_alto_superado"
              status3, _h3, datos3 = despachar("GET", "/laboratorio/api/v1/twin")
              assert_2xx(status3, datos3)
              assert datos3["datos"]["total_fuentes"] == 1
          TG_EOF
          cat > apps/laboratorio/tests/test_presentacion_interactiva.py <<'TP_EOF'
          """Presentacion holografica interactiva: crear, controlar, tocar, proyectar."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.presentation_remote import (
              PresentacionRemota,
              SesionPresentacion,
          )
          from apps.laboratorio.infrastructure.providers.display_holo3d import MotorHolo3D
          from apps.laboratorio.tests.conftest import assert_2xx


          class _PasoFalso:
              def __init__(self, titulo, contenido):
                  self.titulo = titulo
                  self.contenido = contenido

              def a_dict(self):
                  return {"titulo": self.titulo, "contenido": self.contenido}


          class _PresentacionFalsa:
              id = "pres-test"
              pasos = [
                  _PasoFalso("Inicio", "Bienvenidos al proyecto"),
                  _PasoFalso("Modelo 3D", "Este es el modelo"),
                  _PasoFalso("Cierre", "Preguntas"),
              ]


          def _sesion():
              proyector = MotorHolo3D()
              return SesionPresentacion("ses-test", _PresentacionFalsa(), proyector)


          def test_crear_sesion_con_pasos_reales():
              repo = type("R", (), {"obtener_exigir": staticmethod(lambda pid: _PresentacionFalsa())})()
              gestor = PresentacionRemota(repo, MotorHolo3D())
              res = gestor.crear_sesion("pres-test")
              assert res["total_pasos"] == 3
              assert "view" in res["vista_control"]
              assert gestor.sesion(res["sesion"]).activa is True


          def test_sesion_desconocida_rechaza():
              repo = type("R", (), {"obtener_exigir": staticmethod(lambda pid: _PresentacionFalsa())})()
              gestor = PresentacionRemota(repo, MotorHolo3D())
              with pytest.raises(ValueError):
                  gestor.sesion("fantasma")


          def test_avanzar_retroceder_ir_a():
              s = _sesion()
              assert s.avanzar()["paso"] == 1
              assert s.avanzar()["paso"] == 2
              assert s.avanzar()["paso"] == 2
              assert s.retroceder()["paso"] == 1
              assert s.ir_a(0)["paso"] == 0
              with pytest.raises(ValueError):
                  s.ir_a(99)


          def test_tocar_punto_registra_anotacion():
              s = _sesion()
              a = s.tocar_punto(120.5, 80.2, "esta es la entrada")
              assert a["paso"] == 0
              assert a["x"] == 120.5
              assert len(s.anotaciones_del_paso(0)) == 1
              assert s.anotaciones_del_paso(1) == []
              with pytest.raises(ValueError):
                  s.tocar_punto(-1, 0)


          def test_frame_holograma_incluye_titulo_y_anotaciones():
              s = _sesion()
              s.tocar_punto(100, 100, "punto clave")
              frame = s.frame_holograma().decode("utf-8")
              assert "<svg" in frame
              assert "Inicio" in frame
              assert "circle" in frame


          def test_proyectar_paso_actual_por_salida_universal():
              repo = type("R", (), {"obtener_exigir": staticmethod(lambda pid: _PresentacionFalsa())})()
              gestor = PresentacionRemota(repo, MotorHolo3D())
              res = gestor.crear_sesion("pres-test")
              salida = gestor.proyectar_paso_actual(res["sesion"])
              assert salida["paso"] == 0
              assert salida["proyeccion"]["entregado"] is True


          def test_finalizar_devuelve_historial_completo():
              s = _sesion()
              s.avanzar()
              s.tocar_punto(10, 10)
              res = s.finalizar()
              assert res["anotaciones"] == 1
              acciones = [h["accion"] for h in res["historial"]]
              assert "avanzar" in acciones and "tocar_punto" in acciones and "finalizar" in acciones


          def test_ciclo_completo_por_http(despachar):
              _s, _h, datos = despachar("POST", "/laboratorio/api/v1/projects", json.dumps({
                  "titulo": "Proy presentacion", "tipo": "negocio",
              }).encode("utf-8"))
              assert_2xx(_s, datos)
              proyecto_id = datos["datos"]["proyecto"]["id"]
              status, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/presentations",
                  json.dumps({
                      "titulo": "Mi presentacion",
                      "pasos": [
                          {"titulo": "Inicio", "contenido": "Hola", "duracion_segundos": 30},
                          {"titulo": "Demo", "contenido": "Mira esto", "duracion_segundos": 45},
                      ],
                  }).encode("utf-8"),
              )
              assert_2xx(status, datos2)
              presentacion_id = datos2["datos"]["presentacion"]["id"]
              status3, _h3, datos3 = despachar(
                  "POST", "/laboratorio/api/v1/presentations/remote",
                  json.dumps({"presentacion_id": presentacion_id}).encode("utf-8"),
              )
              assert_2xx(status3, datos3)
              sesion_id = datos3["datos"]["sesion"]
              status4, _h4, datos4 = despachar(
                  "POST", "/laboratorio/api/v1/presentations/remote/" + sesion_id + "/accion",
                  json.dumps({"accion": "avanzar"}).encode("utf-8"),
              )
              assert_2xx(status4, datos4)
              assert datos4["paso"] == 1
              status5, _h5, datos5 = despachar(
                  "POST", "/laboratorio/api/v1/presentations/remote/" + sesion_id + "/tocar",
                  json.dumps({"x": 200, "y": 150, "etiqueta": "aqui"}).encode("utf-8"),
              )
              assert_2xx(status5, datos5)
              assert datos5["paso"] == 1
              status6, _h6, datos6 = despachar(
                  "GET", "/laboratorio/api/v1/presentations/remote/" + sesion_id,
              )
              assert_2xx(status6, datos6)
              assert datos6["anotaciones_total"] == 1
              status7, _h7, _datos7 = despachar(
                  "GET", "/laboratorio/api/v1/presentations/remote/" + sesion_id + "/view",
              )
              assert_2xx(status7, _datos7)
          TP_EOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado de la suite - Run 2 presentacion interactiva"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "EX Run 2 - presentacion holografica interactiva (control por telefono, tocar puntos, avatar/proyeccion universal) + fix cableado robusto"
            git push
          fi
