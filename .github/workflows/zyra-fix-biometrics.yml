name: "ZYRA EX - parche final 3 fallos (quirurgico)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parche:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Parche 1 - decode del SVG holografico (bytes a texto)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/infrastructure/providers/presentation_remote.py")
          t = ruta.read_text(encoding="utf-8")

          viejo = 'svg = self._holograma.generar(_escena_para_holograma(titulo))\n'
          nuevo = 'svg = self._holograma.generar(_escena_para_holograma(titulo)).decode("utf-8")\n'
          if viejo in t:
              t = t.replace(viejo, nuevo, 1)
              print("parche 1 aplicado: decode del svg")
          elif 'generar(_escena_para_holograma(titulo)).decode' in t:
              print("parche 1 ya presente")
          else:
              raise SystemExit("FATAL: linea del holograma no encontrada")

          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("presentation_remote.py: sintaxis OK")
          PYEOF

      - name: Parche 2 y 3 - tests corregidos (una instancia, acceso directo)
        run: |
          python - <<'PYEOF'
          from pathlib import Path

          ruta = Path("apps/laboratorio/tests/test_presentacion_interactiva.py")
          t = ruta.read_text(encoding="utf-8")

          viejo1 = '''          def test_proyectar_paso_actual_por_salida_universal():
              res = _gestor().crear_sesion("pres-test")
              salida = _gestor().proyectar_paso_actual(res["sesion"])
              assert salida["paso"] == 0
              assert salida["proyeccion"]["entregado"] is True
          '''
          nuevo1 = '''          def test_proyectar_paso_actual_por_salida_universal():
              gestor = _gestor()
              res = gestor.crear_sesion("pres-test")
              salida = gestor.proyectar_paso_actual(res["sesion"])
              assert salida["paso"] == 0
              assert salida["proyeccion"]["entregado"] is True
          '''
          if viejo1 in t:
              t = t.replace(viejo1, nuevo1, 1)
              print("parche 2 aplicado: una sola instancia del gestor")
          elif 'gestor = _gestor()\n              res = gestor.crear_sesion' in t:
              print("parche 2 ya presente")
          else:
              raise SystemExit("FATAL: test de proyeccion no encontrado")

          viejo2 = 'sesion_id = datos3["datos"]["sesion"]\n'
          nuevo2 = 'sesion_id = datos3["sesion"]\n'
          if viejo2 in t:
              t = t.replace(viejo2, nuevo2, 1)
              print("parche 3 aplicado: acceso directo al dict de la sesion")
          elif 'sesion_id = datos3["sesion"]' in t:
              print("parche 3 ya presente")
          else:
              raise SystemExit("FATAL: linea de sesion_id no encontrada")

          Path(ruta).write_text(t, encoding="utf-8")
          print("tests: parches OK")
          PYEOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - parche final"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "EX: parche final presentacion interactiva (decode svg, una instancia, acceso directo)"
            git push
          fi
