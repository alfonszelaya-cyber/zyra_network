          function abajo(ev){
          if(!docImg||!quad)return;
          var p=pos(ev);var e=cv.width/docImg.width;
          var pts=[quad.tl,quad.tr,quad.br,quad.bl];
          var mejor=-1,md=52;
          for(var i=0;i<4;i++){
          var dd=Math.hypot(p.x-pts[i].x*e,p.y-pts[i].y*e);
