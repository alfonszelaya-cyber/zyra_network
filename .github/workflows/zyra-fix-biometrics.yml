name: "ZYRA RUN2c v2: S-8 IA tutora (foco UNICO: objetivo nuevo reemplaza cualquier activo) + S-13 rutas"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] S-8 tutor_link_engine (fix foco unico) + S-13 learning_path_engine"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/domain/education_ai/tutor_link_engine.py",
                     D(r'''
                  """Tutor Link Engine (S-8) - la IA tutora como
                  PARTE del ciclo escolar, no un chatbot suelto.

                  Conecta: expediente canonico (StudentRegistry)
                  + notas (sm_evaluations, flujo S-9) + asistencia
                  por clase (sm_class_attendance, flujo S-6) +
                  sesiones de tutoria (sm_tutor_sessions, DDL
                  confirmado) -> OBJETIVO concreto de estudio con
                  dificultad derivada del promedio real.

                  FOCO UNICO (v2): el alumno tiene UN solo objetivo
                  ACTIVO a la vez — al fijar uno nuevo, los
                  anteriores de CUALQUIER materia quedan
                  REEMPLAZADO (el GENERAL de arranque cede ante
                  el primero con notas reales).

                  snapshot(): estado consolidado del alumno.
                  next_objective(): elige la materia con PEOR
                  promedio (razon honesta, regla 66) y fija
                  dificultad 1..4 (sin notas -> GENERAL nivel 1).
                  record_attempt(): acierto sube nivel y racha
                  (racha 3 -> objetivo COMPLETADO); error baja
                  nivel (min 1) y resetea racha; sincroniza la
                  sesion de tutoria abierta de esa materia.

                  Regla 76: ORDER BY rowid (nunca timestamps con
                  reloj congelado). Regla 61: promedios Decimal
                  2d. Regla 68: solo carpetas existentes."""
                  from __future__ import annotations
                  import uuid
                  from decimal import Decimal
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "ai_canonical_guarantees", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_evaluations (evaluation_id TEXT"
                          " PRIMARY KEY, student_id TEXT NOT NULL,"
                          " subject TEXT NOT NULL, period TEXT NOT"
                          " NULL, score TEXT NOT NULL, scale_max"
                          " TEXT NOT NULL DEFAULT '10.00',"
                          " eval_type TEXT NOT NULL DEFAULT"
                          " 'EXAMEN', teacher_id TEXT NOT NULL"
                          " DEFAULT '', detail TEXT NOT NULL"
                          " DEFAULT '', created_at REAL NOT NULL)",
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_class_attendance (class_att_id TEXT"
                          " PRIMARY KEY, student_id TEXT NOT NULL,"
                          " classroom_id TEXT NOT NULL, subject TEXT"
                          " NOT NULL, date TEXT NOT NULL, time_slot"
                          " TEXT NOT NULL DEFAULT '', status TEXT"
                          " NOT NULL, teacher_id TEXT NOT NULL"
                          " DEFAULT '', detail TEXT NOT NULL DEFAULT"
                          " '', created_at REAL NOT NULL,"
                          " UNIQUE(student_id, classroom_id, subject,"
                          " date, time_slot))",
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_tutor_sessions (session_id TEXT"
                          " PRIMARY KEY, student_id TEXT NOT NULL,"
                          " subject TEXT NOT NULL, level INTEGER NOT"
                          " NULL DEFAULT 1, streak INTEGER NOT NULL"
                          " DEFAULT 0, mode TEXT NOT NULL DEFAULT"
                          " 'TUTOR', status TEXT NOT NULL DEFAULT"
                          " 'OPEN', created_at REAL NOT NULL,"
                          " updated_at REAL NOT NULL)",
                      )),
                      Migration(2, "ai_own_tables", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_ai_objectives (objective_id TEXT"
                          " PRIMARY KEY, student_id TEXT NOT NULL,"
                          " subject TEXT NOT NULL, difficulty INTEGER"
                          " NOT NULL DEFAULT 1, reason TEXT NOT NULL"
                          " DEFAULT '', status TEXT NOT NULL DEFAULT"
                          " 'ACTIVO', created_at REAL NOT NULL,"
                          " updated_at REAL NOT NULL)",
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_ai_attempts (attempt_id TEXT PRIMARY"
                          " KEY, objective_id TEXT NOT NULL,"
                          " student_id TEXT NOT NULL, correct INTEGER"
                          " NOT NULL, detail TEXT NOT NULL DEFAULT"
                          " '', created_at REAL NOT NULL)",
                      )),
                  )


                  def _difficulty_from_average(avg):
                      if avg is None:
                          return 1
                      d = Decimal(str(avg))
                      if d < Decimal("5.00"):
                          return 1
                      if d < Decimal("7.00"):
                          return 2
                      if d < Decimal("9.00"):
                          return 3
                      return 4


                  class TutorLinkEngine:
                      """IA tutora integrada al ciclo (S-8)."""

                      def __init__(self, db, clock,
                                   student_registry):
                          self._db = db
                          self._clock = clock
                          self._students = student_registry
                          MigrationRunner(db, "sm.ailink",
                                          _MIGRATIONS).run(clock)

                      def _averages_by_subject(self,
                                               student_id) -> dict:
                          rows = self._db.query_all(
                              "SELECT subject, score FROM"
                              " sm_evaluations WHERE student_id ="
                              " ?", (str(student_id),))
                          acc = {}
                          for r in rows:
                              try:
                                  acc.setdefault(
                                      str(r["subject"]),
                                      []).append(
                                      Decimal(str(r["score"])))
                              except Exception:
                                  continue
                          out = {}
                          for subj, vals in acc.items():
                              out[subj] = str(
                                  (sum(vals)
                                   / Decimal(len(vals)))
                                  .quantize(Decimal("0.01")))
                          return out

                      def snapshot(self, student_id) -> dict:
                          est = self._students.get(
                              str(student_id))
                          if est is None:
                              return {"found": False}
                          avgs = self._averages_by_subject(
                              student_id)
                          att_rows = self._db.query_all(
                              "SELECT status, COUNT(*) AS n FROM"
                              " sm_class_attendance WHERE"
                              " student_id = ? GROUP BY status",
                              (str(student_id),))
                          attendance = {
                              str(r["status"]): int(r["n"])
                              for r in att_rows}
                          sess = self._db.query_all(
                              "SELECT session_id, subject, level,"
                              " streak, status FROM"
                              " sm_tutor_sessions WHERE"
                              " student_id = ? ORDER BY rowid",
                              (str(student_id),))
                          sessions = [
                              {"session_id":
                                   str(r["session_id"]),
                               "subject": str(r["subject"]),
                               "level": int(r["level"]),
                               "streak": int(r["streak"]),
                               "status": str(r["status"])}
                              for r in sess]
                          objs = self._db.query_all(
                              "SELECT objective_id, subject,"
                              " difficulty, reason, status FROM"
                              " sm_ai_objectives WHERE student_id"
                              " = ? AND status = 'ACTIVO'"
                              " ORDER BY rowid",
                              (str(student_id),))
                          actives = [
                              {"objective_id":
                                   str(r["objective_id"]),
                               "subject": str(r["subject"]),
                               "difficulty": int(r["difficulty"]),
                               "reason": str(r["reason"])}
                              for r in objs]
                          return {"found": True,
                                  "student": est,
                                  "averages": avgs,
                                  "attendance": attendance,
                                  "tutor_sessions": sessions,
                                  "active_objectives": actives}

                      def next_objective(self, student_id,
                                         subject=None) -> dict:
                          avgs = self._averages_by_subject(
                              student_id)
                          if str(subject or "").strip():
                              chosen = str(subject)
                              avg = avgs.get(chosen)
                              if avg is None:
                                  reason = ("sin notas de "
                                            + chosen
                                            + ": nivel inicial")
                                  diff = 1
                              else:
                                  diff = _difficulty_from_average(
                                      avg)
                                  reason = ("promedio " + avg
                                            + " en " + chosen)
                          elif avgs:
                              chosen = sorted(
                                  avgs.items(),
                                  key=lambda kv:
                                      (Decimal(kv[1]),
                                       kv[0]))[0][0]
                              avg = avgs[chosen]
                              diff = _difficulty_from_average(avg)
                              reason = ("peor promedio " + avg
                                        + " en " + chosen)
                          else:
                              chosen = "GENERAL"
                              diff = 1
                              reason = ("sin notas: nivel"
                                        " inicial GENERAL")
                          with self._db.transaction() as cur:
                              cur.execute(
                                  "UPDATE sm_ai_objectives SET"
                                  " status = 'REEMPLAZADO',"
                                  " updated_at = ? WHERE"
                                  " student_id = ? AND status ="
                                  " 'ACTIVO'",
                                  (self._clock.now(),
                                   str(student_id)))
                              oid = ("SMOBJ-"
                                     + uuid.uuid4().hex[:10])
                              cur.execute(
                                  "INSERT INTO sm_ai_objectives"
                                  " (objective_id, student_id,"
                                  " subject, difficulty, reason,"
                                  " status, created_at, updated_at)"
                                  " VALUES (?, ?, ?, ?, ?,"
                                  " 'ACTIVO', ?, ?)",
                                  (oid, str(student_id), chosen,
                                   int(diff), reason,
                                   self._clock.now(),
                                   self._clock.now()))
                          return {"objective_id": oid,
                                  "student_id": str(student_id),
                                  "subject": chosen,
                                  "difficulty": int(diff),
                                  "reason": reason,
                                  "status": "ACTIVO"}

                      def record_attempt(self, objective_id, *,
                                         correct, detail="") -> dict:
                          row = self._db.query_one(
                              "SELECT * FROM sm_ai_objectives"
                              " WHERE objective_id = ?",
                              (str(objective_id),))
                          if not row:
                              raise KeyError(objective_id)
                          oid = str(row["objective_id"])
                          sid = str(row["student_id"])
                          subj = str(row["subject"])
                          diff = int(row["difficulty"])
                          rows = self._db.query_all(
                              "SELECT correct FROM sm_ai_attempts"
                              " WHERE objective_id = ?"
                              " ORDER BY rowid DESC LIMIT 3",
                              (oid,))
                          streak = 0
                          for r in rows:
                              if int(r["correct"]) == 1:
                                  streak += 1
                              else:
                                  break
                          if bool(correct):
                              new_diff = min(5, diff + 1)
                              new_streak = streak + 1
                          else:
                              new_diff = max(1, diff - 1)
                              new_streak = 0
                          aid = ("SMAAT-"
                                 + uuid.uuid4().hex[:10])
                          with self._db.transaction() as cur:
                              cur.execute(
                                  "INSERT INTO sm_ai_attempts"
                                  " (attempt_id, objective_id,"
                                  " student_id, correct, detail,"
                                  " created_at) VALUES"
                                  " (?, ?, ?, ?, ?, ?)",
                                  (aid, oid, sid,
                                   1 if bool(correct) else 0,
                                   str(detail),
                                   self._clock.now()))
                              status = "ACTIVO"
                              if new_streak >= 3:
                                  status = "COMPLETADO"
                                  cur.execute(
                                      "UPDATE sm_ai_objectives"
                                      " SET status = 'COMPLETADO',"
                                      " updated_at = ? WHERE"
                                      " objective_id = ?",
                                      (self._clock.now(), oid))
                              else:
                                  cur.execute(
                                      "UPDATE sm_ai_objectives SET"
                                      " difficulty = ?, updated_at"
                                      " = ? WHERE objective_id = ?",
                                      (new_diff,
                                       self._clock.now(), oid))
                              srow = cur.execute(
                                  "SELECT session_id FROM"
                                  " sm_tutor_sessions WHERE"
                                  " student_id = ? AND subject = ?"
                                  " AND status = 'OPEN'"
                                  " ORDER BY rowid LIMIT 1",
                                  (sid, subj)).fetchone()
                              if srow is not None:
                                  cur.execute(
                                      "UPDATE sm_tutor_sessions"
                                      " SET level = ?, streak = ?,"
                                      " updated_at = ? WHERE"
                                      " session_id = ?",
                                      (new_diff, new_streak,
                                       self._clock.now(),
                                       str(srow[0])))
                              else:
                                  cur.execute(
                                      "INSERT INTO"
                                      " sm_tutor_sessions"
                                      " (session_id, student_id,"
                                      " subject, level, streak,"
                                      " mode, status, created_at,"
                                      " updated_at) VALUES"
                                      " (?, ?, ?, ?, ?, 'TUTOR',"
                                      " 'OPEN', ?, ?)",
                                      ("SMSES-"
                                       + uuid.uuid4().hex[:10],
                                       sid, subj, new_diff,
                                       new_streak,
                                       self._clock.now(),
                                       self._clock.now()))
                          return {"attempt_id": aid,
                                  "objective_id": oid,
                                  "difficulty": new_diff,
                                  "streak": new_streak,
                                  "objective_status": status}

                      def objectives_of(self, student_id) -> list:
                          rows = self._db.query_all(
                              "SELECT objective_id, subject,"
                              " difficulty, reason, status FROM"
                              " sm_ai_objectives WHERE student_id"
                              " = ? ORDER BY rowid",
                              (str(student_id),))
                          return [
                              {"objective_id":
                                   str(r["objective_id"]),
                               "subject": str(r["subject"]),
                               "difficulty": int(r["difficulty"]),
                               "reason": str(r["reason"]),
                               "status": str(r["status"])}
                              for r in rows]
              '''))
              forzar("apps/semilla/domain/learning/learning_path_engine.py",
                     D(r'''
                  """Learning Path Engine (S-13) - rutas de estudio
                  personalizadas por materia, alimentadas por la
                  IA tutora integrada (S-8) y los promedios reales
                  (S-9): 3 pasos por materia con dificultad base
                  = objetivo ACTIVO de esa materia (si existe),
                  si no, derivada del promedio; sin notas ->
                  ruta GENERAL nivel 1 (razon honesta, regla 66).

                  Regla 61: porcentaje Decimal 2d. Regla 76:
                  ORDER BY subject, step_no, rowid."""
                  from __future__ import annotations
                  import uuid
                  from decimal import Decimal
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "learning_own", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_learning_paths (path_id TEXT PRIMARY"
                          " KEY, student_id TEXT NOT NULL, subject"
                          " TEXT NOT NULL, step_no INTEGER NOT NULL,"
                          " difficulty INTEGER NOT NULL DEFAULT 1,"
                          " status TEXT NOT NULL DEFAULT 'ACTIVO',"
                          " created_at REAL NOT NULL, updated_at"
                          " REAL NOT NULL, UNIQUE(student_id,"
                          " subject, step_no))",
                      )),
                  )


                  def _base_from_average(avg):
                      if avg is None:
                          return 1
                      d = Decimal(str(avg))
                      if d < Decimal("5.00"):
                          return 1
                      if d < Decimal("7.00"):
                          return 2
                      if d < Decimal("9.00"):
                          return 3
                      return 4


                  class LearningPathEngine:
                      """Rutas personalizadas (S-13)."""

                      def __init__(self, db, clock,
                                   tutor_link=None):
                          self._db = db
                          self._clock = clock
                          self._tutor = tutor_link
                          MigrationRunner(db, "sm.learning",
                                          _MIGRATIONS).run(clock)

                      def _base_difficulty(self, student_id,
                                           subject) -> int:
                          if self._tutor is not None:
                              for o in self._tutor.objectives_of(
                                      student_id):
                                  if (o["subject"] == subject
                                          and o["status"]
                                          == "ACTIVO"):
                                      return int(
                                          o["difficulty"])
                          row = self._db.query_one(
                              "SELECT AVG(CAST(score AS REAL)) AS"
                              " a FROM sm_evaluations WHERE"
                              " student_id = ? AND subject = ?",
                              (str(student_id), str(subject)))
                          if row is not None and \
                                  row["a"] is not None:
                              return _base_from_average(
                                  row["a"])
                          return 1

                      def build_path(self, student_id) -> dict:
                          rows = self._db.query_all(
                              "SELECT DISTINCT subject FROM"
                              " sm_evaluations WHERE student_id ="
                              " ?", (str(student_id),))
                          subjects = sorted(set(
                              str(r["subject"]) for r in rows))
                          note = ""
                          if not subjects:
                              subjects = ["GENERAL"]
                              note = ("sin notas: ruta GENERAL"
                                      " nivel 1")
                          with self._db.transaction() as cur:
                              cur.execute(
                                  "DELETE FROM sm_learning_paths"
                                  " WHERE student_id = ?",
                                  (str(student_id),))
                              built = {}
                              for subj in subjects:
                                  base = self._base_difficulty(
                                      student_id, subj)
                                  for step in (1, 2, 3):
                                      diff = min(5, base
                                                 + (step - 1))
                                      cur.execute(
                                          "INSERT INTO"
                                          " sm_learning_paths"
                                          " (path_id, student_id,"
                                          " subject, step_no,"
                                          " difficulty, status,"
                                          " created_at, updated_at)"
                                          " VALUES (?, ?, ?, ?, ?,"
                                          " 'ACTIVO', ?, ?)",
                                          ("SMPTH-"
                                           + uuid.uuid4()
                                           .hex[:10],
                                           str(student_id),
                                           subj, step, diff,
                                           self._clock.now(),
                                           self._clock.now()))
                                  built[subj] = {
                                      "base": base,
                                      "steps": [
                                          min(5, base
                                              + (s - 1))
                                          for s in (1, 2, 3)]}
                          return {"student_id":
                                      str(student_id),
                                  "by_subject": built,
                                  "total_steps":
                                      3 * len(subjects),
                                  "note": note}

                      def complete_step(self, path_id) -> dict:
                          row = self._db.query_one(
                              "SELECT path_id FROM"
                              " sm_learning_paths WHERE"
                              " path_id = ?", (str(path_id),))
                          if not row:
                              raise KeyError(path_id)
                          self._db.execute(
                              "UPDATE sm_learning_paths SET"
                              " status = 'COMPLETADO',"
                              " updated_at = ? WHERE path_id = ?",
                              (self._clock.now(),
                               str(path_id)))
                          return {"path_id": str(path_id),
                                  "status": "COMPLETADO"}

                      def progress(self, student_id) -> dict:
                          tot = self._db.query_one(
                              "SELECT COUNT(*) AS n FROM"
                              " sm_learning_paths WHERE"
                              " student_id = ?",
                              (str(student_id),))
                          done = self._db.query_one(
                              "SELECT COUNT(*) AS n FROM"
                              " sm_learning_paths WHERE"
                              " student_id = ? AND status ="
                              " 'COMPLETADO'",
                              (str(student_id),))
                          total = int(tot["n"]) if tot else 0
                          comp = int(done["n"]) if done else 0
                          if total > 0:
                              pct = str(
                                  ((Decimal(comp)
                                    / Decimal(total))
                                   * Decimal(100))
                                  .quantize(Decimal("0.01")))
                          else:
                              pct = "0.00"
                          nxt = self._db.query_one(
                              "SELECT subject, step_no, difficulty"
                              " FROM sm_learning_paths WHERE"
                              " student_id = ? AND status ="
                              " 'ACTIVO' ORDER BY subject,"
                              " step_no, rowid LIMIT 1",
                              (str(student_id),))
                          next_step = None
                          if nxt is not None:
                              next_step = {
                                  "subject": str(
                                      nxt["subject"]),
                                  "step_no": int(
                                      nxt["step_no"]),
                                  "difficulty": int(
                                      nxt["difficulty"])}
                          return {"student_id":
                                      str(student_id),
                                  "total": total,
                                  "completed": comp,
                                  "pct": pct,
                                  "next_step": next_step}
              '''))
              out("## FIN builders 2c v2")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests S-8 + S-13 (identicos, el fallo era del engine)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_run2c_tutoria.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.student.student_registry_engine import StudentRegistryEngine
          from apps.semilla.domain.evaluation.notes_flow_engine import NotesFlowEngine
          from apps.semilla.domain.attendance.linked_attendance_engine import LinkedAttendanceEngine
          from apps.semilla.domain.education_ai.tutor_link_engine import TutorLinkEngine
          from apps.semilla.domain.learning.learning_path_engine import LearningPathEngine

          PICK2 = [{"name": "Mama", "relation": "MADRE"},
                   {"name": "Papa", "relation": "PADRE"}]
          EMG = [{"name": "Tio", "relation": "TIO", "phone": "911"}]

          def _base(tmp_path):
              db = SQLiteAdapter(tmp_path / "t.db")
              clock = FrozenClock()
              students = StudentRegistryEngine(db, clock)
              nf = NotesFlowEngine(db, clock,
                  evaluation_engine=None, history_engine=None,
                  family_engine=None)
              la = LinkedAttendanceEngine(db, clock,
                  attendance_engine=None, alert_engine=None)
              tl = TutorLinkEngine(db, clock,
                  student_registry=students)
              lp = LearningPathEngine(db, clock, tutor_link=tl)
              return db, clock, students, nf, la, tl, lp

          def _alumno(students, name="Alumno Tutoria"):
              return students.register(full_name=name,
                  level="BASICA", grade="1", institution_id="INST-1",
                  tutores=[{"name": "Mama", "relation": "MADRE",
                            "zid": "ZID-M-1"}],
                  authorized_pickup=PICK2,
                  emergency_contacts=EMG,
                  zid="ZID-" + name[:3], zid_status="PROVISIONAL")

          def test_s8_snapshot_integrado(tmp_path) -> None:
              db, clock, students, nf, la, tl, lp = _base(tmp_path)
              est = _alumno(students)
              nf.record_note(student_id=est["student_id"],
                  subject="LENGUA", period="P1", score="5.00",
                  teacher_id="PROF-L")
              nf.record_note(student_id=est["student_id"],
                  subject="MATEMATICAS", period="P1", score="8.50",
                  teacher_id="PROF-M")
              la.record_class(student_id=est["student_id"],
                  classroom_id="AULA-1", subject="MATEMATICAS",
                  date="2026-03-10", status="PRESENTE",
                  time_slot="08:00")
              snap = tl.snapshot(est["student_id"])
              assert snap["found"] is True
              assert snap["averages"]["LENGUA"] == "5.00"
              assert snap["averages"]["MATEMATICAS"] == "8.50"
              assert snap["attendance"]["PRESENTE"] == 1
              assert snap["tutor_sessions"] == []
              nf2 = tl.snapshot("NO-EXISTE")
              assert nf2["found"] is False
              print("OK S-8: snapshot consolida expediente + notas (S-9) + asistencia (S-6) + sesiones")

          def test_s8_next_objective_peor_materia(tmp_path) -> None:
              db, clock, students, nf, la, tl, lp = _base(tmp_path)
              est = _alumno(students)
              o0 = tl.next_objective(est["student_id"])
              assert o0["subject"] == "GENERAL"
              assert o0["difficulty"] == 1
              assert "sin notas" in o0["reason"]
              nf.record_note(student_id=est["student_id"],
                  subject="LENGUA", period="P1", score="5.00")
              nf.record_note(student_id=est["student_id"],
                  subject="MATEMATICAS", period="P1", score="8.50")
              o1 = tl.next_objective(est["student_id"])
              assert o1["subject"] == "LENGUA"
              assert o1["difficulty"] == 2
              assert "5.00" in o1["reason"]
              assert "LENGUA" in o1["reason"]
              objs = tl.objectives_of(est["student_id"])
              actives = [o for o in objs
                         if o["status"] == "ACTIVO"]
              assert len(actives) == 1
              assert actives[0]["objective_id"] == \
                  o1["objective_id"]
              replaced = [o for o in objs
                          if o["status"] == "REEMPLAZADO"]
              assert len(replaced) == 1
              assert replaced[0]["subject"] == "GENERAL"
              print("OK S-8: FOCO UNICO — el GENERAL de arranque queda REEMPLAZADO cuando hay notas reales (peor promedio -> LENGUA)")

          def test_s8_record_attempt_racha_y_sesion(tmp_path) -> None:
              db, clock, students, nf, la, tl, lp = _base(tmp_path)
              est = _alumno(students)
              nf.record_note(student_id=est["student_id"],
                  subject="LENGUA", period="P1", score="5.00")
              o = tl.next_objective(est["student_id"])
              assert o["difficulty"] == 2
              r1 = tl.record_attempt(o["objective_id"],
                  correct=True, detail="bien")
              assert r1["difficulty"] == 3
              assert r1["streak"] == 1
              assert r1["objective_status"] == "ACTIVO"
              r2 = tl.record_attempt(o["objective_id"],
                  correct=True)
              assert r2["difficulty"] == 4
              assert r2["streak"] == 2
              r3 = tl.record_attempt(o["objective_id"],
                  correct=True)
              assert r3["difficulty"] == 5
              assert r3["streak"] == 3
              assert r3["objective_status"] == "COMPLETADO"
              sess = db.query_one(
                  "SELECT level, streak, status FROM"
                  " sm_tutor_sessions WHERE student_id = ?"
                  " AND subject = 'LENGUA' ORDER BY rowid",
                  (est["student_id"],))
              assert sess is not None
              assert int(sess["level"]) == 5
              assert int(sess["streak"]) == 3
              assert str(sess["status"]) == "OPEN"
              est2 = _alumno(students, "Ben Dos")
              o2 = tl.next_objective(est2["student_id"])
              rf = tl.record_attempt(o2["objective_id"],
                  correct=False)
              assert rf["difficulty"] == 1
              assert rf["streak"] == 0
              print("OK S-8: aciertos suben nivel/racha (racha 3 COMPLETADO) + sesion sm_tutor_sessions sincronizada + error resetea racha sin bajar de 1")

          def test_s13_ruta_y_progreso(tmp_path) -> None:
              db, clock, students, nf, la, tl, lp = _base(tmp_path)
              est = _alumno(students)
              nf.record_note(student_id=est["student_id"],
                  subject="LENGUA", period="P1", score="5.00")
              nf.record_note(student_id=est["student_id"],
                  subject="MATEMATICAS", period="P1", score="8.50")
              p = lp.build_path(est["student_id"])
              assert p["total_steps"] == 6
              assert p["by_subject"]["LENGUA"]["base"] == 2
              assert p["by_subject"]["MATEMATICAS"]["base"] == 3
              assert p["by_subject"]["LENGUA"]["steps"] == [2, 3, 4]
              pr0 = lp.progress(est["student_id"])
              assert pr0["total"] == 6
              assert pr0["completed"] == 0
              assert pr0["pct"] == "0.00"
              assert pr0["next_step"]["subject"] == "LENGUA"
              assert pr0["next_step"]["step_no"] == 1
              first = db.query_one(
                  "SELECT path_id FROM sm_learning_paths WHERE"
                  " student_id = ? AND subject = 'LENGUA' AND"
                  " step_no = 1", (est["student_id"],))
              lp.complete_step(str(first["path_id"]))
              pr1 = lp.progress(est["student_id"])
              assert pr1["completed"] == 1
              assert pr1["pct"] == "16.67"
              assert pr1["next_step"]["subject"] == "LENGUA"
              assert pr1["next_step"]["step_no"] == 2
              print("OK S-13: ruta 3 pasos/materia con base del promedio real + progreso Decimal 2d + siguiente paso ordenado")
              with pytest.raises(KeyError):
                  lp.complete_step("NO-EXISTS")

          def test_s13_ruta_general_sin_notas(tmp_path) -> None:
              db, clock, students, nf, la, tl, lp = _base(tmp_path)
              est = _alumno(students, "Sin Notas")
