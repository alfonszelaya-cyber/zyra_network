                      (did, str(inc_id), str(res_id),
                       str(at)))
                  db.execute(
                      "UPDATE ax_em_incidents SET status ="
                      " 'despachado' WHERE inc_id = ?",
                      (str(inc_id),))
                  db.execute(
                      "UPDATE ax_em_resources SET status ="
