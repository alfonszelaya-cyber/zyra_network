          function labHeaders(){return {"Content-Type":"application/json","X-ZYRA-ZID":document.body.dataset.zid,"X-ZYRA-ROLES":document.body.dataset.roles}}
          function labParseObjetos(txt){return txt.split("\n").map(function(l){return l.trim()}).filter(Boolean).map(function(l){const p=l.split("|").map(function(s){return s.trim()});const capa=p[p.length-1];const esCapa=(capa==="fondo"||capa==="medio"||capa==="frente");function base(o){if(esCapa){o.capa=capa}return o}if(p[0]==="rect"){return base({forma:"rect",color:p[1]||"#2563EB",x:parseFloat(p[2])||0,y:parseFloat(p[3])||0,w:parseFloat(p[4])||80,h:parseFloat(p[5])||40})}if(p[0]==="circle"){return base({forma:"circle",color:p[1]||"#059669",cx:parseFloat(p[2])||100,cy:parseFloat(p[3])||100,r:parseFloat(p[4])||30})}if(p[0]==="texto"){return base({forma:"texto",color:p[1]||"#E2E8F0",x:parseFloat(p[2])||20,y:parseFloat(p[3])||40,contenido:(p[4]||"")})}return null}).filter(Boolean)}
          function labVerBlob(imgId, blob){const img=document.getElementById(imgId);if(img){img.src=URL.createObjectURL(blob);img.style.display="block"}}
          async function labEnviar(ev){ev.preventDefault();const f=ev.target;const cuerpo={titulo:f.titulo.value,descripcion:f.descripcion.value,tipo:f.tipo.value};const r=await fetch("/laboratorio/api/v1/projects",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
