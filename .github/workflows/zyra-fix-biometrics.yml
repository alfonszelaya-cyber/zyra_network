name: ZYRA S3 auditoria completa de rutas y despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography
      - name: Auditoria
        run: |
          python3 - <<'PYEOF'
          import json, os, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          OUT = []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 's3.md').write_text('\n'.join(OUT), encoding='utf-8')
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  with urllib.request.urlopen(q, timeout=25) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, str(e)
          t_sp = (ROOT / 'superapp.py').read_text(encoding='utf-8', errors='replace')
          add('# S3 - AUDITORIA DE RUTAS Y DESPLIEGUE')
          add('')
          add('## R1. En el CODIGO del repo (superapp.py)')
          add('')
          rutas_repo = {
              '/registro/nuevo': 'if path == "/registro/nuevo":' in t_sp,
              '/registro': '        if path == "/registro":' in t_sp,
              '/version': '        if path == "/version"' in t_sp,
              '/inicio': '        if path == "/inicio"' in t_sp,
              '/subastas/permiso': '"/subastas/permiso"' in t_sp,
              '/entrar': '        if path == "/entrar"' in t_sp,
              '/verify': '        if path == "/verify"' in t_sp,
              'x-zyra-zid inyectado': 'x-zyra-zid' in t_sp,
              'biometrics_unavailable manejo': 'biometrics_unavailable' in t_sp,
          }
          for k, v in rutas_repo.items():
              add('- %s: %s' % (k, 'OK' if v else 'FALTA'))
          add('')
          add('## R2. En el SERVIDOR LOCAL (simulando Render)')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                      'ZYRA_DATA_DIR': '/tmp/zs3', 'ZYRA_PORT': str(NP),
                      'SUPERAPP_DATA_DIR': '/tmp/ss3', 'PORT': str(PS),
                      'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                      'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          tv = time.time()
          while time.time() - tv < 40:
              if proc.poll() is not None:
                  break
              st, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2 if 'env2' in dir() else env,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              tv = time.time()
              while time.time() - tv < 70:
                  if sp.poll() is not None:
                      break
                  st, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s' % (vivo, spv))
          if spv:
              H = {'Content-Type': 'application/json'}
              pruebas = [
                  ('POST /registro/nuevo', BSP + '/registro/nuevo',
                   json.dumps({'nombre': 'Test', 'clave': 'clave12345', 'doc_image_b64': 'dA==', 'selfie_image_b64': 'dA=='}).encode()),
                  ('GET /version', BSP + '/version', None),
                  ('GET /registro', BSP + '/registro', None),
                  ('GET /', BSP + '/', None),
                  ('POST /subastas/permiso', BSP + '/subastas/permiso',
                   json.dumps({'zid': 'Z-TEST', 'clave': 'x'}).encode()),
              ]
              for nombre, url, cuerpo in pruebas:
                  metodo = 'POST' if cuerpo else 'GET'
                  q = urllib.request.Request(url, data=cuerpo, method=metodo)
                  q.add_header('Content-Type', 'application/json')
                  try:
                      with urllib.request.urlopen(q, timeout=15) as r:
                          st2, cu2 = r.status, r.read().decode('utf-8', 'replace')
                  except urllib.error.HTTPError as e:
                      st2, cu2 = e.code, e.read().decode('utf-8', 'replace')
                  except Exception as e:
                      st2, cu2 = None, str(e)[:100]
                  add('- %s -> HTTP %s | %s' % (nombre, st2, cu2[:180]))
          else:
              add('- sistema no arranco localmente')
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('')
          add('## R3. Lo que hay que verificar en RENDER (tu parte)')
          add('')
          add('1. Entra a Render → servicio **zyra-superapp**')
          add('2. Mira el último deploy: ¿dice **Live** o **Failed**?')
          add('3. Si dice Failed → el deploy uso codigo viejo. Haz Manual Deploy → Deploy latest commit')
          add('4. Cuando este **Live**, prueba el registro de nuevo')
          add('')
          add('## R4. Sobre el tamaño de las fotos')
          add('')
          add('- Si las fotos pesan mas de 1MB total, Render puede cortar la conexion.')
          add('- La compresion del D30b esta aplicada (900px, selfie 0.6).')
          add('- Si el error sigue siendo Failed to fetch con fotos reales,')
          add('  el problema es el tamano del body en Render.')
          escribe()
          print('S3 OK')
          PYEOF
