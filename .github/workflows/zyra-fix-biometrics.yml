name: ZYRA AXIS Phase5 Block B

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write outbox bridge
        run: |
          cat > apps/axis/life_history/outbox_bridge.py <<'BEOF'
          """AXIS Life History -> Network Outbox bridge.

          Phase 5B: real events. Emits life-history
          milestones as network events through the Outbox
          (transactional, durable, consumable by any
          component without coupling).

          Offline-safe: emissions are recorded locally
          and retried; a life event is never lost because
          the outbox was unreachable.

          Emits:
          - life.birth.registered
          - life.zid.biometric_upgrade
          - life.health.event
          - life.justice.event
          - life.security.event
          """
          from __future__ import annotations

          import unittest

          EVENT_TYPES = (
              "life.birth.registered",
              "life.zid.biometric_upgrade",
              "life.health.event",
              "life.justice.event",
              "life.security.event",
          )

          _EVENT_TO_LIFE = {
              "birth_registered": (
                  "life.birth.registered"
              ),
              "zid_biometric_upgrade": (
                  "life.zid.biometric_upgrade"
              ),
              "health_exam": "life.health.event",
              "health_result": "life.health.event",
              "health_appointment": (
                  "life.health.event"
              ),
              "justice_case": "life.justice.event",
              "justice_status": "life.justice.event",
              "security_incident": (
                  "life.security.event"
              ),
              "security_status": (
                  "life.security.event"
              ),
          }


          class OutboxBridge:
              """Mirrors life events to the network outbox."""

              def __init__(
                  self,
                  *,
                  life: LifeHistoryLike,
                  outbox,
                  clock,
              ) -> None:
                  self._life = life
                  self._outbox = outbox
                  self._clock = clock

              def sync_pending(self) -> dict:
                  """Scans every life event and emits the
                  missing network events. Idempotent: an
                  event is emitted once (tracked by
                  event_id). Returns counts."""
                  emitted = 0
                  skipped = 0
                  rows = (
                      self._life._store._db.query_all(
                          "SELECT event_id, person_id,"
                          " event_type, detail,"
                          " occurred_at FROM life_events"
                          " ORDER BY occurred_at, rowid"
                      )
                  )
                  for row in rows:
                      event_id = str(
                          row["event_id"]
                      )
                      already = (
                          self._life._store._db.query_one(
                              "SELECT 1 FROM"
                              " life_outbox_sent WHERE"
                              " event_id = ?",
                              (event_id,),
                          )
                      )
                      if already is not None:
                          skipped += 1
                          continue
                      etype = str(
                          row["event_type"]
                      )
                      network_type = (
                          _EVENT_TO_LIFE.get(etype)
                      )
                      if network_type is None:
                          continue
                      try:
                          self._outbox.enqueue(
                              type(
                                  "E",
                                  (),
                                  {
                                      "event_id": event_id,
                                      "event_type": network_type,
                                      "aggregate_id": str(
                                          row["person_id"]
                                      ),
                                      "schema_version": 1,
                                      "envelope_version": 1,
                                      "timestamp": float(
                                          row[
                                              "occurred_at"
                                          ]
                                      ),
                                      "payload": {
                                          "detail": str(
                                              row[
                                                  "detail"
                                              ]
                                              or ""
                                          ),
                                          "source": "axis",
                                      },
                                      "fingerprint": event_id,
                                  },
                              )()
                          )
                          emitted += 1
                      except Exception:
                          continue
                      self._life._store._db.execute(
                          "INSERT INTO life_outbox_sent"
                          " (event_id, sent_at)"
                          " VALUES (?, ?)",
                          (
                              event_id,
                              self._clock.now(),
                          ),
                      )
                  return {
                      "emitted": emitted,
                      "skipped": skipped,
                  }


          class LifeHistoryLike:
              pass


          class _OutboxBridgeTests(unittest.TestCase):
              def _boot(self, outbox_ok=True):
                  from apps.axis.infrastructure.persistence.axis_store import (
                      AxisStore,
                  )

                  db = SQLiteAdapter(":memory:")
                  clock = SystemClock()
                  life = LifeHistoryService(
                      store=LifeHistoryStore(db, clock),
                      client=_FakeNet(),
                  )
                  birth = (
                      life.register_birth_with_network(
                          registrar_account=(
                              "AX-reg-1"
                          ),
                          child_name="Bebe Outbox",
                          birth_date="2025-01-15",
                          birth_place="San Salvador",
                          sex="F",
                          mother_name="Madre O",
                          mother_zid="ZID-mother-ob",
                      )
                  )
                  person_id = str(
                      birth["person_id"]
                  )
                  life._store.add_life_event(
                      person_id,
                      actor="AX-doc-1",
                      event_type="health_exam",
                      detail="EXM-1: sangre",
                  )
                  outbox = _FakeOutbox(
                      working=outbox_ok
                  )
                  bridge = OutboxBridge(
                      life=life,
                      outbox=outbox,
                      clock=clock,
                  )
                  return (
                      life,
                      bridge,
                      outbox,
                      person_id,
                  )

              def test_events_reach_outbox(self) -> None:
                  life, bridge, outbox, _pid = (
                      self._boot()
                  )
                  result = bridge.sync_pending()
                  self.assertGreaterEqual(
                      2, result["emitted"]
                  )
                  self.assertEqual(
                      2, len(outbox.enqueued)
                  )
                  kinds = [
                      e.event_type
                      for e in outbox.enqueued
                  ]
                  self.assertIn(
                      "life.birth.registered", kinds
                  )
                  self.assertIn(
                      "life.health.event", kinds
                  )

              def test_sync_is_idempotent(self) -> None:
                  life, bridge, outbox, _pid = (
                      self._boot()
                  )
                  first = bridge.sync_pending()
                  second = bridge.sync_pending()
                  self.assertEqual(
                      0, second["emitted"]
                  )
                  self.assertEqual(
                      len(outbox.enqueued),
                      first["emitted"],
                  )

              def test_outbox_down_no_loss(self) -> None:
                  life, bridge, outbox, _pid = (
                      self._boot(outbox_ok=False)
                  )
                  result = bridge.sync_pending()
                  self.assertEqual(
                      0, result["emitted"]
                  )
                  second = bridge.sync_pending()
                  self.assertGreater(
                      second["emitted"], 0
                  )


          class _FakeNet:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid == "ZID-mother-ob":
                      return (
                          True,
                          {"status": "ACTIVE"},
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-ob"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return False, None, "unknown"


          class _FakeOutbox:
              def __init__(self, working=True):
                  self.working = working
                  self.enqueued = []

              def enqueue(self, event):
                  if not self.working:
                      raise RuntimeError(
                          "outbox unreachable"
                      )
                  self.enqueued.append(event)


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          BEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/outbox_bridge.py').read()); print('outbox_bridge OK')"

      - name: Create bridge sent-table migration test
        run: |
          cat > apps/axis/life_history/tests/test_outbox_bridge.py <<'B2EOF'
          """Outbox bridge E2E tests."""
          from __future__ import annotations

          import unittest

          from apps.axis.life_history.outbox_bridge import (
              OutboxBridge,
              OutboxBridge as OB,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )

          from apps.axis.life_history.outbox_bridge import (
              _OutboxBridgeTests,
          )
          B2EOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_outbox_bridge.py').read()); print('test file OK')"

      - name: 1/3 Outbox bridge tests (run in-module suite)
        run: python -m unittest apps.axis.life_history.outbox_bridge -v 2>&1 || python -c "
          import unittest
          from apps.axis.life_history import outbox_bridge
          suite = unittest.TestLoader().loadTestsFromModule(outbox_bridge)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          "

      - name: 2/3 Life History regression
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q
          python -m apps.axis.life_history.tests.test_justice_service -q
          python -m apps.axis.life_history.tests.test_security_service -q
          python -m apps.axis.life_history.tests.test_ops_server -q
          python -m apps.axis.life_history.tests.test_clearance_ops -q
          python -m apps.axis.life_history.tests.test_concurrency_recovery -q
          python -m apps.axis.life_history.access_control -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "axis: outbox bridge - life events flow to network outbox transactionally, idempotent, offline-safe"
            git push
          fi
