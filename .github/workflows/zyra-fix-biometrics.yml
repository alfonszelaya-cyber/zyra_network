          print("OK traducciones")

          tpl = Path("apps/agro/assets/templates/page_base.py")
          assert tpl.parent.exists(), "carpeta templates no existe"
          if tpl.exists() and "render_page" in tpl.read_text(encoding="utf-8"):
              print("SKIP plantilla")
          else:
              content = textwrap.dedent('''\
                  """AGRO - plantilla base de pagina."""
                  PAGE_CSS = (
                      "body{font-family:system-ui,sans-serif;"
                      "background:#0d1117;color:#e6edf3;"
                      "display:flex;justify-content:center;"
                      "padding:20px;margin:0}"
