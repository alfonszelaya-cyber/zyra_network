                          " equipment_id TEXT PRIMARY"
                          " KEY,"
                          " producer_id TEXT NOT NULL,"
                          " kind TEXT NOT NULL,"
                          " identifier TEXT,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_infrastructure ("
                          " infra_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " kind TEXT NOT NULL,"
                          " location TEXT,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_valuations ("
                          " valuation_id TEXT PRIMARY"
                          " KEY,"
                          " producer_id TEXT NOT NULL,"
                          " asset_kind TEXT NOT NULL,"
                          " asset_id TEXT NOT NULL,"
                          " amount REAL NOT NULL,"
                          " currency TEXT NOT NULL,"
                          " actor TEXT NOT NULL,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_asset_log ("
                          " log_id INTEGER PRIMARY KEY"
                          " AUTOINCREMENT,"
                          " producer_id TEXT NOT NULL,"
                          " asset_kind TEXT NOT NULL,"
                          " asset_id TEXT NOT NULL,"
                          " action TEXT NOT NULL,"
                          " detail TEXT NOT NULL DEFAULT"
                          " '',"
                          " actor TEXT NOT NULL,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_climate_events ("
                          " event_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " event_type TEXT NOT NULL,"
                          " severity TEXT NOT NULL,"
                          " alert INTEGER NOT NULL,"
                          " detail TEXT NOT NULL DEFAULT"
                          " '',"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_alerts ("
                          " alert_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " risk_type TEXT NOT NULL,"
                          " severity TEXT NOT NULL,"
                          " target TEXT NOT NULL,"
                          " detail TEXT NOT NULL DEFAULT"
                          " '',"
                          " status TEXT NOT NULL,"
                          " resolution TEXT,"
                          " created_at TEXT,"
                          " resolved_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_responses ("
                          " response_id TEXT PRIMARY"
                          " KEY,"
                          " producer_id TEXT NOT NULL,"
                          " risk_id TEXT NOT NULL,"
                          " actions TEXT NOT NULL,"
                          " status TEXT NOT NULL,"
                          " created_at TEXT,"
                          " updated_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_incidents_plus ("
                          " incident_id TEXT PRIMARY"
                          " KEY,"
                          " producer_id TEXT NOT NULL,"
                          " unit_id TEXT, kind TEXT NOT"
                          " NULL,"
                          " severity TEXT NOT NULL,"
                          " detail TEXT, status TEXT NOT"
                          " NULL,"
                          " escalated INTEGER NOT NULL"
                          " DEFAULT 0,"
                          " action TEXT, resolved_at"
                          " TEXT,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_risk_evals ("
                          " eval_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " kind TEXT NOT NULL,"
                          " ratio REAL,"
                          " level TEXT,"
                          " created_at TEXT)",
                      )),
                      (6, "outbox_ecosistema", (
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_event_outbox ("
                          " event_key TEXT PRIMARY KEY,"
                          " event_type TEXT NOT NULL,"
                          " payload TEXT NOT NULL,"
                          " zid TEXT,"
                          " status TEXT NOT NULL,"
                          " attempts INTEGER NOT NULL"
                          " DEFAULT 0,"
                          " last_error TEXT,"
                          " created_at TEXT,"
                          " updated_at TEXT)",
                      )),
                  )


                  def run_agro_migrations(db):
                      """Aplica migraciones en orden;
                      idempotente."""
                      db.execute(
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_migrations_applied ("
                          " version INTEGER PRIMARY KEY,"
                          " name TEXT NOT NULL,"
                          " applied_at TEXT)"
                      )
                      aplicadas = []
                      for name in (
                          "query_all", "query", "fetchall"
                      ):
                          fn = getattr(db, name, None)
                          if callable(fn):
                              try:
                                  got = fn(
                                      "SELECT version FROM"
                                      " agro_migrations_applied"
                                      " ORDER BY version"
                                  )
                              except Exception:
                                  got = None
                              if got:
                                  for r in got:
                                      try:
                                          aplicadas.append(
                                              int(r["version"])
                                          )
                                      except Exception:
                                          try:
                                              aplicadas.append(
                                                  int(r[0])
                                              )
                                          except Exception:
                                              pass
                                  break
                      import time as _t
                      ts = _t.strftime(
                          "%Y-%m-%dT%H:%M:%SZ", _t.gmtime()
                      )
                      nuevas = []
                      for version, name, sqls in MIGRATIONS:
                          if version in aplicadas:
                              continue
                          for sql in sqls:
                              db.execute(sql)
                          db.execute(
                              "INSERT INTO"
                              " agro_migrations_applied ("
                              " version, name, applied_at)"
                              " VALUES (?, ?, ?)",
                              (version, name, ts),
                          )
                          nuevas.append(version)
                      return {
                          "applied_now": nuevas,
                          "total_versions": len(
                              MIGRATIONS
                          ),
                      }
              ''')
              compile(content, str(mp), "exec")
              mp.write_text(content, encoding="utf-8")
          assert "run_agro_migrations" in mp.read_text(encoding="utf-8")
          print("OK migraciones en disco")
          MGEOF

      - name: "Paso 2 - assets reales (traducciones + plantilla)"
        run: |
          python3 - <<'ASEOF'
          import textwrap
          from pathlib import Path

          tr = Path("apps/agro/assets/translations/es.py")
          assert tr.parent.exists(), "carpeta translations no existe"
          if tr.exists() and "TEXTOS" in tr.read_text(encoding="utf-8"):
              print("SKIP traducciones")
          else:
              content = textwrap.dedent('''\
                  """AGRO - textos oficiales de la interfaz.
                  Contrato de UI: los tests de aceptacion
                  verifican que aparecen en las pantallas."""
                  TEXTOS = {
