name: ZYRA D32 ruta registro restaurada con error visible

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  d32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: Restaurar /registro/nuevo
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          ROOT = Path.cwd()
          SPY = ROOT / 'superapp.py'
          t0 = SPY.read_text(encoding='utf-8', errors='replace')
          ANCLA = '        if path == "/verify":'
          n = t0.count(ANCLA)
          ya = '"/registro/nuevo"' in t0
          print('ancla /verify:', n, '| ruta ya presente:', ya)
          if ya:
              print('ya presente, sin cambios')
              raise SystemExit(0)
          if n != 1:
              raise SystemExit('ANCLA INVALIDA: %d' % n)
          REGN = '\n'.join([
          '        if path == "/registro/nuevo":',
          '            if not ZYRA_URL:',
          '                self._send(503, "application/json", json.dumps({"ok": False, "error": "Red no configurada en el servidor"}).encode())',
          '                return',
          '            largo = int(self.headers.get("Content-Length", 0) or 0)',
          '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
          '            try:',
          '                dd = json.loads(crudo or "{}")',
          '            except Exception:',
          '                dd = {}',
          '            nombre = str(dd.get("nombre", "")).strip()',
          '            clave = str(dd.get("clave", ""))',
          '            db64 = str(dd.get("doc_image_b64", ""))',
          '            sb64 = str(dd.get("selfie_image_b64", ""))',
          '            if len(nombre) < 3 or len(clave) < 8 or not db64 or not sb64:',
          '                self._send(400, "application/json", json.dumps({"ok": False, "error": "Falta nombre, clave (min 8), documento o selfie"}).encode())',
          '                return',
          '            ok_r, dr, er = _SimpleClient(ZYRA_URL).post("/identity/enroll", {"kind": "person", "name": nombre, "display_name": nombre, "actor": os.environ.get("ZYRA_ENROLL_ACTOR", "superapp"), "doc_image_b64": db64, "selfie_image_b64": sb64})',
          '            if not ok_r:',
          '                er_l = str(er).lower()',
          '                if "biometrics_unavailable" in er_l or "face engine" in er_l or "not installed" in er_l:',
          '                    self._send(200, "application/json", json.dumps({"ok": False, "codigo": "mantenimiento", "error": "Biometria en mantenimiento. El motor facial se activara pronto en el servidor."}).encode())',
          '                    return',
          '                self._send(502, "application/json", json.dumps({"ok": False, "error": "La Red responde: " + str(er)[:250]}).encode())',
          '                return',
          '            zid = ""',
          '            if isinstance(dr, dict):',
          '                dx = dr.get("data") or dr',
          '                if isinstance(dx, dict):',
          '                    zid = str(dx.get("zid") or dx.get("identity_id") or dx.get("id") or "")',
          '            if not zid:',
          '                self._send(500, "application/json", json.dumps({"ok": False, "error": "La Red no devolvio ZID"}).encode())',
          '                return',
          '            import secrets as _sc, hashlib as _hs, sqlite3 as _sq',
          '            sal = _sc.token_hex(16)',
          '            hc = _hs.sha256((sal + clave).encode()).hexdigest()',
          '            con = _sq.connect(str(DATA_DIR / "credenciales.db"))',
          '            con.execute("CREATE TABLE IF NOT EXISTS credenciales (zid TEXT PRIMARY KEY, sal TEXT, hash TEXT)")',
          '            con.execute("INSERT OR REPLACE INTO credenciales VALUES (?, ?, ?)", (zid, sal, hc))',
          '            con.commit()',
          '            con.close()',
          '            self._send(200, "application/json", json.dumps({"ok": True, "zid": zid}).encode())',
          '            return',
          '',
          ])
          p = t0.find(ANCLA)
          t0 = t0[:p] + REGN + t0[p:]
          SPY.write_text(t0, encoding='utf-8')
          print('ruta restaurada')
          import py_compile
          py_compile.compile(str(SPY), doraise=True)
          print('compila OK')
          PYEOF
      - name: Mejorar mensaje de error en registro.html
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          REG = Path('portal') / 'registro.html'
          t = REG.read_text(encoding='utf-8', errors='replace')
          VIEJO = 'catch(e){R.innerHTML="<p style=\'color:#f85149\'>La Red no respondio ("+e+"). Intenta de nuevo.</p>";}'
          NUEVO = 'catch(e){R.innerHTML="<div style=\'background:#2a1414;border:1px solid #f85149;border-radius:12px;padding:14px\'><p style=\'color:#f85149;font-weight:700\'>La Red no respondio</p><p>Detalle tecnico: "+e+"</p><p style=\'color:#8b949e\'>Este detalle es lo que hay que enviar para corregirlo.</p></div>";}'
          if VIEJO in t:
              t = t.replace(VIEJO, NUEVO, 1)
              REG.write_text(t, encoding='utf-8')
              print('mensaje de error mejorado')
          else:
              print('mensaje ya mejorado o no encontrado')
          t2 = REG.read_text(encoding='utf-8', errors='replace')
          m = t2.find('body:JSON.stringify({nombre:')
          print('envio existe:', m > -1)
          PYEOF
      - name: Commit SIEMPRE
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal/registro.html
          git commit -m "fix(D32): /registro/nuevo restaurada + error tecnico visible" || echo "sin cambios"
          git push
          echo "## Ruta restaurada - espera deploy y prueba" >> "$GITHUB_STEP_SUMMARY"
