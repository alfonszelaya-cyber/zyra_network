name: "AUDIT sweep: ver el interior paso a paso (que hace cada endpoint con el index)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Diagnostico paso a paso del sweep"
        run: |
          python3 - <<'DEOF'
          import json, tempfile
          from pathlib import Path
          from shared_engines.integrations.engine import (
              PublicSourceClient, SourceIndex,
              sweep_onec, sweep_marn, ONEC_ENDPOINTS)
          from shared_engines.common.clocks import SystemClock
          from shared_engines.storage.database import SQLiteAdapter

          print("=== 1. el import esta? ===")
          src = Path("shared_engines/integrations/engine.py").read_text()
          print("import serialization presente:",
                "from shared_engines.common.serialization import" in src)
          print("is (not presente:", "is (not" in src)

          print()
          print("=== 2. sweep_onec PASO A PASO con reloj REAL ===")
          tmp = Path(tempfile.mkdtemp())
          one = json.dumps([{"codigo": "0111101"}]).encode()
          def opener(url):
              print("   fetch:", url[:90])
              return one
          cli = PublicSourceClient(clock=SystemClock(), ttl_seconds=60.0, opener=opener)
          index = SourceIndex(SQLiteAdapter(tmp / "s.db"), SystemClock())
          for ep in ONEC_ENDPOINTS:
              url = ("https://onec.bcr.gob.sv/clasificadoresv2.api" + ep)
              body, stale = cli.fetch(url)
              resumen = {"kind": "json", "items": 1,
                         "sha256": __import__("hashlib").sha256(body).hexdigest()}
              index.record(source_id="onec-classifiers",
                           url=url, sha256=resumen["sha256"],
                           summary=resumen)
              print("   record OK:", ep)
          rows = index._db.query_all("SELECT * FROM source_snapshots")
          print("   filas despues de ONEC manual:", len(rows))

          print()
          print("=== 3. sweep_onec FUNCION completa (con reloj real) ===")
          r1 = sweep_onec(cli, index)
          print("r1:", json.dumps({k: v for k, v in r1.items() if k != "endpoints"}, default=str))
          for e in r1["endpoints"][:3]:
              print("   ", json.dumps({k: v for k, v in e.items() if k != "summary"}, default=str)[:200])
          rows = index._db.query_all("SELECT * FROM source_snapshots")
          print("   filas totales:", len(rows))

          print()
          print("=== 4. sweep_marn FUNCION (solo 1 servicio, 1 capa) ===")
          r2 = sweep_marn(cli, index,
              max_layers_per_service=1, pause_seconds=0)
          print("r2 resumen:", json.dumps({k: v for k, v in r2.items() if k != "results"}, default=str))
          for e in r2["results"][:4]:
              print("   ", json.dumps(e, default=str)[:220])
          rows = index._db.query_all("SELECT * FROM source_snapshots")
          print("   filas totales:", len(rows))
          DEOF
