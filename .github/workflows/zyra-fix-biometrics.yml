          aser(simNombres("JOSE PACHECO","CALIFORNIA DRIVER LICENSE\nLN 12-3456789\nSALINAS PADILLA\nFN MARIA ISABEL\nLOS ANGELES CA") < 0.6, "nombre ajeno contra OCR largo sigue bloqueando");

          /* 5. familia del documento (OCR) */
          aser(familiaDoc("DOCUMENTO UNICO DE IDENTIDAD EL SALVADOR") === "dui", "familia dui");
          aser(familiaDoc("CALIFORNIA DRIVER LICENSE DMV") === "licencia", "familia licencia");
          aser(familiaDoc("CALIFORNIA DRIVER LICENSE") !== "dui", "licencia CA no es dui");
          aser(familiaDoc("PASAPORTE DE MEXICO PASSPORT MX") === "pasaporte", "familia pasaporte");
          aser(familiaDoc("EMPLOYMENT AUTHORIZATION DOCUMENT USA") === "id_usa", "familia EAD");
          aser(familiaDoc("") === "", "OCR vacio sin familia");

          /* 6. familia del tipo seleccionado (incluye el arreglo EAD y Permiso de v5) */
          aser(familiaTipo("DUI El Salvador (2 lados)") === "dui", "tipo dui seleccionado");
          aser(familiaTipo("Pasaporte (1 lado)") === "pasaporte", "tipo pasaporte seleccionado");
          aser(familiaTipo("Licencia de conducir (2 lados)") === "licencia", "tipo licencia seleccionado");
          aser(familiaTipo("ID de estado / EAD USA (2 lados)") === "id_usa", "tipo EAD USA ahora se mapea (v5 devolvia vacio)");
          aser(familiaTipo("Permiso legal / otro documento") === "otro", "tipo Permiso legal ahora se mapea (v5 devolvia vacio)");

          /* 7. gate de tipo de documento: el bug reportado (DUI seleccionado, licencia capturada) */
          aser(tipoDistinto("licencia","dui") === true, "DUI seleccionado + licencia capturada se detecta como distinto");
          aser(tipoDistinto("dui","dui") === false, "mismo tipo pasa");
          aser(tipoDistinto("licencia","otro") === false, "Permiso legal/otro no bloquea ningun documento");
          aser(tipoDistinto("","dui") === false, "sin familia OCR no bloquea (fail-open)");

          /* 8. biometria */
          aser(distEucl(vec128(0), vec128(0)) === 0, "distancia de vectores iguales es 0");
          aser(levd("AB","ABCD") === 2, "levd longitudes distintas");
          aser(distEucl(vec128(0), vec128(0.06)) > 0.6, "distancia del caso rechazable mayor al umbral");
          aser(decidirBio(vec128(0), vec128(0.04)).bloquea === false, "rostro similar pasa (dist ~0.45)");
          aser(decidirBio(vec128(0), vec128(0.06)).bloquea === true, "rostro distinto bloquea (dist ~0.68)");
          aser(distEucl(vec128(0), vec128(0).slice(0,64)) === -1, "vectores de longitud distinta dan -1");

