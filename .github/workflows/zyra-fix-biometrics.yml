name: "RED-RELAY paso 2: scheduler autonomo del cartero (la Red distribuye sola) + test de distribucion sin intervencion"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - combined_api.py: RelayScheduler (daemon: drena el bridge cada N segundos, nunca muere) + serve_combined con bridge opcional"
        run: |
          python3 - <<'SEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/runtime/combined_api.py")
          t = p.read_text(encoding="utf-8")
          if "class RelayScheduler" in t:
              print("SKIP A (scheduler ya presente)")
              raise SystemExit(0)
          SCHED = textwrap.dedent('''\


              import threading


              class RelayScheduler:
                  """AX-RELAY: daemon que drena el
                  cartero de la Red cada N segundos.
                  La Red distribuye sus eventos SOLA,
                  sin que nadie la empuje (la energia
                  siempre conectada). Nunca muere por
                  un fallo de relay: lo reintenta en
                  el proximo tick."""

                  def __init__(
                      self,
                      *,
                      bridge,
                      interval_seconds: float = (
                          30.0),
                  ) -> None:
                      self._bridge = bridge
                      self._interval = max(
                          0.2,
                          float(interval_seconds))
                      self._stop_event = (
                          threading.Event())
                      self._thread = (
                          threading.Thread(
                              target=self._loop,
                              daemon=True,
                              name="zyra-relay"))

                  def _loop(self) -> None:
                      while not (
                          self._stop_event.wait(
                              self._interval)
                      ):
                          try:
                              self._bridge.relay()
                          except Exception:
                              pass

                  def start(self) -> None:
                      self._thread.start()

                  def stop(self) -> None:
                      self._stop_event.set()
                      self._thread.join(timeout=5)
          ''')
          t = (t.rstrip("\n") + "\n" + SCHED.rstrip("\n") + "\n")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK A: RelayScheduler (AST valido)")
          SEOF

      - name: "Paso B - serve_combined con bridge opcional (reemplazo exacto; compatibilidad total)"
        run: |
          python3 - <<'WEOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/runtime/combined_api.py")
          t = p.read_text(encoding="utf-8")
          VIEJO = (
              "def serve_combined(\n"
              "    kernel: ZyraKernel,\n"
              "    caps: ZyraCapabilities,\n"
              "    *,\n"
              "    host: str,\n"
              "    port: int,\n"
              ") -> ThreadingHTTPServer:\n"
              '    """Bind both surfaces to one server."""\n'
              "    CombinedHandler.kernel = kernel\n"
              "    CombinedHandler.caps = caps\n"
              "    return ThreadingHTTPServer(\n"
              "        (host, port), CombinedHandler\n"
              "    )\n"
          )
          NUEVO = (
              "def serve_combined(\n"
              "    kernel: ZyraKernel,\n"
              "    caps: ZyraCapabilities,\n"
              "    *,\n"
              "    host: str,\n"
              "    port: int,\n"
              "    bridge=None,\n"
              "    relay_interval: float = 30.0,\n"
              ") -> ThreadingHTTPServer:\n"
              '    """Bind both surfaces to one server.\n'
              "\n"
              "    AX-RELAY: si se entrega un bridge, la\n"
              "    Red distribuye sus eventos AUTONOMAMENTE\n"
              "    via scheduler daemon y cablea caps.bridge\n"
              '    para las rutas /bridge."""\n'
              "    CombinedHandler.kernel = kernel\n"
              "    CombinedHandler.caps = caps\n"
              "    if bridge is not None:\n"
              "        caps.bridge = bridge\n"
              "    server = ThreadingHTTPServer(\n"
              "        (host, port), CombinedHandler\n"
              "    )\n"
              "    if bridge is not None:\n"
              "        scheduler = RelayScheduler(\n"
              "            bridge=bridge,\n"
              "            interval_seconds=relay_interval,\n"
              "        )\n"
              "        scheduler.start()\n"
              "        server._zyra_relay_scheduler = (\n"
              "            scheduler\n"
              "        )\n"
              "    return server\n"
          )
          cnt = t.count(VIEJO)
          assert cnt == 1, (
              "bloque serve_combined hallado "
              + str(cnt) + " (esperaba 1)")
          t = t.replace(VIEJO, NUEVO, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK B: serve_combined con bridge +"
                " arranque automatico del scheduler"
                " (AST valido)")
          WEOF

      - name: "Paso C - verificacion dura: firma nueva + compatibilidad + clase viva"
        run: |
          python3 -c "
          import inspect
          from shared_engines.runtime.combined_api import (
              serve_combined, RelayScheduler)
          sig = inspect.signature(serve_combined)
          assert 'bridge' in sig.parameters
          assert 'relay_interval' in sig.parameters
          for m in ('start', 'stop', '_loop'):
              assert hasattr(RelayScheduler, m), m
          print('OK C: firma nueva + RelayScheduler vivo; llamadas sin bridge siguen identicas')
          "

      - name: "Paso D - test e2e: evento emitido se entrega SOLO (sin POST /bridge/relay de nadie)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          target = Path(
              "shared_engines/runtime/tests/"
              "test_capabilities_api.py")
          assert target.exists()
          t = target.read_text(encoding="utf-8")
          if "test_relay_autonomous_delivery" in t:
              print("SKIP D (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_relay_autonomous_delivery(
                  tmp_path,
              ) -> None:
                  """AX-RELAY: la Red distribuye SOLA.
                  Se emite un evento al outbox de la
                  Red y NADIE llama al relay por HTTP:
                  el scheduler daemon lo entrega al
                  suscriptor por si solo."""
                  import json as _json
                  import threading
                  import time as _time
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  from shared_engines.runtime.config import (
                      RuntimeConfig)
                  from shared_engines.runtime.kernel import (
                      ZyraKernel)
                  from shared_engines.runtime.capabilities import (
                      ZyraCapabilities)
                  from shared_engines.runtime.combined_api import (
                      serve_combined)
                  from shared_engines.verification.signatures import (
                      Ed25519Signer)
                  from shared_engines.events.outbox import (
                      Outbox, InterAppBridge)
                  from shared_engines.events.inbox import (
                      Inbox)
                  from shared_engines.events.contracts import (
                      EventCatalog)
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None))
                  kernel.bootstrap_root()
                  caps = ZyraCapabilities(
                      net_db, FrozenClock(),
                      identity=kernel.identity,
                      signer=signer)
                  red_db = SQLiteAdapter(
                      tmp_path / "red.db")
                  nexo_db = SQLiteAdapter(
                      tmp_path / "nexo.db")
                  clock = FrozenClock()
                  out_red = Outbox(red_db, clock)
                  out_red.ensure_schema()
                  cat = EventCatalog()
                  cat.register("agro.sale.created")
                  bridge = InterAppBridge(
                      db=red_db, clock=clock,
                      source=out_red)
                  recibidos = []
                  bridge.subscribe(
                      app_id="nexo",
                      event_types=(
                          "agro.sale.created",),
                      inbox=Inbox(nexo_db, clock),
                      handler=recibidos.append)
                  srv = serve_combined(
                      kernel, caps,
                      host="127.0.0.1", port=0,
                      bridge=bridge,
                      relay_interval=0.4)
                  try:
                      assert caps.bridge is bridge
                      ev = cat.build(
                          "agro.sale.created",
                          aggregate_id="S1",
                          payload={"total": 100},
                          clock=clock)
                      out_red.enqueue(ev)
                      limite = 6.0
                      inicio = _time.time()
                      while (len(recibidos) == 0
                             and (_time.time()
                                  - inicio)
                             < limite):
                          _time.sleep(0.1)
                      assert len(recibidos) == 1, (
                          "el scheduler NO entrego"
                          " el evento solo: "
                          + str(len(recibidos)))
                      assert (recibidos[0]
                              .event_type
                              == "agro.sale"
                              ".created")
                      print("OK AX-RELAY: la Red"
                            " distribuyo el evento"
                            " SOLA (sin intervencion)"
                            " - energia siempre"
                            " conectada")
                  finally:
                      sched = getattr(
                          srv,
                          "_zyra_relay_scheduler",
                          None)
                      if sched is not None:
                          sched.stop()
                      srv.shutdown()
                      srv.server_close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          target.write_text(t, encoding="utf-8")
          final = target.read_text(encoding="utf-8")
          assert "test_relay_autonomous_delivery" in final
          print("OK D: test distribucion autonoma (AST valido)")
          TSEOF

      - name: "Paso E - GATE Red (todas las llamadas existentes de serve_combined deben seguir pasando)"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -10

      - name: "Paso F - GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso G - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-RELAY"
            echo '```'
            python3 -m pytest shared_engines/runtime/tests -vv --tb=long 2>&1 | tail -70 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-RELAY: scheduler autonomo del cartero - la Red distribuye sus eventos sola" -m "La energia siempre conectada: RelayScheduler (daemon thread, Event-based stop, nunca muere por fallo de relay - reintenta en el proximo tick) anadido a combined_api.py. serve_combined ahora acepta bridge=None y relay_interval=30.0: si hay bridge, cablea caps.bridge (las rutas /bridge dejan el 503) y arranca el scheduler automaticamente. Compatibilidad total: todas las llamadas existentes sin bridge siguen identicas (33 tests runtime lo prueban). Test e2e: evento emitido al outbox de la Red se entrega al suscriptor SOLO por el scheduler, sin que nadie llame POST /bridge/relay - distribucion autonoma."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
