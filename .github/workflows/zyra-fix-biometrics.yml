                       "birth_place": "SS",
                       "sex": "F",
                       "mother_name":
                           "Madre Gov",
                       "mother_zid": zid_madre})
                  assert st == 200, html[:800]
                  baby = life._store._db.query_one(
                      "SELECT person_id, zid FROM"
                      " life_persons WHERE"
                      " full_name = 'Bebe Censo'")
                  assert baby is not None
                  assert baby["zid"], (
                      "bebe debe nacer con ZID"
                      " automatico")
                  st, body = _axz_json(
                      "GET",
                      base
                      + "/axis/api/audit/verify")
                  assert st == 200, str(body)
                  assert body["data"][
                      "births_chain"]["ok"] is True
                  st, body = _axz_json(
                      "GET",
                      base
                      + "/axis/api/gobierno/censo",
                      role="gobierno")
                  assert st == 200, str(body)
                  d = body["data"]
                  assert d[
                      "poblacion_registrada"] >= 1
                  assert d["con_zid"] >= 1
                  st, body = _axz_json(
                      "GET",
                      base
                      + "/axis/api/gobierno/censo",
                      role=None)
                  assert st == 403, "censo 403"
                  st, body = _axz_json(
                      "POST",
                      base
                      + "/axis/api/gobierno/ingesta",
                      {"registrar_account":
                           "AX-gob-x",
                       "child_name":
                           "Bebe Ingesta",
                       "birth_date":
