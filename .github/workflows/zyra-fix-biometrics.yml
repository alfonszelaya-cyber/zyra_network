name: "RED-RELAY v7: chequeo por IMPORT (no por nombre) + hardening AST + gates aislados"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Fix 1 - engine.py: import canonical_json_dumps (chequeo por el IMPORT, no por el nombre)"
        run: |
          python3 - <<'F1EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/integrations/engine.py")
          t = p.read_text(encoding="utf-8")
          if "from shared_engines.common.serialization import" in t:
              print("SKIP 1 (import ya presente)")
              raise SystemExit(0)
          ANCLA = "from shared_engines.storage.database import (\n    Database,\n)"
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla import " + str(cnt)
          t = t.replace(
              ANCLA,
              ANCLA + "\nfrom shared_engines.common.serialization import (\n    canonical_json_dumps,\n)",
              1,
          )
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 1: canonical_json_dumps IMPORTADO (chequeo por import, AST valido)")
          F1EOF

      - name: "Fix 2 - HARDENING via AST: ProfileRegistry asegura outbox schema"
        run: |
          python3 - <<'F2EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "self._outbox.ensure_schema()" in t:
              print("SKIP 2 (hardening ya presente)")
              raise SystemExit(0)
          tree = ast.parse(t)
          lineas = t.splitlines(keepends=True)
          objetivo = None
          for nodo in ast.walk(tree):
              if isinstance(nodo, ast.ClassDef) and nodo.name == "ProfileRegistry":
                  for item in nodo.body:
                      if isinstance(item, ast.FunctionDef) and item.name == "__init__":
                          for ln in range(item.lineno, item.end_lineno + 1):
                              if ".run(clock)" in lineas[ln - 1]:
                                  objetivo = ln
                                  break
                          if objetivo is None:
                              objetivo = item.end_lineno - 1
          assert objetivo is not None, "ProfileRegistry.__init__ no hallado via AST"
          lineas.insert(objetivo, "        self._outbox.ensure_schema()\n")
          nuevo = "".join(lineas)
          ast.parse(nuevo)
          p.write_text(nuevo, encoding="utf-8")
          print("OK 2: ensure_schema insertado via AST (linea "
                + str(objetivo) + ", imune al formato)")
          F2EOF

      - name: "Verificacion real: sweep con import real guarda 25 snapshots + network verdes"
        run: |
          python3 - <<'VEOF'
          import json
          from pathlib import Path
          import tempfile
          from shared_engines.integrations.engine import (
              PublicSourceClient, SourceIndex,
              sweep_onec, sweep_marn, ONEC_ENDPOINTS,
              ARCGIS_SERVICES)
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          tmp = Path(tempfile.mkdtemp())
          geo = json.dumps({"type": "FeatureCollection", "features": [{"type": "Feature"}, {"type": "Feature"}]}).encode("utf-8")
          meta = json.dumps({"layers": [{"id": 0, "name": "a"}, {"id": 1, "name": "b"}]}).encode("utf-8")
          one = json.dumps([{"codigo": "0111101"}]).encode("utf-8")
          def opener(url):
              if url.endswith("?f=json"):
                  return meta
              if "/query" in url:
                  return geo
              if url.endswith(tuple(ONEC_ENDPOINTS)):
                  return one
              raise OSError("no simulada")
          cli = PublicSourceClient(clock=FrozenClock(), ttl_seconds=60.0, opener=opener)
          index = SourceIndex(SQLiteAdapter(tmp / "src.db"), FrozenClock())
          r1 = sweep_onec(cli, index)
          assert r1["ok"] == 7, str(r1)
          r2 = sweep_marn(cli, index, max_layers_per_service=2, pause_seconds=0)
          assert r2["layers_ok"] == 2 * len(ARCGIS_SERVICES["marn-geo"]), str(r2)
          rows = index._db.query_all("SELECT * FROM source_snapshots")
          assert len(rows) == 7 + 2 * len(ARCGIS_SERVICES["marn-geo"]), ("rows=" + str(len(rows)))
          print("OK sweep REAL: " + str(len(rows)) + " snapshots durables (import funcionando)")
          VEOF
          python3 -m pytest shared_engines/network/tests -q --tb=short 2>&1 | tail -4

      - name: "GATE runtime AISLADO POR ARCHIVO (timeout 90s)"
        run: |
          set +e
          shopt -s nullglob
          FAIL=0
          for f in shared_engines/runtime/tests/test_*.py; do
            nombre=$(basename "$f" .py)
            timeout 90 python3 -m pytest "$f" -q --tb=line > "/tmp/rt_$nombre.txt" 2>&1
            CODE=$?
            if [ $CODE -eq 124 ]; then
              echo "HANG: $nombre (90s)"
              FAIL=1
            elif [ $CODE -ne 0 ]; then
              echo "FALLO: $nombre"
              tail -8 "/tmp/rt_$nombre.txt"
              FAIL=1
            else
              echo "VERDE: $nombre :: $(tail -1 /tmp/rt_$nombre.txt)"
            fi
          done
          echo "=============================="
          if [ $FAIL -ne 0 ]; then
            echo "GATE ROJO"
            exit 1
          fi
          echo "GATE runtime VERDE"
          exit 0

      - name: "GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-RELAY v7"
            shopt -s nullglob
            for f in /tmp/rt_*.txt; do
              echo
              echo "#### $f"
              tail -15 "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-RELAY v7: import canonical_json_dumps real + hardening outbox schema via AST" -m "Cadena de bugs resuelta: (1) el chequeo de idempotencia buscaba el NOMBRE canonical_json_dumps que ya aparecia en las LLAMADAS de SourceIndex.record -> SKIP falso -> el import nunca se aplicaba; ahora busca el IMPORT. (2) el contador ok de sweep_onec/sweep_marn incrementa ANTES de index.record, asi un fallo de record quedaba enmascarado (ok=7 con 0 snapshots) - con el import real el record funciona; el ajuste del contador queda para el proximo bloque de robustez. (3) network no-such-table: HARDENING raiz via AST - ProfileRegistry.__init__ llama self._outbox.ensure_schema() el mismo (insertado por posicion AST, imune al formato). (4) runtime HANG: gate dividido por archivo con timeout 90s -> Resumen muestra el culpable. Scheduler + rutas + test de distribucion autonoma ya en repo (idempotentes)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
