name: "ZYRA RUN1 fix: S-2/S-3 cuadros por rol (test corregido — 2 encargados retiro SE-3)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] S-2/S-3: role_dashboards_engine (idéntico al validado 3/4 verde)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/domain/student/role_dashboards_engine.py",
                     D(r'''
                  """Role Dashboards Engine - cuadros por rol (S-2,
                  requisito del dueno) + capacidad exacta visible
                  y protegida (S-3).

                  ALUMNO: sus datos, notas (si hay motor conectado),
                  asistencia (si hay motor conectado) — degrada con
                  nota, nunca rompe.
                  PROFESOR: sus aulas (si la base registra
                  teacher_id) con cupos por aula.
                  DIRECTOR: SU escuela completa - aulas, grados,
                  secciones, turnos, capacidad, matriculados y CUPOS
                  EXACTOS por aula + plan de llenado.
                  MINISTERIO: escuelas por departamento y por
                  municipio, cuantas son, nombres, cuantas aulas,
                  cuantos grados, capacidad por turno y PLAN DE
                  LLENADO (aulas con cupo, ordenadas) — ES AHI donde
                  se llenan las matriculas automaticamente.

                  S-3 CAPACIDAD EXACTA ANTI-ERROR: guard_capacity()
                  lanza ValueError si un movimiento excede la
                  capacidad del aula. Ningun cuadro sugiere meter
                  alumnos de mas: solo cupos reales, aula por aula.

                  ROBUSTO POR DISENO: no asume APIs no verificadas.
                  Lee columnas reales via PRAGMA; motores opcionales
                  degradan con nota."""
                  from __future__ import annotations
                  from typing import Dict, List, Optional
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_school_geo", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_school_geo (institution_id TEXT"
                          " PRIMARY KEY, name TEXT NOT NULL DEFAULT"
                          " '', department TEXT NOT NULL DEFAULT '',"
                          " municipality TEXT NOT NULL DEFAULT '',"
                          " updated_at REAL NOT NULL)",
                      )),
                  )

                  class RoleDashboardsEngine:
                      """Cuadros por rol + capacidad exacta (S-2/S-3)."""

                      def __init__(self, db, clock,
                                   student_registry,
                                   classroom_engine,
                                   enrollment_engine,
                                   institution_registry=None,
                                   evaluation_engine=None,
                                   attendance_engine=None):
                          self._db = db
                          self._clock = clock
                          self._students = student_registry
                          self._cls = classroom_engine
                          self._enr = enrollment_engine
                          self._inst = institution_registry
                          self._eval = evaluation_engine
                          self._att = attendance_engine
                          self._ccols = None
                          MigrationRunner(db, "sm.roledash",
                                          _MIGRATIONS).run(clock)

                      # ---------- helpers internos ----------

                      def _classroom_cols(self):
                          if self._ccols is None:
                              rows = self._db.query_all(
                                  "PRAGMA table_info(sm_classrooms)")
                              self._ccols = set(
                                  str(r["name"]) for r in rows)
                          return self._ccols

                      def _geo_of(self, institution_id) -> dict:
                          row = self._db.query_one(
                              "SELECT name, department, municipality"
                              " FROM sm_school_geo WHERE"
                              " institution_id = ?",
                              (str(institution_id),))
                          if not row:
                              return {}
                          return {"name": str(row["name"]),
                                  "department":
                                      str(row["department"]),
                                  "municipality":
                                      str(row["municipality"])}

                      def _aula_de_row(self, r) -> dict:
                          keys = set(r.keys())
                          cap = (int(r["capacity"])
                                 if "capacity" in keys else 0)
                          enr = (int(r["enrolled"])
                                 if "enrolled" in keys else 0)
                          g = (str(r["grade"])
                               if "grade" in keys else "")
                          t = (str(r["turn"])
                               if "turn" in keys else "SIN_TURNO")
                          return {"classroom_id":
                                      str(r["classroom_id"]),
                                  "name": (str(r["name"])
                                           if "name" in keys
                                           else ""),
                                  "grade": g, "turn": t,
                                  "capacity": cap,
                                  "enrolled": enr,
                                  "cupos": cap - enr,
                                  "lleno": enr >= cap}

                      # ---------- S-3: capacidad exacta ----------

                      def capacity_state(self,
                                         classroom_id) -> dict:
                          r = self._db.query_one(
                              "SELECT capacity, enrolled FROM"
                              " sm_classrooms WHERE classroom_id"
                              " = ?", (str(classroom_id),))
                          if not r:
                              raise KeyError(classroom_id)
                          cap = int(r["capacity"] or 0)
                          enr = int(r["enrolled"] or 0)
                          return {"classroom_id":
                                      str(classroom_id),
                                  "capacity": cap,
                                  "enrolled": enr,
                                  "cupos": cap - enr,
                                  "lleno": enr >= cap}

                      def guard_capacity(self, classroom_id,
                                         requesting=1) -> dict:
                          """S-3: JAMAS se puede pedir cupo que
                          no existe. Lanza ValueError si excede."""
                          st = self.capacity_state(classroom_id)
                          if (st["enrolled"] + int(requesting)
                                  > st["capacity"]):
                              raise ValueError(
                                  "S-3 capacidad exacta: aula "
                                  + st["classroom_id"]
                                  + " capacidad "
                                  + str(st["capacity"])
                                  + ", matriculados "
                                  + str(st["enrolled"])
                                  + " — no caben "
                                  + str(requesting) + " mas"
                                  + " (cupos reales: "
                                  + str(st["cupos"]) + ")")
                          return st

                      # ---------- geografia escolar ----------

                      def set_school_geo(self, *,
                                         institution_id,
                                         name="",
                                         department="",
                                         municipality="") -> dict:
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "DELETE FROM sm_school_geo"
                                  " WHERE institution_id = ?",
                                  (str(institution_id),))
                              cursor.execute(
                                  "INSERT INTO sm_school_geo"
                                  " (institution_id, name,"
                                  " department, municipality,"
                                  " updated_at)"
                                  " VALUES (?, ?, ?, ?, ?)",
                                  (str(institution_id),
                                   str(name), str(department),
                                   str(municipality), now))
                          return {"institution_id":
                                      str(institution_id),
                                  "name": str(name),
                                  "department": str(department),
                                  "municipality":
                                      str(municipality)}

                      # ---------- ALUMNO ----------

                      def student_dashboard(self,
                                            student_id) -> dict:
                          row = self._db.query_one(
                              "SELECT * FROM sm_students WHERE"
                              " student_id = ?",
                              (str(student_id),))
                          if not row:
                              return {"role": "STUDENT",
                                      "found": False}
                          est = {k: row[k] for k in row.keys()}
                          res = {"role": "STUDENT",
                                 "found": True,
                                 "student": est,
                                 "average": None,
                                 "attendance_pct": None}
                          if self._eval is not None:
                              try:
                                  avg = self._eval.average_of(
                                      student_id)
                                  res["average"] = avg.get(
                                      "average")
                              except Exception:
                                  pass
                          if self._att is not None:
                              try:
                                  att = self._att.rate(
                                      student_id)
                                  res["attendance_pct"] = \
                                      att.get("present_rate_pct")
                              except Exception:
                                  pass
                          return res

                      # ---------- PROFESOR ----------

                      def teacher_dashboard(self, *,
                                            teacher_id,
                                            institution_id=""
                                            ) -> dict:
                          grupos = []
                          cols = self._classroom_cols()
                          if "teacher_id" in cols:
                              rows = self._db.query_all(
                                  "SELECT * FROM sm_classrooms"
                                  " WHERE teacher_id = ?"
                                  " ORDER BY grade, section,"
                                  " turn", (str(teacher_id),))
                              for r in rows:
                                  if institution_id and \
                                          str(r["institution_id"]
                                              ) != institution_id:
                                      continue
                                  grupos.append(
                                      self._aula_de_row(r))
                          return {"role": "TEACHER",
                                  "teacher_id": str(teacher_id),
                                  "aulas": len(grupos),
                                  "grupos": grupos,
                                  "note": "" if grupos else
                                  "sin aulas asignadas (esta"
                                  " base no registra teacher_id"
                                  " o el profesor no tiene)"}

                      # ---------- DIRECTOR ----------

                      def director_dashboard(self, *,
                                             institution_id,
                                             school_year="2026"
                                             ) -> dict:
                          """SU escuela completa con cupos EXACTOS
                          por aula. Los totales salen de las aulas
                          reales."""
                          rows = self._db.query_all(
                              "SELECT * FROM sm_classrooms WHERE"
                              " institution_id = ? AND"
                              " school_year = ? ORDER BY grade,"
                              " section, turn",
                              (str(institution_id),
                               str(school_year)))
                          aulas = []
                          tot_cap = 0
                          tot_enr = 0
                          grados = set()
                          turnos = set()
                          for r in rows:
                              a = self._aula_de_row(r)
                              aulas.append(a)
                              tot_cap += a["capacity"]
                              tot_enr += a["enrolled"]
                              if a["grade"]:
                                  grados.add(a["grade"])
                              turnos.add(a["turn"])
                          return {"role": "DIRECTOR",
                                  "institution_id":
                                      str(institution_id),
                                  "school_year": str(school_year),
                                  "aulas": len(aulas),
                                  "grados": sorted(grados),
                                  "turnos": sorted(turnos),
                                  "total_capacity": tot_cap,
                                  "total_enrolled": tot_enr,
                                  "total_cupos":
                                      tot_cap - tot_enr,
                                  "classroom_rows": aulas,
                                  "plan_de_llenado":
                                      [a for a in aulas
                                       if a["cupos"] > 0]}

                      # ---------- MINISTERIO ----------

                      def ministry_dashboard(self, *,
                                             department="",
                                             municipality=""
                                             ) -> dict:
                          """Escuelas por departamento/municipio,
                          capacidad, turnos y plan de llenado
                          (donde se llenan las matriculas)."""
                          rows = self._db.query_all(
                              "SELECT DISTINCT institution_id"
                              " FROM sm_classrooms")
                          ids = sorted(set(
                              str(r["institution_id"])
                              for r in rows))
                          escuelas = []
                          plan = []
                          t_esc = t_aulas = t_cap = t_enr = 0
                          for iid in ids:
                              geo = self._geo_of(iid)
                              if department or municipality:
                                  if not geo:
                                      continue
                                  if department and geo.get(
                                          "department"
                                          ) != department:
                                      continue
                                  if municipality and geo.get(
                                          "municipality"
                                          ) != municipality:
                                      continue
                              filas = self._db.query_all(
                                  "SELECT * FROM sm_classrooms"
                                  " WHERE institution_id = ?",
                                  (iid,))
                              aulas = len(filas)
                              cap = enr = 0
                              grados = set()
                              por_turno = {}
                              for r in filas:
                                  a = self._aula_de_row(r)
                                  cap += a["capacity"]
                                  enr += a["enrolled"]
                                  if a["grade"]:
                                      grados.add(a["grade"])
                                  pt = por_turno.setdefault(
                                      a["turn"],
                                      {"capacidad": 0,
                                       "matriculados": 0})
                                  pt["capacidad"] += \
                                      a["capacity"]
                                  pt["matriculados"] += \
                                      a["enrolled"]
                                  if a["cupos"] > 0:
                                      plan.append({
                                          "institution_id": iid,
                                          "classroom_id":
                                              a["classroom_id"],
                                          "grade": a["grade"],
                                          "turn": a["turn"],
                                          "cupos": a["cupos"]})
                              escuelas.append({
                                  "institution_id": iid,
                                  "nombre":
                                      geo.get("name", ""),
                                  "department": geo.get(
                                      "department",
                                      "SIN_GEO"),
                                  "municipality": geo.get(
                                      "municipality",
                                      "SIN_GEO"),
                                  "aulas": aulas,
                                  "grados": sorted(grados),
                                  "turnos": sorted(por_turno),
                                  "capacidad_total": cap,
                                  "matriculados": enr,
                                  "cupos": cap - enr,
                                  "capacidad_por_turno":
                                      por_turno})
                              t_esc += 1
                              t_aulas += aulas
                              t_cap += cap
                              t_enr += enr
                          return {"role": "MINISTRY",
                                  "filtro": {
                                      "department":
                                          str(department),
                                      "municipality":
                                          str(municipality)},
                                  "escuelas": escuelas,
                                  "total_escuelas": t_esc,
                                  "total_aulas": t_aulas,
                                  "total_capacidad": t_cap,
                                  "total_matriculados": t_enr,
                                  "total_cupos":
                                      t_cap - t_enr,
                                  "plan_de_llenado": sorted(
                                      plan,
                                      key=lambda x: -x["cupos"])}
              '''))
              out("## FIN builder S-2/S-3")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests (fix: 2 encargados retiro SE-3)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_s2s3_dashboards.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.student.student_registry_engine import StudentRegistryEngine
          from apps.semilla.domain.classroom.classroom_engine import ClassroomEngine
          from apps.semilla.domain.academic.enrollment_engine import EnrollmentEngine
          from apps.semilla.domain.student.role_dashboards_engine import RoleDashboardsEngine

          PICK2 = [{"name": "Mama", "relation": "MADRE"},
                   {"name": "Papa", "relation": "PADRE"}]

          def _setup(tmp_path):
              db = SQLiteAdapter(tmp_path / "s.db")
              clock = FrozenClock()
              students = StudentRegistryEngine(db, clock)
              cls = ClassroomEngine(db, clock)
              en = EnrollmentEngine(db, clock, classroom_engine=cls)
              dash = RoleDashboardsEngine(db, clock,
                  student_registry=students,
                  classroom_engine=cls, enrollment_engine=en)
              return students, cls, en, dash

          def test_director_cupos_exactos(tmp_path) -> None:
              students, cls, en, dash = _setup(tmp_path)
              a1 = cls.create(name="1A-M", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=30)
              a2 = cls.create(name="1A-T", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="VESPERTINA", capacity=25)
              en.enroll(student_id="ALU-1",
                  classroom_id=a1["classroom_id"],
                  school_year="2026")
              en.enroll(student_id="ALU-2",
                  classroom_id=a1["classroom_id"],
                  school_year="2026")
              en.enroll(student_id="ALU-3",
                  classroom_id=a2["classroom_id"],
                  school_year="2026")
              d = dash.director_dashboard(institution_id="INST-1",
                  school_year="2026")
              assert d["role"] == "DIRECTOR"
              assert d["aulas"] == 2
              assert d["total_capacity"] == 55
              assert d["total_enrolled"] == 3
              assert d["total_cupos"] == 52
              assert set(d["grados"]) == {"1"}
              assert set(d["turnos"]) == {"MATUTINA", "VESPERTINA"}
              f1 = [r for r in d["classroom_rows"]
                    if r["classroom_id"] == a1["classroom_id"]][0]
              assert f1["capacity"] == 30
              assert f1["enrolled"] == 2
              assert f1["cupos"] == 28
              assert len(d["plan_de_llenado"]) == 2
              print("OK director: aulas/capacidad/matriculados/cupos REALES")

          def test_student_dashboard_degrada_sin_motores(tmp_path) -> None:
              students, cls, en, dash = _setup(tmp_path)
              est = students.register(full_name="Nina Prueba",
                  level="BASICA", grade="1",
                  institution_id="INST-1",
                  tutores=[{"name": "Mama", "relation": "MADRE",
                            "zid": "ZID-M-1"}],
                  authorized_pickup=PICK2,
                  emergency_contacts=[{"name": "Tio",
                                       "relation": "TIO",
                                       "phone": "911"}],
                  zid="ZID-NINA-1", zid_status="PROVISIONAL")
              d = dash.student_dashboard(est["student_id"])
              assert d["found"] is True
              assert d["student"]["student_id"] == est["student_id"]
              assert d["average"] is None
              assert d["attendance_pct"] is None
              nf = dash.student_dashboard("NO-EXISTE")
              assert nf["found"] is False
              print("OK alumno: SU cuadro con sus datos; degradacion segura sin motores opcionales (SE-3 respetado: 2 encargados retiro)")

          def test_ministry_departamento_municipio_plan(tmp_path) -> None:
              students, cls, en, dash = _setup(tmp_path)
              a1 = cls.create(name="C-1A", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=30)
              a2 = cls.create(name="N-2A", institution_id="INST-8",
                  school_year="2026", level="BASICA", grade="2",
                  section="A", turn="VESPERTINA", capacity=10)
              dash.set_school_geo(institution_id="INST-1",
                  name="Escuela Centro",
                  department="LA_LIBERTAD",
                  municipality="SAN_SALVADOR")
              dash.set_school_geo(institution_id="INST-8",
                  name="Escuela Norte",
                  department="CHALATENANGO",
                  municipality="LA_PALMA")
              m = dash.ministry_dashboard()
              assert m["role"] == "MINISTRY"
              assert m["total_escuelas"] == 2
              assert m["total_capacidad"] == 40
              assert m["total_cupos"] == 40
              ml = dash.ministry_dashboard(
                  department="LA_LIBERTAD")
              assert ml["total_escuelas"] == 1
              assert ml["escuelas"][0]["nombre"] == "Escuela Centro"
              mm = dash.ministry_dashboard(
                  municipality="LA_PALMA")
              assert mm["total_escuelas"] == 1
              assert mm["escuelas"][0]["institution_id"] == "INST-8"
              plan = m["plan_de_llenado"]
              assert len(plan) == 2
              assert plan[0]["cupos"] == 30
              print("OK ministerio: escuelas por depto/municipio, capacidad, turnos y plan de llenado")

          def test_s3_guard_capacidad_exacta(tmp_path) -> None:
              students, cls, en, dash = _setup(tmp_path)
              chico = cls.create(name="S-3", institution_id="INST-9",
                  school_year="2026", level="BASICA", grade="3",
                  section="A", turn="MATUTINA", capacity=1)
              cid = chico["classroom_id"]
              assert dash.capacity_state(cid)["cupos"] == 1
              dash.guard_capacity(cid, requesting=1)
              en.enroll(student_id="ALU-X", classroom_id=cid,
                  school_year="2026")
              st = dash.capacity_state(cid)
              assert st["lleno"] is True
              assert st["cupos"] == 0
              with pytest.raises(ValueError):
                  dash.guard_capacity(cid, requesting=1)
              print("OK S-3: capacidad exacta protegida — jamas se pide cupo que no existe")
          TSEOF
          timeout 180 python3 -m pytest apps/semilla/tests/test_s2s3_dashboards.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/s2s3.out 2>&1
          echo $? > /tmp/s2s3
          if [ "$(cat /tmp/s2s3)" = "0" ]; then echo "- S-2/S-3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- S-2/S-3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### S-2/S-3 detalle"; echo '```'; tail -80 /tmp/s2s3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si SEMILLA verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
