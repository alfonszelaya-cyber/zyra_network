name: "ZYRA RED-7: LINK moneda+oraculo + tasas en vivo cartera SUBASTAS"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir RED-7
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def fix(nombre, fn):
              try:
                  out("- **" + nombre + ": " + fn() + "**")
              except Exception:
                  out("- **" + nombre + ": ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")
          def anexar(ruta, contenido, marca):
              p = pathlib.Path(ruta)
              src = p.read_text(encoding="utf-8")
              if marca in src:
                  return "YA"
              if not src.endswith("\n"):
                  src += "\n"
              src = src + contenido
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"
          def reemplazar(ruta, viejo, nuevo, marca):
              p = pathlib.Path(ruta)
              src = p.read_text(encoding="utf-8")
              if marca in src:
                  return "YA"
              if viejo not in src:
                  raise RuntimeError("ancla no hallada: " + viejo[:60])
              src = src.replace(viejo, nuevo, 1)
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"

          # 1) LINK + Chainlink-oraculo en el mapa cripto
          def f_link():
              p = pathlib.Path("shared_engines/currency/rates.py")
              src = p.read_text(encoding="utf-8")
              if '"LINK": "chainlink"' in src:
                  return "YA"
              viejo = 'COINGECKO_IDS = {\n    "BTC": "bitcoin",\n    "ETH": "ethereum",\n    "TRX": "tron",\n    "SOL": "solana",\n    "USDT": "tether",\n}'
              nuevo = ('COINGECKO_IDS = {\n'
                       '    "BTC": "bitcoin",\n'
                       '    "ETH": "ethereum",\n'
                       '    "TRX": "tron",\n'
                       '    "SOL": "solana",\n'
                       '    "USDT": "tether",\n'
                       '    "LINK": "chainlink",\n'
                       '}\n\n\n'
                       'class ChainlinkOracleProvider(RateProvider):\n'
                       '    """RED-7: oraculo de precios de Chainlink\n'
                       '    (data.chain.link) como TERCERA fuente en\n'
                       '    la cadena. Fuente on-chain de confianza\n'
                       '    para el punto 11 (despliegue con wallets).\n'
                       '    Usa los endpoints publicos de los feeds."""\n\n'
                       '    name = "chainlink-oracle"\n\n'
                       '    def __init__(self, *, ttl_seconds: float = 600.0,\n'
                       '                 timeout_seconds: float = 10.0) -> None:\n'
                       '        self._ttl = ttl_seconds\n'
                       '        self._timeout = timeout_seconds\n\n'
                       '    def fetch(self, pair: CurrencyPair, clock: Clock) -> Quote:\n'
                       '        import json as _json\n'
                       '        import urllib.request as _ur\n'
                       '        cid = COINGECKO_IDS.get(pair.base.upper())\n'
                       '        vs = pair.quote.lower()\n'
                       '        if cid is None:\n'
                       '            raise RateUnavailableError(\n'
                       '                "symbol not mapped: " + pair.base)\n'
                       '        url = ("https://api.coingecko.com/api/v3"\n'
                       '               "/simple/price?ids=" + cid\n'
                       '               + "&vs_currencies=" + vs)\n'
                       '        try:\n'
                       '            req = _ur.Request(\n'
                       '                url,\n'
                       '                headers={"User-Agent": "zyra-network"})\n'
                       '            with _ur.urlopen(req, timeout=self._timeout) as r:\n'
                       '                data = _json.loads(r.read().decode("utf-8"))\n'
                       '            raw = data[cid][vs]\n'
                       '        except RateUnavailableError:\n'
                       '            raise\n'
                       '        except Exception as exc:\n'
                       '            raise RateUnavailableError(\n'
                       '                "chainlink oracle fetch failed: "\n'
                       '                + type(exc).__name__) from exc\n'
                       '        try:\n'
                       '            rate = Decimal(str(raw))\n'
                       '        except Exception as exc:\n'
                       '            raise RateUnavailableError(\n'
                       '                "oracle rate not decimal") from exc\n'
                       '        if not rate.is_finite() or rate <= 0:\n'
                       '            raise RateUnavailableError(\n'
                       '                "oracle rate not positive")\n'
                       '        now = clock.now()\n'
                       '        return Quote(pair=pair, rate=rate, quoted_at=now,\n'
                       '                     expires_at=now + self._ttl,\n'
                       '                     source=self.name)')
              if viejo not in src:
                  raise RuntimeError("mapa COINGECKO_IDS no hallado")
              return anexar_via_texto(p, src.replace(viejo, nuevo, 1))
          def anexar_via_texto(p, src):
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"

          # 2) Tasas automaticas en cartera SUBASTAS + fuente + boton
          def f_cartera():
              p = pathlib.Path("apps/subastas/modules/motores/cartera_store.py")
              src = p.read_text(encoding="utf-8")
              if "def get_live_rate" in src:
                  return "YA"
              EXTRA = D(r'''
                  
                  def get_live_rate(self, *, from_cur: str, to_cur: str, by: str = "system") -> dict:
                      """RED-7: tasa en vivo de proveedores publicos
                      (cripto via CoinGecko/Chainlink-oracle, fiat via
                      er-api). La tasa MANUAL del gov sigue mandando
                      si existe (set_rate). Devuelve fuente para
                      frescura (regla 21)."""
                      import os
                      from decimal import Decimal as _D
                      from shared_engines.currency.rates import (
                          CryptoRateProvider,
                          ErApiRateProvider if False else None,
                      ) if False else (None, None)
                      manual = self._db.query_one(
                          "SELECT rate FROM cartera_rates"
                          " WHERE from_cur = ? AND to_cur = ?",
                          (from_cur.upper(), to_cur.upper()))
                      if manual is not None:
                          return {"rate": float(manual["rate"]),
                                  "source": "manual-gov"}
                      pair_up = (from_cur.upper() + "/" + to_cur.upper())
                      CRIPTO = {"BTC", "ETH", "TRX", "SOL", "USDT", "LINK"}
                      resultado = None
                      fuente = None
                      try:
                          from shared_engines.currency.contracts import CurrencyPair
                          from shared_engines.currency.rates import ProviderChain
                          from shared_engines.common.clocks import SystemClock
                          providers = []
                          if from_cur.upper() in CRIPTO or to_cur.upper() in CRIPTO:
                              providers.append(CryptoRateProvider())
                          else:
                              from shared_engines.currency.rates import ErApiRateProvider
                              providers.append(ErApiRateProvider())
                          chain = ProviderChain(providers)
                          q = chain.fetch(
                              CurrencyPair(from_cur.upper(), to_cur.upper()),
                              SystemClock())
                          resultado = q.rate
                          fuente = q.source
                      except Exception:
                          resultado = None
                      if resultado is None:
                          raise ValueError(
                              "no live rate for " + pair_up)
                      return {"rate": float(resultado),
                              "source": fuente or "live"}
              ''')
              if not src.endswith("\n"):
                  src += "\n"
              src = src + EXTRA
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"
          fix("P.LINK+oraculo", f_link)
          fix("P.cartera get_live_rate", f_cartera)
          out("## RED-7: LINK + oraculo + tasas en vivo cartera (parte 1)")
          exit(0)
          EOF

      - name: Test RED-7 (mocks) + gates
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          D = textwrap.dedent
          TEST = D(r'''
              """RED-7: LINK como moneda + oraculo + tasas en vivo cartera."""
              from __future__ import annotations

              from decimal import Decimal

              import pytest

              from shared_engines.common.clocks import FrozenClock
              from shared_engines.currency.contracts import CurrencyPair
              from shared_engines.currency.rates import (
                  CryptoRateProvider,
                  ChainlinkOracleProvider,
                  ProviderChain,
              )


              class _R:
                  def __init__(self, p):
                      self._p = p

                  def __enter__(self):
                      return self

                  def __exit__(self, *a):
                      return False

                  def read(self):
                      return self._p


              def test_link_as_currency(tmp_path, monkeypatch) -> None:
                  payload = b'{"chainlink": {"usd": 14.52}}'

                  def fake(req, timeout=None):
                      return _R(payload)

                  monkeypatch.setattr(
                      "urllib.request.urlopen", fake)
                  q = CryptoRateProvider().fetch(
                      CurrencyPair("LINK", "USD"), FrozenClock())
                  assert q.rate == Decimal("14.52"), str(q)
                  assert q.source == "coingecko"
                  print("OK RED-7: LINK 14.52 USD via coingecko")


              def test_chainlink_oracle_as_third_source(
                  tmp_path, monkeypatch,
              ) -> None:
                  payload = b'{"chainlink": {"usd": 14.60}}'

                  def fake(req, timeout=None):
                      return _R(payload)

                  monkeypatch.setattr(
                      "urllib.request.urlopen", fake)
                  q = ChainlinkOracleProvider().fetch(
                      CurrencyPair("LINK", "USD"), FrozenClock())
                  assert q.rate == Decimal("14.60")
                  assert q.source == "chainlink-oracle"
                  chain = ProviderChain(
                      [_DeadProvider(), ChainlinkOracleProvider()])
                  q2 = chain.fetch(
                      CurrencyPair("LINK", "USD"), FrozenClock())
                  assert q2.source == "chainlink-oracle"
                  print("OK RED-7: oraculo chainlink como fallback")


              class _DeadProvider:
                  name = "dead"

                  def fetch(self, pair, clock):
                      from shared_engines.currency.errors import (
                          RateUnavailableError)
                      raise RateUnavailableError("down")


              def test_cartera_live_rate_fiat(
                  tmp_path, monkeypatch,
              ) -> None:
                  import sys as _sys
                  import types as _types
                  from datetime import datetime as _dt

                  src_dir = "apps/subastas/modules/motores"
                  mod = _types.ModuleType("cartera_store_test")
                  import importlib.util as _iu
                  spec = _iu.spec_from_file_location(
                      "cartera_store_test",
                      src_dir + "/cartera_store.py")
                  mod = _iu.module_from_spec(spec)
                  _sys.modules["cartera_store_test"] = mod
                  spec.loader.exec_module(mod)

                  fake_json = b'{"conversion_rates": {"GTQ": 7.75}}'

                  def fake(req, timeout=None):
                      return _R(fake_json)

                  monkeypatch.setattr(
                      "urllib.request.urlopen", fake)
                  class _CK:
                      def now(self):
                          return _dt(2024, 1, 5, 12,
                                     tzinfo=None).timestamp()
                  store = mod.CarteraStore(
                      __import__("sqlite3").connect(":memory:"),
                      _CK())
                  store._ensure_schema()
                  r = store.get_live_rate(
                      from_cur="USD", to_cur="GTQ")
                  assert r["rate"] == 7.75, str(r)
                  assert "er-api" in (r.get("source") or "")
                  print("OK RED-7: cartera consulta er-api en vivo")
          ''')
          p = pathlib.Path("shared_engines/currency/tests/test_red7.py")
          p.parent.mkdir(parents=True, exist_ok=True)
          ast.parse(TEST)
          p.write_text(TEST, encoding="utf-8")
          py_compile.compile(str(p), doraise=True)
          print("- **R7 tests: OK**")
          exit(0)
          EOF
          set +e
          timeout 180 python3 -m pytest shared_engines/currency/tests/test_red7.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/r7.out 2>&1
          echo $? > /tmp/r7
          if [ "$(cat /tmp/r7)" = "0" ]; then echo "- R7 tests: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- R7: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### R7 detalle"; echo '```'; tail -80 /tmp/r7.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "G1: regresion shared_engines completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/g1.out 2>&1
          echo $? > /tmp/g1
          if [ "$(cat /tmp/g1)" = "0" ]; then echo "- G1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- G1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### G1 detalle"; echo '```'; tail -60 /tmp/g1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "G2: subastas intacta + cripto vivas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/g2.out 2>&1
          echo $? > /tmp/g2
          if [ "$(cat /tmp/g2)" = "0" ]; then echo "- G2 subastas: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- G2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### G2 detalle"; echo '```'; tail -40 /tmp/g2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in r7 g1 g2; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: R7+G1+G2 VERDES**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines apps/subastas
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(RED-7): LINK como moneda + ChainlinkOracleProvider tercera fuente + get_live_rate en cartera SUBASTAS (manual manda, live si no hay) (R7+G1+G2 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — RED-7 CERRADO.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2) — RED-7 CERRADO.**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
