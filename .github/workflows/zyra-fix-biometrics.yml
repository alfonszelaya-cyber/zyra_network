              if RESUMEN:
                  with open(RESUMEN, "a", encoding="utf-8") as f:
                      f.write(texto + "\n")

          errores = 0
          objetivos = []
          with open(MANIFEST, encoding="utf-8") as f:
              for linea in f:
                  linea = linea.strip()
                  if linea:
                      ruta, estado = linea.split("|", 1)
                      objetivos.append((ruta, estado))

          sum_write("## ZYRA LABORATORIO - Lote 2A (Fase 2 completa)")
          sum_write("")
          sum_write("### Escritura y verificacion por tipo (Reglas 1-3 y 6)")
          sum_write("")
          sum_write("| Archivo | Escritura | Verificacion |")
          sum_write("|---|---|---|")
          for ruta, estado in objetivos:
              marca = "OK"
              try:
                  p = pathlib.Path(ruta)
                  datos = p.read_bytes()
                  assert datos.strip(), "archivo vacio"
                  if ruta.endswith(".py"):
                      texto = datos.decode("utf-8")
                      compile(texto, ruta, "exec")
                      nombre = "apps.laboratorio." + ruta[len("apps/laboratorio/"):-3].replace("/", ".")
                      importlib.import_module(nombre)
                  elif ruta.endswith(".json"):
                      obj = json.loads(datos.decode("utf-8"))
                      assert isinstance(obj, dict), "json debe ser objeto"
                  elif ruta.endswith(".svg"):
                      assert b"<svg" in datos
                  elif ruta.endswith(".html"):
                      texto = datos.decode("utf-8")
                      assert "{{" in texto and "}}" in texto, "plantilla sin marcadores"
                  else:
                      raise ValueError("Tipo desconocido: " + ruta)
              except Exception as exc:
                  errores += 1
                  marca = "FALLO: " + type(exc).__name__ + ": " + str(exc)
              sum_write("| `" + ruta + "` | " + estado + " | " + marca + " |")

          app = montar_aplicacion(":memory:")
          H_DUENO = {"X-ZYRA-ZID": "ZID-DUENO-1", "X-ZYRA-ROLES": "LAB_CREADOR,LAB_ANALISTA"}
          H_OTRO = {"X-ZYRA-ZID": "ZID-OTRO-2"}

          def llamada(metodo, ruta, cuerpo=None, headers=None):
              h = dict(headers or {})
              datos = b"" if cuerpo is None else json.dumps(cuerpo).encode("utf-8")
              status, headers_out, salida = app.despachar(metodo, ruta, h, datos)
              ctype = headers_out.get("Content-Type", "")
              if "json" in ctype:
                  try:
                      parsed = json.loads(salida.decode("utf-8"))
                  except Exception:
                      parsed = None
              else:
                  parsed = None
              return status, parsed, salida, headers_out

          resultados = []

          def check(nombre, funcion):
              global errores
              try:
                  funcion()
                  resultados.append(("OK", nombre))
              except Exception as exc:
                  errores += 1
                  resultados.append(("FALLO", nombre + " -> " + type(exc).__name__ + ": " + str(exc)))

          ref = {}

          def preparar():
              tmp = ConexionBD(":memory:")
              assert aplicar_migraciones(tmp) == 2
              assert version_actual(tmp) == 2
              for t in TABLAS_ESPERADAS:
                  assert t in tablas_existentes(tmp), "falta tabla " + t
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects", {
                  "titulo": "Finca Los Andes", "tipo": "agro",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              ref["proyecto"] = cuerpo["datos"]["proyecto"]

          def t_crear_entrada_texto():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/inputs", {
                  "titulo": "Mediciones de parcela",
                  "tipo": "texto",
                  "contenido": "Parcela de 40 manzanas con riego por goteo. Inversion de 50000 dolares para 2026. Se espera 25% de margen.",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              entrada = cuerpo["datos"]["entrada"]
              assert entrada["tipo"] == "texto"
              assert len(entrada["hash_sha256"]) == 64
              assert entrada["tamano_bytes"] > 50
              ref["entrada"] = entrada

          def t_crear_entrada_foto():
              pid = ref["proyecto"]["id"]
              base64_prueba = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/inputs", {
                  "titulo": "Foto del terreno", "tipo": "foto", "contenido": base64_prueba,
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              entrada = cuerpo["datos"]["entrada"]
              assert entrada["tipo"] == "foto"
              assert entrada["contenido"] == "[binario base64 sellado]"
              assert len(entrada["hash_sha256"]) == 64
              ref["foto"] = entrada

          def t_entrada_invalida():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/inputs", {
                  "titulo": "corto", "tipo": "texto", "contenido": "corto",
              }, headers=H_DUENO)
              assert status == 400, "status=" + str(status)
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/inputs", {
                  "titulo": "b64 mal", "tipo": "foto", "contenido": "!!!no-es-base64!!!",
              }, headers=H_DUENO)
              assert status == 400, "status=" + str(status)

          def t_comprender_texto():
              eid = ref["entrada"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/inputs/" + eid + "/understand", None, headers=H_DUENO)
              assert status == 200, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              comp = cuerpo["datos"]["comprension"]
              assert comp["total_hallazgos"] >= 4, "hallazgos=" + str(comp["total_hallazgos"])
              tipos = {h["tipo"] for h in comp["hallazgos"]}
              assert "medicion" in tipos
              assert "monto" in tipos
              assert "anio" in tipos
              assert "porcentaje" in tipos
              assert comp["dominio"] == "agro"
              assert comp["confianza"] > 0.5
              for h in comp["hallazgos"]:
                  assert h["certeza"] in ("evidencia_encontrada", "inferencia")
                  assert h["razon"]
              assert comp["entidades"]["mediciones"][0].startswith("40")
              ref["comprension"] = comp

          def t_comprender_reutiliza():
              eid = ref["entrada"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/inputs/" + eid + "/understand", None, headers=H_DUENO)
              assert status == 200
              assert cuerpo["datos"]["reutilizada"] is True
              assert cuerpo["datos"]["comprension"]["id"] == ref["comprension"]["id"]

          def t_foto_aun_no_comprehensible():
              fid = ref["foto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/inputs/" + fid + "/understand", None, headers=H_DUENO)
              assert status == 400, "status=" + str(status)
              assert "vision" in cuerpo["error"]["mensaje"]

          def t_crear_blueprint():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/designs", {
                  "nombre": "Distribucion de la finca",
                  "tipo": "agro",
                  "componentes": [
                      {"nombre": "Casa principal", "tipo": "edificacion", "requisitos": "2 niveles"},
                      {"nombre": "Zona de cultivo", "tipo": "produccion"},
                      {"nombre": "Bodega", "tipo": "edificacion"},
                  ],
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              bp = cuerpo["datos"]["blueprint"]
              assert bp["es_valido"] is True
              assert len(bp["componentes"]) == 3
              assert bp["componentes"][0]["requisitos"] == "2 niveles"
              ref["blueprint"] = bp

          def t_blueprint_invalido():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/designs", {
                  "nombre": "Sin componentes", "tipo": "agro", "componentes": [],
              }, headers=H_DUENO)
              assert status == 400, "status=" + str(status)

          def t_listados_y_permisos():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/projects/" + pid + "/inputs", headers=H_DUENO)
              assert status == 200 and cuerpo["datos"]["total"] == 2
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/projects/" + pid + "/designs", headers=H_DUENO)
              assert status == 200 and cuerpo["datos"]["total"] == 1
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/inputs/" + ref["entrada"]["id"], headers=H_DUENO)
              assert status == 200
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/inputs/" + ref["entrada"]["id"] + "/understand", headers=H_DUENO)
              assert status == 200 and cuerpo["datos"]["comprension"] is not None
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/inputs", {
                  "titulo": "entrada ajena", "tipo": "texto", "contenido": "contenido suficientemente largo para pasar la validacion de entrada",
              }, headers=H_OTRO)
              assert status == 403, "espectador no debe capturar: " + str(status)

          def t_ui_paneles_fase2():
              for menu in ("capturar", "comprender", "disenar"):
                  status, _, html, _ = llamada("GET", "/laboratorio/ui/" + menu, headers=H_DUENO)
                  assert status == 200, menu + " status=" + str(status)
                  texto = html.decode("utf-8")
                  assert "EN VIVO" in texto, menu + " debe estar EN VIVO"
                  assert texto.count('class="btn') == 3, menu + " Ley 3, hay " + str(texto.count('class="btn'))
              status, _, html, _ = llamada("GET", "/laboratorio/ui/capturar", headers=H_DUENO)
              texto = html.decode("utf-8")
              assert 'id="form-entrada"' in texto
              assert "Finca Los Andes" in texto
              assert "Mediciones de parcela" in texto
              status, _, html, _ = llamada("GET", "/laboratorio/ui/comprender", headers=H_DUENO)
              texto = html.decode("utf-8")
              assert "agro" in texto and "medicion" in texto
              status, _, html, _ = llamada("GET", "/laboratorio/ui/disenar", headers=H_DUENO)
              texto = html.decode("utf-8")
              assert "Distribucion de la finca" in texto

          def t_ui_sin_acceso_otro():
              status, _, html, _ = llamada("GET", "/laboratorio/ui", headers=H_OTRO)
              assert status == 200
              texto = html.decode("utf-8")
              assert 'id="form-entrada"' not in texto
              assert ">Capturar<" not in texto

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              total = len(cuerpo["datos"]["rutas"])
              assert total == 23, "se esperaban 23 rutas, hay " + str(total)
              ids_modulos = {m["id"] for m in cuerpo["datos"]["modulos"]}
              assert ids_modulos == {"capture", "simulation", "understanding", "design"}, str(ids_modulos)

          def t_motor_unitario():
              motor = MotorComprensionTextual()
              caps = motor.capacidades()
              assert "mediciones" in caps["entidades"]
              r = motor.analizar("Carretera de 120 km con puente. Presupuesto de 2,000,000 dolares en 2025.")
              assert r["dominio"] == "infraestructura"
              tipos = {h["tipo"] for h in r["hallazgos"]}
              assert "medicion" in tipos and "monto" in tipos
              r2 = motor.analizar("Texto sin cifras ni dominios especiales detectables en esta frase larga.")
              assert r2["dominio"] == "general" and r2["confianza"] == 0.0

          def t_plantillas_completas():
              assert verificar_plantillas() == 7

          sum_write("")
          sum_write("### Pruebas end-to-end Fase 2 (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Migracion v2 + datos base", preparar)
          check("Capturar entrada de texto con hash", t_crear_entrada_texto)
          check("Capturar foto base64 sellada", t_crear_entrada_foto)
          check("Entradas invalidas rechazadas (400)", t_entrada_invalida)
          check("Comprender: hallazgos reales con certeza", t_comprender_texto)
          check("Comprender reutiliza analisis previo", t_comprender_reutiliza)
          check("Foto exige motor de vision (mensaje honesto)", t_foto_aun_no_comprehensible)
          check("Crear blueprint con componentes", t_crear_blueprint)
          check("Blueprint sin componentes rechazado", t_blueprint_invalido)
          check("Listados + 403 a espectador", t_listados_y_permisos)
          check("UI Fase 2: capturar/comprender/disenar EN VIVO con Ley 3", t_ui_paneles_fase2)
          check("Espectador sin acceso a captura", t_ui_sin_acceso_otro)
          check("Indice publico: 23 rutas, 4 modulos", t_indice_publico)
          check("Motor unitario: infraestructura y caso neutro", t_motor_unitario)
          check("7 plantillas verificadas", t_plantillas_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 2 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 2A aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 2A - Fase 2 completa capturar comprender y disenar EN VIVO"
            git push
          fi
