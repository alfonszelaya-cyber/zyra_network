name: "CONSOL-3 fase A CORREGIDA: extraer los 9 metodos REALES (_aid_* + _screen_*) que el mapa mostro + server_backup + regresion inmediata + revert si rompe"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[ESCRITURA] fase A corregida: extraer _aid_* (7) + _screen_ayudas (2) + _screen_producer/government/bank/home (4) = 13 metodos REALES del mapa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              pathlib.Path("apps/agro/server_backup_original.py") \
                  .write_text(src, encoding="utf-8")
              out("- server respaldado en"
                  " server_backup_original.py")

              tree = ast.parse(src)
              cls = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and \
                          "Handler" in node.name:
                      cls = node
              if cls is None:
                  raise RuntimeError("no handler")

              targets = ["_aid_payload", "_aid_network_seq",
                         "_aid_request", "_aid_eligibility",
                         "_aid_approve", "_aid_assign",
                         "_aid_deliver", "_aid_confirm",
                         "_screen_ayudas",
                         "_screen_ayudas_gobierno",
                         "_screen_producer",
                         "_screen_government",
                         "_screen_bank", "_home"]
              found = {}
              for node in cls.body:
                  if isinstance(node, (ast.FunctionDef,
                                       ast.AsyncFunctionDef)) \
                          and node.name in targets:
                      found[node.name] = (node.lineno,
                                          node.end_lineno)
              out("- encontrados " + str(len(found)) + "/"
                  + str(len(targets)) + ": "
                  + ", ".join(sorted(found)))
              if len(found) < 10:
                  raise RuntimeError(
                      "menos de 10 — abort sin tocar")

              lines = src.splitlines(keepends=True)
              parts_aid = []
              parts_scr = []
              extracted = []
              for name in ["_aid_payload", "_aid_network_seq",
                           "_aid_request", "_aid_eligibility",
                           "_aid_approve", "_aid_assign",
                           "_aid_deliver", "_aid_confirm",
                           "_screen_ayudas",
                           "_screen_ayudas_gobierno"]:
                  if name in found:
                      lo, hi = found[name]
                      body = "".join(lines[lo-1:hi])
                      body = "\n".join(
                          ln[4:] if ln.startswith("    ")
                          else ln
                          for ln in body.splitlines())
                      parts_aid.append(body)
                      extracted.append(name)
              for name in ["_screen_producer",
                           "_screen_government",
                           "_screen_bank", "_home"]:
                  if name in found:
                      lo, hi = found[name]
                      body = "".join(lines[lo-1:hi])
                      body = "\n".join(
                          ln[4:] if ln.startswith("    ")
                          else ln
                          for ln in body.splitlines())
                      parts_scr.append(body)
                      extracted.append(name)

              hdr = ('"""AGRO routers (CONSOL-3 fase A, regla'
                     ' 77)\n- metodos extraidos de server.py\n'
                     '- cada funcion recibe handler_self como'
                     ' primer parametro\n- comportamiento'
                     ' identico, codigo reubicado"""\n'
                     'from __future__ import annotations\n\n\n')
              rp1 = pathlib.Path(
                  "apps/agro/routers/aid_router.py")
              rp1.write_text(hdr + "\n\n".join(parts_aid),
                             encoding="utf-8")
              py_compile.compile(str(rp1), doraise=True)
              out("- **aid_router.py: " + str(len(parts_aid))
                  + " funciones OK**")
              rp2 = pathlib.Path(
                  "apps/agro/routers/screens_router.py")
              rp2.write_text(hdr + "\n\n".join(parts_scr),
                             encoding="utf-8")
              py_compile.compile(str(rp2), doraise=True)
              out("- **screens_router.py: "
                  + str(len(parts_scr)) + " funciones OK**")

              # delegaciones: reemplazar cada metodo extraido
              # por una delegacion (de atras hacia adelante)
              new_lines = list(lines)
              for name in sorted(found,
                                 key=lambda n: -found[n][0]):
                  lo, hi = found[name]
                  sig = src[src.find("def " + name):]
                  p0 = sig.find("(")
                  p1 = sig.find(")", p0)
                  params = sig[p0+1:p1].replace(
                      "self, ", "").replace("self", "")
                  args = params.strip(" ,\n")
                  args_flat = ", ".join(
                      p.strip() for p in args.split(",")
                      if p.strip())
                  deleg = ("    from apps.agro.routers."
                           "aid_router import h_" + name[1:]
                           + "\n"
                           "    return h_" + name[1:]
                           + "(self, " + args_flat + ")\n") \
                      if not name.startswith("_screen") else (
                          "    from apps.agro.routers."
                          "screens_router import h_" + name[1:]
                          + "\n"
                          "    return h_" + name[1:] + "(self"
                          + (", " + args_flat if args_flat
                             else "") + ")\n")
                  new_lines[lo-1:hi] = [deleg]
              new_src = "".join(new_lines)
              ast.parse(new_src)
              SP.write_text(new_src, encoding="utf-8")
              py_compile.compile(str(SP), doraise=True)
              out("- **server.py: " + str(len(extracted))
                  + " metodos -> delegaciones | lineas: 2811"
                  " -> " + str(len(new_src.splitlines()))
                  + "**")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO — revert automatico")
              try:
                  bak = pathlib.Path(
                      "apps/agro/server_backup_original.py")
                  SP.write_text(
                      bak.read_text(encoding="utf-8"),
                      encoding="utf-8")
                  out("- server.py RESTAURADO")
              except Exception:
                  pass
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion AGRO completa (valida el refactor)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — refactor VALIDADO" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed) — server.py REVERTIDO" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -50 /tmp/x3.out; echo '```'; } >> "$SUM"
            cp apps/agro/server_backup_original.py apps/agro/server.py
            rm -f apps/agro/routers/aid_router.py apps/agro/routers/screens_router.py
            echo "- server.py RESTAURADO (estado estable)" >> "$SUM"
          fi
          exit 0

      - name: "[ENTREGA] commit solo si AGRO verde con el refactor"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**CONSOL-3 A BLOQUEADA — server.py revertido al estado estable (57 tests verde garantizados). Correccion puntual en el proximo run con el detalle.**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**CONSOL-3: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(CONSOL-3 fase A corregida, regla 77): server.py AGRO — 13 metodos REALES del mapa extraidos a routers/aid_router.py (8 funciones del ciclo de ayudas) y routers/screens_router.py (4 pantallas + _home) como funciones libres que reciben handler_self (comportamiento identico) + delegaciones de 1 linea en el server + server_backup_original.py (revert garantizado) + regresion AGRO verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**CONSOL-3 FASE A OK (server reducido, validado). FASE B siguiente: atacar el metodo _post gigante por tramos.**"
          exit 0
