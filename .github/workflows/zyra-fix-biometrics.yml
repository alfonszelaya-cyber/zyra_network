                      "margin_pct": self._field(row, "k", 10),
                      "roi_pct": self._field(row, "l", 11),
                      "risk": self._field(row, "m", 12),
                      "recommendation": self._field(row, "n", 13),
                      "reasons": self._field(row, "o", 14),
                      "invalidation": self._field(row, "p", 15),
                      "status": self._field(row, "q", 16),
                  }

              def list_opps(self, recommendation=None):
                  sql = (
                      "SELECT opp_id, category, source, brand, model,"
                      " auction_price, market_value, profit, roi_pct,"
                      " risk, recommendation, status FROM sbs_radar_vip"
                  )
                  if recommendation:
                      sql += (
                          " WHERE recommendation = "
                          + self._literal(str(recommendation))
                      )
                  sql += " ORDER BY roi_pct DESC LIMIT 50"
                  out = []
                  for row in self._rows(sql):
                      out.append({
                          "opp_id": self._field(row, "a", 0),
                          "category": self._field(row, "b", 1),
                          "source": self._field(row, "c", 2),
                          "brand": self._field(row, "d", 3),
                          "model": self._field(row, "e", 4),
                          "auction_price": self._field(row, "f", 5),
                          "market_value": self._field(row, "g", 6),
                          "profit": self._field(row, "h", 7),
                          "roi_pct": self._field(row, "i", 8),
                          "risk": self._field(row, "j", 9),
                          "recommendation": self._field(row, "k", 10),
                      })
                  return out

              def compare(self, opp_ids):
                  out = []
                  for oid in (opp_ids or []):
                      o = self.get(str(oid))
                      if o:
                          out.append({
                              "opp_id": o["opp_id"],
                              "name": "%s %s" % (
                                  o.get("brand") or "",
                                  o.get("model") or ""),
                              "roi_pct": o["roi_pct"],
                              "risk": o["risk"],
                              "recommendation": o["recommendation"],
                          })
                  out.sort(key=lambda x: x["roi_pct"], reverse=True)
                  return out

              def watch(self, opp_id, *, account):
                  opp_id = self._req(opp_id, "opp_id")
                  self._req(account, "account")
                  with self._lock:
                      wch_id = _nid("WCH-")
                      self._run(
                          "INSERT INTO sbs_vip_watch (wch_id, opp_id,"
                          " account, created_at) VALUES (?, ?, ?, ?)",
                          (wch_id, opp_id, account, _now()),
                      )
                      return {"wch_id": wch_id, "watching": opp_id}


