                      " action)",
                  )),
                  Migration(2, "nx_ac_audit", (
                      "CREATE TABLE IF NOT EXISTS nx_ac_audit ("
                      " aud_id TEXT PRIMARY KEY, zid TEXT NOT NULL,"
                      " company_id TEXT NOT NULL, module TEXT NOT"
                      " NULL, action TEXT NOT NULL, allowed INTEGER"
                      " NOT NULL, checked_at REAL NOT NULL)",
                  )),
              )
              _ACTIONS = ("read", "write", "admin")


              class AccessControlEngine:
                  """ZID -> empresa -> modulo -> accion."""

                  def __init__(self, db: Database, clock: Clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nx.ac",
                                      _MIGRATIONS).run(clock)

                  def grant(self, *, zid, company_id, module,
                            action):
                      if not str(zid).strip() or \
                              not str(company_id).strip() or \
                              not str(module).strip():
                          raise ValueError(
                              "zid/company_id/module"
                              " requeridos")
                      a = str(action).lower()
                      if a not in _ACTIONS:
                          raise ValueError("action debe ser "
                                           + "/".join(_ACTIONS))
                      dup = self._db.query_one(
                          "SELECT grant_id, status FROM"
                          " nx_ac_grants WHERE zid = ? AND company"
                          "_id = ? AND module = ? AND action = ?",
                          (str(zid), str(company_id),
                           str(module), a))
                      if dup is not None and str(
                              dup["status"]) == "activa":
                          raise ValueError(
                              "grant ya activo (regla 66)")
                      if dup is not None:
                          self._db.execute(
                              "UPDATE nx_ac_grants SET status ="
                              " 'activa', revoked_reason = ''"
                              " WHERE grant_id = ?",
                              (str(dup["grant_id"]),))
                          return {"grant_id": str(
                              dup["grant_id"]),
                              "reactivated": True}
                      gid = ("NXAC-"
                             + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO nx_ac_grants (grant_id,"
                          " zid, company_id, module, action, status,"
                          " created_at) VALUES (?, ?, ?, ?, ?,"
                          " 'activa', ?)",
                          (gid, str(zid), str(company_id),
                           str(module), a, self._clock.now()))
                      return {"grant_id": gid,
                              "company_id": str(company_id)}

                  def revoke(self, grant_id, *, reason):
                      row = self._db.query_one(
                          "SELECT status FROM nx_ac_grants WHERE"
                          " grant_id = ?", (str(grant_id),))
                      if row is None:
                          raise KeyError(grant_id)
                      if str(row["status"]) != "activa":
                          raise ValueError("ya revocado")
                      if not str(reason).strip():
                          raise ValueError(
                              "motivo obligatorio")
                      self._db.execute(
                          "UPDATE nx_ac_grants SET status ="
                          " 'revocada', revoked_reason = ? WHERE"
                          " grant_id = ?",
                          (str(reason), str(grant_id)))
                      return {"grant_id": str(grant_id)}

                  def can(self, zid, company_id, module, action):
                      a = str(action).lower()
                      if a not in _ACTIONS:
                          raise ValueError("action invalida")
                      row = self._db.query_one(
                          "SELECT grant_id FROM nx_ac_grants WHERE"
                          " zid = ? AND company_id = ? AND module ="
                          " ? AND action = ? AND status = 'activa'"
                          " LIMIT 1",
                          (str(zid), str(company_id),
                           str(module), a))
                      allowed = row is not None
                      aud = ("NXAA-"
                             + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO nx_ac_audit (aud_id, zid,"
                          " company_id, module, action, allowed,"
                          " checked_at) VALUES (?, ?, ?, ?, ?, ?,"
                          " ?)",
                          (aud, str(zid), str(company_id),
                           str(module), a,
