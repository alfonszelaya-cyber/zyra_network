      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - EX tests regenerados"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "EX: tests de camara/curso/desastres + rutas orbital/desastre/curso cableadas"
            git push
          fi
