name: "ZYRA RUN3b: N-2..N-6 integraciones al mayor + A-1 persistencia AGRO + A-3 timezone"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] N-2..N-6: ledger_integration_engine (sobre GeneralLedgerEngine con firma verificada)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/nexo/domain/accounting/ledger_integration_engine.py",
                     D(r'''
                  """Ledger Integration Engine (N-2..N-6) - puente
                  de EVENTOS DE NEGOCIO al libro mayor canonico
                  (GeneralLedgerEngine, firma verificada):
                  - N-2 finanzas: gasto/ingreso -> asiento
                  - CxC: factura emitida y cobro recibido
                  - CxP: factura recibida y pago enviado
                  - Tesoreria: deposito/retiro con contrapartida
                  - Activos: depreciacion mensual
                  - Fiscal: provision de impuestos
                  - Presupuesto: budget_vs_actual contra el REAL
                    del mayor (trial_balance, firma verificada)
                  - ledger_is_balanced: integridad global del
                    periodo (suma debitos == suma creditos)

                  Cada metodo genera un asiento BALANCEADO via
                  post_balanced (el cuadre es ley) con source_ref
                  estandar "N2:<tipo>:<id>" para trazabilidad.
                  Montos Decimal 2d (regla 61). Catalogo de
                  cuentas NEXO estandar SOBREESCRIBIBLE por
                  parametro (defaults razonables, nada oculto).
                  Solo escribe en el mayor: los engines dueños de
                  cada dominio siguen mandando (regla 69)."""
                  from __future__ import annotations
                  from decimal import Decimal
                  from typing import List, Optional
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)

                  _Q = Decimal("0.01")

                  class LedgerIntegrationEngine:
                      """Integraciones de negocio al mayor."""

                      def __init__(self, db, clock, ledger):
                          self._db = db
                          self._clock = clock
                          self._gl = ledger

                      @staticmethod
                      def _amt(amount) -> Decimal:
                          d = Decimal(str(amount)).quantize(_Q)
                          if d <= Decimal("0.00"):
                              raise ValueError(
                                  "amount debe ser > 0: "
                                  + str(d))
                          return d

                      def _post(self, company_id, period, kind,
                                ref, lines) -> dict:
                          res = self._gl.post_balanced(
                              company_id=str(company_id),
                              period=str(period),
                              lines=lines,
                              source_ref=("N2:" + str(kind)
                                          + ":" + str(ref)))
                          return {"kind": str(kind),
                                  "ref": str(ref),
                                  "posted": res["posted"],
                                  "total_debit":
                                      res["total_debit"],
                                  "total_credit":
                                      res["total_credit"],
                                  "entries": res["entries"]}

                      # ---------- finanzas (N-2) ----------

                      def income_recorded(self, *, company_id,
                                          period, record_id,
                                          amount,
                                          cash_account="1000",
                                          income_account="4000"
                                          ) -> dict:
                          a = self._amt(amount)
                          return self._post(
                              company_id, period, "INGRESO",
                              record_id,
                              [{"account_code":
                                    str(cash_account),
                                "debit": str(a),
                                "credit": "0"},
                               {"account_code":
                                    str(income_account),
                                "debit": "0",
                                "credit": str(a)}])

                      def expense_recorded(self, *, company_id,
                                           period, record_id,
                                           amount,
                                           expense_account="5000",
                                           cash_account="1000"
                                           ) -> dict:
                          a = self._amt(amount)
                          return self._post(
                              company_id, period, "GASTO",
                              record_id,
                              [{"account_code":
                                    str(expense_account),
                                "debit": str(a),
                                "credit": "0"},
                               {"account_code":
                                    str(cash_account),
                                "debit": "0",
                                "credit": str(a)}])

                      # ---------- CxC (N-2) ----------

                      def invoice_issued_ar(self, *, company_id,
                                            period, invoice_id,
                                            amount,
                                            ar_account="1100",
                                            income_account="4000"
                                            ) -> dict:
                          a = self._amt(amount)
                          return self._post(
                              company_id, period, "CXC_FACTURA",
                              invoice_id,
                              [{"account_code":
                                    str(ar_account),
                                "debit": str(a),
                                "credit": "0"},
                               {"account_code":
                                    str(income_account),
                                "debit": "0",
                                "credit": str(a)}])

                      def payment_received(self, *, company_id,
                                           period, invoice_id,
                                           amount,
                                           bank_account="1000",
                                           ar_account="1100"
                                           ) -> dict:
                          a = self._amt(amount)
                          return self._post(
                              company_id, period, "CXC_COBRO",
                              invoice_id,
                              [{"account_code":
                                    str(bank_account),
                                "debit": str(a),
                                "credit": "0"},
                               {"account_code":
                                    str(ar_account),
                                "debit": "0",
                                "credit": str(a)}])

                      # ---------- CxP (N-2) ----------

                      def invoice_received_ap(self, *,
                                              company_id, period,
                                              invoice_id, amount,
                                              expense_account="5000",
                                              ap_account="2100"
                                              ) -> dict:
                          a = self._amt(amount)
                          return self._post(
                              company_id, period, "CXP_FACTURA",
                              invoice_id,
                              [{"account_code":
                                    str(expense_account),
                                "debit": str(a),
                                "credit": "0"},
                               {"account_code":
                                    str(ap_account),
                                "debit": "0",
                                "credit": str(a)}])

                      def payment_sent(self, *, company_id,
                                       period, invoice_id,
                                       amount,
                                       ap_account="2100",
                                       bank_account="1000"
                                       ) -> dict:
                          a = self._amt(amount)
                          return self._post(
                              company_id, period, "CXP_PAGO",
                              invoice_id,
                              [{"account_code":
                                    str(ap_account),
                                "debit": str(a),
                                "credit": "0"},
                               {"account_code":
                                    str(bank_account),
                                "debit": "0",
                                "credit": str(a)}])

                      # ---------- Tesoreria (N-2) ----------

                      def treasury_move(self, *, company_id,
                                        period, move_id, direction,
                                        amount,
                                        bank_account="1000",
                                        counter_account="3000"
                                        ) -> dict:
                          a = self._amt(amount)
                          d = str(direction).upper()
                          if d not in ("DEPOSIT", "WITHDRAW"):
                              raise ValueError(
                                  "direction DEPOSIT o"
                                  " WITHDRAW")
                          if d == "DEPOSIT":
                              lines = [
                                  {"account_code":
                                       str(bank_account),
                                   "debit": str(a),
                                   "credit": "0"},
                                  {"account_code":
                                       str(counter_account),
                                   "debit": "0",
                                   "credit": str(a)}]
                          else:
                              lines = [
                                  {"account_code":
                                       str(counter_account),
                                   "debit": str(a),
                                   "credit": "0"},
                                  {"account_code":
                                       str(bank_account),
                                   "debit": "0",
                                   "credit": str(a)}]
                          return self._post(
                              company_id, period,
                              "TESORERIA_" + d, move_id, lines)

                      # ---------- Activos (N-2) ----------

                      def depreciation_month(self, *,
                                             company_id, period,
                                             asset_id, amount,
                                             expense_account="5200",
                                             acc_dep_account="1590"
                                             ) -> dict:
                          a = self._amt(amount)
                          return self._post(
                              company_id, period,
                              "DEPRECIACION", asset_id,
                              [{"account_code":
                                    str(expense_account),
                                "debit": str(a),
                                "credit": "0"},
                               {"account_code":
                                    str(acc_dep_account),
                                "debit": "0",
                                "credit": str(a)}])

                      # ---------- Fiscal (N-2) ----------

                      def tax_provision(self, *, company_id,
                                        period, obligation_id,
                                        amount,
                                        expense_account="5300",
                                        liability_account="2300"
                                        ) -> dict:
                          a = self._amt(amount)
                          return self._post(
                              company_id, period,
                              "PROVISION_FISCAL",
                              obligation_id,
                              [{"account_code":
                                    str(expense_account),
                                "debit": str(a),
                                "credit": "0"},
                               {"account_code":
                                    str(liability_account),
                                "debit": "0",
                                "credit": str(a)}])

                      # ---------- Analisis (N-2/N-6) ----------

                      def budget_vs_actual(self, *,
                                           company_id, period,
                                           budgets) -> List[dict]:
                          """budgets: {cuenta: monto}. El REAL
                          sale del mayor (trial_balance)."""
                          real = {r["account_code"]:
                                  Decimal(r["debit"])
                                  - Decimal(r["credit"])
                                  for r in
                                  self._gl.trial_balance(
                                      company_id, str(period))}
                          rows = []
                          for acc in sorted(budgets):
                              b = Decimal(
                                  str(budgets[acc])).quantize(_Q)
                              a = real.get(str(acc),
                                           Decimal("0.00"))
                              diff = (a - b).quantize(_Q)
                              pct = (str(
                                  (Decimal(a) * Decimal(100)
                                   / b).quantize(_Q))
                                  if b != Decimal("0.00")
                                  else None)
                              rows.append({
                                  "account_code": str(acc),
                                  "budget": str(b),
                                  "actual": str(a.quantize(_Q)),
                                  "diff": str(diff),
                                  "usage_pct": pct,
                                  "over": a > b})
                          return rows

                      def ledger_is_balanced(self, *,
                                             company_id,
                                             period=""
                                             ) -> bool:
                          rows = self._gl.trial_balance(
                              company_id, str(period or ""))
                          td = sum((Decimal(r["debit"])
                                    for r in rows),
                                   Decimal("0"))
                          tc = sum((Decimal(r["credit"])
                                    for r in rows),
                                   Decimal("0"))
                          return td == tc
              '''))
              out("## FIN nexo integration")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] A-1: SqliteRepository AGRO (misma interfaz save/get/list/delete)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/agro/infrastructure/repositories/sqlite_repository.py",
                     D(r'''
                  """SqliteRepository (A-1) - persistencia REAL
                  para AGRO con la MISMA interfaz del repositorio
                  en memoria (save/get/list/delete — ABC
                  domain/repositories/repository.py respetado).

                  Patron generico: la entidad se serializa a JSON
                  en una tabla por tipo (entity_id PK + payload).
                  No asume esquema de la entidad (los dataclasses
                  de domain/entities evolucionan sin romper aqui).
                  datetime serializado con default=str.

                  SqliteProducerRepository y
                  SqliteProductionRepository reemplazan a los
                  InMemory del mismo nombre; migrate_from_memory
                  copia los datos existentes (idempotente por PK).
                  Regla 76: ORDER BY rowid."""
                  from __future__ import annotations
                  import json as _j
                  import uuid
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)


                  class SqliteRepository:
                      """Repositorio SQLite generico (A-1)."""

                      ENTITY = "generic"

                      def __init__(self, db, clock=None):
                          self._db = db
                          MigrationRunner(
                              db, "agro.repo." + self.ENTITY,
                              (Migration(1, self._table(), (
                                  "CREATE TABLE IF NOT EXISTS "
                                  + self._table()
                                  + " (entity_id TEXT PRIMARY"
                                    " KEY, payload_json TEXT NOT"
                                    " NULL, created_at REAL NOT"
                                    " NULL, updated_at REAL NOT"
                                    " NULL)"),
                              )),
                          ).run(clock)

                      @classmethod
                      def _table(cls) -> str:
                          return ("agro_"
                                  + cls.ENTITY
                                  + "_entities")

                      @staticmethod
                      def _key(entity) -> str:
                          if isinstance(entity, dict):
                              k = (entity.get("entity_id")
                                   or entity.get("id")
                                   or entity.get("producer_id")
                                   or entity.get("production_id"))
                              if k:
                                  return str(k)
                              k = ("AGR-"
                                   + uuid.uuid4().hex[:12])
                              entity["entity_id"] = k
                              return k
                          k = str(getattr(entity, "entity_id",
                                          "")) or (
                              "AGR-" + uuid.uuid4().hex[:12])
                          try:
                              setattr(entity, "entity_id", k)
                          except Exception:
                              pass
                          return k

                      def save(self, entity):
                          k = self._key(entity)
                          now = 0.0
                          if self._clock is not None:
                              now = self._clock.now()
                          payload = _j.dumps(
                              entity if isinstance(entity, dict)
                              else getattr(entity, "__dict__",
                                           {}),
                              default=str, sort_keys=True)
                          self._db.execute(
                              "INSERT OR REPLACE INTO "
                              + self._table()
                              + " (entity_id, payload_json,"
                                " created_at, updated_at)"
                                " VALUES (?, ?,"
                                " COALESCE((SELECT created_at"
                                " FROM " + self._table()
                                + " WHERE entity_id = ?), ?),"
                                " ?)",
                              (k, payload, k, now, now))
                          return self.get(k)

                      def get(self, entity_id):
                          row = self._db.query_one(
                              "SELECT payload_json FROM "
                              + self._table()
                              + " WHERE entity_id = ?",
                              (str(entity_id),))
                          if not row:
                              return None
                          d = _j.loads(str(row["payload_json"]))
                          if isinstance(d, dict):
                              d.setdefault("entity_id",
                                           str(entity_id))
                          return d

                      def list(self):
                          rows = self._db.query_all(
                              "SELECT payload_json, entity_id"
                              " FROM " + self._table()
                              + " ORDER BY rowid")
                          out = []
                          for r in rows:
                              d = _j.loads(
                                  str(r["payload_json"]))
                              if isinstance(d, dict):
                                  d.setdefault(
                                      "entity_id",
                                      str(r["entity_id"]))
                              out.append(d)
                          return out

                      def delete(self, entity_id) -> bool:
                          row = self._db.query_one(
                              "SELECT entity_id FROM "
                              + self._table()
                              + " WHERE entity_id = ?",
                              (str(entity_id),))
                          if not row:
                              return False
                          self._db.execute(
                              "DELETE FROM " + self._table()
                              + " WHERE entity_id = ?",
                              (str(entity_id),))
                          return True

                      def count(self) -> int:
                          row = self._db.query_one(
                              "SELECT COUNT(*) AS n FROM "
                              + self._table())
                          return int(row["n"]) if row else 0


                  class SqliteProducerRepository(SqliteRepository):
                      ENTITY = "producer"


                  class SqliteProductionRepository(
                          SqliteRepository):
                      ENTITY = "production"


                  def migrate_from_memory(src, dst) -> int:
                      """Copia entidades del repo en memoria al
                      SQLite (regla 51: el viejo no se toca)."""
                      n = 0
                      for e in list(src.list() or []):
                          dst.save(e)
                          n += 1
                      return n
              '''))
              out("## FIN agro sqlite repo")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] A-3: utcnow -> now(timezone.utc) (quirurgico con py_compile + revert por archivo)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import pathlib, py_compile, re, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "") \
              if False else None
          import os
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          FILES = [
              "apps/agro/modules/seguridad/auditoria/audit_service.py",
              "apps/agro/modules/productores/documentos/document_service.py",
              "apps/agro/domain/entities/base_entity.py",
              "apps/agro/domain/events/domain_event.py",
          ]
          for p_str in FILES:
              p = pathlib.Path(p_str)
              try:
                  src = p.read_text(encoding="utf-8")
                  if "utcnow" not in src:
                      out("- A-3 " + p.name
                          + ": ya sin utcnow")
                      continue
                  orig = src
                  new = src.replace(
                      "datetime.utcnow()",
                      "datetime.now(timezone.utc)")
                  if re.search(r"^from datetime import",
                               new, re.M):
                      def _ext(m):
                          line = m.group(0)
                          if "timezone" in line:
                              return line
                          return (line.rstrip("\n")
                                  + ", timezone\n")
                      new = re.sub(r"^from datetime import"
                                   r"[^\n]*\n", _ext, new,
                                   count=1, flags=re.M)
                  elif re.search(r"^import datetime\b",
                                 new, re.M):
                      new = new.replace(
                          "datetime.now(timezone.utc)",
                          "datetime.datetime.now("
                          "timezone.utc)")
                      new = re.sub(
                          r"^import datetime\b",
                          "import datetime\n"
                          "from datetime import timezone",
                          new, count=1, flags=re.M)
                  else:
                      new = ("from datetime import timezone\n"
                             + new)
                  ast_ok = True
                  try:
                      import ast
                      ast.parse(new)
                  except SyntaxError:
                      ast_ok = False
                  if not ast_ok:
                      out("- A-3 " + p.name
                          + ": ERROR sintaxis (revertido)")
                      continue
                  p.write_text(new, encoding="utf-8")
                  try:
                      py_compile.compile(p_str, doraise=True)
                      out("- **A-3 " + p.name
                          + ": utcnow -> now(timezone.utc)"
                            " OK**")
                  except Exception:
                      p.write_text(orig, encoding="utf-8")
                      py_compile.compile(p_str, doraise=True)
                      out("- A-3 " + p.name
                          + ": fallo compile (revertido)")
                      out("```\n"
                          + traceback.format_exc().strip()
                          + "\n```")
              except Exception:
                  out("- A-3 " + p_str + ": EXCEPCION")
                  out("```\n"
                      + traceback.format_exc().strip()
                      + "\n```")
          exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests N-2/N-6 + A-1 + A-3"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          cat > apps/nexo/tests/test_n2_integraciones.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.accounting.general_ledger_engine import GeneralLedgerEngine
          from apps.nexo.domain.accounting.ledger_integration_engine import LedgerIntegrationEngine


          def _env(tmp_path):
              db = SQLiteAdapter(tmp_path / "n.db")
              clock = FrozenClock()
              gl = GeneralLedgerEngine(db, clock)
              itg = LedgerIntegrationEngine(db, clock, gl)
              return db, gl, itg


          def test_cxc_ciclo_factura_y_cobro(tmp_path) -> None:
              db, gl, itg = _env(tmp_path)
              r1 = itg.invoice_issued_ar(company_id="EMP-1",
                  period="2026-01", invoice_id="INV-1",
                  amount="1000.00")
              assert r1["total_debit"] == "1000.00"
              assert r1["total_credit"] == "1000.00"
              bal_ar = gl.account_balance("EMP-1", "1100",
                                          "2026-01")
              assert bal_ar["balance"] == "1000.00"
              bal_inc = gl.account_balance("EMP-1", "4000",
                                           "2026-01")
              assert bal_inc["balance"] == "-1000.00"
              r2 = itg.payment_received(company_id="EMP-1",
                  period="2026-01", invoice_id="INV-1",
                  amount="1000.00")
              assert r2["total_debit"] == "1000.00"
              bal_ar2 = gl.account_balance("EMP-1", "1100",
                                           "2026-01")
              assert bal_ar2["balance"] == "0.00"
              bal_bank = gl.account_balance("EMP-1", "1000",
                                            "2026-01")
              assert bal_bank["balance"] == "1000.00"
              assert itg.ledger_is_balanced(
                  company_id="EMP-1") is True
              assert all(e["source_ref"].startswith("N2:")
                         for e in gl.entries_of("EMP-1",
                                                "1100"))
              print("OK N-2 CxC: factura -> D CxC / C Ingreso; cobro -> D Bancos / C CxC; mayor cuadrado global + source_ref N2:*")


          def test_cxp_tesoreria_activo_fiscal(tmp_path) -> None:
