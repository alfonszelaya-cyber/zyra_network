name: ZYRA RUM 1 - Extraccion de base operativa (automatica) [LECTURA]

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraccion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Extraer archivos clave del RUM 1 al Summary
        run: |
          python - <<'PY'
          import ast, os, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []; A = L.append
          A("# 📦 RUM 1 — ARCHIVOS CLAVE (LECTURA — base para correccion completa)\n")

          archivos = [
              "superapp.py",
              "apps/laboratorio/infrastructure/api/app.py",
              "apps/laboratorio/infrastructure/api/dependencies.py",
              "apps/laboratorio/infrastructure/api/middleware.py",
              "apps/laboratorio/infrastructure/network/health.py",
              "apps/laboratorio/infrastructure/network/zyra_client.py",
              "apps/laboratorio/config/network/network_config.py",
              "apps/laboratorio/registry/engines/capabilities.py",
              "apps/laboratorio/registry/engines/engine_registry.py",
              "apps/laboratorio/registry/routes/route_registry.py",
              "apps/laboratorio/registry/menus/menu_tree.py",
              "apps/laboratorio/routers/public/health.py",
              "apps/laboratorio/routers/public/ui.py",
              "apps/laboratorio/schemas/requests/project.py",
              "apps/laboratorio/schemas/requests/scenario.py",
              "apps/laboratorio/schemas/responses/envelopes.py",
              "apps/laboratorio/schemas/shared/common.py",
              "apps/laboratorio/validators/shared/common_validators.py",
              "apps/laboratorio/validators/security/zid_validator.py",
              "apps/laboratorio/shared/decorators/audited.py",
              "apps/laboratorio/shared/decorators/timed.py",
              "apps/laboratorio/shared/decorators/idempotent.py",
              "apps/laboratorio/shared/decorators/require_permission.py",
              "apps/laboratorio/permissions/policies/project_policy.py",
              "apps/laboratorio/permissions/roles/role_definitions.py",
              "apps/laboratorio/permissions/rules/access_rules.py",
              "apps/laboratorio/permissions/scopes/scopes.py",
          ]
          for r in routers_api:
              pass
          routers_api = sorted(str(p) for p in Path("apps/laboratorio/routers/api").glob("*.py"))
          archivos += routers_api

          total = 0
          for ruta in archivos:
              p = Path(ruta)
              A(f"\n## 📄 {ruta}\n")
              if not p.is_file():
                  A("**NO EXISTE EN EL REPO**\n"); continue
              try:
                  t = p.read_text(encoding="utf-8", errors="replace")
                  total += len(t)
                  A(f"```python\n{t}\n```")
              except Exception as e:
                  A(f"**ERROR de lectura: {e}**\n")
          A(f"\n---\nTotal caracteres extraidos: {total}\n")

          # ---- stubs unicos de laboratorio ----
          A("\n## 🔍 STUBS en apps/laboratorio (clases/funciones vacias de nivel superior)\n```")
          for p in sorted(Path("apps/laboratorio").rglob("*.py")):
              try: arbol = ast.parse(p.read_text(encoding="utf-8", errors="replace"))
              except SyntaxError: continue
              for n in arbol.body:
                  if isinstance(n, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      cuerpo = list(n.body)
                      if cuerpo and isinstance(cuerpo[0], ast.Expr) and isinstance(cuerpo[0].value, ast.Constant):
                          cuerpo = cuerpo[1:]
                      if not cuerpo or (len(cuerpo)==1 and isinstance(cuerpo[0], ast.Pass)) or \
                         (len(cuerpo)==1 and isinstance(cuerpo[0], ast.Expr) and cuerpo[0].value is Ellipsis):
                          A(f"{p}:{n.lineno} {type(n).__name__} {n.name}")
          A("```")

          # ---- shims observability: contenido real ----
          A("\n## 🔍 SHIMS observability (contenido real de cada __init__)\n")
          for p in sorted(Path("observability").rglob("__init__.py")):
              t = p.read_text(encoding="utf-8", errors="replace").strip()
              A(f"### `{p}`\n```python\n{t if t else '(vacío)'}\n```")

          # ---- verificacion real: montar la app y listar rutas ----
          A("\n## 🔍 VERIFICACION REAL — montar_aplicacion() y rutas registradas\n```")
          try:
              import importlib
              mod = importlib.import_module("apps.laboratorio.infrastructure.api.app")
              candidato = None
              for nombre in ("app", "montar_aplicacion", "crear_app", "build_app"):
                  if hasattr(mod, nombre):
                      candidato = nombre; break
              if candidato is None:
                  A(f"modulo OK pero SIN export reconocido. exports: {[x for x in dir(mod) if not x.startswith('_')]}")
              else:
                  obj = getattr(mod, candidato)
                  app_obj = obj() if callable(obj) and candidato != "app" else obj
                  rutas = []
                  for r in getattr(app_obj, "routes", []):
                      metodos = ",".join(sorted(getattr(r, "methods", []) or []))
                      rutas.append(f"{metodos:12s} {getattr(r, 'path', r)}")
                  A(f"export usado: {candidato} · rutas registradas: {len(rutas)}")
                  A("\n".join(rutas))
                  A(f"export 'app' directo existe: {hasattr(mod, 'app')}")
          except Exception:
              A("FALLO el montaje real (esto es diagnostico honesto, no se oculta):")
              A(traceback.format_exc()[-1500:])
          A("```")

          # ---- health real ----
          A("\n## 🔍 VERIFICACION REAL — health de laboratorio\n```")
          try:
              import importlib
              m = importlib.import_module("apps.laboratorio.infrastructure.network.health")
              A(f"exports: {[x for x in dir(m) if not x.startswith('_')]}")
          except Exception:
              A(traceback.format_exc()[-800:])
          A("```")

          md = "\n".join(L)
          Path("rum1_archivos.md").write_text(md, encoding="utf-8")
          if summary:
              s = md
              if len(s) > 900000:
                  s = s[:900000] + "\n\n**(RECORTE — completo en el artefacto)**\n"
              with open(summary, "a") as fh:
                  fh.write(s)
          print(f"RUM 1 extraccion lista: {len(md)} chars")
          PY

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rum1-archivos
          path: rum1_archivos.md
