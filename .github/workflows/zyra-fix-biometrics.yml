                      order = None
                  if not order:
                      return self._page_wrap(
                          "Orden no encontrada",
                          "<p>No existe la orden: <code>" + order_id + "</code></p>",
                      )
                  rows = ""
                  for k, val in order.items():
                      rows += "<p><b>" + str(k) + "</b>: " + str(val) + "</p>"
                  body = (
                      "<div class='card'><h2>Orden " + order_id + "</h2>"
                      + rows
