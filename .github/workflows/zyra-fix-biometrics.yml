name: "ZYRA AUDIT RELAY 4 (flag corregido)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Test 1 bridge (timeout con dump de threads)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          {
          echo "## test_bridge_deliver_once_and_dedup"
          echo '```'
          timeout 150 python3 -m pytest "shared_engines/events/tests/test_events.py::test_bridge_deliver_once_and_dedup" -vv --tb=long --timeout=45 --timeout-method=thread 2>&1 | tail -80 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Test 2 bridge (timeout con dump de threads)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          {
          echo "## test_bridge_routes_by_type"
          echo '```'
          timeout 150 python3 -m pytest "shared_engines/events/tests/test_events.py::test_bridge_routes_by_type" -vv --tb=long --timeout=45 --timeout-method=thread 2>&1 | tail -80 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Suite events completa
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          {
          echo "## Suite events completa"
          echo '```'
          timeout 300 python3 -m pytest shared_engines/events/tests -q --timeout=45 --timeout-method=thread --tb=line 2>&1 | tail -25 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Fuente dispatch_pending y pending (zona clave)
        run: |
          {
          echo "## outbox.py lineas 107-260 (dispatch_pending, claim_batch, la zona oculta)"
          echo '```python'
          awk 'NR>=107 && NR<=260 {printf "%5d| %s\n", NR, $0}' shared_engines/events/outbox.py || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
