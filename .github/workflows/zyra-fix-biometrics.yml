name: "ZYRA AUDIT RED-7 (cripto fuera de la Red - red ligera)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Donde viven los motores hoy (peso de la Red)
        run: |
          {
          echo "## Arquitectura actual: peso por capa"
          echo '```'
          echo "=== RED (nucleo ligero): runtime + events + identity + network ==="
          du -sh shared_engines/runtime shared_engines/events shared_engines/identity shared_engines/network 2>/dev/null || true
          echo ""
          echo "=== MOTORES (fuera del nucleo, conectados) ==="
          du -sh shared_engines/payments shared_engines/currency shared_engines/tokenization 2>/dev/null || true
          echo ""
          echo "=== el kernel ensambla motores pero no los contiene ==="
          grep -n "self._currency\|self._tokens\|self._payments" shared_engines/runtime/kernel.py | head -10 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Tokenization ledger (candidato a base de la cartera cripto)
        run: |
          {
          echo "## tokenization/ledger.py lineas 180-320 (metodos de movimiento)"
          echo '```python'
          awk 'NR>=180 && NR<=320 {printf "%5d| %s\n", NR, $0}' shared_engines/tokenization/ledger.py 2>/dev/null || true
          echo '```'
          echo "## tokenization/engine.py defs"
          echo '```python'
          grep -n "^class \|    def " shared_engines/tokenization/engine.py 2>/dev/null | head -30 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Cartera de SUBASTAS (UI existente a conectar)
        run: |
          {
          echo "## cartera_store.py (estructura y las lineas del convertidor dibujado)"
          echo '```'
          grep -n "^class \|    def \|^def " apps/subastas/modules/motores/cartera_store.py 2>/dev/null | head -30 || true
          echo ""
          echo "--- contexto lineas 390-450 (convertidor USD/BTC/QTZ)"
          awk 'NR>=390 && NR<=450 {printf "%5d| %s\n", NR, $0}' apps/subastas/modules/motores/cartera_store.py 2>/dev/null || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Como se conectan hoy motores a apps (patron a seguir)
        run: |
          {
          echo "## Patron de conexion: subastas server usa motores?"
          echo '```'
          grep -n "PaymentsEngine\|CurrencyEngine\|import.*payments\|import.*currency" apps/subastas/server.py 2>/dev/null | head -10 || true
          echo ""
          echo "=== nexo usa motores? ==="
          grep -rn "CurrencyEngine\|PaymentsEngine" apps/nexo --include='*.py' | head -10 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Sonda CoinGecko (confirmacion de tasas para la cartera)
        run: |
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import urllib.request
          print("## CoinGecko (tasas para cartera cripto)")
          print("```")
          try:
              req = urllib.request.Request(
                  "https://api.coingecko.com/api/v3/simple/price"
                  "?ids=bitcoin,tether&vs_currencies=usd",
                  headers={"User-Agent": "zyra-network"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  d = json.loads(r.read().decode())
              print("OK:", json.dumps(d))
          except Exception as e:
              print("FALLO:", type(e).__name__, str(e)[:100])
          print("```")
          EOF
          exit 0
