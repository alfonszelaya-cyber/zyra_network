name: "ZYRA SEMILLA SM7 laboratorios+innovacion+investigacion+biblioteca + SM8 menus+transporte+patch"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] SM7 laboratorio + innovacion + investigacion + biblioteca"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          LAB = "apps/semilla/domain/laboratory"
          INNO = "apps/semilla/domain/innovation"
          RES = "apps/semilla/domain/research"
          LIB = "apps/semilla/domain/library"

          try:
              forzar(LAB + "/laboratory_engine.py", D(r'''
                  """Laboratory Engine - proyectos y experimentos de
                  laboratorios escolares (SM7). Produccion real
                  persistente: proyecto -> experimento -> resultado.
                  Labs: IA, robotica, programacion, biotecnologia,
                  energia, aeroespacial, cuantica, nano, ciberseguridad."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  LAB_TYPES = ("AI", "ROBOTICS", "PROGRAMMING",
                               "BIOTECH", "ENERGY", "AEROSPACE",
                               "QUANTUM", "NANO", "CYBERSECURITY")
                  PROJ_STATUS = ("ACTIVE", "COMPLETED", "CANCELLED")

                  _MIGRATIONS = (
                      Migration(1, "sm_lab_projects", (
                          "CREATE TABLE IF NOT EXISTS sm_lab_projects (project_id TEXT PRIMARY KEY, lab_type TEXT NOT NULL, title TEXT NOT NULL, lead_student_id TEXT NOT NULL, members_json TEXT NOT NULL DEFAULT '[]', status TEXT NOT NULL DEFAULT 'ACTIVE', created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                      )),
                      Migration(2, "sm_lab_experiments", (
                          "CREATE TABLE IF NOT EXISTS sm_lab_experiments (experiment_id TEXT PRIMARY KEY, project_id TEXT NOT NULL, name TEXT NOT NULL, method TEXT NOT NULL DEFAULT '', result TEXT, success INTEGER, created_at REAL NOT NULL)",
                      )),
                  )

                  class LaboratoryEngine:
                      """Proyectos y experimentos de laboratorio."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.lab",
                                          _MIGRATIONS).run(clock)

                      def create_project(self, *, lab_type, title,
                                         lead_student_id,
                                         members=None) -> dict:
                          if lab_type not in LAB_TYPES:
                              raise ValueError("lab_type invalido: "
                                               + str(lab_type))
                          if not str(title).strip():
                              raise ValueError("title requerido")
                          pid = "SMLAB-" + str(uuid.uuid4())
                          now = self._clock.now()
                          import json as _j
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_lab_projects"
                                  " (project_id, lab_type, title,"
                                  " lead_student_id, members_json,"
                                  " status, created_at, updated_at)"
                                  " VALUES (?, ?, ?, ?, ?, 'ACTIVE',"
                                  " ?, ?)",
                                  (pid, lab_type,
                                   str(title).strip(),
                                   lead_student_id,
                                   _j.dumps(members or [],
                                            default=str), now, now))
                          return self.get_project(pid)

                      def get_project(self, project_id
                                      ) -> Optional[dict]:
                          import json as _j
                          row = self._db.query_one(
                              "SELECT * FROM sm_lab_projects WHERE"
                              " project_id = ?", (project_id,))
                          if not row:
                              return None
                          return {"project_id":
                                      str(row["project_id"]),
                                  "lab_type": str(row["lab_type"]),
                                  "title": str(row["title"]),
                                  "lead_student_id":
                                      str(row["lead_student_id"]),
                                  "members": _j.loads(
                                      str(row["members_json"])),
                                  "status": str(row["status"])}

                      def run_experiment(self, *, project_id, name,
                                         method="",
                                         result=None,
                                         success=None) -> dict:
                          p = self.get_project(project_id)
                          if not p:
                              raise KeyError(project_id)
                          if p["status"] != "ACTIVE":
                              raise ValueError(
                                  "proyecto no activo")
                          if not str(name).strip():
                              raise ValueError("name requerido")
                          eid = "SMEXP-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_lab_experiments"
                                  " (experiment_id, project_id,"
                                  " name, method, result, success,"
                                  " created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, ?)",
                                  (eid, project_id,
                                   str(name).strip(),
                                   str(method),
                                   (str(result) if result
                                    is not None else None),
                                   (1 if success else 0
                                    if success is not None
                                    else None), now))
                          return {"experiment_id": eid,
                                  "project_id": project_id,
                                  "name": str(name).strip()}

                      def complete_project(self, project_id) -> dict:
                          self._db.execute(
                              "UPDATE sm_lab_projects SET status ="
                              " 'COMPLETED', updated_at = ? WHERE"
                              " project_id = ?",
                              (self._clock.now(), project_id))
                          return self.get_project(project_id)

                      def experiments_of(self, project_id
                                         ) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT * FROM sm_lab_experiments"
                              " WHERE project_id = ? ORDER BY rowid",
                              (project_id,))
                          return [{"experiment_id":
                                       str(r["experiment_id"]),
                                   "name": str(r["name"]),
                                   "method": str(r["method"]),
                                   "result": (str(r["result"])
                                              if r["result"]
                                              else None),
                                   "success": (bool(r["success"])
                                               if r["success"]
                                               is not None
                                               else None)}
                                  for r in rows]

                      def projects_by_lab(self,
                                          lab_type) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT project_id FROM"
                              " sm_lab_projects WHERE lab_type = ?"
                              " ORDER BY created_at", (lab_type,))
                          return [self.get_project(
                              str(r["project_id"]))
                              for r in rows]
              '''))

              forzar(INNO + "/innovation_engine.py", D(r'''
                  """Innovation Engine - startups estudiantiles,
                  patentes y transferencia tecnologica (SM7)."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  STARTUP_STAGES = ("IDEA", "INCUBATING", "LAUNCHED")
                  PATENT_STATUS = ("FILED", "UNDER_REVIEW",
                                   "GRANTED", "REJECTED")

                  _MIGRATIONS = (
                      Migration(1, "sm_startups", (
                          "CREATE TABLE IF NOT EXISTS sm_startups (startup_id TEXT PRIMARY KEY, name TEXT NOT NULL, founder_student_id TEXT NOT NULL, stage TEXT NOT NULL DEFAULT 'IDEA', description TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                      )),
                      Migration(2, "sm_patents", (
                          "CREATE TABLE IF NOT EXISTS sm_patents (patent_id TEXT PRIMARY KEY, title TEXT NOT NULL, student_id TEXT NOT NULL, project_ref TEXT NOT NULL DEFAULT '', status TEXT NOT NULL DEFAULT 'FILED', created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                      )),
                  )

                  class InnovationEngine:
                      """Startups y patentes estudiantiles."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.innovation",
                                          _MIGRATIONS).run(clock)

                      def create_startup(self, *, name,
                                         founder_student_id,
                                         description="") -> dict:
                          if not str(name).strip():
                              raise ValueError("name requerido")
                          sid = "SMSTU-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_startups"
                                  " (startup_id, name,"
                                  " founder_student_id, stage,"
                                  " description, created_at,"
                                  " updated_at)"
                                  " VALUES (?, ?, ?, 'IDEA', ?, ?, ?)",
                                  (sid, str(name).strip(),
                                   founder_student_id,
                                   str(description), now, now))
                          return self.get_startup(sid)

                      def get_startup(self, startup_id
                                      ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_startups WHERE"
                              " startup_id = ?", (startup_id,))
                          if not row:
                              return None
                          return {"startup_id":
                                      str(row["startup_id"]),
                                  "name": str(row["name"]),
                                  "founder_student_id":
                                      str(row["founder_student_id"]),
                                  "stage": str(row["stage"]),
                                  "description":
                                      str(row["description"])}

                      def advance_stage(self, startup_id) -> dict:
                          s = self.get_startup(startup_id)
                          if not s:
                              raise KeyError(startup_id)
                          order = list(STARTUP_STAGES)
                          idx = order.index(s["stage"])
                          if idx >= len(order) - 1:
                              raise ValueError(
                                  "ya en etapa final")
                          nxt = order[idx + 1]
                          self._db.execute(
                              "UPDATE sm_startups SET stage = ?,"
                              " updated_at = ? WHERE startup_id = ?",
                              (nxt, self._clock.now(), startup_id))
                          return self.get_startup(startup_id)

                      def file_patent(self, *, title, student_id,
                                      project_ref="") -> dict:
                          if not str(title).strip():
                              raise ValueError("title requerido")
                          pid = "SMPAT-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_patents"
                                  " (patent_id, title, student_id,"
                                  " project_ref, status, created_at,"
                                  " updated_at)"
                                  " VALUES (?, ?, ?, ?, 'FILED',"
                                  " ?, ?)",
                                  (pid, str(title).strip(),
                                   student_id, str(project_ref),
                                   now, now))
                          return {"patent_id": pid,
                                  "title": str(title).strip(),
                                  "status": "FILED"}

                      def update_patent(self, patent_id,
                                        status) -> dict:
                          if status not in PATENT_STATUS:
                              raise ValueError("status invalido")
                          self._db.execute(
                              "UPDATE sm_patents SET status = ?,"
                              " updated_at = ? WHERE patent_id = ?",
                              (status, self._clock.now(),
                               patent_id))
                          row = self._db.query_one(
                              "SELECT * FROM sm_patents WHERE"
                              " patent_id = ?", (patent_id,))
                          if not row:
                              raise KeyError(patent_id)
                          return {"patent_id":
                                      str(row["patent_id"]),
                                  "title": str(row["title"]),
                                  "status": str(row["status"])}

                      def startups_by_stage(self, stage
                                             ) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT startup_id FROM sm_startups"
                              " WHERE stage = ? ORDER BY created_at",
                              (stage,))
                          return [self.get_startup(
                              str(r["startup_id"]))
                              for r in rows]
              '''))

              forzar(RES + "/research_engine.py", D(r'''
                  """Research Engine - proyectos de investigacion
                  (SM7). Proyecto -> avance -> publicacion."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  RESEARCH_STATUS = ("ACTIVE", "PUBLISHED",
                                     "ARCHIVED")

                  _MIGRATIONS = (
                      Migration(1, "sm_research", (
                          "CREATE TABLE IF NOT EXISTS sm_research (research_id TEXT PRIMARY KEY, title TEXT NOT NULL, lead_student_id TEXT NOT NULL, area TEXT NOT NULL DEFAULT '', summary TEXT NOT NULL DEFAULT '', status TEXT NOT NULL DEFAULT 'ACTIVE', published_at REAL, created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                      )),
                  )

                  class ResearchEngine:
                      """Investigacion estudiantil (persistente)."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.research",
                                          _MIGRATIONS).run(clock)

                      def create_research(self, *, title,
                                          lead_student_id,
                                          area="",
                                          summary="") -> dict:
                          if not str(title).strip():
                              raise ValueError("title requerido")
                          rid = "SMRES-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_research"
                                  " (research_id, title,"
                                  " lead_student_id, area, summary,"
                                  " status, created_at, updated_at)"
                                  " VALUES (?, ?, ?, ?, ?, 'ACTIVE',"
                                  " ?, ?)",
                                  (rid, str(title).strip(),
                                   lead_student_id, str(area),
                                   str(summary), now, now))
                          return self.get_research(rid)

                      def get_research(self, research_id
                                       ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_research WHERE"
                              " research_id = ?", (research_id,))
                          if not row:
                              return None
                          return {"research_id":
                                      str(row["research_id"]),
                                  "title": str(row["title"]),
                                  "lead_student_id":
                                      str(row["lead_student_id"]),
                                  "area": str(row["area"]),
                                  "summary": str(row["summary"]),
                                  "status": str(row["status"])}

                      def publish(self, research_id,
                                  final_summary="") -> dict:
                          r = self.get_research(research_id)
                          if not r:
                              raise KeyError(research_id)
                          if r["status"] != "ACTIVE":
                              raise ValueError("no esta activa")
                          self._db.execute(
                              "UPDATE sm_research SET status ="
                              " 'PUBLISHED', summary = CASE WHEN"
                              " ? != '' THEN ? ELSE summary END,"
                              " published_at = ?, updated_at = ?"
                              " WHERE research_id = ?",
                              (str(final_summary),
                               str(final_summary),
                               self._clock.now(),
                               self._clock.now(), research_id))
                          return self.get_research(research_id)

                      def active_research(self) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT research_id FROM sm_research"
                              " WHERE status = 'ACTIVE'"
                              " ORDER BY created_at")
                          return [self.get_research(
                              str(r["research_id"]))
                              for r in rows]
              '''))

              forzar(LIB + "/library_engine.py", D(r'''
                  """Library Engine - biblioteca escolar (SM7).
                  Catalogo + prestamo/devolucion con disponible
                  transaccional."""
                  from __future__ import annotations
                  from decimal import (Decimal as _D,
                                       ROUND_HALF_UP as _UP)
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _Q = "0.01"

                  _MIGRATIONS = (
                      Migration(1, "sm_library_books", (
                          "CREATE TABLE IF NOT EXISTS sm_library_books (book_id TEXT PRIMARY KEY, title TEXT NOT NULL, author TEXT NOT NULL DEFAULT '', copies_total INTEGER NOT NULL DEFAULT 1, copies_available INTEGER NOT NULL DEFAULT 1, created_at REAL NOT NULL)",
                      )),
                      Migration(2, "sm_library_loans", (
                          "CREATE TABLE IF NOT EXISTS sm_library_loans (loan_id TEXT PRIMARY KEY, book_id TEXT NOT NULL, student_id TEXT NOT NULL, returned INTEGER NOT NULL DEFAULT 0, created_at REAL NOT NULL, returned_at REAL)",
                      )),
                  )

                  class LibraryEngine:
                      """Biblioteca escolar (persistente)."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.library",
                                          _MIGRATIONS).run(clock)

                      def add_book(self, *, title, author="",
                                   copies=1) -> dict:
                          if not str(title).strip():
                              raise ValueError("title requerido")
                          if int(copies) <= 0:
                              raise ValueError("copies > 0")
                          bid = "SMBOOK-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_library_books"
                                  " (book_id, title, author,"
                                  " copies_total,"
                                  " copies_available, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?)",
                                  (bid, str(title).strip(),
                                   str(author), int(copies),
                                   int(copies), now))
                          return self.get_book(bid)

                      def get_book(self, book_id
                                   ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_library_books WHERE"
                              " book_id = ?", (book_id,))
                          if not row:
                              return None
                          return {"book_id": str(row["book_id"]),
                                  "title": str(row["title"]),
                                  "author": str(row["author"]),
                                  "copies_total":
                                      int(row["copies_total"]),
                                  "copies_available":
                                      int(row["copies_available"])}

                      def checkout(self, *, book_id,
                                   student_id) -> dict:
                          with self._db.transaction() as cursor:
                              row = cursor.execute(
                                  "SELECT copies_available FROM"
                                  " sm_library_books WHERE book_id"
                                  " = ?", (book_id,)).fetchone()
                              if row is None:
                                  raise KeyError(book_id)
                              if int(row["copies_available"]) <= 0:
                                  raise ValueError(
                                      "sin copias disponibles")
                              cursor.execute(
                                  "UPDATE sm_library_books SET"
                                  " copies_available ="
                                  " copies_available - 1 WHERE"
                                  " book_id = ?", (book_id,))
                              lid = "SMLOAN-" + str(uuid.uuid4())
                              cursor.execute(
                                  "INSERT INTO sm_library_loans"
                                  " (loan_id, book_id, student_id,"
                                  " returned, created_at)"
                                  " VALUES (?, ?, ?, 0, ?)",
                                  (lid, book_id, student_id,
                                   self._clock.now()))
                          return {"loan_id": lid,
                                  "book_id": book_id,
                                  "student_id": student_id,
                                  "status": "CHECKED_OUT"}

                      def return_book(self, loan_id) -> dict:
                          row = self._db.query_one(
                              "SELECT * FROM sm_library_loans WHERE"
                              " loan_id = ? AND returned = 0",
                              (loan_id,))
                          if not row:
                              raise KeyError(loan_id)
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "UPDATE sm_library_loans SET"
                                  " returned = 1, returned_at = ?"
                                  " WHERE loan_id = ?",
                                  (self._clock.now(), loan_id))
                              cursor.execute(
                                  "UPDATE sm_library_books SET"
                                  " copies_available ="
                                  " copies_available + 1 WHERE"
                                  " book_id = ?",
                                  (str(row["book_id"]),))
                          return {"loan_id": str(loan_id),
                                  "status": "RETURNED"}

                      def search(self, term) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT * FROM sm_library_books")
                          t = str(term).lower()
                          out = []
                          for r in rows:
                              if (t in str(r["title"]).lower()
                                      or t in str(
                                          r["author"]).lower()):
                                  out.append(self.get_book(
                                      str(r["book_id"])))
                          return out
              '''))
              out("## FIN SM7 builder")
          except Exception:
              out("## SM7 BUILDER ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] SM8 transporte + 11 menus + registry + patch + inyeccion"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          TR = "apps/semilla/domain/transportation"
          MOD = "apps/semilla/module"
          SE = "apps/semilla/services"

          MENUS = {
            "modulo_1_identidad_educativa.py": ("Identidad Educativa", "Registro de estudiante|Referencia ZID|Verificacion de identidad"),
            "modulo_2_aprendizaje.py": ("Aprendizaje", "Tutor IA|Retos adaptativos|Mis sesiones"),
            "modulo_3_talento.py": ("Talento", "Deteccion de talento|Registro nacional|Mentorias"),
            "modulo_4_academico.py": ("Academico", "Matriculas|Asistencia|Evaluaciones|Historial"),
            "modulo_5_laboratorios.py": ("Laboratorios", "Proyectos de lab|Experimentos|Resultados"),
            "modulo_6_innovacion.py": ("Innovacion", "Startups estudiantiles|Patentes"),
            "modulo_7_bienestar_emocional.py": ("Bienestar Emocional", "Monitoreo emocional|Psicologia|Alertas"),
            "modulo_8_economia_educativa.py": ("Economia Educativa", "Becas|Pagos escolares|Subsidios y bonos"),
            "modulo_9_futuro_profesional.py": ("Futuro Profesional", "Orientacion vocacional|Rutas avanzadas"),
            "modulo_10_gobernanza.py": ("Gobernanza", "Supervision escolar|Panel ministerial|Reportes"),
            "modulo_11_zyra_education.py": ("ZYRA Education", "Credenciales educativas|Historial en la Red|Eventos SEMILLA"),
          }

          try:
              forzar(TR + "/transportation_engine.py", D(r'''
                  """Transportation Engine - transporte escolar
                  (SM8). Rutas con paradas y estudiantes asignados
                  por ruta. Persistente."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_transport_routes", (
                          "CREATE TABLE IF NOT EXISTS sm_transport_routes (route_id TEXT PRIMARY KEY, name TEXT NOT NULL, driver TEXT NOT NULL DEFAULT '', capacity INTEGER NOT NULL DEFAULT 20, assigned INTEGER NOT NULL DEFAULT 0, active INTEGER NOT NULL DEFAULT 1, created_at REAL NOT NULL)",
                      )),
                      Migration(2, "sm_transport_stops", (
                          "CREATE TABLE IF NOT EXISTS sm_transport_stops (stop_id TEXT PRIMARY KEY, route_id TEXT NOT NULL, stop_name TEXT NOT NULL, order_num INTEGER NOT NULL DEFAULT 0, created_at REAL NOT NULL)",
                      )),
                      Migration(3, "sm_transport_students", (
                          "CREATE TABLE IF NOT EXISTS sm_transport_students (assign_id TEXT PRIMARY KEY, route_id TEXT NOT NULL, student_id TEXT NOT NULL, stop_id TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL, UNIQUE(student_id))",
                      )),
                  )

                  class TransportationEngine:
                      """Rutas de transporte escolar (persistente)."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.transport",
                                          _MIGRATIONS).run(clock)

                      def create_route(self, *, name, driver="",
                                       capacity=20) -> dict:
                          if not str(name).strip():
                              raise ValueError("name requerido")
                          if int(capacity) <= 0:
                              raise ValueError("capacity > 0")
                          rid = "SMRUT-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_transport_routes"
                                  " (route_id, name, driver,"
                                  " capacity, assigned, active,"
                                  " created_at)"
                                  " VALUES (?, ?, ?, ?, 0, 1, ?)",
                                  (rid, str(name).strip(),
                                   str(driver), int(capacity), now))
                          return self.get_route(rid)

                      def get_route(self, route_id
                                    ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_transport_routes"
                              " WHERE route_id = ?", (route_id,))
                          if not row:
                              return None
                          return {"route_id":
                                      str(row["route_id"]),
                                  "name": str(row["name"]),
                                  "driver": str(row["driver"]),
                                  "capacity": int(row["capacity"]),
                                  "assigned": int(row["assigned"]),
                                  "cupos": (int(row["capacity"])
                                            - int(row["assigned"])),
                                  "active": bool(row["active"])}

                      def add_stop(self, *, route_id, stop_name,
                                   order_num=0) -> dict:
                          if not str(stop_name).strip():
                              raise ValueError(
                                  "stop_name requerido")
                          sid = "SMSTP-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_transport_stops"
                                  " (stop_id, route_id, stop_name,"
                                  " order_num, created_at)"
                                  " VALUES (?, ?, ?, ?, ?)",
                                  (sid, route_id,
                                   str(stop_name).strip(),
                                   int(order_num), now))
                          return {"stop_id": sid,
                                  "route_id": route_id,
                                  "stop_name":
                                      str(stop_name).strip()}

                      def assign_student(self, *, route_id,
                                         student_id,
                                         stop_id="") -> dict:
                          with self._db.transaction() as cursor:
                              dup = cursor.execute(
                                  "SELECT assign_id FROM"
                                  " sm_transport_students WHERE"
                                  " student_id = ?",
                                  (student_id,)).fetchone()
                              if dup is not None:
                                  raise ValueError(
                                      "ya asignado a una ruta")
                              row = cursor.execute(
                                  "SELECT capacity, assigned FROM"
                                  " sm_transport_routes WHERE"
                                  " route_id = ?",
                                  (route_id,)).fetchone()
                              if row is None:
                                  raise KeyError(route_id)
                              if (int(row["assigned"])
                                      >= int(row["capacity"])):
                                  raise ValueError(
                                      "ruta sin cupos")
                              cursor.execute(
                                  "UPDATE sm_transport_routes SET"
                                  " assigned = assigned + 1 WHERE"
                                  " route_id = ?", (route_id,))
                              aid = "SMASN-" + str(uuid.uuid4())
                              cursor.execute(
                                  "INSERT INTO"
                                  " sm_transport_students"
                                  " (assign_id, route_id,"
                                  " student_id, stop_id, created_at)"
                                  " VALUES (?, ?, ?, ?, ?)",
                                  (aid, route_id, student_id,
                                   str(stop_id),
                                   self._clock.now()))
                          return {"assign_id": aid,
                                  "route_id": route_id,
                                  "student_id": student_id}
              '''))

              for rel in sorted(MENUS):
                  title, opts_pipe = MENUS[rel]
                  mid = rel[:-3]
                  opts = ", ".join('"' + o + '"'
                                   for o in opts_pipe.split("|"))
                  content = (
                      '"""Menu: ' + title
                      + ' - SEMILLA / ZYRA (SM8)."""\n'
                      'MODULE = "semilla"\n'
                      'MENU_ID = "' + mid + '"\n'
                      'TITLE = "' + title + '"\n'
                      'OPTIONS = [' + opts + ']\n'
                      '\n'
                      '\n'
                      'def menu() -> dict:\n'
                      '    """Definicion del menu (data puro)."""\n'
                      '    return {"module": MODULE,\n'
                      '            "menu_id": MENU_ID,\n'
                      '            "title": TITLE,\n'
                      '            "options": [{"key": str(i + 1),\n'
                      '                         "label": opt}\n'
                      '                        for i, opt\n'
                      '                        in enumerate(OPTIONS)]}\n')
                  forzar(MOD + "/" + rel, content)

              forzar(MOD + "/__init__.py", D(r'''
                  """Menu Registry de modulos SEMILLA (SM8)."""
                  from pathlib import Path
                  import importlib

                  _BASE = Path(__file__).parent

                  def discover_menus() -> list:
                      """Descubre los menu.py con contenido."""
                      menus = []
                      for p in sorted(_BASE.rglob("*.py")):
                          try:
                              if (p.name != "__init__.py"
                                      and p.stat().st_size <= 1):
                                  continue
                              if p.name == "__init__.py":
                                  continue
                              rel = p.relative_to(_BASE).as_posix()
                              mod = importlib.import_module(
                                  "apps.semilla.module."
                                  + rel[:-3].replace("/", "."))
                              fn = getattr(mod, "menu", None)
                              if not callable(fn):
                                  continue
                              entry = fn()
                              entry["path"] = rel
                              menus.append(entry)
                          except Exception:
                              continue
                      return menus
              '''))

              forzar(SE + "/menu_server_patch.py", D(r'''
                  """Menu server patch SEMILLA - patch aditivo
                  (regla 51). Envuelve do_GET de cualquier handler
                  para servir /semilla/menus sin tocar el server
                  vivo (SE-1). Idempotente por marca de clase."""
                  from __future__ import annotations
                  import json as _json
                  from apps.semilla.module import discover_menus

                  def apply_menu_routes(handler_cls):
                      """Aplica el patch una sola vez."""
                      if getattr(handler_cls,
                                 "_sm8_menus_applied", False):
                          return handler_cls
                      original = getattr(handler_cls, "do_GET",
                                         None)

                      def do_GET(self):
                          path = ((getattr(self, "path", "")
                                   or "").split("?")[0])
                          if (path == "/semilla/menus"
                                  or path.startswith(
                                      "/semilla/menus/")):
                              mid = ""
                              if len(path) > len(
                                      "/semilla/menus/"):
                                  mid = path[len("/semilla/menus/"):]\
                                      .lstrip("/")
                              found = None
                              for m in discover_menus():
                                  if m["menu_id"] == mid:
                                      found = m
                                      break
                              if mid:
                                  code = 200 if found else 404
                                  payload = (found if found else
                                             {"error": "menu no"
                                                       " encontrado"})
                              else:
                                  code = 200
                                  payload = {"total":
                                             len(discover_menus()),
                                             "menus":
                                             discover_menus()}
                              body = _json.dumps(
                                  payload,
                                  default=str).encode("utf-8")
                              self.send_response(code)
                              self.send_header(
                                  "Content-Type",
                                  "application/json")
                              self.send_header(
                                  "Content-Length",
                                  str(len(body)))
                              self.end_headers()
                              self.wfile.write(body)
                              return
                          if original is not None:
                              return original(self)
                          self.send_response(404)
                          self.end_headers()

                      handler_cls.do_GET = do_GET
                      handler_cls._sm8_menus_applied = True
                      return handler_cls
              '''))

              sp = pathlib.Path("apps/semilla/server.py")
              if not sp.exists():
                  out("- server.py de SEMILLA no existe — skip")
              elif "sm8_menus" in sp.read_text(encoding="utf-8"):
                  out("- server.py: ya inyectado — skip")
              else:
                  src = sp.read_text(encoding="utf-8")
                  tree = ast.parse(src)
                  doget = None
                  for node in tree.body:
                      if isinstance(node, ast.ClassDef):
                          has_get = any(
                              isinstance(m, ast.FunctionDef)
                              and m.name == "do_GET"
                              for m in node.body)
                          if has_get:
                              doget = (node, next(
                                  m for m in node.body
                                  if isinstance(m, ast.FunctionDef)
                                  and m.name == "do_GET"))
                  if doget is None:
                      out("- server.py: handler con do_GET no hallado"
                          " — skip honesto")
                  else:
                      cls_node, fn_node = doget
                      idx = fn_node.body[0].lineno - 1
                      block = [
                          '        from apps.semilla.routers.'
                          'modules_router import (list_menus as'
                          ' _sm8_list, get_menu as _sm8_get)',
                          '        _sm8_path = ((getattr(self,'
                          ' "path", "") or "").split("?")[0])',
                          '        if (_sm8_path == "/semilla/menus"'
                          ' or _sm8_path.startswith('
                          '"/semilla/menus/")):',
                          '            import json as _json',
                          '            _sm8_mid = ""',
                          '            if len(_sm8_path) > len('
                          '"/semilla/menus/"):',
                          '                _sm8_mid = _sm8_path['
                          'len("/semilla/menus/"):].lstrip("/")',
                          '            _sm8_payload = _sm8_list()'
                          ' if not _sm8_mid else _sm8_get('
                          '_sm8_mid)',
                          '            _sm8_code = 200 if'
                          ' _sm8_payload else 404',
                          '            _sm8_body = _json.dumps('
                          '_sm8_payload, default=str).encode('
                          '"utf-8")',
                          '            self.send_response('
                          '_sm8_code)',
                          '            self.send_header('
                          '"Content-Type", "application/json")',
                          '            self.send_header('
                          '"Content-Length", str(len(_sm8_body)))',
                          '            self.end_headers()',
                          '            self.wfile.write(_sm8_body)',
                          '            return',
                      ]
                      lines = src.split("\n")
                      new_src = "\n".join(
                          lines[:idx] + block + lines[idx:])
                      try:
                          ast.parse(new_src)
                          sp.write_text(new_src, encoding="utf-8")
                          py_compile.compile(
                              "apps/semilla/server.py",
                              doraise=True)
                          out("- **server.py SEMILLA: bloque"
                              " /semilla/menus inyectado"
                              " OK (clase "
                              + cls_node.name + ")**")
                      except Exception:
                          out("- server.py: inyeccion fallo"
                              " — original intacto (skip"
                              " honesto)")

              forzar("apps/semilla/routers/modules_router.py", D(r'''
                  """Semilla Modules Router (SM8)."""
                  from __future__ import annotations
                  from apps.semilla.module import discover_menus

                  def list_menus(module="", limit=100) -> dict:
                      """Lista de menus SEMILLA."""
                      menus = discover_menus()
                      if module:
                          menus = [m for m in menus
                                   if m.get("module") == module]
                      return {"total": len(menus),
                              "menus": menus[:limit]}

                  def get_menu(menu_id):
                      """Un menu por id, o None."""
                      for m in discover_menus():
                          if m["menu_id"] == menu_id:
                              return m
                      return None
              '''))

              out("## FIN SM8: transporte + 11 menus + registry + patch")
          except Exception:
              out("## SM8 BUILDER ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

