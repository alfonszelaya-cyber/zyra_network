      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si todo verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/r4b 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: rojo — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(AGRO A-4..A-14 COMPLETO — 11 engines, patron _DDL+ensure_db): A-4 LandGeoEngine (GIS/suelo/riego/area + uso historico + rotacion + resumen parcelario) · A-5 AgronomyEngine (insumos semilla/fertilizante/agroquimico + plagas con cierre protegido + inspecciones + resumen agronomico) · A-6 HarvestEngine (cosecha sobre plan — CANCELADO rechazado regla 66; lotes peso/grado/rechazos/almacen; trazabilidad plan->cosecha->lote; carga por almacen) · A-7 LivestockEngine (expediente animal + genealogia sire/dam verificada + eventos VACUNA/TRATAMIENTO/PESO/MOVIMIENTO/MUERTE — muerte bloquea + resumen vivos/muertos) · A-8 InventoryBatchEngine (lotes con entry_seq y vencimiento + FIFO/FEFO + stock insuficiente honesto + movimientos + vencidos) · A-9 MachineryOpsEngine (horas/combustible + mantenimiento PREVENTIVA/CORRECTIVA costo 2d + ordenes con cierre unico + resumen) · A-10 WaterOpsEngine (consumo con sobre-consumo rechazado + programacion semanal + balance covers_week) · A-11 ContractsEngine (contratos draft->signed->delivered->liquidated, cancel solo pre-signed, OC exige signed, liquidacion neto 2d money.py) · A-12 ExportDocsEngine (expediente con lote exportable verificado, docs min 2 para ready regla 66, despacho requiere ready, vista completa) · A-13 AgroRiskUnified (formula transparente clima+productivo+impacto-resiliencia, servicios duenos invocados via _fit_kwargs, not_evaluated honesto, historial + peores) · A-14 AidGovernanceEngine (duplicados bloquean, elegibilidad con motivo obligatorio, decide exige ELIGIBLE, metricas de impacto) — FIX del rojo: migraciones definidas pero NUNCA ejecutadas; ahora ensure_db() (CREATE IF NOT EXISTS directo, idempotente) al inicio de cada funcion publica y en semillas de tests; leccion c: DDLs de tablas ajenas referenciadas recreados con esquema exacto de auditoria; reglas 66/68/76/61"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — AGRO AVANZADO COMPLETO (A-4..A-14, 11/11). RUN 5: AX-4..AX-9 AXIS (justicia automatizada regla 79 + salud EHR + policía + criminal + forense + evidencia) — con auditoria previa.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
