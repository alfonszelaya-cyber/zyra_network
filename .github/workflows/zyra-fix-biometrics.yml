name: "AXIS AX-1 v4: fixes de test (firma helper + madre inscrita antes del nacimiento)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - ley en axis_link.register_person"
        run: |
          python3 - <<'LAWEOF'
          from pathlib import Path
          p = Path(
              "apps/axis/services/axis_link.py")
          t = p.read_text(encoding="utf-8")
          if "biometria: use enroll_person" in t:
              print("SKIP ley")
              raise SystemExit(0)
          usos = []
          for q in Path("apps/axis").rglob("*.py"):
              if "__pycache__" in q.parts:
                  continue
              if q.name == "axis_link.py":
                  continue
              if "register_person" in q.read_text(
                  encoding="utf-8",
                  errors="ignore"):
                  usos.append(str(q))
          if usos:
              print("SKIP ley: en uso por"
                    " " + str(usos))
              raise SystemExit(0)
          start = t.find(
              "    def register_person(")
          end = t.find(
              "    def enroll_person(")
          assert start >= 0 and end > start
          nuevo = (
              "    def register_person(\n"
              "        self, display_name: str\n"
              "    ) -> tuple[\n"
              "        bool, dict | None,"
              " str | None\n"
              "    ]:\n"
              "        \"\"\"LAW: person registration\n"
              "        requires biometric enrollment.\n"
              "        Use enroll_person with document\n"
              "        and selfie.\"\"\"\n"
              "        raise ValueError(\n"
              "            \"registro de persona requiere\"\n"
              "            \" biometria: use enroll_person\"\n"
              "            \" con documento y selfie\"\n"
              "        )\n\n"
          )
          t = t[:start] + nuevo + t[end:]
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          print("ley escrita")
          LAWEOF

      - name: "Paso 1b - verificacion por llamada real"
        run: |
          python3 -c "
          from apps.axis.services.axis_link import AxisLink
          link = AxisLink(None)
          try:
              link.register_person('X')
          except ValueError as e:
              assert 'biometria' in str(e), str(e)
              print('OK ley verificada')
          else:
              raise SystemExit('FALLO ley')
          "

      - name: "Paso 2 - server: verify_service + auto-wire"
        run: |
          python3 - <<'SVCEOF'
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if "verify_service: ClassVar" not in t:
              ancla = (
                  "    life_history_service:"
                  " ClassVar[object] = None\n"
              )
              assert ancla in t, "ancla ClassVar"
              t = t.replace(
                  ancla,
                  ancla
                  + "    verify_service:"
                  " ClassVar[object] = None\n",
                  1)
          if "build_life_history" not in t:
              idx = t.find("def serve_axis(")
              assert idx >= 0, "serve_axis"
              nueva = (
                  "def serve_axis(\n"
                  "    store: AxisStore,\n"
                  "    client: NetworkClient,\n"
                  "    *,\n"
                  "    host: str = \"127.0.0.1\",\n"
                  "    port: int = 0,\n"
                  "    life_history_service=None,\n"
                  "    verify_service=None,\n"
                  ") -> AxisServer:\n"
                  "    if life_history_service is"
                  " None:\n"
                  "        from"
                  " apps.axis.life_history.integration"
                  " import (\n"
                  "            build_life_history,\n"
                  "        )\n"
                  "        life_history_service = (\n"
                  "            build_life_history(\n"
                  "                db=store._db,\n"
                  "                clock=store._clock,\n"
                  "                network_client=(\n"
                  "                    client\n"
                  "                ),\n"
                  "            )\n"
                  "        )\n"
                  "    AxisApiHandler.store = store\n"
                  "    AxisApiHandler.link = (\n"
                  "        AxisLink(client)\n"
                  "    )\n"
                  "    AxisApiHandler."
                  "life_history_service = (\n"
                  "        life_history_service\n"
                  "    )\n"
                  "    AxisApiHandler.verify_service"
                  " = verify_service\n"
                  "    return AxisServer(\n"
                  "        (host, port)\n"
                  "    )\n"
              )
              t = t[:idx] + nueva
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert "verify_service: ClassVar" in escrito
          assert "build_life_history" in escrito
          print("OK serve_axis (verificado)")
          SVCEOF

      - name: "Paso 3 - server: rutas audit/verify (GET)"
        run: |
          python3 - <<'GETEOF'
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if '"audit", "verify"' in t:
              print("SKIP GET")
              raise SystemExit(0)
          ancla = '        if s == ["health"]:\n'
          assert ancla in t, "ancla health"
          GET = (
              '        if s == ["audit", "verify"]:\n'
              "            life = (\n"
              "                type(self).\n"
              "                life_history_service\n"
              "            )\n"
              "            if life is None:\n"
              "                self._send(\n"
              "                    503,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"not_wired\"\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            ok_b, count = (\n"
              "                life._store.\n"
              "                births_chain_verify()\n"
              "            )\n"
              "            self._send(\n"
              "                200,\n"
              "                {\n"
              "                    \"ok\": True,\n"
              "                    \"data\": {\n"
              "                        \"births_chain\": {\n"
              "                            \"ok\": ok_b,\n"
              "                            \"checked\": (\n"
              "                                count\n"
              "                            ),\n"
              "                        },\n"
              "                    },\n"
              "                },\n"
              "            )\n"
              "            return\n"
              "        if (\n"
              "            len(s) == 3\n"
              "            and s[0] == \"audit\"\n"
              "            and s[1] == \"verify\"\n"
              "        ):\n"
              "            life = (\n"
              "                type(self).\n"
              "                life_history_service\n"
              "            )\n"
              "            if life is None:\n"
              "                self._send(\n"
              "                    503,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"not_wired\"\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            pid = s[2]\n"
              "            ok_e = (\n"
              "                life._store.\n"
              "                events_verify(pid)\n"
              "            )\n"
              "            n = len(\n"
              "                life._store.\n"
              "                events_of(pid)\n"
              "            )\n"
              "            self._send(\n"
              "                200,\n"
              "                {\n"
              "                    \"ok\": True,\n"
              "                    \"data\": {\n"
              "                        \"person_id\": (\n"
              "                            pid\n"
              "                        ),\n"
              "                        \"events_chain_ok\": (\n"
              "                            ok_e\n"
              "                        ),\n"
              "                        \"events\": n,\n"
              "                    },\n"
              "                },\n"
              "            )\n"
              "            return\n"
          )
          t = t.replace(
              ancla, GET + ancla, 1)
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          assert '"audit", "verify"' in p.read_text(
              encoding="utf-8")
          print("OK rutas GET audit")
          GETEOF

      - name: "Paso 4 - server: rutas verify generate/redeem (POST)"
        run: |
          python3 - <<'POSTEOF'
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if '"verify", "generate"' in t:
              print("SKIP POST")
              raise SystemExit(0)
          ancla = (
              '        if s == ["emergencies"]:\n'
          )
          assert ancla in t, "ancla emergencies"
          P = (
              '        if s == ["verify", "generate"]:\n'
              "            svc = (\n"
              "                type(self).\n"
              "                verify_service\n"
              "            )\n"
              "            if svc is None:\n"
              "                self._send(\n"
              "                    503,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"not_wired\"\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            from"
              " apps.axis.life_history."
              "public_verify import (\n"
              "                NotAuthorizedError,\n"
              "            )\n"
              "            try:\n"
              "                code = (\n"
              "                    svc.generate_code(\n"
              "                        subject_zid=(\n"
              "                            self._req(\n"
              "                                doc,\n"
              "                                \"subject_zid\",\n"
              "                            )\n"
              "                        ),\n"
              "                        operator_account=(\n"
              "                            self._req(\n"
              "                                doc,\n"
              "                                \"operator_account\",\n"
              "                            )\n"
              "                        ),\n"
              "                        operator_role=(\n"
              "                            self._req(\n"
              "                                doc,\n"
              "                                \"operator_role\",\n"
              "                            )\n"
              "                        ),\n"
              "                    )\n"
              "                )\n"
              "            except NotAuthorizedError"
              " as exc:\n"
              "                self._send(\n"
              "                    403,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"forbidden\",\n"
              "                            \"message\":\n"
              "                            str(exc),\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            self._send(\n"
              "                201,\n"
              "                {\n"
              "                    \"ok\": True,\n"
              "                    \"data\": code,\n"
              "                },\n"
              "            )\n"
              "            return\n"
              "        if s == [\"verify\", \"redeem\"]:\n"
              "            svc = (\n"
              "                type(self).\n"
              "                verify_service\n"
              "            )\n"
              "            if svc is None:\n"
              "                self._send(\n"
              "                    503,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"not_wired\"\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            from"
              " apps.axis.life_history."
              "public_verify import (\n"
              "                NotAuthorizedError,\n"
              "                CodeNotFoundError,\n"
              "                CodeAlreadyUsedError,\n"
              "                CodeExpiredError,\n"
              "            )\n"
              "            try:\n"
              "                cert = (\n"
              "                    svc.redeem_code(\n"
              "                        code=(\n"
              "                            self._req(\n"
              "                                doc,\n"
              "                                \"code\",\n"
              "                            )\n"
              "                        ),\n"
              "                        requester=(\n"
              "                            self._req(\n"
              "                                doc,\n"
              "                                \"requester\",\n"
              "                            )\n"
              "                        ),\n"
              "                        requester_role=(\n"
              "                            self._req(\n"
              "                                doc,\n"
              "                                \"requester_role\",\n"
              "                            )\n"
              "                        ),\n"
              "                    )\n"
              "                )\n"
              "            except NotAuthorizedError"
              " as exc:\n"
              "                self._send(\n"
              "                    403,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"forbidden\",\n"
              "                            \"message\":\n"
              "                            str(exc),\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            except CodeNotFoundError"
              " as exc:\n"
              "                self._send(\n"
              "                    404,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"not_found\",\n"
              "                            \"message\":\n"
              "                            str(exc),\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            except CodeAlreadyUsedError"
              " as exc:\n"
              "                self._send(\n"
              "                    409,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"already_used\",\n"
              "                            \"message\":\n"
              "                            str(exc),\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            except CodeExpiredError"
              " as exc:\n"
              "                self._send(\n"
              "                    410,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"expired\",\n"
              "                            \"message\":\n"
              "                            str(exc),\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            self._send(\n"
              "                200,\n"
              "                {\n"
              "                    \"ok\": True,\n"
              "                    \"data\": cert,\n"
              "                },\n"
              "            )\n"
              "            return\n"
          )
          t = t.replace(
              ancla, P + ancla, 1)
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          for req in (
              '"verify", "generate"',
              '"verify", "redeem"',
          ):
              assert req in escrito, req
          print("OK rutas POST verify")
          POSTEOF

      - name: "Paso 5 - tests AX-1 v4 (firma corregida + madre inscrita antes del nacimiento)"
        run: |
          python3 - <<'TSEOF'
          import textwrap
          from pathlib import Path

          p = Path("apps/axis/tests/test_axis.py")
          t = p.read_text(encoding="utf-8")
          if "test_ax1_" in t:
              print("SKIP tests")
              raise SystemExit(0)

          EXTRA = textwrap.dedent('''\


              # ====== AX-1: ley + auditoria + verificacion publica ======


              def _ax1_boot(*, with_verify=False):
                  import threading
                  import time as _t
                  from apps.axis.infrastructure.persistence.axis_store import (
                      AxisStore,
                  )
                  from apps.axis.infrastructure.network.network_client import (
                      NetworkClient,
                  )
                  from apps.axis.server import serve_axis
                  from apps.axis.life_history.integration import (
                      build_life_history,
                  )
                  from shared_engines.storage.database import (
                      SQLiteAdapter,
                  )
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )
                  db = SQLiteAdapter(":memory:")
                  store = AxisStore(db, SystemClock())
                  client = NetworkClient(
                      "http://127.0.0.1:1",
                      timeout_seconds=1.0,
                      max_retries=0,
                  )
                  life = build_life_history(
                      db=db,
                      clock=SystemClock(),
                      network_client=client,
                  )
                  verify = None
                  if with_verify:
                      from apps.axis.life_history.public_verify import (
                          PublicVerifyService,
                      )
                      verify = PublicVerifyService(
                          life=life,
                          network_db=SQLiteAdapter(
                              ":memory:"
                          ),
                          master_key_hex="ab" * 32,
                      )
                  srv = serve_axis(
                      store,
                      client,
                      life_history_service=life,
                      verify_service=verify,
                  )
                  threading.Thread(
                      target=srv.serve_forever,
                      daemon=True,
                  ).start()
                  _t.sleep(0.4)
                  base = (
                      "http://127.0.0.1:"
                      + str(srv.bound_port)
                  )
                  return store, life, base


              def _ax1_post_form(url, form):
                  import urllib.error
                  import urllib.parse
                  import urllib.request
                  req = urllib.request.Request(
                      url,
                      data=urllib.parse.urlencode(
                          form
                      ).encode(),
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(
                          req, timeout=10
                      ) as r:
                          return (
                              r.status,
                              r.read().decode(),
                          )
                  except urllib.error.HTTPError as e:
                      return (
                          e.code,
                          e.read().decode(
                              "utf-8", "replace"
                          ),
                      )


              def _ax1_json(method, url, doc=None):
                  import json as _json
                  import urllib.error
                  import urllib.request
                  data = (
                      _json.dumps(doc).encode()
                      if doc is not None
                      else None
                  )
                  req = urllib.request.Request(
                      url,
                      data=data,
                      method=method,
                      headers={
                          "Content-Type":
                          "application/json"
                      },
                  )
                  try:
                      with urllib.request.urlopen(
                          req, timeout=10
                      ) as r:
                          return (
                              r.status,
                              _json.loads(
                                  r.read().decode()
                              ),
                          )
                  except urllib.error.HTTPError as e:
                      try:
                          return (
                              e.code,
                              _json.loads(
                                  e.read().decode()
                              ),
                          )
                      except Exception:
                          return e.code, {}


              def test_ax1_law_register_person_blocked():
                  from apps.axis.infrastructure.network.network_client import (
                      NetworkClient,
                  )
                  from apps.axis.services.axis_link import (
                      AxisLink,
                  )
                  link = AxisLink(
                      NetworkClient(
                          "http://127.0.0.1:1"
                      )
                  )
                  try:
                      link.register_person("X")
                  except ValueError as exc:
                      assert "biometria" in str(exc)
                      return
                  raise AssertionError(
                      "ley no aplicada"
                  )


              def test_ax1_audit_verify_route():
                  store, life, base = _ax1_boot()
                  st, body = _ax1_post_form(
                      base + "/axis/birth-register",
                      {
                          "registrar_account":
                              "AX-reg-1",
                          "child_name":
                              "Bebe Auditoria",
                          "birth_date":
                              "2025-06-01",
                          "birth_place": "SS",
                          "sex": "F",
                          "mother_name":
                              "Madre Ax1",
                          "mother_zid":
                              "ZID-madre-ax1",
                      },
                  )
                  assert st == 200, body[:300]
                  st, body = _ax1_json(
                      "GET",
                      base
                      + "/axis/api/audit/verify",
                  )
                  assert st == 200, str(body)
                  d = body["data"][
                      "births_chain"
                  ]
                  assert d["ok"] is True
                  assert d["checked"] >= 1
                  person = (
                      life._store._db.query_one(
                          "SELECT person_id FROM"
                          " life_persons LIMIT 1"
                      )
                  )
                  pid = str(
                      person["person_id"]
                  )
                  st, body = _ax1_json(
                      "GET",
                      base
                      + "/axis/api/audit/verify/"
                      + pid,
                  )
                  assert st == 200, str(body)
                  assert (
                      body["data"][
                          "events_chain_ok"
                      ]
                      is True
                  )


              def test_ax1_public_verify_flow():
                  store, life, base = _ax1_boot(
                      with_verify=True
                  )
                  st, body = _ax1_post_form(
                      base + "/axis/birth-register",
                      {
                          "registrar_account":
                              "AX-reg-2",
                          "child_name":
                              "Bebe Verificado",
                          "birth_date":
                              "2025-06-02",
                          "birth_place": "SS",
                          "sex": "M",
                          "mother_name":
                              "Madre V",
                          "mother_zid":
                              "ZID-madre-v1",
                      },
                  )
                  assert st == 200, body[:300]
                  person = (
                      life._store._db.query_one(
                          "SELECT person_id FROM"
                          " life_persons LIMIT 1"
                      )
                  )
                  life.attach_zid_with_audit(
                      str(person["person_id"]),
                      zid="ZID-verif-1",
                      actor="biometric-enroll",
                  )
                  st, body = _ax1_json(
                      "POST",
                      base
                      + "/axis/api/verify/generate",
                      {
                          "subject_zid":
                              "ZID-verif-1",
                          "operator_account":
                              "AX-gob",
                          "operator_role":
                              "paciente",
                      },
                  )
                  assert st == 403, str(body)
                  st, body = _ax1_json(
                      "POST",
                      base
                      + "/axis/api/verify/generate",
                      {
                          "subject_zid":
                              "ZID-verif-1",
                          "operator_account":
                              "AX-gob",
                          "operator_role":
                              "gobierno",
                      },
                  )
                  assert st == 201, str(body)
                  code = body["data"]["code"]
                  st, body = _ax1_json(
                      "POST",
                      base
                      + "/axis/api/verify/redeem",
                      {
                          "code": code,
                          "requester":
                              "Empleador X",
                          "requester_role":
                              "empleador",
                      },
                  )
                  assert st == 200, str(body)
                  assert (
                      body["data"]["finding"]
                      == "SIN_REGISTROS_REPORTADOS"
                  )
                  st, body = _ax1_json(
                      "POST",
                      base
                      + "/axis/api/verify/redeem",
                      {
                          "code": code,
                          "requester": "Otro",
                          "requester_role":
                              "empleador",
                      },
                  )
                  assert st == 409, "re-uso 409"


              def test_ax1_online_birth_seal_and_history():
                  import base64 as _b64
                  import threading
                  import time as _t
                  from apps.axis.infrastructure.persistence.axis_store import (
                      AxisStore,
                  )
                  from apps.axis.infrastructure.network.network_client import (
                      NetworkClient,
                  )
                  from apps.axis.server import (
                      serve_axis,
                  )
                  from apps.axis.life_history.integration import (
                      build_life_history,
                  )
                  from apps.axis.services.axis_link import (
                      AxisLink,
                  )
                  from shared_engines.storage.database import (
                      SQLiteAdapter,
                  )
                  from shared_engines.common.clocks import (
                      FrozenClock,
                      SystemClock,
                  )
                  from shared_engines.runtime.config import (
                      RuntimeConfig,
                  )
                  from shared_engines.runtime.kernel import (
                      ZyraKernel,
                  )
                  from shared_engines.runtime.capabilities import (
                      ZyraCapabilities,
                  )
                  from shared_engines.runtime.combined_api import (
                      serve_combined,
                  )
                  from shared_engines.verification.signatures import (
                      Ed25519Signer,
                  )
                  from shared_engines.security.biometrics import (
                      BiometricsEngine,
                      BiometricsPolicy,
                      DeterministicTestProvider,
                      TemplateCipher,
                  )
                  net_db = SQLiteAdapter(
                      ":memory:"
                  )
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None,
                      ),
                  )
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(
                      db=net_db,
                      clock=FrozenClock(),
                      audit=kernel.audit,
                      provider=(
                          DeterministicTestProvider()
                      ),
                      cipher=TemplateCipher(
                          master_key_hex="ab" * 32
                      ),
                      policy=BiometricsPolicy(
                          require_liveness=False,
                          doc_reject=0.01,
                          doc_review=0.02,
                          doc_auto=0.03,
                          dup_reject=0.98,
                      ),
                  )
                  caps = ZyraCapabilities(
                      net_db,
                      FrozenClock(),
                      identity=kernel.identity,
                      signer=signer,
                  )
                  net_srv = serve_combined(
                      kernel,
                      caps,
                      host="127.0.0.1",
                      port=0,
                  )
                  threading.Thread(
                      target=(
                          net_srv.serve_forever
                      ),
                      daemon=True,
                  ).start()
                  _t.sleep(0.4)
                  net_base = (
                      "http://127.0.0.1:"
                      + str(
                          net_srv.server_address[
                              1
                          ]
                      )
                  )
                  client = NetworkClient(
                      net_base, max_retries=1
                  )
                  reg = AxisLink(
                      client
                  ).register_app()
                  assert reg[0] is True, str(
                      reg[2]
                  )
                  ok_m, data_m, err_m = (
                      client.post(
                          "/identity/enroll",
                          {
                              "kind": "person",
                              "display_name":
                                  "Madre Red",
                              "actor": "axis",
                              "doc_image_b64": (
                                  _b64.b64encode(
                                      b"axis-madre-doc"
                                  ).decode("ascii")
                              ),
                              "selfie_image_b64": (
                                  _b64.b64encode(
                                      b"axis-madre-selfie"
                                  ).decode("ascii")
                              ),
                          },
                      )
                  )
                  assert ok_m, str(err_m)
                  zid_madre = (
                      (data_m or {}).get("identity")
                      or {}
                  ).get("zid")
                  assert isinstance(
                      zid_madre, str
                  ) and zid_madre.startswith(
                      "ZID-"
                  ), str(data_m)
                  ok_t, _td, err_t = client.post(
                      "/identity/transition",
                      {
                          "zid": zid_madre,
                          "to_status": "ACTIVE",
                          "actor": "axis",
                          "reason": "onboarding",
                      },
                  )
                  assert ok_t, str(err_t)
                  store = AxisStore(
                      SQLiteAdapter(":memory:"),
                      SystemClock(),
                  )
                  life = build_life_history(
                      db=store._db,
                      clock=SystemClock(),
                      network_client=client,
                  )
                  birth = (
                      life.register_birth_with_network(
                          registrar_account=(
                              "AX-registrador-1"
                          ),
                          child_name=(
                              "Bebe EnRed Ax1"
                          ),
                          birth_date=(
                              "2025-07-01"
                          ),
                          birth_place="SS",
                          sex="F",
                          mother_name="Madre Red",
                          mother_zid=zid_madre,
                      )
                  )
                  assert birth["network_ok"], str(
