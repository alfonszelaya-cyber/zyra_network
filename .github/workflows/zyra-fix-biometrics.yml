    steps:
      - name: Download the repo
        uses: actions/checkout@v4

      - name: Prior diagnostics (read-only)
        run: |
          echo "== superapp.py in the repo (all copies) =="
          (git ls-files | grep -i "superapp.py$" || true)
          for f in $(git ls-files | grep -i "superapp.py$" || true); do
            echo "-- $f: $(wc -c < "$f") bytes | BEGIN=$(grep -c "ZYRA-V6-BEGIN" "$f" || true) END=$(grep -c "ZYRA-V6-END" "$f" || true)"
          done
          if [ -f superapp.py ]; then sha256sum superapp.py; fi

      - name: Patch superapp.py (all or nothing)
        run: |
          python3 - <<'PYEOF'
          import base64, gzip, hashlib, os, re, shutil, sys, traceback, py_compile
          from pathlib import Path

          B = '/*ZYRA-V6-BEGIN*/'
          E = '/*ZYRA-V6-END*/'
          SHA_GZ = 'be3c2c7992c82f7e7a6ce4a917c27d4ca6b9ad1aa6b52aae9c372934755f94ca'
          LARGO_GZ = 14024
          SHA_JS = '21f4c1370bd5f7b2b3ba6b94f182d5e6bc208367368f606d68978ab3e9ac7fbf'
          LARGO_JS = 32130
          LARGO_PLANO = 43024

          RES = []

          def say(s):
              s = str(s)
              RES.append(s)
              print(s, flush=True)
              try:
                  p = os.environ.get('GITHUB_STEP_SUMMARY')
                  if p:
                      d = os.path.dirname(p)
                      if d and not os.path.isdir(d):
                          os.makedirs(d, exist_ok=True)
                      with open(p, 'a', encoding='utf-8') as f:
                          f.write(s.rstrip() + '\n')
              except Exception:
                  pass

          def fail(msg):
              say('')
              say('ERROR: ' + msg)
              say('')
              say('NOTHING WAS PUBLISHED (all-or-nothing rule). Paste this full Summary in the chat.')
              sys.exit(1)

          ALFA64 = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          def repair_core(s):
              # Repairs ONE single damaged character in the core block, guided by the SHA:
              # only a candidate whose SHA256 matches EXACTLY with SHA_GZ is accepted.
              # If the damage is more than 1 character, it does not invent anything and aborts.
              if not re.fullmatch(r'[A-Za-z0-9+/=]*', s):
                  return None, 'the core has characters that are not base64'
              objetivo = bytes.fromhex(SHA_GZ)
              sb = s.encode('ascii')
              n = len(sb)
              if n == LARGO_GZ - 1:
                  for p in range(n + 1):
                      pre, suf = sb[:p], sb[p:]
                      for c in ALFA64:
                          cand = pre + bytes([c]) + suf
                          if hashlib.sha256(cand).digest() == objetivo:
                              return cand.decode('ascii'), '1 character was missing at position ' + str(p) + ' (rebuilt and verified by SHA)'
                  return None, '1 character is missing but no letter rebuilds it (bigger damage)'
              if n == LARGO_GZ + 1:
                  for p in range(n):
                      cand = sb[:p] + sb[p + 1:]
                      if hashlib.sha256(cand).digest() == objetivo:
                          return cand.decode('ascii'), '1 extra character at position ' + str(p) + ' (removed and verified by SHA)'
                  return None, '1 extra character but no deletion rebuilds it (bigger damage)'
              if n == LARGO_GZ:
                  for p in range(n):
                      pre, suf = sb[:p], sb[p + 1:]
                      for c in ALFA64:
                          cand = pre + bytes([c]) + suf
                          if hashlib.sha256(cand).digest() == objetivo:
                              return cand.decode('ascii'), 'there was 1 wrong character at position ' + str(p) + ' (corrected and verified by SHA)'
                  return None, 'the length is correct but the damage is more than 1 character'
              return None, 'the core measures ' + str(n) + ' chars and its damage is not repairable with 1 character'

          def main():
              say('## ZYRA REV E v8 - patch of the registration core (all-or-nothing)')
              say('')
              say('### 0) Integrity of the received core')
              gz = re.sub(r'\s+', '', os.environ.get('NUC', ''))
              say('- Compressed core received: ' + str(len(gz)) + ' chars (expected ' + str(LARGO_GZ) + ')')
              integro = False
              try:
                  integro = (len(gz) == LARGO_GZ and hashlib.sha256(gz.encode('ascii')).hexdigest() == SHA_GZ)
              except Exception:
                  integro = False
              if not integro:
                  say('- Does not match the original core; attempting automatic repair (1 character, ~10 sec)...')
                  fija, como = repair_core(gz)
                  if fija is None:
                      fail('THE YAML ARRIVED DAMAGED AND COULD NOT BE REPAIRED (' + como + '). Solution: upload the ENTIRE .yml file with "Add file > Upload files" on GitHub; do not open it, do not edit it and do not copy/paste it.')
                  say('- REPAIRED: ' + como)
                  gz = fija
              try:
                  js = gzip.decompress(base64.b64decode(gz)).decode('utf-8')
              except Exception as e:
                  fail('The core could not be decoded (%r): the YAML got cut off. Upload the .yml file with Upload files.' % e)
              if len(js) != LARGO_JS or hashlib.sha256(js.encode('utf-8')).hexdigest() != SHA_JS:
                  fail('The decoded core does not match what is expected.')
              for req in ('ZYRA-REVE', 'function detectarLado', 'function simNombres', 'function mrzNombres', 'function verificar'):
                  if req not in js:
                      fail('Missing in the core: ' + req)
              say('- Core integrity: OK (SHA ' + SHA_JS[:16] + '...)')

              say('')
              say('### 1) Locate superapp.py (tolerates multiple copies)')
              cands = sorted(str(p) for p in Path('.').rglob('superapp.py') if '.git' not in p.parts)
              say('- Copies of superapp.py in the repo: ' + (', '.join(cands) if cands else 'NONE'))
              if not cands:
                  fail('I did not find superapp.py in the repository.')
              marcadas = []
              for c in cands:
                  try:
                      t = Path(c).read_text(encoding='utf-8')
                  except Exception as e:
                      say('- warning: could not read ' + c + ' (' + str(e)[:80] + ')')
                      continue
                  if (B in t) and (E in t):
                      marcadas.append((c, t))
              if len(marcadas) == 0:
                  fail('No superapp.py has the markers ' + B + ' ... ' + E + '. Paste the inspector Summary.')
              if len(marcadas) > 1:
                  fail('Several copies have markers: ' + ', '.join(c for c, _t in marcadas) + '. Paste this Summary in the chat and I will adjust it.')
              ruta, src = marcadas[0]
              say('- Chosen file: ' + ruta)

              say('')
              say('### 2) File verifications (before touching anything)')
              if src.count(B) != 1 or src.count(E) != 1:
                  fail('The markers are not unique: BEGIN=%d END=%d' % (src.count(B), src.count(E)))
              i = src.index(B)
              j = src.index(E)
              if j <= i:
                  fail('The markers are in the wrong order.')
              old = src[i + len(B):j]
              pre = src[:i + len(B)]
              post = src[j:]
              say('- Line of the marked block: ' + str(src[:i].count('\n') + 1))
              m = re.fullmatch(r"\s*eval\(atob\((['\"])([A-Za-z0-9+/=]*)\1\)\)\s*", old, re.S)
              if m:
                  oldc = m.group(2)
                  estilo = 'single quotes' if m.group(1) == "'" else 'double quotes'
                  say('- Detected format: eval(atob(...)) with ' + estilo + '. Previous core: ' + str(len(oldc)) + ' base64 chars')
                  if len(oldc) < 100:
                      fail('The current content between markers seems empty (%d chars).' % len(oldc))
              else:
                  viejo = re.sub(r'\s+', '', old)
                  if re.fullmatch(r'[A-Za-z0-9+/=]*', viejo) and len(viejo) >= 100:
                      oldc = viejo
                      say('- Detected format: pure base64 between markers (' + str(len(viejo)) + ' chars).')
                  else:
                      say('- Unexpected content between markers (' + str(len(old)) + ' chars), starts with: ' + repr(old[:60]))
                      fail('I do not recognize the content between the markers; aborting to not break anything. Paste this Summary in the chat.')
              try:
                  py_compile.compile(str(ruta), cfile='/tmp/zyra_base.pyc', doraise=True)
              except Exception as e:
                  fail('The current superapp.py does not compile: ' + str(e)[:200])
              say('- py_compile of the current file: OK')

              plano = base64.b64encode(js.encode('utf-8')).decode('ascii')
              if len(plano) != LARGO_PLANO:
                  fail('The re-encoded core measures ' + str(len(plano)) + ' and must be ' + str(LARGO_PLANO) + '.')
              ya = False
              try:
                  viejo_js = base64.b64decode(oldc)
                  ya = hashlib.sha256(viejo_js).hexdigest() == SHA_JS
              except Exception:
                  ya = False
              if oldc == plano or ya:
                  say('')
                  say('RESULT: REV E WAS ALREADY APPLIED in ' + ruta + '. Nothing is touched (idempotent run).')
                  sys.exit(0)

              say('')
              say('### 3) Apply the patch (only the marked block; rest byte for byte)')
              if m:
                  inner = 'eval(atob(' + m.group(1) + plano + m.group(1) + '))'
              else:
                  inner = plano
              nuevo = pre + inner + post
              if not (nuevo.startswith(pre) and nuevo.endswith(post)):
                  fail('Failed to preserve outside the block.')
              tmp = Path('/tmp/zyra_superapp_new.py')
              tmp.write_text(nuevo, encoding='utf-8')
              try:
                  py_compile.compile(str(tmp), cfile='/tmp/zyra_new.pyc', doraise=True)
              except Exception as e:
                  fail('The patched file does not compile: ' + str(e)[:200])
              shutil.copyfile(str(tmp), str(ruta))
              say('- Preservation outside the block: OK (byte for byte)')
              say('- py_compile of the patched file: OK')

              say('')
              say('### 4) Result')
              for l in (
                  '- Patched file: `' + ruta + '`',
                  '- New core: ' + str(len(plano)) + ' base64 chars / ' + str(len(js)) + ' bytes JS',
                  '- SHA256 of the new JS: `' + SHA_JS + '`',
                  '- Result: PATCH_OK',
              ):
                  say(l)
              say('')
              say('PATCH_OK')

          def start():
              try:
                  main()
              except SystemExit:
                  raise
              except Exception:
                  try:
                      say('')
                      say('UNEXPECTED ERROR. Full trace:')
                      say(traceback.format_exc())
                      say('NOTHING WAS PUBLISHED (all-or-nothing rule).')
                  except Exception:
                      pass
                  sys.exit(1)

          start()
          PYEOF

      - name: Publish only if everything is valid
        run: |
          set -e
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes: the REV E core was already applied"
            echo "No changes: the REV E core was already applied" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "ZYRA REV E v8: camera visible when opening + green line framing the photo"
            git push
            echo "Published revision REV E v8 (commit $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          fi
