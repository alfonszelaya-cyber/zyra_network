name: "ZYRA EX - renderer_3d con orbital (autocontenido, verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: renderer_3d.py completo (original + CamaraOrbital + MotorRenderOrbital)
        run: |
          cat > apps/laboratorio/infrastructure/providers/renderer_3d.py <<'R3_EOF'
          """Motor 3D: perspectiva real + CAMARA ORBITAL (mismo archivo).

          Original: proyeccion con punto de fuga por capa (intacto).
          Nuevo: CamaraOrbital (azimut/elevacion/distancia con limites)
          y MotorRenderOrbital (vista 2.5D girada con foreshortening),
          deterministas y con metadata honesta.
          """
          import math

          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.renderer_raster import (
              PROFUNDIDAD_POR_CAPA,
              RasterizadorBase,
              hex_a_rgb,
          )
          from apps.laboratorio.shared.adapters.engine_adapter import AdaptadorMotor
          from apps.laboratorio.shared.exceptions.render_errors import (
              EscenaVaciaError,
              RenderFallidoError,
          )
          from apps.laboratorio.shared.interfaces.renderer import (
              Renderer,
              ResultadoRender,
          )

          Z_POR_CAPA = {"fondo": 2.0, "medio": 1.0, "frente": 0.2}
          DISTANCIA_FOCAL = 3.0


          class MotorRender3D(AdaptadorMotor, Renderer):
              """Calidad 3D: perspectiva con punto de fuga + profundidad."""

              def __init__(self):
                  AdaptadorMotor.__init__(self, "renderer_3d", "renderer", "1.0.0")
                  self.marcar_disponible()

              def capacidades(self) -> dict:
                  return {
                      "calidades": ["3d"],
                      "profundidad": True,
                      "proyeccion": "perspectiva con punto de fuga central",
                      "z_por_capa": Z_POR_CAPA,
                  }

              @staticmethod
              def _proyectar(valor, centro, z) -> float:
                  escala = DISTANCIA_FOCAL / (DISTANCIA_FOCAL + z)
                  return centro + (valor - centro) * escala

              def renderizar(self, escena, opciones) -> ResultadoRender:
                  if not isinstance(escena, Escena3D):
                      raise RenderFallidoError("Se esperaba una Escena3D.")
                  if not escena.es_renderizable:
                      raise EscenaVaciaError("La escena no tiene objetos.")
                  ancho = int(opciones.get("ancho", escena.ancho))
                  alto = int(opciones.get("alto", escena.alto))
                  cx, cy = ancho / 2.0, alto / 2.0
                  lienzo = RasterizadorBase(ancho, alto, (15, 23, 42))
                  sx = ancho / escena.ancho
                  sy = alto / escena.alto
                  escala_texto = max(2, int(round(min(sx, sy) * 2)))
                  for capa in ("fondo", "medio", "frente"):
                      z = Z_POR_CAPA[capa]
                      depth_val = PROFUNDIDAD_POR_CAPA[capa]
                      for obj in escena.objetos:
                          if obj.get("capa", "medio") != capa:
                              continue
                          color = hex_a_rgb(obj["color"])
                          if obj["forma"] == "rect":
                              x1 = self._proyectar(obj["x"] * sx, cx, z)
                              y1 = self._proyectar(obj["y"] * sy, cy, z)
                              x2 = self._proyectar((obj["x"] + obj["w"]) * sx, cx, z)
                              y2 = self._proyectar((obj["y"] + obj["h"]) * sy, cy, z)
                              lienzo.rect(x1, y1, x2 - x1, y2 - y1, color, depth_val)
                          elif obj["forma"] == "circle":
                              cxp = self._proyectar(obj["cx"] * sx, cx, z)
                              cyp = self._proyectar(obj["cy"] * sy, cy, z)
                              rp = obj["r"] * min(sx, sy) * (DISTANCIA_FOCAL / (DISTANCIA_FOCAL + z))
                              lienzo.circle(cxp, cyp, rp, color, depth_val)
                          else:
                              lienzo.texto(
                                  self._proyectar(obj["x"] * sx, cx, z),
                                  self._proyectar(obj["y"] * sy, cy, z),
                                  obj["contenido"], color, depth_val, escala_texto,
                              )
                  return ResultadoRender(
                      imagen_bytes=lienzo.imagen_png(),
                      profundidad_bytes=lienzo.profundidad_png(),
                      ancho=ancho,
                      alto=alto,
                      metadata={
                          "formato": "png", "motor": "renderer_3d",
                          "profundidad": True, "proyeccion": "perspectiva",
                      },
                  )


          class CamaraOrbital:
              """Camara virtual: azimut, elevacion y distancia con limites reales."""

              def __init__(self, distancia=3.0, azimut=0.0, elevacion=35.0):
                  d = float(distancia)
                  if not 1.0 <= d <= 10.0:
                      raise ValueError("distancia debe estar entre 1 y 10.")
                  self.distancia = d
                  self.azimut = float(azimut) % 360.0
                  e = float(elevacion)
                  if not 5.0 <= e <= 85.0:
                      raise ValueError("elevacion debe estar entre 5 y 85 grados.")
                  self.elevacion = e

              def girar(self, d_azimut, d_elevacion) -> dict:
                  self.azimut = (self.azimut + float(d_azimut)) % 360.0
                  self.elevacion = max(5.0, min(85.0, self.elevacion + float(d_elevacion)))
                  return self.estado()

              def zoom(self, factor) -> dict:
                  self.distancia = max(1.0, min(10.0, self.distancia * float(factor)))
                  return self.estado()

              def estado(self) -> dict:
                  return {"azimut": round(self.azimut, 2), "elevacion": round(self.elevacion, 2),
                          "distancia": round(self.distancia, 3)}


          class MotorRenderOrbital(AdaptadorMotor):
              """Vista orbital 2.5D determinista sobre el rasterizador real."""

              def __init__(self):
                  AdaptadorMotor.__init__(self, "renderer_orbital", "renderer", "1.0.0")
                  self.marcar_disponible()

              def capacidades(self) -> dict:
                  return {
                      "proyeccion": "orbital 2.5D (rotacion azimut + foreshortening elevacion)",
                      "profundidad": True,
                      "determinista": True,
                  }

              @staticmethod
              def _transformar(px, py, cx, cy, cos_a, sin_a, el, escala):
                  dx = px - cx
                  dy = py - cy
                  rx = dx * cos_a - dy * sin_a
                  ry = (dx * sin_a + dy * cos_a) * el
                  return cx + rx * escala, cy + ry * escala

              def renderizar_orbital(self, escena, opciones, camara) -> ResultadoRender:
                  if not isinstance(escena, Escena3D):
                      raise RenderFallidoError("Se esperaba una Escena3D.")
                  if not escena.es_renderizable:
                      raise EscenaVaciaError("La escena no tiene objetos.")
                  if not isinstance(camara, CamaraOrbital):
                      raise RenderFallidoError("Se esperaba una CamaraOrbital.")
                  ancho = int(opciones.get("ancho", escena.ancho))
                  alto = int(opciones.get("alto", escena.alto))
                  lienzo = RasterizadorBase(ancho, alto, (15, 23, 42))
                  sx = ancho / escena.ancho
                  sy = alto / escena.alto
                  cx, cy = ancho / 2.0, alto / 2.0
                  az = math.radians(camara.azimut)
                  el = math.sin(math.radians(camara.elevacion))
                  cos_a, sin_a = math.cos(az), math.sin(az)
                  f = camara.distancia
                  for capa in ("fondo", "medio", "frente"):
                      z = Z_POR_CAPA[capa] + (1.0 - el) * 0.5
                      escala = f / (f + z)
                      depth_val = PROFUNDIDAD_POR_CAPA[capa]
                      for obj in escena.objetos:
                          if obj.get("capa", "medio") != capa:
                              continue
                          color = hex_a_rgb(obj["color"])
                          forma = obj["forma"]
                          if forma == "rect":
                              x1, y1 = self._transformar(obj["x"] * sx, obj["y"] * sy, cx, cy, cos_a, sin_a, el, escala)
                              x2, y2 = self._transformar((obj["x"] + obj["w"]) * sx, (obj["y"] + obj["h"]) * sy, cx, cy, cos_a, sin_a, el, escala)
                              lienzo.rect(min(x1, x2), min(y1, y2), abs(x2 - x1), abs(y2 - y1), color, depth_val)
                          elif forma == "circle":
                              px, py = self._transformar(obj["cx"] * sx, obj["cy"] * sy, cx, cy, cos_a, sin_a, el, escala)
                              lienzo.circle(px, py, obj["r"] * min(sx, sy) * escala, color, depth_val)
                          else:
                              px, py = self._transformar(obj["x"] * sx, obj["y"] * sy, cx, cy, cos_a, sin_a, el, escala)
                              lienzo.texto(px, py, obj["contenido"], color, depth_val,
                                           max(2, int(round(min(sx, sy) * 2))))
                  return ResultadoRender(
                      imagen_bytes=lienzo.imagen_png(),
                      profundidad_bytes=lienzo.profundidad_png(),
                      ancho=ancho,
                      alto=alto,
                      metadata={
                          "formato": "png", "motor": "renderer_orbital",
                          "proyeccion": "orbital 2.5D",
                          "azimut": camara.azimut, "elevacion": camara.elevacion,
                          "distancia": camara.distancia, "profundidad": True,
                      },
                  )
          R3_EOF

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Escribir los 3 tests (con los fixes conocidos dentro)
        run: |
          cat > apps/laboratorio/tests/test_camara_orbital.py <<'TC2_EOF'
          """EX-3: camara orbital + render 2.5D determinista."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.renderer_3d import (
              CamaraOrbital,
              MotorRenderOrbital,
          )
          from apps.laboratorio.shared.exceptions.render_errors import EscenaVaciaError
          from apps.laboratorio.tests.conftest import OBJETOS, assert_2xx, construir_escena, construir_escena_vacia


          def test_girar_con_limites():
              cam = CamaraOrbital()
              cam.girar(90, 10)
              assert cam.estado()["azimut"] == 90.0
              assert cam.estado()["elevacion"] == 45.0
              cam.girar(0, 200)
              assert cam.estado()["elevacion"] == 85.0


          def test_distancia_validada():
              with pytest.raises(ValueError):
                  CamaraOrbital(distancia=0.5)
              with pytest.raises(ValueError):
                  CamaraOrbital(elevacion=120)


          def test_render_orbital_png_determinista():
              motor = MotorRenderOrbital()
              cam = CamaraOrbital()
              cam.girar(45, 40)
              r1 = motor.renderizar_orbital(construir_escena(), {"ancho": 200, "alto": 150}, cam)
              r2 = motor.renderizar_orbital(construir_escena(), {"ancho": 200, "alto": 150}, cam)
              assert bytes(r1.imagen_bytes[:8]) == b"\x89PNG\r\n\x1a\n"
              assert r1.imagen_bytes == r2.imagen_bytes
              assert "orbital" in r1.metadata["proyeccion"]
              assert bytes(r1.profundidad_bytes[:8]) == b"\x89PNG\r\n\x1a\n"


          def test_render_orbital_rechaza_escena_vacia():
              motor = MotorRenderOrbital()
              cam = CamaraOrbital()
              with pytest.raises(EscenaVaciaError):
                  motor.renderizar_orbital(construir_escena_vacia(), {}, cam)


          def test_camara_por_http(despachar):
              _s, _h, datos = despachar("POST", "/laboratorio/api/v1/projects", json.dumps({
                  "titulo": "Proy camara", "tipo": "negocio"}).encode("utf-8"))
              assert_2xx(_s, datos)
              proyecto_id = datos["datos"]["proyecto"]["id"]
              status, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/scenes",
                  json.dumps({"nombre": "S cam", "objetos": OBJETOS}).encode("utf-8"))
              assert_2xx(status, datos2)
              escena_id = datos2["datos"]["escena"]["id"]
              status3, headers3, _payload3 = despachar(
                  "POST", "/laboratorio/api/v1/scenes/" + escena_id + "/camara/orbital",
                  json.dumps({"azimut": 45, "elevacion": 40, "ancho": 200, "alto": 150}).encode("utf-8"))
              assert_2xx(status3, headers3)
              assert headers3.get("Content-Type") == "image/png"
          TC2_EOF
          cat > apps/laboratorio/tests/test_curso_certificado.py <<'TC1_EOF'
          """EX-4: curso con evaluacion real + certificado firmado y sellado."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.presentation_remote import ModoCurso
          from apps.laboratorio.infrastructure.security.signing import Firmador
          from apps.laboratorio.tests.conftest import OBJETOS, assert_2xx


          class _PresentacionFalsa:
              id = "pres-x"
              titulo = "Curso de prueba"
              pasos = []


          class _RepoFalso:
              @staticmethod
              def obtener_exigir(pid):
                  return _PresentacionFalsa()


          class _OutboxFalso:
              def __init__(self):
                  self.items = []
                  self.enviadas = []

              def encolar(self, ev, dest, carga):
                  self.items.append((ev, dest, carga))
                  return len(self.items)

              def procesar(self, entregador):
                  for it in self.items:
                      self.enviadas.append(it)
                      entregador(it[1], it[2])
                  n = len(self.items)
                  self.items = []
                  return {"procesados": n, "enviados": n, "reprogramados": 0, "abandonados": 0}

              def estadisticas(self):
                  return {"pendiente": len(self.items), "enviado": len(self.enviadas), "error": 0}


          class _ClienteFalso:
              @staticmethod
              def entregar(destino, carga):
                  return {"sellado": True}


          PREGUNTAS = [
              {"texto": "Que es ZYRA?", "opciones": ["Una red", "Un coche"], "correcta": 0},
              {"texto": "2+2?", "opciones": ["3", "4"], "correcta": 1},
          ]


          def _modo():
              return ModoCurso(_RepoFalso(), _OutboxFalso(),
                               Firmador("clave-de-test-1234567890abcd"),
                               cliente=_ClienteFalso())


          def test_crear_curso_valida_preguntas():
              res = _modo().crear_curso("pres-x", PREGUNTAS, 0.7)
              assert res["preguntas"] == 2
              with pytest.raises(ValueError):
                  _modo().crear_curso("pres-x", [{"texto": "mala", "opciones": ["a"], "correcta": 0}])


          def test_responder_califica_automatico():
              modo = _modo()
              curso = modo.crear_curso("pres-x", PREGUNTAS)["curso"]
              res = modo.responder(curso, "alumno-1", [0, 1])
              assert res["puntaje"] == 1.0 and res["aprobado"] is True
              res2 = modo.responder(curso, "alumno-2", [1, 0])
              assert res2["puntaje"] == 0.0 and res2["aprobado"] is False


          def test_certificar_exige_aprobado():
              modo = _modo()
              curso = modo.crear_curso("pres-x", PREGUNTAS)["curso"]
              with pytest.raises(ValueError):
                  modo.certificar(curso, "nadie")
              modo.responder(curso, "alumno-2", [1, 0])
              with pytest.raises(ValueError):
                  modo.certificar(curso, "alumno-2")


          def test_certificado_firmado_y_encolado_a_la_red():
              modo = _modo()
              curso = modo.crear_curso("pres-x", PREGUNTAS)["curso"]
              modo.responder(curso, "alumno-1", [0, 1])
              res = modo.certificar(curso, "alumno-1")
              assert res["certificado"]["algoritmo"] == "hmac-sha256"
              assert res["certificado"]["firma"]
              assert res["estado_red"] == "sellado_en_zyra"


          def test_curso_completo_por_http(app, despachar):
              _s, _h, datos = despachar("POST", "/laboratorio/api/v1/projects", json.dumps({
                  "titulo": "Proy curso", "tipo": "negocio"}).encode("utf-8"))
              assert_2xx(_s, datos)
              proyecto_id = datos["datos"]["proyecto"]["id"]
              _ss, _hsc, datos_sc = despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/scenes",
                  json.dumps({"nombre": "S", "objetos": OBJETOS}).encode("utf-8"))
              assert_2xx(_ss, datos_sc)
              escena_id = datos_sc["datos"]["escena"]["id"]
              status, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/presentations",
                  json.dumps({"titulo": "Capacitacion", "pasos": [
                      {"titulo": "P1", "contenido": "c", "duracion_segundos": 10, "escena_id": escena_id},
                  ]}).encode("utf-8"))
              assert_2xx(status, datos2)
              presentacion_id = datos2["datos"]["presentacion"]["id"]
              status3, _h3, datos3 = despachar(
                  "POST", "/laboratorio/api/v1/presentations/" + presentacion_id + "/curso",
                  json.dumps({"preguntas": PREGUNTAS, "umbral_aprobacion": 0.7}).encode("utf-8"))
              assert_2xx(status3, datos3)
              curso_id = datos3["datos"]["curso"]
              status4, _h4, datos4 = despachar(
                  "POST", "/laboratorio/api/v1/presentations/curso/" + curso_id + "/responder",
                  json.dumps({"respuestas": [0, 1]}).encode("utf-8"))
              assert_2xx(status4, datos4)
              assert datos4["datos"]["aprobado"] is True
              status5, _h5, datos5 = despachar(
                  "POST", "/laboratorio/api/v1/presentations/curso/" + curso_id + "/certificar",
                  b"")
              assert_2xx(status5, datos5)
              assert datos5["datos"]["certificado"]["firma"]
              outbox = app.contenedor.obtener("outbox")
              stats = outbox.estadisticas()
              assert stats["pendiente"] >= 1 or stats["error"] >= 1
          TC1_EOF
          cat > apps/laboratorio/tests/test_desastres.py <<'TC3_EOF'
          """EX-DES: desastre -> zonas seguras + ayuda especifica + evento a la Red."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.citizens_engine import MotorCiudadanos
          from apps.laboratorio.tests.conftest import OBJETOS, assert_2xx


          def _motor():
              motor = MotorCiudadanos()
              motor.poblar(
                  [{"origen": "descripcion", "nombre": "P" + str(i),
                    "x": 10 + i, "y": 10, "velocidad": 1.0, "agenda": [[60, 60]]}
                   for i in range(5)]
                  + [{"origen": "descripcion", "nombre": "Lejos",
                      "x": 500, "y": 500, "velocidad": 1.0, "agenda": [[510, 510]]}],
                  salidas=[[0, 0]],
              )
              return motor


          def test_desastre_desconocido_rechaza():
              motor = _motor()
              with pytest.raises(ValueError):
                  motor.simular_desastre("meteorito", [10, 10], 50, [[200, 200, 30]])


          def test_terremoto_afecta_solo_zona_y_genera_plan():
              motor = _motor()
              plan = motor.simular_desastre(
                  "terremoto", [12, 10], 30, [[300, 300, 40]])
              assert plan["afectados"] == 5
              assert plan["poblacion"] == 6
              assert "rescate urbano" in plan["ayuda_necesaria"]
              assert plan["pasos_estimados_evacuacion"] > 0
              for c in motor.estado_poblacion()["ciudadanos"]:
                  if c["nombre"] != "Lejos":
                      assert c["estado"] == "evacuando"
                  else:
                      assert c["estado"] == "en_ruta"


          def test_cada_desastre_tiene_ayuda_propia():
              motor = MotorCiudadanos()
              motor.poblar([{"origen": "descripcion", "nombre": "A", "x": 0, "y": 0}])
              plan_i = motor.simular_desastre("inundacion", [0, 0], 100, [[50, 50, 20]])
              assert "botes de rescate" in plan_i["ayuda_necesaria"]
              plan_e = motor.simular_desastre("erupcion", [0, 0], 100, [[80, 80, 20]])
              assert "mascarillas" in plan_e["ayuda_necesaria"]


          def test_zonas_seguras_requieren_radio():
              motor = _motor()
              with pytest.raises(ValueError):
                  motor.simular_desastre("incendio", [10, 10], 30, [[200, 200]])


          def test_desastre_por_http_deja_evento_en_outbox(app, despachar):
              _s, _h, datos = despachar("POST", "/laboratorio/api/v1/projects", json.dumps({
                  "titulo": "Proy desastre", "tipo": "negocio"}).encode("utf-8"))
              assert_2xx(_s, datos)
              proyecto_id = datos["datos"]["proyecto"]["id"]
              status, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/scenes",
                  json.dumps({"nombre": "S", "objetos": OBJETOS}).encode("utf-8"))
              assert_2xx(status, datos2)
              escena_id = datos2["datos"]["escena"]["id"]
              status3, _h3, datos3 = despachar(
                  "POST", "/laboratorio/api/v1/scenes/" + escena_id + "/citizens/populate",
                  json.dumps({"ciudadanos": [
                      {"origen": "descripcion", "nombre": "C1", "x": 10, "y": 10},
                      {"origen": "descripcion", "nombre": "C2", "x": 12, "y": 11},
                  ], "salidas": [[0, 0]]}).encode("utf-8"))
              assert_2xx(status3, datos3)
              status4, _h4, datos4 = despachar(
                  "POST", "/laboratorio/api/v1/scenes/" + escena_id + "/desastre/simular",
                  json.dumps({"tipo": "terremoto", "epicentro": [11, 10], "radio": 50,
                              "zonas_seguras": [[200, 200, 40]]}).encode("utf-8"))
              assert_2xx(status4, datos4)
              plan = datos4["datos"]["plan"]
              assert plan["afectados"] == 2
              assert plan["ayuda_necesaria"]
              outbox = app.contenedor.obtener("outbox")
              stats = outbox.estadisticas()
              assert stats["pendiente"] >= 1
          TC3_EOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - EX renderer_3d + tests"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
