name: ZYRA LABORATORIO - Lote 3A (Fase 3 - crear y biblioteca EN VIVO)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar y aplicar lote (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_3a.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          reemplazar_verificado() {
            ruta="$1"; firma="$2"
            if [ ! -s "$ruta" ]; then
              echo "FALLO: $ruta no existe para reemplazo verificado"; exit 1
            fi
            if ! grep -qF "$firma" "$ruta"; then
              echo "FALLO: firma ausente en $ruta (contenido inesperado, NO se toca)"; exit 1
            fi
            cat > "$ruta"
            echo "REEMPLAZADO-VERIFICADO: $ruta"
            echo "$ruta|REEMPLAZADO" >> "$MANIFEST"
          }
          mkdir -p apps/laboratorio/domain apps/laboratorio/infrastructure/persistence apps/laboratorio/infrastructure/repositories apps/laboratorio/infrastructure/providers apps/laboratorio/application/commands apps/laboratorio/application/use_cases apps/laboratorio/application/handlers apps/laboratorio/routers/api apps/laboratorio/modules apps/laboratorio/templates/dashboards
          echo "=== ANCLAS: app.py y service_registry.py ==="
          python3 - << 'PYANCHOR'
          from pathlib import Path
          p = Path("apps/laboratorio/infrastructure/api/app.py")
          codigo = p.read_text(encoding="utf-8")
          ancla1 = "from apps.laboratorio.routers.public.health import registrar_rutas as registrar_salud"
          ancla2 = "registrar_salud(app)"
          assert ancla1 in codigo and ancla2 in codigo, "anclas ausentes en app.py"
          cambios = []
          if "conectar_creacion(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.creation_module import conectar as conectar_creacion")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_creacion(app)")
              cambios.append("creation")
          if "conectar_biblioteca(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.library_module import conectar as conectar_biblioteca")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_biblioteca(app)")
              cambios.append("library")
          p.write_text(codigo, encoding="utf-8")
          print("app.py:", ", ".join(cambios) if cambios else "ya estaba")
          p2 = Path("apps/laboratorio/registry/services/service_registry.py")
          c2 = p2.read_text(encoding="utf-8")
          a_imp = "from apps.laboratorio.application.handlers.design_handler import ManejadorDisenos"
          assert a_imp in c2, "ancla import ausente en service_registry.py"
          if "manejador_creacion" not in c2:
              nuevos_imp = (
                  "from apps.laboratorio.application.handlers.scene_handler import ManejadorCreacion\n"
                  "from apps.laboratorio.application.handlers.library_handler import ManejadorBiblioteca\n"
                  "from apps.laboratorio.application.use_cases.create_scene import CasoCrearEscena\n"
                  "from apps.laboratorio.application.use_cases.generate_artifact import CasoGenerarArtefacto\n"
                  "from apps.laboratorio.application.use_cases.create_asset import CasoCrearActivo\n"
                  "from apps.laboratorio.infrastructure.providers.generation_engine import MotorGeneracionReal\n"
                  "from apps.laboratorio.infrastructure.persistence.scene_store import SceneStore\n"
                  "from apps.laboratorio.infrastructure.persistence.artifact_store import ArtifactStore\n"
                  "from apps.laboratorio.infrastructure.persistence.asset_store import AssetStore\n"
                  "from apps.laboratorio.infrastructure.repositories.scene_repository import SceneRepository\n"
                  "from apps.laboratorio.infrastructure.repositories.artifact_repository import ArtifactRepository\n"
                  "from apps.laboratorio.infrastructure.repositories.asset_repository import AssetRepository\n"
              )
              c2 = c2.replace(a_imp, nuevos_imp + a_imp)
              a_reg = '    c.obtener("suscriptor_zyra")'
              assert a_reg in c2, "ancla registro ausente"
              nuevos_reg = (
                  '    c.registrar("scene_store", lambda _c: SceneStore(conexion))\n'
                  '    c.registrar("artifact_store", lambda _c: ArtifactStore(conexion))\n'
                  '    c.registrar("asset_store", lambda _c: AssetStore(conexion))\n'
                  '    c.registrar("repo_escenas", lambda _c: SceneRepository(_c.obtener("scene_store")))\n'
                  '    c.registrar("repo_artefactos", lambda _c: ArtifactRepository(_c.obtener("artifact_store")))\n'
                  '    c.registrar("repo_activos", lambda _c: AssetRepository(_c.obtener("asset_store")))\n'
                  '    c.registrar("motor_generacion", lambda _c: MotorGeneracionReal())\n'
                  '    c.registrar("caso_crear_escena", lambda _c: CasoCrearEscena(_c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_generar", lambda _c: CasoGenerarArtefacto(_c.obtener("repo_escenas"), _c.obtener("repo_artefactos"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("motor_generacion"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_crear_activo", lambda _c: CasoCrearActivo(_c.obtener("repo_activos"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_creacion", lambda _c: ManejadorCreacion(_c.obtener("caso_crear_escena"), _c.obtener("caso_generar"), _c.obtener("repo_escenas"), _c.obtener("repo_artefactos"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_biblioteca", lambda _c: ManejadorBiblioteca(_c.obtener("caso_crear_activo"), _c.obtener("repo_activos"), _c.obtener("auditoria_sink")))\n'
              )
              c2 = c2.replace(a_reg, nuevos_reg + a_reg)
              p2.write_text(c2, encoding="utf-8")
              print("service_registry.py ACTUALIZADO: 11 servicios de Fase 3")
          else:
              print("service_registry.py: ya contenia Fase 3")
          PYANCHOR
          echo "apps/laboratorio/infrastructure/api/app.py|ACTUALIZADO" >> "$MANIFEST"
          echo "apps/laboratorio/registry/services/service_registry.py|ACTUALIZADO" >> "$MANIFEST"
          echo "=== DOMINIO FASE 3 (3) ==="
          escribir apps/laboratorio/domain/scene.py << 'ZYRA_EOF'
          """Escena 3D: el mundo que se renderiza y se genera.

          Arquitectura invertida: primero el mundo (SCENE/WORLD), despues
          el render y el destino. Los objetos se validan contra lo que el
          motor SVG real puede dibujar (rect, circle, texto).
          """
          import re
          from dataclasses import dataclass, field
          from typing import List

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          PATRON_HEX = re.compile(r"^#[0-9A-Fa-f]{6}$")
          FORMAS_VALIDAS = ("rect", "circle", "texto")
          MIN_DIM = 16
          MAX_DIM = 4096
          MAX_OBJETOS = 200


          @dataclass
          class Escena3D(EntidadBase):
              """Mundo con objetos: base de imagen, pagina, modelo y animacion."""

              prefijo_id = "scn"

              proyecto_id: Identificador = None
              nombre: str = ""
              ancho: int = 800
              alto: int = 600
              objetos: List[dict] = field(default_factory=list)

              def __post_init__(self):
                  if self.proyecto_id is None:
                      raise ValueError("La escena requiere el id de su proyecto.")
                  if not self.nombre.strip():
                      raise ValueError("La escena requiere nombre.")
                  self.nombre = self.nombre.strip()
                  if not (MIN_DIM <= self.ancho <= MAX_DIM):
                      raise ValueError("ancho fuera de rango 16-4096.")
                  if not (MIN_DIM <= self.alto <= MAX_DIM):
                      raise ValueError("alto fuera de rango 16-4096.")

              def agregar_objeto(self, objeto: dict) -> dict:
                  """Agrega un objeto validado; devuelve el objeto limpio."""
                  if not isinstance(objeto, dict):
                      raise ValueError("El objeto debe ser un objeto JSON.")
                  forma = str(objeto.get("forma", "")).strip().lower()
                  if forma not in FORMAS_VALIDAS:
                      raise ValueError(
                          "Forma no soportada: " + repr(forma)
                          + ". Validas: " + ", ".join(FORMAS_VALIDAS)
                      )
                  color = str(objeto.get("color", "#64748B")).strip()
                  if not PATRON_HEX.match(color):
                      raise ValueError("Color invalido: " + repr(color))
                  limpio = {"forma": forma, "color": color}
                  try:
                      if forma == "rect":
                          limpio.update(
                              x=float(objeto.get("x", 0)), y=float(objeto.get("y", 0)),
                              w=float(objeto.get("w", 10)), h=float(objeto.get("h", 10)),
                          )
                          if limpio["w"] <= 0 or limpio["h"] <= 0:
                              raise ValueError("rect requiere w y h positivos.")
                      elif forma == "circle":
                          limpio.update(
                              cx=float(objeto.get("cx", 0)), cy=float(objeto.get("cy", 0)),
                              r=float(objeto.get("r", 10)),
                          )
                          if limpio["r"] <= 0:
                              raise ValueError("circle requiere r positivo.")
                      else:
                          contenido = str(objeto.get("contenido", "")).strip()
                          if not contenido:
                              raise ValueError("texto requiere contenido.")
                          limpio.update(
                              x=float(objeto.get("x", 0)), y=float(objeto.get("y", 20)),
                              contenido=contenido[:300],
                          )
                  except (TypeError, ValueError) as exc:
                      if "rect" in str(exc) or "circle" in str(exc) or "texto" in str(exc):
                          raise
                      raise ValueError("Coordenadas del objeto invalidas.") from exc
                  if len(self.objetos) >= MAX_OBJETOS:
                      raise ValueError("La escena alcanzo el maximo de " + str(MAX_OBJETOS) + " objetos.")
                  self.objetos.append(limpio)
                  self.marcar_actualizacion()
                  return limpio

              @property
              def es_renderizable(self) -> bool:
                  return len(self.objetos) > 0

              def a_especificacion(self) -> dict:
                  """Especificacion que consume el MotorRenderSVG (puerto real)."""
                  return {
                      "ancho": self.ancho, "alto": self.alto,
                      "fondo": "#0F172A", "objetos": list(self.objetos),
                  }
          ZYRA_EOF
          escribir apps/laboratorio/domain/artifact.py << 'ZYRA_EOF'
          """Artefacto: entregable generado desde una escena (imagen, pagina, modelo, animacion).

          Todo artefacto guarda su contenido real, su hash SHA-256 y su
          formato. Ningun artefacto finge: si el formato no existe, no se
          genera (video_mp4 llega en fase 6 con el motor de secuencia).
          """
          from dataclasses import dataclass

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          FORMATOS_GENERACION = ("imagen", "pagina", "modelo", "animacion")
          MIME_POR_FORMATO = {
              "imagen": "image/svg+xml",
              "pagina": "text/html; charset=utf-8",
              "modelo": "application/json",
              "animacion": "image/svg+xml",
          }


          @dataclass
          class Artefacto(EntidadBase):
              """Salida real y descargable de una escena."""

              prefijo_id = "art"

              proyecto_id: Identificador = None
              escena_id: Identificador = None
              nombre: str = ""
              formato: str = ""
              contenido: str = ""
              hash_sha256: str = ""
              tamano_bytes: int = 0

              def __post_init__(self):
                  if self.proyecto_id is None or self.escena_id is None:
                      raise ValueError("El artefacto requiere proyecto_id y escena_id.")
                  if not self.nombre.strip():
                      raise ValueError("El artefacto requiere nombre.")
                  self.nombre = self.nombre.strip()
                  if self.formato not in FORMATOS_GENERACION:
                      raise ValueError(
                          "Formato de generacion invalido: " + repr(self.formato)
                          + ". Validos: " + ", ".join(FORMATOS_GENERACION)
                      )

              @property
              def mime(self) -> str:
                  """MIME oficial del formato del artefacto."""
                  return MIME_POR_FORMATO[self.formato]
          ZYRA_EOF
          escribir apps/laboratorio/domain/asset.py << 'ZYRA_EOF'
          """Activo de biblioteca: material reutilizable sellado con SHA-256."""
          from dataclasses import dataclass, field

          from apps.laboratorio.shared.models.base import EntidadBase

          TIPOS_ACTIVO = ("svg", "html", "json", "texto", "imagen")
          MIN_CONTENIDO = 1
          MAX_CONTENIDO = 200000
          MAX_ETIQUETAS = 10


          @dataclass
          class Activo(EntidadBase):
              """Activo guardado en la biblioteca del usuario."""

              prefijo_id = "ast"

              propietario_zid: str = ""
              nombre: str = ""
              tipo: str = ""
              contenido: str = ""
              hash_sha256: str = ""
              tamano_bytes: int = 0
              etiquetas: list = field(default_factory=list)

              def __post_init__(self):
                  if not self.propietario_zid.strip():
                      raise ValueError("El activo requiere propietario ZID.")
                  if not self.nombre.strip():
                      raise ValueError("El activo requiere nombre.")
                  if self.tipo not in TIPOS_ACTIVO:
                      raise ValueError(
                          "Tipo de activo invalido: " + repr(self.tipo)
                          + ". Validos: " + ", ".join(TIPOS_ACTIVO)
                      )
                  self.propietario_zid = self.propietario_zid.strip()
                  self.nombre = self.nombre.strip()
                  if len(self.etiquetas) > MAX_ETIQUETAS:
                      raise ValueError("Maximo " + str(MAX_ETIQUETAS) + " etiquetas por activo.")
                  self.etiquetas = [str(e).strip().lower()[:40] for e in self.etiquetas if str(e).strip()]

              def tiene_etiqueta(self, etiqueta: str) -> bool:
                  """True si el activo lleva la etiqueta pedida."""
                  return str(etiqueta).strip().lower() in self.etiquetas
          ZYRA_EOF
