name: "RED-RELAY v6: hardening outbox schema via AST (imune al formato) + gates aislados"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Fix 1 - engine.py: import canonical_json_dumps (idempotente, ya paso verde)"
        run: |
          python3 - <<'F1EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/integrations/engine.py")
          t = p.read_text(encoding="utf-8")
          if "canonical_json_dumps" in t:
              print("SKIP 1 (ya presente)")
              raise SystemExit(0)
          ANCLA = "from shared_engines.storage.database import (\n    Database,\n)"
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla import " + str(cnt)
          t = t.replace(
              ANCLA,
              ANCLA + "\nfrom shared_engines.common.serialization import (\n    canonical_json_dumps,\n)",
              1,
          )
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 1: canonical_json_dumps importado (AST valido)")
          F1EOF

      - name: "Fix 2 - HARDENING via AST: insertar self._outbox.ensure_schema() al final de ProfileRegistry.__init__ (imune al formato)"
        run: |
          python3 - <<'F2EOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "self._outbox.ensure_schema()" in t:
              print("SKIP 2 (hardening ya presente)")
              raise SystemExit(0)
          tree = ast.parse(t)
          lineas = t.splitlines(keepends=True)
          objetivo = None
          for nodo in ast.walk(tree):
              if isinstance(nodo, ast.ClassDef) and nodo.name == "ProfileRegistry":
                  for item in nodo.body:
                      if isinstance(item, ast.FunctionDef) and item.name == "__init__":
                          for ln in range(item.lineno, item.end_lineno + 1):
                              if ".run(clock)" in lineas[ln - 1]:
                                  objetivo = ln
                                  break
                          if objetivo is None:
                              objetivo = item.end_lineno - 1
          assert objetivo is not None, (
              "ProfileRegistry.__init__ no encontrado via AST")
          lineas.insert(objetivo, "        self._outbox.ensure_schema()\n")
          nuevo = "".join(lineas)
          ast.parse(nuevo)
          p.write_text(nuevo, encoding="utf-8")
          print("OK 2: ensure_schema insertado via AST en linea "
                + str(objetivo) + " (AST valido, imune al formato)")
          F2EOF

      - name: "Verificacion: sweep snapshots + network tests verdes (el no-such-table murio)"
        run: |
          python3 - <<'VEOF'
          import json
          from pathlib import Path
          import tempfile
          from shared_engines.integrations.engine import (
              PublicSourceClient, SourceIndex,
              sweep_onec, sweep_marn, ONEC_ENDPOINTS,
              ARCGIS_SERVICES)
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          tmp = Path(tempfile.mkdtemp())
          geo = json.dumps({"type": "FeatureCollection", "features": [{"type": "Feature"}, {"type": "Feature"}]}).encode("utf-8")
          meta = json.dumps({"layers": [{"id": 0, "name": "a"}, {"id": 1, "name": "b"}]}).encode("utf-8")
          one = json.dumps([{"codigo": "0111101"}]).encode("utf-8")
          def opener(url):
              if url.endswith("?f=json"):
                  return meta
              if "/query" in url:
                  return geo
              if url.endswith(tuple(ONEC_ENDPOINTS)):
                  return one
              raise OSError("no simulada")
          cli = PublicSourceClient(clock=FrozenClock(), ttl_seconds=60.0, opener=opener)
          index = SourceIndex(SQLiteAdapter(tmp / "src.db"), FrozenClock())
          r1 = sweep_onec(cli, index)
          assert r1["ok"] == 7, str(r1)
          r2 = sweep_marn(cli, index, max_layers_per_service=2, pause_seconds=0)
          assert r2["layers_ok"] == 2 * len(ARCGIS_SERVICES["marn-geo"]), str(r2)
          rows = index._db.query_all("SELECT * FROM source_snapshots")
          assert len(rows) == 7 + 2 * len(ARCGIS_SERVICES["marn-geo"]), len(rows)
          print("OK sweep: " + str(len(rows)) + " snapshots durables")
          VEOF
          python3 -m pytest shared_engines/network/tests -q --tb=short 2>&1 | tail -4

      - name: "GATE runtime AISLADO POR ARCHIVO (timeout 90s c/u)"
        run: |
          set +e
          shopt -s nullglob
          FAIL=0
          for f in shared_engines/runtime/tests/test_*.py; do
            nombre=$(basename "$f" .py)
            timeout 90 python3 -m pytest "$f" -q --tb=line > "/tmp/rt_$nombre.txt" 2>&1
            CODE=$?
            if [ $CODE -eq 124 ]; then
              echo "HANG: $nombre (90s)"
              FAIL=1
            elif [ $CODE -ne 0 ]; then
              echo "FALLO: $nombre"
              tail -8 "/tmp/rt_$nombre.txt"
              FAIL=1
            else
              echo "VERDE: $nombre :: $(tail -1 /tmp/rt_$nombre.txt)"
            fi
          done
          echo "=============================="
          if [ $FAIL -ne 0 ]; then
            echo "GATE ROJO"
            exit 1
          fi
          echo "GATE runtime VERDE"
          exit 0

      - name: "GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-RELAY v6"
            shopt -s nullglob
            for f in /tmp/rt_*.txt; do
              echo
              echo "#### $f"
              tail -15 "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-RELAY v6: hardening via AST - ProfileRegistry asegura outbox schema + import canonical_json_dumps" -m "Fixes del gate por motor: (1) integrations 0 snapshots: SourceIndex.record usa canonical_json_dumps sin importarlo -> import anadido (v4 lo partia sin newline; v5 lo hizo bien), (2) network no-such-table events_outbox: HARDENING raiz via AST - self._outbox.ensure_schema() insertado como ultima instruccion de ProfileRegistry.__init__ localizando el nodo via ast (imune al formato del archivo; el ancla por texto de v5 daba 0 porque el __init__ real difiere tras tantas ediciones), (3) runtime HANG: gate dividido por archivo con timeout 90s -> Resumen muestra el culpable exacto. Scheduler + rutas + test de distribucion autonoma ya aplicados (idempotentes). Regla nueva aprendida: inserciones dentro de funciones existentes = AST, no anclas de texto."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
