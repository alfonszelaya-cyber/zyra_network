name: "ZYRA: SUBASTAS v4 (indentation fixed)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-subastas
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Apply SUBASTAS patches
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path


          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)


          def read_lines(p):
              f = Path(p)
              if not f.exists():
                  fail("file not found: " + p)
              return f.read_text(encoding="utf-8").splitlines(keepends=True)


          def to_text(lines):
              return "".join(lines)


          def leading(line):
              return line[: len(line) - len(line.lstrip())]


          def find_seq(lines, seq):
              n = len(seq)
              hits = []
              for i in range(len(lines) - n + 1):
                  ok = True
                  for j in range(n):
                      if lines[i + j].strip() != seq[j]:
                          ok = False
                          break
                  if ok:
                      hits.append(i)
              return hits


          def replace_seq(lines, seq, block, path, tag):
              hits = find_seq(lines, seq)
              if len(hits) != 1:
                  fail("%s sequence count %d (need 1) in %s" % (tag, len(hits), path))
              print("REPLACE %s in %s" % (tag, path))
              ind = leading(lines[hits[0]])
              new = [(ind + t + "\n") if t else "\n" for t in block]
              return lines[: hits[0]] + new + lines[hits[0] + len(seq):]


          def insert_fixed(lines, at, block, path, tag):
              print("INSERT %s in %s" % (tag, path))
              return lines[:at] + block + lines[at:]


          def safe_compile(src, path):
              try:
                  compile(src, path, "exec")
                  print("COMPILE OK:", path)
              except SyntaxError as e:
                  print("COMPILE-FAIL:", path)
                  print("  error:", e.msg)
                  print("  line:", e.lineno)
                  if e.text:
                      print("  text:", e.text.rstrip())
                  lines = src.splitlines()
                  ln = e.lineno or 0
                  lo = max(0, ln - 12)
                  print("  --- context ---")
                  for k in range(lo, min(len(lines), ln + 8)):
                      mark = ">>" if k == ln - 1 else "  "
                      print("  %s %4d| %s" % (mark, k + 1, lines[k]))
                  fail("compile failed - NOTHING was written")


          P_LINK = "apps/subastas/services/subastas_link.py"
          P_SRV = "apps/subastas/server.py"

          srv_txt_now = Path(P_SRV).read_text(encoding="utf-8")
          if "def _register_bio" in srv_txt_now:
              print("SKIP: SUBASTAS already patched")
              print("ALL PATCHES APPLIED OK (nothing to do)")
              sys.exit(0)

          SEQ_FAKE = [
              "return (",
              "True,",
              "{",
              '"zid": "ZID-"',
              "+ uuid.uuid4().hex[:12],",
              '"source": "local",',
              "},",
              ")",
          ]

          NEW_REAL = [
              "return (",
              "False,",
              "None,",
              ")",
          ]

          SEQ_ENSURE = [
              "ok, data, _err = self.net_client.post(",
              '"/identity/register",',
              "{",
              '"kind": "person",',
              '"display_name": account_id,',
              '"actor": "subastas",',
              "},",
              ")",
              "zid = None",
              "if ok and data:",
              'found = _find_value(data, ("zid",))',
              'if isinstance(found, str) and found.startswith("ZID-"):',
              "zid = found",
              "if zid is None:",
              "existing = self.commerce.account_zid(account_id)",
              "if existing:",
              "return existing",
              "raise ValueError(",
              '"no network ZID available for " + account_id',
              ")",
          ]

          NEW_ENSURE = [
              "zid = None",
              "existing = self.commerce.account_zid(account_id)",
              'if isinstance(existing, str) and existing.startswith("ZID-"):',
              "    zid = existing",
              "if zid is None:",
              "    raise ValueError(",
              '        "cuenta sin ZID biometrico: registrese con"',
              '        " documento y selfie en la pagina principal de SUBASTAS ("',
              "        + account_id",
              '        + ")"',
              "    )",
          ]

          T_C2 = [
              "def _register_bio(self) -> None:",
              "    length = int(",
              '        self.headers.get("Content-Length", 0) or 0',
              "    )",
              '    raw = self.rfile.read(length) if length > 0 else b""',
              "    from urllib.parse import parse_qs",
              '    form = parse_qs(raw.decode("utf-8"))',
              "",
              "    def _fv(key: str) -> str:",
              "        vals = form.get(key, [])",
              '        return vals[0] if vals else ""',
              "",
              '    name = _fv("name").strip()',
              '    doc_b64 = _fv("doc_image_b64").strip()',
              '    selfie_b64 = _fv("selfie_image_b64").strip()',
              "    if not name or not doc_b64 or not selfie_b64:",
              "        self._bio_page(",
              "            400,",
              '            "<h2>Faltan datos obligatorios (por ley): nombre, foto del documento y selfie.</h2>",',
              "            True,",
              "        )",
              "        return",
              "    ok, data, err = self.net_client.post(",
              '        "/identity/enroll",',
              "        {",
              '            "kind": "person",',
              '            "display_name": name,',
              '            "actor": "subastas",',
              '            "doc_image_b64": doc_b64,',
              '            "selfie_image_b64": selfie_b64,',
              "        },",
              "    )",
              "    zid = None",
              "    if ok and data:",
              '        found = _find_value(data, ("zid",))',
              '        if isinstance(found, str) and found.startswith("ZID-"):',
              "            zid = found",
              "    if not ok or zid is None:",
              '        msg = str(err) if err else "la red no devolvio ZID"',
              "        self._bio_page(",
              "            400,",
              '            "<h2>Registro rechazado</h2><p>" + msg + "</p>",',
              "            True,",
              "        )",
              "        return",
              "    self._bio_page(",
              "        200,",
              '        "<h2>Registro biometrico aprobado</h2>"',
              '        "<p>Tu ZID: <b>" + zid + "</b></p>"',
              '        "<p>Usa ese ZID como tu cuenta de vendedor o comprador al publicar y ofertar.</p>",',
              "        False,",
              "    )",
              "",
              "def _bio_page(self, status: int, body: str, back: bool) -> None:",
              "    extra = (",
              "        \"<p><a href='/'><button>Volver</button></a></p>\"",
              "        if back",
              '        else ""',
              "    )",
              "    html = (",
              "        \"<html><head><meta charset='utf-8'>\"",
              "        \"<title>SUBASTAS Registro</title></head>\"",
              "        \"<body style='font-family:sans-serif;max-width:560px;margin:24px auto'>\"",
              "        \"<h1>SUBASTAS</h1>\"",
              "        + body",
              "        + extra",
              "        \"</body></html>\"",
              "    )",
              '    payload = html.encode("utf-8")',
              "    self.send_response(status)",
              '    self.send_header("Content-Type", "text/html; charset=utf-8")',
              '    self.send_header("Content-Length", str(len(payload)))',
              "    self.end_headers()",
              "    self.wfile.write(payload)",
              "",
              "",
          ]

          T_C3 = [
              '"<details><summary><b>Registrarme con biometria (por ley)</b></summary>"',
              '"<form id=\'bioReg\' method=\'POST\' action=\'/subastas/register\'>"',
              '"<p>Nombre completo: <input name=\'name\' required style=\'width:100%\'></p>"',
              '"<fieldset><legend>1) Foto del documento</legend><input type=\'file\' id=\'bioDoc\' accept=\'image/*\' capture=\'environment\'></fieldset>"',
              '"<fieldset><legend>2) Selfie en vivo</legend><input type=\'file\' id=\'bioSlf\' accept=\'image/*\' capture=\'user\'></fieldset>"',
              '"<input type=\'hidden\' name=\'doc_image_b64\' id=\'bioDocB64\'>"',
              '"<input type=\'hidden\' name=\'selfie_image_b64\' id=\'bioSlfB64\'>"',
              '"<p id=\'bioSt\'>Estado: pendiente</p>"',
              '"<button type=\'submit\'>Registrarme</button>"',
              '"</form>"',
              '"<canvas id=\'bioCv\' style=\'display:none\'></canvas>"',
              '"<script>"',
              '"(function(){"',
              "\"var d=document.getElementById('bioDoc'),s=document.getElementById('bioSlf'),st=document.getElementById('bioSt'),hd=document.getElementById('bioDocB64'),hs=document.getElementById('bioSlfB64'),cv=document.getElementById('bioCv'),cx=cv.getContext('2d');\"",
              "\"function p(f,h){if(!f){return;}var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var k=Math.min(1,800/Math.max(i.width,i.height));cv.width=Math.round(i.width*k);cv.height=Math.round(i.height*k);cx.drawImage(i,0,0,cv.width,cv.height);h.value=cv.toDataURL('image/jpeg',0.72).split(',')[1];u();};i.src=r.result;};r.readAsDataURL(f);}\"",
              "\"function u(){st.textContent='Doc: '+(hd.value?'OK':'falta')+' | Selfie: '+(hs.value?'OK':'falta');}\"",
              "\"d.addEventListener('change',function(){p(d.files[0],hd);});\"",
              "\"s.addEventListener('change',function(){p(s.files[0],hs);});\"",
              "\"document.getElementById('bioReg').addEventListener('submit',function(e){if(!hd.value||!hs.value){e.preventDefault();st.textContent='Falta foto del documento o selfie.';}});\"",
              '"})();"',
              '"</script>"',
              '"</details>"',
              "",
          ]

          link_lines = read_lines(P_LINK)
          link_lines = replace_seq(link_lines, SEQ_FAKE, NEW_REAL, P_LINK, "fake-zid-fallback")

          srv_lines = read_lines(P_SRV)
          srv_lines = replace_seq(srv_lines, SEQ_ENSURE, NEW_ENSURE, P_SRV, "ensure-trusted-zid")

          splits = [
              i for i, l in enumerate(srv_lines)
              if l.strip() == 'path = self.path.split("?")[0]'
              and any("/subastas/listing" in srv_lines[j] for j in range(i, min(i + 15, len(srv_lines))))
          ]
          if len(splits) != 1:
              fail("do_POST locate count %d (need 1)" % len(splits))
          tries = [i for i in range(splits[0], min(splits[0] + 15, len(srv_lines))) if srv_lines[i].strip() == "try:"]
          if not tries:
              fail("try: not found after do_POST path split")

          try_ind = leading(srv_lines[tries[0]])
          base = try_ind + "    "
          print("do_POST try indentation level:", len(try_ind), "spaces")
          C1 = [
              base + 'if path == "/subastas/register":' + "\n",
              base + "    self._register_bio()" + "\n",
              base + "    return" + "\n",
              "\n",
          ]
          srv_lines = insert_fixed(srv_lines, tries[0] + 1, C1, P_SRV, "register route")

          defs = [i for i, l in enumerate(srv_lines) if l.strip().startswith("def _ensure_trusted_zid")]
          if len(defs) != 1:
              fail("def _ensure_trusted_zid count %d (need 1)" % len(defs))
          d_ind = leading(srv_lines[defs[0]])
          C2 = [(d_ind + t + "\n") if t else "\n" for t in T_C2]
          srv_lines = insert_fixed(srv_lines, defs[0], C2, P_SRV, "_register_bio handlers")

          hdefs = [i for i, l in enumerate(srv_lines) if l.strip().startswith("def _home")]
          if len(hdefs) != 1:
              fail("def _home count %d (need 1)" % len(hdefs))
          h0 = hdefs[0]
          hind = leading(srv_lines[h0])
          h1 = len(srv_lines) - 1
          for i in range(h0 + 1, len(srv_lines)):
              l = srv_lines[i]
              if l.strip().startswith("def ") and leading(l) == hind:
                  h1 = i
                  break
          hits2 = [i for i in range(h0 + 1, h1) if srv_lines[i].strip() == '"<h1>SUBASTAS</h1>"']
          if len(hits2) != 1:
              fail("h1-SUBASTAS inside _home count %d (need 1)" % len(hits2))
          next_ind = leading(srv_lines[hits2[0] + 1])
          C3 = [(next_ind + t + "\n") if t else "\n" for t in T_C3]
          srv_lines = insert_fixed(srv_lines, hits2[0] + 1, C3, P_SRV, "bio form into _home")

          safe_compile(to_text(link_lines), P_LINK)
          safe_compile(to_text(srv_lines), P_SRV)

          Path(P_LINK).write_text(to_text(link_lines), encoding="utf-8")
          Path(P_SRV).write_text(to_text(srv_lines), encoding="utf-8")
          print("WROTE: 2 files")

          link_txt = Path(P_LINK).read_text(encoding="utf-8")
          srv_txt = Path(P_SRV).read_text(encoding="utf-8")
          if '"source": "local"' in link_txt:
              fail("post-check: fake zid still in link")
          if "no network ZID available" in srv_txt:
              fail("post-check: old ensure block still present")
          for marker in (
              "def _register_bio",
              '"/subastas/register"',
              "cuenta sin ZID biometrico",
              "bioDocB64",
              '"/identity/enroll"',
          ):
              if marker not in srv_txt:
                  fail("post-check missing in server.py: " + marker)

          print("ALL PATCHES APPLIED OK")
          PYEOF

      - name: Syntax check
        run: |
          python3 -m py_compile apps/subastas/services/subastas_link.py apps/subastas/server.py
          echo "SYNTAX OK"

      - name: Network biometrics self-test
        run: python3 -m shared_engines.security.biometrics -v

      - name: SUBASTAS tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/subastas/tests -q || true

      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add apps/subastas/services/subastas_link.py apps/subastas/server.py
          if git diff --cached --quiet; then
            echo "No changes (already patched)."
          else
            git commit -m "SUBASTAS: kill fake local ZIDs + biometric registration" -m "register_account fallback removed. _ensure_trusted_zid uses only real stored ZIDs. New bio registration form in home (doc+selfie) -> /identity/enroll."
            git pull --rebase origin main
            git push
          fi
