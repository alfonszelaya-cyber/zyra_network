name: "ZYRA AUDIT VIVA-2 (conectores vivos: ONEC+MARN+FX extra)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: P1 - constantes de fuentes (ONEC/MARN)
        run: |
          {
          echo "## OFFICIAL_SOURCES / ONEC_ENDPOINTS / ARCGIS_SERVICES"
          echo '```python'
          L=$(grep -n "OFFICIAL_SOURCES" shared_engines/integrations/engine.py | head -1 | cut -d: -f1)
          s=$((L-3)); [ "$s" -lt 1 ] && s=1
          awk -v a="$s" -v b="$((L+120))" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' shared_engines/integrations/engine.py
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P2 - register_adapter y PublicSourceClient (firmas exactas)
        run: |
          {
          echo "## IntegrationsEngine.register_adapter (fuente)"
          echo '```python'
          L=$(grep -n "def register_adapter" shared_engines/integrations/engine.py | head -1 | cut -d: -f1)
          s=$((L-3)); [ "$s" -lt 1 ] && s=1
          awk -v a="$s" -v b="$((L+55))" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' shared_engines/integrations/engine.py
          echo '```'
          echo "## PublicSourceClient (init + fetch)"
          echo '```python'
          L=$(grep -n "class PublicSourceClient" shared_engines/integrations/engine.py | head -1 | cut -d: -f1)
          s=$((L-3)); [ "$s" -lt 1 ] && s=1
          awk -v a="$s" -v b="$((L+70))" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' shared_engines/integrations/engine.py
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P3 - como se conectaria al arranque (main.py actual con VIVA-1)
        run: |
          {
          echo "## main.py zona kernel/caps/server (post VIVA-1)"
          echo '```python'
          awk 'NR>=110 && NR<=185 {printf "%5d| %s\n", NR, $0}' main.py
          echo '```'
          echo "## integrations en kernel/capabilities (existe wire?)"
          echo '```'
          grep -n "IntegrationsEngine\|integrations" shared_engines/runtime/kernel.py shared_engines/runtime/capabilities.py main.py 2>/dev/null | head -10 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P4 - sonda sweep real (ONEC + MARN en vivo)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import tempfile
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from shared_engines.integrations.engine import (
              PublicSourceClient, SourceIndex,
              sweep_onec, sweep_marn)
          d = pathlib.Path(tempfile.mkdtemp())
          cli = PublicSourceClient(clock=SystemClock(), ttl_seconds=300.0)
          idx = SourceIndex(SQLiteAdapter(d / "s.db"), SystemClock())
          print("## Sweep REAL contra fuentes publicas (dato, no gate)")
          print("```")
          try:
              r1 = sweep_onec(cli, idx)
              print("ONEC: ok=" + str(r1["ok"]) + "/" + str(r1["total"]))
          except Exception as e:
              print("ONEC FALLO:", type(e).__name__, str(e)[:100])
          try:
              r2 = sweep_marn(cli, idx, max_layers_per_service=2, pause_seconds=0.2)
              print("MARN: ok=" + str(r2.get("layers_ok")) + "/" + str(r2.get("layers_total")))
          except Exception as e:
              print("MARN FALLO:", type(e).__name__, str(e)[:100])
          rows = idx._db.query_all("SELECT * FROM source_snapshots")
          print("snapshots guardados:", len(rows))
          print("```")
          EOF
          exit 0

      - name: P5 - Frankfurter + Kraken (fuentes 4/5 en vivo)
        run: |
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import urllib.request
          print("## Fuentes FX nuevas (dato, no gate)")
          print("```")
          print("--- Frankfurter USD->EUR")
          try:
              req = urllib.request.Request(
                  "https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR",
                  headers={"User-Agent": "zyra-network"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  d = json.loads(r.read().decode())
              print("OK:", json.dumps(d)[:200])
          except Exception as e:
              print("FALLO:", type(e).__name__, str(e)[:100])
          print("--- Kraken public ticker BTC/USD")
          try:
              req = urllib.request.Request(
                  "https://api.kraken.com/0/public/Ticker?pair=XBTUSD",
                  headers={"User-Agent": "zyra-network"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  d = json.loads(r.read().decode())
              res = d.get("result", {}).get("XXBTZUSD", {})
              print("OK: c=", res.get("c", ["?"])[0])
          except Exception as e:
              print("FALLO:", type(e).__name__, str(e)[:100])
          print("```")
          EOF
          exit 0
