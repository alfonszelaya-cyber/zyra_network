name: "ZYRA CONECTORES 2: cripto on-chain (Blockstream + mempool)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir providers on-chain
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)

          MOD = D(r'''
              """Conectores cripto on-chain de la Red
              (Blockstream Esplora + mempool.space,
              ambos publicos sin key, falla honesta).
              Cierran el circuito BTC: el hold_ref del
              motor de pagos puede ser un txid real
              verificado en la cadena."""
              from __future__ import annotations

              import hashlib
              import json
              import urllib.request


              class _HttpBase:
                  """GET con UA de la Red + parse JSON."""

                  name = "base"

                  def __init__(
                      self,
                      *,
                      timeout_seconds: float = 15.0,
                  ) -> None:
                      self._timeout = timeout_seconds

                  def _get_json(self, url: str):
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                              "zyra-network/1.0"
                          })
                      with urllib.request.urlopen(
                              req,
                              timeout=self._timeout) as r:
                          return json.loads(
                              r.read().decode("utf-8"))

                  def _sha(self, data) -> str:
                      return hashlib.sha256(
                          json.dumps(
                              data,
                              sort_keys=True,
                              default=str).encode(
                              "utf-8")).hexdigest()


              class BlockstreamConnector(_HttpBase):
                  """Verificacion de txid BTC via
                  Esplora (blockstream.info/api)."""

                  name = "blockstream"

                  def tx_status(self, txid: str) -> dict:
                      """Estado on-chain de una
                      transaccion: confirmada y
                      en que bloque."""
                      txid = txid.strip()
                      if len(txid) != 64:
                          return {
                              "source": self.name,
                              "txid": txid,
                              "on_chain": False,
                              "error": "txid must be 64 hex chars",
                          }
                      url = ("https://blockstream.info"
                             "/api/tx/" + txid)
                      try:
                          d = self._get_json(url)
                      except Exception as exc:
                          return {
                              "source": self.name,
                              "txid": txid,
                              "on_chain": False,
                              "error":
                              type(exc).__name__,
                          }
                      resumen = {
                          "source": self.name,
                          "txid": txid,
                          "on_chain": True,
                          "confirmed": (
                              d.get("status", {})
                              .get("confirmed", False)),
                          "block_height": (
                              d.get("status", {})
                              .get("block_height")),
                          "fee": d.get("fee"),
                          "vsize": d.get("vsize"),
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen

                  def address_balance(
                      self, address: str) -> dict:
                      """Saldo on-chain de una
                      direccion BTC (chain stats)."""
                      address = address.strip()
                      url = ("https://blockstream.info"
                             "/api/address/" + address)
                      try:
                          d = self._get_json(url)
                      except Exception as exc:
                          return {
                              "source": self.name,
                              "address": address,
                              "error":
                              type(exc).__name__,
                          }
                      cs = d.get(
                          "chain_stats", {})
                      ms = d.get(
                          "mempool_stats", {})
                      received = (
                          cs.get("funded_txo_sum", 0)
                          - cs.get("spent_txo_sum", 0))
                      pending = (
                          ms.get("funded_txo_sum", 0)
                          - ms.get("spent_txo_sum", 0))
                      resumen = {
                          "source": self.name,
                          "address": address,
                          "confirmed_sats": received,
                          "pending_sats": pending,
                          "confirmed_btc": (
                              received / 100_000_000),
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen


              class MempoolConnector(_HttpBase):
                  """Fees recomendados y estado
                  de la mempool (mempool.space/api)."""

                  name = "mempool"

                  def recommended_fees(self) -> dict:
                      """Satoshi/vByte por urgencia."""
                      url = ("https://mempool.space"
                             "/api/v1/fees/recommended")
                      d = self._get_json(url)
                      resumen = {
                          "source": self.name,
                          "fastest": d.get(
                              "fastestFee"),
                          "hour": d.get(
                              "hourFee"),
                          "economy": d.get(
                              "economyFee"),
                          "minimum": d.get(
                              "minimumFee"),
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen

                  def tx_status(self, txid: str) -> dict:
                      """Estado confirmacion via
                      mempool.space (fuente 2a)."""
                      txid = txid.strip()
                      if len(txid) != 64:
                          return {
                              "source": self.name,
                              "txid": txid,
                              "on_chain": False,
                              "error": "txid must be 64 hex chars",
                          }
                      url = ("https://mempool.space"
                             "/api/tx/" + txid)
                      try:
                          d = self._get_json(url)
                      except Exception as exc:
                          return {
                              "source": self.name,
                              "txid": txid,
                              "on_chain": False,
                              "error":
                              type(exc).__name__,
                          }
                      resumen = {
                          "source": self.name,
                          "txid": txid,
                          "on_chain": True,
                          "confirmed": (
                              d.get("status", {})
                              .get("confirmed", False)),
                          "block_height": (
                              d.get("status", {})
                              .get("block_height")),
                          "fee": d.get("fee"),
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen
          ''')

          TESTS = D(r'''
              """Tests conectores on-chain (mockeados)."""
              from __future__ import annotations

              import json

              from shared_engines.integrations.rates_onchain import (
                  BlockstreamConnector,
                  MempoolConnector,
              )


              class _R:
                  def __init__(self, p):
                      self._p = p

                  def __enter__(self):
                      return self

                  def __exit__(self, *a):
                      return False

                  def read(self):
                      return self._p


              TXID = "a" * 64


              def _patch(monkeypatch, payload):
                  body = json.dumps(payload).encode()
                  monkeypatch.setattr(
                      "urllib.request.urlopen",
                      lambda req, timeout=None: _R(body))


              def test_blockstream_tx_confirmed(
                  tmp_path, monkeypatch) -> None:
                  _patch(monkeypatch, {
                      "status": {"confirmed": True,
                                 "block_height": 812345},
                      "fee": 1500, "vsize": 141})
                  r = BlockstreamConnector().tx_status(
                      TXID)
                  assert r["on_chain"] is True
                  assert r["confirmed"] is True
                  assert r["block_height"] == 812345
                  assert r["sha256"]
                  print("OK on-chain: blockstream tx"
                        " confirmada en bloque 812345")


              def test_blockstream_txid_invalido(
                  tmp_path, monkeypatch) -> None:
                  monkeypatch.setattr(
                      "urllib.request.urlopen",
                      lambda req, timeout=None: (
                          (_ for _ in ()).throw(
                              AssertionError(
                                  "no debe llamar red"))))
                  r = BlockstreamConnector().tx_status(
                      "mal-txid")
                  assert r["on_chain"] is False
                  assert "error" in r
                  print("OK on-chain: txid invalido"
                        " rechazado sin tocar red")


              def test_blockstream_balance(
                  tmp_path, monkeypatch) -> None:
                  _patch(monkeypatch, {
                      "chain_stats": {
                          "funded_txo_sum": 1_500_000_000,
                          "spent_txo_sum": 500_000_000},
                      "mempool_stats": {
                          "funded_txo_sum": 0,
                          "spent_txo_sum": 0}})
                  r = BlockstreamConnector().address_balance(
                      "bc1qexample")
                  assert r["confirmed_sats"] == 1_000_000_000
                  assert r["confirmed_btc"] == 10.0
                  print("OK on-chain: balance 10 BTC")


              def test_mempool_fees(
                  tmp_path, monkeypatch) -> None:
                  _patch(monkeypatch, {
                      "fastestFee": 12,
                      "hourFee": 8,
                      "economyFee": 5,
                      "minimumFee": 2})
                  r = MempoolConnector().recommended_fees()
                  assert r["fastest"] == 12
                  assert r["economy"] == 5
                  print("OK on-chain: mempool fees 12/8/5/2")


              def test_mempool_tx_status(
                  tmp_path, monkeypatch) -> None:
                  _patch(monkeypatch, {
                      "status": {"confirmed": True,
                                 "block_height": 812346},
                      "fee": 1400})
                  r = MempoolConnector().tx_status(TXID)
                  assert r["confirmed"] is True
                  assert r["source"] == "mempool"
                  print("OK on-chain: mempool tx"
                        " confirmada (fuente 2a)")
          ''')

          p = pathlib.Path("shared_engines/integrations/rates_onchain.py")
          if p.exists() and "class BlockstreamConnector" in p.read_text(encoding="utf-8"):
              out("- **modulo on-chain: YA**")
          else:
              try:
                  ast.parse(MOD)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(MOD, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  out("- **modulo on-chain: OK (" + str(len(MOD)) + " chars)**")
              except Exception:
                  out("- **modulo on-chain: ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          t = pathlib.Path("shared_engines/integrations/tests/test_onchain.py")
          if t.exists() and "test_mempool_tx_status" in t.read_text(encoding="utf-8"):
              out("- **tests on-chain: YA**")
          else:
              try:
                  ast.parse(TESTS)
                  t.parent.mkdir(parents=True, exist_ok=True)
                  t.write_text(TESTS, encoding="utf-8")
                  py_compile.compile(str(t), doraise=True)
                  out("- **tests on-chain: OK (" + str(len(TESTS)) + " chars)**")
              except Exception:
                  out("- **tests on-chain: ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          chk = pathlib.Path("shared_engines/integrations/rates_onchain.py")
          chk2 = pathlib.Path("shared_engines/integrations/tests/test_onchain.py")
          out("- **verif disco: modulo=" + str(chk.exists()) + " test=" + str(chk2.exists()) + "**")
          exit(0)
          EOF

      - name: "O1: tests on-chain"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 120 python3 -m pytest shared_engines/integrations/tests/test_onchain.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/o1.out 2>&1
          echo $? > /tmp/o1
          if [ "$(cat /tmp/o1)" = "0" ]; then echo "- O1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- O1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### O1 detalle"; echo '```'; tail -60 /tmp/o1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "O2: regresion shared_engines"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/o2.out 2>&1
          echo $? > /tmp/o2
          if [ "$(cat /tmp/o2)" = "0" ]; then echo "- O2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- O2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### O2 detalle"; echo '```'; tail -60 /tmp/o2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "O3: apps intactas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/nexo/tests apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/o3.out 2>&1
          echo $? > /tmp/o3
          if [ "$(cat /tmp/o3)" = "0" ]; then echo "- O3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- O3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### O3 detalle"; echo '```'; tail -40 /tmp/o3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in o1 o2 o3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: O1-O3 VERDES — LOTE 2 ON-CHAIN CONECTADO**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(conectores): Blockstream Esplora + mempool.space - verificacion txid BTC, balance on-chain, fees recomendados (O1-O3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 2/4. Sigue RED-9 IA.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
