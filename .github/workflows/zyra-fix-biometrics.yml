                      db.execute(
                          "UPDATE ax_em_dispatch SET"
                          " released_at = ? WHERE dis_id ="
                          " ?", (str(at), str(r["dis_id"])))
                  db.execute(
                      "UPDATE ax_em_incidents SET status ="
                      " 'resuelto', resolved_at = ? WHERE"
                      " inc_id = ?", (str(at),
                                      str(inc_id)))
                  return {"inc_id": str(inc_id),
