name: "ZYRA VIVA-2 v2: ruta sources + tests corregidos"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Wiring VIVA-2 v2 (2 fixes restantes)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, re, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def fix(nombre, fn):
              try:
                  out("- **" + nombre + ": " + fn() + "**")
              except Exception:
                  out("- **" + nombre + ": ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          def fb():
              p = pathlib.Path("shared_engines/runtime/combined_api.py")
              src = p.read_text(encoding="utf-8")
              if '"sources"' in src and "VIVA-2" in src:
                  return "YA"
              pat_post = r'(CAPS_POST_PREFIXES = frozenset\(\s*\{)'
              src2, n = re.subn(
                  pat_post,
                  r'\1  # VIVA-2-SOURCES\n        "sources",',
                  src)
              if n == 0:
                  src2, n = re.subn(
                      r'(CAPS_\w+_PREFIXES = frozenset\(\s*\{)(?!"sources")',
                      r'\1  # VIVA-2-SOURCES\n        "sources",',
                      src)
              if n == 0:
                  raise RuntimeError("sin CAPS_*_PREFIXES en combined_api")
              ast.parse(src2)
              p.write_text(src2, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK(" + str(n) + " sets)"

          def fb2():
              p = pathlib.Path("shared_engines/runtime/capabilities_api.py")
              src = p.read_text(encoding="utf-8")
              if "VIVA-2-SOURCES" in src:
                  return "YA"
              EXTRA = '\n\n_VIVA2_ORIG_ROUTE_POST = CapabilitiesApiHandler._route_post\n\n\ndef _viva2_route_post(self, s):\n    if len(s) == 2 and s[0] == "sources" and s[1] == "sweep":\n        doc = self._read_json()\n        source = str(doc.get("source", "onec"))\n        max_layers = int(doc.get("max_layers", 5))\n        caps = type(self).caps\n        try:\n            if source == "marn":\n                from shared_engines.integrations.engine import sweep_marn\n                r = sweep_marn(caps._source_client, caps._source_index, max_layers_per_service=max_layers, pause_seconds=0.0)\n            else:\n                from shared_engines.integrations.engine import sweep_onec\n                r = sweep_onec(caps._source_client, caps._source_index)\n            self._send(200, {"ok": True, "data": r})\n        except Exception as exc:\n            self._send(502, {"ok": False, "error": {"type": "source_unavailable", "message": type(exc).__name__ + ": " + str(exc)[:100]}})\n        return\n    return _VIVA2_ORIG_ROUTE_POST(self, s)\n\n\nCapabilitiesApiHandler._route_post = _viva2_route_post  # VIVA-2-SOURCES\n'
              if not src.endswith("\n"):
                  src += "\n"
              src = src + EXTRA
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK(wrapper route_post)"

          def fe():
              TEST = (
                  '"""VIVA-2: conectores vivos + sweep + FX 5 fuentes."""\n'
                  'from __future__ import annotations\n'
                  '\n'
                  'import json\n'
                  'import threading\n'
                  'import time\n'
                  'import urllib.request\n'
                  'from decimal import Decimal\n'
                  '\n'
                  'from shared_engines.common.clocks import FrozenClock\n'
                  'from shared_engines.currency.contracts import CurrencyPair\n'
                  'from shared_engines.currency.rates import (\n'
                  '    FrankfurterRateProvider, KrakenRateProvider)\n'
                  'from shared_engines.runtime.config import RuntimeConfig\n'
                  'from shared_engines.runtime.kernel import ZyraKernel\n'
                  'from shared_engines.runtime.capabilities import ZyraCapabilities\n'
                  'from shared_engines.runtime.combined_api import serve_combined\n'
                  'from shared_engines.storage.database import SQLiteAdapter\n'
                  'from shared_engines.verification.signatures import Ed25519Signer\n'
                  '\n'
                  '\n'
                  'class _R:\n'
                  '    def __init__(self, p):\n'
                  '        self._p = p\n'
                  '\n'
                  '    def __enter__(self):\n'
                  '        return self\n'
                  '\n'
                  '    def __exit__(self, *a):\n'
                  '        return False\n'
                  '\n'
                  '    def read(self):\n'
                  '        return self._p\n'
                  '\n'
                  '\n'
                  'def _stack(tmp_path):\n'
                  '    db = SQLiteAdapter(tmp_path / "v2.db")\n'
                  '    s, _ = Ed25519Signer.generate()\n'
                  '    k = ZyraKernel(\n'
                  '        db=db, clock=FrozenClock(), signer=s,\n'
                  '        config=RuntimeConfig(\n'
                  '            host="127.0.0.1", port=0,\n'
                  '            api_token=None))\n'
                  '    k.bootstrap_root()\n'
                  '    caps = ZyraCapabilities(\n'
                  '        db, FrozenClock(),\n'
                  '        identity=k.identity, signer=s)\n'
                  '    return k, caps, db\n'
                  '\n'
                  '\n'
                  'def test_integrations_wired(tmp_path) -> None:\n'
                  '    k, caps, db = _stack(tmp_path)\n'
                  '    h = caps.integrations.health(\n'
                  '        adapter_id="onec-classifiers")\n'
                  '    assert "onec" in h.endpoint, str(h)\n'
                  '    h2 = caps.integrations.health(\n'
                  '        adapter_id="marn-geo")\n'
                  '    assert "marn" in h2.endpoint, str(h2)\n'
                  '    assert caps._source_client is not None\n'
                  '    print("OK VIVA-2: integrations cableado ONEC+MARN")\n'
                  '\n'
                  '\n'
                  'def test_frankfurter_parse(tmp_path, monkeypatch) -> None:\n'
                  '    payload = json.dumps({\n'
                  '        "amount": 1.0, "base": "USD",\n'
                  '        "rates": {"EUR": 0.89087}}).encode()\n'
                  '\n'
                  '    def fake(req, timeout=None):\n'
                  '        return _R(payload)\n'
                  '\n'
                  '    monkeypatch.setattr(\n'
                  '        "urllib.request.urlopen", fake)\n'
                  '    q = FrankfurterRateProvider().fetch(\n'
                  '        CurrencyPair("USD", "EUR"), FrozenClock())\n'
                  '    assert q.rate == Decimal("0.89087"), str(q)\n'
                  '    assert q.source == "frankfurter"\n'
                  '    print("OK VIVA-2: frankfurter 0.89087")\n'
                  '\n'
                  '\n'
                  'def test_kraken_parse(tmp_path, monkeypatch) -> None:\n'
                  '    payload = json.dumps({\n'
                  '        "result": {"XXBTZUSD": {\n'
                  '            "c": ["84749.20000", "1.0"]}}}).encode()\n'
                  '\n'
                  '    def fake(req, timeout=None):\n'
                  '        return _R(payload)\n'
                  '\n'
                  '    monkeypatch.setattr(\n'
                  '        "urllib.request.urlopen", fake)\n'
                  '    q = KrakenRateProvider().fetch(\n'
                  '        CurrencyPair("BTC", "USD"), FrozenClock())\n'
                  '    assert q.rate == Decimal("84749.20000"), str(q)\n'
                  '    assert q.source == "kraken"\n'
                  '    print("OK VIVA-2: kraken BTC 84749.20")\n'
                  '\n'
                  '\n'
                  'def test_sources_sweep_route(tmp_path, monkeypatch) -> None:\n'
                  '    k, caps, db = _stack(tmp_path)\n'
                  '    one_body = json.dumps(\n'
                  '        [{"codigo": "0111101"}]).encode()\n'
                  '    meta_body = json.dumps({\n'
                  '        "layers": [{"id": 0}, {"id": 1}]}).encode()\n'
                  '    geo_body = json.dumps({\n'
                  '        "type": "FeatureCollection",\n'
                  '        "features": [{}, {}]}).encode()\n'
                  '\n'
                  '    def fake_urlopen(req, timeout=None):\n'
                  '        url = req.full_url\n'
                  '        if "onec.bcr.gob.sv" in url:\n'
                  '            return _R(one_body)\n'
                  '        if url.endswith("?f=json"):\n'
                  '            return _R(meta_body)\n'
                  '        if "/query" in url:\n'
                  '            return _R(geo_body)\n'
                  '        raise OSError("no simulada")\n'
                  '\n'
                  '    monkeypatch.setattr(\n'
                  '        "urllib.request.urlopen", fake_urlopen)\n'
                  '    srv = serve_combined(\n'
                  '        k, caps, host="127.0.0.1", port=0)\n'
                  '    threading.Thread(\n'
                  '        target=srv.serve_forever,\n'
                  '        daemon=True).start()\n'
                  '    time.sleep(0.4)\n'
                  '    base = "http://127.0.0.1:" + str(\n'
                  '        srv.server_address[1])\n'
                  '    req = urllib.request.Request(\n'
                  '        base + "/sources/sweep",\n'
                  '        data=json.dumps({"source": "onec"}).encode(),\n'
                  '        method="POST",\n'
                  '        headers={"Content-Type":\n'
                  '                 "application/json"})\n'
                  '    with urllib.request.urlopen(req, timeout=30) as r:\n'
                  '        d = json.loads(r.read().decode())\n'
                  '    assert d["data"]["ok"] == 7, str(d)[:200]\n'
                  '    print("OK VIVA-2: /sources/sweep onec 7/7 via HTTP")\n'
                  '    srv.shutdown()\n'
                  '    srv.server_close()\n'
              )
              p = pathlib.Path("shared_engines/runtime/tests/test_viva2.py")
              ast.parse(TEST)
              p.write_text(TEST, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"

          fix("FIX-B v2 sets combined_api", fb)
          fix("FIX-B2 wrapper route_post", fb2)
          fix("FIX-E v2 tests json.dumps", fe)
          exit(0)
          EOF

      - name: "W1: tests viva2"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 180 python3 -m pytest shared_engines/runtime/tests/test_viva2.py -vv --tb=long --timeout=60 --timeout-method=thread > /tmp/w1.out 2>&1
          echo $? > /tmp/w1
          if [ "$(cat /tmp/w1)" = "0" ]; then echo "- W1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- W1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### W1 detalle"; echo '```'; tail -80 /tmp/w1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "W2: regresion shared_engines completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/w2.out 2>&1
          echo $? > /tmp/w2
          if [ "$(cat /tmp/w2)" = "0" ]; then echo "- W2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- W2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### W2 detalle"; echo '```'; tail -60 /tmp/w2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "W3: apps intactas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/nexo/tests apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/w3.out 2>&1
          echo $? > /tmp/w3
          if [ "$(cat /tmp/w3)" = "0" ]; then echo "- W3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- W3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### W3 detalle"; echo '```'; tail -40 /tmp/w3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in w1 w2 w3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: W1-W3 VERDES — CONECTORES VIVOS**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(VIVA-2): IntegrationsEngine cableado (ONEC+MARN), ruta POST /sources/sweep, Frankfurter+Kraken fuentes 4/5 FX (W1-W3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — VIVA-2 CERRADO. Sigue VIVA-3.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2) — VIVA-2 CERRADO.**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
