              ind + 'if path == "/subastas/api/gov-comunidad":\n',
              b + "self.market_gov_comunidad_api()\n",
              b + "return\n",
          ] + lines[i:]
          print("POST routes OK")

          i = find_one('"tdr": _tdr_inst,')
