name: "ZYRA RUN1c: S-1 wiring real (SemillaStore autowire al canonico) + bridge v2 (LookupError + complete_pending) + auditoria HTTP para 1d"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] auditoria server.py para RUN 1d (endpoints HTTP matricula)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA RUN 1d — dispatch HTTP de server.py" >> "$SUM"
          echo "### do_POST/_safe/_route (100-156)" >> "$SUM"
          { echo '```'; sed -n '100,156p' apps/semilla/server.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### _post inicio (416-560, flujo add_account)" >> "$SUM"
          { echo '```'; sed -n '416,560p' apps/semilla/server.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### _read_form/_read_json (655-730)" >> "$SUM"
          { echo '```'; sed -n '655,730p' apps/semilla/server.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### _api_get/_api_post (731-860)" >> "$SUM"
          { echo '```'; sed -n '731,860p' apps/semilla/server.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### SemillaServer/serve_semilla (1332-1361)" >> "$SUM"
          { echo '```'; sed -n '1332,1361p' apps/semilla/server.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### modules_router.py (punto de extension)" >> "$SUM"
          { echo '```'; cat apps/semilla/routers/modules_router.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### fin auditoria 1d" >> "$SUM"
          exit 0

      - name: "[ESCRITURA] canonical_bridge v2 (LookupError-aware + complete_pending)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/infrastructure/persistence/canonical_bridge.py",
                     D(r'''
                  """Canonical Bridge (S-1) v2 - puente ADITIVO entre
                  el registro viejo (SemillaStore / semilla_accounts)
                  y el canonico (StudentRegistryEngine / sm_students).

                  v2 (auditoria del repo vivo):
                  - get_account del store REAL lanza LookupError:
                    el read-through ahora captura LookupError, busca
                    en el mapa y responde del canonico; si tampoco
                    existe, re-lanza el MISMO LookupError
                    (comportamiento viejo identico).
                  - complete_pending(): convierte una alta en cola
                    (SE-3 incompleto) en expediente canonico
                    completo, la saca de la cola y la mapea.

                  REGLA 51 (aditivo): el viejo responde SIEMPRE
                  igual; el lado canonico es best-effort y jamas
                  lanza hacia el server."""
                  from __future__ import annotations
                  import json as _j
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_legacy_map", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_legacy_map (account_id TEXT"
                          " PRIMARY KEY, student_id TEXT NOT NULL,"
                          " created_at REAL NOT NULL)",
                      )),
                      Migration(2, "sm_legacy_pending", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_legacy_pending (account_id TEXT"
                          " PRIMARY KEY, reason TEXT NOT NULL,"
                          " payload_json TEXT NOT NULL DEFAULT"
                          " '{}', created_at REAL NOT NULL)",
                      )),
                  )

                  class CanonicalBridge:
                      """Puente viejo->canonico (regla 51 aditivo)."""

                      def __init__(self, db, clock, registry):
                          self._db = db
                          self._clock = clock
                          self._reg = registry
                          MigrationRunner(db, "sm.legacybridge",
                                          _MIGRATIONS).run(clock)

                      def wire(self, store) -> object:
                          """Envuelve metodos de cuentas que existan.
                          Idempotente."""
                          for name in ("add_account",
                                       "create_account",
                                       "register_account"):
                              m = getattr(store, name, None)
                              if m is not None and not getattr(
                                      m, "_zyra_canonical", False):
                                  setattr(store, name,
                                          self._wrap_add(m))
                          m = getattr(store, "get_account", None)
                          if m is not None and not getattr(
                                  m, "_zyra_canonical", False):
                              setattr(store, "get_account",
                                      self._wrap_get(m))
                          return store

                      # ---------- alta (dual-write) ----------

                      def _wrap_add(self, original):
                          bridge = self
                          def patched(*args, **kwargs):
                              res = original(*args, **kwargs)
                              try:
                                  bridge._mirror(args, kwargs, res)
                              except Exception:
                                  pass
                              return res
                          patched._zyra_canonical = True
                          return patched

                      def _mirror(self, args, kwargs, res):
                          data = dict(kwargs or {})
                          if not data and isinstance(res, dict):
                              data = dict(res)
                          if not data:
                              return
                          acc = (data.get("account_id")
                                 or (res or {}).get("account_id")
                                 or data.get("id") or "")
                          name = (data.get("name")
                                  or data.get("full_name")
                                  or (res or {}).get("name") or "")
                          zid = (data.get("zid")
                                 or (res or {}).get("zid") or "")
                          role = (data.get("role")
                                  or (res or {}).get("role")
                                  or "alumno")
                          school = (data.get("school")
                                    or data.get("institution_id")
                                    or "")
                          grade = (data.get("grade") or "1")
                          if str(role) != "alumno":
                              return
                          tutores = list(data.get("tutores") or [])
                          pick = list(
                              data.get("authorized_pickup") or [])
                          emg = list(
                              data.get("emergency_contacts") or [])
                          if (len(tutores) < 1 or len(pick) < 2
                                  or len(emg) < 1):
                              self._pending(
                                  str(acc), "SE-3 incompleto",
                                  {"name": str(name),
                                   "zid": str(zid),
                                   "school": str(school),
                                   "grade": str(grade)})
                              return
                          est = self._reg.register(
                              full_name=str(name), level="BASICA",
                              grade=str(grade),
                              institution_id=str(school),
                              tutores=tutores,
                              authorized_pickup=pick,
                              emergency_contacts=emg,
                              zid=str(zid),
                              zid_status=("PROVISIONAL" if zid
                                          else "NONE"))
                          if acc:
                              self._db.execute(
                                  "INSERT OR REPLACE INTO"
                                  " sm_legacy_map (account_id,"
                                  " student_id, created_at)"
                                  " VALUES (?, ?, ?)",
                                  (str(acc),
                                   str(est["student_id"]),
                                   self._clock.now()))

                      def _pending(self, account_id, reason,
                                   payload):
                          self._db.execute(
                              "INSERT OR REPLACE INTO"
                              " sm_legacy_pending (account_id,"
                              " reason, payload_json, created_at)"
                              " VALUES (?, ?, ?, ?)",
                              (str(account_id or "SIN_ID"),
                               str(reason),
                               _j.dumps(payload, default=str),
                               self._clock.now()))

                      def pending_list(self):
                          rows = self._db.query_all(
                              "SELECT * FROM sm_legacy_pending"
                              " ORDER BY rowid")
                          return [dict(r) for r in rows]

                      def complete_pending(self, account_id, *,
                                           tutores,
                                           authorized_pickup,
                                           emergency_contacts,
                                           level="BASICA",
                                           grade=None) -> dict:
                          """Cola -> expediente canonico SE-3
                          completo + mapa (sale de la cola)."""
                          row = self._db.query_one(
                              "SELECT payload_json FROM"
                              " sm_legacy_pending WHERE"
                              " account_id = ?",
                              (str(account_id),))
                          if not row:
                              raise KeyError(account_id)
                          p = _j.loads(
                              str(row["payload_json"]) or "{}")
                          est = self._reg.register(
                              full_name=str(p.get("name") or ""),
                              level=str(level),
                              grade=str(grade
                                        or p.get("grade")
                                        or "1"),
                              institution_id=str(
                                  p.get("school") or ""),
                              tutores=list(tutores),
                              authorized_pickup=list(
                                  authorized_pickup),
                              emergency_contacts=list(
                                  emergency_contacts),
                              zid=str(p.get("zid") or ""),
                              zid_status=("PROVISIONAL"
                                          if p.get("zid")
                                          else "NONE"))
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "DELETE FROM sm_legacy_pending"
                                  " WHERE account_id = ?",
                                  (str(account_id),))
                              cursor.execute(
                                  "INSERT OR REPLACE INTO"
                                  " sm_legacy_map (account_id,"
                                  " student_id, created_at)"
                                  " VALUES (?, ?, ?)",
                                  (str(account_id),
                                   str(est["student_id"]),
                                   self._clock.now()))
                          return est

                      # ---------- lectura ----------

                      def _wrap_get(self, original):
                          bridge = self
                          def patched(*args, **kwargs):
                              err = None
                              try:
                                  res = original(*args, **kwargs)
                              except LookupError as e:
                                  err = e
                                  res = None
                              if res is not None:
                                  return res
                              try:
                                  acc = None
                                  if kwargs.get("account_id"):
                                      acc = str(
                                          kwargs["account_id"])
                                  elif args:
                                      acc = str(args[0])
                                  if acc:
                                      row = self._db.query_one(
                                          "SELECT student_id FROM"
                                          " sm_legacy_map WHERE"
                                          " account_id = ?",
                                          (acc,))
                                      if row:
                                          est = bridge._reg.get(
                                              str(row[
                                                  "student_id"]))
                                          if est:
                                              return \
                                                  bridge._canon_shape(
                                                      est, acc)
                              except Exception:
                                  pass
                              if err is not None:
                                  raise err
                              return res
                          patched._zyra_canonical = True
                          return patched

                      def _canon_shape(self, est,
                                       account_id) -> dict:
                          return {"account_id": str(account_id),
                                  "student_id":
                                      str(est.get("student_id",
                                                  "")),
                                  "name":
                                      str(est.get("full_name",
                                                  "")
                                          or est.get("name",
                                                     "")),
                                  "zid": str(est.get("zid", "")),
                                  "role": "alumno",
                                  "school":
                                      str(est.get(
                                          "institution_id", "")),
                                  "grade":
                                      str(est.get("grade", "")),
                                  "canonico": True}
              '''))
              out("## FIN bridge v2")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] semilla_store.py COMPLETO + autowire canonico (S-1 definitivo)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/infrastructure/persistence/semilla_store.py",
                     D(r'''
                  """SEMILLA durable store (v2: + tutor tables).

                  S-1 CANONICO (regla 51 aditivo): cada SemillaStore
                  se autowirea al StudentRegistryEngine canonico via
                  CanonicalBridge — altas de alumnos espejadas al
                  canonico (o en cola sm_legacy_pending si faltan
                  datos SE-3: nada falso, regla 66) y lecturas
                  viejas-primero con fallback canonico por mapa.
                  Best-effort: si el lado canonico no esta
                  disponible, el store funciona identico a antes."""
                  from __future__ import annotations

                  import uuid

                  from shared_engines.storage.database import Database
                  from shared_engines.storage.migrations import Migration, MigrationRunner

                  ROLES = ("alumno", "profesor", "institucion")
                  GRADE_LEVELS = ("prekinder", "kinder", "primaria", "secundaria", "universidad")

                  _MIGRATIONS = (
                      Migration(
                          1,
                          "semilla",
                          (
                              "CREATE TABLE semilla_accounts ("
                              " account_id TEXT PRIMARY KEY,"
                              " zid TEXT,"
                              " name TEXT NOT NULL,"
                              " role TEXT NOT NULL,"
                              " school TEXT,"
                              " grade TEXT,"
                              " created_at REAL NOT NULL)",
                              "CREATE TABLE semilla_grades ("
                              " grade_id TEXT PRIMARY KEY,"
                              " student_account TEXT NOT NULL,"
                              " subject TEXT NOT NULL,"
                              " score REAL NOT NULL,"
                              " teacher_account TEXT NOT NULL,"
                              " recorded_at REAL NOT NULL)",
                              "CREATE TABLE semilla_attendance ("
                              " att_id TEXT PRIMARY KEY,"
                              " student_account TEXT NOT NULL,"
                              " present INTEGER NOT NULL,"
                              " recorded_at REAL NOT NULL)",
                              "CREATE TABLE semilla_welfare ("
                              " welfare_id TEXT PRIMARY KEY,"
                              " student_account TEXT NOT NULL,"
                              " mood TEXT NOT NULL,"
                              " alert INTEGER NOT NULL DEFAULT 0,"
                              " recorded_at REAL NOT NULL)",
                              "CREATE TABLE semilla_scholarships ("
                              " scholarship_id TEXT PRIMARY KEY,"
                              " student_account TEXT NOT NULL,"
                              " reason TEXT NOT NULL,"
                              " granted_at REAL NOT NULL)",
                          ),
                      ),
                      Migration(
                          2,
                          "semilla_tutor",
                          (
                              "CREATE TABLE semilla_challenge_state ("
                              " student_account TEXT PRIMARY KEY,"
                              " domain TEXT NOT NULL,"
                              " difficulty INTEGER NOT NULL,"
                              " updated_at REAL NOT NULL)",
                              "CREATE TABLE semilla_attempts ("
                              " attempt_id TEXT PRIMARY KEY,"
                              " student_account TEXT NOT NULL,"
                              " domain TEXT NOT NULL,"
                              " difficulty INTEGER NOT NULL,"
                              " correct INTEGER NOT NULL,"
                              " created_at REAL NOT NULL)",
                              "CREATE TABLE semilla_talents ("
                              " talent_id TEXT PRIMARY KEY,"
                              " student_account TEXT NOT NULL,"
                              " domain TEXT NOT NULL,"
                              " evidence TEXT NOT NULL,"
                              " created_at REAL NOT NULL)",
                              "CREATE TABLE semilla_rewards ("
                              " reward_id TEXT PRIMARY KEY,"
                              " student_account TEXT NOT NULL,"
                              " kind TEXT NOT NULL,"
                              " detail TEXT,"
                              " points INTEGER NOT NULL DEFAULT 0,"
                              " created_at REAL NOT NULL)",
                              "CREATE TABLE semilla_messages ("
                              " message_id TEXT PRIMARY KEY,"
                              " recipient TEXT NOT NULL,"
                              " student_account TEXT,"
                              " text TEXT NOT NULL,"
                              " created_at REAL NOT NULL)",
                          ),
                      ),
                  )

                  class SemillaStore:
                      """Durable state for SEMILLA."""

                      def __init__(self, db: Database, clock) -> None:
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "semilla", _MIGRATIONS).run(clock)
                          self.canonical_bridge = None
                          self._wire_canonical()

                      def _wire_canonical(self) -> None:
                          """S-1: autowire al canonico (best-effort,
                          jamas rompe el store viejo)."""
                          try:
                              from apps.semilla.domain.student.student_registry_engine import (
                                  StudentRegistryEngine,
                              )
                              from apps.semilla.infrastructure.persistence.canonical_bridge import (
                                  CanonicalBridge,
                              )
                              registry = StudentRegistryEngine(self._db, self._clock)
                              bridge = CanonicalBridge(self._db, self._clock, registry)
                              bridge.wire(self)
                              self.canonical_bridge = bridge
                          except Exception:
                              self.canonical_bridge = None

                      def add_account(
                          self,
                          *,
                          account_id: str,
                          zid: str | None,
                          name: str,
                          role: str,
                          school: str | None,
                          grade: str | None,
                      ) -> dict[str, object]:
                          if role not in ROLES:
                              raise ValueError(f"unknown role: {role}")
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO semilla_accounts"
                                  " (account_id, zid, name, role, school, grade, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, ?)",
                                  (account_id, zid, name, role, school, grade, now),
                              )
                          return self.get_account(account_id)

                      def get_account(self, account_id: str) -> dict[str, object]:
                          row = self._db.query_one(
                              "SELECT * FROM semilla_accounts WHERE account_id = ?",
                              (account_id,),
                          )
                          if row is None:
                              raise LookupError(f"unknown account: {account_id}")
                          return self._account_row(row)

                      def set_zid(self, *, account_id: str, zid: str) -> None:
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "UPDATE semilla_accounts SET zid = ? WHERE account_id = ?",
                                  (zid, account_id),
                              )

                      def update_grade(self, *, account_id: str, new_grade: str) -> None:
                          if new_grade not in GRADE_LEVELS:
                              raise ValueError(f"unknown grade: {new_grade}")
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "UPDATE semilla_accounts SET grade = ? WHERE account_id = ?",
                                  (new_grade, account_id),
                              )

                      def list_by_role(
                          self, *, role: str, school: str | None = None,
                      ) -> tuple[dict[str, object], ...]:
                          if school is not None:
                              rows = self._db.query_all(
                                  "SELECT * FROM semilla_accounts"
                                  " WHERE role = ? AND school = ? ORDER BY created_at",
                                  (role, school),
                              )
                          else:
                              rows = self._db.query_all(
                                  "SELECT * FROM semilla_accounts"
                                  " WHERE role = ? ORDER BY created_at",
                                  (role,),
                              )
                          return tuple(self._account_row(r) for r in rows)

                      def add_grade(
                          self,
                          *,
                          grade_id: str,
                          student_account: str,
                          subject: str,
                          score: float,
                          teacher_account: str,
                      ) -> dict[str, object]:
                          if not 0.0 <= score <= 10.0:
                              raise ValueError("score must be 0..10")
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO semilla_grades"
                                  " (grade_id, student_account, subject, score,"
                                  " teacher_account, recorded_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?)",
                                  (grade_id, student_account, subject, score, teacher_account, now),
                              )
                          return {
                              "grade_id": grade_id,
                              "student": student_account,
                              "subject": subject,
                              "score": score,
                          }

                      def grades_of(self, *, student_account: str) -> tuple[dict[str, object], ...]:
                          rows = self._db.query_all(
                              "SELECT * FROM semilla_grades"
                              " WHERE student_account = ? ORDER BY recorded_at",
                              (student_account,),
                          )
                          return tuple(
                              {"subject": str(r["subject"]), "score": float(r["score"])}
                              for r in rows
                          )

                      def average_of(self, *, student_account: str) -> float | None:
                          rows = self.grades_of(student_account=student_account)
                          if not rows:
                              return None
                          return sum(float(r["score"]) for r in rows) / len(rows)

                      def attendance_rate(self, *, student_account: str) -> float | None:
                          rows = self._db.query_all(
                              "SELECT present FROM semilla_attendance WHERE student_account = ?",
                              (student_account,),
                          )
                          if not rows:
                              return None
                          return sum(int(r["present"]) for r in rows) / len(rows)

                      def add_attendance(
                          self, *, att_id: str, student_account: str, present: bool,
                      ) -> None:
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO semilla_attendance"
                                  " (att_id, student_account, present, recorded_at)"
                                  " VALUES (?, ?, ?, ?)",
                                  (att_id, student_account, int(present), now),
                              )

                      def add_welfare(
                          self, *, welfare_id: str, student_account: str, mood: str,
                      ) -> dict[str, object]:
                          alert = mood in ("triste", "enojado", "enfermo")
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO semilla_welfare"
                                  " (welfare_id, student_account, mood, alert, recorded_at)"
                                  " VALUES (?, ?, ?, ?, ?)",
                                  (welfare_id, student_account, mood, int(alert), now),
                              )
                          return {"welfare_id": welfare_id, "mood": mood, "alert": alert}

                      def welfare_alerts(self) -> tuple[dict[str, object], ...]:
                          rows = self._db.query_all(
                              "SELECT * FROM semilla_welfare"
                              " WHERE alert = 1 ORDER BY recorded_at DESC"
                          )
                          return tuple(
                              {"student": str(r["student_account"]), "mood": str(r["mood"])}
                              for r in rows
                          )

                      def grant_scholarship(
                          self, *, scholarship_id: str, student_account: str, reason: str,
                      ) -> dict[str, object]:
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO semilla_scholarships"
                                  " (scholarship_id, student_account, reason, granted_at)"
                                  " VALUES (?, ?, ?, ?)",
                                  (scholarship_id, student_account, reason, now),
                              )
                          return {
                              "scholarship_id": scholarship_id,
                              "student": student_account,
                              "reason": reason,
                          }

                      def has_scholarship(self, *, student_account: str) -> bool:
                          row = self._db.query_one(
                              "SELECT 1 FROM semilla_scholarships WHERE student_account = ?",
                              (student_account,),
                          )
                          return row is not None

                      def summary(self, *, school: str | None = None) -> dict[str, object]:
                          if school is not None:
                              students = self._db.query_one(
                                  "SELECT COUNT(*) AS n FROM semilla_accounts"
                                  " WHERE role = 'alumno' AND school = ?",
                                  (school,),
                              )
                              teachers = self._db.query_one(
                                  "SELECT COUNT(*) AS n FROM semilla_accounts"
                                  " WHERE role = 'profesor' AND school = ?",
                                  (school,),
                              )
                          else:
                              students = self._db.query_one(
                                  "SELECT COUNT(*) AS n FROM semilla_accounts"
                                  " WHERE role = 'alumno'"
                              )
                              teachers = self._db.query_one(
                                  "SELECT COUNT(*) AS n FROM semilla_accounts"
                                  " WHERE role = 'profesor'"
                              )
                          return {
                              "students": int(students["n"]) if students is not None else 0,
                              "teachers": int(teachers["n"]) if teachers is not None else 0,
                          }

                      def get_challenge_state(self, *, student_account: str) -> dict[str, object]:
                          row = self._db.query_one(
                              "SELECT * FROM semilla_challenge_state WHERE student_account = ?",
                              (student_account,),
                          )
                          if row is None:
                              self.set_challenge_state(
                                  student_account=student_account,
                                  domain="matematicas",
                                  difficulty=1,
                              )
                              return {
                                  "student_account": student_account,
                                  "domain": "matematicas",
                                  "difficulty": 1,
                              }
                          return {
                              "student_account": str(row["student_account"]),
                              "domain": str(row["domain"]),
                              "difficulty": int(row["difficulty"]),
                          }

                      def set_challenge_state(
                          self, *, student_account: str, domain: str, difficulty: int,
                      ) -> None:
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT OR REPLACE INTO semilla_challenge_state"
                                  " (student_account, domain, difficulty, updated_at)"
                                  " VALUES (?, ?, ?, ?)",
                                  (student_account, domain, int(difficulty), now),
                              )

                      def record_attempt(
                          self,
                          *,
                          attempt_id: str,
                          student_account: str,
                          domain: str,
                          difficulty: int,
                          correct: bool,
                      ) -> dict[str, object]:
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO semilla_attempts"
                                  " (attempt_id, student_account, domain, difficulty,"
                                  " correct, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?)",
                                  (
                                      attempt_id,
                                      student_account,
                                      domain,
                                      int(difficulty),
                                      int(correct),
                                      now,
                                  ),
                              )
                          return {
                              "attempt_id": attempt_id,
                              "correct": correct,
                              "difficulty": int(difficulty),
                          }

                      def attempts_of(self, *, student_account: str) -> tuple[dict[str, object], ...]:
                          rows = self._db.query_all(
                              "SELECT * FROM semilla_attempts"
                              " WHERE student_account = ? ORDER BY created_at",
                              (student_account,),
                          )
                          return tuple(
                              {
                                  "attempt_id": str(r["attempt_id"]),
                                  "domain": str(r["domain"]),
                                  "difficulty": int(r["difficulty"]),
                                  "correct": bool(int(r["correct"])),
                              }
                              for r in rows
                          )

                      def detect_talents(
                          self, *, student_account: str,
                      ) -> tuple[dict[str, object], ...]:
                          grades = self.grades_of(student_account=student_account)
                          by_subject: dict = {}
                          for g in grades:
                              by_subject.setdefault(str(g["subject"]), []).append(float(g["score"]))
                          new: list = []
                          for subject, scores in by_subject.items():
                              if len(scores) < 3:
                                  continue
                              average = sum(scores) / len(scores)
                              if average < 9.0:
                                  continue
                              exists = self._db.query_one(
                                  "SELECT 1 FROM semilla_talents"
                                  " WHERE student_account = ? AND domain = ?",
                                  (student_account, subject),
                              )
                              if exists is not None:
                                  continue
                              talent_id = "TAL-" + uuid.uuid4().hex[:10]
                              evidence = f"promedio {average:.1f} en {len(scores)} notas"
                              now = self._clock.now()
                              with self._db.transaction() as cursor:
                                  cursor.execute(
                                      "INSERT INTO semilla_talents"
                                      " (talent_id, student_account, domain, evidence, created_at)"
                                      " VALUES (?, ?, ?, ?, ?)",
                                      (talent_id, student_account, subject, evidence, now),
                                  )
                              new.append(
                                  {
                                      "talent_id": talent_id,
                                      "domain": subject,
                                      "evidence": evidence,
                                  }
                              )
                          return tuple(new)

                      def list_talents(self, *, student_account: str) -> tuple[dict[str, object], ...]:
                          rows = self._db.query_all(
                              "SELECT * FROM semilla_talents"
                              " WHERE student_account = ? ORDER BY created_at",
                              (student_account,),
                          )
                          return tuple(
                              {
                                  "talent_id": str(r["talent_id"]),
                                  "domain": str(r["domain"]),
                                  "evidence": str(r["evidence"]),
                              }
                              for r in rows
                          )

                      def add_reward(
                          self,
                          *,
                          reward_id: str,
                          student_account: str,
                          kind: str,
                          detail: str | None,
                          points: int,
                      ) -> dict[str, object]:
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO semilla_rewards"
                                  " (reward_id, student_account, kind, detail, points, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?)",
                                  (reward_id, student_account, kind, detail, int(points), now),
                              )
                          return {"reward_id": reward_id, "kind": kind, "points": int(points)}

                      def rewards_of(self, *, student_account: str) -> tuple[dict[str, object], ...]:
                          rows = self._db.query_all(
                              "SELECT * FROM semilla_rewards"
                              " WHERE student_account = ? ORDER BY created_at",
                              (student_account,),
                          )
                          return tuple(
                              {
                                  "reward_id": str(r["reward_id"]),
                                  "kind": str(r["kind"]),
                                  "detail": (
                                      str(r["detail"]) if r["detail"] is not None else None
                                  ),
                                  "points": int(r["points"]),
                              }
                              for r in rows
                          )

                      def total_points(self, *, student_account: str) -> int:
                          row = self._db.query_one(
                              "SELECT SUM(points) AS total FROM semilla_rewards"
                              " WHERE student_account = ?",
                              (student_account,),
                          )
                          if row is None:
                              return 0
                          raw = row["total"]
                          return int(raw) if raw is not None else 0

                      def add_message(
                          self,
                          *,
                          message_id: str,
                          recipient: str,
                          text: str,
                          student_account: str | None = None,
                      ) -> dict[str, object]:
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO semilla_messages"
                                  " (message_id, recipient, student_account, text, created_at)"
                                  " VALUES (?, ?, ?, ?, ?)",
                                  (message_id, recipient, student_account, text, now),
                              )
                          return {"message_id": message_id, "recipient": recipient, "text": text}

                      def messages_of(self, *, recipient: str) -> tuple[dict[str, object], ...]:
                          rows = self._db.query_all(
                              "SELECT * FROM semilla_messages"
                              " WHERE recipient = ? ORDER BY created_at",
                              (recipient,),
                          )
                          return tuple(
                              {
                                  "message_id": str(r["message_id"]),
                                  "recipient": str(r["recipient"]),
                                  "text": str(r["text"]),
                              }
                              for r in rows
                          )

                      @staticmethod
                      def _account_row(row) -> dict[str, object]:
                          return {
                              "account_id": str(row["account_id"]),
                              "zid": str(row["zid"]) if row["zid"] is not None else None,
                              "name": str(row["name"]),
                              "role": str(row["role"]),
                              "school": str(row["school"]) if row["school"] is not None else None,
                              "grade": str(row["grade"]) if row["grade"] is not None else None,
                              "created_at": float(row["created_at"]),
                          }
              '''))
              out("## FIN semilla_store v3 (autowire)")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
