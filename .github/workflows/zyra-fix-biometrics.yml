                                  " animal_id = ?",
                                  (str(pid_val),))
                              if parent is None:
                                  raise LookupError(
                                      "progenitor no"
                                      " encontrado: "
                                      + str(pid_val))
                      aid = ("ANM-"
                             + uuid.uuid4().hex[:10])
                      db.execute(
                          "INSERT INTO agro_animals"
                          " (animal_id, producer_id, species,"
                          " breed, birth_date, sire_id, dam_id,"
                          " status, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?,"
                          " 'vivo', ?)",
                          (aid, str(producer_id),
                           str(species), str(breed),
                           str(birth_date), str(sire_id),
                           str(dam_id), str(created_at)))
                      return {"animal_id": aid,
                              "producer_id":
                                  str(producer_id),
                              "species": str(species),
                              "breed": str(breed),
                              "status": "vivo"}


                  def animal_of_db(db, animal_id):
