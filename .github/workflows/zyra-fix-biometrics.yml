name: "ZYRA RUN1b: S-1 puente canonico (aditivo regla 51) + R-7 docs regla 78 + auditoria server"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] server.py + semilla_store.py + R-7 (prepara RUN 1c)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## AUDITORIA RUN 1c — server.py + semilla_store.py + R-7" >> "$SUM"
          echo "### server.py: estructura (clases/metodos/framework)" >> "$SUM"
          { echo '```'; grep -n "^class \|^    def \|^def \|do_GET\|do_POST\|HTTPServer\|BaseHTTPRequestHandler\|FastAPI\|Flask\|route" apps/semilla/server.py 2>/dev/null | head -140; echo '```'; } >> "$SUM"
          echo "### server.py: llamadas al store (metodos reales usados)" >> "$SUM"
          { echo '```'; grep -n "store\.\|SemillaStore" apps/semilla/server.py 2>/dev/null | head -60; echo '```'; } >> "$SUM"
          echo "### server.py: import/inicializacion (lineas 1-70)" >> "$SUM"
          { echo '```'; sed -n '1,70p' apps/semilla/server.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### semilla_store.py COMPLETO (interfaz vieja)" >> "$SUM"
          { echo '```'; cat apps/semilla/infrastructure/persistence/semilla_store.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "### R-7: localizar life_history y subastas_link" >> "$SUM"
          { echo '```'; find . -path ./.git -prune -o \( -name "subastas_link.py" -o -path "*life_history*" \) -name "*.py" -print 2>/dev/null | head -20; echo '```'; } >> "$SUM"
          echo "### R-7: lineas contradictorias (enroll + solo/only + person)" >> "$SUM"
          { echo '```'; grep -rn -i -E "(solo|only|unicamente).*(identity/enroll)|(identity/enroll).*(solo|only)" shared_engines apps --include="*.py" 2>/dev/null | head -20; echo '```'; } >> "$SUM"
          echo "### fin auditoria" >> "$SUM"
          exit 0

      - name: "[ESCRITURA] S-1: canonical_bridge (dual-write + pending + read-through + fallback)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/infrastructure/persistence/canonical_bridge.py",
                     D(r'''
                  """Canonical Bridge (S-1) - puente ADITIVO entre el
                  registro viejo (SemillaStore / semilla_accounts) y
                  el canonico (StudentRegistryEngine / sm_students).

                  REGLA 51 (aditivo): NO cambia el comportamiento
                  viejo. El server sigue llamando a sus metodos de
                  siempre; el puente:
                  1) DUAL-WRITE: tras un alta vieja exitosa, intenta
                     registrar al alumno en el canonico (best-effort;
                     si los datos no alcanzan el minimo SE-3, queda
                     en sm_legacy_pending - NADA falso, regla 66).
                  2) READ-THROUGH: get_account responde viejo-primero
                     (forma compatible garantizada); si el viejo no
                     lo tiene, responde el canonico via mapa.
                  3) JAMAS lanza: cualquier fallo del lado canonico
                     degrada a operacion vieja pura.

                  Tablas: sm_legacy_map (account_id -> student_id)
                  y sm_legacy_pending (altas que faltan completar
                  con datos SE-3).

                  La CONEXION al server vivo (una sola linea:
                  bridge.wire(store) en el punto de instanciacion)
                  se hace en RUN 1c con la auditoria LECTURA de
                  server.py como mapa."""
                  from __future__ import annotations
                  import json as _j
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_legacy_map", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_legacy_map (account_id TEXT"
                          " PRIMARY KEY, student_id TEXT NOT NULL,"
                          " created_at REAL NOT NULL)",
                      )),
                      Migration(2, "sm_legacy_pending", (
                          "CREATE TABLE IF NOT EXISTS"
                          " sm_legacy_pending (account_id TEXT"
                          " PRIMARY KEY, reason TEXT NOT NULL,"
                          " payload_json TEXT NOT NULL DEFAULT"
                          " '{}', created_at REAL NOT NULL)",
                      )),
                  )

                  class CanonicalBridge:
                      """Puente viejo->canonico (regla 51 aditivo)."""

                      def __init__(self, db, clock, registry):
                          self._db = db
                          self._clock = clock
                          self._reg = registry
                          MigrationRunner(db, "sm.legacybridge",
                                          _MIGRATIONS).run(clock)

                      def wire(self, store) -> object:
                          """Envuelve los metodos de cuentas que
                          existan en el store. Idempotente."""
                          for name in ("add_account",
                                       "create_account",
                                       "register_account"):
                              m = getattr(store, name, None)
                              if m is not None and not getattr(
                                      m, "_zyra_canonical", False):
                                  setattr(store, name,
                                          self._wrap_add(m))
                          m = getattr(store, "get_account", None)
                          if m is not None and not getattr(
                                  m, "_zyra_canonical", False):
                              setattr(store, "get_account",
                                      self._wrap_get(m))
                          return store

                      # ---------- alta (dual-write) ----------

                      def _wrap_add(self, original):
                          bridge = self
                          def patched(*args, **kwargs):
                              res = original(*args, **kwargs)
                              try:
                                  bridge._mirror(args, kwargs, res)
                              except Exception:
                                  pass
                              return res
                          patched._zyra_canonical = True
                          return patched

                      def _mirror(self, args, kwargs, res):
                          data = dict(kwargs or {})
                          if not data and isinstance(res, dict):
                              data = dict(res)
                          if not data:
                              return
                          acc = (data.get("account_id")
                                 or (res or {}).get("account_id")
                                 or data.get("id") or "")
                          name = (data.get("name")
                                  or data.get("full_name")
                                  or (res or {}).get("name") or "")
                          zid = (data.get("zid")
                                 or (res or {}).get("zid") or "")
                          role = (data.get("role")
                                  or (res or {}).get("role")
                                  or "alumno")
                          school = (data.get("school")
                                    or data.get("institution_id")
                                    or "")
                          grade = (data.get("grade") or "1")
                          if str(role) != "alumno":
                              return
                          tutores = list(data.get("tutores") or [])
                          pick = list(
                              data.get("authorized_pickup") or [])
                          emg = list(
                              data.get("emergency_contacts") or [])
                          if (len(tutores) < 1 or len(pick) < 2
                                  or len(emg) < 1):
                              self._pending(
                                  str(acc), "SE-3 incompleto",
                                  {"name": str(name),
                                   "zid": str(zid)})
                              return
                          est = self._reg.register(
                              full_name=str(name), level="BASICA",
                              grade=str(grade),
                              institution_id=str(school),
                              tutores=tutores,
                              authorized_pickup=pick,
                              emergency_contacts=emg,
                              zid=str(zid),
                              zid_status=("PROVISIONAL" if zid
                                          else "NONE"))
                          if acc:
                              self._db.execute(
                                  "INSERT OR REPLACE INTO"
                                  " sm_legacy_map (account_id,"
                                  " student_id, created_at)"
                                  " VALUES (?, ?, ?)",
                                  (str(acc),
                                   str(est["student_id"]),
                                   self._clock.now()))

                      def _pending(self, account_id, reason,
                                   payload):
                          self._db.execute(
                              "INSERT OR REPLACE INTO"
                              " sm_legacy_pending (account_id,"
                              " reason, payload_json, created_at)"
                              " VALUES (?, ?, ?, ?)",
                              (str(account_id or "SIN_ID"),
                               str(reason),
                               _j.dumps(payload, default=str),
                               self._clock.now()))

                      def pending_list(self):
                          rows = self._db.query_all(
                              "SELECT * FROM sm_legacy_pending"
                              " ORDER BY rowid")
                          return [dict(r) for r in rows]

                      # ---------- lectura ----------

                      def _wrap_get(self, original):
                          bridge = self
                          def patched(*args, **kwargs):
                              res = original(*args, **kwargs)
                              if res is not None:
                                  return res
                              try:
                                  acc = None
                                  if kwargs.get("account_id"):
                                      acc = str(
                                          kwargs["account_id"])
                                  elif args:
                                      acc = str(args[0])
                                  if acc:
                                      row = self._db.query_one(
                                          "SELECT student_id FROM"
                                          " sm_legacy_map WHERE"
                                          " account_id = ?",
                                          (acc,))
                                      if row:
                                          est = bridge._reg.get(
                                              str(row[
                                                  "student_id"]))
                                          if est:
                                              return \
                                                  bridge._canon_shape(
                                                      est, acc)
                              except Exception:
                                  pass
                              return res
                          patched._zyra_canonical = True
                          return patched

                      def _canon_shape(self, est,
                                       account_id) -> dict:
                          return {"account_id": str(account_id),
                                  "student_id":
                                      str(est.get("student_id",
                                                  "")),
                                  "name":
                                      str(est.get("full_name",
                                                  "")
                                          or est.get("name",
                                                     "")),
                                  "zid": str(est.get("zid", "")),
                                  "role": "alumno",
                                  "school":
                                      str(est.get(
                                          "institution_id", "")),
                                  "grade":
                                      str(est.get("grade", "")),
                                  "canonico": True}
              '''))
              out("## FIN builder S-1 bridge")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] R-7: unificar docs a regla 78 (quirurgico condicional)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, re, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          try:
              targets = []
              for pat in ("**/life_history/service.py",
                          "**/subastas_link.py"):
                  targets += [p for p in pathlib.Path(".").glob(pat)
                              if ".git" not in p.parts]
              seen = set()
              uniq = []
              for p in targets:
                  sp = str(p)
                  if sp not in seen:
                      seen.add(sp)
                      uniq.append(p)
              REPL = [
                  (re.compile(r"PERSON\s+solo\s+por"
                              r"\s+/identity/enroll", re.I),
                   "PERSON por /identity/enroll (biometrico) o"
                   " birth-zid para menores [regla 78: nacimiento"
                   " -> ZID -> biometria posterior, mismo ZID]"),
                  (re.compile(r"solo\s+(?:por|via|through)"
                              r"\s+/identity/enroll", re.I),
                   "por /identity/enroll (biometrico) o birth-zid"
                   " para menores [regla 78]"),
                  (re.compile(r"only\s+(?:via|through)"
                              r"\s+/identity/enroll", re.I),
                   "via /identity/enroll (biometrico) or"
                   " birth-zid for minors [rule 78]"),
                  (re.compile(r"unicamente\s+(?:por|via)"
                              r"\s+/identity/enroll", re.I),
                   "por /identity/enroll (biometrico) o birth-zid"
                   " para menores [regla 78]"),
              ]
              if not uniq:
                  out("- R-7: archivos no localizados por nombre"
                      " — ver grep de auditoria; fix en 1c")
              for p in uniq:
                  try:
                      t = p.read_text(encoding="utf-8")
                      new = t
                      n = 0
                      for rx, rep in REPL:
                          new, k = rx.subn(rep, new)
                          n += k
                      if n == 0:
                          low = new.lower()
                          if ("enroll" in low and "person" in low
                                  and ("solo" in low
                                       or "only" in low)):
                              out("- R-7: " + str(p)
                                  + " tiene texto enroll/person"
                                    "/solo NO cubierto — REVISAR"
                                    " 1c con el grep")
                          else:
                              out("- R-7: " + str(p)
                                  + " sin contradiccion textual")
                          continue
                      ast.parse(new)
                      p.write_text(new, encoding="utf-8")
                      py_compile.compile(str(p), doraise=True)
                      out("- **R-7: " + p.name + " unificado ("
                          + str(n) + " reemplazos) — regla 78"
                            ": OK**")
                  except Exception:
                      out("- R-7: " + str(p)
                          + " ERROR (archivo intacto)")
                      out("```\n"
                          + traceback.format_exc().strip()
                          + "\n```")
              out("## FIN R-7")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests del puente canonico"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_s1_bridge.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.student.student_registry_engine import StudentRegistryEngine
          from apps.semilla.infrastructure.persistence.canonical_bridge import CanonicalBridge

          TUT = [{"name": "Mama", "relation": "MADRE",
                  "zid": "ZID-M-1"}]
          PICK2 = [{"name": "Mama", "relation": "MADRE"},
                   {"name": "Papa", "relation": "PADRE"}]
          EMG = [{"name": "Tio", "relation": "TIO",
                  "phone": "911"}]

          class FakeOldStore:
              def __init__(self):
                  self.accounts = {}
              def add_account(self, *, account_id, zid="",
                              name="", role="alumno",
                              school="", grade="1", **extra):
                  acc = {"account_id": account_id, "zid": zid,
                         "name": name, "role": role,
                         "school": school, "grade": grade,
                         "status": "ACTIVO"}
                  self.accounts[account_id] = acc
                  return dict(acc)
              def get_account(self, account_id):
                  acc = self.accounts.get(account_id)
                  return dict(acc) if acc else None

          def _setup(tmp_path):
              db = SQLiteAdapter(tmp_path / "s.db")
              clock = FrozenClock()
              reg = StudentRegistryEngine(db, clock)
              store = FakeOldStore()
              bridge = CanonicalBridge(db, clock, reg)
              bridge.wire(store)
              return db, reg, store, bridge

          def test_dual_write_se3_completo(tmp_path) -> None:
              db, reg, store, bridge = _setup(tmp_path)
              r = store.add_account(account_id="LEG-1",
                  zid="ZID-L1", name="Nino Uno",
                  school="INST-1", grade="3",
                  tutores=TUT, authorized_pickup=PICK2,
                  emergency_contacts=EMG)
              assert r["status"] == "ACTIVO"
              row = db.query_one(
                  "SELECT student_id FROM sm_legacy_map"
                  " WHERE account_id = ?", ("LEG-1",))
              assert row is not None
              est = reg.get(str(row["student_id"]))
              assert est is not None
              assert est["zid"] == "ZID-L1"
              print("OK dual-write: alta vieja intacta + expediente canonico con mapa LEG-1 -> sm_students")

          def test_pending_cuando_se3_incompleto(tmp_path) -> None:
              db, reg, store, bridge = _setup(tmp_path)
              r = store.add_account(account_id="LEG-2",
                  zid="ZID-L2", name="Nino Dos")
              assert r["status"] == "ACTIVO"
              pend = bridge.pending_list()
              assert len(pend) == 1
              assert "SE-3" in str(pend[0]["reason"])
              print("OK pending: sin datos SE-3 no se fabrica nada falso (regla 66) — cola legible para completar")

          def test_read_fill_canonico(tmp_path) -> None:
              db, reg, store, bridge = _setup(tmp_path)
              store.add_account(account_id="LEG-9",
                  zid="ZID-L9", name="Nino Map",
                  school="INST-1", grade="2",
                  tutores=TUT, authorized_pickup=PICK2,
                  emergency_contacts=EMG)
              got_viejo = store.get_account("LEG-9")
              assert got_viejo.get("canonico") is None
              del store.accounts["LEG-9"]
              got = store.get_account("LEG-9")
              assert got is not None
              assert got.get("canonico") is True
              assert got["account_id"] == "LEG-9"
              assert got["zid"] == "ZID-L9"
              print("OK read-through: viejo-primero con forma compatible; si el viejo no lo tiene, responde el canonico")

          def test_viejo_jamas_se_rompe(tmp_path) -> None:
              db, reg, store, bridge = _setup(tmp_path)
              class BoomReg:
                  def register(self, **k):
                      raise RuntimeError("boom canonico")
              store2 = FakeOldStore()
              b2 = CanonicalBridge(db, FrozenClock(), BoomReg())
              b2.wire(store2)
              r = store2.add_account(account_id="LEG-B",
                  zid="Z", name="X", school="INST-1", grade="1",
                  tutores=TUT, authorized_pickup=PICK2,
                  emergency_contacts=EMG)
              assert r["status"] == "ACTIVO"
              print("OK fallback: fallo del lado canonico -> operacion vieja pura, sin excepcion al server")
          TSEOF
          timeout 180 python3 -m pytest apps/semilla/tests/test_s1_bridge.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/s1b.out 2>&1
          echo $? > /tmp/s1b
          if [ "$(cat /tmp/s1b)" = "0" ]; then echo "- S-1 bridge: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- S-1 bridge: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### S-1 bridge detalle"; echo '```'; tail -80 /tmp/s1b.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si SEMILLA verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/s1b 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: SEMILLA roja — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/semilla shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(SEMILLA S-1/R-7): CanonicalBridge aditivo (regla 51) — dual-write al canonico con mapa sm_legacy_map, cola sm_legacy_pending para datos SE-3 incompletos (nada falso, regla 66), read-through compatible y fallback total (el viejo jamas se rompe) + R-7: documentacion unificada a regla 78 (birth-zid valido para menores, biometria posterior al mismo ZID) + auditoria LECTURA de server.py/semilla_store.py para conexion definitiva en RUN 1c"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — RUN 1b CERRADO. RUN 1c: conectar bridge.wire() en server.py + endpoints HTTP de matricula desde casa (con la auditoria impresa arriba).**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
