name: "ZYRA RUN4b: A-4..A-8 AGRO avanzado (parcelas geo + agronomico + cosecha/lotes + ganaderia + inventario FIFO/FEFO)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] 5 engines A-4..A-8 (carpetas existentes, DDL de tablas ajenas confirmado en auditoria)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/agro/modules/recursos_y_activos/tierras/land_geo_engine.py",
                     D(r'''
                  """Land Geo Engine (A-4) - GIS/parcelas sobre
                  las tierras EXISTENTES (agro_area_lands, DDL
                  confirmado en auditoria y recreado aqui IF NOT
                  EXISTS con esquema exacto — leccion c):
                  coordenadas/geometria, tipo de suelo, acceso a
                  riego, area efectiva, USO HISTORICO por
                  temporada y ROTACION de cultivos.
                  Resumen por productor (Capa A GOV-DATA AGRO).
                  Reglas 68 (carpeta EXISTENTE), 66 (land
                  inexistente -> LookupError), 76 (rowid)."""
                  from __future__ import annotations
                  import uuid
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "land_geo_tables", (
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_area_lands ("
                          " land_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " location TEXT NOT NULL,"
                          " size_hectares REAL NOT NULL,"
                          " land_use TEXT,"
                          " created_at REAL NOT NULL)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_land_geo ("
                          " land_id TEXT PRIMARY KEY,"
                          " coordinates TEXT NOT NULL DEFAULT"
                          " '', soil_type TEXT NOT NULL DEFAULT"
                          " '', irrigation_access INTEGER NOT"
                          " NULL DEFAULT 0, area_effective REAL,"
                          " updated_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_land_use_log ("
                          " log_id INTEGER PRIMARY KEY"
                          " AUTOINCREMENT, land_id TEXT NOT"
                          " NULL, crop TEXT NOT NULL, season"
                          " TEXT NOT NULL DEFAULT '', note TEXT"
                          " NOT NULL DEFAULT '', logged_at"
                          " TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_land_rotations ("
                          " rotation_id TEXT PRIMARY KEY,"
                          " land_id TEXT NOT NULL, crop_from"
                          " TEXT NOT NULL, crop_to TEXT NOT"
                          " NULL, season_year TEXT NOT NULL"
                          " DEFAULT '', created_at TEXT)",
                      )),
                  )


                  def _land_exists(db, land_id):
                      row = db.query_one(
                          "SELECT land_id FROM"
                          " agro_area_lands WHERE land_id = ?",
                          (str(land_id),))
                      if row is None:
                          raise LookupError(
                              "tierra no encontrada: "
                              + str(land_id))
                      return str(row["land_id"])


                  def set_geo_db(db, *, land_id,
                                 coordinates="",
                                 soil_type="",
                                 irrigation_access=False,
                                 area_effective=None,
                                 updated_at=""):
                      _land_exists(db, land_id)
                      db.execute(
                          "INSERT OR REPLACE INTO"
                          " agro_land_geo (land_id,"
                          " coordinates, soil_type,"
                          " irrigation_access, area_effective,"
                          " updated_at) VALUES (?, ?, ?, ?, ?,"
                          " ?)",
                          (str(land_id), str(coordinates),
                           str(soil_type),
                           1 if irrigation_access else 0,
                           (float(area_effective)
                            if area_effective is not None
                            else None),
                           str(updated_at)))
                      return geo_of_db(db, land_id)


                  def geo_of_db(db, land_id):
                      row = db.query_one(
                          "SELECT * FROM agro_land_geo WHERE"
                          " land_id = ?", (str(land_id),))
                      if row is None:
                          return None
                      return {
                          "land_id": str(row["land_id"]),
                          "coordinates": str(
                              row["coordinates"]),
                          "soil_type": str(row["soil_type"]),
                          "irrigation_access": bool(
                              int(row["irrigation_access"])),
                          "area_effective": (
                              float(row["area_effective"])
                              if row["area_effective"]
                              is not None else None),
                          "updated_at": str(
                              row["updated_at"])}


                  def log_use_db(db, *, land_id, crop,
                                 season="", note="",
                                 logged_at=""):
                      _land_exists(db, land_id)
                      db.execute(
                          "INSERT INTO agro_land_use_log"
                          " (land_id, crop, season, note,"
                          " logged_at) VALUES (?, ?, ?, ?, ?)",
                          (str(land_id), str(crop),
                           str(season), str(note),
                           str(logged_at)))
                      return {"land_id": str(land_id),
                              "crop": str(crop),
                              "season": str(season)}


                  def use_log_of_db(db, land_id):
                      rows = db.query_all(
                          "SELECT crop, season, note,"
                          " logged_at FROM agro_land_use_log"
                          " WHERE land_id = ? ORDER BY log_id",
                          (str(land_id),))
                      return [{"crop": str(r["crop"]),
                               "season": str(r["season"]),
                               "note": str(r["note"]),
                               "logged_at": str(
                                   r["logged_at"])}
                              for r in rows]


                  def register_rotation_db(db, *, land_id,
                                           crop_from, crop_to,
                                           season_year="",
                                           created_at=""):
                      _land_exists(db, land_id)
                      rid = ("ROT-"
                             + uuid.uuid4().hex[:10])
                      db.execute(
                          "INSERT INTO agro_land_rotations"
                          " (rotation_id, land_id, crop_from,"
                          " crop_to, season_year, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?)",
                          (rid, str(land_id), str(crop_from),
                           str(crop_to), str(season_year),
                           str(created_at)))
                      return {"rotation_id": rid,
                              "land_id": str(land_id),
                              "crop_from": str(crop_from),
                              "crop_to": str(crop_to)}


                  def rotations_of_db(db, land_id):
                      rows = db.query_all(
                          "SELECT rotation_id, crop_from,"
                          " crop_to, season_year, created_at"
                          " FROM agro_land_rotations WHERE"
                          " land_id = ? ORDER BY rowid",
                          (str(land_id),))
                      return [{"rotation_id":
                                   str(r["rotation_id"]),
                               "crop_from": str(
                                   r["crop_from"]),
                               "crop_to": str(r["crop_to"]),
                               "season_year": str(
                                   r["season_year"])}
                              for r in rows]


                  def parcel_summary_db(db, producer_id):
                      lands = db.query_all(
                          "SELECT land_id, location,"
                          " size_hectares, land_use FROM"
                          " agro_area_lands WHERE producer_id"
                          " = ? ORDER BY rowid",
                          (str(producer_id),))
                      out = []
                      for r in lands:
                          lid = str(r["land_id"])
                          geo = geo_of_db(db, lid)
                          n_uses = db.query_one(
                              "SELECT COUNT(*) AS n FROM"
                              " agro_land_use_log WHERE"
                              " land_id = ?", (lid,))
                          n_rot = db.query_one(
                              "SELECT COUNT(*) AS n FROM"
                              " agro_land_rotations WHERE"
                              " land_id = ?", (lid,))
                          out.append({
                              "land_id": lid,
                              "location": str(
                                  r["location"]),
                              "size_hectares": float(
                                  r["size_hectares"]),
                              "land_use": (
                                  str(r["land_use"])
                                  if r["land_use"]
                                  is not None else ""),
                              "geo": geo,
                              "uses": int(n_uses["n"]),
                              "rotations": int(
                                  n_rot["n"])})
                      return {"producer_id":
                                  str(producer_id),
                              "parcels": out,
                              "total": len(out)}
              '''))
              forzar("apps/agro/modules/produccion/agricultura/agronomy_engine.py",
                     D(r'''
                  """Agronomy Engine (A-5) - capas del ciclo
                  agronomico sobre los planes EXISTENTES
                  (agro_plans, DDL confirmado — leccion c):
                  INSUMOS por etapa (semilla/fertilizante/
                  agroquimico con dosis y unidad), PLAGAS y
                  enfermedades con tratamiento y cierre, e
                  INSPECCIONES con resultado. Resumen agronomico
                  del plan. Reglas 68/66/76."""
                  from __future__ import annotations
                  import uuid
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "agronomy_tables", (
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_plans ("
                          " plan_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " unit_id TEXT NOT NULL,"
                          " crop TEXT NOT NULL,"
                          " target REAL NOT NULL,"
                          " status TEXT NOT NULL,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_plan_inputs ("
                          " input_id TEXT PRIMARY KEY,"
                          " plan_id TEXT NOT NULL, kind TEXT"
                          " NOT NULL, product TEXT NOT NULL,"
                          " dose REAL NOT NULL DEFAULT 0, unit"
                          " TEXT NOT NULL DEFAULT '', applied_at"
                          " TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_plan_pests ("
                          " pest_id TEXT PRIMARY KEY, plan_id"
                          " TEXT NOT NULL, pest_type TEXT NOT"
                          " NULL, severity TEXT NOT NULL DEFAULT"
                          " 'media', treatment TEXT NOT NULL"
                          " DEFAULT '', reported_at TEXT,"
                          " resolved INTEGER NOT NULL DEFAULT"
                          " 0)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_plan_inspections ("
                          " inspection_id TEXT PRIMARY KEY,"
                          " plan_id TEXT NOT NULL, inspector"
                          " TEXT NOT NULL, result TEXT NOT"
                          " NULL, notes TEXT NOT NULL DEFAULT"
                          " '', inspected_at TEXT)",
                      )),
                  )

                  _INPUT_KINDS = ("SEMILLA", "FERTILIZANTE",
                                  "AGROQUIMICO", "OTRO")


                  def _plan(db, plan_id):
                      row = db.query_one(
                          "SELECT plan_id, producer_id, crop,"
                          " status FROM agro_plans WHERE"
                          " plan_id = ?", (str(plan_id),))
                      if row is None:
                          raise LookupError(
                              "plan no encontrado: "
                              + str(plan_id))
                      return row


                  def add_input_db(db, *, plan_id, kind,
                                   product, dose=0.0, unit="",
                                   applied_at=""):
                      _plan(db, plan_id)
                      k = str(kind).upper()
                      if k not in _INPUT_KINDS:
                          raise ValueError(
                              "kind debe ser "
                              + "/".join(_INPUT_KINDS))
                      if dose < 0:
                          raise ValueError(
                              "dose no negativa")
                      iid = ("AGIN-"
                             + uuid.uuid4().hex[:10])
                      db.execute(
                          "INSERT INTO agro_plan_inputs"
                          " (input_id, plan_id, kind, product,"
                          " dose, unit, applied_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?)",
                          (iid, str(plan_id), k,
                           str(product), float(dose),
                           str(unit), str(applied_at)))
                      return {"input_id": iid,
                              "plan_id": str(plan_id),
                              "kind": k,
                              "product": str(product),
                              "dose": float(dose),
                              "unit": str(unit)}


                  def inputs_of_db(db, plan_id):
                      rows = db.query_all(
                          "SELECT input_id, kind, product,"
                          " dose, unit, applied_at FROM"
                          " agro_plan_inputs WHERE plan_id = ?"
                          " ORDER BY rowid", (str(plan_id),))
                      return [{"input_id":
                                   str(r["input_id"]),
                               "kind": str(r["kind"]),
                               "product": str(r["product"]),
                               "dose": float(r["dose"]),
                               "unit": str(r["unit"]),
                               "applied_at": str(
                                   r["applied_at"])}
                              for r in rows]


                  def report_pest_db(db, *, plan_id, pest_type,
                                     severity="media",
                                     treatment="",
                                     reported_at=""):
                      _plan(db, plan_id)
                      pid = ("AGPL-"
                             + uuid.uuid4().hex[:10])
                      db.execute(
                          "INSERT INTO agro_plan_pests"
                          " (pest_id, plan_id, pest_type,"
                          " severity, treatment, reported_at,"
                          " resolved) VALUES (?, ?, ?, ?, ?, ?,"
                          " 0)",
                          (pid, str(plan_id),
                           str(pest_type), str(severity),
                           str(treatment), str(reported_at)))
                      return {"pest_id": pid,
                              "plan_id": str(plan_id),
                              "pest_type": str(pest_type),
                              "severity": str(severity),
                              "resolved": False}


                  def resolve_pest_db(db, pest_id):
                      row = db.query_one(
                          "SELECT pest_id, resolved FROM"
                          " agro_plan_pests WHERE pest_id = ?",
                          (str(pest_id),))
                      if row is None:
                          raise KeyError(pest_id)
                      if int(row["resolved"]) == 1:
                          raise ValueError(
                              "plaga ya resuelta")
                      db.execute(
                          "UPDATE agro_plan_pests SET"
                          " resolved = 1 WHERE pest_id = ?",
                          (str(pest_id),))
                      return {"pest_id": str(pest_id),
                              "resolved": True}


                  def pests_of_db(db, plan_id):
                      rows = db.query_all(
                          "SELECT pest_id, pest_type, severity,"
                          " treatment, reported_at, resolved"
                          " FROM agro_plan_pests WHERE plan_id"
                          " = ? ORDER BY rowid",
                          (str(plan_id),))
                      return [{"pest_id": str(r["pest_id"]),
                               "pest_type": str(
                                   r["pest_type"]),
                               "severity": str(r["severity"]),
                               "treatment": str(
                                   r["treatment"]),
                               "reported_at": str(
                                   r["reported_at"]),
                               "resolved": bool(
                                   int(r["resolved"]))}
                              for r in rows]


                  def add_inspection_db(db, *, plan_id,
                                        inspector, result,
                                        notes="",
                                        inspected_at=""):
                      _plan(db, plan_id)
                      if not str(result).strip():
                          raise ValueError(
                              "result requerido")
                      iid = ("AGSP-"
                             + uuid.uuid4().hex[:10])
                      db.execute(
                          "INSERT INTO agro_plan_inspections"
                          " (inspection_id, plan_id, inspector,"
                          " result, notes, inspected_at)"
                          " VALUES (?, ?, ?, ?, ?, ?)",
                          (iid, str(plan_id), str(inspector),
                           str(result), str(notes),
                           str(inspected_at)))
                      return {"inspection_id": iid,
                              "plan_id": str(plan_id),
                              "inspector": str(inspector),
                              "result": str(result)}


                  def inspections_of_db(db, plan_id):
                      rows = db.query_all(
                          "SELECT inspection_id, inspector,"
                          " result, notes, inspected_at FROM"
                          " agro_plan_inspections WHERE"
                          " plan_id = ? ORDER BY rowid",
                          (str(plan_id),))
                      return [{"inspection_id":
                                   str(r["inspection_id"]),
                               "inspector": str(
                                   r["inspector"]),
                               "result": str(r["result"]),
                               "notes": str(r["notes"]),
                               "inspected_at": str(
                                   r["inspected_at"])}
                              for r in rows]


                  def agronomic_summary_db(db, plan_id):
                      row = _plan(db, plan_id)
                      n_in = db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " agro_plan_inputs WHERE plan_id ="
                          " ?", (str(plan_id),))
                      kinds = db.query_all(
                          "SELECT kind, COUNT(*) AS n FROM"
                          " agro_plan_inputs WHERE plan_id = ?"
                          " GROUP BY kind", (str(plan_id),))
                      n_pests = db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " agro_plan_pests WHERE plan_id = ?"
                          " AND resolved = 0",
                          (str(plan_id),))
                      n_insp = db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " agro_plan_inspections WHERE"
                          " plan_id = ?", (str(plan_id),))
                      return {"plan_id": str(plan_id),
                              "crop": str(row["crop"]),
                              "status": str(row["status"]),
                              "inputs": int(n_in["n"]),
                              "inputs_by_kind": {
                                  str(r["kind"]):
                                  int(r["n"])
                                  for r in kinds},
                              "pests_open": int(
                                  n_pests["n"]),
                              "inspections": int(
                                  n_insp["n"])}
              '''))
              forzar("apps/agro/modules/produccion/planificacion/harvest_engine.py",
                     D(r'''
                  """Harvest Engine (A-6) - cosecha con LOTES
                  trazables sobre los planes EXISTENTES
                  (agro_plans, DDL confirmado — leccion c):
                  registro de cosecha (cantidad, calidad,
                  mermas; rechaza plan CANCELADO — regla 66),
                  lotes con peso/grado/rechazos/almacen y
                  TRAZABILIDAD completa plan->cosecha->lote,
                  carga por almacen. Reglas 68/66/76."""
                  from __future__ import annotations
                  import uuid
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "harvest_tables", (
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_plans ("
                          " plan_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " unit_id TEXT NOT NULL,"
                          " crop TEXT NOT NULL,"
                          " target REAL NOT NULL,"
                          " status TEXT NOT NULL,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_harvests ("
                          " harvest_id TEXT PRIMARY KEY,"
                          " plan_id TEXT NOT NULL, producer_id"
                          " TEXT NOT NULL, product TEXT NOT"
                          " NULL, quantity REAL NOT NULL, unit"
                          " TEXT NOT NULL DEFAULT '', quality"
                          "_grade TEXT NOT NULL DEFAULT '',"
                          " losses REAL NOT NULL DEFAULT 0,"
                          " note TEXT NOT NULL DEFAULT '',"
                          " plan_status TEXT NOT NULL DEFAULT"
                          " '', harvest_date TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_harvest_lots ("
                          " lot_id TEXT PRIMARY KEY,"
                          " harvest_id TEXT NOT NULL, weight"
                          " REAL NOT NULL, grade TEXT NOT NULL"
                          " DEFAULT '', rejected REAL NOT NULL"
                          " DEFAULT 0, storage TEXT NOT NULL"
                          " DEFAULT '', created_at TEXT)",
                      )),
                  )


                  def register_harvest_db(db, *, plan_id,
                                          quantity, unit="",
                                          quality_grade="",
                                          losses=0.0,
                                          note="",
                                          harvest_date=""):
                      row = db.query_one(
                          "SELECT plan_id, producer_id, crop,"
                          " status FROM agro_plans WHERE"
                          " plan_id = ?", (str(plan_id),))
                      if row is None:
                          raise LookupError(
                              "plan no encontrado: "
                              + str(plan_id))
                      status = str(row["status"])
                      if status == "cancelled":
                          raise ValueError(
                              "no se cosecha un plan"
                              " CANCELADO (regla 66)")
                      if float(quantity) <= 0:
                          raise ValueError(
                              "quantity positiva")
                      if float(losses) < 0:
                          raise ValueError(
                              "losses no negativas")
                      hid = ("HRV-"
                             + uuid.uuid4().hex[:10])
                      db.execute(
                          "INSERT INTO agro_harvests"
                          " (harvest_id, plan_id, producer_id,"
                          " product, quantity, unit, quality"
                          "_grade, losses, note, plan_status,"
                          " harvest_date) VALUES (?, ?, ?, ?,"
                          " ?, ?, ?, ?, ?, ?, ?)",
                          (hid, str(plan_id),
                           str(row["producer_id"]),
                           str(row["crop"]),
                           float(quantity), str(unit),
                           str(quality_grade),
                           float(losses), str(note),
                           status, str(harvest_date)))
                      return {"harvest_id": hid,
                              "plan_id": str(plan_id),
                              "producer_id": str(
                                  row["producer_id"]),
                              "product": str(row["crop"]),
                              "quantity": float(quantity),
                              "unit": str(unit),
                              "quality_grade":
                                  str(quality_grade),
                              "losses": float(losses)}


                  def add_lot_db(db, *, harvest_id, weight,
                                 grade="", rejected=0.0,
                                 storage="", created_at=""):
                      row = db.query_one(
                          "SELECT harvest_id FROM"
                          " agro_harvests WHERE harvest_id ="
                          " ?", (str(harvest_id),))
                      if row is None:
                          raise LookupError(
                              "cosecha no encontrada: "
                              + str(harvest_id))
                      if float(weight) <= 0:
                          raise ValueError(
                              "weight positiva")
                      if float(rejected) < 0:
                          raise ValueError(
                              "rejected no negativo")
                      lid = ("LOT-"
                             + uuid.uuid4().hex[:10])
                      db.execute(
                          "INSERT INTO agro_harvest_lots"
                          " (lot_id, harvest_id, weight,"
                          " grade, rejected, storage,"
                          " created_at) VALUES (?, ?, ?, ?, ?,"
                          " ?, ?)",
                          (lid, str(harvest_id),
                           float(weight), str(grade),
                           float(rejected), str(storage),
                           str(created_at)))
                      return {"lot_id": lid,
                              "harvest_id": str(harvest_id),
                              "weight": float(weight),
                              "grade": str(grade),
                              "rejected": float(rejected),
                              "storage": str(storage)}


                  def lots_of_db(db, harvest_id):
                      rows = db.query_all(
                          "SELECT lot_id, weight, grade,"
                          " rejected, storage, created_at FROM"
                          " agro_harvest_lots WHERE harvest_id"
                          " = ? ORDER BY rowid",
                          (str(harvest_id),))
                      return [{"lot_id": str(r["lot_id"]),
                               "weight": float(r["weight"]),
                               "grade": str(r["grade"]),
                               "rejected": float(
                                   r["rejected"]),
                               "storage": str(r["storage"]),
                               "created_at": str(
                                   r["created_at"])}
                              for r in rows]


                  def harvests_of_db(db, producer_id):
