name: "FIX: )from -> )\\nfrom en engine.py"
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
concurrency:
  group: red-work
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest

      - name: Fix - corregir )from a )\nfrom
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('shared_engines/integrations/engine.py')
          t = p.read_text()
          if ')from' in t:
              t = t.replace(')from', ')\nfrom')
              import ast
              ast.parse(t)
              p.write_text(t)
              print('OK: )from corregido')
          else:
              print('SKIP: ya corregido')
          "

      - name: Verificar que engine.py compila
        run: |
          python3 -c "import shared_engines.integrations.engine; print('OK compila')"

      - name: GATE Red (por motor)
        run: |
          set +e
          FAIL=0
          for motor in runtime network events integrations; do
            if [ "$motor" = "runtime" ]; then
              dir="shared_engines/runtime/tests"
            else
              dir="shared_engines/$motor/tests"
            fi
            [ -d "$dir" ] || continue
            timeout 120 python3 -m pytest "$dir" -q --tb=short > "/tmp/g_$motor.txt" 2>&1
            CODE=$?
            [ $CODE -eq 124 ] && { echo "HANG: $motor"; FAIL=1; continue; }
            [ $CODE -ne 0 ] && { echo "FALLO: $motor"; tail -8 "/tmp/g_$motor.txt"; FAIL=1; continue; }
            echo "VERDE: $motor"
          done
          [ $FAIL -ne 0 ] && exit 1
          echo "GATE VERDE"

      - name: GATE apps
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: Commit
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix: )from -> )\\nfrom en engine.py"
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            git push origin main && exit 0
            sleep 3
          done
          exit 1
