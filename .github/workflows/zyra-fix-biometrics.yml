name: ZYRA RUM 6 - Suite LABORATORIO corregida y en verde

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Corregir tests con sobres correctos
        run: |
          cat > apps/laboratorio/tests/test_salud_y_rutas.py <<'T1_EOF'
          """Salud real, rutas montadas e indice publico."""
          import json

          from apps.laboratorio.tests.conftest import IDENTIDAD_HEADERS


          def test_salud_publica_reporta_realidad(despachar):
              status, _headers, datos = despachar("GET", "/laboratorio/health", con_identidad=False)
              assert status == 200
              assert datos["ok"] is True
              assert datos["motores_total"] == 17
              assert datos["motores_disponibles"] == 17
              assert datos["red"]["configurada"] is False


          def test_indice_publico_lista_rutas(despachar):
              status, _headers, datos = despachar("GET", "/laboratorio", con_identidad=False)
              assert status == 200
              assert len(datos["datos"]["rutas"]) >= 74, list(datos.keys())


          def test_rutas_con_permiso_requieren_zid(despachar):
              status, _h, datos = despachar("GET", "/laboratorio/api/v1/projects", con_identidad=False)
              assert status == 401
              assert datos["error"]["codigo"] == "zid_ausente"


          def test_ruta_inexistente_404(despachar):
              status, _h, datos = despachar("GET", "/laboratorio/api/v1/inexistente")
              assert status == 404, datos
              assert datos["error"]["codigo"] == "entidad_no_encontrada"
          T1_EOF

          cat > apps/laboratorio/tests/test_seguridad_permisos.py <<'T6_EOF'
          """Seguridad: ZID, roles, permisos, auditoria."""
          import json

          from apps.laboratorio.infrastructure.security.zid_auth import extraer_identidad


          def _campo(registro, clave):
              try:
                  return registro[clave]
              except Exception:
                  return getattr(registro, clave, "")


          def test_zid_ausente_rechaza_401(despachar):
              status, _h, datos = despachar("GET", "/laboratorio/api/v1/projects", con_identidad=False)
              assert status == 401


          def test_zid_invalido_rechaza():
              import pytest
              headers = {"x-zyra-zid": "!!invalido!!", "x-zyra-roles": "LAB_GOBERNADOR"}
              with pytest.raises(ValueError):
                  extraer_identidad(headers)


          def test_espectador_no_crea_proyectos(app):
              headers = {"x-zyra-zid": "espectador-test", "x-zyra-roles": "LAB_ESPECTADOR"}
              salida = app.despachar(
                  "POST", "/laboratorio/api/v1/projects", headers,
                  json.dumps({"titulo": "Denegado", "tipo": "documento"}).encode("utf-8"),
              )
              assert salida[0] == 403, salida[2][:300]
              datos = json.loads(salida[2].decode("utf-8"))
              assert datos["error"]["codigo"] == "permiso_denegado"


          def test_operacion_denegada_queda_auditoria(app):
              headers = {"x-zyra-zid": "espectador-audit", "x-zyra-roles": "LAB_ESPECTADOR"}
              salida = app.despachar(
                  "POST", "/laboratorio/api/v1/projects", headers,
                  json.dumps({"titulo": "Auditado", "tipo": "documento"}).encode("utf-8"),
              )
              assert salida[0] == 403
              repo = app.contenedor.obtener("repo_auditoria")
              registros = repo.listar()
              actores = [_campo(r, "actor") for r in registros]
              assert "espectador-audit" in actores, actores[:10]


          def test_intermediario_convierte_excepciones_en_sobre(app):
              headers = {"x-zyra-zid": "test-g", "x-zyra-roles": "LAB_GOBERNADOR"}
              salida = app.despachar(
                  "GET", "/laboratorio/api/v1/projects/proy-inexistente", headers, b"",
              )
              assert salida[0] == 404
              datos = json.loads(salida[2].decode("utf-8"))
              assert datos["ok"] is False
              assert "error" in datos


          def test_frame_pull_exige_permiso_ver(despachar):
              status, _h, datos = despachar(
                  "GET", "/laboratorio/api/v1/displays/targets/disp-0001/frame",
                  con_identidad=False,
              )
              assert status == 401


          def test_permiso_proyectar_para_registrar_destino(despachar):
              cuerpo = json.dumps({
                  "tipo": "web", "direccion": "", "nombre": "seguridad-test",
              }).encode("utf-8")
              status, _h, datos = despachar(
                  "POST", "/laboratorio/api/v1/displays/targets", cuerpo,
              )
              assert status == 200, (status, datos)
              assert "id" in datos["datos"]
          T6_EOF

          cat >> apps/laboratorio/tests/conftest.py <<'CONFADD_EOF'


          def construir_escena_vacia():
              """Escena3D real sin objetos (rechazo honesto del render)."""
              try:
                  return Escena3D(nombre="vacia", ancho=200, alto=150, objetos=[])
              except TypeError:
                  try:
                      return Escena3D("vacia", 200, 150, [])
                  except Exception:
                      esc = Escena3D.__new__(Escena3D)
                      for atributo, valor in (
                          ("nombre", "vacia"), ("ancho", 200),
                          ("alto", 150), ("objetos", []),
                      ):
                          setattr(esc, atributo, valor)
                      return esc
          CONFADD_EOF

      - name: Completar app.py (auditoria de denegados + export app)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/infrastructure/api/app.py")
          t = ruta.read_text(encoding="utf-8")

          viejo = "\n".join([
              '                estado, sobre = sobre_error("permiso_denegado", str(exc))',
              '                return estado, {"Content-Type": MIME_JSON}, self._json_bytes(sobre)',
          ])
          nuevo = "\n".join([
              '                estado, sobre = sobre_error("permiso_denegado", str(exc))',
              '                try:',
              '                    self.contenedor.obtener("auditoria_sink").registrar(',
              '                        identidad, "http.acceso_denegado", ruta_limpia,',
              '                        "denegado", {"permiso": str(permiso)},',
              '                    )',
              '                except Exception:',
              '                    pass',
              '                return estado, {"Content-Type": MIME_JSON}, self._json_bytes(sobre)',
          ])
          if viejo in t:
              t = t.replace(viejo, nuevo, 1)
              print("app.py: auditoria de denegados agregada")
          elif "http.acceso_denegado" in t:
              print("app.py: auditoria ya presente")
          else:
              print("app.py: AVISO bloque de denegacion no encontrado")

          if "def __getattr__" not in t:
              extra = "\n".join([
                  "",
                  "",
                  "_instancia_app = None",
                  "",
                  "",
                  "def __getattr__(nombre):",
                  '    """Export perezoso: from ...app import app (PEP 562)."""',
                  "    global _instancia_app",
                  '    if nombre == "app":',
                  "        if _instancia_app is None:",
                  "            _instancia_app = montar_aplicacion()",
                  "        return _instancia_app",
                  '    raise AttributeError("Este modulo no exporta " + repr(nombre))',
                  "",
              ])
              t = t + extra
              print("app.py: export app agregado")
          else:
              print("app.py: export ya presente")

          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("app.py: sintaxis OK tras edicion")
          PYEOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=long 2>&1 | tee pytest_salida.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Log completo al Summary
        if: always()
        run: |
          {
            echo "## Resultado completo de la suite"
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo si la suite esta verde
        run: |
          if grep -qE "[1-9][0-9]* failed" pytest_salida.txt; then
            echo "SUITE EN ROJO - no se commitea. Ver el Summary."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio/tests apps/laboratorio/infrastructure/api/app.py
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "RUM 6: suite de LABORATORIO en verde + export app + auditoria de denegados"
            git push
          fi
