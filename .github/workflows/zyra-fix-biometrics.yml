name: "ZYRA AUDIT VIVA-3 (seguridad: token obligatorio + rate limit)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: P1 - config.py completo
        run: |
          {
          echo "## config.py COMPLETO"
          echo '```python'
          awk '{printf "%5d| %s\n", NR, $0}' shared_engines/runtime/config.py 2>/dev/null || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P2 - api.py _authorized + do_GET/do_POST
        run: |
          {
          echo "## api.py: _authorized (fuente)"
          echo '```python'
          L=$(grep -n "def _authorized" shared_engines/runtime/api.py | head -1 | cut -d: -f1)
          s=$((L-3)); [ "$s" -lt 1 ] && s=1
          awk -v a="$s" -v b="$((L+35))" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' shared_engines/runtime/api.py
          echo '```'
          echo "## api.py: do_GET/do_POST/_dispatch"
          echo '```python'
          for FN in "def do_GET" "def do_POST" "def _dispatch"; do
            L=$(grep -n "$FN" shared_engines/runtime/api.py | head -1 | cut -d: -f1 || true)
            if [ -n "$L" ]; then
              s=$((L-3)); [ "$s" -lt 1 ] && s=1
              awk -v a="$s" -v b="$((L+30))" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' shared_engines/runtime/api.py
              echo "---"
            fi
          done
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P3 - menciones rate/limit/token en runtime
        run: |
          {
          echo "## rate/limit existente"
          echo '```'
          grep -rniE "rate.?limit|throttle" shared_engines/runtime --include='*.py' | head -10 || true
          echo "(vacio = no existe, se construye)"
          echo ""
          echo "## token en config/api"
          echo '```'
          grep -n "api_token\|Bearer\|Authorization" shared_engines/runtime/config.py shared_engines/runtime/api.py | head -15 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P4 - sonda real: acceso sin token (estado actual)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import threading
          import time
          import urllib.request
          import urllib.error
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          print("## Sonda seguridad: rutas sin token (estado actual)")
          print("```")
          db = SQLiteAdapter(":memory:")
          s, _ = Ed25519Signer.generate()
          k = ZyraKernel(db=db, clock=SystemClock(), signer=s, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          k.bootstrap_root()
          caps = ZyraCapabilities(db, SystemClock(), identity=k.identity, signer=s)
          srv = serve_combined(k, caps, host="127.0.0.1", port=0)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base = "http://127.0.0.1:" + str(srv.server_address[1])
          for ruta in ("/health", "/bridge/subscriptions/x", "/tokens/items"):
              try:
                  with urllib.request.urlopen(base + ruta, timeout=10) as r:
                      print(ruta, "->", r.status, "(PUBLICA sin token)")
              except urllib.error.HTTPError as e:
                  print(ruta, "->", e.code, "(protegida)")
              except Exception as e:
                  print(ruta, "->", type(e).__name__, str(e)[:80])
          srv.shutdown()
          srv.server_close()
          print("```")
          EOF
          exit 0
