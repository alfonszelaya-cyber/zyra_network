              from apps.laboratorio.shared.interfaces.event_bus import Evento
              bus = BusEventos()
              recibidos = []
              bus.suscribir("ev.y", lambda e: recibidos.append(e))

              def _rompe(_e):
                  raise ValueError("intencional")

              bus.suscribir("ev.y", _rompe)
              entregados = bus.publicar(Evento(nombre="ev.y", datos={}))
              assert entregados == 1
              assert len(recibidos) == 1
