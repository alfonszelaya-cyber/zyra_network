name: "AUDIT"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Ver archivos
        run: |
          echo "=== CORE_PREFIXES ==="
          sed -n '40,55p' shared_engines/runtime/combined_api.py
          echo "=== death test enroll ==="
          sed -n '615,630p' shared_engines/runtime/tests/test_runtime_api.py
          echo "=== verification test enroll ==="
          sed -n '520,530p' shared_engines/runtime/tests/test_capabilities_api.py
          echo "=== expediente biometric ==="
          sed -n '470,480p' shared_engines/network/tests/test_portable_identity.py
          echo "=== verify-existence test ==="
          sed -n '640,660p' shared_engines/runtime/tests/test_runtime_api.py
      - name: Tracebacks
        run: |
          python3 -m pytest "shared_engines/runtime/tests/test_runtime_api.py::test_death_lifecycle_deceased" -vv --tb=long 2>&1 | tail -50 || true
          python3 -m pytest "shared_engines/runtime/tests/test_runtime_api.py::test_verify_existence_public" -vv --tb=long 2>&1 | tail -50 || true
          python3 -m pytest "shared_engines/runtime/tests/test_capabilities_api.py::test_verification_verdict_signed" -vv --tb=long 2>&1 | tail -50 || true
          python3 -m pytest "shared_engines/network/tests/test_portable_identity.py::test_expediente_legal_pedro" -vv --tb=long 2>&1 | tail -50 || true
