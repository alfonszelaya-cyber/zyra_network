name: "ZYRA Auditoría Registro ZID - Validación OCR y UI"

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  audit_zid_registration:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout del Repo"
        uses: actions/checkout@v4

      - name: "AUDITORÍA COMPLETA DEL FLUJO DE REGISTRO ZID"
        id: audit_zid
        run: |
          echo "=========================================="
          echo "AUDITORÍA ZID - PASOS 1 AL 5"
          echo "FECHA: $(date)"
          echo "COMMIT: ${{ github.sha }}"
          echo "=========================================="
          
          mkdir -p /tmp/zyra_zid_audit
          
          # 1. Buscar archivos del frontend de registro (HTML, JS, templates)
          echo ""
          echo "--- ARCHIVOS FRONTEND (INTERFAZ DE REGISTRO) ---"
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.vue" -o -name "*.jsx" \) | \
            grep -iE "register|zid|crear|paso|step" | \
            grep -v node_modules | \
            grep -v ".git" > /tmp/zyra_zid_audit/frontend_files.txt || true
          
          # También buscar en portal/ y public/
          find ./portal ./public -type f \( -name "*.html" -o -name "*.js" \) 2>/dev/null >> /tmp/zyra_zid_audit/frontend_files.txt || true
          
          echo "Archivos frontend encontrados:"
          cat /tmp/zyra_zid_audit/frontend_files.txt
          
          # 2. Buscar archivos del backend (rutas API, controladores, OCR)
          echo ""
          echo "--- ARCHIVOS BACKEND (API Y PROCESAMIENTO) ---"
          find . -type f -name "*.py" | \
            grep -iE "register|zid|ocr|document|identity|biometric|selfie|capture" | \
            grep -v __pycache__ | \
            grep -v ".pyc" > /tmp/zyra_zid_audit/backend_files.txt || true
          
          # Buscar específicamente en apps/nexo y shared_engines
          find ./apps/nexo ./shared_engines -type f -name "*.py" 2>/dev/null | \
            grep -iE "route|api|controller|service|use_case" >> /tmp/zyra_zid_audit/backend_files.txt || true
          
          echo "Archivos backend encontrados:"
          cat /tmp/zyra_zid_audit/backend_files.txt
          
          # 3. Analizar cada archivo frontend
          echo ""
          echo "=========================================="
          echo "ANÁLISIS DETALLADO DE FRONTEND"
          echo "=========================================="
          
          while IFS= read -r file_path; do
            if [ -f "$file_path" ] && [ -s "$file_path" ]; then
              filename=$(basename "$file_path")
              echo ""
              echo "============================================================"
              echo "FRONTEND: $filename"
              echo "RUTA: $file_path"
              echo "============================================================"
              
              # Buscar referencias a "Paso X de 5"
              echo "> DETECCIÓN DE PASOS:"
              grep -iE "paso [0-9]|step [0-9]|paso [0-9] de|step [0-9] of" "$file_path" | head -n 10 || echo "(Sin detección de pasos)"
              
              # Buscar campos de entrada de nombre
              echo ""
              echo "> CAMPOS DE NOMBRE:"
              grep -iE "name=|nombre|full.?name" "$file_path" | grep -iE "input|field" | head -n 5 || echo "(Sin campos detectados)"
              
              # Buscar botón de continuar/siguiente
              echo ""
              echo "> BOTONES DE NAVEGACIÓN:"
              grep -iE "continuar|siguiente|next|continue|crear.*zid" "$file_path" | head -n 5 || echo "(Sin botones detectados)"
              
              # Buscar configuración de cámara/captura
              echo ""
              echo "> CONFIGURACIÓN DE CÁMARA/CAPTURA:"
              grep -iE "camera|capture|video|width|height|size|screen" "$file_path" | head -n 10 || echo "(Sin configuración de cámara)"
              
              # Buscar validaciones
              echo ""
              echo "> VALIDACIONES EXISTENTES:"
              grep -iE "validate|validar|if.*error|check|verify" "$file_path" | head -n 5 || echo "(Sin validaciones detectadas)"
              
              # Buscar referencias a OCR
              echo ""
              echo "> REFERENCIAS A OCR/DOCUMENTO:"
              grep -iE "ocr|document|dui|id.?card|scan|extract" "$file_path" | head -n 5 || echo "(Sin referencias OCR)"
              
              # Guardar copia para análisis posterior
              cp "$file_path" "/tmp/zyra_zid_audit/frontend_${filename}.backup"
            fi
          done < /tmp/zyra_zid_audit/frontend_files.txt
          
          # 4. Analizar cada archivo backend
          echo ""
          echo "=========================================="
          echo "ANÁLISIS DETALLADO DE BACKEND"
          echo "=========================================="
          
          while IFS= read -r file_path; do
            if [ -f "$file_path" ] && [ -s "$file_path" ]; then
              filename=$(basename "$file_path")
              echo ""
              echo "============================================================"
              echo "BACKEND: $filename"
              echo "RUTA: $file_path"
              echo "============================================================"
              
              # Imports
              echo "> IMPORTS PRINCIPALES:"
              grep -E "^import|^from" "$file_path" | head -n 15 || echo "(Sin imports)"
              
              # Rutas/endpoints
              echo ""
              echo "> ENDPOINTS/ROUTES:"
              grep -iE "@app\.(route|get|post|put)|def .*\(.*request|@router\." "$file_path" | head -n 10 || echo "(Sin rutas detectadas)"
              
              # Funciones relacionadas con registro
              echo ""
              echo "> FUNCIONES DE REGISTRO:"
              grep -E "def.*(register|create|enroll|validate|verify|ocr|extract)" "$file_path" | head -n 10 || echo "(Sin funciones de registro)"
              
              # Validación de nombres
              echo ""
              echo "> VALIDACIÓN DE NOMBRES (BUSCAR COINCIDENCIA):"
              grep -iE "name.*match|nombre.*igual|compare.*name|validate.*name" "$file_path" | head -n 5 || echo "(Sin validación de nombres detectada)"
              
              # Procesamiento OCR
              echo ""
              echo "> LÓGICA OCR/EXTRACCIÓN:"
              grep -iE "ocr|extract|parse|read.*document|tesseract|cv2" "$file_path" | head -n 10 || echo "(Sin lógica OCR detectada)"
              
              # Almacenamiento de datos biométricos
              echo ""
              echo "> ALMACENAMIENTO BIOMÉTRICO:"
              grep -iE "biometric|template|embedding|face.*vector|save.*image" "$file_path" | head -n 5 || echo "(Sin almacenamiento biométrico)"
              
              # Errores 502
              echo ""
              echo "> MANEJO DE ERRORES/TIMEOUTS:"
              grep -iE "timeout|502|500|error.*handler|exception" "$file_path" | head -n 5 || echo "(Sin manejo de errores específico)"
              
              # Guardar copia
              cp "$file_path" "/tmp/zyra_zid_audit/backend_${filename}.backup"
            fi
          done < /tmp/zyra_zid_audit/backend_files.txt
          
          # 5. Buscar configuraciones de país (hardcodeo El Salvador)
          echo ""
          echo "=========================================="
          echo "CONFIGURACIONES DE PAÍS (HARDCODEO)"
          echo "=========================================="
          
          grep -rE "El Salvador|DUI|503|\+503|country.*SV|country.*El" --include="*.py" --include="*.js" --include="*.html" . | \
            grep -v node_modules | \
            grep -v ".git" | \
            head -n 20 || echo "(No se encontraron referencias hardcodeadas)"
          
          echo ""
          echo "=========================================="
          echo "FIN DE AUDITORÍA ZID"
          echo "=========================================="
          
          # Contar archivos
          echo ""
          echo "RESUMEN:"
          echo "- Archivos frontend analizados: $(wc -l < /tmp/zyra_zid_audit/frontend_files.txt)"
          echo "- Archivos backend analizados: $(wc -l < /tmp/zyra_zid_audit/backend_files.txt)"
          
          ls -la /tmp/zyra_zid_audit/

      - name: "Subir Reporte Completo de Auditoría ZID"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra_zid_registration_audit
          path: /tmp/zyra_zid_audit/
          retention-days: 14
