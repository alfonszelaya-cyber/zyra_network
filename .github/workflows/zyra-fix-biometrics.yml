name: "ZYRA NEXO E6: motor transversal atencion + family office"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir motor transversal + family office
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          # ==================================================
          # MOTOR TRANSVERSAL DE ATENCION AL CLIENTE
          # (como payments: vive en shared_engines,
          #  sirve a TODAS las apps)
          # ==================================================
          INIT = ('"""Motor transversal de atencion al cliente."""\n'
                  'from shared_engines.support.engine import SupportEngine\n'
                  '\n'
                  '__all__ = ["SupportEngine"]\n')

          ERRORS = D(r'''
              """Soporte: errores de dominio."""
              from __future__ import annotations


              class SupportError(Exception):
                  pass


              class UnknownTicketError(SupportError):
                  pass


              class UnknownCaseError(SupportError):
                  pass
          ''')

          ENGINE = D(r'''
              """Motor TRANSVERSAL de atencion al cliente.

              Sirve a TODAS las apps de la Red (NEXO, SUBASTAS,
              AGRO, AXIS, SEMILLA, MPE...). Cada ticket lleva
              app_id para saber de donde viene. Escalamiento
              global cross-app: un caso puede cruzar apps
              (NEXO+AXIS, NEXO+SEMILLA...) como el Modulo 10
              del viejo diseno. La Red transporta el ticket;
              las apps tienen sus agentes."""
              from __future__ import annotations

              from typing import Dict, List, Optional
              import uuid

              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              TICKET_PRIORITIES = ("LOW", "NORMAL", "HIGH", "CRITICAL")
              TICKET_STATUSES = ("OPEN", "ASSIGNED", "IN_PROGRESS",
                                 "ESCALATED", "RESOLVED", "CLOSED")
              APP_IDS = ("nexo", "subastas", "agro", "axis",
                         "semilla", "mpe", "futuro", "lab", "global")

              _MIGRATIONS = (
                  Migration(1, "support_tickets", (
                      "CREATE TABLE IF NOT EXISTS support_tickets (ticket_id TEXT PRIMARY KEY, app_id TEXT NOT NULL, client_id TEXT NOT NULL DEFAULT '', title TEXT NOT NULL, description TEXT NOT NULL DEFAULT '', priority TEXT NOT NULL DEFAULT 'NORMAL', status TEXT NOT NULL DEFAULT 'OPEN', agent_id TEXT, resolution TEXT, created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                  )),
                  Migration(2, "support_escalations", (
                      "CREATE TABLE IF NOT EXISTS support_escalations (escalation_id TEXT PRIMARY KEY, ticket_id TEXT NOT NULL, from_app TEXT NOT NULL, to_app TEXT NOT NULL, level TEXT NOT NULL, reason TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                  )),
                  Migration(3, "support_feedback", (
                      "CREATE TABLE IF NOT EXISTS support_feedback (feedback_id TEXT PRIMARY KEY, ticket_id TEXT NOT NULL, client_id TEXT NOT NULL, score INTEGER NOT NULL, comments TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                  )),
                  Migration(4, "support_cases", (
                      "CREATE TABLE IF NOT EXISTS support_cases (case_id TEXT PRIMARY KEY, ticket_id TEXT NOT NULL, apps_involved_json TEXT NOT NULL DEFAULT '[]', case_data_json TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'OPEN', created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                  )),
              )


              class SupportEngine:
                  """Motor transversal de atencion al cliente."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "support.core",
                                      _MIGRATIONS).run(clock)

                  # ---------- TICKETS ----------
                  def create_ticket(self, *, app_id: str, title: str,
                                    description: str = "",
                                    client_id: str = "",
                                    priority: str = "NORMAL") -> dict:
                      if app_id not in APP_IDS:
                          app_id = "global"
                      if priority not in TICKET_PRIORITIES:
                          priority = "NORMAL"
                      ticket_id = "TKT-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO support_tickets"
                              " (ticket_id, app_id, client_id, title,"
                              " description, priority, status, agent_id,"
                              " resolution, created_at, updated_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, 'OPEN',"
                              " NULL, NULL, ?, ?)",
                              (ticket_id, app_id, client_id, title,
                               description, priority, now, now))
                      return self.get_ticket(ticket_id)

                  def get_ticket(self, ticket_id: str) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM support_tickets"
                          " WHERE ticket_id = ?", (ticket_id,))
                      return self._ticket_row(row) if row else None

                  def _ticket_row(self, row) -> dict:
                      return {"ticket_id": str(row["ticket_id"]),
                              "app_id": str(row["app_id"]),
                              "client_id": str(row["client_id"]),
                              "title": str(row["title"]),
                              "description": str(row["description"]),
                              "priority": str(row["priority"]),
                              "status": str(row["status"]),
                              "agent_id": (str(row["agent_id"])
                                           if row["agent_id"] else None),
                              "resolution": (str(row["resolution"])
                                             if row["resolution"] else None),
                              "created_at": float(row["created_at"]),
                              "updated_at": float(row["updated_at"])}

                  def assign_ticket(self, *, ticket_id: str,
                                    agent_id: str) -> dict:
                      row = self._db.query_one(
                          "SELECT status FROM support_tickets"
                          " WHERE ticket_id = ?", (ticket_id,))
                      if not row:
                          raise KeyError(ticket_id)
                      self._db.execute(
                          "UPDATE support_tickets SET"
                          " status = 'ASSIGNED', agent_id = ?,"
                          " updated_at = ? WHERE ticket_id = ?",
                          (agent_id, self._clock.now(), ticket_id))
                      return self.get_ticket(ticket_id)

                  def escalate_ticket(self, *, ticket_id: str,
                                      to_app: str, level: str = "HIGH",
                                      reason: str = "") -> dict:
                      ticket = self.get_ticket(ticket_id)
                      if not ticket:
                          raise KeyError(ticket_id)
                      esc_id = "ESC-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO support_escalations"
                              " (escalation_id, ticket_id, from_app,"
                              " to_app, level, reason, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?)",
                              (esc_id, ticket_id, ticket["app_id"],
                               to_app, level, reason, now))
                          cursor.execute(
                              "UPDATE support_tickets SET"
                              " status = 'ESCALATED', updated_at = ?"
                              " WHERE ticket_id = ?",
                              (now, ticket_id))
                      return {"escalation_id": esc_id,
                              "ticket_id": ticket_id,
                              "from_app": ticket["app_id"],
                              "to_app": to_app, "level": level,
                              "reason": reason,
                              "status": "ESCALATED"}

                  def resolve_ticket(self, *, ticket_id: str,
                                     resolution: str) -> dict:
                      now = self._clock.now()
                      self._db.execute(
                          "UPDATE support_tickets SET"
                          " status = 'RESOLVED', resolution = ?,"
                          " updated_at = ? WHERE ticket_id = ?",
                          (resolution, now, ticket_id))
                      return self.get_ticket(ticket_id)

                  def close_ticket(self, *, ticket_id: str) -> dict:
                      now = self._clock.now()
                      self._db.execute(
                          "UPDATE support_tickets SET"
                          " status = 'CLOSED', updated_at = ?"
                          " WHERE ticket_id = ?",
                          (now, ticket_id))
                      return self.get_ticket(ticket_id)

                  def get_tickets_by_app(self, app_id: str) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM support_tickets"
                          " WHERE app_id = ? ORDER BY created_at DESC"
                          " LIMIT 200", (app_id,))
                      return [self._ticket_row(r) for r in rows]

                  def get_open_tickets(self, app_id: str = "") -> List[dict]:
                      if app_id:
                          rows = self._db.query_all(
                              "SELECT * FROM support_tickets"
                              " WHERE app_id = ? AND status IN"
                              " ('OPEN','ASSIGNED','IN_PROGRESS',"
                              " 'ESCALATED')"
                              " ORDER BY created_at DESC LIMIT 100",
                              (app_id,))
                      else:
                          rows = self._db.query_all(
                              "SELECT * FROM support_tickets"
                              " WHERE status IN ('OPEN','ASSIGNED',"
                              " 'IN_PROGRESS','ESCALATED')"
                              " ORDER BY created_at DESC LIMIT 100")
                      return [self._ticket_row(r) for r in rows]

                  # ---------- CASOS TRANSVERSALES ----------
                  def create_cross_app_case(self, *, apps_involved,
                                            title: str, case_data=None) -> dict:
                      """Caso que cruza varias apps
                      (ej: NEXO+AXIS, NEXO+SEMILLA)."""
                      case_id = "CAS-" + str(uuid.uuid4())
                      now = self._clock.now()
                      import json as _j
                      ticket = self.create_ticket(
                          app_id="global", title=title,
                          description="caso transversal: "
                          + ", ".join(apps_involved),
                          priority="HIGH")
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO support_cases"
                              " (case_id, ticket_id,"
                              " apps_involved_json,"
                              " case_data_json, status,"
                              " created_at, updated_at)"
                              " VALUES (?, ?, ?, ?, 'OPEN', ?, ?)",
                              (case_id, ticket["ticket_id"],
                               _j.dumps(apps_involved, default=str),
                               _j.dumps(case_data or {},
                                        default=str), now, now))
                      return {"case_id": case_id,
                              "ticket_id": ticket["ticket_id"],
                              "apps_involved": apps_involved,
                              "title": title,
                              "status": "OPEN"}

                  # ---------- FEEDBACK ----------
                  def register_feedback(self, *, ticket_id: str,
                                        client_id: str, score: int,
                                        comments: str = "") -> dict:
                      if score < 1:
                          score = 1
                      if score > 10:
                          score = 10
                      feedback_id = "FDB-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO support_feedback"
                              " (feedback_id, ticket_id, client_id,"
                              " score, comments, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?)",
                              (feedback_id, ticket_id, client_id,
                               score, comments, now))
                      return {"feedback_id": feedback_id,
                              "ticket_id": ticket_id,
                              "client_id": client_id,
                              "score": score,
                              "status": "REGISTERED"}

                  def average_satisfaction(self, app_id: str = "") -> dict:
                      if app_id:
                          tickets = self.get_tickets_by_app(app_id)
                          tids = [t["ticket_id"] for t in tickets]
                          if not tids:
                              return {"score": 0, "responses": 0}
                          marks = []
                          for tid in tids:
                              rows = self._db.query_all(
                                  "SELECT score FROM support_feedback"
                                  " WHERE ticket_id = ?", (tid,))
                              marks.extend([int(r["score"])
                                            for r in rows])
                      else:
                          rows = self._db.query_all(
                              "SELECT score FROM support_feedback")
                          marks = [int(r["score"]) for r in rows]
                      if not marks:
                          return {"score": 0, "responses": 0}
                      return {"score": round(sum(marks)
                                             / len(marks), 2),
                              "responses": len(marks)}
          ''')

          forzar("shared_engines/support/__init__.py", INIT)
          forzar("shared_engines/support/errors.py", ERRORS)
          forzar("shared_engines/support/engine.py", ENGINE)

          # ==================================================
          # FAMILY OFFICE: 7 engines persistentes + 6 use cases llenos
          # ==================================================
          FO = "apps/nexo/domain/family_office"
          UCF = "apps/nexo/application/family_office_use_cases"

          forzar(FO + "/family_asset_engine.py", D(r'''
              """Family Asset Engine - NEXO / ZYRA (migrado mejorado)."""
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "family_assets", (
                      "CREATE TABLE IF NOT EXISTS family_assets (asset_id TEXT PRIMARY KEY, asset_type TEXT NOT NULL, asset_name TEXT NOT NULL, value TEXT NOT NULL, jurisdiction TEXT NOT NULL DEFAULT '', metadata_json TEXT NOT NULL DEFAULT '{}', status TEXT NOT NULL DEFAULT 'ACTIVE', created_at REAL NOT NULL)",
                  )),
              )

              class FamilyAssetEngine:
                  """Gestion de activos patrimoniales (Decimal)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.familyassets",
                                      _MIGRATIONS).run(clock)

                  def register_asset(self, *, asset_type, asset_name,
                                     value, jurisdiction,
                                     metadata=None):
                      from decimal import Decimal as _D
                      val = _D(str(value))
                      aid = "AST-" + str(uuid.uuid4())
                      now = self._clock.now()
                      import json as _j
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO family_assets"
                              " (asset_id, asset_type, asset_name,"
                              " value, jurisdiction, metadata_json,"
                              " status, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, 'ACTIVE', ?)",
                              (aid, asset_type, asset_name, str(val),
                               jurisdiction,
                               _j.dumps(metadata or {}, default=str),
                               now))
                      return {"asset_id": aid,
                              "asset_type": asset_type,
                              "asset_name": asset_name,
                              "value": str(val),
                              "jurisdiction": jurisdiction,
                              "status": "ACTIVE"}

                  def get_assets(self):
                      rows = self._db.query_all(
                          "SELECT * FROM family_assets"
                          " ORDER BY created_at")
                      return [{"asset_id": str(r["asset_id"]),
                               "asset_type": str(r["asset_type"]),
                               "asset_name": str(r["asset_name"]),
                               "value": str(r["value"]),
                               "jurisdiction": str(r["jurisdiction"]),
                               "status": str(r["status"])}
                              for r in rows]

                  def calculate_total_assets(self):
                      from decimal import Decimal as _D
                      rows = self._db.query_all(
                          "SELECT value FROM family_assets"
                          " WHERE status = 'ACTIVE'")
                      total = _D("0")
                      for r in rows:
                          total = total + _D(str(r["value"]))
                      return total
          '''))

          forzar(FO + "/wealth_management_engine.py", D(r'''
              """Wealth Management - NEXO / ZYRA (migrado mejorado)."""
              from __future__ import annotations
              from typing import Dict
              from datetime import datetime

              class WealthManagementEngine:
                  """Gestion global de patrimonio."""

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def generate_wealth_snapshot(self, *,
                                               total_assets, total_liabilities):
                      from decimal import Decimal as _D
                      a = _D(str(total_assets))
                      l = _D(str(total_liabilities))
                      net = a - l
                      return {"generated_at": self._now(),
                              "total_assets": str(a),
                              "total_liabilities": str(l),
                              "net_worth": str(net),
                              "status": "ACTIVE"}

                  def calculate_growth(self, *, current_value,
                                       previous_value):
                      from decimal import Decimal as _D
                      prev = _D(str(previous_value))
                      if prev <= 0:
                          return 0.0
                      cur = _D(str(current_value))
                      growth = ((cur - prev) / prev) * 100
                      return float(round(growth, 2))
          '''))

          forzar(FO + "/trust_management_engine.py", D(r'''
              """Trust Management - NEXO / ZYRA (migrado mejorado)."""
              from __future__ import annotations
              from typing import Dict, List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "family_trusts", (
                      "CREATE TABLE IF NOT EXISTS family_trusts (trust_id TEXT PRIMARY KEY, trust_name TEXT NOT NULL, jurisdiction TEXT NOT NULL, beneficiaries_json TEXT NOT NULL DEFAULT '[]', status TEXT NOT NULL DEFAULT 'ACTIVE', created_at REAL NOT NULL)",
                  )),
              )

              class TrustManagementEngine:
                  """Gestion de Trusts (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.trusts",
                                      _MIGRATIONS).run(clock)

                  def create_trust(self, *, trust_name, jurisdiction,
                                   beneficiaries):
                      import json as _j
                      tid = "TRUST-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO family_trusts"
                              " (trust_id, trust_name, jurisdiction,"
                              " beneficiaries_json, status, created_at)"
                              " VALUES (?, ?, ?, ?, 'ACTIVE', ?)",
                              (tid, trust_name, jurisdiction,
                               _j.dumps(beneficiaries, default=str),
                               now))
                      return {"trust_id": tid,
                              "trust_name": trust_name,
                              "jurisdiction": jurisdiction,
                              "beneficiaries": beneficiaries,
                              "status": "ACTIVE"}

                  def get_trusts(self):
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM family_trusts ORDER BY created_at")
                      return [{"trust_id": str(r["trust_id"]),
                               "trust_name": str(r["trust_name"]),
                               "jurisdiction": str(r["jurisdiction"]),
                               "beneficiaries": _j.loads(
                                   str(r["beneficiaries_json"])),
                               "status": str(r["status"])}
                              for r in rows]
          '''))

          forzar(FO + "/inheritance_engine.py", D(r'''
              """Inheritance - NEXO / ZYRA (migrado mejorado)."""
              from __future__ import annotations
              from typing import Dict, List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "family_inheritances", (
                      "CREATE TABLE IF NOT EXISTS family_inheritances (inheritance_id TEXT PRIMARY KEY, estate_name TEXT NOT NULL, beneficiaries_json TEXT NOT NULL DEFAULT '[]', total_value TEXT NOT NULL DEFAULT '0', status TEXT NOT NULL DEFAULT 'PLANNED', created_at REAL NOT NULL)",
                  )),
              )

              class InheritanceEngine:
                  """Gestion de herencias (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.inheritance",
                                      _MIGRATIONS).run(clock)

                  def create_inheritance(self, *, estate_name,
                                         beneficiaries, total_value):
                      import json as _j
                      iid = "INH-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO family_inheritances"
                              " (inheritance_id, estate_name,"
                              " beneficiaries_json, total_value,"
                              " status, created_at)"
                              " VALUES (?, ?, ?, ?, 'PLANNED', ?)",
                              (iid, estate_name,
                               _j.dumps(beneficiaries, default=str),
                               str(total_value), now))
                      return {"inheritance_id": iid,
                              "estate_name": estate_name,
                              "beneficiaries": beneficiaries,
                              "total_value": str(total_value),
                              "status": "PLANNED"}

                  def get_inheritances(self):
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM family_inheritances"
                          " ORDER BY created_at")
                      return [{"inheritance_id": str(r["inheritance_id"]),
                               "estate_name": str(r["estate_name"]),
                               "beneficiaries": _j.loads(
                                   str(r["beneficiaries_json"])),
                               "total_value": str(r["total_value"]),
                               "status": str(r["status"])}
                              for r in rows]
          '''))

          forzar(FO + "/succession_engine.py", D(r'''
              """Succession - NEXO / ZYRA (migrado mejorado)."""
              from __future__ import annotations
              from typing import Dict, List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "family_successions", (
                      "CREATE TABLE IF NOT EXISTS family_successions (plan_id TEXT PRIMARY KEY, title TEXT NOT NULL, successors_json TEXT NOT NULL DEFAULT '[]', assets_json TEXT NOT NULL DEFAULT '[]', status TEXT NOT NULL DEFAULT 'ACTIVE', created_at REAL NOT NULL)",
                  )),
              )

              class SuccessionEngine:
                  """Planificacion sucesoria (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.succession",
                                      _MIGRATIONS).run(clock)

                  def create_plan(self, *, title, successors, assets):
                      import json as _j
                      pid = "SUC-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO family_successions"
                              " (plan_id, title, successors_json,"
                              " assets_json, status, created_at)"
                              " VALUES (?, ?, ?, ?, 'ACTIVE', ?)",
                              (pid, title,
                               _j.dumps(successors, default=str),
                               _j.dumps(assets, default=str), now))
                      return {"plan_id": pid, "title": title,
                              "successors": successors,
                              "assets": assets, "status": "ACTIVE"}

                  def get_plans(self):
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM family_successions"
                          " ORDER BY created_at")
                      return [{"plan_id": str(r["plan_id"]),
                               "title": str(r["title"]),
                               "successors": _j.loads(
                                   str(r["successors_json"])),
                               "assets": _j.loads(str(r["assets_json"])),
                               "status": str(r["status"])}
                              for r in rows]
          '''))

          forzar(FO + "/family_governance_engine.py", D(r'''
              """Family Governance - NEXO / ZYRA (migrado mejorado)."""
              from __future__ import annotations
              from typing import Dict, List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "family_governance_decisions", (
                      "CREATE TABLE IF NOT EXISTS family_governance_decisions (decision_id TEXT PRIMARY KEY, subject TEXT NOT NULL, participants_json TEXT NOT NULL DEFAULT '[]', resolution TEXT NOT NULL DEFAULT '', status TEXT NOT NULL DEFAULT 'APPROVED', created_at REAL NOT NULL)",
                  )),
              )

              class FamilyGovernanceEngine:
                  """Gobierno familiar (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.familygov",
                                      _MIGRATIONS).run(clock)

                  def register_decision(self, *, subject,
                                        participants, resolution):
                      import json as _j
                      did = "FGV-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO family_governance_decisions"
                              " (decision_id, subject,"
                              " participants_json, resolution, status,"
                              " created_at)"
                              " VALUES (?, ?, ?, ?, 'APPROVED', ?)",
                              (did, subject,
                               _j.dumps(participants, default=str),
                               resolution, now))
                      return {"decision_id": did,
                              "subject": subject,
                              "participants": participants,
                              "resolution": resolution,
                              "status": "APPROVED"}

                  def get_decisions(self):
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM family_governance_decisions"
                          " ORDER BY created_at")
                      return [{"decision_id": str(r["decision_id"]),
                               "subject": str(r["subject"]),
                               "participants": _j.loads(
                                   str(r["participants_json"])),
                               "resolution": str(r["resolution"]),
                               "status": str(r["status"])}
                              for r in rows]
          '''))

          forzar(FO + "/world_heritage_engine.py", D(r'''
              """World Heritage - NEXO / ZYRA (migrado mejorado)."""
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "world_heritage_assets", (
                      "CREATE TABLE IF NOT EXISTS world_heritage_assets (heritage_id TEXT PRIMARY KEY, asset_name TEXT NOT NULL, asset_type TEXT NOT NULL, country TEXT NOT NULL, estimated_value TEXT NOT NULL DEFAULT '0', metadata_json TEXT NOT NULL DEFAULT '{}', status TEXT NOT NULL DEFAULT 'REGISTERED', created_at REAL NOT NULL)",
                  )),
              )

              class WorldHeritageEngine:
                  """Gestion de patrimonio mundial (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.heritage",
                                      _MIGRATIONS).run(clock)

                  def register_heritage_asset(self, *, asset_name,
                                              asset_type, country,
                                              estimated_value,
                                              metadata=None):
                      import json as _j
                      hid = "WH-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO world_heritage_assets"
                              " (heritage_id, asset_name, asset_type,"
                              " country, estimated_value, metadata_json,"
                              " status, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, 'REGISTERED', ?)",
                              (hid, asset_name, asset_type, country,
                               str(estimated_value),
                               _j.dumps(metadata or {}, default=str),
                               now))
                      return {"heritage_id": hid,
                              "asset_name": asset_name,
                              "asset_type": asset_type,
                              "country": country,
                              "estimated_value": str(estimated_value),
                              "status": "REGISTERED"}

                  def get_assets(self):
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM world_heritage_assets"
                          " ORDER BY created_at")
                      return [{"heritage_id": str(r["heritage_id"]),
                               "asset_name": str(r["asset_name"]),
                               "asset_type": str(r["asset_type"]),
                               "country": str(r["country"]),
                               "estimated_value": str(r["estimated_value"]),
                               "status": str(r["status"])}
                              for r in rows]

                  def calculate_total_value(self):
                      from decimal import Decimal as _D
                      rows = self._db.query_all(
                          "SELECT estimated_value FROM"
                          " world_heritage_assets")
                      total = _D("0")
                      for r in rows:
                          total = total + _D(str(r["estimated_value"]))
                      return total

                  def generate_summary(self) -> Dict:
                      assets = self.get_assets()
                      return {"total_assets": len(assets),
                              "total_value": str(
                                  self.calculate_total_value()),
                              "generated_at": self._clock.now()}

                  def generate_report(self) -> Dict:
                      return {"assets": self.get_assets(),
                              "summary": self.generate_summary(),
                              "report_type": "WORLD_HERITAGE",
                              "generated_at": self._clock.now()}
          '''))

