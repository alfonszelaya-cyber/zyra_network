name: ZYRA AXIS Block D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write surveillance module
        run: |
          cat > apps/axis/life_history/surveillance.py <<'D1EOF'
          """AXIS Surveillance - camera feed analysis."""
          import unittest

          from apps.axis.life_history.service import (
              LifeHistoryService,
          )


          class SurveillanceService:
              def __init__(self, *, life, provider):
                  self._life = life
                  self._provider = provider
                  self._life._store._db.execute(
                      "CREATE TABLE IF NOT EXISTS"
                      " surveillance_alerts ("
                      " alert_id TEXT PRIMARY KEY,"
                      " person_id TEXT,"
                      " matched_zid TEXT,"
                      " confidence REAL,"
                      " operator TEXT NOT NULL,"
                      " created_at REAL NOT NULL)"
                  )

              def identify(self, *, camera_frame, operator):
                  if not operator.strip():
                      raise ValueError("operator required")
                  probe = self._provider.extract_template(
                      camera_frame
                  )
                  rows = self._life._store._db.query_all(
                      "SELECT person_id, zid, full_name"
                      " FROM life_persons WHERE zid"
                      " IS NOT NULL"
                  )
                  best_score = 0.0
                  best = None
                  for row in rows:
                      stored = self._provider.get_known_template(
                          str(row["zid"])
                      )
                      if stored is None:
                          continue
                      score = self._provider.compare(
                          probe, stored
                      )
                      if score > best_score:
                          best_score = score
                          best = row
                  threshold = (
                      self._provider.match_threshold
                  )
                  now = self._life._store._clock.now()
                  alert_id = (
                      "SUR-"
                      + str(now)[:10].replace(".", "")
                      + "-"
                      + str(len(rows))
                  )
                  if best is None or best_score < threshold:
                      with self._life._store._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO"
                              " surveillance_alerts ("
                              " alert_id, person_id,"
                              " matched_zid, confidence,"
                              " operator, created_at)"
                              " VALUES (?,?,?,?,?,?)",
                              (
                                  alert_id,
                                  None,
                                  None,
                                  best_score,
                                  operator,
                                  now,
                              ),
                          )
                      return {
                          "alert_id": alert_id,
                          "matched": False,
                          "zid": None,
                          "confidence": best_score,
                          "threshold": threshold,
                      }
                  zid = str(best["zid"])
                  person_id = str(best["person_id"])
                  with self._life._store._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " surveillance_alerts ("
                          " alert_id, person_id,"
                          " matched_zid, confidence,"
                          " operator, created_at)"
                          " VALUES (?,?,?,?,?,?)",
                          (
                              alert_id,
                              person_id,
                              zid,
                              best_score,
                              operator,
                              now,
                          ),
                      )
                      self._life._store._chain_event(
                          cursor,
                          person_id=person_id,
                          actor=operator,
                          event_type="security_alert",
                          detail=alert_id + " camera match",
                          now=now,
                      )
                  return {
                      "alert_id": alert_id,
                      "matched": True,
                      "zid": zid,
                      "person_name": str(
                          best["full_name"]
                      ),
                      "confidence": best_score,
                      "threshold": threshold,
                  }
          D1EOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/surveillance.py').read()); print('surveillance OK')"

      - name: Write surveillance tests
        run: |
          cat > apps/axis/life_history/tests/test_surveillance.py <<'D2EOF'
          """Surveillance E2E tests."""
          from __future__ import annotations

          import unittest

          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )
          from apps.axis.life_history.surveillance import (
              SurveillanceService,
          )
          from shared_engines.common.clocks import SystemClock
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )

          _MOTHER = "ZID-mother-v"


          class _FakeNet:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid in (
                      _MOTHER,
                      "ZID-vigilado-1",
                      "ZID-vigilado-2",
                  ):
                      return (
                          True,
                          {"status": "ACTIVE"},
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-s"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return False, None, "unknown"


          class _FakeProvider:
              match_threshold = 0.80

              def __init__(self):
                  self._known = {}

              def enroll(self, zid):
                  import hashlib

                  digest = hashlib.sha256(
                      zid.encode("utf-8")
                  ).digest()
                  vector = tuple(
                      float(b) / 255.0
                      for b in digest[:8]
                  )
                  norm = (
                      sum(v * v for v in vector)
                      ** 0.5
                      or 1.0
                  )
                  self._known[zid] = tuple(
                      v / norm for v in vector
                  )

              def get_known_template(self, zid):
                  return self._known.get(zid)

              def extract_template(self, image):
                  for zid, vector in self._known.items():
                      if zid.encode() in image:
                          return vector
                  return (1.0, 0.0)

              def compare(self, a, b):
                  if len(a) != len(b):
                      return 0.0
                  dot = sum(
                      x * y for x, y in zip(a, b)
                  )
                  na = sum(x * x for x in a) ** 0.5
                  nb = sum(x * x for x in b) ** 0.5
                  if na == 0.0 or nb == 0.0:
                      return 0.0
                  return max(
                      -1.0,
                      min(1.0, dot / (na * nb)),
                  )


          class SurveillanceE2E(unittest.TestCase):
              def _boot(self):
                  db = SQLiteAdapter(":memory:")
                  life = LifeHistoryService(
                      store=LifeHistoryStore(
                          db, SystemClock()
                      ),
                      client=_FakeNet(),
                  )
                  return db, life

              def test_match_chains_alert(self):
                  db, life = self._boot()
                  birth = life.register_birth_with_network(
                      registrar_account="AX-reg-1",
                      child_name="Persona Vigilada",
                      birth_date="1995-01-01",
                      birth_place="SS",
                      sex="M",
                      mother_name="Madre V",
                      mother_zid=_MOTHER,
                  )
                  person_id = str(birth["person_id"])
                  life.attach_zid_with_audit(
                      person_id,
                      zid="ZID-vigilado-1",
                      actor="enroll",
                  )
                  provider = _FakeProvider()
                  provider.enroll("ZID-vigilado-1")
                  svc = SurveillanceService(
                      life=life, provider=provider
                  )
                  result = svc.identify(
                      camera_frame=(
                          b"frame-ZID-vigilado-1"
                      ),
                      operator="AX-cam-1",
                  )
                  self.assertTrue(result["matched"])
                  self.assertEqual(
                      "ZID-vigilado-1",
                      result["zid"],
                  )
                  events = life._store.events_of(
                      person_id
                  )
                  self.assertEqual(
                      "security_alert",
                      events[-1]["event_type"],
                  )
                  self.assertTrue(
                      life._store.events_verify(
                          person_id
                      )
                  )

              def test_unknown_no_chain_write(self):
                  db, life = self._boot()
                  birth = life.register_birth_with_network(
                      registrar_account="AX-reg-1",
                      child_name="Otra Persona",
                      birth_date="1995-02-02",
                      birth_place="SS",
                      sex="F",
                      mother_name="Madre V2",
                      mother_zid=_MOTHER,
                  )
                  person_id = str(birth["person_id"])
                  life.attach_zid_with_audit(
                      person_id,
                      zid="ZID-vigilado-2",
                      actor="enroll",
                  )
                  provider = _FakeProvider()
                  provider.enroll("ZID-vigilado-2")
                  svc = SurveillanceService(
                      life=life, provider=provider
                  )
                  result = svc.identify(
                      camera_frame=b"frame-xyz",
                      operator="AX-cam-1",
                  )
                  self.assertFalse(result["matched"])
                  types = [
                      e["event_type"]
                      for e in life._store.events_of(
                          person_id
                      )
                  ]
                  self.assertNotIn(
                      "security_alert", types
                  )

              def test_no_templates_no_match(self):
                  db, life = self._boot()
                  provider = _FakeProvider()
                  svc = SurveillanceService(
                      life=life, provider=provider
                  )
                  result = svc.identify(
                      camera_frame=b"anything",
                      operator="AX-cam-1",
                  )
                  self.assertFalse(result["matched"])


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          D2EOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_surveillance.py').read()); print('test OK')"

      - name: 1/3 Surveillance tests (3 E2E)
        run: python -m pytest apps/axis/life_history/tests/test_surveillance.py -v

      - name: 2/3 Life History regression
        run: |
          python -m pytest apps/axis/life_history/tests/test_judicial_automation.py apps/axis/life_history/tests/test_outbox_bridge.py apps/axis/life_history/tests/test_service.py apps/axis/life_history/tests/test_verification.py apps/axis/life_history/tests/test_health_link.py apps/axis/life_history/tests/test_longitudinal_screen.py apps/axis/life_history/tests/test_justice_service.py apps/axis/life_history/tests/test_security_service.py apps/axis/life_history/tests/test_ops_server.py apps/axis/life_history/tests/test_clearance_ops.py apps/axis/life_history/tests/test_concurrency_recovery.py -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "surveillance: 1:N via provider-owned templates, alerts chained (3 E2E)"
            git push
          fi
