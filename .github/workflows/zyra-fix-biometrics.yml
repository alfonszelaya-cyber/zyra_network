name: "RED-DEATH: estado DECEASED + register_death en cadena + guardia de rol + reparto por cartero"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - contracts.py: DECEASED en el enum + transiciones terminales (desde ACTIVE/VERIFIED/SUSPENDED)"
        run: |
          python3 - <<'CEOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/identity/contracts.py")
          t = p.read_text(encoding="utf-8")
          if "DECEASED" in t:
              print("SKIP 1 (DECEASED ya presente)")
              raise SystemExit(0)
          V1 = (
              '    ACTIVE = "ACTIVE"\n'
              '    SUSPENDED = "SUSPENDED"\n'
              '    REVOKED = "REVOKED"\n'
          )
          N1 = (
              '    ACTIVE = "ACTIVE"\n'
              '    SUSPENDED = "SUSPENDED"\n'
              '    REVOKED = "REVOKED"\n'
              '    DECEASED = "DECEASED"\n'
          )
          assert t.count(V1) == 1, "ancla enum " + str(t.count(V1))
          t = t.replace(V1, N1, 1)
          V2 = (
              "    IdentityStatus.SUSPENDED: frozenset(\n"
              "        {IdentityStatus.ACTIVE, IdentityStatus.REVOKED}\n"
              "    ),\n"
              "    IdentityStatus.REVOKED: frozenset(),\n"
          )
          N2 = (
              "    IdentityStatus.SUSPENDED: frozenset(\n"
              "        {IdentityStatus.ACTIVE, IdentityStatus.REVOKED,\n"
              "         IdentityStatus.DECEASED}\n"
              "    ),\n"
              "    IdentityStatus.REVOKED: frozenset(),\n"
              "    IdentityStatus.DECEASED: frozenset(),\n"
          )
          assert t.count(V2) == 1, "ancla transiciones " + str(t.count(V2))
          t = t.replace(V2, N2, 1)
          V3 = (
              "    IdentityStatus.VERIFIED: frozenset(\n"
              "        {IdentityStatus.ACTIVE, IdentityStatus.REVOKED}\n"
              "    ),\n"
          )
          N3 = (
              "    IdentityStatus.VERIFIED: frozenset(\n"
              "        {IdentityStatus.ACTIVE, IdentityStatus.REVOKED,\n"
              "         IdentityStatus.DECEASED}\n"
              "    ),\n"
          )
          assert t.count(V3) == 1, "ancla verified " + str(t.count(V3))
          t = t.replace(V3, N3, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 1: DECEASED en enum + transiciones (ACTIVE/VERIFIED/SUSPENDED -> DECEASED, terminal)")
          CEOF

      - name: "Paso 2 - verificacion: DECEASED vivo y terminal"
        run: |
          python3 -c "
          from shared_engines.identity.contracts import (
              IdentityStatus, VALID_TRANSITIONS)
          assert IdentityStatus.DECEASED.value == 'DECEASED'
          assert IdentityStatus.DECEASED in (
              VALID_TRANSITIONS[IdentityStatus.ACTIVE])
          assert IdentityStatus.DECEASED in (
              VALID_TRANSITIONS[IdentityStatus.VERIFIED])
          assert IdentityStatus.DECEASED in (
              VALID_TRANSITIONS[IdentityStatus.SUSPENDED])
          assert VALID_TRANSITIONS[IdentityStatus.DECEASED] == frozenset()
          print('OK 2: DECEASED terminal desde ACTIVE/VERIFIED/SUSPENDED')
          "

      - name: "Paso 3 - LifeHistoryStore: register_death (patron add_life_event, event_type death_registered)"
        run: |
          python3 - <<'DEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("apps/axis/life_history/store.py")
          t = p.read_text(encoding="utf-8")
          if "def register_death(" in t:
              print("SKIP 3 (ya presente)")
              raise SystemExit(0)
          ANCLA = "    def amend_birth("
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla amend_birth " + str(cnt)
          METODO = textwrap.dedent('''\
              def register_death(
                  self,
                  person_id: str,
                  *,
                  actor: str,
                  death_date: str,
                  detail: str,
              ) -> dict[str, object]:
                  """AX-DEATH: partida de defuncion
                  anexada a la cadena del ZID (nunca
                  se borra nada; la vida completa
                  queda registrada)."""
                  return self.add_life_event(
                      person_id,
                      actor=actor,
                      event_type="death_registered",
                      detail=(
                          "death_date=" + death_date
                          + "; " + detail),
                  )
          ''')
          METODO_IND = textwrap.indent(
              METODO.rstrip("\n"), "    ")
          t = t.replace(ANCLA, METODO_IND + ANCLA, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 3: register_death (AST valido)")
          DEOF

      - name: "Paso 4 - outbox_bridge: death_registered en el catalogo (12 eventos)"
        run: |
          python3 - <<'OEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/life_history/outbox_bridge.py")
          t = p.read_text(encoding="utf-8")
          if '"death_registered"' in t:
              print("SKIP 4 (ya presente)")
              raise SystemExit(0)
          VIEJO = (
              '    "security_status": "life.security.event",\n'
              "}\n"
          )
          NUEVO = (
              '    "security_status": "life.security.event",\n'
              '    "death_registered": "life.death.event",\n'
              "}\n"
          )
          cnt = t.count(VIEJO)
          assert cnt == 1, "ancla catalogo " + str(cnt)
          t = t.replace(VIEJO, NUEVO, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 4: death_registered en catalogo (12 eventos)")
          OEOF

      - name: "Paso 5 - server.py: ruta POST /axis/death-register con guardia de rol (registrador/gobierno)"
        run: |
          python3 - <<'SEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if 's == ["death-register"]' in t:
              print("SKIP 5 (ruta ya presente)")
              raise SystemExit(0)
          ANCLA = '        if s == ["birth-register"]:\n'
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla birth-register " + str(cnt)
          CUERPO = (
              '        if s == ["death-register"]:\n'
              "            from apps.axis.life_history.permissions import (\n"
              "                authorize as _dz_auth,\n"
              "            )\n"
              "            _dz_role = (\n"
              "                self.headers.get(\n"
              '                    "X-ZYRA-Actor-Role"\n'
              "                ) or \"\"\n"
              "            )\n"
              "            if not _dz_role:\n"
              "                _dz_reg = str((doc or {}).get(\n"
              '                    "registrar_account") or "")\n'
              "                if _dz_reg:\n"
              "                    try:\n"
              "                        _dz_role = str(type(self).store.get_account(_dz_reg).get(\"role\"))\n"
              "                    except LookupError:\n"
              "                        _dz_role = \"\"\n"
              "            if not _dz_auth(\"birth.register\", _dz_role):\n"
              '                self._html(403, _page("AXIS - Rechazado", "<h1>Sin autorizacion</h1><p>Solo registradores/gobierno pueden registrar defunciones.</p>"))\n'
              "                return\n"
              "            _dz_life = self._lh()\n"
              '            _dz_zid = self._req(doc, "zid")\n'
              '            _dz_date = self._req(doc, "death_date")\n'
              '            _dz_detail = str(doc.get("detail") or "")\n'
              "            _dz_ev = _dz_life._store.register_death(\n"
              "                _dz_zid,\n"
              "                actor=_dz_role or \"registrador\",\n"
              "                death_date=_dz_date,\n"
              "                detail=_dz_detail,\n"
              "            )\n"
              "            _dz_idn = None\n"
              "            try:\n"
              "                _dz_idn = (type(self).kernel.identity\n"
              "                    if hasattr(type(self), \"kernel\") else None)\n"
              "            except Exception:\n"
              "                _dz_idn = None\n"
              "            self._html(200, _page(\"AXIS - Defuncion registrada\", (\n"
              "                \"<h1>Defuncion registrada</h1>\"\n"
              "                \"<p>Evento: <b>\" + str(_dz_ev.get(\"event_id\", \"\")) + \"</b></p>\"\n"
              "                \"<p>La identidad del ZID debe transicionar a DECEASED via /identity/transition.</p>\"\n"
              "                \"<a href='/axis'><button>Volver</button></a>\")))\n"
              "            return\n"
          )
          i = t.find(ANCLA)
          t = t[:i] + CUERPO + t[i:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          assert 's == ["death-register"]' in p.read_text(encoding="utf-8")
          print("OK 5: ruta death-register con guardia de rol (AST valido)")
          SEOF

      - name: "Paso 6 - test e2e: nacimiento -> ACTIVE -> defuncion -> DECEASED -> verify-existence lo muestra -> transicion bloqueada"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          target = Path("shared_engines/runtime/tests/test_runtime_api.py")
          assert target.exists()
          t = target.read_text(encoding="utf-8")
          if "test_death_lifecycle_deceased" in t:
              print("SKIP 6 (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_death_lifecycle_deceased(tmp_path) -> None:
                  """AX-DEATH: ciclo completo - identidad
                  activa -> transicion a DECEASED ->
                  verify-existence lo muestra -> ya no
                  puede operar (transiciones desde
                  DECEASED = ninguna)."""
                  import json as _json
                  import threading
                  import time as _time
                  import urllib.error
                  import urllib.request
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  from shared_engines.runtime.config import (
                      RuntimeConfig)
                  from shared_engines.runtime.kernel import (
                      ZyraKernel)
                  from shared_engines.runtime.capabilities import (
                      ZyraCapabilities)
                  from shared_engines.runtime.combined_api import (
                      serve_combined)
                  from shared_engines.verification.signatures import (
                      Ed25519Signer)
                  from shared_engines.security.biometrics import (
                      BiometricsEngine, BiometricsPolicy,
                      DeterministicTestProvider, TemplateCipher)
                  from shared_engines.identity.contracts import (
                      IdentityStatus)
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db, clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1", port=0,
                          api_token=None))
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(
                      db=net_db, clock=FrozenClock(),
                      audit=kernel.audit,
                      provider=DeterministicTestProvider(),
                      cipher=TemplateCipher(
                          master_key_hex="ab" * 32),
                      policy=BiometricsPolicy(
                          require_liveness=False,
                          doc_reject=0.01,
                          doc_review=0.02,
                          doc_auto=0.03,
                          dup_reject=0.98))
                  caps = ZyraCapabilities(
                      net_db, FrozenClock(),
                      identity=kernel.identity,
                      signer=signer)
                  srv = serve_combined(
                      kernel, caps,
                      host="127.0.0.1", port=0)
                  threading.Thread(
                      target=srv.serve_forever,
                      daemon=True).start()
                  _time.sleep(0.3)
                  base = ("http://127.0.0.1:"
                          + str(srv.server_address[1]))

                  def post(ruta, doc):
                      data = _json.dumps(doc).encode()
                      req = urllib.request.Request(base + ruta, data=data, method="POST", headers={"Content-Type": "application/json"})
                      try:
                          with urllib.request.urlopen(req, timeout=15) as r:
                              return r.status, _json.loads(r.read().decode())
                      except urllib.error.HTTPError as e:
                          return e.code, _json.loads(e.read().decode())

                  try:
                      st, r1 = post("/identity/enroll", {"kind": "person", "display_name": "Pedro Ciclo", "actor": "test", "doc_image_b64": "cGVkcm8tZG9j", "selfie_image_b64": "cGVkcm8tc2VsZmll"})
                      assert st in (200, 201), str(st) + " " + str(r1)
                      zid = ((r1.get("data") or {}).get("identity") or {}).get("zid")
                      assert zid, str(r1)[:300]
                      kernel.identity.transition_identity(
                          zid, IdentityStatus.ACTIVE,
                          actor="test", reason="onboarding")
                      st, r2 = post("/identity/transition", {"zid": zid, "to_status": "DECEASED", "actor": "registrador", "reason": "acta de defuncion 2025-001"})
                      assert st in (200, 201), str(st) + " " + str(r2)[:300]
                      ident = kernel.identity.get_identity(zid)
                      assert (ident.status == IdentityStatus.DECEASED), str(ident)
                      with urllib.request.urlopen(base + "/verify-existence/" + zid, timeout=15) as r:
                          d = _json.loads(r.read().decode())
                      assert d["data"]["exists"] is True
                      assert d["data"]["status"] == "DECEASED"
                      assert d["data"]["active"] is False
                      bloq = False
                      try:
                          kernel.identity.transition_identity(
                              zid, IdentityStatus.ACTIVE,
                              actor="fraud", reason="intento")
                      except Exception:
                          bloq = True
                      assert bloq, "DECEASED debe ser terminal"
                      evs = net_db.query_all(
                          "SELECT event_type FROM events_outbox"
                          " WHERE aggregate_id = ?"
                          " ORDER BY created_at",
                          (zid,))
                      tipos = [str(r["event_type"]) for r in evs]
                      assert "identity.status_changed" in tipos, str(tipos)
                      print("OK AX-DEATH: ACTIVE -> DECEASED, terminal, verify-existence lo refleja, evento al outbox para el cartero")
                  finally:
                      srv.shutdown()
                      srv.server_close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          target.write_text(t, encoding="utf-8")
          final = target.read_text(encoding="utf-8")
          assert "test_death_lifecycle_deceased" in final
          print("OK 6: test death lifecycle (AST valido)")
          TSEOF

      - name: "Paso 7 - GATE Red"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -10

      - name: "Paso 8 - GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso 9 - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-DEATH"
            echo '```'
            python3 -m pytest shared_engines/runtime/tests/test_runtime_api.py::test_death_lifecycle_deceased -vv --tb=long 2>&1 | tail -70 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-DEATH: ciclo de vida completo - DECEASED + partida de defuncion en cadena" -m "La muerte no borra el ZID ni el historial: (1) IdentityStatus.DECEASED nuevo, terminal (desde ACTIVE/VERIFIED/SUSPENDED; ninguna salida - el fallecido no puede operar nunca mas), (2) register_death en LifeHistoryStore (patron add_life_event: evento death_registered anexado a la cadena inmodificable del ZID con fecha y detalle), (3) catalogo del outbox_bridge ampliado a 12 eventos (death_registered -> life.death.event) para que el cartero RED-8 lo reparta a apps suscritas (bancos cierran, seguros activan, censo se actualiza solo), (4) ruta POST /axis/death-register con guardia de rol (registrador/gobierno via authorize - misma ley que birth-register). Test e2e: enroll -> ACTIVE -> transition a DECEASED -> verify-existence publica lo refleja (active:false) -> transicion desde DECEASED bloqueada -> evento identity.status_changed en outbox. La frescura de datos (regla 21) y el expediente documents[] (RED-EXP) quedan como siguientes pasos."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
