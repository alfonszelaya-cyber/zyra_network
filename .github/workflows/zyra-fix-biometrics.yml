name: ZYRA LABORATORIO - Lote 5A (Fase 5 - simular, probar, comparar y optimizar EN VIVO)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar y aplicar lote (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_5a.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          reemplazar_verificado() {
            ruta="$1"; firma="$2"
            if [ ! -s "$ruta" ]; then
              echo "FALLO: $ruta no existe para reemplazo verificado"; exit 1
            fi
            if ! grep -qF "$firma" "$ruta"; then
              echo "FALLO: firma ausente en $ruta (contenido inesperado, NO se toca)"; exit 1
            fi
            cat > "$ruta"
            echo "REEMPLAZADO-VERIFICADO: $ruta"
            echo "$ruta|REEMPLAZADO" >> "$MANIFEST"
          }
          mkdir -p apps/laboratorio/domain apps/laboratorio/infrastructure/persistence apps/laboratorio/infrastructure/repositories apps/laboratorio/infrastructure/providers apps/laboratorio/application/use_cases apps/laboratorio/application/handlers apps/laboratorio/routers/api apps/laboratorio/services/reports
          echo "=== ANCLAS: service_registry.py ==="
          python3 - << 'PYANCHOR'
          from pathlib import Path
          p2 = Path("apps/laboratorio/registry/services/service_registry.py")
          c2 = p2.read_text(encoding="utf-8")
          a_imp = "from apps.laboratorio.application.handlers.world4d_handler import ManejadorCuatroD"
          assert a_imp in c2, "ancla import ausente en service_registry.py"
