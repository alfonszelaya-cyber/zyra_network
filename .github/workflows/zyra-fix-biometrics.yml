      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN D: GPT-3 comercializacion completa" -m "Ciclo listed->offered->paid->delivered->closed con ofertas (moneda unica, positivas), cierre descuenta inventario, resultados por productor, precios de mercado con snapshot real, exportaciones y shipments con engine zyra_network.logistics; usa SalesService/MarketService/ExportService/LogisticsAdapter/CommercialResults reales; guardia +10 ops; tests en archivo existente."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
