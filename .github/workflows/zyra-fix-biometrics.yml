name: "ZYRA RUN3d: A-2 frontera money en 4 services + N-7 riesgo unificado sobre motores reales"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] A-2: parche quirurgico money en los 4 services (fuentes reales de la auditoria)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, glob, os, pathlib, py_compile, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          SPECS = []
          SPECS.append((
              "apps/agro/modules/comercializacion/mercado/market_service.py",
              "from decimal import Decimal as _DEC,"
              " ROUND_HALF_UP\n"
              "from apps.agro.shared.money import D2 as"
              " _D2, safe_float as _sf\n\n\n",
              "class MarketService:",
              [
                  ('values = [float(p) for p in prices]',
                   'values = [_D2(p) for p in prices]'),
                  ('"minimum": min(values)',
                   '"minimum": _sf(min(values))'),
                  ('"maximum": max(values)',
                   '"maximum": _sf(max(values))'),
                  ('"average": sum(values) / len(values)',
                   '"average": _sf((sum(values)'
                   ' / _DEC(len(values))).quantize('
                   '_DEC("0.01"),'
                   ' rounding=ROUND_HALF_UP))'),
                  ('p = float(price or 0)',
                   'p = _sf(price or 0)'),
                  ('prices.append(float(r["price"]))',
                   'prices.append(_sf(r["price"]))'),
                  ('prices.append(float(r[0]))',
                   'prices.append(_sf(r[0]))'),
              ]))
          SPECS.append((
              "apps/agro/modules/comercializacion/venta_simple/simple_sale_service.py",
              "from apps.agro.shared.money import D2 as _D2,"
              " safe_float as _sf\n\n\n",
              "class SimpleSaleService:",
              [
                  ('amt = float(amount or 0)',
                   'amt = _sf(amount or 0)'),
                  ('"total": total,',
                   '"total": _sf(total),'),
                  ('(ts, total, sale_id)',
                   '(ts, _sf(total), sale_id)'),
              ]))
          SPECS.append((
              "apps/agro/modules/produccion/planificacion/planning_service.py",
              "from apps.agro.shared.money import safe_float"
              " as _sf, sum_money as _sum_money\n\n\n",
              "class ProductionPlanning:",
              [
                  ('amt = float(amount or 0)',
                   'amt = _sf(amount or 0)'),
                  ('by_currency.get(cur, 0.0) + amt',
                   '_sf(_sum_money([by_currency.get('
                   'cur, 0.0), amt]))'),
              ]))
          vfile = None
          for cand in glob.glob(
                  "apps/agro/modules/recursos_y_activos"
                  "/valoracion/*.py"):
              if "__init__" in cand:
                  continue
              try:
                  if "class AssetValuationService" in \
                          open(cand,
                               encoding="utf-8").read():
                      vfile = cand
                      break
              except Exception:
                  pass
          if vfile:
              SPECS.append((
                  vfile,
                  "from apps.agro.shared.money import"
                  " safe_float as _sf\n\n\n",
                  "class AssetValuationService:",
                  [
                      ('float(amount or 0), currency',
                       '_sf(amount or 0), currency'),
                      ('float(amount),',
                       '_sf(amount),'),
                  ]))
          else:
              out("- VALUACION: archivo no localizado"
                  " (glob valoracion/*)")

          for ruta, import_block, anchor, reemplazos in SPECS:
              p = pathlib.Path(ruta)
              try:
                  src = p.read_text(encoding="utf-8")
                  orig = src
                  notas = []
                  primera = import_block.strip(
                      ).splitlines()[0]
                  if primera not in src:
                      if anchor in src:
                          src = src.replace(
                              anchor,
                              import_block + anchor, 1)
                          notas.append("import")
                      else:
                          notas.append(
                              "anchor import no hallado")
                  n = 0
                  for old, new in reemplazos:
                      c = src.count(old)
                      if c == 0:
                          notas.append("sin match: "
                                       + old[:34])
                          continue
                      src = src.replace(old, new)
                      n += c
                  if n == 0 and "import" not in notas:
                      out("- " + p.name
                          + ": sin cambios (ya aplicado?)")
                      continue
                  try:
                      ast.parse(src)
                  except SyntaxError:
                      out("- **" + p.name
                          + ": ERROR sintaxis"
                            " (revertido)**")
                      continue
                  p.write_text(src, encoding="utf-8")
                  try:
                      py_compile.compile(ruta, doraise=True)
                      extra = (" + import"
                               if "import" in notas
                               else "")
                      out("- **" + p.name + ": OK ("
                          + str(n) + " reemplazos"
                          + extra + ")**")
                      for nt in notas:
                          if nt.startswith("sin match"):
                              out("  · " + nt)
                  except Exception:
                      p.write_text(orig,
                                   encoding="utf-8")
                      py_compile.compile(ruta,
                                         doraise=True)
                      out("- " + p.name
                          + ": fallo compile (revertido)")
              except Exception:
                  out("- " + ruta + ": EXCEPCION")
                  out("```\n"
                      + traceback.format_exc().strip()
                      + "\n```")
          exit(0)
          PYEOF

      - name: "[ESCRITURA] N-7: unified_risk_engine (compone los 15 motores reales + historial)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/nexo/domain/risk/unified_risk_engine.py",
                     D(r'''
                  """Unified Risk Engine (N-7) - scoring
                  unificado de riesgo sobre los MOTORES REALES
                  de NEXO (regla 69: los compone, no los
                  duplica): compliance, financial, operational,
                  country, supply chain, geopolitical, fraud,
                  sanctions (firmas verificadas en auditoria).

                  evaluate_entity(entity_ref, ...datos...):
                  - corre cada motor dueno con los datos
                    disponibles
                  - componente sin datos -> OMITIDO con razon
                    (regla 66); sin nada evaluable ->
                    ValueError
                  - score unificado = promedio ponderado
                    (weights opcionales) de los scores de
                    componentes, 0..100 entero (los motores
                    puntuan entero)
                  - level: CRITICAL >=80, HIGH >=60,
                    MEDIUM >=30, LOW
                  - cross-check con RiskScoringEngine real
                    via _fit_kwargs (se adapta a su firma)
                  - persistencia: nexo_risk_history
                    (historial por entidad — N-7)
                  - monitor: RiskMonitorEngine.register
                    (motor dueno del monitoreo)

                  entity_ref puede ser empresa/operacion/
                  activo/decision (riesgo -> cualquier
                  entidad referenciable).
                  Regla 76: ORDER BY rowid."""
                  from __future__ import annotations
                  import inspect as _insp
                  import json as _j
                  import uuid
                  from typing import Dict, List, Optional
                  from shared_engines.common.clocks import (
                      Clock)
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)
                  from apps.nexo.domain.risk.compliance_risk_engine import (
                      ComplianceRiskEngine)
                  from apps.nexo.domain.risk.country_risk_engine import (
                      CountryRiskEngine)
                  from apps.nexo.domain.risk.financial_risk_engine import (
                      FinancialRiskEngine)
                  from apps.nexo.domain.risk.fraud_detection_engine import (
                      FraudDetectionEngine)
                  from apps.nexo.domain.risk.geopolitical_risk_engine import (
                      GeopoliticalRiskEngine)
                  from apps.nexo.domain.risk.operational_risk_engine import (
                      OperationalRiskEngine)
                  from apps.nexo.domain.risk.risk_monitor_engine import (
                      RiskMonitorEngine)
                  from apps.nexo.domain.risk.risk_scoring_engine import (
                      RiskScoringEngine)
                  from apps.nexo.domain.risk.sanctions_engine import (
                      SanctionsEngine)
                  from apps.nexo.domain.risk.supply_chain_risk_engine import (
                      SupplyChainRiskEngine)

                  _PK = _insp.Parameter

                  def _fit_kwargs(func, desired):
                      """Solo pasa los kwargs que la firma REAL
                      acepta. ValueError si falta un
                      requerido."""
                      try:
                          params = _insp.signature(
                              func).parameters
                      except (TypeError, ValueError):
                          return dict(desired)
                      if any(p.kind == _PK.VAR_KEYWORD
                             for p in params.values()):
                          return dict(desired)
                      ok = set()
                      for n, p in params.items():
                          if p.kind in (
                                  _PK.POSITIONAL_OR_KEYWORD,
                                  _PK.KEYWORD_ONLY):
                              ok.add(n)
                      res = {k: v for k, v in
                             desired.items() if k in ok}
                      for n, p in params.items():
                          if (n != "self" and n not in res
                                  and p.default is _PK.empty
                                  and p.kind in (
                                      _PK.POSITIONAL_OR_KEYWORD,
                                      _PK.KEYWORD_ONLY)):
                              raise ValueError(
                                  "firma incompatible:"
                                  " falta " + str(n))
                      return res

                  _MIGRATIONS = (
                      Migration(1, "nexo_risk_history", (
                          "CREATE TABLE IF NOT EXISTS"
                          " nexo_risk_history (risk_id TEXT"
                          " PRIMARY KEY, entity_ref TEXT NOT"
                          " NULL, kind TEXT NOT NULL DEFAULT"
                          " 'UNIFIED', score INTEGER NOT NULL"
                          " DEFAULT 0, level TEXT NOT NULL"
                          " DEFAULT 'LOW', components_json"
                          " TEXT NOT NULL DEFAULT '{}',"
                          " payload_json TEXT NOT NULL DEFAULT"
                          " '{}', created_at REAL NOT NULL)",
                      )),
                  )

                  class UnifiedRiskEngine:
                      """Scoring unificado (N-7)."""

                      def __init__(self, db, clock,
                                   engines=None):
                          self._db = db
                          self._clock = clock
                          e = engines or {}
                          self._compliance = (
                              e.get("compliance")
                              or ComplianceRiskEngine())
                          self._sanctions = (
                              e.get("sanctions")
                              or SanctionsEngine())
                          self._financial = (
                              e.get("financial")
                              or FinancialRiskEngine())
                          self._operational = (
                              e.get("operational")
                              or OperationalRiskEngine())
                          self._country = (
                              e.get("country")
                              or CountryRiskEngine())
                          self._supply = (
                              e.get("supply")
                              or SupplyChainRiskEngine())
                          self._geo = (
                              e.get("geo")
                              or GeopoliticalRiskEngine())
                          self._fraud = (
                              e.get("fraud")
                              or FraudDetectionEngine())
                          self._scoring = (
                              e.get("scoring")
                              or RiskScoringEngine())
                          self._monitor = (
                              e.get("monitor")
                              or RiskMonitorEngine())
                          MigrationRunner(
                              db, "nexo.unifiedrisk",
                              _MIGRATIONS).run(clock)

                      @staticmethod
                      def level_of(score) -> str:
                          s = int(score)
                          if s >= 80:
                              return "CRITICAL"
                          if s >= 60:
                              return "HIGH"
                          if s >= 30:
                              return "MEDIUM"
                          return "LOW"

                      def _run(self, kind, engine, method,
                               desired, reasons):
                          try:
                              fn = getattr(engine, method)
                              kw = _fit_kwargs(
                                  fn, dict(desired))
                              res = fn(**kw)
                          except Exception as exc:
                              reasons.append(
                                  kind + ": "
                                  + str(exc)[:80])
                              return None
                          if (not isinstance(res, dict)) \
                                  or ("score" not in res):
                              reasons.append(
                                  kind + ": respuesta sin"
                                  " score")
                              return None
                          sc = int(res["score"])
                          return {"kind": kind,
                                  "score": sc,
                                  "level": str(res.get(
                                      "level",
                                      self.level_of(sc))),
                                  "risk_id": str(res.get(
                                      "risk_id", ""))}

                      def evaluate_entity(self, *,
                                          entity_ref,
                                          compliance_record=None,
                                          sanctions_result=None,
                                          entity_data=None,
                                          accounting_data=None,
                                          finance_data=None,
                                          logistics_data=None,
                                          operations_data=None,
                                          supplier_data=None,
                                          client_data=None,
                                          country_code="",
                                          geopolitical_data=None,
                                          geopolitical_events=None,
                                          weights=None) -> dict:
                          reasons = []
                          comps = []

                          def run(kind, engine, method,
                                  desired):
                              r = self._run(
                                  kind, engine, method,
                                  desired, reasons)
                              if r is not None:
                                  comps.append(r)

                          sr = sanctions_result
                          if compliance_record is not None:
                              if (sr is None
                                      and entity_data
                                      is not None):
                                  try:
                                      fn = \
                                          self._sanctions \
                                          .evaluate
                                      sr = fn(**_fit_kwargs(
                                          fn,
                                          {"entity_data":
                                           entity_data}))
                                  except Exception:
                                      sr = {}
                              if not isinstance(sr, dict):
                                  sr = {}
                              run("COMPLIANCE",
                                  self._compliance,
                                  "evaluate",
                                  {"compliance_record":
                                       compliance_record,
                                   "sanctions_result": sr})
                          if (accounting_data is not None
                                  and finance_data
                                  is not None):
                              run("FINANCIAL",
                                  self._financial,
                                  "evaluate",
                                  {"accounting_data":
                                       accounting_data,
                                   "finance_data":
                                       finance_data})
                          if (logistics_data is not None
                                  and operations_data
                                  is not None):
                              run("OPERATIONAL",
                                  self._operational,
                                  "evaluate",
                                  {"logistics_data":
                                       logistics_data,
                                   "operations_data":
                                       operations_data})
                          if str(country_code).strip():
                              gd = (geopolitical_data
                                    if geopolitical_data
                                    is not None else {})
                              sd = {"risk_score": 0}
                              if (isinstance(sr, dict)
                                      and "risk_score"
                                      in sr):
                                  sd = sr
                              run("COUNTRY",
                                  self._country, "evaluate",
                                  {"country_code":
                                       str(country_code),
                                   "geopolitical_data": gd,
                                   "sanctions_data": sd})
                          if (logistics_data is not None
                                  and supplier_data
                                  is not None):
                              run("SUPPLY_CHAIN",
                                  self._supply, "evaluate",
                                  {"logistics_data":
                                       logistics_data,
                                   "supplier_data":
                                       supplier_data})
                          if (str(country_code).strip()
                                  and geopolitical_events
                                  is not None):
                              run("GEOPOLITICAL",
                                  self._geo, "evaluate",
                                  {"country_code":
                                       str(country_code),
                                   "geopolitical_events":
                                       geopolitical_events})
                          if (client_data is not None
                                  and accounting_data
                                  is not None
                                  and operations_data
                                  is not None):
                              run("FRAUD", self._fraud,
                                  "detect",
                                  {"client_data":
                                       client_data,
                                   "accounting_data":
                                       accounting_data,
                                   "operations_data":
                                       operations_data})

                          if not comps:
                              raise ValueError(
                                  "sin componentes"
                                  " evaluables: "
                                  + ("; ".join(reasons)
                                     if reasons
                                     else "sin datos de"
                                          " entrada"))

                          wmap = {str(k): float(v)
                                  for k, v in (
                                      weights
                                      or {}).items()}
                          acc = 0.0
                          tot = 0.0
                          for c in comps:
                              w = wmap.get(c["kind"], 1.0)
                              acc += float(c["score"]) * w
                              tot += w
                          score = (int(round(acc / tot))
                                   if tot else 0)
                          score = max(0, min(100, score))
                          level = self.level_of(score)

                          engine_score = None
                          try:
                              desired = {}
                              for c in comps:
                                  desired[str(
                                      c["kind"]).lower()
                                      + "_risk"] = int(
                                      c["score"])
                              fn = self._scoring.calculate
                              kw = _fit_kwargs(fn, desired)
                              r2 = fn(**kw)
                              if (isinstance(r2, dict)
                                      and "score"
                                      in r2):
                                  engine_score = int(
                                      r2["score"])
                          except Exception:
                              engine_score = None

                          risk_id = ("UNI-"
                                     + uuid.uuid4()
                                     .hex[:12])
                          result = {
                              "risk_id": risk_id,
                              "entity_ref":
                                  str(entity_ref),
                              "score": score,
                              "level": level,
                              "components": comps,
                              "skipped": reasons,
                              "engine_score":
                                  engine_score,
                              "generated_at":
                                  self._clock.now()}
                          self._db.execute(
                              "INSERT INTO"
                              " nexo_risk_history"
                              " (risk_id, entity_ref,"
                              " kind, score, level,"
                              " components_json,"
                              " payload_json, created_at)"
                              " VALUES (?, ?, 'UNIFIED',"
                              " ?, ?, ?, ?, ?)",
                              (risk_id,
                               str(entity_ref), score,
                               level,
                               _j.dumps(comps,
                                        default=str),
                               _j.dumps(
                                   {"skipped": reasons,
                                    "engine_score":
                                        engine_score},
                                   default=str),
                               self._clock.now()))
                          try:
                              fn = self._monitor.register
                              fn(**_fit_kwargs(
                                  fn,
                                  {"risk_result":
                                   result}))
                              result["monitor_ok"] = True
                          except Exception:
                              result["monitor_ok"] = False
                          return result

                      def history_of(self,
                                     entity_ref) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT risk_id, kind, score,"
                              " level, components_json,"
                              " created_at FROM"
                              " nexo_risk_history WHERE"
                              " entity_ref = ? ORDER BY"
                              " rowid", (str(entity_ref),))
                          out = []
                          for r in rows:
                              try:
                                  comps = _j.loads(str(
                                      r["components_json"]))
                              except Exception:
                                  comps = []
                              out.append({
                                  "risk_id": str(
                                      r["risk_id"]),
                                  "kind": str(r["kind"]),
                                  "score": int(r["score"]),
                                  "level": str(r["level"]),
                                  "components": comps,
                                  "created_at": float(
                                      r["created_at"])})
                          return out

                      def worst_entities(self,
                                         limit=10) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT entity_ref,"
                              " MAX(score) AS worst,"
                              " COUNT(*) AS n FROM"
                              " nexo_risk_history GROUP BY"
                              " entity_ref ORDER BY worst"
                              " DESC, entity_ref LIMIT ?",
                              (int(limit),))
                          return [{
                              "entity_ref": str(
                                  r["entity_ref"]),
                              "worst": int(r["worst"]),
                              "n": int(r["n"])}
                              for r in rows]
              '''))
              out("## FIN nexo unified risk")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests A-2 + N-7"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          cat > apps/agro/tests/test_a2_money_conversiones.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.agro.shared.money import safe_float
          from apps.agro.modules.comercializacion.mercado.market_service import (
              MarketService, add_price_db, market_snapshot_db)
          from apps.agro.modules.comercializacion.venta_simple.simple_sale_service import (
              publish_sale_db, place_offer_db, accept_offer_db,
              pay_sale_db)
          from apps.agro.modules.produccion.planificacion.planning_service import (
              create_plan_db, add_plan_cost_db,
              plan_costs_summary_db)
          try:
              from apps.agro.modules.recursos_y_activos.valoracion.valuation_service import (
                  value_asset_db, latest_value_of_db)
          except ImportError:
              from apps.agro.modules.recursos_y_activos.valoracion.valuacion_service import (
                  value_asset_db, latest_value_of_db)


          def _db(tmp_path):
              return SQLiteAdapter(tmp_path / "m.db")


          def test_market_quantizado(tmp_path) -> None:
              db = _db(tmp_path)
              r = add_price_db(db, product="MAIZ",
                  price="10.005", actor="T")
              assert r["price"] == 10.01
              row = db.query_one(
                  "SELECT price FROM agro_market_prices"
                  " WHERE product = ?", ("MAIZ",))
              assert float(row["price"]) == 10.01
              add_price_db(db, product="MAIZ", price=20.0,
                  actor="T")
              snap = market_snapshot_db(db, "MAIZ")
              assert snap["minimum"] == 10.01
              assert snap["maximum"] == 20.0
              assert snap["average"] == 15.01
              s2 = MarketService().snapshot("FRIJOL",
                                            ["0.1", "0.2"])
              assert s2["average"] == 0.15
              assert s2["minimum"] == 0.1
              print("OK A-2 market: precio cuantizado 2d HALF_UP en escritura y lectura + promedio via Decimal (10.005->10.01, avg 15.005->15.01)")


          def test_ventas_ciclo_cuantizado(tmp_path) -> None:
              db = _db(tmp_path)
              pub = publish_sale_db(db, producer_id="P1",
                  product="MAIZ", quantity=10.0)
              sid = pub["sale_id"]
              of = place_offer_db(db, sale_id=sid,
                  buyer="B1", amount="99.999")
              assert of["amount"] == 100.0
              orow = db.query_one(
                  "SELECT amount FROM agro_sale_offers"
                  " WHERE offer_id = ?",
                  (of["offer_id"],))
              assert float(orow["amount"]) == 100.0
              acc = accept_offer_db(db,
                  offer_id=of["offer_id"], actor="T")
              assert acc["total"] == float(
                  f"{acc['total']:.2f}")
              pay = pay_sale_db(db, sale_id=sid, actor="T")
              t = pay["total"]
              assert t == float(f"{t:.2f}")
