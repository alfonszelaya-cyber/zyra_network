name: ZYRA S1 auditoria completa de subastas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography pillow
      - name: Auditoria SUBASTAS
        run: |
          python3 - <<'PYEOF'
          import json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SB = ROOT / 'apps' / 'subastas'
          OUT, DATA = [], {}
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 's1.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              escribe()
          sys.excepthook = _man
          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  with urllib.request.urlopen(q, timeout=15) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, '', str(e)
          add('# S1 - AUDITORIA SUBASTAS (solo lectura)')
          add('')
          add('## M1. Rutas que maneja server.py')
          add('')
          sp = SB / 'server.py'
          ls = txt(sp).splitlines()
          add('- server.py: %d lineas' % len(ls))
          rutas = []
          for i, l in enumerate(ls):
              if re.search(r'path\s*(==|\.startswith)\s*[\'"]', l):
                  rutas.append('%d: %s' % (i + 1, l.strip()[:130]))
          add('- %d rutas:' % len(rutas))
          add('```python')
          for r in rutas[:40]:
              add(r)
          add('```')
          DATA['rutas'] = len(rutas)
          add('')
          add('## M2. Registro propio de subastas (a neutralizar)')
          add('')
          reg = SB / 'registration_engine.py'
          if reg.exists():
              t = txt(reg)
              add('- registration_engine.py: %d lineas' % len(t.splitlines()))
              add('```python')
              for i, l in enumerate(t.splitlines()):
                  if re.search(r'def |pendiente|aprobado|estado', l, re.I):
                      add('%d: %s' % (i + 1, l.strip()[:130]))
              add('```')
          else:
              add('- registration_engine.py no existe')
          add('')
          add('## M3. Donde se genera el HTML con el nav y el registro')
          add('')
          for i, l in enumerate(ls):
              if re.search(r'(?i)(registrarme|por ley|nav|menu)', l) and ('html' in l.lower() or '<' in l or 'def ' in l):
                  add('%d: %s' % (i + 1, l.strip()[:140]))
          add('')
          add('## M4. En vivo: la pagina de MARKET')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                      'ZYRA_DATA_DIR': '/tmp/zs1', 'ZYRA_PORT': str(NP),
                      'SUPERAPP_DATA_DIR': '/tmp/ss1', 'PORT': str(PS),
                      'ZYRA_URL': BASE, 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 40:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s' % (vivo, spv))
          if spv:
              st, ct, cuerpo = pedir(BSP + '/subastas/')
              add('- GET /subastas/ -> %s (%s) %d bytes' % (st, ct[:20], len(cuerpo)))
              add('')
              add('### HTML actual (nav + registro + contenido):')
              add('```html')
              for i, l in enumerate(cuerpo.splitlines()[:100]):
                  add('%d: %s' % (i + 1, l.rstrip()[:150]))
              add('```')
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          Path('s1.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('S1 terminada')
          PYEOF
