name: "AXIS AX-4 paso 1: auditoria outbox_bridge + sync_pending (SOLO LECTURA, no modifica nada)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: axis-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: outbox_bridge.py COMPLETO"
        run: |
          python3 - <<'DUMP1EOF'
          from pathlib import Path
          p = Path("apps/axis/life_history/outbox_bridge.py")
          print("=== outbox_bridge.py ===")
          if p.exists():
              for i, l in enumerate(
                  p.read_text(encoding="utf-8").splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          else:
              print("NO EXISTE outbox_bridge.py; busco alternativas...")
              base = Path("apps/axis")
              for f in base.rglob("*.py"):
                  txt = f.read_text(encoding="utf-8",
                      errors="replace")
                  if "outbox" in txt.lower():
                      print("mencion en: " + str(f))
          DUMP1EOF

      - name: "Dump 2: firmas publicas de outbox_bridge + donde vive sync_pending"
        run: |
          python3 - <<'DUMP2EOF'
          import inspect
          try:
              from apps.axis.life_history import (
                  outbox_bridge as ob)
              print("=== outbox_bridge publico ===")
              for n in sorted(
                  a for a in dir(ob)
                  if not a.startswith("_")):
                  o = getattr(ob, n)
                  if inspect.isfunction(o) or inspect.isclass(o):
                      try:
                          print(n,
                              inspect.signature(o))
                      except Exception:
                          print(n, "(sin firma)")
                  else:
                      print(n, "=", repr(o)[:120])
          except Exception as e:
              print("import outbox_bridge fallo:", e)
          print()
          print("=== busqueda sync_pending en apps/axis ===")
          from pathlib import Path
          for f in Path("apps/axis").rglob("*.py"):
              txt = f.read_text(encoding="utf-8",
                  errors="replace")
              if "sync_pending" in txt:
                  for i, l in enumerate(
                      txt.splitlines(), 1):
                      if "sync_pending" in l:
                          print(str(f) + ":"
                              + str(i) + ": "
                              + l.strip())
          DUMP2EOF

      - name: "Dump 3: anclas en server.py (manejo de emergencias/outbox + api_post actual)"
        run: |
          python3 - <<'DUMP3EOF'
          from pathlib import Path
          lines = Path("apps/axis/server.py").read_text(
              encoding="utf-8").splitlines()
          pats = ["outbox", "emit", "emergency_create",
              "_emergency_create", "_emergency_dispatch"]
          print("=== anclas server.py ===")
          last = -1
          for pat in pats:
              for i, l in enumerate(lines):
                  if pat in l and i > last - 3:
                      a = max(0, i - 2)
                      b = min(len(lines), i + 4)
                      for n in range(a, b):
                          print(str(n + 1).rjust(5)
                              + ": " + lines[n])
                      print("---")
                      last = b
          print()
          print("=== _api_post actual (primeras 40 lineas) ===")
          ini = next((i for i, l in enumerate(lines)
              if "def _api_post" in l), None)
          if ini is not None:
              for n in range(ini, min(ini + 40,
                  len(lines))):
                  print(str(n + 1).rjust(5) + ": "
                      + lines[n])
          DUMP3EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
