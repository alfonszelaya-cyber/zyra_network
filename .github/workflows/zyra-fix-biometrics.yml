name: "RED-ID paso 1: auditoria identidad universal (SOLO LECTURA) - que campos de documento/pais existen hoy + verificar contracts.py"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 0: contracts.py compila? (verificar la linea 14 vista en el dump anterior)"
        run: |
          python3 -c "
          from shared_engines.events.contracts import (
              Event, EventCatalog)
          print('OK contracts compila (linea 14 era artefacto del dump)')
          "

      - name: "Dump 1: identity/contracts.py + engine.py (esquema de identidad: campos del enroll)"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          for n in ("shared_engines/identity/contracts.py",
                    "shared_engines/identity/engine.py"):
              p = Path(n)
              print()
              print("=== " + n + " ===")
              if p.exists():
                  for i, l in enumerate(
                      p.read_text(
                          encoding="utf-8").splitlines(), 1):
                      print(str(i).rjust(4) + ": " + l)
              else:
                  print("NO EXISTE")
          D1EOF

      - name: "Dump 2: portable_profile.py completo (donde probablemente viven los campos del ID: country/doc_number/age)"
        run: |
          python3 - <<'D2EOF'
          from pathlib import Path
          p = Path(
              "shared_engines/network/"
              "portable_profile.py")
          print("=== portable_profile.py ===")
          if p.exists():
              for i, l in enumerate(
                  p.read_text(
                      encoding="utf-8").splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          else:
              print("NO EXISTE")
          D2EOF

      - name: "Dump 3: tablas de identidad reales (esquema vivo: identities, profiles, fields)"
        run: |
          python3 - <<'D3EOF'
          from shared_engines.storage.database import (
              SQLiteAdapter)
          from shared_engines.common.clocks import (
              FrozenClock)
          from shared_engines.identity.engine import (
              IdentityEngine)
          from shared_engines.audit.chain import (
              AuditTrail)
          from shared_engines.events.outbox import (
              Outbox)
          from shared_engines.events.contracts import (
              EventCatalog)
          db = SQLiteAdapter(":memory:")
          clock = FrozenClock()
          audit = AuditTrail(db, clock)
          outbox = Outbox(db, clock)
          outbox.ensure_schema()
          catalog = EventCatalog()
          for et in ("identity.registered",
                     "identity.status_changed"):
              catalog.register(et)
          IdentityEngine(
              db=db, clock=clock,
              audit=audit, outbox=outbox,
              catalog=catalog)
          cols = db.query_all(
              "SELECT name FROM sqlite_master"
              " WHERE type='table'")
          print("=== TODAS las tablas creadas por identity ===")
          for c in cols:
              tn = str(c["name"])
              print()
              print("-- " + tn)
              info = db.query_all(
                  "PRAGMA table_info(" + tn + ")")
              for r in info:
                  print("   "
                        + str(r["name"]) + " "
                        + str(r["type"]))
          D3EOF

      - name: "Dump 4: enroll HTTP real (que campos acepta el body hoy)"
        run: |
          python3 - <<'D4EOF'
          from pathlib import Path
          p = Path("shared_engines/runtime/api.py")
          lines = p.read_text(
              encoding="utf-8").splitlines()
          ini = None
          for i, l in enumerate(lines, 1):
              if ("identity" in l and "enroll" in l):
                  ini = i
                  break
          if ini:
              for n in range(max(0, ini - 3),
                             min(len(lines),
                                 ini + 45)):
                  print(str(n + 1).rjust(5)
                        + ": " + lines[n])
          else:
              print("enroll no esta en api.py; busco en runtime:")
              for f in Path(
                  "shared_engines/runtime"
              ).rglob("*.py"):
                  txt = f.read_text(
                      encoding="utf-8")
                  if '"enroll"' in txt:
                      print("  esta en: " + str(f))
          D4EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
