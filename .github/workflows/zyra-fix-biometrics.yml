      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (Bloque 7 v3): Live Commerce - E2E con errores esperados manejados" -m "Expected-error steps (non-host start, host bid, low bid) now use try/except pattern (same as Bloque 2 anti-fraud). System was correct all along: 400 responses were the expected rejections. Full 12-step lifecycle verified."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
