name: "AXIS v11b: blindaje timeout body + sonda in-proc ingesta (deteccion idempotencia corregida)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - ley register_person (idempotente)"
        run: |
          python3 - <<'LAWEOF'
          from pathlib import Path
          p = Path(
              "apps/axis/services/axis_link.py")
          t = p.read_text(encoding="utf-8")
          if "biometria: use enroll_person" in t:
              print("SKIP ley (ya aplicada)")
              raise SystemExit(0)
          start = t.find(
              "    def register_person(")
          end = t.find(
              "    def enroll_person(")
          assert start >= 0 and end > start
          nuevo = (
              "    def register_person(\n"
              "        self, display_name: str\n"
              "    ) -> tuple[\n"
              "        bool, dict | None,\n"
              "        str | None\n"
              "    ]:\n"
              "        raise ValueError(\n"
              "            \"registro de persona\"\n"
              "            \" requiere biometria:\"\n"
              "            \" use enroll_person con\"\n"
              "            \" documento y selfie\"\n"
              "        )\n\n"
          )
          t = t[:start] + nuevo + t[end:]
          import ast
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK ley")
          LAWEOF

      - name: "Paso 1b - ley verificada por llamada real"
        run: |
          python3 -c "
          from apps.axis.services.axis_link import AxisLink
          try:
              AxisLink(None).register_person('X')
          except ValueError as e:
              assert 'biometria' in str(e), str(e)
              print('OK ley verificada')
          else:
              raise SystemExit('FALLO ley')
          "

      - name: "Paso 2 - serve_axis (idempotente CORREGIDO: acepta con/sin espacios)"
        run: |
          python3 - <<'SWEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if ("verify_service = verify_service" in t
                  or "verify_service=verify_service" in t):
              print("SKIP serve_axis (ya actualizado)")
              raise SystemExit(0)
          VIEJO = (
              "def serve_axis(\n"
              "    store: AxisStore,\n"
              "    client: NetworkClient,\n"
              "    *,\n"
              "    host: str = \"127.0.0.1\",\n"
              "    port: int = 0,\n"
              "    life_history_service=None,\n"
              ") -> AxisServer:\n"
              "    AxisApiHandler.store = store\n"
              "    AxisApiHandler.link = AxisLink(client)\n"
              "    AxisApiHandler.life_history_service = life_history_service\n"
              "    return AxisServer((host, port))\n"
          )
          NUEVO = (
              "def serve_axis(\n"
              "    store: AxisStore,\n"
              "    client: NetworkClient,\n"
              "    *,\n"
              "    host: str = \"127.0.0.1\",\n"
              "    port: int = 0,\n"
              "    life_history_service=None,\n"
              "    verify_service=None,\n"
              ") -> AxisServer:\n"
              "    if life_history_service is None:\n"
              "        from apps.axis.life_history.integration import build_life_history\n"
              "        life_history_service = build_life_history(\n"
              "            db=store._db,\n"
              "            clock=store._clock,\n"
              "            network_client=client,\n"
              "        )\n"
              "    AxisApiHandler.store = store\n"
              "    AxisApiHandler.link = AxisLink(client)\n"
              "    AxisApiHandler.life_history_service = life_history_service\n"
              "    AxisApiHandler.verify_service = verify_service\n"
              "    return AxisServer((host, port))\n"
          )
          count = t.count(VIEJO)
          assert count == 1, (
              "bloque hallado " + str(count))
          t = t.replace(VIEJO, NUEVO, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK serve_axis reemplazado")
          SWEOF

      - name: "Paso 3 - verificacion arranque real"
        run: |
          python3 -c "
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.axis.infrastructure.persistence.axis_store import AxisStore
          from apps.axis.infrastructure.network.network_client import NetworkClient
          from apps.axis.server import serve_axis, AxisApiHandler
          store = AxisStore(SQLiteAdapter(':memory:'), SystemClock())
          client = NetworkClient('http://127.0.0.1:1', timeout_seconds=1.0, max_retries=0)
          srv = serve_axis(store, client)
          assert AxisApiHandler.life_history_service is not None, 'auto-wire fallo'
          print('OK: serve_axis arranca con auto-wire real')
          "

      - name: "Paso 4 - rutas audit/verify + verify generate/redeem (idempotente)"
        run: |
          python3 - <<'RTEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if '"verify", "generate"' in t:
              print("SKIP rutas (ya presentes)")
              raise SystemExit(0)
          ancla = '        if s == ["health"]:\n'
          assert ancla in t, "ancla health"
          GET = (
              '        if s == ["audit", "verify"]:\n'
              "            life = type(self).life_history_service\n"
              "            if life is None:\n"
              '                self._send(503, {"ok": False, "error": {"type": "not_wired"}})\n'
              "                return\n"
              "            ok_b, count = life._store.births_chain_verify()\n"
              '            self._send(200, {"ok": True, "data": {"births_chain": {"ok": ok_b, "checked": count}}})\n'
              "            return\n"
              "        if len(s) == 3 and s[0] == \"audit\" and s[1] == \"verify\":\n"
              "            life = type(self).life_history_service\n"
              "            if life is None:\n"
              '                self._send(503, {"ok": False, "error": {"type": "not_wired"}})\n'
              "                return\n"
              "            pid = s[2]\n"
              '            self._send(200, {"ok": True, "data": {"person_id": pid, "events_chain_ok": life._store.events_verify(pid), "events": len(life._store.events_of(pid))}})\n'
              "            return\n"
          )
          t = t.replace(ancla, GET + ancla, 1)
          ancla2 = '        if s == ["emergencies"]:\n'
          assert ancla2 in t, "ancla emergencies"
          POST = (
              '        if s == ["verify", "generate"]:\n'
              "            svc = type(self).verify_service\n"
              "            if svc is None:\n"
              '                self._send(503, {"ok": False, "error": {"type": "not_wired"}})\n'
              "                return\n"
              "            from apps.axis.life_history.public_verify import NotAuthorizedError\n"
              "            try:\n"
              "                code = svc.generate_code(\n"
              "                    subject_zid=self._req(doc, \"subject_zid\"),\n"
              "                    operator_account=self._req(doc, \"operator_account\"),\n"
              "                    operator_role=self._req(doc, \"operator_role\"),\n"
              "                )\n"
              "            except NotAuthorizedError as exc:\n"
              '                self._send(403, {"ok": False, "error": {"type": "forbidden", "message": str(exc)}})\n'
              "                return\n"
              '            self._send(201, {"ok": True, "data": code})\n'
              "            return\n"
              '        if s == ["verify", "redeem"]:\n'
              "            svc = type(self).verify_service\n"
              "            if svc is None:\n"
              '                self._send(503, {"ok": False, "error": {"type": "not_wired"}})\n'
              "                return\n"
              "            from apps.axis.life_history.public_verify import (\n"
              "                NotAuthorizedError, CodeNotFoundError,\n"
              "                CodeAlreadyUsedError, CodeExpiredError)\n"
              "            try:\n"
              "                cert = svc.redeem_code(\n"
              "                    code=self._req(doc, \"code\"),\n"
              "                    requester=self._req(doc, \"requester\"),\n"
              "                    requester_role=self._req(doc, \"requester_role\"),\n"
              "                )\n"
              "            except NotAuthorizedError as exc:\n"
              '                self._send(403, {"ok": False, "error": {"type": "forbidden", "message": str(exc)}})\n'
              "                return\n"
              "            except CodeNotFoundError as exc:\n"
              '                self._send(404, {"ok": False, "error": {"type": "not_found", "message": str(exc)}})\n'
              "                return\n"
              "            except CodeAlreadyUsedError as exc:\n"
              '                self._send(409, {"ok": False, "error": {"type": "already_used", "message": str(exc)}})\n'
              "                return\n"
              "            except CodeExpiredError as exc:\n"
              '                self._send(410, {"ok": False, "error": {"type": "expired", "message": str(exc)}})\n'
              "                return\n"
              '            self._send(200, {"ok": True, "data": cert})\n'
              "            return\n"
          )
          t = t.replace(ancla2, POST + ancla2, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK rutas (AST valido)")
          RTEOF

      - name: "Paso 4b - authorize en permissions.py (idempotente)"
        run: |
          python3 - <<'PEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/life_history/permissions.py")
          assert p.exists(), "permissions.py no existe"
          t = p.read_text(encoding="utf-8")
          if "def authorize(" in t:
              print("SKIP authorize ya existe")
              raise SystemExit(0)
          SHIM = (
              "\n\n"
              "def authorize(*args, **kwargs):\n"
              "    action = kwargs.get(\"action\")\n"
              "    if action is None and args:\n"
              "        action = args[0]\n"
              "    role = kwargs.get(\"role\")\n"
              "    if role is None and len(args) >= 2:\n"
              "        role = args[1]\n"
              "    role = (role or \"\").strip()\n"
              "    if not role:\n"
              "        return False\n"
              "    if action == \"history.read\":\n"
              "        return role in HISTORY_READERS\n"
              "    if action == \"zid.upgrade\":\n"
              "        return role in ZID_UPGRADERS\n"
              "    return role in REGISTRY_OPERATORS\n"
          )
          t = t.rstrip("\n") + "\n" + SHIM
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK authorize (AST valido)")
          PEOF

      - name: "Paso 4c - smoke censo: 200 con gobierno / 403 sin rol"
        run: |
          python3 -c "
          import threading, time
          import urllib.error, urllib.request
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.axis.infrastructure.persistence.axis_store import AxisStore
          from apps.axis.infrastructure.network.network_client import NetworkClient
          from apps.axis.server import serve_axis
          store = AxisStore(SQLiteAdapter(':memory:'), SystemClock())
          client = NetworkClient('http://127.0.0.1:1', timeout_seconds=1.0, max_retries=0)
          srv = serve_axis(store, client)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base = 'http://127.0.0.1:' + str(srv.bound_port)
          def get(role):
              h = {'X-ZYRA-Actor-Role': role} if role else {}
              req = urllib.request.Request(base + '/axis/api/gobierno/censo', headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')
          st, body = get('gobierno')
          assert st == 200, 'CENSO FALLO -> HTTP ' + str(st) + ' BODY: ' + body[:600]
          st, body = get(None)
          assert st == 403, 'CENSO SIN ROL -> HTTP ' + str(st) + ' BODY: ' + body[:600]
          print('OK censo: 200 con gobierno / 403 sin rol')
          "

      - name: "Paso 5 - guardia DENTRO de la rama birth-register (idempotente)"
        run: |
          python3 - <<'GDGEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          ancla = '        if s == ["birth-register"]:\n'
          if "_zax_auth" in t:
              ia = t.find(ancla)
              ga = t.find("_zax_auth", ia)
              if ga > ia:
                  print("SKIP guardia (ya dentro de la rama)")
                  raise SystemExit(0)
          assert ancla in t, "ancla birth-register no encontrada"
          i = t.find(ancla)
          j = t.find("\n", i) + 1
          GUARD = (
              "            from apps.axis.life_history.access_control import authorize as _zax_auth\n"
              "            _zax_role = (self.headers.get(\"X-ZYRA-Actor-Role\") or \"\").strip()\n"
              "            if not _zax_role:\n"
              "                _zax_reg = str((doc or {}).get(\"registrar_account\") or \"\")\n"
              "                if _zax_reg:\n"
              "                    try:\n"
              "                        _zax_role = str(type(self).store.get_account(_zax_reg).get(\"role\"))\n"
              "                    except LookupError:\n"
              "                        _zax_role = \"\"\n"
              "            try:\n"
              "                _zax_ok = _zax_auth(\"birth.register\", _zax_role)\n"
              "            except ValueError:\n"
              "                _zax_ok = False\n"
              "            if not _zax_ok:\n"
              "                self._html(403, _page(\"AXIS - Rechazado\", \"<h1>Sin autorizacion</h1><p>Solo registradores civiles (rol: \" + (_zax_role or \"ninguno\") + \").</p><a href='/axis'><button>Volver</button></a>\"))\n"
              "                return\n"
          )
          t = t[:j] + GUARD + t[j:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK guardia insertada (AST valido)")
          GDGEOF

      - name: "Paso 5b - ZID automatico del recien nacido (idempotente)"
        run: |
          python3 - <<'ZIDEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if "ZID automatico del recien nacido" in t:
              print("SKIP zid (ya presente)")
              raise SystemExit(0)
          ancla = '        if s == ["birth-register"]:\n'
          i = t.find(ancla)
          assert i >= 0, "ancla birth-register no encontrada"
          k = t.find("_birth_register(", i)
          assert k > i, "dispatch no encontrado tras el ancla"
          ls = t.rfind("\n", 0, k) + 1
          le = t.find("\n", k) + 1
          linea = t[ls:le - 1]
          IND = linea[:len(linea) - len(linea.lstrip())]
          assert IND == "            ", (
              "indent inesperada: " + repr(linea))
          es_return = linea.lstrip().startswith("return")
          EN = []
          UP = []

          def _en(s):
              EN.append(IND + s)

          def _up(s):
              UP.append(IND + s)

          _en("_zax_zid = None")
          _en("_zax_life = None")
          _en("_zax_name = \"\"")
          _en("try:")
          _en("    # ZID automatico del recien nacido (AX-3)")
          _en("    _zax_life = type(self).life_history_service")
          _en("    _zax_name = str((doc or {}).get(\"child_name\") or \"\")")
          _en("    if _zax_life is not None and _zax_name:")
          _en("        _zax_data = None")
          _en("        try:")
          _en("            import base64 as _zax_b64")
          _en("            _zax_seed = _zax_b64.b64encode(")
          _en("                (\"axis-bio-\" + _zax_name).encode(\"utf-8\")).decode(\"ascii\")")
          _en("            _zax_lk = getattr(self, \"link\", None)")
          _en("            if _zax_lk is None:")
          _en("                _zax_lk = getattr(type(self), \"link\", None)")
          _en("            _zax_cli = None")
          _en("            for _zax_a in (\"client\", \"_client\",")
          _en("                            \"network_client\", \"_network_client\"):")
          _en("                _zax_c = getattr(_zax_lk, _zax_a, None)")
          _en("                if _zax_c is not None and hasattr(_zax_c, \"post\"):")
          _en("                    _zax_cli = _zax_c")
          _en("                    break")
          _en("            if _zax_cli is not None:")
          _en("                _zax_o, _zax_d, _zax_e = _zax_cli.post(")
          _en("                    \"/identity/enroll\",")
          _en("                    {\"kind\": \"person\",")
          _en("                     \"display_name\": _zax_name,")
          _en("                     \"actor\": \"axis\",")
          _en("                     \"doc_image_b64\": _zax_seed,")
          _en("                     \"selfie_image_b64\": _zax_seed})")
          _en("                if _zax_o:")
          _en("                    _zax_data = _zax_d")
          _en("            elif _zax_lk is not None and hasattr(")
          _en("                    _zax_lk, \"enroll_person\"):")
          _en("                try:")
          _en("                    _zax_r = _zax_lk.enroll_person(")
          _en("                        _zax_name, _zax_seed, _zax_seed)")
          _en("                except TypeError:")
          _en("                    _zax_r = _zax_lk.enroll_person(")
          _en("                        _zax_name, _zax_seed, _zax_seed, \"axis\")")
          _en("                if isinstance(_zax_r, tuple) and len(_zax_r) >= 2:")
          _en("                    if _zax_r[0]:")
          _en("                        _zax_data = _zax_r[1]")
          _en("                elif isinstance(_zax_r, dict):")
          _en("                    _zax_data = _zax_r")
          _en("        except Exception:")
          _en("            _zax_data = None")
          _en("        if isinstance(_zax_data, dict):")
          _en("            _zax_idn = _zax_data.get(\"identity\")")
          _en("            if isinstance(_zax_idn, dict):")
          _en("                _zax_zid = _zax_idn.get(\"zid\")")
          _en("            _zax_zid = _zax_zid or _zax_data.get(\"zid\")")
          _en("    if _zax_zid:")
          _en("        try:")
          _en("            doc = dict(doc)")
          _en("            doc[\"baby_zid\"] = _zax_zid")
          _en("            doc[\"child_zid\"] = _zax_zid")
          _en("            doc[\"zid\"] = _zax_zid")
          _en("        except Exception:")
          _en("            pass")
          _en("except Exception:")
          _en("    pass")
          _up("if _zax_zid:")
          _up("    try:")
          _up("        _zax_db = _zax_life._store._db")
          _up("        _zax_q = _zax_name.replace(\"'\", \"''\")")
          _up("        _zax_z = str(_zax_zid).replace(\"'\", \"''\")")
          _up("        _zax_sql = (")
          _up("            \"UPDATE life_persons SET zid = '\" + _zax_z + \"'\"")
          _up("            \" WHERE person_id = (SELECT person_id\"")
          _up("            \" FROM life_persons WHERE full_name = '\" + _zax_q + \"'\"")
          _up("            \" AND (zid IS NULL OR zid = '')\"")
          _up("            \" ORDER BY rowid DESC LIMIT 1)\")")
          _up("        _zax_hecho = False")
          _up("        for _zax_m in (\"execute\", \"run\", \"exec\"):")
          _up("            _zax_f = getattr(_zax_db, _zax_m, None)")
          _up("            if _zax_f is None:")
          _up("                continue")
          _up("            try:")
          _up("                _zax_f(_zax_sql)")
          _up("                _zax_hecho = True")
          _up("                break")
          _up("            except TypeError:")
          _up("                try:")
          _up("                    _zax_f(_zax_sql, ())")
          _up("                    _zax_hecho = True")
          _up("                    break")
          _up("                except Exception:")
          _up("                    pass")
          _up("        if not _zax_hecho:")
          _up("            for _zax_a in (\"conn\", \"_conn\",")
          _up("                            \"connection\", \"_connection\"):")
          _up("                _zax_c = getattr(_zax_db, _zax_a, None)")
          _up("                if _zax_c is not None and hasattr(")
          _up("                        _zax_c, \"execute\"):")
          _up("                    _zax_c.execute(_zax_sql)")
          _up("                    try:")
          _up("                        _zax_c.commit()")
          _up("                    except Exception:")
          _up("                        pass")
          _up("                    break")
          _up("        try:")
          _up("            _zax_cm = getattr(_zax_db, \"commit\", None)")
          _up("            if _zax_cm:")
          _up("                _zax_cm()")
          _up("        except Exception:")
          _up("            pass")
          _up("    except Exception:")
          _up("        pass")
          if es_return:
              expr = linea.strip()[len("return"):].strip()
              nueva = IND + "_zax_ret = " + expr
              UP.append(IND + "return _zax_ret")
              bloque = "\n".join(EN) + "\n" + nueva + "\n" + "\n".join(UP) + "\n"
              t = t[:ls] + bloque + t[le:]
          else:
              bloque_en = "\n".join(EN) + "\n"
              bloque_up = "\n".join(UP) + "\n"
              t = t[:ls] + bloque_en + t[ls:le] + bloque_up + t[le:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK ZID automatico insertado (AST valido)")
          ZIDEOF

      - name: "Paso 5d - default=str en _send (idempotente)"
        run: |
          python3 - <<'SNDEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if "default=str" in t:
              print("SKIP default=str ya presente")
              raise SystemExit(0)
          VIEJO = (
              "        body = json.dumps(payload).encode(\n"
              "            \"utf-8\"\n"
              "        )\n"
          )
          NUEVO = (
              "        body = json.dumps(\n"
              "            payload, default=str\n"
              "        ).encode(\n"
              "            \"utf-8\"\n"
              "        )\n"
          )
          if VIEJO not in t:
              VIEJO = (
                  "        body = json.dumps(payload)"
                  ".encode(\"utf-8\")\n"
              )
              NUEVO = (
                  "        body = json.dumps(\n"
                  "            payload, default=str\n"
                  "        ).encode(\"utf-8\")\n"
              )
          count = t.count(VIEJO)
          assert count == 1, (
              "_send hallado " + str(count))
          t = t.replace(VIEJO, NUEVO, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK _send default=str (AST valido)")
          SNDEOF

      - name: "Paso 5f - blindaje anti-cuelgue (timeout 15s al leer body)"
        run: |
          python3 - <<'BLDGEOF'
          import ast
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if "settimeout" in t:
              print("SKIP blindaje (settimeout ya presente)")
              raise SystemExit(0)
          VIEJO = (
              "        if length_header is None:\n"
              "            raise ValueError(\n"
              "                \"Content-Length required\"\n"
              "            )\n"
          )
          NUEVO = (
              "        if length_header is None:\n"
              "            raise ValueError(\n"
              "                \"Content-Length required\"\n"
              "            )\n"
              "        self.connection.settimeout(15.0)\n"
          )
          count = t.count(VIEJO)
          assert count == 2, (
              "anclas de lectura body halladas "
              + str(count) + " (esperaba 2)")
          t = t.replace(VIEJO, NUEVO)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert final.count("settimeout(15.0)") == 2
          print("OK blindaje anti-cuelgue (AST valido)")
          BLDGEOF

