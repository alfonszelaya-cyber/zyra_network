            [ "$(cat /tmp/$f 2>/dev/null || echo 1)" = "0" ] || ok=0
          done
          if [ "$ok" != "1" ]; then
            log "**ID-b BLOQUEADA — revert automatico (los 4 engines nuevos se eliminan; nada existente tocado)**"
