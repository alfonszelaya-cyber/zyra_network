/*ZYRA-REVE v1 - nucleo de registro revE (paso 1 tranquilo: sin errores al escribir y sin salto automatico; pasos por clase como la base)*/
(function(){
'use strict';
var W = (typeof window!=='undefined')?window:this;
if (W.__ZYRA_REVE__) { return; }
W.__ZYRA_REVE__ = 'E';

/* ================= utilidades de texto ================= */
function $(id){ try{ return (typeof document!=='undefined')?document.getElementById(id):null; }catch(e){ return null; } }
function log(){ try{ var a=['[ZYRA-REVE]']; for(var i=0;i<arguments.length;i++){ a.push(arguments[i]); } console.log.apply(console,a); }catch(e){} }

function norm(s){
  var t=(s==null?'':String(s)).toUpperCase();
  t=t.replace(/[ÁÀÄÂ]/g,'A').replace(/[ÉÈËÊ]/g,'E').replace(/[ÍÌÏÎ]/g,'I').replace(/[ÓÒÖÔ]/g,'O').replace(/[ÚÙÜÛ]/g,'U').replace(/Ñ/g,'N');
  return t.replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  a=(a==null?'':String(a)); b=(b==null?'':String(b));
  var n=a.length, m=b.length;
  if(!n){ return m; } if(!m){ return n; }
  var i,j,prev=new Array(m+1),cur=new Array(m+1);
  for(j=0;j<=m;j++){ prev[j]=j; }
  for(i=1;i<=n;i++){
    cur[0]=i;
    for(j=1;j<=m;j++){
      var c=(a.charAt(i-1)===b.charAt(j-1))?0:1;
      var v=prev[j]+1;
      if(cur[j-1]+1<v){ v=cur[j-1]+1; }
      if(prev[j-1]+c<v){ v=prev[j-1]+c; }
      cur[j]=v;
    }
    for(j=0;j<=m;j++){ prev[j]=cur[j]; }
  }
  return prev[m];
}
function simPar(a,b){ a=norm(a); b=norm(b); if(!a||!b){ return 0; } return 1-(lev(a,b)/Math.max(a.length,b.length)); }
function simNombres(a,b){
  a=norm(a); b=norm(b);
  if(!a||!b){ return 0; }
  var s1=simPar(a,b);
  var ta=a.split(' ').filter(function(x){ return x.length>1; });
  var tb=b.split(' ').filter(function(x){ return x.length>1; });
  var s2=0;
  if(ta.length&&tb.length){
    var corto=(ta.length<=tb.length)?ta:tb;
    var largo=(ta.length<=tb.length)?tb:ta;
    var tot=0,i,j;
    for(i=0;i<corto.length;i++){
      var mejor=0;
      for(j=0;j<largo.length;j++){ var v=simPar(corto[i],largo[j]); if(v>mejor){ mejor=v; } }
      tot+=mejor;
    }
    s2=tot/corto.length;
  }
  return Math.max(s1,s2);
}

/* ================= MRZ y nombre ================= */
function mrzLineas(t){
  var out=[], lines=(t||'').split(/[\r\n]+/), i;
  for(i=0;i<lines.length;i++){
    var l=lines[i].replace(/[\s.]/g,'').toUpperCase();
    if(l.length>=20 && /^[A-Z0-9<]+$/.test(l) && l.indexOf('<<')>=0){ out.push(l); }
  }
  return out;
}
function mrzNombres(t){
  var res=[], vistos={}, ls=mrzLineas(t), i;
  function push(nombre){
    nombre=norm(nombre);
    if(nombre && nombre.length>=3 && !vistos[nombre]){ vistos[nombre]=1; res.push(nombre); }
  }
  for(i=0;i<ls.length;i++){
    var l=ls[i], m;
    m=l.match(/^P<([A-Z]{0,3})([A-Z]{2,})<<([A-Z<]*)/);
    if(m){ push(m[2]+' '+(m[3]||'')); }
    m=l.match(/^P<([A-Z]{0,3}?)([A-Z]{2,})<<([A-Z<]*)/);
    if(m){ push(m[2]+' '+(m[3]||'')); }
    m=l.match(/^([A-Z]{2,})<<([A-Z<]*)/);
    if(m){ push(m[1]+' '+(m[2]||'')); }
    m=l.match(/([A-Z]{2,})<<([A-Z<]{2,})/);
    if(m){ push(m[1]+' '+(m[2]||'')); }
  }
  return res;
}
function nombreDeTexto(t){
  var T=(t||'').toUpperCase(), cand=[], m, i;
  var re=/(NOMBRES?|APELLIDOS?|NAMES?|SURNAME)\s*[:\.\-]?\s*((?:[A-ZÁÉÍÓÚÜÑ][A-ZÁÉÍÓÚÜÑ]{1,15})(?:[\s\.]+[A-ZÁÉÍÓÚÜÑ][A-ZÁÉÍÓÚÜÑ]{1,15}){0,4})/g;
  while((m=re.exec(T))!==null){ if(m[2]){ cand.push(m[2]); } }
  cand=cand.concat(mrzNombres(T));
  var lines=T.split(/[\r\n]+/);
  for(i=0;i<lines.length;i++){
    var w=lines[i].replace(/[^A-ZÁÉÍÓÚÜÑ ]/g,' ').trim().split(/\s+/).filter(function(x){ return x.length>=3; });
    if(w.length>=2 && w.length<=4){ cand.push(w.join(' ')); }
  }
  return cand;
}
function nombreCoincide(escrito, textoDoc){
  var cand=nombreDeTexto(textoDoc);
  if(!cand.length){ return {ok:false, leido:'', punt:0, hay:false}; }
  var best=0, bs='';
  for(var i=0;i<cand.length;i++){ var v=simNombres(escrito,cand[i]); if(v>best){ best=v; bs=cand[i]; } }
  return {ok:best>=0.60, leido:bs, punt:best, hay:true};
}

/* ================= deteccion de lado ================= */
function detectarLado(texto, tieneCara){
  var t=(texto||'').toUpperCase();
  var rev=0, fre=0, i;
  var lt=(t.match(/</g)||[]).length;
  if(lt>=6){ return 'reverso'; }
  if(/PDF4I?7/.test(t.replace(/\s/g,''))){ rev+=2.5; }
  var RVs=['DOMICILIO','DIRECCION','DIRECCIÓN','COLONIA','BARRIO','RESIDENCIA','CASERIO','CANTON','ALDEA','SECTOR','OBSERVACION','OBSERVACIÓN','DONANTE','GRUPO SANG','TIPO DE SANG','SANGUINEO','ESTADO CIVIL','ENDORSEMENT','RESTRICTION','MUNICIPIO'];
  var RVw=['EMISION','EMISIÓN','VENCIMIENTO','VENCE','EXPIRES','ISSUED','VALIDEZ','EXPIRA','CLASE','CATEGORIA','CATEGORÍA','ISS','EXP'];
  var FR=['NOMBRES','APELLIDOS','NAMES','SURNAME','GIVEN','DUI','DOCUMENTO UNICO','DOCUMENTO ÚNICO','CEDULA','CÉDULA','IDENTIDAD','LICENCIA','DRIVER','NACIMIENTO','BIRTH','SEXO','SEX','NACIONALIDAD','NACIONALITY','FOLIO','REPUBLI','NUMERO','NÚMERO','NUMBER','ID NO'];
  for(i=0;i<RVs.length;i++){ if(t.indexOf(RVs[i])>=0){ rev+=2; } }
  for(i=0;i<RVw.length;i++){ if(t.indexOf(RVw[i])>=0){ rev+=0.75; } }
  for(i=0;i<FR.length;i++){ if(t.indexOf(FR[i])>=0){ fre+=1; } }
  if(tieneCara){ fre+=4; }
  if(rev>=3.5 && rev>fre+1){ return 'reverso'; }
  if(fre>=3 && fre>rev+1){ return 'frente'; }
  if(rev>fre && rev>=2){ return 'reverso'; }
  if(fre>rev && fre>=2){ return 'frente'; }
  return 'desconocido';
}

