name: "ZYRA AUDIT RELAY (test que cuelga)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Mapa del relay/cartero
        run: |
          {
          echo "## Mapa RED-RELAY"
          echo '```'
          echo "=== menciones relay ==="
          grep -rln "relay" shared_engines apps --include='*.py' | head -20 || true
          echo ""
          echo "=== menciones scheduler ==="
          grep -rln "scheduler" shared_engines apps --include='*.py' | head -20 || true
          echo ""
          echo "=== defs en files relay ==="
          for f in $(grep -rln "relay" shared_engines --include='*.py' | head -5); do
            echo "--- $f"
            grep -n "^class \|    def \|^def " "$f" | head -25 || true
          done
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0

      - name: Tests del relay encontrados
        run: |
          {
          echo "## Tests con relay/outbox/scheduler en el nombre"
          echo '```'
          grep -rn "def test_" shared_engines apps --include='*.py' | grep -i "relay\|scheduler\|cartero\|dispatch" | head -15 || true
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0

      - name: Test colgante con faulthandler (el stack del cuelgue)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          T=$(grep -rn "def test_" shared_engines apps --include='*.py' | grep -i "relay\|scheduler" | head -1 | cut -d: -f1 || true)
          F=$(grep -rn "def test_" shared_engines apps --include='*.py' | grep -i "relay\|scheduler" | head -1 | cut -d: -f2 || true)
          TNAME=$(grep -rn "def test_" shared_engines apps --include='*.py' | grep -i "relay\|scheduler" | head -1 | sed 's/.*def \([a-z_0-9]*\).*/\1/' || true)
          {
          echo "## Ejecucion con faulthandler"
          echo "**Archivo:** $T"
          echo "**Test:** $TNAME"
          echo '```'
          if [ -n "$T" ]; then
            timeout 180 python3 -m pytest "$T::$TNAME" -vv --tb=long \
              --timeout=90 --timeout-method=thread \
              --faulthandler-timeout=55 2>&1 | tail -120 || true
          else
            echo "NO SE ENCONTRO TEST relay/scheduler"
          fi
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0

      - name: Fuente del modulo relay (para el fix)
        run: |
          {
          echo "## Fuente clave del modulo relay"
          echo '```python'
          MAINF=$(grep -rln "class.*Relay\|class.*Scheduler\|def.*dispatch" shared_engines --include='*.py' | head -1 || true)
          echo "### ARCHIVO PRINCIPAL: $MAINF"
          if [ -n "$MAINF" ]; then
            awk '{printf "%5d| %s\n", NR, $0}' "$MAINF" | head -400 || true
          fi
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0
