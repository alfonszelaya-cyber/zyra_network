          reemplazar_verificado apps/laboratorio/templates/dashboards/base.html "labAlternarModo" << 'ZYRA_EOF'
          <!doctype html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>{{titulo}}</title>
          <style>
          :root{--fondo:#0B1220;--sup:#111A2E;--borde:#1E293B;--texto:#E2E8F0;--suave:#94A3B8;--pri:#2563EB;--pri-h:#1D4ED8;--ok:#059669;--radio:16px;--radio-b:12px}
          *{box-sizing:border-box;margin:0;padding:0}
