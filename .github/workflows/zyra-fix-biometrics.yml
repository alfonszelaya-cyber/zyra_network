name: ZYRA S27 diagnostico forense del JS vivo (node --check sobre la pagina real)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  s27:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: S27 diagnostico (Summary siempre)
        run: |
          cat > /tmp/s27_diag.py << 'PYEOF'
          import urllib.request, re, os

          R = []
          def P(s=""): R.append(str(s))

          P("=== S27: LA PAGINA VIVA QUE RECIBE TU CELULAR ===")
          html = ""
          try:
              req = urllib.request.Request(
                  "https://zyra-superapp.onrender.com/registro",
                  headers={"User-Agent": "Mozilla/5.0 (Android)"},
              )
              html = urllib.request.urlopen(req, timeout=120).read().decode("utf-8", "replace")
          except Exception as e:
              P("FALLO al bajar la pagina: " + repr(e)[:300])
              print("\n".join(R)); raise SystemExit(0)

          P("bytes de la pagina viva: %d" % len(html))
          open("pagina_viva.html", "w", encoding="utf-8").write(html)

          P("--- marcadores en la pagina viva ---")
          for tok in ["registro v21", "registro v20", "irDe1", "irAPaso(", "window.onerror", "parseAAMVA", "partesNombre", "TOMAR FOTO FRONTAL"]:
              P("%-22s : %d" % (tok, html.count(tok)))

          P("--- boton Continuar tal como llega (linea completa) ---")
          for line in html.split("\n"):
              if "Continuar" in line:
                  P("| " + line.strip()[:200])

          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          P("--- bloques <script> hallados: %d ---" % len(scripts))
          for i, s in enumerate(scripts):
              p = "/tmp/js_%d.js" % i
              open(p, "w", encoding="utf-8").write(s)
              lines = s.split("\n")
              P("bloque %d: %d lineas, %d chars | primera: %s | ultima: %s" % (
                  i, len(lines), len(s), lines[0].strip()[:80] if lines else "", lines[-1].strip()[:80] if lines else ""))
              if lines and lines[-1].strip() not in ("", "</script>"):
                  P("AVISO: el bloque %d no termina limpio (posible TRUNCADO)" % i)

          if scripts:
              P("--- FIN del script principal (ultimas 5 lineas) ---")
              for l in scripts[0].split("\n")[-5:]:
                  P("| " + l.strip()[:150])

          print("\n".join(R))
          PYEOF
          python3 /tmp/s27_diag.py 2>&1 | tee diag1.txt
          {
            echo "## S27 — parte 1: la pagina viva"
            echo '````'
            cat diag1.txt
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- PARTE 2: verificacion de sintaxis con node ---"
          {
            echo "## S27 — parte 2: node --check sobre el JS vivo"
            echo '````'
            for f in /tmp/js_*.js; do
              echo "== $f =="
              if node --check "$f" 2>/tmp/nodeerr.txt; then
                echo "SINTAXIS OK"
              else
                echo "ERROR DE SINTAXIS (esto es lo que mata los botones):"
                cat /tmp/nodeerr.txt
                LIN=$(grep -oE "line [0-9]+" /tmp/nodeerr.txt | grep -oE "[0-9]+" | head -1)
                if [ -n "$LIN" ]; then
                  A=$((LIN-2)); B=$((LIN+2))
                  echo "--- lineas $A a $B del script (con la culpable) ---"
                  sed -n "${A},${B}p" "$f" | cat -A | head -10
                  echo "--- linea $LIM sin escapes ---"
                  sed -n "${LIN}p" "$f"
                fi
              fi
            done
            echo '````'
          } | tee diag2.txt >> "$GITHUB_STEP_SUMMARY"

          echo "--- PARTE 3: prueba de la logica de validacion del nombre ---"
          {
            echo "## S27 — parte 3: logica del nombre"
            echo '````'
            node -e '
            function partesNombre(v){return (v||"").trim().split(/\s+/).filter(function(x){return x.length>1})}
            var pruebas=["ALFONS ZELAYA","Zleya jose","Juan Perez","Maria","  "];
            for (var i=0;i<pruebas.length;i++){
              var nm=pruebas[i].trim();
              var pasa=nm.length>=3&&partesNombre(nm).length>=2;
              console.log(pruebas[i]+" -> partes="+partesNombre(nm).length+" pasa="+pasa);
            }' 2>&1 || true
            echo '````'
          } | tee diag3.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-s27
          path: |
            pagina_viva.html
            diag1.txt
            diag2.txt
            diag3.txt
