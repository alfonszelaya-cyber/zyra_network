name: "ZYRA CONECTORES 1 v3: clima/geo/riesgo (check de existencia corregido)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir 5 providers (v3)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)

          MOD = D(r'''
              """Conectores clima/geo/riesgo de la Red
              (fuentes publicas sin key, falla honesta).
              Cada fetch devuelve resumen normalizado
              + sha256 (Red ligera: transporta
              confianza, no carga)."""
              from __future__ import annotations

              import hashlib
              import json
              import urllib.request


              class _HttpBase:
                  """GET con UA de la Red + parse JSON."""

                  name = "base"

                  def __init__(
                      self,
                      *,
                      timeout_seconds: float = 10.0,
                  ) -> None:
                      self._timeout = timeout_seconds

                  def _get_json(self, url: str):
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                              "zyra-network/1.0"
                          })
                      with urllib.request.urlopen(
                              req,
                              timeout=self._timeout) as r:
                          return json.loads(
                              r.read().decode("utf-8"))

                  def _sha(self, data) -> str:
                      return hashlib.sha256(
                          json.dumps(
                              data,
                              sort_keys=True,
                              default=str).encode(
                              "utf-8")).hexdigest()


              class OpenMeteoConnector(_HttpBase):
                  """Clima/pronostico por lat/lon."""

                  name = "open-meteo"

                  def fetch(self, *, lat: float,
                            lon: float) -> dict:
                      url = (
                          "https://api.open-meteo.com"
                          "/v1/forecast"
                          "?latitude=" + str(lat)
                          + "&longitude=" + str(lon)
                          + "&current=temperature_2m,"
                          "relative_humidity_2m,"
                          "wind_speed_10m"
                          + "&daily=temperature_2m_max,"
                          "temperature_2m_min,"
                          "precipitation_sum"
                          + "&timezone=auto")
                      d = self._get_json(url)
                      cur = d.get("current", {})
                      resumen = {
                          "source": self.name,
                          "lat": lat,
                          "lon": lon,
                          "temperature": cur.get(
                              "temperature_2m"),
                          "humidity": cur.get(
                              "relative_humidity_2m"),
                          "wind_speed": cur.get(
                              "wind_speed_10m"),
                          "daily": d.get("daily"),
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen


              class NasapowerConnector(_HttpBase):
                  """Agroclimatico historico."""

                  name = "nasa-power"

                  def fetch(self, *, lat: float,
                            lon: float) -> dict:
                      url = (
                          "https://power.larc.nasa.gov"
                          "/api/temporal/climatology"
                          "?point"
                          "&latitude=" + str(lat)
                          + "&longitude=" + str(lon)
                          + "&community=AG"
                          + "&parameters=T2M,"
                          "PRECTOTCORR,WS2M"
                          + "&format=JSON")
                      d = self._get_json(url)
                      prop = d.get(
                          "properties", {}).get(
                          "parameter", {})
                      resumen = {
                          "source": self.name,
                          "lat": lat,
                          "lon": lon,
                          "t2m": prop.get("T2M"),
                          "precip": prop.get(
                              "PRECTOTCORR"),
                          "wind": prop.get("WS2M"),
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen


              class UsgsConnector(_HttpBase):
                  """Sismos recientes por region."""

                  name = "usgs"

                  def fetch(self, *, min_lat: float,
                            max_lat: float,
                            min_lon: float,
                            max_lon: float,
                            min_magnitude: float = 4.0,
                            days: int = 30) -> dict:
                      url = (
                          "https://earthquake.usgs.gov"
                          "/fdsnws/event/1/query"
                          "?format=geojson"
                          "&minlatitude="
                          + str(min_lat)
                          + "&maxlatitude="
                          + str(max_lat)
                          + "&minlongitude="
                          + str(min_lon)
                          + "&maxlongitude="
                          + str(max_lon)
                          + "&minmagnitude="
                          + str(min_magnitude)
                          + "&starttime="
                          + self._iso(days))
                      d = self._get_json(url)
                      feats = d.get("features", [])
                      sismos = []
                      for f in feats[:20]:
                          pr = f.get(
                              "properties", {})
                          sismos.append({
                              "mag": pr.get("mag"),
                              "place": pr.get(
                                  "place"),
                              "time": pr.get(
                                  "time"),
                          })
                      resumen = {
                          "source": self.name,
                          "count": len(feats),
                          "events": sismos,
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen

                  def _iso(self, days: int) -> str:
                      import datetime as _dt
                      d = _dt.datetime.now(
                          _dt.timezone.utc)
                      d = d - _dt.timedelta(
                          days=days)
                      return d.strftime(
                          "%Y-%m-%d")


              class OpenAqConnector(_HttpBase):
                  """Calidad del aire."""

                  name = "openaq"

                  def fetch(self, *, lat: float,
                            lon: float,
                            radius_m: int = 25000) -> dict:
                      url = (
                          "https://api.openaq.org"
                          "/v2/latest"
                          "?coordinates=" + str(lat)
                          + "," + str(lon)
                          + "&radius="
                          + str(radius_m)
                          + "&limit=20")
                      d = self._get_json(url)
                      results = d.get(
                          "results", [])
                      mediciones = []
                      for r in results[:10]:
                          mediciones.append({
                              "location": r.get(
                                  "location"),
                              "measurements": r.get(
                                  "measurements"),
                          })
                      resumen = {
                          "source": self.name,
                          "count": len(results),
                          "stations": mediciones,
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen


              class ReliefwebConnector(_HttpBase):
                  """Emergencias ONU por pais."""

                  name = "reliefweb"

                  def fetch(self, *,
                            country_iso3: str = "SLV",
                            limit: int = 10) -> dict:
                      url = (
                          "https://api.reliefweb.int"
                          "/v1/disasters"
                          "?appname=zyra-network"
                          "&profile=list"
                          "&limit=" + str(limit)
                          + "&filter[field]=country.iso3"
                          + "&filter[value]="
                          + country_iso3)
                      d = self._get_json(url)
                      items = d.get("data", [])
                      resumen = {
                          "source": self.name,
                          "count": len(items),
                          "disasters": [],
                      }
                      for it in items[:limit]:
                          resumen["disasters"].append({
                              "id": it.get("id"),
                              "fields": it.get(
                                  "fields"),
                          })
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen
          ''')

          TESTS = D(r'''
              """Tests conectores clima (mockeados)."""
              from __future__ import annotations

              import json

              from shared_engines.integrations.rates_clima import (
                  OpenMeteoConnector,
                  NasapowerConnector,
                  UsgsConnector,
                  OpenAqConnector,
                  ReliefwebConnector,
              )


              class _R:
                  def __init__(self, p):
                      self._p = p

                  def __enter__(self):
                      return self

                  def __exit__(self, *a):
                      return False

                  def read(self):
                      return self._p


              def _patch(monkeypatch, payload):
                  body = json.dumps(payload).encode()
                  monkeypatch.setattr(
                      "urllib.request.urlopen",
                      lambda req, timeout=None: _R(body))


              def test_open_meteo(tmp_path, monkeypatch) -> None:
                  _patch(monkeypatch, {
                      "current": {
                          "temperature_2m": 31.2,
                          "relative_humidity_2m": 60,
                          "wind_speed_10m": 8.1},
                      "daily": {
                          "temperature_2m_max": [33.0]}})
                  r = OpenMeteoConnector().fetch(
                      lat=13.69, lon=-89.19)
                  assert r["source"] == "open-meteo"
                  assert r["temperature"] == 31.2
                  assert r["sha256"]
                  print("OK clima: open-meteo 31.2C")


              def test_nasa_power(tmp_path, monkeypatch) -> None:
                  _patch(monkeypatch, {
                      "properties": {"parameter": {
                          "T2M": {"JAN": 26.1},
                          "PRECTOTCORR": {"JAN": 5.2}}}})
                  r = NasapowerConnector().fetch(
                      lat=13.69, lon=-89.19)
                  assert r["source"] == "nasa-power"
                  assert r["t2m"]["JAN"] == 26.1
                  print("OK clima: nasa-power")


              def test_usgs(tmp_path, monkeypatch) -> None:
                  _patch(monkeypatch, {
                      "features": [
                          {"properties": {
                              "mag": 5.1,
                              "place": "El Salvador",
                              "time": 1700000000000}}]})
                  r = UsgsConnector().fetch(
                      min_lat=12.5, max_lat=14.5,
                      min_lon=-91.0, max_lon=-88.0)
                  assert r["count"] == 1
                  assert r["events"][0]["mag"] == 5.1
                  print("OK clima: usgs sismos")


              def test_openaq(tmp_path, monkeypatch) -> None:
                  _patch(monkeypatch, {
                      "results": [
                          {"location": "San Salvador",
                           "measurements": [
                               {"parameter": "pm25",
                                "value": 22.5}]}]})
                  r = OpenAqConnector().fetch(
                      lat=13.69, lon=-89.19)
                  assert r["count"] == 1
                  assert r["stations"][0]["location"] == "San Salvador"
                  print("OK clima: openaq aire")


              def test_reliefweb(tmp_path, monkeypatch) -> None:
                  _patch(monkeypatch, {
                      "data": [
                          {"id": 12345,
                           "fields": {
                               "name": "Flood SV"}}]})
                  r = ReliefwebConnector().fetch(
                      country_iso3="SLV")
                  assert r["count"] == 1
                  assert r["disasters"][0]["fields"]["name"] == "Flood SV"
                  print("OK clima: reliefweb emergencias")
          ''')

          # FIX: exists() PRIMERO, read_text DESPUES
          try:
              p = pathlib.Path("shared_engines/integrations/rates_clima.py")
              if p.exists() and "class OpenMeteoConnector" in p.read_text(encoding="utf-8"):
                  out("- **modulo clima: YA**")
              else:
                  ast.parse(MOD)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(MOD, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  out("- **modulo clima: OK (escrito " + str(len(MOD)) + " chars)**")
          except Exception:
              out("- **modulo clima: ERROR (no bloquea)**")
              out("```\n" + traceback.format_exc().strip() + "\n```")

          try:
              t = pathlib.Path("shared_engines/integrations/tests/test_clima.py")
              if t.exists() and "test_reliefweb" in t.read_text(encoding="utf-8"):
                  out("- **tests clima: YA**")
              else:
                  ast.parse(TESTS)
                  t.parent.mkdir(parents=True, exist_ok=True)
                  t.write_text(TESTS, encoding="utf-8")
                  py_compile.compile(str(t), doraise=True)
                  out("- **tests clima: OK (escrito " + str(len(TESTS)) + " chars)**")
          except Exception:
              out("- **tests clima: ERROR (no bloquea)**")
              out("```\n" + traceback.format_exc().strip() + "\n```")

          chk = pathlib.Path("shared_engines/integrations/rates_clima.py")
          chk2 = pathlib.Path("shared_engines/integrations/tests/test_clima.py")
          out("- **verif disco: modulo existe=" + str(chk.exists()) + " test existe=" + str(chk2.exists()) + "**")
          exit(0)
          EOF

      - name: "C1: tests clima"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 120 python3 -m pytest shared_engines/integrations/tests/test_clima.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/c1.out 2>&1
          echo $? > /tmp/c1
          if [ "$(cat /tmp/c1)" = "0" ]; then echo "- C1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- C1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### C1 detalle"; echo '```'; tail -60 /tmp/c1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "C2: regresion shared_engines"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/c2.out 2>&1
          echo $? > /tmp/c2
          if [ "$(cat /tmp/c2)" = "0" ]; then echo "- C2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- C2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### C2 detalle"; echo '```'; tail -60 /tmp/c2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "C3: apps intactas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/nexo/tests apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/c3.out 2>&1
          echo $? > /tmp/c3
          if [ "$(cat /tmp/c3)" = "0" ]; then echo "- C3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- C3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### C3 detalle"; echo '```'; tail -40 /tmp/c3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in c1 c2 c3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: C1-C3 VERDES — LOTE 1 CLIMA CONECTADO**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(conectores): 5 providers clima/geo/riesgo - Open-Meteo, NASA POWER, USGS, OpenAQ, ReliefWeb (C1-C3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 1/4. Sigue lote cripto on-chain.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
