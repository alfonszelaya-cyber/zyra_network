name: "RED-RELAY v2 (BLOQUE): scheduler autonomo + cron de fuentes + estado + control del cartero"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Bloque 1 - combined_api.py: RelayScheduler (daemon anti-muerte) + serve_combined con bridge + 2 rutas nuevas (sweep de fuentes + estado del cartero)"
        run: |
          python3 - <<'BEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/runtime/combined_api.py")
          t = p.read_text(encoding="utf-8")
          if "class RelayScheduler" not in t:
              SCHED = textwrap.dedent('''\


                  import threading


                  class RelayScheduler:
                      """AX-RELAY: daemon que drena el
                      cartero de la Red cada N segundos.
                      La Red distribuye SOLA. Nunca muere
                      por un fallo: reintenta en el
                      proximo tick."""

                      def __init__(
                          self,
                          *,
                          bridge,
                          interval_seconds: float = (
                              30.0),
                      ) -> None:
                          self._bridge = bridge
                          self._interval = max(
                              0.2,
                              float(interval_seconds))
                          self._stop_event = (
                              threading.Event())
                          self._thread = (
                              threading.Thread(
                                  target=self._loop,
                                  daemon=True,
                                  name="zyra-relay"))
                          self.last_result = None

                      def _loop(self) -> None:
                          while not (
                              self._stop_event.wait(
                                  self._interval)
                          ):
                              try:
                                  self.last_result = (
                                      self._bridge.relay())
                              except Exception:
                                  pass

                      def start(self) -> None:
                          self._thread.start()

                      def stop(self) -> None:
                          self._stop_event.set()
                          self._thread.join(timeout=5)
              ''')
              t = (t.rstrip("\n") + "\n" + SCHED.rstrip("\n") + "\n")
              print("OK bloque 1a: RelayScheduler")
          VIEJO = (
              "def serve_combined(\n"
              "    kernel: ZyraKernel,\n"
              "    caps: ZyraCapabilities,\n"
              "    *,\n"
              "    host: str,\n"
              "    port: int,\n"
              ") -> ThreadingHTTPServer:\n"
              '    """Bind both surfaces to one server."""\n'
              "    CombinedHandler.kernel = kernel\n"
              "    CombinedHandler.caps = caps\n"
              "    return ThreadingHTTPServer(\n"
              "        (host, port), CombinedHandler\n"
              "    )\n"
          )
          NUEVO = (
              "def serve_combined(\n"
              "    kernel: ZyraKernel,\n"
              "    caps: ZyraCapabilities,\n"
              "    *,\n"
              "    host: str,\n"
              "    port: int,\n"
              "    bridge=None,\n"
              "    relay_interval: float = 30.0,\n"
              ") -> ThreadingHTTPServer:\n"
              '    """Bind both surfaces to one server.\n'
              "    AX-RELAY: si hay bridge, la Red\n"
              "    distribuye AUTONOMAMENTE y cablea\n"
              '    caps.bridge para /bridge."""\n'
              "    CombinedHandler.kernel = kernel\n"
              "    CombinedHandler.caps = caps\n"
              "    if bridge is not None:\n"
              "        caps.bridge = bridge\n"
              "    server = ThreadingHTTPServer(\n"
              "        (host, port), CombinedHandler\n"
              "    )\n"
              "    if bridge is not None:\n"
              "        scheduler = RelayScheduler(\n"
              "            bridge=bridge,\n"
              "            interval_seconds=relay_interval,\n"
              "        )\n"
              "        scheduler.start()\n"
              "        server._zyra_relay_scheduler = (\n"
              "            scheduler\n"
              "        )\n"
              "    return server\n"
          )
          if VIEJO in t:
              t = t.replace(VIEJO, NUEVO, 1)
              print("OK bloque 1b: serve_combined con bridge")
          elif "bridge=None," in t:
              print("SKIP bloque 1b (ya presente)")
          else:
              raise AssertionError("serve_combined no hallado")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK bloque 1 completo (AST valido)")
          BEOF

      - name: "Bloque 2 - capabilities_api.py: rutas de control del cartero y cron de fuentes (GET /bridge/status, POST /bridge/relay, POST /sources/sweep)"
        run: |
          python3 - <<'RTEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/runtime/capabilities_api.py")
          t = p.read_text(encoding="utf-8")
          if 's == ["bridge", "relay"]' in t:
              print("SKIP 2 (rutas ya presentes)")
              raise SystemExit(0)
          ig = t.find("def _route_get(")
          assert ig >= 0
          ic = t.find("caps = type(self).caps", ig)
          assert ic > ig
          ic_ls = t.rfind("\n", 0, ic) + 1
          linea = t[ic_ls:ic]
          IND_G = linea[:len(linea) - len(linea.lstrip())]
          le = t.find("\n", ic) + 1
          GET_CUERPO = textwrap.dedent('''\
              if (
                  len(s) == 2
                  and s[0] == "bridge"
                  and s[1] == "status"
              ):
                  bridge = getattr(
                      caps, "bridge", None)
                  if bridge is None:
                      self._ok({"wired": False})
                      return
                  self._ok({"wired": True})
                  return
          ''')
          GET_R = textwrap.indent(
              GET_CUERPO.rstrip("\n"), IND_G) + "\n"
          t = t[:le] + GET_R + t[le:]
          print("OK GET /bridge/status")
          marker = 'if s == ["documents", "register"]:'
          idx = t.find(marker)
          assert idx >= 0, "ancla documents/register"
          ls = t.rfind("\n", 0, idx) + 1
          linea = t[ls:idx]
          IND = linea[:len(linea) - len(linea.lstrip())]
          POST_CUERPO = textwrap.dedent('''\
              if s == ["bridge", "relay"]:
                  bridge = getattr(
                      caps, "bridge", None)
                  if bridge is None:
                      self._error(503, "not_wired", "bridge not wired")
                      return
                  res = bridge.relay()
                  self._send(200, {"ok": True, "data": res})
                  return
              if s == ["sources", "sweep"]:
                  from shared_engines.integrations.engine import (
                      PublicSourceClient, SourceIndex,
                      sweep_onec, sweep_marn)
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  cli = PublicSourceClient(
                      clock=type(self).kernel.clock,
                      timeout_seconds=20.0,
                      ttl_seconds=300.0)
                  index = SourceIndex(
                      SQLiteAdapter(
                          str(
                              type(self).kernel.config.__dict__.get(
                                  "db_path", ":memory:")
                              ) if hasattr(
                              type(self).kernel.config,
                              "__dict__") else ":memory:"),
                      type(self).kernel.clock)
                  r1 = sweep_onec(cli, index)
                  r2 = sweep_marn(
                      cli, index,
                      max_layers_per_service=8,
                      pause_seconds=0.1)
                  self._send(200, {
                      "ok": True,
                      "data": {
                          "onec": r1,
                          "marn": r2,
                      }})
                  return
          ''')
          BLOQUE = textwrap.indent(
              POST_CUERPO.rstrip("\n"), IND) + "\n"
          t = t[:ls] + BLOQUE + t[ls:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          tq2 = p.read_text(encoding="utf-8")
          assert ('s == ["bridge", "relay"]:' in tq2)
          assert ('s == ["sources", "sweep"]:' in tq2)
          print("OK 2: rutas relay/status/sweep (AST valido)")
          RTEOF

      - name: "Bloque 3 - verificacion dura completa"
        run: |
          python3 -c "
          import inspect
          from shared_engines.runtime.combined_api import (
              serve_combined, RelayScheduler)
          sig = inspect.signature(serve_combined)
          assert 'bridge' in sig.parameters
          assert 'relay_interval' in sig.parameters
          for m in ('start', 'stop', '_loop'):
              assert hasattr(RelayScheduler, m), m
          src = open('shared_engines/runtime/capabilities_api.py').read()
          assert 's == [\"bridge\", \"relay\"]:' in src
          assert 's == [\"sources\", \"sweep\"]:' in src
          assert 's[1] == \"status\"' in src
          import shared_engines.runtime.combined_api
          print('OK bloque 3: scheduler + rutas vivas; compatibilidad total')
          "

      - name: "Bloque 4 - test: distribucion AUTONOMA (nadie llama relay) + retrocompatibilidad"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          target = Path(
              "shared_engines/runtime/tests/"
              "test_capabilities_api.py")
          assert target.exists()
          t = target.read_text(encoding="utf-8")
          if "test_relay_autonomous_delivery" in t:
              print("SKIP 4 (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_relay_autonomous_delivery(
                  tmp_path,
              ) -> None:
                  """AX-RELAY: la Red distribuye SOLA.
                  Evento emitido -> scheduler daemon lo
                  entrega al suscriptor sin que nadie
                  llame al relay."""
                  import threading
                  import time as _time
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  from shared_engines.runtime.config import (
                      RuntimeConfig)
                  from shared_engines.runtime.kernel import (
                      ZyraKernel)
                  from shared_engines.runtime.capabilities import (
                      ZyraCapabilities)
                  from shared_engines.runtime.combined_api import (
                      serve_combined)
                  from shared_engines.verification.signatures import (
                      Ed25519Signer)
                  from shared_engines.events.outbox import (
                      Outbox, InterAppBridge)
                  from shared_engines.events.inbox import (
                      Inbox)
                  from shared_engines.events.contracts import (
                      EventCatalog)
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None))
                  kernel.bootstrap_root()
                  caps = ZyraCapabilities(
                      net_db, FrozenClock(),
                      identity=kernel.identity,
                      signer=signer)
                  red_db = SQLiteAdapter(
                      tmp_path / "red.db")
                  nexo_db = SQLiteAdapter(
                      tmp_path / "nexo.db")
                  clock = FrozenClock()
                  out_red = Outbox(red_db, clock)
                  out_red.ensure_schema()
                  cat = EventCatalog()
                  cat.register("agro.sale.created")
                  bridge = InterAppBridge(
                      db=red_db, clock=clock,
                      source=out_red)
                  recibidos = []
                  bridge.subscribe(
                      app_id="nexo",
                      event_types=(
                          "agro.sale.created",),
                      inbox=Inbox(nexo_db, clock),
                      handler=recibidos.append)
                  srv = serve_combined(
                      kernel, caps,
                      host="127.0.0.1", port=0,
                      bridge=bridge,
                      relay_interval=0.4)
                  try:
                      assert caps.bridge is bridge
                      ev = cat.build(
                          "agro.sale.created",
                          aggregate_id="S1",
                          payload={"total": 100},
                          clock=clock)
                      out_red.enqueue(ev)
                      limite = 6.0
                      inicio = _time.time()
                      while (len(recibidos) == 0
                             and (_time.time()
                                  - inicio)
                             < limite):
                          _time.sleep(0.1)
                      assert len(recibidos) == 1, (
                          "el scheduler NO entrego"
                          " solo: " + str(len(recibidos)))
                      print("OK AX-RELAY: distribucion"
                            " autonoma funcionando")
                  finally:
                      sched = getattr(
                          srv,
                          "_zyra_relay_scheduler",
                          None)
                      if sched is not None:
                          sched.stop()
                      srv.shutdown()
                      srv.server_close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          target.write_text(t, encoding="utf-8")
          final = target.read_text(encoding="utf-8")
          assert "test_relay_autonomous_delivery" in final
          print("OK 4: test distribucion autonoma (AST valido)")
          TSEOF

      - name: "Bloque 5 - GATE Red (compatibilidad total: llamadas viejas de serve_combined intactas)"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -10

      - name: "Bloque 6 - GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Bloque 7 - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-RELAY v2"
            echo '```'
            python3 -m pytest shared_engines/runtime/tests -vv --tb=long 2>&1 | tail -70 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-RELAY (bloque): scheduler autonomo del cartero + rutas bridge/status/relay + sources/sweep + distribucion autonoma" -m "La energia siempre conectada: RelayScheduler (daemon anti-muerte, Event-based stop, reintento en cada tick) anadido a combined_api.py; serve_combined acepta bridge=None + relay_interval=30.0 -> si hay bridge: cablea caps.bridge y arranca el scheduler solo. Compatibilidad total: llamadas sin bridge identicas. Rutas nuevas: GET /bridge/status (wired?), POST /bridge/relay (manual), POST /sources/sweep (barrido ON-DEMAND de ONEC 7 + MARN 9 con descubrimiento de capas y snapshots durables). Test e2e: evento emitido se entrega al suscriptor SOLO por el scheduler sin que nadie llame al relay. BLOQUE completo bien distribuido: combined_api.py (scheduler+serve), capabilities_api.py (3 rutas), tests (1 e2e)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
