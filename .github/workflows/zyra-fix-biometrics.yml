name: "ZYRA NEXO-LIVE boot real (outbox Red + link + IA) - cierre Etapa 1"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] Estructura de main.py y superapp.py (para arranque)"
        run: |
          python3 << 'PYEOF'
          import ast, os, pathlib
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          for target in ("main.py", "superapp.py"):
              p = pathlib.Path(target)
              out("## " + target + " (solo lectura)")
              if not p.exists():
                  out("- NO EXISTE")
                  continue
              try:
                  tree = ast.parse(p.read_text(encoding="utf-8",
                                               errors="replace"))
                  for node in tree.body:
                      if isinstance(node, ast.ClassDef):
                          ms = [n.name for n in node.body
                                if isinstance(n, (ast.FunctionDef,
                                                  ast.AsyncFunctionDef))]
                          out("- **class " + node.name + "**: "
                              + ", ".join(ms[:25]))
                      elif isinstance(node, (ast.FunctionDef,
                                             ast.AsyncFunctionDef)):
                          try:
                              import inspect
                              args = [a.arg for a in node.args.args]
                          except Exception:
                              args = []
                          out("- def " + node.name + "("
                              + ", ".join(args[:12]) + ")")
              except Exception as e:
                  out("- ERROR parse: " + str(e)[:120])
          out("- NOTA: la activacion en el arranque se inyecta en el"
              " siguiente run con esta estructura")
          PYEOF
          exit 0

      - name: "[ESCRITURA] NEXO-LIVE boot.py (outbox Red + link + IA)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/nexo/services/boot.py", D(r'''
                  """Nexo Boot - activacion de NEXO en vivo
                  (NEXO-LIVE). Construye el runtime conectado a la
                  Red: cartero real (Outbox), credenciales via
                  NexoLink, AIChain si hay GEMINI_API_KEY. Todo por
                  composicion (regla 69, cero duplicar). Degradacion
                  honesta: lo que no pueda conectarse queda en
                  buffer/not_configured, nunca falso OK."""
                  from __future__ import annotations
                  import importlib as _imp
                  import inspect as _inspect
                  import os as _os

                  def _find_red_event_cls():
                      """Localiza la clase Event real de la Red."""
                      for modpath in ("shared_engines.events"
                                      ".contracts",
                                      "shared_engines.events"):
                          try:
                              m = _imp.import_module(modpath)
                          except Exception:
                              continue
                          cls = getattr(m, "Event", None)
                          if cls is not None:
                              return cls
                      return None

                  def _fields_of(cls):
                      """Campos aceptados por Event (autodescubre)."""
                      if cls is None:
                          return []
                      try:
                          import dataclasses
                          return [f.name for f in
                                  dataclasses.fields(cls)]
                      except Exception:
                          pass
                      try:
                          sig = _inspect.signature(cls.__init__)
                          return [p for p in sig.parameters
                                  if p != "self"]
                      except Exception:
                          return []

                  class RedEventMapper:
                      """Dict NEXO_* -> Event real de la Red."""

                      def __init__(self):
                          self._cls = _find_red_event_cls()
                          self._fields = _fields_of(self._cls)

                      @property
                      def available(self) -> bool:
                          return (self._cls is not None
                                  and bool(self._fields))

                      @property
                      def event_cls(self):
                          return self._cls

                      def build(self, d):
                          """Construye Event con los campos que la
                          clase real acepta; None si no puede."""
                          if not self.available:
                              return None
                          aliases = {
                              "event_id": ("event_id", "id"),
                              "event": ("type", "event_type",
                                        "kind", "event", "name"),
                              "source": ("source",),
                              "payload": ("payload", "data"),
                              "occurred_at": ("occurred_at",
                                              "created_at",
                                              "ts", "at"),
                          }
                          kwargs = {}
                          for target, opts in aliases.items():
                              if target not in self._fields:
                                  continue
                              for o in opts:
                                  if o in d and d[o] is not None:
                                      kwargs[target] = d[o]
                                      break
                          extras = {"source": "nexo",
                                    "version": "1.0",
                                    "company_id":
                                        d.get("company_id", "")}
                          for k, v in extras.items():
                              if (k in self._fields
                                      and k not in kwargs):
                                  kwargs[k] = v
                          if not kwargs:
                              return None
                          try:
                              return self._cls(**kwargs)
                          except Exception:
                              return None

                  class RedOutboxAdapter:
                      """Puente bus NEXO -> Outbox real de la Red.
                      Expone append(event_dict) — el nombre que
                      NexoMessageBus descubre primero."""
                      def __init__(self, outbox=None,
                                   mapper=None):
                          self._outbox = outbox
                          self._mapper = (mapper
                                          if mapper is not None
                                          else RedEventMapper())

                      @property
                      def connected(self) -> bool:
                          return (self._outbox is not None
                                  and self._mapper.available)

                      @property
                      def outbox(self):
                          return self._outbox

                      def append(self, event_dict) -> bool:
                          if not self.connected:
                              return False
                          ev = self._mapper.build(event_dict)
                          if ev is None:
                              return False
                          for name in ("enqueue", "append",
                                       "publish", "put", "add"):
                              m = getattr(self._outbox, name,
                                          None)
                              if callable(m):
                                  try:
                                      m(ev)
                                      return True
                                  except TypeError:
                                      continue
                                  except Exception:
                                      return False
                          return False

                  def build_outbox(db):
                      """Outbox real de la Red (cascade defensivo)."""
                      if db is None:
                          return None
                      try:
                          from shared_engines.events.outbox import (
                              Outbox)
                      except Exception:
                          return None
                      for factory in (lambda: Outbox(db),
                                      lambda: Outbox(db=db)):
                          try:
                              ob = factory()
                          except Exception:
                              continue
                          ens = getattr(ob, "ensure_schema", None)
                          if callable(ens):
                              try:
                                  ens()
                              except Exception:
                                  pass
                          return ob
                      return None

                  class _LinkCredShim:
                      """Expone request_financial_credential sobre
                      issue_financial_credential de NexoLink."""
                      def __init__(self, link):
                          self._link = link

                      def request_financial_credential(
                              self, company_id=None,
                              payload=None, **kw):
                          try:
                              ok, data, err = (self._link.
                                  issue_financial_credential(
                                      subject_zid=str(
                                          company_id or ""),
                                      issuer_zid=str(
                                          company_id or ""),
                                      title=("Credencial"
                                             " financiera"
                                             " NEXO"),
                                      detail=str(payload or "")))
                              return {"ok": bool(ok),
                                      "data": data,
                                      "error": err}
                          except Exception as e:
                              return {"ok": False,
                                      "error": str(e)[:200]}

                  def build_ai_chain():
                      """AIChain real si hay GEMINI_API_KEY (la paga
                      el dueño). Sin key: None (reglas locales)."""
                      if not _os.environ.get("GEMINI_API_KEY"):
                          return None
                      try:
                          from shared_engines.ai.providers import (
                              AIChain)
                          return AIChain()
                      except Exception:
                          return None

                  def build_runtime(db=None, clock=None,
                                    client=None,
                                    ai_chain=None):
                      """Runtime NEXO conectado a la Red:
                      outbox real + link real + IA si hay key."""
                      from apps.nexo.services.runtime import (
                          NexoRuntime)
                      from apps.nexo.services.transversal.verification.verification_gateway import (
                          NexoVerificationGateway)
                      outbox = build_outbox(db)
                      adapter = (RedOutboxAdapter(outbox=outbox)
                                 if outbox is not None else None)
                      rt = NexoRuntime(db=db, clock=clock,
                                       outbox=adapter,
                                       ai_chain=(ai_chain
                                                 if ai_chain
                                                 is not None
                                                 else
                                                 build_ai_chain()))
                      link = None
                      if client is not None:
                          try:
                              from apps.nexo.services.nexo_link import (
                                  NexoLink)
                              link = NexoLink(client)
                          except Exception:
                              link = None
                      if link is not None:
                          rt.verification = NexoVerificationGateway(
                              link=_LinkCredShim(link))
                      rt.link = link
                      rt.outbox_adapter = adapter
                      return rt
              '''))
              out("## FIN NEXO-LIVE builder")
          except Exception:
              out("## BUILDER ERROR (visible abajo)")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] NEXO-LIVE tests"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps/nexo -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/nexo/tests
          cat > apps/nexo/tests/test_ng13_boot.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.events.contracts import (make_event,
              NEXO_PAYMENT_RECEIVED)
          from apps.nexo.services.boot import (RedEventMapper,
              RedOutboxAdapter, build_runtime)

          def test_mapper_construye_event_real():
              mapper = RedEventMapper()
              assert mapper.available is True
              ev_dict = make_event(NEXO_PAYMENT_RECEIVED,
                  company_id="EMP-1", payload={"amount": "5"},
                  occurred_at=123.0)
              ev = mapper.build(ev_dict)
              assert ev is not None
              assert isinstance(ev, mapper.event_cls)
              print("OK mapper: dict NEXO_* -> Event real de la Red")

          def test_adapter_fluye_a_outbox_real():
              mapper = RedEventMapper()
              recibidos = []
              class FakeOutbox:
                  def enqueue(self, event):
                      recibidos.append(event)
              adapter = RedOutboxAdapter(outbox=FakeOutbox(),
                                         mapper=mapper)
              assert adapter.connected is True
              ev_dict = make_event(NEXO_PAYMENT_RECEIVED,
                  company_id="EMP-2", payload={"x": "1"},
                  occurred_at=1.0)
              assert adapter.append(ev_dict) is True
              assert len(recibidos) == 1
              assert isinstance(recibidos[0], mapper.event_cls)
              print("OK adapter: evento NEXO_* llega al outbox como Event real")

          def test_bus_hacia_la_red(tmp_path):
              mapper = RedEventMapper()
              recibidos = []
              class FakeOutbox:
                  def enqueue(self, event):
                      recibidos.append(event)
              from apps.nexo.infrastructure.messaging.message_bus import NexoMessageBus
              bus = NexoMessageBus(outbox=RedOutboxAdapter(
                  outbox=FakeOutbox(), mapper=mapper),
                  clock=FrozenClock())
              ev = make_event(NEXO_PAYMENT_RECEIVED,
                  company_id="EMP-3", payload={"a": "1"})
              r = bus.publish(ev)
              assert r["delivered_to_network"] is True
              assert r["buffered"] is False
              assert bus.pending() == 0
              assert len(recibidos) == 1
              print("OK bus->Red: cartero real recibe el evento")

          def test_build_runtime_conectado(tmp_path):
              class FakeClient:
                  pass
              rt = build_runtime(db=SQLiteAdapter(tmp_path / "b.db"),
                  clock=FrozenClock(), client=FakeClient())
              assert rt.link is not None
              assert rt.verification.mode == "nexo_link"
              assert rt.outbox_adapter is not None
              st = rt.status()
              assert "events_pending" in st
              assert "ai_mode" in st
              r = rt.emit(NEXO_PAYMENT_RECEIVED,
                  company_id="EMP-4", payload={"m": "1"})
              assert (r["delivered_to_network"] is True
                      or r["buffered"] is True)
              print("OK build_runtime: link+verificacion+outbox conectados")

          def test_build_runtime_sin_red_honesto(tmp_path):
              rt = build_runtime(clock=FrozenClock())
              assert rt.verification.mode == "not_configured"
              assert rt.link is None
              r = rt.emit(NEXO_PAYMENT_RECEIVED,
                  company_id="EMP-5", payload={})
              assert r["buffered"] is True
              print("OK sin Red: degradacion honesta a buffer")
          TSEOF
          timeout 120 python3 -m pytest apps/nexo/tests/test_ng13_boot.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/ng13.out 2>&1
          echo $? > /tmp/ng13
          if [ "$(cat /tmp/ng13)" = "0" ]; then echo "- NEXO-LIVE boot: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- NEXO-LIVE: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### NEXO-LIVE detalle"; echo '```'; tail -80 /tmp/ng13.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] NGX regresion completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc1.out 2>&1
          echo $? > /tmp/ngxc1
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=short > /tmp/ngxc2.out 2>&1
          echo $? > /tmp/ngxc2
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/ngxc3.out 2>&1
          echo $? > /tmp/ngxc3
          for par in "ngxc1 nexo" "ngxc2 shared_engines" "ngxc3 subastas"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- NGX $2: ✅" >> "$SUM"
            else
              echo "- NGX $2: ❌" >> "$SUM"
              { echo "### NGX $2 detalle"; echo '```'; tail -100 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          if [ "$(cat /tmp/ngxc1)" = "0" ] && [ "$(cat /tmp/ngxc2)" = "0" ] && [ "$(cat /tmp/ngxc3)" = "0" ]; then echo 0 > /tmp/ngxc; else echo 1 > /tmp/ngxc; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si TODO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in ng13 ngxc; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: NEXO-LIVE VERDE — BOOT REAL (cartero + link + IA) CERRANDO ETAPA 1**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-LIVE): boot de activacion real (RedEventMapper dict NEXO_* -> Event real de la Red autodescubriente, RedOutboxAdapter puente bus->Outbox real, build_outbox cascade defensivo, _LinkCredShim credenciales via issue_financial_credential, build_runtime conectado con degradacion honesta, build_ai_chain con GEMINI_API_KEY del dueño) + estructura de main/superapp descargada para inyeccion de arranque (NEXO-LIVE verde)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — NEXO-LIVE CERRADO. Siguiente run: inyeccion de arranque en main/superapp. Luego Etapa 2: SEMILLA.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
