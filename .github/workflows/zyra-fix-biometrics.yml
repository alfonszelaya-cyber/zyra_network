          def test_n8_zid_empresa_modulo_accion(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "ac.db")
              ac = AccessControlEngine(db, FrozenClock())
              with pytest.raises(ValueError):
                  ac.grant(zid=" ", company_id="EMP-1",
                      module="contabilidad", action="read")
              with pytest.raises(ValueError):
                  ac.grant(zid="ZID-1", company_id="EMP-1",
                      module="contabilidad", action="borrar")
              g = ac.grant(zid="ZID-1", company_id="EMP-1",
                  module="contabilidad", action="read")
              assert g["company_id"] == "EMP-1"
              with pytest.raises(ValueError):
                  ac.grant(zid="ZID-1", company_id="EMP-1",
                      module="contabilidad", action="read")
              assert ac.can("ZID-1", "EMP-1", "contabilidad",
                  "read") is True
              assert ac.can("ZID-1", "EMP-1", "contabilidad",
                  "write") is False
              assert ac.can("ZID-1", "EMP-2", "contabilidad",
                  "read") is False
              with pytest.raises(ValueError):
                  ac.revoke(g["grant_id"], reason=" ")
              ac.revoke(g["grant_id"], reason="fin de contrato")
              assert ac.can("ZID-1", "EMP-1", "contabilidad",
                  "read") is False
              g2 = ac.grant(zid="ZID-1", company_id="EMP-1",
                  module="contabilidad", action="read")
              assert g2.get("reactivated") is True
              ac.grant(zid="ZID-1", company_id="EMP-1",
                  module="tesoreria", action="write")
              grants = ac.grants_of("ZID-1", "EMP-1")
              assert len(grants) == 2
              aud = ac.audit_recent("ZID-1")
              assert len(aud) >= 5
              assert any(not a["allowed"] for a in aud)
              print("OK N-8: ZID<->autorizacion por empresa/modulo/accion (regla 63) + auditoria de cada chequeo + revocacion con motivo + re-activacion")
