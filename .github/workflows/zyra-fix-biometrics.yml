          _up("            _zax_cm = getattr(_zax_db, \"commit\", None)")
          _up("            if _zax_cm:")
          _up("                _zax_cm()")
          _up("        except Exception:")
          _up("            pass")
          _up("    except Exception:")
          _up("        pass")
          if es_return:
              expr = linea.strip()[len("return"):].strip()
              nueva = IND + "_zax_ret = " + expr
              UP.append(IND + "return _zax_ret")
              bloque = "\n".join(EN) + "\n" + nueva + "\n" + "\n".join(UP) + "\n"
              t = t[:ls] + bloque + t[le:]
          else:
              bloque_en = "\n".join(EN) + "\n"
              bloque_up = "\n".join(UP) + "\n"
              t = t[:ls] + bloque_en + t[ls:le] + bloque_up + t[le:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          t2 = p.read_text(encoding="utf-8")
          i2 = t2.find(ancla)
          assert t2.find("ZID automatico del recien nacido", i2) > i2
          assert t2.find("_birth_register(", i2) > t2.find("_zax_zid = None", i2)
