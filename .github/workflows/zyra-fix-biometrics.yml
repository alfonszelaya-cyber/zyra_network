name: "ZYRA NEXO E6 v2: soporte transversal + family office"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir soporte transversal + family office
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def wf(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
                  return True
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")
                  return False

          # ===== MOTOR TRANSVERSAL DE SOPORTE =====
          SUP = "shared_engines/support"
          wf(SUP + "/__init__.py", "")
          wf(SUP + "/errors.py", D(r'''
              """Soporte: errores de dominio."""
              from __future__ import annotations

              class SupportError(Exception):
                  pass

              class UnknownTicketError(SupportError):
                  pass
          '''))

          wf(SUP + "/engine.py", D(r'''
              """Motor TRANSVERSAL de atencion al cliente.

              Sirve a TODAS las apps (nexo, subastas, agro,
              axis, semilla, mpe...). Escalamiento cross-app:
              un caso puede cruzar apps como el Modulo 10."""
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid

              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

