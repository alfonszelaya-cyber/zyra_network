name: "RED-1 paso 4: espia en CapabilitiesApiHandler._route (excepcion viva) + dump del except de capabilities_api"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "1. Dump: bloque except/_send de capabilities_api.py (como envia su 500)"
        run: |
          python3 - <<'DMPEOF'
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/capabilities_api.py")
          lines = p.read_text(
              encoding="utf-8").splitlines()
          print("=== capabilities_api.py: internal_error / except / _send_json / def _route ===")
          for i, l in enumerate(lines, 1):
              if ("internal_error" in l
                      or "except " in l
                      or "def _route" in l
                      or "_send_json" in l
                      or "def _dispatch" in l
                      or "traceback" in l):
                  print(str(i).rjust(5) + ": "
                        + l[:130])
          print()
          print("=== contexto del primer except Exception (30 lineas) ===")
          idx = None
          for i, l in enumerate(lines, 1):
              if "except Exception" in l:
                  idx = i
                  break
          if idx:
              for n in range(max(0, idx - 25),
                             min(len(lines),
                                 idx + 5)):
                  print(str(n + 1).rjust(5)
                        + ": " + lines[n])
          DMPEOF

      - name: "2. ESPIA en CapabilitiesApiHandler._route: capturar la excepcion viva con traceback"
        run: |
          python3 - <<'SPYEOF'
          import base64, json, threading, time
          import traceback
          import urllib.error, urllib.request
          from shared_engines.storage.database import (
              SQLiteAdapter)
          from shared_engines.common.clocks import (
              FrozenClock)
          from shared_engines.runtime.config import (
              RuntimeConfig)
          from shared_engines.runtime.kernel import (
              ZyraKernel)
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities)
          from shared_engines.runtime.combined_api import (
              serve_combined)
          from shared_engines.verification.signatures import (
              Ed25519Signer)
          from shared_engines.security.biometrics import (
              BiometricsEngine, BiometricsPolicy,
              DeterministicTestProvider, TemplateCipher)
          from shared_engines.runtime.capabilities_api import (
              CapabilitiesApiHandler)
          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=net_db, clock=FrozenClock(),
              signer=signer,
              config=RuntimeConfig(
                  host="127.0.0.1", port=0,
                  api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=net_db, clock=FrozenClock(),
              audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(
                  master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(
              net_db, FrozenClock(),
              identity=kernel.identity,
              signer=signer)
          srv = serve_combined(
              kernel, caps,
              host="127.0.0.1", port=0)
          original = (
              CapabilitiesApiHandler._route)

          def espia_route(self, method):
              try:
                  return original(self, method)
              except Exception:
                  print(">>> EXCEPCION VIVA en"
                        " CapabilitiesApiHandler._route:")
                  traceback.print_exc()
                  raise

          CapabilitiesApiHandler._route = (
              espia_route)
          print("espia instalado en"
                " CapabilitiesApiHandler._route")
          threading.Thread(
              target=srv.serve_forever,
              daemon=True).start()
          time.sleep(0.4)
          base = ("http://127.0.0.1:"
              + str(srv.server_address[1]))
          req = urllib.request.Request(
              base + "/identity/enroll",
              data=json.dumps({
                  "kind": "person",
                  "display_name": "Spy2 User",
                  "actor": "audit",
                  "doc_image_b64": base64.b64encode(
                      b"spy2-history-user"
                      ).decode("ascii"),
                  "selfie_image_b64": base64.b64encode(
                      b"spy2-history-user"
                      ).decode("ascii"),
              }).encode(),
              method="POST",
              headers={"Content-Type":
                  "application/json"})
          with urllib.request.urlopen(
              req, timeout=15) as r:
              body = json.loads(r.read().decode())
          zid = ((body.get("data") or {}).get(
              "identity") or {}).get("zid")
          print("ZID=" + str(zid))
          print()
          print("### GET /history/" + str(zid))
          try:
              with urllib.request.urlopen(
                  base + "/history/" + str(zid),
                  timeout=15) as r:
                  print("STATUS=" + str(r.status))
                  print(r.read().decode(
                      "utf-8", "replace")[:300])
          except urllib.error.HTTPError as e:
              print("STATUS=" + str(e.code))
              print(e.read().decode(
                  "utf-8", "replace")[:300])
          print()
          print("FIN: el traceback de EXCEPCION VIVA"
                " es la causa exacta del 500")
          SPYEOF

      - name: "Contexto"
        run: |
          git log --oneline -3
