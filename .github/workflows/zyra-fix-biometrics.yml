name: "ZYRA AUDIT VIVA-1 (composition root: bridge + FX vivo)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: P1 - main.py completo (composition root)
        run: |
          {
          echo "## main.py COMPLETO (numerado)"
          echo '```python'
          awk '{printf "%5d| %s\n", NR, $0}' main.py 2>/dev/null | head -200 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P2 - kernel.py zona CurrencyEngine y arranque
        run: |
          {
          echo "## kernel.py lineas 200-340 (ensamblado de motores)"
          echo '```python'
          awk 'NR>=200 && NR<=340 {printf "%5d| %s\n", NR, $0}' shared_engines/runtime/kernel.py 2>/dev/null || true
          echo '```'
          echo "## kernel.py imports y def __init__"
          echo '```python'
          awk 'NR>=1 && NR<=100 {printf "%5d| %s\n", NR, $0}' shared_engines/runtime/kernel.py 2>/dev/null | head -100 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P3 - donde espera caps.bridge (rutas 503)
        run: |
          {
          echo "## capabilities_api.py: menciones bridge"
          echo '```'
          grep -n "bridge" shared_engines/runtime/capabilities_api.py | head -20 || true
          echo '```'
          echo "## contexto de las rutas bridge (zona 503 not_wired)"
          echo '```python'
          for L in $(grep -n "bridge" shared_engines/runtime/capabilities_api.py | head -5 | cut -d: -f1); do
            s=$((L-8)); [ "$s" -lt 1 ] && s=1
            awk -v a="$s" -v b="$((L+30))" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' shared_engines/runtime/capabilities_api.py
            echo "---"
          done || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P4 - capabilities.py init completo (donde se enchufan engines)
        run: |
          {
          echo "## capabilities.py __init__ COMPLETO (el enchufe maestro)"
          echo '```python'
          awk 'NR>=81 && NR<=230 {printf "%5d| %s\n", NR, $0}' shared_engines/runtime/capabilities.py 2>/dev/null || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P5 - serve_combined y arranque del servidor
        run: |
          {
          echo "## combined_api.py: serve_combined (fuente)"
          echo '```python'
          grep -n "def serve_combined" shared_engines/runtime/combined_api.py | head -3 || true
          L=$(grep -n "def serve_combined" shared_engines/runtime/combined_api.py | head -1 | cut -d: -f1 || true)
          if [ -n "$L" ]; then
            s=$((L-3)); [ "$s" -lt 1 ] && s=1
            awk -v a="$s" -v b="$((L+45))" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' shared_engines/runtime/combined_api.py
          fi
          echo '```'
          echo "## StaticTableRateProvider en todo el runtime (cableado actual)"
          echo '```'
          grep -rn "StaticTableRateProvider\|ErApiRateProvider\|CryptoRateProvider" shared_engines/runtime main.py 2>/dev/null | head -15 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P6 - sonda de arranque real (health + bridge routes)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import threading
          import time
          import urllib.request
          import urllib.error
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined

          db = SQLiteAdapter(":memory:")
          k = ZyraKernel(db=db, clock=SystemClock(), config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          k.bootstrap_root()
          caps = ZyraCapabilities(db, SystemClock(), identity=k.identity, signer=None) if False else None
          print("## Sonda arranque real")
          print("```")
          try:
              from shared_engines.verification.signatures import Ed25519Signer
              s, _ = Ed25519Signer.generate()
              caps = ZyraCapabilities(db, SystemClock(), identity=k.identity, signer=s)
              print("caps OK. atributos:", sorted(vars(caps).keys()))
          except Exception as e:
              print("caps fallo:", type(e).__name__, str(e)[:120])
          try:
              srv = serve_combined(k, caps, host="127.0.0.1", port=0)
              threading.Thread(target=srv.serve_forever, daemon=True).start()
              time.sleep(0.4)
              base = "http://127.0.0.1:" + str(srv.server_address[1])
              with urllib.request.urlopen(base + "/health", timeout=10) as r:
                  h = json.loads(r.read().decode())
              print("HEALTH:", json.dumps(h)[:300])
              for ruta in ("/bridge/subscriptions/test-app",):
                  try:
                      with urllib.request.urlopen(base + ruta, timeout=10) as r:
                          print(ruta, "->", r.status)
                  except urllib.error.HTTPError as e:
                      body = e.read().decode()[:150]
                      print(ruta, "->", e.code, body)
              srv.shutdown()
              srv.server_close()
          except Exception as e:
              print("servidor:", type(e).__name__, str(e)[:150])
          print("```")
          EOF
          exit 0
