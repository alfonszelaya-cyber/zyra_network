name: ZYRA AXIS Block 5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix event count assertion (5 events: birth+upgrade+exam+result+appointment)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/axis/life_history/tests/"
              "test_health_link.py"
          )
          src = path.read_text(encoding="utf-8")

          if "self.assertEqual(\n                      5,\n                      len(view[\"events\"]),\n                  )" in src:
              print("RESULT: already patched")
          else:
              old = (
                  "self.assertEqual(\n"
                  "                      4,\n"
                  "                      len(view[\"events\"]),\n"
                  "                  )"
              )
              new = (
                  "self.assertEqual(\n"
                  "                      5,\n"
                  "                      len(view[\"events\"]),\n"
                  "                  )"
              )
              assert old in src, "count assertion not found"
              src = src.replace(old, new, 1)

              old_types = (
                  "self.assertEqual(\n"
                  "                      [\n"
                  "                          \"birth_registered\",\n"
                  "                          \"zid_biometric_upgrade\",\n"
                  "                          \"health_exam\",\n"
                  "                          \"health_result\",\n"
                  "                      ],\n"
                  "                      types[:4],\n"
                  "                  )"
              )
              new_types = (
                  "self.assertEqual(\n"
                  "                      [\n"
                  "                          \"birth_registered\",\n"
                  "                          \"zid_biometric_upgrade\",\n"
                  "                          \"health_exam\",\n"
                  "                          \"health_result\",\n"
                  "                          \"health_appointment\",\n"
                  "                      ],\n"
                  "                      types,\n"
                  "                  )"
              )
              assert old_types in src, "types assertion not found"
              src = src.replace(old_types, new_types, 1)

              path.write_text(src, encoding="utf-8")
              print("RESULT: PATCHED OK")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("SYNTAX OK")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/3 Health link tests (3 E2E)
        run: python -m apps.axis.life_history.tests.test_health_link -v

      - name: 2/3 Life History regression
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.biometrics -q
          python -m apps.axis.tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit fix (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/tests/test_health_link.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "health: correct event count - appointment is also chained (5 events)"
            git push
          fi
