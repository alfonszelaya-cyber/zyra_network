name: ZYRA RUM 1B - Gate fix + extraccion cierre RUM 1 (automatica) [LECTURA+GATE]

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Gate de los 2 archivos modificados + verificacion real
        run: |
          python - <<'PY'
          import ast, os, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append
          A("# 🚦 RUM 1B — Gate de cambios + verificacion real\n")

          for ruta in ("superapp.py", "apps/laboratorio/infrastructure/api/app.py"):
              A("## Sintaxis: " + ruta)
              try:
                  ast.parse(Path(ruta).read_text(encoding="utf-8"))
                  A("OK")
              except SyntaxError as e:
                  A("FALLO: " + str(e))
              A("")

          A("## Verificacion real de la app de laboratorio")
          A("```")
          try:
              import importlib
              mod = importlib.import_module("apps.laboratorio.infrastructure.api.app")
              app_obj = mod.montar_aplicacion()
              rutas = app_obj.listar_rutas()
              A("montar_aplicacion(): OK")
              A("rutas REALES registradas (listar_rutas): " + str(len(rutas)))
              for r in rutas:
                  A("  " + str(r.get("metodo", "?")).ljust(6) + " " + str(r.get("patron", "?")))
              estado = app_obj.contenedor.obtener("estado_salud").estado()
              A("health baseline: " + str(estado))
              A("export 'app' via __getattr__: " + str(hasattr(mod, "app")))
              serv = app_obj.construir_servidor("127.0.0.1", 0)
              A("construir_servidor(): OK puerto=" + str(serv.server_address[1]))
              serv.server_close()
          except Exception:
              A("FALLO (diagnostico honesto):")
              A(traceback.format_exc()[-1800:])
          A("```")
          A("")

          A("## Verificacion real del boot de superapp")
          A("```")
          try:
              import importlib
              sup = importlib.import_module("superapp")
              errores = sup.boot_apps()
              A("apps arrancadas: " + str(sorted(sup.APPS.keys())))
              A("errores de arranque: " + str(errores if errores else "(ninguno)"))
          except Exception:
              A("FALLO (diagnostico honesto):")
              A(traceback.format_exc()[-1200:])
          A("```")

          md = "\n".join(L)
          if summary:
              with open(summary, "a") as fh:
                  fh.write(md)
          print(md)
          PY

      - name: Extraer archivos restantes para cerrar RUM 1
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append
          A("\n# 📦 RUM 1C — archivos restantes (base para completar RUM 1)\n")

          archivos = [
              "apps/laboratorio/registry/services/service_registry.py",
              "apps/laboratorio/shared/adapters/engine_adapter.py",
              "apps/laboratorio/shared/dto/engine_dto.py",
              "apps/laboratorio/infrastructure/security/zid_auth.py",
              "apps/laboratorio/infrastructure/security/signing.py",
              "apps/laboratorio/infrastructure/security/audit_sink.py",
              "apps/laboratorio/constants/system/system_constants.py",
              "apps/laboratorio/constants/roles/role_codes.py",
              "apps/laboratorio/constants/permissions/permission_codes.py",
              "apps/laboratorio/infrastructure/messaging/event_bus.py",
              "apps/laboratorio/infrastructure/messaging/outbox.py",
              "apps/laboratorio/infrastructure/messaging/subscribers.py",
              "apps/laboratorio/infrastructure/database/connection.py",
              "apps/laboratorio/infrastructure/database/tables.py",
              "apps/nexo/services/startup.py",
          ]
          for extra in sorted(str(p) for p in Path("tests").glob("*.py")):
              archivos.append(extra)

          for ruta in archivos:
              p = Path(ruta)
              A("")
              A("## 📄 " + ruta)
              A("")
              if not p.is_file():
                  A("**NO EXISTE**")
                  continue
              A("```python")
              A(p.read_text(encoding="utf-8", errors="replace"))
              A("```")

          md = "\n".join(L)
          Path("rum1c_archivos.md").write_text(md, encoding="utf-8")
          if summary:
              salida = md
              if len(salida) > 900000:
                  salida = salida[:900000] + "\n\n**(RECORTE — completo en el artefacto)**\n"
              with open(summary, "a") as fh:
                  fh.write(salida)
          print("extraccion 1C lista: " + str(len(md)) + " chars")
          PY

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rum1c-archivos
          path: rum1c_archivos.md
