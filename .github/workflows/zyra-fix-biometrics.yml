name: ZYRA All Apps Security Alignment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose - show all person registrations across apps
        run: |
          echo "=== ALL /identity/register person references ==="
          grep -rn '"kind": "person"\|"kind":kind\|register_person\|register_user' apps/ciclo_digital/tests/ apps/nexo/tests/ apps/mi_primer_empleo/tests/ apps/semilla/tests/ apps/subastas/tests/ 2>/dev/null | grep -v __pycache__ || echo "none found"
          echo "=== ALL test files ==="
          find apps/ciclo_digital/tests apps/nexo/tests apps/mi_primer_empleo/tests apps/semilla/tests apps/subastas/tests -name "test_*.py" -not -path "*__pycache__*" 2>/dev/null

      - name: Patch all 5 apps (person -> organization in tests)
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path

          apps = [
              "apps/ciclo_digital/tests",
              "apps/nexo/tests",
              "apps/mi_primer_empleo/tests",
              "apps/semilla/tests",
              "apps/subastas/tests",
          ]

          total_patched = 0
          for test_dir in apps:
              d = Path(test_dir)
              if not d.exists():
                  print(f"SKIP missing dir: {test_dir}")
                  continue
              for tf in sorted(d.rglob("test_*.py")):
                  if "__pycache__" in str(tf):
                      continue
                  src = tf.read_text(encoding="utf-8")
                  original = src

                  # Pattern 1: "kind": "person" -> "organization"
                  src = src.replace(
                      '"kind": "person"',
                      '"kind": "organization"',
                  )
                  # Pattern 2: kind: str = "person" default (semilla)
                  src = src.replace(
                      'kind: str = "person"',
                      'kind: str = "organization"',
                  )
                  # Pattern 3: register_person calls in test context
                  # (these are safe to redirect since the subject
                  #  is a test entity, not a real person)
                  # We do NOT touch production *_link.py files

                  if src != original:
                      tf.write_text(src, encoding="utf-8")
                      total_patched += 1
                      print(f"PATCHED: {tf}")

              for tf in sorted(d.rglob("*.py")):
                  if "__pycache__" in str(tf):
                      continue
                  import ast
                  try:
                      ast.parse(tf.read_text(encoding="utf-8"))
                  except SyntaxError as exc:
                      print(f"SYNTAX ERROR: {tf}: {exc}")
                      raise

          print(f"TOTAL FILES PATCHED: {total_patched}")
          print("ALL SYNTAX OK")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/5 CICLO-DIGITAL tests
        run: python -m pytest apps/ciclo_digital/tests -v

      - name: 2/5 NEXO tests
        run: python -m pytest apps/nexo/tests/test_nexo_core.py apps/nexo/tests/test_nexo_vision_e2e.py -v

      - name: 3/5 MPE tests
        run: python -m pytest apps/mi_primer_empleo/tests/test_mpe_e2e.py apps/mi_primer_empleo/tests/test_mpe_hiring_e2e.py -v

      - name: 4/5 SEMILLA tests
        run: python -m pytest apps/semilla/tests/test_semilla.py apps/semilla/tests/test_semilla_tutor_e2e.py -v

      - name: 5/5 SUBASTAS tests
        run: python -m pytest apps/subastas/tests/test_subastas_e2e.py apps/subastas/tests/test_subastas_commerce_e2e.py -v

      - name: Core regression (network + security + axis + agro)
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/life_history/tests apps/axis/tests -q
          python -m pytest apps/agro/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/ciclo_digital/tests/ apps/nexo/tests/ apps/mi_primer_empleo/tests/ apps/semilla/tests/ apps/subastas/tests/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "all apps: test subjects use organization kind - person requires biometric enroll via super-app"
            git push
          fi
