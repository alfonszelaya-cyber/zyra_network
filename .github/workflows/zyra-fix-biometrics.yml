name: "AXIS AUDITORIA COMPLETA: arbol + codigo + wiring + tests + duplicados + inventario (solo lectura)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - suite completa de AXIS + contextos"
        run: |
          python3 - <<'SUITEEOF'
          import subprocess
          import sys

          OUT = "axis_suite.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          log("======== SUITE AXIS ========")
          for area in (
              "apps/axis/tests",
              "apps/axis/life_history/tests",
          ):
              r = subprocess.run(
                  [sys.executable, "-m", "pytest",
                   area, "-q", "--tb=short",
                   "-p", "no:cacheprovider"],
                  capture_output=True, text=True,
                  timeout=600)
              log("--- " + area + " ---")
              log(r.stdout or r.stderr)
          log("======== FIN SUITE ========")
          rep.close()
          SUITEEOF

      - name: "Paso 2 - ARBOL completo con marca de codigo real por archivo"
        run: |
          python3 - <<'TREEEOF'
          from pathlib import Path

          OUT = "axis_arbol.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          app = Path("apps/axis")
          log("======== ARBOL COMPLETO DE AXIS ========")
          total = 0
          con_codigo = 0
          for p in sorted(app.rglob("*.py")):
              if "__pycache__" in p.parts:
                  continue
              total += 1
              t = p.read_text(
                  encoding="utf-8", errors="ignore")
              if t.strip():
                  con_codigo += 1
                  lines = len(t.splitlines())
                  log("[COD " + str(lines).rjust(5)
                      + "l] " + str(p.relative_to(app)))
              else:
                  log("[VACIO    ] "
                      + str(p.relative_to(app)))
          log("")
          log("total .py: " + str(total))
          log("con codigo: " + str(con_codigo))
          log("vacios: " + str(total - con_codigo))

          log("")
          log("======== CONTENIDO COMPLETO DE ARCHIVOS CON CODIGO (excluye tests, se ven en paso 1) ========")
          for p in sorted(app.rglob("*.py")):
              if "__pycache__" in p.parts:
                  continue
              if "tests" in p.parts:
                  continue
              t = p.read_text(
                  encoding="utf-8", errors="ignore")
              if not t.strip():
                  continue
              log("")
              log("=" * 20 + " "
                  + str(p.relative_to(app))
                  + " (" + str(len(t.splitlines()))
                  + " lineas) " + "=" * 20)
              log(t)
          rep.close()
          TREEEOF

      - name: "Paso 3 - WIRING: vivos desde server + imports dinamicos + duplicados"
        run: |
          python3 - <<'WIREEOF'
          import re
          from collections import defaultdict
          from pathlib import Path

          OUT = "axis_wiring.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          app = Path("apps/axis")
          archivos = {}
          for p in sorted(app.rglob("*.py")):
              if "__pycache__" in p.parts:
                  continue
              archivos[p] = p.read_text(
                  encoding="utf-8", errors="ignore")

          def resolve_abs(mod):
              base = Path(mod.replace(".", "/"))
              for c in (base.with_suffix(".py"),
                        base / "__init__.py"):
                  if c.exists():
                      return c
              return None

          deps = {}
          for src, t in archivos.items():
              s = set()
              for m in re.finditer(
                  r'^\s*from\s+((?:\.)+)([\w\.]*)\s+import\s+(.+)$',
                  t, re.M):
                  ndots = len(m.group(1))
                  d = src.parent
                  for _ in range(ndots - 1):
                      d = d.parent
                  mod = m.group(2)
                  if mod:
                      target = d / mod.replace(".", "/")
                      for c2 in (
                          target.with_suffix(".py"),
                          target / "__init__.py"):
                          if c2.exists():
                              s.add(c2)
                  for nm in [
                      x.strip().split(" as ")[0].strip()
                      for x in m.group(3).split(",")]:
                      nm2 = (
                          mod + "." + nm) if mod else nm
                      target = d / nm2.replace(".", "/")
                      for c2 in (
                          target.with_suffix(".py"),
                          target / "__init__.py"):
                          if c2.exists():
                              s.add(c2)
              for m in re.finditer(
                  r'"(apps\.axis[\w\.]*)"', t):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      s.add(c)
              for m in re.finditer(
                  r'^\s*from\s+(apps\.axis[\w\.]*)\s+import',
                  t, re.M):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      s.add(c)
              for m in re.finditer(
                  r'^\s*import\s+(apps\.axis[\w\.]*)',
                  t, re.M):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      s.add(c)
              deps[src] = s

          roots = [app / "server.py"] + [
              p for p in archivos
              if "tests" in p.parts
              and p.name.startswith("test_")
          ]
          keep = set()
          work = list(roots)
          while work:
              f = work.pop(0)
              if f in keep or f not in archivos:
                  continue
              keep.add(f)
              for d in deps.get(f, set()):
                  work.append(d)

          importado_por = defaultdict(set)
          for src, s in deps.items():
              for d in s:
                  importado_por[d].add(src)

          con_codigo = {
              p for p, t in archivos.items()
              if t.strip()
          }
          vivos = keep & con_codigo

          log("======== WIRING DE AXIS ========")
          log("con codigo: " + str(len(con_codigo)))
          log("VIVOS (server+tests+transitivos): "
              + str(len(vivos)))
          log("importados pero no vivos: "
              + str(len([
                  p for p in con_codigo
                  if p in importado_por
                  and p not in vivos])))
          log("")
          log("--- VIVOS ---")
          for p in sorted(vivos):
              log("  " + str(p.relative_to(app)))
          log("")
          log("--- CON CODIGO SIN USO (ni vivos ni importados, excluye tests) ---")
          for p in sorted(con_codigo - vivos):
              if "tests" in p.parts:
                  continue
              log("  " + str(p.relative_to(app)))

          log("")
          log("======== DUPLICADOS EXACTOS ========")
          import hashlib
          por_hash = defaultdict(list)
          for p, t in archivos.items():
              if not t.strip():
                  continue
              h = hashlib.sha256(
                  t.encode()).hexdigest()
              por_hash[h].append(p)
          hay = False
          for h, ps in por_hash.items():
              if len(ps) > 1:
                  hay = True
                  for p in ps:
                      log("  " + str(p.relative_to(app)))
          if not hay:
              log("  NINGUNO")

          log("")
          log("======== NOMBRES DUPLICADOS ========")
          por_nombre = defaultdict(list)
          for p in con_codigo:
              por_nombre[p.name].append(p)
          for n in sorted(por_nombre):
              ps = por_nombre[n]
              if len(ps) > 1:
                  log("  " + n + " x" + str(len(ps)))
                  for p in sorted(ps):
                      marca = ("VIVO" if p in vivos
                               else "sin-uso")
                      log("      [" + marca + "] "
                          + str(p.relative_to(app)))
          rep.close()
          WIREEOF

      - name: "Paso 4 - INVENTARIO: rutas + endpoints de la Red + servicios"
        run: |
          python3 - <<'INVEOF'
          import re
          from pathlib import Path

          OUT = "axis_inventario.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          app = Path("apps/axis")
          texto = ""
          for p in app.rglob("*.py"):
              if "__pycache__" in p.parts:
                  continue
              try:
                  texto += p.read_text(
                      encoding="utf-8",
                      errors="ignore")
              except Exception:
                  pass

          log("======== ENDPOINTS DE LA RED CONSUMIDOS ========")
          endpoints = sorted(set(re.findall(
              r'"(/(?:identity|trust|history|apps|tokens|documents|currency|verification|reputation|proofing)[\w/\-]*)"',
              texto)))
          for e in endpoints:
              log("  " + e)

          log("")
          log("======== RUTAS PROPIAS DE AXIS ========")
          rutas = sorted(set(re.findall(
              r'"(/axis[\w\-/]*)"', texto)))
          for r in rutas:
              log("  " + r)

          log("")
          log("======== SERVICIOS DE life_history (funciones publicas) ========")
          lh = app / "life_history"
          for p in sorted(lh.glob("*.py")):
              if "__pycache__" in p.parts:
                  continue
              if p.name == "__init__.py":
                  continue
              t = p.read_text(
                  encoding="utf-8", errors="ignore")
              cls = re.findall(r'^class\s+(\w+)', t, re.M)
              defs = re.findall(
                  r'^    def (\w+)\(', t, re.M)
              if cls or defs:
                  log("  " + p.name
                      + ": classes="
                      + str(cls)
                      + " metodos=" + str(len(defs)))

          log("")
          log("======== TABLAS SQLITE creadas por AXIS ========")
          tablas = sorted(set(re.findall(
              r'CREATE TABLE IF NOT EXISTS\s*"?'
              r'(\w+)', texto)))
          for t in tablas:
              log("  " + t)

          log("")
          log("======== CHECKLIST INTEGRACION CON RED ========")
          log("  enroll biometrico: "
              + str("/identity/enroll" in texto))
          log("  trust/complete: "
              + str("/trust/complete" in texto))
          log("  history/append: "
              + str("/history/append" in texto))
          log("  apps/register: "
              + str("/apps/register" in texto))
          log("  documents/seal: "
              + str("/documents/seal" in texto))
          rep.close()
          INVEOF

      - name: "Paso 5 - artifact"
        uses: actions/upload-artifact@v4
        with:
          name: axis-auditoria
          path: |
            axis_suite.txt
            axis_arbol.txt
            axis_wiring.txt
            axis_inventario.txt
          if-no-files-found: warn

      - name: "Resumen"
        run: |
          echo "=============================================="
          echo " AUDITORIA AXIS (solo lectura)"
          echo " Artifact 'axis-auditoria':"
          echo "  - suite (43+ tests esperados)"
          echo "  - arbol completo con codigo por archivo"
          echo "  - contenido COMPLETO de cada archivo real"
          echo "  - wiring vivos/sin-uso + duplicados"
          echo "  - inventario rutas/endpoints/servicios/tablas"
          echo "=============================================="
