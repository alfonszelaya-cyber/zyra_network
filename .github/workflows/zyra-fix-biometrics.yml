name: "RED-FIX FINAL v2: test expediente crea tabla biometric_templates simulada"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Fix - test expediente: crear tabla biometric_templates simulada antes del insert"
        run: |
          python3 - <<'FEOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/tests/test_portable_identity.py")
          t = p.read_text(encoding="utf-8")
          if "CREATE TABLE IF NOT EXISTS biometric_templates" in t:
              print("SKIP (ya presente)")
              raise SystemExit(0)
          VIEJO = (
              '                  db.execute("INSERT INTO biometric_templates (template_id, identity_zid, modality, template_enc, dims, created_at) VALUES (\'T-1\', ?, \'face\', x\'00\', 1, 1)", (zid,))'
          )
          NUEVO = (
              '                  db.execute("CREATE TABLE IF NOT EXISTS biometric_templates (template_id TEXT PRIMARY KEY, identity_zid TEXT, modality TEXT, template_enc BLOB, dims INTEGER, created_at REAL)")\n'
              '                  db.execute("INSERT INTO biometric_templates (template_id, identity_zid, modality, template_enc, dims, created_at) VALUES (\'T-1\', ?, \'face\', x\'00\', 1, 1)", (zid,))'
          )
          cnt = t.count(VIEJO)
          assert cnt == 1, "ancla insert " + str(cnt)
          t = t.replace(VIEJO, NUEVO, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK: tabla simulada creada antes del insert (AST valido)")
          FEOF

      - name: "GATE Red (por motor con timeout)"
        run: |
          set +e
          FAIL=0
          for motor in runtime network events integrations; do
            if [ "$motor" = "runtime" ]; then
              dir="shared_engines/runtime/tests"
            else
              dir="shared_engines/$motor/tests"
            fi
            if [ -d "$dir" ]; then
              timeout 120 python3 -m pytest "$dir" -q --tb=short > "/tmp/gate_$motor.txt" 2>&1
              CODE=$?
              if [ $CODE -eq 124 ]; then
                echo "HANG: $motor"
                FAIL=1
              elif [ $CODE -ne 0 ]; then
                echo "FALLO: $motor"
                tail -10 "/tmp/gate_$motor.txt"
                FAIL=1
              else
                echo "VERDE: $motor :: $(tail -1 /tmp/gate_$motor.txt)"
              fi
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "GATE ROJO"
            exit 1
          fi
          echo "GATE VERDE"
          exit 0

      - name: "GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-FINAL v2: test expediente crea tabla biometric_templates simulada" -m "Ultimo fallo: el test de expediente inserta en biometric_templates para simular el binding, pero esa tabla la crea el motor de biometria que no esta wired en ese test aislado. Fix: el test crea la tabla minima antes del insert. Con esto: 1 failed 37 passed -> 38 passed."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
