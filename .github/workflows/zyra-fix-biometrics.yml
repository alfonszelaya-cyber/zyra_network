          check("Menus (18), roles (7), permisos (18), eventos", t_registros_menu_roles_permisos)
          check("Motores honestos (SVG ok, holo no disponible)", t_motores_honestos)
          check("Renderer SVG real con porcentaje literal correcto", t_renderer_svg_real)
          check("Sanitizer, firmas y validacion de roles", t_seguridad_utilidades)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas E2E OK, 0 errores**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas E2E OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 1A-4b aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 1A-4b: renderer SVG y pruebas E2E corregidas"
            git push
          fi
