name: "ZYRA - AUDITORIA de los 2 fallos exactos (solo lectura, 1 min)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Auditar los 2 fallos linea por linea
        run: |
          python - <<'PYEOF'
          import ast, importlib, os, sys
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append


          def finalizar():
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("\n".join(L) + "\n")
              sys.exit(0)


          A("# 🔍 AUDITORIA — 2 fallos exactos\n")

          A("## FALLO 1: test_video_ensambla_contenedor_valido\n")
          A("**Error:** buffer de 9216 bytes recibido, se esperaban 3072\n")
          A("### Causa raiz — inspeccion del test linea 14:\n```python")
          t = Path("apps/laboratorio/tests/test_video_impresion.py").read_text(encoding="utf-8", errors="replace")
          for i, linea in enumerate(t.splitlines(), 1):
              if 12 <= i <= 16:
                  A(f"L{i}: {linea}")
          A("```\n")
          A("**Analisis:** `bytes(bytes(color) * (32*32*3))` -> bytes((b'\\xff\\x00\\x00') * 3072) = 9216 bytes (3 bytes por pixel x 3 veces mas de lo necesario). `encode_png_rgb(32, 32, ...)` espera 32*32*3 = 3072 bytes. El `bytes()` exterior es redundante y multiplica mal.\n")
          A("**Fix:** la linea 14 debe ser:\n```python")
          A("return encode_png_rgb(32, 32, bytes(color) * (32 * 32 * 3))")
          A("```\n")

          A("## FALLO 2: test_p3d_y_video_por_http\n")
          A("**Error:** Ruta no encontrada: POST /laboratorio/api/v1/scenes/.../print3d/stl -> 404\n")
          p = Path("apps/laboratorio/routers/api/world4d.py")
          if p.is_file():
              t2 = p.read_text(encoding="utf-8", errors="replace")
              A("### world4d.py existe (" + str(len(t2.splitlines())) + " lineas). Verificando ruta print3d/stl:")
              A("- 'RUTA_STL' declarado: " + ("✅ SI" if "RUTA_STL" in t2 else "❌ NO"))
              A("- 'print3d/stl' en el patron: " + ("✅ SI" if "print3d/stl" in t2 else "❌ NO"))
              A("- 'app.registrar(\"POST\", RUTA_STL' presente: " + ("✅ SI" if 'app.registrar("POST", RUTA_STL' in t2 else "❌ NO"))
              A("- 'def _stl' presente: " + ("✅ SI" if "def _stl" in t2 else "❌ NO"))
              A("")
              try:
                  mod = importlib.import_module("apps.laboratorio.routers.api.world4d")
                  A("- import world4d: OK")
                  for nombre in ("RUTA_STL", "RUTA_GCODE", "RUTA_P3D_FULL"):
                      A("  - " + nombre + " = " + str(getattr(mod, nombre, "NO EXISTE")))
              except Exception:
                  A("- ❌ import world4d FALLO:")
                  import traceback as tb
                  A("```")
                  A(tb.format_exc()[-800:])
                  A("```")
              A("")
              A("### Verificando que la ruta se registra en el montaje real:\n```")
              try:
                  mod_app = importlib.import_module("apps.laboratorio.infrastructure.api.app")
                  app = mod_app.montar_aplicacion(":memory:")
                  rutas = app.listar_rutas()
                  print3d = [r for r in rutas if "print3d" in str(r.get("patron", ""))]
                  A("rutas con print3d: " + str(len(print3d)))
                  for r in print3d:
                      A("  " + str(r.get("metodo", "?")) + " " + str(r.get("patron", "?")))
                  if not print3d:
                      A("FALLO: print3d NO esta en las rutas registradas")
                      A("total rutas: " + str(len(rutas)))
                      non_print = [r.get("patron") for r in rutas[-25:]]
                      A("ultimas 25 rutas: " + str(non_print))
              except Exception:
                  import traceback as tb
                  A("MONTAJE FALLO:")
                  A(tb.format_exc()[-900:])
              A("```")
          else:
              A("❌ world4d.py NO EXISTE")
          A("")

          A("## LO QUE SE NECESITA (diagnostico automatico)\n")
          A("- FALLO 1: cambiar linea 14 del test: quitar el `bytes(...)` exterior que multiplica la tupla.")
          A("- FALLO 2: segun lo que muestre arriba:")
          A("  - si la ruta NO esta en world4d.py -> reescribir world4d.py completo con print3d incluido")
          A("  - si esta declarada pero no registrada -> registrar en registrar_rutas()")
          A("  - si esta registrada pero montar_aplicacion no la ve -> verificar el orden de cableado en service_registry")
          finalizar()
          PYEOF

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-2-fallos
          path: auditoria_2_fallos.md
