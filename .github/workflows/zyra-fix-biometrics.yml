name: ZYRA Fase 5b orden con red de seguridad

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fase5b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ordenar manifiesto y sembrar invariantes
        run: |
          python3 - <<'PYEOF'
          import hashlib, importlib.util, json, os, sys, traceback
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          GATES = []

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('fase5b.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO - el run aborto antes de terminar')
              add('')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _manejador

          def gate(nombre, ok):
              GATES.append((nombre, bool(ok)))
              add('- gate %s: %s' % (nombre, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def contar():
              nf = 0
              np = 0
              for p in ROOT.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                      continue
                  nf += 1
                  if p.suffix == '.py':
                      np += 1
              return nf, np

          def modulos_con_codigo(ns):
              base = ROOT / 'shared_engines' / ns
              total = 0
              if base.is_dir():
                  for x in base.rglob('*.py'):
                      if x.name == '__init__.py':
                          continue
                      try:
                          if x.stat().st_size > 0:
                              total += 1
                      except OSError:
                          pass
              return total

          def filas_manifiesto(texto):
              res = []
              for ln in texto.splitlines():
                  s = ln.strip()
                  if not (s.startswith('|') and s.count('|') >= 3):
                      continue
                  cells = [c.strip() for c in s.strip('|').split('|')]
                  if len(cells) >= 2 and cells[0].endswith('/') and cells[0] != 'Namespace':
                      res.append((ln, cells[0].strip('`* ').rstrip('/'),
                                  cells[1].strip('`* ').upper()))
              return res

          add('# FASE 5b - ORDEN: MANIFIESTO VERAZ + TESTS DE INVARIANTES')
          add('')
          add('Correccion del #757: TypeError por pasar una tupla donde se esperaba un string (linea del gate N2).')
          add('Ademas: red de seguridad global - si el script muere, el Summary imprime el traceback completo.')
          add('')
          add('Los 16 motores con codigo pasan de FUTURE a BUILT (codigo construido, inactivo hasta cumplir su condicion).')
          add('NO se activa nada: solo se dice la verdad sobre que existe.')
          add('')

          nf0, np0 = contar()
          add('## Snapshot inicial')
          add('')
          add('- archivos: %d | python: %d' % (nf0, np0))
          add('')

          add('## N1. Edicion del NAMESPACE_MANIFEST')
          add('')
          man = ROOT / 'NAMESPACE_MANIFEST.md'
          texto = man.read_text(encoding='utf-8')
          lineas = texto.splitlines()
          modificadas = []
          for i, ln in enumerate(lineas):
              s = ln.strip()
              if not (s.startswith('|') and s.count('|') >= 3):
                  continue
              cells = [c.strip() for c in s.strip('|').split('|')]
              if len(cells) < 2 or not cells[0].endswith('/') or cells[0] == 'Namespace':
                  continue
              ns = cells[0].strip('`* ').rstrip('/')
              if cells[1].strip('`* ').upper() == 'FUTURE' and modulos_con_codigo(ns) > 0:
                  lineas[i] = ln.replace('FUTURE', 'BUILT', 1)
                  modificadas.append((ns, modulos_con_codigo(ns)))
          leyenda_nueva = ('Etiquetas: BUILT (codigo construido en repo, inactivo hasta cumplir '
                           'su condicion de activacion) - FUTURE (reservado por roadmap, sin '
                           'implementacion) - APP-SCOPE (de una App).')
          puso_leyenda = False
          for i, ln in enumerate(lineas):
              if ln.startswith('Etiquetas:') and 'BUILT' not in ln:
                  lineas[i] = leyenda_nueva
                  puso_leyenda = True
                  break
          man.write_text('\n'.join(lineas) + '\n', encoding='utf-8')
          add('- Motores reclasificados FUTURE -> BUILT: **%d**' % len(modificadas))
          for ns, m in modificadas:
              add('  - %s (%d modulos con codigo)' % (ns, m))
          add('- Leyenda de etiquetas actualizada: %s' % puso_leyenda)
          add('')

          texto2 = man.read_text(encoding='utf-8')
          restantes = [(ns, e) for _ln, ns, e in filas_manifiesto(texto2) if e == 'FUTURE']
          malos = [ns for ns, _e in restantes if modulos_con_codigo(ns) > 0]
          add('## N2. Verificacion post-edicion (gate) - LINEA CORREGIDA')
          add('')
          add('- Filas FUTURE restantes: %d (esperado: solo orchestration y similares sin codigo)' % len(restantes))
          for ns, _e in restantes:
              add('  - %s (modulos=%d)' % (ns, modulos_con_codigo(ns)))
          add('- FUTURE con codigo (debe ser 0): %d' % len(malos))
          gate('manifiesto_veraz', len(malos) == 0)
          add('')

          add('## N3. JS del portal: fuente canonica')
          add('')
          vj = ROOT / 'portal' / 'verificar.js'
          aj = ROOT / 'public' / 'app.js'
          hv = hashlib.sha256(vj.read_bytes()).hexdigest()[:12] if vj.exists() else 'AUSENTE'
          ha = hashlib.sha256(aj.read_bytes()).hexdigest()[:12] if aj.exists() else 'AUSENTE'
          add('- portal/verificar.js: %s (CANONICO - lo usa superapp.py y portal/verificar.html)' % hv)
          add('- public/app.js: %s (copia sincronizada - la usa public/index.html)' % ha)
          js_ok = (hv == ha and hv != 'AUSENTE')
          gate('js_sincronizados', js_ok)
          add('- Regla: cambios solo en el canonico; luego copiar. El test permanente lo vigila.')
          add('')

          add('## N4. Tests de invariantes permanentes')
          add('')
          T1 = [
          '"""Las dos copias del JS del portal deben mantenerse byte-identicas."""',
          'from pathlib import Path',
          '',
          'ROOT = Path(__file__).resolve().parents[1]',
          '',
          '',
          'def test_portal_js_sincronizados():',
          '    canonico = ROOT / "portal" / "verificar.js"',
          '    copia = ROOT / "public" / "app.js"',
          '    assert canonico.read_bytes() == copia.read_bytes(), (',
          '        "verificar.js y app.js divergieron."',
          '        " Actualizar desde el canonico portal/verificar.js"',
          '    )',
          ]
          T2 = [
          '"""Invariante: un namespace etiquetado FUTURE no debe tener modulos con codigo."""',
          'from pathlib import Path',
          '',
          'ROOT = Path(__file__).resolve().parents[1]',
          '',
          '',
          'def _modulos_con_codigo(ns):',
          '    base = ROOT / "shared_engines" / ns',
          '    total = 0',
          '    if base.is_dir():',
          '        for x in base.rglob("*.py"):',
          '            if x.name == "__init__.py":',
          '                continue',
          '            try:',
          '                if x.stat().st_size > 0:',
          '                    total += 1',
          '            except OSError:',
          '                pass',
          '    return total',
          '',
          '',
          'def test_future_sin_codigo():',
          '    man = ROOT / "NAMESPACE_MANIFEST.md"',
          '    filas = 0',
          '    for ln in man.read_text(encoding="utf-8").splitlines():',
          '        s = ln.strip()',
          '        if not (s.startswith("|") and s.count("|") >= 3):',
          '            continue',
          '        cells = [c.strip() for c in s.strip("|").split("|")]',
          '        if len(cells) < 2 or not cells[0].endswith("/") or cells[0] == "Namespace":',
          '            continue',
          '        ns = cells[0].strip("`* ").rstrip("/")',
          '        etiqueta = cells[1].strip("`* ").upper()',
          '        filas += 1',
          '        if etiqueta == "FUTURE":',
          '            assert _modulos_con_codigo(ns) == 0, (',
          '                ns + " etiquetado FUTURE pero tiene modulos con codigo"',
          '            )',
          '    assert filas >= 15, "manifiesto sin filas de namespaces: formato inesperado"',
          ]
          creados = 0
          t1 = ROOT / 'tests' / 'test_portal_js_sync.py'
          t2 = ROOT / 'tests' / 'test_namespace_manifest.py'
          if not t1.exists():
              t1.write_text('\n'.join(T1) + '\n', encoding='utf-8')
              creados += 1
              add('- creado tests/test_portal_js_sync.py')
          else:
              add('- ya existe tests/test_portal_js_sync.py')
          if not t2.exists():
              t2.write_text('\n'.join(T2) + '\n', encoding='utf-8')
              creados += 1
              add('- creado tests/test_namespace_manifest.py')
          else:
              add('- ya existe tests/test_namespace_manifest.py')
          add('')

          add('## N5. Ejecucion de los invariantes (mini-runner, sin dependencias)')
          add('')
          tests_ok = True
          for t in (t1, t2):
              try:
                  spec = importlib.util.spec_from_file_location(t.stem, t)
                  mod = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(mod)
                  ejecutados = 0
                  for nombre in dir(mod):
                      if nombre.startswith('test_'):
                          getattr(mod, nombre)()
                          ejecutados += 1
                  add('- %s: %d test(s) pasan' % (t.name, ejecutados))
              except Exception as e:
                  tests_ok = False
                  add('- %s FALLO: %s' % (t.name, e))
          gate('invariantes_pasan', tests_ok)
          add('')

          add('## N6. Conteo dinamico')
          add('')
          nf1, np1 = contar()
          add('- python: %d (esperado %d = %d + %d tests creados)' % (np1, np0 + creados, np0, creados))
          add('- archivos: %d (esperado %d)' % (nf1, nf0 + creados))
          gate('conteo_dinamico', np1 == np0 + creados and nf1 == nf0 + creados)
          add('')
          add('### Conteos acumulados')
          add('')
          add('- Original: 6968 archivos / python 4506')
          add('- Fase 2 (pyc): 4574 / 4506')
          add('- Fase 4c (legacy): 4566 / 4498')
          add('- Fase 5b (tests de invariantes): **%d / %d** (+%d, intencional)' % (nf1, np1, creados))
          add('')

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. El commit se aborta.**' % ', '.join(fallos))
          else:
              add('**Todos los gates OK. Siguiente: Fase 6 - render real + pruebas de registro ZID.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          DATA['reclasificados'] = [[ns, m] for ns, m in modificadas]
          DATA['conteo'] = {'antes': [nf0, np0], 'despues': [nf1, np1], 'creados': creados}
          Path('fase5b.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')

          escribe()
          print('Fase 5b terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON - commit abortado')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A NAMESPACE_MANIFEST.md tests
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "docs(order): manifiesto sincronizado (BUILT) y tests de invariantes permanentes"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios (ya ordenado)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase5b-zyra
          path: fase5b.json
          if-no-files-found: ignore
