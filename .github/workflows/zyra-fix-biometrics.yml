name: "ZYRA FIX v12: semilla base64 valida + resiliencia server AGRO"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-fix-biometrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 0 - Dump: enroll_producer de zyra_link AGRO (referencia)"
        run: |
          python3 - <<'DUMPEOF'
          import re
          from pathlib import Path
          p = Path("apps/agro/services/zyra_link.py")
          if not p.exists():
              print("zyra_link.py AGRO NO EXISTE")
              raise SystemExit(0)
          t = p.read_text(encoding="utf-8", errors="ignore")
          i = t.find("def enroll_producer")
          if i >= 0:
              print("===== zyra_link.py AGRO (region enroll_producer) =====")
              print(t[max(0, i - 500): i + 2500])
          else:
              print("enroll_producer no encontrado en zyra_link.py")
          DUMPEOF

      - name: "Paso 1 - parches: semilla base64 valida + resiliencia server AGRO"
        run: |
          python3 - <<'PATCHEOF'
          from pathlib import Path

          REPORT = []

          OLD_SEED = '        _seed = ("zyra-" + str(doc.get("name", "x")).strip().encode("utf-8").hex())[:64]\n'
          NEW_SEED = '        _seed = (str(doc.get("name", "x")).strip().encode("utf-8").hex() + "zyra" * 16)[:64]\n'

          OLD_SEED_V10 = (
              '        doc["doc_image_b64"] = "zyra" * 16\n'
              '        doc["selfie_image_b64"] = "zyra" * 16\n'
          )
          NEW_SEED_V10 = (
              '        _seed = (str(doc.get("name", "x")).strip().encode("utf-8").hex() + "zyra" * 16)[:64]\n'
              '        doc["doc_image_b64"] = _seed\n'
              '        doc["selfie_image_b64"] = _seed\n'
          )

          def fix_seed(txt):
              if OLD_SEED in txt:
                  return txt.replace(OLD_SEED, NEW_SEED)
              if OLD_SEED_V10 in txt:
                  return txt.replace(OLD_SEED_V10, NEW_SEED_V10)
              if NEW_SEED.strip() in txt:
                  return None
              raise ValueError("linea de semilla no encontrada")

          for name, path in (
              ("seed aid", "apps/agro/tests/test_agro_aid_e2e.py"),
              ("seed n1", "apps/agro/tests/test_agro_n1.py"),
              ("seed roles", "apps/agro/tests/test_agro_roles.py"),
          ):
              p = Path(path)
              if not p.exists():
                  REPORT.append(f"MISS  {name} ({path} no existe)")
                  continue
              txt = p.read_text(encoding="utf-8")
              try:
                  res = fix_seed(txt)
              except Exception as exc:
                  REPORT.append(f"MISS  {name} ({exc})")
                  continue
              if res is None:
                  REPORT.append(f"SKIP  {name} (ya aplicado)")
                  continue
              try:
                  compile(res, path, "exec")
              except SyntaxError as exc:
                  REPORT.append(f"FAIL  {name} (syntax {exc.lineno})")
                  continue
              p.write_text(res, encoding="utf-8")
              REPORT.append(f"OK    {name}")

          # ---------- resiliencia server AGRO ----------
          OLD_BLOCK = '''            if not ok:
                if is_json:
                    raise ValueError(
                        "registro rechazado: " + str(_error)
                    )
                self._html(
                    400,
                    _page(
                        "AGRO - Registro rechazado",
                        "<h1>Registro rechazado</h1>"
                        "<p>" + str(_error) + "</p>"
                        "<a href='/agro/home'>"
                        "<button>Volver</button></a>",
                    ),
                )
                return
'''
          NEW_BLOCK = '''            if not ok:
                _errtxt = str(_error or "")
                _low = _errtxt.lower()
                _offline = any(
                    m in _low
                    for m in (
                        "urlopen error",
                        "connection refused",
                        "connection reset",
                        "timed out",
                        "timeout",
                        "unreachable",
                        "errno",
                        "max retries",
                    )
                )
                if not _offline:
                    if is_json:
                        raise ValueError(
                            "registro rechazado: " + _errtxt
                        )
                    self._html(
                        400,
                        _page(
                            "AGRO - Registro rechazado",
                            "<h1>Registro rechazado</h1>"
                            "<p>" + _errtxt + "</p>"
                            "<a href='/agro/home'>"
                            "<button>Volver</button></a>",
                        ),
                    )
                    return
                # Resiliencia (principio de la Red, probado en
                # AGRO y NEXO): red inalcanzable -> la app vive
                # por si sola. Registro local sin ZID; el ZID se
                # vincula despues via super-app. Un rechazo
                # ACTIVO de la red (biometria, duplicado) sigue
                # rechazando: la ley no se abre.
                row = store.add_producer(
                    producer_id=producer_id,
                    zid=None,
                    name=name,
                    producer_type=(
                        producer_type
                    ),
                    role=role,
                    location=location,
                    synced=False,
                )
                if is_json:
                    self._send(
                        201,
                        {
                            "ok": True,
                            "data": row,
                        },
                    )
                else:
                    self._html(
                        200,
                        _page(
                            "Registro listo",
                            "<h1>Registro listo"
                            "</h1><p>Tu ID: <b>"
                            + producer_id
                            + "</b></p>"
                            "<a href='/agro/productor/"
                            + producer_id
                            + "'><button>Ir a mi"
                            " panel</button></a>",
                        ),
                    )
                return
'''

          def fix_server(txt):
              if "_offline = any(" in txt:
                  return None
              i_ley = txt.find('"por ley se requiere"')
              if i_ley < 0:
                  raise ValueError("ancla ley no encontrada")
              pos = txt.find(OLD_BLOCK, i_ley)
              if pos < 0:
                  raise ValueError("bloque if not ok no encontrado tras ley")
              return txt[:pos] + NEW_BLOCK + txt[pos + len(OLD_BLOCK):]

          sp = Path("apps/agro/server.py")
          if not sp.exists():
              REPORT.append("MISS  server-resiliencia (apps/agro/server.py no existe)")
          else:
              txt = sp.read_text(encoding="utf-8")
              try:
                  res = fix_server(txt)
              except Exception as exc:
                  REPORT.append(f"MISS  server-resiliencia ({exc})")
              else:
                  if res is None:
                      REPORT.append("SKIP  server-resiliencia (ya aplicado)")
                  else:
                      try:
                          compile(res, "apps/agro/server.py", "exec")
                      except SyntaxError as exc:
                          REPORT.append(f"FAIL  server-resiliencia (syntax {exc.lineno})")
                      else:
                          sp.write_text(res, encoding="utf-8")
                          REPORT.append("OK    server-resiliencia")

          print("")
          print("======== REPORTE DE PARCHES ========")
          for r in REPORT:
              print(r)
          print("====================================")
          print("")
          for f in (
              "apps/agro/tests/test_agro_aid_e2e.py",
              "apps/agro/tests/test_agro_n1.py",
              "apps/agro/tests/test_agro_roles.py",
          ):
              p = Path(f)
              if p.exists():
                  t = p.read_text(encoding="utf-8")
                  ok_seed = '".hex() + " + chr(34) + "zyra"' in t or 'hex() + "zyra"' in t
                  print(f"{f}: semilla_nueva={'_seed = (str(' in t} | guion_viejo={'zyra-' in t} | wire={'DeterministicTestProvider' in t}")
          PATCHEOF

      - name: "Paso 2 - SMOKE: 3 semillas distintas -> 3 ZID + offline -> 201 local"
        run: |
          python3 - <<'SMOKEEOF'
          import json
          import threading
          import time
          import urllib.error
          import urllib.request

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          from shared_engines.security.biometrics import (
              BiometricsEngine,
              BiometricsPolicy,
              DeterministicTestProvider,
              TemplateCipher,
          )
          from apps.agro.infrastructure.network.network_client import NetworkClient
          from apps.agro.infrastructure.persistence.agro_store import AgroStore
          from apps.agro.server import serve_agro

          def seed_for(name):
              return (name.strip().encode("utf-8").hex() + "zyra" * 16)[:64]

          # --- 1) enrolls directos con la semilla corregida ---
          db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=db, clock=FrozenClock(), signer=signer,
              config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=db, clock=FrozenClock(), audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(db, FrozenClock(), identity=kernel.identity, signer=signer)
          server = serve_combined(kernel, caps, host="127.0.0.1", port=0)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base = f"http://127.0.0.1:{server.server_address[1]}"

          for name in ("Jose Rural", "Nuevo Sin Verificar", "Ganadero Lopez"):
              body = {
                  "kind": "person",
                  "display_name": name,
                  "actor": "smoke",
                  "doc_image_b64": seed_for(name),
                  "selfie_image_b64": seed_for(name),
              }
              req = urllib.request.Request(
                  base + "/identity/enroll",
                  data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      print(f"enroll {name}: {r.status}")
              except urllib.error.HTTPError as e:
                  print(f"enroll {name}: {e.code} {e.read().decode()[:200]}")

          # --- 2) registro AGRO con red muerta -> 201 local sin ZID ---
          dead = NetworkClient("http://127.0.0.1:1", timeout_seconds=1.0, max_retries=0)
          srv = serve_agro(AgroStore(SQLiteAdapter(":memory:"), FrozenClock()), dead)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.4)
          abase = f"http://127.0.0.1:{srv.bound_port}"
          payload = {
              "name": "Maria Offline",
              "producer_type": "agricultora",
              "location": "Usulutan",
              "doc_image_b64": seed_for("Maria Offline"),
              "selfie_image_b64": seed_for("Maria Offline"),
          }
          req = urllib.request.Request(
              abase + "/agro/producers",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  print("OFFLINE /agro/producers:", r.status, r.read().decode()[:250])
          except urllib.error.HTTPError as e:
              print("OFFLINE /agro/producers:", e.code, e.read().decode()[:250])

          print("SMOKE COMPLETADO")
          SMOKEEOF

      - name: "Paso 3 - GATE COMPLETO: 4 apps sin exclusiones"
        run: |
          python3 -m pytest apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests apps/agro/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA FIX v12: semilla base64 valida + resiliencia AGRO" -m "Semilla sin guion (hex+relleno, 64 chars base64 validos); server AGRO: red inalcanzable -> registro local sin ZID (principio de resiliencia), rechazo activo de la red sigue rechazando; gate completo 4 apps."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
