name: ZYRA All Apps Security Alignment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix MPE - activate company identity for credentials
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/mi_primer_empleo/tests/"
              "test_mpe_hiring_e2e.py"
          )
          src = path.read_text(encoding="utf-8")

          marker = "_enroll_user"
          if "_kernel.identity.transition_identity" in src:
              print("RESULT: already patched")
          elif marker not in src:
              print("RESULT: previous patch not present - re-check")
          else:
              anchor = (
                  "        def _enroll_user(self, display_name):\n"
              )
              assert anchor in src, "enroll func not found"
              addition = (
                  "        from shared_engines.identity.contracts import (\n"
                  "            IdentityStatus,\n"
                  "        )\n"
                  "\n"
                  "        def _activate(zid: str) -> None:\n"
                  "            _kernel.identity.transition_identity(\n"
                  "                zid,\n"
                  "                IdentityStatus.ACTIVE,\n"
                  "                actor=\"test-activation\",\n"
                  "                reason=\"verified in test\",\n"
                  "            )\n"
                  "\n"
                  "        _original_register_app = (\n"
                  "            eco.link.register_app\n"
                  "        )\n"
                  "\n"
                  "        def _register_app_and_activate():\n"
                  "            result = _original_register_app()\n"
                  "            return result\n"
                  "\n"
              )
              src = src.replace(anchor, addition + anchor, 1)

              company_anchor = (
                  "        company_id = re.search(\n"
                  '            r"MPE-[a-f0-9]{12}",\n'
                  "            company_html,\n"
                  "        ).group(0)\n"
              )
              assert company_anchor in src, "company anchor missing"
              company_add = company_anchor + (
                  "        company_row = eco.store.get_account(\n"
                  "            company_id\n"
                  "        )\n"
                  "        _activate(\n"
                  "            company_row.get(\"zid\")\n"
                  "        )\n"
              )
              src = src.replace(
                  company_anchor, company_add, 1
              )
              path.write_text(src, encoding="utf-8")
              print("RESULT: ACTIVATION ADDED")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("SYNTAX OK")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/5 CICLO-DIGITAL tests
        run: python -m pytest apps/ciclo_digital/tests -v

      - name: 2/5 NEXO tests
        run: python -m pytest apps/nexo/tests/test_nexo_core.py apps/nexo/tests/test_nexo_vision_e2e.py -v

      - name: 3/5 MPE tests
        run: python -m pytest apps/mi_primer_empleo/tests/test_mpe_e2e.py apps/mi_primer_empleo/tests/test_mpe_hiring_e2e.py -v

      - name: 4/5 SEMILLA tests
        run: python -m pytest apps/semilla/tests/test_semilla.py apps/semilla/tests/test_semilla_tutor_e2e.py -v

      - name: 5/5 SUBASTAS tests
        run: python -m pytest apps/subastas/tests/test_subastas_e2e.py apps/subastas/tests/test_subastas_commerce_e2e.py -v

      - name: Core regression
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/life_history/tests apps/axis/tests -q
          python -m pytest apps/agro/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mi_primer_empleo/tests/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "mpe: company identity activated for credential issuance in test"
            git push
          fi
