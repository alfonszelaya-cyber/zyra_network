name: ZYRA D30b compresion corregida

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD30b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: D30b
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          ROOT = Path.cwd()
          REG = ROOT / 'portal' / 'registro.html'
          t0 = REG.read_text(encoding='utf-8', errors='replace')
          OUT = []
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              import os
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 'faseD30b.md').write_text('\n'.join(OUT), encoding='utf-8')
          add('# D30b - COMPRESION VERIFICADA')
          add('')
          if 'function comprimir' in t0:
              add('- compresion ya presente del D30 (OK).')
          else:
              add('- D30 NO se aplico (se perdio). Aplicando ahora con metodo seguro.')
          add('')
          add('## Estado actual del archivo (diagnostico)')
          add('')
          add('- tamano: %d bytes' % len(t0.encode('utf-8')))
          add('- tiene fetch a /registro/nuevo: %s' % ('/registro/nuevo' in t0))
          add('- tiene marco ovalo: %s' % ('guia-ovalo' in t0))
          add('- tiene envio con doc_back: %s' % ('doc_back_b64' in t0))
          add('')
          if 'function comprimir' not in t0:
              HELPER = ['function comprimir(dataUrl, maxLado, calidad, listo){',
                        'var img=new Image();',
                        'img.onload=function(){',
                        'var w=img.width,h=img.height;',
                        'var esc=Math.min(1,maxLado/Math.max(w,h));',
                        'var c=document.createElement("canvas");',
                        'c.width=Math.round(w*esc);c.height=Math.round(h*esc);',
                        'c.getContext("2d").drawImage(img,0,0,c.width,c.height);',
                        'listo(c.toDataURL("image/jpeg",calidad).split(",")[1]);',
                        '};',
                        'img.src=dataUrl;',
                        '}']
              idx = t0.find('<script>')
              if idx == -1:
                  add('**SIN <script> en el archivo: nada editado.**')
                  escribe()
                  raise SystemExit('SIN ANCLA')
              ins = '\n'.join(HELPER) + '\n'
              t = t0[:idx + 8] + '\n' + ins + t0[idx + 8:]
              m = re.search(r'function prevDoc\(input,imgId\)\{[^}]*\}', t)
              if m:
                  NUEVO = ('function prevDoc(input,imgId){if(!input.files[0])return;'
                           'var r=new FileReader();'
                           'r.onload=function(e){comprimir(e.target.result,900,0.75,'
                           'function(b64){var img=document.getElementById(imgId);'
                           'img.src="data:image/jpeg;base64,"+b64;img.style.display="block";'
                           'input.dataset.b64=b64;input.classList.add("ok");});};'
                           'r.readAsDataURL(input.files[0]);}')
                  t = t.replace(m.group(0), NUEVO, 1)
                  add('- prevDoc con compresion 900px.')
              t = t.replace('c.toDataURL("image/jpeg",0.85).split(",")[1]',
                            'c.toDataURL("image/jpeg",0.6).split(",")[1]', 1)
              add('- selfie a calidad 0.6.')
              t = t.replace(
                  'Enviando a la Red y verificando biometria...',
                  'Comprimiendo y enviando a la Red... (puede tardar 20 segundos)', 1)
              REG.write_text(t, encoding='utf-8')
              gate_ok = ('function comprimir' in t)
              add('- compresion instalada: %s' % gate_ok)
          else:
              gate_ok = True
          add('')
          add('## Verificacion final')
          add('')
          tf = REG.read_text(encoding='utf-8', errors='replace')
          checks = {
              'function comprimir': 'function comprimir' in tf,
              'prevDoc usa compresion': 'comprimir(e.target.result' in tf,
              'fetch a /registro/nuevo': '/registro/nuevo' in tf,
              'marco ovalo': 'guia-ovalo' in tf,
              'doc_back_b64': 'doc_back_b64' in tf,
          }
          todo_ok = True
          for k, v in checks.items():
              add('- %s: %s' % (k, 'OK' if v else 'FALTA'))
              if not v:
                  todo_ok = False
          add('')
          if todo_ok:
              add('**TODO OK. Commit.**')
          else:
              add('**FALTAN PIEZAS: revisar arriba.**')
          escribe()
          print('D30b OK, todo:', todo_ok)
          if not todo_ok:
              raise SystemExit('FALTAN PIEZAS')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portal/registro.html
          git commit -m "fix(D30b): compresion de fotos verificada" || echo "sin cambios"
          git push
          echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
