name: "ZYRA RED-6 fix migraciones + sin comisiones"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Reescribir migraciones + quitar comisiones
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, re, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          p = pathlib.Path("shared_engines/payments/engine.py")
          src = p.read_text(encoding="utf-8")

          # 1) SQL de migraciones: colapsar cada statement multilinea a UNA linea
          nuevo_pay = ("CREATE TABLE payments ("
                      " payment_id TEXT PRIMARY KEY,"
                      " payer_zid TEXT NOT NULL,"
                      " payee_zid TEXT NOT NULL,"
                      " amount TEXT NOT NULL,"
                      " currency TEXT NOT NULL,"
                      " receive_currency TEXT NOT NULL DEFAULT '',"
                      " receive_amount TEXT,"
                      " conversion_id TEXT,"
                      " corridor TEXT,"
                      " fee_send TEXT,"
                      " instrument_id TEXT NOT NULL,"
                      " purpose TEXT NOT NULL,"
                      " hold_ref TEXT,"
                      " state TEXT NOT NULL,"
                      " auto_release_at REAL NOT NULL,"
                      " dispute_reason TEXT,"
                      " dispute_opened_at REAL,"
                      " created_at REAL NOT NULL,"
                      " updated_at REAL NOT NULL)")
          patron = re.compile(
              r'"CREATE TABLE payments \((?:[^"]|"")*?\)"',
              re.DOTALL)
          n = len(patron.findall(src))
          if n == 1:
              src = patron.sub('"' + nuevo_pay + '"', src, count=1)
              out("- **SQL payments: colapsado a una linea**")
          elif any('" CREATE TABLE payments' in l or '"CREATE TABLE payments (' in l for l in src.splitlines()) is False:
              out("- **SQL payments: patron no hallado; se verifica al compilar**")
          else:
              out("- **SQL payments: ya en una linea? se continua**")

          # 2) Comisiones: fuera. Fee = 0 hasta que el duerno defina politica
          src = src.replace(
              'FEE_SCHEDULE = {',
              'FEE_SCHEDULE_OWNER_DEFINED = None  # RED-6: el dueno define comisiones; 0 hasta entonces\nFEE_SCHEDULE = {')
          # forzar fee 0 en quote
          patron_fee = re.compile(
              r'fee_send = \(self\._flat_in\([^\n]+\)\s*\n\s*\+[^\n]+\)')
          if patron_fee.search(src):
              src = patron_fee.sub('fee_send = Decimal("0")', src)
              out("- **fee en quote: 0 (politica pendiente del dueno)**")
          patron_fee2 = re.compile(
              r'fee_send = \(self\._flat_in\(cur[^\n]+\)\s*\n\s*\+[^\n]+\)')
          if patron_fee2.search(src):
              src = patron_fee2.sub('fee_send = Decimal("0")', src)
              out("- **fee en send_money: 0 (politica pendiente del dueno)**")
          # bloque _flat_in ya no se usa: se deja (no rompe), marcado como pendiente
          if 'def _flat_in' in src and 'OWNER_DEFINED' not in src.split('def _flat_in')[0][-200:]:
              pass

          ast.parse(src)
          p.write_text(src, encoding="utf-8")
          py_compile.compile(str(p), doraise=True)
          out("- **engine.py: compilado OK**")

          # 3) tests: ajustar asserts de fee a 0
          t = pathlib.Path("shared_engines/payments/tests/test_payments.py")
          tsrc = t.read_text(encoding="utf-8")
          tsrc = tsrc.replace(
              'assert Decimal(q["fee_send"]) == Decimal("5.00")',
              'assert Decimal(q["fee_send"]) == Decimal("0")')
          tsrc = tsrc.replace(
              'assert Decimal(q["total_debited"]) == Decimal("105.00")',
              'assert Decimal(q["total_debited"]) == Decimal("100.00")')
          tsrc = tsrc.replace(
              'assert Decimal(q["fee_send"]) == Decimal("1.50")',
              'assert Decimal(q["fee_send"]) == Decimal("0")')
          tsrc = tsrc.replace(
              'assert Decimal(envio["fee_send"]) == Decimal("5.00")',
              'assert Decimal(envio["fee_send"]) == Decimal("0")')
          tsrc = tsrc.replace(
              '" comision 5.00, debita 105.00")',
              '" comision 0 (politica del dueno pendiente)")')
          tsrc = tsrc.replace(
              'assert Decimal(envio["fee_send"]) > 0',
              'assert Decimal(envio["fee_send"]) == Decimal("0")')
          ast.parse(tsrc)
          t.write_text(tsrc, encoding="utf-8")
          py_compile.compile(str(t), doraise=True)
          out("- **tests: fees ajustados a 0**")
          exit(0)
          EOF

      - name: "P1: tests del motor completo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 180 python3 -m pytest shared_engines/payments/tests -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/p1.out 2>&1
          echo $? > /tmp/p1
          if [ "$(cat /tmp/p1)" = "0" ]; then echo "- P1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- P1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### P1 detalle"; echo '```'; tail -70 /tmp/p1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "P2: suite currency"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 300 python3 -m pytest shared_engines/currency/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/p2.out 2>&1
          echo $? > /tmp/p2
          if [ "$(cat /tmp/p2)" = "0" ]; then echo "- P2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- P2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### P2 detalle"; echo '```'; tail -50 /tmp/p2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "P3: regresion shared_engines completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/p3.out 2>&1
          echo $? > /tmp/p3
          if [ "$(cat /tmp/p3)" = "0" ]; then echo "- P3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- P3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### P3 detalle"; echo '```'; tail -60 /tmp/p3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "P4: apps nexo + subastas intactas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/nexo/tests apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/p4.out 2>&1
          echo $? > /tmp/p4
          if [ "$(cat /tmp/p4)" = "0" ] && ! grep -q "failed" /tmp/p4.out; then echo "- P4: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- P4: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### P4 detalle"; echo '```'; tail -40 /tmp/p4.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in p1 p2 p3 p4; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: P1-P4 VERDES**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "fix(RED-6): SQL migraciones en una linea + comisiones a 0 (politica pendiente del dueno)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — RED-6 CERRADO.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2) — RED-6 CERRADO.**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
