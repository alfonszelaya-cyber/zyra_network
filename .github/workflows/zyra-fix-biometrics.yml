name: "RED-VERIF paso 1: auditoria biometria 1:1 + verificacion de persona (SOLO LECTURA)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: publico de BiometricsEngine (metodos de match/verify 1:1)"
        run: |
          python3 - <<'D1EOF'
          import inspect
          from shared_engines.security.biometrics import (
              BiometricsEngine)
          print("=== BiometricsEngine metodos ===")
          for n in sorted(
              a for a in dir(BiometricsEngine)
              if not a.startswith("_")):
              o = getattr(BiometricsEngine, n)
              if inspect.isfunction(o):
                  try:
                      print(n, inspect.signature(o))
                  except Exception:
                      print(n, "(sin firma)")
          D1EOF

      - name: "Dump 2: rutas proofing/verify existentes en api.py (que expone HTTP hoy)"
        run: |
          python3 - <<'D2EOF'
          from pathlib import Path
          lines = Path(
              "shared_engines/runtime/api.py"
          ).read_text(
              encoding="utf-8").splitlines()
          for i, l in enumerate(lines, 1):
              if ('"proofing' in l
                  or 'proofing/' in l
                  or '"verify"' in l
                  or 'match' in l.lower()
                  and 'def ' in l):
                  print(str(i).rjust(5)
                        + ": " + l.strip()[:120])
          D2EOF

      - name: "Dump 3: modulo biometrics (hay verify/match 1:1? clases y contratos)"
        run: |
          python3 - <<'D3EOF'
          import inspect
          import shared_engines.security.biometrics as bm
          print("=== publico del modulo biometrics ===")
          for n in sorted(
              a for a in dir(bm)
              if not a.startswith("_")):
              o = getattr(bm, n)
              if inspect.isclass(o):
                  print(n, "(clase)")
          print()
          from pathlib import Path
          p = Path(
              "shared_engines/security/biometrics.py")
          txt = p.read_text(encoding="utf-8")
          lines = txt.splitlines()
          ini = None
          for i, l in enumerate(lines, 1):
              if "def verify" in l or "def match" in l:
                  ini = i
                  break
          if ini:
              print("=== desde " + str(ini)
                    + " (def verify/match) ===")
              for n in range(ini - 1,
                             min(ini + 40,
                                 len(lines))):
                  print(str(n + 1).rjust(5)
                        + ": " + lines[n])
          else:
              print("SIN metodo verify/match 1:1 en el engine (hallazgo clave)")
          D3EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
