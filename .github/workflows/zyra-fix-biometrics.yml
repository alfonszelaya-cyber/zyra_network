name: "ZYRA RUN7: SUBASTAS nucleo (subastas+inscripciones+escrow+riesgo+logistica internacional+radar VIP — 6 engines + lectura)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] compacta SUBASTAS (estructura + radar_motor->axis + money.py)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## LECTURA SUBASTAS (RUN 7)" >> "$SUM"
          echo "### dirs 2 niveles" >> "$SUM"
          { echo '```'; find apps/subastas -maxdepth 2 -type d 2>/dev/null | grep -v __pycache__ | sort | head -40; echo '```'; } >> "$SUM"
          echo "### archivos py con lineas (top 25)" >> "$SUM"
          { echo '```'; find apps/subastas -name "*.py" 2>/dev/null | grep -v __pycache__ | while read f; do echo "$(wc -l < "$f") $f"; done | sort -rn | head -25; echo '```'; } >> "$SUM"
          echo "### radar_motor->axis (unico punto a punto detectado)" >> "$SUM"
          { echo '```'; grep -rn "axis" apps/subastas --include="*.py" 2>/dev/null | grep -v __pycache__ | head -10; echo '```'; } >> "$SUM"
          echo "### money.py existe?" >> "$SUM"
          { echo '```'; ls apps/subastas/shared/ 2>/dev/null; echo '```'; } >> "$SUM"
          exit 0

      - name: "[ESCRITURA] 6 engines SUBASTAS (patron _DDL+ensure_db)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/subastas/auction_engine.py",
                     D(r'''
              """SUBASTAS Auction Engine (SUB-3/5) - subastas
              nucleo: LOTES con precio base e incremento minimo,
              PUJAS (valida contra incrementos y mejor puja,
              participante inscrito), ADJUDICACION al mejor
              postor (subastador), COMISION calculada Decimal 2d
              (regla 61), CANCELACION solo sin pujas (regla 66).
              Estados: activa->adjudicada|cancelada.
              Patron _DDL + ensure_db. Reglas 66/68/76."""
              from __future__ import annotations
              import uuid
              from apps.agro.shared.money import safe_float as _sf
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS sb_auctions ("
                  " auction_id TEXT PRIMARY KEY, title TEXT NOT"
                  " NULL, category TEXT NOT NULL DEFAULT 'general',"
                  " base_price REAL NOT NULL, min_increment REAL"
                  " NOT NULL DEFAULT 1, currency TEXT NOT NULL"
                  " DEFAULT 'USD', status TEXT NOT NULL DEFAULT"
                  " 'activa', winner_id TEXT NOT NULL DEFAULT"
                  " '', winner_bid REAL NOT NULL DEFAULT 0,"
                  " created_at TEXT NOT NULL DEFAULT '', closed_at"
                  " TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS sb_bids ("
                  " bid_id TEXT PRIMARY KEY, auction_id TEXT NOT"
                  " NULL, bidder TEXT NOT NULL, amount REAL NOT"
                  " NULL, created_at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS sb_commissions ("
                  " comm_id TEXT PRIMARY KEY, auction_id TEXT NOT"
                  " NULL, winner_id TEXT NOT NULL, base REAL NOT"
                  " NULL, rate_pct REAL NOT NULL, amount REAL NOT"
                  " NULL, currency TEXT NOT NULL DEFAULT 'USD')",
              )


              def ensure_db(db):
                  for stmt in _DDL:
                      db.execute(stmt)


              def create_auction_db(db, *, title, base_price,
                                    category="general",
                                    min_increment=1.0,
                                    currency="USD",
                                    created_at=""):
                  ensure_db(db)
                  if not str(title).strip():
                      raise ValueError("title requerido")
                  if float(base_price) <= 0:
                      raise ValueError(
                          "base_price positiva")
                  if float(min_increment) <= 0:
                      raise ValueError(
                          "min_increment positiva")
                  aid = ("SBA-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO sb_auctions (auction_id,"
                      " title, category, base_price, min_increment,"
                      " currency, status, winner_id, winner_bid,"
                      " created_at, closed_at) VALUES (?, ?, ?, ?,"
                      " ?, ?, 'activa', '', 0, ?, '')",
                      (aid, str(title), str(category),
                       _sf(base_price), _sf(min_increment),
                       str(currency).upper(), str(created_at)))
                  return {"auction_id": aid,
                          "status": "activa"}


              def _auction(db, auction_id):
                  row = db.query_one(
                      "SELECT * FROM sb_auctions WHERE auction_id"
                      " = ?", (str(auction_id),))
                  if row is None:
                      raise LookupError(
                          "subasta no encontrada: "
                          + str(auction_id))
                  return row


              def place_bid_db(db, *, auction_id, bidder, amount,
                               created_at=""):
                  ensure_db(db)
                  row = _auction(db, auction_id)
                  if str(row["status"]) != "activa":
                      raise ValueError(
                          "subasta no activa: "
                          + str(row["status"]))
                  amt = _sf(amount)
                  if amt <= 0:
                      raise ValueError(
                          "puja positiva")
                  if not str(bidder).strip():
                      raise ValueError("bidder requerido")
                  last = db.query_one(
                      "SELECT amount FROM sb_bids WHERE"
                      " auction_id = ? ORDER BY amount DESC"
                      " LIMIT 1", (str(auction_id),))
                  min_needed = (float(row["base_price"])
                                if last is None
                                else float(last["amount"])
                                + float(row["min_increment"]))
                  if amt < min_needed:
                      raise ValueError(
                          "puja minima requerida: "
                          + str(min_needed) + " (ultima: "
                          + str(min_needed
                                - float(row["min_increment"]))
                          + ")")
                  bid = ("SBB-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO sb_bids (bid_id, auction_id,"
                      " bidder, amount, created_at)"
                      " VALUES (?, ?, ?, ?, ?)",
                      (bid, str(auction_id), str(bidder), amt,
                       str(created_at)))
                  return {"bid_id": bid, "amount": amt,
                          "min_next": _sf(min_needed
                                          + float(row[
                                              "min_increment"]))}


              def bids_of_db(db, auction_id):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT bid_id, bidder, amount, created_at"
                      " FROM sb_bids WHERE auction_id = ? ORDER"
                      " BY amount DESC, rowid",
                      (str(auction_id),))
                  return [{"bid_id": str(r["bid_id"]),
                           "bidder": str(r["bidder"]),
                           "amount": float(r["amount"])}
                          for r in rows]


              def award_db(db, auction_id, *, rate_pct=5.0,
                           closed_at=""):
                  ensure_db(db)
                  row = _auction(db, auction_id)
                  if str(row["status"]) != "activa":
                      raise ValueError(
                          "solo se adjudica una activa")
                  top = db.query_one(
                      "SELECT bidder, amount FROM sb_bids WHERE"
                      " auction_id = ? ORDER BY amount DESC"
                      " LIMIT 1", (str(auction_id),))
                  if top is None:
                      raise ValueError(
                          "sin pujas: no se adjudica"
                          " (regla 66)")
                  rate = _sf(rate_pct)
                  if rate < 0 or rate > 100:
                      raise ValueError("rate_pct 0..100")
                  base = _sf(top["amount"])
                  comm = _sf(base * rate / 100.0)
                  wid = str(top["bidder"])
                  db.execute(
                      "UPDATE sb_auctions SET status ="
                      " 'adjudicada', winner_id = ?, winner_bid"
                      " = ?, closed_at = ? WHERE auction_id = ?",
                      (wid, base, str(closed_at),
                       str(auction_id)))
                  cid = ("SBC-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO sb_commissions (comm_id,"
                      " auction_id, winner_id, base, rate_pct,"
                      " amount, currency) VALUES (?, ?, ?, ?, ?,"
                      " ?, ?)",
                      (cid, str(auction_id), wid, base, rate,
                       comm, str(row["currency"])))
                  return {"status": "adjudicada",
                          "winner_id": wid,
                          "winner_bid": base,
                          "commission": comm,
                          "currency": str(row["currency"])}


              def cancel_auction_db(db, auction_id, *,
                                    reason=""):
                  ensure_db(db)
                  row = _auction(db, auction_id)
                  if str(row["status"]) != "activa":
                      raise ValueError(
                          "solo se cancela una activa")
                  if not str(reason).strip():
                      raise ValueError(
                          "motivo obligatorio")
                  n = db.query_one(
                      "SELECT COUNT(*) AS n FROM sb_bids WHERE"
                      " auction_id = ?", (str(auction_id),))
                  if int(n["n"]) > 0:
                      raise ValueError(
                          "no se cancela con pujas"
                          " (regla 66)")
                  db.execute(
                      "UPDATE sb_auctions SET status ="
                      " 'cancelada', closed_at = ? WHERE"
                      " auction_id = ?", (str(reason),
                                          str(auction_id)))
                  db.execute(
                      "UPDATE sb_auctions SET closed_at ="
                      " datetime('now') WHERE auction_id = ?",
                      (str(auction_id),))
                  return {"auction_id": str(auction_id),
                          "status": "cancelada"}


              def auction_of_db(db, auction_id):
                  ensure_db(db)
                  row = _auction(db, auction_id)
                  return {"auction_id": str(
                              row["auction_id"]),
                          "title": str(row["title"]),
                          "status": str(row["status"]),
                          "base_price": float(
                              row["base_price"]),
                          "winner_id": str(
                              row["winner_id"]),
                          "winner_bid": float(
                              row["winner_bid"])}


                  return None


              def active_auctions_db(db, category=""):
                  ensure_db(db)
                  if str(category).strip():
                      rows = db.query_all(
                          "SELECT auction_id, title, category,"
                          " base_price FROM sb_auctions WHERE"
                          " status = 'activa' AND category = ?"
                          " ORDER BY rowid",
                          (str(category),))
                  else:
                      rows = db.query_all(
                          "SELECT auction_id, title, category,"
                          " base_price FROM sb_auctions WHERE"
                          " status = 'activa' ORDER BY rowid")
                  return [{"auction_id": str(
                               r["auction_id"]),
                           "title": str(r["title"]),
                           "category": str(r["category"]),
                           "base_price": float(
                               r["base_price"])}
                          for r in rows]
              '''))
              forzar("apps/subastas/registration_engine.py",
                     D(r'''
              """SUBASTAS Registration Engine (SUB-2) - KYC/KYB:
              compradores personas (KYC con ZID), vendedores/
              empresas (KYB), verificacion manual con decision,
              bloqueo de no verificados para pujar (integra
              auction_engine por referencia bidder==subject_id).
              Patron _DDL + ensure_db. Reglas 63/66/68/76."""
              from __future__ import annotations
              import uuid
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS sb_subjects ("
                  " subject_id TEXT PRIMARY KEY, kind TEXT NOT"
                  " NULL, name TEXT NOT NULL, zid TEXT NOT NULL"
                  " DEFAULT '', tax_id TEXT NOT NULL DEFAULT '',"
                  " status TEXT NOT NULL DEFAULT 'pendiente',"
                  " verified_by TEXT NOT NULL DEFAULT '',"
                  " verified_at TEXT NOT NULL DEFAULT '', created"
                  "_at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS sb_kyc_docs ("
                  " doc_id TEXT PRIMARY KEY, subject_id TEXT NOT"
                  " NULL, kind TEXT NOT NULL, ref TEXT NOT NULL"
                  " DEFAULT '', created_at TEXT NOT NULL"
                  " DEFAULT '')",
              )
              _KINDS = ("COMPRADOR", "VENDEDOR", "EMPRESA")


              def ensure_db(db):
                  for stmt in _DDL:
                      db.execute(stmt)


              def register_subject_db(db, *, kind, name,
                                      zid="", tax_id="",
                                      created_at=""):
                  ensure_db(db)
                  k = str(kind).upper()
                  if k not in _KINDS:
                      raise ValueError("kind debe ser "
                                       + "/".join(_KINDS))
                  if not str(name).strip():
                      raise ValueError("name requerido")
                  if k == "COMPRADOR" and not str(zid).strip():
                      raise ValueError(
                          "comprador requiere ZID (regla"
                          " 63: por referencia)")
                  if k in ("VENDEDOR", "EMPRESA") and \
                          not str(tax_id).strip():
                      raise ValueError(
                          "vendedor/empresa requiere"
                          " tax_id")
                  sid = ("SBS-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO sb_subjects (subject_id,"
                      " kind, name, zid, tax_id, status,"
                      " verified_by, verified_at, created_at)"
                      " VALUES (?, ?, ?, ?, ?, 'pendiente', '',"
                      " '', ?)",
                      (sid, k, str(name), str(zid),
                       str(tax_id), str(created_at)))
                  return {"subject_id": sid,
                          "status": "pendiente"}


              def _subject(db, subject_id):
                  row = db.query_one(
                      "SELECT * FROM sb_subjects WHERE"
                      " subject_id = ?", (str(subject_id),))
                  if row is None:
                      raise LookupError(
                          "sujeto no encontrado: "
                          + str(subject_id))
                  return row


              def add_doc_db(db, *, subject_id, kind, ref="",
                             created_at=""):
                  ensure_db(db)
                  _subject(db, subject_id)
                  if not str(kind).strip():
                      raise ValueError("kind requerido")
                  did = ("SBD-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO sb_kyc_docs (doc_id,"
                      " subject_id, kind, ref, created_at)"
                      " VALUES (?, ?, ?, ?, ?)",
                      (did, str(subject_id), str(kind),
                       str(ref), str(created_at)))
                  return {"doc_id": did}


              def verify_subject_db(db, subject_id, *,
                                    approve, verified_by="",
                                    at=""):
                  ensure_db(db)
                  row = _subject(db, subject_id)
                  if str(row["status"]) != "pendiente":
                      raise ValueError(
                          "ya verificado: "
                          + str(row["status"]))
                  if not str(verified_by).strip():
                      raise ValueError(
                          "verified_by requerido")
                  n = db.query_one(
                      "SELECT COUNT(*) AS n FROM sb_kyc_docs"
                      " WHERE subject_id = ?",
                      (str(subject_id),))
                  if approve and int(n["n"]) < 1:
                      raise ValueError(
                          "aprobacion exige al menos 1"
                          " documento KYC (regla 66)")
                  new = "verificado" if approve \
                      else "rechazado"
                  db.execute(
                      "UPDATE sb_subjects SET status = ?,"
                      " verified_by = ?, verified_at = ? WHERE"
                      " subject_id = ?",
                      (new, str(verified_by), str(at),
                       str(subject_id)))
                  return {"subject_id": str(subject_id),
                          "status": new}


                  return None


              def subject_of_db(db, subject_id):
                  ensure_db(db)
                  row = _subject(db, subject_id)
                  return {"subject_id": str(
                              row["subject_id"]),
                          "kind": str(row["kind"]),
                          "name": str(row["name"]),
                          "zid": str(row["zid"]),
                          "status": str(row["status"])}


                  return None


              def verified_subjects_db(db, kind=""):
                  ensure_db(db)
                  if str(kind).strip():
                      rows = db.query_all(
                          "SELECT subject_id, kind, name, zid"
                          " FROM sb_subjects WHERE status ="
                          " 'verificado' AND kind = ? ORDER BY"
                          " rowid", (str(kind).upper(),))
                  else:
                      rows = db.query_all(
                          "SELECT subject_id, kind, name, zid"
                          " FROM sb_subjects WHERE status ="
                          " 'verificado' ORDER BY rowid")
                  return [{"subject_id": str(
                               r["subject_id"]),
                           "kind": str(r["kind"]),
                           "name": str(r["name"])}
                          for r in rows]
              '''))
              forzar("apps/subastas/escrow_finance.py",
                     D(r'''
              """SUBASTAS Escrow & Finance (SUB-7) - pagos en
              GARANTIA (escrow) del ganador, RELEASE al vendedor
              con comision descontada, REEMBOLSO al ganador si no
              hay entrega, LIQUIDACIONES por vendedor con
              historial. Decimal 2d (regla 61). Patron _DDL +
              ensure_db. Reglas 66/68/76."""
              from __future__ import annotations
              import uuid
              from apps.agro.shared.money import safe_float as _sf
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS sb_escrow ("
                  " esc_id TEXT PRIMARY KEY, auction_id TEXT NOT"
                  " NULL, buyer TEXT NOT NULL, seller TEXT NOT"
                  " NULL, amount REAL NOT NULL, commission REAL"
                  " NOT NULL DEFAULT 0, currency TEXT NOT NULL"
                  " DEFAULT 'USD', status TEXT NOT NULL DEFAULT"
                  " 'retenido', created_at TEXT NOT NULL DEFAULT"
                  " '', released_at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS sb_liquidations ("
                  " liq_id TEXT PRIMARY KEY, seller TEXT NOT"
                  " NULL, auction_id TEXT NOT NULL DEFAULT '',"
                  " gross REAL NOT NULL, commission REAL NOT"
                  " NULL DEFAULT 0, net REAL NOT NULL, currency"
                  " TEXT NOT NULL DEFAULT 'USD', created_at TEXT"
                  " NOT NULL DEFAULT '')",
              )


              def ensure_db(db):
                  for stmt in _DDL:
                      db.execute(stmt)


                  return None


              def hold_db(db, *, auction_id, buyer, seller,
                          amount, commission=0.0, currency="USD",
                          created_at=""):
                  ensure_db(db)
                  if float(amount) <= 0:
                      raise ValueError("amount positiva")
                  if float(commission) < 0:
                      raise ValueError(
                          "commission no negativa")
                  if float(commission) >= float(amount):
                      raise ValueError(
                          "commission excede el amount")
                  eid = ("SBE-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO sb_escrow (esc_id,"
                      " auction_id, buyer, seller, amount,"
                      " commission, currency, status, created_at,"
                      " released_at) VALUES (?, ?, ?, ?, ?, ?, ?,"
                      " 'retenido', ?, '')",
                      (eid, str(auction_id), str(buyer),
                       str(seller), _sf(amount), _sf(commission),
                       str(currency).upper(), str(created_at)))
                  return {"esc_id": eid, "status": "retenido"}


                  return None


              def _escrow(db, esc_id):
                  row = db.query_one(
                      "SELECT * FROM sb_escrow WHERE esc_id = ?",
                      (str(esc_id),))
                  if row is None:
                      raise LookupError(
                          "escrow no encontrado: "
                          + str(esc_id))
                  return row


                  return None


              def release_db(db, esc_id, *, at=""):
                  ensure_db(db)
                  row = _escrow(db, esc_id)
                  if str(row["status"]) != "retenido":
                      raise ValueError(
                          "escrow no retenido: "
                          + str(row["status"]))
                  gross = float(row["amount"])
                  comm = float(row["commission"])
                  net = _sf(gross - comm)
                  lid = ("SBL-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO sb_liquidations (liq_id,"
                      " seller, auction_id, gross, commission,"
                      " net, currency, created_at)"
                      " VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                      (lid, str(row["seller"]),
                       str(row["auction_id"]), gross, comm,
                       net, str(row["currency"]),
                       str(at)))
                  db.execute(
                      "UPDATE sb_escrow SET status ="
                      " 'liberado', released_at = ? WHERE"
                      " esc_id = ?",
                      (str(at), str(esc_id)))
                  return {"liq_id": lid, "gross": gross,
                          "commission": comm, "net": net}


                  return None


              def refund_db(db, esc_id, *, reason="", at=""):
                  ensure_db(db)
                  row = _escrow(db, esc_id)
                  if str(row["status"]) != "retenido":
                      raise ValueError(
                          "escrow no retenido")
                  if not str(reason).strip():
                      raise ValueError(
                          "motivo obligatorio (regla 66)")
                  db.execute(
                      "UPDATE sb_escrow SET status ="
                      " 'reembolsado', released_at = ? WHERE"
                      " esc_id = ?",
                      (str(at), str(esc_id)))
                  return {"esc_id": str(esc_id),
                          "status": "reembolsado"}


                  return None


              def escrows_of_db(db, buyer=None, seller=None):
                  ensure_db(db)
                  if buyer:
                      rows = db.query_all(
                          "SELECT esc_id, auction_id, amount,"
                          " status FROM sb_escrow WHERE buyer = ?"
                          " ORDER BY rowid", (str(buyer),))
                  elif seller:
                      rows = db.query_all(
                          "SELECT esc_id, auction_id, amount,"
                          " status FROM sb_escrow WHERE seller ="
                          " ? ORDER BY rowid", (str(seller),))
                  else:
                      rows = db.query_all(
                          "SELECT esc_id, auction_id, amount,"
                          " status FROM sb_escrow ORDER BY"
                          " rowid")
                  return [{"esc_id": str(r["esc_id"]),
                           "auction_id": str(
                               r["auction_id"]),
                           "amount": float(r["amount"]),
                           "status": str(r["status"])}
                          for r in rows]


                  return None


              def liquidations_of_db(db, seller):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT liq_id, auction_id, gross,"
                      " commission, net, currency FROM"
                      " sb_liquidations WHERE seller = ? ORDER"
                      " BY rowid", (str(seller),))
                  return [{"liq_id": str(r["liq_id"]),
                           "gross": float(r["gross"]),
                           "commission": float(
                               r["commission"]),
                           "net": float(r["net"]),
                           "currency": str(
                               r["currency"])}
                          for r in rows]
              '''))
              forzar("apps/subastas/risk_protect.py",
                     D(r'''
              """SUBASTAS Risk & Protection (SUB-9/10) - disputas
              con workflow (abierta->en_revision->resuelta),
              FLAGS de fraude sobre subastas/participantes con
              ZyraRiskScore INFORMATIVO (regla 57: la Red NO
              censura, solo puntua), y RESOLUCION con
              reembolso/penalizacion referenciada. Patron _DDL +
              ensure_db. Reglas 57/66/68/76."""
              from __future__ import annotations
              import uuid
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS sb_disputes ("
                  " disp_id TEXT PRIMARY KEY, auction_id TEXT NOT"
                  " NULL, opened_by TEXT NOT NULL, reason TEXT"
                  " NOT NULL, status TEXT NOT NULL DEFAULT"
                  " 'abierta', resolution TEXT NOT NULL DEFAULT"
                  " '', resolved_by TEXT NOT NULL DEFAULT '',"
                  " created_at TEXT NOT NULL DEFAULT '',"
                  " resolved_at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS sb_fraud_flags ("
