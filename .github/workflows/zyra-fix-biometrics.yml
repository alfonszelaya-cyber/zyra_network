name: "ZYRA RUN1d fix: S-4 HTTP (test con aulas creadas + cache por store — el 409 era honesto)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] router S-4 (cache por store, sin id() global)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/semilla/routers/student/home_registration_router.py",
                     D(r'''
              """Home Registration Router (S-4) - API de
              matricula desde casa sobre el server vivo.

              RUTAS (el server real sirve todo bajo /semilla):
                POST /semilla/api/home-registration -> start
                GET  /semilla/api/home-registration/{id}
                POST /semilla/api/home-registration/{id}/confirm
                GET  /semilla/api/home-registrations
                     ?institution_id=...

              Logica PURA (dict in -> (codigo, dict) out);
              los tests la ejercitan sin red.
              patch_hr_routes() conecta estas rutas al
              SemillaApiHandler con monkey-patch ADITIVO e
              IDEMPOTENTE (regla 51): las rutas existentes
              quedan intactas y el fallback 'unknown api
              route' sigue siendo el ultimo recurso.
              El router se cachea PEGADO AL STORE (un router
              por server vivo; sin claves id() globales que
              pueden colisionar entre tests).

              Regla 78: el menor trae su ZID de NACIMIENTO si
              existe (SEMILLA lo CONSUME, jamas crea otro);
              sin documentos NO impide iniciar (zid NONE).
              SE-3: 2 encargados de retiro + 1 de emergencia.
              Errores honestos 400/404/405/409/503 (regla 66)
              — incluido 409 SIN_CUPOS si la escuela no tiene
              aulas/cupo configurados: jamas se inventa
              capacidad."""
              from __future__ import annotations
              from typing import Tuple
              from apps.semilla.domain.student.student_registry_engine import (
                  StudentRegistryEngine)
              from apps.semilla.domain.student.home_registration_engine import (
                  HomeRegistrationEngine)
              from apps.semilla.domain.classroom.classroom_engine import (
                  ClassroomEngine)
              from apps.semilla.domain.academic.enrollment_engine import (
                  EnrollmentEngine)

              _REQ = ("responsable_zid", "responsable_name",
                      "relation", "child_name",
                      "institution_id", "level", "grade")


              class HomeRegistrationRouter:
                  """API matricula desde casa (S-4)."""

                  def __init__(self, db, clock):
                      reg = StudentRegistryEngine(db, clock)
                      cls = ClassroomEngine(db, clock)
                      enr = EnrollmentEngine(
                          db, clock, classroom_engine=cls)
                      self._hr = HomeRegistrationEngine(
                          db, clock, student_registry=reg,
                          classroom_engine=cls,
                          enrollment_engine=enr)

                  @staticmethod
                  def _err(code, msg) -> Tuple[int, dict]:
                      return (int(code),
                              {"ok": False,
                               "error": str(msg)})

                  def start(self, doc) -> Tuple[int, dict]:
                      if not isinstance(doc, dict):
                          return self._err(
                              400, "body JSON requerido")
                      missing = [
                          f for f in _REQ
                          if not str(doc.get(f, "")).strip()]
                      if missing:
                          return self._err(
                              400, "faltan campos: "
                              + ", ".join(missing))
                      try:
                          r = self._hr.start_request(
                              responsable_zid=str(
                                  doc.get("responsable_zid", "")),
                              responsable_name=str(
                                  doc.get("responsable_name", "")),
                              relation=str(doc.get("relation", "")),
                              child_name=str(
                                  doc.get("child_name", "")),
                              birth_date=str(
                                  doc.get("birth_date", "")),
                              child_zid=str(
                                  doc.get("child_zid", "")),
                              child_zid_status=str(
                                  doc.get("child_zid_status",
                                          "NONE") or "NONE"),
                              institution_id=str(
                                  doc.get("institution_id", "")),
                              level=str(doc.get("level", "")),
                              grade=str(doc.get("grade", "")),
                              turn=str(doc.get("turn", "MATUTINA")
                                       or "MATUTINA"),
                              authorized_pickup=list(
                                  doc.get("authorized_pickup")
                                  or []),
                              emergency_contacts=list(
                                  doc.get("emergency_contacts")
                                  or []))
                      except ValueError as e:
                          return self._err(400, str(e))
                      if r.get("status") == "SIN_CUPOS":
                          return (409, {
                              "ok": False,
                              "error": "SIN_CUPOS",
                              "note": str(r.get("note", "")),
                              "request": r})
                      return (201, {"ok": True, "request": r})

                  def get(self, request_id) -> Tuple[int, dict]:
                      r = self._hr.get_request(
                          str(request_id or ""))
                      if not r:
                          return self._err(
                              404, "solicitud no encontrada")
                      return (200, {"ok": True, "request": r})

                  def confirm(self, request_id, doc
                              ) -> Tuple[int, dict]:
                      d = doc if isinstance(doc, dict) else {}
                      actor = str(
                          d.get("director_actor", "")
                          or d.get("actor", "") or "escuela")
                      try:
                          res = self._hr.confirm_by_school(
                              str(request_id or ""),
                              director_actor=actor)
                      except KeyError:
                          return self._err(
                              404, "solicitud no encontrada")
                      except ValueError as e:
                          msg = str(e)
                          code = (409 if "SIN_CUPOS" in msg
                                  else 400)
                          return self._err(code, msg)
                      return (200, dict({"ok": True}, **res))

                  def pending(self, institution_id
                              ) -> Tuple[int, dict]:
                      rows = self._hr.pending_requests(
                          str(institution_id or ""))
                      return (200, {"ok": True,
                                    "pending": rows,
                                    "count": len(rows)})

                  def dispatch(self, *, method, segs,
                               query=None, doc=None
                               ) -> Tuple[int, dict]:
                      """segs SIN prefijos semilla/api."""
                      q = query or {}

                      def q1(k):
                          v = q.get(k)
                          if isinstance(v, list):
                              return str(v[0]) if v else ""
                          return str(v or "")

                      try:
                          m = str(method or "GET").upper()
                          if segs[:1] == ["home-registrations"]:
                              if m != "GET":
                                  return self._err(405,
                                                   "solo GET")
                              return self.pending(
                                  q1("institution_id"))
                          if segs[:1] == ["home-registration"]:
                              rest = list(segs[1:])
                              if not rest:
                                  if m == "POST":
                                      return self.start(doc)
                                  return self._err(405,
                                                   "solo POST")
                              rid = str(rest[0])
                              if (len(rest) >= 2
                                      and rest[1] == "confirm"):
                                  if m != "POST":
                                      return self._err(
                                          405, "solo POST")
                                  return self.confirm(rid, doc)
                              if m == "GET":
                                  return self.get(rid)
                              return self._err(405, "solo GET")
                          return self._err(404,
                                           "ruta desconocida")
                      except Exception as e:
                          return self._err(
                              500, "error interno: " + str(e))


              def patch_hr_routes():
                  """Conecta las rutas S-4 al SemillaApiHandler
                  del server vivo (regla 51: monkey-patch
                  aditivo e idempotente)."""
                  import json as _json
                  from urllib.parse import urlparse, parse_qs
                  from apps.semilla import server as _srv

                  H = _srv.SemillaApiHandler
                  if getattr(H, "_HR_V2", False):
                      return

                  def _segs(self):
                      segs = [p for p in urlparse(
                          self.path).path.split("/") if p]
                      while segs and segs[0] in ("semilla",
                                                 "api"):
                          segs = segs[1:]
                      return segs

                  def _wants(self):
                      s = _segs(self)
                      return bool(s) and s[0] in (
                          "home-registration",
                          "home-registrations")

                  def _router(self):
                      st = getattr(self, "store", None)
                      if st is None:
                          return None
                      r = getattr(st, "_hr_router_cache", None)
                      if r is None:
                          try:
                              r = HomeRegistrationRouter(
                                  st._db, st._clock)
                          except Exception:
                              return None
                          try:
                              st._hr_router_cache = r
                          except Exception:
                              pass
                      return r

                  def _compute(self, doc, method):
                      u = urlparse(self.path)
                      r = _router(self)
                      if r is None:
                          return (503, {
                              "ok": False,
                              "error": "matricula desde casa"
                                       " no disponible"})
                      return r.dispatch(
                          method=str(method),
                          segs=_segs(self),
                          query=parse_qs(u.query), doc=doc)

                  def _handle(self, doc, method):
                      code, payload = _compute(self, doc,
                                               method)
                      body = _json.dumps(
                          payload, default=str).encode(
                          "utf-8")
                      self.send_response(int(code))
                      self.send_header(
                          "Content-Type",
                          "application/json")
                      self.send_header(
                          "Content-Length",
                          str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  _orig_get = H._api_get
                  _orig_post = H._api_post

                  def _api_get(self, s):
                      if _wants(self):
                          return _handle(self, None, "GET")
                      return _orig_get(self, s)

                  def _api_post(self, s):
                      if _wants(self):
                          try:
                              doc = self._read_json()
                          except Exception:
                              doc = None
                          return _handle(self, doc, "POST")
                      return _orig_post(self, s)

                  H._api_get = _api_get
                  H._api_post = _api_post
                  H._hr_segs = _segs
                  H._hr_wants = _wants
                  H._hr_compute = _compute
                  H._HR_V2 = True
              '''))
              out("## FIN builder S-4")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

      - name: "[ESCRITURA] wiring server.py (4 lineas en ancla unica; revert si falla)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, subprocess, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          P = pathlib.Path("apps/semilla/server.py")
          wired = "no"
          orig = ""
          try:
              src = P.read_text(encoding="utf-8")
              orig = src
              if "_HR_V2" in src:
                  wired = "yes"
                  out("- server.py: YA cableado (idempotente)")
              else:
                  anchor = "    return SemillaServer((host, port))"
                  if src.count(anchor) != 1:
                      raise RuntimeError(
                          "ancla serve_semilla no unica: "
                          + str(src.count(anchor)))
                  ins = (
                      "    from apps.semilla.routers.student."
                      "home_registration_router import (\n"
                      "        patch_hr_routes,\n"
                      "    )\n"
                      "    patch_hr_routes()  # _HR_V2\n")
                  new = src.replace(anchor, ins + anchor, 1)
                  ast.parse(new)
                  P.write_text(new, encoding="utf-8")
                  py_compile.compile(str(P), doraise=True)
                  env = dict(os.environ)
                  env["PYTHONPATH"] = (os.getcwd() + ":"
                                       + os.getcwd()
                                       + "/shared_engines")
                  r = subprocess.run(
                      ["python3", "-c",
                       "import apps.semilla.server"],
                      capture_output=True, text=True, env=env)
                  if r.returncode != 0:
                      raise RuntimeError(
                          "import fallo: " + r.stderr[-400:])
                  wired = "yes"
                  out("- **server.py: WIRING APLICADO**"
                      " (patch aditivo en serve_semilla)")
          except Exception:
              try:
                  if orig:
                      P.write_text(orig, encoding="utf-8")
                      py_compile.compile(str(P), doraise=True)
              except Exception:
                  pass
              out("- **server.py: WIRING DIFERIDO (revertido"
                  " intacto)** — el router S-4 queda"
                  " committeable")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
          finally:
              open("/tmp/hr_wired", "w").write(wired)
              exit(0)
          PYEOF

      - name: "[ESCRITURA tests + LECTURA veredicto] tests S-4 (patch test CON aulas creadas)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          mkdir -p apps/semilla/tests
          cat > apps/semilla/tests/test_s4_http_router.py << 'TSEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter
          from apps.semilla.domain.classroom.classroom_engine import ClassroomEngine
          from apps.semilla.infrastructure.persistence.semilla_store import SemillaStore
          from apps.semilla.routers.student.home_registration_router import (
              HomeRegistrationRouter, patch_hr_routes)

          PICK2 = [{"name": "Mama", "relation": "MADRE"},
                   {"name": "Papa", "relation": "PADRE"}]
          EMG = [{"name": "Tio", "relation": "TIO", "phone": "911"}]

          def _env(tmp_path, cap_m=30, cap_t=5):
              db = SQLiteAdapter(tmp_path / "r.db")
              clock = FrozenClock()
              cls = ClassroomEngine(db, clock)
              man = cls.create(name="1A", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=cap_m)
              tar = cls.create(name="1T", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="VESPERTINA", capacity=cap_t)
              r = HomeRegistrationRouter(db, clock)
              return db, cls, man, tar, r

          def _doc(**over):
              base = {"responsable_zid": "ZID-PADRE-1",
                  "responsable_name": "Padre Perez",
                  "relation": "PADRE", "child_name": "Nino HTTP",
                  "birth_date": "2019-05-10",
                  "child_zid": "ZID-BABY-9",
                  "child_zid_status": "VERIFIED",
                  "institution_id": "INST-1", "level": "BASICA",
                  "grade": "1", "turn": "MATUTINA",
                  "authorized_pickup": PICK2,
                  "emergency_contacts": EMG}
              base.update(over)
              return base

          def test_flujo_completo(tmp_path) -> None:
              db, cls, man, tar, r = _env(tmp_path)
              code, p = r.dispatch(method="POST",
                  segs=["home-registration"], doc=_doc())
              assert code == 201 and p["ok"] is True
              rid = p["request"]["request_id"]
              code2, p2 = r.dispatch(method="POST",
                  segs=["home-registration", rid, "confirm"],
                  doc={"director_actor": "DIR-1"})
              assert code2 == 200 and p2["status"] == "ACTIVA"
              assert p2["student"]["zid"] == "ZID-BABY-9"
              assert p2["student"]["zid_status"] == "VERIFIED"
              assert p2["student"]["tutores"][0]["zid"] == "ZID-PADRE-1"
              assert cls.get(man["classroom_id"])["enrolled"] == 1
              code3, p3 = r.dispatch(method="GET",
                  segs=["home-registration", rid])
              assert code3 == 200
              assert p3["request"]["status"] == "ACTIVA"
              code4, p4 = r.dispatch(method="GET",
                  segs=["home-registrations"],
                  query={"institution_id": ["INST-1"]})
              assert code4 == 200 and p4["count"] == 0
              print("OK flujo: start 201 -> confirm 200 ACTIVA -> ZID nacimiento (regla 78) -> cupo UNA vez -> detalle -> pendientes")

          def test_sin_cupos_409_alternativas(tmp_path) -> None:
              db, cls, man, tar, r = _env(tmp_path, cap_m=1, cap_t=5)
              code, p = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(child_zid="", child_zid_status="NONE"))
              assert code == 201
              rid = p["request"]["request_id"]
              r.dispatch(method="POST",
                  segs=["home-registration", rid, "confirm"],
                  doc={"director_actor": "D"})
              code2, p2 = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(responsable_zid="ZID-2",
                           child_name="Segundo", child_zid="",
                           child_zid_status="NONE"))
              assert code2 == 409
              assert "MATUTINA COMPLETADA" in p2["note"]
              assert "VESPERTINA" in p2["note"]
              code3, p3 = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(responsable_zid="ZID-3",
                           child_name="Tercero", child_zid="",
                           child_zid_status="NONE",
                           turn="VESPERTINA"))
              assert code3 == 201
              rid3 = p3["request"]["request_id"]
              code4, p4 = r.dispatch(method="POST",
                  segs=["home-registration", rid3, "confirm"],
                  doc={"director_actor": "D"})
              assert code4 == 200
              assert p4["enrollment"]["turn"] == "VESPERTINA"
              print("OK SIN_CUPOS: 409 con alternativas y la tarde SI recibe")

          def test_escuela_sin_aulas_409_honesto(tmp_path) -> None:
              db = SQLiteAdapter(tmp_path / "v.db")
              r = HomeRegistrationRouter(db, FrozenClock())
              code, p = r.dispatch(method="POST",
                  segs=["home-registration"], doc=_doc())
              assert code == 409
              assert "Sin cupos" in p["note"]
              print("OK honesto (regla 66): escuela SIN aulas configuradas -> 409 SIN_CUPOS, jamas se inventa capacidad (esto es lo que el patch test piso sin querer: le faltaba crear aulas)")

          def test_errores_honestos(tmp_path) -> None:
              db, cls, man, tar, r = _env(tmp_path)
              code, p = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(responsable_zid=""))
              assert code == 400
              assert "faltan campos" in p["error"]
              code2, p2 = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(relation="PRIMO"))
              assert code2 == 400
              code3, p3 = r.dispatch(method="POST",
                  segs=["home-registration"],
                  doc=_doc(authorized_pickup=PICK2[:1]))
              assert code3 == 400 and "retiro" in p3["error"]
              code4, p4 = r.dispatch(method="POST",
                  segs=["home-registration"], doc=None)
              assert code4 == 400
              code5, p5 = r.dispatch(method="GET",
                  segs=["home-registration", "NO-EXISTS"])
              assert code5 == 404
              code6, p6 = r.dispatch(method="GET",
                  segs=["home-registration"])
              assert code6 == 405
              code7, p7 = r.dispatch(method="GET",
                  segs=["otra-cosa"])
              assert code7 == 404
              print("OK honesto: 400 faltantes/SE-3/body, 404, 405")

          def test_patch_server_real(tmp_path) -> None:
              import apps.semilla.server as srv
              db = SQLiteAdapter(tmp_path / "w.db")
              st = SemillaStore(db, FrozenClock())
              cls = ClassroomEngine(db, FrozenClock())
              man = cls.create(name="1A-W", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="MATUTINA", capacity=30)
              tar = cls.create(name="1T-W", institution_id="INST-1",
                  school_year="2026", level="BASICA", grade="1",
                  section="A", turn="VESPERTINA", capacity=5)
              patch_hr_routes()
              patch_hr_routes()
              assert getattr(srv.SemillaApiHandler,
                             "_HR_V2", False) is True
              h = object.__new__(srv.SemillaApiHandler)
              h.store = st
              h.path = "/semilla/api/home-registration"
              assert srv.SemillaApiHandler._hr_wants(h) is True
              h.path = ("/semilla/api/home-registrations"
                        "?institution_id=INST-1")
              assert srv.SemillaApiHandler._hr_wants(h) is True
              h.path = "/api/home-registration"
              assert srv.SemillaApiHandler._hr_wants(h) is True
              h.path = "/semilla/api/profile/ACC-1"
              assert srv.SemillaApiHandler._hr_wants(h) is False
              h.path = "/semilla/api/health"
              assert srv.SemillaApiHandler._hr_wants(h) is False
              h.path = "/semilla/register"
              assert srv.SemillaApiHandler._hr_wants(h) is False
              h.path = "/semilla/api/home-registration"
              code, p = srv.SemillaApiHandler._hr_compute(
                  h, _doc(), "POST")
              assert code == 201
              rid = p["request"]["request_id"]
              h.path = ("/semilla/api/home-registration/"
                        + rid + "/confirm")
              code2, p2 = srv.SemillaApiHandler._hr_compute(
                  h, {"director_actor": "DIR-9"}, "POST")
              assert code2 == 200
              assert p2["status"] == "ACTIVA"
              assert cls.get(man["classroom_id"])["enrolled"] == 1
              h.path = ("/semilla/api/home-registrations"
                        "?institution_id=INST-1")
              code3, p3 = srv.SemillaApiHandler._hr_compute(
                  h, None, "GET")
              assert code3 == 200 and p3["count"] == 0
              h2 = object.__new__(srv.SemillaApiHandler)
              h2.store = None
              h2.path = "/semilla/api/home-registration"
              code4, p4 = srv.SemillaApiHandler._hr_compute(
                  h2, _doc(), "POST")
              assert code4 == 503
              print("OK patch REAL: aulas creadas en la db del store -> start 201 -> confirm 200 (cupo UNA vez) -> pendientes -> 503 honesto sin store; cache del router pegado al store (sin id() global)")
          TSEOF
          timeout 240 python3 -m pytest apps/semilla/tests/test_s4_http_router.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/s4h.out 2>&1
          echo $? > /tmp/s4h
          if [ "$(cat /tmp/s4h)" = "0" ]; then echo "- S-4 HTTP: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- S-4 HTTP: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### S-4 HTTP detalle"; echo '```'; tail -80 /tmp/s4h.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[LECTURA] regresion 4 apps"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅" >> "$SUM"
            else
              echo "- REG $2: ❌" >> "$SUM"
              { echo "### REG $2 detalle"; echo '```'; tail -50 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si SEMILLA verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/s4h 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x4 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: SEMILLA roja — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/semilla
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "fix(SEMILLA S-4 HTTP): test del patch con aulas creadas en la db del store (el 409 anterior era la respuesta HONESTA correcta ante escuela sin capacidad — regla 66 funcionando; el test no habia configurado las aulas) + test dedicado escuela_sin_aulas_409_honesto + cache del router pegada al store (elimina riesgo de colision id() entre tests) + wiring patch aditivo en serve_semilla intacto"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — S-4 HTTP CERRADO (matricula desde casa viva en /semilla/api/home-registration). RUN 1e: smoke HTTP real levantando serve_semilla + RUN 2 (S-5 a S-10 ciclo escolar).**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qd.err; echo '```'; } >> "$SUM"
          exit 1
