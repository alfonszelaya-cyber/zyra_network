name: ZYRA D20 apps visibles al conectar con dependencia corregida

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: Portal con apps al conectar
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SPY = ROOT / 'superapp.py'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 'faseD20.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  r = OP.open(q, timeout=20)
                  return r.status, r.headers, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, None, str(e)
          orig = SPY.read_bytes()
          def revertir():
              try:
                  SPY.write_bytes(orig)
              except Exception:
                  pass
          t0 = orig.decode('utf-8')
          add('# D20 - CONECTADO = VER LAS APPS (cryptography restaurado)')
          add('')
          add('## P1. Bloque actual')
          add('')
          MARCA_INI = '        if path in ("/", "/index.html"):'
          MARCA_FIN = '        if path == "/health":'
          n_i = t0.count(MARCA_INI)
          n_f = t0.count(MARCA_FIN)
          add('- inicio: %d | fin: %d (ambos 1)' % (n_i, n_f))
          gate('bloque_unico', n_i == 1 and n_f == 1)
          if not (n_i == 1 and n_f == 1):
              DATA['gates'] = {n: o for n, o in GATES}
              Path('faseD20.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS - sin cambios')
          add('')
          add('## P2. Nuevo bloque')
          add('')
          NUEVO = '\n'.join([
          '        if path in ("/", "/index.html"):',
          '            base = self._read_portal("index.html").decode("utf-8")',
          '            zid_s = self._sesion()',
          '            if zid_s:',
          '                estado = (',
          '                    \'<p class="estado ok">Conectado: \' + zid_s',
          '                    + \' &middot; <a href="/salir" style="color:#f85149">Salir</a></p>\')',
          '                tarjetas = ""',
          '                for _pref, _inf in APPS.items():',
          '                    tarjetas += (',
          '                        \'<a class="opcion" href="\' + _pref + \'/"><b>\' + _inf["label"]',
          '                        + \'</b><span>Abrir aplicacion</span></a>\')',
          '                seccion = (',
          '                    \'<div class="menu">\' + tarjetas + \'</div>\'',
          '                    + \'<p class="tag" style="margin-top:20px;margin-bottom:8px">Verificador publico</p>\'',
          '                    + \'<div class="menu">\'',
          '                    + \'<a class="opcion" href="/verificar"><b>Verificar</b>\'',
          '                    + \'<span>Confirma la autenticidad de un documento</span></a>\'',
          '                    + \'</div>\')',
          '                i1 = base.find(\'<div class="menu">\')',
          '                i2 = base.find(\'</div>\', i1) + len(\'</div>\')',
          '                base = base[:i1] + seccion + base[i2:]',
          '            else:',
          '                estado = ""',
          '            base = base.replace("__ESTADO__", estado, 1)',
          '            self._send_html(200, base)',
          '            return',
          '',
          ])
          t = t0[:t0.find(MARCA_INI)] + NUEVO + '\n' + t0[t0.find(MARCA_FIN):]
          SPY.write_text(t, encoding='utf-8')
          gate('bloque_reescrito', True)
          add('')
          add('## P3. Compilacion')
          add('')
          try:
              py_compile.compile(str(SPY), doraise=True)
              gate('compila', True)
              add('- OK')
          except Exception as e:
              gate('compila', False)
              add('- FALLO: %s' % e)
          add('')
          add('## P4. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zd20', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/sd20', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t1 = time.time()
          while time.time() - t1 < 45:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t1 = time.time()
              while time.time() - t1 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cu = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cu).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps', spv and len(apps) == 8)
          if spv:
              st, h, _b = pedir(BSP + '/entrar', data=('zid=Z-DUENO-CI&clave=clave-ci-9999').encode())
              sc = (h.get('Set-Cookie') or '').split(';')[0] if h else ''
              gate('dueno_entrar', st == 303 and sc)
              if sc:
                  st, _h, b = pedir(BSP + '/', {'Cookie': sc})
                  conectado_apps = (st == 200 and 'Conectado:' in b
                                    and '/laboratorio/' in b and '/agro/' in b
                                    and '/nexo/' in b and 'Abrir aplicacion' in b)
                  add('- conectado ve las apps %s' % ('OK' if conectado_apps else 'FALLO'))
                  gate('conectado_ve_apps', conectado_apps)
              st, _h, b = pedir(BSP + '/')
              basico = (st == 200 and '/agro/' not in b and 'Registro</b>' in b)
              add('- sin sesion: basico %s' % ('OK' if basico else 'FALLO'))
              gate('sin_sesion_basico', basico)
              st, _h, _b = pedir(BSP + '/laboratorio/ui')
              gate('guard_intacto', st == 401)
          else:
              for g in ('dueno_entrar', 'conectado_ve_apps', 'sin_sesion_basico', 'guard_intacto'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D20 VERIFICADO. Commit. Conectado = las 8 apps + verificador.**')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('faseD20.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D20 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(D20): apps visibles al estar conectado"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
