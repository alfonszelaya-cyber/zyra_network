name: "AUDITORIA - ver codigo real de los 4 fallos"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt pytest
      - name: Ver codigo real donde fallan
        run: |
          echo "=== 1. combined_api.py - CORE_PREFIXES ==="
          sed -n '40,60p' shared_engines/runtime/combined_api.py
          echo ""
          echo "=== 2. test_runtime_api.py - death test enroll (lineas 615-630) ==="
          sed -n '615,630p' shared_engines/runtime/tests/test_runtime_api.py
          echo ""
          echo "=== 3. test_capabilities_api.py - verification test enroll (lineas 520-530) ==="
          sed -n '520,530p' shared_engines/runtime/tests/test_capabilities_api.py
          echo ""
          echo "=== 4. test_portable_identity.py - expediente biometric insert (lineas 470-480) ==="
          sed -n '470,480p' shared_engines/network/tests/test_portable_identity.py
          echo ""
          echo "=== 5. test_runtime_api.py - verify-existence test (lineas 640-660) ==="
          sed -n '640,660p' shared_engines/runtime/tests/test_runtime_api.py
          echo ""
          echo "=== 6. Los 4 tests con traceback ==="
          python3 -m pytest \
            "shared_engines/runtime/tests/test_runtime_api.py::test_death_lifecycle_deceased" \
            "shared_engines/runtime/tests/test_runtime_api.py::test_verify_existence_public" \
            "shared_engines/runtime/tests/test_capabilities_api.py::test_verification_verdict_signed" \
            "shared_engines/network/tests/test_portable_identity.py::test_expediente_legal_pedro" \
            -v --tb=long 2>&1 | tail -150
