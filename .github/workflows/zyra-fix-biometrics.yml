name: "A-17 EJECUCION: eliminar services/market_service.py (codigo muerto: 0 consumidores, 0 tests — evidencia #612) + regresion AGRO — N-10 CONSERVADO (menus vivos, test del dueno lo usa)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[ELIMINACION] services/market_service.py (codigo muerto confirmado)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          # doble verificacion ANTES de borrar
          c1=$(grep -rln "services.market_service\|services/market_service" apps --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v "services/market_service.py" | wc -l)
          c2=$(grep -rln "services.market_service\|services/market_service" apps/agro/tests --include="*.py" 2>/dev/null | wc -l)
          if [ "$c1" != "0" ] || [ "$c2" != "0" ]; then
            echo "- **ABORT: aparecieron consumidores ($c1 codigo, $c2 tests) — NO se elimina**" >> "$SUM"
            exit 0
          fi
          rm -f apps/agro/services/market_service.py
          echo "- **ELIMINADO: apps/agro/services/market_service.py (0 consumidores, 0 tests — evidencia #612)**" >> "$SUM"
          # el package services/ queda (tiene otros archivos vivos)
          ls apps/agro/services/ >> "$SUM" 2>/dev/null
          exit 0

      - name: "[LECTURA] regresion AGRO completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — eliminacion VALIDADA (nada rompio)" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed) — REVERT (restaurar el archivo)" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -40 /tmp/x3.out; echo '```'; } >> "$SUM"
            git checkout -- apps/agro/services/market_service.py 2>/dev/null || echo "from apps.agro.modules.comercializacion.mercado.market_service import MarketService" > apps/agro/services/market_service.py
            echo "- market_service.py RESTAURADO" >> "$SUM"
            echo "FAIL" > /tmp/a17_ok
          fi
          exit 0

      - name: "[ENTREGA] commit solo si AGRO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/a17_ok 2>/dev/null || echo FAIL)" = "FAIL" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**A-17 BLOQUEADA — restaurado**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**A-17: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "chore(A-17): services/market_service.py ELIMINADO — codigo muerto confirmado por auditoria profunda (0 consumidores, 0 tests; la version viva es modules/comercializacion/mercado/market_service.py con add_price_db/market_snapshot_db usada por server y tests) — N-10 CONSERVADO: los 12 menu.py de module/operaciones son datos de navegacion VIVOS (test_modulos_89.py del dueno usa list_menus(module='operaciones') via discover_menus) — regresion AGRO verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**A-17 CERRADO. N-10 CERRADO (conservado con evidencia — menus vivos + motor domain/operations, no son duplicados: uno es navegacion, otro es logica). PLAN AL 100% — pendiente solo A-18 (refactor server AGRO) suspendido por su decision.**"
          exit 0
