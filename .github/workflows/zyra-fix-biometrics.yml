name: ZYRA LABORATORIO - Lote 1A-3 (puertos, config, base de datos y repositorios)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar, escribir y verificar (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_1a3.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          mkdir -p apps/laboratorio/shared/enums apps/laboratorio/shared/interfaces apps/laboratorio/shared/decorators apps/laboratorio/shared/utilities apps/laboratorio/shared/factories apps/laboratorio/shared/policies apps/laboratorio/shared/adapters apps/laboratorio/shared/dto apps/laboratorio/config/application apps/laboratorio/config/database apps/laboratorio/config/events apps/laboratorio/config/modules apps/laboratorio/config/network apps/laboratorio/config/permissions apps/laboratorio/config/registry apps/laboratorio/config/routes apps/laboratorio/config/security apps/laboratorio/config/system apps/laboratorio/infrastructure/database apps/laboratorio/infrastructure/persistence apps/laboratorio/infrastructure/repositories
          echo "=== 5 ENUMS NUEVOS (completan los 17 de la guia) ==="
          escribir apps/laboratorio/shared/enums/render_quality.py << 'ZYRA_EOF'
          """Escalera de calidad fotoreal: de borrador a fotorreal."""
          from enum import Enum


          class RenderQuality(str, Enum):
              BORRADOR = "borrador"
              ALTA = "alta"
              TRES_D = "3d"
              FOTORREAL = "fotorreal"

              @classmethod
              def validar(cls, valor: str) -> "RenderQuality":
                  if not isinstance(valor, str):
                      raise ValueError("La calidad debe ser texto.")
                  limpio = valor.strip().lower()
                  try:
                      return cls(limpio)
                  except ValueError:
                      validos = ", ".join(t.value for t in cls)
                      raise ValueError("Calidad invalida: " + repr(valor) + ". Validas: " + validos)

              @classmethod
              def cadena(cls) -> list:
                  """Orden oficial de la escalera fotoreal."""
                  return [cls.BORRADOR.value, cls.ALTA.value, cls.TRES_D.value, cls.FOTORREAL.value]

              @property
              def orden(self) -> int:
                  """Posicion en la escalera (0 = mas bajo)."""
                  return cls.cadena().index(self.value)
          ZYRA_EOF
