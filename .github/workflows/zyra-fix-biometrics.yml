      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Escribir y aplicar cable en app.py (rutas internas)
        run: |
          python - <<'PYPY'
          import os
          from pathlib import Path

          ruta = Path("apps/laboratorio/infrastructure/api/app.py")
          t = ruta.read_text(encoding="utf-8", errors="replace")
          if "registrar_rutas_internas" not in t:
              t = t.replace(
                  "    registrar_ui(app)\n",
                  "    registrar_ui(app)\n"
                  "    from apps.laboratorio.routers.internal import registrar_rutas_internas\n"
                  "    registrar_rutas_internas(app)\n",
                  1,
              )
              ruta.write_text(t, encoding="utf-8")
              print("app.py: cable de rutas internas agregado")
          else:
              print("app.py: cable ya presente")
          PYPY

      - name: Verificacion completa (feed cache eventos montaje)
        run: |
          python - <<'PYEOF'
          import ast, importlib, os, sys, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append


          def finalizar(fallo):
              md = "\n".join(L)
              Path("resultado_lote.md").write_text(md, encoding="utf-8")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write(md + "\n")
              print(md)
              sys.exit(1 if fallo else 0)


          A("# RUM 5 — Feed de eventos + Cache TTL — resultado\n")

          archivos = [
              "apps/laboratorio/infrastructure/cache/__init__.py",
              "apps/laboratorio/events/system/__init__.py",
              "apps/laboratorio/events/notifications/__init__.py",
              "apps/laboratorio/routers/internal/__init__.py",
              "apps/laboratorio/registry/services/service_registry.py",
              "apps/laboratorio/infrastructure/api/app.py",
          ]
          for ruta in archivos:
              try:
                  ast.parse(Path(ruta).read_text(encoding="utf-8", errors="replace"))
                  A("- sintaxis OK: " + ruta)
              except SyntaxError as e:
                  A("- sintaxis FALLO: " + ruta + " -> " + str(e))
                  finalizar(True)
          A("")

          A("## 1. Cache TTL real")
          try:
              from apps.laboratorio.infrastructure.cache import CacheTTL
              import time as _t
              cache = CacheTTL(ttl_segundos=0.2, maxlen=3)
              if cache.obtener("x") is not None:
                  A("FALLO: lectura de clave inexistente debe ser None")
                  finalizar(True)
              cache.poner("x", 42)
              if cache.obtener("x") != 42:
                  A("FALLO: hit fallo")
                  finalizar(True)
              _t.sleep(0.25)
              if cache.obtener("x") is not None:
                  A("FALLO: TTL no expiro")
                  finalizar(True)
              cache.poner("a", 1)
              cache.poner("b", 2)
              cache.poner("c", 3)
              cache.poner("d", 4)
              stats = cache.estadisticas()
              A("stats: " + str(stats))
              if stats["evictions"] < 1 or stats["expiraciones"] < 1:
                  A("FALLO: stats incompletas")
                  finalizar(True)
              A("CACHE TTL REAL CORRECTA")
          except Exception:
              A("EXCEPCION:")
              A(traceback.format_exc())
              finalizar(True)
          A("")

          A("## 2. Eventos de sistema + notificador")
          try:
              from apps.laboratorio.events.system import evento_arrancado, evento_health, EventoSistema
              from apps.laboratorio.events.notifications import Notificador
              ev = evento_arrancado("laboratorio", 74, 17)
              if not ev.momento or ev.detalle["rutas"] != 74:
                  A("FALLO: evento de arranque incompleto")
                  finalizar(True)
              nh = evento_health({"ok": True, "motores_total": 17, "motores_disponibles": 17})
              notif = Notificador()
              registro = notif.notificar(ev, "arranque verificado")
              if not registro["id"].startswith("notif-"):
                  A("FALLO: registro de notificacion invalido")
                  finalizar(True)
              lista = notif.historial(0, 10)
              if lista["devueltas"] != 1:
                  A("FALLO: historial de notificaciones incompleto")
                  finalizar(True)
              A("evento_arrancado OK · evento_health OK · notificador OK")
          except Exception:
              A("EXCEPCION:")
              A(traceback.format_exc())
              finalizar(True)
          A("")

          A("## 3. Feed de eventos con cursor (bus -> colector)")
          try:
              from apps.laboratorio.infrastructure.messaging.event_bus import BusEventos
              from apps.laboratorio.registry.services.service_registry import ColectorEventos
              from apps.laboratorio.shared.interfaces.event_bus import Evento

              class _Ev:
                  pass

              bus = BusEventos()
              colector = ColectorEventos()
              colector.conectar(bus)
              recibidos = []
              bus.suscribir("laboratorio.prueba", lambda e: recibidos.append(e))
              ev = Evento(nombre="laboratorio.prueba", datos={"n": 1})
              bus.publicar(ev)
              if not recibidos:
                  A("FALLO: el suscriptor no recibio el evento")
                  finalizar(True)
              feed = colector.historial(0, 10)
              if feed["devueltos"] != 1 or feed["eventos"][0]["evento"] != "laboratorio.prueba":
                  A("FALLO: feed no capturo el evento: " + str(feed))
                  finalizar(True)
              cursor = feed["cursor_sugerido"]
              vacio = colector.historial(cursor, 10)
              if vacio["devueltos"] != 0:
                  A("FALLO: cursor no avanza")
                  finalizar(True)
              A("bus->feed OK cursor OK patch aditivo no rompe suscriptores OK")
          except Exception:
              A("EXCEPCION:")
              A(traceback.format_exc())
              finalizar(True)
          A("")

          A("## 4. Montaje completo (17 motores y 74 rutas)")
          try:
              mod = importlib.import_module("apps.laboratorio.registry.services.service_registry")
              c = mod.construir_contenedor(":memory:")
              salud = c.obtener("estado_salud").estado()
              appmod = importlib.import_module("apps.laboratorio.infrastructure.api.app")
              app = appmod.montar_aplicacion(":memory:")
              rutas = app.listar_rutas()
              A("motores: " + str(salud["motores_total"]) + "/" + str(salud["motores_disponibles"]) + " rutas: " + str(len(rutas)))
              ok = True
              if salud.get("motores_total") != 17:
                  A("FALLO: motores != 17")
                  ok = False
              if salud.get("motores_disponibles") != 17:
                  A("FALLO: disponibles != 17")
                  ok = False
              if len(rutas) != 74:
                  A("FALLO: rutas != 74 (hay " + str(len(rutas)) + ")")
                  ok = False
              patron_nuevos = [r for r in rutas if "/events" in str(r.get("patron", "")) or "/cache/stats" in str(r.get("patron", ""))]
              if len(patron_nuevos) != 2:
                  A("FALLO: rutas internas ausentes: " + str(patron_nuevos))
                  ok = False
              if ok:
                  A("MONTAJE COMPLETO CORRECTO")
              else:
                  finalizar(True)
          except Exception:
              A("EXCEPCION:")
              A(traceback.format_exc())
              finalizar(True)

          finalizar(False)
          PYEOF

      - name: Commit y push automatico
        run: |
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio/infrastructure/cache/__init__.py
          git add apps/laboratorio/events/system/__init__.py
          git add apps/laboratorio/events/notifications/__init__.py
          git add apps/laboratorio/routers/internal/__init__.py
          git add apps/laboratorio/registry/services/service_registry.py
          git add apps/laboratorio/infrastructure/api/app.py
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "RUM 5: feed de eventos en vivo con cursor + cache TTL real + eventos de sistema y notificaciones"
            git push
          fi
