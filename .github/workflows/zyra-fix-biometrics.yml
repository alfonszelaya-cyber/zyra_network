              c.registrar("caso_exportar_bundle", lambda _c: CasoExportarBundle(_c.obtener("repo_exportaciones"), _c.obtener("repo_proyectos"), _c.obtener("repo_escenas"), _c.obtener("repo_artefactos"), _c.obtener("repo_evaluaciones"), _c.obtener("repo_presentaciones"), _c.obtener("repo_historial"), _c.obtener("outbox"), _c.obtener("cliente_zyra"), _c.obtener("auditoria_sink")))
              c.registrar("manejador_presentaciones", lambda _c: ManejadorPresentaciones(_c.obtener("caso_crear_presentacion"), _c.obtener("caso_reproducir"), _c.obtener("caso_sellar_presentacion"), _c.obtener("repo_presentaciones"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))
              c.registrar("manejador_exportaciones", lambda _c: ManejadorExportaciones(_c.obtener("caso_exportar_bundle"), _c.obtener("repo_exportaciones"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))
              c.registrar("surface_store", lambda _c: SurfaceStore(conexion))
              c.registrar("display_store", lambda _c: DisplayStore(conexion))
              c.registrar("repo_superficies", lambda _c: SurfaceRepository(_c.obtener("surface_store")))
              c.registrar("repo_salidas", lambda _c: DisplayRepository(_c.obtener("display_store")))
              c.registrar("calibrador", lambda _c: CalibradorManual())
              c.registrar("motor_scanner", lambda _c: MotorEscaneoFoto())
              c.registrar("motor_avatar", lambda _c: MotorAvatar())
              c.registrar("caso_registrar_superficie", lambda _c: CasoRegistrarSuperficie(_c.obtener("repo_superficies"), _c.obtener("auditoria_sink")))
              c.registrar("caso_calibrar", lambda _c: CasoCalibrarSuperficie(_c.obtener("repo_superficies"), _c.obtener("calibrador"), _c.obtener("auditoria_sink")))
              c.registrar("caso_proyectar", lambda _c: CasoProyectarEnVivo(_c.obtener("repo_superficies"), _c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))
              c.registrar("caso_registrar_salida", lambda _c: CasoRegistrarSalida(_c.obtener("repo_salidas"), _c.obtener("auditoria_sink")))
              c.registrar("caso_probar_salida", lambda _c: CasoProbarSalida(_c.obtener("repo_salidas"), _c.obtener("auditoria_sink")))
              c.registrar("caso_escanear_foto", lambda _c: CasoEscanearFoto(_c.obtener("repo_inputs"), _c.obtener("repo_proyectos"), _c.obtener("motor_scanner"), _c.obtener("auditoria_sink")))
              c.registrar("caso_avatar_foto", lambda _c: CasoAvatarDesdeFoto(_c.obtener("repo_inputs"), _c.obtener("repo_proyectos"), _c.obtener("caso_crear_activo"), _c.obtener("motor_avatar"), _c.obtener("auditoria_sink")))
              c.registrar("manejador_escaneo", lambda _c: ManejadorEscaneo(_c.obtener("caso_escanear_foto"), _c.obtener("caso_avatar_foto")))
              c.registrar("manejador_proyeccion", lambda _c: ManejadorProyeccion(_c.obtener("caso_registrar_superficie"), _c.obtener("caso_calibrar"), _c.obtener("caso_proyectar"), _c.obtener("repo_superficies"), _c.obtener("auditoria_sink")))
              c.registrar("manejador_salidas", lambda _c: ManejadorSalidas(_c.obtener("caso_registrar_salida"), _c.obtener("caso_probar_salida"), _c.obtener("repo_salidas"), _c.obtener("auditoria_sink")))
              c.obtener("suscriptor_zyra")
              return c
          REG_EOF

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Verificacion completa (PBR real + salidas universales + red)
        run: |
          python - <<'PYEOF'
          import ast, importlib, os, sys, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append
          A("# Lote grande PBR + Salidas universales + Red — resultado\n")

          archivos = [
              "apps/laboratorio/config/network/network_config.py",
              "apps/laboratorio/infrastructure/network/zyra_client.py",
              "apps/laboratorio/infrastructure/providers/display_holo3d.py",
              "apps/laboratorio/infrastructure/providers/renderer_photoreal.py",
              "apps/laboratorio/routers/api/displays.py",
              "apps/laboratorio/registry/services/service_registry.py",
          ]
          for ruta in archivos:
              try:
                  ast.parse(Path(ruta).read_text(encoding="utf-8", errors="replace"))
                  A("- sintaxis OK: " + ruta)
              except SyntaxError as e:
                  A("- sintaxis FALLO: " + ruta + " -> " + str(e))
                  if summary:
                      with open(summary, "a") as fh:
                          fh.write("\n".join(L) + "\n")
                  sys.exit(1)
          A("")

          A("## 1. Motor PBR real (render de prueba con escena de 3 objetos)")
          A("```")
          try:
              from apps.laboratorio.infrastructure.providers.renderer_photoreal import MotorRenderFotoreal

              class _EscenaPrueba:
                  ancho = 200
                  alto = 150
                  es_renderizable = True
                  objetos = [
                      {"forma": "rect", "x": 10, "y": 20, "w": 80, "h": 50, "color": "#3B82F6", "capa": "fondo"},
                      {"forma": "circle", "cx": 140, "cy": 75, "r": 30, "color": "#F59E0B", "capa": "medio"},
                      {"forma": "texto", "x": 15, "y": 110, "contenido": "ZYRA PBR", "color": "#E2E8F0", "capa": "frente"},
                  ]

              motor = MotorRenderFotoreal()
              resultado = motor.renderizar(_EscenaPrueba(), {"muestras": 1})
              firma = bytes(resultado.imagen_bytes[:8])
              A("PNG imagen valido: " + str(firma == b"\x89PNG\r\n\x1a\n"))
              A("PNG profundidad valido: " + str(bytes(resultado.profundidad_bytes[:8]) == b"\x89PNG\r\n\x1a\n"))
              A("bytes imagen: " + str(len(resultado.imagen_bytes)))
              A("brdf: " + str(resultado.metadata.get("brdf")))
              A("tonemap: " + str(resultado.metadata.get("tonemap")))
              A("sombras: " + str(resultado.metadata.get("sombras")))
              px_total = resultado.ancho * resultado.alto
              gris = resultado.profundidad_bytes
              no_cero = sum(1 for v in gris[8:] if v != 0)
              A("pixeles con profundidad: " + str(no_cero) + " de " + str(px_total))
              if firma != b"\x89PNG\r\n\x1a\n":
                  A("FALLO: PNG invalido")
                  sys.exit(1)
              if resultado.metadata.get("brdf") != "GGX Cook-Torrance":
                  A("FALLO: brdf incorrecta")
                  sys.exit(1)
              if no_cero <= 0:
                  A("FALLO: profundidad vacia")
                  sys.exit(1)
              A("PBR REAL CORRECTO")
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-2000:])
              sys.exit(1)
          A("```")
          A("")

          A("## 2. Salida universal (destinos en caliente, frame para moviles)")
          A("```")
          try:
              from apps.laboratorio.infrastructure.providers.display_holo3d import MotorHolo3D
              from apps.laboratorio.infrastructure.providers.png_encoder import encode_png_rgb

              disp = MotorHolo3D()
              if not disp.disponible():
                  A("FALLO: motor universal debe estar disponible")
                  sys.exit(1)
              A("deteccion: " + str(disp.detectar_dispositivos()))
              registro = disp.registrar_destino("web", "", "telefono-prueba")
              tid = registro["id"]
              A("destino web registrado: " + tid)
              frame = encode_png_rgb(8, 8, bytes(8 * 8 * 3))
              entrega = disp.presentar(frame, {})
              A("presentar: entregado=" + str(entrega.get("entregado")) + " entregados=" + str(entrega.get("entregados")))
              recuperado, mime = disp.frame_actual(tid)
              if recuperado != frame:
                  A("FALLO: frame pull no coincide")
                  sys.exit(1)
              A("frame pull para moviles OK (" + mime + ", " + str(len(recuperado)) + " bytes)")
              udp_reg = disp.registrar_destino("udp", "127.0.0.1:59998", "receptor-prueba")
              entrega_udp = disp.presentar(frame, {"tipo": "udp"})
              A("udp: " + str(entrega_udp.get("entregados")) + " entregado(s)")
              lista = disp.listar_destinos()
              A("destinos activos: " + str(len(lista["destinos"])))
              disp.quitar_destino(udp_reg["id"])
              vacio = disp.presentar(frame, {"tipo": "udp"})
              A("sin destino udp -> motivo honesto: " + str(vacio.get("motivo", ""))[:80])
              A("SALIDA UNIVERSAL CORRECTA")
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-2000:])
              sys.exit(1)
          A("```")
          A("")

          A("## 3. Red ZYRA Network (config automatica + honestidad)")
          A("```")
          try:
              from apps.laboratorio.config.network.network_config import NetworkConfig
              from apps.laboratorio.infrastructure.network.zyra_client import ClienteZyra
              from apps.laboratorio.shared.exceptions.network_errors import RedNoDisponibleError

              guardadas = {}
              for clave in ("LAB_ZYRA_URL", "ZYRA_URL", "ZYRA_HOST", "LAB_ZYRA_TOKEN", "ZYRA_API_TOKEN"):
                  guardadas[clave] = os.environ.pop(clave, None)

              cfg = NetworkConfig.cargar()
              A("sin env -> configurada: " + str(cfg.configurada))
              if cfg.configurada:
                  A("FALLO: sin env no debe configurarse")
                  sys.exit(1)

              os.environ["ZYRA_URL"] = "https://red-zyra.ejemplo"
              cfg2 = NetworkConfig.cargar()
              A("ZYRA_URL detectada: " + cfg2.url_zyra_core)
              if cfg2.url_zyra_core != "https://red-zyra.ejemplo":
                  A("FALLO: ZYRA_URL no detectada")
                  sys.exit(1)
              del os.environ["ZYRA_URL"]

              os.environ["LAB_ZYRA_URL"] = "https://lab-override.ejemplo"
              cfg3 = NetworkConfig.cargar()
              A("override LAB_ZYRA_URL: " + cfg3.url_zyra_core)
              if cfg3.url_zyra_core != "https://lab-override.ejemplo":
                  A("FALLO: override no funciona")
                  sys.exit(1)
              del os.environ["LAB_ZYRA_URL"]

              os.environ["ZYRA_HOST"] = "zyra-network.onrender.com"
              cfg4 = NetworkConfig.cargar()
              A("ZYRA_HOST -> " + cfg4.url_zyra_core)
              del os.environ["ZYRA_HOST"]

              for clave, valor in guardadas.items():
                  if valor is not None:
                      os.environ[clave] = valor

              cfg_muerta = NetworkConfig(
                  url_zyra_core="http://127.0.0.1:59997",
                  app_id="laboratorio",
                  api_token="",
                  timeout_segundos=1.0,
                  reintentos=1,
              )
              cli = ClienteZyra(cfg_muerta)
              estado = cli.estado_conexion()
              A("servidor muerto -> conectada: " + str(estado.get("conectada")))
              if estado.get("conectada") is not False:
                  A("FALLO: servidor muerto reporto conectada")
                  sys.exit(1)
              try:
                  cli.sellar_documento("t", "c")
                  A("FALLO: debia lanzar error con URL y servidor muerto")
                  sys.exit(1)
              except RedNoDisponibleError:
                  A("error honesto con reintentos agotados: OK")
              A("RED ZYRA NETWORK CORRECTA")
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-2000:])
              sys.exit(1)
          A("```")
          A("")

          A("## 4. Montaje completo de la app")
          A("```")
          try:
              mod = importlib.import_module(
                  "apps.laboratorio.registry.services.service_registry"
              )
              c = mod.construir_contenedor(":memory:")
              salud = c.obtener("estado_salud").estado()
              A("health: " + str(salud))
              appmod = importlib.import_module(
                  "apps.laboratorio.infrastructure.api.app"
              )
              app = appmod.montar_aplicacion(":memory:")
              rutas = app.listar_rutas()
              A("rutas montadas: " + str(len(rutas)))
              ok = True
              if salud.get("motores_total") != 16:
                  A("FALLO: motores != 16")
                  ok = False
              if salud.get("motores_disponibles") != 16:
                  A("FALLO: disponibles != 16 (universal activo)")
                  ok = False
              if len(rutas) != 70:
                  A("FALLO: rutas != 70")
                  ok = False
              red = salud.get("red", {})
              if red.get("configurada") is not False:
                  A("FALLO: red honesta sin env")
                  ok = False
              if ok:
                  A("MONTAJE COMPLETO CORRECTO")
              else:
                  sys.exit(1)
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-2000:])
              sys.exit(1)
          A("```")

          md = "\n".join(L)
          if summary:
              with open(summary, "a") as fh:
                  fh.write(md + "\n")
          print(md)
          PYEOF

      - name: Commit y push automatico
        run: |
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio/config/network/network_config.py
          git add apps/laboratorio/infrastructure/network/zyra_client.py
          git add apps/laboratorio/infrastructure/providers/display_holo3d.py
          git add apps/laboratorio/infrastructure/providers/renderer_photoreal.py
          git add apps/laboratorio/routers/api/displays.py
          git add apps/laboratorio/registry/services/service_registry.py
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "Lote: PBR GGX real + salidas universales a cualquier dispositivo + red ZYRA Network"
            git push
          fi
