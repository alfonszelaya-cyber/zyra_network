                       "birth_place": "SS",
                       "sex": "M",
                       "mother_name":
                           "Madre Gov",
                       "mother_zid": zid_madre,
                       "source":
                           "ministerio-salud"})
                  assert st == 201, str(body)
                  st, body = _axz_json(
                      "GET",
                      base
                      + "/axis/api/gobierno/censo",
                      role="gobierno")
                  assert body["data"][
                      "poblacion_registrada"] >= 2
                  st, body = _axz_json(
                      "POST",
                      base + "/axis/api/verify/generate",
                      {"subject_zid": zid_madre,
                       "operator_account":
