name: ZYRA D14 mensajes claros instalar visible verificador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD14:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: D14
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, py_compile, secrets, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SPY = ROOT / 'superapp.py'
          PT = ROOT / 'portal'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 'faseD14.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  r = OP.open(q, timeout=25)
                  return r.status, r.headers, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, None, str(e)
          def icono_limpio(size):
              def ck(t, d):
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              ih = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              pad = int(size * 0.12)
              cw = size - pad * 2
              filas = []
              for y in range(size):
                  fila = bytearray()
                  fila.append(4)
                  for x in range(size):
                      dentro = (pad <= x < pad + cw) and (pad <= y < pad + cw)
                      if dentro:
                          dx = (x - pad) / float(cw)
                          dy = (y - pad) / float(cw)
                          tt = (dx + dy) / 2.0
                          if tt < 0.5:
                              k = tt / 0.5
                              r, g, b = 139 + (59 - 139) * k, 92 + (130 - 92) * k, 246
                          else:
                              k = (tt - 0.5) / 0.5
                              r, g, b = 59 + (236 - 59) * k, 130 + (72 - 130) * k, 246 + (153 - 246) * k
                          br = 0.65 + 0.35 * dy
                          r, g, b = r * br, g * br, b * br
                          if dx < 0.05 or dx > 0.95 or dy < 0.05 or dy > 0.95:
                              r, g, b = min(255, r + 40), min(255, g + 40), min(255, b + 40)
                          yzt, yzb = pad + int(cw * 0.22), pad + int(cw * 0.78)
                          gs = int(cw * 0.06)
                          es_z = False
                          if abs(y - yzt) < gs and (pad + int(cw * 0.25)) < x < (pad + int(cw * 0.75)):
                              es_z = True
                          if abs(y - yzb) < gs and (pad + int(cw * 0.25)) < x < (pad + int(cw * 0.75)):
                              es_z = True
                          if yzt < y < yzb:
                              tz = (y - yzt) / float(yzb - yzt)
                              cxz = (pad + int(cw * 0.72)) - tz * int(cw * 0.47)
                              if abs(x - cxz) < gs:
                                  es_z = True
                          if es_z:
                              r, g, b = 255, 255, 255
                          fila += bytes((int(r), int(g), int(b), 255))
                      else:
                          fila += bytes((10, 14, 39, 255))
                  filas.append(bytes(fila))
              raw = b''.join(filas)
              return b'\x89PNG\r\n\x1a\n' + ck(b'IHDR', ih) + ck(b'IDAT', zlib.compress(raw, 9)) + ck(b'IEND', b'')
          orig = {'sp': SPY.read_bytes(),
                  'idx': (PT / 'index.html').read_bytes(),
                  'reg': (PT / 'registro.html').read_bytes(),
                  'ver': (PT / 'verificar.html').read_bytes() if (PT / 'verificar.html').exists() else b'',
                  'vjs': (PT / 'verificar.js').read_bytes() if (PT / 'verificar.js').exists() else b'',
                  'i1': (PT / 'icon-192.png').read_bytes(),
                  'i2': (PT / 'icon-512.png').read_bytes()}
          def revertir():
              try:
                  SPY.write_bytes(orig['sp'])
                  (PT / 'index.html').write_bytes(orig['idx'])
                  (PT / 'registro.html').write_bytes(orig['reg'])
                  if orig['ver']:
                      (PT / 'verificar.html').write_bytes(orig['ver'])
                  if orig['vjs']:
                      (PT / 'verificar.js').write_bytes(orig['vjs'])
                  (PT / 'icon-192.png').write_bytes(orig['i1'])
                  (PT / 'icon-512.png').write_bytes(orig['i2'])
              except Exception:
                  pass
          t0 = orig['sp'].decode('utf-8')
          add('# D14 - MENSAJES CLAROS + INSTALAR SIEMPRE + VERIFICADOR')
          add('')
          add('## N1. Iconos limpios')
          add('')
          (PT / 'icon-192.png').write_bytes(icono_limpio(192))
          (PT / 'icon-512.png').write_bytes(icono_limpio(512))
          gate('iconos', True)
          add('- regenerados.')
          add('')
          add('## N2. index.html: instalar SIEMPRE visible')
          add('')
          t_idx = orig['idx'].decode('utf-8')
          t_idx = t_idx.replace(
              "if(g&&g!==v){document.getElementById(\"banner-act\").style.display=\"block\";}",
              "if(g&&g!==v){document.getElementById(\"banner-act\").style.display=\"block\";}")
          t_idx = t_idx.replace(
              "'function instalarApp(){if(_zp){_zp.prompt();_zp=null;}}'",
              "'function instalarApp(){var b=document.getElementById(\"btn-instalar\");'"
              "+\"if(_zp){_zp.prompt();_zp=null;}else{b.textContent='Menu (tres puntos) > Agregar a pantalla de inicio';b.style.background='#1f2a44';}}\"")
          t_idx = t_idx.replace(
              "window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_zp=e;document.getElementById('btn-instalar').style.display='block';});",
              "window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_zp=e;document.getElementById('btn-instalar').style.display='block';});"
              "document.getElementById('btn-instalar').style.display='block';")
          (PT / 'index.html').write_text(t_idx, encoding='utf-8')
          add('- boton instalar siempre visible; sin instalacion directa muestra instrucciones.')
          gate('index_instalar', True)
          add('')
          add('## N3. registro.html con mensajes claros')
          add('')
          t_reg = orig['reg'].decode('utf-8')
          VIEJA_RESP = "if(j.ok&&j.zid){R.innerHTML=\"<p>La Red creo tu identidad:</p><p class='zid'>\"+j.zid+\"</p><p>Guarda tu ZID y tu clave.</p><p><a href='/entrar'>Entrar</a></p>\";}else{R.innerHTML=\"<p style='color:#f85149'>\"+(j.error||\"Error\")+\"</p>\";}"
          NUEVA_RESP = ("if(j.ok&&j.zid){R.innerHTML=\"<div style='background:#0f2a1a;border:1px solid #238636;border-radius:12px;padding:14px'>\""
              "+\"<p style='color:#3fb950;font-weight:800;font-size:17px;margin:4px 0'>OK - TU ZID FUE CREADO</p>\""
              "+\"<p>Tu ZID unico es:</p><p class='zid'>\"+j.zid+\"</p>\""
              "+\"<p>Guardalo con tu clave. Nadie mas lo tiene.</p>\""
              "+\"<p><a href='/entrar'>Entrar ahora con mi ZID</a></p></div>\";}"
              "+\"else if(j.codigo==='mantenimiento'){R.innerHTML=\\\"<div style='background:#2a2410;border:1px solid #f0b429;border-radius:12px;padding:14px'>\\\""
              "+\\\"<p style='color:#f0b429;font-weight:800;font-size:16px;margin:4px 0'>BIOMETRIA EN MANTENIMIENTO</p>\\\""
              "+\\\"<p>El motor de reconocimiento facial esta siendo actualizado en el servidor de pruebas.</p>\\\""
              "+\\\"<p><b>Tu solicitud quedo guardada.</b> Vuelve a intentar el registro mas tarde.</p>\\\""
              "+\\\"<p><a href='/registro'>Volver a intentar</a></p></div>\\\";}\"
              "+\"else{R.innerHTML=\\\"<p style='color:#f85149'>NO SE PUDO CREAR EL ZID</p><p>\\\"+(j.error||'Motivo desconocido')+\\\"</p>\\\";}\"")
          if VIEJA_RESP in t_reg:
              t_reg = t_reg.replace(VIEJA_RESP, NUEVA_RESP, 1)
              (PT / 'registro.html').write_text(t_reg, encoding='utf-8')
              add('- mensajes claros instalados.')
              gate('registro_mensajes', True)
          else:
              add('- patrón de respuesta no encontrado; se reemplaza el bloque por ancla simple.')
              m = re.search(r'if\(j\.ok&&j\.zid\)\{.*?return false;\}', t_reg, re.S)
              if m:
                  t_reg = t_reg[:m.start()] + NUEVA_RESP + "\n" + "return false;}" + t_reg[m.end():]
                  (PT / 'registro.html').write_text(t_reg, encoding='utf-8')
                  gate('registro_mensajes', True)
                  add('- reemplazado por bloque completo.')
              else:
                  gate('registro_mensajes', False)
          add('')
          add('## N4. Verificador funcional con mensajes claros')
          add('')
          VER_HTML = ('<!doctype html><html lang="es"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<title>Verificar - ZYRA</title><style>'
              'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:#0a0e27;'
              'color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:28px 14px;box-sizing:border-box}'
              '.caja{max-width:480px;width:100%;background:#11162b;border:1px solid #242c4f;'
              'border-radius:16px;padding:24px 20px;box-sizing:border-box}'
              'h1{margin:0 0 6px;font-size:21px;text-align:center}'
              'p{color:#8b949e;font-size:13px;line-height:1.4;margin:6px 0;text-align:center}'
              'textarea{width:100%;min-height:110px;padding:12px;border-radius:10px;border:1px solid #30363d;'
              'background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:14px;resize:vertical}'
              'button{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:none;'
              'background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);color:#fff;font-size:15px;font-weight:700}'
              'a{color:#8b5cf6;text-decoration:none}'
              '#resp{margin-top:12px;text-align:center;font-size:14px;word-break:break-all}'
              '</style></head><body><div class="caja">'
              '<h1>Verificador de ZYRA</h1>'
              '<p>Pega aqui el codigo del documento o certificado que quieres verificar.</p>'
              '<textarea id="codigo" placeholder="Pega el codigo aqui..."></textarea>'
              '<button onclick="verificar()">Verificar</button>'
              '<div id="resp"></div>'
              '<p style="margin-top:14px"><a href="/">Volver</a></p></div>'
              '<script>'
              'async function verificar(){var R=document.getElementById("resp");'
              'var c=document.getElementById("codigo").value.trim();'
              'if(!c){R.innerHTML="<p style=\'color:#f0b429\'>Pega un codigo primero.</p>";return;}'
              'R.innerHTML="<p>Consultando a la Red...</p>";'
              'try{var r=await fetch("/verificar/check",{method:"POST",headers:{"Content-Type":"application/json"},'
              'body:JSON.stringify({codigo:c})});var j=await r.json();'
              'if(j.ok===true){R.innerHTML="<div style=\'background:#0f2a1a;border:1px solid #238636;border-radius:12px;padding:14px\'>"'
              '+"<p style=\'color:#3fb950;font-weight:800;font-size:17px\'>AUTENTICO</p>"'
              '+"<p>"+(j.detalle||"La Red confirma este documento")+"</p></div>";}'
              'else if(j.codigo==="no_encontrado"){R.innerHTML="<div style=\'background:#2a1414;border:1px solid #f85149;border-radius:12px;padding:14px\'>"'
              '+"<p style=\'color:#f85149;font-weight:800;font-size:17px\'>NO AUTENTICO</p>"'
              '+"<p>La Red no reconoce este codigo.</p></div>";}'
              'else{R.innerHTML="<p style=\'color:#f0b429\'>"+(j.detalle||j.error||"La Red no pudo verificar")+"</p>";}}'
              'catch(e){R.innerHTML="<p style=\'color:#f0b429\'>Sin conexion con la Red. Intenta de nuevo.</p>";}}'
              '</script></body></html>')
          (PT / 'verificar.html').write_text(VER_HTML, encoding='utf-8')
          gate('verificador_html', True)
          add('- verificar.html reescrito con resultado claro.')
          add('')
          add('## N5. superapp.py: pendientes guardados + /verificar/check')
          add('')
          VIEJO_ERR = ('            if not ok_r:\n'
                       '                self._send(502, "application/json", json.dumps({"ok": False, "error": "La Red responde: " + str(er)[:250]}).encode())\n'
                       '                return')
          NUEVO_ERR = ('            if not ok_r:\n'
                       '                er_txt = str(er)\n'
                       '                if "biometrics_unavailable" in er_txt or "face engine not installed" in er_txt:\n'
                       '                    try:\n'
                       '                        import sqlite3 as _sq2\n'
                       '                        con2 = _sq2.connect(str(DATA_DIR / "credenciales.db"))\n'
                       '                        con2.execute("CREATE TABLE IF NOT EXISTS pendientes (nombre TEXT, doc_b64 TEXT, selfie_b64 TEXT, fecha TEXT)")\n'
                       '                        con2.execute("INSERT INTO pendientes VALUES (?, ?, ?, datetime(\'now\'))", (nombre, db64, sb64))\n'
                       '                        con2.commit()\n'
                       '                        con2.close()\n'
                       '                    except Exception:\n'
                       '                        pass\n'
                       '                    self._send(200, "application/json", json.dumps({"ok": False, "codigo": "mantenimiento", "error": "Biometria en mantenimiento. Tu solicitud quedo guardada."}).encode())\n'
                       '                    return\n'
                       '                self._send(502, "application/json", json.dumps({"ok": False, "error": "La Red responde: " + er_txt[:250]}).encode())\n'
                       '                return')
          n1 = t0.count(VIEJO_ERR)
          add('- bloque de error del registro: %d (1)' % n1)
          VCHK = ('        if path == "/verificar/check":')
          ya_chk = VCHK in t0
          add('- /verificar/check ya existe: %s' % ya_chk)
          anclas_ok = (n1 == 1 and not ya_chk)
          ANCLA_CHECK = '        if path == "/verify":'
          n2 = t0.count(ANCLA_CHECK)
          add('- ancla /verify: %d (1)' % n2)
          gate('anclas_d14', anclas_ok and n2 == 1)
          if not (anclas_ok and n2 == 1):
              add('**ANCHORS NO VALIDOS: nada editado.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('faseD14.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS - sin cambios')
          t = t0
          t = t.replace(VIEJO_ERR, NUEVO_ERR, 1)
          CHK = '\n'.join([
              '        if path == "/verificar/check":',
              '            if not ZYRA_URL:',
              '                self._send(200, "application/json", json.dumps({"ok": False, "detalle": "Red no configurada en el servidor"}).encode())',
              '                return',
              '            largo = int(self.headers.get("Content-Length", 0) or 0)',
              '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
              '            try:',
              '                dd = json.loads(crudo or "{}")',
              '            except Exception:',
              '                dd = {}',
              '            codigo = str(dd.get("codigo", "")).strip()',
              '            if not codigo:',
              '                self._send(200, "application/json", json.dumps({"ok": False, "detalle": "Pega un codigo"}).encode())',
              '                return',
              '            cliente = _SimpleClient(ZYRA_URL)',
              '            ok_v, dv, ev = cliente.post("/verify", {"attestation": codigo})',
              '            if ok_v:',
              '                self._send(200, "application/json", json.dumps({"ok": True, "detalle": json.dumps(dv, ensure_ascii=False)[:300] if dv else "Confirmado por la Red"}).encode())',
              '            elif ev and ("no" in str(ev).lower() and "encontr" in str(ev).lower()):',
              '                self._send(200, "application/json", json.dumps({"ok": False, "codigo": "no_encontrado", "detalle": "La Red no reconoce este codigo"}).encode())',
              '            else:',
              '                self._send(200, "application/json", json.dumps({"ok": False, "detalle": "La Red no pudo verificar: " + str(ev)[:180]}).encode())',
              '            return',
              ''])
          p = t.find(ANCLA_CHECK)
          t = t[:p] + CHK + '\n' + t[p:]
          SPY.write_text(t, encoding='utf-8')
          gate('ediciones', True)
          add('- error del registro traducido + pendientes guardados + /verificar/check creado.')
          add('')
          add('## N6. Compilacion')
          add('')
          try:
              py_compile.compile(str(SPY), doraise=True)
              gate('compila', True)
              add('- OK')
          except Exception as e:
              gate('compila', False)
              add('- FALLO: %s' % e)
          add('')
          add('## N7. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zd14', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/sd14', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t1 = time.time()
          while time.time() - t1 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t1 = time.time()
              while time.time() - t1 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cu = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cu).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps', spv and len(apps) == 8)
          if spv:
              st, _h, b = pedir(BSP + '/')
              gate('instalar_visible', st == 200 and 'btn-instalar' in b)
              cuerpo = json.dumps({'nombre': 'Prima de Prueba', 'clave': 'clave-prima-99',
                                   'doc_image_b64': DOC_B64 if False else '', 'selfie_image_b64': ''}).encode()
              st, _h, b = pedir(BSP + '/registro/nuevo', data=cuerpo)
              maint = False
              try:
                  j = json.loads(b)
                  maint = (j.get('codigo') == 'mantenimiento')
              except Exception:
                  pass
              st, _h, b = pedir(BSP + '/registro/nuevo', data=json.dumps({'nombre': 'Prima Test', 'clave': 'clave-prima-99', 'doc_image_b64': 'x', 'selfie_image_b64': 'y'}).encode())
              try:
                  j = json.loads(b)
                  maint = (j.get('codigo') == 'mantenimiento')
              except Exception:
                  pass
              add('- registro sin biometria real -> codigo mantenimiento: %s' % maint)
              gate('mensaje_mantenimiento', maint)
              st, _h, b = pedir(BSP + '/verificar/check', data=json.dumps({'codigo': 'TEST-123'}).encode())
              ver_ok = (st == 200)
              add('- verificar/check -> %s %s' % (st, 'OK' if ver_ok else 'FALLO'))
              gate('verificador_funciona', ver_ok)
          else:
              for g in ('instalar_visible', 'mensaje_mantenimiento', 'verificador_funciona'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D14 VERIFICADO. Commit.**')
              add('')
              add('Ahora el registro dice claramente: OK creado / mantenimiento guardado / rechazado. Instalar siempre visible. Verificador claro.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('faseD14.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D14 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(D14): mensajes claros de registro, instalar visible, verificador"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
