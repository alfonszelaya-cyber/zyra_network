name: "AUDITORIA PURA (solo lectura, cero fixes)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt pytest
      - name: Ver los 6 archivos clave
        run: |
          echo "=== combined_api.py (primeras 80 lineas) ==="
          head -80 shared_engines/runtime/combined_api.py
          echo ""
          echo "=== test_runtime_api.py (lineas 600-640, donde falla death) ==="
          sed -n '600,640p' shared_engines/runtime/tests/test_runtime_api.py
          echo ""
          echo "=== test_capabilities_api.py (lineas 510-540, donde falla verification) ==="
          sed -n '510,540p' shared_engines/runtime/tests/test_capabilities_api.py
          echo ""
          echo "=== test_portable_identity.py (lineas 460-500, donde falla expediente) ==="
          sed -n '460,500p' shared_engines/network/tests/test_portable_identity.py
          echo ""
          echo "=== integrations/engine.py (lineas 1-30, imports) ==="
          head -30 shared_engines/integrations/engine.py
          echo ""
          echo "=== ejecutar los 4 tests que fallan con traceback ==="
          python3 -m pytest \
            "shared_engines/runtime/tests/test_runtime_api.py::test_death_lifecycle_deceased" \
            "shared_engines/runtime/tests/test_runtime_api.py::test_verify_existence_public" \
            "shared_engines/runtime/tests/test_capabilities_api.py::test_verification_verdict_signed" \
            "shared_engines/network/tests/test_portable_identity.py::test_expediente_legal_pedro" \
            -vv --tb=long 2>&1 | tail -120
