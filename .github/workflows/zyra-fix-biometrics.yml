name: "ZYRA AUDIT MOTOR FINANCIERO UNIFICADO (pagos+remesas+cripto)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: P1 - payment_engine real (que tan vacio esta)
        run: |
          {
          echo "## P1: payment en todo el repo"
          echo '```'
          echo "=== archivos con payment ==="
          grep -rliE "payment" shared_engines apps --include='*.py' | head -20 || true
          echo "=== clases/funcs payment ==="
          grep -rniE "class .*(payment|pay)|def .*(payment|pay)|payment_engine" shared_engines apps --include='*.py' | head -25 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P2 - quien instancia CurrencyEngine (punto de conexion)
        run: |
          {
          echo "## P2: CurrencyEngine( en el repo (wiring real)"
          echo '```'
          grep -rn "CurrencyEngine(" shared_engines apps --include='*.py' | grep -v test | head -10 || true
          echo ""
          echo "=== kernel: engines que ya ensambla ==="
          grep -n "Engine(\|engine = \|_engine" shared_engines/runtime/kernel.py | head -30 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P3 - tokenization ledger (base monedas digitales)
        run: |
          {
          echo "## P3: tokenization/ledger.py completo (numerado)"
          echo '```python'
          awk '{printf "%5d| %s\n", NR, $0}' shared_engines/tokenization/ledger.py 2>/dev/null | head -180 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: P4 - sonda proveedores cripto publicos en vivo
        run: |
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import urllib.request
          print("## P4: proveedores publicos de precios cripto (dato, no gate)")
          print("```")
          print("--- CoinGecko BTC/USD")
          try:
              req = urllib.request.Request(
                  "https://api.coingecko.com/api/v3/simple/price"
                  "?ids=bitcoin,tron,solana&vs_currencies=usd",
                  headers={"User-Agent": "zyra-network"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  d = json.loads(r.read().decode())
              print("OK:", json.dumps(d))
          except Exception as e:
              print("FALLO:", type(e).__name__, str(e)[:100])
          print("--- Binance public BTC/USDT")
          try:
              req = urllib.request.Request(
                  "https://api.binance.com/api/v3/ticker/price"
                  "?symbol=BTCUSDT",
                  headers={"User-Agent": "zyra-network"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  d = json.loads(r.read().decode())
              print("OK:", json.dumps(d))
          except Exception as e:
              print("FALLO:", type(e).__name__, str(e)[:100])
          print("```")
          EOF
          exit 0

      - name: P5 - SUBASTAS y NEXO (estructura minima)
        run: |
          {
          echo "## P5: puertas de apps"
          echo '```'
          echo "=== subastas archivos ==="
          find apps/subastas -name "*.py" | sort | head -15 || true
          echo "=== nexo modulos ==="
          find apps/nexo -maxdepth 2 -type d | sort | head -20 || true
          echo "=== btc/meno cripto ya escrito ==="
          grep -rniE "bitcoin|btc" shared_engines apps --include='*.py' | grep -viE "test" | head -10 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Suites de estado (linea base verde)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          {
          echo "## Linea base"
          echo '```'
          echo "--- tokenization"
          timeout 120 python3 -m pytest shared_engines/tokenization/tests -q --timeout=45 --timeout-method=thread --tb=line 2>&1 | tail -4 || true
          echo "--- nexo"
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line 2>&1 | tail -4 || true
          echo "--- subastas"
          timeout 300 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line 2>&1 | tail -4 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
