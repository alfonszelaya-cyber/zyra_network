name: "ZYRA CONECTORES 3: GEO (Nominatim + Overpass)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir providers GEO
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)

          MOD = D(r'''
              """Conectores GEO de la Red
              (OpenStreetMap: Nominatim geocoding
              + Overpass consultas, sin key,
              falla honesta). Nominatim publico:
              max 1 req/seg - para produccion
              nacional, self-host (punto 11)."""
              from __future__ import annotations

              import hashlib
              import json
              import time
              import urllib.request
              import urllib.parse


              class _HttpBase:
                  """GET con UA de la Red + parse JSON."""

                  name = "base"

                  def __init__(
                      self,
                      *,
                      timeout_seconds: float = 15.0,
                  ) -> None:
                      self._timeout = timeout_seconds

                  def _get_json(self, url: str):
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                              "zyra-network/1.0"
                          })
                      with urllib.request.urlopen(
                              req,
                              timeout=self._timeout) as r:
                          return json.loads(
                              r.read().decode("utf-8"))

                  def _sha(self, data) -> str:
                      return hashlib.sha256(
                          json.dumps(
                              data,
                              sort_keys=True,
                              default=str).encode(
                              "utf-8")).hexdigest()


              class NominatimConnector(_HttpBase):
                  """Geocoding: direccion ->
                  coordenadas (y reversa)."""

                  name = "nominatim"

                  def __init__(
                      self,
                      *,
                      min_interval_seconds: float = 1.1,
                      **kwargs,
                  ) -> None:
                      super().__init__(**kwargs)
                      self._min_interval = (
                          min_interval_seconds)
                      self._last_call = 0.0

                  def _throttle(self) -> None:
                      now = time.time()
                      espera = (
                          self._min_interval
                          - (now - self._last_call))
                      if espera > 0:
                          time.sleep(espera)
                      self._last_call = time.time()

                  def geocode(
                      self,
                      query: str,
                      *,
                      country_codes: str = "sv",
                      limit: int = 5,
                  ) -> dict:
                      """Direccion -> lista de
                      coordenadas candidatas."""
                      self._throttle()
                      q = urllib.parse.quote(query)
                      url = (
                          "https://nominatim.openstreetmap.org"
                          "/search?q=" + q
                          + "&countrycodes="
                          + country_codes
                          + "&format=json&limit="
                          + str(limit))
                      d = self._get_json(url)
                      resultados = []
                      for it in d[:limit]:
                          resultados.append({
                              "display_name": it.get(
                                  "display_name"),
                              "lat": it.get("lat"),
                              "lon": it.get("lon"),
                              "type": it.get("type"),
                          })
                      resumen = {
                          "source": self.name,
                          "query": query,
                          "count": len(resultados),
                          "results": resultados,
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen

                  def reverse(
                      self, *, lat: float,
                      lon: float) -> dict:
                      """Coordenadas -> direccion."""
                      self._throttle()
                      url = (
                          "https://nominatim.openstreetmap.org"
                          "/reverse?lat=" + str(lat)
                          + "&lon=" + str(lon)
                          + "&format=json")
                      d = self._get_json(url)
                      resumen = {
                          "source": self.name,
                          "lat": lat,
                          "lon": lon,
                          "display_name": d.get(
                              "display_name"),
                          "address": d.get("address"),
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen


              class OverpassConnector(_HttpBase):
                  """Consultas de objetos OSM
                  (amenities, caminos, areas)."""

                  name = "overpass"

                  def fetch(self, *, query: str) -> dict:
                      """Ejecuta una query Overpass QL
                      (ej: escuelas en un bounding box)."""
                      q = urllib.parse.quote(query)
                      url = (
                          "https://overpass-api.de"
                          "/api/interpreter?data=" + q)
                      d = self._get_json(url)
                      elems = d.get("elements", [])
                      resumen = {
                          "source": self.name,
                          "count": len(elems),
                          "elements": elems[:20],
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen

                  def amenities_in_bbox(
                      self, *,
                      south: float, west: float,
                      north: float, east: float,
                      amenity: str = "school",
                  ) -> dict:
                      """Atajos comunes: amenidades
                      en un bounding box (ej: SV)."""
                      query = (
                          "[out:json][timeout:25];"
                          "node[amenity=" + amenity + "]"
                          "(" + str(south) + ","
                          + str(west) + ","
                          + str(north) + ","
                          + str(east) + ");out 20;")
                      return self.fetch(query=query)
          ''')

          TESTS = D(r'''
              """Tests GEO (mockeados)."""
              from __future__ import annotations

              import json

              from shared_engines.integrations.rates_geo import (
                  NominatimConnector,
                  OverpassConnector,
              )


              class _R:
                  def __init__(self, p):
                      self._p = p

                  def __enter__(self):
                      return self

                  def __exit__(self, *a):
                      return False

                  def read(self):
                      return self._p


              def test_nominatim_geocode(
                  tmp_path, monkeypatch) -> None:
                  body = json.dumps([
                      {"display_name":
                       "San Salvador, SV",
                       "lat": "13.69",
                       "lon": "-89.19",
                       "type": "city"}]).encode()
                  monkeypatch.setattr(
                      "urllib.request.urlopen",
                      lambda req, timeout=None: _R(body))
                  r = NominatimConnector().geocode(
                      "San Salvador")
                  assert r["count"] == 1
                  assert r["results"][0]["lat"] == "13.69"
                  assert r["sha256"]
                  print("OK geo: nominatim geocoding SV")


              def test_nominatim_reverse(
                  tmp_path, monkeypatch) -> None:
                  body = json.dumps({
                      "display_name":
                      "Colon, La Libertad, SV",
                      "address": {"city": "Colon"}}).encode()
                  monkeypatch.setattr(
                      "urllib.request.urlopen",
                      lambda req, timeout=None: _R(body))
                  r = NominatimConnector().reverse(
                      lat=13.68, lon=-89.20)
                  assert "Colon" in r["display_name"]
                  print("OK geo: nominatim reverse")


              def test_overpass_amenities(
                  tmp_path, monkeypatch) -> None:
                  body = json.dumps({
                      "elements": [
                          {"type": "node",
                           "id": 1,
                           "lat": 13.7,
                           "lon": -89.2},
                          {"type": "node",
                           "id": 2,
                           "lat": 13.8,
                           "lon": -89.3}]}).encode()
                  monkeypatch.setattr(
                      "urllib.request.urlopen",
                      lambda req, timeout=None: _R(body))
                  r = OverpassConnector().amenities_in_bbox(
                      south=13.0, west=-90.0,
                      north=14.0, east=-88.0,
                      amenity="school")
                  assert r["count"] == 2
                  assert r["elements"][0]["id"] == 1
                  print("OK geo: overpass escuelas SV")
          ''')

          p = pathlib.Path("shared_engines/integrations/rates_geo.py")
          if p.exists() and "class NominatimConnector" in p.read_text(encoding="utf-8"):
              out("- **modulo geo: YA**")
          else:
              try:
                  ast.parse(MOD)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(MOD, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  out("- **modulo geo: OK (" + str(len(MOD)) + " chars)**")
              except Exception:
                  out("- **modulo geo: ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          t = pathlib.Path("shared_engines/integrations/tests/test_geo.py")
          if t.exists() and "test_overpass_amenities" in t.read_text(encoding="utf-8"):
              out("- **tests geo: YA**")
          else:
              try:
                  ast.parse(TESTS)
                  t.parent.mkdir(parents=True, exist_ok=True)
                  t.write_text(TESTS, encoding="utf-8")
                  py_compile.compile(str(t), doraise=True)
                  out("- **tests geo: OK (" + str(len(TESTS)) + " chars)**")
              except Exception:
                  out("- **tests geo: ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          chk = pathlib.Path("shared_engines/integrations/rates_geo.py")
          chk2 = pathlib.Path("shared_engines/integrations/tests/test_geo.py")
          out("- **verif disco: modulo=" + str(chk.exists()) + " test=" + str(chk2.exists()) + "**")
          exit(0)
          EOF

      - name: "G1: tests geo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 120 python3 -m pytest shared_engines/integrations/tests/test_geo.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/g1.out 2>&1
          echo $? > /tmp/g1
          if [ "$(cat /tmp/g1)" = "0" ]; then echo "- G1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- G1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### G1 detalle"; echo '```'; tail -60 /tmp/g1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "G2: regresion shared_engines"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/g2.out 2>&1
          echo $? > /tmp/g2
          if [ "$(cat /tmp/g2)" = "0" ]; then echo "- G2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- G2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### G2 detalle"; echo '```'; tail -60 /tmp/g2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "G3: apps intactas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/nexo/tests apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/g3.out 2>&1
          echo $? > /tmp/g3
          if [ "$(cat /tmp/g3)" = "0" ]; then echo "- G3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- G3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### G3 detalle"; echo '```'; tail -40 /tmp/g3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in g1 g2 g3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: G1-G3 VERDES — LOTE 3 GEO CONECTADO**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(conectores): GEO - Nominatim geocoding/reverse con throttle 1.1s + Overpass amenities bbox (G1-G3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 3/4. Sigue lote comunicacion (necesita tus keys).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
