name: "ZYRA MARKET (Bloque 4 v4): ruta API dashboard antes de starts-with"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-b4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Step 1 - Write ejecutivo_store.py (si falta)
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path

          P = Path("apps/subastas/modules/001_ejecutivo/ejecutivo_store.py")
          if P.exists() and "def zyra_intelligence" in P.read_text(encoding="utf-8"):
              print("OK: ejecutivo_store.py ya existe (v3 lo escribio y commit fallo por E2E, pero el archivo esta en el repositorio)")
              sys.exit(0)
          print("FALTA archivo - problema de estado, avisar al operador")
          sys.exit(1)
          PYEOF

      - name: Step 2 - Fix ruta API (moverla antes de starts-with)
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path

          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)

          P = "apps/subastas/server.py"
          txt = Path(P).read_text(encoding="utf-8")

          if 'if path == "/subastas/api/dashboard":' not in txt:
              fail("ruta dashboard no existe en server.py - estado inesperado")

          # El v3 inserto la ruta dashboard DESPUES del startswith de orders.
          # La movemos: extraemos el bloque dashboard y lo reinsertamos ANTES
          # de la primera ruta startswith de orders.
          lines = txt.splitlines(keepends=True)

          # localizar bloque dashboard (3 lineas: if/return/return-vacio)
          d_idx = None
          for i, l in enumerate(lines):
              if l.strip() == 'if path == "/subastas/api/dashboard":':
                  d_idx = i
                  break
          if d_idx is None:
              fail("no hallado")
          # el bloque: if + 2 lineas siguientes (send + return)
          block = lines[d_idx : d_idx + 3]
          if len(block) < 3 or "market_dashboard_api" not in block[1]:
              fail("bloque dashboard inesperado: %r" % (block,))
          rest = lines[:d_idx] + lines[d_idx + 3 :]

          # buscar la primera ruta startswith de orders en do_POST
          target = None
          for i, l in enumerate(rest):
              if 'if path.startswith("/subastas/api/orders/"):' in l:
                  target = i
                  break
          if target is None:
              fail("no hallado startswith orders")

          lines = rest[:target] + block + rest[target:]
          out = "".join(lines)

          try:
              compile(out, P, "exec")
          except SyntaxError as e:
              print("COMPILE-FAIL:", e.msg, e.lineno)
              fail("compile")
          Path(P).write_text(out, encoding="utf-8")
          print("RUTA dashboard movida antes de startswith orders OK")

          # verificacion de orden: dashboard debe aparecer ANTES que startswith
          final = out
          pos_d = final.find('if path == "/subastas/api/dashboard":')
          pos_o = final.find('if path.startswith("/subastas/api/orders/"):')
          if pos_o != -1 and pos_d > pos_o:
              fail("orden de rutas sigue incorrecto")
          print("ORDEN de rutas OK (dashboard antes de startswith)")
          PYEOF

      - name: Step 3 - E2E (mismo del v3, todos los pasos)
        run: |
          python3 - <<'EOF'
          import http.cookiejar
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          import uuid

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-" + uuid.uuid4().hex[:8]}, None)
                  return (False, None, "offline")


          def make_opener():
              cj = http.cookiejar.CookieJar()
              return urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(cj)
              )


          def call(opener, method, url, payload=None, form=None):
              if form is not None:
                  data = urllib.parse.urlencode(form).encode()
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              else:
                  data = json.dumps(payload).encode() if payload is not None else None
                  headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with opener.open(req, timeout=5) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read()[:400].decode("utf-8", "replace")
                  raise AssertionError("HTTP %s %s %s -> %s" % (e.code, method, url, body))


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          op_sell = make_opener()
          sname = "sell" + uuid.uuid4().hex[:6]
          call(op_sell, "POST", base + "/subastas/registro", form={
              "username": sname, "password": "clave123",
              "display_name": "Vendedor Test", "role": "vendedor"})
          op_buy = make_opener()
          bname = "buy" + uuid.uuid4().hex[:6]
          call(op_buy, "POST", base + "/subastas/registro", form={
              "username": bname, "password": "clave123",
              "display_name": "Comprador Test", "role": "comprador"})
          print("1. cuentas vendedor+comprador OK")

          st, html = call(op_sell, "GET", base + "/subastas/dashboard")
          assert "Bienvenido a ZYRA MARKET" in html, html[:300]
          print("2. inteligencia ZYRA detecta usuario nuevo OK")

          call(op_sell, "POST", base + "/subastas/listing", form={
              "seller_account": sname, "title": "Item Dashboard",
              "description": "d", "base_price": "10"})
          print("3. vendedor publica OK")

          st, html = call(op_sell, "GET", base + "/subastas/dashboard")
          assert "Mis numeros" in html
          assert "Publicaciones: 1 (1 abiertas)" in html
          assert "Inteligencia ZYRA" in html
          assert "sin ofertas" in html
          print("4. dashboard vendedor: numeros reales + recomendacion OK")

          st, html = call(op_buy, "GET", base + "/subastas/dashboard")
          assert "Hola" in html and "Comprador Test" in html
          print("5. dashboard comprador OK")

          st, html = call(op_buy, "GET", base + "/subastas/api/dashboard")
          d = json.loads(html)
          assert d["ok"] and d["data"]["stats"]["listings_total"] == 0
          assert d["data"]["intelligence"]["resumen"]
          print("6. API del dashboard OK (stats + inteligencia JSON)")

          print("E2E SMOKE OK: Bloque 4 completo")
          EOF

      - name: ZYRA MARKET tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/subastas/tests -q || true

      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (Bloque 4 v4): dashboard API route before starts-with" -m "Route ordering fix: /subastas/api/dashboard was shadowed by /subastas/api/orders/ startswith. Moved before it. E2E passed steps 1-5 in v3; step 6 now also passes."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
