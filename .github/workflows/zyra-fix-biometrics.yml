name: "ZYRA AUDIT SEMILLA (solo lectura - inicio Etapa 2)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "[LECTURA] Auditoria apps/semilla"
        run: |
          python3 << 'PYEOF'
          import ast, os, pathlib, re
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def info_py(p):
              d = {"path": str(p), "size": 0, "state": "code",
                   "classes": [], "funcs": [], "imports": []}
              try:
                  d["size"] = p.stat().st_size
                  src = p.read_text(encoding="utf-8",
                                    errors="replace")
              except Exception:
                  d["state"] = "unreadable"
                  return d
              if len(src.strip()) <= 1:
                  d["state"] = "empty"
                  return d
              try:
                  tree = ast.parse(src)
              except Exception:
                  d["state"] = "syntax_error"
                  return d
              for n in ast.walk(tree):
                  if isinstance(n, ast.ClassDef):
                      d["classes"].append(n.name)
                  elif isinstance(n, (ast.FunctionDef,
                                      ast.AsyncFunctionDef)):
                      d["funcs"].append(n.name)
                  elif isinstance(n, ast.ImportFrom):
                      if n.module:
                          d["imports"].append(n.module)
                  elif isinstance(n, ast.Import):
                      for a in n.names:
                          d["imports"].append(a.name)
              return d

          SX = pathlib.Path("apps/semilla")
          if not SX.exists():
              out("## apps/semilla NO EXISTE en el repo")
          else:
              out("## 1. Mapa apps/semilla (2 niveles)")
              for p in sorted(SX.iterdir()):
                  tipo = ("DIR" if p.is_dir() else "FILE")
                  out("- **" + p.name + "** (" + tipo + ")")
                  if p.is_dir():
                      hijos = sorted([x.name for x in
                                      p.iterdir()])[:25]
                      out("    - " + ", ".join(hijos))

              out("## 2. Dominios (llenos vs vacios)")
              dom = SX / "domain"
              if dom.exists():
                  for carp in sorted(dom.iterdir()):
                      if not carp.is_dir():
                          continue
                      files = [info_py(f) for f in
                               sorted(carp.rglob("*.py"))]
                      llenos = [f for f in files
                                if f["state"] == "code"]
                      vacios = [f for f in files
                                if f["state"] == "empty"]
                      clases = []
                      for f in llenos:
                          clases.extend(f["classes"])
                      out("- **" + carp.name + "**: total="
                          + str(len(files)) + " llenos="
                          + str(len(llenos)) + " vacios="
                          + str(len(vacios))
                          + (" | clases: "
                             + ", ".join(clases[:10])
                             if clases else ""))
                      for v in vacios[:12]:
                          out("    - vacio: " + v["path"])
              else:
                  out("- NO EXISTE domain/")

              out("## 3. Use cases (llenos vs vacios)")
              app = SX / "application"
              if app.exists():
                  for carp in sorted(app.iterdir()):
                      if not carp.is_dir():
                          continue
                      files = [info_py(f) for f in
                               sorted(carp.rglob("*.py"))]
                      llenos = len([f for f in files
                                    if f["state"] == "code"])
                      vacios = len([f for f in files
                                    if f["state"] == "empty"])
                      out("- **" + carp.name + "**: llenos="
                          + str(llenos) + " vacios="
                          + str(vacios))
                      for f in files:
                          if f["state"] == "empty":
                              out("    - vacio: " + f["path"])
              else:
                  out("- NO EXISTE application/")

              out("## 4. Modulos")
              mod = SX / "module"
              if mod.exists():
                  for f in sorted(mod.rglob("*.py")):
                      d = info_py(f)
                      out("- **" + str(f.relative_to(SX)) + "** ("
                          + str(d["size"]) + "b, "
                          + d["state"] + ", "
                          + str(len(d["funcs"])) + " funcs)")
              else:
                  out("- NO EXISTE module/")

              out("## 5. Tests")
              tdir = SX / "tests"
              total = 0
              if tdir.exists():
                  for f in sorted(tdir.rglob("test_*.py")):
                      d = info_py(f)
                      nt = sum(1 for x in d["funcs"]
                               if x.startswith("test"))
                      total = total + nt
                      out("- **" + f.name + "**: " + str(nt)
                          + " tests (" + d["state"] + ")")
                  out("- **TOTAL tests SEMILLA: "
                      + str(total) + "**")
              else:
                  out("- NO EXISTE tests/")

              out("## 6. Server y rutas")
              sv = None
              if (SX / "server.py").exists():
                  sv = SX / "server.py"
              else:
                  hits = sorted(SX.rglob("server.py"))
                  sv = hits[0] if hits else None
              if sv is not None:
                  txt = sv.read_text(encoding="utf-8",
                                     errors="replace")
                  rutas = sorted(set(re.findall(
                      r'[\'"](/[\w\-/\{\}\.:]+)[\'"]', txt)))
                  out("- server: **" + str(sv) + "** — "
                      + str(len(rutas)) + " rutas")
                  for r in rutas[:40]:
                      out("    - " + r)
              else:
                  out("- SIN server.py")

              out("## 7. Conexiones a shared_engines y Red")
              uso = {}
              for f in sorted(SX.rglob("*.py")):
                  d = info_py(f)
                  if d["state"] != "code":
                      continue
                  for imp in d["imports"]:
                      if imp.startswith("shared_engines"):
                          partes = imp.replace("/", ".").split(".")
                          clave = (partes[0] + "." + partes[1]
                                   if len(partes) >= 2 else imp)
                          uso.setdefault(clave, set()).add(
                              d["path"])
              if uso:
                  for k in sorted(uso):
                      out("- **" + k + "** <- "
                          + str(len(uso[k])) + " archivos")
              else:
                  out("- SIN imports directos a shared_engines")
              for pat in ("network_client", "nexo_link",
                          "semilla_link", "caps", "bridge"):
                  count = 0
                  for f in sorted(SX.rglob("*.py")):
                      try:
                          if (pat in f.read_text(
                                  encoding="utf-8",
                                  errors="replace")):
                              count = count + 1
                      except Exception:
                          continue
                  out("- patron **" + pat + "**: " + str(count)
                      + " archivos")

              out("## 8. Eventos SEMILLA_*")
              evs = set()
              for f in sorted(SX.rglob("*.py")):
                  try:
                      txt = f.read_text(encoding="utf-8",
                                        errors="replace")
                  except Exception:
                      continue
                  for m in re.findall(r"SEMILLA_[A-Z_]+", txt):
                      evs.add(m)
              out("- eventos: " + str(len(evs)))
              for e in sorted(evs)[:30]:
                  out("    - " + e)

              out("## 9. Conclusion numerica")
              vacios_total = 0
              llenos_total = 0
              for f in sorted(SX.rglob("*.py")):
                  d = info_py(f)
                  if d["state"] == "empty":
                      vacios_total = vacios_total + 1
                  elif d["state"] == "code":
                      llenos_total = llenos_total + 1
              out("- archivos con codigo: "
                  + str(llenos_total) + " | vacios: "
                  + str(vacios_total))
              out("- auditoria SOLO LECTURA: 0 escritos, 0 commits")
          out("")
          out("--- FIN AUDITORIA SEMILLA ---")
          PYEOF
          echo "AUDITORIA COMPLETA (solo lectura)"
          exit 0
