            echo "Sin cambios: el nucleo REV F v17 ya estaba aplicado"
            echo "Sin cambios: el nucleo REV F v17 ya estaba aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "ZYRA REV F v17: la clave ya no se pierde (descubrimiento dinamico de campos, respaldo en sesion con repuesta automatica, sondeo anti-autorrelleno), envio protegido por fetch desde el primer intento (el rebote no recarga ni borra la clave) y pantalla de exito TU ZID FUE CREADO con el codigo de ZID"
