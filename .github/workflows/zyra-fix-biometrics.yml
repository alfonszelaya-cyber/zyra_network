name: "RED-1 paso 3: espia _send_json (traceback real del 500) + wiring serve_combined vs conftest del test"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "1. Dump: serve_combined + prefijos + handler de internal_error + conftest del test que SI funciona"
        run: |
          python3 - <<'DMPEOF'
          import inspect
          from pathlib import Path
          from shared_engines.runtime.combined_api import (
              serve_combined)
          print("=== serve_combined (codigo real) ===")
          print(inspect.getsource(serve_combined))
          p = Path(
              "shared_engines/runtime/combined_api.py")
          lines = p.read_text(
              encoding="utf-8").splitlines()
          print("=== combined_api.py lineas 40-115 (sets de prefijos + _route_get/_route_post) ===")
          for n in range(39, min(115, len(lines))):
              print(str(n + 1).rjust(5) + ": "
                    + lines[n])
          a = Path("shared_engines/runtime/api.py")
          alines = a.read_text(
              encoding="utf-8").splitlines()
          print()
          print("=== api.py: bloque que produce internal_error ===")
          for i, l in enumerate(alines, 1):
              if "internal_error" in l:
                  for n in range(max(0, i - 6),
                                 min(len(alines),
                                     i + 3)):
                      print(str(n + 1).rjust(5)
                            + ": " + alines[n])
                  print("---")
          c = Path(
              "shared_engines/runtime/tests/conftest.py")
          print()
          print("=== conftest del runtime (harness que SI pasa) ===")
          if c.exists():
              print(c.read_text(encoding="utf-8"))
          else:
              print("NO EXISTE conftest.py en runtime/tests")
          t = Path(
              "shared_engines/runtime/tests/test_capabilities_api.py")
          if t.exists():
              tl = t.read_text(
                  encoding="utf-8").splitlines()
              print()
              print("=== test_capabilities_api.py 180-240 (el test de /history que pasa) ===")
              for n in range(179,
                             min(240, len(tl))):
                  print(str(n + 1).rjust(5) + ": "
                        + tl[n])
          DMPEOF

      - name: "2. ESPÍA: traceback real del 500 + estado de los attrs de clase tras serve_combined"
        run: |
          python3 - <<'SPYEOF'
          import base64, json, threading, time
          import traceback
          import urllib.error, urllib.request
          from shared_engines.storage.database import (
              SQLiteAdapter)
          from shared_engines.common.clocks import (
              FrozenClock)
          from shared_engines.runtime.config import (
              RuntimeConfig)
          from shared_engines.runtime.kernel import (
              ZyraKernel)
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities)
          from shared_engines.runtime.combined_api import (
              serve_combined)
          from shared_engines.verification.signatures import (
              Ed25519Signer)
          from shared_engines.security.biometrics import (
              BiometricsEngine, BiometricsPolicy,
              DeterministicTestProvider, TemplateCipher)
          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=net_db, clock=FrozenClock(),
              signer=signer,
              config=RuntimeConfig(
                  host="127.0.0.1", port=0,
                  api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=net_db, clock=FrozenClock(),
              audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(
                  master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(
              net_db, FrozenClock(),
              identity=kernel.identity,
              signer=signer)
          srv = serve_combined(
              kernel, caps,
              host="127.0.0.1", port=0)
          cls = srv.RequestHandlerClass
          print("HANDLER CLASS: "
                + cls.__module__ + "."
                + cls.__name__)
          print("MRO: "
                + " -> ".join(
                    c.__name__
                    for c in cls.__mro__))
          print()
          print("=== attrs de clase relevantes tras serve_combined ===")
          for c in cls.__mro__:
              for k, v in sorted(
                  vars(c).items()):
                  if k.startswith("__"):
                      continue
                  if k in ("kernel", "caps",
                           "capabilities",
                           "store", "db"):
                      print(c.__name__ + "."
                            + k + " = "
                            + repr(v)[:80])
          print()
          print("=== instalando espia en _send_json ===")
          resuelto = cls._send_json
          marcador = {"instalado": False}

          def espia(self, status, payload,
                    *a, **kw):
              if status >= 500:
                  print(">>> ESPÍA: respuesta "
                        + str(status)
                        + "; excepcion en curso:")
                  traceback.print_exc()
              return resuelto(self, status,
                  payload, *a, **kw)

          if not marcador["instalado"]:
              cls._send_json = espia
              marcador["instalado"] = True
              print("espia instalado en "
                    + cls.__name__)

          threading.Thread(
              target=srv.serve_forever,
              daemon=True).start()
          time.sleep(0.4)
          base = ("http://127.0.0.1:"
              + str(srv.server_address[1]))
          req = urllib.request.Request(
              base + "/identity/enroll",
              data=json.dumps({
                  "kind": "person",
                  "display_name": "Spy User",
                  "actor": "audit",
                  "doc_image_b64": base64.b64encode(
                      b"spy-history-user"
                      ).decode("ascii"),
                  "selfie_image_b64": base64.b64encode(
                      b"spy-history-user"
                      ).decode("ascii"),
              }).encode(),
              method="POST",
              headers={"Content-Type":
                  "application/json"})
          with urllib.request.urlopen(
              req, timeout=15) as r:
              body = json.loads(r.read().decode())
          zid = ((body.get("data") or {}).get(
              "identity") or {}).get("zid")
          print("ZID=" + str(zid))
          print()
          print("### GET /history/" + str(zid)
                + " (el espia imprimira el traceback real si 500)")
          try:
              with urllib.request.urlopen(
                  base + "/history/" + str(zid),
                  timeout=15) as r:
                  print("STATUS=" + str(r.status))
                  print(r.read().decode(
                      "utf-8", "replace")[:300])
          except urllib.error.HTTPError as e:
              print("STATUS=" + str(e.code))
              print(e.read().decode(
                  "utf-8", "replace")[:300])
          print()
          print("FIN SPY - el traceback de arriba"
                " es la causa exacta del 500")
          SPYEOF

      - name: "Contexto"
        run: |
          git log --oneline -3
