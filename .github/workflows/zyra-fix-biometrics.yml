name: "ZYRA VIVA-2: conectores vivos + sources/sweep + FX 5 fuentes"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Wiring VIVA-2 (4 parches)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, re, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def fix(nombre, fn):
              try:
                  out("- **" + nombre + ": " + fn() + "**")
              except Exception:
                  out("- **" + nombre + ": ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          def fa():
              p = pathlib.Path("shared_engines/runtime/capabilities.py")
              src = p.read_text(encoding="utf-8")
              if "VIVA-2-INTEGRATIONS" in src:
                  return "YA"
              ancla = "        )  # VIVA-1-BRIDGE"
              if ancla not in src:
                  raise RuntimeError("ancla VIVA-1-BRIDGE no hallada")
              extra = (
                  "\n        from shared_engines.integrations.engine import (  # VIVA-2-INTEGRATIONS\n"
                  "            IntegrationsEngine,\n"
                  "            PublicSourceClient,\n"
                  "            SourceIndex,\n"
                  "        )\n"
                  "        self.integrations = IntegrationsEngine(\n"
                  "            db, clock)\n"
                  "        self.integrations.register_adapter(\n"
                  "            adapter_id=\"onec-classifiers\",\n"
                  "            kind=\"http\",\n"
                  "            endpoint=(\n"
                  "                \"https://onec.bcr.gob.sv\"\n"
                  "                \"/clasificadoresv2.api\"),\n"
                  "            max_retries=2)\n"
                  "        self.integrations.register_adapter(\n"
                  "            adapter_id=\"marn-geo\",\n"
                  "            kind=\"http-geo\",\n"
                  "            endpoint=(\n"
                  "                \"https://geoportal.marn.gob.sv\"\n"
                  "                \"/server/rest/services\"),\n"
                  "            max_retries=2)\n"
                  "        self._source_client = PublicSourceClient(\n"
                  "            clock=clock, ttl_seconds=900.0)\n"
                  "        self._source_index = SourceIndex(\n"
                  "            db, clock)  # VIVA-2-INTEGRATIONS"
              )
              src = src.replace(ancla, ancla + extra, 1)
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK(2 adapters + client + index)"

          def fb():
              p = pathlib.Path("shared_engines/runtime/capabilities_api.py")
              src = p.read_text(encoding="utf-8")
              if "VIVA-2-SOURCES" in src:
                  return "YA"
              src, n = re.subn(
                  r'(CAPS_POST_PREFIXES = frozenset\(\s*\{)',
                  r'\1  # VIVA-2-SOURCES\n        "sources",',
                  src)
              if n == 0:
                  raise RuntimeError("CAPS_POST_PREFIXES no hallado")
              EXTRA = (


                  '\n\n_VIVA2_ORIG_ROUTE_POST = ('
                  '\n    CapabilitiesApiHandler._route_post)'
                  '\n\n'
                  '\ndef _viva2_route_post(self, s):'
                  '\n    if (len(s) == 2 and s[0] == "sources"'
                  '\n            and s[1] == "sweep"):'
                  '\n        doc = self._read_json()'
                  '\n        source = str(doc.get('
                  '\n            "source", "onec"))'
                  '\n        max_layers = int('
                  '\n            doc.get("max_layers", 5))'
                  '\n        caps = type(self).caps'
                  '\n        try:'
                  '\n            if source == "marn":'
                  '\n                from shared_engines.integrations.engine import ('
                  '\n                    sweep_marn)'
                  '\n                r = sweep_marn('
                  '\n                    caps._source_client,'
                  '\n                    caps._source_index,'
                  '\n                    max_layers_per_service=max_layers,'
                  '\n                    pause_seconds=0.0)'
                  '\n            else:'
                  '\n                from shared_engines.integrations.engine import ('
                  '\n                    sweep_onec)'
                  '\n                r = sweep_onec('
                  '\n                    caps._source_client,'
                  '\n                    caps._source_index)'
                  '\n            self._send(200, {'
                  '\n                "ok": True, "data": r})'
                  '\n        except Exception as exc:'
                  '\n            self._send(502, {'
                  '\n                "ok": False,'
                  '\n                "error": {'
                  '\n                    "type": "source_unavailable",'
                  '\n                    "message": ('
                  '\n                        type(exc).__name__'
                  '\n                        + ": " + str(exc)[:100])}})'
                  '\n        return'
                  '\n    return _VIVA2_ORIG_ROUTE_POST(self, s)'
                  '\n\n'
                  '\nCapabilitiesApiHandler._route_post = ('
                  '\n    _viva2_route_post)  # VIVA-2-SOURCES'
              )
              if not src.endswith("\n"):
                  src += "\n"
              src = src + EXTRA
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK(ruta + prefijo, " + str(n) + ")"

          def fc():
              p = pathlib.Path("shared_engines/currency/rates.py")
              src = p.read_text(encoding="utf-8")
              if "class FrankfurterRateProvider" in src:
                  return "YA"
              EXTRA = (


                  '\n\n'
                  '\nclass FrankfurterRateProvider(RateProvider):'
                  '\n    """VIVA-2: fiat oficial del BCE, sin key."""'
                  '\n'
                  '\n    name = "frankfurter"'
                  '\n'
                  '\n    def __init__(self, *, ttl_seconds: float = 1800.0,'
                  '\n                 timeout_seconds: float = 10.0) -> None:'
                  '\n        self._ttl = ttl_seconds'
                  '\n        self._timeout = timeout_seconds'
                  '\n'
                  '\n    def fetch(self, pair: CurrencyPair, clock: Clock) -> Quote:'
                  '\n        import json as _json'
                  '\n        import urllib.request as _ur'
                  '\n        base = pair.base.upper()'
                  '\n        q = pair.quote.upper()'
                  '\n        url = ("https://api.frankfurter.dev/v1/latest"'
                  '\n               "?base=" + base + "&symbols=" + q)'
                  '\n        try:'
                  '\n            req = _ur.Request(url, headers={'
                  '\n                "User-Agent": "zyra-network"})'
                  '\n            with _ur.urlopen(req, timeout=self._timeout) as r:'
                  '\n                data = _json.loads(r.read().decode("utf-8"))'
                  '\n            raw = data["rates"][q]'
                  '\n        except RateUnavailableError:'
                  '\n            raise'
                  '\n        except Exception as exc:'
                  '\n            raise RateUnavailableError('
                  '\n                "frankfurter fetch failed: "'
                  '\n                + type(exc).__name__) from exc'
                  '\n        rate = Decimal(str(raw))'
                  '\n        if not rate.is_finite() or rate <= 0:'
                  '\n            raise RateUnavailableError('
                  '\n                "frankfurter rate invalid")'
                  '\n        now = clock.now()'
                  '\n        return Quote(pair=pair, rate=rate, quoted_at=now,'
                  '\n                     expires_at=now + self._ttl,'
                  '\n                     source=self.name)'
                  '\n\n\n'
                  'class KrakenRateProvider(RateProvider):'
                  '\n    """VIVA-2: cripto publico sin key (fallback BTC/ETH)."""'
                  '\n'
                  '\n    name = "kraken"'
                  '\n'
                  '\n    _KRAKEN_PAIRS = {'
                  '\n        ("BTC", "USD"): "XXBTZUSD",'
                  '\n        ("ETH", "USD"): "XETHZUSD",'
                  '\n    }'
                  '\n'
                  '\n    def __init__(self, *, ttl_seconds: float = 600.0,'
                  '\n                 timeout_seconds: float = 10.0) -> None:'
                  '\n        self._ttl = ttl_seconds'
                  '\n        self._timeout = timeout_seconds'
                  '\n'
                  '\n    def fetch(self, pair: CurrencyPair, clock: Clock) -> Quote:'
                  '\n        import json as _json'
                  '\n        import urllib.request as _ur'
                  '\n        pk = self._KRAKEN_PAIRS.get(('
                  '\n            pair.base.upper(),'
                  '\n            pair.quote.upper()))'
                  '\n        if pk is None:'
                  '\n            raise RateUnavailableError('
                  '\n                "kraken pair not mapped: "'
                  '\n                + pair.normalized)'
                  '\n        url = ("https://api.kraken.com/0/public"'
                  '\n               "/Ticker?pair=" + pk)'
                  '\n        try:'
                  '\n            req = _ur.Request(url, headers={'
                  '\n                "User-Agent": "zyra-network"})'
                  '\n            with _ur.urlopen(req, timeout=self._timeout) as r:'
                  '\n                data = _json.loads(r.read().decode("utf-8"))'
                  '\n            raw = data["result"][pk]["c"][0]'
                  '\n        except RateUnavailableError:'
                  '\n            raise'
                  '\n        except Exception as exc:'
                  '\n            raise RateUnavailableError('
                  '\n                "kraken fetch failed: "'
                  '\n                + type(exc).__name__) from exc'
                  '\n        rate = Decimal(str(raw))'
                  '\n        if not rate.is_finite() or rate <= 0:'
                  '\n            raise RateUnavailableError('
                  '\n                "kraken rate invalid")'
                  '\n        now = clock.now()'
                  '\n        return Quote(pair=pair, rate=rate, quoted_at=now,'
                  '\n                     expires_at=now + self._ttl,'
                  '\n                     source=self.name)'
              )
              if not src.endswith("\n"):
                  src += "\n"
              src = src + EXTRA
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"

          def fd():
              p = pathlib.Path("shared_engines/runtime/kernel.py")
              src = p.read_text(encoding="utf-8")
              if "VIVA-2-FX-5" in src:
                  return "YA"
              ancla = "                    ChainlinkOracleProvider(),\n"
              if ancla not in src:
                  raise RuntimeError("ancla chainlink no hallada")
              src = src.replace(ancla,
                  "                    ChainlinkOracleProvider(),\n"
                  "                    FrankfurterRateProvider(),\n"
                  "                    KrakenRateProvider(),  # VIVA-2-FX-5\n", 1)
              src = src.replace(
                  "    ChainlinkOracleProvider,\n)  # VIVA-1-FX-LIVE",
                  "    ChainlinkOracleProvider,\n"
                  "    FrankfurterRateProvider,\n"
                  "    KrakenRateProvider,\n"
                  ")  # VIVA-1-FX-LIVE", 1)
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK(cadena 5 fuentes con ZYRA_FX_LIVE=1)"

          def fe():
              TEST = (


                  '"""VIVA-2: conectores vivos + sweep + FX 5 fuentes."""'
                  '\nfrom __future__ import annotations'
                  '\n'
                  '\nimport json'
                  '\nimport threading'
                  '\nimport time'
                  '\nimport urllib.request'
                  '\n'
                  '\nimport pytest'
                  '\n'
                  '\nfrom shared_engines.common.clocks import FrozenClock'
                  '\nfrom shared_engines.currency.contracts import CurrencyPair'
                  '\nfrom shared_engines.currency.rates import ('
                  '\n    FrankfurterRateProvider, KrakenRateProvider)'
                  '\nfrom shared_engines.runtime.config import RuntimeConfig'
                  '\nfrom shared_engines.runtime.kernel import ZyraKernel'
                  '\nfrom shared_engines.runtime.capabilities import ZyraCapabilities'
                  '\nfrom shared_engines.runtime.combined_api import serve_combined'
                  '\nfrom shared_engines.storage.database import SQLiteAdapter'
                  '\nfrom shared_engines.verification.signatures import Ed25519Signer'
                  '\n'
                  '\n'
                  'class _R:'
                  '\n    def __init__(self, p):'
                  '\n        self._p = p'
                  '\n'
                  '    def __enter__(self):'
                  '\n        return self'
                  '\n'
                  '    def __exit__(self, *a):'
                  '\n        return False'
                  '\n'
                  '    def read(self):'
                  '\n        return self._p'
                  '\n'
                  '\n'
                  'def _stack(tmp_path):'
                  '\n    db = SQLiteAdapter(tmp_path / "v2.db")'
                  '\n    s, _ = Ed25519Signer.generate()'
                  '\n    k = ZyraKernel('
                  '\n        db=db, clock=FrozenClock(), signer=s,'
                  '\n        config=RuntimeConfig('
                  '\n            host="127.0.0.1", port=0,'
                  '\n            api_token=None))'
                  '\n    k.bootstrap_root()'
                  '\n    caps = ZyraCapabilities('
                  '\n        db, FrozenClock(),'
                  '\n        identity=k.identity, signer=s)'
                  '\n    return k, caps, db'
                  '\n'
                  '\n'
                  'def test_integrations_wired(tmp_path) -> None:'
                  '\n    k, caps, db = _stack(tmp_path)'
                  '\n    h = caps.integrations.health('
                  '\n        adapter_id="onec-classifiers")'
                  '\n    assert "onec" in h.endpoint, str(h)'
                  '\n    h2 = caps.integrations.health('
                  '\n        adapter_id="marn-geo")'
                  '\n    assert "marn" in h2.endpoint, str(h2)'
                  '\n    assert caps._source_client is not None'
                  '\n    print("OK VIVA-2: integrations cableado con ONEC+MARN")'
                  '\n'
                  '\n'
                  'def test_frankfurter_parse(tmp_path, monkeypatch) -> None:'
                  '\n    payload = json.dumps({'
                  '\n        "amount": 1.0, "base": "USD",'
                  '\n        "rates": {"EUR": 0.89087}}).encode()'
                  '\n'
                  '    def fake(req, timeout=None):'
                  '\n        return _R(payload)'
                  '\n'
                  '    monkeypatch.setattr('
                  '\n        "urllib.request.urlopen", fake)'
                  '\n    q = FrankfurterRateProvider().fetch('
                  '\n        CurrencyPair("USD", "EUR"), FrozenClock())'
                  '\n    assert q.rate == __import__("decimal"'
                  '\n                                  ).Decimal("0.89087")'
                  '\n    assert q.source == "frankfurter"'
                  '\n    print("OK VIVA-2: frankfurter parsea 0.89087")'
                  '\n'
                  '\n'
                  'def test_kraken_parse(tmp_path, monkeypatch) -> None:'
                  '\n    payload = json.dumps({'
                  '\n        "result": {"XXBTZUSD": {'
                  '\n            "c": ["84749.20000", "1.0"]}}}).encode()'
                  '\n'
                  '    def fake(req, timeout=None):'
                  '\n        return _R(payload)'
                  '\n'
                  '    monkeypatch.setattr('
                  '\n        "urllib.request.urlopen", fake)'
                  '\n    q = KrakenRateProvider().fetch('
                  '\n        CurrencyPair("BTC", "USD"), FrozenClock())'
                  '\n    assert q.rate == __import__("decimal"'
                  '\n                                  ).Decimal("84749.20000")'
                  '\n    assert q.source == "kraken"'
                  '\n    print("OK VIVA-2: kraken parsea BTC 84749.20")'
                  '\n'
                  '\n'
                  'def test_sources_sweep_route(tmp_path, monkeypatch) -> None:'
                  '\n    k, caps, db = _stack(tmp_path)'
                  '\n'
                  '    def fake_urlopen(req, timeout=None):'
                  '\n        url = req.full_url'
                  '\n        if "onec.bcr.gob.sv" in url:'
                  '\n            return _R(b\'[{"codigo": "0111101"}]\')'
                  '\n        if url.endswith("?f=json"):'
                  '\n            return _R(b\'{"layers":'
                  '\n                      \' b\'[{"id": 0},{"id": 1}]}\')'
                  '\n        if "/query" in url:'
                  '\n            return _R(b\'{"type": "FeatureCollection",'
                  '\n                      \' b\'"features": [{}, {}]}\')'
                  '\n        raise OSError("no simulada")'
                  '\n'
                  '    monkeypatch.setattr('
                  '\n        "urllib.request.urlopen", fake_urlopen)'
                  '\n    srv = serve_combined('
                  '\n        k, caps, host="127.0.0.1", port=0)'
                  '\n    threading.Thread('
                  '\n        target=srv.serve_forever,'
                  '\n        daemon=True).start()'
                  '\n    time.sleep(0.4)'
                  '\n    base = ("http://127.0.0.1:"'
                  '\n            + str(srv.server_address[1]))'
                  '\n    req = urllib.request.Request('
                  '\n        base + "/sources/sweep",'
                  '\n        data=json.dumps('
                  '\n            {"source": "onec"}).encode(),'
                  '\n        method="POST",'
                  '\n        headers={"Content-Type":'
                  '\n                 "application/json"})'
                  '\n    with urllib.request.urlopen(req, timeout=30) as r:'
                  '\n        d = json.loads(r.read().decode())'
                  '\n    assert d["data"]["ok"] == 7, str(d)[:200]'
                  '\n    print("OK VIVA-2: /sources/sweep onec 7/7 via HTTP")'
                  '\n    srv.shutdown()'
                  '\n    srv.server_close()'
              )
              p = pathlib.Path("shared_engines/runtime/tests/test_viva2.py")
              ast.parse(TEST)
              p.write_text(TEST, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"

          fix("FIX-A integrations cableado", fa)
          fix("FIX-B ruta sources/sweep", fb)
          fix("FIX-C Frankfurter+Kraken providers", fc)
          fix("FIX-D kernel cadena 5 fuentes", fd)
          fix("FIX-E tests viva2", fe)
          exit(0)
          EOF

      - name: "W1: tests viva2"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 180 python3 -m pytest shared_engines/runtime/tests/test_viva2.py -vv --tb=long --timeout=60 --timeout-method=thread > /tmp/w1.out 2>&1
          echo $? > /tmp/w1
          if [ "$(cat /tmp/w1)" = "0" ]; then echo "- W1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- W1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### W1 detalle"; echo '```'; tail -80 /tmp/w1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "W2: regresion shared_engines completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/w2.out 2>&1
          echo $? > /tmp/w2
          if [ "$(cat /tmp/w2)" = "0" ]; then echo "- W2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- W2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### W2 detalle"; echo '```'; tail -60 /tmp/w2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "W3: apps intactas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/nexo/tests apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/w3.out 2>&1
          echo $? > /tmp/w3
          if [ "$(cat /tmp/w3)" = "0" ]; then echo "- W3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- W3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### W3 detalle"; echo '```'; tail -40 /tmp/w3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in w1 w2 w3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: W1-W3 VERDES — CONECTORES VIVOS**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(VIVA-2): IntegrationsEngine cableado (ONEC 7 clasificadores + MARN 9 servicios), ruta POST /sources/sweep, Frankfurter+Kraken como fuentes 4/5 de la cadena FX (W1-W3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — VIVA-2 CERRADO. Sigue VIVA-3 (seguridad).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2) — VIVA-2 CERRADO.**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
