#
# Core content (same as v7, byte for byte):
#  - OPEN CAMERA leaves the camera image in view (video box visible).
#  - GREEN LINE framing the photo (corners + box) in steps 2, 3 and 4.
#  - Nothing else changed: step 1, OCR, MRZ, biometrics, PIN, and step-back.
#
# NEW IN v8: if the file arrives with ONE damaged character (pasted/edited),
#  the run REPAIRS IT AUTOMATICALLY by verifying with SHA and publishes anyway. If the damage were
#  bigger, it fails with the exact reason and DOES NOT publish anything (all-or-nothing rule).
#
# HOW TO USE IT (important):
#  1) On GitHub: Add file > Upload files and upload THIS file as is to .github/workflows/
#     (replaces the current one). Pasting it into the editor also works: it withstands pasting.
#  2) Actions > ZYRA fix biometricos REV E > Run workflow.
#  3) Green = published (Render deploys in 1-2 min).

