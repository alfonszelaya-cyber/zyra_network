name: "RED-4 paso 1: auditoria integraciones + fuentes externas (SOLO LECTURA) - donde se enchufan los conectores publicos"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: IntegrationsEngine completo (el punto de enchufe de fuentes externas)"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          p = Path(
              "shared_engines/integrations/"
              "engine.py")
          print("=== integrations/engine.py ===")
          if p.exists():
              for i, l in enumerate(
                  p.read_text(
                      encoding="utf-8").splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          else:
              print("NO EXISTE; busco:")
              for f in Path(
                  "shared_engines/integrations"
              ).rglob("*.py"):
                  if f.stat().st_size > 0:
                      print("  " + str(f))
          D1EOF

      - name: "Dump 2: publico de IntegrationsEngine + su test (como se registra/invoca un adapter)"
        run: |
          python3 - <<'D2EOF'
          import inspect
          from pathlib import Path
          try:
              from shared_engines.integrations import (
                  engine as ie)
              print("=== integrations publico ===")
              for n in sorted(
                  a for a in dir(ie)
                  if not a.startswith("_")):
                  o = getattr(ie, n)
                  if inspect.isclass(o):
                      print(n, "(clase)")
                      for mn, mv in sorted(
                          vars(o).items()):
                          if (mn.startswith("__")
                              or not callable(mv)):
                              continue
                          if inspect.isfunction(mv):
                              try:
                                  print("  ."
                                      + mn
                                      + str(
                                          inspect.signature(
                                              mv))[:150])
                              except Exception:
                                  print("  ." + mn)
          except Exception as e:
              print("import fallo:", e)
          t = Path(
              "shared_engines/integrations/tests/"
              "test_integrations.py")
          print()
          print("=== test_integrations.py (existe?) ===")
          if t.exists():
              txt = t.read_text(encoding="utf-8")
              print("SI (" + str(len(
                  txt.splitlines())) + " lineas)")
              for i, l in enumerate(
                  txt.splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          else:
              print("NO EXISTE")
          D2EOF

      - name: "Dump 3: clientes HTTP reutilizables en la Red (urllib/requests usage en shared_engines)"
        run: |
          python3 - <<'D3EOF'
          from pathlib import Path
          print("=== uso de urllib/requests/http en shared_engines (clientes existentes) ===")
          for f in sorted(Path("shared_engines").rglob("*.py")):
              if "/tests/" in str(f):
                  continue
              try:
                  txt = f.read_text(encoding="utf-8")
              except Exception:
                  continue
              hits = []
              for i, l in enumerate(txt.splitlines(), 1):
                  if ("import urllib" in l
                      or "import requests" in l
                      or "urlopen" in l
                      or "http.client" in l):
                      hits.append((i, l.strip()))
              if hits:
                  print()
                  print("-- " + str(f))
                  for i, l in hits[:8]:
                      print("  " + str(i).rjust(5)
                            + ": " + l[:110])
          D3EOF

      - name: "Dump 4: currency/rates.py completo (el patron de proveedor de fuente externa mas cercano ya construido)"
        run: |
          python3 - <<'D4EOF'
          from pathlib import Path
          p = Path(
              "shared_engines/currency/rates.py")
          print("=== currency/rates.py ===")
          if p.exists():
              for i, l in enumerate(
                  p.read_text(
                      encoding="utf-8").splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          else:
              print("NO EXISTE; busco rates:")
              for f in Path(
                  "shared_engines/currency"
              ).rglob("*.py"):
                  print("  " + str(f))
          D4EOF

      - name: "Dump 5: rutas HTTP caps existentes (donde colgarian los endpoints de fuentes) + inventario Apps del dueño para el mapa de conectores"
        run: |
          python3 - <<'D5EOF'
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/"
              "capabilities_api.py")
          lines = p.read_text(
              encoding="utf-8").splitlines()
          print("=== capabilities_api.py: if s == [ ... (todas las rutas POST existentes) ===")
          for i, l in enumerate(lines, 1):
              if 'if s == [' in l:
                  print(str(i).rjust(5)
                        + ": " + l.strip()[:110])
          D5EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
