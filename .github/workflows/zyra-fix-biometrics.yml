name: ZYRA AUDITORIA v2 - REPO COMPLETO (automatica en cada push) [LECTURA]

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (PASO QUE FALTABA)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Auditoria total del repositorio
        run: |
          python - <<'PY'
          import ast, hashlib, json, os, re, subprocess, sys, time
          from pathlib import Path
          from collections import defaultdict, Counter

          RAIZ = Path(".")
          EXCL = {".git", "__pycache__"}
          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          # ---------- CENSO ----------
          todos = [p for p in RAIZ.rglob("*") if p.is_file() and not (EXCL & set(p.parts))]
          pyc_all = [p for p in RAIZ.rglob("*") if p.is_file() and p.suffix == ".pyc"]
          pyc_dirs = [p for p in RAIZ.rglob("*") if p.is_dir() and p.name == "__pycache__"]
          py_files = [p for p in todos if p.suffix == ".py"]
          vacios_py = [p for p in py_files if p.stat().st_size <= 1]
          inits_vacios = [p for p in vacios_py if p.name == "__init__.py"]
          noinit_vacios = [p for p in vacios_py if p.name != "__init__.py"]
          carpetas = [p for p in RAIZ.rglob("*") if p.is_dir() and ".git" not in p.parts]
          carpetas_vacias = [c for c in carpetas
                             if not any(f.is_file() for f in c.rglob("*")) and c.name != "__pycache__"]
          ext_count = Counter(p.suffix or "(sin ext)" for p in todos)
          por_top = Counter(); bytes_top = Counter()
          for p in todos:
              top = p.parts[0] if len(p.parts) > 1 else "(raiz)"
              por_top[top] += 1
              try: bytes_top[top] += p.stat().st_size
              except Exception: pass

          # ---------- SINTAXIS ----------
          errores_sintaxis = []
          fuentes = {}
          for p in py_files:
              try:
                  t = p.read_text(encoding="utf-8", errors="replace")
              except Exception as e:
                  errores_sintaxis.append(f"{p}: lectura {e}"); continue
              fuentes[str(p)] = t
              try: ast.parse(t)
              except SyntaxError as e:
                  errores_sintaxis.append(f"{p}:{e.lineno} {e.msg}")

          # ---------- IMPORTS ROTOS (ignorando los protegidos con try/except) ----------
          mod_paths = set()
          for p in py_files:
              rel = p.relative_to(RAIZ).with_suffix("")
              partes = list(rel.parts)
              if partes[-1] == "__init__": partes = partes[:-1]
              if partes: mod_paths.add(".".join(partes))
          top_names = {m.split(".")[0] for m in mod_paths}
          stdlib = set(getattr(sys, "stdlib_module_names", set()))
          inst_cache = {}
          def top_existe(name):
              if name in top_names or name in stdlib: return True
              if name not in inst_cache:
                  try:
                      import importlib.util as _u
                      inst_cache[name] = _u.find_spec(name) is not None
                  except Exception:
                      inst_cache[name] = True
              return inst_cache[name]

          imports_rotos = []
          for ruta, t in fuentes.items():
              p = Path(ruta)
              try: arbol = ast.parse(t)
              except SyntaxError: continue
              # nodos protegidos por try/except ImportError
              protegidos = set()
              for n in ast.walk(arbol):
                  if isinstance(n, ast.Try):
                      nombres_exc = set()
                      for h in n.handlers:
                          ty = h.type
                          if isinstance(ty, ast.Name): nombres_exc.add(ty.id)
                          elif isinstance(ty, ast.Tuple):
                              for e in ty.elts:
                                  if isinstance(e, ast.Name): nombres_exc.add(e.id)
                          elif isinstance(ty, ast.Attribute): nombres_exc.add(ty.attr)
                      if nombres_exc & {"ImportError", "ModuleNotFoundError", "Exception", "BaseException"}:
                          for sub in ast.walk(n): protegidos.add(id(sub))
              paq_dir = p.parent
              for nodo in ast.walk(arbol):
                  if id(nodo) in protegidos: continue
                  if isinstance(nodo, ast.Import):
                      for a in nodo.names:
                          top = a.name.split(".")[0]
                          if top not in top_names and not top_existe(top):
                              imports_rotos.append(f"{ruta}: import {a.name}")
                  elif isinstance(nodo, ast.ImportFrom):
                      if nodo.level > 0:
                          base = paq_dir
                          for _ in range(nodo.level - 1): base = base.parent
                          obj = base / (nodo.module.replace(".", "/") if nodo.module else "")
                          ok = (obj.with_suffix(".py").is_file() or (obj / "__init__.py").is_file()
                                or obj.is_dir() or nodo.module is None)
                          if not ok:
                              imports_rotos.append(f"{ruta}: from {'.'*nodo.level}{nodo.module or ''}")
                      else:
                          top = (nodo.module or "").split(".")[0]
                          if nodo.module and top not in top_names and not top_existe(top):
                              imports_rotos.append(f"{ruta}: from {nodo.module}")
          imports_rotos = sorted(set(imports_rotos))

          # ---------- PRUEBAS ----------
          carpetas_tests = sorted({p.parent for p in py_files if p.parent.name == "tests"})
          resultados = []
          for c in carpetas_tests:
              t0 = time.time()
              try:
                  r = subprocess.run([sys.executable, "-m", "pytest", str(c), "-q", "--tb=short"],
                                     capture_output=True, text=True, timeout=900)
                  salida = (r.stdout or "") + (r.stderr or ""); code = r.returncode
              except subprocess.TimeoutExpired:
                  salida, code = "TIMEOUT", -1
              dur = time.time() - t0
              lineas = salida.splitlines()
              conteo = ""
              for l in reversed(lineas):
                  if any(x in l for x in ("passed", "failed", "error", "no tests ran")):
                      conteo = l.strip(); break
              resultados.append({"carpeta": str(c), "code": code, "duracion": round(dur, 1),
                                 "conteo": conteo,
                                 "fallos": [l for l in lineas if l.startswith(("FAILED", "ERROR"))][:60],
                                 "cola": "\n".join(lineas[-35:])})

          # ---------- DUPLICADOS ----------
          pat_ruta = re.compile(r'@\s*\w+\.(get|post|put|delete|patch|websocket)\s*\(\s*["\']([^"\']+)["\']')
          rutas = defaultdict(list)
          for ruta, t in fuentes.items():
              for i, l in enumerate(t.splitlines(), 1):
                  m = pat_ruta.search(l)
                  if m: rutas[(m.group(1).upper(), m.group(2))].append(f"{ruta}:{i}")
          rutas_dup = {k: v for k, v in rutas.items() if len(v) > 1}

          colisiones_mismo_archivo = []   # ERROR REAL
          consolidar = defaultdict(list)  # REVISION arquitectonica
          for ruta, t in fuentes.items():
              if ruta.endswith("__init__.py"): continue
              try: arbol = ast.parse(t)
              except SyntaxError: continue
              vistos_en_archivo = defaultdict(list)
              for nodo in arbol.body:
                  if isinstance(nodo, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      vistos_en_archivo[(type(nodo).__name__, nodo.name)].append(nodo.lineno)
                      es_test = Path(ruta).parent.name == "tests"
                      if not nodo.name.startswith("_") and not es_test:
                          consolidar[(type(nodo).__name__, nodo.name)].append(ruta)
              for (tipo, nom), lins in vistos_en_archivo.items():
                  if len(lins) > 1:
                      colisiones_mismo_archivo.append(f"{ruta}: {tipo} {nom} definido {len(lins)} veces (lineas {lins})")
          consolidar = {k: v for k, v in consolidar.items() if len(set(v)) > 1}

          hash_groups = defaultdict(list)
          for p in py_files:
              if p.stat().st_size <= 1: continue
              try: hash_groups[hashlib.sha256(p.read_bytes()).hexdigest()].append(str(p))
              except Exception: pass
          identicos = [v for v in hash_groups.values() if len(v) > 1]

          # ---------- SHIMS / MARKET / P2P / INVERSION ----------
          shims = []
          for p in py_files:
              t = fuentes.get(str(p), "")
              if not t or len(t.splitlines()) > 40: continue
              try: arbol = ast.parse(t)
              except SyntaxError: continue
              cuerpo = [n for n in arbol.body
                        if not (isinstance(n, ast.Expr) and isinstance(n.value, ast.Constant))]
              if cuerpo and all(isinstance(n, (ast.Import, ast.ImportFrom)) for n in cuerpo):
                  objs = [n.module for n in arbol.body if isinstance(n, ast.ImportFrom) and n.module]
                  ok = all(o in mod_paths or o.split(".")[0] in stdlib or top_existe(o.split(".")[0]) for o in objs)
                  shims.append({"archivo": str(p), "objetivos": objs, "ok": ok})

          market = Path("apps/agro/services/market_service.py")
          market_estado = {"existe": market.is_file(),
                           "bytes": market.stat().st_size if market.is_file() else 0}
          refs_market = []
          pm = re.compile(r'\bmarket_service\b')
          for ruta, t in fuentes.items():
              if ruta == str(market): continue
              for i, l in enumerate(t.splitlines(), 1):
                  if pm.search(l): refs_market.append(f"{ruta}:{i} {l.strip()[:120]}")

          p2p, inversion = set(), []
          for ruta, t in fuentes.items():
              for m in re.finditer(r'^\s*(?:from|import)\s+apps\.(\w+)', t, re.M):
                  partes = ruta.split("/")
                  if ruta.startswith("apps/") and len(partes) > 2 and partes[1] != m.group(1):
                      p2p.add(f"{ruta} -> apps.{m.group(1)}")
              if ruta.startswith("shared_engines/") and re.match(r'^\s*(?:from|import)\s+apps\.', t, re.M):
                  inversion.append(ruta)

          # ---------- VACIOS CLASIFICADOS ----------
          contenidos = {r: t for r, t in fuentes.items() if t}
          stems = sorted({p.stem for p in noinit_vacios}, key=len, reverse=True)
          refs = defaultdict(set)
          if stems:
              gran = re.compile(r'\b(' + "|".join(re.escape(s) for s in stems) + r')\b')
              for ruta, t in contenidos.items():
                  for m in gran.finditer(t): refs[m.group(1)].add(ruta)
          huerfanos, referenciados, pruebas_vacias = [], [], []
          ref_detalle = {}
          for p in noinit_vacios:
              es_test = p.parent.name == "tests" or p.name.startswith("test_")
              rs = {x for x in refs.get(p.stem, set()) if x != str(p)}
              dot = str(p.relative_to(RAIZ).with_suffix("")).replace("/", ".")
              rs |= {r for r, t in contenidos.items() if r != str(p) and dot in t}
              if es_test: pruebas_vacias.append(str(p))
              elif rs: referenciados.append(str(p)); ref_detalle[str(p)] = sorted(rs)[:8]
              else: huerfanos.append(str(p))

          # ---------- STUBS / TODOs ----------
          stubs, todos_mk = [], []
          for ruta, t in fuentes.items():
              try: arbol = ast.parse(t)
              except SyntaxError: continue
              for nodo in arbol.body:
                  if isinstance(nodo, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      cuerpo = list(nodo.body)
                      if cuerpo and isinstance(cuerpo[0], ast.Expr) and isinstance(cuerpo[0].value, ast.Constant):
                          cuerpo = cuerpo[1:]
                      if not cuerpo or (len(cuerpo) == 1 and isinstance(cuerpo[0], ast.Pass)) or \
                         (len(cuerpo) == 1 and isinstance(cuerpo[0], ast.Expr) and cuerpo[0].value is Ellipsis):
                          stubs.append(f"{ruta}:{nodo.lineno} {nodo.name}")
              for i, l in enumerate(t.splitlines(), 1):
                  if re.search(r'\b(TODO|FIXME|XXX|HACK)\b', l): todos_mk.append(f"{ruta}:{i}")

          # ---------- SALIDA ----------
          L = []; A = L.append
          A("# 🔬 AUDITORIA v2 — REPO COMPLETO (con dependencias instaladas) — LECTURA PURA\n")
          A("**Nada modificado ni borrado. Listas de borrado = PROPUESTA para aprobacion del dueno.**\n")

          A("## 1. CENSO\n")
          A(f"- Archivos de proyecto (sin .pyc): **{len(todos)}**")
          A(f"- Basura de distribucion: {len(pyc_all)} archivos .pyc en {len(pyc_dirs)} __pycache__ (excluir del ZIP — punto 7)")
          A(f"- .py: {len(py_files)} · vacios: {len(vacios_py)} ({len(inits_vacios)} __init__ normales + {len(noinit_vacios)} funcionales)")
          A(f"- Carpetas vacias: {len(carpetas_vacias)}\n")
          A("| Extension | Cantidad |"); A("|---|---|")
          for e, n in ext_count.most_common(12): A(f"| {e} | {n} |")
          A("")
          A("| Directorio | Archivos | KB |"); A("|---|---|---|")
          for top, n in por_top.most_common(): A(f"| {top} | {n} | {bytes_top[top]//1024} |")
          A("")

          A("## 2. ✅ LO QUE FUNCIONA (pruebas ejecutadas con dependencias reales)\n")
          A("| Carpeta | Estado | Conteo | Duracion |"); A("|---|---|---|---|")
          for r in resultados:
              e = "✅" if r["code"] == 0 else ("⏭ SIN TESTS" if r["code"] == 5 else "❌")
              A(f"| {r['carpeta']} | {e} | {r['conteo']} | {r['duracion']}s |")
          verdes = sum(1 for r in resultados if r["code"] == 0)
          A(f"\n**Suites verdes: {verdes}/{len(resultados)}**\n")

          A("## 3. ❌ LO QUE NO FUNCIONA\n")
          fallidos = [r for r in resultados if r["code"] not in (0, 5)]
          if not fallidos and not errores_sintaxis and not imports_rotos:
              A("(nada — todo verde y sin imports rotos reales)\n")
          else:
              for r in fallidos:
                  A(f"### ❌ {r['carpeta']} ({r['conteo']})\n")
                  if r["fallos"]:
                      A("```"); A("\n".join(r["fallos"])); A("```")
                  A("<details><summary>Salida</summary>\n```"); A(r["cola"]); A("```\n</details>\n")
              if errores_sintaxis:
                  A(f"### Errores de sintaxis ({len(errores_sintaxis)})\n```")
                  A("\n".join(errores_sintaxis)); A("```\n")
              if imports_rotos:
                  A(f"### Imports rotos REALES sin proteccion ({len(imports_rotos)})\n```")
                  A("\n".join(imports_rotos[:150])); A("```\n")
              if inversion:
                  A(f"### Inversion arquitectonica ({len(inversion)}) — shared_engines importa apps\n```")
                  A("\n".join(inversion)); A("```\n")

          A("## 4. 🔁 DUPLICADOS\n")
          A(f"### a) ERRORES REALES — mismo simbolo 2 veces en el mismo archivo: {len(colisiones_mismo_archivo)}\n```")
          A("\n".join(colisiones_mismo_archivo) if colisiones_mismo_archivo else "(ninguno)"); A("```\n")
          A(f"### b) Rutas HTTP duplicadas: {len(rutas_dup)}\n")
          for (met, path), sitios in sorted(rutas_dup.items()):
              A(f"- `{met} {path}` -> {', '.join(sitios)}")
          A(f"\n### c) CONSOLIDACION (mismo nombre publico en archivos distintos — revisar en punto 7): {len(consolidar)}\n")
          for (tipo, nom), sitios in sorted(consolidar.items())[:80]:
              A(f"- {tipo} `{nom}` en {len(set(sitios))} archivos")
          A(f"\n### d) Archivos .py IDENTICOS (grupos): {len(identicos)}\n```")
          A("\n".join(", ".join(g) for g in identicos[:50]) if identicos else "(ninguno)"); A("```\n")

          A("## 5. SHIMS de red\n")
          for s in shims:
              A(f"- `{s['archivo']}` -> {s['objetivos']} [{'OK' if s['ok'] else '❌ OBJETIVO ROTO'}]")
          if not shims: A("(ninguno)")
          A("")

          A("## 6. market_service.py (agro)\n")
          A(f"- existe: {market_estado['existe']} · bytes: {market_estado['bytes']} · referencias: {len(refs_market)}")
          for r in refs_market[:20]: A(f"  - {r}")
          A("")

          A("## 7. 🗑️ VACIOS FUNCIONALES CLASIFICADOS (base del punto 7 de la guia)\n")
          A(f"### HUERFANOS (0 referencias -> candidatos a borrar con tu aprobacion): {len(huerfanos)}\n```")
          A("\n".join(huerfanos) if huerfanos else "(ninguno)"); A("```")
          A(f"### REFERENCIADOS (NO borrar -> implementar): {len(referenciados)}\n")
          for v in referenciados[:100]:
              A(f"- `{v}` <- {', '.join(ref_detalle.get(v, [])[:4])}")
          A(f"\n### PRUEBAS VACIAS (reemplazar por reales): {len(pruebas_vacias)}\n```")
          A("\n".join(pruebas_vacias) if pruebas_vacias else "(ninguna)"); A("```")
          A(f"\n### Stubs: {len(stubs)} · TODO/FIXME: {len(todos_mk)}\n```")
          A("\n".join(stubs[:50]) if stubs else "(sin stubs)"); A("```\n")

          A("## 8. Conexiones punto a punto entre apps\n")
          A("\n".join(sorted(p2p)) if p2p else "(ninguna)")
          A("")
          A("## 9. 📋 PROPUESTA DE LIMPIEZA (PUNTO 7 de la guia — al final, con tu aprobacion)\n")
          A("| Categoria | Cantidad | Accion |"); A("|---|---|---|")
          A(f"| .pyc + __pycache__ | {len(pyc_all)} | Excluir del ZIP + .gitignore |")
          A(f"| Vacios huerfanos | {len(huerfanos)} | Borrar (aprobacion) |")
          A(f"| Archivos identicos | {len(identicos)} grupos | Consolidar 1, revisar imports |")
          A(f"| Simbolos a consolidar | {len(consolidar)} | Revision arquitectonica |")
          A(f"| Vacios referenciados | {len(referenciados)} | NO borrar — implementar |")
          A(f"| Pruebas vacias | {len(pruebas_vacias)} | Reemplazar por reales |")
          A("")

          md = "\n".join(L)
          Path("auditoria_repo_completo.md").write_text(md, encoding="utf-8")
          Path("auditoria_repo_completo.json").write_text(json.dumps({
              "censo": {"total": len(todos), "pyc": len(pyc_all), "py": len(py_files)},
              "sintaxis": errores_sintaxis, "imports_rotos": imports_rotos,
              "tests": resultados, "colisiones": colisiones_mismo_archivo,
              "rutas_dup": {f"{k[0]} {k[1]}": v for k, v in rutas_dup.items()},
              "consolidar": {f"{k[0]}|{k[1]}": v for k, v in consolidar.items()},
              "identicos": identicos, "shims": shims, "market": {"estado": market_estado, "refs": refs_market},
              "huerfanos": huerfanos, "referenciados": referenciados, "pruebas_vacias": pruebas_vacias,
              "stubs": stubs, "p2p": sorted(p2p), "inversion": inversion,
          }, indent=2, ensure_ascii=False), encoding="utf-8")

          if summary:
              s = md
              if len(s) > 900000: s = s[:900000] + "\n\n**(RECORTE — completo en el artefacto)**\n"
              with open(summary, "a") as fh: fh.write(s)
          print(f"OK: {len(todos)} archivos · verdes {verdes}/{len(resultados)} · rotos {len(imports_rotos)} · huerfanos {len(huerfanos)}")
          PY

      - name: Publicar reporte
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-repo-completo-v2
          path: |
            auditoria_repo_completo.md
            auditoria_repo_completo.json
