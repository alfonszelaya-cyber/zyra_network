name: "AGRO DIAG D: lectura de comercializacion (solo lectura)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump comercializacion (solo lectura)
        run: |
          python3 - <<'DUMPEOF'
          from pathlib import Path

          FILES = [
              "apps/agro/modules/comercializacion/compradores/buyer_service.py",
              "apps/agro/modules/comercializacion/empresas/company_commerce_service.py",
              "apps/agro/modules/comercializacion/oportunidades/opportunity_service.py",
              "apps/agro/modules/comercializacion/produccion_comercial/commercial_production_service.py",
              "apps/agro/modules/comercializacion/resultados/commercial_results.py",
              "apps/agro/modules/comercializacion/venta_simple/simple_sale_service.py",
              "apps/agro/modules/comercializacion/ventas/sales_service.py",
              "apps/agro/modules/comercializacion/mercado/market_service.py",
              "apps/agro/modules/comercializacion/exportacion/export_service.py",
              "apps/agro/modules/comercializacion/logistica/logistics_adapter.py",
              "apps/agro/services/market_service.py",
          ]
          for f in FILES:
              p = Path(f)
              print("")
              if not p.exists():
                  print("NO EXISTE:", f)
                  continue
              t = p.read_text(encoding="utf-8", errors="ignore")
              print("=" * 20, f, "(" + str(len(t.splitlines())) + " lineas)", "=" * 20)
              print(t)
          DUMPEOF
