# ============================================================
# ZYRA - INSPECTOR TOTAL (SOLO LECTURA)
# Lectura completa del repo + parte exacta del registro ZID.
# - NO modifica, NO commitea, NO pushea nada.
# - Deja TODO el diagnostico en el Resumen (Summary) del run.
# - Deja un artefacto con: report.md, inventario.txt,
#   nucleo_decodificado.js y copias de superapp.py.
# - Se ejecuta manualmente: Actions -> Run workflow.
# - Idempotente: se puede correr las veces que quieras.
# ============================================================
name: ZYRA inspector total (solo lectura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspector:
    name: Lectura completa repo + nucleo ZID
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspector (solo lectura)
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          # ============================================================
          # ZYRA - INSPECTOR TOTAL (SOLO LECTURA)
          # Lee TODO el repo y la parte exacta del registro ZID
          # (bloque marcado ZYRA-V6-BEGIN/END en superapp.py).
          # NO escribe, NO modifica, NO hace commit, NO hace push.
          # ============================================================
          import base64, hashlib, os, re, subprocess
          from datetime import datetime, timezone

          W = os.getcwd()
          OUT = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "zyra_inspector")
          os.makedirs(OUT, exist_ok=True)

          REV_D_SHA = os.environ.get(
              "ZYRA_REV_D_SHA",
              "18722285c2afd5e25c06041c407c99b4232237eff70d5c5c98a16f58100abc9d",
          )
          TOKENS = ["ps1", "ps2", "ps3", "ps4", "ps5",
                    "bAbrirF", "bCapF", "galF", "bAbrirA", "bCapA",
                    "bIr4", "bIr5", "tipoDoc", "clave2",
                    "docVencido", "bioRechazada", "nombreNoCoincide"]
          FUNCIONES = ["detectarLado", "simNombres", "mrzNombres", "nombreCoincide", "verificar"]

          S = []
          def md(l=""):
              S.append(l)

          def esc(s):
              return str(s).replace("|", "\\|").replace("`", "'").replace("\n", " ")

          def corto(sha, n=12):
              return sha[:n] if sha else "-"

          def git(*a):
              try:
                  return subprocess.check_output(["git"] + list(a), text=True,
                                                 stderr=subprocess.DEVNULL).strip()
              except Exception:
                  return "(no disponible)"

          def contar(texto, tok):
              try:
                  return len(re.findall(r"(?<![A-Za-z0-9_$])" + re.escape(tok) + r"(?![A-Za-z0-9_$])", texto))
              except Exception:
                  return 0

          def contar_i(texto, tok):
              try:
                  return len(re.findall(re.escape(tok), texto, re.I))
              except Exception:
                  return 0

          # ---------------- INVENTARIO COMPLETO ----------------
          inv = []
          for root, dirs, fnames in os.walk(W):
              dirs[:] = [d for d in dirs if d not in (".git", "node_modules", "__pycache__")]
              for f in fnames:
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p, W)
                  try:
                      sz = os.path.getsize(p)
                  except OSError:
                      sz = -1
                  inv.append((rel, sz))
          inv.sort()
          total_arch = len(inv)
          total_mb = sum(max(s, 0) for _, s in inv) / 1048576.0

          with open(os.path.join(OUT, "inventario.txt"), "w", encoding="utf-8") as f:
              for rel, sz in inv:
                  f.write("%10d  %s\n" % (sz, rel))

          copias = [rel for rel, _ in inv if os.path.basename(rel) == "superapp.py"]
          wflows = [rel for rel, _ in inv if rel.startswith(".github/workflows/")]
          grandes = sorted(inv, key=lambda x: -max(x[1], 0))[:10]

          # ---------------- ANALISIS DE CADA COPIA ----------------
          def analizar_copy(rel):
              d = {"ruta": rel, "error": None}
              try:
                  raw = open(os.path.join(W, rel), "rb").read()
              except Exception as e:
                  d["error"] = repr(e)
                  return d
              d["bytes"] = len(raw)
              d["sha256"] = hashlib.sha256(raw).hexdigest()
              txt = raw.decode("utf-8", "replace")
              d["chars"] = len(txt)
              lines = txt.splitlines()
              d["lineas"] = len(lines)
              d["begins"] = [i for i, l in enumerate(lines, 1) if "ZYRA-V6-BEGIN" in l]
              d["ends"] = [i for i, l in enumerate(lines, 1) if "ZYRA-V6-END" in l]

              bloques = []
              for m in re.finditer(r"<script>/\*ZYRA-V6-BEGIN\*/eval\(atob\('([A-Za-z0-9+/=]+)'\)\)/\*ZYRA-V6-END\*/</script>", txt):
                  bloques.append((m, True))
              if not bloques:
                  for m in re.finditer(r"eval\(atob\('([A-Za-z0-9+/=]+)'\)\)", txt):
                      bloques.append((m, False))
              d["bloques"] = []
              for m, fmt in bloques[:5]:
                  b64 = m.group(1)
                  b = {"b64_chars": len(b64), "linea": txt[:m.start()].count("\n") + 1,
                       "formato_exacto": fmt,
                       "sha256_b64": hashlib.sha256(b64.encode()).hexdigest()}
                  try:
                      js = base64.b64decode(b64 + "=" * (-len(b64) % 4)).decode("utf-8", "replace")
                      b["js_chars"] = len(js)
                      b["js_lineas"] = len(js.splitlines())
                      b["sha256_js"] = hashlib.sha256(js.encode("utf-8")).hexdigest()
                      b["js"] = js
                  except Exception as e:
                      b["error"] = repr(e)
                  d["bloques"].append(b)

              d["tokens"] = {t: contar(txt, t) for t in TOKENS}
              d["tokens_lineas"] = {}
              for t in TOKENS:
                  lns = [i for i, l in enumerate(lines, 1) if re.search(r"(?<![A-Za-z0-9_$])" + re.escape(t) + r"(?![A-Za-z0-9_$])", l)]
                  d["tokens_lineas"][t] = lns[:6]
              d["tesseract"] = contar_i(txt, "tesseract")
              d["faceapi"] = contar_i(txt, "faceapi")
              d["zid"] = contar(txt, "ZID")
              d["rutas"] = sorted(set(re.findall(r"/registro[A-Za-z0-9_/-]*", txt)))[:20]
              d["defs_registro"] = re.findall(r"def\s+(\w*registro\w*)\s*\(", txt, re.I)[:15]
              return d

          analisis = [analizar_copy(c) for c in copias]
          con_marcador = [a for a in analisis if a.get("bloques")]
          principal = con_marcador[0] if con_marcador else (max(analisis, key=lambda a: a.get("bytes", 0)) if analisis else None)

          # guardar nucleos y copias como evidencia (artefacto, fuera del repo)
          for i, b in enumerate((principal.get("bloques", []) if principal else []), 1):
              if "js" in b:
                  with open(os.path.join(OUT, "nucleo_%d.js" % i), "w", encoding="utf-8") as f:
                      f.write(b["js"])
          if con_marcador:
              b0 = con_marcador[0]["bloques"][0]
              if "js" in b0:
                  with open(os.path.join(OUT, "nucleo_decodificado.js"), "w", encoding="utf-8") as f:
                      f.write(b0["js"])
          for a in analisis:
              try:
                  raw = open(os.path.join(W, a["ruta"]), "rb").read()
                  nom = a["ruta"].replace("/", "__")
                  with open(os.path.join(OUT, "copia_" + nom), "wb") as f:
                      f.write(raw)
              except Exception:
                  pass

          # ---------------- REPORTE ----------------
          md("# ZYRA - INSPECTOR TOTAL (solo lectura)")
          md("")
          md("- Fecha UTC: `" + datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%SZ") + "`")
          md("- Commit HEAD: `" + git("rev-parse", "HEAD") + "`")
          md("- Rama: `" + git("rev-parse", "--abbrev-ref", "HEAD") + "`")
          md("- Este run NO modifica nada: sin commit, sin push, sin cambios en archivos.")
          md("")
          md("## 1) Ultimos 5 commits")
          md("```")
          md(git("log", "-5", "--oneline") or "(no disponible)")
          md("```")

          md("")
          md("## 2) Inventario completo del repo")
          md("")
          md("- Archivos totales (sin .git): **%d**  |  Tamano total: **%.2f MB**" % (total_arch, total_mb))
          md("- Copias de superapp.py encontradas: **%d**" % len(copias))
          md("")
          if copias:
              md("| # | Ruta | Bytes | SHA256 |")
              md("|---|------|-------|--------|")
              for i, a in enumerate(analisis, 1):
                  md("| %d | `%s` | %s | `%s` |" % (i, esc(a["ruta"]), a.get("bytes", "-"), corto(a.get("sha256", ""))))
          md("")
          if wflows:
              md("**Workflows en .github/workflows:**")
              md("")
              md("| Ruta | Bytes | SHA256 |")
              md("|------|-------|--------|")
              for r in wflows:
                  try:
                      raw = open(os.path.join(W, r), "rb").read()
                      md("| `%s` | %d | `%s` |" % (esc(r), len(raw), corto(hashlib.sha256(raw).hexdigest())))
                  except Exception:
                      md("| `%s` | ? | ? |" % esc(r))
          md("")
          md("<details><summary>Lista completa de archivos (%d)</summary>" % total_arch)
          md("")
          md("```")
          lim = 800
          for rel, sz in inv[:lim]:
              md("%9d  %s" % (sz, rel))
          if total_arch > lim:
              md("... (%d archivos mas, ver inventario.txt del artefacto)" % (total_arch - lim))
          md("```")
          md("")
          md("</details>")
          md("")
          md("<details><summary>10 archivos mas grandes</summary>")
          md("")
          md("| Bytes | Ruta |")
          md("|-------|------|")
          for rel, sz in grandes:
              md("| %s | `%s` |" % (sz, esc(rel)))
          md("")
          md("</details>")

          md("")
          md("## 3) PARTE EXACTA EN LA QUE TRABAJAS: bloque ZYRA-V6 (registro ZID)")
          if not analisis:
              md("")
              md("**NO se encontro ningun superapp.py en el repo.**")
          elif principal is None:
              md("")
              md("**No se pudo analizar superapp.py.**")
          else:
              md("")
              md("Archivo principal analizado: **`%s`**" % esc(principal["ruta"]))
              md("")
              md("| Dato | Valor real | Esperado (post-revC) |")
              md("|------|-----------|----------------------|")
              md("| Bytes | %s | 111,792 (chars) |" % format(principal.get("bytes", 0), ","))
              md("| Chars | %s | 111,792 |" % format(principal.get("chars", 0), ","))
              md("| Lineas | %s | 1,747 |" % format(principal.get("lineas", 0), ","))
              md("| Commit publicado | `%s` | bb3e164a |" % corto(git("rev-parse", "--short", "HEAD"), 8))
              md("")
              if not principal.get("bloques"):
                  md("**SIN MARCADOR ZYRA-V6 en este archivo.** BEGIN en lineas: %s | END en lineas: %s" %
                     (principal.get("begins") or "ninguna", principal.get("ends") or "ninguna"))
                  try:
                      lines = open(os.path.join(W, principal["ruta"]), "rb").read().decode("utf-8", "replace").splitlines()
                      if len(lines) >= 1460:
                          md("")
                          md("Linea 1460 actual (primeros 150 chars): `%s`" % esc(lines[1459][:150]))
                  except Exception:
                      pass
              else:
                  for i, b in enumerate(principal["bloques"], 1):
                      md("")
                      md("### Bloque %d (linea %d)" % (i, b["linea"]))
                      md("")
                      md("| Dato | Valor |")
                      md("|------|-------|")
                      md("| Formato exacto `<script>/*ZYRA-V6-BEGIN*/eval(atob('..'))/*ZYRA-V6-END*/</script>` | %s |" %
                         ("SI" if b.get("formato_exacto") else "NO (variante)"))
                      md("| Chars base64 | %s |" % format(b.get("b64_chars", 0), ","))
                      md("| Chars JS decodificado | %s |" % format(b.get("js_chars", 0), ","))
                      md("| Lineas JS | %s |" % format(b.get("js_lineas", 0), ","))
                      md("| SHA256 base64 | `%s` |" % b.get("sha256_b64", "-"))
                      md("| SHA256 JS | `%s` |" % b.get("sha256_js", "-"))
                      if b.get("error"):
                          md("| Error al decodificar | `%s` |" % esc(b["error"]))
                  b0 = principal["bloques"][0]
                  es_revd = (b0.get("sha256_js") == REV_D_SHA) or (b0.get("sha256_b64") == REV_D_SHA)
                  md("")
                  if es_revd:
                      md("**REV D DETECTADA: el nucleo coincide con el SHA256 aprobado (18722285...abc9d).**")
                  else:
                      md("**El nucleo NO coincide con el SHA256 de REV D (18722285...abc9d).** "
                         "Si el parche REV D ya se ejecuto como PATCH_OK, el deploy aun no llego o no se publico.")

                  js0 = b0.get("js", "")
                  md("")
                  md("### Funciones del nucleo ZID (revD)")
                  md("")
                  md("| Funcion | Definida en linea (JS) | Menciones totales |")
                  md("|---------|------------------------|-------------------|")
                  defs = {}
                  for li, l in enumerate(js0.splitlines(), 1):
                      m = re.search(r"function\s+([A-Za-z_$][\w$]*)\s*\(", l) or \
                          re.search(r"(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\(", l)
                      if m and m.group(1) not in defs:
                          defs[m.group(1)] = li
                  for fn in FUNCIONES:
                      md("| %s | %s | %d |" % (fn, ("linea " + str(defs[fn])) if fn in defs else "NO", contar(js0, fn)))
                  otras = [(n, l) for n, l in sorted(defs.items(), key=lambda x: x[1]) if n not in FUNCIONES]
                  if otras:
                      md("")
                      md("<details><summary>Otras definiciones en el nucleo (%d)</summary>" % len(otras))
                      md("")
                      for n, l in otras[:60]:
                          md("- `%s` (linea %d)" % (n, l))
                      md("")
                      md("</details>")

                  md("")
                  md("### Tokens conservados por el parche (superapp.py / nucleo JS)")
                  md("")
                  md("| Token | En superapp.py | Lineas (primeras) | En nucleo JS |")
                  md("|-------|----------------|--------------------|--------------|")
                  for t in TOKENS:
                      lns = principal["tokens_lineas"].get(t) or []
                      md("| `%s` | %d | %s | %d |" % (t, principal["tokens"].get(t, 0),
                                                       (", ".join(str(x) for x in lns)) if lns else "-",
                                                       contar(js0, t)))
                  md("")
                  md("### Motor OCR / biometria / reglas")
                  md("")
                  md("- Menciones `tesseract` en superapp.py: **%d**" % principal.get("tesseract", 0))
                  md("- Menciones `faceapi` en superapp.py: **%d**" % principal.get("faceapi", 0))
                  md("- Umbral `0.60` en nucleo JS: **%d** menciones" % contar(js0, "0.60"))
                  md("- MRZ `<<<` en nucleo JS: **%d** | PDF417: **%d**" % (contar(js0, "<<<"), contar_i(js0, "PDF417")))
                  md("- Menciones `ZID` en superapp.py: **%d**" % principal.get("zid", 0))
                  rutas = principal.get("rutas") or []
                  md("- Rutas /registro...: %s" % ((", ".join("`%s`" % r for r in rutas) if rutas else "(ninguna)")))
                  dr = principal.get("defs_registro") or []
                  md("- Funciones Python de registro: %s" % ((", ".join("`%s()`" % d for d in dr)) if dr else "(ninguna)"))

              if principal and principal.get("tokens_lineas"):
                  md("")
                  md("### Mapa de ids del registro en superapp.py (lineas donde aparecen)")
                  md("")
                  md("| Token | Lineas |")
                  md("|-------|--------|")
                  for t in TOKENS:
                      lns = principal["tokens_lineas"].get(t) or []
                      md("| `%s` | %s |" % (t, (", ".join(str(x) for x in lns)) if lns else "-"))

          # ---------------- VEREDICTO ----------------
          md("")
          md("## 4) VEREDICTO")
          md("")
          if analisis and principal:
              n_tok_falt = [t for t in TOKENS if principal.get("tokens", {}).get(t, 0) == 0]
              if principal.get("bloques"):
                  b0 = principal["bloques"][0]
                  js0 = b0.get("js", "")
                  falt = [f for f in FUNCIONES if contar(js0, f) == 0]
                  es_revd = (b0.get("sha256_js") == REV_D_SHA) or (b0.get("sha256_b64") == REV_D_SHA)
                  md("- Marcador ZYRA-V6: SI - linea %d (formato exacto: %s)" %
                     (b0["linea"], "SI" if b0.get("formato_exacto") else "NO"))
                  md("- Nucleo decodificado: SI - %s chars JS | b64 %s chars" %
                     (format(b0.get("js_chars", 0), ","), format(b0.get("b64_chars", 0), ",")))
                  md("- Version: %s" % ("REV D DETECTADA" if es_revd else "NO es revD (sha distinto)"))
                  md("- Funciones nucleo: %s (%d/5)" %
                     ("todas" if not falt else "faltan: " + ", ".join(falt), 5 - len(falt)))
              else:
                  md("- Marcador ZYRA-V6: NO encontrado en ninguna copia de superapp.py")
              md("- Tokens conservados: %s (%d/%d con presencia)" %
                 ("todos" if not n_tok_falt else "sin ocurrencias: " + ", ".join(n_tok_falt),
                  len(TOKENS) - len(n_tok_falt), len(TOKENS)))
              md("- Copias de superapp.py: %d -> %s" %
                 (len(copias), ", ".join("`%s`" % esc(c) for c in copias) if copias else "ninguna"))
          else:
              md("- NO hay superapp.py en el repo")
          md("- Workflows presentes: %s" %
             (", ".join("`%s`" % esc(w) for w in wflows) if wflows else "ninguno"))
          md("")
          md("---")
          md("_Inspector de solo lectura: no publica nada. Para aplicar el parche usa el workflow de parche (todo-o-nada)._")

          reporte = "\n".join(S) + "\n"
          with open(os.path.join(OUT, "report.md"), "w", encoding="utf-8") as f:
              f.write(reporte)
          suma = os.environ.get("GITHUB_STEP_SUMMARY")
          if suma:
              with open(suma, "a", encoding="utf-8") as f:
                  f.write(reporte)
          print(reporte)
          print("INSPECTOR_OK")
          PYEOF

      - name: Publicar artefacto de evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra-inspector-${{ github.run_number }}
          path: ${{ runner.temp }}/zyra_inspector
          if-no-files-found: warn
