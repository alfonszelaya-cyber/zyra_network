name: "AUDITORIA PROFUNDA N-10 + A-17 (solo cat/grep/wc — sin python heredocs, causa del YAML roto x3) — SOLO LECTURA, cero eliminaciones"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "[A-17] AMBOS market_service COMPLETOS + funciones + consumidores"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# AUDITORIA A-17 — market_service x2" >> "$SUM"
          echo "## 1) services/market_service.py COMPLETO" >> "$SUM"
          { echo '```python'; cat apps/agro/services/market_service.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## 2) mercado/market_service.py COMPLETO" >> "$SUM"
          { echo '```python'; cat apps/agro/modules/comercializacion/mercado/market_service.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## 3) funciones de cada uno (def + class)" >> "$SUM"
          { echo '```'; echo "-- services/:"; grep -n "^class \|^def \|    def " apps/agro/services/market_service.py 2>/dev/null; echo "-- mercado/:"; grep -n "^class \|^def \|    def " apps/agro/modules/comercializacion/mercado/market_service.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## 4) CONSUMIDORES" >> "$SUM"
          { echo '```'; echo "-- importan services.market_service:"; grep -rln "services.market_service\|services/market_service" apps --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v "services/market_service.py"; echo "-- importan mercado.market_service:"; grep -rln "mercado.market_service\|mercado/market_service" apps --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v "mercado/market_service.py"; echo '```'; } >> "$SUM"
          echo "## 5) TESTS que cubren cada uno" >> "$SUM"
          { echo '```'; echo "-- tests con services/market:"; grep -rln "services.market_service\|services/market_service" apps/agro/tests 2>/dev/null; echo "-- tests con mercado/market:"; grep -rln "mercado.market_service\|mercado/market_service\|add_price_db\|market_snapshot_db" apps/agro/tests 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## 6) el server usa alguno?" >> "$SUM"
          { echo '```'; grep -n "market_service\|market_snapshot\|add_price" apps/agro/server.py 2>/dev/null | head -8; echo '```'; } >> "$SUM"
          exit 0

      - name: "[N-10] los 12 menu.py COMPLETOS + el sistema de menus + consumidores"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "# AUDITORIA N-10 — module/operaciones" >> "$SUM"
          echo "## 1) CONTENIDO de cada menu.py (los 12)" >> "$SUM"
          { echo '```python'; for f in $(find apps/nexo/module/operaciones -name "menu.py" 2>/dev/null | sort); do echo "===== $f"; cat "$f"; done; echo '```'; } >> "$SUM"
          echo "## 2) hay algo mas que menu.py en module/operaciones?" >> "$SUM"
          { echo '```'; find apps/nexo/module/operaciones -name "*.py" ! -name "menu.py" ! -name "__init__.py" 2>/dev/null | while read f; do echo "$(wc -l < "$f") $f"; done; echo '(vacio = solo menús)'; echo '```'; } >> "$SUM"
          echo "## 3) COMO funciona el sistema de menus de nexo" >> "$SUM"
          { echo '```python'; cat apps/nexo/module/__init__.py 2>/dev/null | head -60; echo '```'; } >> "$SUM"
          echo "## 4) quien llama a los menus de module/operaciones" >> "$SUM"
          { echo '```'; grep -rn "module.operaciones\|module/operaciones" apps/nexo --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v "module/operaciones/" | head -10; echo '```'; } >> "$SUM"
          echo "## 5) los menus aparecen en tests del dueno?" >> "$SUM"
          { echo '```'; grep -rn "operaciones" apps/nexo/tests/test_modulos_89.py 2>/dev/null | head -5; grep -rn "operaciones" apps/nexo/tests/test_ng10_menus.py 2>/dev/null | head -5; echo '```'; } >> "$SUM"
          echo "## 6) el server los usa?" >> "$SUM"
          { echo '```'; grep -n "operaciones" apps/nexo/server.py 2>/dev/null | head -8; echo '```'; } >> "$SUM"
          exit 0

      - name: "[VEREDICTO] cero eliminaciones — solo evidencia para su decision"
        if: always()
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## VEREDICTO: AUDITORIA PROFUNDA COMPLETA — CERO eliminaciones (nada se elimina sin que usted vea las fuentes completas y apruebe)." >> "$SUM"
          echo "## Con las fuentes completas de arriba usted decide que se elimina y que se conserva. Yo ejecuto con regresion completa." >> "$SUM"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          exit 0
