name: ZYRA D1c seguridad de acceso fail closed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD1c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: Acceso solo propietario con clave y estado visible
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          SW_FILE = ROOT / 'portal' / 'sw.js'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD1c.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          class NoRedir(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(NoRedir)

          def pedir(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.headers, r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, None, str(e)

          sp_orig = SP_FILE.read_bytes()
          sw_orig = SW_FILE.read_bytes() if SW_FILE.exists() else b''

          def revertir():
              try:
                  SP_FILE.write_bytes(sp_orig)
                  if sw_orig:
                      SW_FILE.write_bytes(sw_orig)
              except Exception:
                  pass

          t0sp = sp_orig.decode('utf-8')
          add('# D1c - ACCESO FAIL-CLOSED + ESTADO DE SESION VISIBLE')
          add('')

          add('## F1. Localizacion de los bloques actuales (exactamente 1 cada uno)')
          add('')
          BLOQUE_ENTRAR_VIEJO = [
          '        if path == "/entrar":',
          '            largo = int(self.headers.get("Content-Length", 0) or 0)',
          '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
          '            import re as _re',
          '            from urllib.parse import unquote_plus as _uq',
          '            campos = {}',
          '            for par in crudo.split("&"):',
          '                if "=" in par:',
          '                    k, v = par.split("=", 1)',
          '                    campos[k] = _uq(v)',
          '            zid = (campos.get("zid") or "").strip()',
          '            clave = (campos.get("clave") or "").strip()',
          '            if not _re.match(r"^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$", zid or ""):',
          '                self._send_html(400, self._pagina_entrar("ZID invalido o vacio."))',
          '                return',
          '            es_dueno = (zid == os.environ.get("ZYRA_OWNER_ZID", "Z-OWNER-ALFONSZELAYA"))',
          '            clave_req = os.environ.get("ZYRA_CLAVE_DUENO", "")',
          '            if es_dueno and clave_req and clave != clave_req:',
          '                self._send_html(403, self._pagina_entrar("Clave de dueno incorrecta."))',
          '                return',
          '            self.send_response(303)',
          '            self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800")',
          '            self.send_header("Location", "/")',
          '            self.end_headers()',
          '            return',
          ]
          BLOQUE_PORTAL_VIEJO = [
          '        if path in ("/", "/index.html"):',
          '            self._send_html(',
          '                200,',
          '                self._read_portal("index.html").decode("utf-8"),',
          '            )',
          '            return',
          ]
          BLOQUE_SALIR_VIEJO = [
          '        if path == "/salir":',
          '            self.send_response(303)',
          '            self.send_header("Set-Cookie", "zyra_zid=; Max-Age=0; Path=/")',
          '            self.send_header("Location", "/")',
          '            self.end_headers()',
          '            return',
          ]
          viejo_entrar = '\n'.join(BLOQUE_ENTRAR_VIEJO)
          viejo_portal = '\n'.join(BLOQUE_PORTAL_VIEJO)
          viejo_salir = '\n'.join(BLOQUE_SALIR_VIEJO)
          anclas = {
              'bloque_entrar': t0sp.count(viejo_entrar),
              'bloque_portal': t0sp.count(viejo_portal),
              'bloque_salir': t0sp.count(viejo_salir),
          }
          for k, v in anclas.items():
              add('- %s: %d (se requiere 1)' % (k, v))
          anclas_ok = all(v == 1 for v in anclas.values())
          gate('bloques_localizados', anclas_ok)
          if not anclas_ok:
              add('')
              add('**BLOQUES NO IDENTIFICADOS: nada editado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseD1c.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS NO UNICOS - sin cambios')
          add('')

          ya = 'SOLO_EL_PROPIETARIO_PUEDE_ENTRAR' in t0sp
          if ya:
              add('## F2. Ya aplicado antes (idempotente).')
              gate('ediciones_aplicadas', True)
          else:
              add('## F2. Tres reemplazos exactos')
              add('')
              BLOQUE_ENTRAR_NUEVO = [
              '        if path == "/entrar":',
              '            largo = int(self.headers.get("Content-Length", 0) or 0)',
              '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
              '            import re as _re',
              '            from urllib.parse import unquote_plus as _uq',
              '            campos = {}',
              '            for par in crudo.split("&"):',
              '                if "=" in par:',
              '                    k, v = par.split("=", 1)',
              '                    campos[k] = _uq(v)',
              '            zid = (campos.get("zid") or "").strip()',
              '            clave = (campos.get("clave") or "").strip()',
              '            owner = os.environ.get("ZYRA_OWNER_ZID", "")',
              '            clave_req = os.environ.get("ZYRA_CLAVE_DUENO", "")',
              '            if not owner or not clave_req:',
              '                self._send_html(503, self._pagina_entrar(',
              '                    "Acceso no configurado: falta ZYRA_OWNER_ZID o ZYRA_CLAVE_DUENO en el servidor."))',
              '                return',
              '            if not _re.match(r"^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$", zid or ""):',
              '                self._send_html(400, self._pagina_entrar("ZID invalido o vacio."))',
              '                return',
              '            if zid != owner:',
              '                self._send_html(403, self._pagina_entrar(',
              '                    "SOLO_EL_PROPIETARIO_PUEDE_ENTRAR. El registro publico llegara con la Red."))',
              '                return',
              '            if clave != clave_req:',
              '                self._send_html(403, self._pagina_entrar("Clave incorrecta."))',
              '                return',
              '            self.send_response(303)',
              '            self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800; HttpOnly")',
              '            self.send_header("Location", "/")',
              '            self.end_headers()',
              '            return',
              ]
              BLOQUE_PORTAL_NUEVO = [
              '        if path in ("/", "/index.html"):',
              '            base = self._read_portal("index.html").decode("utf-8")',
              '            zid_s = self._sesion()',
              '            par_viejo = (',
              '                \'<a href="/entrar" style="color:#58a6ff">Entrar</a>\'',
              '                + "\\n"',
              '                + \'<a href="/salir" style="color:#8b949e">Salir</a>\')',
              '            if zid_s:',
              '                estado = (',
              '                    \'<span style="color:#3fb950;font-weight:700">Conectado: \'',
              '                    + zid_s + \'</span>\'',
              '                    + \' <a href="/salir" style="color:#f85149">Salir</a>\')',
              '            else:',
              '                estado = \'<a href="/entrar" style="color:#58a6ff">Entrar</a>\'',
              '            base = base.replace(par_viejo, estado, 1)',
              '            self._send_html(200, base)',
              '            return',
              ]
              BLOQUE_SALIR_NUEVO = [
              '        if path == "/salir":',
              '            self.send_response(303)',
              '            self.send_header("Set-Cookie", "zyra_zid=; Max-Age=0; Path=/; HttpOnly")',
              '            self.send_header("Cache-Control", "no-store")',
              '            self.send_header("Location", "/entrar")',
              '            self.end_headers()',
              '            return',
              ]
              t = t0sp
              t = t.replace(viejo_entrar, '\n'.join(BLOQUE_ENTRAR_NUEVO), 1)
              t = t.replace(viejo_portal, '\n'.join(BLOQUE_PORTAL_NUEVO), 1)
              t = t.replace(viejo_salir, '\n'.join(BLOQUE_SALIR_NUEVO), 1)
              SP_FILE.write_text(t, encoding='utf-8')
              add('- /entrar: fail-closed (solo owner con clave, sin defaults).')
              add('- portal: muestra Conectado/Sin sesion.')
              add('- /salir: lleva a /entrar y no-store.')
          gate('ediciones_aplicadas', True)
          add('')

          add('## F3. Service worker sin cache del portal')
          add('')
          SW_LINES = [
              "var CACHE='zyra-v2';",
              "self.addEventListener('install',function(e){self.skipWaiting();});",
              "self.addEventListener('activate',function(e){e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}).then(function(){return self.clients.claim();}));});",
              "self.addEventListener('fetch',function(e){});",
          ]
          SW_FILE.write_text('\n'.join(SW_LINES) + '\n', encoding='utf-8')
          add('- sw.js reescrito: sin cache (estado siempre real).')
          gate('sw_actualizado', True)
          add('')

          add('## F4. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(SP_FILE), doraise=True)
              add('- py_compile: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## F5. PRUEBA 1: sin clave configurada -> rechaza a TODOS')
          add('')
          env1 = dict(os.environ)
          env1.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d1c1', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-d1c1', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          env1.pop('ZYRA_OWNER_ZID', None)
          env1.pop('ZYRA_CLAVE_DUENO', None)
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env1, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env1, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- sistema arriba sin claves: %s' % spv)
          if spv:
              cuerpo_post = ('zid=Z-OWNER-ALFONSZELAYA&clave=1234').encode('utf-8')
              st, _h, b = pedir(BSP + '/entrar', data=cuerpo_post)
              rechazo_ok = st in (400, 403, 503)
              add('- intentar entrar sin claves configuradas -> %s (rechazo esperado) %s' % (st, 'OK' if rechazo_ok else 'FALLO'))
              gate('fail_closed_sin_claves', rechazo_ok)
          else:
              gate('fail_closed_sin_claves', False)
          try:
              if sp and sp.poll() is None:
                  sp.terminate()
                  sp.wait(timeout=10)
          except Exception:
              try:
                  sp.kill()
              except Exception:
                  pass
          try:
              if proc.poll() is None:
                  proc.terminate()
                  proc.wait(timeout=10)
          except Exception:
              try:
                  proc.kill()
              except Exception:
                  pass
          add('')

          add('## F6. PRUEBA 2: con clave -> solo el dueno entra')
          add('')
          ZID = 'Z-DUENO-CI'
          CLAVE = 'clave-ci-secreta-9999'
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d1c2', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-d1c2', 'PORT': str(SP), 'ZYRA_OWNER_ZID': ZID, 'ZYRA_CLAVE_DUENO': CLAVE, 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cuerpo).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- sistema arriba con claves: %s (apps=%d)' % (spv, len(apps)))
          gate('ocho_apps_vivas', spv and len(apps) == 8)
          add('')
          if spv:
              st, h, b = pedir(BSP + '/entrar', data=('zid=' + ZID + '&clave=' + CLAVE).encode('utf-8'))
              cookie_ok = (st == 303 and ('zyra_zid=' + ZID) in (h.get('Set-Cookie') or ''))
              add('- dueno con clave correcta -> %s %s' % (st, 'OK' if cookie_ok else 'FALLO'))
              gate('dueno_aceptado', cookie_ok)
              cookie = (h.get('Set-Cookie') or '').split(';')[0]
              st, _h, b = pedir(BSP + '/entrar', data=('zid=' + ZID + '&clave=MALA').encode('utf-8'))
              add('- dueno con clave MALA -> %s (403 esperado) %s' % (st, 'OK' if st == 403 else 'FALLO'))
              gate('clave_mala_rechazada', st == 403)
              st, _h, b = pedir(BSP + '/entrar', data=('zid=Pedro&clave=1234').encode('utf-8'))
              add('- ZID cualquiera (Pedro) -> %s (403 esperado) %s' % (st, 'OK' if st == 403 else 'FALLO'))
              gate('cualquiera_rechazado', st == 403)
              st, _h, b = pedir(BSP + '/', {'Cookie': cookie})
              conectado = (st == 200 and ('Conectado: ' + ZID) in b)
              add('- portal con sesion muestra: Conectado=%s %s' % (ZID in b, 'OK' if conectado else 'FALLO'))
              gate('portal_muestra_estado', conectado)
              st, h2, b = pedir(BSP + '/salir', {'Cookie': cookie})
              salio = (st == 303 and 'Max-Age=0' in (h2.get('Set-Cookie') or ''))
              add('- /salir -> %s con borrado de cookie %s' % (st, 'OK' if salio else 'FALLO'))
              gate('salir_funciona', salio)
              st, _h, b = pedir(BSP + '/')
              sin_sesion = (st == 200 and ('Conectado: ' not in b) and ('href="/entrar"' in b))
              add('- portal tras salir muestra Entrar %s' % ('OK' if sin_sesion else 'FALLO'))
              gate('portal_tras_salir', sin_sesion)
              st, _h, b = pedir(BSP + '/laboratorio/ui')
              add('- guard intacto sin sesion: /laboratorio/ui -> %s (401 esperado)' % st)
              gate('guard_intacto', st == 401)
          else:
              gate('dueno_aceptado', False)
              gate('clave_mala_rechazada', False)
              gate('cualquiera_rechazado', False)
              gate('portal_muestra_estado', False)
              gate('salir_funciona', False)
              gate('portal_tras_salir', False)
              gate('guard_intacto', False)
          add('')

          criticos = ('bloques_localizados', 'compila', 'fail_closed_sin_claves', 'ocho_apps_vivas', 'dueno_aceptado', 'clave_mala_rechazada', 'cualquiera_rechazado', 'portal_muestra_estado', 'salir_funciona', 'guard_intacto')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos) and not ya:
              revertir()
              add('## REVERSION APLICADA - archivos restaurados, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**ACCESO SEGURO VERIFICADO. Commit.**')
              add('')
              add('RECUERDA en Render (zyra-superapp): ZYRA_OWNER_ZID=Z-ALFONSZELAYA y ZYRA_CLAVE_DUENO=tu clave. Sin ellas, el acceso queda cerrado a proposito.')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseD1c.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D1c terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal/sw.js
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(seguridad): acceso fail-closed solo propietario, estado de sesion visible"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseD1c-zyra
          path: faseD1c.json
          if-no-files-found: ignore
