# ============================================================
# ZYRA REV F v17 - parche del nucleo del registro ZID (todo-o-nada)
#
# Corrige lo reportado el 9-10/11 con captura en el paso 5: "no
# reconoce la clave" y la pregunta "que va a aparecer cuando crea el
# ZID?". Con las capturas se vio la cadena exacta: escribes la clave,
# tocas Crear mi ZID, la pagina VUELVE A CARGAR con la clave borrada
# (y el aviso de recuperacion). Correcciones de la v17:
#
#   1) LA CLAVE YA NO SE PIERDE NI SE "OLVIDA":
#      - los campos de clave se DESCUBREN solos (por tipo password y
#        nombre/id parecido): ya no dependen de ids fijos "clave" y
#        "clave2"; si el formulario usa otros id, igual funciona;
#      - la clave queda RESPALDADA en sessionStorage (solo en tu
#        telefono, muere al cerrar el navegador) y al recargarse la
#        pagina SE REPONE SOLA en los dos cuadros;
#      - sondeo cada 600 ms + eventos change/blur: el autorrelleno
#        del navegador tambien se detecta;
#      - mensajes exactos: "Falta REPETIR la clave...", "tu clave
#        tiene N caracteres; minimo 8", "NO coinciden", "listas".
#   2) ENVIO PROTEGIDO DESDE EL PRIMER INTENTO: al tocar Crear mi ZID
#      el envio va por fetch SIN recargar la pagina. Si el servidor
#      devuelve el formulario, NO hay recarga: te quedas en el paso 5
#      con la clave escrita y todo intacto, y la respuesta cruda
#      queda en el panel "i". Adios a perder la clave en el rebote.
#   3) PANTALLA DE EXITO DEL ZID: cuando el servidor crea el ZID
#      aparece una pantalla verde grande "TU ZID FUE CREADO" con tu
#      codigo de ZID (si el servidor lo devuelve) y los 3 pasos para
#      entrar con "Ya tengo ZID". Ya no hay duda de si se creo o no.
#   4) SI EL CANAL PROTEGIDO FALLA: reintento normal y la clave se
#      repone sola igual.
#
#   CONSERVA todo lo de v13+v14+v15+v16: motor de nombres flexible
#   (1 palabra bien leida basta, confusiones OCR toleradas, MRZ
#   parcial sin castigo), el reverso no valida el nombre, nadie te
#   regresa al paso 1 (guardia anti-patada), respaldo automatico del
#   registro en el telefono (mismo formato v16, se rescata igual),
#   4 esquinas con mascara anti-tela, foto del documento recortada
#   al cuadro, auto-captura, motor facial EN VIVO, selfie de rostro,
#   lectura fuerte con poca luz, OCR multi-pase con panel de lectura
#   confirmable, envio fail-closed, anti-bloqueo legado y boton "i".
#
#   VERIFICACION RAPIDA de que v17 esta vivo en el telefono: el titulo
#   de la pestana termina en "REV F v17" y el boton "i" (abajo a la
#   derecha) dice "nucleo: REV F v17 activo". Si no lo dice, el run no
#   se ejecuto o Render aun no despliega.
#
# COMO USAR:
#   1) GitHub > Add file > Upload files y sube ESTE archivo tal cual a
#      .github/workflows/zyra-rev-f.yml (reemplaza el anterior).
#   2) Actions > ZYRA REV F - registro ZID > Run workflow.
#   3) Verde = publicado (Render despliega en 1-2 min). Prueba en el
#      telefono abriendo el registro DE NUEVO (recarga la pagina).
#   4) Si algo falla, pega el Resumen (Summary) del run en el chat.
#
# Si el archivo llega con UN caracter danado, el run lo REPARA solo
# verificando por SHA y publica igual. Si el dano es mayor, no publica
# nada y dice el motivo exacto (regla todo-o-nada).
# ============================================================
