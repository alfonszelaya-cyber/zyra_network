          gate('index_nuevo', True)
          add('')

          add('## W4. sw.js v5 y version.txt')
          add('')
          SW = [
          "var CACHE='zyra-v5';",
          "self.addEventListener('install',function(e){self.skipWaiting();});",
          "self.addEventListener('activate',function(e){e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}).then(function(){return self.clients.claim();}));});",
          "self.addEventListener('fetch',function(e){});",
          ]
          swf.write_text('\n'.join(SW) + '\n', encoding='utf-8')
          verf.write_text('ZYRA-2026.10.12-3\n', encoding='utf-8')
          creados.append('portal/version.txt')
          gate('sw_version', True)
          add('')

          add('## W5. superapp.py: 5 ediciones con anclas exactas')
          add('')
          OLD_A = '\n'.join([
          "                estado = (",
          "                    '<p class=\"estado ok\">Conectado: ' + zid_s + '</p>')",
