name: ZYRA auditoria completa de AXIS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axis_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt > pip_reqs.log 2>&1 || echo "requirements con fallos parciales, se continua"
          python -c "import cryptography" 2>/dev/null || python -m pip install cryptography
          tail -n 3 pip_reqs.log

      - name: Auditoria AXIS en 3 niveles
        run: |
          python3 - <<'PYEOF'
          import ast, hashlib, json, os, queue, re, subprocess, sys, threading, time, traceback
          import urllib.request, urllib.error
          from collections import Counter
          from pathlib import Path

          ROOT = Path.cwd()
          AX = ROOT / 'apps' / 'axis'
          OUT = []
          DATA = {}
          ENV = dict(os.environ)
          ENV['PYTHONPATH'] = str(ROOT)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('axis_audit.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _manejador

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def size0(p):
              try:
                  return p.stat().st_size == 0
              except OSError:
                  return False

          add('# AUDITORIA COMPLETA DE AXIS - 3 NIVELES')
          add('')
          add('DECLARADO = la estructura dice que existe. IMPLEMENTADO = tiene logica real.')
          add('VERIFICADO = probado en este run (imports, arranque del servidor, pytest).')
          add('Verificado aqui NO certifica integraciones externas (alcaldia, biometria) ni produccion.')
          add('')

          files = [p for p in AX.rglob('*') if p.is_file()]
          pys = [p for p in files if p.suffix == '.py']
          pys_vacios = [p for p in pys if size0(p)]
          pys_con = [p for p in pys if not size0(p)]
          tests = [p for p in pys if p.name.startswith('test_')
                   or p.name.endswith('_test.py')]
          add('## A. Inventario general')
          add('')
          add('- archivos totales: %d | python: %d | con contenido: %d | VACIOS: %d | tests: %d'
              % (len(files), len(pys), len(pys_con), len(pys_vacios), len(tests)))
          DATA['inventario'] = {'archivos': len(files), 'py': len(pys),
                                'py_con': len(pys_con), 'py_vacios': len(pys_vacios),
                                'tests': len(tests)}
          add('')

          dirs = [p for p in AX.rglob('*') if p.is_dir()]
          sin = set(dirs)
          for f in files:
              if not size0(f):
                  p = f.parent
                  while p in sin:
                      sin.discard(p)
                      p = p.parent
          add('## B. Directorios sin contenido')
          add('')
          add('- Total: %d de %d directorios' % (len(sin), len(dirs)))
          grupos = Counter(str(p.relative_to(AX)) for p in sin)
          for d, n in grupos.most_common(20):
              add('  - %s (%d)' % (d, n))
          DATA['dirs_vacios'] = {'total': len(sin), 'grupos': dict(grupos)}
          add('')

          add('## C. DECLARADO vs IMPLEMENTADO por dominio')
          add('')
          add('| Dominio (carpeta) | Modulos con codigo | py vacios | LOC | Tests en su arbol | Estado |')
          add('|---|---|---|---|---|---|')
          dominios = {}
          for d in sorted([x for x in AX.iterdir() if x.is_dir()]):
              mod = 0
              vac = 0
              loc = 0
              tstd = 0
              for p in d.rglob('*.py'):
                  if size0(p):
                      vac += 1
                      continue
                  if p.name == '__init__.py':
                      continue
                  mod += 1
                  loc += len(txt(p).splitlines())
                  if p.name.startswith('test_') or p.name.endswith('_test.py'):
                      tstd += 1
              estado = 'SIN_CODIGO' if mod == 0 else ('CODIGO+PRUEBAS' if tstd else 'CODIGO_SIN_PRUEBAS')
              dominios[d.name] = {'mod': mod, 'vacios': vac, 'loc': loc, 'tests': tstd,
                                  'estado': estado}
              add('| %s | %d | %d | %d | %d | %s |' % (d.name, mod, vac, loc, tstd, estado))
          DATA['dominios'] = dominios
          add('')

          add('## D. Mapa de musculo (top 25 modulos por lineas)')
          add('')
          pesos = []
          for p in pys_con:
              if p.name == '__init__.py':
                  continue
              t = txt(p)
              try:
                  arbol = ast.parse(t)
              except Exception:
                  continue
              nc = sum(isinstance(n, ast.ClassDef) for n in ast.walk(arbol))
              nf = sum(isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
                       for n in ast.walk(arbol))
              pesos.append((len(t.splitlines()), nc, nf,
                            str(p.relative_to(AX))))
          pesos.sort(reverse=True)
          total_loc = sum(w[0] for w in pesos)
          add('- LOC total de AXIS: %d' % total_loc)
          add('')
          add('| Lineas | Clases | Funciones | Modulo |')
          add('|---|---|---|---|')
          for l, nc, nf, r in pesos[:25]:
              add('| %d | %d | %d | %s |' % (l, nc, nf, r))
          DATA['loc_total'] = total_loc
          DATA['top_modulos'] = [[l, nc, nf, r] for l, nc, nf, r in pesos[:40]]
          add('')

          add('## E. Imports rotos (a apps. o shared_engines. inexistentes)')
          add('')
          rotos = []
          relativos = 0
          for p in pys_con:
              try:
                  arbol = ast.parse(p.read_bytes())
              except Exception:
                  continue
              for nodo in ast.walk(arbol):
                  if isinstance(nodo, ast.ImportFrom) and nodo.level > 0:
                      relativos += 1
                      continue
                  objetivos = []
                  if isinstance(nodo, ast.ImportFrom) and nodo.module:
                      objetivos.append(nodo.module)
                  elif isinstance(nodo, ast.Import):
                      objetivos = [a.name for a in nodo.names]
                  for obj in objetivos:
                      if not obj.startswith(('apps.', 'shared_engines.')):
                          continue
                      base = ROOT / obj.replace('.', '/')
                      if base.with_suffix('.py').exists() or (base / '__init__.py').exists():
                          continue
                      rotos.append((str(p.relative_to(AX)), obj))
          add('- Imports relativos (no verificados aqui): %d' % relativos)
          add('- Imports absolutos ROTOS: **%d**' % len(rotos))
          for f, o in rotos[:30]:
              add('  - `%s` -> %s' % (f, o))
          DATA['imports_rotos'] = rotos
          add('')

          add('## F. Duplicados')
          add('')
          h2p = {}
          for p in files:
              if size0(p):
                  continue
              try:
                  if p.stat().st_size > 1000000:
                      continue
              except OSError:
                  continue
              h2p.setdefault(hashlib.sha256(p.read_bytes()).hexdigest(), []).append(p)
          internos = {h: v for h, v in h2p.items() if len(v) > 1}
          add('- Grupos de archivos identicos DENTRO de axis: %d' % len(internos))
          for h, v in list(internos.items())[:12]:
              add('  - ' + ' | '.join(str(x.relative_to(AX)) for x in v))
          ext = 0
          hs_eng = set()
          for p in (ROOT / 'shared_engines').rglob('*.py'):
              if size0(p):
                  continue
              hs_eng.add(hashlib.sha256(p.read_bytes()).hexdigest())
          for h, v in h2p.items():
              if h in hs_eng and all('shim' not in str(x).lower() for x in v):
                  ext += 1
                  if ext <= 8:
                      add('  - CRUZADO con shared_engines: %s' % str(v[0].relative_to(AX)))
          add('- Archivos de axis identicos a shared_engines: %d' % ext)
          DATA['duplicados_internos'] = {h[:12]: [str(x.relative_to(AX)) for x in v]
                                         for h, v in internos.items()}
          add('')

          add('## G. Sintaxis')
          add('')
          errs = []
          for p in pys_con:
              try:
                  ast.parse(p.read_bytes())
              except SyntaxError as e:
                  errs.append((str(p.relative_to(AX)), 'linea %s: %s' % (e.lineno, e.msg)))
          add('- Errores de sintaxis: %d' % len(errs))
          for f, e in errs[:20]:
              add('  - %s: %s' % (f, e))
          DATA['sintaxis'] = errs
          add('')

          add('## H. VERIFICADO: import real de los modulos clave')
          add('')
          probe = (
              "import importlib\n"
              "mods=['apps.axis','apps.axis.server',"
              "'apps.axis.infrastructure.persistence.axis_store',"
              "'apps.axis.life_history.integration']\n"
              "for m in mods:\n"
              "    try:\n"
              "        importlib.import_module(m)\n"
              "        print('RESULT|'+m+'|OK')\n"
              "    except Exception as e:\n"
              "        print('RESULT|'+m+'|FALLO|'+str(e).replace(chr(10),' ')[:150])\n"
          )
          try:
              r = subprocess.run([sys.executable, '-c', probe], cwd=ROOT, env=ENV,
                                 capture_output=True, text=True, timeout=120)
              for l in (r.stdout or '').splitlines():
                  if l.startswith('RESULT|'):
                      partes = l.split('|')
                      add('- %s -> %s %s' % (partes[1], partes[2],
                          partes[3] if len(partes) > 3 else ''))
          except Exception as e:
              add('- probe FALLO: %s' % e)
          add('')

          add('## I. VERIFICADO: arranque REAL del servidor de axis con BD temporal')
          add('')
          CHILD = (
              "import pathlib, sys, time, traceback\n"
              "try:\n"
              "    from apps.axis.infrastructure.persistence.axis_store import AxisStore\n"
              "    from apps.axis.server import serve_axis\n"
              "    from shared_engines.network.network_client import NetworkClient\n"
              "    from shared_engines.storage.database import SQLiteAdapter\n"
              "    from shared_engines.common.clocks import SystemClock\n"
              "    db = pathlib.Path('/tmp/axis_audit_boot/axis.db')\n"
              "    db.parent.mkdir(parents=True, exist_ok=True)\n"
              "    if db.exists():\n"
              "        db.unlink()\n"
              "    store = AxisStore(SQLiteAdapter(str(db), busy_timeout_ms=10000), SystemClock())\n"
              "    client = NetworkClient('')\n"
              "    server = serve_axis(store, client, host='127.0.0.1', port=0)\n"
              "    sa = getattr(server, 'server_address', None)\n"
              "    print('BOOTED ' + str(sa[1] if sa else '?'), flush=True)\n"
              "    if hasattr(server, 'serve_forever'):\n"
              "        server.serve_forever()\n"
              "    else:\n"
              "        while True:\n"
              "            time.sleep(1)\n"
              "except Exception:\n"
              "    print('BOOT_FAIL', flush=True)\n"
              "    traceback.print_exc()\n"
              "    sys.exit(1)\n"
          )
          boot_port = None
          child_out = []
          proc = None
          try:
              proc = subprocess.Popen([sys.executable, '-'], cwd=ROOT, env=ENV,
                                      stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, text=True)
              proc.stdin.write(CHILD)
              proc.stdin.close()
          except Exception as e:
              add('- No se pudo lanzar: %s' % e)
          if proc is not None:
              q = queue.Queue()

              def lector():
                  for linea in proc.stdout:
                      q.put(linea.rstrip('\n'))

              threading.Thread(target=lector, daemon=True).start()
              t0 = time.time()
              while time.time() - t0 < 40:
                  try:
                      l = q.get(timeout=1)
                  except queue.Empty:
                      if proc.poll() is not None:
                          break
                      continue
                  child_out.append(l)
                  if l.startswith('BOOTED'):
                      pto = l.split()[1] if len(l.split()) > 1 else '?'
                      if pto.isdigit():
                          boot_port = int(pto)
                      break
                  if l.startswith('BOOT_FAIL'):
                      continue
              if boot_port:
                  add('- **SERVIDOR DE AXIS ARRIBA en puerto %d**' % boot_port)
                  for ruta in ('/health', '/'):
                      try:
                          req = urllib.request.Request(
                              'http://127.0.0.1:%d%s' % (boot_port, ruta))
                          with urllib.request.urlopen(req, timeout=5) as rp:
                              cuerpo = rp.read().decode('utf-8', errors='replace')[:200]
                          add('- GET %s -> HTTP %d | cuerpo: %s' % (ruta, rp.status, cuerpo))
                      except urllib.error.HTTPError as e:
                          add('- GET %s -> HTTP %d' % (ruta, e.code))
                      except Exception as e:
                          add('- GET %s -> error: %s' % (ruta, e))
              else:
                  add('- **EL SERVIDOR DE AXIS NO ARRANCO** (esto responde tu pregunta clave).')
              if proc.poll() is None:
                  proc.terminate()
                  try:
                      proc.wait(timeout=10)
                  except Exception:
                      proc.kill()
              resto = []
              try:
                  while True:
                      resto.append(q.get_nowait())
              except queue.Empty:
                  pass
              child_out += resto
              if not boot_port and child_out:
                  add('')
                  add('Salida del arranque (ultimas lineas):')
                  add('```')
                  for l in child_out[-15:]:
                      add(l[:160])
                  add('```')
                  try:
                      r2 = subprocess.run(
                          [sys.executable, '-c',
                           "import inspect; from apps.axis.server import serve_axis;"
                           " print('SIG ' + str(inspect.signature(serve_axis)))"],
                          cwd=ROOT, env=ENV, capture_output=True, text=True, timeout=60)
                      for l in (r2.stdout or '').splitlines():
                          if l.startswith('SIG '):
                              add('- Firma real de serve_axis: %s' % l[4:])
                  except Exception:
                      pass
          DATA['boot'] = {'ok': boot_port is not None, 'puerto': boot_port}
          add('')

          add('## J. VERIFICADO: suite de tests con pytest')
          add('')
          pa = fa = er = sk = None
          try:
              r3 = subprocess.run(
                  [sys.executable, '-m', 'pytest', 'apps/axis', '-q', '--tb=line',
                   '-rf', '--no-header', '-p', 'no:cacheprovider'],
                  cwd=ROOT, env=ENV, capture_output=True, text=True, timeout=480)
              salida = (r3.stdout or '') + (r3.stderr or '')
              m = re.search(r'(\d+) passed', salida)
              pa = int(m.group(1)) if m else 0
              m = re.search(r'(\d+) failed', salida)
              fa = int(m.group(1)) if m else 0
              m = re.search(r'(\d+) error', salida)
              er = int(m.group(1)) if m else 0
              m = re.search(r'(\d+) skipped', salida)
              sk = int(m.group(1)) if m else 0
              add('- **PASAN: %s | FALLAN: %s | ERRORES: %s | SALTAN: %s**'
                  % (pa, fa, er, sk))
              add('')
              add('Detalle (ultimas lineas de pytest):')
              add('```')
              for l in [x for x in salida.splitlines() if x.strip()][-30:]:
                  add(l[:160])
              add('```')
          except Exception as e:
              add('- pytest FALLO al ejecutarse: %s' % e)
          DATA['pytest'] = {'pasan': pa, 'fallan': fa, 'errores': er, 'saltan': sk}
          add('')

          add('## K. VEREDICTO: que hace axis en realidad')
          add('')
          vmod = dominios.get('infrastructure', {}).get('mod', 0)
          vlife = dominios.get('life_history', {}).get('mod', 0)
          add('1. ESTRUCTURA: %d carpetas declaradas, %d sin contenido. La estructura supera al codigo.' % (len(dominios), sum(1 for d in dominios.values() if d['mod'] == 0)))
          add('2. MUSCULO: %d LOC en %d modulos con codigo (compara: la estructura declara mucho mas).' % (total_loc, len(pesos)))
          add('3. IMPORTS: %d rotos. Un import roto = codigo que el interprete no puede cargar.' % len(rotos))
          if boot_port:
              add('4. ARRANQUE: el servidor axis arranca de verdad y responde. Esto ES verificable.')
          else:
              add('4. ARRANQUE: NO arranca en este run. Es el hallazgo mas importante de la auditoria.')
          add('5. TESTS: %s pasan, %s fallan de la suite propia. Lo que pasa son los casos probados; lo que falla, codigo roto o pruebas malas.' % (pa, fa))
          add('6. LO QUE NO ESTA VERIFICADO AQUI: biometria real, verificacion con alcaldia,')
          add('   integracion con la red ZYRA en vivo, y produccion. Eso requiere credenciales e instituciones.')
          add('')
          add('Listado completo de los %d archivos vacios y todos los datos crudos: artefacto axis-audit.' % len(pys_vacios))
          DATA['vacios_lista'] = sorted(str(p.relative_to(AX)) for p in pys_vacios)

          Path('axis_audit.json').write_text(
              json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
              encoding='utf-8')
          escribe()
          print('Auditoria AXIS terminada')
          PYEOF

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axis-audit
          path: axis_audit.json
          if-no-files-found: ignore
