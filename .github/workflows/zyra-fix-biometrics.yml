          TESTS = r'''var TOTAL = 0;
          function aser(cond, msg){ TOTAL++; if(!cond){ console.error("FALLA: " + msg); process.exit(1); } }
          function vec128(delta){ var a = [], i; for(i = 0; i < 128; i++){ a.push(0.01 + (delta || 0)); } return a; }

          /* 1. normalizacion */
          aser(norm("Jose PACHECO") === "JOSE PACHECO", "norm basico");
          aser(norm("José PÉREZ-López") === "JOSE PEREZ LOPEZ", "norm acentos y signos");

          /* 2. levenshtein */
          aser(levd("SZELAYA","SZELEYA") === 1, "levd basico");

          /* 3. similitud de nombres */
          aser(simNombres("ALFON SZELAYA","ALFON SZELAYA") >= 0.9, "nombre identico pasa");
          aser(simNombres("jose pacheco","SALINAS PADILLA") < 0.6, "caso real Jose pacheco vs SALINAS PADILLA bloquea");
          aser(simNombres("jose antonio salinas padilla","SALINAS PADILLA JOSE ANTONIO") >= 0.6, "nombre completo del doc pasa sin importar orden");
          aser(simNombres("ALFON SZELAYA","ALFON SZELEYA LOPEZ") >= 0.6, "tolerancia a error OCR de 1 letra");

          /* 4. REGRESION v5: el OCR completo tiene muchos tokens; la fraccion se calcula sobre el NOMBRE del usuario */
          aser(simNombres("MARIA SALINAS PADILLA","CALIFORNIA DRIVER LICENSE\nLN 12-3456789\nSALINAS PADILLA\nFN MARIA ISABEL\nDOB 08/15/1990\n1234 MAIN ST\nLOS ANGELES CA 90001\nDL 12-3456789\nISS 03-10-2024 EXP 03-10-2028") >= 0.6, "nombre correcto contra OCR largo del documento pasa");
