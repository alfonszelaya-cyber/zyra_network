name: ZYRA LABORATORIO - Lote 2A (Fase 2 completa - capturar, comprender y disenar EN VIVO)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar y aplicar lote (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_2a.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          reemplazar_verificado() {
            ruta="$1"; firma="$2"
            if [ ! -s "$ruta" ]; then
              echo "FALLO: $ruta no existe para reemplazo verificado"; exit 1
            fi
            if ! grep -qF "$firma" "$ruta"; then
              echo "FALLO: firma ausente en $ruta (contenido inesperado, NO se toca)"; exit 1
            fi
            cat > "$ruta"
            echo "REEMPLAZADO-VERIFICADO: $ruta"
            echo "$ruta|REEMPLAZADO" >> "$MANIFEST"
          }
          mkdir -p apps/laboratorio/shared/enums apps/laboratorio/domain apps/laboratorio/infrastructure/persistence apps/laboratorio/infrastructure/repositories apps/laboratorio/infrastructure/providers apps/laboratorio/application/commands apps/laboratorio/application/use_cases apps/laboratorio/application/handlers apps/laboratorio/routers/api apps/laboratorio/modules apps/laboratorio/templates/dashboards
          echo "=== ANCLAS: app.py y service_registry.py ==="
          python3 - << 'PYANCHOR'
          from pathlib import Path
          p = Path("apps/laboratorio/infrastructure/api/app.py")
          codigo = p.read_text(encoding="utf-8")
          ancla1 = "from apps.laboratorio.routers.public.health import registrar_rutas as registrar_salud"
          ancla2 = "registrar_salud(app)"
          assert ancla1 in codigo and ancla2 in codigo, "anclas ausentes en app.py"
          cambios = []
          if "conectar_comprension(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.understanding_module import conectar as conectar_comprension")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_comprension(app)")
              cambios.append("understanding")
          if "conectar_diseno(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.design_module import conectar as conectar_diseno")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_diseno(app)")
              cambios.append("design")
          p.write_text(codigo, encoding="utf-8")
          print("app.py:", ", ".join(cambios) if cambios else "ya estaba")
          p2 = Path("apps/laboratorio/registry/services/service_registry.py")
          c2 = p2.read_text(encoding="utf-8")
          a_imp = "from apps.laboratorio.application.handlers.document_handler import ManejadorDocumentos"
          assert a_imp in c2, "ancla import ausente en service_registry.py"
          if "manejador_capturas" not in c2:
              nuevos_imp = (
                  "from apps.laboratorio.application.handlers.input_handler import ManejadorCapturas\n"
                  "from apps.laboratorio.application.handlers.understanding_handler import ManejadorComprension\n"
                  "from apps.laboratorio.application.handlers.design_handler import ManejadorDisenos\n"
                  "from apps.laboratorio.application.use_cases.capture_input import CasoCapturarEntrada\n"
                  "from apps.laboratorio.application.use_cases.understand_input import CasoComprenderEntrada\n"
                  "from apps.laboratorio.application.use_cases.create_blueprint import CasoCrearBlueprint\n"
                  "from apps.laboratorio.infrastructure.providers.understanding_engine import MotorComprensionTextual\n"
                  "from apps.laboratorio.infrastructure.persistence.input_store import InputStore\n"
                  "from apps.laboratorio.infrastructure.persistence.understanding_store import UnderstandingStore\n"
                  "from apps.laboratorio.infrastructure.persistence.design_store import DesignStore\n"
                  "from apps.laboratorio.infrastructure.repositories.input_repository import InputRepository\n"
                  "from apps.laboratorio.infrastructure.repositories.understanding_repository import UnderstandingRepository\n"
                  "from apps.laboratorio.infrastructure.repositories.design_repository import DesignRepository\n"
              )
              c2 = c2.replace(a_imp, nuevos_imp + a_imp)
              a_reg = '    c.obtener("suscriptor_zyra")'
              assert a_reg in c2, "ancla registro ausente"
              nuevos_reg = (
                  '    c.registrar("input_store", lambda _c: InputStore(conexion))\n'
                  '    c.registrar("understanding_store", lambda _c: UnderstandingStore(conexion))\n'
                  '    c.registrar("design_store", lambda _c: DesignStore(conexion))\n'
                  '    c.registrar("repo_inputs", lambda _c: InputRepository(_c.obtener("input_store")))\n'
                  '    c.registrar("repo_comprensiones", lambda _c: UnderstandingRepository(_c.obtener("understanding_store")))\n'
                  '    c.registrar("repo_disenos", lambda _c: DesignRepository(_c.obtener("design_store")))\n'
                  '    c.registrar("motor_comprension", lambda _c: MotorComprensionTextual())\n'
                  '    c.registrar("caso_capturar", lambda _c: CasoCapturarEntrada(_c.obtener("repo_inputs"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_comprender", lambda _c: CasoComprenderEntrada(_c.obtener("repo_inputs"), _c.obtener("repo_comprensiones"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("motor_comprension"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_disenar", lambda _c: CasoCrearBlueprint(_c.obtener("repo_disenos"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_capturas", lambda _c: ManejadorCapturas(_c.obtener("caso_capturar"), _c.obtener("repo_inputs"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_comprension", lambda _c: ManejadorComprension(_c.obtener("caso_comprender"), _c.obtener("repo_inputs"), _c.obtener("repo_comprensiones"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_disenos", lambda _c: ManejadorDisenos(_c.obtener("caso_disenar"), _c.obtener("repo_disenos"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
              )
              c2 = c2.replace(a_reg, nuevos_reg + a_reg)
              p2.write_text(c2, encoding="utf-8")
              print("service_registry.py ACTUALIZADO: 12 servicios de Fase 2")
          else:
              print("service_registry.py: ya contenia Fase 2")
          PYANCHOR
          echo "apps/laboratorio/infrastructure/api/app.py|ACTUALIZADO" >> "$MANIFEST"
          echo "apps/laboratorio/registry/services/service_registry.py|ACTUALIZADO" >> "$MANIFEST"
          echo "=== ENUM NUEVO ==="
          escribir apps/laboratorio/shared/enums/input_kind.py << 'ZYRA_EOF'
          """Tipos de entrada de captura (etapas DESCRIBIR a IMPORTAR)."""
          from enum import Enum


          class InputKind(str, Enum):
              TEXTO = "texto"
              FOTO = "foto"
              ESCANEO = "escaneo"
              MEDICION = "medicion"
              IMPORTACION = "importacion"

              @classmethod
              def validar(cls, valor: str) -> "InputKind":
                  if not isinstance(valor, str):
                      raise ValueError("El tipo de entrada debe ser texto.")
                  limpio = valor.strip().lower()
                  try:
                      return cls(limpio)
                  except ValueError:
                      validos = ", ".join(t.value for t in cls)
                      raise ValueError("Entrada invalida: " + repr(valor) + ". Validas: " + validos)
          ZYRA_EOF
          echo "=== DOMINIO FASE 2 (3) ==="
          escribir apps/laboratorio/domain/input_capture.py << 'ZYRA_EOF'
          """Entrada de captura: cualquier material que alimenta un proyecto.

          Produccion real: el texto se guarda integro; la foto/escaneo llega
          en base64, se decodifica y se sella con SHA-256 (integridad ZYRA).
          """
          import base64
          import binascii
          from dataclasses import dataclass

          from apps.laboratorio.shared.enums.input_kind import InputKind
          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          MAX_BYTES_FOTO = 5 * 1024 * 1024
          MIN_TEXTO = 20
          MAX_TEXTO = 200000


          @dataclass
          class EntradaCaptura(EntidadBase):
              """Material capturado para un proyecto."""

              prefijo_id = "inp"

              proyecto_id: Identificador = None
              tipo: InputKind = InputKind.TEXTO
              titulo: str = ""
              contenido: str = ""
              hash_sha256: str = ""
              tamano_bytes: int = 0

              def __post_init__(self):
                  if self.proyecto_id is None:
                      raise ValueError("La entrada requiere el id de su proyecto.")
                  if not self.titulo.strip():
                      raise ValueError("La entrada requiere titulo.")
                  self.titulo = self.titulo.strip()

              @classmethod
              def desde_texto(cls, id_ent, proyecto_id, titulo, texto):
                  if not isinstance(texto, str) or not texto.strip():
                      raise ValueError("El texto de la entrada esta vacio.")
                  limpio = texto.strip()
                  if len(limpio) < MIN_TEXTO:
                      raise ValueError("Entrada demasiado corta (min " + str(MIN_TEXTO) + " caracteres).")
                  if len(limpio) > MAX_TEXTO:
                      raise ValueError("Entrada demasiado larga (max " + str(MAX_TEXTO) + " caracteres).")
                  from apps.laboratorio.shared.helpers.hashing import sha256_texto
                  return cls(
                      id=id_ent, proyecto_id=proyecto_id, tipo=InputKind.TEXTO,
                      titulo=titulo, contenido=limpio,
                      hash_sha256=sha256_texto(limpio), tamano_bytes=len(limpio.encode("utf-8")),
                  )

              @classmethod
              def desde_base64(cls, id_ent, proyecto_id, titulo, datos_b64, tipo=InputKind.FOTO):
                  if not isinstance(datos_b64, str) or not datos_b64.strip():
                      raise ValueError("Los datos base64 estan vacios.")
                  crudo = datos_b64.strip()
                  if "," in crudo and crudo.startswith("data:"):
                      crudo = crudo.split(",", 1)[1]
                  try:
                      binario = base64.b64decode(crudo, validate=True)
                  except (binascii.Error, ValueError) as exc:
                      raise ValueError("Base64 invalido.") from exc
                  if not binario:
                      raise ValueError("Los datos decodificados estan vacios.")
                  if len(binario) > MAX_BYTES_FOTO:
                      raise ValueError("La imagen excede el maximo de 5 MB.")
                  from apps.laboratorio.shared.helpers.hashing import sha256_bytes
                  import base64 as b64
                  return cls(
                      id=id_ent, proyecto_id=proyecto_id, tipo=tipo,
                      titulo=titulo, contenido=b64.b64encode(binario).decode("ascii"),
                      hash_sha256=sha256_bytes(binario), tamano_bytes=len(binario),
                  )
          ZYRA_EOF
          escribir apps/laboratorio/domain/understanding.py << 'ZYRA_EOF'
          """Comprension: resultado real de analizar una entrada.

          Los hallazgos declaran su certeza (estandar ZYRA): evidencia
          encontrada para coincidencias literales, inferencia para
          deducciones. Nunca se inventa: cada hallazgo lleva razon.
          """
          from dataclasses import dataclass, field
          from typing import Dict, List

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador


          @dataclass
          class Comprension(EntidadBase):
              """Analisis real de una entrada capturada."""

              prefijo_id = "und"

              entrada_id: Identificador = None
              proyecto_id: Identificador = None
              resumen: str = ""
              hallazgos: List[Dict[str, str]] = field(default_factory=list)
              entidades: Dict[str, list] = field(default_factory=dict)
              dominio: str = ""
              confianza: float = 0.0

              def __post_init__(self):
                  if self.entrada_id is None or self.proyecto_id is None:
                      raise ValueError("La comprension requiere entrada_id y proyecto_id.")
                  if not 0.0 <= float(self.confianza) <= 1.0:
                      raise ValueError("La confianza debe estar entre 0.0 y 1.0.")
                  self.resumen = str(self.resumen)[:300]

              @property
              def total_hallazgos(self) -> int:
                  return len(self.hallazgos)
          ZYRA_EOF
          escribir apps/laboratorio/domain/design.py << 'ZYRA_EOF'
          """Blueprint de diseno: la estructura antes de crear la escena.

          Un blueprint declara componentes con nombre, tipo y requisitos.
          Regla de produccion: un blueprint sin componentes no se guarda.
          """
          from dataclasses import dataclass, field
          from typing import List

          from apps.laboratorio.shared.enums.creation_type import CreationType
          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador


          @dataclass
          class Blueprint(EntidadBase):
              """Diseno estructural de un proyecto."""

              prefijo_id = "dsn"

              proyecto_id: Identificador = None
              nombre: str = ""
              tipo_creacion: CreationType = CreationType.PRESENTACION
              componentes: List[dict] = field(default_factory=list)

              def __post_init__(self):
                  if self.proyecto_id is None:
                      raise ValueError("El blueprint requiere el id de su proyecto.")
                  if not self.nombre.strip():
                      raise ValueError("El blueprint requiere nombre.")
                  self.nombre = self.nombre.strip()

              def agregar_componente(self, nombre: str, tipo: str, requisitos: str = "") -> None:
                  if not nombre or not nombre.strip():
                      raise ValueError("El componente requiere nombre.")
                  if not tipo or not tipo.strip():
                      raise ValueError("El componente requiere tipo.")
                  self.componentes.append({
                      "nombre": nombre.strip()[:120],
                      "tipo": tipo.strip()[:60],
                      "requisitos": (requisitos or "").strip()[:500],
                  })
                  self.marcar_actualizacion()

              @property
              def es_valido(self) -> bool:
                  return len(self.componentes) > 0 and all(
                      c.get("nombre") and c.get("tipo") for c in self.componentes
                  )
          ZYRA_EOF
          echo "=== BASE DE DATOS V2 (reemplazo verificado) ==="
          reemplazar_verificado apps/laboratorio/infrastructure/database/tables.py "CREATE TABLE IF NOT EXISTS lab_projects (" << 'ZYRA_EOF'
