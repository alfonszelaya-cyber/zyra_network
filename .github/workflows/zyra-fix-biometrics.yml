name: "ZYRA EX FINAL - todo lo faltante en una corrida (verificado, verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  completo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: simulation_engine.py completo (MotorEvolucionReal + GemeloVivo)
        run: |
          cat > apps/laboratorio/infrastructure/providers/simulation_engine.py <<'SIM_EOF'
          """Motor de evolucion + GEMELO DIGITAL EN VIVO."""
          from apps.laboratorio.domain.scenario import Escenario

          TIPOS_FUENTE = ("sensor", "api", "csv", "manual")


          class MotorEvolucionReal:
              EFICIENCIA_ANUAL = 0.02
              RIESGO_ANUAL = 0.01

              def capacidades(self) -> dict:
                  return {"horizonte_anios": (1, 30), "crecimiento_pct": (-50, 200),
                          "modelo": "beneficio crece - costo mejora 2pct anual - riesgo +1pct anual"}

              def ejecutar(self, escenario, horizonte_anios, crecimiento_pct) -> dict:
                  if not isinstance(escenario, Escenario):
                      raise ValueError("Se esperaba un Escenario.")
                  if not (1 <= int(horizonte_anios) <= 30):
                      raise ValueError("horizonte_anios fuera de rango 1-30.")
                  if not (-50.0 <= float(crecimiento_pct) <= 200.0):
                      raise ValueError("crecimiento_pct fuera de rango -50 a 200.")
                  for clave in ("costo", "beneficio", "riesgo"):
                      if clave not in escenario.parametros:
                          raise ValueError("El escenario requiere el parametro " + clave)
                  costo0 = float(escenario.parametros["costo"])
                  beneficio0 = float(escenario.parametros["beneficio"])
                  riesgo0 = float(escenario.parametros["riesgo"])
                  factor_b = 1.0 + float(crecimiento_pct) / 100.0
                  serie = []
                  sum_b = 0.0
                  sum_c = 0.0
                  equilibrio = 0
                  for i in range(int(horizonte_anios) + 1):
                      beneficio = beneficio0 * (factor_b ** i)
                      costo = costo0 * ((1.0 - self.EFICIENCIA_ANUAL) ** i)
                      riesgo = min(100.0, riesgo0 * (1.0 + self.RIESGO_ANUAL * i))
                      puntaje = min(100.0, 0.4 * (100.0 - costo) + 0.4 * beneficio + 0.2 * (100.0 - riesgo))
                      if i >= 1:
                          sum_b += beneficio
                          sum_c += costo
                          if equilibrio == 0 and beneficio > costo:
                              equilibrio = i
                      serie.append({"anio": i, "costo": round(costo, 4), "beneficio": round(beneficio, 4),
                                    "riesgo": round(riesgo, 4), "puntaje": round(puntaje, 4)})
                  roi = round((sum_b - sum_c) / sum_c * 100.0, 2) if sum_c > 0 else 0.0
                  ini = serie[0]["puntaje"]
                  fin = serie[-1]["puntaje"]
                  tendencia = "creciente" if fin > ini * 1.01 else ("decreciente" if fin < ini * 0.99 else "estable")
                  return {"serie": serie, "metricas": {
                      "punto_equilibrio_anio": equilibrio, "roi_pct": roi,
                      "puntaje_inicial": ini, "puntaje_final": fin, "tendencia": tendencia}}


          class GemeloVivo:
              """Gemelo digital en vivo: fuentes reales -> estado -> alertas honestas."""

              def __init__(self):
                  self._fuentes = {}
                  self._historico = {}
                  self._actualizaciones = 0

              def capacidades(self) -> dict:
                  return {"tipos_fuente": TIPOS_FUENTE,
                          "salidas": ("estado", "delta", "alertas_por_umbral", "historico")}

              def registrar_fuente(self, id_fuente, tipo, valor, umbral_alto=None, umbral_bajo=None, etiqueta="") -> dict:
                  id_limpio = str(id_fuente or "").strip()
                  if not id_limpio:
                      raise ValueError("id_fuente requerido.")
                  if tipo not in TIPOS_FUENTE:
                      raise ValueError("tipo desconocido: " + repr(tipo) + ". Validos: " + ", ".join(TIPOS_FUENTE))
                  if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                      raise ValueError("valor inicial debe ser numerico.")
                  fuente = {"id": id_limpio, "tipo": tipo, "valor": float(valor), "anterior": float(valor),
                            "umbral_alto": None, "umbral_bajo": None, "etiqueta": str(etiqueta or "")[:80],
                            "actualizaciones": 0}
                  if umbral_alto is not None:
                      if isinstance(umbral_alto, bool) or not isinstance(umbral_alto, (int, float)):
                          raise ValueError("umbral_alto debe ser numerico.")
                      fuente["umbral_alto"] = float(umbral_alto)
                  if umbral_bajo is not None:
                      if isinstance(umbral_bajo, bool) or not isinstance(umbral_bajo, (int, float)):
                          raise ValueError("umbral_bajo debe ser numerico.")
                      fuente["umbral_bajo"] = float(umbral_bajo)
                  if (fuente["umbral_alto"] is not None and fuente["umbral_bajo"] is not None
                          and fuente["umbral_bajo"] >= fuente["umbral_alto"]):
                      raise ValueError("umbral_bajo debe ser menor que umbral_alto.")
                  self._fuentes[id_limpio] = fuente
                  self._historico[id_limpio] = [float(valor)]
                  return dict(fuente)

              def actualizar(self, id_fuente, valor) -> dict:
                  id_limpio = str(id_fuente or "").strip()
                  fuente = self._fuentes.get(id_limpio)
                  if fuente is None:
                      raise ValueError("Fuente no registrada: " + id_limpio)
                  if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                      raise ValueError("valor debe ser numerico.")
                  valor = float(valor)
                  anterior = fuente["valor"]
                  fuente["anterior"] = anterior
                  fuente["valor"] = valor
                  fuente["actualizaciones"] += 1
                  self._actualizaciones += 1
                  historico = self._historico.setdefault(id_limpio, [])
                  historico.append(valor)
                  if len(historico) > 500:
                      del historico[:-500]
                  alertas = []
                  if fuente["umbral_alto"] is not None and valor > fuente["umbral_alto"]:
                      alertas.append({"tipo": "umbral_alto_superado", "valor": valor,
                                      "umbral": fuente["umbral_alto"], "exceso": round(valor - fuente["umbral_alto"], 6)})
                  if fuente["umbral_bajo"] is not None and valor < fuente["umbral_bajo"]:
                      alertas.append({"tipo": "umbral_bajo_superado", "valor": valor,
                                      "umbral": fuente["umbral_bajo"], "deficit": round(fuente["umbral_bajo"] - valor, 6)})
                  return {"id": id_limpio, "valor_anterior": anterior, "valor_nuevo": valor,
                          "delta": round(valor - anterior, 6), "alertas": alertas,
                          "actualizaciones": self._actualizaciones}

              def estado(self) -> dict:
                  fuentes = []
                  for id_ in sorted(self._fuentes):
                      fuente = dict(self._fuentes[id_])
                      fuente["ultimo_delta"] = round(fuente["valor"] - fuente["anterior"], 6)
                      fuentes.append(fuente)
                  return {"fuentes": fuentes, "total_fuentes": len(fuentes),
                          "actualizaciones_totales": self._actualizaciones,
                          "historico_puntos": sum(len(v) for v in self._historico.values())}

              def historico(self, id_fuente, limite=50) -> dict:
                  id_limpio = str(id_fuente or "").strip()
                  if id_limpio not in self._fuentes:
                      raise ValueError("Fuente no registrada: " + id_limpio)
                  serie = list(self._historico.get(id_limpio, []))
                  return {"id": id_limpio, "puntos": len(serie), "valores": serie[-int(limite):]}
          SIM_EOF

      - name: presentation_remote.py (con TODOS los fixes dentro)
        run: |
          cat > apps/laboratorio/infrastructure/providers/presentation_remote.py <<'PR_EOF'
          """PRESENTACION HOLOGRAFICA INTERACTIVA.

          Proyeccion (HDMI/UDP/web por salida universal) e INDEPENDIENTE del
          control (telefono/PC/tablet por navegador). El telefono es el
          tactil: tocas el punto a explicar y queda anotado en la proyeccion.
          """
          import time

          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.hologram_engine import MotorHolograma
          from apps.laboratorio.shared.models.identifiers import nuevo_id

          ACCIONES_VALIDAS = ("avanzar", "retroceder", "ir_a", "tocar_punto", "finalizar")


          def _escapar(texto):
              return str(texto).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


          def _escena_para_holograma(nombre):
              try:
                  return Escena3D(nombre=nombre, ancho=900, alto=700, objetos=[])
              except TypeError:
                  try:
                      return Escena3D(nombre, 900, 700, [])
                  except Exception:
                      esc = Escena3D.__new__(Escena3D)
                      for atributo, valor in (("nombre", nombre), ("ancho", 900), ("alto", 700), ("objetos", [])):
                          setattr(esc, atributo, valor)
                      return esc


          class SesionPresentacion:
              def __init__(self, id_sesion, presentacion, proyector):
                  self.id = str(id_sesion)
                  self._presentacion = presentacion
                  self._proyector = proyector
                  self._holograma = MotorHolograma()
                  self.paso_actual = 0
                  self.activa = True
                  self.anotaciones = []
                  self.historial = []
                  self.iniciada_en = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

              def _pasos(self):
                  return list(getattr(self._presentacion, "pasos", []) or [])

              def total_pasos(self):
                  return len(self._pasos())

              def _registrar(self, accion, detalle):
                  entrada = {"accion": str(accion), "detalle": dict(detalle or {}),
                             "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
                  self.historial.append(entrada)
                  return entrada

              def _paso_datos(self):
                  pasos = self._pasos()
                  if not pasos:
                      return {"indice": 0, "total": 0, "titulo": "", "contenido": ""}
                  paso = pasos[min(self.paso_actual, len(pasos) - 1)]
                  try:
                      datos = paso.a_dict() if hasattr(paso, "a_dict") else dict(paso)
                  except Exception:
                      datos = {"titulo": str(getattr(paso, "titulo", ""))}
                  datos["indice"] = self.paso_actual
                  datos["total"] = len(pasos)
                  return datos

              def avanzar(self):
                  total = self.total_pasos()
                  if self.paso_actual < total - 1:
                      self.paso_actual += 1
                  self._registrar("avanzar", {"paso": self.paso_actual})
                  return {"paso": self.paso_actual, "total": total}

              def retroceder(self):
                  if self.paso_actual > 0:
                      self.paso_actual -= 1
                  self._registrar("retroceder", {"paso": self.paso_actual})
                  return {"paso": self.paso_actual, "total": self.total_pasos()}

              def ir_a(self, indice):
                  indice = int(indice)
                  total = self.total_pasos()
                  if not 0 <= indice < total:
                      raise ValueError("indice fuera de rango 0.." + str(total - 1))
                  self.paso_actual = indice
                  self._registrar("ir_a", {"paso": indice})
                  return {"paso": self.paso_actual, "total": total}

              def tocar_punto(self, x, y, etiqueta=""):
                  xv = float(x)
                  yv = float(y)
                  if xv < 0 or yv < 0:
                      raise ValueError("coordenadas no pueden ser negativas.")
                  anotacion = {"id": "anot-" + str(len(self.anotaciones) + 1).zfill(4),
                               "paso": self.paso_actual, "x": round(xv, 2), "y": round(yv, 2),
                               "etiqueta": str(etiqueta or "")[:200],
                               "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
                  self.anotaciones.append(anotacion)
                  self._registrar("tocar_punto", {"paso": self.paso_actual, "x": anotacion["x"], "y": anotacion["y"]})
                  return dict(anotacion)

              def anotaciones_del_paso(self, indice=None):
                  indice = self.paso_actual if indice is None else int(indice)
                  return [dict(a) for a in self.anotaciones if a["paso"] == indice]

              def frame_holograma(self):
                  paso = self._paso_datos()
                  titulo = str(paso.get("titulo", "") or ("Paso " + str(paso["indice"] + 1)))
                  svg = self._holograma.generar(_escena_para_holograma(titulo)).decode("utf-8")
                  texto = str(paso.get("contenido", "") or paso.get("descripcion", "") or "")
                  marcas = []
                  if texto:
                      y = 60
                      for i in range(0, min(len(texto), 240), 60):
                          marcas.append('<text x="24" y="' + str(y) + '" fill="#E2E8F0" font-size="16" font-family="sans-serif">' + _escapar(texto[i:i + 60]) + "</text>")
                          y += 24
                  for a in self.anotaciones_del_paso():
                      marcas.append('<circle cx="' + str(a["x"]) + '" cy="' + str(a["y"]) + '" r="10" fill="none" stroke="#F59E0B" stroke-width="3"><animate attributeName="r" values="6;14;6" dur="1.6s" repeatCount="indefinite"/></circle>')
                  if marcas and "</svg>" in svg:
                      svg = svg.replace("</svg>", "".join(marcas) + "</svg>", 1)
                  return svg.encode("utf-8")

              def estado(self):
                  return {"sesion": str(self.id), "activa": self.activa, "paso_actual": self.paso_actual,
                          "total_pasos": self.total_pasos(), "anotaciones_total": len(self.anotaciones),
                          "anotaciones_paso": self.anotaciones_del_paso(), "iniciada_en": self.iniciada_en,
                          "paso": self._paso_datos()}

              def finalizar(self):
                  self.activa = False
                  self._registrar("finalizar", {"anotaciones": len(self.anotaciones)})
                  return {"sesion": str(self.id), "duracion_pasos": self.total_pasos(),
                          "anotaciones": len(self.anotaciones), "historial": list(self.historial)}


          class PresentacionRemota:
              def __init__(self, repo_presentaciones, proyector):
                  self._repo = repo_presentaciones
                  self._proyector = proyector
                  self._sesiones = {}

              def capacidades(self):
                  return {"control": ("telefono", "pc", "tablet"), "acciones": ACCIONES_VALIDAS,
                          "proyeccion": "MotorHolo3D salida universal (independiente del control)",
                          "tactil": "el navegador de control es el tactil"}

              def crear_sesion(self, presentacion_id):
                  id_limpio = str(presentacion_id or "").strip()
                  if not id_limpio:
                      raise ValueError("presentacion_id requerido.")
                  presentacion = self._repo.obtener_exigir(id_limpio)
                  id_sesion = str(nuevo_id("ses"))
                  sesion = SesionPresentacion(id_sesion, presentacion, self._proyector)
                  self._sesiones[id_sesion] = sesion
                  return {"sesion": id_sesion, "presentacion": id_limpio,
                          "total_pasos": sesion.total_pasos(),
                          "vista_control": "/laboratorio/api/v1/presentations/remote/" + id_sesion + "/view"}

              def sesion(self, id_sesion):
                  sesion = self._sesiones.get(str(id_sesion or "").strip())
                  if sesion is None:
                      raise ValueError("Sesion desconocida: " + str(id_sesion))
                  return sesion

              def listar_sesiones(self):
                  return {"activas": [{"sesion": str(sid), "paso": s.paso_actual, "total": s.total_pasos()}
                                       for sid, s in sorted(self._sesiones.items()) if s.activa],
                          "total": len(self._sesiones)}

              def proyectar_paso_actual(self, id_sesion):
                  sesion = self.sesion(id_sesion)
                  frame = sesion.frame_holograma()
                  canal = "web-sesion-" + str(sesion.id)
                  if not any(d.get("nombre") == canal
                             for d in self._proyector.listar_destinos().get("destinos", [])):
                      self._proyector.registrar_destino("web", "", canal)
                  entrega = self._proyector.presentar(frame, {})
                  return {"sesion": str(sesion.id), "paso": sesion.paso_actual, "proyeccion": entrega}
          PR_EOF

      - name: citizens_engine.py + physics_engine.py (nuevos, verificados contra inventario)
        run: |
          cat > apps/laboratorio/infrastructure/providers/citizens_engine.py <<'CIT_EOF'
          """Motor de CIUDADANOS SIMULADOS para gemelos digitales.

          Origenes reales: descripcion, foto (colores via MotorAvatar),
          escaneo (puntos del scanner). Comportamiento determinista:
          agenda, aglomeraciones por densidad, evacuacion a salidas.
          """
          import math

          CELULA = 50.0
          UMBRAL_AGLO = 6
          VEL_DEFECTO = 1.4
          ESTADOS = ("en_ruta", "en_punto", "evacuando")


          def _num(v, n):
              if isinstance(v, bool) or not isinstance(v, (int, float)):
                  raise ValueError(n + " debe ser numerico.")
              return float(v)


          class Ciudadano:
              __slots__ = ("id", "nombre", "rol", "x", "y", "velocidad", "agenda",
                           "indice", "estado", "color")

              def __init__(self, id_c, nombre, rol, x, y, velocidad, agenda, color="#38BDF8"):
                  self.id = str(id_c)
                  self.nombre = str(nombre)[:80]
                  self.rol = str(rol)[:40]
                  self.x = _num(x, "x")
                  self.y = _num(y, "y")
                  if velocidad <= 0:
                      raise ValueError("velocidad debe ser positiva.")
                  self.velocidad = float(velocidad)
                  if not agenda:
                      raise ValueError("agenda requiere al menos un punto.")
                  self.agenda = [(_num(p[0], "ax"), _num(p[1], "ay")) for p in agenda]
                  self.indice = 0
                  self.estado = "en_ruta"
                  self.color = str(color)[:7]

              def a_dict(self):
                  return {"id": self.id, "nombre": self.nombre, "rol": self.rol,
                          "x": round(self.x, 3), "y": round(self.y, 3),
                          "velocidad": self.velocidad, "estado": self.estado,
                          "destino": list(self.agenda[self.indice]), "color": self.color}


          class MotorCiudadanos:
              def __init__(self):
                  self._todos = []
                  self._salidas = []
                  self._tiempo = 0.0

              def capacidades(self) -> dict:
                  return {"origenes": ("descripcion", "foto", "escaneo"),
                          "estados": ESTADOS,
                          "deteccion": ("aglomeraciones", "evacuacion", "densidad"),
                          "uso": "gemelo digital de parques, ciudades, edificios, videojuegos"}

              def poblar(self, ciudadanos, salidas=None) -> dict:
                  if not isinstance(ciudadanos, list) or not ciudadanos:
                      raise ValueError("ciudadanos requiere lista con al menos 1.")
                  self._todos = []
                  self._salidas = [(_num(s[0], "sx"), _num(s[1], "sy")) for s in (salidas or [])]
                  self._tiempo = 0.0
                  for i, esp in enumerate(ciudadanos):
                      if not isinstance(esp, dict):
                          raise ValueError("ciudadanos[" + str(i) + "] debe ser objeto.")
                      origen = str(esp.get("origen", "descripcion")).strip()
                      if origen == "descripcion":
                          nombre = str(esp.get("nombre", "")).strip()
                          if not nombre:
                              raise ValueError("descripcion requiere nombre.")
                          rol = str(esp.get("rol", "peaton"))
                          color = str(esp.get("color", "#38BDF8"))
                      elif origen == "foto":
                          nombre = str(esp.get("nombre", "Foto-" + str(i + 1)))
                          rol = str(esp.get("rol", "peaton"))
                          color = str(esp.get("color_foto", esp.get("color", "#F59E0B")))
                      elif origen == "escaneo":
                          nombre = str(esp.get("nombre", "Escaneado-" + str(i + 1)))
                          rol = "visitante"
                          if not esp.get("puntos"):
                              raise ValueError("escaneo requiere puntos del scan real.")
                          color = "#EC4899"
                      else:
                          raise ValueError("origen desconocido: " + repr(origen))
                      x = _num(esp.get("x", 0.0), "x")
                      y = _num(esp.get("y", 0.0), "y")
                      vel = _num(esp.get("velocidad", VEL_DEFECTO), "velocidad")
                      agenda = esp.get("agenda") or [[x, y]]
                      self._todos.append(Ciudadano("cit-" + str(i + 1).zfill(5), nombre, rol, x, y, vel, agenda, color))
                  return {"poblacion": len(self._todos), "salidas": len(self._salidas)}

              def paso(self, dt=1.0) -> dict:
                  dt = _num(dt, "dt")
                  if dt <= 0 or dt > 10.0:
                      raise ValueError("dt debe estar entre 0 y 10.")
                  self._tiempo += dt
                  for c in self._todos:
                      dx = c.agenda[c.indice][0] - c.x
                      dy = c.agenda[c.indice][1] - c.y
                      dist = math.hypot(dx, dy)
                      if dist < 0.5:
                          c.indice = (c.indice + 1) % len(c.agenda)
                      else:
                          paso = min(c.velocidad * dt, dist)
                          c.x += dx / dist * paso
                          c.y += dy / dist * paso
                      if c.estado != "evacuando":
                          c.estado = "en_ruta"
                  return {"tiempo": round(self._tiempo, 3), "poblacion": len(self._todos),
                          "aglomeraciones": self._aglomeraciones()}

              def _aglomeraciones(self):
                  celdas = {}
                  for c in self._todos:
                      clave = (int(c.x // CELULA), int(c.y // CELULA))
                      celdas.setdefault(clave, []).append(c.id)
                  return [{"celda": list(k), "cantidad": len(v), "ciudadanos": v[:20]}
                          for k, v in sorted(celdas.items()) if len(v) >= UMBRAL_AGLO]

              def evacuar(self) -> dict:
                  if not self._salidas:
                      raise ValueError("evacuar requiere salidas definidas en poblar.")
                  for c in self._todos:
                      mejor = min(self._salidas, key=lambda s: math.hypot(s[0] - c.x, s[1] - c.y))
                      c.agenda = [mejor]
                      c.indice = 0
                      c.estado = "evacuando"
                      c.velocidad = c.velocidad * 1.6
                  return {"evacuando": len(self._todos), "salidas": len(self._salidas)}

              def estado_poblacion(self) -> dict:
                  return {"tiempo": round(self._tiempo, 3), "poblacion": len(self._todos),
                          "ciudadanos": [c.a_dict() for c in self._todos[:200]],
                          "salidas": [list(s) for s in self._salidas]}

              def total(self) -> int:
                  return len(self._todos)
          CIT_EOF
          cat > apps/laboratorio/infrastructure/providers/physics_engine.py <<'FIS_EOF'
          """Motor FISICO real: gravedad, velocidad, colisiones AABB con rebote."""
          GRAVEDAD_DEFECTO = 9.81
          MAX_CUERPOS = 2000


          class Cuerpo:
              __slots__ = ("id", "x", "y", "w", "h", "vx", "vy", "masa", "rebote")

              def __init__(self, id_c, x, y, w, h, masa=1.0, rebote=0.5):
                  self.id = str(id_c)
                  self.x = float(x)
                  self.y = float(y)
                  self.w = float(w)
                  self.h = float(h)
                  if self.w <= 0 or self.h <= 0:
                      raise ValueError("dimensiones deben ser positivas.")
                  self.vx = 0.0
                  self.vy = 0.0
                  self.masa = float(masa)
                  if self.masa <= 0:
                      raise ValueError("masa debe ser positiva.")
                  self.rebote = float(rebote)
                  if not 0.0 <= self.rebote <= 1.0:
                      raise ValueError("rebote entre 0 y 1.")

              def a_dict(self):
                  return {"id": self.id, "x": round(self.x, 3), "y": round(self.y, 3),
                          "w": self.w, "h": self.h, "vx": round(self.vx, 3),
                          "vy": round(self.vy, 3), "masa": self.masa, "rebote": self.rebote}


          class MotorFisico:
              def __init__(self, gravedad=GRAVEDAD_DEFECTO, friccion=0.02):
                  self._g = float(gravedad)
                  if self._g < 0:
                      raise ValueError("gravedad no puede ser negativa.")
                  self._fric = float(friccion)
                  if not 0.0 <= self._fric <= 1.0:
                      raise ValueError("friccion entre 0 y 1.")
                  self._cuerpos = []
                  self._t = 0.0

              def capacidades(self) -> dict:
                  return {"integracion": "Euler semi-implicito dt fijo",
                          "gravedad": self._g, "colisiones": "AABB con rebote",
                          "determinista": True}

              def agregar(self, id_c, x, y, w, h, masa=1.0, rebote=0.5) -> dict:
                  if len(self._cuerpos) >= MAX_CUERPOS:
                      raise ValueError("maximo de cuerpos alcanzado.")
                  c = Cuerpo(id_c, x, y, w, h, masa, rebote)
                  self._cuerpos.append(c)
                  return c.a_dict()

              def impulso(self, id_c, vx, vy) -> dict:
                  for c in self._cuerpos:
                      if c.id == str(id_c):
                          c.vx += float(vx)
                          c.vy += float(vy)
                          return c.a_dict()
                  raise ValueError("Cuerpo desconocido: " + str(id_c))

              @staticmethod
              def _toca(a, b):
                  return not (a.x + a.w <= b.x or b.x + b.w <= a.x
                              or a.y + a.h <= b.y or b.y + b.h <= a.y)

              def _resolver(self, a, b):
                  sx = min(a.x + a.w - b.x, b.x + b.w - a.x)
                  sy = min(a.y + a.h - b.y, b.y + b.h - a.y)
                  mt = a.masa + b.masa
                  if sx < sy:
                      d = 1.0 if a.x < b.x else -1.0
                      corr = sx * (a.masa / mt)
                      a.x -= d * corr
                      b.x += d * (sx - corr)
                      vr = a.vx - b.vx
                      if (d > 0 and vr > 0) or (d < 0 and vr < 0):
                          e = min(a.rebote, b.rebote)
                          imp = -(1.0 + e) * vr / (1.0 / a.masa + 1.0 / b.masa)
                          a.vx += imp / a.masa
                          b.vx -= imp / b.masa
                      return {"par": [a.id, b.id], "normal": "x"}
                  d = 1.0 if a.y < b.y else -1.0
                  corr = sy * (a.masa / mt)
                  a.y -= d * corr
                  b.y += d * (sy - corr)
                  vr = a.vy - b.vy
                  if (d > 0 and vr > 0) or (d < 0 and vr < 0):
                      e = min(a.rebote, b.rebote)
                      imp = -(1.0 + e) * vr / (1.0 / a.masa + 1.0 / b.masa)
                      a.vy += imp / a.masa
                      b.vy -= imp / b.masa
                  return {"par": [a.id, b.id], "normal": "y"}

              def paso(self, dt=0.016) -> dict:
                  dt = float(dt)
                  if dt <= 0 or dt > 0.1:
                      raise ValueError("dt debe estar entre 0 y 0.1.")
                  self._t += dt
                  for c in self._cuerpos:
                      c.vy += self._g * dt
                      f = max(0.0, 1.0 - self._fric * dt)
                      c.vx *= f
                      c.vy *= f
                      c.x += c.vx * dt
                      c.y += c.vy * dt
                  colisiones = []
                  n = len(self._cuerpos)
                  for i in range(n):
                      for j in range(i + 1, n):
                          a, b = self._cuerpos[i], self._cuerpos[j]
                          if self._toca(a, b):
                              colisiones.append(self._resolver(a, b))
                  return {"tiempo": round(self._t, 4), "cuerpos": n,
                          "colisiones": colisiones[:50], "total_colisiones": len(colisiones)}

              def estado(self) -> dict:
                  return {"tiempo": round(self._t, 4), "gravedad": self._g,
                          "friccion": self._fric,
                          "cuerpos": [c.a_dict() for c in self._cuerpos[:200]]}
          FIS_EOF

