name: "AGRO RUN F v4: ecosistema completo (zyra_link+server+matrix+tests) con verificacion dura"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - zyra_link completo si falta (idempotente)"
        run: |
          python3 -c "
          import apps.agro.services.zyra_link as zl
          assert hasattr(zl, 'emit_event_db') and hasattr(zl.ZyraLink, 'network_status')
          print('OK zyra_link ya completo (commit v3)')
          " 2>/dev/null || python3 - <<'FIXEOF'
          print("zyra_link incompleto: aplicando reescritura...")
          import textwrap
          from pathlib import Path
          p = Path("apps/agro/services/zyra_link.py")
          print("VER la v3 - si esto aparece, ejecutar v3 primero")
          raise SystemExit(1)
          FIXEOF

      - name: "Paso 2 - matrix: network.emit (append verificable)"
        run: |
          python3 - <<'MXEOF'
          import textwrap
          from pathlib import Path
          p = Path("apps/agro/security/operation_matrix.py")
          t = p.read_text(encoding="utf-8")
          if '"network.emit"' in t:
              print("SKIP matrix")
          else:
              extra = textwrap.dedent('''

                  # ---- additive RUN F: ops ecosistema ----
                  OPERATIONS.update({
                      "network.emit": (
                          PRODUCER, COMPANY, GOVERNMENT,
                          OPERATOR, ADMINISTRATOR,
                      ),
                  })
              ''')
              t = t.rstrip("\n") + "\n" + extra
              compile(t, str(p), "exec")
              p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert '"network.emit"' in escrito, "matrix no aterrizo"
          print("OK matrix verificada en disco")
          MXEOF

      - name: "Paso 3 - server: helper + GET + POST + guardia (append verificable)"
        run: |
          python3 - <<'SRVEOF'
          from pathlib import Path

          sp = Path("apps/agro/server.py")
          t = sp.read_text(encoding="utf-8")

          if "_ZYRA_COM_D" not in t:
              anchor_post = "    def _post(self, s: list[str]) -> None:\n"
              assert anchor_post in t, "ancla _post"
              t = t.replace(anchor_post,
                  "    def _ZYRA_COM_D(self, dotted, fn_name):\n"
                  "        mod = __import__(\n"
                  "            dotted, fromlist=[fn_name]\n"
                  "        )\n"
                  "        return getattr(mod, fn_name)\n"
                  "\n", 1)

          if 'if s == ["network", "status"]:' not in t:
              anchor_home = "        if not s or s == [\"home\"]:\n"
              assert anchor_home in t, "ancla home"
              R = (
                  "        if s == [\"network\", \"status\"]:\n"
                  "            st_row = type(self).link.network_status()\n"
                  "            from apps.agro.services.zyra_link import (\n"
                  "                outbox_stats_db,\n"
                  "            )\n"
                  "            st_row[\"outbox\"] = outbox_stats_db(\n"
                  "                type(self).store._db\n"
                  "            )\n"
                  "            self._send(200, {\"ok\": True, \"data\": st_row})\n"
                  "            return\n"
                  "        if s == [\"network\", \"outbox\"]:\n"
                  "            from apps.agro.services.zyra_link import (\n"
                  "                outbox_pending_db,\n"
                  "            )\n"
                  "            rows = outbox_pending_db(\n"
                  "                type(self).store._db, limit=20\n"
                  "            )\n"
                  "            self._send(\n"
                  "                200,\n"
                  "                {\"ok\": True, \"data\": {\"pending\": rows}},\n"
                  "            )\n"
                  "            return\n"
              )
              t = t.replace(anchor_home, R + anchor_home, 1)

          if 'if s == ["network", "emit"]:' not in t:
              ancla = '        if s == ["sale", "publish"]:\n'
              assert ancla in t, "ancla sale/publish"
              P = (
                  "        if s == [\"network\", \"emit\"]:\n"
                  "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n"
                  "            zid = self._req(doc, \"zid\")\n"
                  "            et = self._req(doc, \"event_type\")\n"
                  "            payload = doc.get(\"payload\")\n"
                  "            if not isinstance(payload, dict):\n"
                  "                raise ValueError(\n"
                  "                    \"payload debe ser objeto\"\n"
                  "                )\n"
                  "            row = self._ZYRA_COM_D(\n"
                  "                \"apps.agro.services.zyra_link\",\n"
                  "                \"emit_event_db\",\n"
                  "            )(\n"
                  "                type(self).store._db,\n"
                  "                type(self).link,\n"
                  "                zid=zid,\n"
                  "                event_type=et,\n"
                  "                payload=payload,\n"
                  "            )\n"
                  "            self._send(200, {\"ok\": True, \"data\": row})\n"
                  "            return\n"
              )
              t = t.replace(ancla, P + ancla, 1)

          if '("network", "emit")' not in t:
              ancla_g = '            ("response", "update"): "response.update",\n'
              assert ancla_g in t, "ancla guardia"
              t = t.replace(
                  ancla_g,
                  ancla_g
                  + '            ("network", "emit"): "network.emit",\n',
                  1,
              )

          compile(t, str(sp), "exec")
          sp.write_text(t, encoding="utf-8")

          escrito = sp.read_text(encoding="utf-8")
          for req in (
              '("network", "emit"): "network.emit"',
              'if s == ["network", "status"]',
              'if s == ["network", "outbox"]',
              'if s == ["network", "emit"]',
              '"emit_event_db"',
          ):
              assert req in escrito, "server no aterrizo: " + req
          print("OK server: 5 referencias verificadas en disco")
          SRVEOF

      - name: "Paso 4 - tests RUN F (append verificable)"
        run: |
          python3 - <<'T3EOF'
          import textwrap
          from pathlib import Path

          p = Path("apps/agro/tests/test_agro_superapp.py")
          t = p.read_text(encoding="utf-8")
          if "test_ecosystem_contract_offline" in t:
              print("SKIP tests")
          else:
              EXTRA = textwrap.dedent('''\


                  # ====== RUN F: GPT-8 ecosistema ======


                  def test_ecosystem_contract_offline(
                      tmp_path: Path,
                  ) -> None:
                      dead = NetworkClient(
                          "http://127.0.0.1:1",
                          timeout_seconds=1.0,
                          max_retries=0,
                      )
                      srv = serve_agro(
                          AgroStore(
                              SQLiteAdapter(":memory:"),
                              FrozenClock(),
                          ),
                          dead,
                      )
                      threading.Thread(
                          target=srv.serve_forever,
                          daemon=True,
                      ).start()
                      time.sleep(0.4)
                      base = f"http://127.0.0.1:{srv.bound_port}"
                      pid = _register(base, "Karla Eco")

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": "ZID-x",
                              "event_type": "hack.borro",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 400, "desconocido 400"
                      assert "desconocido" in str(body)

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": "ZID-x",
                              "event_type":
                              "asset.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 400, "faltante 400"
                      assert "asset_id" in str(body)

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": "ZID-x",
                              "event_type":
                              "producer.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 200, str(body)
                      key = body["data"]["event_key"]
                      assert body["data"]["sent"] is False

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": "ZID-x",
                              "event_type":
                              "producer.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 200, str(body)
                      assert (
                          body["data"]["event_key"]
                          == key
                      )

                      st, body = _gjp(
                          base + "/agro/network/status"
                      )
                      d = body["data"]
                      assert d["reachable"] is False
                      assert d["catalog_events"] >= 12
                      assert d["outbox"]["total"] >= 1

                      st, body = _gjp(
                          base + "/agro/network/outbox"
                      )
                      pend = body["data"]["pending"]
                      assert len(pend) >= 1
                      assert pend[0]["attempts"] == 2


                  def test_ecosystem_to_network_online(
                      tmp_path: Path,
                  ) -> None:
                      net_db = SQLiteAdapter(
                          tmp_path / "net.db"
                      )
                      signer, _ = Ed25519Signer.generate()
                      kernel = ZyraKernel(
                          db=net_db,
                          clock=FrozenClock(),
                          signer=signer,
                          config=RuntimeConfig(
                              host="127.0.0.1",
                              port=0,
                              api_token=None,
                          ),
                      )
                      kernel.bootstrap_root()
                      kernel._biometrics = BiometricsEngine(
                          db=net_db,
                          clock=FrozenClock(),
                          audit=kernel.audit,
                          provider=(
                              DeterministicTestProvider()
                          ),
                          cipher=TemplateCipher(
                              master_key_hex="ab" * 32
                          ),
                          policy=BiometricsPolicy(
                              require_liveness=False,
                              doc_reject=0.01,
                              doc_review=0.02,
                              doc_auto=0.03,
                              dup_reject=0.98,
                          ),
                      )
                      caps = ZyraCapabilities(
                          net_db,
                          FrozenClock(),
                          identity=kernel.identity,
                          signer=signer,
                      )
                      net_srv = serve_combined(
                          kernel,
                          caps,
                          host="127.0.0.1",
                          port=0,
                      )
                      threading.Thread(
                          target=net_srv.serve_forever,
                          daemon=True,
                      ).start()
                      time.sleep(0.4)
                      net_base = (
                          "http://127.0.0.1:"
                          f"{net_srv.server_address[1]}"
                      )

                      client = NetworkClient(
                          net_base, max_retries=1
                      )
                      reg = ZyraLink(
                          client
                      ).register_app()
                      assert reg[0] is True, str(reg[2])

                      srv = serve_agro(
                          AgroStore(
                              SQLiteAdapter(":memory:"),
                              FrozenClock(),
                          ),
                          client,
                      )
                      threading.Thread(
                          target=srv.serve_forever,
                          daemon=True,
                      ).start()
                      time.sleep(0.4)
                      base = (
                          f"http://127.0.0.1:{srv.bound_port}"
                      )

                      st, body = _pj(
                          base + "/agro/producers",
                          {
                              "name": "Luis EnRed",
                              "producer_type":
                              "agricultor",
                              "location": "Chalatenango",
                              "doc_image_b64": _seed(
                                  "Luis EnRed"
                              ),
                              "selfie_image_b64": _seed(
                                  "Luis EnRed"
                              ),
                          },
                      )
                      assert st == 201, str(body)
                      pid = body["data"]["producer_id"]
                      zid = body["data"]["zid"]
                      assert zid.startswith("ZID-")

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": zid,
                              "event_type":
                              "producer.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 200, str(body)
                      assert (
                          body["data"]["sent"] is True
                      ), str(body)

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": zid,
                              "event_type":
                              "producer.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 200, str(body)
                      assert (
                          body["data"]["deduplicated"]
                          is True
                      ), "idempotencia"

                      st, body = _gjp(
                          base + "/agro/network/status"
                      )
                      d = body["data"]
                      assert d["reachable"] is True
                      assert d["outbox"]["by_status"][
                          "sent"
                      ] == 1

                      req = urllib.request.Request(
                          net_base + "/history/" + zid,
                          method="GET",
                      )
                      with urllib.request.urlopen(
                          req, timeout=10
                      ) as r:
                          hist = r.read().decode()
                      assert (
                          "producer.registered" in hist
                      ), "evento no visible en Red"
              ''')
              t = t.rstrip("\n") + "\n" + EXTRA
              compile(t, str(p), "exec")
              p.write_text(t, encoding="utf-8")

          escrito = p.read_text(encoding="utf-8")
          for req in (
              "test_ecosystem_contract_offline",
              "test_ecosystem_to_network_online",
          ):
              assert req in escrito, "tests no aterrizaron"
          print("OK tests RUN F verificados en disco")
          T3EOF

      - name: "Paso 5 - verificacion con interprete FRESCO de todo el paquete"
        run: |
          python3 -c "
          import apps.agro.services.zyra_link as zl
          assert hasattr(zl, 'emit_event_db')
          assert hasattr(zl.ZyraLink, 'network_status')
          assert len(zl.AGRO_EVENT_CATALOG) == 12
          from apps.agro.security.operation_matrix import OPERATIONS
          assert 'network.emit' in OPERATIONS
          print('OK import fresco: zyra_link + matrix completos')
          "

      - name: "Paso 6 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN F v4: ecosistema completo con verificacion dura" -m "Causa raiz hallada: los cambios de server/matrix/tests de la v1 nunca se committearon (gate los descarto junto con el fallo de zyra_link). Este run aplica el paquete completo: matrix network.emit, rutas GET status/outbox, POST emit con guardia, 2 tests offline+online; cada archivo verificado en disco + interprete fresco antes del GATE."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
