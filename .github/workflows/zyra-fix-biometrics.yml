name: "ZYRA: SEMILLA biometric enrollment"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-semilla
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Apply SEMILLA patches
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path


          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)


          def read_lines(p):
              f = Path(p)
              if not f.exists():
                  fail("file not found: " + p)
              return f.read_text(encoding="utf-8").splitlines(keepends=True)


          def to_text(lines):
              return "".join(lines)


          def leading(line):
              return line[: len(line) - len(line.lstrip())]


          def apply_block(lines, at, block):
              ind = leading(lines[at])
              new = [(ind + t + "\n") if t else "\n" for t in block]
              return lines[:at] + new + lines[at:]


          def insert_before_startswith(lines, pre, block, marker, path):
              if marker in to_text(lines):
                  print("SKIP (marker present):", path)
                  return lines
              idxs = [i for i, l in enumerate(lines) if l.strip().startswith(pre)]
              if len(idxs) != 1:
                  fail("anchor %r count %d (need 1) in %s" % (pre, len(idxs), path))
              print("INSERT before %r in %s" % (pre, path))
              return apply_block(lines, idxs[0], block)


          def find_seq(lines, seq):
              n = len(seq)
              hits = []
              for i in range(len(lines) - n + 1):
                  ok = True
                  for j in range(n):
                      if lines[i + j].strip() != seq[j]:
                          ok = False
                          break
                  if ok:
                      hits.append(i)
              return hits


          def replace_seq(lines, seq, block, marker, path):
              if marker in to_text(lines):
                  print("SKIP (marker present):", path)
                  return lines
              hits = find_seq(lines, seq)
              if len(hits) != 1:
                  fail("sequence count %d (need 1) in %s: starts %r" % (len(hits), path, seq[0]))
              print("REPLACE sequence in %s" % path)
              return apply_block(lines, hits[0], block)


          def insert_before_seq(lines, seq, block, marker, path):
              if marker in to_text(lines):
                  print("SKIP (marker present):", path)
                  return lines
              hits = find_seq(lines, seq)
              if len(hits) != 1:
                  fail("sequence count %d (need 1) in %s: starts %r" % (len(hits), path, seq[0]))
              print("INSERT before sequence in %s" % path)
              return apply_block(lines, hits[0], block)


          P_LINK = "apps/semilla/services/semilla_link.py"
          P_SRV = "apps/semilla/server.py"

          LINK_ADD = [
              "def enroll_person(",
              "    self,",
              "    *,",
              "    display_name: str,",
              "    doc_image_b64: str,",
              "    selfie_image_b64: str,",
              "    doc_kind: str | None = None,",
              "    doc_country: str | None = None,",
              "    doc_number: str | None = None,",
              ") -> tuple[bool, dict | None, str | None]:",
              "    payload: dict = {",
              '        "kind": "person",',
              '        "display_name": display_name,',
              '        "actor": "semilla",',
              '        "doc_image_b64": doc_image_b64,',
              '        "selfie_image_b64": selfie_image_b64,',
              "    }",
              "    if doc_kind:",
              '        payload["doc_kind"] = doc_kind',
              "    if doc_country:",
              '        payload["doc_country"] = doc_country',
              "    if doc_number:",
              '        payload["doc_number"] = doc_number',
              "    return self._client.post(",
              '        "/identity/enroll", payload',
              "    )",
              "",
              "",
              "def register_organization(",
              "    self, display_name: str,",
              ") -> tuple[bool, dict | None, str | None]:",
              "    return self._client.post(",
              '        "/identity/register",',
              "        {",
              '            "kind": "organization",',
              '            "display_name": display_name,',
              '            "actor": "semilla",',
              "        },",
              "    )",
              "",
              "",
          ]

          REG_SEQ = [
              "zid: str | None = None",
              'if role == "alumno":',
              "ok, data, _error = (",
              "link.register_person(",
              "name",
              ")",
              ")",
              "if (",
              "ok",
              "and data is not None",
              "):",
              "zid = str(",
              'data.get("zid")',
              ")",
              "link.record_milestone(",
              "zid,",
              '"inscripcion",',
              "name,",
              ")",
          ]

          REG_NEW = [
              "def _findz(obj):",
              "    if isinstance(obj, dict):",
              "        for k, v in obj.items():",
              "            if (",
              '                str(k).lower() == "zid"',
              "                and isinstance(v, str)",
              '                and v.startswith("ZID-")',
              "            ):",
              "                return v",
              "        for v in obj.values():",
              "            f2 = _findz(v)",
              "            if f2 is not None:",
              "                return f2",
              "    elif isinstance(obj, list):",
              "        for item in obj:",
              "            f2 = _findz(item)",
              "            if f2 is not None:",
              "                return f2",
              "    return None",
              "zid: str | None = None",
              'if role == "institucion":',
              "    ok, data, _error = (",
              "        link.register_organization(",
              "            name",
              "        )",
              "    )",
              "    if ok and data is not None:",
              "        zid = _findz(data)",
              "else:",
              "    doc_b64 = str(",
              '        doc.get("doc_image_b64") or ""',
              "    )",
              "    selfie_b64 = str(",
              '        doc.get("selfie_image_b64") or ""',
              "    )",
              "    if not doc_b64 or not selfie_b64:",
              "        self._html(",
              "            400,",
              "            _page(",
              '                "SEMILLA - Registro",',
              '                "<h1>Faltan las fotos</h1>"',
              '                "<p>Por ley el registro requiere"',
              '                " foto del documento y selfie"',
              '                " en vivo.</p>"',
              "                \"<a href='/semilla/home'>\"",
              '                "<button>Volver</button></a>",',
              "            ),",
              "        )",
              "        return",
              "    ok, data, _error = (",
              "        link.enroll_person(",
              "            display_name=name,",
              "            doc_image_b64=doc_b64,",
              "            selfie_image_b64=selfie_b64,",
              "        )",
              "    )",
              "    if not ok:",
              "        self._html(",
              "            400,",
              "            _page(",
              '                "SEMILLA - Registro rechazado",',
              '                "<h1>Registro rechazado</h1>"',
              '                "<p>" + str(_error) + "</p>"',
              "                \"<a href='/semilla/home'>\"",
              '                "<button>Volver</button></a>",',
              "            ),",
              "        )",
              "        return",
              "    if data is not None:",
              "        zid = _findz(data)",
              "    if zid is not None:",
              "        link.record_milestone(",
              "            zid,",
              '            "inscripcion",',
              "            name,",
              "        )",
              "",
          ]

          HOME_SEQ = [
              "self._html(",
              '200, _page("SEMILLA", body)',
              ")",
          ]

          JS = [
              "(function(){",
              "function hook(f){",
              "var doc=document.createElement('input');doc.type='file';doc.accept='image/*';doc.capture='environment';doc.style.width='100%';",
              "var slf=document.createElement('input');slf.type='file';slf.accept='image/*';slf.capture='user';slf.style.width='100%';",
              "var hidD=document.createElement('input');hidD.type='hidden';hidD.name='doc_image_b64';",
              "var hidS=document.createElement('input');hidS.type='hidden';hidS.name='selfie_image_b64';",
              "var st=document.createElement('p');st.textContent='Biometria (por ley): pendiente';",
              "function proc(file,h){if(!file){return;}var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,800/Math.max(im.width,im.height));var cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);h.value=cv.toDataURL('image/jpeg',0.72).split(',')[1];upd();};im.src=r.result;};r.readAsDataURL(file);}",
              "function upd(){st.textContent='Doc: '+(hidD.value?'OK':'falta')+' | Selfie: '+(hidS.value?'OK':'falta');}",
              "doc.addEventListener('change',function(){proc(doc.files[0],hidD);});",
              "slf.addEventListener('change',function(){proc(slf.files[0],hidS);});",
              "var fs=document.createElement('fieldset');",
              "var lg=document.createElement('legend');lg.textContent='Foto del documento y selfie (por ley)';",
              "fs.appendChild(lg);fs.appendChild(doc);fs.appendChild(document.createElement('br'));fs.appendChild(slf);",
              "f.insertBefore(fs,f.firstChild);f.appendChild(hidD);f.appendChild(hidS);f.appendChild(st);",
              "f.addEventListener('submit',function(ev){if(!hidD.value||!hidS.value){ev.preventDefault();st.textContent='Falta foto del documento o selfie.';}});",
              "}",
              "document.querySelectorAll('form').forEach(function(f){",
              "var r=f.querySelector('input[name=role]');",
              "if(r&&(r.value==='alumno'||r.value==='profesor')){hook(f);}",
              "});",
              "})();",
          ]

          HOME_ADD = (
              ["body = (", "    body", '    + "<script>"', '    + "/*semillaBiometria*/"']
              + ['    + "' + js + '"' for js in JS]
              + ['    + "</script>"', ")", ""]
          )

          link_src = read_lines(P_LINK)
          link_src = insert_before_startswith(
              link_src,
              "def complete_trust(",
              LINK_ADD,
              "def enroll_person",
              P_LINK,
          )

          srv_src = read_lines(P_SRV)
          srv_src = replace_seq(srv_src, REG_SEQ, REG_NEW, "link.enroll_person", P_SRV)
          srv_src = insert_before_seq(srv_src, HOME_SEQ, HOME_ADD, "semillaBiometria", P_SRV)

          compile(to_text(link_src), P_LINK, "exec")
          compile(to_text(srv_src), P_SRV, "exec")
          print("COMPILE CHECK OK")

          Path(P_LINK).write_text(to_text(link_src), encoding="utf-8")
          Path(P_SRV).write_text(to_text(srv_src), encoding="utf-8")
          print("WROTE: 2 files")

          for path, marker in (
              (P_LINK, "def enroll_person"),
              (P_LINK, "def register_organization"),
              (P_SRV, "link.enroll_person"),
              (P_SRV, "link.register_organization"),
              (P_SRV, "semillaBiometria"),
          ):
              if marker not in Path(path).read_text(encoding="utf-8"):
                  fail("post-check missing in %s: %s" % (path, marker))

          print("ALL PATCHES APPLIED OK")
          PYEOF

      - name: Syntax check
        run: |
          python3 -m py_compile apps/semilla/services/semilla_link.py apps/semilla/server.py
          echo "SYNTAX OK"

      - name: Network biometrics self-test
        run: python3 -m shared_engines.security.biometrics -v

      - name: SEMILLA tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/semilla/tests -q || true

      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add apps/semilla/services/semilla_link.py apps/semilla/server.py
          if git diff --cached --quiet; then
            echo "No changes (already patched)."
          else
            git commit -m "SEMILLA: biometric enrollment via /identity/enroll" -m "alumno+profesor now enroll with doc+selfie (profesores never had ZID before - fixed by law). institucion registers as organization (allowed). Nested zid extraction fixed. Home forms inject biometric capture."
            git push
          fi
