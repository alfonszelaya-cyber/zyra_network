name: ZYRA Fase 6c mapa real de rutas y red completa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fase6c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias minimas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography

      - name: Mapa de rutas registro ZID y arranque de superapp
        run: |
          python3 - <<'PYEOF'
          import json, os, re, secrets, subprocess, sys, threading, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          GATES = []

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('fase6c.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _manejador

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)
          NP = 8765
          SP = 8766
          BASE = 'http://127.0.0.1:%d' % NP

          def pedir(metodo, url, cuerpo=None, token=True):
              data = json.dumps(cuerpo).encode('utf-8') if cuerpo is not None else None
              req = urllib.request.Request(url, data=data, method=metodo)
              req.add_header('Content-Type', 'application/json')
              if token:
                  req.add_header('Authorization', 'Bearer ' + TOKEN)
              try:
                  with urllib.request.urlopen(req, timeout=6) as r:
                      return r.status, r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, str(e)

          add('# FASE 6c - MAPA REAL DE RUTAS + SISTEMA COMPLETO EN CI')
          add('')
          add('Corrige el corte del 6b: se prueban TODAS las rutas candidatas.')
          add('404 = no existe. 400/422 = existe y su error revela campos exigidos.')
          add('Luego: intento de registro ZID real con datos sinteticos, y arranque')
          add('de superapp.py conectada a la red (sistema completo integrado).')
          add('')

          add('## C1. Puerto de superapp (que espera Render)')
          add('')
          ls = txt(ROOT / 'superapp.py').splitlines()
          hits = [(i + 1, l.strip()) for i, l in enumerate(ls) if 'PORT' in l.upper()]
          add('%d lineas mencionan PORT:' % len(hits))
          add('```python')
          for n, l in hits[:12]:
              add('%d: %s' % (n, l[:150]))
          add('```')
          add('')

          add('## C2. Arranque de la red')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN,
                      'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-6c',
                      'ZYRA_PORT': str(NP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env,
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _b = pedir('GET', BASE + '/health', token=False)
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          add('- red arriba: %s (%s)' % (vivo, BASE))
          gate('red_arranca', vivo)
          add('')

          mapa = {}
          if vivo:
              add('## C3. Mapa real: POST vacio a TODAS las candidatas')
              add('')
              cands = ['/register', '/verify-existence', '/exists', '/verify', '/verification',
                       '/tokens', '/certificates', '/documents', '/search', '/history',
                       '/export', '/reputation', '/verified', '/identity', '/identities',
                       '/identity/register', '/identidad', '/zid', '/birth-zid',
                       '/actor_zid', '/subject_zid', '/issuer_zid', '/requester_zid',
                       '/reviewer_zid', '/owner_zid', '/identity_zid',
                       '/existing_identity_matched', '/identity.birth_zid',
                       '/cert_hash', '/certificate_id', '/document_id']
              reales = []
              for r in cands:
                  st, cuerpo = pedir('POST', BASE + r, {})
                  mapa[r] = (st, cuerpo[:180])
                  if st is not None and st != 404:
                      reales.append((r, st))
              add('- Rutas que EXISTEN (no 404): %d' % len(reales))
              for r, st in reales:
                  add('  - POST %s -> %s | %s' % (r, st, mapa[r][1][:120]))
              gate('mapa_rutas', len(reales) >= 1)
              add('')

              add('## C4. Registro ZID real (aprende campos del servidor, 3 rondas)')
              add('')
              EXTRA = [('nombre|name|nombre_completo', 'PRUEBA_CI_Alfons'),
                       ('documento|dui|doc|id_number', '0000000000'),
                       ('fecha|nacimiento|birth|dob', '1990-01-01'),
                       ('tipo|type|kind', 'persona'),
                       ('mayor|edad|adult', '1')]
              def valor(c):
                  for pat, v in EXTRA:
                      if re.search(pat, c):
                          return v
                  return 'PRUEBA_CI_' + c[:16]
              def extraer_campos(msg):
                  cs = re.findall(r"[\"']([a-z_][a-z0-9_]{2,30})[\"']", msg)
                  return [c for c in cs if c not in ('ok', 'error', 'message', 'type', 'data', 'status')]
              objetivos = [r for r, st in reales if st in (400, 422)] or \
                          [r for r, st in reales if 'regist' in r or 'verify' in r]
              zid = None
              ruta_zid = None
              for ruta in objetivos[:4]:
                  payload = {}
                  for ronda in range(1, 4):
                      st, cuerpo = pedir('POST', BASE + ruta, payload)
                      add('- %s ronda %d (campos=%d) -> %s | %s'
                          % (ruta, ronda, len(payload), st, cuerpo[:160]))
                      try:
                          j = json.loads(cuerpo)
                      except Exception:
                          break
                      if j.get('ok') is True:
                          d = j.get('data')
                          if isinstance(d, dict):
                              for k, v in d.items():
                                  if 'zid' in str(k).lower():
                                      zid = v
                                      ruta_zid = ruta
                                      break
                          break
                      msg = str(j.get('error', {}).get('message', ''))
                      nuevos = [c for c in extraer_campos(msg) if c not in payload]
                      if not nuevos:
                          break
                      for c in nuevos[:8]:
                          payload[c] = valor(c)
                  if zid:
                      break
              if zid:
                  add('')
                  add('**PRIMER ZID CREADO EN PRUEBA: %s (via POST %s)**' % (zid, ruta_zid))
              else:
                  add('')
                  add('- Registro aun no completo: los errores de arriba SON el contrato real para disenar 6d.')
              DATA['registro'] = {'zid': str(zid), 'ruta': ruta_zid}
              add('')

              add('## C5. Consulta de existencia con el ZID creado')
              add('')
              if zid:
                  for met, url in (('POST', BASE + '/verify-existence'),
                                   ('GET', BASE + '/verify-existence?zid=' + str(zid)),
                                   ('GET', BASE + '/exists?zid=' + str(zid))):
                      cuerpo = {'zid': zid} if met == 'POST' else None
                      st, r = pedir(met, url, cuerpo)
                      add('- %s %s -> %s | %s' % (met, url.replace(BASE, ''), st, r[:160]))
              else:
                  add('- Sin ZID creado, se prueba con Z-TEST-1:')
                  st, r = pedir('POST', BASE + '/verify-existence', {'zid': 'Z-TEST-1'})
                  add('- POST /verify-existence -> %s | %s' % (st, r[:160]))
              add('')

          add('## C6. SISTEMA COMPLETO: superapp.py conectada a la red')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_URL': BASE, 'ZYRA_API_TOKEN': TOKEN,
                       'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_REQUIRE_TOKEN': '0',
                       'SUPERAPP_DATA_DIR': '/tmp/super-6c', 'PORT': str(SP),
                       'SUPERAPP_PORT': str(SP), 'ZYRA_PORT': str(SP),
                       'PYTHONUNBUFFERED': '1'})
          sproc = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                   stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          lineas_sp = []
          sp_vivo = False
          t0 = time.time()
          while time.time() - t0 < 60:
              if sproc.poll() is not None:
                  break
              st, _b = pedir('GET', 'http://127.0.0.1:%d/health' % SP, token=False)
              if st is not None:
                  sp_vivo = True
                  break
              time.sleep(1.5)
          if sp_vivo:
              add('- **SUPERAPP ARRIBA en %d** (sin dependencias pesadas instaladas!)' % SP)
              st, r = pedir('GET', 'http://127.0.0.1:%d/health' % SP, token=False)
              add('- GET /health superapp -> %s | %s' % (st, r[:200]))
          else:
              add('- SuperApp no respondio en 60 s (se diagnostica con su log).')
          try:
              if sproc.poll() is None:
                  sproc.terminate()
                  sproc.wait(timeout=10)
          except Exception:
              try:
                  sproc.kill()
              except Exception:
                  pass
          resto = ''
          try:
              resto, _ = sproc.communicate(timeout=5)
          except Exception:
              pass
          logs = [l for l in (resto or '').splitlines() if l.strip()]
          apps_arrancadas = [l for l in logs if re.search(r'(?i)(ok|start|arranc|serv)', l)][:20]
          add('- Lineas de arranque de apps (muestra):')
          add('```')
          for l in (apps_arrancadas or logs)[-15:]:
              add(l[:160])
          add('```')
          gate('superapp_arranca', sp_vivo)
          add('')

          add('## C7. requirements-render.txt slim + render.yaml (si superapp arranco slim)')
          add('')
          if sp_vivo:
              slim = ['# Render free: instalacion minima verificada en CI (6c).',
                      '# Los paquetes pesados de biometria son OPCIONALES (proveedor externo).',
                      'cryptography']
              (ROOT / 'requirements-render.txt').write_text('\n'.join(slim) + '\n', encoding='utf-8')
              add('- creado requirements-render.txt (cryptography).')
              ry = ROOT / 'render.yaml'
              t = ry.read_text(encoding='utf-8')
              n = t.count('pip install -r requirements.txt')
              if n == 2 and 'requirements-render.txt' not in t:
                  t = t.replace('pip install -r requirements.txt',
                                'pip install -r requirements-render.txt')
                  ry.write_text(t, encoding='utf-8')
                  add('- render.yaml: build apunta a requirements-render.txt (2 servicios).')
                  gate('render_slim', True)
              elif 'requirements-render.txt' in t:
                  add('- render.yaml ya apunta al slim (idempotente).')
                  gate('render_slim', True)
              else:
                  add('- render.yaml: patron inesperado (%d), no editado.' % n)
                  gate('render_slim', False)
          else:
              add('- SuperApp no arranco slim: NO se toca render.yaml. Revisar log en C6.')
              gate('render_slim', False)
          add('')

          try:
              if proc.poll() is None:
                  proc.terminate()
                  proc.wait(timeout=10)
          except Exception:
              try:
                  proc.kill()
              except Exception:
                  pass

          add('## Resultado de gates')
          add('')
          fallos = [n for n, ok in GATES if not ok]
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**OK. Commit: requirements-render.txt + render.yaml apuntando al slim.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          DATA['mapa'] = {k: list(v) for k, v in mapa.items()}
          Path('fase6c.json').write_text(
              json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
              encoding='utf-8')
          escribe()
          print('Fase 6c terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add requirements-render.txt render.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "deploy(render): requirements slim verificado en CI para plan free"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase6c-zyra
          path: fase6c.json
          if-no-files-found: ignore
