name: "ZYRA AX-2: fix 429 (rate limit test carga) + emergencias (master key) — cirugia exacta"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] fix 2 test files (reemplazos exactos del dump)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import os, pathlib, py_compile
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          # 1) emergencias_e2e: kernel con biometria + master key
          p1 = pathlib.Path("apps/axis/tests/test_axis_emergencias_e2e.py")
          t1 = p1.read_text(encoding="utf-8")
          OLD1 = (
              "        self.kernel.bootstrap_root()\n"
              "        self.caps = ZyraCapabilities("
          )
          NEW1 = (
              "        self.kernel.bootstrap_root()\n"
              "        from shared_engines.security.biometrics import (  # AX-2\n"
              "            BiometricsEngine, BiometricsPolicy,\n"
              "            DeterministicTestProvider, TemplateCipher,\n"
              "        )\n"
              "        self.kernel._biometrics = BiometricsEngine(  # AX-2 master key\n"
              "            db=self.net_db,\n"
              "            clock=FrozenClock(),\n"
              "            audit=self.kernel.audit,\n"
              "            provider=DeterministicTestProvider(),\n"
              "            cipher=TemplateCipher(master_key_hex=\"ab\" * 32),\n"
              "            policy=BiometricsPolicy(\n"
              "                require_liveness=False,\n"
              "                doc_reject=0.01, doc_review=0.02,\n"
              "                doc_auto=0.03, dup_reject=0.98),\n"
              "        )\n"
              "        self.caps = ZyraCapabilities("
          )
          if "AX-2 master key" in t1:
              out("- emergencias_e2e: ya aplicado — skip")
          elif OLD1 in t1:
              p1.write_text(t1.replace(OLD1, NEW1, 1), encoding="utf-8")
              py_compile.compile(str(p1), doraise=True)
              out("- **emergencias_e2e: kernel con biometria + master key (igual que el test verde)**")
          else:
              out("- emergencias_e2e: patron no hallado — SKIP honesto")

          # 2) test_axis.py: el test de carga eleva su rate limit local
          p2 = pathlib.Path("apps/axis/tests/test_axis.py")
          t2 = p2.read_text(encoding="utf-8")
          OLD2 = (
              "    client = _axz5_boot_net()\n"
              "    _axz_step(\"A5-load: enrolando 50 madres\")"
          )
          NEW2 = (
              "    import shared_engines.runtime.combined_api as _cap\n"
              "    from shared_engines.runtime.combined_api import RateLimiter as _rlc\n"
              "    _cap._RATE_LIMITER = _rlc(max_per_minute=5000)  # AX-2: carga\n"
              "    client = _axz5_boot_net()\n"
              "    _axz_step(\"A5-load: enrolando 50 madres\")"
          )
          if "max_per_minute=5000" in t2:
              out("- test_axis.py: ya aplicado — skip")
          elif OLD2 in t2:
              p2.write_text(t2.replace(OLD2, NEW2, 1), encoding="utf-8")
              py_compile.compile(str(p2), doraise=True)
              out("- **test_axis.py: test de carga eleva su rate limit local a 5000/min (produccion intacta: proceso aparte, default 120)**")
          else:
              out("- test_axis.py: patron no hallado — SKIP honesto")
          PYEOF
          exit 0

      - name: "[LECTURA] gates: AXIS COMPLETO (incluye los 2) + NEXO + AGRO"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=short > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          if [ "$(cat /tmp/x2)" = "0" ]; then echo "- REG AXIS COMPLETO: ✅ (incluye emergencias + carga 50)" >> "$GITHUB_STEP_SUMMARY"; else echo "- REG AXIS: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### AXIS detalle"; echo '```'; tail -50 /tmp/x2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$(cat /tmp/x1)" = "0" ]; then echo "- REG NEXO: ✅ (138+)" >> "$GITHUB_STEP_SUMMARY"; else echo "- REG NEXO: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### NEXO detalle"; echo '```'; tail -50 /tmp/x1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$(cat /tmp/x3)" = "0" ]; then echo "- REG AGRO: ✅ (33)" >> "$GITHUB_STEP_SUMMARY"; else echo "- REG AGRO: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### AGRO detalle"; echo '```'; tail -40 /tmp/x3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "[ESCRITURA git] Veredicto + commit solo si AXIS+NEXO+AGRO verdes"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/x2 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x1 2>/dev/null || echo 1)" != "0" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**RESULTADO: gates rojos — SIN commit**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/axis
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "fix(AXIS AX-2): test de carga de 50 nacimientos eleva su rate limit local a 5000/min (el limiter de la Red hacia su trabajo: 120/min default, produccion intacta — proceso aparte) + 2 tests de emergencias con kernel BIOMETRIA + master key (mismo patron del test verde: 'biometrics disabled' era la causa del fallo en /apps/register) — AXIS 100% verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — AX-2 CERRADO. FASE 1 sigue: S-1/S-4 matricula desde casa sobre StudentRegistryEngine.**"; exit 0; fi
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          exit 1
