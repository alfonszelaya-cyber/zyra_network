name: "ZYRA CONECTORES 4: comunicacion (Brevo email + FCM push)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir providers comunicacion
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)

          MOD = D(r'''
              """Conectores de comunicacion de la Red
              (Brevo email + Firebase push). Las keys
              viven en variables de entorno del dueno:
              BREVO_API_KEY / FCM_SERVER_KEY. Sin key,
              fallan HONESTO con not_configured —
              nunca crash, nunca inventan envios."""
              from __future__ import annotations

              import hashlib
              import json
              import os
              import urllib.request


              class _HttpBase:
                  """POST JSON con headers."""

                  name = "base"

                  def __init__(
                      self,
                      *,
                      timeout_seconds: float = 15.0,
                  ) -> None:
                      self._timeout = timeout_seconds

                  def _post_json(self, url: str,
                                 payload: dict,
                                 headers: dict):
                      body = json.dumps(
                          payload).encode("utf-8")
                      h = {
                          "Content-Type":
                          "application/json"}
                      h.update(headers)
                      req = urllib.request.Request(
                          url,
                          data=body,
                          headers=h,
                          method="POST")
                      with urllib.request.urlopen(
                              req,
                              timeout=self._timeout) as r:
                          return json.loads(
                              r.read().decode("utf-8"))

                  def _sha(self, data) -> str:
                      return hashlib.sha256(
                          json.dumps(
                              data,
                              sort_keys=True,
                              default=str).encode(
                              "utf-8")).hexdigest()


              class BrevoConnector(_HttpBase):
                  """Email transaccional (300/dia
                  en el plan gratuito de Brevo)."""

                  name = "brevo"

                  def __init__(
                      self,
                      *,
                      api_key: str = "",
                      timeout_seconds: float = 15.0,
                  ) -> None:
                      super().__init__(
                          timeout_seconds=timeout_seconds)
                      self._api_key = (
                          api_key
                          or os.environ.get(
                              "BREVO_API_KEY", ""))

                  def is_configured(self) -> bool:
                      return bool(self._api_key)

                  def send_email(
                      self, *,
                      to_email: str,
                      to_name: str = "",
                      subject: str,
                      html: str,
                      sender_email: str,
                      sender_name: str = "ZYRA Network",
                  ) -> dict:
                      """Envia un email. Sin key:
                      {'sent': False, 'reason':
                      'not_configured'} — honesto."""
                      if not self.is_configured():
                          return {
                              "source": self.name,
                              "sent": False,
                              "reason":
                              "not_configured",
                              "hint": "define BREVO_API_KEY",
                          }
                      url = ("https://api.brevo.com"
                             "/v3/smtp/email")
                      payload = {
                          "sender": {
                              "email": sender_email,
                              "name": sender_name},
                          "to": [{"email": to_email,
                                  "name": to_name}],
                          "subject": subject,
                          "htmlContent": html,
                      }
                      try:
                          d = self._post_json(
                              url,
                              payload,
                              headers={
                                  "api-key":
                                  self._api_key})
                      except Exception as exc:
                          return {
                              "source": self.name,
                              "sent": False,
                              "error":
                              type(exc).__name__,
                          }
                      resumen = {
                          "source": self.name,
                          "sent": True,
                          "message_id": d.get(
                              "messageId"),
                          "to": to_email,
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen


              class FcmConnector(_HttpBase):
                  """Push notifications via
                  Firebase Cloud Messaging (HTTP v1
                  legacy: server key)."""

                  name = "fcm"

                  def __init__(
                      self,
                      *,
                      server_key: str = "",
                      timeout_seconds: float = 15.0,
                  ) -> None:
                      super().__init__(
                          timeout_seconds=timeout_seconds)
                      self._key = (
                          server_key
                          or os.environ.get(
                              "FCM_SERVER_KEY", ""))

                  def is_configured(self) -> bool:
                      return bool(self._key)

                  def send_push(
                      self, *,
                      device_token: str,
                      title: str,
                      body: str,
                      data: dict | None = None,
                  ) -> dict:
                      """Envia push a un dispositivo.
                      Sin key: honesto not_configured."""
                      if not self.is_configured():
                          return {
                              "source": self.name,
                              "sent": False,
                              "reason":
                              "not_configured",
                              "hint":
                              "define FCM_SERVER_KEY",
                          }
                      url = ("https://fcm.googleapis.com"
                             "/fcm/send")
                      payload = {
                          "to": device_token,
                          "notification": {
                              "title": title,
                              "body": body},
                          "data": data or {},
                      }
                      try:
                          d = self._post_json(
                              url,
                              payload,
                              headers={
                                  "Authorization":
                                  "key="
                                  + self._key})
                      except Exception as exc:
                          return {
                              "source": self.name,
                              "sent": False,
                              "error":
                              type(exc).__name__,
                          }
                      resumen = {
                          "source": self.name,
                          "sent": (d.get("success", 0)
                                   == 1),
                          "message_id": d.get(
                              "message_id"),
                      }
                      resumen["sha256"] = self._sha(
                          resumen)
                      return resumen
          ''')

          TESTS = D(r'''
              """Tests comunicacion (mockeados + honesto sin key)."""
              from __future__ import annotations

              import json

              from shared_engines.integrations.rates_comms import (
                  BrevoConnector,
                  FcmConnector,
              )


              class _R:
                  def __init__(self, p):
                      self._p = p

                  def __enter__(self):
                      return self

                  def __exit__(self, *a):
                      return False

                  def read(self):
                      return self._p


              def test_brevo_sin_key_honesto(
                  tmp_path, monkeypatch) -> None:
                  monkeypatch.delenv(
                      "BREVO_API_KEY", raising=False)
                  monkeypatch.setattr(
                      "urllib.request.urlopen",
                      lambda req, timeout=None: (
                          (_ for _ in ()).throw(
                              AssertionError(
                                  "no debe llamar red sin key"))))
                  r = BrevoConnector().send_email(
                      to_email="a@b.com",
                      subject="x", html="<p>y</p>",
                      sender_email="no@reply.zyra")
                  assert r["sent"] is False
                  assert r["reason"] == "not_configured"
                  print("OK comms: brevo sin key ="
                        " not_configured, cero llamada")


              def test_brevo_envia_con_key(
                  tmp_path, monkeypatch) -> None:
                  body = json.dumps({
                      "messageId": "<abc@brevo>"}).encode()
                  monkeypatch.setenv(
                      "BREVO_API_KEY", "xkeys-test-123")
                  monkeypatch.setattr(
                      "urllib.request.urlopen",
                      lambda req, timeout=None: _R(body))
                  r = BrevoConnector().send_email(
                      to_email="pedro@sv.com",
                      to_name="Pedro",
                      subject="Tu remesa llego",
                      html="<b>775 GTQ</b>",
                      sender_email="no@reply.zyra")
                  assert r["sent"] is True
                  assert r["message_id"] == "<abc@brevo>"
                  assert r["sha256"]
                  print("OK comms: brevo email de"
                        " remesa enviado con key")


              def test_fcm_sin_key_honesto(
                  tmp_path, monkeypatch) -> None:
                  monkeypatch.delenv(
                      "FCM_SERVER_KEY", raising=False)
                  r = FcmConnector().send_push(
                      device_token="tok123",
                      title="Pago",
                      body="Recibiste 100 USD")
                  assert r["sent"] is False
                  assert r["reason"] == "not_configured"
                  print("OK comms: fcm sin key ="
                        " not_configured")


              def test_fcm_envia_con_key(
                  tmp_path, monkeypatch) -> None:
                  body = json.dumps({
                      "success": 1,
                      "message_id": 98765}).encode()
                  monkeypatch.setenv(
                      "FCM_SERVER_KEY", "AAAA-test")
                  monkeypatch.setattr(
                      "urllib.request.urlopen",
                      lambda req, timeout=None: _R(body))
                  r = FcmConnector().send_push(
                      device_token="tok123",
                      title="Remesa",
                      body="Llego tu dinero",
                      data={"payment_id": "PAY-1"})
                  assert r["sent"] is True
                  assert r["message_id"] == 98765
                  print("OK comms: fcm push de"
                        " remesa enviado con key")
          ''')

          p = pathlib.Path("shared_engines/integrations/rates_comms.py")
          if p.exists() and "class BrevoConnector" in p.read_text(encoding="utf-8"):
              out("- **modulo comms: YA**")
          else:
              try:
                  ast.parse(MOD)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(MOD, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  out("- **modulo comms: OK (" + str(len(MOD)) + " chars)**")
              except Exception:
                  out("- **modulo comms: ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          t = pathlib.Path("shared_engines/integrations/tests/test_comms.py")
          if t.exists() and "test_fcm_envia_con_key" in t.read_text(encoding="utf-8"):
              out("- **tests comms: YA**")
          else:
              try:
                  ast.parse(TESTS)
                  t.parent.mkdir(parents=True, exist_ok=True)
                  t.write_text(TESTS, encoding="utf-8")
                  py_compile.compile(str(t), doraise=True)
                  out("- **tests comms: OK (" + str(len(TESTS)) + " chars)**")
              except Exception:
                  out("- **tests comms: ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          chk = pathlib.Path("shared_engines/integrations/rates_comms.py")
          chk2 = pathlib.Path("shared_engines/integrations/tests/test_comms.py")
          out("- **verif disco: modulo=" + str(chk.exists()) + " test=" + str(chk2.exists()) + "**")
          exit(0)
          EOF

      - name: "M1: tests comms"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 120 python3 -m pytest shared_engines/integrations/tests/test_comms.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/m1.out 2>&1
          echo $? > /tmp/m1
          if [ "$(cat /tmp/m1)" = "0" ]; then echo "- M1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- M1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### M1 detalle"; echo '```'; tail -60 /tmp/m1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "M2: regresion shared_engines"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/m2.out 2>&1
          echo $? > /tmp/m2
          if [ "$(cat /tmp/m2)" = "0" ]; then echo "- M2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- M2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### M2 detalle"; echo '```'; tail -60 /tmp/m2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "M3: apps intactas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/nexo/tests apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/m3.out 2>&1
          echo $? > /tmp/m3
          if [ "$(cat /tmp/m3)" = "0" ]; then echo "- M3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- M3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### M3 detalle"; echo '```'; tail -40 /tmp/m3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in m1 m2 m3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: M1-M3 VERDES — LOTE 4 COMUNICACION CONECTADO (esperando keys del dueno)**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(conectores): comunicacion - Brevo email + FCM push (keys por env, falla honesto not_configured sin key) (M1-M3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 4/4. TODOS los conectores vivos. Sigue VIVA-3 + RED-9.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
