name: "AGRO RUN F v3: zyra_link reescrito completo + verificacion con interprete fresco"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - reescritura completa de zyra_link.py (deterministica)"
        run: |
          python3 - <<'WREFEOF'
          import textwrap
          from pathlib import Path

          FULL = textwrap.dedent('''\
              """ZyraLink: high-level AGRO operations on the
              Network. Never raises - resilience rule."""
              from __future__ import annotations

              from apps.agro.infrastructure.network.network_client import (
                  NetworkClient,
              )


              class ZyraLink:
                  """Trust operations for producers."""

                  def __init__(
                      self, client: NetworkClient
                  ) -> None:
                      self._client = client

                  def register_app(
                      self,
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      return self._client.post(
                          "/apps/register",
                          {
                              "app_id": "agro",
                              "display_name": (
                                  "AGRO - Productores"
                              ),
                              "scopes": [
                                  "display_name",
                                  "contact",
                                  "address",
                              ],
                          },
                      )

                  def register_producer_zid(
                      self, display_name: str
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      """LAW: person registration requires
                      biometric enrollment. Legacy door
                      rejected here; use enroll_producer
                      with document + selfie."""
                      raise ValueError(
                          "registro de productor requiere"
                          " biometria: use enroll_producer"
                          " con documento y selfie"
                      )

                  def enroll_producer(
                      self,
                      *,
                      display_name: str,
                      doc_image_b64: str,
                      selfie_image_b64: str,
                      doc_kind: str | None = None,
                      doc_country: str | None = None,
                      doc_number: str | None = None,
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      payload: dict = {
                          "kind": "person",
                          "display_name": display_name,
                          "actor": "agro",
                          "doc_image_b64": doc_image_b64,
                          "selfie_image_b64": (
                              selfie_image_b64
                          ),
                      }
                      if doc_kind:
                          payload["doc_kind"] = doc_kind
                      if doc_country:
                          payload["doc_country"] = (
                              doc_country
                          )
                      if doc_number:
                          payload["doc_number"] = (
                              doc_number
                          )
                      return self._client.post(
                          "/identity/enroll", payload
                      )

                  def complete_trust(
                      self, zid: str
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      return self._client.post(
                          "/trust/complete",
                          {"zid": zid, "actor": "agro"},
                      )

                  def is_trusted(
                      self, zid: str
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      return self._client.get(
                          f"/trust/{zid}"
                      )

                  def record_agro_event(
                      self,
                      zid: str,
                      event: str,
                      detail: str,
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      return self._client.post(
                          "/history/append",
                          {
                              "zid": zid,
                              "entry_type": "other",
                              "actor_app": "agro",
                              "payload": {
                                  "event": event,
                                  "detail": detail,
                              },
                          },
                      )

                  def quote_to_usd(
                      self,
                      *,
                      requester_zid: str,
                      amount: str,
                      currency: str,
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      """Conector al motor transversal de
                      la Red: cotizacion firmada en vivo
                      hacia USD. AGRO nunca convierte por
                      su cuenta."""
                      return self._client.post(
                          "/currency/quote",
                          {
                              "base": str(
                                  currency or "USD"
                              ).upper(),
                              "quote_ccy": "USD",
                              "requester_zid": (
                                  requester_zid
                              ),
                          },
                      )

                  def network_status(self) -> dict:
                      """GPT-8: salud del enlace
                      AGRO->Red en vivo."""
                      ok, data, err = (
                          self._client.get("/health")
                      )
                      return {
                          "reachable": bool(ok),
                          "error": (
                              str(err)
                              if err
                              else None
                          ),
                          "catalog_events": len(
                              AGRO_EVENT_CATALOG
                          ),
                      }


              # ---- additive RUN F (GPT-8): ecosistema ----
              # Contrato tipado de eventos AGRO->Red. Las
              # demas apps (NEXO contable, SUBASTAS mercado,
              # AXIS historial de vida, SEMILLA) leen estos
              # eventos del history del ZID en la Red: las
              # apps nunca se hablan entre si, hablan con
              # la Red.
              AGRO_EVENT_CATALOG = {
                  "producer.registered": ("producer_id",),
                  "producer.verified": ("producer_id",),
                  "asset.registered": (
                      "producer_id",
                      "asset_type",
                      "asset_id",
                  ),
                  "unit.created": (
                      "producer_id",
                      "unit_id",
                  ),
                  "plan.created": (
                      "producer_id",
                      "plan_id",
                  ),
                  "plan.harvested": (
                      "producer_id",
                      "plan_id",
                  ),
                  "sale.created": (
                      "producer_id",
                      "sale_id",
                  ),
                  "sale.completed": (
                      "producer_id",
                      "sale_id",
                  ),
                  "risk.detected": (
                      "producer_id",
                      "risk_type",
                  ),
                  "incident.created": (
                      "producer_id",
                      "incident_id",
                  ),
                  "aid.requested": (
                      "producer_id",
                      "aid_id",
                  ),
                  "aid.delivered": (
                      "producer_id",
                      "aid_id",
                  ),
              }


              def validate_agro_event(
                  event_type, payload,
              ):
                  """Valida contrato: tipo en catalogo y
                  campos requeridos. Rechaza antes de
                  tocar la Red."""
                  if str(event_type) not in (
                      AGRO_EVENT_CATALOG
                  ):
                      raise ValueError(
                          "evento desconocido: "
                          + str(event_type)
                      )
                  required = AGRO_EVENT_CATALOG[
                      str(event_type)
                  ]
                  missing = []
                  for field in required:
                      if not str(
                          (payload or {}).get(field)
                          or ""
                      ).strip():
                          missing.append(field)
                  if missing:
                      raise ValueError(
                          "campos faltantes: "
                          + ", ".join(missing)
                      )
                  return True


              def _event_key(event_type, payload):
                  import hashlib as _hl
                  import json as _json
                  canonical = _json.dumps(
                      payload or {}, sort_keys=True
                  )
                  return _hl.sha256(
                      (
                          str(event_type)
                          + "|"
                          + canonical
                      ).encode("utf-8")
                  ).hexdigest()


              def _outbox_db(db):
                  db.execute(
                      "CREATE TABLE IF NOT EXISTS"
                      " agro_event_outbox ("
                      " event_key TEXT PRIMARY KEY,"
                      " event_type TEXT NOT NULL,"
                      " payload TEXT NOT NULL,"
                      " zid TEXT,"
                      " status TEXT NOT NULL,"
                      " attempts INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " last_error TEXT,"
                      " created_at TEXT,"
                      " updated_at TEXT)"
                  )


              def emit_event_db(
                  db, link, *,
                  zid, event_type, payload,
              ):
                  """Emision con idempotencia (GPT-8):
                  el mismo evento (tipo+payload) nunca
                  se duplica en la Red."""
                  import json as _json
                  import time as _t
                  validate_agro_event(
                      event_type, payload
                  )
                  key = _event_key(event_type, payload)
                  _outbox_db(db)
                  row = None
                  for fname in ("query_one", "query"):
                      fn = getattr(db, fname, None)
                      if callable(fn):
                          try:
                              row = fn(
                                  "SELECT status FROM"
                                  " agro_event_outbox"
                                  " WHERE event_key = ?",
                                  (key,),
                              )
                          except Exception:
                              row = None
                          if row:
                              break
                  if row:
                      try:
                          prior = str(row["status"])
                      except Exception:
                          prior = str(row[0])
                      if prior == "sent":
                          return {
                              "event_key": key,
                              "deduplicated": True,
                              "status": "sent",
                          }
                  payload_json = _json.dumps(
                      payload or {}, sort_keys=True
                  )
                  detail = _json.dumps(
                      {
                          "event_type": str(event_type),
                          **(payload or {}),
                      },
                      sort_keys=True,
                  )
                  ok, data, err = link.record_agro_event(
                      zid, str(event_type), detail
                  )
                  ts = _t.strftime(
                      "%Y-%m-%dT%H:%M:%SZ", _t.gmtime()
                  )
                  status = "sent" if ok else "failed"
                  if row:
                      db.execute(
                          "UPDATE"
                          " agro_event_outbox SET"
                          " status = ?, attempts ="
                          " attempts + 1,"
                          " last_error = ?, zid = ?,"
                          " updated_at = ? WHERE"
                          " event_key = ?",
                          (status, str(err or ""),
                           str(zid), ts, key),
                      )
                  else:
                      db.execute(
                          "INSERT INTO"
                          " agro_event_outbox ("
                          " event_key, event_type,"
                          " payload, zid, status,"
                          " attempts, last_error,"
                          " created_at, updated_at)"
                          " VALUES (?, ?, ?, ?, ?, 1,"
                          " ?, ?, ?)",
                          (key, str(event_type),
                           payload_json, str(zid),
                           status, str(err or ""),
                           ts, ts),
                      )
                  return {
                      "event_key": key,
                      "sent": bool(ok),
                      "status": status,
                      "error": (
                          str(err) if err else None
                      ),
                  }


              def outbox_stats_db(db):
                  rows = []
                  for name in (
                      "query_all", "query", "fetchall"
                  ):
                      fn = getattr(db, name, None)
                      if callable(fn):
                          try:
                              got = fn(
                                  "SELECT status,"
                                  " COUNT(*) AS n FROM"
                                  " agro_event_outbox"
                                  " GROUP BY status"
                              )
                          except Exception:
                              got = None
                          if got:
                              rows = list(got)
                              break
                  by_status = {}
                  total = 0
                  for r in rows:
                      try:
                          st = str(r["status"])
                          n = int(r["n"])
                      except Exception:
                          continue
                      by_status[st] = n
                      total += n
                  return {
                      "total": total,
                      "by_status": by_status,
                  }


              def outbox_pending_db(db, limit=20):
                  for name in (
                      "query_all", "query", "fetchall"
                  ):
                      fn = getattr(db, name, None)
                      if callable(fn):
                          try:
                              got = fn(
                                  "SELECT event_key,"
                                  " event_type, payload,"
                                  " zid, status, attempts,"
                                  " last_error, updated_at"
                                  " FROM"
                                  " agro_event_outbox"
                                  " WHERE status !="
                                  " 'sent' ORDER BY"
                                  " updated_at LIMIT ?",
                                  (int(limit),),
                              )
                          except Exception:
                              got = None
                          if got:
                              return [
                                  dict(r) for r in got
                              ]
                  return []


              def retry_pending_db(
                  db, link, zid, limit=10,
              ):
                  """Reintento de pendientes (GPT-8);
                  respeta idempotencia."""
                  rows = outbox_pending_db(
                      db, limit=limit
                  )
                  results = []
                  for r in rows:
                      import json as _json
                      try:
                          payload = _json.loads(
                              str(r.get("payload"))
                          )
                      except Exception:
                          payload = {}
                      res = emit_event_db(
                          db, link,
                          zid=str(
                              r.get("zid") or zid
                          ),
                          event_type=str(
                              r.get("event_type")
                          ),
                          payload=payload,
                      )
                      results.append(res)
                  return {
                      "retried": len(results),
                      "results": results,
                  }
          ''')

          p = Path("apps/agro/services/zyra_link.py")
          compile(FULL, str(p), "exec")
          p.write_text(FULL, encoding="utf-8")

          escrito = p.read_text(encoding="utf-8")
          n_clase = escrito.count("class ZyraLink")
          if n_clase != 1:
              raise SystemExit("FALLO: clase duplicada/ausente")
          for simbolo in (
              "def register_app(",
              "def register_producer_zid(",
              "def enroll_producer(",
              "def complete_trust(",
              "def is_trusted(",
              "def record_agro_event(",
              "def quote_to_usd(",
              "def network_status(",
              "AGRO_EVENT_CATALOG",
              "def validate_agro_event(",
              "def emit_event_db(",
              "def outbox_stats_db(",
              "def outbox_pending_db(",
              "def retry_pending_db(",
          ):
              if simbolo not in escrito:
                  raise SystemExit(
                      "FALLO disco: " + simbolo
                  )
          print("OK disco: clase unica + 14 simbolos")
          WREFEOF

      - name: "Paso 2 - verificacion con interprete FRESCO (subproceso)"
        run: |
          python3 -c "
          import apps.agro.services.zyra_link as zl
          for n in ('AGRO_EVENT_CATALOG','validate_agro_event','emit_event_db','outbox_stats_db','outbox_pending_db','retry_pending_db'):
              assert hasattr(zl, n), 'falta ' + n
          for m in ('register_app','register_producer_zid','enroll_producer','complete_trust','is_trusted','record_agro_event','quote_to_usd','network_status'):
              assert hasattr(zl.ZyraLink, m), 'falta metodo ' + m
          assert len(zl.AGRO_EVENT_CATALOG) == 12
          print('OK import fresco: clase y modulo completos (12 eventos)')
          "

      - name: "Paso 3 - verificacion cruzada server/tests/matrix"
        run: |
          python3 - <<'VEREOF'
          from pathlib import Path

          t = Path("apps/agro/server.py").read_text(encoding="utf-8")
          for req in (
              '("network", "emit"): "network.emit"',
              'if s == ["network", "status"]',
              'if s == ["network", "outbox"]',
              '"emit_event_db"',
          ):
              if req not in t:
                  raise SystemExit("FALLO server: " + req)
          print("OK server (4 referencias)")

          tt = Path("apps/agro/tests/test_agro_superapp.py").read_text(encoding="utf-8")
          for req in (
              "test_ecosystem_contract_offline",
              "test_ecosystem_to_network_online",
          ):
              if req not in tt:
                  raise SystemExit("FALLO tests: " + req)
          print("OK tests RUN F")

          mt = Path("apps/agro/security/operation_matrix.py").read_text(encoding="utf-8")
          if '"network.emit"' not in mt:
              raise SystemExit("FALLO matrix")
          print("OK matrix")
          VEREOF

      - name: "Paso 4 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN F v3: zyra_link reescrito completo" -m "Causa raiz: appends dejaron network_status fuera de la clase. Solucion: archivo completo reescrito de una vez (todos los metodos originales + ley + quote + network_status dentro de la clase; catalogo/outbox a nivel modulo), verificacion con interprete fresco en subproceso + cruzada server/tests/matrix antes del GATE."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
