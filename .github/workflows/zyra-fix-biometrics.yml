          def market_radarvip_api(self) -> None:
              try:
                  user = self._sess_user()
                  if user is None:
                      self._send_json(401, {"ok": False, "error": "sesion requerida"})
                      return
                  account = user["username"]
                  doc = self._read_json()
                  if doc is None:
                      self._send_json(400, {"ok": False, "error": "invalid JSON"})
                      return
                  action = str(doc.get("action", ""))
                  if action == "register":
                      d = dict(doc)
                      d["created_by"] = account
                      r = self.vip.register(created_by=account, d=d)
                      self._send_json(201, {"ok": True, "data": r})
                      return
                  if action == "set_market":
                      r = self.vip.set_market_price(
                          category=str(doc.get("category", "")),
                          brand=str(doc.get("brand", "")),
                          model=str(doc.get("model", "")),
                          year=doc.get("year"),
                          market_value=doc.get("market_value", 0),
                          by=account)
                      self._send_json(200, {"ok": True, "data": r})
                      return
                  if action == "calculate":
                      r = self.vip.calculate(doc)
                      self._send_json(200, {"ok": True, "data": {"calc": r}})
                      return
                  if action == "list":
                      r = self.vip.list_opps(doc.get("recommendation"))
                      self._send_json(200, {"ok": True, "data": {"opportunities": r}})
                      return
                  if action == "compare":
                      r = self.vip.compare(doc.get("opp_ids", []))
                      self._send_json(200, {"ok": True, "data": {"compare": r}})
                      return
                  if action == "watch":
                      r = self.vip.watch(
                          str(doc.get("opp_id", "")), account=account)
                      self._send_json(200, {"ok": True, "data": r})
                      return
                  self._send_json(400, {"ok": False, "error": "accion desconocida"})
              except Exception:
                  self._send_json(500, {
                      "ok": False, "error": "server error",
                      "trace": traceback.format_exc(),
                  })
          RVF
