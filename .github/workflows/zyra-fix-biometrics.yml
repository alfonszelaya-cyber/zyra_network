          """Casos de uso de red: indicadores GOV-DATA y solicitudes por contrato.

          FIX: las operaciones de red son GLOBALES (no de proyecto), por eso
          su evidencia es la AUDITORIA (que acepta actor sin proyecto), no el
          historial (que exige proyecto_id). Todo el trafico real pasa por el
          outbox existente. Ley 1: sin URL de ZYRA Core, estados honestos.
          """
          from apps.laboratorio.domain.contract import SolicitudRed
          from apps.laboratorio.domain.indicator import IndicadorNacional
          from apps.laboratorio.infrastructure.network.zyra_client import (
              DESTINO_DATOS,
              DESTINO_INDICADOR,
          )
          from apps.laboratorio.shared.contracts.apps_catalog import (
              catalogo,
              contratos_de,
              existe as existe_app,
          )
          from apps.laboratorio.shared.models.identifiers import nuevo_id


          class CasoPublicarIndicador:
              def __init__(self, repo_red, outbox, cliente_zyra, auditoria):
                  self._red = repo_red
                  self._outbox = outbox
                  self._cliente = cliente_zyra
                  self._auditoria = auditoria

              def ejecutar(self, identidad, tipo: str, valor: int) -> dict:
                  indicador = IndicadorNacional(
                      id=nuevo_id("ind"), nombre="LABORATORIO/" + tipo,
                      tipo=tipo, valor=int(valor), origen="laboratorio",
                  )
                  self._red.agregar_indicador(indicador)
                  self._outbox.encolar(
                      "laboratorio.indicador.publicado",
                      DESTINO_INDICADOR,
                      {
                          "nombre": indicador.nombre,
                          "valor": indicador.valor,
                          "origen": indicador.origen,
                      },
                  )
                  self._outbox.procesar(self._cliente.entregar)
                  estadisticas = self._outbox.estadisticas()
                  if estadisticas.get("pendiente", 0) > 0:
                      estado_final = "pendiente"
                  elif estadisticas.get("error", 0) > 0:
                      estado_final = "error"
                  else:
                      estado_final = "enviado"
                      indicador.marcar_enviado()
                  indicador.estado = estado_final
                  self._red.actualizar_indicador(indicador)
                  self._auditoria.registrar(
                      identidad, "indicador.publicar", str(indicador.id), "exito",
                      {"tipo": tipo, "valor": indicador.valor, "estado": estado_final},
                  )
                  return {
                      "indicador": self._a_dict(indicador),
                      "estado_envio": estado_final,
                      "outbox": estadisticas,
                  }

              @staticmethod
              def _a_dict(indicador) -> dict:
                  return {
                      "id": str(indicador.id),
                      "nombre": indicador.nombre,
                      "tipo": indicador.tipo,
                      "valor": indicador.valor,
                      "origen": indicador.origen,
                      "estado": indicador.estado,
                      "sello_hash": indicador.sello_hash,
                      "creado_en": indicador.creado_en.isoformat(),
                  }


          class CasoSolicitarDatos:
              def __init__(self, repo_red, outbox, cliente_zyra, auditoria):
                  self._red = repo_red
                  self._outbox = outbox
                  self._cliente = cliente_zyra
                  self._auditoria = auditoria

              def ejecutar(self, identidad, app_destino: str, contrato: str, carga: dict = None) -> dict:
                  if not existe_app(app_destino):
                      raise ValueError("App ZYRA desconocida: " + repr(app_destino))
                  contratos_validos = contratos_de(app_destino)
                  if contrato not in contratos_validos:
                      raise ValueError(
                          "Contrato invalido para " + app_destino + ": " + repr(contrato)
                          + ". Validos: " + ", ".join(contratos_validos)
                      )
                  solicitud = SolicitudRed(
                      id=nuevo_id("sol"),
                      app_destino=app_destino,
                      contrato=contrato,
                      solicitante_zid=identidad.zid,
                  )
                  self._red.agregar_solicitud(solicitud)
                  self._outbox.encolar(
                      "laboratorio.datos.solicitados",
                      DESTINO_DATOS,
                      {
                          "app_destino": app_destino,
                          "contrato": contrato,
                          "solicitante": identidad.zid,
                          "carga": dict(carga or {}),
                      },
                  )
                  self._outbox.procesar(self._cliente.entregar)
                  estadisticas = self._outbox.estadisticas()
                  if estadisticas.get("pendiente", 0) > 0:
                      solicitud.respuesta = "Encolada; se entrega cuando ZYRA Core responda."
                  elif estadisticas.get("error", 0) > 0:
                      solicitud.marcar_error("Error de red al entregar")
                  else:
                      solicitud.marcar_enviada("Entregada a ZYRA Core")
                  self._red.actualizar_solicitud(solicitud)
                  self._auditoria.registrar(
                      identidad, "solicitud.crear", str(solicitud.id), "exito",
                      {"app": app_destino, "contrato": contrato, "estado": solicitud.estado},
                  )
                  return {
                      "solicitud": self._a_dict(solicitud),
                      "estado": solicitud.estado,
                      "outbox": estadisticas,
                  }

              @staticmethod
              def _a_dict(solicitud) -> dict:
                  return {
                      "id": str(solicitud.id),
                      "app_destino": solicitud.app_destino,
                      "contrato": solicitud.contrato,
                      "solicitante_zid": solicitud.solicitante_zid,
                      "estado": solicitud.estado,
                      "respuesta": solicitud.respuesta,
                      "creado_en": solicitud.creado_en.isoformat(),
                  }


          class CasoListarContratos:
              def __init__(self, repo_red):
                  self._red = repo_red

              def catalogo(self) -> dict:
                  solicitudes = self._red.listar_solicitudes()
                  indicadores = self._red.listar_indicadores()
                  return {
                      "contratos": catalogo(),
                      "total_apps": len(catalogo()),
                      "solicitudes": solicitudes,
                      "total_solicitudes": len(solicitudes),
                      "indicadores": indicadores,
                      "total_indicadores": len(indicadores),
                  }
