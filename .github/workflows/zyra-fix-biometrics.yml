name: "AGRO COMPLETE v4: fix test (estado created + registro de app)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - parche test: created + register_app en test de red"
        run: |
          python3 - <<'PATCHEOF'
          from pathlib import Path

          p = Path("apps/agro/tests/test_agro_superapp.py")
          if not p.exists():
              print("MISS test no existe")
              raise SystemExit(1)
          t = p.read_text(encoding="utf-8")
          cambios = []

          if 'assert d["sales"][0]["status"] == "open"' in t:
              t = t.replace(
                  'assert d["sales"][0]["status"] == "open"',
                  'assert d["sales"][0]["status"] == "created"')
              cambios.append("OK estado created (era open)")

          if "ZyraLink(client).register_app()" not in t:
              marker = "client = NetworkClient(net_base, max_retries=1)"
              idx = t.find(marker)
              if idx < 0:
                  print("MISS ancla client no encontrada")
                  raise SystemExit(1)
              ls = t.rfind("\n", 0, idx) + 1
              le = t.find("\n", idx)
              line = t[ls:le]
              indent = line[:len(line) - len(line.lstrip())]
              ins = (
                  indent + "from apps.agro.services.zyra_link import ZyraLink\n"
                  + indent + "reg = ZyraLink(client).register_app()\n"
                  + indent + 'assert reg[0] is True, "apps/register fallo"\n'
              )
              t = t[:le + 1] + ins + t[le + 1:]
              cambios.append("OK register_app antes de vender (protocolo de la Red)")

          if not cambios:
              print("SKIP ya aplicado")
              raise SystemExit(0)

          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          for c in cambios:
              print(c)
          print("WROTE", p)
          PATCHEOF

      - name: "Paso 2 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO COMPLETE v4: fixes de test" -m "Estado de venta 'created' (contrato real del store); registro de app (/apps/register) antes de usar caps de la Red en el test online, segun protocolo W19 (registered-apps enforced)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
