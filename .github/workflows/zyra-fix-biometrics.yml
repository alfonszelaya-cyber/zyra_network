name: "AGRO RUN F v2: fix zyra_link (catalogo+outbox) con verificacion de import"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - fix zyra_link: append real + metodo + verificacion de import en el mismo paso"
        run: |
          python3 - <<'FIXEOF'
          import textwrap
          from pathlib import Path

          p = Path("apps/agro/services/zyra_link.py")
          t = p.read_text(encoding="utf-8")

          cambiado = False

          if "AGRO_EVENT_CATALOG" not in t:
              extra = textwrap.dedent('''\


                  # ---- additive RUN F (GPT-8): ecosistema ----
                  # Contrato tipado de eventos AGRO->Red. Las
                  # demas apps leen estos eventos del history
                  # del ZID en la Red: las apps nunca se hablan
                  # entre si, hablan con la Red.
                  AGRO_EVENT_CATALOG = {
                      "producer.registered": ("producer_id",),
                      "producer.verified": ("producer_id",),
                      "asset.registered": (
                          "producer_id", "asset_type",
                          "asset_id",
                      ),
                      "unit.created": (
                          "producer_id", "unit_id",
                      ),
                      "plan.created": (
                          "producer_id", "plan_id",
                      ),
                      "plan.harvested": (
                          "producer_id", "plan_id",
                      ),
                      "sale.created": (
                          "producer_id", "sale_id",
                      ),
                      "sale.completed": (
                          "producer_id", "sale_id",
                      ),
                      "risk.detected": (
                          "producer_id", "risk_type",
                      ),
                      "incident.created": (
                          "producer_id", "incident_id",
                      ),
                      "aid.requested": (
                          "producer_id", "aid_id",
                      ),
                      "aid.delivered": (
                          "producer_id", "aid_id",
                      ),
                  }


                  def validate_agro_event(
                      event_type, payload,
                  ):
                      """Valida contrato: tipo en catalogo y
                      campos requeridos. Rechaza antes de
                      tocar la Red."""
                      if str(event_type) not in (
                          AGRO_EVENT_CATALOG
                      ):
                          raise ValueError(
                              "evento desconocido: "
                              + str(event_type)
                          )
                      required = AGRO_EVENT_CATALOG[
                          str(event_type)
                      ]
                      missing = []
                      for field in required:
                          if not str(
                              (payload or {}).get(field)
                              or ""
                          ).strip():
                              missing.append(field)
                      if missing:
                          raise ValueError(
                              "campos faltantes: "
                              + ", ".join(missing)
                          )
                      return True


                  def _event_key(event_type, payload):
                      import hashlib as _hl
                      import json as _json
                      canonical = _json.dumps(
                          payload or {}, sort_keys=True
                      )
                      return _hl.sha256(
                          (str(event_type) + "|"
                           + canonical).encode("utf-8")
                      ).hexdigest()


                  def _outbox_db(db):
                      db.execute(
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_event_outbox ("
                          " event_key TEXT PRIMARY KEY,"
                          " event_type TEXT NOT NULL,"
                          " payload TEXT NOT NULL,"
                          " zid TEXT,"
                          " status TEXT NOT NULL,"
                          " attempts INTEGER NOT NULL"
                          " DEFAULT 0,"
                          " last_error TEXT,"
                          " created_at TEXT,"
                          " updated_at TEXT)"
                      )


                  def emit_event_db(
                      db, link, *, zid,
                      event_type, payload,
                  ):
                      """Emision con idempotencia (GPT-8):
                      el mismo evento (tipo+payload) nunca
                      se duplica en la Red."""
                      import json as _json
                      import time as _t
                      validate_agro_event(
                          event_type, payload
                      )
                      key = _event_key(
                          event_type, payload
                      )
                      _outbox_db(db)
                      row = None
                      for fname in ("query_one", "query"):
                          fn = getattr(db, fname, None)
                          if callable(fn):
                              try:
                                  row = fn(
                                      "SELECT status FROM"
                                      " agro_event_outbox"
                                      " WHERE event_key = ?",
                                      (key,),
                                  )
                              except Exception:
                                  row = None
                              if row:
                                  break
                      if row:
                          try:
                              prior = str(row["status"])
                          except Exception:
                              prior = str(row[0])
                          if prior == "sent":
                              return {
                                  "event_key": key,
                                  "deduplicated": True,
                                  "status": "sent",
                              }
                      payload_json = _json.dumps(
                          payload or {}, sort_keys=True
                      )
                      detail = _json.dumps(
                          {
                              "event_type": str(
                                  event_type
                              ),
                              **(payload or {}),
                          },
                          sort_keys=True,
                      )
                      ok, data, err = (
                          link.record_agro_event(
                              zid,
                              str(event_type),
                              detail,
                          )
                      )
                      ts = _t.strftime(
                          "%Y-%m-%dT%H:%M:%SZ",
                          _t.gmtime(),
                      )
                      status = "sent" if ok else "failed"
                      if row:
                          db.execute(
                              "UPDATE"
                              " agro_event_outbox SET"
                              " status = ?, attempts ="
                              " attempts + 1,"
                              " last_error = ?, zid = ?,"
                              " updated_at = ? WHERE"
                              " event_key = ?",
                              (status, str(err or ""),
                               str(zid), ts, key),
                          )
                      else:
                          db.execute(
                              "INSERT INTO"
                              " agro_event_outbox ("
                              " event_key, event_type,"
                              " payload, zid, status,"
                              " attempts, last_error,"
                              " created_at, updated_at)"
                              " VALUES (?, ?, ?, ?, ?, 1,"
                              " ?, ?, ?)",
                              (key, str(event_type),
                               payload_json, str(zid),
                               status, str(err or ""),
                               ts, ts),
                          )
                      return {
                          "event_key": key,
                          "sent": bool(ok),
                          "status": status,
                          "error": (
                              str(err) if err else None
                          ),
                      }


                  def outbox_stats_db(db):
                      rows = []
                      for name in (
                          "query_all", "query", "fetchall"
                      ):
                          fn = getattr(db, name, None)
                          if callable(fn):
                              try:
                                  got = fn(
                                      "SELECT status,"
                                      " COUNT(*) AS n FROM"
                                      " agro_event_outbox"
                                      " GROUP BY status"
                                  )
                              except Exception:
                                  got = None
                              if got:
                                  rows = list(got)
                                  break
                      by_status = {}
                      total = 0
                      for r in rows:
                          try:
                              st = str(r["status"])
                              n = int(r["n"])
                          except Exception:
                              continue
                          by_status[st] = n
                          total += n
                      return {
                          "total": total,
                          "by_status": by_status,
                      }


                  def outbox_pending_db(db, limit=20):
                      for name in (
                          "query_all", "query", "fetchall"
                      ):
                          fn = getattr(db, name, None)
                          if callable(fn):
                              try:
                                  got = fn(
                                      "SELECT event_key,"
                                      " event_type, payload,"
                                      " zid, status, attempts,"
                                      " last_error, updated_at"
                                      " FROM"
                                      " agro_event_outbox"
                                      " WHERE status !="
                                      " 'sent' ORDER BY"
                                      " updated_at LIMIT ?",
                                      (int(limit),),
                                  )
                              except Exception:
                                  got = None
                              if got:
                                  return [
                                      dict(r) for r in got
                                  ]
                      return []


                  def retry_pending_db(
                      db, link, zid, limit=10,
                  ):
                      """Reintento de pendientes (GPT-8);
                      respeta idempotencia."""
                      import json as _json
                      rows = outbox_pending_db(
                          db, limit=limit
                      )
                      results = []
                      for r in rows:
                          try:
                              payload = _json.loads(
                                  str(r.get("payload"))
                              )
                          except Exception:
                              payload = {}
                          res = emit_event_db(
                              db, link,
                              zid=str(
                                  r.get("zid") or zid
                              ),
                              event_type=str(
                                  r.get("event_type")
                              ),
                              payload=payload,
                          )
                          results.append(res)
                      return {
                          "retried": len(results),
                          "results": results,
                      }
              ''')
              t = t.rstrip("\n") + "\n" + extra
              cambiado = True

          if "def network_status(" not in t:
              meth = (
                  "\n"
                  "    def network_status(self):\n"
                  "        \"\"\"GPT-8: salud del enlace\n"
                  "        AGRO->Red en vivo.\"\"\"\n"
                  "        ok, data, err = self._client.get(\n"
                  "            \"/health\"\n"
                  "        )\n"
                  "        return {\n"
                  "            \"reachable\": bool(ok),\n"
                  "            \"error\": (\n"
                  "                str(err) if err else None\n"
                  "            ),\n"
                  "            \"catalog_events\": len(\n"
                  "                AGRO_EVENT_CATALOG\n"
                  "            ),\n"
                  "        }\n"
              )
              t = t.rstrip("\n") + "\n" + meth
              cambiado = True

          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")

          # ---- VERIFICACION DURA en el mismo paso ----
          escrito = p.read_text(encoding="utf-8")
          for simbolo in (
              "AGRO_EVENT_CATALOG",
              "def validate_agro_event(",
              "def emit_event_db(",
              "def outbox_stats_db(",
              "def outbox_pending_db(",
              "def retry_pending_db(",
              "def network_status(",
          ):
              if simbolo not in escrito:
                  raise SystemExit(
                      "FALLO VERIFICACION: " + simbolo
                      + " no quedo en el archivo"
                  )
          print("OK zyra_link: 7 simbolos verificados en disco")

          import importlib
          import apps.agro.services.zyra_link as zl
          importlib.reload(zl)
          for nombre in (
              "AGRO_EVENT_CATALOG",
              "validate_agro_event",
              "emit_event_db",
              "outbox_stats_db",
              "outbox_pending_db",
              "retry_pending_db",
          ):
              if not hasattr(zl, nombre):
                  raise SystemExit(
                      "FALLO IMPORT: el modulo no tiene "
                      + nombre
                  )
          if not hasattr(zl.ZyraLink, "network_status"):
              raise SystemExit(
                  "FALLO IMPORT: ZyraLink.network_status"
                  " ausente"
              )
          print("OK import real: modulo emite todos los simbolos")
          print("eventos en catalogo:", len(zl.AGRO_EVENT_CATALOG))
          FIXEOF

      - name: "Paso 2 - verificacion cruzada: server y tests ya referencian lo correcto"
        run: |
          python3 - <<'VEREOF'
          from pathlib import Path

          sp = Path("apps/agro/server.py")
          t = sp.read_text(encoding="utf-8")
          requeridos_server = [
              '("network", "emit"): "network.emit"',
              'if s == ["network", "status"]',
              'if s == ["network", "outbox"]',
              '"emit_event_db"',
          ]
          for req in requeridos_server:
              if req not in t:
                  raise SystemExit(
                      "FALLO server: falta " + req
                  )
          print("OK server: 4 referencias presentes")

          tp = Path("apps/agro/tests/test_agro_superapp.py")
          tt = tp.read_text(encoding="utf-8")
          for req in (
              "test_ecosystem_contract_offline",
              "test_ecosystem_to_network_online",
          ):
              if req not in tt:
                  raise SystemExit(
                      "FALLO tests: falta " + req
                  )
          print("OK tests RUN F presentes")

          mp = Path("apps/agro/security/operation_matrix.py")
          mt = mp.read_text(encoding="utf-8")
          if '"network.emit"' not in mt:
              raise SystemExit("FALLO matrix: network.emit")
          print("OK matrix: network.emit presente")
          VEREOF

      - name: "Paso 3 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN F v2: fix zyra_link con verificacion dura" -m "FIX: el append del catalogo/outbox no se escribria (re-lectura del archivo viejo); ahora una sola lectura, un solo write, y verificacion en el mismo paso: 7 simbolos en disco + import real del modulo + referencias cruzadas server/tests/matrix. A partir de ahora todo parche verifica su aterrizaje antes del GATE."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
