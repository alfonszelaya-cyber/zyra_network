                      '<rect width="300" height="400" fill="#0B1220"/>',
                      '<text x="150" y="34" text-anchor="middle" fill="#94A3B8" '
                      'font-size="16" font-family="sans-serif">' + nombre[:60] + '</text>',
                      '<line x1="0" y1="360" x2="300" y2="360" stroke="#1E293B" stroke-width="3"/>',
                      '<g>',
