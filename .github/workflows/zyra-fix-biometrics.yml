name: ZYRA D1b portal mejorado y PWA conteo dinamico

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD1b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: Portal con cuenta, manifest e instalacion
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          HTML = ROOT / 'portal' / 'index.html'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD1b.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def pedir(url):
              req = urllib.request.Request(url)
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get('Content-Type', '') if e.headers else '', e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, '', str(e)

          def contar():
              nf = 0
              npy = 0
              for p in ROOT.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                      continue
                  nf += 1
                  if p.suffix == '.py':
                      npy += 1
              return nf, npy

          sp_orig = SP_FILE.read_bytes()
          html_orig = HTML.read_bytes()
          creados = []

          def revertir():
              try:
                  SP_FILE.write_bytes(sp_orig)
                  HTML.write_bytes(html_orig)
                  for c in creados:
                      p = ROOT / c
                      if p.exists():
                          p.unlink()
              except Exception:
                  pass

          def png_solido(size, rgb):
              def chunk(tipo, datos):
                  cuerpo = tipo + datos
                  return struct.pack('>I', len(datos)) + cuerpo + struct.pack('>I', zlib.crc32(cuerpo) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              fila = b'\x00' + bytes(rgb) * size
              raw = fila * size
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')

          nf0, np0 = contar()
          add('# D1b - PORTAL MEJORADO + PWA (conteo dinamico corregido)')
          add('')
          add('Correccion #778: el gate usaba un numero viejo (4502) en vez del snapshot dinamico.')
          add('Snapshot inicial: archivos=%d python=%d' % (nf0, np0))
          add('')

          add('## C1. Anclas (todas deben ser exactamente 1)')
          add('')
          t_sp = sp_orig.decode('utf-8')
          t_html = html_orig.decode('utf-8')
          m_body = re.findall(r'<body[^>]*>', t_html)
          anclas = {
              'sp_verificar_js': t_sp.count('        if path == "/verificar.js":'),
              'html_cierre_head': t_html.count('</head>'),
              'html_cierre_body': t_html.count('</body>'),
              'html_apertura_body': len(m_body),
          }
          for k, v in anclas.items():
              add('- %s: %d' % (k, v))
          anclas_ok = all(v == 1 for v in anclas.values())
          gate('anclas_unicas', anclas_ok)
          if not anclas_ok:
              add('')
              add('**ANCHOR NO UNICO: nada editado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseD1b.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS NO UNICOS - sin cambios')
          add('')

          add('## C2. Archivos nuevos de la PWA')
          add('')
          MANIFEST = {
              'name': 'ZYRA SuperApp',
              'short_name': 'ZYRA',
              'start_url': '/',
              'display': 'standalone',
              'background_color': '#0d1117',
              'theme_color': '#0d1117',
              'icons': [
                  {'src': '/icon-192.png', 'sizes': '192x192', 'type': 'image/png'},
                  {'src': '/icon-512.png', 'sizes': '512x512', 'type': 'image/png'},
              ],
          }
          SW_LINES = [
              "var CACHE='zyra-v1';",
              "self.addEventListener('install',function(e){e.waitUntil(caches.open(CACHE).then(function(c){return c.addAll(['/','/manifest.json']);}));self.skipWaiting();});",
              "self.addEventListener('activate',function(e){e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k!==CACHE;}).map(function(k){return caches.delete(k);}));}).then(function(){return self.clients.claim();}));});",
              "self.addEventListener('fetch',function(e){var u=new URL(e.request.url);if(u.pathname==='/'||u.pathname==='/manifest.json'){e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request);}));}});",
          ]
          ya = (ROOT / 'portal' / 'manifest.json').exists()
          if ya:
              add('- Ya existian (idempotente).')
          else:
              (ROOT / 'portal' / 'manifest.json').write_text(json.dumps(MANIFEST, indent=2, ensure_ascii=False), encoding='utf-8')
              creados.append('portal/manifest.json')
              (ROOT / 'portal' / 'sw.js').write_text('\n'.join(SW_LINES) + '\n', encoding='utf-8')
              creados.append('portal/sw.js')
              (ROOT / 'portal' / 'icon-192.png').write_bytes(png_solido(192, (35, 134, 54)))
              creados.append('portal/icon-192.png')
              (ROOT / 'portal' / 'icon-512.png').write_bytes(png_solido(512, (35, 134, 54)))
              creados.append('portal/icon-512.png')
              add('- creados: %s' % ', '.join(creados))
          gate('pwa_creada', True)
          add('')

          add('## C3. superapp.py: servir los archivos de la PWA')
          add('')
          if '"/manifest.json"' in t_sp:
              add('- Ya servidas (idempotente).')
          else:
              RUTAS = [
                  '        if path == "/manifest.json":',
                  '            self._send(200, "application/manifest+json", self._read_portal("manifest.json"))',
                  '            return',
                  '        if path == "/sw.js":',
                  '            self._send(200, "application/javascript; charset=utf-8", self._read_portal("sw.js"))',
                  '            return',
                  '        if path == "/icon-192.png":',
                  '            self._send(200, "image/png", self._read_portal("icon-192.png"))',
                  '            return',
                  '        if path == "/icon-512.png":',
                  '            self._send(200, "image/png", self._read_portal("icon-512.png"))',
                  '            return',
                  '',
              ]
              pos = t_sp.find('        if path == "/verificar.js":')
              t_sp = t_sp[:pos] + '\n'.join(RUTAS) + '\n' + t_sp[pos:]
              SP_FILE.write_text(t_sp, encoding='utf-8')
              add('- 4 rutas de PWA insertadas en do_GET.')
          gate('rutas_pwa', True)
          add('')

          add('## C4. index.html: barra de cuenta + instalacion')
          add('')
          if 'btn-instalar' in t_html:
              add('- Ya aplicado (idempotente).')
          else:
              HEAD_INS = [
                  '<link rel="manifest" href="/manifest.json">',
                  '<meta name="theme-color" content="#0d1117">',
              ]
              BARRA = [
                  '<div style="background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">',
                  '<b style="color:#e6edf3">ZYRA</b>',
                  '<a href="/entrar" style="color:#58a6ff">Entrar</a>',
                  '<a href="/salir" style="color:#8b949e">Salir</a>',
                  '<button id="btn-instalar" onclick="instalarApp()" style="display:none;background:#238636;color:#ffffff;border:none;border-radius:6px;padding:6px 12px;font-weight:700">Instalar app</button>',
                  '</div>',
              ]
              SCRIPT = [
                  '<script>',
                  'var _zp=null;',
                  "window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_zp=e;var b=document.getElementById('btn-instalar');if(b){b.style.display='inline-block';}});",
                  'function instalarApp(){if(_zp){_zp.prompt();_zp=null;}}',
                  "if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}",
                  '</script>',
              ]
              t2 = t_html
              pos = t2.find('</head>')
              t2 = t2[:pos] + '\n'.join(HEAD_INS) + '\n' + t2[pos:]
              m_body2 = re.search(r'<body[^>]*>', t2)
              fin_body = m_body2.end()
              t2 = t2[:fin_body] + '\n' + '\n'.join(BARRA) + '\n' + t2[fin_body:]
              pos = t2.find('</body>')
              t2 = t2[:pos] + '\n'.join(SCRIPT) + '\n' + t2[pos:]
              HTML.write_text(t2, encoding='utf-8')
              add('- head: manifest + theme-color. body: barra de cuenta + script de instalacion.')
          gate('html_editado', True)
          add('')

          add('## C5. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(SP_FILE), doraise=True)
              add('- py_compile superapp.py: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## C6. Arranque real del sistema')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d1b', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-d1b', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cuerpo).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps_vivas', spv and len(apps) == 8)
          add('')

          add('## C7. Verificacion de la PWA en vivo')
          add('')
          if spv:
              st, ct, cuerpo = pedir(BSP + '/manifest.json')
              ok_m = (st == 200 and 'ZYRA' in cuerpo)
              add('- GET /manifest.json -> %s %s' % (st, 'OK' if ok_m else 'FALLO'))
              gate('manifest_servido', ok_m)
              st, ct, cuerpo = pedir(BSP + '/sw.js')
              ok_s = (st == 200 and 'caches' in cuerpo)
              add('- GET /sw.js -> %s %s' % (st, 'OK' if ok_s else 'FALLO'))
              gate('sw_servido', ok_s)
              st, ct, cuerpo = pedir(BSP + '/icon-192.png')
              ok_i = (st == 200 and 'image/png' in ct)
              add('- GET /icon-192.png -> %s (%s) %s' % (st, ct[:20], 'OK' if ok_i else 'FALLO'))
              gate('icono_servido', ok_i)
              st, ct, cuerpo = pedir(BSP + '/')
              ok_p = (st == 200 and 'manifest.json' in cuerpo and 'btn-instalar' in cuerpo)
              add('- GET / (portal) -> %s %s' % (st, 'OK' if ok_p else 'FALLO'))
              gate('portal_mejorado', ok_p)
              st, ct, cuerpo = pedir(BSP + '/entrar')
              ok_e = (st == 200 and 'form' in cuerpo)
              add('- GET /entrar -> %s %s' % (st, 'OK' if ok_e else 'FALLO'))
              gate('entrar_funciona', ok_e)
              st, _h, cuerpo = pedir(BSP + '/laboratorio/ui')
              add('- guard intacto sin sesion: /laboratorio/ui -> %s (401 esperado)' % st)
              gate('seguridad_intacta', st == 401)
          else:
              gate('manifest_servido', False)
              gate('sw_servido', False)
              gate('icono_servido', False)
              gate('portal_mejorado', False)
              gate('entrar_funciona', False)
              gate('seguridad_intacta', False)
          add('')

          add('## C8. Conteo DINAMICO (snapshot antes vs despues)')
          add('')
          nf1, np1 = contar()
          esp_nf = nf0 + len(creados)
          add('- archivos: %d (esperado %d = %d inicial + %d creados)' % (nf1, esp_nf, nf0, len(creados)))
          add('- python: %d (esperado %d)' % (np1, np0))
          gate('conteo_dinamico', nf1 == esp_nf and np1 == np0)
          add('')

          criticos = ('anclas_unicas', 'compila', 'ocho_apps_vivas', 'manifest_servido', 'portal_mejorado', 'seguridad_intacta', 'conteo_dinamico')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos) and not ya:
              revertir()
              add('## REVERSION APLICADA - archivos restaurados, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**PWA VERIFICADA COMPLETA. Commit. Tras el deploy: abre el portal en tu celular y usa Agregar a pantalla de inicio o el boton Instalar app.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseD1b.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D1b terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(portal): barra de cuenta y PWA instalable (manifest, sw, iconos)"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseD1b-zyra
          path: faseD1b.json
          if-no-files-found: ignore
