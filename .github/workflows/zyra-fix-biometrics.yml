name: "CONSOL-3 v2: 14 metodos reales -> routers (delegaciones con nombres AST sin anotaciones — causa del SyntaxError) + limpieza backup + regresion + marcadores"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[ESCRITURA] routers con firmas originales + server con delegaciones por nombres AST"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              tree = ast.parse(src)
              cls = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and \
                          "Handler" in node.name:
                      cls = node
              if cls is None:
                  raise RuntimeError("no handler")

              # imports del server para los routers
              imports = []
              for node in tree.body:
                  if isinstance(node, (ast.Import,
                                       ast.ImportFrom)):
                      imports.append(ast.unparse(node))

              targets = ["_aid_payload", "_aid_network_seq",
                         "_aid_request", "_aid_eligibility",
                         "_aid_approve", "_aid_assign",
                         "_aid_deliver", "_aid_confirm",
                         "_screen_ayudas",
                         "_screen_ayudas_gobierno",
                         "_screen_producer",
                         "_screen_government",
                         "_screen_bank", "_home"]
              nodes = {}
              for node in cls.body:
                  if isinstance(node, (ast.FunctionDef,
                                       ast.AsyncFunctionDef)) \
                          and node.name in targets:
                      nodes[node.name] = node
              out("- encontrados " + str(len(nodes)) + "/"
                  + str(len(targets)))
              if len(nodes) < 14:
                  raise RuntimeError("faltan metodos — abort")

              def call_args(node):
                  a = node.args
                  parts = []
                  for arg in (a.posonlyargs + a.args):
                      if arg.arg == "self":
                          continue
                      parts.append(arg.arg)
                  if a.vararg:
                      parts.append("*" + a.vararg.arg)
                  for arg in a.kwonlyargs:
                      parts.append(arg.arg + "="
                                   + arg.arg)
                  if a.kwarg:
                      parts.append("**" + a.kwarg.arg)
                  return ", ".join(parts)

              lines = src.splitlines(keepends=True)
              aid_parts = []
              scr_parts = []
              # reemplazos de atras hacia adelante
              items = sorted(nodes.items(),
                             key=lambda kv: -kv[1].lineno)
              for name, node in items:
                  lo = node.lineno
                  bs = node.body[0].lineno
                  hi = node.end_lineno
                  full = "".join(lines[lo-1:hi])
                  fn = "h_" + name[1:]
                  rtext = full.replace(
                      "def " + name + "(",
                      "def " + fn + "(", 1)
                  if name.startswith("_aid"):
                      aid_parts.append(rtext)
                  else:
                      scr_parts.append(rtext)
                  call = call_args(node)
                  deleg = ("        from apps.agro.routers."
                           + ("aid_router import " + fn
                              if name.startswith("_aid")
                              else "screens_router import "
                                   + fn) + "\n"
                           "        return " + fn + "(self"
                           + (", " + call if call else "")
                           + ")\n")
                  # conservar firma, reemplazar cuerpo
                  new_lines = (lines[lo-1:bs-1]
                               + [deleg]
                               + [None] * (hi - bs))
                  new_lines = lines[lo-1:bs-1] + [deleg]
                  tail = lines[hi:]
                  lines = (lines[:lo-1]
                           + lines[lo-1:bs-1]
                           + [deleg]
                           + tail)
              hdr = ('"""AGRO routers (CONSOL-3 v2, regla 77)\n'
                     '- funciones extraidas de server.py con'
                     ' firma original intacta\n'
                     '- primer parametro "self" = el handler\n'
                     '- comportamiento identico"""\n'
                     'from __future__ import annotations\n\n'
                     + "\n".join(imports) + "\n\n\n")
              rp1 = pathlib.Path(
                  "apps/agro/routers/aid_router.py")
              rp1.write_text(hdr + "\n\n".join(aid_parts),
                             encoding="utf-8")
              py_compile.compile(str(rp1), doraise=True)
              out("- **aid_router.py: "
                  + str(len(aid_parts)) + " funciones OK**")
              rp2 = pathlib.Path(
                  "apps/agro/routers/screens_router.py")
              rp2.write_text(hdr + "\n\n".join(scr_parts),
                             encoding="utf-8")
              py_compile.compile(str(rp2), doraise=True)
              out("- **screens_router.py: "
                  + str(len(scr_parts)) + " funciones OK**")

              new_src = "".join(lines)
              tree2 = ast.parse(new_src)
              SP.write_text(new_src, encoding="utf-8")
              py_compile.compile(str(SP), doraise=True)
              n_now = len(new_src.splitlines())
              out("- **server.py: 2811 -> " + str(n_now)
                  + " lineas (delegaciones con nombres"
                    " AST, sin anotaciones — causa del"
                    " SyntaxError anterior corregida)**")

              # limpieza: backup redundante ya committeado
              bak = pathlib.Path(
                  "apps/agro/server_backup_original.py")
              if bak.exists():
                  bak.unlink()
                  out("- server_backup_original.py eliminado"
                      " (regresion valida; original en git"
                      " history)")
              # routers viejos regenerados (ya sobrescritos)

              with open("/tmp/consol3_ok", "w") as f:
                  f.write("OK")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO — revert automatico")
              try:
                  subprocess_r = os.system(
                      "git checkout -- apps/agro/server.py"
                      " 2>/dev/null")
                  out("- server.py restaurado desde git")
              except Exception:
                  pass
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              with open("/tmp/consol3_ok", "w") as f:
                  f.write("FAIL")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion AGRO completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — refactor VALIDADO" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed)" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -50 /tmp/x3.out; echo '```'; } >> "$SUM"
            git checkout -- apps/agro/server.py
            rm -f apps/agro/routers/aid_router.py apps/agro/routers/screens_router.py
            echo "- server.py RESTAURADO (estado estable)" >> "$SUM"
            echo "FAIL" > /tmp/consol3_ok
          fi
          exit 0

      - name: "[ENTREGA] commit solo si AGRO verde + marcador OK"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/consol3_ok 2>/dev/null || echo FAIL)" != "OK" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**CONSOL-3 v2 BLOQUEADA — server revertido al estado estable (57 tests). Correccion puntual en el proximo run.**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**CONSOL-3: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(CONSOL-3 v2, regla 77): server.py AGRO — 14 metodos reales (ciclo de ayudas x8 + pantallas x4 + _home + _aid_network_seq) extraidos a routers/aid_router.py y routers/screens_router.py con FIRMA ORIGINAL intacta; delegaciones generadas con nombres de parametros via AST (sin anotaciones — causa del SyntaxError previo); server_backup_original.py eliminado (validado por regresion, original en git history); regresion AGRO verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**CONSOL-3 v2 OK — server reducido y validado. Siguiente fase B: _post gigante por tramos (o queda asi si usted lo prefiere — ya cumple funcionalidad).**"
          exit 0
