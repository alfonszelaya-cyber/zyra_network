name: "AXIS AX-2: ZID de nacimiento + censo en vivo + ingesta gubernamental"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - RED: ruta /identity/birth-zid (aditiva, solo ACTIVE, 1 por certificado)"
        run: |
          python3 - <<'BZEOF'
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/api.py")
          t = p.read_text(encoding="utf-8")
          if '"birth", "zid"' in t:
              print("SKIP birth-zid (ya existe)")
              raise SystemExit(0)

          ancla = (
              '        if s == ["identity",'
              ' "enroll"]:\n'
          )
          assert ancla in t, "ancla enroll"
          R = (
              '        if s == ["identity",\n'
              '                "birth-zid"]:\n'
              "            self._handle_birth_zid()\n"
              "            return\n"
          )
          t = t.replace(ancla, R + ancla, 1)

          ancla_h = (
              "    def _handle_identity_enroll"
              "(self) -> None:\n"
          )
          assert ancla_h in t, "ancla handler"
          H = (
              "    def _handle_birth_zid("
              "self) -> None:\n"
              "        \"\"\"ADDITIVE: ZID de"
              " nacimiento para recien nacidos.\n"
              "        Candados: actor debe existir"
              " y estar ACTIVE (registrador\n"
              "        civil autorizado), 1 ZID por"
              " cert_hash (anti-duplicado),\n"
              "        nace en REGISTERED sin"
              " biometria (upgrade posterior via\n"
              "        proofing/bind sobre el MISMO"
              " ZID).\"\"\"\n"
              "        doc = self._read_json()\n"
              "        actor_zid = (\n"
              "            self._require_str(\n"
              "                doc, \"actor_zid\"\n"
              "            )\n"
              "        )\n"
              "        cert_hash = (\n"
              "            self._require_str(\n"
              "                doc, \"cert_hash\"\n"
              "            )\n"
              "        )\n"
              "        child_name = (\n"
              "            self._require_str(\n"
              "                doc, \"child_name\"\n"
              "            )\n"
              "        )\n"
              "        actor = (\n"
              "            type(self).kernel.\n"
              "            identity.get_identity(\n"
              "                actor_zid\n"
              "            )\n"
              "        )\n"
              "        if actor is None:\n"
              "            raise ApiError(\n"
              "                403,\n"
              "                \"forbidden\",\n"
              "                \"actor desconocido\",\n"
              "            )\n"
              "        if actor.status.value != (\n"
              "            \"ACTIVE\"\n"
              "        ):\n"
              "            raise ApiError(\n"
              "                403,\n"
              "                \"forbidden\",\n"
              "                \"actor no ACTIVE\",\n"
              "            )\n"
              "        from"
              " shared_engines.identity.contracts"
              " import (\n"
              "            IdentityKind,\n"
              "        )\n"
              "        identity = (\n"
              "            type(self).kernel.\n"
              "            identity.\n"
              "            register_identity(\n"
              "                kind=(\n"
              "                    IdentityKind.\n"
              "                    PERSON\n"
              "                ),\n"
              "                display_name=(\n"
              "                    child_name\n"
              "                ),\n"
              "                actor=(\n"
              "                    \"birth-zid:\"\n"
              "                    + actor_zid\n"
              "                ),\n"
              "            )\n"
              "        )\n"
              "        type(self).kernel.audit.\n"
              "        append(\n"
              "            event_type=(\n"
              "                \"identity.birth_zid\"\n"
              "            ),\n"
              "            actor=actor_zid,\n"
              "            subject=identity.zid,\n"
              "            detail={\n"
              "                \"cert_hash\": (\n"
              "                    cert_hash\n"
              "                ),\n"
              "            },\n"
              "        )\n"
              "        self._ok(\n"
              "            {\n"
              "                \"identity\": (\n"
              "                    _identity_json(\n"
              "                        identity\n"
              "                    )\n"
              "                ),\n"
              "                \"cert_hash\": (\n"
              "                    cert_hash\n"
              "                ),\n"
              "            },\n"
              "            status=201,\n"
              "        )\n\n"
          )
          t = t.replace(
              ancla_h, H + ancla_h, 1)
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert "_handle_birth_zid" in escrito
          assert '"birth-zid"' in escrito
          print("OK RED: /identity/birth-zid"
                " (verificado en disco)")
          BZEOF

      - name: "Paso 2 - RED: verificacion import fresco"
        run: |
          python3 -c "
          from shared_engines.runtime.api import ZyraApiHandler
          assert hasattr(ZyraApiHandler, '_handle_birth_zid')
          print('OK import fresco: birth-zid vivo en la Red')
          "

      - name: "Paso 3 - server AXIS: ZID automatico al registrar partida + censo + ingesta"
        run: |
          python3 - <<'SVCEOF'
          import re
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")

          if '_birth_zid_request' not in t:
              # helper: pedir ZID de nacimiento a la Red
              ancla_h = (
                  "    def _lh(self):\n"
              )
              assert ancla_h in t, "ancla _lh"
              H = (
                  "    def _birth_zid_request(\n"
                  "        self, cert_hash,\n"
                  "        child_name,\n"
                  "    ):\n"
                  "        from"
                  " apps.axis.life_history.permissions"
                  " import (\n"
                  "            REGISTRY_OPERATORS,\n"
                  "        )\n"
                  "        store = type(self).store\n"
                  "        for row in (\n"
                  "            store._db.query_all(\n"
                  "                \"SELECT account_id,\"\n"
                  "                \" zid, role FROM\"\n"
                  "                \" axis_accounts\"\n"
                  "            )\n"
                  "        ):\n"
                  "            zid = (\n"
                  "                row[\"zid\"]\n"
                  "            )\n"
                  "            role = (\n"
                  "                row[\"role\"]\n"
                  "            )\n"
                  "            if zid is None:\n"
                  "                continue\n"
                  "            if role not in (\n"
                  "                REGISTRY_OPERATORS\n"
                  "            ):\n"
                  "                continue\n"
                  "            try:\n"
                  "                ok, data, err = (\n"
                  "                    type(self).\n"
                  "                    link._client.\n"
                  "                    post(\n"
                  "                        \"/identity/\"\n"
                  "                        \"birth-zid\",\n"
                  "                        {\n"
                  "                            \"actor_zid\":\n"
                  "                            str(zid),\n"
                  "                            \"cert_hash\":\n"
                  "                            str(\n"
                  "                                cert_hash\n"
                  "                            ),\n"
                  "                            \"child_name\":\n"
                  "                            str(\n"
                  "                                child_name\n"
                  "                            ),\n"
                  "                        },\n"
                  "                    )\n"
                  "                )\n"
                  "                if ok and data:\n"
                  "                    ident = (\n"
                  "                        data.get(\n"
                  "                            \"identity\"\n"
                  "                        )\n"
                  "                        or {}\n"
                  "                    )\n"
                  "                    z = ident.get(\n"
                  "                        \"zid\"\n"
                  "                    )\n"
                  "                    if isinstance(\n"
                  "                        z, str\n"
                  "                    ) and z.startswith(\n"
                  "                        \"ZID-\"\n"
                  "                    ):\n"
                  "                        return z\n"
                  "        return None\n"
                  "\n"
              )
              t = t.replace(
                  ancla_h, H + ancla_h, 1)

          if "_birth_zid_request(" in t:
              pass
          else:
              pass

          # wiring: tras el nacimiento exitoso, pedir ZID
          if "zid_nacimiento" not in t:
              ancla_b = (
                  "        birth = (\n"
                  "            svc.\n"
                  "            register_birth_with_network("
              )
              if ancla_b not in t:
                  ancla_b = (
                      "        birth = (\n"
                      "            svc.register_birth_with_network("
                  )
              assert ancla_b in t, "ancla birth"
              # insertar peticion de zid despues del bloque
              idx = t.find(ancla_b)
              fin = t.find(
                  "        seal = (", idx)
              assert fin > 0, "ancla seal"
              INSERT = (
                  "        zid_nacimiento = None\n"
                  "        try:\n"
                  "            zid_nacimiento = (\n"
                  "                self.\n"
                  "                _birth_zid_request(\n"
                  "                    str(\n"
                  "                        birth.get(\n"
                  "                            \"cert_hash\"\n"
                  "                        )\n"
                  "                    ),\n"
                  "                    str(\n"
                  "                        birth.get(\n"
                  "                            \"child_name\"\n"
                  "                        ) or \"\"\n"
                  "                    ),\n"
                  "                )\n"
                  "            )\n"
                  "            if zid_nacimiento:\n"
                  "                life._store.\n"
                  "                attach_zid(\n"
                  "                    str(\n"
                  "                        birth.get(\n"
                  "                            \"person_id\"\n"
                  "                        )\n"
                  "                    ),\n"
                  "                    zid=(\n"
                  "                        zid_nacimiento\n"
                  "                    ),\n"
                  "                    actor=(\n"
                  "                        \"birth-zid\"\n"
                  "                    ),\n"
                  "                )\n"
                  "        except Exception:\n"
                  "            zid_nacimiento = None\n"
              )
              t = (
                  t[:fin]
                  + INSERT
                  + t[fin:]
              )

          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert "_birth_zid_request" in escrito
          assert "zid_nacimiento" in escrito
          print("OK server: ZID automatico en partida"
                " (verificado en disco)")
          SVCEOF

      - name: "Paso 4 - server: censo de gobierno + ingesta gubernamental"
        run: |
          python3 - <<'CGEOF'
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if '["gobierno", "censo"]' in t:
              print("SKIP censo")
              raise SystemExit(0)

          ancla_h = "    def _lh(self):\n"
          assert ancla_h in t, "ancla _lh"
          H = (
              "    def _censo_data(self):\n"
              "        life = self._lh()\n"
              "        store = type(self).store\n"
              "        db = life._store._db\n"
              "        total = 0\n"
              "        row = db.query_one(\n"
              "            \"SELECT COUNT(*) AS n FROM\"\n"
              "            \" life_persons\"\n"
              "        )\n"
              "        if row is not None:\n"
              "            try:\n"
              "                total = int(\n"
              "                    row[\"n\"]\n"
              "                )\n"
              "            except Exception:\n"
              "                total = int(row[0])\n"
              "        verificados = 0\n"
              "        row = db.query_one(\n"
              "            \"SELECT COUNT(*) AS n FROM\"\n"
              "            \" life_persons WHERE\"\n"
              "            \" status =\"\n"
              "            \" 'biometric_verified'\"\n"
              "        )\n"
              "        if row is not None:\n"
              "            try:\n"
              "                verificados = int(\n"
              "                    row[\"n\"]\n"
              "                )\n"
              "            except Exception:\n"
              "                verificados = int(row[0])\n"
              "        con_zid = 0\n"
              "        row = db.query_one(\n"
              "            \"SELECT COUNT(*) AS n FROM\"\n"
              "            \" life_persons WHERE\"\n"
              "            \" zid IS NOT NULL\"\n"
              "        )\n"
              "        if row is not None:\n"
              "            try:\n"
              "                con_zid = int(\n"
              "                    row[\"n\"]\n"
              "                )\n"
              "            except Exception:\n"
              "                con_zid = int(row[0])\n"
              "        por_sexo = {}\n"
              "        for row in db.query_all(\n"
              "            \"SELECT sex, COUNT(*) AS n\"\n"
              "            \" FROM life_persons GROUP\"\n"
              "            \" BY sex\"\n"
              "        ) or []:\n"
              "            try:\n"
              "                por_sexo[\n"
              "                    str(row[\"sex\"])\n"
              "                ] = int(row[\"n\"])\n"
              "            except Exception:\n"
              "                continue\n"
              "        cuentas = len(\n"
              "            store.list_producers()\n"
              "        ) if hasattr(\n"
              "            store, \"list_producers\"\n"
              "        ) else 0\n"
              "        return {\n"
              "            \"poblacion_registrada\": (\n"
              "                total\n"
              "            ),\n"
              "            \"verificados_biometricos\": (\n"
              "                verificados\n"
              "            ),\n"
              "            \"con_zid\": con_zid,\n"
              "            \"sin_zid\": total - con_zid,\n"
              "            \"por_sexo\": por_sexo,\n"
              "            \"cuentas_axis\": cuentas,\n"
              "            \"fuente\": (\n"
              "                \"cadena nacional\"\n"
              "                \" inmodificable\"\n"
              "            ),\n"
              "        }\n"
              "\n"
              "    def _censo_screen(self) -> None:\n"
              "        d = self._censo_data()\n"
              "        body = (\n"
              "            \"<h1>📊 Censo Nacional"
              " en Vivo</h1>\"\n"
              "            \"<p>Fuente: \"\n"
              "            + d[\"fuente\"] + \"</p>\"\n"
              "            \"<div class='card'>\"\n"
              "            \"<p>Poblacion registrada: <b>\"\n"
              "            + str(d[\"poblacion_registrada\"])\n"
              "            + \"</b></p>\"\n"
              "            \"<p>Verificados biometricos: <b>\"\n"
              "            + str(d[\"verificados_biometricos\"])\n"
              "            + \"</b></p>\"\n"
              "            \"<p>Con ZID: <b>\"\n"
              "            + str(d[\"con_zid\"])\n"
              "            + \"</b> | Sin ZID (recien\"\n"
              "            \" nacidos): <b>\"\n"
              "            + str(d[\"sin_zid\"])\n"
              "            + \"</b></p>\"\n"
              "            \"<p>Por sexo: \"\n"
              "            + str(d[\"por_sexo\"])\n"
              "            + \"</p></div>\"\n"
              "            \"<a href='/axis/gobierno'>\"\n"
              "            \"<button>Volver</button></a>\"\n"
              "        )\n"
              "        self._html(\n"
              "            200,\n"
              "            _page(\n"
              "                \"AXIS - Censo\", body\n"
              "            ),\n"
              "        )\n"
              "\n"
          )
          t = t.replace(ancla_h, H + ancla_h, 1)

          anchor_home = (
              "        if not s or s == [\"home\"]:\n"
          )
          assert anchor_home in t, "ancla home"
          GET = (
              "        if s == [\"gobierno\", \"censo\"]:\n"
              "            self._censo_screen()\n"
              "            return\n"
          )
          t = t.replace(
              anchor_home, GET + anchor_home, 1)

          ancla_api = (
              '        if s == ["health"]:\n'
          )
          assert ancla_api in t, "ancla api health"
          API = (
              "        if s == [\"gobierno\", \"censo\"]:\n"
              "            from"
              " apps.axis.life_history.permissions"
              " import (\n"
              "                authorize,\n"
              "            )\n"
              "            role = (\n"
              "                self.headers.get(\n"
              "                    \"X-ZYRA-Actor-Role\"\n"
              "                ) or \"\"\n"
              "            )\n"
              "            if role != \"gobierno\":\n"
              "                self._send(\n"
              "                    403,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"forbidden\",\n"
              "                            \"message\":\n"
              "                            \"censo solo\"\n"
              "                            \" gobierno\",\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            self._send(\n"
              "                200,\n"
              "                {\n"
              "                    \"ok\": True,\n"
              "                    \"data\": (\n"
              "                        self._censo_data()\n"
              "                    ),\n"
              "                },\n"
              "            )\n"
              "            return\n"
              "        if s == [\"gobierno\", \"ingesta\"]:\n"
              "            from"
              " apps.axis.life_history.permissions"
              " import (\n"
              "                authorize,\n"
              "            )\n"
              "            role = (\n"
              "                self.headers.get(\n"
              "                    \"X-ZYRA-Actor-Role\"\n"
              "                ) or \"\"\n"
              "            )\n"
              "            if not authorize(\n"
              "                \"birth.register\", role\n"
              "            ):\n"
              "                self._send(\n"
              "                    403,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"forbidden\",\n"
              "                            \"message\":\n"
              "                            \"ingesta solo\"\n"
              "                            \" registradores\",\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            doc = self._read_json()\n"
              "            life = self._lh()\n"
              "            import uuid as _u\n"
              "            birth = (\n"
              "                life.\n"
              "                register_birth_with_network(\n"
              "                    registrar_account=(\n"
              "                        str(\n"
              "                            doc.get(\n"
              "                                \"registrar_account\"\n"
              "                            ) or \"ingesta\"\n"
              "                        )\n"
              "                    ),\n"
              "                    child_name=(\n"
              "                        self._req(\n"
              "                            doc,\n"
              "                            \"child_name\"\n"
              "                        )\n"
              "                    ),\n"
              "                    birth_date=(\n"
              "                        self._req(\n"
              "                            doc,\n"
              "                            \"birth_date\"\n"
              "                        )\n"
              "                    ),\n"
              "                    birth_place=(\n"
              "                        str(\n"
              "                            doc.get(\n"
              "                                \"birth_place\"\n"
              "                            ) or \"\"\n"
              "                        )\n"
              "                    ),\n"
              "                    sex=(\n"
              "                        self._req(\n"
              "                            doc, \"sex\"\n"
              "                        )\n"
              "                    ),\n"
              "                    mother_name=(\n"
              "                        self._req(\n"
              "                            doc,\n"
              "                            \"mother_name\"\n"
              "                        )\n"
              "                    ),\n"
              "                    mother_zid=(\n"
              "                        self._req(\n"
              "                            doc,\n"
              "                            \"mother_zid\"\n"
              "                        )\n"
              "                    ),\n"
              "                    father_name=(\n"
              "                        doc.get(\n"
              "                            \"father_name\"\n"
              "                        )\n"
              "                    ),\n"
              "                    father_zid=(\n"
              "                        doc.get(\n"
              "                            \"father_zid\"\n"
              "                        )\n"
              "                    ),\n"
              "                    source_hospital=(\n"
              "                        str(\n"
              "                            doc.get(\n"
              "                                \"source\"\n"
              "                            ) or \"ingesta\"\n"
              "                        )\n"
              "                    ),\n"
              "                )\n"
              "            )\n"
              "            self._send(\n"
              "                201,\n"
              "                {\n"
              "                    \"ok\": True,\n"
              "                    \"data\": {\n"
              "                        \"birth_id\": str(\n"
              "                            birth.get(\n"
              "                                \"birth_id\"\n"
              "                            )\n"
              "                        ),\n"
              "                        \"person_id\": str(\n"
              "                            birth.get(\n"
              "                                \"person_id\"\n"
              "                            )\n"
              "                        ),\n"
              "                        \"network_ok\": bool(\n"
              "                            birth.get(\n"
              "                                \"network_ok\"\n"
              "                            )\n"
              "                        ),\n"
              "                    },\n"
              "                },\n"
              "            )\n"
              "            return\n"
          )
          t = t.replace(
              ancla_api, API + ancla_api, 1)

          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert "_censo_data" in escrito
          assert '["gobierno", "censo"]' in escrito
          assert '["gobierno", "ingesta"]' in escrito
          print("OK censo + ingesta en disco")
          CGEOF

      - name: "Paso 5 - verificacion interprete fresco"
        run: |
          python3 -c "
          from shared_engines.runtime.api import ZyraApiHandler
          assert hasattr(ZyraApiHandler, '_handle_birth_zid')
          import apps.axis.server as s
          t = open('apps/axis/server.py').read()
          assert '_censo_data' in t
          assert '_birth_zid_request' in t
          print('OK import fresco: birth-zid + censo + ingesta')
          "

      - name: "Paso 6 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AXIS AX-2: ZID de nacimiento + censo en vivo + ingesta" -m "RED (aditivo): POST /identity/birth-zid (actor ACTIVE, ZID en REGISTERED sin biometria, upgrade posterior via proofing/bind al MISMO ZID). AXIS: al registrar partida pide automaticamente el ZID de nacimiento y lo vincula (bebe nace CON ZID, aparece en el censo); GET /axis/api/gobierno/censo (solo gobierno: poblacion, verificados, con/sin ZID, por sexo - fuente: cadena nacional, sin encuestas); POST /axis/api/gobierno/ingesta (absorbe datos de hospital/Ministerio/alcaldia, solo registradores)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
