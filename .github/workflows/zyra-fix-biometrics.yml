name: "ZYRA MARKET (Bloque 5 v3): matematica del test corregida"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-b5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - verificar tiendas ya wired (v2 lo hizo)"
        run: |
          python3 - <<'CHK'
          from pathlib import Path
          txt = Path("apps/subastas/server.py").read_text(encoding="utf-8")
          if "tiendas_store" not in txt:
              print("FALTA wiring - ejecutar v2 completo antes")
              raise SystemExit(1)
          import glob
          files = glob.glob("apps/subastas/modules/005*/tiendas_store.py")
          if not files:
              print("FALTA archivo tiendas_store.py")
              raise SystemExit(1)
          m = Path(files[0]).read_text(encoding="utf-8")
          if "def market_tiendas_api" not in m:
              print("FALTA market_tiendas_api en el modulo")
              raise SystemExit(1)
          print("OK: tiendas wired completo")
          CHK

      - name: "Paso 2 - E2E con matematica correcta (7.5% de 90 = 6.75)"
        run: |
          python3 - <<'EOF'
          import http.cookiejar
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          import uuid
          import re as _re

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-" + uuid.uuid4().hex[:8]}, None)
                  return (False, None, "offline")


          def make_opener():
              cj = http.cookiejar.CookieJar()
              return urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(cj)
              )


          def call(opener, method, url, payload=None, form=None):
              if form is not None:
                  data = urllib.parse.urlencode(form).encode()
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              else:
                  data = json.dumps(payload).encode() if payload is not None else None
                  headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with opener.open(req, timeout=5) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read()[:400].decode("utf-8", "replace")
                  raise AssertionError("HTTP %s %s %s -> %s" % (e.code, method, url, body))


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          op = make_opener()
          uname = "owner" + uuid.uuid4().hex[:6]
          call(op, "POST", base + "/subastas/registro", form={
              "username": uname, "password": "clave123",
              "display_name": "Owner Test", "role": "vendedor"})
          print("1. cuenta dueno OK")

          st, html = call(op, "POST", base + "/subastas/api/tiendas",
                          payload={"action": "create", "name": "Tienda ZYRA",
                                   "description": "de todo", "commission": 7.5})
          assert '"store_id"' in html and '"status": "pending"' in html, html[:300]
          print("2. tienda creada (pending) OK")

          st, html = call(op, "POST", base + "/subastas/api/tiendas",
                          payload={"action": "add_item", "title": "Licuadora",
                                   "price": 50, "stock": 10})
          assert "Licuadora" in html, html[:300]
          m = _re.search(r"ITM-[a-f0-9]{10}", html)
          assert m, html[:300]
          item_id = m.group(0)
          print("3. item agregado:", item_id)

          st, html = call(op, "POST", base + "/subastas/api/tiendas",
                          payload={"action": "promo", "item_id": item_id,
                                   "pct": 10})
          assert '"promo_active": true' in html, html[:300]
          print("4. promocion 10% activada OK")

          st, html = call(op, "POST", base + "/subastas/api/tiendas",
                          payload={"action": "sale", "item_id": item_id, "qty": 2})
          assert '"total": 90.0' in html, html[:300]
          assert '"commission": 6.75' in html, html[:300]
          print("5. venta 2 unidades con promo: total 90.00, comision 7.5% = 6.75 OK")

          st, html = call(op, "GET", base + "/subastas/tienda")
          assert "Metricas" in html
          assert "Stock total: 8" in html
          assert "Ingresos: $90.00" in html
          assert "Comision de la tienda: $6.75" in html
          print("6. pagina tienda: metricas reales OK")

          print("E2E SMOKE OK: Bloque 5 Tiendas completo")
          EOF

      - name: ZYRA MARKET tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/subastas/tests -q || true

      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (Bloque 5 v3): test math fixed (7.5% of 90 = 6.75)" -m "v2 proved the system: sale total 90.00 correct, commission 6.75 correct (system math right). My test wrongly expected 6.30. Fixed assertion. Now full green gate."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
