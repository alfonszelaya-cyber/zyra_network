name: ZYRA D4d auditoria de creadores de ZID en las apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faseD4d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auditoria de creadores de identidad
        run: |
          python3 - <<'PYEOF'
          import ast, json, os, re, sys, traceback
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD4d.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _man

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          add('# AUDITORIA: quien crea identidades/ZID ademas de la Red')
          add('')
          add('Regla del dueno: SOLO la Red crea ZID. Las apps no registran.')
          add('')

          PATRONES = [
              ('llama a /identity/register', re.compile(r'["\']/identity/register["\']')),
              ('llama a /identity/enroll', re.compile(r'["\']/identity/enroll["\']')),
              ('genera Z- literal', re.compile(r'["\']Z-[A-Za-z0-9_]')),
              ('funcion crear_zid/zid', re.compile(r'(?i)def\s+\w*(crear|make|new|generate)\w*zid\w*|def\s+zid\w*')),
              ('uuid como identidad', re.compile(r'uuid\.uuid4\(\)')),
              ('token_hex como identidad', re.compile(r'secrets\.token_hex')),
              ('crea identity local', re.compile(r'(?i)(create_identity|register_identity|nueva_identidad|crear_identidad)')),
              ('form registro en HTML', re.compile(r'<form[^>]*action="[^"]*(regist|signup|crear|enroll)[^"]*"')),
          ]

          add('## A1. Hallazgos por app (codigo fuente con contenido)')
          add('')
          apps_dir = ROOT / 'apps'
          total = 0
          tabla = []
          for app in sorted(apps_dir.iterdir()):
              if not app.is_dir():
                  continue
              hits_app = []
              for p in app.rglob('*.py'):
                  if '__pycache__' in p.parts:
                      continue
                  try:
                      if p.stat().st_size == 0:
                          continue
                  except OSError:
                      continue
                  t = txt(p)
                  for nombre, pat in PATRONES:
                      for m in pat.finditer(t):
                          ln = t.count('\n', 0, m.start()) + 1
                          linea = t.splitlines()[ln - 1].strip()[:130]
                          hits_app.append({'patron': nombre, 'archivo': str(p.relative_to(ROOT)), 'linea': ln, 'codigo': linea})
              for p in app.rglob('*.html'):
                  if '__pycache__' in p.parts:
                      continue
                  t = txt(p)
                  for nombre, pat in PATRONES:
                      for m in pat.finditer(t):
                          ln = t.count('\n', 0, m.start()) + 1
                          hits_app.append({'patron': nombre, 'archivo': str(p.relative_to(ROOT)), 'linea': ln, 'codigo': t.splitlines()[ln - 1].strip()[:130]})
              if hits_app:
                  add('**%s** (%d hallazgos):' % (app.name, len(hits_app)))
                  total += len(hits_app)
                  for h in hits_app[:20]:
                      add('- [%s] `%s:%d`' % (h['patron'], h['archivo'], h['linea']))
                      add('  ```')
                      add('  ' + h['codigo'])
                      add('  ```')
                  if len(hits_app) > 20:
                      add('- ... y %d mas' % (len(hits_app) - 20))
                  add('')
                  tabla.append({'app': app.name, 'hallazgos': len(hits_app),
                                'patrones': sorted(set(h['patron'] for h in hits_app))})
          add('## A2. Resumen')
          add('')
          add('| App | Hallazgos | Patrones |')
          add('|---|---|---|')
          for t2 in tabla:
              add('| %s | %d | %s |' % (t2['app'], t2['hallazgos'], ', '.join(t2['patrones'])))
          add('')
          add('- Total de hallazgos: %d' % total)
          add('- Apps SIN hallazgos (no tocan identidades): %s' % [a.name for a in sorted(apps_dir.iterdir()) if a.is_dir() and a.name not in [t['app'] for t in tabla]])
          add('')
          DATA['tabla'] = tabla
          DATA['total'] = total

          add('## A3. Veredicto preliminar por patron')
          add('')
          add('- `llama a /identity/register o enroll`: la app DELEGA en la Red. Es valido SOLO si pasa por la entrada unica. Si es formulario propio, se neutraliza.')
          add('- `genera Z- literal / uuid / token_hex`: crea identificadores LOCALES. Peligro de ZID duplicado: neutralizar o reemplazar por ZID de la Red.')
          add('- `form registro en HTML`: pantalla de registro propia de la app. Violacion de la entrada unica: redirigir a /registro de la SuperApp.')
          add('')

          add('## A4. Estado actual de superapp.py (tras las reversiones)')
          add('')
          t_sp = txt(ROOT / 'superapp.py')
          marcas = {
              'entrada fail-closed': 'SOLO_EL_PROPIETARIO' in t_sp or 'Registro publico llegara' in t_sp,
              'credenciales.db (clave usuario)': 'credenciales' in t_sp,
              'registro/nuevo': '/registro/nuevo' in t_sp,
              'proxy con x-zyra-zid': 'x-zyra-zid' in t_sp,
              'PWA manifest': '/manifest.json' in t_sp,
              'version banner': '/version' in t_sp,
          }
          for k, v in marcas.items():
              add('- %s: %s' % (k, 'presente' if v else 'NO'))
          add('')
          DATA['superapp'] = marcas

          add('## A5. Contrato de la Red ya confirmado (#786)')
          add('')
          add('```')
          add('POST /identity/enroll  con  doc_image_b64 + selfie_image_b64')
          add('-> la Red verifica biometria -> crea el ZID unico')
          add('```')
          add('')
          add('## Siguiente: D5 con todo el diseno')
          add('')
          add('1. Pantalla de registro biometrico: foto del documento + selfie en vivo (camara) -> /identity/enroll.')
          add('2. La Red crea el ZID. El usuario crea su clave. Sesion unica.')
          add('3. Neutralizacion de los formularios viejos que esta auditoria detecte (segun tu orden, uno por uno).')
          add('4. Diseno completo de la pantalla (limpia, instalar, sin pildora de sesion).')

          Path('faseD4d.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('Auditoria D4d terminada. Hallazgos:', total)
          PYEOF

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseD4d-zyra
          path: faseD4d.json
          if-no-files-found: ignore
