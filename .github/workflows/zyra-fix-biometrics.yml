                      k = str(kind).upper()
                      if k not in _EVENTS:
                          raise ValueError(
                              "kind debe ser "
                              + "/".join(_EVENTS))
                      if str(row["status"]) == "muerto":
                          raise ValueError(
                              "animal MUERTO: sin eventos"
                              " posteriores (regla 66)")
                      eid = ("ANEV-"
                             + uuid.uuid4().hex[:10])
                      db.execute(
                          "INSERT INTO agro_animal_events"
                          " (event_id, animal_id, kind,"
                          " detail, value, event_date,"
                          " created_at) VALUES (?, ?, ?, ?, ?,"
                          " ?, ?)",
                          (eid, str(animal_id), k,
                           str(detail),
                           (float(value) if value
                            is not None else None),
                           str(event_date),
                           str(created_at)))
                      if k == "MUERTE":
                          db.execute(
                              "UPDATE agro_animals SET"
                              " status = 'muerto' WHERE"
                              " animal_id = ?",
                              (str(animal_id),))
                      return {"event_id": eid,
                              "animal_id": str(animal_id),
                              "kind": k,
                              "value": (float(value)
                                        if value is not
                                        None else None)}


                  def events_of_db(db, animal_id):
                      rows = db.query_all(
                          "SELECT event_id, kind, detail,"
                          " value, event_date FROM"
                          " agro_animal_events WHERE animal_id"
