name: ZYRA Fase 3 auth en cliente canonico

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fase3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Edicion del cliente canonico y smoke test
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, py_compile
          import http.server
          import threading
          import importlib.util
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}

          def add(s=''):
              OUT.append(str(s))

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          CANON = ROOT / 'shared_engines' / 'network' / 'network_client.py'
          antes = hashlib.sha256(CANON.read_bytes()).hexdigest()[:12]
          actual = txt(CANON)

          add('# FASE 3 - AUTH EN CLIENTE CANONICO')
          add('')
          add('Editar 1 archivo aqui = las 7 apps heredan por sus shims fachada.')
          add('Compatible hacia atras: sin ZYRA_API_TOKEN el comportamiento es identico al actual.')
          add('')

          NC_LINES = [
          '"""Real HTTP client to ZYRA Network.',
          '',
          'Resilience contract: failures are returned as',
          '(ok=False, data=None, error=...), never raised -',
          'the app keeps working when the Network is down.',
          '',
          'Auth contract: when ZYRA_API_TOKEN is set (or an',
          'explicit api_token is passed) every request carries',
          'an Authorization Bearer token. Without a token the',
          'client behaves exactly as before (backwards compatible).',
          '"""',
          'from __future__ import annotations',
          '',
          'import json',
          'import os',
          'import urllib.request',
          '',
          '',
          'class NetworkClient:',
          '    """HTTP client for ZYRA Network (retries + auth)."""',
          '',
          '    def __init__(',
          '        self,',
          '        base_url: str | None = None,',
          '        *,',
          '        api_token: str | None = None,',
          '        timeout_seconds: float = 5.0,',
          '        max_retries: int = 2,',
          '    ) -> None:',
          '        self._base = (',
          '            base_url',
          '            or os.environ.get("ZYRA_URL", "")',
          '        ).rstrip("/")',
          '        self._token = (',
          '            api_token',
          '            or os.environ.get("ZYRA_API_TOKEN", "")',
          '            or ""',
          '        ).strip()',
          '        self._timeout = timeout_seconds',
          '        self._retries = max(0, max_retries)',
          '',
          '    @property',
          '    def base_url(self) -> str:',
          '        return self._base',
          '',
          '    @property',
          '    def api_token(self) -> str:',
          '        return self._token',
          '',
          '    def get(self, path: str) -> tuple[bool, dict | None, str | None]:',
          '        return self._call("GET", path)',
          '',
          '    def post(self, path: str, payload: dict) -> tuple[bool, dict | None, str | None]:',
          '        return self._call("POST", path, payload)',
          '',
          '    def _headers(self) -> dict:',
          '        headers = {"Content-Type": "application/json"}',
          '        if self._token:',
          '            headers["Authorization"] = "Bearer " + self._token',
          '        return headers',
          '',
          '    def _call(',
          '        self,',
          '        method: str,',
          '        path: str,',
          '        payload: dict | None = None,',
          '    ) -> tuple[bool, dict | None, str | None]:',
          '        if not self._base:',
          '            return (',
          '                False,',
          '                None,',
          '                "ZYRA_URL not configured",',
          '            )',
          '        url = self._base + path',
          '        data = None',
          '        if payload is not None:',
          '            data = json.dumps(',
          '                payload',
          '            ).encode("utf-8")',
          '        last_error = "unknown"',
          '        for attempt in range(',
          '            self._retries + 1',
          '        ):',
          '            try:',
          '                request = urllib.request.Request(',
          '                    url,',
          '                    data=data,',
          '                    method=method,',
          '                    headers=self._headers(),',
          '                )',
          '                with urllib.request.urlopen(',
          '                    request,',
          '                    timeout=self._timeout,',
          '                ) as response:',
          '                    body = json.loads(',
          '                        response.read()',
          '                        .decode("utf-8")',
          '                    )',
          '                if body.get("ok") is True:',
          '                    return (',
          '                        True,',
          '                        body.get("data"),',
          '                        None,',
          '                    )',
          '                error = body.get(',
          '                    "error", {}',
          '                )',
          '                return (',
          '                    False,',
          '                    None,',
          '                    str(',
          '                        error.get(',
          '                            "message",',
          '                            "rejected",',
          '                        )',
          '                    ),',
          '                )',
          '            except Exception as exc:',
          '                last_error = str(exc)',
          '        return False, None, last_error',
          '',
          '    def request(',
          '        self, service: str, payload=None',
          '    ) -> dict:',
          '        """Legacy stub contract, now real."""',
          '        ok, data, error = self.post(',
          '            service, payload or {}',
          '        )',
          '        return {',
          '            "service": service,',
          '            "payload": payload,',
          '            "status": (',
          '                "confirmed"',
          '                if ok',
          '                else "unreachable"',
          '            ),',
          '            "data": data,',
          '            "error": error,',
          '        }',
          ]

          ya_aplicado = 'def _headers' in actual
          if ya_aplicado:
              add('## Edicion: YA aplicada en run anterior (idempotente, sin cambios).')
          else:
              nuevo = '\n'.join(NC_LINES) + '\n'
              CANON.write_text(nuevo, encoding='utf-8')
              add('## Edicion: aplicada (%d lineas escritas).' % len(NC_LINES))
          add('')
          add('- hash antes: %s' % antes)
          add('- hash despues: %s' % hashlib.sha256(CANON.read_bytes()).hexdigest()[:12])
          add('')

          add('## Gate 1 de 2 - compilacion')
          add('')
          try:
              py_compile.compile(str(CANON), doraise=True)
              add('- py_compile: **OK**')
              gate1 = True
          except Exception as e:
              add('- py_compile: **FALLO** %s' % e)
              gate1 = False
          add('')

          add('## Gate 2 de 2 - smoke test con servidor HTTP local real')
          add('')
          recibido = {}

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  recibido['auth'] = self.headers.get('Authorization')
                  cuerpo = json.dumps({'ok': True, 'data': {}}).encode('utf-8')
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(cuerpo)

              def log_message(self, *a):
                  pass

          srv = http.server.HTTPServer(('127.0.0.1', 0), Handler)
          puerto = srv.server_address[1]
          hilo = threading.Thread(target=srv.serve_forever, daemon=True)
          hilo.start()

          spec = importlib.util.spec_from_file_location('nc_audit', str(CANON))
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          os.environ.pop('ZYRA_API_TOKEN', None)
          c1 = mod.NetworkClient('http://127.0.0.1:%d' % puerto)
          c1.get('/prueba')
          sin_token = recibido.get('auth')

          os.environ['ZYRA_API_TOKEN'] = 'smoke-token-abc123'
          c2 = mod.NetworkClient('http://127.0.0.1:%d' % puerto)
          c2.get('/prueba')
          con_token = recibido.get('auth')
          srv.shutdown()

          ok1 = sin_token is None
          ok2 = con_token == 'Bearer smoke-token-abc123'
          add('- SIN token en entorno: header enviado = %s (esperado None) -> %s' % (sin_token, 'OK' if ok1 else 'FALLO'))
          add('- CON token en entorno: header enviado = %s -> %s' % (con_token, 'OK' if ok2 else 'FALLO'))
          gate2 = ok1 and ok2
          add('')
          if gate1 and gate2:
              add('**Resultado: AMBOS GATES OK - seguro para commitear.**')
          else:
              add('**Resultado: FALLO - el commit se abortara.**')
          add('')

          add('## Para la siguiente fase (solo lectura)')
          add('')
          ls = txt(ROOT / 'superapp.py').splitlines()
          ini = None
          for i, l in enumerate(ls):
              if l.strip().startswith('class _SimpleClient'):
                  ini = i
                  break
          if ini is not None:
              add('`_SimpleClient` (el cliente paralelo que usa ciclo) completo:')
              add('```python')
              for l in ls[ini:ini + 70]:
                  add(l.rstrip())
              add('```')
          add('')
          add('render.yaml: %d lineas en total (falta ver el final antes de editarlo).' % len(txt(ROOT / 'render.yaml').splitlines()))
          add('')

          add('## Inventario de otros clientes HTTP del repo')
          add('')
          otros = []
          for p in ROOT.rglob('*.py'):
              nl = p.name.lower()
              if 'client' not in nl or 'use_case' in nl or p.name.startswith('test_'):
                  continue
              if '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              t = txt(p)
              if 'urlopen' in t or 'urllib' in t:
                  otros.append({'ruta': str(p.relative_to(ROOT)),
                                'tiene_auth': 'Authorization' in t})
          for o in otros:
              add('- `%s` auth=%s' % (o['ruta'], o['tiene_auth']))
          if not otros:
              add('- Ninguno ademas del canonico.')
          add('')

          shim = ROOT / 'apps' / 'agro' / 'infrastructure' / 'network' / 'network_client.py'
          add('## Invariantes')
          add('')
          add('- shim agro sin cambios: %s (esperado d79b39e83a8c)' % hashlib.sha256(shim.read_bytes()).hexdigest()[:12])
          npy = sum(1 for p in ROOT.rglob('*.py') if '__pycache__' not in p.parts)
          add('- python total: %d (debe ser 4506)' % npy)
          add('')

          DATA['antes'] = antes
          DATA['ya_aplicado'] = ya_aplicado
          DATA['gate_compilacion'] = gate1
          DATA['smoke_sin_token'] = str(sin_token)
          DATA['smoke_con_token'] = str(con_token)
          DATA['gates_ok'] = gate1 and gate2
          DATA['otros_clientes'] = otros
          Path('fase3.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False), encoding='utf-8')

          out = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if out:
              Path(out).write_text('\n'.join(OUT), encoding='utf-8')
          else:
              Path('fase3.md').write_text('\n'.join(OUT), encoding='utf-8')

          if not (gate1 and gate2):
              raise SystemExit('GATES FALLARON - abortando antes del commit')
          print('Fase 3 OK, gates aprobados')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shared_engines/network/network_client.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(network): Authorization Bearer en cliente canonico, 7 apps heredan"
            git push
            echo "## Commit aplicado - el push dispara un 2do run que dira YA aplicada (normal)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios que commitear (ya aplicado)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase3-zyra
          path: fase3.json
          if-no-files-found: ignore
