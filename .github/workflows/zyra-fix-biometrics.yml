name: ZYRA S2c2 defs de subastas con summary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s2c2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Defs y raiz con summary
        run: |
          python3 - <<'PYEOF'
          import re, sys, traceback
          from pathlib import Path
          ROOT = Path.cwd()
          OUT = []
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = __import__('os').environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 's2c2.md').write_text('\n'.join(OUT), encoding='utf-8')
          try:
              t = (ROOT / 'apps' / 'subastas' / 'server.py').read_text(encoding='utf-8', errors='replace')
              ls = t.splitlines()
              add('# S2c2 - DEFS REALES DE server.py')
              add('')
              add('## Funciones de la clase:')
              add('```python')
              for i, l in enumerate(ls):
                  if re.match(r'    def \w+', l):
                      add('%d: %s' % (i + 1, l.strip()[:120]))
              add('```')
              add('')
              add('## Rutas /subastas/ y que funcion llaman:')
              add('```python')
              for i, l in enumerate(ls):
                  if re.search(r'path\s*==\s*"/subastas(/)?"', l) or re.search(r'path\s*==\s*"/subastas/"', l):
                      ini = max(0, i - 2)
                      for j in range(ini, min(i + 4, len(ls))):
                          add('%d: %s' % (j + 1, ls[j].rstrip()[:140]))
                      add('---')
              add('```')
              add('')
              add('## Contexto lineas 230-250 (la ruta raiz):')
              add('```python')
              for j in range(229, min(252, len(ls))):
                  add('%d: %s' % (j + 1, ls[j].rstrip()[:150]))
              add('```')
          except Exception as e:
              add('ERROR: %s' % e)
              for l in traceback.format_exc().splitlines()[-8:]:
                  add(l)
          escribe()
          print('S2c2 OK')
          PYEOF
