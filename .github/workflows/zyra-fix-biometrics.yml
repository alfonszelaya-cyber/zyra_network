                                  "SELECT * FROM sm_history"
                                  " ORDER BY seq")
                          prev = "GENESIS"
                          for r in rows:
                              payload = (str(r["student_id"])
                                         + "|"
                                         + str(r["event_type"])
                                         + "|"
                                         + str(r["detail"]))
                              expect = self._hash(prev, payload)
                              if (str(r["prev_hash"]) != prev
                                      or str(r["entry_hash"])
                                      != expect):
                                  return False
                              prev = str(r["entry_hash"])
                          return True

                      def history_of(self, student_id
