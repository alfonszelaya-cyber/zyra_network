                      by_species = {}
                      for r in rows:
                          sp = str(r["species"])
                          e = by_species.setdefault(
                              sp, {"vivos": 0, "muertos": 0})
                          if str(r["status"]) == "muerto":
                              e["muertos"] += int(r["n"])
                          else:
                              e["vivos"] += int(r["n"])
                      n_ev = db.query_one(
