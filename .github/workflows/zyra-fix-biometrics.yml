            "family_office/sucesion/menu.py": ("family_office", "Sucesion", "Crear plan|Ver planes"),
            "family_office/tierras_agricolas/menu.py": ("family_office", "Tierras Agricolas", "Registrar finca|Portafolio|Valor total"),
