name: "AXIS AUDIT: extraer traceback real del 500 en gobierno/censo (solo lectura)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: axis-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - pytest del test fallido con -s (muestra el stderr del servidor en vivo)"
        run: |
          python3 -m pytest apps/axis/tests/test_axis.py::test_axz_full_government_flow -vv --tb=long -s || true

      - name: "Paso B - extraccion de codigo: ruta censo + dispatch + helpers de respuesta"
        run: |
          python3 - <<'DUMPEOF'
          from pathlib import Path

          def dump_windows(path, patterns, ctx=8):
              lines = Path(path).read_text(encoding="utf-8").splitlines()
              print("=== " + path + " (" + str(len(lines)) + " lineas) ===")
              for pat in patterns:
                  hits = [i for i, l in enumerate(lines) if pat in l]
                  print()
                  print("--- patron " + repr(pat) + ": "
                        + str(len(hits)) + " coincidencias ---")
                  last = -1
                  for i in hits:
                      a = max(0, i - ctx)
                      b = min(len(lines), i + ctx + 1)
                      if a <= last:
                          a = last + 1
                      if a >= b:
                          continue
                      for n in range(a, b):
                          print(str(n + 1).rjust(5) + ": " + lines[n])
                      last = b - 1

          def dump_range(path, a, b):
              lines = Path(path).read_text(encoding="utf-8").splitlines()
              print()
              print("=== " + path + " lineas "
                    + str(a) + "-" + str(b) + " ===")
              for n in range(a - 1, min(b, len(lines))):
                  print(str(n + 1).rjust(5) + ": " + lines[n])

          dump_windows("apps/axis/server.py", [
              "def do_GET", "def do_POST", "def _dispatch",
              "def _route_get", "def _route_post",
              "def _send", "def _html", "def _page", "def _req",
              "censo", "gobierno", "poblacion", "con_zid",
              "ingesta", "handle_error", "500",
          ], ctx=8)

          dump_windows("apps/axis/services/axis_link.py", [
              "class AxisLink", "def enroll_person",
              "def register_app",
          ], ctx=6)

          dump_range("apps/axis/tests/test_axis.py", 385, 412)
          print()
          print("OK auditoria de codigo")
          DUMPEOF

      - name: "Paso C - reproduccion en proceso: captura el traceback real del 500"
        run: |
          python3 - <<'REPROEOF'
          import base64, io, sys, threading, time, traceback
          import urllib.error, urllib.request, urllib.parse

          REAL_ERR = sys.stderr
          ERRBUF = io.StringIO()

          def http(method, url, data=None, headers=None):
              sys.stderr = ERRBUF
              ERRBUF.seek(0); ERRBUF.truncate(0)
              try:
                  req = urllib.request.Request(
                      url, data=data, method=method,
                      headers=headers or {})
                  try:
                      with urllib.request.urlopen(req, timeout=10) as r:
                          return r.status, r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode("utf-8", "replace")
              finally:
                  sys.stderr = REAL_ERR

          def report(label, st, body):
              print()
              print("### " + label + " -> HTTP " + str(st))
              print("BODY[:1500]: " + body[:1500])
              cap = ERRBUF.getvalue()
              if "Traceback" in cap or "Exception occurred" in cap:
                  print(">>> SERVER STDERR (traceback real del servidor):")
                  print(cap)
              print("=" * 60)

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock, SystemClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          from shared_engines.security.biometrics import (
              BiometricsEngine, BiometricsPolicy,
              DeterministicTestProvider, TemplateCipher)
          from apps.axis.infrastructure.persistence.axis_store import AxisStore
          from apps.axis.infrastructure.network.network_client import NetworkClient
          from apps.axis.server import serve_axis
          from apps.axis.life_history.integration import build_life_history
          from apps.axis.services.axis_link import AxisLink

          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(db=net_db, clock=FrozenClock(),
              signer=signer,
              config=RuntimeConfig(host="127.0.0.1", port=0,
                  api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=net_db, clock=FrozenClock(), audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(master_key_hex="ab" * 32),
              policy=BiometricsPolicy(require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(net_db, FrozenClock(),
              identity=kernel.identity, signer=signer)
          net_srv = serve_combined(kernel, caps,
              host="127.0.0.1", port=0)
          threading.Thread(target=net_srv.serve_forever,
              daemon=True).start()
          time.sleep(0.4)
          net_base = "http://127.0.0.1:" + str(net_srv.server_address[1])
          print("net_base=" + net_base)

          client = NetworkClient(net_base, max_retries=1)
          assert AxisLink(client).register_app()[0] is True
          seed_m = base64.b64encode(b"axis-bio-madre-gov").decode("ascii")
          ok_m, data_m, err_m = client.post("/identity/enroll",
              {"kind": "person", "display_name": "Madre Gov",
               "actor": "axis", "doc_image_b64": seed_m,
               "selfie_image_b64": seed_m})
          print("enroll madre: ok=" + str(ok_m) + " err=" + str(err_m))
          assert ok_m
          zid_madre = ((data_m or {}).get("identity") or {}).get("zid")
          print("zid_madre=" + str(zid_madre))
          ok_t, _td, err_t = client.post("/identity/transition",
              {"zid": zid_madre, "to_status": "ACTIVE",
               "actor": "axis", "reason": "onboarding"})
          print("transition madre: ok=" + str(ok_t))

          store = AxisStore(SQLiteAdapter(":memory:"), SystemClock())
          life = build_life_history(db=store._db,
              clock=SystemClock(), network_client=client)
          srv = serve_axis(store, client,
              life_history_service=life)
          threading.Thread(target=srv.serve_forever,
              daemon=True).start()
          time.sleep(0.4)
          base = "http://127.0.0.1:" + str(srv.bound_port)
          print("axis_base=" + base)

          form = urllib.parse.urlencode({
              "registrar_account": "AX-gob-x",
              "child_name": "Bebe Censo",
              "birth_date": "2025-09-01",
              "birth_place": "SS", "sex": "F",
              "mother_name": "Madre Gov",
              "mother_zid": zid_madre}).encode()
          st, body = http("POST", base + "/axis/birth-register",
              data=form)
          report("POST /axis/birth-register", st, body)

          st, body = http("GET", base + "/axis/api/audit/verify")
          report("GET /axis/api/audit/verify", st, body)

          st, body = http("GET", base + "/axis/api/gobierno/censo",
              headers={"X-ZYRA-Actor-Role": "gobierno"})
          report("GET /axis/api/gobierno/censo (rol gobierno) "
                 "<< ESTE ES EL 500 DEL GATE", st, body)

          st, body = http("GET", base + "/axis/api/gobierno/censo")
          report("GET /axis/api/gobierno/censo (sin rol)", st, body)

          print()
          print("== filas life_persons ==")
          try:
              rows = None
              for m in ("query_all", "query", "fetch_all"):
                  f = getattr(store._db, m, None)
                  if f is not None:
                      rows = f("SELECT person_id, full_name, zid"
                               " FROM life_persons")
                      break
              for r in (rows or []):
                  try:
                      print(dict(r))
                  except Exception:
                      print(r)
          except Exception:
              traceback.print_exc()

          print()
          print("== API publica de stores (para escribir el fix) ==")
          try:
              print("store._db public:", sorted(
                  a for a in dir(store._db)
                  if not a.startswith("_")))
              print("life._store public:", sorted(
                  a for a in dir(life._store)
                  if not a.startswith("_")))
          except Exception:
              traceback.print_exc()
          print()
          print("FIN AUDITORIA")
          REPROEOF

      - name: "Paso D - contexto del commit auditado"
        run: |
          git rev-parse HEAD
          git log --oneline -3
