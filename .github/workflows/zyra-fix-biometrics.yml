name: "ZYRA MARKET (GRUPO C): Bolsa + Radar VIP IA - completo funcional"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-gc
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1a - bolsa_store.py COMPLETO (en carpeta 005 real)"
        run: |
          TDIR=$(ls -1 apps/subastas/modules/ | grep "^005" | head -1)
          if [ -z "$TDIR" ]; then echo "NO_EXISTE_005"; exit 2; fi
          echo "CARPETA 005: $TDIR"
          echo "$TDIR" > _t005b.txt
          cat > "apps/subastas/modules/$TDIR/bolsa_store.py" <<'BSF'
          """BOLSA DE VALORES - mercado financiero aparte.

          Activos, cotizaciones, historicos, noticias/geopolitica,
          sentimiento, escenarios, portafolio con cartera real,
          volatilidad, TOP 5 recomendaciones ZYRA con score
          matematico y evidencia completa por capa."""
          from __future__ import annotations

          import threading
          import time
          import traceback
          import uuid
          import math


          def _now() -> str:
              return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


          def _nid(prefix: str) -> str:
              return prefix + uuid.uuid4().hex[:10]


          ASSET_TYPES = (
              "accion", "etf", "bono", "indice",
              "commodity", "forex", "futuro", "opcion",
          )
          SENTIMENTS = ("positivo", "negativo", "neutral")


          class BolsaStore:
              def __init__(self, db, clock, cartera) -> None:
                  self._db = db
                  self._clock = clock
                  self._car = cartera
                  self._lock = threading.RLock()
                  self._ensure_schema()

              def _ensure_schema(self) -> None:
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_assets ("
                      " asset_id TEXT PRIMARY KEY,"
                      " symbol TEXT UNIQUE NOT NULL,"
                      " atype TEXT NOT NULL,"
                      " name TEXT NOT NULL,"
                      " active INTEGER NOT NULL DEFAULT 1,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_quotes ("
                      " q_id TEXT PRIMARY KEY,"
                      " symbol TEXT NOT NULL,"
                      " price REAL NOT NULL,"
                      " high REAL,"
                      " low REAL,"
                      " volume INTEGER,"
                      " quoted_by TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_price_history ("
                      " h_id TEXT PRIMARY KEY,"
                      " symbol TEXT NOT NULL,"
                      " price REAL NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_news_events ("
                      " news_id TEXT PRIMARY KEY,"
                      " symbol TEXT,"
                      " scope TEXT NOT NULL,"
                      " headline TEXT NOT NULL,"
                      " sentiment TEXT NOT NULL,"
                      " impact INTEGER NOT NULL DEFAULT 5,"
                      " added_by TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_scenarios ("
                      " sc_id TEXT PRIMARY KEY,"
                      " symbol TEXT NOT NULL,"
                      " scenario TEXT NOT NULL,"
                      " probability INTEGER NOT NULL,"
                      " impact TEXT NOT NULL,"
                      " added_by TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_portfolio ("
                      " pos_id TEXT PRIMARY KEY,"
                      " account TEXT NOT NULL,"
                      " symbol TEXT NOT NULL,"
                      " shares REAL NOT NULL,"
                      " avg_price REAL NOT NULL,"
                      " created_at TEXT NOT NULL,"
                      " updated_at TEXT NOT NULL)"
                  )

              def _run(self, sql, params=()):
                  if not params:
                      self._db.execute(sql)
                      return
                  try:
                      self._db.execute(sql, params)
                      return
                  except TypeError:
                      self._db.execute(self._inline(sql, params))

              @staticmethod
              def _inline(sql, params):
                  parts = sql.split("?")
                  if len(parts) != len(params) + 1:
                      return sql
                  assembled = parts[0]
                  for i, v in enumerate(params):
                      assembled += BolsaStore._literal(v)
                      assembled += parts[i + 1]
                  return assembled

              @staticmethod
              def _literal(value):
                  if value is None:
                      return "NULL"
                  if isinstance(value, bool):
                      return "1" if value else "0"
                  if isinstance(value, (int, float)):
                      return repr(value)
                  return "'" + str(value).replace("'", "''") + "'"

              def _rows(self, sql):
                  for name in ("query", "fetchall", "fetch_all", "fetch", "select"):
                      fn = getattr(self._db, name, None)
                      if callable(fn):
                          try:
                              rows = fn(sql)
                              if rows is not None:
                                  return list(rows)
                          except Exception:
                              continue
                  try:
                      cur = self._db.execute(sql)
                  except Exception:
                      return []
                  if cur is None:
                      return []
                  try:
                      return list(cur.fetchall())
                  except Exception:
                      return []

              @staticmethod
              def _field(row, key, index):
                  if isinstance(row, dict):
                      return row.get(key)
                  try:
                      return row[index]
                  except Exception:
                      return None

              @staticmethod
              def _req(value, name):
                  text = str(value or "").strip()
                  if not text:
                      raise ValueError("%s es obligatorio" % name)
                  return text

              def add_asset(self, *, symbol, atype, name):
                  symbol = self._req(symbol, "symbol").upper()
                  atype = str(atype or "").strip()
                  if atype not in ASSET_TYPES:
                      raise ValueError(
                          "tipo debe ser: %s" % ", ".join(ASSET_TYPES))
                  name = self._req(name, "name")
                  with self._lock:
                      dup = self._rows(
                          "SELECT asset_id FROM sbs_assets WHERE symbol = "
                          + self._literal(symbol)
                      )
                      if dup:
                          raise ValueError("simbolo ya existe")
                      asset_id = _nid("AST-")
                      self._run(
                          "INSERT INTO sbs_assets (asset_id, symbol, atype,"
                          " name, active, created_at)"
                          " VALUES (?, ?, ?, ?, 1, ?)",
                          (asset_id, symbol, atype, name, _now()),
                      )
                      return {"asset_id": asset_id, "symbol": symbol,
                              "atype": atype, "name": name}

              def list_assets(self, atype=None):
                  sql = (
                      "SELECT asset_id, symbol, atype, name, active,"
                      " created_at FROM sbs_assets"
                  )
                  if atype:
                      sql += " WHERE atype = " + self._literal(str(atype))
                  sql += " ORDER BY symbol ASC"
                  out = []
                  for row in self._rows(sql):
                      out.append({
                          "asset_id": self._field(row, "a", 0),
                          "symbol": self._field(row, "b", 1),
                          "atype": self._field(row, "c", 2),
                          "name": self._field(row, "d", 3),
                      })
                  return out

              def set_quote(self, symbol, *, price, high, low, volume, by):
                  symbol = self._req(symbol, "symbol").upper()
                  price = float(price)
                  if price <= 0:
                      raise ValueError("precio debe ser positivo")
                  with self._lock:
                      rows = self._rows(
                          "SELECT price FROM sbs_quotes WHERE symbol = "
                          + self._literal(symbol)
                          + " ORDER BY created_at DESC LIMIT 1"
                      )
                      prev = (
                          float(self._field(rows[0], "a", 0))
                          if rows else None
                      )
                      q_id = _nid("QT-")
                      self._run(
                          "INSERT INTO sbs_quotes (q_id, symbol, price,"
                          " high, low, volume, quoted_by, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                          (q_id, symbol, price,
                           float(high) if high else None,
                           float(low) if low else None,
                           int(volume) if volume else None,
                           by, _now()),
                      )
                      self._run(
                          "INSERT INTO sbs_price_history (h_id, symbol,"
                          " price, created_at) VALUES (?, ?, ?, ?)",
                          (_nid("HIS-"), symbol, price, _now()),
                      )
                      change_pct = (
                          round((price - prev) / prev * 100, 2)
                          if prev else 0.0
                      )
                      return {"q_id": q_id, "symbol": symbol,
                              "price": price, "change_pct": change_pct}

              def get_quote(self, symbol):
                  symbol = self._req(symbol, "symbol").upper()
                  rows = self._rows(
                      "SELECT price, high, low, volume, created_at"
                      " FROM sbs_quotes WHERE symbol = "
                      + self._literal(symbol)
                      + " ORDER BY created_at DESC LIMIT 1"
                  )
                  if not rows:
                      return None
                  prev_rows = self._rows(
                      "SELECT price FROM sbs_quotes WHERE symbol = "
                      + self._literal(symbol)
                      + " ORDER BY created_at DESC LIMIT 1 OFFSET 1"
                  )
                  price = float(self._field(rows[0], "a", 0) or 0)
                  prev = (
                      float(self._field(prev_rows[0], "a", 0))
                      if prev_rows else None
                  )
                  change_pct = (
                      round((price - prev) / prev * 100, 2)
                      if prev else 0.0
                  )
                  return {
                      "symbol": symbol,
                      "price": price,
                      "high": self._field(rows[0], "b", 1),
                      "low": self._field(rows[0], "c", 2),
                      "volume": self._field(rows[0], "d", 3),
                      "change_pct": change_pct,
                      "quoted_at": self._field(rows[0], "e", 4),
                  }

              def get_history(self, symbol, limit=30):
                  symbol = self._req(symbol, "symbol").upper()
                  out = []
                  for row in self._rows(
                      "SELECT price, created_at FROM sbs_price_history"
                      " WHERE symbol = " + self._literal(symbol)
                      + " ORDER BY created_at DESC LIMIT " + str(int(limit))
                  ):
                      out.append({
                          "price": self._field(row, "a", 0),
                          "created_at": self._field(row, "b", 1),
                      })
                  return out

              def add_news(self, *, symbol, scope, headline, sentiment, impact, by):
                  symbol = (
                      str(symbol).upper() if symbol else None
                  )
                  scope = str(scope or "").strip()
                  if scope not in ("empresa", "geopolitica", "sector", "macro"):
                      raise ValueError(
                          "scope: empresa/geopolitica/sector/macro")
                  headline = self._req(headline, "headline")
                  sentiment = str(sentiment or "").strip()
                  if sentiment not in SENTIMENTS:
                      raise ValueError(
                          "sentimiento: %s" % ", ".join(SENTIMENTS))
                  impact = int(impact)
                  if impact < 1 or impact > 10:
                      raise ValueError("impacto entre 1 y 10")
                  with self._lock:
                      news_id = _nid("NWS-")
                      self._run(
                          "INSERT INTO sbs_news_events (news_id, symbol,"
                          " scope, headline, sentiment, impact, added_by,"
                          " created_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                          (news_id, symbol, scope, headline,
                           sentiment, impact, by, _now()),
                      )
                      return {"news_id": news_id, "headline": headline,
                              "sentiment": sentiment, "impact": impact}

              def recent_news(self, symbol=None, limit=10):
                  sql = (
                      "SELECT news_id, symbol, scope, headline, sentiment,"
                      " impact, added_by, created_at FROM sbs_news_events"
                  )
                  if symbol:
                      sql += (
                          " WHERE symbol = " + self._literal(str(symbol).upper())
                          + " OR symbol IS NULL"
                      )
                  sql += " ORDER BY created_at DESC LIMIT " + str(int(limit))
                  out = []
                  for row in self._rows(sql):
                      out.append({
                          "news_id": self._field(row, "a", 0),
                          "symbol": self._field(row, "b", 1),
                          "scope": self._field(row, "c", 2),
                          "headline": self._field(row, "d", 3),
                          "sentiment": self._field(row, "e", 4),
                          "impact": self._field(row, "f", 5),
                      })
                  return out

              def add_scenario(self, *, symbol, scenario, probability, impact, by):
                  symbol = self._req(symbol, "symbol").upper()
                  scenario = self._req(scenario, "scenario")
                  prob = int(probability)
                  if prob < 0 or prob > 100:
                      raise ValueError("probabilidad entre 0 y 100")
                  impact = str(impact or "").strip()
                  if impact not in ("alcista", "bajista", "base"):
                      raise ValueError("impacto: alcista/bajista/base")
                  with self._lock:
                      sc_id = _nid("SCN-")
                      self._run(
                          "INSERT INTO sbs_scenarios (sc_id, symbol,"
                          " scenario, probability, impact, added_by, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?)",
                          (sc_id, symbol, scenario, prob, impact, by, _now()),
                      )
                      return {"sc_id": sc_id, "scenario": scenario,
                              "probability": prob, "impact": impact}

              def _history_stats(self, symbol):
                  hist = self.get_history(symbol, limit=20)
                  if len(hist) < 2:
                      return {"trend": "sin_datos", "volatility": 0.0,
                              "support": None, "changes": []}
                  prices = [
                      float(h["price"] or 0) for h in reversed(hist)
                      if h["price"] is not None
                  ]
                  changes = []
                  for i in range(1, len(prices)):
                      if prices[i - 1] > 0:
                          changes.append(
                              (prices[i] - prices[i - 1])
                              / prices[i - 1] * 100
                          )
                  if len(changes) >= 3:
                      recent = sum(changes[-3:]) / 3
                      trend = (
                          "alcista" if recent > 0.5
                          else ("bajista" if recent < -0.5 else "lateral")
                      )
                  elif changes:
                      trend = (
                          "alcista" if sum(changes) > 0
                          else ("bajista" if sum(changes) < 0 else "lateral")
                      )
                  else:
                      trend = "lateral"
                  if len(changes) > 1:
                      mean = sum(changes) / len(changes)
                      var = sum((c - mean) ** 2 for c in changes) / len(changes)
                      volatility = round(math.sqrt(var), 2)
                  else:
                      volatility = 0.0
                  support = min(prices) if prices else None
                  return {
                      "trend": trend,
                      "volatility": volatility,
                      "support": support,
                      "changes": [round(c, 2) for c in changes[-5:]],
                  }

              def analyze(self, symbol):
                  symbol = self._req(symbol, "symbol").upper()
                  quote = self.get_quote(symbol)
                  hist = self._history_stats(symbol)
                  news = self.recent_news(symbol, limit=8)
                  sent_score = 0
                  evidencia = []
                  for n in news:
                      if n["symbol"] and n["symbol"] != symbol:
                          continue
                      weight = int(n["impact"] or 5) / 5.0
                      if n["sentiment"] == "positivo":
                          sent_score += weight
                          evidencia.append(
                              "POSITIVO(%s): %s" % (n["scope"], n["headline"]))
                      elif n["sentiment"] == "negativo":
                          sent_score -= weight
                          evidencia.append(
                              "NEGATIVO(%s): %s" % (n["scope"], n["headline"]))
                  scenarios = []
                  for row in self._rows(
                      "SELECT scenario, probability, impact FROM sbs_scenarios"
                      " WHERE symbol = " + self._literal(symbol)
                      + " ORDER BY probability DESC"
                  ):
                      scenarios.append({
                          "scenario": self._field(row, "a", 0),
                          "probability": self._field(row, "b", 1),
                          "impact": self._field(row, "c", 2),
                      })
                  prob_up = 50.0
                  razones_subida = []
                  razones_bajada = []
                  if hist["trend"] == "alcista":
                      prob_up += 15
                      razones_subida.append(
                          "tendencia alcista (cambios recientes: %s)"
                          % str(hist["changes"]))
                  elif hist["trend"] == "bajista":
                      prob_up -= 15
                      razones_bajada.append(
                          "tendencia bajista (cambios recientes: %s)"
                          % str(hist["changes"]))
                  if sent_score > 0:
                      prob_up += min(20, sent_score * 3)
                      for e in evidencia:
                          if "POSITIVO" in e:
                              razones_subida.append(e)
                  elif sent_score < 0:
                      prob_up -= min(20, abs(sent_score) * 3)
                      for e in evidencia:
                          if "NEGATIVO" in e:
                              razones_bajada.append(e)
                  if quote and quote["volume"]:
                      razones_subida.append(
                          "volumen: %s" % str(quote["volume"]))
                  prob_up = max(5.0, min(95.0, round(prob_up, 1)))
                  if quote:
                      evidencia.append(
                          "precio actual: %s (variacion %s%%)"
                          % (str(quote["price"]), str(quote["change_pct"])))
                  evidencia.append(
                      "tendencia: %s, volatilidad: %s" % (
                          hist["trend"], str(hist["volatility"])))
                  if hist["support"]:
                      evidencia.append(
                          "soporte tecnico: %s" % str(hist["support"]))
                  for s in scenarios:
                      evidencia.append(
                          "escenario %s: %s (probabilidad %s%%)" % (
                              s["impact"], s["scenario"], str(s["probability"])))
                      if s["impact"] == "alcista":
                          razones_subida.append(
                              "escenario alcista: %s (%s%%)" % (
                                  s["scenario"], str(s["probability"])))
                      elif s["impact"] == "bajista":
                          razones_bajada.append(
                              "escenario bajista: %s (%s%%)" % (
                                  s["scenario"], str(s["probability"])))
                  return {
                      "symbol": symbol,
                      "probabilidad_subida": prob_up,
                      "probabilidad_bajada": round(100 - prob_up, 1),
                      "razones_subida": razones_subida,
                      "razones_bajada": razones_bajada,
                      "evidencia_completa": evidencia,
                      "escenarios": scenarios,
                      "stats": hist,
                      "nota": "probabilidad estimada por modelo de reglas"
                      " sobre datos registrados; no es garantia",
                  }

              def top5(self):
                  assets = self.list_assets()
                  out = []
                  for a in assets:
                      if not a["symbol"]:
                          continue
                      q = self.get_quote(a["symbol"])
                      if q is None:
                          continue
                      try:
                          an = self.analyze(a["symbol"])
                      except Exception:
                          continue
                      out.append({
                          "symbol": a["symbol"],
                          "name": a["name"],
                          "probabilidad_subida": an["probabilidad_subida"],
                          "razones": an["razones_subida"][:3],
                          "evidencia": an["evidencia_completa"][:5],
                      })
                  out.sort(
                      key=lambda x: x["probabilidad_subida"],
                      reverse=True,
                  )
                  top = out[:5]
                  return top

              def buy(self, account, *, symbol, shares, use_wallet=True):
                  symbol = self._req(symbol, "symbol").upper()
                  shares = float(shares)
                  if shares <= 0:
                      raise ValueError("acciones deben ser positivas")
                  q = self.get_quote(symbol)
                  if q is None:
                      raise LookupError(
                          "sin cotizacion para %s" % symbol)
                  cost = q["price"] * shares
                  with self._lock:
                      if use_wallet:
                          r = self._car.deposit(account, 0)
                          bal = self._car.balance(account)
                          if bal["balance"] < cost:
                              raise ValueError(
                                  "saldo de cartera insuficiente: necesita %s"
                                  % format(cost, ".2f"))
                      rows = self._rows(
                          "SELECT pos_id, shares, avg_price FROM sbs_portfolio"
                          " WHERE account = " + self._literal(account)
                          + " AND symbol = " + self._literal(symbol)
                      )
                      now = _now()
                      if rows:
                          pos_id = str(self._field(rows[0], "a", 0))
                          old_shares = float(self._field(rows[0], "b", 1) or 0)
                          old_avg = float(self._field(rows[0], "c", 2) or 0)
                          new_shares = old_shares + shares
                          new_avg = (
                              (old_shares * old_avg + shares * q["price"])
                              / new_shares
                          )
                          self._run(
                              "UPDATE sbs_portfolio SET shares = "
                              + repr(new_shares)
                              + ", avg_price = " + repr(round(new_avg, 4))
                              + ", updated_at = " + self._literal(now)
                              + " WHERE pos_id = " + self._literal(pos_id)
                          )
                      else:
                          pos_id = _nid("POS-")
                          self._run(
                              "INSERT INTO sbs_portfolio (pos_id, account,"
                              " symbol, shares, avg_price, created_at, updated_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?)",
                              (pos_id, account, symbol, shares,
                               q["price"], now, now),
                          )
                      if use_wallet:
                          self._car.transfer(
                              from_a=account, to_a="__bolsa__",
                              amount=cost, note="compra %s" % symbol)
                      return {"pos_id": pos_id, "symbol": symbol,
                              "shares": shares, "price": q["price"],
                              "cost": round(cost, 2)}

              def portfolio(self, account):
                  account = self._req(account, "account")
                  out = []
                  total_value = 0
                  total_cost = 0
                  for row in self._rows(
                      "SELECT pos_id, symbol, shares, avg_price, created_at,"
                      " updated_at FROM sbs_portfolio WHERE account = "
                      + self._literal(account)
                      + " ORDER BY symbol ASC"
                  ):
                      symbol = str(self._field(row, "b", 1))
                      shares = float(self._field(row, "c", 2) or 0)
                      avg = float(self._field(row, "d", 3) or 0)
                      q = self.get_quote(symbol)
                      cur_price = q["price"] if q else avg
                      value = shares * cur_price
                      cost = shares * avg
                      pnl = value - cost
                      pnl_pct = (
                          round(pnl / cost * 100, 2) if cost > 0 else 0.0
                      )
                      total_value += value
                      total_cost += cost
                      out.append({
                          "symbol": symbol,
                          "shares": shares,
                          "avg_price": avg,
                          "current_price": cur_price,
                          "value": round(value, 2),
                          "pnl": round(pnl, 2),
                          "pnl_pct": pnl_pct,
                      })
                  types = {}
                  for a in self.list_assets():
                      for p in out:
                          if p["symbol"] == a["symbol"]:
                              types[a["atype"]] = (
                                  types.get(a["atype"], 0) + p["value"]
                              )
                  return {
                      "positions": out,
                      "total_value": round(total_value, 2),
                      "total_cost": round(total_cost, 2),
                      "total_pnl": round(total_value - total_cost, 2),
                      "diversification": {
                          k: round(v, 2) for k, v in types.items()
                      },
                  }


          def market_bolsa_page(self) -> str:
              user = self._sess_user()
              if user is None:
                  body = "".join([
                      "<div class='card'><h2>Bolsa de Valores</h2>",
                      "<p>Necesitas sesion.</p>",
                      "</div>",
                  ])
                  return self._page_wrap("ZYRA MARKET - Bolsa", body)
              top = []
              try:
                  top = self.bol.top5()
              except Exception:
                  pass
              t_rows = []
              for t in top:
                  t_rows.append("".join([
                      "<div class='card'>",
                      "<p><b>%s</b> (%s) — probabilidad subida: <b>%s%%</b></p>" % (
                          t["symbol"], t["name"],
                          str(t["probabilidad_subida"])),
                      "<p>Razones:</p>",
                      "".join("<p>- %s</p>" % r for r in t["razones"]),
                      "<p>Evidencia:</p>",
                      "".join("<p>  * %s</p>" % e for e in t["evidencia"]),
                      "</div>",
                  ]))
              if not t_rows:
                  t_rows.append("<p>Sin cotizaciones aun. Gobierno debe"
                                " registrar activos y cotizaciones.</p>")
              body = "".join([
                  "<div class='card'><h2>Inteligencia ZYRA — TOP 5 de hoy</h2>",
                  "<p>Probabilidad estimada por modelo sobre datos"
                  " reales registrados (tendencia, noticias, geopolitica,"
                  " sentimiento, escenarios). No es garantia.</p>",
                  "".join(t_rows),
                  "</div>",
