          # ---------- motor de parches (idempotente por marcador) ----------
          def parche_reemplazo(txt, etiqueta, marcador, patrones, plantilla, obligatorio=True):
              if marcador in txt:
                  EST['ya'].append(etiqueta)
                  return txt
              for p in patrones:
                  m = re.search(p, txt)
                  if m:
                      txt = txt[:m.start()] + plantilla.replace('{MATCH}', m.group(0)) + txt[m.end():]
                      EST['ok'].append(etiqueta)
                      return txt
              if obligatorio:
                  EST['sin_ancla'].append(etiqueta)
              else:
                  EST['opcional_falta'].append(etiqueta)
              return txt


          def parche_iife(txt, etiqueta, marcador, bloque):
              if marcador in txt:
                  EST['ya'].append(etiqueta)
                  return txt
              base = 0
              m1 = re.search(r'nombreNoCoincide\s*=\s*true', txt)
              if m1:
                  base = m1.start()
              pos = txt.find('</body>', base)
              if pos < 0:
                  pos = txt.rfind('</body>')
              if pos < 0:
                  pos = txt.rfind('</html>')
              if pos < 0:
                  EST['sin_ancla'].append(etiqueta)
                  return txt
              EST['ok'].append(etiqueta)
              return txt[:pos] + bloque + '\n' + txt[pos:]


          def parche_css(txt, etiqueta, marcador, bloque):
              if marcador in txt:
                  EST['ya'].append(etiqueta)
                  return txt
              base = 0
              m1 = re.search(r'nombreNoCoincide\s*=\s*true', txt)
              if m1:
                  base = m1.start()
              pos = txt.rfind('</style>', 0, base) if base > 0 else -1
              if pos < 0:
                  pos = txt.find('</style>')
              if pos < 0:
                  pos = txt.rfind('</head>', 0, base) if base > 0 else -1
              if pos < 0:
                  pos = txt.find('</head>')
              if pos < 0:
                  EST['sin_ancla'].append(etiqueta)
                  return txt
              EST['ok'].append(etiqueta)
              return txt[:pos] + bloque + txt[pos:]


          def parche_antes_de(txt, etiqueta, marcador, patron, bloque, obligatorio=False):
              if marcador in txt:
                  EST['ya'].append(etiqueta)
                  return txt
              m = re.search(patron, txt)
              if not m:
                  if obligatorio:
                      EST['sin_ancla'].append(etiqueta)
                  else:
                      EST['opcional_falta'].append(etiqueta)
                  return txt
              EST['ok'].append(etiqueta)
              return txt[:m.start()] + bloque + '\n\n' + txt[m.start():]


          # ---------- pruebas ----------
          def compila_ok(codigo):
              try:
                  compile(codigo, 'superapp.py', 'exec')
                  return True, ''
              except SyntaxError as e:
                  return False, 'linea ' + str(getattr(e, 'lineno', '?')) + ': ' + str(e)
              except Exception as e:
                  return False, str(e)


          def extraer_iife(txt):
              m = re.search(r'/\* ZYRA-REG-HARDENING v3 \(ini\):[^\n]*\n(.*?)\n/\* ZYRA-REG-HARDENING v3 \(fin\)', txt, re.S)
              if not m:
                  return None
              return m.group(1)


          def correr_node(ruta_js):
              for cmd in ('node', 'nodejs'):
                  try:
                      return subprocess.run([cmd, ruta_js], capture_output=True, text=True, timeout=180)
                  except FileNotFoundError:
                      continue
                  except subprocess.TimeoutExpired:
                      return None
              return None


          def probar_js(iife):
              ruta_js = os.path.join(TMP, 'zyra_test_v3.js')
              js = JS_TEST.replace('__IIFE__', json.dumps(iife))
              try:
                  f = io.open(ruta_js, 'w', encoding='utf-8')
                  f.write(js)
                  f.close()
              except Exception as e:
                  return False, 'No se pudo escribir la prueba JS: ' + str(e)
              r = correr_node(ruta_js)
              if r is None:
                  return False, 'Node no disponible o tiempo agotado'
              salida = (r.stdout or '') + '\n' + (r.stderr or '')
              if r.returncode == 0 and 'TODAS_LAS_PRUEBAS_JS_PASARON' in salida:
                  return True, salida.strip()
              return False, salida[:1500]


          SNIPS = []


          def _limpiar_snips(linea):
              cambio = True
              while cambio:
                  cambio = False
                  for s in SNIPS:
                      if s and s in linea:
                          linea = linea.replace(s, '')
                          cambio = True
              return linea


          def verificar_git(original, txt):
              diff = ''
              try:
                  d = subprocess.run(['git', 'diff', '-U0', '--', 'superapp.py'], capture_output=True, text=True)
                  diff = d.stdout or ''
                  nuevas = set(txt.split('\n'))
                  limpias = set()
                  for l in nuevas:
                      if '/*ZYRA-' in l:
                          limpias.add(_limpiar_snips(l))
                  perdidas = []
                  for l in diff.split('\n'):
                      if l.startswith('-') and not l.startswith('---'):
                          linea = l[1:]
                          if not linea.strip():
                              continue
                          if linea not in nuevas and linea not in limpias:
                              perdidas.append(linea.strip()[:100])
                  if perdidas:
                      FALLOS.append('Lineas originales que se perdieron con el parche: ' + ' || '.join(perdidas[:3]))
                      PRUEBAS.append('Contenido original conservado (nada reescrito): FALLO')
                  else:
                      PRUEBAS.append('Contenido original conservado (nada reescrito ni borrado): OK')
                  s = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True)
                  nuevos = [l for l in (s.stdout or '').split('\n') if l.startswith('??')]
                  if nuevos:
                      FALLOS.append('Aparecieron archivos nuevos en el repo: ' + ', '.join(nuevos[:5]))
                      PRUEBAS.append('Sin archivos nuevos en el repo: FALLO')
                  else:
                      PRUEBAS.append('Sin archivos nuevos en el repo: OK')
              except Exception as e:
                  FALLOS.append('No se pudo verificar git: ' + str(e))
                  PRUEBAS.append('Verificacion git: FALLO')
              try:
                  f = io.open(os.path.join(TMP, 'zyra_diff.patch'), 'w', encoding='utf-8')
                  f.write(diff)
                  f.close()
              except Exception:
                  pass
              return diff


          def escribir_reporte(diff, n_agregadas, veredicto):
              L = []
              L.append('# Informe ZYRA-FIX v3 (registro ZID)')
              L.append('')
              L.append('## 1) Parches aplicados en esta corrida')
              L.extend(['- ' + x for x in EST['ok']] or ['- (ninguno, ya estaban aplicados)'])
              L.append('')
              L.append('## 2) Parches ya presentes (no se duplicaron)')
              L.extend(['- ' + x for x in EST['ya']] or ['- (ninguno)'])
              L.append('')
              L.append('## 3) Anclas obligatorias no encontradas')
              L.extend(['- ' + x for x in EST['sin_ancla']] or ['- (ninguna)'])
              if EST['opcional_falta']:
                  L.append('')
                  L.append('## 4) Anclas opcionales no encontradas (no bloquean el commit)')
                  L.extend(['- ' + x for x in EST['opcional_falta']])
              L.append('')
              L.append('## 5) Pruebas')
              L.extend(['- ' + x for x in PRUEBAS] or ['- (sin pruebas)'])
              L.append('')
              L.append('## 6) Git')
              L.append('- Lineas agregadas: ' + str(n_agregadas))
              if FALLOS:
                  L.append('')
                  L.append('## 7) Fallos detectados')
                  L.extend(['- ' + x for x in FALLOS])
              L.append('')
              L.append('## 8) Veredicto')
              L.append('- ' + veredicto)
              texto = '\n'.join(L) + '\n'
              p = os.environ.get('GITHUB_STEP_SUMMARY')
              if p:
                  try:
                      f = io.open(p, 'a', encoding='utf-8')
                      f.write(texto)
                      f.close()
                  except Exception:
                      pass
              try:
                  f = io.open(os.path.join(TMP, 'zyra_informe.txt'), 'w', encoding='utf-8')
                  f.write(texto)
                  f.close()
              except Exception:
                  pass
              return texto


          def main():
              SNIPS.extend([SNIP_B, SNIP_C1, SNIP_C2, SNIP_D])
              print('== ZYRA-FIX v3 ==')
              if not os.path.exists(RUTA):
                  print('FALLO: no existe superapp.py en ' + os.getcwd())
                  return 2
              txt, enc = leer_archivo(RUTA)
              original = txt

              txt = parche_reemplazo(txt, 'P-B hook nombreNoCoincide=true (bloqueo por nombre)', 'ZYRA-NOMREJ-SET', [r'\bnombreNoCoincide\s*=\s*true\b'], '{MATCH}' + SNIP_B)
              txt = parche_reemplazo(txt, 'P-C1 hook bioRechazada=true (gate selfie)', 'ZYRA-BIOREJ-SET', [r'\bbioRechazada\s*=\s*true\b'], '{MATCH}' + SNIP_C1)
              txt = parche_reemplazo(txt, 'P-C2 hook bioRechazada=false (reset selfie)', 'ZYRA-BIOREJ-CLEAR', [r'\bbioRechazada\s*=\s*false\b'], '{MATCH}' + SNIP_C2, False)
              txt = parche_reemplazo(txt, 'P-D hook bioOk=true (selfie aprobada)', 'ZYRA-BIOOK-SET', [r'\bbioOk\s*=\s*true\b'], '{MATCH}' + SNIP_D)
              txt = parche_iife(txt, 'P-HARD IIFE v3 (nombre+tipo+biometrico fail-closed)', 'ZYRA-REG-HARDENING v3 (ini)', IIFE_BLOQUE)
              txt = parche_css(txt, 'P-E CSS captura compacta (ps2/ps3)', 'ZYRA-CAP-COMPACT v2 (ini)', CSS_COMPACTO)
              txt = parche_antes_de(txt, 'P-H warmup ONNX al arranque (anti 502)', 'ZYRA-WARMUP v1 (ini)', r'(?m)^if\s+__name__\s*==\s*[\'"]__main__[\'"]\s*:', WARMUP, False)

              if txt != original:
                  escribir_archivo(RUTA, txt, enc)
                  print('superapp.py actualizado (solo contenido agregado).')
              else:
                  print('superapp.py sin cambios (todo ya estaba aplicado).')

              ok_py, err_py = compila_ok(txt)
              PRUEBAS.append('Sintaxis Python (compile) tras el parche: ' + ('OK' if ok_py else 'FALLO - ' + err_py))
              if not ok_py:
                  FALLOS.append('superapp.py no compila tras el parche: ' + err_py)

              iife = extraer_iife(txt)
              if iife:
                  ok_js, det_js = probar_js(iife)
                  PRUEBAS.append('Pruebas JS en sandbox (node) con casos reales: ' + ('OK (19 verificaciones)' if ok_js else 'FALLO'))
                  if ok_js:
                      print(det_js)
                  else:
                      FALLOS.append('Pruebas JS fallaron: ' + det_js)
              else:
                  PRUEBAS.append('Pruebas JS en sandbox: FALLO (IIFE v3 no encontrada en el archivo parchado)')
                  FALLOS.append('No se encontro la IIFE ZYRA-REG-HARDENING v3 en superapp.py parchado')

              lineas_doc = [l for l in original.split('\n') if ('docVencido' in l and l.strip())]
              if lineas_doc:
                  faltan = [l.strip()[:100] for l in lineas_doc if txt.find(l) < 0]
                  PRUEBAS.append('Documento vencido (docVencido) intacto: ' + ('OK (' + str(len(lineas_doc)) + ' lineas conservadas)' if not faltan else 'FALLO'))
                  if faltan:
                      FALLOS.append('Lineas docVencido alteradas: ' + ' || '.join(faltan[:3]))
              else:
                  PRUEBAS.append('Documento vencido (docVencido): sin lineas que proteger en el archivo')

              diff = verificar_git(original, txt)
              n_agregadas = sum(1 for l in diff.split('\n') if l.startswith('+') and not l.startswith('+++'))
              print('Lineas agregadas: ' + str(n_agregadas))

              if EST['sin_ancla']:
                  rc = 2
              elif FALLOS:
                  rc = 3
              else:
                  rc = 0
              if rc == 0:
                  veredicto = 'APROBADO - todas las pruebas pasaron; el siguiente paso hace el commit.'
              elif rc == 2:
                  veredicto = 'RECHAZADO (RC=2) - anclas obligatorias no encontradas en superapp.py; revisar seccion 3. NO se hace commit.'
              else:
                  veredicto = 'RECHAZADO (RC=3) - pruebas con fallos; revisar secciones 3 y 5. NO se hace commit.'
              escribir_reporte(diff, n_agregadas, veredicto)
              print(veredicto)
              return rc


          sys.exit(main())

