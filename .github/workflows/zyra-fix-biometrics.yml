name: ZYRA AGRO Diagnose 400

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Run the 2 failing tests with full error bodies
        run: |
          python - <<'PYEOF'
          import json
          import subprocess
          import threading
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import Ed25519Signer
          from apps.agro.infrastructure.network.network_client import NetworkClient
          from apps.agro.infrastructure.persistence.agro_store import AgroStore
          from apps.agro.server import serve_agro
          from apps.agro.services.zyra_link import ZyraLink
          import tempfile

          tmp = tempfile.mkdtemp()
          net_db = SQLiteAdapter(Path(tmp) / "network.db")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=net_db,
              clock=FrozenClock(),
              signer=signer,
              config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None),
          )
          kernel.bootstrap_root()
          caps = ZyraCapabilities(
              net_db, FrozenClock(),
              identity=kernel.identity, signer=signer,
          )
          net_server = serve_combined(
              kernel, caps, host="127.0.0.1", port=0,
          )
          threading.Thread(
              target=net_server.serve_forever, daemon=True
          ).start()
          net_base = "http://127.0.0.1:" + str(
              net_server.server_address[1]
          )
          agro_db = SQLiteAdapter(Path(tmp) / "agro.db")
          store = AgroStore(agro_db, FrozenClock())
          client = NetworkClient(net_base, max_retries=1)
          link = ZyraLink(client)
          agro_server = serve_agro(store, client)
          threading.Thread(
              target=agro_server.serve_forever, daemon=True
          ).start()
          agro_base = "http://127.0.0.1:" + str(
              agro_server.bound_port
          )

          print("=== register_app ===")
          print(link.register_app())

          print("=== POST /agro/producers (con error body) ===")
          req = Request(
              agro_base + "/agro/producers",
              data=json.dumps(
                  {
                      "name": "Jose Rural",
                      "producer_type": "agricultor",
                      "location": "Chalatenango",
                  }
              ).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(req, timeout=10) as r:
                  print("STATUS:", r.status)
                  print("BODY:", r.read().decode("utf-8")[:800])
          except HTTPError as exc:
              print("HTTP ERROR:", exc.code)
              print("BODY:", exc.read().decode("utf-8", "replace")[:800])

          print("=== POST directo a la Red /identity/register person ===")
          req2 = Request(
              net_base + "/identity/register",
              data=json.dumps(
                  {
                      "kind": "person",
                      "display_name": "Prueba Persona",
                      "actor": "agro",
                  }
              ).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(req2, timeout=10) as r:
                  print("STATUS:", r.status)
          except HTTPError as exc:
              print("HTTP ERROR:", exc.code, "(bypass cerrado, esperado)")

          print("=== zyra_link.register_person directo ===")
          print(link.register_person("Jose Rural"))

          net_server.shutdown()
          net_server.server_close()
          agro_server.shutdown()
          agro_server.server_close()
          PYEOF

      - name: Done
        run: echo "Diagnóstico completo arriba"
