name: ZYRA Fase 4c limpieza con banco de pruebas corregido

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fase4c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Limpieza con gates dinamicos y smoke test corregido
        run: |
          python3 - <<'PYEOF'
          import ast, hashlib, json, os, py_compile, shutil
          import http.server, threading
          import urllib.request
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          GATES = []
          APPS7 = ('agro', 'axis', 'ciclo_digital', 'mi_primer_empleo',
                   'nexo', 'semilla', 'subastas')

          def add(s=''):
              OUT.append(str(s))

          def gate(nombre, ok):
              GATES.append((nombre, bool(ok)))
              add('- gate %s: %s' % (nombre, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def contar():
              nf = 0
              np = 0
              for p in ROOT.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                      continue
                  nf += 1
                  if p.suffix == '.py':
                      np += 1
              return nf, np

          add('# FASE 4c - LIMPIEZA CON SMOKE TEST CORREGIDO')
          add('')
          add('Correccion del #755: faltaba import urllib.request en el banco de pruebas.')
          add('El codigo del sistema estaba bien; fallo mi arnes de prueba. Gates abortaron el commit correctamente.')
          add('')

          add('## Snapshot inicial')
          add('')
          nf0, np0 = contar()
          add('- archivos: %d | python: %d' % (nf0, np0))
          add('')

          add('## D1. Escaneo AST de imports a legacy_variants')
          add('')
          importadores = set()
          for p in ROOT.rglob('*.py'):
              if '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              if 'legacy_variants' in p.parts:
                  continue
              try:
                  arbol = ast.parse(p.read_bytes())
              except Exception:
                  continue
              for nodo in ast.walk(arbol):
                  if isinstance(nodo, ast.ImportFrom) and nodo.module:
                      if 'legacy_variants' in nodo.module:
                          importadores.add(str(p.relative_to(ROOT)))
                  elif isinstance(nodo, ast.Import):
                      for al in nodo.names:
                          if 'legacy_variants' in al.name:
                              importadores.add(str(p.relative_to(ROOT)))
          importadores = sorted(importadores)
          add('- Importadores reales por AST: **%d**' % len(importadores))
          for i in importadores[:20]:
              add('  - `%s`' % i)

          lv = ROOT / 'shared_engines' / 'network' / 'legacy_variants'
          objs = sorted(lv.rglob('*.py')) if lv.is_dir() else []
          borrados = []
          if len(importadores) == 0 and objs:
              for o in objs:
                  borrados.append(o.name)
                  o.unlink()
              shutil.rmtree(lv, ignore_errors=True)
              add('- RESULTADO: 0 importadores -> **%d archivos muertos borrados**.' % len(borrados))
          elif len(importadores) > 0 and objs:
              add('- RESULTADO: HAY importadores reales -> NO SE BORRA NADA.')
          else:
              add('- RESULTADO: carpeta ya ausente (idempotente).')
          add('')
          n_borr = len(borrados)
          DATA['borrados'] = borrados

          add('## D2. Docstrings de los 7 shims')
          add('')
          VIEJO = 'Variante original preservada en shared_engines/network/legacy_variants/.'
          NUEVO = 'Variante historica eliminada en limpieza (0 imports reales verificados por AST).'
          act = 0
          if n_borr:
              for a in APPS7:
                  sp = ROOT / 'apps' / a / 'infrastructure' / 'network' / 'network_client.py'
                  if sp.exists():
                      t = sp.read_text(encoding='utf-8')
                      if VIEJO in t:
                          sp.write_text(t.replace(VIEJO, NUEVO, 1), encoding='utf-8')
                          act += 1
              add('- Shims actualizados: %d de 7' % act)
          else:
              add('- Sin borrado previo, sin actualizacion de docstrings.')
          add('')

          add('## D3. Invariantes de shims')
          add('')
          hashes = {}
          compilan = True
          for a in APPS7:
              sp = ROOT / 'apps' / a / 'infrastructure' / 'network' / 'network_client.py'
              if sp.exists():
                  hashes[a] = hashlib.sha256(sp.read_bytes()).hexdigest()[:12]
                  try:
                      py_compile.compile(str(sp), doraise=True)
                  except Exception as e:
                      compilan = False
                      add('- FALLO compilando shim %s: %s' % (a, e))
          identicos = (len(set(hashes.values())) == 1) and (len(hashes) == 7)
          add('- 7 shims identicos entre si: %s' % identicos)
          add('- 7 shims compilan: %s' % compilan)
          gate('shims_identicos_y_compilan', identicos and compilan)
          add('')

          add('## D4. _SimpleClient de superapp.py: alinear auth')
          add('')
          sp = ROOT / 'superapp.py'
          t0 = txt(sp)
          if 'Bearer' in t0:
              edit_ok = True
              add('- Ya contiene auth (idempotente, sin cambios).')
          else:
              t = t0
              OLD_INIT = (
                  '    def __init__(self, base_url: str) -> None:\n'
                  '        self._base = base_url.rstrip("/")\n'
              )
              NEW_INIT = (
                  '    def __init__(self, base_url: str) -> None:\n'
                  '        self._base = base_url.rstrip("/")\n'
                  '        self._token = (\n'
                  '            os.environ.get("ZYRA_API_TOKEN", "") or ""\n'
                  '        ).strip()\n'
              )
              OLD_CALL = (
                  '            request = urllib.request.Request(\n'
                  '                self._base + path,\n'
                  '                data=data,\n'
                  '                method=method,\n'
                  '                headers={"Content-Type": "application/json"},\n'
                  '            )\n'
              )
              NEW_CALL = (
                  '            headers = {"Content-Type": "application/json"}\n'
                  '            if self._token:\n'
                  '                headers["Authorization"] = "Bearer " + self._token\n'
                  '            request = urllib.request.Request(\n'
                  '                self._base + path,\n'
                  '                data=data,\n'
                  '                method=method,\n'
                  '                headers=headers,\n'
                  '            )\n'
              )
              n1 = t.count(OLD_INIT)
              n2 = t.count(OLD_CALL)
              add('- Patron __init__ encontrado: %d (se requiere exactamente 1)' % n1)
              add('- Patron Request encontrado: %d (se requiere exactamente 1)' % n2)
              edit_ok = (n1 == 1 and n2 == 1)
              if edit_ok:
                  t = t.replace(OLD_INIT, NEW_INIT, 1).replace(OLD_CALL, NEW_CALL, 1)
                  sp.write_text(t, encoding='utf-8')
                  add('- Edicion aplicada: el fallback ahora envia Bearer cuando hay token.')
              else:
                  add('- PATRON NO UNICO: no se edita nada.')
          gate('edicion_fallback_segura', edit_ok)
          add('')

          add('## D5. Gates: compilacion y smoke test del fallback')
          add('')
          comp_ok = False
          try:
              py_compile.compile(str(sp), doraise=True)
              comp_ok = True
              add('- py_compile superapp.py: OK')
          except Exception as e:
              add('- py_compile superapp.py FALLO: %s' % e)
          smoke_ok = False
          try:
              t2 = txt(sp)
              ini = t2.find('class _SimpleClient')
              fin = t2.find('\ndef _db(')
              if ini == -1 or fin == -1 or fin <= ini:
                  fin = len(t2)
              extraido = t2[ini:fin]
              ns = {'json': json, 'os': os, 'urllib': urllib}
              exec(compile(extraido, 'simple_client_extraido', 'exec'), ns)
              SC = ns['_SimpleClient']
              rec = {}

              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      rec['auth'] = self.headers.get('Authorization')
                      cuerpo = json.dumps({'ok': True, 'data': {}}).encode('utf-8')
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(cuerpo)

                  def log_message(self, *a):
                      pass

              srv = http.server.HTTPServer(('127.0.0.1', 0), H)
              puerto = srv.server_address[1]
              th = threading.Thread(target=srv.serve_forever, daemon=True)
              th.start()
              base = 'http://127.0.0.1:%d' % puerto
              os.environ.pop('ZYRA_API_TOKEN', None)
              c1 = SC(base)
              c1.get('/x')
              s1 = rec.get('auth')
              os.environ['ZYRA_API_TOKEN'] = 'smoke-token-abc123'
              c2 = SC(base)
              c2.get('/x')
              s2 = rec.get('auth')
              srv.shutdown()
              ok1 = (s1 is None)
              ok2 = (s2 == 'Bearer smoke-token-abc123')
              add('- SIN token: header=%s -> %s' % (s1, 'OK' if ok1 else 'FALLO'))
              add('- CON token: header=%s -> %s' % (s2, 'OK' if ok2 else 'FALLO'))
              smoke_ok = ok1 and ok2
          except Exception as e:
              add('- smoke test FALLO: %s' % e)
          gate('superapp_compila', comp_ok)
          gate('smoke_fallback_auth', smoke_ok)
          add('')

          add('## D6. Conteo dinamico')
          add('')
          nf1, np1 = contar()
          esp_py = np0 - n_borr
          esp_nf = nf0 - n_borr
          add('- python: %d (esperado %d = %d inicial - %d borrados)' % (np1, esp_py, np0, n_borr))
          add('- archivos: %d (esperado %d)' % (nf1, esp_nf))
          gate('conteo_dinamico_consistente', np1 == esp_py and nf1 == esp_nf)
          add('')
          add('### Conteos acumulados del proyecto')
          add('')
          add('- Auditoria original: 6968 archivos (10478 entradas)')
          add('- Fase 2 (pyc fuera): 4574 archivos (-2394)')
          add('- Esta fase (legacy fuera): **%d archivos** (-%d)' % (nf1, n_borr))
          add('- Python: 4506 -> **%d**' % np1)
          add('')

          add('## Resultado de gates')
          add('')
          fallos = [n for n, ok in GATES if not ok]
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. El commit se aborta.**' % ', '.join(fallos))
          else:
              add('**Todos los gates OK.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          DATA['conteo'] = {'inicial': {'archivos': nf0, 'py': np0},
                            'final': {'archivos': nf1, 'py': np1},
                            'borrados': n_borr}
          Path('fase4c.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')

          out = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if out:
              Path(out).write_text('\n'.join(OUT), encoding='utf-8')
          else:
              Path('fase4c.md').write_text('\n'.join(OUT), encoding='utf-8')
          print('Fase 4c terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON - commit abortado')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A superapp.py apps shared_engines
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(cleanup): legacy_variants fuera (8 muertos, 0 imports AST) y auth en fallback"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios (ya limpio)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase4c-zyra
          path: fase4c.json
          if-no-files-found: ignore
