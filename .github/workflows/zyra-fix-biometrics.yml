name: ZYRA AXIS Block 6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Wire longitudinal screen into AXIS server (additive)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path("apps/axis/server.py")
          src = path.read_text(encoding="utf-8")

          if "_screen_longitudinal" in src:
              print("SERVER: already wired")
          else:
              get_anchor = (
                  '        if s[0] == "life":\n'
                  "            self._screen_life_person(s)\n"
                  "            return\n"
              )
              assert get_anchor in src, "life route not found"
              get_new = (
                  get_anchor
                  + '        if s[0] == "longitudinal":\n'
                  "            self._screen_longitudinal(s)\n"
                  "            return\n"
              )
              src = src.replace(get_anchor, get_new, 1)

              patient_anchor = (
                  '            "<p>Expediente medico"\n'
                  '            " inmutable en la Red.</p>"\n'
              )
              assert patient_anchor in src, "patient anchor not found"
              patient_new = (
                  patient_anchor
                  + '            "<a href=\'/axis/longitudinal/"\n'
                  + "            + account_id\n"
                  + '            + "\'><button class=\'gray\'>Mi Historial de Vida</button></a>"\n'
              )
              src = src.replace(patient_anchor, patient_new, 1)

              method = (
                  "    def _screen_longitudinal(self, s):\n"
                  "        svc = self._lh()\n"
                  "        if len(s) < 2:\n"
                  '            raise LookupError(\n'
                  '                "account id required"\n'
                  "            )\n"
                  "        account_id = s[1]\n"
                  "        from apps.axis.life_history.health_service import (\n"
                  "            HealthLifeLink,\n"
                  "        )\n"
                  "\n"
                  "        link = HealthLifeLink(\n"
                  "            store=type(self).store, life=svc\n"
                  "        )\n"
                  "        view = link.patient_longitudinal(\n"
                  "            account_id\n"
                  "        )\n"
                  "        if not view.get(\n"
                  '            "life_linked"\n'
                  "        ):\n"
                  "            body = (\n"
                  '                "<h1>Historial Longitudinal</h1>"\n'
                  '                "<p>La cuenta "\n'
                  "                + account_id\n"
                  '                + " no esta vinculada al"\n'
                  '                " Registro Civil.</p>"\n'
                  '                "<a href=\'/axis\'><button"\n'
                  '                " class=\'gray\'>Inicio</button></a>"\n'
                  "            )\n"
                  "            self._html(\n"
                  "                200,\n"
                  "                _page(\n"
                  '                    "AXIS - Longitudinal",\n'
                  "                    body,\n"
                  "                ),\n"
                  "            )\n"
                  "            return\n"
                  '        items = ""\n'
                  '        for e in view["events"]:\n'
                  "            items = (\n"
                  "                items\n"
                  '                + "<li>- "\n'
                  '                + str(e["event_type"])\n'
                  '                + " - "\n'
                  '                + str(e["detail"] or "")\n'
                  '                + "</li>"\n'
                  "            )\n"
                  "        chain = (\n"
                  '            "VERIFICADA"\n'
                  '            if view["chain_verified"]\n'
                  '            else "COMPROMETIDA"\n'
                  "        )\n"
                  "        body = (\n"
                  '            "<h1>Historial Longitudinal</h1>"\n'
                  '            "<p>"\n'
                  '            + str(view["full_name"])\n'
                  '            + " | ZID: "\n'
                  '            + str(view["zid"] or "pendiente")\n'
                  '            + " | estado: "\n'
                  '            + str(view["status"])\n'
                  '            + "</p>"\n'
                  '            "<p>Cadena de vida: "\n'
                  "            + chain\n"
                  '            + "</p>"\n'
                  '            "<h2>Eventos encadenados ("\n'
                  '            + str(len(view["events"]))\n'
                  '            + ")</h2><ul>"\n'
                  "            + items\n"
                  '            + "</ul>"\n'
                  '            "<a href=\'/axis\'><button"\n'
                  '            " class=\'gray\'>Inicio</button></a>"\n'
                  "        )\n"
                  "        self._html(\n"
                  "            200,\n"
                  "            _page(\n"
                  '                "AXIS - Longitudinal",\n'
                  "                body,\n"
                  "            ),\n"
                  "        )\n"
                  "\n\n"
              )
              class_anchor = (
                  "class AxisServer(ThreadingHTTPServer):"
              )
              assert class_anchor in src, "server class not found"
              src = src.replace(
                  class_anchor,
                  method + class_anchor,
                  1,
              )
              path.write_text(src, encoding="utf-8")
              print("SERVER: WIRED OK")

          import ast

          ast.parse(path.read_text(encoding="utf-8"))
          print("SERVER SYNTAX OK")
          PYEOF

      - name: Write longitudinal E2E test
        run: |
          cat > apps/axis/life_history/tests/test_longitudinal_screen.py <<'ZH4'
          """Longitudinal screen E2E over real HTTP."""
          from __future__ import annotations

          import threading
          import unittest
          from urllib.request import urlopen

          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore,
          )
          from apps.axis.life_history.health_service import (
              HealthLifeLink,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )
          from apps.axis.server import serve_axis
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )

          _MOTHER = "ZID-mother-e2e"


          class _FakeNetwork:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid == _MOTHER:
                      return (
                          True,
                          {"status": "ACTIVE"},
                          None,
                      )
                  return (
                      False,
                      None,
                      "unknown identity",
                  )

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (
                          True,
                          {"document_id": "DOC-e2e"},
                          None,
                      )
                  if path == "/history/append":
                      return (
                          True,
                          {"appended": True},
                          None,
                      )
                  return (False, None, "unknown")


          class LongitudinalScreenE2E(unittest.TestCase):
              def test_screen_shows_chained_life(self) -> None:
                  from shared_engines.common.clocks import (
                      SystemClock,
                  )

                  db = SQLiteAdapter(":memory:")
                  clock = SystemClock()
                  life = LifeHistoryService(
                      store=LifeHistoryStore(db, clock),
                      client=_FakeNetwork(),
                  )
                  birth = (
                      life.register_birth_with_network(
                          registrar_account=(
                              "AX-reg-1"
                          ),
                          child_name="Bebe Pantalla",
                          birth_date="2025-01-15",
                          birth_place="San Salvador",
                          sex="F",
                          mother_name="Maria",
                          mother_zid=_MOTHER,
                      )
                  )
                  person_id = str(birth["person_id"])
                  life.attach_zid_with_audit(
                      person_id,
                      zid="ZID-newborn-screen",
                      actor="biometric-enroll",
                  )
                  store = AxisStore(db, clock)
                  store.add_account(
                      account_id="AX-pat-scr",
                      zid="ZID-newborn-screen",
                      name="Bebe Pantalla",
                      role="paciente",
                  )
                  store.add_account(
                      account_id="AX-doc-scr",
                      zid=None,
                      name="Dr Screen",
                      role="medico",
                  )
                  server = serve_axis(
                      store,
                      _FakeNetwork(),
                      life_history_service=life,
                  )
                  thread = threading.Thread(
                      target=server.serve_forever,
                      daemon=True,
                  )
                  thread.start()
                  base = (
                      "http://127.0.0.1:"
                      f"{server.bound_port}"
                  )
                  try:
                      link = HealthLifeLink(
                          store=store, life=life
                      )
                      self.assertTrue(
                          link.record_exam(
                              exam_id="EXM-scr",
                              patient_account=(
                                  "AX-pat-scr"
                              ),
                              doctor_account=(
                                  "AX-doc-scr"
                              ),
                              exam_type="sangre",
                          )
                      )
                      with urlopen(
                          base
                          + "/axis/longitudinal/"
                          "AX-pat-scr",
                          timeout=10,
                      ) as response:
                          html = (
                              response.read().decode(
                                  "utf-8"
                              )
                          )
                      self.assertIn(
                          "Historial Longitudinal",
                          html,
                      )
                      self.assertIn(
                          "Bebe Pantalla", html
                      )
                      self.assertIn(
                          "birth_registered", html
                      )
                      self.assertIn(
                          "health_exam", html
                      )
                      self.assertIn(
                          "VERIFICADA", html
                      )
                      with urlopen(
                          base
                          + "/axis/paciente/"
                          "AX-pat-scr",
                          timeout=10,
                      ) as response:
                          patient_html = (
                              response.read().decode(
                                  "utf-8"
                              )
                          )
                      self.assertIn(
                          "/axis/longitudinal/"
                          "AX-pat-scr",
                          patient_html,
                      )
                      store.add_account(
                          account_id="AX-ext-scr",
                          zid=None,
                          name="Externo",
                          role="paciente",
                      )
                      with urlopen(
                          base
                          + "/axis/longitudinal/"
                          "AX-ext-scr",
                          timeout=10,
                      ) as response:
                          ext_html = (
                              response.read().decode(
                                  "utf-8"
                              )
                          )
                      self.assertIn(
                          "no esta vinculada",
                          ext_html,
                      )
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          ZH4
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_longitudinal_screen.py').read()); print('test_longitudinal OK')"

      - name: 1/3 Longitudinal screen E2E
        run: python -m apps.axis.life_history.tests.test_longitudinal_screen -v

      - name: 2/3 Life History regression (7+5+3+3)
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q

      - name: 3/3 Full regression (biometrics 13 + AXIS 7 + TCP 6)
        run: |
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit longitudinal view (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/server.py apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "health: longitudinal life-history screen wired additively into AXIS server + E2E"
            git push
          fi
