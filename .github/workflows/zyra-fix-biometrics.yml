name: "RED-VERIF paso 2: veredicto de verificacion firmado (verify_face + universal_view + firma Red) + ruta + tests"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - verificacion previa: las piezas existen (verify_face + universal_view + signer)"
        run: |
          python3 -c "
          from shared_engines.security.biometrics import (
              BiometricsEngine, VerifyReport)
          from shared_engines.network.portable_profile import (
              ProfileRegistry, age_of)
          assert hasattr(BiometricsEngine, 'verify_face')
          assert hasattr(ProfileRegistry, 'universal_view')
          print('OK piezas: verify_face + universal_view existen')
          "

      - name: "Paso B - profile: VerificationVerdict + verdict (metodo que une biometria 1:1 + universal_view + firma) - append al final con indent"
        run: |
          python3 - <<'VEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/network/"
              "portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "def verification_verdict(" in t:
              print("SKIP (ya presente)")
              raise SystemExit(0)
          CUERPO = textwrap.dedent('''\
              def verification_verdict(
                  self,
                  *,
                  app_id: str,
                  zid: str,
                  face_verdict: dict[
                      str, object],
                  signer,
                  clock: Clock,
              ) -> dict[str, object]:
                  """AX-VERIF: EL veredicto de
                  verificacion para bancos/
                  consulados/empleadores. Une:
                  (1) biometria 1:1 del motor
                  de biometria (verify_face:
                  es la misma persona?), (2)
                  universal_view (quien es +
                  niveles + edad derivada), (3)
                  FIRMA de la Red sobre todo el
                  veredicto (prueba criptografica
                  que el tercero guarda y puede
                  verificar offline). Cada acceso
                  queda auditado. El scope de la
                  app gobierna (sin consentimiento
                  fresco por consulta; el dueño
                  autorizo al registrarse)."""
                  import hashlib
                  import time as _time
                  from shared_engines.common.serialization import (
                      canonical_json_dumps,
                  )
                  require_non_empty_str(
                      app_id, "app_id")
                  require_non_empty_str(
                      zid, "zid")
                  base = self.universal_view(
                      app_id=app_id, zid=zid)
                  match = bool(
                      face_verdict.get("match"))
                  score = float(
                      face_verdict.get(
                          "score", 0.0))
                  verdict = {
                      "zid": zid,
                      "verified_person": match,
                      "face_score": score,
                      "fields": base["fields"],
                      "levels": base["levels"],
                      "age": base["age"],
                      "verified_at": (
                          _time.time()),
                      "issuer": (
                          "zyra-network"),
                  }
                  payload = canonical_json_dumps(
                      verdict).encode("utf-8")
                  firma = signer.sign(payload)
                  verd = dict(verdict)
                  verd["signature"] = (
                      firma.hex())
                  self._audit.append(
                      event_type=(
                          "network.verification"
                          ".verdict"),
                      actor=app_id,
                      subject=zid,
                      payload={
                          "match": match,
                          "score": score,
                      },
                  )
                  return verd
          ''')
          METODO = textwrap.indent(
              CUERPO.rstrip("\n"), "    ")
          t = (t.rstrip("\n") + "\n\n"
               + METODO + "\n")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK verification_verdict (AST valido)")
          VEOF

      - name: "Paso C - verificacion dura: metodo vivo, piezas intactas"
        run: |
          python3 -c "
          from shared_engines.network.portable_profile import (
              ProfileRegistry, age_of, universal_view)
          assert hasattr(ProfileRegistry,
              'verification_verdict')
          for m in ('register_app', 'set_field',
                    'view_for_app',
                    'universal_view'):
              assert hasattr(ProfileRegistry, m), m
          print('OK: verification_verdict dentro de la clase; metodos previos intactos')
          "

      - name: "Paso D - ruta HTTP: POST /verification/person (verify_face + verdict firmado)"
        run: |
          python3 - <<'RTEOF'
          import ast
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/api.py")
          t = p.read_text(encoding="utf-8")
          if 's == ["verification", "person"]' in t:
              print("SKIP ruta (ya presente)")
              raise SystemExit(0)
          ANCLA = (
              'elif s == ["verification",'
              ' "media", "verify"]:'
          )
          cnt = t.count(ANCLA)
          assert cnt == 1, (
              "ancla verification/media "
              + str(cnt))
          RUTA = (
              'elif s == ["verification",'
              ' "person"]:\n'
              "    import base64 as _b64v\n"
              "    bio = getattr(\n"
              "        type(self).kernel,\n"
              '        "_biometrics", None)\n'
              "    if bio is None:\n"
              "        raise ApiError(\n"
              "            503, \"not_wired\",\n"
              "            \"biometrics not\"\n"
              "            \" configured\")\n"
              "    zid_v = self._req(\n"
              "        doc, \"zid\")\n"
              "    selfie_v = _b64v.b64decode(\n"
              "        self._req(\n"
              "            doc, \"selfie_b64\"))\n"
              "    reporte = bio.verify_face(\n"
              "        zid_v,\n"
              "        selfie_image=selfie_v,\n"
              "        actor=self._req(\n"
              "            doc, \"actor_app\"),\n"
              "    )\n"
              "    fv = {\n"
              '        "match": bool(\n'
              "            getattr(reporte,\n"
              '            "match", False)),\n'
              '        "score": float(\n'
              "            getattr(reporte,\n"
              '            "score", 0.0)),\n'
              "    }\n"
              "    verd = (type(self).caps"
              ".profiles.verification_verdict(\n"
              '        app_id=self._req(\n'
              '            doc, "actor_app"),\n'
              "        zid=zid_v,\n"
              "        face_verdict=fv,\n"
              "        signer=(type(self)"
              ".kernel.signer),\n"
              "        clock=(type(self)"
              ".kernel.clock),\n"
              "    ))\n"
              "    self._send(\n"
              "        200,\n"
              "        {\"ok\": True,\n"
              "         \"data\": verd})\n"
              "    return\n"
              + ANCLA
          )
          t = t.replace(ANCLA, RUTA, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          assert ('s == ["verification",'
                  ' "person"]' in p.read_text(
                      encoding="utf-8"))
          print("OK ruta POST /verification/person"
                " (AST valido)")
          RTEOF

      - name: "Paso E - test e2e: enrolar con biometria -> verificar persona -> veredicto firmado -> verificacion offline de la firma"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          cand = [
              Path("shared_engines/runtime/tests/"
                   "test_capabilities_api.py"),
          ]
          target = None
          for c in cand:
              if c.exists():
                  target = c
                  break
          assert target is not None
          t = target.read_text(encoding="utf-8")
          if ("test_verification_verdict"
                  "_signed" in t):
              print("SKIP test (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_verification_verdict_signed(
                  tmp_path,
              ) -> None:
                  """AX-VERIF: la consulta del
                  banco/consulado. Enrolamiento
                  biometrico -> verify_face 1:1
                  -> veredicto con campos
                  universales + FIRMA de la Red
                  -> la firma se verifica con la
                  public_pem (prueba offline)."""
                  import base64
                  import hashlib
                  import json as _json
                  import threading
                  import time as _time
                  import urllib.error
                  import urllib.request
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  from shared_engines.runtime.config import (
                      RuntimeConfig)
                  from shared_engines.runtime.kernel import (
                      ZyraKernel)
                  from shared_engines.runtime.capabilities import (
                      ZyraCapabilities)
                  from shared_engines.runtime.combined_api import (
                      serve_combined)
                  from shared_engines.verification.signatures import (
                      Ed25519Signer,
                      Ed25519Verifier)
                  from shared_engines.security.biometrics import (
                      BiometricsEngine, BiometricsPolicy,
                      DeterministicTestProvider,
                      TemplateCipher)
                  from shared_engines.network.portable_profile import (
                      ProfileRegistry)
                  from shared_engines.audit.chain import (
                      AuditTrail)
                  from shared_engines.events.outbox import (
                      Outbox)
                  from shared_engines.events.contracts import (
                      EventCatalog)
                  net_db = SQLiteAdapter(":memory:")
                  signer, pub = (
                      Ed25519Signer.generate())
                  kernel = ZyraKernel(
                      db=net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None))
                  kernel.bootstrap_root()
                  kernel._biometrics = (
                      BiometricsEngine(
                          db=net_db,
                          clock=FrozenClock(),
                          audit=kernel.audit,
                          provider=(
                              DeterministicTestProvider(
                              )),
                          cipher=TemplateCipher(
                              master_key_hex=(
                                  "ab" * 32)),
                          policy=BiometricsPolicy(
                              require_liveness=(
                                  False),
                              doc_reject=0.01,
                              doc_review=0.02,
                              doc_auto=0.03,
                              dup_reject=0.98)))
                  caps = ZyraCapabilities(
                      net_db, FrozenClock(),
                      identity=kernel.identity,
                      signer=signer)
                  caps.profiles = ProfileRegistry(
                      net_db, FrozenClock(),
                      audit=AuditTrail(
                          net_db, FrozenClock()),
                      outbox=Outbox(
                          net_db, FrozenClock()))
                  caps.profiles.register_app(
                      app_id="banco-ny",
                      display_name="Banco NY",
                      scopes=(
                          "display_name",
                          "national_id",
                          "id_country",
                          "id_type",
                          "id_number",
                          "nationality",
                          "birth_date",
                          "address",
                      ),
                  )
                  srv = serve_combined(
                      kernel, caps,
                      host="127.0.0.1", port=0)
                  threading.Thread(
                      target=(srv.serve_forever),
                      daemon=True).start()
                  _time.sleep(0.3)
                  base = ("http://127.0.0.1:"
                          + str(
                              srv.server_address[
                                  1]))
                  try:
                      selfie = base64.b64encode(
                          b"selfie-pedro-real"
                      ).decode("ascii")
                      docimg = base64.b64encode(
                          b"doc-pedro-dui"
                      ).decode("ascii")

                      def post(ruta, doc):
                          req = urllib.request.Request(
                              base + ruta,
                              data=_json.dumps(
                                  doc).encode(),
                              method="POST",
                              headers={
                                  "Content-Type":
                                  "application/json"})
                          try:
                              with urllib.request.urlopen(
                                  req, timeout=15
                              ) as r:
                                  return (r.status,
                                      _json.loads(
                                          r.read().decode()))
                          except (
                              urllib.error.HTTPError
                          ) as e:
                              return (e.code,
                                  _json.loads(
                                      e.read().decode()))

                      st, r1 = post(
                          "/identity/enroll",
                          {"kind": "person",
                           "display_name":
                           "Pedro Prueba",
                           "actor": "banco-ny",
                           "doc_image_b64": docimg,
                           "selfie_image_b64": (
                               selfie)})
                      assert st in (200, 201), (
                          str(st) + " " + str(r1))
                      zid = ((r1.get("data")
                              or {}).get("identity")
                             or {}).get("zid")
                      assert zid, str(r1)[:300]
                      reg = caps.profiles
                      reg.set_field(
                          zid=zid,
                          field="display_name",
                          value="Pedro Prueba",
                          verified=True)
                      reg.set_field(
                          zid=zid,
                          field="id_country",
                          value="SV",
                          verified=True)
                      reg.set_field(
                          zid=zid,
                          field="id_type",
                          value="dui",
                          verified=True)
                      reg.set_field(
                          zid=zid,
                          field="birth_date",
                          value="1992-04-04",
                          verified=True)
                      st, r2 = post(
                          "/verification/person",
                          {"zid": zid,
                           "selfie_b64": selfie,
                           "actor_app":
                           "banco-ny"})
                      assert st == 200, (
                          str(st) + " "
                          + str(r2)[:300])
                      d = r2["data"]
                      assert (d["verified_person"]
                              is True), str(d)[:200]
                      assert (d["fields"]
                              ["id_type"]
                              == "dui")
                      assert d["age"] >= 30
                      assert d.get("signature")
                      verde = bytes.fromhex(
                          d["signature"])
                      payload_sin_firma = {
                          k: v for k, v in (
                              d.items())
                          if k != "signature"}
                      from shared_engines.common.serialization import (
                          canonical_json_dumps)
                      recom = canonical_json_dumps(
                          payload_sin_firma).encode(
                          "utf-8")
                      ok = Ed25519Verifier(
                          pub).verify(
                          recom, verde)
                      assert ok is True, (
                          "la firma del veredicto"
                          " no verifica offline")
                      print("OK AX-VERIF: veredicto"
                            " firmado, verificable"
                            " offline, campos"
                            " universales + edad")
                  finally:
                      srv.shutdown()
                      srv.server_close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          target.write_text(t, encoding="utf-8")
          final = target.read_text(
              encoding="utf-8")
          assert ("test_verification_verdict"
                  "_signed" in final)
          print("OK test e2e AX-VERIF (AST valido)")
          TSEOF

      - name: "Paso F - GATE Red"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -10

      - name: "Paso G - GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso H - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-VERIF"
            echo '```'
            python3 -m pytest shared_engines/runtime/tests -vv --tb=long 2>&1 | tail -70 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-VERIF: veredicto de verificacion firmado (verify_face 1:1 + universal_view + firma de la Red)" -m "LA consulta del banco/consulado/empleador, con piezas que ya existian: (1) verify_face del motor de biometria - re-match 1:1 de la selfie fresca contra la plantilla cifrada del ZID (el doc decia: what banks and apps will consume), (2) universal_view de RED-ID - quien es + documento tipado + edad DERIVADA + niveles VERIFIED/SELF_DECLARED, (3) FIRMA Ed25519 de la Red sobre el veredicto entero -> el tercero guarda la prueba y la verifica OFFLINE con la public_pem (sin tocar la Red). Consentimiento: sin fresco por consulta - el scope de la app gobierna (el dueño autorizo al registrarse) y CADA acceso queda auditado (network.verification.verdict). Ruta: POST /verification/person {zid, selfie_b64, actor_app}. Test e2e: enroll con biometria -> verificacion -> firma verificada offline. Nota honesta: si VerifyReport expone atributos con otro nombre que match/score, el Paso H del Resumen lo dira y es fix de 2 lineas."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
