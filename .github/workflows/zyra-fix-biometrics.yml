# ZYRA V6 revD - parche quirurgico del registro ZID (all-or-nothing)
#
# REGLAS DEL PROYECTO (respetadas al pie de la letra):
#   1) Se trabaja SOBRE lo que ya existe: no se crean carpetas ni archivos
#      nuevos en el repositorio. Solo se reemplaza la linea del bloque marcado
#      ZYRA-V6-BEGIN / ZYRA-V6-END dentro de superapp.py (linea 1460).
#   2) Todo lo demas queda BYTE A BYTE igual (conservacion verificada).
#   3) Publicacion all-or-nothing: si UNA sola validacion falla, NO hay
#      escritura, NO hay commit, NO hay push (RC=1).
#   4) Si superapp.py ya tiene revD, el run avisa "ya aplicado" y termina
#      sin tocar nada (RC=0, idempotente).
#
# Contenido revD (nucleo minimo, sin tocar la navegacion del base):
#   - OCR mejorado ocrV6D (3 modos de imagen + cache) y reemplazo de ocrPatrones
#   - envuelve Tesseract.recognize para dataURL (mejora tambien la puerta V37)
#   - UN solo criterio de nombre: nombresCoincidenV6D (tolerante al ruido del OCR)
#   - reintento de envio SOLO en /registro/nuevo (2 reintentos, 1.5s y 4s)
#   - mensaje al usuario: las fotos SIGUEN guardadas
#   - API de pruebas __zyraV6Dapi
#
# Ejecutar: Actions -> "zyra-revD" -> Run workflow. RC=0 = publicado o ya aplicado.

name: zyra-revD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revd-parche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parche revD + validacion total (all-or-nothing)
        run: |
          python3 <<'PYEOF'
          # -*- coding: utf-8 -*-
          import os, re, sys, hashlib, subprocess, tempfile, py_compile

          TMP = "/tmp/zyra_revd"
          REPORTE = []
          ERRORES = []

          def decir(s):
              s = str(s)
              REPORTE.append(s)
              print(s, flush=True)
              try:
                  SUM = os.environ.get("GITHUB_STEP_SUMMARY") or os.path.join(TMP, "resumen.md")
                  d = os.path.dirname(SUM)
                  if d and not os.path.isdir(d):
                      os.makedirs(d, exist_ok=True)
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(s.rstrip() + "\n")
              except Exception:
                  pass

          SHA_BASE = "c3a5258d44c53afbffb21166214dda8dc0346cb5c1825c9de022a6837358684f"
          LINEA_PATCH = 1460          # 1-indexada: la linea del bloque marcado
          LINEAS_ESPERADAS = 1747    # lineas del archivo base (sin \n final)
          SHA_JS = "b0a7b7811921def56bb8ce6c028fa6bad5ee1258c6fa1610d39ff23e74afea2a"
          LARGO_B64 = 19632
          LARGO_JS = 14722

          NUCLEO_B64_A = ""
          NUCLEO_B64_B = ""
          NUCLEO_B64_C = ""
          NUCLEO_B64_D = ""

          import base64 as b64mod
          NUCLEO_B64 = NUCLEO_B64_A + NUCLEO_B64_B + NUCLEO_B64_C + NUCLEO_B64_D

          def check(nombre, cond):
              if cond:
                  decir("  [OK]    " + nombre)
              else:
                  decir("  [FALLA] " + nombre)
                  ERRORES.append(nombre)
              return cond

          def buscar_superapp():
              if os.path.exists("superapp.py"):
                  return "superapp.py"
              for raiz, _dirs, files in os.walk("."):
                  if ".git" in raiz:
                      continue
                  if "superapp.py" in files:
                      return os.path.join(raiz, "superapp.py")
              return None

          def py_compila(texto):
              fd, p = tempfile.mkstemp(suffix=".py")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(texto)
                  py_compile.compile(p, cfile=p + "c", doraise=True)
                  return True, ""
              except Exception as e:
                  return False, str(e)[:300]
              finally:
                  for x in (p, p + "c"):
                      try:
                          os.unlink(x)
                      except Exception:
                          pass

          def main():
              try:
                  os.makedirs(TMP, exist_ok=True)
              except Exception:
                  pass

              decir("# ZYRA V6 revD - parche quirurgico (all-or-nothing)")
              decir("")

              RUTA = buscar_superapp()
              if not RUTA:
                  decir("RECHAZO: no se encontro superapp.py.")
                  sys.exit(1)
              with open(RUTA, encoding="utf-8") as f:
                  t = f.read()
              sha_actual = hashlib.sha256(t.encode("utf-8", "surrogatepass")).hexdigest()
              decir("- Archivo: " + RUTA)
              decir("- sha256 actual: " + sha_actual)
              decir("- sha256 base esperado: " + SHA_BASE)
              decir("")

              if sha_actual != SHA_BASE:
                  ya = False
                  try:
                      lineas_act = t.split("\n")
                      if len(lineas_act) >= LINEA_PATCH:
                          m_ya = re.match(r"^/\*ZYRA-V6-BEGIN\*/eval\(atob\('([A-Za-z0-9+/=]+)'\)\)/\*ZYRA-V6-END\*/</script>$", lineas_act[LINEA_PATCH - 1])
                          if m_ya:
                              js_ya = b64mod.b64decode(m_ya.group(1)).decode("utf-8", "replace")
                              ya = "__zyraV6D" in js_ya
                  except Exception:
                      ya = False
                  if ya:
                      decir("RESULTADO: revD YA APLICADO en superapp.py. No se toca nada (run idempotente).")
                      decir("- shas del archivo sin cambios; sin commit ni push.")
                      sys.exit(0)
                  decir("RECHAZO: superapp.py NO es el base esperado (cambio algo en el repo o hay otro parche).")
                  decir("Seguridad all-or-nothing: NO se publica nada. Revisar el archivo y regenerar el parche.")
                  sys.exit(1)

              # ---- decodificar y validar el nucleo nuevo ANTES de tocar el archivo ----
              decir("")
              decir("## 1) Nucleo revD (integridad)")
              if not check("largo base64 " + str(LARGO_B64), len(NUCLEO_B64) == LARGO_B64):
                  sys.exit(1)
              try:
                  js = b64mod.b64decode(NUCLEO_B64).decode("utf-8")
              except Exception as e:
                  decir("  [FALLA] decodificacion base64: " + str(e)[:200])
                  sys.exit(1)
              check("sha256 del nucleo " + SHA_JS[:16] + "...", hashlib.sha256(js.encode("utf-8")).hexdigest() == SHA_JS)
              check("largo JS " + str(LARGO_JS), len(js) == LARGO_JS)
              jss = js.strip()
              check("marcadores /*ZYRA-V6-BEGIN*/ ... /*ZYRA-V6-END*/", jss.startswith("/*ZYRA-V6-BEGIN*/") and jss.endswith("/*ZYRA-V6-END*/"))
              check("un solo par de marcadores", js.count("/*ZYRA-V6-BEGIN*/") == 1 and js.count("/*ZYRA-V6-END*/") == 1)

              decir("")
              decir("## 2) Suite de reglas del nucleo")
              decir("- anti-desmadre (NO debe contener):")
              check("sin MutationObserver", js.find("MutationObserver") < 0)
              check("sin irAPaso (no envuelve la navegacion)", js.find("irAPaso") < 0)
              check("sin aplicarVis", js.find("aplicarVis") < 0)
              check("sin reiniciarFotos/reiniciarTodo (no borra fotos)", js.find("reiniciarFotos") < 0 and js.find("reiniciarTodo") < 0)
              check("sin stopImmediatePropagation", js.find("stopImmediatePropagation") < 0)
              check("sin stopPropagation", js.find("stopPropagation") < 0)
              check("sin preventDefault", js.find("preventDefault") < 0)
              check("sin gateDoc/gateBio (no intercepta clics)", js.find("gateDoc") < 0 and js.find("gateBio") < 0)
              check("sin compararRostros (no duplica biometria)", js.find("compararRostros") < 0)
              check("sin ids ps1..ps5 (no toca visibilidad)", all(js.find("ps" + str(nx)) < 0 for nx in range(1, 6)))
              check("sin eval/atob anidados", js.find("eval(") < 0 and js.find("atob(") < 0)
              check("sin marcar pasos con clases", js.find("classList") < 0 and js.find("className") < 0)
              decir("- piezas comprometidas (DEBE contener):")
              check("bandera de idempotencia __zyraV6D", js.find("__zyraV6D") >= 0 and js.count("__zyraV6D") >= 3)
              check("un solo criterio de nombre (nombresCoinciden)", js.find("window.nombresCoinciden") >= 0 and js.find("nombresCoincidenV6D") >= 0)
              check("OCR mejorado (ocrV6D) y reemplazo de ocrPatrones", js.find("ocrV6D") >= 0 and js.find("window.ocrPatrones") >= 0)
              check("usa fechasDeTexto y nombreDeTexto del base", js.find("fechasDeTexto") >= 0 and js.find("nombreDeTexto") >= 0)
              check("retry solo en /registro/nuevo", js.find("/registro/nuevo") >= 0)
              check("mensaje: las fotos SIGUEN guardadas", js.find("SIGUEN guardadas") >= 0)
              check("API de pruebas __zyraV6Dapi", js.find("__zyraV6Dapi") >= 0)
              check("solo ASCII", bool(re.fullmatch(r"[\x00-\x7F]*", js)))

              decir("")
              decir("## 3) Sintaxis del nucleo (node --check)")
              fd_js, p_js = tempfile.mkstemp(suffix=".js")
              try:
                  with os.fdopen(fd_js, "w", encoding="utf-8") as f:
                      f.write(js)
                  r = subprocess.run(["node", "--check", p_js], capture_output=True, text=True, timeout=60)
                  check("node --check del nucleo (sintaxis JS exacta)", r.returncode == 0)
                  if r.returncode != 0:
                      decir(r.stderr[:600])
              finally:
                  try:
                      os.unlink(p_js)
                  except Exception:
                      pass

              # ---- armar la nueva linea del bloque marcado ----
              lineas = t.split("\n")
              if not check("lineas del archivo " + str(LINEAS_ESPERADAS), len(lineas) == LINEAS_ESPERADAS):
                  sys.exit(1)
              vieja = lineas[LINEA_PATCH - 1]
              rx = re.compile(r"^/\*ZYRA-V6-BEGIN\*/eval\(atob\('([A-Za-z0-9+/=]+)'\)\)/\*ZYRA-V6-END\*/</script>$")
              m = rx.match(vieja)
              if not check("linea " + str(LINEA_PATCH) + " coincide con la estructura del bloque marcado", bool(m)):
                  sys.exit(1)
              b64_viejo = m.group(1)
              try:
                  js_viejo = b64mod.b64decode(b64_viejo).decode("utf-8")
              except Exception:
                  js_viejo = ""
              check("nucleo actual (revC) decodifica y trae sus marcadores", js_viejo.strip().startswith("/*ZYRA-V6-BEGIN*/") and js_viejo.strip().endswith("/*ZYRA-V6-END*/"))

              nueva = "/*ZYRA-V6-BEGIN*/eval(atob('" + NUCLEO_B64 + "'))/*ZYRA-V6-END*/</script>"
              lineas_nuevas = lineas[:LINEA_PATCH - 1] + [nueva] + lineas[LINEA_PATCH:]
              nuevo_texto = "\n".join(lineas_nuevas)

              # ---- conservacion byte a byte: reponer la linea vieja reproduce el original ----
              decir("")
              decir("## 4) Conservacion byte a byte")
              repuesto = nuevo_texto.replace(nueva, vieja, 1)
              check("reponiendo la linea vieja se reproduce el original EXACTO", repuesto == t)
              check("lineas despues del parche", len(nuevo_texto.split("\n")) == LINEAS_ESPERADAS)
              check("solo cambia la linea " + str(LINEA_PATCH), sum(1 for a, b in zip(lineas, lineas_nuevas) if a != b) == 1)

              ok, err = py_compila(nuevo_texto)
              decir("")
              decir("## 5) Compilacion del superapp.py parcheado")
              check("py_compile OK", ok)
              if not ok:
                  decir(err)

              if ERRORES:
                  decir("")
                  decir("RECHAZO (all-or-nothing): " + str(len(ERRORES)) + " validaciones fallaron: " + " | ".join(ERRORES))
                  decir("NO se escribe el archivo, NO hay commit, NO hay push.")
                  sys.exit(1)

              # ---- escribir y publicar ----
              decir("")
              decir("## 6) Publicacion")
              with open(RUTA, "w", encoding="utf-8", newline="") as f:
                  f.write(nuevo_texto)
              sha_nuevo = hashlib.sha256(nuevo_texto.encode("utf-8", "surrogatepass")).hexdigest()
              decir("- superapp.py actualizado. sha256 nuevo: " + sha_nuevo)
              check("relectura del archivo coincide con lo validado", open(RUTA, encoding="utf-8").read() == nuevo_texto)

              tiene_remote = False
              try:
                  r = subprocess.run(["git", "remote"], capture_output=True, text=True, timeout=30)
                  tiene_remote = bool((r.stdout or "").strip())
              except Exception:
                  pass
              if not tiene_remote:
                  decir("- Sin git remote (entorno local): se omite commit/push. Cambios validados y guardados.")
                  sys.exit(0)

              r = subprocess.run(["git", "add", RUTA], capture_output=True, text=True, timeout=60)
              if r.returncode != 0:
                  decir("RECHAZO: git add fallo: " + (r.stderr or "")[:200])
                  sys.exit(1)
              msg = "ZYRA V6 revD: OCR mejorado (ocrV6D), un solo criterio de nombre, retry en /registro/nuevo (solo bloque marcado)"
              r = subprocess.run(["git", "-c", "user.name=zyra-bot", "-c", "user.email=zyra-bot@users.noreply.github.com", "commit", "-m", msg], capture_output=True, text=True, timeout=60)
              if r.returncode != 0:
                  decir("RECHAZO: git commit fallo: " + (r.stderr or "")[:200])
                  sys.exit(1)
              decir("- commit creado: " + msg)
              rama = ""
              try:
                  r = subprocess.run(["git", "rev-parse", "--abbrev-ref", "HEAD"], capture_output=True, text=True, timeout=30)
                  rama = (r.stdout or "").strip()
              except Exception:
                  pass
              if not rama or rama == "HEAD":
                  rama = os.environ.get("GITHUB_REF_NAME", "main")
              r = subprocess.run(["git", "push", "origin", "HEAD:refs/heads/" + rama], capture_output=True, text=True, timeout=180)
              if r.returncode != 0:
                  decir("RECHAZO: git push fallo: " + (r.stderr or "")[:300])
                  sys.exit(1)
              decir("- push hecho: revD PUBLICADO.")
              decir("")
              decir("## Veredicto")
              decir("- TODAS las validaciones pasaron; el parche se publico completo (all-or-nothing).")
              decir("- Nada del base fue tocado: unica linea cambiada = bloque marcado revD.")
              try:
                  with open(os.path.join(TMP, "informe_revd.txt"), "w", encoding="utf-8") as f:
                      f.write("\n".join(REPORTE))
              except Exception:
                  pass
              sys.exit(0)

          main()
          PYEOF

      - name: Artefacto del informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra-revD-informe
          path: /tmp/zyra_revd
