name: "ZYRA - AUDITORIA COMPLETA a prueba de fallos (solo lectura)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Auditoria completa blindada
        run: |
          python - <<'PYEOF'
          import ast, importlib, os, subprocess, sys, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append

          A("# 🔍 AUDITORIA COMPLETA — estado real de TODOS los archivos del ciclo GOV/EX\n")

          def seccion(titulo):
              A("")
              A("## " + titulo)

          def ver_archivo(ruta, marcas):
              try:
                  p = Path(ruta)
                  if not p.is_file():
                      A("- ❌ **NO EXISTE**: `" + ruta + "`")
                      return "NO_EXISTE"
                  t = p.read_text(encoding="utf-8", errors="replace")
                  faltan = [m for m in marcas if m not in t]
                  if faltan:
                      A("- ⚠️ existe (" + str(len(t.splitlines())) + " lineas) pero FALTA: " + ", ".join(faltan))
                      return "INCOMPLETO"
                  A("- ✅ existe y completo (" + str(len(t.splitlines())) + " lineas)")
                  return "OK"
              except Exception as exc:
                  A("- ❌ ERROR leyendo: " + str(exc))
                  return "ERROR"

          seccion("1. GOV-DATA (el ciclo actual)")
          e1 = ver_archivo("apps/laboratorio/infrastructure/providers/gov_data_engine.py",
                           ["class MotorGovData", "def ingestar", "def capa_a", "def capa_b"])
          e2 = ver_archivo("apps/laboratorio/tests/test_gov_data.py",
                           ["def test_ingestar_evento_real", "def test_capa_b_recomendacion_critica",
                            "def test_dominio_normal_sin_accion"])
          e3 = ver_archivo("apps/laboratorio/routers/api/decisions.py",
                           ["RUTA_GOV_INGESTAR", 'obtener("gov_data")'])
          e4 = ver_archivo("apps/laboratorio/registry/services/service_registry.py",
                           ["MotorGovData", '"gov_data"'])

          seccion("2. EX (todo lo del modulo grande)")
          e5 = ver_archivo("apps/laboratorio/infrastructure/providers/simulation_engine.py",
                           ["class MotorEvolucionReal", "class GemeloVivo"])
          e6 = ver_archivo("apps/laboratorio/infrastructure/providers/presentation_remote.py",
                           ["class PresentacionRemota", "class ModoCurso"])
          e7 = ver_archivo("apps/laboratorio/infrastructure/providers/citizens_engine.py",
                           ["class MotorCiudadanos", "def simular_desastre"])
          e8 = ver_archivo("apps/laboratorio/infrastructure/providers/physics_engine.py",
                           ["class MotorFisico"])
          e9 = ver_archivo("apps/laboratorio/infrastructure/providers/renderer_3d.py",
                           ["class CamaraOrbital", "class MotorRenderOrbital"])
          e10 = ver_archivo("apps/laboratorio/infrastructure/providers/video_encoder.py",
                            ["class MotorVideo", "def ensamblar"])
          e11 = ver_archivo("apps/laboratorio/infrastructure/providers/print_3d_engine.py",
                            ["class MotorImpresion3D", "def generar_stl", "def generar_gcode"])
          e12 = ver_archivo("apps/laboratorio/routers/api/world4d.py",
                            ["RUTA_CAMARA", "RUTA_DESASTRE", "RUTA_STL"])
          e13 = ver_archivo("apps/laboratorio/routers/api/presentations.py",
                            ["RUTA_SESIONES", "RUTA_CURSO_CREAR"])

          seccion("3. Import real de cada modulo (traceback si falla)")
          for modulo in (
              "apps.laboratorio.infrastructure.providers.gov_data_engine",
              "apps.laboratorio.infrastructure.providers.video_encoder",
              "apps.laboratorio.infrastructure.providers.presentation_remote",
              "apps.laboratorio.routers.api.decisions",
              "apps.laboratorio.routers.api.world4d",
              "apps.laboratorio.routers.api.presentations",
          ):
              try:
                  importlib.import_module(modulo)
                  A("- ✅ " + modulo)
              except Exception as exc:
                  A("- ❌ " + modulo + " -> " + type(exc).__name__ + ": " + str(exc)[:200])

          seccion("4. Service registry: servicios cableados")
          try:
              t = Path("apps/laboratorio/registry/services/service_registry.py").read_text(encoding="utf-8", errors="replace")
              for s in ("gemelo_vivo", "gov_data", "modocurso", "presentacion_remota",
                        "motor_ciudadanos", "motor_fisico", "motor_orbital",
                        "motor_video", "motor_p3d", "motor_monte_carlo", "salidas_universales"):
                  A("- " + s + ": " + ("✅" if '"' + s + '"' in t else "❌ NO"))
          except Exception as exc:
              A("- ❌ " + str(exc))

          seccion("5. Suite completa AHORA (output integral)")
          try:
              r = subprocess.run(
                  [sys.executable, "-m", "pytest", "apps/laboratorio/tests", "-v", "--tb=short"],
                  capture_output=True, text=True, timeout=600)
              salida = (r.stdout or "") + (r.stderr or "")
              A("codigo de salida: **" + str(r.returncode) + "**")
              resumen = [l for l in salida.splitlines() if "passed" in l or "failed" in l or "error" in l]
              if resumen:
                  A("**Resumen:** " + resumen[-1])
              fallos = [l for l in salida.splitlines() if l.startswith("FAILED") or l.startswith("ERROR")]
              if fallos:
                  A("")
                  A("**Tests fallidos:**")
                  for f in fallos:
                      A("- " + f)
              A("")
              A("<details><summary>Output completo</summary>")
              A("```")
              A(salida[-6000:] if len(salida) > 6000 else salida)
              A("```")
              A("</details>")
          except Exception as exc:
              A("- ❌ " + str(exc))

          seccion("6. DIAGNOSTICO FINAL — que hay que hacer")
          estados = {
              "gov_data_engine": e1, "test_gov_data": e2, "decisions": e3,
              "service_registry": e4, "simulation_engine": e5,
              "presentation_remote": e6, "citizens_engine": e7,
              "physics_engine": e8, "renderer_3d": e9,
              "video_encoder": e10, "print_3d_engine": e11,
              "world4d": e12, "presentations": e13,
          }
          acciones = []
          for nombre, estado in estados.items():
              if estado != "OK":
                  acciones.append("- **" + nombre + "**: " + estado + " -> reescribir completo")
          if acciones:
              A("Archivos a reescribir completos en el proximo lote:")
              for a in acciones:
                  A(a)
          else:
              A("✅ TODOS los archivos existen y estan completos.")
          A("")
          A("**Conclusion:** la auditoria muestra el estado exacto. El proximo lote escribe")
          A("SOLO lo que esta lista marca, en un solo paso, autocontenido.")

          if summary:
              with open(summary, "a") as fh:
                  fh.write("\n".join(L) + "\n")
          print("\n".join(L))
          sys.exit(0)
          PYEOF

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-completa
          path: auditoria_completa.md
