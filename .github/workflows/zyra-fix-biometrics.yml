name: "ZYRA GOV - MP4 real con ffmpeg + GOV-DATA capas A y B (autocontenido, verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar ffmpeg (encoder H.264 real)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: video_encoder.py completo (AVI-MJPEG propio + MP4/H.264 con ffmpeg si esta disponible)
        run: |
          cat > apps/laboratorio/infrastructure/providers/video_encoder.py <<'VID_EOF'
          """Encoder de VIDEO: AVI-MJPEG propio (stdlib) + MP4/H.264 real via ffmpeg.

          Ley 1 (honestidad): si ffmpeg no esta instalado en el sistema,
          ensamblar_mp4() lo declara y ofrece el AVI como alternativa.
          Nunca simula un MP4 que no existe.
          """
          import math
          import shutil
          import struct
          import subprocess
          import tempfile
          from pathlib import Path

          from apps.laboratorio.infrastructure.providers.png_decoder import (
              decodificar_png_rgb,
          )
          from apps.laboratorio.infrastructure.providers.png_encoder import (
              encode_png_rgb,
          )

          FPS_DEFECTO = 12
          MAX_FRAMES = 600
          MAX_DIM = 1920


          def ffmpeg_disponible() -> bool:
              return shutil.which("ffmpeg") is not None


          def _avi(frames_jpeg, ancho, alto, fps):
              tam = sum(len(f) + 8 for f in frames_jpeg)
              total = 4 + 8 + 4 + 8 + 4 + 68 + 16 + 12 + tam + 8 + len(frames_jpeg) * 16
              avi = bytearray()
              avi += b"RIFF" + struct.pack("<I", total - 8) + b"AVI "
              avi += b"LIST" + struct.pack("<I", 4) + b"hdrl"
              avi += b"avih" + struct.pack("<I", 56)
              avi += struct.pack("<IIIIIIIIIIIIII", int(1_000_000 / max(1, fps)), 0, 0, 0x10,
                                 len(frames_jpeg), 0, 1, ancho * alto * 3, ancho, alto, 0, 0, 0, 0)
              avi += b"LIST" + struct.pack("<I", 68) + b"strl"
              avi += b"strh" + struct.pack("<I", 56)
              avi += b"vids" + b"MJPG" + struct.pack("<IIIIIIIII", 0, 0, 0, 0, 1, fps, 0, len(frames_jpeg), ancho * alto * 3)
              avi += struct.pack("<II", ancho, alto)
              avi += b"LIST" + struct.pack("<I", 10) + b"strfstrf" + struct.pack("<IHI", 40, ancho, alto)[:8]
              avi += b"LIST" + struct.pack("<I", tam + 4) + b"movi"
              for frame in frames_jpeg:
                  avi += b"00dc" + struct.pack("<I", len(frame)) + frame
              avi += b"idx1" + struct.pack("<I", len(frames_jpeg) * 16)
              for frame in frames_jpeg:
                  avi += b"00dc" + struct.pack("<II", 0x10, len(frame))
              return bytes(avi)


          class MotorVideo:
              """Video real: MP4/H.264 con ffmpeg, AVI-MJPEG propio como respaldo."""

              def capacidades(self) -> dict:
                  disponible = ffmpeg_disponible()
                  return {
                      "mp4_h264": ("disponible via ffmpeg del sistema" if disponible
                                   else "NO disponible en este entorno (instale ffmpeg)"),
                      "avi_mjpeg": "siempre disponible (stdlib)",
                      "fps": {"defecto": FPS_DEFECTO, "rango": (1, 60)},
                      "max_frames": MAX_FRAMES,
                  }

              @staticmethod
              def _validar_y_extraer(frames_png, fps):
                  fps = int(fps)
                  if not 1 <= fps <= 60:
                      raise ValueError("fps debe estar entre 1 y 60.")
                  if not isinstance(frames_png, list) or not frames_png:
                      raise ValueError("frames_png requiere al menos 1 frame.")
                  if len(frames_png) > MAX_FRAMES:
                      raise ValueError("maximo " + str(MAX_FRAMES) + " frames.")
                  ref = None
                  pngs = []
                  for i, datos_png in enumerate(frames_png):
                      ancho, alto, pixeles = decodificar_png_rgb(datos_png)
                      if ancho > MAX_DIM or alto > MAX_DIM:
                          raise ValueError("frame " + str(i) + " excede " + str(MAX_DIM))
                      if ref is None:
                          ref = (ancho, alto)
                      elif (ancho, alto) != ref:
                          raise ValueError("todos los frames deben tener la misma resolucion.")
                      pngs.append((ancho, alto, pixeles))
                  return pngs, ref, fps

              def ensamblar_mp4(self, frames_png, fps=FPS_DEFECTO, bitrate="2M") -> dict:
                  """MP4/H.264 REAL via ffmpeg del sistema."""
                  if not ffmpeg_disponible():
                      raise RuntimeError(
                          "ffmpeg no esta instalado en este entorno. "
                          "Alternativa real: use ensamblar_avi().")
                  pngs, ref, fps = self._validar_y_extraer(frames_png, fps)
                  ancho, alto = ref
                  if ancho % 2:
                      ancho += 1
                  if alto % 2:
                      alto += 1
                  with tempfile.TemporaryDirectory() as tmp:
                      tmp_dir = Path(tmp)
                      for i, (w, h, pixeles) in enumerate(pngs):
                          png_path = tmp_dir / ("f" + str(i).zfill(5) + ".png")
                          png_path.write_bytes(encode_png_rgb(w, h, pixeles))
                      salida = tmp_dir / "salida.mp4"
                      resultado = subprocess.run(
                          ["ffmpeg", "-y", "-loglevel", "error",
                           "-framerate", str(fps), "-i",
                           str(tmp_dir / "f%05d.png"),
                           "-c:v", "libx264", "-pix_fmt", "yuv420p",
                           "-b:v", str(bitrate), str(salida)],
                          capture_output=True, text=True, timeout=300)
                      if resultado.returncode != 0 or not salida.is_file():
                          raise RuntimeError("ffmpeg fallo: " + (resultado.stderr or "")[-400:])
                      mp4 = salida.read_bytes()
                  if mp4[:8] != b"\x00\x00\x00\x18ftypmp42" and b"ftypmp42" not in mp4[:32]:
                      raise ValueError("Error interno: contenedor MP4 invalido.")
                  return {"formato": "mp4-h264", "frames": len(pngs), "fps": fps,
                          "duracion_segundos": round(len(pngs) / fps, 2),
                          "resolucion": [ancho, alto], "bytes": len(mp4),
                          "video": mp4, "encoder": "ffmpeg libx264"}

              def ensamblar_avi(self, frames_png, fps=FPS_DEFECTO, calidad=50) -> dict:
                  """AVI-MJPEG propio, siempre disponible."""
                  pngs, ref, fps = self._validar_y_extraer(frames_png, fps)
                  ancho, alto = ref
                  jpegs = []
                  for _w, _h, pixeles in pngs:
                      gris = bytearray(ancho * alto)
                      for j in range(ancho * alto):
                          gris[j] = (pixeles[j * 3] + pixeles[j * 3 + 1] + pixeles[j * 3 + 2]) // 3
                      jpegs.append(self._jpeg_luminancia(gris, ancho, alto, calidad))
                  video = _avi(jpegs, ancho, alto, fps)
                  if video[:4] != b"RIFF" or video[8:12] != b"AVI ":
                      raise ValueError("contenedor invalido.")
                  return {"formato": "avi-mjpeg", "frames": len(jpegs), "fps": fps,
                          "duracion_segundos": round(len(jpegs) / fps, 2),
                          "resolucion": list(ref), "bytes": len(video), "video": video}

              @staticmethod
              def _jpeg_luminancia(pixeles, ancho, alto, calidad):
                  base_q = [16, 11, 10, 16, 24, 40, 51, 61, 12, 12, 14, 19, 26, 58, 60, 55,
                            14, 13, 16, 24, 40, 57, 69, 56, 14, 17, 22, 29, 51, 87, 80, 62,
                            18, 22, 37, 56, 68, 109, 103, 77, 24, 35, 55, 64, 81, 104, 113, 92,
                            49, 64, 78, 87, 103, 121, 120, 101, 72, 92, 95, 98, 112, 100, 103, 99]
                  factor = max(1.0, min(50.0, float(calidad)))
                  cuant = [max(1, min(255, int(c * factor / 50.0))) for c in base_q]
                  zigzag = [0, 1, 8, 16, 9, 2, 3, 10, 17, 24, 32, 25, 18, 11, 4, 5,
                            12, 19, 26, 33, 40, 48, 41, 34, 27, 20, 13, 6, 7, 14, 21, 28,
                            35, 42, 49, 56, 57, 50, 43, 36, 29, 22, 15, 23, 30, 37, 44, 51,
                            58, 59, 52, 45, 38, 31, 39, 46, 53, 60, 61, 54, 47, 55, 62, 63]

                  def dct2(b):
                      res = []
                      for u in range(8):
                          for v in range(8):
                              cu = 0.7071067811865476 if u == 0 else 1.0
                              cv = 0.7071067811865476 if v == 0 else 1.0
                              s = 0.0
                              for x in range(8):
                                  for y in range(8):
                                      s += b[x * 8 + y] * math.cos((2 * x + 1) * u * math.pi / 16) * math.cos((2 * y + 1) * v * math.pi / 16)
                              res.append(cu * cv * s / 4.0)
                      return res

                  cuerpo = bytearray()
                  cuerpo += bytes([0xFF, 0xD8, 0xFF, 0xC0, 0, 17, 8,
                                   alto >> 8, alto & 0xFF, ancho >> 8, ancho & 0xFF, 1, 1, 0x11, 0])
                  cuerpo += bytes([0xFF, 0xDB, 0, 132, 0]) + bytes(cuant)
                  cuerpo += bytes([0xFF, 0xC4, 0, 162, 0x00]) + bytes([0] * 272)
                  cuerpo += bytes([0xFF, 0xDA, 0, 12, 1, 1, 0, 0, 63, 0])
                  for py in range(0, alto, 8):
                      for px in range(0, ancho, 8):
                          bloque = []
                          for x in range(8):
                              for y in range(8):
                                  sx = min(ancho - 1, px + x)
                                  sy = min(alto - 1, py + y)
                                  bloque.append(pixeles[sy * ancho + sx])
                          coefs = dct2(bloque)
                          for i in range(64):
                              cuerpo += struct.pack(">h", round(coefs[zigzag[i]] / cuant[i]))
                  cuerpo += bytes([0xFF, 0xD9])
                  return bytes(cuerpo)
          VID_EOF

      - name: gov_data_engine.py (capas A y B)
        run: |
          cat > apps/laboratorio/infrastructure/providers/gov_data_engine.py <<'GOV_EOF'
          """GOV-DATA: Panel Nacional en Tiempo Real (capas A y B).

          CAPA A (APP_OPERACIONAL): una fila por indicador de cada app,
          alimentada por los eventos reales de la Red (outbox/colector).

          CAPA B (INTELIGENCIA_NACIONAL): vision consolidada por dominio
          con tendencia, gravedad y RECOMENDACION automatica.

          Sin encuestas: todo fluye de los eventos que las apps ya emiten.
          """
          import time
          from collections import deque

          MAX_EVENTOS = 2000
          GRavedad_UMBRAL_ALTO = 10.0

          DOMINIOS = {
              "educacion": ("SEMILLA",),
              "agro": ("AGRO",),
              "salud_justicia": ("AXIS",),
              "economia": ("NEXO",),
              "comercio": ("SUBASTAS",),
              "laboratorio": ("LABORATORIO",),
          }


          class MotorGovData:
              """Capa A + B del panel nacional."""

              def __init__(self):
                  self._eventos = deque(maxlen=MAX_EVENTOS)
                  self._indicadores = {}
                  self._secuencia = 0

              def capacidades(self) -> dict:
                  return {
                      "capa_a": "APP_OPERACIONAL - indicador por app en tiempo real",
                      "capa_b": "INTELIGENCIA_NACIONAL - consolidado con tendencia y recomendacion",
                      "fuente": "eventos reales de la Red (sin encuestas)",
                      "dominios": sorted(DOMINIOS.keys()),
                  }

              def _app_de_evento(self, nombre_evento) -> str:
                  prefijo = str(nombre_evento).split(".")[0].upper()
                  for dominio, apps in DOMINIOS.items():
                      if prefijo in apps or prefijo in dominio.upper():
                          return dominio
                  return "otro"

              def ingestar(self, nombre_evento, datos=None, app=None) -> dict:
                  """Capa A: recibe un evento real y actualiza indicadores."""
                  if not nombre_evento or not str(nombre_evento).strip():
                      raise ValueError("nombre_evento requerido.")
                  datos = dict(datos or {})
                  self._secuencia += 1
                  registro = {
                      "seq": self._secuencia,
                      "evento": str(nombre_evento)[:150],
                      "app": str(app or self._app_de_evento(nombre_evento)),
                      "datos": datos,
                      "momento": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  }
                  self._eventos.append(registro)
                  clave = registro["app"] + "." + str(nombre_evento)
                  actual = self._indicadores.get(clave)
                  if actual is None:
                      self._indicadores[clave] = {"app": registro["app"], "indicador": str(nombre_evento)[:150],
                                                  "conteo": 1, "ultimo_valor": None,
                                                  "anterior_valor": None, "momento": registro["momento"]}
                  else:
                      actual["anterior_valor"] = actual["ultimo_valor"]
                      actual["conteo"] += 1
                      actual["momento"] = registro["momento"]
                  valor = datos.get("valor")
                  if isinstance(valor, (int, float)) and not isinstance(valor, bool):
                      self._indicadores[clave]["anterior_valor"] = self._indicadores[clave]["ultimo_valor"]
                      self._indicadores[clave]["ultimo_valor"] = float(valor)
                  return registro

              def capa_a(self) -> dict:
                  """Panel operativo: una fila por indicador con estado vivo."""
                  filas = []
                  for clave in sorted(self._indicadores):
                      ind = dict(self._indicadores[clave])
                      delta = None
                      if (ind["ultimo_valor"] is not None and ind["anterior_valor"] is not None):
                          delta = round(ind["ultimo_valor"] - ind["anterior_valor"], 4)
                      gravedad = "normal"
                      if delta is not None and abs(delta) >= GRavedad_UMBRAL_ALTO:
                          gravedad = "alerta"
                      ind["delta"] = delta
                      ind["gravedad"] = gravedad
                      filas.append(ind)
                  return {"indicadores": filas, "total": len(filas),
                          "eventos_ingestados": self._secuencia}

              def capa_b(self) -> dict:
                  """Inteligencia nacional: consolidado por dominio + recomendacion."""
                  dominios = {}
                  for clave, ind in self._indicadores.items():
                      dominio = ind["app"]
                      dominios.setdefault(dominio, []).append(ind)
                  consolidado = []
                  for dominio in sorted(dominios):
                      indicadores = dominios[dominio]
                      alertas = sum(1 for i in indicadores
                                    if i["ultimo_valor"] is not None and i["anterior_valor"] is not None
                                    and abs(i["ultimo_valor"] - i["anterior_valor"]) >= GRavedad_UMBRAL_ALTO)
                      if alertas >= 3:
                          gravedad = "critica"
                          recomendacion = ("Intervencion inmediata en " + dominio
                                           + ": " + str(alertas) + " indicadores con cambio brusco.")
                      elif alertas >= 1:
                          gravedad = "alerta"
                          recomendacion = ("Monitorear " + dominio + ": " + str(alertas)
                                           + " indicador(es) con cambio significativo.")
                      else:
                          gravedad = "normal"
                          recomendacion = dominio + " estable: sin accion requerida."
                      consolidado.append({
                          "dominio": dominio,
                          "indicadores": len(indicadores),
                          "eventos": sum(i["conteo"] for i in indicadores),
                          "alertas": alertas,
                          "gravedad": gravedad,
                          "recomendacion": recomendacion,
                      })
                  return {
                      "dominios": consolidado,
                      "total_dominios": len(consolidado),
                      "dominios_en_alerta": sum(1 for d in consolidado if d["gravedad"] != "normal"),
                  }

              def historial(self, limite=100) -> dict:
                  limite = max(1, min(1000, int(limite)))
                  eventos = list(self._eventos)
                  return {"total": len(eventos), "eventos": eventos[-limite:]}
          GOV_EOF

      - name: world4d.py COMPLETO (todas las rutas + camara + desastres + print3d)
        run: |
          cat > apps/laboratorio/routers/api/world4d.py <<'W4_EOF'
          """Rutas 4D + ciudadanos + fisica + camara orbital + desastres + impresion 3D."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.infrastructure.providers.renderer_3d import CamaraOrbital
          from apps.laboratorio.permissions.policies.project_policy import PoliticaProyecto
          from apps.laboratorio.schemas.responses.envelopes import exito

          RUTA_TIMELINE = "/laboratorio/api/v1/scenes/{escena_id}/timeline"
          RUTA_LIGHTING = "/laboratorio/api/v1/scenes/{escena_id}/lighting"
          RUTA_INTERACCIONES = "/laboratorio/api/v1/scenes/{escena_id}/interactions"
          RUTA_CIT_POBLAR = "/laboratorio/api/v1/scenes/{escena_id}/citizens/populate"
          RUTA_CIT_PASO = "/laboratorio/api/v1/scenes/{escena_id}/citizens/step"
          RUTA_CIT_ESTADO = "/laboratorio/api/v1/scenes/{escena_id}/citizens"
          RUTA_CIT_EVACUAR = "/laboratorio/api/v1/scenes/{escena_id}/citizens/evacuate"
          RUTA_FIS_AGREGAR = "/laboratorio/api/v1/scenes/{escena_id}/physics/bodies"
          RUTA_FIS_IMPULSO = "/laboratorio/api/v1/scenes/{escena_id}/physics/bodies/{cuerpo_id}/impulse"
          RUTA_FIS_PASO = "/laboratorio/api/v1/scenes/{escena_id}/physics/step"
          RUTA_FIS_ESTADO = "/laboratorio/api/v1/scenes/{escena_id}/physics"
          RUTA_CAMARA = "/laboratorio/api/v1/scenes/{escena_id}/camara/orbital"
          RUTA_DESASTRE = "/laboratorio/api/v1/scenes/{escena_id}/desastre/simular"
          RUTA_STL = "/laboratorio/api/v1/scenes/{escena_id}/print3d/stl"
          RUTA_GCODE = "/laboratorio/api/v1/scenes/{escena_id}/print3d/gcode"
          RUTA_P3D_FULL = "/laboratorio/api/v1/scenes/{escena_id}/print3d/preparar"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_cuatro_d")
              ciudadanos = app.contenedor.obtener("motor_ciudadanos")
              fisica = app.contenedor.obtener("motor_fisico")
              motor_orbital = app.contenedor.obtener("motor_orbital")
              motor_p3d = app.contenedor.obtener("motor_p3d")
              repo_escenas = app.contenedor.obtener("repo_escenas")
              repo_proyectos = app.contenedor.obtener("repo_proyectos")

              def _escena_verificada(ctx):
                  escena = repo_escenas.obtener_exigir(ctx.ruta_params["escena_id"])
                  proyecto = repo_proyectos.obtener_exigir(str(escena.proyecto_id))
                  PoliticaProyecto.exigir_ver(proyecto, ctx.identidad)
                  return escena

              def _camara(ctx):
                  escena = _escena_verificada(ctx)
                  datos = ctx.json()
                  camara = CamaraOrbital(distancia=datos.get("distancia", 3.0))
                  camara.girar(float(datos.get("azimut", 0.0)), float(datos.get("elevacion", 35.0)))
                  resultado = motor_orbital.renderizar_orbital(
                      escena, {"ancho": int(datos.get("ancho", 400)),
                               "alto": int(datos.get("alto", 300))}, camara)
                  return 200, resultado.imagen_bytes, {"Content-Type": "image/png", "Cache-Control": "no-store"}

              def _desastre(ctx):
                  _escena_verificada(ctx)
                  datos = ctx.json()
                  plan = ciudadanos.simular_desastre(
                      str(datos.get("tipo", "")), datos.get("epicentro", [0, 0]),
                      datos.get("radio", 50.0), datos.get("zonas_seguras", []))
                  outbox = app.contenedor.obtener("outbox")
                  outbox.encolar("laboratorio.desastre.simulado", "zyra/documents/seal",
                                 {"titulo": "Simulacion de desastre: " + str(plan["tipo"]),
                                  "contenido": {"plan": plan, "escena": ctx.ruta_params["escena_id"]}})
                  return exito({"plan": plan, "red": {"evento": "laboratorio.desastre.simulado",
                                                      "estado": outbox.estadisticas()}})

              def _stl(ctx):
                  _escena_verificada(ctx)
                  datos = ctx.json()
                  return exito(motor_p3d.generar_stl(datos.get("objetos", [])))

              def _gcode(ctx):
                  _escena_verificada(ctx)
                  datos = ctx.json()
                  return exito(motor_p3d.generar_gcode(
                      datos.get("objetos", []), float(datos.get("altura_capa_mm", 0.2)),
                      float(datos.get("densidad_relleno", 0.3)),
                      float(datos.get("velocidad_mm_s", 1500))))

              def _p3d_full(ctx):
                  _escena_verificada(ctx)
                  datos = ctx.json()
                  return exito(motor_p3d.disenar_y_preparar(
                      datos.get("objetos", []), float(datos.get("altura_capa_mm", 0.2)),
                      float(datos.get("densidad_relleno", 0.3)),
                      float(datos.get("velocidad_mm_s", 1500))))

              app.registrar("POST", RUTA_TIMELINE, lambda c: manejador.crear_timeline(c.identidad, c.ruta_params["escena_id"], c.json()), PermisoCodigo.EDITAR_4D, "Crear linea de tiempo")
              app.registrar("GET", RUTA_TIMELINE, lambda c: manejador.obtener_timeline(c.identidad, c.ruta_params["escena_id"]), PermisoCodigo.VER, "Obtener linea de tiempo")
              app.registrar("POST", RUTA_LIGHTING, lambda c: manejador.crear_luz(c.identidad, c.ruta_params["escena_id"], c.json()), PermisoCodigo.EDITAR_4D, "Crear programa de luz")
              app.registrar("GET", RUTA_LIGHTING, lambda c: manejador.obtener_luz(c.identidad, c.ruta_params["escena_id"]), PermisoCodigo.VER, "Obtener programa de luz")
              app.registrar("POST", RUTA_INTERACCIONES, lambda c: manejador.crear_interaccion(c.identidad, c.ruta_params["escena_id"], c.json()), PermisoCodigo.EDITAR_4D, "Crear zona de interaccion")
              app.registrar("GET", RUTA_INTERACCIONES, lambda c: manejador.listar_interacciones(c.identidad, c.ruta_params["escena_id"]), PermisoCodigo.VER, "Listar interacciones")
              app.registrar("POST", RUTA_CIT_POBLAR, _poblar, PermisoCodigo.EDITAR_4D, "Poblar gemelo con ciudadanos")
              app.registrar("POST", RUTA_CIT_PASO, _paso_cit, PermisoCodigo.EDITAR_4D, "Paso de simulacion social")
              app.registrar("GET", RUTA_CIT_ESTADO, _estado_cit, PermisoCodigo.VER, "Estado de la poblacion")
              app.registrar("POST", RUTA_CIT_EVACUAR, _evacuar, PermisoCodigo.EDITAR_4D, "Evacuacion hacia salidas")
              app.registrar("POST", RUTA_FIS_AGREGAR, _fis_agregar, PermisoCodigo.EDITAR_4D, "Agregar cuerpo fisico")
              app.registrar("POST", RUTA_FIS_IMPULSO, _fis_impulso, PermisoCodigo.EDITAR_4D, "Impulso a un cuerpo")
