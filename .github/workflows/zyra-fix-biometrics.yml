                      (str(indicador.id), indicador.nombre, indicador.tipo,
                       int(indicador.valor), indicador.origen, indicador.estado,
                       indicador.sello_hash,
                       indicador.creado_en.isoformat(), indicador.actualizado_en.isoformat()),
                  )

              def actualizar_indicador(self, indicador) -> bool:
