name: "ZYRA SEMILLA SM1+SM2 (fix test flags STU-A doble riesgo real)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] SM1 motores (idempotente)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          IN = "apps/semilla/domain/institution"
          ST = "apps/semilla/domain/student"
          CL = "apps/semilla/domain/classroom"
          AC = "apps/semilla/domain/academic"
          AT = "apps/semilla/domain/attendance"
          EV = "apps/semilla/domain/evaluation"
          NO = "apps/semilla/domain/notifications"

          try:
              forzar(IN + "/institution_registry_engine.py", D(r'''
                  """Institution Registry - centros educativos (SM1)."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  import json as _j
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_institutions", (
                          "CREATE TABLE IF NOT EXISTS sm_institutions (institution_id TEXT PRIMARY KEY, name TEXT NOT NULL, mined_code TEXT NOT NULL DEFAULT '', country TEXT NOT NULL DEFAULT 'SV', district TEXT NOT NULL DEFAULT '', levels_json TEXT NOT NULL DEFAULT '[]', active INTEGER NOT NULL DEFAULT 1, created_at REAL NOT NULL)",
                      )),
                  )

                  class InstitutionRegistryEngine:
                      """Registro de instituciones educativas."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.institution",
                                          _MIGRATIONS).run(clock)

                      def register(self, *, name, mined_code="",
                                   country="SV", district="",
                                   levels=None) -> dict:
                          if not str(name).strip():
                              raise ValueError("name requerido")
                          iid = "SMINST-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_institutions"
                                  " (institution_id, name,"
                                  " mined_code, country, district,"
                                  " levels_json, active, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, 1, ?)",
                                  (iid, str(name).strip(),
                                   str(mined_code), country,
                                   str(district),
                                   _j.dumps(levels or [],
                                            default=str), now))
                          return self.get(iid)

                      def get(self, institution_id
                              ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_institutions"
                              " WHERE institution_id = ?",
                              (institution_id,))
                          if not row:
                              return None
                          return {"institution_id":
                                      str(row["institution_id"]),
                                  "name": str(row["name"]),
                                  "mined_code":
                                      str(row["mined_code"]),
                                  "country": str(row["country"]),
                                  "district": str(row["district"]),
                                  "levels": _j.loads(
                                      str(row["levels_json"])),
                                  "active": bool(row["active"])}

                      def list_all(self) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT institution_id FROM"
                              " sm_institutions WHERE active = 1"
                              " ORDER BY name")
                          return [self.get(
                              str(r["institution_id"]))
                              for r in rows]
              '''))

              forzar(ST + "/student_registry_engine.py", D(r'''
                  """Student Registry - expediente educativo (SM1).
                  SE-2: solo referencia ZID. SE-3: tutores + 2
                  encargados + emergencias obligatorios. SE-5:
                  official_refs source/verification elevable."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import json as _j
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  LEVELS = ("PARVULARIA", "BASICA", "MEDIA")
                  ZID_STATUSES = ("NONE", "PROVISIONAL",
                                  "VERIFIED")
                  BIO_PHASES = ("NONE", "FACE", "FULL")
                  SOURCES = ("PARENT", "SCHOOL", "STUDENT",
                             "DOCUMENT", "MINED")
                  VSTATUSES = ("UNVERIFIED", "SELF_REPORTED",
                               "INSTITUTION_VERIFIED",
                               "DOCUMENT_VERIFIED",
                               "MINED_VERIFIED")

                  _MIGRATIONS = (
                      Migration(1, "sm_students", (
                          "CREATE TABLE IF NOT EXISTS sm_students (student_id TEXT PRIMARY KEY, zid TEXT NOT NULL DEFAULT '', zid_status TEXT NOT NULL DEFAULT 'NONE', full_name TEXT NOT NULL, birth_date TEXT NOT NULL DEFAULT '', birth_place TEXT NOT NULL DEFAULT '', sex TEXT NOT NULL DEFAULT '', level TEXT NOT NULL, grade TEXT NOT NULL, institution_id TEXT NOT NULL DEFAULT '', tutores_json TEXT NOT NULL DEFAULT '[]', pickup_json TEXT NOT NULL DEFAULT '[]', emergency_json TEXT NOT NULL DEFAULT '[]', official_refs_json TEXT NOT NULL DEFAULT '[]', biometric_phase TEXT NOT NULL DEFAULT 'NONE', status TEXT NOT NULL DEFAULT 'ACTIVO', created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                      )),
                  )

                  class StudentRegistryEngine:
                      """Expediente educativo del estudiante."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.students",
                                          _MIGRATIONS).run(clock)

                      def register(self, *, full_name, level,
                                   grade, birth_date="",
                                   birth_place="", sex="",
                                   institution_id="",
                                   tutores=None,
                                   authorized_pickup=None,
                                   emergency_contacts=None,
                                   official_refs=None,
                                   zid="",
                                   zid_status="NONE") -> dict:
                          if level not in LEVELS:
                              raise ValueError(
                                  "nivel invalido: " + str(level))
                          if not str(full_name).strip():
                              raise ValueError(
                                  "full_name requerido")
                          tut = list(tutores or [])
                          pick = list(authorized_pickup or [])
                          emg = list(emergency_contacts or [])
                          if len(tut) < 1:
                              raise ValueError("minimo 1 tutor")
                          if len(pick) < 2:
                              raise ValueError(
                                  "minimo 2 encargados de retiro")
                          if len(emg) < 1:
                              raise ValueError(
                                  "minimo 1 contacto de"
                                  " emergencia")
                          refs = []
                          for r in (official_refs or []):
                              if (r.get("source") not in SOURCES
                                      or r.get("status")
                                      not in VSTATUSES):
                                  raise ValueError(
                                      "official_ref invalido")
                              refs.append(dict(r))
                          if zid_status not in ZID_STATUSES:
                              zid_status = "NONE"
                          sid = "SM-STU-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_students"
                                  " (student_id, zid, zid_status,"
                                  " full_name, birth_date,"
                                  " birth_place, sex, level, grade,"
                                  " institution_id, tutores_json,"
                                  " pickup_json, emergency_json,"
                                  " official_refs_json,"
                                  " biometric_phase, status,"
                                  " created_at, updated_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, ?, ?,"
                                  " ?, ?, ?, ?, ?, ?, 'NONE',"
                                  " 'ACTIVO', ?, ?)",
                                  (sid, str(zid), zid_status,
                                   str(full_name).strip(),
                                   str(birth_date),
                                   str(birth_place), str(sex),
                                   level, str(grade),
                                   str(institution_id),
                                   _j.dumps(tut, default=str),
                                   _j.dumps(pick, default=str),
                                   _j.dumps(emg, default=str),
                                   _j.dumps(refs, default=str),
                                   now, now))
                          return self.get(sid)

                      def get(self, student_id) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_students WHERE"
                              " student_id = ?", (student_id,))
                          if not row:
                              return None
                          return {
                              "student_id":
                                  str(row["student_id"]),
                              "zid": str(row["zid"]),
                              "zid_status":
                                  str(row["zid_status"]),
                              "full_name":
                                  str(row["full_name"]),
                              "birth_date":
                                  str(row["birth_date"]),
                              "birth_place":
                                  str(row["birth_place"]),
                              "sex": str(row["sex"]),
                              "level": str(row["level"]),
                              "grade": str(row["grade"]),
                              "institution_id":
                                  str(row["institution_id"]),
                              "tutores": _j.loads(
                                  str(row["tutores_json"])),
                              "authorized_pickup": _j.loads(
                                  str(row["pickup_json"])),
                              "emergency_contacts": _j.loads(
                                  str(row["emergency_json"])),
                              "official_refs": _j.loads(
                                  str(row["official_refs_json"])),
                              "biometric_phase":
                                  str(row["biometric_phase"]),
                              "status": str(row["status"])}

                      def set_zid(self, student_id, zid,
                                  zid_status) -> dict:
                          if zid_status not in ZID_STATUSES:
                              raise ValueError(
                                  "zid_status invalido")
                          self._db.execute(
                              "UPDATE sm_students SET zid = ?,"
                              " zid_status = ?, updated_at = ?"
                              " WHERE student_id = ?",
                              (str(zid), zid_status,
                               self._clock.now(), student_id))
                          return self.get(student_id)

                      def set_biometric_phase(self, student_id,
                                              phase) -> dict:
                          if phase not in BIO_PHASES:
                              raise ValueError("fase invalida")
                          self._db.execute(
                              "UPDATE sm_students SET"
                              " biometric_phase = ?,"
                              " updated_at = ? WHERE"
                              " student_id = ?",
                              (phase, self._clock.now(),
                               student_id))
                          return self.get(student_id)

                      def add_official_ref(self, student_id, *,
                                           ref_type, value, source,
                                           status) -> dict:
                          if source not in SOURCES:
                              raise ValueError("source invalido")
                          if status not in VSTATUSES:
                              raise ValueError("status invalido")
                          row = self._db.query_one(
                              "SELECT official_refs_json FROM"
                              " sm_students WHERE student_id = ?",
                              (student_id,))
                          if not row:
                              raise KeyError(student_id)
                          refs = _j.loads(
                              str(row["official_refs_json"]))
                          refs.append({"ref_type": str(ref_type),
                                       "value": str(value),
                                       "source": source,
                                       "status": status})
                          self._db.execute(
                              "UPDATE sm_students SET"
                              " official_refs_json = ?,"
                              " updated_at = ? WHERE"
                              " student_id = ?",
                              (_j.dumps(refs, default=str),
                               self._clock.now(), student_id))
                          return self.get(student_id)

                      def elevate_verification(self, student_id,
                                               ref_type,
                                               new_status) -> dict:
                          if new_status not in VSTATUSES:
                              raise ValueError("status invalido")
                          row = self._db.query_one(
                              "SELECT official_refs_json FROM"
                              " sm_students WHERE student_id = ?",
                              (student_id,))
                          if not row:
                              raise KeyError(student_id)
                          refs = _j.loads(
                              str(row["official_refs_json"]))
                          order = VSTATUSES
                          changed = False
                          for r in refs:
                              if r["ref_type"] == ref_type:
                                  if (order.index(new_status)
                                          > order.index(
                                              r["status"])):
                                      r["status"] = new_status
                                      changed = True
                          if not changed:
                              raise ValueError(
                                  "nada que elevar (o intento de"
                                  " degradar)")
                          self._db.execute(
                              "UPDATE sm_students SET"
                              " official_refs_json = ?,"
                              " updated_at = ? WHERE"
                              " student_id = ?",
                              (_j.dumps(refs, default=str),
                               self._clock.now(), student_id))
                          return self.get(student_id)

                      def promote(self, student_id, new_level,
                                  new_grade) -> dict:
                          if new_level not in LEVELS:
                              raise ValueError("nivel invalido")
                          self._db.execute(
                              "UPDATE sm_students SET level = ?,"
                              " grade = ?, updated_at = ? WHERE"
                              " student_id = ?",
                              (new_level, str(new_grade),
                               self._clock.now(), student_id))
                          return self.get(student_id)

                      def by_institution(self,
                                         institution_id,
                                         level="") -> List[dict]:
                          if level:
                              rows = self._db.query_all(
                                  "SELECT student_id FROM"
                                  " sm_students WHERE"
                                  " institution_id = ? AND"
                                  " level = ? ORDER BY grade",
                                  (institution_id, level))
                          else:
                              rows = self._db.query_all(
                                  "SELECT student_id FROM"
                                  " sm_students WHERE"
                                  " institution_id = ?"
                                  " ORDER BY grade",
                                  (institution_id,))
                          return [self.get(str(r["student_id"]))
                                  for r in rows]
              '''))

              forzar(CL + "/classroom_engine.py", D(r'''
                  """Classroom Engine - aulas con cupos reales (SM1)."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "sm_classrooms", (
                          "CREATE TABLE IF NOT EXISTS sm_classrooms (classroom_id TEXT PRIMARY KEY, name TEXT NOT NULL, institution_id TEXT NOT NULL, school_year TEXT NOT NULL, level TEXT NOT NULL, grade TEXT NOT NULL, section TEXT NOT NULL DEFAULT 'A', turn TEXT NOT NULL DEFAULT 'MATUTINA', capacity INTEGER NOT NULL DEFAULT 30, enrolled INTEGER NOT NULL DEFAULT 0, teacher_id TEXT NOT NULL DEFAULT '', status TEXT NOT NULL DEFAULT 'OPEN', created_at REAL NOT NULL)",
                      )),
                  )

                  class ClassroomEngine:
                      """Aulas con cupos transaccionales."""

                      def __init__(self, db, clock):
                          self._db = db
                          self._clock = clock
                          MigrationRunner(db, "sm.classroom",
                                          _MIGRATIONS).run(clock)

                      def create(self, *, name, institution_id,
                                 school_year, level, grade,
                                 section="A",
                                 turn="MATUTINA", capacity=30,
                                 teacher_id="") -> dict:
                          if int(capacity) <= 0:
                              raise ValueError("capacity > 0")
                          cid = "SMCLS-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_classrooms"
                                  " (classroom_id, name,"
                                  " institution_id, school_year,"
                                  " level, grade, section, turn,"
                                  " capacity, enrolled, teacher_id,"
                                  " status, created_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, ?, ?,"
                                  " ?, 0, ?, 'OPEN', ?)",
                                  (cid, str(name).strip(),
                                   institution_id, school_year,
                                   level, str(grade),
                                   str(section), str(turn),
                                   int(capacity),
                                   str(teacher_id), now))
                          return self.get(cid)

                      def _row(self, r) -> dict:
                          cap = int(r["capacity"])
                          enr = int(r["enrolled"])
                          return {"classroom_id":
                                      str(r["classroom_id"]),
                                  "name": str(r["name"]),
                                  "institution_id":
                                      str(r["institution_id"]),
                                  "school_year":
                                      str(r["school_year"]),
                                  "level": str(r["level"]),
                                  "grade": str(r["grade"]),
                                  "section": str(r["section"]),
                                  "turn": str(r["turn"]),
                                  "capacity": cap,
                                  "enrolled": enr,
                                  "cupos": cap - enr,
                                  "teacher_id":
                                      str(r["teacher_id"]),
                                  "status": str(r["status"])}

                      def get(self, classroom_id
                              ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_classrooms WHERE"
                              " classroom_id = ?",
                              (classroom_id,))
                          return self._row(row) if row else None

                      def claim_seat(self, classroom_id,
                                     student_id) -> dict:
                          with self._db.transaction() as cursor:
                              row = cursor.execute(
                                  "SELECT * FROM sm_classrooms"
                                  " WHERE classroom_id = ?",
                                  (classroom_id,)).fetchone()
                              if row is None:
                                  raise KeyError(classroom_id)
                              cap = int(row["capacity"])
                              enr = int(row["enrolled"])
                              if (str(row["status"])
                                      == "COMPLETADA"
                                      or enr >= cap):
                                  raise ValueError(
                                      "MATRICULA COMPLETADA: "
                                      + str(row["grade"])
                                      + " seccion "
                                      + str(row["section"])
                                      + " turno "
                                      + str(row["turn"])
                                      + " sin cupos")
                              cursor.execute(
                                  "UPDATE sm_classrooms SET"
                                  " enrolled = enrolled + 1 WHERE"
                                  " classroom_id = ?",
                                  (classroom_id,))
                              if enr + 1 >= cap:
                                  cursor.execute(
                                      "UPDATE sm_classrooms SET"
                                      " status = 'COMPLETADA'"
                                      " WHERE classroom_id = ?",
                                      (classroom_id,))
                          return self.get(classroom_id)

                      def release_seat(self, classroom_id) -> dict:
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "UPDATE sm_classrooms SET"
                                  " enrolled = CASE WHEN enrolled"
                                  " > 0 THEN enrolled - 1 ELSE 0"
                                  " END, status = 'OPEN' WHERE"
                                  " classroom_id = ?",
                                  (classroom_id,))
                          return self.get(classroom_id)

                      def available_sections(self, *,
                                             institution_id,
                                             school_year, level,
                                             grade) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT * FROM sm_classrooms WHERE"
                              " institution_id = ? AND"
                              " school_year = ? AND level = ? AND"
                              " grade = ? AND status = 'OPEN'"
                              " ORDER BY turn, section",
                              (institution_id, school_year,
                               level, str(grade)))
                          out = []
                          for r in rows:
                              d = self._row(r)
                              if d["cupos"] > 0:
                                  out.append(d)
                          return out

                      def set_teacher(self, classroom_id,
                                      teacher_id) -> dict:
                          self._db.execute(
                              "UPDATE sm_classrooms SET"
                              " teacher_id = ? WHERE"
                              " classroom_id = ?",
                              (str(teacher_id), classroom_id))
                          return self.get(classroom_id)

                      def by_teacher(self, teacher_id
                                     ) -> List[dict]:
                          rows = self._db.query_all(
                              "SELECT classroom_id FROM"
                              " sm_classrooms WHERE"
                              " teacher_id = ? ORDER BY"
                              " created_at", (teacher_id,))
                          return [self.get(
                              str(r["classroom_id"]))
                              for r in rows]
              '''))

              forzar(AC + "/enrollment_engine.py", D(r'''
                  """Enrollment Engine - matricula con control de
                  cupo (SM1)."""
                  from __future__ import annotations
                  from typing import List, Optional
                  import uuid
                  from shared_engines.common.clocks import Clock
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  ENR_STATUSES = ("ACTIVA", "RETIRADA",
                                  "TRASLADADA", "COMPLETADA")

                  _MIGRATIONS = (
                      Migration(1, "sm_enrollments", (
                          "CREATE TABLE IF NOT EXISTS sm_enrollments (enrollment_id TEXT PRIMARY KEY, student_id TEXT NOT NULL, classroom_id TEXT NOT NULL, institution_id TEXT NOT NULL, school_year TEXT NOT NULL, level TEXT NOT NULL, grade TEXT NOT NULL, turn TEXT NOT NULL DEFAULT 'MATUTINA', status TEXT NOT NULL DEFAULT 'ACTIVA', created_at REAL NOT NULL, updated_at REAL NOT NULL, UNIQUE(student_id, school_year))",
                      )),
                  )

                  class EnrollmentEngine:
                      """Matriculas con control de cupo."""

                      def __init__(self, db, clock,
                                   classroom_engine=None):
                          self._db = db
                          self._clock = clock
                          self._cls = classroom_engine
                          MigrationRunner(db, "sm.enroll",
                                          _MIGRATIONS).run(clock)

                      def enroll(self, *, student_id, classroom_id,
                                 school_year) -> dict:
                          room = (self._cls.get(classroom_id)
                                  if self._cls is not None
                                  else None)
                          if room is None:
                              raise KeyError(classroom_id)
                          eid = "SMENR-" + str(uuid.uuid4())
                          now = self._clock.now()
                          with self._db.transaction() as cursor:
                              dup = cursor.execute(
                                  "SELECT enrollment_id FROM"
                                  " sm_enrollments WHERE"
                                  " student_id = ? AND"
                                  " school_year = ?",
                                  (student_id,
                                   school_year)).fetchone()
                              if dup is not None:
                                  raise ValueError(
                                      "ya matriculado en "
                                      + school_year)
                          if self._cls is not None:
                              self._cls.claim_seat(classroom_id,
                                                   student_id)
                          with self._db.transaction() as cursor:
                              cursor.execute(
                                  "INSERT INTO sm_enrollments"
                                  " (enrollment_id, student_id,"
                                  " classroom_id, institution_id,"
                                  " school_year, level, grade,"
                                  " turn, status, created_at,"
                                  " updated_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?, ?, ?,"
                                  " 'ACTIVA', ?, ?)",
                                  (eid, student_id, classroom_id,
                                   room["institution_id"],
                                   school_year, room["level"],
                                   room["grade"], room["turn"],
                                   now, now))
                          return self.get(eid)

                      def get(self, enrollment_id
                              ) -> Optional[dict]:
                          row = self._db.query_one(
                              "SELECT * FROM sm_enrollments WHERE"
                              " enrollment_id = ?",
                              (enrollment_id,))
                          if not row:
                              return None
                          return {"enrollment_id":
                                      str(row["enrollment_id"]),
                                  "student_id":
                                      str(row["student_id"]),
                                  "classroom_id":
                                      str(row["classroom_id"]),
                                  "institution_id":
                                      str(row["institution_id"]),
                                  "school_year":
                                      str(row["school_year"]),
                                  "level": str(row["level"]),
                                  "grade": str(row["grade"]),
                                  "turn": str(row["turn"]),
                                  "status": str(row["status"])}

                      def withdraw(self, enrollment_id,
                                   status="RETIRADA") -> dict:
                          if status not in ENR_STATUSES:
                              raise ValueError("estado invalido")
                          e = self.get(enrollment_id)
                          if not e:
