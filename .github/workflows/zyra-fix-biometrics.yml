              assert r["all_matched"] is False
              items = {i["tax_type"]: i
                       for i in r["items"]}
              assert items["IVA"]["matched"] is True
              assert items["RENTA"]["difference"] == "-5.00"
              print("OK conciliacion fiscal: match + diferencia reportada")
