name: "ZYRA FIX v10: agro tests con biometria - cierre fase 1"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-fix-biometrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 0 - Dump: handlers de registro en AGRO server (diagnostico)"
        run: |
          python3 - <<'DUMPEOF'
          import re
          from pathlib import Path
          p = Path("apps/agro/server.py")
          if not p.exists():
              print("apps/agro/server.py NO EXISTE")
              raise SystemExit(0)
          t = p.read_text(encoding="utf-8", errors="ignore")
          print(f"===== apps/agro/server.py (total {len(t.splitlines())} lineas) =====")
          for key in ('/agro/register', '/agro/producers'):
              n = 0
              for m in re.finditer(re.escape(key), t):
                  if n >= 2:
                      break
                  i = m.start()
                  print(f"----- region '{key}' (ocurrencia {n+1}) -----")
                  print(t[max(0, i - 2200): i + 3200])
                  print("----- fin -----")
                  n += 1
          DUMPEOF

      - name: "Paso 1 - parche AGRO: doc+selfie en helpers de test (sin imports)"
        run: |
          python3 - <<'PATCHEOF'
          from pathlib import Path

          REPORT = []

          INJ_PRODUCERS = (
              '    if url.endswith("/agro/producers") and "doc_image_b64" not in doc:\n'
              '        doc = dict(doc)\n'
              '        doc["doc_image_b64"] = "zyra" * 16\n'
              '        doc["selfie_image_b64"] = "zyra" * 16\n'
          )
          INJ_REGISTER = (
              '    if url.endswith("/agro/register") and "doc_image_b64" not in doc:\n'
              '        doc = dict(doc)\n'
              '        doc["doc_image_b64"] = "zyra" * 16\n'
              '        doc["selfie_image_b64"] = "zyra" * 16\n'
          )

          def inject_after_sig(txt, def_marker, injection):
              if '"zyra" * 16' in txt:
                  return None
              idx = txt.find(def_marker)
              if idx < 0:
                  raise ValueError("no encontrado: " + def_marker)
              lines = txt.splitlines(keepends=True)
              count = 0
              start_line = None
              for i, l in enumerate(lines):
                  if count + len(l) > idx:
                      start_line = i
                      break
                  count += len(l)
              if start_line is None:
                  raise ValueError("inicio no calculado")
              j = start_line
              while j < len(lines) and not lines[j].rstrip().endswith(":"):
                  j += 1
              if j >= len(lines):
                  raise ValueError("firma sin cierre")
              lines.insert(j + 1, injection)
              return "".join(lines)

          def patch(name, path, def_marker, injection):
              p = Path(path)
              if not p.exists():
                  REPORT.append(f"MISS  {name} ({path} no existe)")
                  return
              txt = p.read_text(encoding="utf-8")
              try:
                  res = inject_after_sig(txt, def_marker, injection)
              except Exception as exc:
                  REPORT.append(f"MISS  {name} ({exc})")
                  return
              if res is None:
                  REPORT.append(f"SKIP  {name} (ya aplicado)")
                  return
              try:
                  compile(res, path, "exec")
              except SyntaxError as exc:
                  REPORT.append(f"FAIL  {name} (syntax linea {exc.lineno}: {exc.msg})")
                  return
              p.write_text(res, encoding="utf-8")
              REPORT.append(f"OK    {name}")

          patch("agro-aid-e2e", "apps/agro/tests/test_agro_aid_e2e.py",
                "def _post(url: str, doc: dict) -> dict:", INJ_PRODUCERS)
          patch("agro-n1", "apps/agro/tests/test_agro_n1.py",
                "def _post(", INJ_PRODUCERS)
          patch("agro-roles", "apps/agro/tests/test_agro_roles.py",
                "def _post(url, doc):", INJ_REGISTER)

          print("")
          print("======== REPORTE DE PARCHES ========")
          for r in REPORT:
              print(r)
          print("====================================")
          print("")
          print("======== VERIFICACION ========")
          for f in (
              "apps/agro/tests/test_agro_aid_e2e.py",
              "apps/agro/tests/test_agro_n1.py",
              "apps/agro/tests/test_agro_roles.py",
          ):
              p = Path(f)
              if p.exists():
                  t = p.read_text(encoding="utf-8")
                  print(f"{f}: zyra-x16 x{t.count(chr(34) + 'zyra' + chr(34) + ' * 16')}")
          PATCHEOF

      - name: "Paso 2 - AGRO SMOKE: offline (local sin ZID) + online (ZID real)"
        run: |
          python3 - <<'AGROEOF'
          import json
          import threading
          import time
          import urllib.error
          import urllib.request

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          from shared_engines.security.biometrics import (
              BiometricsEngine,
              BiometricsPolicy,
              DeterministicTestProvider,
              TemplateCipher,
          )
          from apps.agro.infrastructure.network.network_client import NetworkClient
          from apps.agro.infrastructure.persistence.agro_store import AgroStore
          from apps.agro.server import serve_agro

          IMG = "zyra" * 16

          def post_json(base, path, doc):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(doc).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:600].decode("utf-8", "replace")

          PAYLOAD = {
              "name": "Smoke Bio",
              "producer_type": "agricultor",
              "location": "Chalatenango",
              "doc_image_b64": IMG,
              "selfie_image_b64": IMG,
          }

          # --- OFFLINE: red muerta, se espera registro local sin ZID ---
          dead = NetworkClient("http://127.0.0.1:1", timeout_seconds=1.0, max_retries=0)
          db1 = SQLiteAdapter(":memory:")
          srv1 = serve_agro(AgroStore(db1, FrozenClock()), dead)
          threading.Thread(target=srv1.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base1 = f"http://127.0.0.1:{srv1.bound_port}"
          st, body = post_json(base1, "/agro/producers", PAYLOAD)
          print("OFFLINE /agro/producers ->", st)
          print("   cuerpo:", body[:400])

          # --- ONLINE: red con biometria, se espera ZID real ---
          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=net_db, clock=FrozenClock(), signer=signer,
              config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=net_db, clock=FrozenClock(), audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(net_db, FrozenClock(), identity=kernel.identity, signer=signer)
          net_srv = serve_combined(kernel, caps, host="127.0.0.1", port=0)
          threading.Thread(target=net_srv.serve_forever, daemon=True).start()
          time.sleep(0.4)
          net_base = f"http://127.0.0.1:{net_srv.server_address[1]}"

          db2 = SQLiteAdapter(":memory:")
          client = NetworkClient(net_base, max_retries=1)
          srv2 = serve_agro(AgroStore(db2, FrozenClock()), client)
          threading.Thread(target=srv2.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base2 = f"http://127.0.0.1:{srv2.bound_port}"
          st, body = post_json(base2, "/agro/producers", PAYLOAD)
          print("ONLINE /agro/producers ->", st)
          print("   cuerpo:", body[:500])

          print("AGRO SMOKE COMPLETADO")
          AGROEOF

      - name: "Paso 3 - GATE: pytest 4 apps (subastas + mpe + semilla + agro)"
        run: |
          python3 -m pytest apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests apps/agro/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA FIX v10: agro tests con biometria" -m "Tests AGRO envian doc+selfie (ley); inyeccion en helpers _post sin imports nuevos; smoke offline/online de registro agro; gate de 4 apps."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
