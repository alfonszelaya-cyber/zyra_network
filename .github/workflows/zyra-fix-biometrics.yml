name: "AGRO COMPLETE v2: super app por roles + areas vivas + ley"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 0 - Dump COMPLETO de apps/agro/server.py (respaldo)"
        run: |
          python3 - <<'DUMPEOF'
          from pathlib import Path
          p = Path("apps/agro/server.py")
          if not p.exists():
              print("apps/agro/server.py NO EXISTE")
              raise SystemExit(1)
          lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
          print(f"===== apps/agro/server.py ({len(lines)} lineas) =====")
          for i, l in enumerate(lines, 1):
              print(f"{i:4d}| {l}")
          DUMPEOF

      - name: "Paso 1 - servicios gobierno + 11 menus navegables"
        run: |
          python3 - <<'SVCEOF'
          import textwrap
          from pathlib import Path

          REPORT = []

          def ok(n):
              REPORT.append("OK    " + n)

          def skp(n):
              REPORT.append("SKIP  " + n)

          def miss(n, w):
              REPORT.append("MISS  " + n + " (" + w + ")")

          SVC_FOOD = textwrap.dedent('''
              """Seguridad alimentaria nacional para la vista
              Gobierno de AGRO. Lee del store; no modifica la
              logica de negocio del store."""
              from __future__ import annotations


              class FoodSecurityService:
                  def __init__(self, store) -> None:
                      self._store = store

                  def national_status(self) -> dict:
                      summary = self._store.summary()
                      by_product = dict(
                          summary.get("productions_by_product") or {}
                      )
                      products = []
                      for name, qty in sorted(by_product.items()):
                          products.append(
                              {
                                  "product": str(name),
                                  "quantity": float(qty or 0),
                                  "produced": float(qty or 0) > 0,
                              }
                          )
                      return {
                          "producers_total": int(
                              summary.get("producers_total") or 0
                          ),
                          "producers_verified": int(
                              summary.get("producers_verified") or 0
                          ),
                          "products": products,
                          "soberania_alimentaria": (
                              len(products) > 0
                          ),
                      }
          ''')

          SVC_AID = textwrap.dedent('''
              """Reporte de ayudas de gobierno: beneficiados y
              no beneficiados, para cerrar brechas de cobertura."""
              from __future__ import annotations


              class GovernmentAidService:
                  def __init__(self, store) -> None:
                      self._store = store

                  def beneficiaries_report(self) -> dict:
                      aid = list(self._store.list_aid())
                      producers = list(self._store.list_producers())
                      counts = {}
                      for a in aid:
                          pid = str(a.get("producer_id") or "")
                          if pid:
                              counts[pid] = counts.get(pid, 0) + 1
                      beneficiados = []
                      no_beneficiados = []
                      for p in producers:
                          pid = str(p.get("producer_id") or "")
                          row = {
                              "producer_id": pid,
                              "name": str(p.get("name") or ""),
                              "role": str(p.get("role") or ""),
                              "verified": bool(p.get("verified")),
                          }
                          if pid in counts:
                              row["aid_count"] = counts[pid]
                              beneficiados.append(row)
                          else:
                              no_beneficiados.append(row)
                      return {
                          "aid_total": len(aid),
                          "beneficiados": beneficiados,
                          "no_beneficiados": no_beneficiados,
                      }
          ''')

          SVC_REPORT = textwrap.dedent('''
              """Reporte consolidado de gobierno para AGRO."""
              from __future__ import annotations


              class GovernmentReport:
                  def __init__(self, store) -> None:
                      self._store = store

                  def consolidated(self) -> dict:
                      s = self._store.summary()
                      return {
                          "producers_total": int(
                              s.get("producers_total") or 0
                          ),
                          "producers_verified": int(
                              s.get("producers_verified") or 0
                          ),
                          "producers_by_role": dict(
                              s.get("producers_by_role") or {}
                          ),
                          "productions_by_product": dict(
                              s.get("productions_by_product") or {}
                          ),
                          "aid_total": int(s.get("aid_total") or 0),
                          "aid_by_status": dict(
                              s.get("aid_by_status") or {}
                          ),
                          "aid_by_program": dict(
                              s.get("aid_by_program") or {}
                          ),
                      }
          ''')

          SERVICES = {
              "apps/agro/modules/gobierno/seguridad_alimentaria/food_security_service.py":
                  ("class FoodSecurityService", "national_status", SVC_FOOD),
              "apps/agro/modules/gobierno/apoyos/government_aid_service.py":
                  ("class GovernmentAidService", "beneficiaries_report", SVC_AID),
              "apps/agro/modules/gobierno/reportes/government_report.py":
                  ("class GovernmentReport", "consolidated", SVC_REPORT),
          }

          for path, (cls_mark, fn_mark, content) in SERVICES.items():
              p = Path(path)
              if not p.exists():
                  miss(path, "no existe")
                  continue
              old = p.read_text(encoding="utf-8")
              if cls_mark in old and fn_mark in old:
                  skp(path + " (ya implementado)")
                  continue
              try:
                  compile(content, path, "exec")
              except SyntaxError as exc:
                  miss(path, "syntax " + str(exc.lineno))
                  continue
              p.write_text(content, encoding="utf-8")
              ok(path)

          MENUS = {
              "atencion_al_cliente": ("Atencion al Cliente", [
                  {"label": "Inicio", "path": "/agro"},
                  {"label": "Soporte del Gobierno", "path": "/agro/gobierno"},
              ]),
              "comercializacion": ("Comercializacion", [
                  {"label": "Mercado", "path": "/agro/mercado"},
                  {"label": "Resumen", "path": "/agro/gobierno"},
              ]),
              "ejecutivo": ("Ejecutivo", [
                  {"label": "Resumen general", "path": "/agro/gobierno"},
              ]),
              "gobierno": ("Gobierno", [
                  {"label": "Panel general", "path": "/agro/gobierno"},
                  {"label": "Seguridad alimentaria", "path": "/agro/gobierno/seguridad"},
                  {"label": "Beneficiados", "path": "/agro/gobierno/beneficiados"},
                  {"label": "Riesgos", "path": "/agro/gobierno/riesgos"},
              ]),
              "insumos_y_apoyos": ("Insumos y Apoyos", [
                  {"label": "Apoyos entregados", "path": "/agro/gobierno/beneficiados"},
              ]),
              "operaciones": ("Operaciones", [
                  {"label": "Produccion y operaciones", "path": "/agro/gobierno"},
              ]),
              "produccion": ("Produccion", [
                  {"label": "Produccion nacional", "path": "/agro/gobierno/seguridad"},
                  {"label": "Registrar cosecha", "path": "/agro"},
              ]),
              "productores": ("Productores", [
                  {"label": "Registro", "path": "/agro"},
                  {"label": "Padron", "path": "/agro/gobierno"},
              ]),
              "recursos_y_activos": ("Recursos y Activos", [
                  {"label": "Tierras y maquinaria", "path": "/agro/gobierno"},
              ]),
              "riesgo": ("Riesgo", [
                  {"label": "Riesgos abiertos", "path": "/agro/gobierno/riesgos"},
              ]),
              "seguridad": ("Seguridad", [
                  {"label": "Seguridad del sistema", "path": "/agro/gobierno"},
              ]),
          }

          for key, (title, items) in MENUS.items():
              path = "apps/agro/modules/" + key + "/menu.py"
              p = Path(path)
              if not p.exists():
                  miss(path, "no existe")
                  continue
              content = (
                  '"""AGRO - navegacion del modulo ' + key + '."""\n'
                  'MENU = {\n'
                  '    "key": "' + key + '",\n'
                  '    "title": "' + title + '",\n'
                  '    "items": ' + repr(items) + ',\n'
                  '}\n'
                  '\n'
                  '\n'
                  'def menu():\n'
                  '    return dict(MENU)\n'
              )
              try:
                  compile(content, path, "exec")
              except SyntaxError as exc:
                  miss(path, "syntax " + str(exc.lineno))
                  continue
              p.write_text(content, encoding="utf-8")
              ok(path + " (menu navegable)")

          print("")
          print("======== REPORTE SERVICIOS+MENUS ========")
          for r in REPORT:
              print(r)
          print("=========================================")
          SVCEOF

      - name: "Paso 2 - server: helpers + rutas areas/eventos + vistas por rol"
        run: |
          python3 - <<'SRVEOF'
          from pathlib import Path

          REPORT = []

          sp = Path("apps/agro/server.py")
          if not sp.exists():
              print("MISS server (no existe)")
              raise SystemExit(1)
          t = sp.read_text(encoding="utf-8")

          if "_ZYRA_AREAS_V2" in t:
              print("SKIP server (ya aplicado)")
              raise SystemExit(0)

          HELPERS = [
              "    def _ZYRA_AREAS_V2(self):\n",
              "        store = type(self).store\n",
              "        inst = getattr(type(self), \"_zyra_areas_inst\", None)\n",
              "        if inst is None:\n",
              "            from apps.agro.infrastructure.persistence.agro_area_store import (\n",
              "                AgroAreaStore,\n",
              "            )\n",
              "            inst = AgroAreaStore(store._db, store._clock)\n",
              "            type(self)._zyra_areas_inst = inst\n",
              "        return inst\n",
              "\n",
              "    def _ZYRA_EVENTS_V2(self):\n",
              "        inst = getattr(type(self), \"_zyra_events_inst\", None)\n",
              "        if inst is None:\n",
              "            from apps.agro.services.agro_events import (\n",
              "                AgroEventService,\n",
              "            )\n",
              "            inst = AgroEventService(\n",
              "                store=type(self).store,\n",
              "                link=type(self).link,\n",
              "            )\n",
              "            type(self)._zyra_events_inst = inst\n",
              "        return inst\n",
              "\n",
              "    def _ZYRA_PAYLOAD_V2(self, is_json):\n",
              "        if is_json:\n",
              "            return self._read_json()\n",
              "        return self._read_form()\n",
              "\n",
              "    def _ZYRA_MENUS_V2(self):\n",
              "        items = []\n",
              "        names = (\n",
              "            \"atencion_al_cliente\",\n",
              "            \"comercializacion\",\n",
              "            \"ejecutivo\",\n",
              "            \"gobierno\",\n",
              "            \"insumos_y_apoyos\",\n",
              "            \"operaciones\",\n",
              "            \"produccion\",\n",
              "            \"productores\",\n",
              "            \"recursos_y_activos\",\n",
              "            \"riesgo\",\n",
              "            \"seguridad\",\n",
              "        )\n",
              "        for name in names:\n",
              "            try:\n",
              "                mod = __import__(\n",
              "                    \"apps.agro.modules.\" + name + \".menu\",\n",
              "                    fromlist=[\"menu\"],\n",
              "                )\n",
              "                fn = getattr(mod, \"menu\", None)\n",
              "                if callable(fn):\n",
              "                    items.append(fn())\n",
              "            except Exception:\n",
              "                continue\n",
              "        return items\n",
              "\n",
          ]

          POST_ROUTES = [
              "        if s == [\"land\"]:\n",
              "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n",
              "            pid = self._req(doc, \"producer_id\")\n",
              "            row = self._ZYRA_AREAS_V2().add_land(\n",
              "                producer_id=pid,\n",
              "                location=self._req(doc, \"location\"),\n",
              "                size_hectares=float(doc.get(\"size_hectares\") or 0),\n",
              "                land_use=str(doc.get(\"land_use\") or \"\"),\n",
              "            )\n",
              "            self._ZYRA_EVENTS_V2().asset_registered(\n",
              "                producer_id=pid,\n",
              "                asset_type=\"tierra\",\n",
              "                detail=str(row[\"land_id\"]),\n",
              "            )\n",
              "            self._send(201, {\"ok\": True, \"data\": row})\n",
              "            return\n",
              "        if s == [\"machinery\"]:\n",
              "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n",
              "            pid = self._req(doc, \"producer_id\")\n",
              "            row = self._ZYRA_AREAS_V2().add_machinery(\n",
              "                producer_id=pid,\n",
              "                machine_type=self._req(doc, \"machine_type\"),\n",
              "                description=str(doc.get(\"description\") or \"\"),\n",
              "            )\n",
              "            self._ZYRA_EVENTS_V2().asset_registered(\n",
              "                producer_id=pid,\n",
              "                asset_type=\"maquinaria\",\n",
              "                detail=str(row[\"machine_id\"]),\n",
              "            )\n",
              "            self._send(201, {\"ok\": True, \"data\": row})\n",
              "            return\n",
              "        if s == [\"inventory\"]:\n",
              "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n",
              "            pid = self._req(doc, \"producer_id\")\n",
              "            row = self._ZYRA_AREAS_V2().add_inventory_item(\n",
              "                producer_id=pid,\n",
              "                item_name=self._req(doc, \"item_name\"),\n",
              "                quantity=float(doc.get(\"quantity\") or 0),\n",
              "                unit=str(doc.get(\"unit\") or \"\"),\n",
              "            )\n",
              "            self._ZYRA_EVENTS_V2().asset_registered(\n",
              "                producer_id=pid,\n",
              "                asset_type=\"inventario\",\n",
              "                detail=str(doc.get(\"item_name\", \"\")),\n",
              "            )\n",
              "            self._send(201, {\"ok\": True, \"data\": row})\n",
              "            return\n",
              "        if s == [\"water\"]:\n",
              "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n",
              "            pid = self._req(doc, \"producer_id\")\n",
              "            row = self._ZYRA_AREAS_V2().add_water_source(\n",
              "                producer_id=pid,\n",
              "                source_type=self._req(doc, \"source_type\"),\n",
              "                capacity_liters=float(doc.get(\"capacity_liters\") or 0),\n",
              "            )\n",
              "            self._ZYRA_EVENTS_V2().asset_registered(\n",
              "                producer_id=pid,\n",
              "                asset_type=\"agua\",\n",
              "                detail=str(doc.get(\"source_type\", \"\")),\n",
              "            )\n",
              "            self._send(201, {\"ok\": True, \"data\": row})\n",
              "            return\n",
              "        if s == [\"sale\"]:\n",
              "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n",
              "            pid = self._req(doc, \"producer_id\")\n",
              "            row = self._ZYRA_AREAS_V2().create_sale(\n",
              "                producer_id=pid,\n",
              "                buyer=self._req(doc, \"buyer\"),\n",
              "                product=self._req(doc, \"product\"),\n",
              "                quantity=float(doc.get(\"quantity\") or 0),\n",
              "                unit=str(doc.get(\"unit\") or \"\"),\n",
              "                price=float(doc.get(\"price\") or 0),\n",
              "            )\n",
              "            seq = self._ZYRA_EVENTS_V2().sale_created(\n",
              "                producer_id=pid,\n",
              "                sale_id=str(row[\"sale_id\"]),\n",
              "                detail=str(row.get(\"product\", \"\")),\n",
              "            )\n",
              "            out = dict(row)\n",
              "            out[\"network_seq\"] = seq\n",
              "            self._send(201, {\"ok\": True, \"data\": out})\n",
              "            return\n",
              "        if s == [\"sale\", \"complete\"]:\n",
              "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n",
              "            sid = self._req(doc, \"sale_id\")\n",
              "            row = self._ZYRA_AREAS_V2().complete_sale(sale_id=sid)\n",
              "            self._ZYRA_EVENTS_V2().sale_completed(\n",
              "                producer_id=str(row.get(\"producer_id\", \"\")),\n",
              "                sale_id=sid,\n",
              "            )\n",
              "            self._send(200, {\"ok\": True, \"data\": row})\n",
              "            return\n",
              "        if s == [\"risk\"]:\n",
              "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n",
              "            pid = self._req(doc, \"producer_id\")\n",
              "            row = self._ZYRA_AREAS_V2().report_risk(\n",
              "                producer_id=pid,\n",
              "                risk_type=self._req(doc, \"risk_type\"),\n",
              "                severity=str(doc.get(\"severity\") or \"media\"),\n",
              "                detail=str(doc.get(\"detail\") or \"\"),\n",
              "            )\n",
              "            self._ZYRA_EVENTS_V2().risk_detected(\n",
              "                producer_id=pid,\n",
              "                risk_type=str(row.get(\"risk_type\", \"\")),\n",
              "                detail=str(row.get(\"detail\", \"\")),\n",
              "            )\n",
              "            self._send(201, {\"ok\": True, \"data\": row})\n",
              "            return\n",
              "        if s == [\"risk\", \"resolve\"]:\n",
              "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n",
              "            row = self._ZYRA_AREAS_V2().resolve_risk(\n",
              "                risk_id=self._req(doc, \"risk_id\"),\n",
              "            )\n",
              "            self._send(200, {\"ok\": True, \"data\": row})\n",
              "            return\n",
          ]

          GET_ROUTES = [
              "        if s == [\"gobierno\", \"seguridad\"]:\n",
              "            from apps.agro.modules.gobierno.seguridad_alimentaria.food_security_service import (\n",
              "                FoodSecurityService,\n",
              "            )\n",
              "            st_data = FoodSecurityService(\n",
              "                type(self).store\n",
              "            ).national_status()\n",
              "            rows = \"\"\n",
              "            for x in st_data[\"products\"]:\n",
              "                rows = rows + \"<li>\" + x[\"product\"] + \": \" + str(x[\"quantity\"]) + \" producidas</li>\"\n",
              "            if not rows:\n",
              "                rows = \"<li>Sin produccion registrada</li>\"\n",
              "            body = (\n",
              "                \"<h1>Seguridad alimentaria</h1>\"\n",
              "                \"<p>Productores: \" + str(st_data[\"producers_total\"])\n",
              "                + \" - verificados: \" + str(st_data[\"producers_verified\"]) + \"</p>\"\n",
              "                \"<ul>\" + rows + \"</ul>\"\n",
              "                \"<a href='/agro/gobierno'><button>Volver</button></a>\"\n",
              "            )\n",
              "            self._html(200, _page(\"AGRO - Seguridad alimentaria\", body))\n",
              "            return\n",
              "        if s == [\"gobierno\", \"beneficiados\"]:\n",
              "            from apps.agro.modules.gobierno.apoyos.government_aid_service import (\n",
              "                GovernmentAidService,\n",
              "            )\n",
              "            rep = GovernmentAidService(\n",
              "                type(self).store\n",
              "            ).beneficiaries_report()\n",
              "            b = \"\"\n",
              "            for r in rep[\"beneficiados\"]:\n",
              "                b = b + \"<li>\" + r[\"name\"] + \" (\" + str(r[\"aid_count\"]) + \" ayudas)</li>\"\n",
              "            if not b:\n",
              "                b = \"<li>Ninguno aun</li>\"\n",
              "            nb = \"\"\n",
              "            for r in rep[\"no_beneficiados\"]:\n",
              "                nb = nb + \"<li>\" + r[\"name\"] + \" - sin ayudas (\" + r[\"role\"] + \")</li>\"\n",
              "            if not nb:\n",
              "                nb = \"<li>Todos beneficiados</li>\"\n",
              "            body = (\n",
              "                \"<h1>Ayudas: beneficiados y pendientes</h1>\"\n",
              "                \"<p>Total ayudas: \" + str(rep[\"aid_total\"]) + \"</p>\"\n",
              "                \"<h2>Beneficiados</h2><ul>\" + b + \"</ul>\"\n",
              "                \"<h2>No beneficiados (a quienes ayudar)</h2><ul>\" + nb + \"</ul>\"\n",
              "                \"<a href='/agro/gobierno'><button>Volver</button></a>\"\n",
              "            )\n",
              "            self._html(200, _page(\"AGRO - Beneficiarios\", body))\n",
              "            return\n",
              "        if s == [\"gobierno\", \"riesgos\"]:\n",
              "            areas = self._ZYRA_AREAS_V2()\n",
              "            rows = \"\"\n",
              "            for p in type(self).store.list_producers():\n",
              "                for r in areas.open_risks(\n",
              "                    producer_id=str(p.get(\"producer_id\"))\n",
              "                ):\n",
              "                    rows = rows + \"<li>\" + str(p.get(\"name\")) + \": \" + str(r.get(\"risk_type\")) + \" (\" + str(r.get(\"severity\")) + \")</li>\"\n",
              "            if not rows:\n",
              "                rows = \"<li>Sin riesgos abiertos</li>\"\n",
              "            body = (\n",
              "                \"<h1>Riesgos abiertos</h1>\"\n",
              "                \"<ul>\" + rows + \"</ul>\"\n",
              "                \"<a href='/agro/gobierno'><button>Volver</button></a>\"\n",
              "            )\n",
              "            self._html(200, _page(\"AGRO - Riesgos\", body))\n",
              "            return\n",
              "        if s == [\"mercado\"]:\n",
              "            prods = type(self).store.list_productions()\n",
              "            rows = \"\"\n",
              "            for p in prods:\n",
              "                rows = rows + \"<li>\" + str(p.get(\"product\")) + \" - \" + str(p.get(\"quantity\")) + \" \" + str(p.get(\"unit\")) + \"</li>\"\n",
              "            if not rows:\n",
              "                rows = \"<li>Sin produccion disponible</li>\"\n",
              "            body = (\n",
              "                \"<h1>Mercado AGRO</h1>\"\n",
              "                \"<h2>Produccion disponible</h2><ul>\" + rows + \"</ul>\"\n",
              "                \"<h2>Comprar / exportar</h2>\"\n",
              "                \"<p>Registre su empresa en la Red (ZID de organizacion) y contacte al productor.</p>\"\n",
              "                \"<a href='/agro'><button>Inicio</button></a>\"\n",
              "            )\n",
              "            self._html(200, _page(\"AGRO - Mercado\", body))\n",
              "            return\n",
              "        if len(s) == 2 and s[0] == \"areas\":\n",
              "            a = self._ZYRA_AREAS_V2()\n",
              "            self._send(200, {\"ok\": True, \"data\": {\n",
              "                \"lands\": a.lands_of(producer_id=s[1]),\n",
              "                \"sales\": a.sales_of(producer_id=s[1]),\n",
              "                \"risks\": a.open_risks(producer_id=s[1]),\n",
              "                \"machinery\": a.machinery_of(producer_id=s[1]),\n",
              "                \"inventory\": a.inventory_of(producer_id=s[1]),\n",
              "                \"water\": a.water_sources_of(producer_id=s[1]),\n",
              "            }})\n",
              "            return\n",
          ]

          def replace_method(txt, name, new_lines):
              marker = "    def " + name + "("
              start = txt.find(marker)
              if start < 0:
                  raise ValueError("metodo no encontrado: " + name)
              after = txt[start:]
              nl = after.find("\n")
              pos = nl + 1 if nl >= 0 else len(after)
              end = len(after)
              while pos < len(after):
                  eol = after.find("\n", pos)
                  if eol < 0:
                      eol = len(after)
                  line = after[pos:eol]
                  if (
                      line.startswith("    def ")
                      or line.startswith("class ")
                      or line.startswith("def ")
                  ):
                      end = pos
                      break
                  pos = eol + 1
              return txt[:start] + "".join(new_lines) + txt[start + end:]

