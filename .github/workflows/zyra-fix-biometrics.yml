name: ZYRA LABORATORIO - Lote 7Ac (Fase 7 - conteo de piezas del bundle corregido)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar y aplicar lote (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_7a.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          reemplazar_verificado() {
            ruta="$1"; firma="$2"
            if [ ! -s "$ruta" ]; then
              echo "FALLO: $ruta no existe para reemplazo verificado"; exit 1
            fi
            if ! grep -qF "$firma" "$ruta"; then
              echo "FALLO: firma ausente en $ruta (contenido inesperado, NO se toca)"; exit 1
            fi
            cat > "$ruta"
            echo "REEMPLAZADO-VERIFICADO: $ruta"
            echo "$ruta|REEMPLAZADO" >> "$MANIFEST"
          }
          mkdir -p apps/laboratorio/domain apps/laboratorio/infrastructure/persistence apps/laboratorio/infrastructure/repositories apps/laboratorio/application/use_cases apps/laboratorio/application/handlers apps/laboratorio/application/workflows apps/laboratorio/routers/api apps/laboratorio/modules apps/laboratorio/services/export apps/laboratorio/templates/dashboards
          echo "=== ANCLAS: app.py y service_registry.py ==="
          python3 - << 'PYANCHOR'
          from pathlib import Path
          p = Path("apps/laboratorio/infrastructure/api/app.py")
          codigo = p.read_text(encoding="utf-8")
          ancla1 = "from apps.laboratorio.routers.public.health import registrar_rutas as registrar_salud"
          ancla2 = "registrar_salud(app)"
          assert ancla1 in codigo and ancla2 in codigo, "anclas ausentes en app.py"
          cambios = []
          if "conectar_presentacion(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.presentation_module import conectar as conectar_presentacion")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_presentacion(app)")
              cambios.append("presentation")
          if "conectar_export(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.export_module import conectar as conectar_export")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_export(app)")
              cambios.append("export")
          p.write_text(codigo, encoding="utf-8")
          print("app.py:", ", ".join(cambios) if cambios else "ya estaba")
          p2 = Path("apps/laboratorio/registry/services/service_registry.py")
          c2 = p2.read_text(encoding="utf-8")
          a_imp = "from apps.laboratorio.application.handlers.render_handler import ManejadorRenders"
          assert a_imp in c2, "ancla import ausente en service_registry.py"
          if "manejador_presentaciones" not in c2:
              nuevos_imp = (
                  "from apps.laboratorio.application.handlers.presentation_handler import ManejadorPresentaciones\n"
                  "from apps.laboratorio.application.handlers.export_handler import ManejadorExportaciones\n"
                  "from apps.laboratorio.application.use_cases.build_presentation import (\n"
                  "    CasoCrearPresentacion,\n"
                  "    CasoReproducirPresentacion,\n"
                  "    CasoSellarPresentacion,\n"
                  ")\n"
                  "from apps.laboratorio.application.use_cases.export_deliverables import CasoExportarBundle\n"
                  "from apps.laboratorio.infrastructure.persistence.presentation_store import PresentationStore\n"
                  "from apps.laboratorio.infrastructure.persistence.export_store import ExportStore\n"
                  "from apps.laboratorio.infrastructure.repositories.presentation_repository import PresentationRepository\n"
                  "from apps.laboratorio.infrastructure.repositories.export_repository import ExportRepository\n"
              )
              c2 = c2.replace(a_imp, nuevos_imp + a_imp)
              a_reg = '    c.obtener("suscriptor_zyra")'
              assert a_reg in c2, "ancla registro ausente"
              nuevos_reg = (
                  '    c.registrar("presentation_store", lambda _c: PresentationStore(conexion))\n'
                  '    c.registrar("export_store", lambda _c: ExportStore(conexion))\n'
                  '    c.registrar("repo_presentaciones", lambda _c: PresentationRepository(_c.obtener("presentation_store")))\n'
                  '    c.registrar("repo_exportaciones", lambda _c: ExportRepository(_c.obtener("export_store")))\n'
                  '    c.registrar("caso_crear_presentacion", lambda _c: CasoCrearPresentacion(_c.obtener("repo_presentaciones"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_reproducir", lambda _c: CasoReproducirPresentacion(_c.obtener("repo_presentaciones"), _c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_sellar_presentacion", lambda _c: CasoSellarPresentacion(_c.obtener("repo_presentaciones"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("bus"), _c.obtener("outbox"), _c.obtener("cliente_zyra"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_exportar_bundle", lambda _c: CasoExportarBundle(_c.obtener("repo_exportaciones"), _c.obtener("repo_proyectos"), _c.obtener("repo_escenas"), _c.obtener("repo_artefactos"), _c.obtener("repo_evaluaciones"), _c.obtener("repo_presentaciones"), _c.obtener("repo_historial"), _c.obtener("outbox"), _c.obtener("cliente_zyra"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_presentaciones", lambda _c: ManejadorPresentaciones(_c.obtener("caso_crear_presentacion"), _c.obtener("caso_reproducir"), _c.obtener("caso_sellar_presentacion"), _c.obtener("repo_presentaciones"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_exportaciones", lambda _c: ManejadorExportaciones(_c.obtener("caso_exportar_bundle"), _c.obtener("repo_exportaciones"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
              )
              c2 = c2.replace(a_reg, nuevos_reg + a_reg)
              p2.write_text(c2, encoding="utf-8")
              print("service_registry.py ACTUALIZADO: 9 servicios de Fase 7")
          else:
              print("service_registry.py: ya contenia Fase 7")
          PYANCHOR
          echo "apps/laboratorio/infrastructure/api/app.py|ACTUALIZADO" >> "$MANIFEST"
          echo "apps/laboratorio/registry/services/service_registry.py|ACTUALIZADO" >> "$MANIFEST"
          echo "=== DOMINIO PRESENTACION + EXPORT ==="
          escribir apps/laboratorio/domain/presentation.py << 'ZYRA_EOF'
          """Presentacion espacial: pasos reales sobre escenas del proyecto.

          Cada paso ancla una escena real (validada), con duracion,
          transicion y texto de narracion. El sello conecta con ZYRA via
          el outbox existente (nada se duplica).
          """
          from dataclasses import dataclass, field

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          TRANSICIONES = ("corte", "desvanecer", "deslizar", "zoom")
          MAX_PASOS = 60
          MIN_DURACION = 1.0
          MAX_DURACION = 300.0


          @dataclass
          class Presentacion(EntidadBase):
              """Presentacion estructurada de un proyecto."""

              prefijo_id = "prs"

              proyecto_id: Identificador = None
              titulo: str = ""
              pasos: list = field(default_factory=list)
              sellada: bool = False
              sello_zid: str = ""
              duracion_total: float = 0.0

              def __post_init__(self):
                  if self.proyecto_id is None:
                      raise ValueError("La presentacion requiere su proyecto.")
                  if not self.titulo.strip():
                      raise ValueError("La presentacion requiere titulo.")
                  self.titulo = self.titulo.strip()

              def agregar_paso(self, escena_id, duracion: float, transicion: str, narracion: str = "") -> dict:
                  """Agrega un paso validado con escena real."""
                  escena_texto = str(escena_id).strip()
                  if not escena_texto:
                      raise ValueError("El paso requiere la escena del proyecto.")
                  duracion = float(duracion)
                  if not (MIN_DURACION <= duracion <= MAX_DURACION):
                      raise ValueError(
                          "duracion fuera de rango 1-300: " + str(duracion)
                      )
                  transicion = str(transicion).strip().lower()
                  if transicion not in TRANSICIONES:
                      raise ValueError(
                          "Transicion invalida: " + repr(transicion)
                          + ". Validas: " + ", ".join(TRANSICIONES)
                      )
                  if len(self.pasos) >= MAX_PASOS:
                      raise ValueError("Maximo " + str(MAX_PASOS) + " pasos.")
                  if self.sellada:
                      raise ValueError("La presentacion ya esta sellada: no se puede modificar.")
                  paso = {
                      "escena_id": escena_texto,
                      "duracion_s": round(duracion, 3),
                      "transicion": transicion,
                      "narracion": str(narracion or "").strip()[:300],
                  }
                  self.pasos.append(paso)
                  self.duracion_total = round(
                      sum(p["duracion_s"] for p in self.pasos), 3
                  )
                  self.marcar_actualizacion()
                  return paso

              def marcar_sellada(self, zid: str) -> None:
                  """Sella la presentacion con el ZID del actor."""
                  if self.sellada:
                      raise ValueError("La presentacion ya esta sellada.")
                  if not zid or not str(zid).strip():
                      raise ValueError("Sellar exige el ZID del actor.")
                  self.sellada = True
                  self.sello_zid = str(zid).strip()
                  self.marcar_actualizacion()
          ZYRA_EOF
          escribir apps/laboratorio/domain/export_bundle.py << 'ZYRA_EOF'
          """Exportacion: bundle verificable del proyecto (ZIP + manifiesto).

          El manifiesto lista cada pieza con su hash SHA-256 real; el ZIP
          se produce con stdlib zipfile. El envio a otra app ZYRA pasa por
          el outbox existente.
          """
          from dataclasses import dataclass, field

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          TIPOS_EXPORT = ("bundle_verificable", "envio_zyra")
          DESTINOS_ZYRA = (
              "nexo", "agro", "semilla", "mpe", "axis", "subastas",
              "ciclo", "govdata", "superapp",
          )


          @dataclass
          class Exportacion(EntidadBase):
              """Exportacion terminada del proyecto."""

              prefijo_id = "exp"

              proyecto_id: Identificador = None
              tipo: str = "bundle_verificable"
              destino: str = ""
              piezas: list = field(default_factory=list)
              tamano_total: int = 0
              hash_sha256: str = ""

              def __post_init__(self):
                  if self.proyecto_id is None:
                      raise ValueError("La exportacion requiere su proyecto.")
                  if self.tipo not in TIPOS_EXPORT:
                      raise ValueError(
                          "Tipo de exportacion invalido: " + repr(self.tipo)
                          + ". Validos: " + ", ".join(TIPOS_EXPORT)
                      )
                  if self.tipo == "envio_zyra":
                      destino = str(self.destino or "").strip().lower()
                      if destino not in DESTINOS_ZYRA:
                          raise ValueError(
                              "Destino ZYRA invalido: " + repr(self.destino)
                              + ". Validos: " + ", ".join(DESTINOS_ZYRA)
                          )
                      self.destino = destino
                  if not self.piezas:
                      raise ValueError("Una exportacion sin piezas no es valida.")

              @property
              def es_envio(self) -> bool:
                  return self.tipo == "envio_zyra"
          ZYRA_EOF
          echo "=== BASE DE DATOS V7 (reemplazos verificados) ==="
          reemplazar_verificado apps/laboratorio/infrastructure/database/tables.py "CREATE TABLE IF NOT EXISTS lab_projects (" << 'ZYRA_EOF'
          """Esquema oficial de LABORATORIO: v1 a v7 (nucleo a fase 7)."""
          ESQUEMA_V1 = """
          CREATE TABLE IF NOT EXISTS lab_schema_version (
              version INTEGER NOT NULL,
              aplicada_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_projects (
              id TEXT PRIMARY KEY,
              titulo TEXT NOT NULL,
              descripcion TEXT NOT NULL DEFAULT '',
              tipo TEXT NOT NULL,
              etapa TEXT NOT NULL,
              estado TEXT NOT NULL,
              propietario_zid TEXT NOT NULL,
              etiquetas TEXT NOT NULL DEFAULT '[]',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_scenarios (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              tipo TEXT NOT NULL,
              titulo TEXT NOT NULL,
              descripcion TEXT NOT NULL DEFAULT '',
              parametros TEXT NOT NULL DEFAULT '{}',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_evaluations (
              id TEXT PRIMARY KEY,
              escenario_id TEXT NOT NULL REFERENCES lab_scenarios(id) ON DELETE CASCADE,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              metricas TEXT NOT NULL DEFAULT '{}',
              nota TEXT NOT NULL DEFAULT '',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_history (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              autor_zid TEXT NOT NULL,
              accion TEXT NOT NULL,
              detalle TEXT NOT NULL DEFAULT '{}',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_audit (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              momento TEXT NOT NULL,
              actor_zid TEXT NOT NULL,
              accion TEXT NOT NULL,
              recurso TEXT NOT NULL,
              resultado TEXT NOT NULL,
              detalle TEXT NOT NULL DEFAULT '{}'
          );
          CREATE TABLE IF NOT EXISTS lab_outbox (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              evento TEXT NOT NULL,
              destino TEXT NOT NULL DEFAULT '',
              carga TEXT NOT NULL DEFAULT '{}',
              intentos INTEGER NOT NULL DEFAULT 0,
              estado TEXT NOT NULL DEFAULT 'pendiente',
              ultimo_error TEXT NOT NULL DEFAULT '',
              creado_en TEXT NOT NULL,
              enviado_en TEXT
          );
          CREATE INDEX IF NOT EXISTS idx_projects_propietario ON lab_projects(propietario_zid);
          CREATE INDEX IF NOT EXISTS idx_scenarios_proyecto ON lab_scenarios(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_evaluations_escenario ON lab_evaluations(escenario_id);
          CREATE INDEX IF NOT EXISTS idx_evaluations_proyecto ON lab_evaluations(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_history_proyecto ON lab_history(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_audit_momento ON lab_audit(momento);
          """

          ESQUEMA_V2 = """
          CREATE TABLE IF NOT EXISTS lab_inputs (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              tipo TEXT NOT NULL,
              titulo TEXT NOT NULL,
              contenido TEXT NOT NULL DEFAULT '',
              hash TEXT NOT NULL DEFAULT '',
              tamano INTEGER NOT NULL DEFAULT 0,
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_understandings (
              id TEXT PRIMARY KEY,
              entrada_id TEXT NOT NULL REFERENCES lab_inputs(id) ON DELETE CASCADE,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              resumen TEXT NOT NULL DEFAULT '',
              hallazgos TEXT NOT NULL DEFAULT '[]',
              entidades TEXT NOT NULL DEFAULT '{}',
              dominio TEXT NOT NULL DEFAULT '',
              confianza REAL NOT NULL DEFAULT 0.0,
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_designs (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              nombre TEXT NOT NULL,
              tipo TEXT NOT NULL,
              componentes TEXT NOT NULL DEFAULT '[]',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE INDEX IF NOT EXISTS idx_inputs_proyecto ON lab_inputs(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_understandings_entrada ON lab_understandings(entrada_id);
          CREATE INDEX IF NOT EXISTS idx_designs_proyecto ON lab_designs(proyecto_id);
          """

          ESQUEMA_V3 = """
          CREATE TABLE IF NOT EXISTS lab_scenes (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              nombre TEXT NOT NULL,
              ancho INTEGER NOT NULL,
              alto INTEGER NOT NULL,
              objetos TEXT NOT NULL DEFAULT '[]',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_artifacts (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              escena_id TEXT NOT NULL REFERENCES lab_scenes(id) ON DELETE CASCADE,
              nombre TEXT NOT NULL,
              formato TEXT NOT NULL,
              contenido TEXT NOT NULL DEFAULT '',
              hash TEXT NOT NULL DEFAULT '',
              tamano INTEGER NOT NULL DEFAULT 0,
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_assets (
              id TEXT PRIMARY KEY,
              propietario_zid TEXT NOT NULL,
              nombre TEXT NOT NULL,
              tipo TEXT NOT NULL,
              contenido TEXT NOT NULL DEFAULT '',
              hash TEXT NOT NULL DEFAULT '',
              tamano INTEGER NOT NULL DEFAULT 0,
              etiquetas TEXT NOT NULL DEFAULT '[]',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE INDEX IF NOT EXISTS idx_scenes_proyecto ON lab_scenes(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_artifacts_proyecto ON lab_artifacts(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_artifacts_escena ON lab_artifacts(escena_id);
          CREATE INDEX IF NOT EXISTS idx_assets_propietario ON lab_assets(propietario_zid);
          """

          ESQUEMA_V4 = """
          CREATE TABLE IF NOT EXISTS lab_timelines (
              id TEXT PRIMARY KEY,
              escena_id TEXT NOT NULL UNIQUE REFERENCES lab_scenes(id) ON DELETE CASCADE,
              duracion REAL NOT NULL,
              fps INTEGER NOT NULL,
              pistas TEXT NOT NULL DEFAULT '[]',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_lightprograms (
              id TEXT PRIMARY KEY,
              escena_id TEXT NOT NULL UNIQUE REFERENCES lab_scenes(id) ON DELETE CASCADE,
              pasos TEXT NOT NULL DEFAULT '[]',
              ambientar INTEGER NOT NULL DEFAULT 0,
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_interactions (
              id TEXT PRIMARY KEY,
              escena_id TEXT NOT NULL REFERENCES lab_scenes(id) ON DELETE CASCADE,
              x REAL NOT NULL,
              y REAL NOT NULL,
              w REAL NOT NULL,
              h REAL NOT NULL,
              accion TEXT NOT NULL,
              titulo TEXT NOT NULL,
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE INDEX IF NOT EXISTS idx_interactions_escena ON lab_interactions(escena_id);
          """

          ESQUEMA_V5 = """
          CREATE TABLE IF NOT EXISTS lab_simulations (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              escenario_id TEXT NOT NULL REFERENCES lab_scenarios(id) ON DELETE CASCADE,
              horizonte INTEGER NOT NULL,
              crecimiento REAL NOT NULL,
              serie TEXT NOT NULL DEFAULT '[]',
              metricas TEXT NOT NULL DEFAULT '{}',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_comparisons (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              participantes TEXT NOT NULL DEFAULT '[]',
              ganador TEXT NOT NULL DEFAULT '',
              brecha REAL NOT NULL DEFAULT 0.0,
              detalle TEXT NOT NULL DEFAULT '{}',
              informe TEXT NOT NULL DEFAULT '',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_optimizations (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              escenario_id TEXT NOT NULL REFERENCES lab_scenarios(id) ON DELETE CASCADE,
              recomendaciones TEXT NOT NULL DEFAULT '[]',
              parametros_optimizados TEXT NOT NULL DEFAULT '{}',
              puntaje_actual REAL NOT NULL DEFAULT 0.0,
              puntaje_proyectado REAL NOT NULL DEFAULT 0.0,
              estado TEXT NOT NULL DEFAULT 'sugerida',
              aplicado_como TEXT NOT NULL DEFAULT '',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE INDEX IF NOT EXISTS idx_simulations_proyecto ON lab_simulations(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_comparisons_proyecto ON lab_comparisons(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_optimizations_proyecto ON lab_optimizations(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_optimizations_escenario ON lab_optimizations(escenario_id);
          """

          ESQUEMA_V6 = """
          CREATE TABLE IF NOT EXISTS lab_renders (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              escena_id TEXT NOT NULL REFERENCES lab_scenes(id) ON DELETE CASCADE,
              calidad TEXT NOT NULL,
              formato TEXT NOT NULL,
              ancho INTEGER NOT NULL,
              alto INTEGER NOT NULL,
              imagen BLOB NOT NULL,
              profundidad BLOB,
              hash TEXT NOT NULL DEFAULT '',
              duracion_ms REAL NOT NULL DEFAULT 0.0,
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE INDEX IF NOT EXISTS idx_renders_proyecto ON lab_renders(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_renders_escena ON lab_renders(escena_id);
          """

          ESQUEMA_V7 = """
          CREATE TABLE IF NOT EXISTS lab_presentations (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              titulo TEXT NOT NULL,
              pasos TEXT NOT NULL DEFAULT '[]',
              sellada INTEGER NOT NULL DEFAULT 0,
              sello_zid TEXT NOT NULL DEFAULT '',
              duracion_total REAL NOT NULL DEFAULT 0.0,
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_exports (
              id TEXT PRIMARY KEY,
              proyecto_id TEXT NOT NULL REFERENCES lab_projects(id) ON DELETE CASCADE,
              tipo TEXT NOT NULL,
              destino TEXT NOT NULL DEFAULT '',
              piezas TEXT NOT NULL DEFAULT '[]',
              tamano_total INTEGER NOT NULL DEFAULT 0,
              hash TEXT NOT NULL DEFAULT '',
              creado_en TEXT NOT NULL,
              actualizado_en TEXT NOT NULL
          );
          CREATE INDEX IF NOT EXISTS idx_presentations_proyecto ON lab_presentations(proyecto_id);
          CREATE INDEX IF NOT EXISTS idx_exports_proyecto ON lab_exports(proyecto_id);
          """

          MIGRACIONES_SQL = {1: ESQUEMA_V1, 2: ESQUEMA_V2, 3: ESQUEMA_V3, 4: ESQUEMA_V4,
                             5: ESQUEMA_V5, 6: ESQUEMA_V6, 7: ESQUEMA_V7}

          TABLAS_ESPERADAS = (
              "lab_projects", "lab_scenarios", "lab_evaluations",
              "lab_history", "lab_audit", "lab_outbox", "lab_schema_version",
              "lab_inputs", "lab_understandings", "lab_designs",
              "lab_scenes", "lab_artifacts", "lab_assets",
              "lab_timelines", "lab_lightprograms", "lab_interactions",
              "lab_simulations", "lab_comparisons", "lab_optimizations",
              "lab_renders", "lab_presentations", "lab_exports",
          )


          def tablas_existentes(conexion) -> tuple:
              filas = conexion.consultar(
