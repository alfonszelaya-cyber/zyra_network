              sid = ref["escena"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/lighting", {
                  "pasos": [
                      {"t": 0, "color": "#22D3EE", "intensidad": 0.8},
                      {"t": 5, "color": "#F59E0B", "intensidad": 0.5},
