name: ZYRA RUM 1 - Gate superapp + extraccion motores (automatica)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Gate superapp + extraccion del paquete final
        run: |
          python - <<'PY'
          import ast, os, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append
          A("# 🚦 RUM 1 — Gate superapp + paquete final de laboratorio\n")

          A("## superapp.py")
          sup = Path("superapp.py")
          if not sup.is_file():
              A("- ❌ NO EXISTE superapp.py en la raiz")
          else:
              t = sup.read_text(encoding="utf-8", errors="replace")
              try:
                  ast.parse(t)
                  A("- sintaxis: OK")
              except SyntaxError as e:
                  A("- sintaxis: FALLO " + str(e))
              A("- nexo roto (_ng_start_nexo_base): " + ("PRESENTE ❌" if "_ng_start_nexo_base" in t else "ELIMINADO ✅"))
              A("- laboratorio cableado: " + ("SI ✅" if "_start_laboratorio" in t else "NO ❌"))
          A("")

          A("## app.py (informativo)")
          app_p = Path("apps/laboratorio/infrastructure/api/app.py")
          if app_p.is_file():
              ta = app_p.read_text(encoding="utf-8", errors="replace")
              A("- construir_servidor presente: " + ("SI" if "construir_servidor" in ta else "NO (superapp no lo necesita)"))
          A("")

          A("## Boot real de la SuperApp (8 apps)")
          A("```")
          try:
              import importlib
              sup_mod = importlib.import_module("superapp")
              errores = sup_mod.boot_apps()
              A("apps arriba: " + str(sorted(sup_mod.APPS.keys())))
              A("errores: " + str(errores if errores else "(ninguno)"))
          except Exception:
              A("FALLO:")
              A(traceback.format_exc()[-1500:])
          A("```")
          A("")

          A("# 📦 Paquete final: motores + handlers + use cases\n")
          total = 0
          for titulo, carpeta in (
              ("PROVEEDORES", Path("apps/laboratorio/infrastructure/providers")),
              ("HANDLERS", Path("apps/laboratorio/application/handlers")),
              ("USE_CASES", Path("apps/laboratorio/application/use_cases")),
          ):
              A("## " + titulo)
              for p in sorted(carpeta.glob("*.py")):
                  tt = p.read_text(encoding="utf-8", errors="replace")
                  total += len(tt)
                  A("### 📄 " + str(p))
                  A("```python")
                  A(tt)
                  A("```")
              A("")
          A("Total caracteres: " + str(total))

          md = "\n".join(L)
          Path("rum1_gate.md").write_text(md, encoding="utf-8")
          if summary:
              salida = md
              if len(salida) > 900000:
                  salida = salida[:900000] + "\n\n**(RECORTE — completo en el artefacto)**\n"
              with open(summary, "a") as fh:
                  fh.write(salida)
          print("gate listo: " + str(len(md)) + " chars")
          PY

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rum1-gate
          path: rum1_gate.md
