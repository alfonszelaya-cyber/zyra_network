name: "AXIS AX-1 fix: mismo bytes doc/selfie en el test (422 -> aprobado)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - patch test: doc y selfie con los mismos bytes"
        run: |
          python3 - <<'FIXEOF'
          from pathlib import Path
          p = Path(
              "apps/axis/tests/test_axis.py")
          t = p.read_text(encoding="utf-8")
          n = 0
          for viejo in (
              'b"axis-madre-doc"',
              'b"axis-madre-selfie"',
              'b"axis-bebe-doc"',
              'b"axis-bebe-selfie"',
          ):
              if viejo in t:
                  t = t.replace(
                      viejo,
                      'b"axis-bio-seed"')
                  n += 1
          if n == 0:
              print("SKIP ya aplicado")
              raise SystemExit(0)
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert escrito.count(
              'b"axis-bio-seed"') >= 4
          print("OK", n, "reemplazos:"
                " doc y selfie usan los mismos"
                " bytes (score 1.0 -> aprobado)")
          FIXEOF

      - name: "Paso 2 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AXIS AX-1 fix: semilla bio unica en test online" -m "El motor biometrico compara documento vs selfie: bytes distintos -> 422 biometrics_gate (la puerta funciona). El test usaba bytes distintos; ahora usa los mismos para doc y selfie (score 1.0 -> aprobado), igual que todos los tests que pasan."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
