name: ZYRA Security Chain

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base dependencies
        run: pip install cryptography pytest

      - name: 1/5 Biometrics engine tests
        run: python -m shared_engines.security.biometrics -v

      - name: 2/5 Runtime existing tests (biometrics off)
        run: python -m pytest shared_engines/runtime/tests -q

      - name: 3/5 Native wiring smoke (router + api + kernel)
        run: |
          python - <<'PYEOF'
          import os, tempfile
          from pathlib import Path

          from shared_engines.common.clocks import SystemClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.api import ZyraApiHandler
          from shared_engines.runtime.combined_api import CORE_PREFIXES
          from shared_engines.authority.root import PersistentRootAuthority
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.security.biometrics import ProviderError

          KEY = "ab" * 32

          assert "proofing" in CORE_PREFIXES, (
              "router missing proofing prefix"
          )
          assert hasattr(
              ZyraApiHandler, "_handle_proofing_submit"
          ), "api missing proofing routes"

          with tempfile.TemporaryDirectory() as tmp:
              authority = PersistentRootAuthority(
                  data_dir=Path(tmp),
                  master_key_hex=KEY,
              )
              signer, _status = authority.load_or_create()
              db = SQLiteAdapter(
                  os.path.join(tmp, "chain.db")
              )
              kernel = ZyraKernel(
                  db=db,
                  clock=SystemClock(),
                  signer=signer,
                  config=RuntimeConfig(
                      host="127.0.0.1", port=0
                  ),
                  master_key_hex=KEY,
              )
              assert kernel.biometrics is not None, (
                  "biometrics engine not wired"
              )
              components = [
                  c.component
                  for c in kernel.health_components()
              ]
              assert "biometrics" in components, (
                  f"health missing biometrics: {components}"
              )
              try:
                  kernel.biometrics.submit_case(
                      display_name="x",
                      actor="ci",
                      doc_image=b"doc",
                      selfie_image=b"doc",
                  )
              except ProviderError:
                  pass
              else:
                  raise AssertionError(
                      "fail-closed provider must refuse"
                      " submissions"
                  )

          print(
              "CHAIN OK: router + api routes + kernel"
              " wiring + fail-closed verified"
          )
          PYEOF

      - name: Install real face engine (pinned combo)
        run: |
          pip install "numpy==1.26.4" "onnxruntime>=1.16,<2.0" "cython<3" "setuptools<81" wheel
          pip install --no-build-isolation "insightface==0.7.3"

      - name: Verify face engine imports (production path, self-healing)
        run: |
          python - <<'PYEOF'
          from shared_engines.security.biometrics_face import (
              _ensure_mesh_importable,
          )

          mode = _ensure_mesh_importable()
          print("MESH MODE:", mode)

          import insightface
          from insightface.app import FaceAnalysis

          print(
              "ALL FACE IMPORTS OK",
              insightface.__version__,
          )
          PYEOF

      - name: 4/5 Real face engine loads and refuses face-less images
        run: |
          python - <<'PYEOF'
          import os, tempfile

          from shared_engines.security.biometrics_face import (
              InsightFaceProvider,
          )
          from shared_engines.security.biometrics import (
              TemplateQualityError,
          )

          provider = InsightFaceProvider(
              models_dir=os.path.join(
                  tempfile.gettempdir(), "zyra-models"
              )
          )
          print("FACE ENGINE LOADED OK")

          try:
              provider.extract_template(b"not-an-image")
          except TemplateQualityError:
              print(
                  "REJECT OK: garbage image refused"
                  " (fail-closed)"
              )
          else:
              raise AssertionError(
                  "garbage image must be refused"
              )

          blank = bytes.fromhex(
              "89504e470d0a1a0a0000000d494844520000000"
              "100000001080600000" "01f15c4890000000a49444"
              "154789c6360000002000148" "afa71d0000000049454e44"
              "ae426082"
          )
          try:
              provider.extract_template(blank)
          except TemplateQualityError:
              print(
                  "REJECT OK: face-less image refused"
                  " (no face detected)"
              )
          else:
              raise AssertionError(
                  "face-less image must be refused"
              )

          print("EYE OK: real face engine verified")
          PYEOF

      - name: 5/5 Backup tool smoke (create, claim, retention)
        run: |
          python - <<'PYEOF'
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from shared_engines.common.clocks import SystemClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.authority.root import PersistentRootAuthority
          from shared_engines.storage.database import SQLiteAdapter

          KEY = "ab" * 32

          def run_tool(data_dir, snap_dir, keep):
              return subprocess.run(
                  [
                      sys.executable,
                      "scripts/backup.py",
                      "--data-dir", str(data_dir),
                      "--snapshot-dir", str(snap_dir),
                      "--keep", str(keep),
                  ],
                  capture_output=True,
                  text=True,
              )

          with tempfile.TemporaryDirectory() as tmp:
              data_dir = Path(tmp) / "data"
              snap_dir = Path(tmp) / "snapshots"
              data_dir.mkdir(parents=True)

              authority = PersistentRootAuthority(
                  data_dir=data_dir,
                  master_key_hex=KEY,
              )
              signer, _status = authority.load_or_create()
              db = SQLiteAdapter(data_dir / "zyra.db")
              kernel = ZyraKernel(
                  db=db,
                  clock=SystemClock(),
                  signer=signer,
                  config=RuntimeConfig(
                      host="127.0.0.1", port=0
                  ),
                  master_key_hex=KEY,
              )
              root = kernel.bootstrap_root()
              assert root.zid.startswith("ZID-")
              db.close()

              r1 = run_tool(data_dir, snap_dir, 1)
              assert r1.returncode == 0, (
                  r1.stdout + r1.stderr
              )
              print(r1.stdout.strip())

              r2 = run_tool(data_dir, snap_dir, 1)
              assert r2.returncode == 0, (
                  r2.stdout + r2.stderr
              )

              snapshots = [
                  p
                  for p in snap_dir.iterdir()
                  if p.is_file()
              ]
              assert len(snapshots) == 1, (
                f"retention keep=1 must leave"
                f" exactly 1, got"
                f" {len(snapshots)}"
              )
              snap = snapshots[0]
              size = snap.stat().st_size
              assert size > 0, (
                  "snapshot file is empty"
              )

              claim = re.search(
                  r"\b[0-9a-f]{64}\b",
                  r2.stdout,
              )
              assert claim is not None, (
                  "tool did not print a sha256"
              )

              print("SNAPSHOT OK:", snap.name)
              print("SIZE BYTES:", size)
              print(
                  "TOOL SHA CLAIM:",
                  claim.group(0)[:16] + "...",
              )
              print(
                  "RETENTION OK: keep=1"
                  " enforced across runs"
              )
              print(
                  "NOTE: snapshots are sealed"
                  " artifacts (SnapshotManager);"
                  " sealed-restore is owned by"
                  " the storage engine"
              )
              print(
                  "BACKUP CHAIN VERIFIED"
              )
          PYEOF

      - name: Result
        if: always()
        run: echo "Security chain validation finished"
