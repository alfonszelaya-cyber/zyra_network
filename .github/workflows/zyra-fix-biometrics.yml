name: "AXIS AX-5 paso 1: auditoria servicios para aceptacion e2e (SOLO LECTURA)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: axis-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: firmas reales de los servicios life_history"
        run: |
          python3 - <<'DUMPEOF'
          import inspect
          from apps.axis.life_history.integration import (
              build_life_history)
          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore)
          from shared_engines.storage.database import (
              SQLiteAdapter)
          from shared_engines.common.clocks import (
              SystemClock)
          from apps.axis.infrastructure.network.network_client import (
              NetworkClient)
          store = AxisStore(
              SQLiteAdapter(":memory:"),
              SystemClock())
          client = NetworkClient(
              "http://127.0.0.1:1",
              timeout_seconds=1.0,
              max_retries=0)
          life = build_life_history(
              db=store._db, clock=SystemClock(),
              network_client=client)
          print("=== life service public ===")
          for n in sorted(
              a for a in dir(life)
              if not a.startswith("_")):
              o = getattr(life, n)
              if inspect.ismethod(o):
                  try:
                      print(n, inspect.signature(o))
                  except Exception:
                      print(n, "(sin firma)")
          print()
          print("=== life._store public ===")
          for n in sorted(
              a for a in dir(life._store)
              if not a.startswith("_")):
              o = getattr(life._store, n)
              if inspect.ismethod(o):
                  try:
                      print(n, inspect.signature(o))
                  except Exception:
                      print(n, "(sin firma)")
          DUMPEOF

      - name: "Dump 2: como llaman los tests existentes a salud/justicia/seguridad/clearance"
        run: |
          python3 - <<'DUMP2EOF'
          from pathlib import Path
          for nombre in (
              "test_health_link.py",
              "test_justice_service.py",
              "test_security_service.py",
              "test_clearance_ops.py",
              "test_service.py",
          ):
              p = Path("apps/axis/life_history/tests")
              f = p / nombre
              print()
              print("======== " + nombre + " ========")
              if f.exists():
                  txt = f.read_text(
                      encoding="utf-8")
                  lineas = txt.splitlines()
                  print("(total "
                        + str(len(lineas))
                        + " lineas)")
                  for i, l in enumerate(
                      lineas, 1):
                      print(str(i).rjust(4)
                          + ": " + l)
              else:
                  print("NO EXISTE")
          DUMP2EOF

      - name: "Dump 3: estructura life_events + life_persons (esquema real para el test de carga)"
        run: |
          python3 - <<'DUMP3EOF'
          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore)
          from shared_engines.storage.database import (
              SQLiteAdapter)
          from shared_engines.common.clocks import (
              SystemClock)
          store = AxisStore(
              SQLiteAdapter(":memory:"),
              SystemClock())
          for tabla in (
              "life_persons", "life_events",
              "life_births", "life_outbox_sent",
          ):
              print()
              print("=== esquema " + tabla
                    + " ===")
              try:
                  cols = store._db.query_all(
                      "PRAGMA table_info("
                      + tabla + ")")
                  if not cols:
                      print("(no existe)")
                  for c in cols:
                      print(dict(c))
              except Exception as e:
                  print("error:", e)
          DUMP3EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
