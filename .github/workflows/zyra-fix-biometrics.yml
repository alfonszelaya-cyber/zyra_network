name: ZYRA LOTE GRANDE - PBR + Salidas universales + Red ZYRA Network (auto-escritor)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Escribir network_config.py (conecta a ZYRA Network automaticamente)
        run: |
          cat > apps/laboratorio/config/network/network_config.py <<'CFG_EOF'
          """Configuracion de red hacia ZYRA Network (el nucleo vivo en main.py).

          Orden automatico de deteccion de la Red:
            1. LAB_ZYRA_URL  (override explicito de laboratorio)
            2. ZYRA_URL      (la misma variable que usa la SuperApp)
            3. ZYRA_HOST     (servicio de render.yaml -> https://host)
          Sin ninguna de las tres, la app funciona local y lo declara.
          """
          import os
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class NetworkConfig:
              """Parametros de conexion con ZYRA Network."""

              url_zyra_core: str = ""
              app_id: str = "laboratorio"
              api_token: str = ""
              timeout_segundos: float = 30.0
              reintentos: int = 3

              NOMBRE_RED = "ZYRA Network"

              @property
              def configurada(self) -> bool:
                  """True solo si existe URL real de ZYRA Network."""
                  return bool(self.url_zyra_core.strip())

              @classmethod
              def cargar(cls) -> "NetworkConfig":
                  """Detecta la Red viva automaticamente (mismo contrato que superapp)."""
                  url = os.environ.get("LAB_ZYRA_URL", "").strip()
                  if not url:
                      url = os.environ.get("ZYRA_URL", "").strip()
                  if not url:
                      host = os.environ.get("ZYRA_HOST", "").strip()
                      if host:
                          url = "https://" + host
                  token = (
                      os.environ.get("LAB_ZYRA_TOKEN", "").strip()
                      or os.environ.get("ZYRA_API_TOKEN", "").strip()
                  )
                  return cls(
                      url_zyra_core=url.rstrip("/"),
                      app_id=os.environ.get("LAB_ID_APP", "laboratorio"),
                      api_token=token,
                      timeout_segundos=float(
                          os.environ.get("LAB_NET_TIMEOUT", "30.0")
                      ),
                      reintentos=int(os.environ.get("LAB_NET_REINTENTOS", "3")),
                  )
          CFG_EOF

      - name: Escribir zyra_client.py (cliente de ZYRA Network con reintentos reales)
        run: |
          cat > apps/laboratorio/infrastructure/network/zyra_client.py <<'CLI_EOF'
          """LAB-CORE: cliente de ZYRA Network (registro, sellado, confianza).

          Ley 1: si la Red no esta configurada, lo reporta; nunca simula exito.
          Reintentos reales con espera progresiva solo sobre fallos de
          transporte; los rechazos definitivos (HTTP 4xx) no se reintentan.
          """
          import json as _json
          import time
          import urllib.error
          import urllib.request

          from apps.laboratorio.constants.system.system_constants import SistemaConstantes
          from apps.laboratorio.shared.exceptions.network_errors import (
              RedNoDisponibleError,
              RespuestaInvalidaError,
          )

          DESTINO_SELLO = "zyra/documents/seal"
          ESPERA_BASE = 0.4


          class ClienteZyra:
              """Unica puerta HTTP hacia ZYRA Network."""

              def __init__(self, config_red):
                  if config_red is None:
                      raise ValueError("ClienteZyra requiere su configuracion.")
                  self._cfg = config_red

              @property
              def configurado(self) -> bool:
                  return self._cfg.configurada

              def estado_conexion(self) -> dict:
                  """Estado real y honesto del enlace con ZYRA Network."""
                  if not self.configurado:
                      return {
                          "configurada": False,
                          "conectada": False,
                          "motivo": "URL de ZYRA Network no configurada",
                      }
                  try:
                      self._peticion("GET", "/health")
                      return {
                          "configurada": True,
                          "conectada": True,
                          "motivo": "",
                      }
                  except RedNoDisponibleError as exc:
                      return {
                          "configurada": True,
                          "conectada": False,
                          "motivo": str(exc)[:300],
                      }

              def _peticion(self, metodo: str, ruta: str, carga: dict = None) -> dict:
                  if not self.configurado:
                      raise RedNoDisponibleError(
                          "URL de ZYRA Network no configurada."
                      )
                  url = self._cfg.url_zyra_core.rstrip("/") + ruta
                  intentos_max = max(1, int(getattr(self._cfg, "reintentos", 1)))
                  ultimo_error = ""
                  for intento in range(1, intentos_max + 1):
                      datos = _json.dumps(carga or {}).encode("utf-8")
                      peticion = urllib.request.Request(
                          url,
                          data=datos if metodo != "GET" else None,
                          method=metodo,
                      )
                      peticion.add_header("Content-Type", "application/json")
                      peticion.add_header("X-ZYRA-APP", self._cfg.app_id)
                      if self._cfg.api_token:
                          peticion.add_header(
                              "Authorization", "Bearer " + self._cfg.api_token
                          )
                      try:
                          with urllib.request.urlopen(
                              peticion, timeout=self._cfg.timeout_segundos
                          ) as respuesta:
                              crudo = respuesta.read()
                          return self._procesar(crudo)
                      except urllib.error.HTTPError as exc:
                          cuerpo = b""
                          try:
                              cuerpo = exc.read()
                          except Exception:
                              pass
                          if exc.code >= 500:
                              ultimo_error = (
                                  "ZYRA Network respondio HTTP " + str(exc.code)
                              )
                          else:
                              raise RedNoDisponibleError(
                                  "ZYRA Network rechazo la peticion (HTTP "
                                  + str(exc.code) + "): "
                                  + cuerpo.decode("utf-8", "replace")[:200]
                              ) from exc
                      except (urllib.error.URLError, TimeoutError, OSError) as exc:
                          ultimo_error = "ZYRA Network inalcanzable: " + str(exc)
                      if intento < intentos_max:
                          espera = ESPERA_BASE * (2 ** (intento - 1))
                          time.sleep(espera)
                  raise RedNoDisponibleError(
                      ultimo_error or "ZYRA Network inalcanzable."
                  )

              @staticmethod
              def _procesar(crudo: bytes) -> dict:
                  try:
                      cuerpo = _json.loads(crudo.decode("utf-8"))
                  except (ValueError, UnicodeDecodeError) as exc:
                      raise RespuestaInvalidaError(
                          "Respuesta de ZYRA Network no es JSON valido."
                      ) from exc
                  if not isinstance(cuerpo, dict):
                      raise RespuestaInvalidaError(
                          "Respuesta de ZYRA Network debe ser un objeto JSON."
                      )
                  return cuerpo

              def registrar_app(self) -> dict:
                  if not self.configurado:
                      return {
                          "registrado": False,
                          "motivo": "URL de ZYRA Network no configurada",
                      }
                  return self._peticion(
                      "POST",
                      "/apps/register",
                      {
                          "app_id": self._cfg.app_id,
                          "nombre": SistemaConstantes.NOMBRE_APP,
                          "version": SistemaConstantes.VERSION_APP,
                      },
                  )

              def sellar_documento(self, titulo: str, contenido: str) -> dict:
                  if not self.configurado:
                      return {
                          "sellado": False,
                          "motivo": "URL de ZYRA Network no configurada",
                      }
                  return self._peticion(
                      "POST", "/documents/seal",
                      {"titulo": titulo, "contenido": contenido},
                  )

              def verificar_documento(self, documento_id: str) -> dict:
                  if not documento_id:
                      raise ValueError("documento_id requerido.")
                  return self._peticion(
                      "GET", "/documents/" + documento_id + "/verify"
                  )

              def entregar(self, destino: str, carga: dict) -> dict:
                  if not self.configurado:
                      raise RedNoDisponibleError(
                          "URL de ZYRA Network no configurada."
                      )
                  if destino == DESTINO_SELLO:
                      return self.sellar_documento(
                          str(carga.get("titulo", "")),
                          str(carga.get("contenido", "")),
                      )
                  raise RespuestaInvalidaError(
                      "Destino de entrega desconocido: " + destino
                  )
          CLI_EOF

      - name: Escribir display_holo3d.py (salida universal a cualquier dispositivo)
        run: |
          cat > apps/laboratorio/infrastructure/providers/display_holo3d.py <<'DISP_EOF'
          """SALIDA UNIVERSAL: UN protocolo, TODOS los destinos.

          Conectable en caliente a cualquier dispositivo sin codigo nuevo:
            - pantalla_local / hdmi / proyector : framebuffer real
              (/dev/fb0 o LAB_DISPLAY_FB); el frame PNG se convierte a
              RGB crudo y se escribe en el framebuffer
            - udp : stream de frames a cualquier receptor (TV box,
              Raspberry, decodificador, otro server) con fragmentacion
              [total][seq][partes] + payload
            - web : telefonos y navegadores SIN instalar nada: el frame
              actual se sirve por HTTP en
              GET /laboratorio/api/v1/displays/targets/{id}/frame
            - hypervsn / looking_glass / openxr : dispositivos por URL
              (env LAB_HYPERVSN_URL / LAB_LOOKINGGLASS_URL /
              LAB_OPENXR_ENDPOINT o registrados en caliente)
            - auto : elige el mejor destino detectado

          Ley 1: sin destino registrado, presentar() lo dice con motivo
          real. Nunca finge entrega.
          """
          import os
          import socket
          import struct
          import threading
          import time
          import urllib.request

          from apps.laboratorio.infrastructure.providers.png_decoder import (
              decodificar_png_rgb,
          )
          from apps.laboratorio.shared.adapters.engine_adapter import AdaptadorMotor
          from apps.laboratorio.shared.exceptions.pipeline_errors import (
              DestinoNoDisponibleError,
          )
          from apps.laboratorio.shared.interfaces.display_adapter import DisplayAdapter

          TIPOS_VALIDOS = (
              "pantalla_local", "hdmi", "proyector", "udp", "web",
              "hypervsn", "looking_glass", "openxr", "auto",
          )
          TIPOS_LOCALES = ("pantalla_local", "hdmi", "proyector")
          TIPOS_URL = ("hypervsn", "looking_glass", "openxr")
          UDP_CHUNK = 60000


          class MotorHolo3D(AdaptadorMotor, DisplayAdapter):
              """Enrutador universal de salidas visuales."""

              def __init__(self):
                  AdaptadorMotor.__init__(self, "display_holo3d", "display", "1.0.0")
                  self.marcar_disponible()
                  self._lock = threading.Lock()
                  self._destinos = {}
                  self._frames = {}
                  self._tipos_frame = {}
                  self._contador = 0

              def kind(self) -> str:
                  return "universal"

              def disponible(self) -> bool:
                  return self.estado.value == "disponible"

              def capacidades(self) -> dict:
                  return {
                      "protocolo": "universal multi-destino",
                      "tipos": TIPOS_VALIDOS,
                      "deteccion": "pantalla_local, hypervsn, looking_glass, openxr",
                      "web_pull": "/laboratorio/api/v1/displays/targets/{id}/frame",
                      "nota": "conecte cualquier dispositivo registrandolo en caliente",
                  }

              def detectar_dispositivos(self) -> dict:
                  """Dispositivos visibles AHORA en el entorno real."""
                  encontrados = {}
                  fb = os.environ.get("LAB_DISPLAY_FB", "").strip()
                  if fb and os.path.exists(fb):
                      encontrados["pantalla_local"] = fb
                  elif os.path.exists("/dev/fb0"):
                      encontrados["pantalla_local"] = "/dev/fb0"
                  pares = (
                      ("LAB_HYPERVSN_URL", "hypervsn"),
                      ("LAB_LOOKINGGLASS_URL", "looking_glass"),
                      ("LAB_OPENXR_ENDPOINT", "openxr"),
                  )
                  for env, tipo in pares:
                      valor = os.environ.get(env, "").strip()
                      if valor:
                          encontrados[tipo] = valor
                  return encontrados

              def registrar_destino(
                  self, tipo: str, direccion: str = "", nombre: str = ""
              ) -> dict:
                  if tipo not in TIPOS_VALIDOS:
                      raise ValueError(
                          "Tipo de destino desconocido: " + repr(tipo)
                          + ". Validos: " + ", ".join(TIPOS_VALIDOS)
                      )
                  direccion = str(direccion or "").strip()
                  if tipo in ("udp",) + TIPOS_URL and not direccion:
                      raise ValueError(
                          "El tipo " + tipo + " requiere direccion."
                      )
                  if tipo == "auto":
                      deteccion = self.detectar_dispositivos()
                      if not deteccion:
                          raise DestinoNoDisponibleError(
                              "auto no encontro ningun dispositivo: registre uno "
                              "explicito o declare su variable de entorno."
                          )
                      primer = sorted(deteccion.items())[0]
                      tipo = primer[0]
                      direccion = primer[1]
                  with self._lock:
                      self._contador += 1
                      id_destino = "disp-" + str(self._contador).zfill(4)
                      self._destinos[id_destino] = {
                          "id": id_destino,
                          "tipo": tipo,
                          "direccion": direccion,
                          "nombre": str(nombre or "")[:80],
                          "creado_en": time.strftime(
                              "%Y-%m-%dT%H:%M:%SZ", time.gmtime()
                          ),
                      }
                      self._frames[id_destino] = None
                      self._tipos_frame[id_destino] = "image/png"
                  return {
                      "id": id_destino, "tipo": tipo, "direccion": direccion
                  }

              def quitar_destino(self, id_destino: str) -> bool:
                  with self._lock:
                      if id_destino in self._destinos:
                          del self._destinos[id_destino]
                          self._frames.pop(id_destino, None)
                          self._tipos_frame.pop(id_destino, None)
                          return True
                  return False

              def listar_destinos(self) -> dict:
                  with self._lock:
                      destinos = [dict(d) for d in self._destinos.values()]
                      estados = {
                          d["id"]: (self._frames.get(d["id"]) is not None)
                          for d in destinos
                      }
                  return {
                      "destinos": destinos,
                      "con_frame": estados,
                      "deteccion": self.detectar_dispositivos(),
                  }

              def _destino(self, id_destino: str) -> dict:
                  with self._lock:
                      destino = self._destinos.get(id_destino)
                  if destino is None:
                      raise ValueError("Destino desconocido: " + id_destino)
                  return destino

              def _resolver_auto(self, destino: dict) -> dict:
                  if destino["tipo"] != "auto":
                      return destino
                  deteccion = self.detectar_dispositivos()
                  if not deteccion:
                      raise DestinoNoDisponibleError(
                          "auto sin dispositivos detectados en este momento."
                      )
                  primer = sorted(deteccion.items())[0]
                  return {
                      "id": destino["id"],
                      "tipo": primer[0],
                      "direccion": primer[1],
                      "nombre": destino["nombre"],
                  }

              def _volcar_framebuffer(
                  self, destino: dict, frame_bytes: bytes
              ) -> dict:
                  ruta = destino.get("direccion") or (
                      self.detectar_dispositivos().get("pantalla_local", "")
                  )
                  if not ruta:
                      return {
                          "id": destino["id"], "entregado": False,
                          "motivo": "sin framebuffer disponible en el sistema",
                      }
                  try:
                      ancho, alto, pixeles = decodificar_png_rgb(frame_bytes)
                      with open(ruta, "wb") as manejador:
                          manejador.seek(0)
                          manejador.write(pixeles)
                      return {
                          "id": destino["id"], "entregado": True,
                          "canal": "framebuffer", "ruta": ruta,
                          "resolucion": [ancho, alto],
                      }
                  except Exception as exc:
                      return {
                          "id": destino["id"], "entregado": False,
                          "motivo": "framebuffer fallo: " + str(exc)[:200],
                      }

              def _enviar_udp(self, destino: dict, frame_bytes: bytes) -> dict:
                  direccion = destino.get("direccion", "")
                  partes = direccion.rsplit(":", 1)
                  if len(partes) != 2:
                      return {
                          "id": destino["id"], "entregado": False,
                          "motivo": "udp requiere host:puerto",
                      }
                  host = partes[0].strip()
                  try:
                      puerto = int(partes[1].strip())
                  except ValueError:
                      return {
                          "id": destino["id"], "entregado": False,
                          "motivo": "puerto udp invalido",
                      }
                  total = len(frame_bytes)
                  partes_n = max(1, (total + UDP_CHUNK - 1) // UDP_CHUNK)
                  try:
                      sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                      try:
                          for seq in range(partes_n):
                              trozo = frame_bytes[
                                  seq * UDP_CHUNK:(seq + 1) * UDP_CHUNK
                              ]
                              encabezado = struct.pack("!IIH", total, seq, partes_n)
                              sock.sendto(encabezado + trozo, (host, puerto))
                      finally:
                          sock.close()
                  except Exception as exc:
                      return {
                          "id": destino["id"], "entregado": False,
                          "motivo": "udp fallo: " + str(exc)[:200],
                      }
                  return {
                      "id": destino["id"], "entregado": True,
                      "canal": "udp", "destino": direccion,
                      "bytes": total, "partes": partes_n,
                  }

              def _enviar_dispositivo_url(
                  self, destino: dict, frame_bytes: bytes
              ) -> dict:
                  url = destino.get("direccion", "")
                  if not url:
                      return {
                          "id": destino["id"], "entregado": False,
                          "motivo": "el dispositivo no tiene URL configurada",
                      }
                  try:
                      peticion = urllib.request.Request(
                          url,
                          data=frame_bytes,
                          method="POST",
                          headers={"Content-Type": "application/octet-stream"},
                      )
                      with urllib.request.urlopen(peticion, timeout=15) as resp:
                          cuerpo = resp.read()[:400]
                      return {
                          "id": destino["id"], "entregado": True,
                          "canal": destino["tipo"], "url": url,
                          "respuesta": cuerpo.decode("utf-8", "replace"),
                      }
                  except Exception as exc:
                      return {
                          "id": destino["id"], "entregado": False,
                          "motivo": destino["tipo"] + " fallo: " + str(exc)[:200],
                      }

              def presentar(
                  self, frame_bytes, config=None,
                  content_type: str = "image/png",
              ) -> dict:
                  """Entrega el frame a TODOS los destinos registrados."""
                  if not isinstance(frame_bytes, (bytes, bytearray)) or not frame_bytes:
                      raise ValueError("Frame vacio o invalido.")
                  config = dict(config or {})
                  filtro = str(config.get("tipo", "")).strip()
                  frame = bytes(frame_bytes)
                  with self._lock:
                      seleccion = [
                          dict(d) for d in self._destinos.values()
                          if not filtro or d["tipo"] == filtro
                      ]
                      if not seleccion:
                          return {
                              "entregado": False,
                              "destinos": 0,
                              "motivo": (
                                  "sin destino registrado: registre uno con POST "
                                  "/laboratorio/api/v1/displays/targets"
                              ),
                          }
                      for destino in seleccion:
                          self._frames[destino["id"]] = frame
                          self._tipos_frame[destino["id"]] = content_type
                  resultados = []
                  for destino in seleccion:
                      try:
                          real = self._resolver_auto(destino)
                          tipo = real["tipo"]
                          if tipo in TIPOS_LOCALES:
                              resultado = self._volcar_framebuffer(real, frame)
                          elif tipo == "udp":
                              resultado = self._enviar_udp(real, frame)
                          elif tipo in TIPOS_URL:
                              resultado = self._enviar_dispositivo_url(real, frame)
                          else:
                              resultado = {
                                  "id": real["id"], "entregado": True,
                                  "canal": "pull",
                                  "url": (
                                      "/laboratorio/api/v1/displays/targets/"
                                      + real["id"] + "/frame"
                                  ),
                              }
                      except Exception as exc:
                          resultado = {
                              "id": destino["id"], "entregado": False,
                              "motivo": type(exc).__name__ + ": " + str(exc)[:200],
                          }
                      resultados.append(resultado)
                  entregados = sum(1 for r in resultados if r.get("entregado"))
                  return {
                      "entregado": entregados > 0,
                      "destinos": len(resultados),
                      "entregados": entregados,
                      "resultados": resultados,
                  }

              def frame_actual(self, id_destino: str):
                  """Frame vigente para web/moviles (pull). Devuelve (bytes, mime)."""
                  self._destino(id_destino)
                  with self._lock:
                      frame = self._frames.get(id_destino)
                      mime = self._tipos_frame.get(id_destino, "image/png")
                  if frame is None:
                      raise ValueError(
                          "El destino " + id_destino
                          + " no tiene frame presentado aun."
                      )
                  return frame, mime
          DISP_EOF

      - name: Escribir renderer_photoreal.py (PBR real GGX Cook-Torrance ACES y sombras)
        run: |
          cat > apps/laboratorio/infrastructure/providers/renderer_photoreal.py <<'PBR_EOF'
          """Motor FOTORREAL PBR: iluminacion fisicamente basada REAL.

          Pipeline completo en Python puro (stdlib, cero dependencias):
            1. Rasterizacion con z-buffer por capas (fondo/medio/frente)
            2. Normales geometricas reales: rect = plano, circle = esfera
            3. BRDF GGX Cook-Torrance (specular) + Lambert (diffuse),
               rugosidad y metalico configurables
            4. Sombras por oclusion entre capas (el frente proyecta sobre
               medio y fondo)
            5. Ambient occlusion por profundidad de capa
            6. Tone mapping ACES + gamma 2.2
            7. Supersampling configurable (1x/2x/4x) con presupuesto de
               pixeles honesto (se reduce solo si hace falta, y se
               declara en metadata)
            8. Salida PNG RGB + PNG de profundidad (encoder propio)

          Nada simulado: cada pixel se calcula con la BRDF.
          """
          import math

          from apps.laboratorio.domain.lighting import ProgramaLuz
          from apps.laboratorio.infrastructure.providers.font_bitmap import (
              texto_a_lineas,
          )
          from apps.laboratorio.infrastructure.providers.png_encoder import (
              encode_png_gray,
              encode_png_rgb,
          )
          from apps.laboratorio.shared.adapters.engine_adapter import AdaptadorMotor
          from apps.laboratorio.shared.exceptions.render_errors import (
              EscenaVaciaError,
              RenderFallidoError,
          )
          from apps.laboratorio.shared.interfaces.renderer import (
              Renderer,
              ResultadoRender,
          )

          CAPA_INDICE = {"fondo": 0, "medio": 1, "frente": 2}
          CAPA_NOMBRE = ("fondo", "medio", "frente")
          PROFUNDIDAD_CAPA = {"fondo": 0.20, "medio": 0.55, "frente": 0.90}
          AMBIENTE_CAPA = {"fondo": 0.62, "medio": 0.78, "frente": 1.0}
          LUZ_DEFECTO_COLOR = (0.89, 0.91, 0.94)
          LUZ_DEFECTO_INTENSIDAD = 0.85
          DIRECCION_LUZ = (0.35, 0.45, 0.82)
          FONDO_LIENZO = (15 / 255.0, 23 / 255.0, 42 / 255.0)
          MAX_PX_PASO = 3_000_000


          def _hex_rgb(texto: str):
              crudo = str(texto or "").strip().lstrip("#")
              if len(crudo) != 6:
                  raise ValueError("Color hex invalido: " + repr(texto))
              return (
                  int(crudo[0:2], 16),
                  int(crudo[2:4], 16),
                  int(crudo[4:6], 16),
              )


          def _normalizar(v):
              largo = math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2])
              if largo < 1e-9:
                  return (0.0, 0.0, 1.0)
              return (v[0] / largo, v[1] / largo, v[2] / largo)


          def _aces(x: float) -> float:
              if x <= 0.0:
                  return 0.0
              a = x * (2.51 * x + 0.03)
              b = x * (2.43 * x + 0.59) + 0.14
              return min(1.0, max(0.0, a / b))


          def _gamma(x: float) -> float:
              if x <= 0.0:
                  return 0.0
              if x >= 1.0:
                  return 1.0
              return x ** (1.0 / 2.2)


          class _Golpe:
              """Registro de un pixel tocado por una forma (para sombrear)."""

              __slots__ = ("capa", "r", "g", "b", "nx", "ny", "nz")

              def __init__(self, capa, color, normal):
                  self.capa = capa
                  self.r, self.g, self.b = color
                  self.nx, self.ny, self.nz = normal


          class MotorRenderFotoreal(AdaptadorMotor, Renderer):
              """Calidad FOTORREAL: PBR real con BRDF GGX y sombras."""

              def __init__(self):
                  AdaptadorMotor.__init__(
                      self, "renderer_photoreal", "renderer", "2.0.0"
                  )
                  self.marcar_disponible()

              def capacidades(self) -> dict:
                  return {
                      "calidades": ["fotorreal"],
                      "profundidad": True,
                      "brdf": "GGX Cook-Torrance",
                      "diffuse": "Lambert",
                      "tonemap": "ACES + gamma 2.2",
                      "sombras": "oclusion entre capas",
                      "supersampling": (1, 2, 4),
                      "parametros": ("rugosidad", "metalico", "muestras"),
                  }

              def renderizar(
                  self, escena, opciones, programa_luz=None
              ) -> ResultadoRender:
                  ancho_obj = int(
                      opciones.get("ancho", getattr(escena, "ancho", 0))
                  )
                  alto_obj = int(
                      opciones.get("alto", getattr(escena, "alto", 0))
                  )
                  if ancho_obj < 16 or alto_obj < 16:
                      raise RenderFallidoError(
                          "Resolucion invalida para PBR: "
                          + str(ancho_obj) + "x" + str(alto_obj)
                      )
                  objetos = list(getattr(escena, "objetos", []) or [])
                  if not objetos:
                      raise EscenaVaciaError("La escena no tiene objetos.")
                  if programa_luz is not None and not isinstance(
                      programa_luz, ProgramaLuz
                  ):
                      raise RenderFallidoError("Programa de luz invalido.")
                  luz_rgb, luz_int = self._luz_de(programa_luz)
                  rugosidad = self._rango(
                      opciones.get("rugosidad", 0.35), 0.0, 1.0, 0.35
                  )
                  metalico = self._rango(
                      opciones.get("metalico", 0.0), 0.0, 1.0, 0.0
                  )
                  muestras = int(opciones.get("muestras", 1))
                  if muestras not in (1, 2, 4):
                      muestras = 1
                  muestras = self._ajustar_muestras(ancho_obj, alto_obj, muestras)
                  W = ancho_obj * muestras
                  H = alto_obj * muestras
                  sx = W / float(getattr(escena, "ancho", ancho_obj))
                  sy = H / float(getattr(escena, "alto", alto_obj))
                  golpes, sombras, profundidad = self._rasterizar(
                      objetos, W, H, sx, sy
                  )
                  imagen = self._sombrear(
                      golpes, sombras, W, H,
                      luz_rgb, luz_int, rugosidad, metalico,
                  )
                  if muestras > 1:
                      imagen = self._reducir(imagen, W, H, muestras)
                  png = encode_png_rgb(ancho_obj, alto_obj, bytes(imagen))
                  png_prof = encode_png_gray(ancho_obj, alto_obj, bytes(profundidad))
                  return ResultadoRender(
                      imagen_bytes=png,
                      profundidad_bytes=png_prof,
                      ancho=ancho_obj,
                      alto=alto_obj,
                      metadata={
                          "formato": "png",
                          "motor": "renderer_photoreal",
                          "calidad": "fotorreal_pbr",
                          "brdf": "GGX Cook-Torrance",
                          "tonemap": "ACES",
                          "sombras": "oclusion_capas",
                          "rugosidad": rugosidad,
                          "metalico": metalico,
                          "muestras": muestras,
                          "resolucion": [ancho_obj, alto_obj],
                          "profundidad": True,
                          "objetos": len(objetos),
                      },
                  )

              @staticmethod
              def _rango(valor, bajo, alto, defecto):
                  try:
                      numero = float(valor)
                  except (TypeError, ValueError):
                      return defecto
                  return max(bajo, min(alto, numero))

              @staticmethod
              def _ajustar_muestras(ancho, alto, muestras):
                  while muestras > 1 and (
                      ancho * alto * muestras * muestras > MAX_PX_PASO
                  ):
                      muestras = muestras // 2
                  return muestras

              @staticmethod
              def _luz_de(programa_luz):
                  if programa_luz is None:
                      return LUZ_DEFECTO_COLOR, LUZ_DEFECTO_INTENSIDAD
                  mejor = 0.0
                  for paso in programa_luz.pasos:
                      valor = float(paso.get("intensidad", 0.0))
                      if valor > mejor:
                          mejor = valor
                  intensidad = max(0.05, min(1.0, mejor))
                  try:
                      crudo = _hex_rgb(programa_luz.color_dominate)
                      color = (
                          crudo[0] / 255.0,
                          crudo[1] / 255.0,
                          crudo[2] / 255.0,
                      )
                  except (ValueError, AttributeError):
                      color = LUZ_DEFECTO_COLOR
                  return color, intensidad

              def _rasterizar(self, objetos, W, H, sx, sy):
                  golpes = [None] * (W * H)
                  sombras = bytearray(W * H)
                  profundidad = bytearray(W * H)
                  cubiertos = {
                      0: bytearray(W * H),
                      1: bytearray(W * H),
                      2: bytearray(W * H),
                  }
                  for obj in objetos:
                      forma = str(obj.get("forma", ""))
                      capa = CAPA_INDICE.get(str(obj.get("capa", "medio")), 1)
                      try:
                          color = _hex_rgb(obj.get("color", "#94A3B8"))
                      except ValueError:
                          color = (148, 163, 184)
                      if forma == "rect":
                          self._pintar_rect(
                              obj, capa, color, golpes, cubiertos, W, H, sx, sy
                          )
                      elif forma == "circle":
                          self._pintar_circulo(
                              obj, capa, color, golpes, cubiertos, W, H, sx, sy
                          )
                      else:
                          self._pintar_texto(
                              obj, capa, color, golpes, cubiertos, W, H, sx, sy
                          )
                  for indice in range(W * H):
                      golpe = golpes[indice]
                      if golpe is None:
                          profundidad[indice] = 0
                          continue
                      valor_sombra = 0
                      for j in range(golpe.capa + 1, 3):
                          if cubiertos[j][indice]:
                              valor_sombra = 1
                              break
                      sombras[indice] = valor_sombra
                      profundidad[indice] = int(
                          PROFUNDIDAD_CAPA[CAPA_NOMBRE[golpe.capa]] * 255.0
                      )
                  return golpes, sombras, profundidad

              def _pintar_rect(
                  self, obj, capa, color, golpes, cubiertos, W, H, sx, sy
              ):
                  x1 = max(0, min(W - 1, int(obj["x"] * sx)))
                  y1 = max(0, min(H - 1, int(obj["y"] * sy)))
                  x2 = max(0, min(W - 1, int((obj["x"] + obj["w"]) * sx)))
                  y2 = max(0, min(H - 1, int((obj["y"] + obj["h"]) * sy)))
                  normal = (0.0, 0.0, 1.0)
                  for py in range(y1, y2 + 1):
                      base = py * W
                      for px in range(x1, x2 + 1):
                          indice = base + px
                          existente = golpes[indice]
                          if existente is not None and existente.capa > capa:
                              continue
                          golpes[indice] = _Golpe(capa, color, normal)
                          cubiertos[capa][indice] = 1

              def _pintar_circulo(
                  self, obj, capa, color, golpes, cubiertos, W, H, sx, sy
              ):
                  cx = obj["cx"] * sx
                  cy = obj["cy"] * sy
                  radio = obj["r"] * min(sx, sy)
                  if radio < 0.5:
                      return
                  x0 = max(0, int(cx - radio))
                  x1 = min(W - 1, int(cx + radio))
                  y0 = max(0, int(cy - radio))
                  y1 = min(H - 1, int(cy + radio))
                  r_cuadrado = radio * radio
                  for py in range(y0, y1 + 1):
                      dy = py + 0.5 - cy
                      resto = r_cuadrado - dy * dy
                      if resto <= 0:
                          continue
                      medio = math.sqrt(resto)
                      px_ini = max(0, int(cx - medio))
                      px_fin = min(W - 1, int(cx + medio))
                      base = py * W
                      for px in range(px_ini, px_fin + 1):
                          dx = px + 0.5 - cx
                          nx = dx / radio
                          ny = dy / radio
                          nz_cuad = 1.0 - nx * nx - ny * ny
                          nz = math.sqrt(nz_cuad) if nz_cuad > 0.0 else 0.0
                          indice = base + px
                          existente = golpes[indice]
                          if existente is not None and existente.capa > capa:
                              continue
                          golpes[indice] = _Golpe(capa, color, (nx, ny, nz))
                          cubiertos[capa][indice] = 1

              def _pintar_texto(
                  self, obj, capa, color, golpes, cubiertos, W, H, sx, sy
              ):
                  escala = max(1, int(round(min(sx, sy) * 2)))
                  cursor_x = int(obj.get("x", 0) * sx)
                  py_base = int(obj.get("y", 0) * sy)
                  contenido = str(obj.get("contenido", ""))[:120]
                  normal = (0.0, 0.0, 1.0)
                  for caracter, glifo in texto_a_lineas(contenido):
                      for fila in range(5):
                          patrones = glifo[fila]
                          for columna in range(3):
                              if not (patrones >> (2 - columna)) & 1:
                                  continue
                              x0 = cursor_x + columna * escala
                              y0 = py_base + fila * escala
                              if x0 < 0 or y0 < 0 or x0 >= W or y0 >= H:
                                  continue
                              x1 = min(W - 1, x0 + escala - 1)
                              y1 = min(H - 1, y0 + escala - 1)
                              for yy in range(y0, y1 + 1):
                                  fila_b = yy * W
                                  for xx in range(x0, x1 + 1):
                                      indice = fila_b + xx
                                      existente = golpes[indice]
                                      if (
                                          existente is not None
                                          and existente.capa > capa
                                      ):
                                          continue
                                      golpes[indice] = _Golpe(capa, color, normal)
                                      cubiertos[capa][indice] = 1
                      cursor_x += 4 * escala

              def _sombrear(
                  self, golpes, sombras, W, H,
                  luz_rgb, luz_int, rugosidad, metalico,
              ):
                  L = _normalizar(DIRECCION_LUZ)
                  Hvec = _normalizar((L[0], L[1], L[2] + 1.0))
                  alpha = rugosidad * rugosidad
                  a2 = alpha * alpha
                  k = alpha / 2.0
                  F0 = 0.04 + metalico * 0.96
                  pi = math.pi
                  imagen = bytearray(W * H * 3)
                  fb = FONDO_LIENZO
                  for indice in range(W * H):
                      golpe = golpes[indice]
                      if golpe is None:
                          imagen[indice * 3] = int(fb[0] * 255.0 + 0.5)
                          imagen[indice * 3 + 1] = int(fb[1] * 255.0 + 0.5)
                          imagen[indice * 3 + 2] = int(fb[2] * 255.0 + 0.5)
                          continue
                      nx, ny, nz = golpe.nx, golpe.ny, golpe.nz
                      NdotL = max(0.0, nx * L[0] + ny * L[1] + nz * L[2])
                      NdotV = max(0.0, nz)
                      NdotH = max(0.0, nx * Hvec[0] + ny * Hvec[1] + nz * Hvec[2])
                      denom = NdotH * NdotH * (a2 - 1.0) + 1.0
                      D = a2 / (pi * denom * denom + 1e-9)
                      fresnel = 1.0 - NdotH
                      F = F0 + (1.0 - F0) * fresnel ** 5
                      G_v = NdotV / (NdotV * (1.0 - k) + k + 1e-9)
                      G_l = NdotL / (NdotL * (1.0 - k) + k + 1e-9)
                      G = G_v * G_l
                      divisor = 4.0 * NdotL * NdotV + 1e-4
                      ks = D * F * G / divisor
                      kd = (1.0 - F) * (1.0 - metalico)
                      albedo_r = golpe.r / 255.0
                      albedo_g = golpe.g / 255.0
                      albedo_b = golpe.b / 255.0
                      ambiente = AMBIENTE_CAPA[CAPA_NOMBRE[golpe.capa]]
                      factor_sombra = 0.35 if sombras[indice] else 1.0
                      directo = luz_int * NdotL * factor_sombra
                      if metalico > 0.5:
                          spec_r = ks * albedo_r
                          spec_g = ks * albedo_g
                          spec_b = ks * albedo_b
                      else:
                          spec_r = spec_g = spec_b = ks
                      lin_r = (
                          albedo_r * ambiente * 0.20
                          + luz_rgb[0] * directo * (albedo_r * kd / pi + spec_r)
                      )
                      lin_g = (
                          albedo_g * ambiente * 0.20
                          + luz_rgb[1] * directo * (albedo_g * kd / pi + spec_g)
                      )
                      lin_b = (
                          albedo_b * ambiente * 0.20
                          + luz_rgb[2] * directo * (albedo_b * kd / pi + spec_b)
                      )
                      imagen[indice * 3] = int(_gamma(_aces(lin_r)) * 255.0 + 0.5)
                      imagen[indice * 3 + 1] = int(
                          _gamma(_aces(lin_g)) * 255.0 + 0.5
                      )
                      imagen[indice * 3 + 2] = int(
                          _gamma(_aces(lin_b)) * 255.0 + 0.5
                      )
                  return imagen

              @staticmethod
              def _reducir(imagen, W, H, muestras):
                  salida_w = W // muestras
                  salida_h = H // muestras
                  salida = bytearray(salida_w * salida_h * 3)
                  area = muestras * muestras
                  for py in range(salida_h):
                      base_salida = py * salida_w
                      for px in range(salida_w):
                          sr = sg = sb = 0
                          for dy in range(muestras):
                              fila = (py * muestras + dy) * W
                              for dx in range(muestras):
                                  indice = (fila + px * muestras + dx) * 3
                                  sr += imagen[indice]
                                  sg += imagen[indice + 1]
                                  sb += imagen[indice + 2]
                          destino = (base_salida + px) * 3
                          salida[destino] = sr // area
                          salida[destino + 1] = sg // area
                          salida[destino + 2] = sb // area
                  return salida
          PBR_EOF

