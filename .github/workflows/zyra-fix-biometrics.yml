name: ZYRA LABORATORIO - Lote 10A (Fase 10 final - gobierno, idempotencia y cierre)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Gate de sintaxis (ast.parse)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          errores = []
          for p in pathlib.Path('.').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
              except SyntaxError as e:
                  errores.append(f"{p}:{e.lineno} {e.msg}")
          if errores:
              print("ERRORES DE SINTAXIS:")
              print("\n".join(errores))
              sys.exit(1)
          print("OK - sintaxis limpia en todo el repositorio")
          PY

      - name: Ejecutar tests (resumen en Summary)
        run: |
          python - <<'PY'
          import os, subprocess, sys, pathlib, time

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          carpetas = sorted(
              {p for p in pathlib.Path('.').rglob('tests')
               if p.is_dir() and '.git' not in p.parts and '__pycache__' not in p.parts}
          )
          if not carpetas:
              print("No se encontraron carpetas tests/")
              sys.exit(1)

          logs = pathlib.Path('pytest_logs')
          logs.mkdir(exist_ok=True)

          resultados = []
          for c in carpetas:
              destino = logs / (str(c).replace('/', '__') + '.log')
              t0 = time.time()
              with open(destino, 'w') as fh:
                  r = subprocess.run(
                      [sys.executable, '-m', 'pytest', str(c), '-q', '--tb=long'],
                      stdout=fh, stderr=subprocess.STDOUT
                  )
              dur = time.time() - t0
              resultados.append((str(c), r.returncode, dur, destino))

          md = []
          md.append("# 🧪 Resultado de tests - Lote 10A\n")
          md.append("| Carpeta | Estado | Duracion |")
          md.append("|---|---|---|")
          fallos = []
          sin_tests = []
          for ruta, code, dur, _ in resultados:
              if code == 0:
                  estado = "✅ OK"
              elif code == 5:
                  estado = "⏭️ SIN TESTS (omitida)"
                  sin_tests.append(ruta)
              else:
                  estado = "❌ FALLO"
                  fallos.append(ruta)
              md.append(f"| `{ruta}` | {estado} | {dur:.1f}s |")

          if sin_tests:
              md.append(f"\n## ⏭️ Carpetas sin tests de pytest ({len(sin_tests)})\n")
              for s in sin_tests:
                  md.append(f"- `{s}` (no contiene tests — no es fallo)")
              md.append("")

          if fallos:
              md.append(f"\n## 🔴 Detalle de fallos ({len(fallos)})\n")
              for ruta in fallos:
                  destino = logs / (ruta.replace('/', '__') + '.log')
                  completo = destino.read_text(errors='replace')
                  md.append(f"\n### ❌ {ruta}\n")
                  md.append("<details open><summary>Log completo</summary>\n")
                  md.append("```")
                  md.append(completo if completo.strip() else "(log vacio — posible crash sin salida)")
                  md.append("```")
                  md.append("</details>\n")
          else:
              md.append("\n## ✅ TODOS LOS TESTS EN VERDE\n")

          if summary:
              with open(summary, 'a') as fh:
                  fh.write("\n".join(md) + "\n")

          print("\n".join(md))
          if fallos:
              sys.exit(1)
          PY

      - name: Commit y push solo si esta verde
        run: |
          rm -rf pytest_logs
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "Lote 10A - fase 10 final - gobierno idempotencia y cierre (verde)"
            git push
          fi
