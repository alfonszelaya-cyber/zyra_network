                                  )
                              else:
                                  got = fn(
                                      "SELECT sale_id,"
                                      " producer_id, product,"
                                      " quantity, remaining,"
                                      " unit, buyer,"
                                      " offer_price, currency,"
                                      " status, created_at"
                                      " FROM"
                                      " agro_sales_plus"
                                      " ORDER BY created_at"
                                  )
                          except Exception:
                              got = None
                          if got:
                              return [dict(r) for r in got]
                  return []


              def offers_of_db(db, sale_id):
                  for name in ("query_all", "query", "fetchall"):
                      fn = getattr(db, name, None)
                      if callable(fn):
                          try:
                              got = fn(
