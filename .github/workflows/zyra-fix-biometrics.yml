name: "RED-2 v2: motor documentos (indice ligero) - metodos dentro de la clase (indent forzada) + rutas + tests"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso B1 - migracion v2 (tabla document_index, aditiva)"
        run: |
          python3 - <<'MGEOF'
          import ast
          from pathlib import Path
          p = Path(
              "shared_engines/network/"
              "document_exchange.py")
          t = p.read_text(encoding="utf-8")
          if "network_document_index" in t:
              print("SKIP migracion (ya presente)")
              raise SystemExit(0)
          VIEJO_M = (
              '            "CREATE INDEX'
              ' sigreq_signer"\n'
              '            " ON'
              ' signature_requests"\n'
              '            " (signer_zid,'
              ' status)",\n'
              "        ),\n"
              "    ),\n"
              ")\n"
          )
          cnt = t.count(VIEJO_M)
          assert cnt == 1, (
              "ancla migracion " + str(cnt))
          NUEVO_M = (
              '            "CREATE INDEX'
              ' sigreq_signer"\n'
              '            " ON'
              ' signature_requests"\n'
              '            " (signer_zid,'
              ' status)",\n'
              "        ),\n"
              "    ),\n"
              "    Migration(\n"
              "        2,\n"
              '        "network_document_index",\n'
              "        (\n"
              '            "CREATE TABLE IF NOT'
              ' EXISTS document_index ("\n'
              '            " document_id TEXT'
              ' PRIMARY KEY, owner_zid TEXT'
              ' NOT NULL,"\n'
              '            " title TEXT NOT'
              ' NULL, sha256 TEXT NOT'
              ' NULL,"\n'
              '            " doc_kind TEXT NOT'
              ' NULL, purpose TEXT NOT NULL,'
              ' storage_ref TEXT NOT'
              ' NULL,"\n'
              '            " prev_version'
              ' TEXT, created_at REAL NOT'
              ' NULL)",\n'
              '            "CREATE INDEX IF NOT'
              ' EXISTS docidx_owner ON'
              ' document_index (owner_zid,'
              ' created_at)",\n'
              "        ),\n"
              "    ),\n"
              ")\n"
          )
          t = t.replace(VIEJO_M, NUEVO_M, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK migracion v2 (AST valido)")
          MGEOF

      - name: "Paso B2 - metodos APPEND al final del archivo con indent FORZADA a 4 (dentro de la clase, verificado al instante)"
        run: |
          python3 - <<'DEXEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/network/"
              "document_exchange.py")
          t = p.read_text(encoding="utf-8")
          if "def register_document(" in t:
              print("SKIP metodos (ya presentes)")
              raise SystemExit(0)
          CUERPO = textwrap.dedent('''\
              def register_document(
                  self,
                  *,
                  owner_zid: str,
                  title: str,
                  content: bytes,
                  doc_kind: str,
                  purpose: str,
                  storage_ref: str,
                  actor_app: str,
                  prev_version: str | None = None,
              ) -> dict[str, object]:
                  """AX-DOCS v2: sella e indexa
                  SIN guardar contenido en la
                  Red (ligera: hash + firma +
                  metadata + storage_ref)."""
                  require_non_empty_str(
                      owner_zid, "owner_zid")
                  require_non_empty_str(
                      title, "title")
                  require_non_empty_str(
                      doc_kind, "doc_kind")
                  self._require_app(actor_app)
                  if not content:
                      raise ValueError(
                          "content required")
                  sealed = self.seal_document(
                      owner_zid=owner_zid,
                      title=title,
                      content=content,
                      actor_app=actor_app,
                  )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " document_index"
                          " (document_id,"
                          " owner_zid, title,"
                          " sha256, doc_kind,"
                          " purpose,"
                          " storage_ref,"
                          " prev_version,"
                          " created_at)"
                          " VALUES (?, ?, ?, ?,"
                          " ?, ?, ?, ?, ?)",
                          (
                              sealed.document_id,
                              owner_zid,
                              title,
                              sealed.sha256,
                              doc_kind,
                              purpose,
                              storage_ref,
                              prev_version,
                              now,
                          ),
                      )
                      self._emit(
                          cursor,
                          event_type=(
                              "network.document"
                              ".registered"),
                          aggregate=(
                              sealed.document_id),
                          payload={
                              "owner": owner_zid,
                              "kind": doc_kind,
                              "purpose": purpose,
                          },
                      )
                  self._audit.append(
                      event_type=(
                          "network.document"
                          ".registered"),
                      actor=actor_app,
                      subject=sealed.document_id,
                      payload={"kind": doc_kind},
                  )
                  return {
                      "document_id": (
                          sealed.document_id),
                      "sha256": sealed.sha256,
                      "doc_kind": doc_kind,
                      "purpose": purpose,
                      "storage_ref": storage_ref,
                      "prev_version": prev_version,
                      "network_signature": (
                          sealed.network_signature),
                      "public_pem": (
                          sealed.public_pem),
                      "proof_id": sealed.proof_id,
                  }

              def list_documents(
                  self,
                  *,
                  owner_zid: str,
                  kind: str | None = None,
                  purpose: str | None = None,
              ) -> tuple[dict[str, object], ...]:
                  """AX-DOCS v2: el FILTRO
                  (solo indice, sin contenido)."""
                  require_non_empty_str(
                      owner_zid, "owner_zid")
                  sql = (
                      "SELECT document_id,"
                      " owner_zid, title, sha256,"
                      " doc_kind, purpose,"
                      " storage_ref,"
                      " prev_version, created_at"
                      " FROM document_index"
                      " WHERE owner_zid = ?"
                  )
                  params: list[object] = [
                      owner_zid]
                  if kind:
                      sql += " AND doc_kind = ?"
                      params.append(kind)
                  if purpose:
                      sql += " AND purpose = ?"
                      params.append(purpose)
                  sql += " ORDER BY created_at"
                  rows = self._db.query_all(
                      sql, tuple(params))
                  return tuple(
                      {
                          "document_id": str(
                              r["document_id"]),
                          "owner_zid": str(
                              r["owner_zid"]),
                          "title": str(
                              r["title"]),
                          "sha256": str(
                              r["sha256"]),
                          "doc_kind": str(
                              r["doc_kind"]),
                          "purpose": str(
                              r["purpose"]),
                          "storage_ref": str(
                              r["storage_ref"]),
                          "prev_version": (
                              str(
                                  r["prev_version"])
                              if r["prev_version"]
                              is not None
                              else None),
                          "created_at": float(
                              r["created_at"]),
                      }
                      for r in rows
                  )

              def new_version_index(
                  self,
                  *,
                  document_id: str,
                  content: bytes,
                  doc_kind: str,
                  purpose: str,
                  storage_ref: str,
                  actor_app: str,
                  title: str | None = None,
              ) -> dict[str, object]:
                  """AX-DOCS v2: modificar =
                  anexar version encadenada
                  (la v1 queda verificable)."""
                  require_non_empty_str(
                      document_id,
                      "document_id")
                  prev = self._db.query_one(
                      "SELECT owner_zid, title"
                      " FROM document_index"
                      " WHERE document_id = ?",
                      (document_id,),
                  )
                  if prev is None:
                      raise ValueError(
                          "unknown document: "
                          + document_id)
                  owner = str(
                      prev["owner_zid"])
                  real_title = (
                      title
                      if title
                      else str(prev["title"]))
                  return self.register_document(
                      owner_zid=owner,
                      title=real_title,
                      content=content,
                      doc_kind=doc_kind,
                      purpose=purpose,
                      storage_ref=storage_ref,
                      actor_app=actor_app,
                      prev_version=document_id,
                  )
          ''')
          METODOS = textwrap.indent(
              CUERPO, "    ")
          t = (t.rstrip("\n") + "\n\n"
               + METODOS.rstrip("\n") + "\n")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          from (  # noqa
              shared_engines.network
              .document_exchange)
          DEXEOF

      - name: "Paso B3 - verificacion dura inmediata: TODOS los metodos viejos y nuevos son atributos de la clase"
        run: |
          python3 -c "
          from shared_engines.network.document_exchange import DocumentExchange
          viejos = ('seal_document', 'verify_document',
                    'offline_verify', 'request_signature',
                    'sign_request', 'reject_request',
                    'get_request', 'pending_for',
                    'verify_signature_receipt', 'get_sealed')
          nuevos = ('register_document', 'list_documents',
                    'new_version_index')
          for m in viejos:
              assert hasattr(DocumentExchange, m), 'VIEJO perdido: ' + m
          for m in nuevos:
              assert hasattr(DocumentExchange, m), 'NUEVO falta: ' + m
          print('OK clase intacta + 3 metodos nuevos dentro de la clase')
          "

      - name: "Paso C - capabilities_api.py: rutas (aditivas) + asserts corregidos"
        run: |
          python3 - <<'RTEOF'
          import ast
          from pathlib import Path
          q = Path(
              "shared_engines/runtime/"
              "capabilities_api.py")
          tq = q.read_text(encoding="utf-8")
          if 's[1] == "list"' in tq:
              print("SKIP rutas (ya presentes)")
              raise SystemExit(0)
          ig = tq.find("def _route_get(")
          assert ig >= 0
          ic = tq.find(
              "caps = type(self).caps", ig)
          assert ic > ig
          le = tq.find("\n", ic) + 1
          GET_ROUTE = (
              "        if (\n"
              "            len(s) == 3\n"
              "            and s[0] == \"documents\"\n"
              "            and s[1] == \"list\"\n"
              "        ):\n"
              "            kind_q = \"\"\n"
              "            purpose_q = \"\"\n"
              "            if query:\n"
              "                kind_q = (\n"
              "                    query.get(\"kind\")\n"
              "                    or [\"\"]\n"
              "                )[0]\n"
              "                purpose_q = (\n"
              "                    query.get(\"purpose\")\n"
              "                    or [\"\"]\n"
              "                )[0]\n"
              "            docs = (\n"
              "                caps.exchange\n"
              "                .list_documents(\n"
              "                    owner_zid=s[2],\n"
              "                    kind=(\n"
              "                        kind_q\n"
              "                        or None),\n"
              "                    purpose=(\n"
              "                        purpose_q\n"
              "                        or None),\n"
              "                )\n"
              "            )\n"
              "            self._ok(docs)\n"
              "            return\n"
          )
          tq = tq[:le] + GET_ROUTE + tq[le:]
          print("OK GET /documents/list/{zid}")
          marker = (
              'if s == ["documents", "seal"]:'
          )
          idx = tq.find(marker)
          assert idx >= 0, "ancla documents/seal"
          ls = tq.rfind("\n", 0, idx) + 1
          IND = tq[ls:idx]
          assert IND.strip() == ""
          POST_ROUTE = (
              IND
              + 'if s == ["documents", "register"]:\n'
              + IND + "    import base64 as _b64\n"
              + IND + "    ex = ("
              "type(self).caps.exchange)\n"
              + IND + "    rec = ("
              "ex.register_document(\n"
              + IND + "        owner_zid="
              "self._req(\n"
              + IND + "            doc,"
              " \"owner_zid\"),\n"
              + IND + "        title="
              "self._req(doc, \"title\"),\n"
              + IND + "        content="
              "_b64.b64decode(\n"
              + IND + "            self._req("
              "doc, \"content_b64\")),\n"
              + IND + "        doc_kind="
              "self._req(doc, \"doc_kind\"),\n"
              + IND + "        purpose=str("
              "doc.get(\"purpose\") or \"\"),\n"
              + IND + "        storage_ref=str(\n"
              + IND + "            doc.get("
              "\"storage_ref\") or \"\"),\n"
              + IND + "        actor_app="
              "self._req(doc, \"actor_app\"),\n"
              + IND + "        prev_version=(\n"
              + IND + "            str("
              "doc[\"prev_version\"])\n"
              + IND + "            if doc.get("
              "\"prev_version\")\n"
              + IND + "            else None\n"
              + IND + "        ),\n"
              + IND + "    ))\n"
              + IND + "    self._send(\n"
              + IND + "        201,\n"
              + IND + "        {\n"
              + IND + "            \"ok\": True,\n"
              + IND + "            \"data\": {\n"
              + IND + "                \"document_id\":"
              " rec[\"document_id\"],\n"
              + IND + "                \"sha256\":"
              " rec[\"sha256\"],\n"
              + IND + "                \"doc_kind\":"
              " rec[\"doc_kind\"],\n"
              + IND + "                \"purpose\":"
              " rec[\"purpose\"],\n"
              + IND + "                \"storage_ref\":"
              " rec[\"storage_ref\"],\n"
              + IND + "                \"prev_version\":"
              " rec[\"prev_version\"],\n"
              + IND + "            },\n"
              + IND + "        },\n"
              + IND + "    )\n"
              + IND + "    return\n"
          )
          tq = tq[:ls] + POST_ROUTE + tq[ls:]
          print("OK POST /documents/register")
          ast.parse(tq)
          q.write_text(tq, encoding="utf-8")
          tq2 = q.read_text(encoding="utf-8")
          assert '"documents", "register"' in tq2
          assert 's[1] == "list"' in tq2
          assert 's[0] == "documents"' in tq2
          assert ('if s == ["documents", "seal"]:'
                  in tq2)
          assert ('if s == ["documents", "verify"]:'
                  in tq2)
          print("OK rutas (AST valido; seal/verify"
                " intactas)")
          RTEOF

      - name: "Paso D - tests nuevos (aditivos al final)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/network/tests/"
              "test_document_exchange.py")
          t = p.read_text(encoding="utf-8")
          if ("test_register_list_filter"
                  "_and_versions" in t):
              print("SKIP tests (ya presentes)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_register_list_filter_and_versions(
                  tmp_path: Path,
              ) -> None:
                  """AX-DOCS v2: registrar,
                  filtrar, versionar; verificacion
                  intacta; Red solo indice."""
                  import hashlib as _hl
                  net = _Net(tmp_path)
                  try:
                      net.profiles.register_app(
                          app_id="marketplace",
                          display_name="Market",
                          scopes=(
                              "display_name",),
                      )
                      owner = (
                          net.identity
                          .register_identity(
                              kind=(
                                  IdentityKind
                                  .PERSON),
                              display_name=(
                                  "docowner"),
                              actor=(
                                  "marketplace"),
                          )
                      )
                      contenido = (
                          b"FACTURA-PDF-001")
                      rec = (
                          net.exchange
                          .register_document(
                              owner_zid=(
                                  owner.zid),
                              title="Factura 001",
                              content=contenido,
                              doc_kind="pdf",
                              purpose=(
                                  "factura-"
                                  "hacienda"),
                              storage_ref=(
                                  "nexo://"
                                  "facturas/001"),
                              actor_app=(
                                  "marketplace"),
                          )
                      )
                      assert rec[
                          "document_id"
                      ].startswith("DOC-")
                      assert rec["sha256"] == (
                          _hl.sha256(
                              contenido
                          ).hexdigest())
                      docs = (
                          net.exchange
                          .list_documents(
                              owner_zid=(
                                  owner.zid))
                      )
                      assert len(docs) == 1
                      assert docs[0][
                          "doc_kind"] == "pdf"
                      assert docs[0][
                          "purpose"
                      ] == "factura-hacienda"
                      assert docs[0][
                          "storage_ref"
                      ] == "nexo://facturas/001"
                      assert (
                          net.exchange
                          .list_documents(
                              owner_zid=(
                                  owner.zid),
                              purpose="otro",
                          ) == ()
                      )
                      assert (
                          net.exchange
                          .list_documents(
                              owner_zid=(
                                  owner.zid),
                              kind="word",
                          ) == ()
                      )
                      v = (
                          net.exchange
                          .verify_document(
                              document_id=(
                                  rec[
                                      "document_id"]),
                              content=contenido,
                          )
                      )
                      assert v.authentic is True
                      v2 = (
                          net.exchange
                          .new_version_index(
                              document_id=(
                                  rec[
                                      "document_id"]),
                              content=(
                                  b"FACTURA-"
                                  b"PDF-001-v2"),
                              doc_kind="pdf",
                              purpose=(
                                  "factura-"
                                  "hacienda"),
                              storage_ref=(
                                  "nexo://"
                                  "facturas/001"
                                  "/v2"),
                              actor_app=(
                                  "marketplace"),
                          )
                      )
                      assert v2["prev_version"] == (
                          rec["document_id"])
                      docs = (
                          net.exchange
                          .list_documents(
                              owner_zid=(
                                  owner.zid))
                      )
                      assert len(docs) == 2
                      v2check = (
                          net.exchange
                          .verify_document(
                              document_id=v2[
                                  "document_id"],
                              content=(
                                  b"FACTURA-"
                                  b"PDF-001-v2"),
                          )
                      )
                      assert (
                          v2check.authentic is True)
                      v1check = (
                          net.exchange
                          .verify_document(
                              document_id=(
                                  rec[
                                      "document_id"]),
                              content=contenido,
                          )
                      )
                      assert (
                          v1check.authentic is True)
                  finally:
                      net.close()


              def test_register_unauthorized_app(
                  tmp_path: Path,
              ) -> None:
                  """AX-DOCS v2: app no registrada
                  -> rechazada; indice vacio."""
                  net = _Net(tmp_path)
                  try:
                      net.profiles.register_app(
                          app_id="marketplace",
                          display_name="Market",
                          scopes=(
                              "display_name",),
                      )
                      owner = (
                          net.identity
                          .register_identity(
                              kind=(
                                  IdentityKind
                                  .PERSON),
                              display_name="o2",
                              actor=(
                                  "marketplace"),
                          )
                      )
                      with pytest.raises(
                          PermissionError
                      ):
                          net.exchange.register_document(
                              owner_zid=(
                                  owner.zid),
                              title="X",
                              content=b"y",
                              doc_kind="json",
                              purpose="p",
                              storage_ref="ref",
                              actor_app="malware",
                          )
                      assert (
                          net.exchange
                          .list_documents(
                              owner_zid=(
                                  owner.zid))
                          == ()
                      )
                  finally:
                      net.close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert ("test_register_list_filter"
                  "_and_versions" in final)
          assert ("test_register_unauthorized"
                  "_app" in final)
          print("OK tests AX-DOCS (AST valido)")
          TSEOF

      - name: "Paso E - import fresco completo"
        run: |
          python3 -c "
          from shared_engines.network.document_exchange import DocumentExchange
          for m in ('register_document', 'list_documents', 'new_version_index',
                    'seal_document', 'verify_document', 'request_signature',
                    'sign_request', 'reject_request', 'pending_for'):
              assert hasattr(DocumentExchange, m), m
          src = open('shared_engines/runtime/capabilities_api.py').read()
          assert 's[1] == \"list\"' in src
          assert '\"documents\", \"register\"' in src
          print('OK import fresco: v2 completa, clase intacta, rutas cableadas')
          "

      - name: "Paso F - GATE Red (shared_engines completo)"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -10

      - name: "Paso G - GATE apps (4 apps)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso H - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-2 v2"
            echo '```'
            python3 -m pytest shared_engines/network/tests/test_document_exchange.py -vv --tb=long 2>&1 | tail -70 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-2: motor transversal de documentos v2 (indice ligero)" -m "La Red transporta confianza, no carga: document_index (migration v2) guarda solo document_id/owner/title/sha256/doc_kind/purpose/storage_ref/prev_version - el contenido vive en el almacen de la app de origen. Metodos aditivos en DocumentExchange (agregados al final de la clase con indent forzada - fix del intento anterior que los puso a nivel modulo y anido los metodos originales): register_document (sella con seal_document v1 intacto + indexa), list_documents (el FILTRO owner/kind/purpose), new_version_index (modificar = anexar version encadenada). HTTP: POST /documents/register + GET /documents/list/{zid}?kind=&purpose=. Verificacion dura inmediata: todos los metodos viejos y nuevos como atributos de la clase. Tests: filtro+versiones+app no registrada."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
