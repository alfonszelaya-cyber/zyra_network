name: ZYRA LABORATORIO - Lote 4Ab (Fase 4 - test de espectador corregido)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar y aplicar lote (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_4a.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          reemplazar_verificado() {
            ruta="$1"; firma="$2"
            if [ ! -s "$ruta" ]; then
              echo "FALLO: $ruta no existe para reemplazo verificado"; exit 1
            fi
            if ! grep -qF "$firma" "$ruta"; then
              echo "FALLO: firma ausente en $ruta (contenido inesperado, NO se toca)"; exit 1
            fi
            cat > "$ruta"
            echo "REEMPLAZADO-VERIFICADO: $ruta"
            echo "$ruta|REEMPLAZADO" >> "$MANIFEST"
          }
          mkdir -p apps/laboratorio/domain apps/laboratorio/infrastructure/persistence apps/laboratorio/infrastructure/repositories apps/laboratorio/infrastructure/providers apps/laboratorio/application/commands apps/laboratorio/application/use_cases apps/laboratorio/application/handlers apps/laboratorio/routers/api apps/laboratorio/modules apps/laboratorio/templates/dashboards
          echo "=== ANCLAS: app.py y service_registry.py ==="
          python3 - << 'PYANCHOR'
          from pathlib import Path
          p = Path("apps/laboratorio/infrastructure/api/app.py")
          codigo = p.read_text(encoding="utf-8")
          ancla1 = "from apps.laboratorio.routers.public.health import registrar_rutas as registrar_salud"
          ancla2 = "registrar_salud(app)"
          assert ancla1 in codigo and ancla2 in codigo, "anclas ausentes en app.py"
          if "conectar_cuatro_d(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.world4d_module import conectar as conectar_cuatro_d")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_cuatro_d(app)")
              p.write_text(codigo, encoding="utf-8")
              print("app.py: world4d conectado")
          else:
              print("app.py: ya contenia world4d")
          p2 = Path("apps/laboratorio/registry/services/service_registry.py")
          c2 = p2.read_text(encoding="utf-8")
          a_imp = "from apps.laboratorio.application.handlers.library_handler import ManejadorBiblioteca"
          assert a_imp in c2, "ancla import ausente en service_registry.py"
          if "manejador_cuatro_d" not in c2:
              nuevos_imp = (
                  "from apps.laboratorio.application.handlers.world4d_handler import ManejadorCuatroD\n"
                  "from apps.laboratorio.application.use_cases.world4d import (\n"
                  "    CasoCrearLineaTiempo,\n"
                  "    CasoCrearProgramaLuz,\n"
                  "    CasoCrearInteraccion,\n"
                  ")\n"
                  "from apps.laboratorio.infrastructure.providers.naked3d_engine import MotorNaked3D\n"
                  "from apps.laboratorio.infrastructure.providers.hologram_engine import MotorHolograma\n"
                  "from apps.laboratorio.infrastructure.providers.oligram_engine import MotorOligrama\n"
                  "from apps.laboratorio.infrastructure.persistence.timeline_store import TimelineStore\n"
                  "from apps.laboratorio.infrastructure.persistence.lighting_store import LightingStore\n"
                  "from apps.laboratorio.infrastructure.persistence.interaction_store import InteractionStore\n"
                  "from apps.laboratorio.infrastructure.repositories.timeline_repository import TimelineRepository\n"
                  "from apps.laboratorio.infrastructure.repositories.lighting_repository import LightingRepository\n"
                  "from apps.laboratorio.infrastructure.repositories.interaction_repository import InteractionRepository\n"
              )
              c2 = c2.replace(a_imp, nuevos_imp + a_imp)
              a_reg = '    c.obtener("suscriptor_zyra")'
              assert a_reg in c2, "ancla registro ausente"
              nuevos_reg = (
                  '    c.registrar("timeline_store", lambda _c: TimelineStore(conexion))\n'
                  '    c.registrar("lighting_store", lambda _c: LightingStore(conexion))\n'
                  '    c.registrar("interaction_store", lambda _c: InteractionStore(conexion))\n'
                  '    c.registrar("repo_timelines", lambda _c: TimelineRepository(_c.obtener("timeline_store")))\n'
                  '    c.registrar("repo_luces", lambda _c: LightingRepository(_c.obtener("lighting_store")))\n'
                  '    c.registrar("repo_interacciones", lambda _c: InteractionRepository(_c.obtener("interaction_store")))\n'
                  '    c.registrar("motor_naked3d", lambda _c: MotorNaked3D())\n'
                  '    c.registrar("motor_holograma", lambda _c: MotorHolograma())\n'
                  '    c.registrar("motor_oligrama", lambda _c: MotorOligrama())\n'
                  '    c.registrar("caso_timeline", lambda _c: CasoCrearLineaTiempo(_c.obtener("repo_timelines"), _c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_luz", lambda _c: CasoCrearProgramaLuz(_c.obtener("repo_luces"), _c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_interaccion", lambda _c: CasoCrearInteraccion(_c.obtener("repo_interacciones"), _c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_cuatro_d", lambda _c: ManejadorCuatroD(_c.obtener("caso_timeline"), _c.obtener("caso_luz"), _c.obtener("caso_interaccion"), _c.obtener("repo_timelines"), _c.obtener("repo_luces"), _c.obtener("repo_interacciones"), _c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
              )
              c2 = c2.replace(a_reg, nuevos_reg + a_reg)
              p2.write_text(c2, encoding="utf-8")
              print("service_registry.py ACTUALIZADO: 10 servicios de Fase 4")
          else:
              print("service_registry.py: ya contenia Fase 4")
          PYANCHOR
          echo "apps/laboratorio/infrastructure/api/app.py|ACTUALIZADO" >> "$MANIFEST"
          echo "apps/laboratorio/registry/services/service_registry.py|ACTUALIZADO" >> "$MANIFEST"
          echo "=== ESCENA CON PROFUNDIDAD (reemplazo verificado) ==="
          reemplazar_verificado apps/laboratorio/domain/scene.py "FORMAS_VALIDAS" << 'ZYRA_EOF'
          """Escena 3D con PROFUNDIDAD: capas fondo/medio/frente (canal 4D).

          Arquitectura invertida: primero el mundo (SCENE/WORLD), despues
          el render y el destino. Cada objeto declara su capa de
          profundidad; los motores naked3d usan las capas para el parallax.
          """
          import re
          from dataclasses import dataclass, field
          from typing import List

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          PATRON_HEX = re.compile(r"^#[0-9A-Fa-f]{6}$")
          FORMAS_VALIDAS = ("rect", "circle", "texto")
          CAPAS_VALIDAS = ("fondo", "medio", "frente")
          MIN_DIM = 16
          MAX_DIM = 4096
          MAX_OBJETOS = 200


          @dataclass
          class Escena3D(EntidadBase):
              """Mundo con objetos y capas de profundidad."""

              prefijo_id = "scn"

              proyecto_id: Identificador = None
              nombre: str = ""
              ancho: int = 800
              alto: int = 600
              objetos: List[dict] = field(default_factory=list)

              def __post_init__(self):
                  if self.proyecto_id is None:
                      raise ValueError("La escena requiere el id de su proyecto.")
                  if not self.nombre.strip():
                      raise ValueError("La escena requiere nombre.")
                  self.nombre = self.nombre.strip()
                  if not (MIN_DIM <= self.ancho <= MAX_DIM):
                      raise ValueError("ancho fuera de rango 16-4096.")
                  if not (MIN_DIM <= self.alto <= MAX_DIM):
                      raise ValueError("alto fuera de rango 16-4096.")

              def agregar_objeto(self, objeto: dict) -> dict:
                  """Agrega un objeto validado con su capa de profundidad."""
                  if not isinstance(objeto, dict):
                      raise ValueError("El objeto debe ser un objeto JSON.")
                  forma = str(objeto.get("forma", "")).strip().lower()
                  if forma not in FORMAS_VALIDAS:
                      raise ValueError(
                          "Forma no soportada: " + repr(forma)
                          + ". Validas: " + ", ".join(FORMAS_VALIDAS)
                      )
                  color = str(objeto.get("color", "#64748B")).strip()
                  if not PATRON_HEX.match(color):
                      raise ValueError("Color invalido: " + repr(color))
                  capa = str(objeto.get("capa", "medio")).strip().lower()
                  if capa not in CAPAS_VALIDAS:
                      raise ValueError(
                          "Capa de profundidad invalida: " + repr(capa)
                          + ". Validas: " + ", ".join(CAPAS_VALIDAS)
                      )
                  limpio = {"forma": forma, "color": color, "capa": capa}
                  try:
                      if forma == "rect":
                          limpio.update(
                              x=float(objeto.get("x", 0)), y=float(objeto.get("y", 0)),
                              w=float(objeto.get("w", 10)), h=float(objeto.get("h", 10)),
                          )
                          if limpio["w"] <= 0 or limpio["h"] <= 0:
                              raise ValueError("rect requiere w y h positivos.")
                      elif forma == "circle":
                          limpio.update(
                              cx=float(objeto.get("cx", 0)), cy=float(objeto.get("cy", 0)),
                              r=float(objeto.get("r", 10)),
                          )
                          if limpio["r"] <= 0:
                              raise ValueError("circle requiere r positivo.")
                      else:
                          contenido = str(objeto.get("contenido", "")).strip()
                          if not contenido:
                              raise ValueError("texto requiere contenido.")
                          limpio.update(
                              x=float(objeto.get("x", 0)), y=float(objeto.get("y", 20)),
                              contenido=contenido[:300],
                          )
                  except (TypeError, ValueError) as exc:
                      if any(p in str(exc) for p in ("rect", "circle", "texto", "Capa")):
                          raise
                      raise ValueError("Coordenadas del objeto invalidas.") from exc
                  if len(self.objetos) >= MAX_OBJETOS:
                      raise ValueError("La escena alcanzo el maximo de " + str(MAX_OBJETOS) + " objetos.")
                  self.objetos.append(limpio)
                  self.marcar_actualizacion()
                  return limpio

              def objetos_por_capa(self) -> dict:
                  """Agrupa los objetos por capa de profundidad."""
                  grupos = {"fondo": [], "medio": [], "frente": []}
                  for obj in self.objetos:
                      grupos.get(obj.get("capa", "medio"), grupos["medio"]).append(obj)
                  return grupos

              @property
              def es_renderizable(self) -> bool:
                  return len(self.objetos) > 0

              def a_especificacion(self) -> dict:
                  """Especificacion que consume el MotorRenderSVG (puerto real)."""
                  return {
                      "ancho": self.ancho, "alto": self.alto,
                      "fondo": "#0F172A", "objetos": list(self.objetos),
                  }
          ZYRA_EOF
          echo "=== ARTEFACTO CON 7 FORMATOS (reemplazo verificado) ==="
          reemplazar_verificado apps/laboratorio/domain/artifact.py "FORMATOS_GENERACION" << 'ZYRA_EOF'
          """Artefacto: entregable generado desde una escena.

          Fase 4: ademas de imagen, pagina, modelo y animacion, se generan
          naked3d (pantalla 3D sin lentes), holograma y oligrama. Ningun
          artefacto finge: el video_mp4 llega en fase 6.
          """
          from dataclasses import dataclass

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          FORMATOS_GENERACION = (
              "imagen", "pagina", "modelo", "animacion",
              "naked3d", "holograma", "oligrama",
          )
          MIME_POR_FORMATO = {
              "imagen": "image/svg+xml",
              "pagina": "text/html; charset=utf-8",
              "modelo": "application/json",
              "animacion": "image/svg+xml",
              "naked3d": "image/svg+xml",
              "holograma": "image/svg+xml",
              "oligrama": "image/svg+xml",
          }


          @dataclass
          class Artefacto(EntidadBase):
              """Salida real y descargable de una escena."""

              prefijo_id = "art"

              proyecto_id: Identificador = None
              escena_id: Identificador = None
              nombre: str = ""
              formato: str = ""
              contenido: str = ""
              hash_sha256: str = ""
              tamano_bytes: int = 0

              def __post_init__(self):
                  if self.proyecto_id is None or self.escena_id is None:
                      raise ValueError("El artefacto requiere proyecto_id y escena_id.")
                  if not self.nombre.strip():
                      raise ValueError("El artefacto requiere nombre.")
                  self.nombre = self.nombre.strip()
                  if self.formato not in FORMATOS_GENERACION:
                      raise ValueError(
                          "Formato de generacion invalido: " + repr(self.formato)
                          + ". Validos: " + ", ".join(FORMATOS_GENERACION)
                      )

              @property
              def mime(self) -> str:
                  """MIME oficial del formato del artefacto."""
                  return MIME_POR_FORMATO[self.formato]
          ZYRA_EOF
          echo "=== DOMINIO 4D (3) ==="
          escribir apps/laboratorio/domain/timeline.py << 'ZYRA_EOF'
          """Linea de tiempo: el eje TIEMPO del 4D.

          Una linea por escena con pistas y keyframes validados. Los
          keyframes van en segundos crecientes; el motor de render los
          consume para animar objetos reales.
          """
          from dataclasses import dataclass, field

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          PROPIEDADES = ("posicion", "rotacion", "escala", "visibilidad", "opacidad", "color")
          MAX_DURACION = 3600.0
          MAX_KEYFRAMES = 500


          @dataclass
          class LineaTiempo(EntidadBase):
              """Eje temporal de una escena."""

              prefijo_id = "tln"

              escena_id: Identificador = None
              duracion_s: float = 10.0
              fps: int = 30
              pistas: list = field(default_factory=list)

              def __post_init__(self):
                  if self.escena_id is None:
                      raise ValueError("La linea de tiempo requiere su escena.")
                  if not (0.1 <= float(self.duracion_s) <= MAX_DURACION):
                      raise ValueError("duracion_s fuera de rango 0.1-3600.")
                  if not (1 <= int(self.fps) <= 120):
                      raise ValueError("fps fuera de rango 1-120.")
                  self.duracion_s = float(self.duracion_s)
                  self.fps = int(self.fps)

              def agregar_pista(self, objetivo: str, propiedad: str, keyframes: list) -> dict:
                  """Agrega una pista con keyframes validados."""
                  if not objetivo or not str(objetivo).strip():
                      raise ValueError("La pista requiere objetivo.")
                  if propiedad not in PROPIEDADES:
                      raise ValueError(
                          "Propiedad invalida: " + repr(propiedad)
                          + ". Validas: " + ", ".join(PROPIEDADES)
                      )
                  if not isinstance(keyframes, list) or not keyframes:
                      raise ValueError("La pista requiere al menos un keyframe.")
                  limpios = []
                  previo = -1.0
                  for kf in keyframes:
                      if not isinstance(kf, dict):
                          raise ValueError("Cada keyframe debe ser un objeto.")
                      t = float(kf.get("t", -1))
                      if not (0.0 <= t <= self.duracion_s):
                          raise ValueError(
                              "Keyframe t fuera de la duracion: " + str(t)
                          )
                      if t <= previo:
                          raise ValueError("Los keyframes deben ir en tiempo creciente.")
                      previo = t
                      valor = kf.get("valor", "")
                      if isinstance(valor, (dict, list)):
                          raise ValueError("El valor del keyframe debe ser escalar o texto.")
                      limpios.append({"t": round(t, 3), "valor": str(valor)[:100]})
                  if len(limpios) > MAX_KEYFRAMES:
                      raise ValueError("Maximo " + str(MAX_KEYFRAMES) + " keyframes por pista.")
                  pista = {
                      "objetivo": str(objetivo).strip()[:120],
                      "propiedad": propiedad,
                      "keyframes": limpios,
                  }
                  self.pistas.append(pista)
                  self.marcar_actualizacion()
                  return pista

              @property
              def total_keyframes(self) -> int:
                  return sum(len(p["keyframes"]) for p in self.pistas)
          ZYRA_EOF
          escribir apps/laboratorio/domain/lighting.py << 'ZYRA_EOF'
          """Programa de luz: el eje LUZ del 4D.

          Pasos temporales (t, color, intensidad) que los motores aplican
          al render. Regla de produccion: intensidad 0.0-1.0, color HEX.
          """
          import re
          from dataclasses import dataclass, field

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          PATRON_HEX = re.compile(r"^#[0-9A-Fa-f]{6}$")
          MAX_PASOS = 200


          @dataclass
          class ProgramaLuz(EntidadBase):
              """Programa temporal de iluminacion de una escena."""

              prefijo_id = "luz"

              escena_id: Identificador = None
              pasos: list = field(default_factory=list)
              ambientar_fondo: bool = False

              def __post_init__(self):
                  if self.escena_id is None:
                      raise ValueError("El programa de luz requiere su escena.")

              def agregar_paso(self, t: float, color: str, intensidad: float) -> dict:
                  """Agrega un paso validado (tiempo creciente)."""
                  t = float(t)
                  if not (0.0 <= t <= 3600.0):
                      raise ValueError("t fuera de rango 0-3600.")
                  color = str(color).strip()
                  if not PATRON_HEX.match(color):
                      raise ValueError("Color de luz invalido: " + repr(color))
                  intensidad = float(intensidad)
                  if not (0.0 <= intensidad <= 1.0):
                      raise ValueError("La intensidad debe estar entre 0.0 y 1.0.")
                  if self.pasos and t <= float(self.pasos[-1]["t"]):
                      raise ValueError("Los pasos deben ir en tiempo creciente.")
                  if len(self.pasos) >= MAX_PASOS:
                      raise ValueError("Maximo " + str(MAX_PASOS) + " pasos.")
                  paso = {"t": round(t, 3), "color": color, "intensidad": round(intensidad, 3)}
                  self.pasos.append(paso)
                  self.marcar_actualizacion()
                  return paso

              @property
              def color_dominate(self) -> str:
                  """Color del paso con mayor intensidad (o blanco si vacio)."""
                  if not self.pasos:
                      return "#FFFFFF"
                  mejor = max(self.pasos, key=lambda p: p["intensidad"])
                  return mejor["color"]
          ZYRA_EOF
          escribir apps/laboratorio/domain/interaction.py << 'ZYRA_EOF'
          """Zona de interaccion: el eje INTERACCION del 4D.

          Areas rectangulares de la escena que responden a acciones del
          usuario (clic, seleccion, zona). Coordenadas dentro del lienzo.
          """
          from dataclasses import dataclass, field

          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador

          ACCIONES = ("clic", "seleccion", "zona", "formulario", "camara")
          MAX_ZONAS_POR_ESCENA = 50


          @dataclass
          class ZonaInteraccion(EntidadBase):
              """Una zona interactiva de una escena."""

              prefijo_id = "int"

              escena_id: Identificador = None
              x: float = 0.0
              y: float = 0.0
              w: float = 100.0
              h: float = 100.0
              accion: str = "clic"
              titulo: str = ""

              def __post_init__(self):
                  if self.escena_id is None:
                      raise ValueError("La interaccion requiere su escena.")
                  for campo in ("x", "y", "w", "h"):
                      valor = float(getattr(self, campo))
                      if valor < 0:
                          raise ValueError(campo + " no puede ser negativo.")
                      setattr(self, campo, valor)
                  if self.w <= 0 or self.h <= 0:
                      raise ValueError("w y h deben ser positivos.")
                  if self.accion not in ACCIONES:
                      raise ValueError(
                          "Accion invalida: " + repr(self.accion)
                          + ". Validas: " + ", ".join(ACCIONES)
                      )
                  if not self.titulo.strip():
                      raise ValueError("La interaccion requiere titulo.")
                  self.titulo = self.titulo.strip()[:200]
          ZYRA_EOF
          echo "=== BASE DE DATOS V4 (reemplazos verificados) ==="
          reemplazar_verificado apps/laboratorio/infrastructure/database/tables.py "CREATE TABLE IF NOT EXISTS lab_projects (" << 'ZYRA_EOF'
          """Esquema oficial de LABORATORIO: v1 a v4 (nucleo, fase 2, 3 y 4)."""
          ESQUEMA_V1 = """
          CREATE TABLE IF NOT EXISTS lab_schema_version (
              version INTEGER NOT NULL,
              aplicada_en TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lab_projects (
              id TEXT PRIMARY KEY,
              titulo TEXT NOT NULL,
              descripcion TEXT NOT NULL DEFAULT '',
