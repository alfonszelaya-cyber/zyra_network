name: ZYRA A4a mapa completo de acceso y menus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faseA4a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography

      - name: Validador ZID, proxy de superapp y prueba con cabecera correcta
        run: |
          python3 - <<'PYEOF'
          import json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseA4a.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _man

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def pedir(url, headers=None):
              req = urllib.request.Request(url)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=8) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, '', str(e)

          add('# A4a - MAPA DE ACCESO Y MENUS (solo lectura)')
          add('')

          add('## P1. Validador de ZID (formato que acepta el laboratorio)')
          add('')
          p = ROOT / 'apps' / 'laboratorio' / 'validators' / 'security' / 'zid_validator.py'
          if p.exists():
              add('```python')
              for i, l in enumerate(txt(p).splitlines()[:60]):
                  add('%d: %s' % (i + 1, l.rstrip()[:150]))
              add('```')
          else:
              add('- no encontrado en esa ruta')
          add('')

          add('## P2. Roles disponibles (que ve el espectador)')
          add('')
          p = ROOT / 'apps' / 'laboratorio' / 'constants' / 'roles' / 'role_codes.py'
          if p.exists():
              add('```python')
              for i, l in enumerate(txt(p).splitlines()[:40]):
                  add('%d: %s' % (i + 1, l.rstrip()[:150]))
              add('```')
          add('')

          add('## P3. Proxy de superapp.py (donde reenvia a las apps)')
          add('')
          ls = txt(ROOT / 'superapp.py').splitlines()
          hits = [(i + 1, l.strip()) for i, l in enumerate(ls)
                  if re.search(r'(?i)proxy|_reenviar|do_GET|do_POST|wfile|send_response|laboratorio|x-zyra', l)]
          add('%d lineas relevantes:' % len(hits))
          add('```python')
          for n, l in hits[:45]:
              add('%d: %s' % (n, l[:150]))
          add('```')
          add('')

          add('## P4. Experimento con la cabecera CORRECTA x-zyra-zid')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-a4', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-a4', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _c, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _c, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- sistema arriba: red=%s superapp=%s' % (vivo, spv))
          add('')
          ZID_PRUEBA = 'Z-PRUEBA-CI-0001'
          pruebas = [
              ('x-zyra-zid solo', {'x-zyra-zid': ZID_PRUEBA}),
              ('x-zyra-zid + espectador', {'x-zyra-zid': ZID_PRUEBA, 'x-zyra-roles': 'espectador'}),
              ('x-zyra-zid + ver', {'x-zyra-zid': ZID_PRUEBA, 'x-zyra-roles': 'ver'}),
          ]
          gano = None
          if spv:
              for nombre, hdr in pruebas:
                  st, ct, cuerpo = pedir(BSP + '/laboratorio/ui', hdr)
                  es_html = 'text/html' in ct.lower()
                  add('- %s -> %s (%s) %s' % (nombre, st, 'HTML' if es_html else 'no-html', 'ABRE' if (st == 200 and es_html) else ''))
                  if st == 200 and es_html and gano is None:
                      gano = (nombre, hdr)
          add('')
          if gano:
              add('**CABECERA QUE ABRE: %s**' % gano[0])
              add('')
              add('## P5. Menus reales de la UI (tarjetas funcionales para A4b)')
              add('')
              st, ct, cuerpo = pedir(BSP + '/laboratorio/ui', gano[1])
              ids = sorted(set(re.findall(r'/laboratorio/ui/([a-z0-9_\-]{2,40})', cuerpo)))
              add('- menu_id encontrados: %d' % len(ids))
              for i in ids[:30]:
                  add('  - %s' % i)
              DATA['menus'] = ids
              add('- bytes de la home UI: %d' % len(cuerpo))
          elif spv:
              add('- x-zyra-zid no abrio: el formato del ZID puede estar en P1 (validar_zid).')
          add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          DATA['cabecera'] = gano[0] if gano else None
          Path('faseA4a.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('A4a terminada. Cabecera:', gano[0] if gano else 'NINGUNA', '| menus:', len(DATA.get('menus', [])))
          PYEOF

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseA4a-zyra
          path: faseA4a.json
          if-no-files-found: ignore
