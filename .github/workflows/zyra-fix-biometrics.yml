          def pruebas_node(txt):
              m = re.search(r'/\* ZYRA-PURE v4 \(ini\) \*/(.*?)/\* ZYRA-PURE v4 \(fin\) \*/', txt, re.S)
              if not m:
                  return False, 0, ['no se encontro el bloque ZYRA-PURE v4 en superapp.py parcheado']
              pure = m.group(1)
              js = HARNESS.replace('/*ZYRA_PURE_AQUI*/', pure)
              ruta_js = os.path.join(TMP, 'zyra_tests.js')
              with open(ruta_js, 'w', encoding='utf-8') as f:
                  f.write(js)
              try:
                  p = subprocess.run(['node', ruta_js], capture_output=True, text=True, timeout=180)
              except Exception as e:
                  return False, 0, ['no se pudo ejecutar node: ' + repr(e)]
              salida = (p.stdout or '') + '\n' + (p.stderr or '')
              ok_n = 0
              mal_n = 0
              fallos = []
              for ln in salida.splitlines():
                  if ln.startswith('ZYRA_OK='):
                      try:
                          ok_n = int(ln.split('=')[1])
                      except Exception:
                          pass
                  elif ln.startswith('ZYRA_MAL='):
                      try:
                          mal_n = int(ln.split('=')[1])
                      except Exception:
                          pass
                  elif ln.startswith('FALLO: '):
                      fallos.append(ln[7:])
              if p.returncode != 0 and mal_n == 0:
                  fallos.append('node termino con codigo ' + str(p.returncode) + ': ' + salida[:500])
              return (mal_n == 0 and ok_n >= 20), ok_n, fallos

