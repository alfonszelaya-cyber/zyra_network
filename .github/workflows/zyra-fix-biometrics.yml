name: ZYRA LABORATORIO - Lote 8Ab (Fase 8 - DisplayKind, offset de warp y diagnostico)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar y aplicar lote (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_8a.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          reemplazar_verificado() {
            ruta="$1"; firma="$2"
            if [ ! -s "$ruta" ]; then
              echo "FALLO: $ruta no existe para reemplazo verificado"; exit 1
            fi
            if ! grep -qF "$firma" "$ruta"; then
              echo "FALLO: firma ausente en $ruta (contenido inesperado, NO se toca)"; exit 1
            fi
            cat > "$ruta"
            echo "REEMPLAZADO-VERIFICADO: $ruta"
            echo "$ruta|REEMPLAZADO" >> "$MANIFEST"
          }
          mkdir -p apps/laboratorio/shared/enums apps/laboratorio/infrastructure/providers apps/laboratorio/application/use_cases
          echo "=== FIX 1: DisplayKind.validar (causa del 500 en salidas) ==="
          reemplazar_verificado apps/laboratorio/shared/enums/display_kind.py "class DisplayKind(str, Enum):" << 'ZYRA_EOF'
          """Destinos de salida de la Display Abstraction.

          La arquitectura es invertida: primero el mundo (SCENE/WORLD),
          despues el render, y al final el destino de salida sustituible.
          """

          from enum import Enum


          class DisplayKind(str, Enum):
              """El mismo contenido puede salir por cualquiera de estos destinos."""

              PANTALLA = "pantalla"
              PROYECTOR = "proyector"
              HOLOGRAFICO = "holografico"
              LIGHT_FIELD = "light_field"
              AR = "ar"
              VR = "vr"
              FUTURO = "futuro"

              @classmethod
              def validar(cls, valor: str) -> "DisplayKind":
                  """Convierte y valida un texto a DisplayKind."""
                  if not isinstance(valor, str):
                      raise ValueError("El tipo de salida debe ser texto.")
                  limpio = valor.strip().lower()
                  try:
                      return cls(limpio)
                  except ValueError:
                      validos = ", ".join(t.value for t in cls)
                      raise ValueError(
                          "Tipo de salida invalido: " + repr(valor)
                          + ". Validos: " + validos
                      )
          ZYRA_EOF
          echo "=== FIX 2: warper con offset de bbox (matematica correcta) ==="
          reemplazar_verificado apps/laboratorio/infrastructure/providers/warper.py "def warpear(" << 'ZYRA_EOF'
          """Warper de perspectiva: warp REAL de un PNG por homografia.

          Mapeo inverso píxel a píxel: para cada pixel de salida calcula
          su coordenada fuente con H^-1 y muestrea el vecino mas cercano.
          Es la matematica de projection mapping para superficies planas.
          El offset (origen_x, origen_y) traduce las coordenadas bbox-locales
          del cuadrilatero a las coordenadas absolutas de la superficie.
          """
          from apps.laboratorio.infrastructure.providers.calibrator_manual import (
              invertir3x3,
              aplicar,
          )
          from apps.laboratorio.infrastructure.providers.png_decoder import (
              decodificar_png_rgb,
          )
          from apps.laboratorio.infrastructure.providers.png_encoder import (
              encode_png_rgb,
          )
          from apps.laboratorio.shared.exceptions.pipeline_errors import (
              SuperficieNoCalibradaError,
          )

          FONDO = (15, 23, 42)


          def warpear(imagen_png: bytes, homografia: list, salida_ancho: int, salida_alto: int,
                      origen_x: float = 0.0, origen_y: float = 0.0) -> bytes:
              """Aplica el warp de perspectiva y devuelve un PNG nuevo.

              origen_x/origen_y: esquina superior-izquierda del cuadrilatero
              en coordenadas de superficie (bbox), para que el pixel (0,0)
              de salida corresponda a esa esquina real.
              """
              if salida_ancho < 16 or salida_alto < 16:
                  raise ValueError("Dimensiones de salida invalidas.")
              if salida_ancho > 4096 or salida_alto > 4096:
                  raise ValueError("Salida maxima 4096x4096.")
              ancho, alto, pixeles = decodificar_png_rgb(imagen_png)
              try:
                  Hinv = invertir3x3(homografia)
              except ValueError as exc:
                  raise SuperficieNoCalibradaError(
                      "La homografia de la superficie no es aplicable: " + str(exc)
                  ) from exc
              salida = bytearray(bytes(FONDO) * (salida_ancho * salida_alto * 3))
              for oy in range(salida_alto):
                  fila_base = oy * salida_ancho
                  sy_abs = origen_y + oy + 0.5
                  for ox in range(salida_ancho):
                      sx, sy = aplicar(Hinv, origen_x + ox + 0.5, sy_abs)
                      if 0.0 <= sx < ancho and 0.0 <= sy < alto:
                          idx = (int(sy) * ancho + int(sx)) * 3
                          out = (fila_base + ox) * 3
                          salida[out] = pixeles[idx]
                          salida[out + 1] = pixeles[idx + 1]
                          salida[out + 2] = pixeles[idx + 2]
              return encode_png_rgb(salida_ancho, salida_alto, bytes(salida))


          def caja_del_cuadrilatero(corners: list) -> tuple:
              """Bounding box del cuadrilatero: (x0, y0, w, h) de salida."""
              xs = [float(p[0]) for p in corners]
              ys = [float(p[1]) for p in corners]
              x0 = max(0.0, min(xs))
              y0 = max(0.0, min(ys))
              x1 = max(xs)
              y1 = max(ys)
              return (int(x0), int(y0), max(1, int(x1 - x0)), max(1, int(y1 - y0)))
          ZYRA_EOF
          echo "=== FIX 3: proyeccion con offsets y contexto de error completo ==="
          reemplazar_verificado apps/laboratorio/application/use_cases/projection.py "class CasoProyectarEnVivo:" << 'ZYRA_EOF'
          """Casos de uso de proyeccion: registrar, calibrar y proyectar.

          Pipeline real: SCAN (honesto: sin camara conectada se usa
          calibracion manual) -> CALIBRACION (homografia DLT) -> WARP
          (mapeo inverso píxel a píxel) -> frame PNG entregado.
          Los errores de render/warp se re-lanzan con contexto completo
          para diagnostico exacto (Ley 1: nunca un 500 opaco).
          """
          from apps.laboratorio.domain.surface import Superficie
          from apps.laboratorio.infrastructure.providers.renderer_raster import (
              MotorRenderRaster,
          )
          from apps.laboratorio.infrastructure.providers.warper import (
              caja_del_cuadrilatero,
              warpear,
          )
          from apps.laboratorio.permissions.policies.project_policy import PoliticaProyecto
          from apps.laboratorio.shared.enums.surface_kind import SurfaceKind
          from apps.laboratorio.shared.models.identifiers import nuevo_id

          RES_PROYECCION = (640, 360)


          class CasoRegistrarSuperficie:
              def __init__(self, repo_superficies, auditoria):
                  self._repo = repo_superficies
                  self._auditoria = auditoria

              def ejecutar(self, identidad, datos: dict) -> dict:
                  if not isinstance(datos, dict):
                      raise ValueError("Cuerpo invalido.")
                  nombre = str(datos.get("nombre", "")).strip()
                  if not nombre:
                      raise ValueError("La superficie requiere nombre.")
                  superficie = Superficie(
                      id=nuevo_id("sup"),
                      propietario_zid=identidad.zid,
                      nombre=nombre[:200],
                      tipo=SurfaceKind.validar(str(datos.get("tipo", "pared"))),
                  )
                  self._repo.agregar(superficie)
                  self._auditoria.registrar(
                      identidad, "superficie.registrar", str(superficie.id), "exito",
                      {"tipo": superficie.tipo.value},
                  )
                  return {"superficie": self._a_dict(superficie)}

              @staticmethod
              def _a_dict(superficie) -> dict:
                  return {
                      "id": str(superficie.id),
                      "propietario_zid": superficie.propietario_zid,
                      "nombre": superficie.nombre,
                      "tipo": superficie.tipo.value,
                      "corners": list(superficie.corners),
                      "homografia": list(superficie.homografia),
                      "calibrada": superficie.calibrada,
                      "creado_en": superficie.creado_en.isoformat(),
                  }


          class CasoCalibrarSuperficie:
              def __init__(self, repo_superficies, calibrador, auditoria):
                  self._repo = repo_superficies
                  self._calibrador = calibrador
                  self._auditoria = auditoria

              def ejecutar(self, identidad, superficie_id: str, corners: list) -> dict:
                  superficie = self._repo.obtener_exigir_de(identidad.zid, superficie_id)
                  if superficie.calibrada:
                      raise ValueError("La superficie ya esta calibrada.")
                  superficie.definir_corners(corners)
                  H = self._calibrador.calibrar(
                      superficie.corners, RES_PROYECCION[0], RES_PROYECCION[1]
                  )
                  superficie.marcar_calibrada(H)
                  self._repo.actualizar_calibracion(superficie)
                  self._auditoria.registrar(
                      identidad, "superficie.calibrar", str(superficie.id), "exito",
                      {"modo": "manual_4_puntos", "homografia_ok": True},
                  )
                  return {"superficie": CasoRegistrarSuperficie._a_dict(superficie)}


          class CasoProyectarEnVivo:
              def __init__(self, repo_superficies, repo_escenas, repo_proyectos, auditoria):
                  self._superficies = repo_superficies
                  self._escenas = repo_escenas
                  self._proyectos = repo_proyectos
                  self._auditoria = auditoria

              def ejecutar(self, identidad, escena_id: str, superficie_id: str) -> tuple:
                  escena = self._escenas.obtener_exigir(escena_id)
                  proyecto = self._proyectos.obtener_exigir(str(escena.proyecto_id))
                  PoliticaProyecto.exigir_editar(proyecto, identidad)
                  superficie = self._superficies.obtener_exigir_de(
                      identidad.zid, superficie_id
                  )
                  if not superficie.calibrada:
                      raise ValueError(
                          "La superficie no esta calibrada: define sus 4 esquinas "
                          "antes de proyectar."
                      )
                  if len(superficie.homografia) != 9:
                      raise ValueError(
                          "La superficie calibrada no tiene homografia valida "
                          "(tiene " + str(len(superficie.homografia)) + " valores)."
                      )
                  motor = MotorRenderRaster()
                  try:
                      resultado = motor.renderizar(
                          escena,
                          {"ancho": RES_PROYECCION[0], "alto": RES_PROYECCION[1]},
                      )
                      x0, y0, w, h = caja_del_cuadrilatero(superficie.corners)
                      frame = warpear(
                          resultado.imagen_bytes, superficie.homografia, w, h,
                          origen_x=float(x0), origen_y=float(y0),
                      )
                  except Exception as exc:
                      raise ValueError(
                          "Proyeccion fallo en render/warp: "
                          + type(exc).__name__ + ": " + str(exc)
                      ) from exc
                  self._auditoria.registrar(
                      identidad, "proyeccion.frame", str(escena.id), "exito",
                      {"superficie_id": str(superficie.id),
                       "modo": "frame_on_demand", "salida": [w, h]},
                  )
                  return 200, frame, {
                      "Content-Type": "image/png",
                      "Content-Disposition": "inline; filename=proyeccion_" + str(escena.id) + ".png",
                      "X-Projection-Surface": str(superficie.id),
                      "X-Projection-Mode": "frame-on-demand",
                      "X-Projection-Salida": str(w) + "x" + str(h),
                  }
          ZYRA_EOF
          echo "=== REGLA 6: VERIFICACION POR TIPO + E2E CON DIAGNOSTICO ==="
          python3 - << 'ZYRA_CHECK'
          import importlib
          import json
          import os
          import pathlib
          import sys
          import types

          pkg_apps = types.ModuleType("apps")
          pkg_apps.__path__ = ["apps"]
          sys.modules["apps"] = pkg_apps
          pkg_lab = types.ModuleType("apps.laboratorio")
          pkg_lab.__path__ = ["apps/laboratorio"]
          sys.modules["apps.laboratorio"] = pkg_lab

          from apps.laboratorio.application.services.template_check import verificar_plantillas
          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.infrastructure.database.migrations import aplicar_migraciones, version_actual
          from apps.laboratorio.infrastructure.database.connection import ConexionBD
          from apps.laboratorio.infrastructure.database.tables import TABLAS_ESPERADAS, tablas_existentes
          from apps.laboratorio.infrastructure.providers.calibrator_manual import (
              CalibradorManual,
              aplicar,
              invertir3x3,
          )
          from apps.laboratorio.infrastructure.providers.png_decoder import decodificar_png_rgb
          from apps.laboratorio.infrastructure.providers.png_encoder import encode_png_rgb
          from apps.laboratorio.infrastructure.providers.test_pattern import patron_prueba
          from apps.laboratorio.infrastructure.providers.warper import warpear
          from apps.laboratorio.shared.enums.display_kind import DisplayKind
          from apps.laboratorio.shared.enums.surface_kind import SurfaceKind
          from apps.laboratorio.shared.utilities.image_utils import dimensiones_png

          MANIFEST = "/tmp/lab_lote_8a.manifest"
          RESUMEN = os.environ.get("GITHUB_STEP_SUMMARY", "")

          def sum_write(texto=""):
              if RESUMEN:
                  with open(RESUMEN, "a", encoding="utf-8") as f:
                      f.write(texto + "\n")

          errores = 0
          objetivos = []
          with open(MANIFEST, encoding="utf-8") as f:
              for linea in f:
                  linea = linea.strip()
                  if linea:
                      ruta, estado = linea.split("|", 1)
                      objetivos.append((ruta, estado))

          sum_write("## ZYRA LABORATORIO - Lote 8Ab (Fase 8 corregida)")
          sum_write("")
          sum_write("### Escritura y verificacion por tipo (Reglas 1-3 y 6)")
          sum_write("")
          sum_write("| Archivo | Escritura | Verificacion |")
          sum_write("|---|---|---|")
          for ruta, estado in objetivos:
              marca = "OK"
              try:
                  p = pathlib.Path(ruta)
                  datos = p.read_bytes()
                  assert datos.strip(), "archivo vacio"
                  if ruta.endswith(".py"):
                      texto = datos.decode("utf-8")
                      compile(texto, ruta, "exec")
                      nombre = "apps.laboratorio." + ruta[len("apps/laboratorio/"):-3].replace("/", ".")
                      importlib.import_module(nombre)
                  elif ruta.endswith(".json"):
                      obj = json.loads(datos.decode("utf-8"))
                      assert isinstance(obj, dict), "json debe ser objeto"
                  elif ruta.endswith(".html"):
                      texto = datos.decode("utf-8")
                      assert "{{" in texto and "}}" in texto, "plantilla sin marcadores"
                  else:
                      raise ValueError("Tipo desconocido: " + ruta)
              except Exception as exc:
                  errores += 1
                  marca = "FALLO: " + type(exc).__name__ + ": " + str(exc)
              sum_write("| `" + ruta + "` | " + estado + " | " + marca + " |")

          app = montar_aplicacion(":memory:")
          H_DUENO = {"X-ZYRA-ZID": "ZID-DUENO-1", "X-ZYRA-ROLES": "LAB_CREADOR,LAB_ANALISTA,LAB_OPERADOR"}
          H_OTRO = {"X-ZYRA-ZID": "ZID-OTRO-2"}

          def llamada(metodo, ruta, cuerpo=None, headers=None):
              h = dict(headers or {})
              datos = b"" if cuerpo is None else json.dumps(cuerpo).encode("utf-8")
              status, headers_out, salida = app.despachar(metodo, ruta, h, datos)
              ctype = headers_out.get("Content-Type", "")
              if "json" in ctype:
                  try:
                      parsed = json.loads(salida.decode("utf-8"))
                  except Exception:
                      parsed = None
              else:
                  parsed = None
              return status, parsed, salida, headers_out

          resultados = []

          def check(nombre, funcion):
              global errores
              try:
                  funcion()
                  resultados.append(("OK", nombre))
              except Exception as exc:
                  errores += 1
                  resultados.append(("FALLO", nombre + " -> " + type(exc).__name__ + ": " + str(exc)))

          ref = {}

          def preparar():
              tmp = ConexionBD(":memory:")
              assert aplicar_migraciones(tmp) == 8
              assert version_actual(tmp) == 8
              for t in TABLAS_ESPERADAS:
                  assert t in tablas_existentes(tmp), "falta tabla " + t
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects", {
                  "titulo": "Muro ZYRA", "tipo": "arquitectura",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              ref["proyecto"] = cuerpo["datos"]["proyecto"]
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/scenes", {
                  "nombre": "Contenido del muro", "ancho": 800, "alto": 600,
                  "objetos": [
                      {"forma": "rect", "color": "#1A2B3C", "x": 0, "y": 0, "w": 800, "h": 600, "capa": "fondo"},
                      {"forma": "circle", "color": "#38BDF8", "cx": 400, "cy": 300, "r": 80, "capa": "medio"},
                      {"forma": "texto", "color": "#E2E8F0", "x": 40, "y": 80, "contenido": "PROYECCION", "capa": "frente"},
                  ],
              }, headers=H_DUENO)
              assert status == 201, "escena: " + str(status)
              ref["escena"] = cuerpo["datos"]["escena"]

          def t_registrar_superficie():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces", {
                  "nombre": "Pared principal", "tipo": "pared",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              sup = cuerpo["datos"]["superficie"]
              assert sup["tipo"] == "pared" and sup["calibrada"] is False
              ref["superficie"] = sup
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces", {
                  "nombre": "Mala", "tipo": "nube",
              }, headers=H_DUENO)
              assert status == 400, "tipo invalido: " + str(status)
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/surfaces", headers=H_DUENO)
              assert status == 200 and cuerpo["datos"]["total"] == 1

          def t_calibrar():
              sid = ref["superficie"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces/" + sid + "/calibrate", {
                  "corners": [[0, 0], [640, 0], [640, 360], [0, 360]],
              }, headers=H_DUENO)
              assert status == 200, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              sup = cuerpo["datos"]["superficie"]
              assert sup["calibrada"] is True
              assert len(sup["corners"]) == 4
              assert len(sup["homografia"]) == 9
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces/" + sid + "/calibrate", {
                  "corners": [[0, 0], [640, 0]],
              }, headers=H_DUENO)
              assert status == 400, "recalibrar debe 400: " + str(status)
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces", {
                  "nombre": "Segunda", "tipo": "piso",
              }, headers=H_DUENO)
              assert status == 201
              ref["superficie2"] = cuerpo["datos"]["superficie"]

          def t_calibracion_matematica():
              cal = CalibradorManual()
              H = cal.calibrar([[0, 0], [640, 0], [640, 360], [0, 360]], 640, 360)
              u, v = aplicar(H, 320, 180)
              assert abs(u - 320) < 1e-6 and abs(v - 180) < 1e-6, "identidad rota"
              H2 = cal.calibrar([[100, 50], [500, 50], [500, 300], [100, 300]], 640, 360)
              u, v = aplicar(H2, 0, 0)
              assert abs(u - 100) < 1e-6 and abs(v - 50) < 1e-6, "mapeo esquina roto"
              Hinv = invertir3x3(H2)
              x, y = aplicar(Hinv, 100, 50)
              assert abs(x) < 1e-6 and abs(y) < 1e-6, "inversa rota"
              try:
                  cal.calibrar([[0, 0], [10, 0], [10, 10], [0, 0]], 640, 360)
                  raise AssertionError("cuadrilatero degenerado debia fallar")
              except Exception:
                  pass

          def t_warp_unitario_directo():
              """Pipeline directo fuera de HTTP: render + warp identidad + pixel."""
              escenas = app.contenedor.obtener("repo_escenas")
              escena = escenas.obtener_exigir(ref["escena"]["id"])
              from apps.laboratorio.infrastructure.providers.renderer_raster import MotorRenderRaster
              resultado = MotorRenderRaster().renderizar(escena, {"ancho": 640, "alto": 360})
              cal = CalibradorManual()
              H = cal.calibrar([[0, 0], [640, 0], [640, 360], [0, 360]], 640, 360)
              frame = warpear(resultado.imagen_bytes, H, 640, 360)
              assert dimensiones_png(frame) == (640, 360), "dims=" + str(dimensiones_png(frame))
              ancho, alto, pix = decodificar_png_rgb(frame)
              idx = (10 * ancho + 10) * 3
              assert (pix[idx], pix[idx + 1], pix[idx + 2]) == (26, 43, 60), \
                  "pixel(10,10)=" + str((pix[idx], pix[idx + 1], pix[idx + 2]))

          def t_proyectar_identity():
              sid = ref["escena"]["id"]
              sup_id = ref["superficie"]["id"]
              status, cuerpo, datos, headers_out = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/project", {
                  "surface_id": sup_id,
              }, headers=H_DUENO)
              assert status == 200, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              assert headers_out["Content-Type"] == "image/png"
              assert headers_out.get("X-Projection-Mode") == "frame-on-demand"
              assert dimensiones_png(datos) == (640, 360), "dims=" + str(dimensiones_png(datos))
              ancho, alto, pix = decodificar_png_rgb(datos)
              idx = (10 * ancho + 10) * 3
              assert (pix[idx], pix[idx + 1], pix[idx + 2]) == (26, 43, 60), \
                  "pixel(10,10)=" + str((pix[idx], pix[idx + 1], pix[idx + 2]))

          def t_proyectar_warp_real():
              sid = ref["escena"]["id"]
              sup2 = ref["superficie2"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces/" + sup2 + "/calibrate", {
                  "corners": [[100, 50], [500, 50], [500, 300], [100, 300]],
              }, headers=H_DUENO)
              assert status == 200, "calibrar 2: " + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              status, cuerpo, datos, headers_out = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/project", {
                  "surface_id": sup2,
              }, headers=H_DUENO)
              assert status == 200, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              assert dimensiones_png(datos) == (400, 250), "dims=" + str(dimensiones_png(datos))
              ancho, alto, pix = decodificar_png_rgb(datos)
              idx = (0 * ancho + 0) * 3
              assert (pix[idx], pix[idx + 1], pix[idx + 2]) == (26, 43, 60), \
                  "pixel(0,0) warpeado=" + str((pix[idx], pix[idx + 1], pix[idx + 2]))

          def t_proyectar_sin_calibrar_y_403():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces", {
                  "nombre": "Tercera", "tipo": "fachada",
              }, headers=H_DUENO)
              assert status == 201
              sid3 = cuerpo["datos"]["superficie"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + ref["escena"]["id"] + "/project", {
                  "surface_id": sid3,
              }, headers=H_DUENO)
              assert status == 400, "sin calibrar: " + str(status)
              assert "calibrada" in cuerpo["error"]["mensaje"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + ref["escena"]["id"] + "/project", {
                  "surface_id": ref["superficie"]["id"],
              }, headers=H_OTRO)
              assert status == 403, "espectador no proyecta: " + str(status)
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces", {
                  "nombre": "ajena", "tipo": "pared",
              }, headers=H_OTRO)
              assert status == 403

          def t_salidas():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/displays", {
                  "nombre": "Pantalla del estudio", "kind": "pantalla",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              pant = cuerpo["datos"]["salida"]
              assert pant["disponible"] is True and pant["motivo"] == ""
              ref["pantalla"] = pant
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/displays", {
                  "nombre": "Holo futurista", "kind": "holografico",
              }, headers=H_DUENO)
              assert status == 201, "holo status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              holo = cuerpo["datos"]["salida"]
              assert holo["disponible"] is False
              assert "hardware" in holo["motivo"]
              ref["holo"] = holo
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/displays", {
                  "nombre": "Malo", "kind": "teletransportador",
              }, headers=H_DUENO)
              assert status == 400, "kind invalido: " + str(status)

          def t_probar_salida():
              pid = ref["pantalla"]["id"]
              status, _, datos, headers_out = llamada("POST", "/laboratorio/api/v1/displays/" + pid + "/test", None, headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              assert headers_out["Content-Type"] == "image/png"
              assert dimensiones_png(datos) == (320, 180)
              ancho, alto, pix = decodificar_png_rgb(datos)
              assert pix[0:3] == (255, 255, 255), "rejilla blanca en (0,0)"
              hid = ref["holo"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/displays/" + hid + "/test", None, headers=H_DUENO)
              assert status == 400, "holo debe rechazar: " + str(status)
              assert "hardware" in cuerpo["error"]["mensaje"]

          def t_ui_paneles_fase8():
              status, _, html, _ = llamada("GET", "/laboratorio/ui/proyectar", headers=H_DUENO)
              assert status == 200, "proyectar status=" + str(status)
              texto = html.decode("utf-8")
              assert "EN VIVO" in texto
              assert texto.count('data-accion=') == 3, "Ley 3, hay " + str(texto.count('data-accion='))
              assert 'id="form-superficie"' in texto and 'id="form-calibrar"' in texto and 'id="form-proyectar"' in texto
              assert "calibrada" in texto and "Pared principal" in texto
              status, _, html, _ = llamada("GET", "/laboratorio/ui/salidas", headers=H_DUENO)
              assert status == 200, "salidas status=" + str(status)
              texto = html.decode("utf-8")
              assert "EN VIVO" in texto
              assert texto.count('data-accion=') == 3, "Ley 3 salidas"
              assert 'id="form-display"' in texto
              assert "disponible" in texto and "no disponible" in texto
              assert 'data-test="' in texto, "boton probar en pantalla disponible"

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              total = len(cuerpo["datos"]["rutas"])
              assert total == 64, "se esperaban 64 rutas (57 + 4 superficies/proyeccion + 3 displays), hay " + str(total)
              ids_modulos = {m["id"] for m in cuerpo["datos"]["modulos"]}
              assert ids_modulos == {"capture", "simulation", "understanding", "design", "creation", "library", "world4d", "render", "presentation", "export", "projection", "display"}, str(ids_modulos)
              capacidades = app.contenedor.obtener("capacidades")
              assert capacidades.disponible(Capacidad.WARP if hasattr(Capacidad, "WARP") else "proyeccion_warp") is True or True
              from apps.laboratorio.registry.engines.capabilities import Capacidad as Cap
              assert capacidades.disponible(Cap.PROYECCION_WARP) is True, "WARP debe estar disponible"
              assert capacidades.disponible(Cap.PROFUNDIDAD) is True, "PROFUNDIDAD debe estar disponible"
              assert capacidades.disponible(Cap.HOLO_3D) is False, "holo sigue honesto"

          def t_enums_validar():
              assert DisplayKind.validar("pantalla") is DisplayKind.PANTALLA
              assert DisplayKind.validar(" VR ") is DisplayKind.VR
              try:
                  DisplayKind.validar("laser")
                  raise AssertionError("debia fallar")
              except ValueError:
                  pass
              assert SurfaceKind.validar("pared") is SurfaceKind.PARED

          def t_encoder_decoder_unitario():
              datos = encode_png_rgb(20, 10, bytes(600))
              ancho, alto, pix = decodificar_png_rgb(datos)
              assert (ancho, alto) == (20, 10) and len(pix) == 600
              patron = patron_prueba(160, 90)
              assert dimensiones_png(patron) == (160, 90)

          def t_plantillas_completas():
              assert verificar_plantillas() == 18

          sum_write("")
          sum_write("### Pruebas end-to-end Fase 8 (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Migracion v8 + escena de contenido", preparar)
          check("Registrar superficie + tipo invalido (400)", t_registrar_superficie)
          check("Calibrar con 4 esquinas + recalibrado 400", t_calibrar)
          check("Homografia DLT matematicamente verificada", t_calibracion_matematica)
          check("Pipeline directo: render + warp + pixel exacto", t_warp_unitario_directo)
          check("Proyectar identidad: PNG 640x360 con pixel exacto", t_proyectar_identity)
          check("Proyectar warp real con offset: cuadrilatero desplazado", t_proyectar_warp_real)
          check("Sin calibrar (400 honesto) + 403 espectador", t_proyectar_sin_calibrar_y_403)
          check("Salidas: pantalla disponible, holo honesto", t_salidas)
          check("Patron de prueba real + holo rechaza", t_probar_salida)
          check("UI proyectar y salidas EN VIVO con Ley 3", t_ui_paneles_fase8)
          check("Indice: 64 rutas, 12 modulos, capacidades actualizadas", t_indice_publico)
          check("Enums validar (DisplayKind y SurfaceKind)", t_enums_validar)
          check("Encoder/decoder PNG + patron unitarios", t_encoder_decoder_unitario)
          check("18 plantillas verificadas", t_plantillas_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 8 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 8Ab aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 8Ab - Fase 8 con DisplayKind offset de warp y diagnostico"
            git push
          fi
