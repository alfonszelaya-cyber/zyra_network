name: ZYRA RUM 1 - Lectura del arranque real (main.py + apps reales)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lectura:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Leer main.py + superapp.py + apps reales
        run: |
          python - <<'PY'
          import ast, os
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append
          A("# 🔍 ARRANQUE REAL DEL REPO (solo lectura)\n")

          A("## 1. APPS REALES (carpetas dentro de apps/)")
          A("")
          apps = sorted(p.name for p in Path("apps").iterdir() if p.is_dir() and not p.name.startswith("__"))
          A("Total: " + str(len(apps)))
          for a in apps:
              A("- " + a)
          A("")

          A("## 2. main.py COMPLETO (la entrada real del repo)")
          A("")
          main_p = Path("main.py")
          if main_p.is_file():
              A("```python")
              A(main_p.read_text(encoding="utf-8", errors="replace"))
              A("```")
          else:
              A("**NO EXISTE**")
          A("")

          A("## 3. render.yaml (que despliega)")
          A("")
          r = Path("render.yaml")
          if r.is_file():
              A("```yaml")
              A(r.read_text(encoding="utf-8", errors="replace"))
              A("```")
          else:
              A("(no existe)")
          A("")

          A("## 4. superapp.py — estado")
          A("")
          sup = Path("superapp.py")
          if sup.is_file():
              t = sup.read_text(encoding="utf-8", errors="replace")
              try:
                  ast.parse(t)
                  A("- sintaxis: OK")
              except SyntaxError as e:
                  A("- sintaxis: FALLO " + str(e))
              A("- nexo roto (_ng_start_nexo_base): " + ("PRESENTE ❌" if "_ng_start_nexo_base" in t else "ausente"))
              A("- laboratorio cableado: " + ("SI" if "_start_laboratorio" in t else "NO ❌"))
              A("")
              A("### STARTERS y funciones _start_* que define:")
              A("```")
              for i, linea in enumerate(t.splitlines(), 1):
                  ls = linea.strip()
                  if ls.startswith("def _start_") or ls.startswith('("') and "/") in ls:
                      A(str(i) + ": " + ls)
              A("```")
          else:
              A("**NO EXISTE superapp.py**")
          A("")

          A("## 5. Otros arranques en la raiz")
          A("")
          for p in sorted(Path(".").glob("*.py")):
              if p.name in ("main.py", "superapp.py"):
                  continue
              t2 = p.read_text(encoding="utf-8", errors="replace")
              tiene_main = "__main__" in t2
              A("- " + p.name + " (" + str(len(t2.splitlines())) + " lineas" + (", tiene __main__" if tiene_main else "") + ")")
          A("")

          md = "\n".join(L)
          if summary:
              salida = md
              if len(salida) > 900000:
                  salida = salida[:900000] + "\n\n**(RECORTE — completo en el artefacto)**\n"
              with open(summary, "a") as fh:
                  fh.write(salida)
          Path("lectura_arranque.md").write_text(md, encoding="utf-8")
          print("listo")
          PY

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectura-arranque
          path: lectura_arranque.md
