name: ZYRA D7 registro con display name y redirect html

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD7:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: D7
        run: |
          python3 - <<'PYEOF'
          import base64, hashlib, json, os, py_compile, secrets, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SPY = ROOT / 'superapp.py'
          PT = ROOT / 'portal'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 'faseD7.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  r = OP.open(q, timeout=20)
                  return r.status, r.headers, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, None, str(e)
          def png(rgb):
              def ck(t, d):
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              ih = struct.pack('>IIBBBBB', 8, 8, 8, 2, 0, 0, 0)
              f = b'\x00' + bytes(rgb) * 8
              return b'\x89PNG\r\n\x1a\n' + ck(b'IHDR', ih) + ck(b'IDAT', zlib.compress(f * 8)) + ck(b'IEND', b'')
          DOC = base64.b64encode(png((90, 90, 160))).decode()
          SEL = base64.b64encode(png((160, 90, 90))).decode()
          orig = {'sp': SPY.read_bytes()}
          def revertir():
              try:
                  SPY.write_bytes(orig['sp'])
              except Exception:
                  pass
          t0 = orig['sp'].decode('utf-8')
          add('# D7 - display_name + redirect HTML')
          add('')
          add('## W1. Sonda: campo display_name (y los que siga pidiendo)')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                      'ZYRA_DATA_DIR': '/tmp/zd7', 'ZYRA_PORT': str(NP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t1 = time.time()
          while time.time() - t1 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          H = {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN}
          EXTRA = {'display_name': 'Sonda D7'}
          if vivo:
              pl = {'kind': 'person', 'name': 'Sonda D7', 'actor': 'superapp',
                    'display_name': 'Sonda D7',
                    'doc_image_b64': DOC, 'selfie_image_b64': SEL}
              q = urllib.request.Request(BASE + '/identity/enroll',
                  data=json.dumps(pl).encode(), headers=H, method='POST')
              try:
                  with urllib.request.urlopen(q, timeout=20) as r:
                      st, cu = r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  st, cu = e.code, e.read().decode('utf-8', 'replace')
              add('- enroll con display_name -> %s | %s' % (st, cu[:250]))
              EXTRA['resp'] = '%s %s' % (st, cu[:200])
          else:
              add('- red no arranco')
          gate('sonda_display', vivo)
          try:
              if proc.poll() is None:
                  proc.terminate()
                  proc.wait(timeout=10)
          except Exception:
              try:
                  proc.kill()
              except Exception:
                  pass
          add('')
          add('## W2. Ediciones (anclas exactas)')
          add('')
          VIEJO_REG = '\n'.join([
              '            ok_r, dr, er = _SimpleClient(ZYRA_URL).post("/identity/enroll", {"kind": "person", "name": nombre, "actor": os.environ.get("ZYRA_ENROLL_ACTOR", "__ACT__"), "doc_image_b64": db64, "selfie_image_b64": sb64})'])
          NUEVO_REG = '\n'.join([
              '            ok_r, dr, er = _SimpleClient(ZYRA_URL).post("/identity/enroll", {"kind": "person", "name": nombre, "display_name": nombre, "actor": os.environ.get("ZYRA_ENROLL_ACTOR", "superapp"), "doc_image_b64": db64, "selfie_image_b64": sb64})'])
          n1 = t0.count(VIEJO_REG)
          add('- linea enroll vieja: %d (1)' % n1)
          VIEJO_MPE = '\n'.join([
              '        if path == "/mpe/register":',
              '            self.send_response(302)',
              '            self.send_header("Location", "/registro")',
              '            self.end_headers()',
              '            return'])
          NUEVO_MPE = '\n'.join([
              '        if path == "/mpe/register":',
              '            self._send_html(200, "<!doctype html><html lang=\'es\'><head><meta charset=\'utf-8\'><meta http-equiv=\'refresh\' content=\'0;url=/registro\'><title>ZYRA</title></head><body></body></html>")',
              '            return'])
          n2 = t0.count(VIEJO_MPE)
          add('- bloque redirect MPE: %d (1)' % n2)
          okA = (n1 == 1 and n2 == 1)
          gate('anclas_exactas', okA)
          if not okA:
              add('**ANCHORS NO UNICOS: nada editado.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('faseD7.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS - sin cambios')
          t = t0
          t = t.replace(VIEJO_REG, NUEVO_REG, 1)
          t = t.replace(VIEJO_MPE, NUEVO_MPE, 1)
          SPY.write_text(t, encoding='utf-8')
          gate('ediciones', True)
          add('')
          add('## W3. Compilacion')
          add('')
          try:
              py_compile.compile(str(SPY), doraise=True)
              add('- superapp.py: OK')
              gate('compila', True)
          except Exception as e:
              add('- FALLO: %s' % e)
              gate('compila', False)
          add('')
          add('## W4. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zd7s', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/sd7', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'ZYRA_ENROLL_ACTOR': 'superapp',
                       'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t1 = time.time()
          while time.time() - t1 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t1 = time.time()
              while time.time() - t1 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cu = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cu).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps', spv and len(apps) == 8)
          if spv:
              cuerpo = json.dumps({'nombre': 'Prima de Prueba', 'clave': 'clave-prima-99',
                                   'doc_image_b64': DOC, 'selfie_image_b64': SEL}).encode()
              st, _h, b = pedir(BSP + '/registro/nuevo', data=cuerpo)
              try:
                  j = json.loads(b)
                  zid = j.get('zid', '')
                  err = str(j.get('error', ''))[:200]
              except Exception:
                  zid, err = '', b[:200]
              add('- registro prima -> %s | zid=%s | err=%s' % (st, zid or '-', err))
              biomet = any(x in err.lower() for x in ('biomet', 'rostro', 'face', 'template',
                                                      'liveness', 'verif', 'imagen', 'image'))
              gate('registro_fluye', st in (200, 502) and (zid or biomet))
              if zid:
                  st, h, _b = pedir(BSP + '/entrar',
                                    data=('zid=%s&clave=clave-prima-99' % zid).encode())
                  sc = (h.get('Set-Cookie') or '').split(';')[0] if h else ''
                  gate('prima_entrar', st == 303 and sc)
                  if sc:
                      st, _h, b = pedir(BSP + '/', {'Cookie': sc})
                      gate('prima_conectada', ('Conectado: ' + zid) in b)
                      st, _h, b = pedir(BSP + '/laboratorio/ui', {'Cookie': sc})
                      gate('prima_en_lab', st == 200)
              st, _h, _b = pedir(BSP + '/entrar',
                                 data=('zid=%s&clave=malaclave1' % (zid or 'Z-X')).encode())
              gate('clave_mala_403', st == 403)
              st, _h, b = pedir(BSP + '/mpe/register')
              html_red = (st == 200 and ('refresh' in b or '/registro' in b))
              add('- /mpe/register -> %s con redireccion HTML %s' % (st, 'OK' if html_red else 'FALLO'))
              gate('mpe_redirige', html_red)
              st, _h, _b = pedir(BSP + '/laboratorio/ui')
              gate('guard_intacto', st == 401)
              st, _h, b = pedir(BSP + '/')
              gate('pantalla_limpia', st == 200 and 'Sin sesion' not in b and 'btn-instalar' in b)
          else:
              for g in ('registro_fluye', 'prima_entrar', 'prima_conectada', 'prima_en_lab',
                        'clave_mala_403', 'mpe_redirige', 'guard_intacto', 'pantalla_limpia'):
                  gate(g, False)
          add('')
          crit = ('anclas_exactas', 'compila', 'ocho_apps', 'pantalla_limpia', 'guard_intacto')
          fallos = [n for n, o in GATES if not o]
          if any(n in fallos for n in crit):
              revertir()
              add('## REVERSION APLICADA - restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in crit))
              add('')
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          fallos = [n for n, o in GATES if not o]
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D7 VERIFICADO. Commit.**')
              add('')
              add('El contrato de la Red se completa por escalera; con fotos reales del celular, la biometria decide.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          DATA['sonda'] = EXTRA
          Path('faseD7.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D7 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(D7): display_name en enroll, redirect HTML de mpe/register"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faseD7-zyra
          path: faseD7.json
          if-no-files-found: ignore
