name: ZYRA D31 commit de compresion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  d31:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portal/registro.html
          git commit -m "fix(D31): compresion de fotos activa (900px, selfie 0.6)" || echo "sin cambios"
          git push
          echo "## Compresion commiteada" >> "$GITHUB_STEP_SUMMARY"
