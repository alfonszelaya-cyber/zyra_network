name: "ZYRA MARKET (GRUPO B v4): E2E f-string sin excepciones - diagnostico total"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-gb
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Paso 0 - carpeta motores"
        run: |
          mkdir -p apps/subastas/modules/motores
          touch apps/subastas/modules/motores/__init__.py
          echo "motores OK"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - verificar 3 motores ya escritos (v3 los escribio)"
        run: |
          python3 - <<'CHK'
          from pathlib import Path
          ok = True
          c = Path("apps/subastas/modules/motores/cartera_store.py")
          t = Path("apps/subastas/modules/motores/traduccion_store.py")
          r = Path("apps/subastas/modules/motores/radar_motor.py")
          if c.exists() and "RLock" in c.read_text(encoding="utf-8"):
              print("OK cartera (RLock)")
          else:
              print("FALTA cartera")
              ok = False
          if t.exists() and "def translate" in t.read_text(encoding="utf-8"):
              print("OK traduccion")
          else:
              print("FALTA traduccion")
              ok = False
          if r.exists() and "def tokenize_finding" in r.read_text(encoding="utf-8"):
              print("OK radar")
          else:
              print("FALTA radar")
              ok = False
          srv = Path("apps/subastas/server.py").read_text(encoding="utf-8")
          if "cartera_store" in srv:
              print("OK wiring")
          else:
              print("FALTA wiring")
              ok = False
          if not ok:
              raise SystemExit(1)
          CHK

      - name: "Paso 2 - E2E f-string, sin excepciones, diagnostico total"
        run: |
          python3 - <<'EOF'
          import http.cookiejar
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          import uuid
          import re as _re

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-" + uuid.uuid4().hex[:8]}, None)
                  if path == "/tokens/earn":
                      return (True, {"earned": 5}, None)
                  return (False, None, "offline")


          def make_opener():
              cj = http.cookiejar.CookieJar()
              return urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(cj)
              )


          results = []
          failures = []


          def check(step_name, fn):
              try:
                  fn()
                  results.append(f"OK   {step_name}")
                  print(f"OK   {step_name}")
              except Exception as e:
                  results.append(f"FALLO {step_name}: {e}")
                  failures.append(step_name)
                  print(f"FALLO {step_name}: {e}")


          def call(opener, method, url, payload=None, form=None):
              if form is not None:
                  data = urllib.parse.urlencode(form).encode()
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              else:
                  data = json.dumps(payload).encode() if payload is not None else None
                  headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with opener.open(req, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read()[:1500].decode("utf-8", "replace")
                  raise RuntimeError(f"HTTP {e.code} {method} {url} -> {body}")


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          opA = make_opener()
          aName = "ana" + uuid.uuid4().hex[:6]
          opB = make_opener()
          bName = "beto" + uuid.uuid4().hex[:6]
          opG = make_opener()
          gName = "gov" + uuid.uuid4().hex[:6]


          def reg_a():
              call(opA, "POST", f"{base}/subastas/registro", form={
                  "username": aName, "password": "clave123",
                  "display_name": "Ana", "role": "vendedor"})


          def reg_b():
              call(opB, "POST", f"{base}/subastas/registro", form={
                  "username": bName, "password": "clave123",
                  "display_name": "Beto", "role": "comprador"})


          def reg_g():
              call(opG, "POST", f"{base}/subastas/registro", form={
                  "username": gName, "password": "clave123",
                  "display_name": "Gobierno", "role": "gobierno"})


          check("1. cuentas A+B+gov", lambda: (reg_a(), reg_b(), reg_g()))

          deposit_result = {}


          def do_deposit():
              st, html = call(opA, "POST", f"{base}/subastas/api/cartera",
                              payload={"action": "deposit", "amount": 100})
              assert '"balance": 100.0' in html, html[:400]
              deposit_result["html"] = html


          check("2. deposito 100 (RLock)", do_deposit)


          def do_transfer():
              st, html = call(opA, "POST", f"{base}/subastas/api/cartera",
                              payload={"action": "transfer", "to": bName,
                                       "amount": 30, "note": "pago"})
              assert '"balance": 70.0' in html, html[:400]


          check("3. transferencia A->B", do_transfer)


          def bal_b():
              st, html = call(opB, "POST", f"{base}/subastas/api/cartera",
                              payload={"action": "balance"})
              assert '"balance": 30.0' in html, html[:400]


          check("4. B tiene 30", bal_b)


          def set_rate():
              st, html = call(opG, "POST", f"{base}/subastas/api/gov-cartera",
                              payload={"action": "set_rate", "from_cur": "USD",
                                       "to_cur": "BTC", "rate": 0.000015})
              assert '"rate"' in html, html[:400]


          check("5. tasa USD->BTC", set_rate)


          def do_convert():
              st, html = call(opA, "POST", f"{base}/subastas/api/cartera",
                              payload={"action": "convert", "amount": 100,
                                       "from": "USD", "to": "BTC"})
              assert "rate" in html, html[:600]


          check("6. conversion tiempo real", do_convert)


          def no_funds():
              try:
                  call(opA, "POST", f"{base}/subastas/api/cartera",
                       payload={"action": "transfer", "to": bName, "amount": 500})
                  raise RuntimeError("acepto transferencia sin saldo")
              except RuntimeError as e:
                  if "saldo insuficiente" in str(e):
                      return
                  raise


          check("7. sin saldo rechazado", no_funds)


          def add_pair():
              st, html = call(opG, "POST", f"{base}/subastas/api/gov-traduccion",
                              payload={"action": "add_pair", "src_text": "hello",
                                       "src_lang": "en", "dst_lang": "es",
                                       "dst_text": "hola"})
              assert '"dst": "hola"' in html, html[:400]


          check("8. par traduccion", add_pair)


          def translate():
              st, html = call(opA, "POST", f"{base}/subastas/api/traduccion",
                              payload={"action": "translate", "text": "hello friend",
                                       "from": "en", "to": "es"})
              assert "hola friend" in html, html[:400]


          check("9. traduccion viva", translate)

          scan_result = {}


          def do_scan():
              st, html = call(opA, "POST", f"{base}/subastas/api/radar",
                              payload={"action": "scan", "instance": "market",
                                       "summary": "escaneo",
                                       "findings": [{"label": "camioneta",
                                                     "score": 8.5}]})
              assert "camioneta" in html, html[:400]
              m = _re.search(r"FND-[a-f0-9]{10}", html)
              assert m, f"sin FND en: {html[:400]}"
              scan_result["fin"] = m.group(0)


          check("10. radar scan", do_scan)


          def tokenize():
              st, html = call(opA, "POST", f"{base}/subastas/api/radar",
                              payload={"action": "tokenize",
                                       "fin_id": scan_result.get("fin", "")})
              assert '"tokenized": true' in html, html[:400]


          check("11. tokenizado", tokenize)


          def cartera_page():
              st, html = call(opA, "GET", f"{base}/subastas/cartera")
              assert "Mi Cartera" in html and "70.00" in html, html[:400]


          check("12. pagina cartera", cartera_page)

          print("")
          print("======== RESUMEN ========")
          for r in results:
              print(r)
          print("")
          if failures:
              print(f"VEREDICTO: {len(failures)} FALLOS: {failures}")
              raise SystemExit(1)
          print("VEREDICTO: 12/12 OK - GRUPO B completo")
          EOF

      - name: ZYRA MARKET tests (report only)
        if: always()
        run: |
          python3 -m pytest apps/subastas/tests -q || true

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (GRUPO B v4): E2E f-string sin excepciones" -m "Test rewritten with f-strings (no format-string bugs possible) and non-throwing steps: every step reports OK/FALLO with full detail, final verdict lists failures. If 500 persists, log shows exact trace for surgical fix."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
