name: "ZYRA NEXO E2 v2: client_id en use case"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Corregir use case create
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **FORZADO " + p.name + ": OK**")
              except Exception:
                  out("- **FORZADO " + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          UCC = "apps/nexo/application/clients_use_cases"

          # FIX: client_id se genera AQUI, antes del audit
          forzar(UCC + "/create_client_use_case.py", D(r'''
              from __future__ import annotations
              import uuid
              from apps.nexo.domain.clients.client_registry import (
                  ClientRegistry)


              class CreateClientUseCase:
                  def __init__(self, client_registry: ClientRegistry,
                               audit) -> None:
                      self._registry = client_registry
                      self._audit = audit

                  def execute(self, *, name: str, email: str,
                              phone: str = "",
                              created_by: str = "nexo") -> dict:
                      client_id = f"CLI-{uuid.uuid4()}"
                      client = {
                          "client_id": client_id,
                          "name": name,
                          "email": email,
                          "phone": phone,
                          "status": "ACTIVE",
                      }
                      self._registry.store(client)
                      self._audit.append(
                          event_type="nexo.client.created",
                          actor=created_by,
                          subject=client_id,
                          payload={"name": name})
                      return client
          '''))

          # Registry.store debe PRESERVAR el client_id recibido
          forzar("apps/nexo/domain/clients/client_registry.py", D(r'''
              # client_registry.py - NEXO / ZYRA (v2: respeta client_id)
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "client_registry", (
                      "CREATE TABLE IF NOT EXISTS client_registry (client_id TEXT PRIMARY KEY, client_json TEXT NOT NULL, total_transactions INTEGER NOT NULL DEFAULT 0, created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                  )),
                  Migration(2, "client_registry_history", (
                      "CREATE TABLE IF NOT EXISTS client_registry_history (history_id TEXT PRIMARY KEY, client_id TEXT NOT NULL, event_type TEXT NOT NULL, description TEXT NOT NULL, created_at REAL NOT NULL)",
                  )),
                  Migration(3, "client_registry_links", (
                      "CREATE TABLE IF NOT EXISTS client_registry_links (link_id TEXT PRIMARY KEY, client_id TEXT NOT NULL, company_id TEXT NOT NULL, created_at REAL NOT NULL)",
                  )),
              )

              class ClientRegistry:
                  """Registro central de clientes."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.clientregistry",
                                      _MIGRATIONS).run(clock)

                  def store(self, client: Dict) -> Dict:
                      import json as _j
                      client_id = client.get("client_id")
                      if not client_id:
                          client_id = f"CLI-{uuid.uuid4()}"
                          client["client_id"] = client_id
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT OR REPLACE INTO client_registry"
                              " (client_id, client_json,"
                              " total_transactions, created_at,"
                              " updated_at)"
                              " VALUES (?, ?, COALESCE("
                              " (SELECT total_transactions FROM"
                              "  client_registry WHERE client_id = ?),"
                              " 0), COALESCE((SELECT created_at FROM"
                              " client_registry WHERE client_id = ?), ?), ?)",
                              (client_id,
                               _j.dumps(client, default=str),
                               client_id, client_id, now, now))
                      return client

                  def get_by_id(self, client_id: str) -> Optional[Dict]:
                      import json as _j
                      row = self._db.query_one(
                          "SELECT * FROM client_registry"
                          " WHERE client_id = ?", (client_id,))
                      if not row:
                          return None
                      client = _j.loads(str(row["client_json"]))
                      client["total_transactions"] = int(
                          row["total_transactions"])
                      return client

                  def update(self, client_id: str,
                             updates: Dict) -> Optional[Dict]:
                      client = self.get_by_id(client_id)
                      if not client:
                          return None
                      client.update(updates)
                      import json as _j
                      self._db.execute(
                          "UPDATE client_registry SET"
                          " client_json = ?, updated_at = ?"
                          " WHERE client_id = ?",
                          (_j.dumps(client, default=str),
                           self._clock.now(), client_id))
                      return client

                  def link_company(self, *, client_id: str,
                                   company_id: str) -> Dict:
                      link_id = f"LNK-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO client_registry_links"
                              " (link_id, client_id, company_id,"
                              " created_at) VALUES (?, ?, ?, ?)",
                              (link_id, client_id, company_id, now))
                      return {"client_id": client_id,
                              "company_id": company_id,
                              "link_id": link_id,
                              "status": "LINKED"}

                  def register_history(self, *, client_id: str,
                                       history_event: Dict) -> Dict:
                      hid = f"H-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO client_registry_history"
                              " (history_id, client_id, event_type,"
                              " description, created_at)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (hid, client_id,
                               str(history_event.get(
                                   "event_type", "")),
                               str(history_event.get(
                                   "description", "")), now))
                      return history_event

                  def bump_transactions(self, client_id: str) -> None:
                      self._db.execute(
                          "UPDATE client_registry SET"
                          " total_transactions ="
                          " total_transactions + 1"
                          " WHERE client_id = ?", (client_id,))
          '''))
          exit(0)
          EOF

      - name: "N2: tests clients"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps/nexo -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          cat > apps/nexo/tests/test_clients_migrated.py << 'PYEOF'
          import pytest
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.audit.chain import AuditTrail
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.clients.client_engine import ClientEngine
          from apps.nexo.domain.clients.client_history_engine import ClientHistoryEngine
          from apps.nexo.domain.clients.client_registry import ClientRegistry
          from apps.nexo.domain.clients.client_validation_engine import ClientValidationEngine
          from apps.nexo.domain.clients.client_segmentation_engine import ClientSegmentationEngine
          from apps.nexo.application.clients_use_cases.create_client_use_case import CreateClientUseCase
          from apps.nexo.application.clients_use_cases.segment_client_use_case import SegmentClientUseCase
          from apps.nexo.application.clients_use_cases.validate_client_use_case import ValidateClientUseCase
          from apps.nexo.application.clients_use_cases.update_client_use_case import UpdateClientUseCase


          def _db(tmp_path):
              return SQLiteAdapter(tmp_path / "cli.db")


          def test_client_engine_crud(tmp_path) -> None:
              db = _db(tmp_path)
              eng = ClientEngine(db, FrozenClock())
              c = eng.create_client(name="Pedro SV", document="12345678-9", email="pedro@sv.com")
              assert c["status"] == "ACTIVE"
              u = eng.update_client(c["client_id"], {"email": "nuevo@sv.com"})
              assert u["email"] == "nuevo@sv.com"
              b = eng.block_client(c["client_id"])
              assert b["status"] == "BLOCKED"
              a = eng.activate_client(c["client_id"])
              assert a["status"] == "ACTIVE"
              s = eng.generate_summary()
              assert s["total_clients"] == 1
              print("OK clients: engine CRUD + block/activate")


          def test_registry_and_use_cases(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              audit = AuditTrail(db, clock)
              reg = ClientRegistry(db, clock)
              uc_create = CreateClientUseCase(reg, audit)
              c = uc_create.execute(name="Juan", email="juan@sv.com", created_by="nexo")
              assert c["client_id"].startswith("CLI-"), str(c)
              assert c["status"] == "ACTIVE"
              got = reg.get_by_id(c["client_id"])
              assert got["name"] == "Juan"
              uc_update = UpdateClientUseCase(reg, audit)
              u = uc_update.execute(client_id=c["client_id"], updates={"phone": "7000-1234"})
              assert u["phone"] == "7000-1234"
              uc_seg = SegmentClientUseCase(reg)
              r = uc_seg.execute(client_id=c["client_id"])
              assert r["segment"] == "STANDARD"
              print("OK clients: registry + use cases create/update/segment con audit")


          def test_validation(tmp_path) -> None:
              db = _db(tmp_path)
              val = ClientValidationEngine(db, FrozenClock())
              assert val.validate({"name": "Pedro", "document": "12345678", "email": "p@sv.com"}) is True
              assert val.validate({"name": "Pedro", "document": "12", "email": "mal"}) is False
              issues = val.validation_report({"name": "", "document": "12", "email": "mal"})
              assert "Missing name" in issues
              print("OK clients: validacion con reporte")


          def test_history_and_segmentation(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              hist = ClientHistoryEngine(db, clock)
              hist.register_financial_event("CLI-1", {"amount": 100})
              hist.register_risk_event("CLI-1", {"level": "MEDIUM"})
              s = hist.generate_summary("CLI-1")
              assert s["financial_events"] == 1
              assert s["risk_events"] == 1
              seg = ClientSegmentationEngine()
              assert seg.segment(20000000) == "CORPORATE"
              assert seg.vip_segment(95, 2000000) == "VIP"
              print("OK clients: historial + segmentacion")
          PYEOF
          timeout 120 python3 -m pytest apps/nexo/tests/test_clients_migrated.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/n2.out 2>&1
          echo $? > /tmp/n2
          if [ "$(cat /tmp/n2)" = "0" ]; then echo "- N2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- N2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### N2 detalle"; echo '```'; tail -80 /tmp/n2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "N2b: nexo completo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/n2b.out 2>&1
          echo $? > /tmp/n2b
          if [ "$(cat /tmp/n2b)" = "0" ]; then echo "- N2b: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- N2b: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### N2b detalle"; echo '```'; tail -50 /tmp/n2b.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "N2c: apps otras + shared"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/n2c.out 2>&1
          echo $? > /tmp/n2c
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/n2d.out 2>&1
          ok3=$?
          if [ "$(cat /tmp/n2c)" = "0" ] && [ "$ok3" = "0" ]; then echo "- N2c: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- N2c: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### N2c detalle"; echo '```'; tail -60 /tmp/n2c.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in n2 n2b n2c; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: N2 VERDES — LOTE 2 CLIENTS MIGRADO**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-E2 v2): clients migrado - client_id generado en use case (audit subject valido), registry respeta id (N2 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 2 CERRADO. Sigue LOTE 3 compliance+risk.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
