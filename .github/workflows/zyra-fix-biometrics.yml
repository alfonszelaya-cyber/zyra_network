name: "CONSOL-2: NetworkClient x7 -> copia canonica en shared_engines/network + 7 shims locales (regla 51: imports de las apps intactos) + regresion de todas las apps"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias (cryptography explicito)
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[LECTURA] los 7 network_client.py (md5 para ver si son identicos) + existe canonico?"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          echo "## NetworkClient x7 — md5" >> "$SUM"
          { echo '```'; md5sum apps/*/infrastructure/network/network_client.py 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## existe ya en shared_engines?" >> "$SUM"
          { echo '```'; ls shared_engines/network/ 2>/dev/null; echo '```'; } >> "$SUM"
          echo "## imports del mayor (para ver dependencias)" >> "$SUM"
          { echo '```'; BIG=$(find apps -name "network_client.py" -path "*/infrastructure/network/*" 2>/dev/null | xargs wc -l 2>/dev/null | sort -rn | head -2 | tail -1 | awk '{print $2}'); echo "mayor: $BIG"; grep -n "^from \|^import " "$BIG" 2>/dev/null | head -15; echo '```'; } >> "$SUM"
          echo "## tests de ciclo_digital y mi_primer_empleo?" >> "$SUM"
          { echo '```'; find apps/ciclo_digital/apps -name "test_*.py" 2>/dev/null | head -3; find apps/mi_primer_empleo -name "test_*.py" 2>/dev/null | head -3; echo '```'; } >> "$SUM"
          exit 0

      - name: "[ESCRITURA] canonico en shared_engines + 7 shims (imports de las apps intactos)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import hashlib, os, pathlib, py_compile, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              apps7 = ["agro", "axis", "nexo", "semilla",
                       "subastas", "ciclo_digital",
                       "mi_primer_empleo"]
              path_tpl = ("apps/{a}/infrastructure/network/"
                          "network_client.py")
              srcs = {}
              for a in apps7:
                  p = pathlib.Path(path_tpl.format(a=a))
                  if p.exists():
                      srcs[a] = p.read_text(encoding="utf-8")
              out("- encontrados: " + str(len(srcs)) + " de 7")

              hashes = {}
              for a, s in srcs.items():
                  hashes[a] = hashlib.md5(
                      s.encode()).hexdigest()
              groups = {}
              for a, h in hashes.items():
                  groups.setdefault(h, []).append(a)
              out("- variantes distintas: "
                  + str(len(groups)))
              for h, lst in groups.items():
                  out("  - " + h[:8] + ": "
                      + ", ".join(lst))

              # canonico: la copia MAS GRANDE (mas completa)
              biggest = max(srcs, key=lambda a: len(srcs[a]))
              canon_src = srcs[biggest]
              canon_path = pathlib.Path(
                  "shared_engines/network/network_client.py")
              if canon_path.exists():
                  cur = canon_path.read_text(encoding="utf-8")
                  if hashlib.md5(
                          cur.encode()).hexdigest() == \
                          hashlib.md5(
                              canon_src.encode()).hexdigest():
                      out("- canonico: ya existia identico")
                  else:
                      out("- **AVISO: ya existia un"
                          " network_client en shared_engines"
                          " con contenido distinto — se"
                          " CONSERVA el existente y los"
                          " shims apuntan a el**")
                      canon_src = cur
              else:
                  # quitar imports app-locales si los hubiera
                  canon_src = canon_src.replace(
                      "from apps.", "from apps.")
                  canon_path.write_text(canon_src,
                                        encoding="utf-8")
                  py_compile.compile(str(canon_path),
                                     doraise=True)
                  out("- **canonico creado desde "
                      + biggest + " (" + str(len(canon_src))
                      + " chars)**")

              # verificar que compila importandolo
              import subprocess
              env = dict(os.environ)
              env["PYTHONPATH"] = (os.getcwd() + ":"
                                   + os.getcwd()
                                   + "/shared_engines")
              r = subprocess.run(
                  ["python3", "-c",
                   "import shared_engines.network."
                   "network_client as m;"
                   "print([n for n in dir(m) if not n"
                   ".startswith('_')])"],
                  capture_output=True, text=True,
                  env=env, timeout=60)
              if r.returncode != 0:
                  raise RuntimeError(
                      "canonico no importa: "
                      + r.stderr[-400:])
              public_names = r.stdout.strip()
              out("- simbolos publicos del canonico: "
                  + public_names[:200])

              # shims: cada local re-exporta del canonico
              shim = (
                  '"""Shim de compatibilidad (regla 51):\n'
                  'la implementacion vive en\n'
                  'shared_engines.network.network_client\n'
                  '(consolidacion NetworkClient x7 -> 1).\n'
                  'Los imports de esta app siguen'
                  ' funcionando sin cambios."""\n'
                  'from shared_engines.network.'
                  'network_client import *  # noqa\n'
                  'from shared_engines.network.'
                  'network_client import (  # noqa\n'
                  '    NetworkClient,\n'
                  ')\n'
              )
              # si el canonico no define NetworkClient,
              # shim solo con wildcard
              if "NetworkClient" not in canon_src:
                  shim = (
                      '"""Shim de compatibilidad (regla 51:'
                      ' consolidacion x7 -> 1)."""\n'
                      'from shared_engines.network.'
                      'network_client import *  # noqa\n'
                  )
              for a in srcs:
                  p = pathlib.Path(path_tpl.format(a=a))
                  cur = p.read_text(encoding="utf-8")
                  if "shared_engines.network" in cur and \
                          len(cur) < 600:
                      out("- shim " + a + ": ya aplicado")
                      continue
                  p.write_text(shim, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  out("- **shim " + a + ": OK**")

              # __init__ del paquete network de shared
              init = pathlib.Path(
                  "shared_engines/network/__init__.py")
              if init.exists():
                  t = init.read_text(encoding="utf-8")
                  if "network_client" not in t:
                      init.write_text(
                          t + "\nfrom shared_engines."
                              "network import "
                              "network_client  # noqa\n",
                          encoding="utf-8")
                      py_compile.compile(str(init),
                                         doraise=True)
              out("- **CONSOL-2: canonico + "
                  + str(len(srcs)) + " shims OK**")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO")
              import traceback as tb
              out("```\n" + tb.format_exc().strip() + "\n```")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion: las 7 apps con NetworkClient + las demas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x1.out 2>&1
          echo $? > /tmp/x1
          timeout 300 python3 -m pytest apps/axis/tests -q --timeout=90 --timeout-method=thread --tb=line > /tmp/x2.out 2>&1
          echo $? > /tmp/x2
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          timeout 300 python3 -m pytest apps/semilla/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x4.out 2>&1
          echo $? > /tmp/x4
          timeout 300 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x5.out 2>&1
          echo $? > /tmp/x5
          if [ -d apps/ciclo_digital/tests ]; then
            timeout 120 python3 -m pytest apps/ciclo_digital/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x7.out 2>&1
            echo $? > /tmp/x7
          else
            echo "9" > /tmp/x7
          fi
          if [ -d apps/mi_primer_empleo/tests ]; then
            timeout 120 python3 -m pytest apps/mi_primer_empleo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/x8.out 2>&1
            echo $? > /tmp/x8
          else
            echo "9" > /tmp/x8
          fi
          for par in "x1 nexo" "x2 axis" "x3 agro" "x4 semilla" "x5 subastas" "x7 ciclo_digital" "x8 mi_primer_empleo"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            passed=$(grep -oE "[0-9]+ passed" /tmp/$1.out 2>/dev/null | tail -1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅ ($passed)" >> "$SUM"
            elif [ "$code" = "9" ]; then
              echo "- REG $2: (sin tests propios — el import de la app se valida con la regresion de las demas)" >> "$SUM"
            else
              echo "- REG $2: ❌ ($passed)" >> "$SUM"
              { echo "### $2 fallos"; echo '```'; tail -40 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
          # smoke de import de las 2 sin tests
          python3 -c "import apps.ciclo_digital.infrastructure.network.network_client as m; print('ciclo_digital client OK')" >> "$SUM" 2>&1 || echo "- ciclo_digital import: ❌" >> "$SUM"
          python3 -c "import apps.mi_primer_empleo.infrastructure.network.network_client as m; print('mpe client OK')" >> "$SUM" 2>&1 || echo "- mpe import: ❌" >> "$SUM"
          exit 0

      - name: "[ENTREGA] commit solo si todas las apps afectadas verdes"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          ok=1
          for f in x1 x2 x3 x4 x5; do
            [ "$(cat /tmp/$f 2>/dev/null || echo 1)" = "0" ] || ok=0
          done
          grep -q "client OK" "$SUM" || ok=0
          if [ "$ok" != "1" ]; then
            log "**CONSOL-2 BLOQUEADA: alguna app rompio con el shim — ver arriba, se revierte con git checkout en el proximo run**"
            exit 1
          fi
          find apps shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps shared_engines
          set +e
          if git diff --cached --quiet; then
            log "**CONSOL-2: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(consolidacion-2): NetworkClient x7 -> 1 canonico en shared_engines/network + 7 shims de compatibilidad (regla 51: los imports de cada app intactos, cero rompimiento) — elimina la duplicacion transversal real detectada por la auditoria (regla 69) — regresion nexo/axis/agro/semilla/subastas verde + smoke de ciclo_digital y mi_primer_empleo"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**CONSOL-2 OK — NetworkClient unificado. CONSOL-3 final: server.py AGRO (regla 77, el delicado, con regresion por bloque).**"
          exit 0
