          escribir apps/laboratorio/infrastructure/providers/calibrator_manual.py << 'ZYRA_EOF'
          """Calibrador manual: homografia REAL por DLT (8x8 gaussiano)."""
          from apps.laboratorio.shared.exceptions.pipeline_errors import (
              SuperficieNoCalibradaError,
          )

          EPS = 1e-9


          def resolver_lineal(matriz: list, vector: list) -> list:
              """Eliminacion gaussiana con pivoteo parcial."""
              n = len(vector)
              m = [fila[:] + [vector[i]] for i, fila in enumerate(matriz)]
              for col in range(n):
                  pivote = max(range(col, n), key=lambda f: abs(m[f][col]))
                  if abs(m[pivote][col]) < EPS:
                      raise ValueError("Sistema singular: esquinas degeneradas.")
                  m[col], m[pivote] = m[pivote], m[col]
                  piv = m[col][col]
                  for k in range(col, n + 1):
                      m[col][k] /= piv
                  for f in range(n):
                      if f == col:
                          continue
                      factor = m[f][col]
                      if factor == 0.0:
                          continue
                      for k in range(col, n + 1):
                          m[f][k] -= factor * m[col][k]
              return [m[i][n] for i in range(n)]


          def aplicar(H: list, x: float, y: float) -> tuple:
              """Aplica la homografia H a un punto (x, y)."""
              w = H[6] * x + H[7] * y + H[8]
              if abs(w) < EPS:
                  raise ValueError("Punto en el infinito proyectivo.")
              return (
                  (H[0] * x + H[1] * y + H[2]) / w,
                  (H[3] * x + H[4] * y + H[5]) / w,
              )


          def invertir3x3(H: list) -> list:
              """Inversa de la homografia por adjunta / determinante."""
              a, b, c, d, e, f, g, h, i = H
              det = a * (e * i - f * h) - b * (d * i - f * g) + c * (d * h - e * g)
              if abs(det) < EPS:
                  raise ValueError("Homografia no invertible.")
              return [
                  (e * i - f * h) / det, (c * h - b * i) / det, (b * f - c * e) / det,
                  (f * g - d * i) / det, (a * i - c * g) / det, (c * d - a * f) / det,
                  (d * h - e * g) / det, (b * g - a * h) / det, (a * e - b * d) / det,
              ]


          class CalibradorManual:
              """Calcula la homografia fuente->superficie desde 4 esquinas."""

              def capacidades(self) -> dict:
                  return {
                      "metodo": "DLT con 4 pares de puntos (8x8 gauss)",
                      "verificacion": "round-trip de esquinas < 1e-6",
                  }

              def calibrar(self, esquinas_destino: list, ancho_origen: int, alto_origen: int) -> list:
                  if not isinstance(esquinas_destino, list) or len(esquinas_destino) != 4:
                      raise ValueError("Se requieren exactamente 4 esquinas.")
                  if ancho_origen < 16 or alto_origen < 16:
                      raise ValueError("Dimensiones de origen invalidas.")
                  origen = [
                      (0.0, 0.0), (float(ancho_origen), 0.0),
                      (float(ancho_origen), float(alto_origen)), (0.0, float(alto_origen)),
                  ]
                  destino = []
                  for punto in esquinas_destino:
                      if not isinstance(punto, (list, tuple)) or len(punto) != 2:
                          raise ValueError("Cada esquina debe ser [x, y].")
                      destino.append((float(punto[0]), float(punto[1])))
                  matriz = []
                  vector = []
                  for (x, y), (u, v) in zip(origen, destino):
                      matriz.append([x, y, 1.0, 0.0, 0.0, 0.0, -u * x, -u * y])
                      vector.append(u)
                      matriz.append([0.0, 0.0, 0.0, x, y, 1.0, -v * x, -v * y])
                      vector.append(v)
                  h = resolver_lineal(matriz, vector)
                  H = [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1.0]
                  for (x, y), (u, v) in zip(origen, destino):
                      pu, pv = aplicar(H, x, y)
                      if abs(pu - u) > 1e-6 or abs(pv - v) > 1e-6:
                          raise SuperficieNoCalibradaError(
                              "La homografia no reproduce las esquinas."
                          )
                  return H
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/providers/warper.py << 'ZYRA_EOF'
          """Warper de perspectiva: warp REAL con offset de bbox."""
          from apps.laboratorio.infrastructure.providers.calibrator_manual import (
              invertir3x3,
              aplicar,
          )
          from apps.laboratorio.infrastructure.providers.png_decoder import (
              decodificar_png_rgb,
          )
          from apps.laboratorio.infrastructure.providers.png_encoder import (
              encode_png_rgb,
          )
          from apps.laboratorio.shared.exceptions.pipeline_errors import (
              SuperficieNoCalibradaError,
          )

          FONDO = (15, 23, 42)


          def warpear(imagen_png: bytes, homografia: list, salida_ancho: int, salida_alto: int,
                      origen_x: float = 0.0, origen_y: float = 0.0) -> bytes:
              """Warp por mapeo inverso. origen_x/y: esquina del cuadrilatero
              en coordenadas de superficie, para que el pixel (0,0) de salida
              corresponda a esa esquina real."""
              if salida_ancho < 16 or salida_alto < 16:
                  raise ValueError("Dimensiones de salida invalidas.")
              if salida_ancho > 4096 or salida_alto > 4096:
                  raise ValueError("Salida maxima 4096x4096.")
              ancho, alto, pixeles = decodificar_png_rgb(imagen_png)
              try:
                  Hinv = invertir3x3(homografia)
              except ValueError as exc:
                  raise SuperficieNoCalibradaError(
                      "La homografia no es aplicable: " + str(exc)
                  ) from exc
              salida = bytearray(bytes(FONDO) * (salida_ancho * salida_alto * 3))
              for oy in range(salida_alto):
                  fila_base = oy * salida_ancho
                  sy_abs = origen_y + oy + 0.5
                  for ox in range(salida_ancho):
                      sx, sy = aplicar(Hinv, origen_x + ox + 0.5, sy_abs)
                      if 0.0 <= sx < ancho and 0.0 <= sy < alto:
                          idx = (int(sy) * ancho + int(sx)) * 3
                          out = (fila_base + ox) * 3
                          salida[out] = pixeles[idx]
                          salida[out + 1] = pixeles[idx + 1]
                          salida[out + 2] = pixeles[idx + 2]
              return encode_png_rgb(salida_ancho, salida_alto, bytes(salida))


          def caja_del_cuadrilatero(corners: list) -> tuple:
              xs = [float(p[0]) for p in corners]
              ys = [float(p[1]) for p in corners]
              x0 = max(0.0, min(xs))
              y0 = max(0.0, min(ys))
              x1 = max(xs)
              y1 = max(ys)
              return (int(x0), int(y0), max(1, int(x1 - x0)), max(1, int(y1 - y0)))
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/providers/scanner_photo.py << 'ZYRA_EOF'
          """Motor de escaneo por foto: analisis REAL y determinista."""
          import base64
          import binascii

          from apps.laboratorio.infrastructure.providers.png_decoder import (
              decodificar_png_rgb,
          )

          UMBRAL_BORDE = 30
          GRID_ESQUINAS = 6
          MAX_PUNTOS = 400


          def foto_desde_entrada(contenido_b64: str) -> bytes:
              """Decodifica el contenido base64 de una entrada foto/escaneo."""
              if not isinstance(contenido_b64, str) or not contenido_b64.strip():
                  raise ValueError("La entrada no tiene datos de foto.")
              crudo = contenido_b64.strip()
              if "," in crudo and crudo.startswith("data:"):
                  crudo = crudo.split(",", 1)[1]
              try:
                  return base64.b64decode(crudo, validate=True)
              except (binascii.Error, ValueError) as exc:
                  raise ValueError("Base64 de la foto invalido.") from exc


          class MotorEscaneoFoto:
              """Escanea una foto y produce estructura real."""

              def capacidades(self) -> dict:
                  return {
                      "entrada": "foto PNG capturada por el sistema",
                      "salidas": ("luminancia", "bordes", "esquinas", "profundidad_estimada", "malla"),
                      "alcance": "estructura monocular de una foto; multi-vista usa N fotos",
                  }

              def escanear(self, datos_png: bytes) -> dict:
                  ancho, alto, pixeles = decodificar_png_rgb(datos_png)
                  paso_l = max(1, min(ancho, alto) // 120)
                  lw = max(2, ancho // paso_l)
                  lh = max(2, alto // paso_l)
                  lum = [[0] * lw for _ in range(lh)]
                  for ly in range(lh):
                      for lx in range(lw):
                          px = min(ancho - 1, lx * paso_l)
                          py = min(alto - 1, ly * paso_l)
                          i = (py * ancho + px) * 3
                          r, g, b = pixeles[i], pixeles[i + 1], pixeles[i + 2]
                          lum[ly][lx] = round(0.299 * r + 0.587 * g + 0.114 * b)
                  bordes = []
                  for ly in range(1, lh - 1):
                      for lx in range(1, lw - 1):
                          gx = lum[ly][lx + 1] - lum[ly][lx - 1]
                          gy = lum[ly + 1][lx] - lum[ly - 1][lx]
                          mag = abs(gx) + abs(gy)
                          if mag > UMBRAL_BORDE:
                              bordes.append([lx * paso_l, ly * paso_l, min(255, mag)])
                  celdas_w = max(1, lw // GRID_ESQUINAS)
                  celdas_h = max(1, lh // GRID_ESQUINAS)
                  esquinas = []
                  for cy in range(GRID_ESQUINAS):
                      for cx in range(GRID_ESQUINAS):
                          mejor = None
                          for ly in range(cy * celdas_h, min(lh - 1, (cy + 1) * celdas_h)):
                              for lx in range(cx * celdas_w, min(lw - 1, (cx + 1) * celdas_w)):
                                  respuesta = 0
                                  centro = lum[ly][lx]
                                  for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                                      respuesta += abs(centro - lum[ly + dy][lx + dx]) ** 2
                                  if mejor is None or respuesta > mejor[0]:
                                      mejor = (respuesta, lx, ly)
                          if mejor and mejor[0] > 100:
                              esquinas.append({
                                  "x": mejor[1] * paso_l,
                                  "y": mejor[2] * paso_l,
                                  "respuesta": mejor[0],
                              })
                  esquinas.sort(key=lambda e: e["respuesta"], reverse=True)
                  esquinas = esquinas[:8]
                  puntos = []
                  paso_p = max(1, len(bordes) // MAX_PUNTOS) if bordes else 1
                  for i, borde in enumerate(bordes):
                      if i % paso_p == 0:
                          puntos.append(borde)
                  prof = []
                  for borde in puntos:
                      prof.append(round((borde[1] / max(1, alto - 1)) * 100.0, 2))
                  return {
                      "dimensiones": [ancho, alto],
                      "total_bordes": len(bordes),
                      "esquinas": esquinas,
                      "malla": puntos[:MAX_PUNTOS],
                      "profundidad_estimada": prof[:MAX_PUNTOS],
                      "metodo": "luminancia + gradiente + Moravec en grid + perspectiva",
                  }
          ZYRA_EOF
