name: ZYRA S21f motor con espejos HF+GitHub + prueba por el camino real de produccion

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  s21f:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar YAML del workflow
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml', encoding='utf-8')); print('YAML OK')"

      - name: Instalar dependencias
        run: |
          pip install --quiet cryptography numpy opencv-python-headless 2>&1 | tail -1
          python -c "import cryptography, numpy, cv2; print('deps OK:', cryptography.__version__, numpy.__version__, cv2.__version__)"

      - name: S21f parche (espejos de modelos dentro del proveedor)
        run: |
          cat > /tmp/s21f_fix.py << 'PYEOF'
          import os, sys, py_compile

          REPO = os.getcwd()
          OUT = []
          def P(s=""): OUT.append(str(s))

          BF = os.path.join(REPO, "shared_engines", "security", "biometrics_face.py")
          VT = os.path.join(REPO, "portal", "version.txt")

          src = open(BF, encoding="utf-8", errors="replace").read()
          lines = src.split("\n")

          if "_MIRRORS" in src:
              P("espejos ya presentes — nada que parchear")
              print("\n".join(OUT))
              sys.exit(0)

          i0 = None
          for i, l in enumerate(lines):
              if "_YUNET_URL = (" in l:
                  i0 = i
                  break
          P("ancla _YUNET_URL: %s" % (("linea " + str(i0 + 1)) if i0 is not None else "NO HALLADA"))
          if i0 is None:
              print("\n".join(OUT)); sys.exit(1)

          j0 = i0
          while j0 < len(lines) and lines[j0].strip() != ")":
              j0 += 1
          k0 = j0 + 1
          if k0 >= len(lines) or "_SFACE_URL = (" not in lines[k0]:
              P("estructura de constantes inesperada — NO se escribe")
              print("\n".join(OUT)); sys.exit(1)
          k = k0
          while k < len(lines) and lines[k].strip() != ")":
              k += 1
          P("bloque de constantes: lineas %d a %d" % (i0 + 1, k + 1))

          NEW_CONST = "\n".join([
              "    _MIRRORS = {",
              '        "face_detection_yunet_2023mar.onnx": [',
              '            "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx",',
              '            "https://huggingface.co/opencv/face_detection_yunet/resolve/main/face_detection_yunet_2023mar.onnx",',
              '            "https://raw.githubusercontent.com/opencv/opencv_zoo/refs/heads/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx",',
              "        ],",
              '        "sface_2021dec.onnx": [',
              '            "https://huggingface.co/opencv/face_recognition_sface/resolve/main/sface_2021dec.onnx",',
              '            "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/sface_2021dec.onnx",',
              '            "https://raw.githubusercontent.com/opencv/opencv_zoo/refs/heads/main/models/face_recognition_sface/sface_2021dec.onnx",',
              "        ],",
              "    }",
          ])

          lines2 = lines[:i0] + NEW_CONST.split("\n") + lines[k + 1:]

          i1 = None
          for i, l in enumerate(lines2):
              if l.startswith("    def _ensure_models(self):"):
                  i1 = i
                  break
          P("ancla _ensure_models: %s" % (("linea " + str(i1 + 1)) if i1 is not None else "NO HALLADA"))
          if i1 is None:
              print("\n".join(OUT)); sys.exit(1)
          j1 = i1 + 1
          while j1 < len(lines2) and not lines2[j1].startswith("    def "):
              j1 += 1
          P("metodo viejo: lineas %d a %d" % (i1 + 1, j1))

          NEW_M = "\n".join([
              "    def _ensure_models(self):",
              "        _os.makedirs(self._dir, exist_ok=True)",
              '        yunet = _os.path.join(self._dir, "face_detection_yunet_2023mar.onnx")',
              '        sface = _os.path.join(self._dir, "sface_2021dec.onnx")',
              "        for path in (yunet, sface):",
              "            if (not _os.path.exists(path)) or _os.path.getsize(path) < 10000:",
              '                nombre = _os.path.basename(path)',
              "                ultimo = None",
              "                for url in self._MIRRORS.get(nombre, []):",
              "                    try:",
              "                        req = _urlreq.Request(",
              "                            url,",
              '                            headers={"User-Agent": "zyra-vision/1.0"},',
              "                        )",
              "                        with _urlreq.urlopen(req, timeout=180) as r:",
              "                            data = r.read()",
              "                        if data and len(data) > 10000:",
              '                            tmp = path + ".tmp"',
              '                            with open(tmp, "wb") as f:',
              "                                f.write(data)",
              "                            _os.replace(tmp, path)",
              "                            ultimo = None",
              "                            break",
              '                        ultimo = RuntimeError("archivo corto: %d" % len(data))',
              "                    except Exception as exc:",
              "                        ultimo = exc",
              "                if ultimo is not None:",
              "                    from shared_engines.security.biometrics import (",
              "                        ProviderError,",
              "                    )",
              "                    raise ProviderError(",
              '                        "no se pudo descargar " + nombre',
              '                        + " desde ningun espejo: " + repr(ultimo)',
              "                    )",
              "        return yunet, sface",
          ])

          lines3 = lines2[:i1] + NEW_M.split("\n") + lines2[j1:]
          nuevo = "\n".join(lines3)

          g1 = nuevo.count("_MIRRORS")
          g2 = nuevo.count("_YUNET_URL")
          g3 = nuevo.count("_SFACE_URL")
          g4 = nuevo.count("def _ensure_models")
          g5 = nuevo.count("ProviderError")
          P("GATES | _MIRRORS=%d (>=2) _YUNET_URL=%d (0) _SFACE_URL=%d (0) _ensure_models=%d (1) ProviderError=%d (>=1)" % (g1, g2, g3, g4, g5))
          if not (g1 >= 2 and g2 == 0 and g3 == 0 and g4 == 1 and g5 >= 1):
              P("GATE FALLO — NO SE ESCRIBE")
              print("\n".join(OUT)); sys.exit(1)

          open(BF, "w", encoding="utf-8").write(nuevo)
          py_compile.compile(BF, doraise=True)
          P("COMPILACION OK")

          import re as _re
          cur = open(VT, encoding="utf-8").read().strip()
          m = _re.search(r"-(\d+)$", cur)
          if m:
              nv = cur[:m.start()] + "-" + str(int(m.group(1)) + 1)
              open(VT, "w", encoding="utf-8").write(nv + "\n")
              P("version: %s -> %s" % (cur, nv))

          P("S21f PATCH OK")
          print("\n".join(OUT))
          PYEOF
          python3 /tmp/s21f_fix.py > /tmp/s21f_out.txt 2>&1
          RC=$?
          cat /tmp/s21f_out.txt
          {
            echo "## S21f — parche espejos"
            echo ""
            echo '````'
            cat /tmp/s21f_out.txt
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Commit
        run: |
          if git diff --quiet -- shared_engines/security/biometrics_face.py portal/version.txt; then
            echo "Sin cambios por commitear." | tee commit_out.txt
          else
            git config user.name "zyra-ci"
            git config user.email "zyra-ci@users.noreply.github.com"
            git add shared_engines/security/biometrics_face.py portal/version.txt
            git commit -m "S21f: espejos de modelos (HF oficial + GitHub) en el proveedor, descarga falla como ProviderError (503 fail-closed)" | tee commit_out.txt
            git push
          fi
          { echo '````'; cat commit_out.txt; echo '````'; } >> "$GITHUB_STEP_SUMMARY"

      - name: PRUEBA REAL — el proveedor descarga sus modelos solo (camino de produccion)
        run: |
          cat > /tmp/s21f_motor.py << 'PYEOF'
          import os, sys, time, resource, traceback
          REPO = os.getcwd()
          sys.path.insert(0, REPO)
          os.chdir(REPO)
          os.environ["ZYRA_BIOMETRICS_PROVIDER"] = "zyra"
          os.environ["ZYRA_DATA_DIR"] = "/tmp/zyramodels"
          R = []
          def P(s=""): R.append(str(s))

          P("=== PRUEBA FINAL: ZYRA VISION por el camino real de produccion ===")
          ram0 = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024.0
          P("RAM base: %.0f MB" % ram0)

          prov = None
          try:
              from shared_engines.security.biometrics_face import ZyraVisionProvider
              prov = ZyraVisionProvider()
              P("PROVEEDOR CONSTRUIDO: name=%s liveness_supported=%s" % (prov.name, prov.liveness_supported))
          except Exception as e:
              P("FALLO construccion: " + repr(e)[:400])
              P(traceback.format_exc()[-800:])

          vec1 = vec2 = vec3 = None
          b1 = None
          if prov is not None:
              import urllib.request as u
              import numpy as np
              import cv2

              P("--- descarga de modelos POR EL PROVEEDOR (espejos HF+GitHub) ---")
              t0 = time.time()
              try:
                  yun, sfa = prov._ensure_models()
                  P("MODELOS LISTOS en %.1fs: yunet=%d bytes | sface=%d bytes" % (
                      time.time() - t0,
                      os.path.getsize(yun),
                      os.path.getsize(sfa),
                  ))
              except Exception as e:
                  P("DESCARGA fallo: " + repr(e)[:400])

              img_bytes = None
              urls = [
                  "https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/lena.jpg",
                  "https://raw.githubusercontent.com/opencv/opencv/master/samples/data/lena.jpg",
                  "https://raw.githubusercontent.com/scikit-image/scikit-image/main/skimage/data/astronaut.png",
              ]
              for url in urls:
                  try:
                      img_bytes = u.urlopen(url, timeout=120).read()
                      if img_bytes and len(img_bytes) > 10000:
                          P("rostro real descargado: %s (%d KB)" % (url.split("/")[-1], len(img_bytes) // 1024))
                          break
                      img_bytes = None
                  except Exception as e:
                      P("descarga fallo %s: %s" % (url.split("/")[-1], repr(e)[:120]))

              if img_bytes:
                  try:
                      b1 = img_bytes
                      vec1 = prov.extract_template(b1)
                      P("EXTRACCION OK: plantilla de %d dimensiones" % len(vec1))
                  except Exception as e:
                      P("EXTRACCION fallo: " + repr(e)[:300])
                      P(traceback.format_exc()[-500:])
                  try:
                      arr = cv2.imdecode(np.frombuffer(b1, np.uint8), cv2.IMREAD_COLOR)
                      okd, enc = cv2.imencode(".jpg", cv2.flip(arr, 1))
                      vec3 = prov.extract_template(enc.tobytes())
                  except Exception as e:
                      P("espejo fallo: " + repr(e)[:250])
                  try:
                      okd2, enc2 = cv2.imencode(".jpg", cv2.imread("shared_engines/security/biometrics.py"))
                      P("(nota: imagen no-facial de control)")
                      try:
                          prov.extract_template(enc2.tobytes())
                          P("AVISO: proceso imagen sin rostro (revisar gate)")
                      except Exception as e2:
                          P("GATE SIN ROSTRO: rechazada correctamente")
                  except Exception as e:
                      P("control no-facial: " + repr(e)[:200])
              if vec1 and vec3:
                  P("SIMILITUD MISMA PERSONA (espejo): %.4f (verify_auto=0.45, review=0.35)" % prov.compare(vec1, vec3))
              if vec1:
                  try:
                      ruido = list(np.random.RandomState(7).randn(128).astype(np.float32))
                      P("SIMILITUD VS RUIDO: %.4f (esperado ~0)" % prov.compare(vec1, ruido))
                  except Exception as e:
                      P("ruido fallo: " + repr(e)[:250])
                  try:
                      from shared_engines.security.biometrics import validate_template, BiometricsPolicy
                      validate_template(vec1, BiometricsPolicy())
                      P("VALIDACION POLITICA: OK (dims y norma L2 dentro de la politica de la Red)")
                  except Exception as e:
                      P("validacion politica fallo: " + repr(e)[:250])
                  try:
                      P("LIVENESS sobre rostro real: %s" % prov.check_liveness(b1))
                  except Exception as e:
                      P("liveness fallo: " + repr(e)[:250])

          ram1 = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024.0
          P("RAM pico: %.0f MB (limite del plan actual: 512)" % ram1)

          P("")
          P("--- fabrica del kernel ---")
          try:
              import importlib, inspect
              k = importlib.import_module("shared_engines.runtime.kernel")
              hallada = None
              for nombre, obj in inspect.getmembers(k, inspect.isfunction):
                  try:
                      if "ZYRA_BIOMETRICS_PROVIDER" in inspect.getsource(obj):
                          hallada = (nombre, obj)
                          break
                  except Exception:
                      pass
              if hallada:
                  res = hallada[1]()
                  P("FABRICA %s() -> %r" % (hallada[0], res))
                  P("INTEGRACION KERNEL: OK")
              else:
                  P("no se hallo la funcion fabrica")
          except Exception as e:
              P("prueba de fabrica fallo (no bloquea): " + repr(e)[:250])

          P("")
          P("================== VEREDICTO FINAL DEL MOTOR ==================")
          P("Proveedor construido: %s" % ("SI" if prov else "NO"))
          P("Descarga de modelos por espejos (camino de produccion): %s" % ("SI" if (prov and os.path.exists("/tmp/zyramodels/sface_2021dec.onnx")) else "NO"))
          P("Inferencia real: %s" % ("SI" if vec1 else "NO"))
          P("Plantilla validada contra la politica: %s" % ("SI" if vec1 else "NO"))
          P("RAM pico: %.0f MB" % ram1)
          if prov and vec1:
              P(">>> MOTOR ZYRA VISION: VALIDADO DE PUNTA A PUNTA.")
              P(">>> S23 con tu GO: numpy+opencv-python-headless a requirements-render.txt")
              P(">>> y tu agregas ZYRA_BIOMETRICS_PROVIDER=zyra en Render -> se apaga el mantenimiento.")
          else:
              P(">>> Fallo: el motivo exacto esta arriba.")
          print("\n".join(R))
          PYEOF
          python3 /tmp/s21f_motor.py > motor21f.txt 2>&1 || true
          cat motor21f.txt
          {
            echo "## S21f — PRUEBA FINAL del motor"
            echo ""
            echo '````'
            cat motor21f.txt
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-s21f
          path: motor21f.txt
