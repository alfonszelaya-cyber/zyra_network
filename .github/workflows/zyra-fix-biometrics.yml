          echo $? > /tmp/l3c
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/l3d.out 2>&1
          ok3=$?
          if [ "$(cat /tmp/l3c)" = "0" ] && [ "$ok3" = "0" ]; then echo "- L3c: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L3c: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L3c detalle"; echo '```'; tail -60 /tmp/l3c.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
