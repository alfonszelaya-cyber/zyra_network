                          "note": "no se guarda en claro"
                                  " (regla 63)"}


              def consume_recovery_db(db, *, user_id, code):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT rec_id FROM agro_sec_recovery WHERE"
                      " user_id = ? AND code_hash = ? AND used ="
                      " 0", (str(user_id), _sha(str(code))))
                  if row is None:
                      return {"ok": False,
                              "reason": "codigo invalido o"
                                        " usado"}
                  db.execute(
