name: "RED audit: GET /history/{zid} responde 500 (SOLO LECTURA - reproducir + ver codigo real)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: donde vive la ruta /history en shared_engines (codigo real)"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          print("=== menciones de 'history' en shared_engines/runtime ===")
          for f in sorted(Path("shared_engines").rglob("*.py")):
              txt = f.read_text(encoding="utf-8",
                  errors="replace")
              hits = []
              for i, l in enumerate(
                  txt.splitlines(), 1):
                  if "history" in l:
                      hits.append((i, l.strip()))
              if hits:
                  print()
                  print("-- " + str(f))
                  for i, l in hits[:20]:
                      print("  " + str(i).rjust(5)
                            + ": " + l[:120])
          D1EOF

      - name: "Dump 2: rutas GET conocidas del api de la Red (route_get / do_GET)"
        run: |
          python3 - <<'D2EOF'
          from pathlib import Path
          for nombre in ("shared_engines/runtime/api.py",
                         "shared_engines/runtime/combined_api.py"):
              p = Path(nombre)
              if not p.exists():
                  print("NO EXISTE " + nombre)
                  continue
              print()
              print("=== " + nombre
                    + " (secciones GET/history) ===")
              lines = p.read_text(
                  encoding="utf-8").splitlines()
              for i, l in enumerate(lines, 1):
                  if ("def do_GET" in l
                          or "def _route_get" in l
                          or "_get(" in l
                          or '"history"' in l
                          or "'history'" in l):
                      for n in range(max(0, i - 2),
                                     min(len(lines),
                                         i + 3)):
                          print(str(n + 1).rjust(5)
                                + ": " + lines[n])
                      print("---")
          D2EOF

      - name: "Dump 3: REPRODUCIR el 500 en vivo (kernel real + GET /history/{zid})"
        run: |
          python3 - <<'D3EOF'
          import io, json, sys, threading, time
          import urllib.error, urllib.request
          ERR = sys.stderr
          BUF = io.StringIO()
          from shared_engines.storage.database import (
              SQLiteAdapter)
          from shared_engines.common.clocks import (
              FrozenClock)
          from shared_engines.runtime.config import (
              RuntimeConfig)
          from shared_engines.runtime.kernel import (
              ZyraKernel)
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities)
          from shared_engines.runtime.combined_api import (
              serve_combined)
          from shared_engines.verification.signatures import (
              Ed25519Signer)
          from shared_engines.security.biometrics import (
              BiometricsEngine, BiometricsPolicy,
              DeterministicTestProvider, TemplateCipher)
          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=net_db, clock=FrozenClock(),
              signer=signer,
              config=RuntimeConfig(
                  host="127.0.0.1", port=0,
                  api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=net_db, clock=FrozenClock(),
              audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(
                  master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(
              net_db, FrozenClock(),
              identity=kernel.identity,
              signer=signer)
          srv = serve_combined(
              kernel, caps,
              host="127.0.0.1", port=0)
          threading.Thread(
              target=srv.serve_forever,
              daemon=True).start()
          time.sleep(0.4)
          base = ("http://127.0.0.1:"
              + str(srv.server_address[1]))

          def get(path):
              sys.stderr = BUF
              BUF.seek(0); BUF.truncate(0)
              try:
                  with urllib.request.urlopen(
                      base + path,
                      timeout=15) as r:
                      return (r.status,
                          r.read().decode(
                              "utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  return (e.code,
                      e.read().decode(
                          "utf-8", "replace"))
              finally:
                  sys.stderr = ERR

          print("### 1. enrolar persona real")
          import base64
          seed = base64.b64encode(
              b"audit-history-user").decode("ascii")
          ok, data, err = None, None, None
          import urllib.request as _u
          req = _u.Request(
              base + "/identity/enroll",
              data=json.dumps({
                  "kind": "person",
                  "display_name": "User Hist",
                  "actor": "audit",
                  "doc_image_b64": seed,
                  "selfie_image_b64": seed
              }).encode(),
              method="POST",
              headers={"Content-Type":
                  "application/json"})
          with _u.urlopen(req, timeout=15) as r:
              body = json.loads(r.read().decode())
          zid = ((body or {}).get("identity")
                 or {}).get("zid")
          print("zid=" + str(zid))

          print("### 2. GET /history/" + str(zid)
                + "  <- EL 500 DEL BACKLOG")
          st, body = get("/history/" + str(zid))
          print("STATUS: " + str(st))
          print("BODY[:600]: " + body[:600])
          cap = BUF.getvalue()
          if "Traceback" in cap:
              print(">>> SERVER STDERR (causa real):")
              print(cap[-3000:])

          print("### 3. variantes de ruta para comparar")
          for ruta in ("/history",
                       "/api/history/" + str(zid),
                       "/identity/history/"
                       + str(zid)):
              st2, b2 = get(ruta)
              print("GET " + ruta
                    + " -> " + str(st2)
                    + " " + b2[:150])
          D3EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
