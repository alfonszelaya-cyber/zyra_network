          echo "=== MOTOR RASTER (PNG real) ==="
          escribir apps/laboratorio/infrastructure/providers/renderer_raster.py << 'ZYRA_EOF'
          """Motor raster: PNG REAL con relleno solido y canal de PROFUNDIDAD.

          Rasteriza rectangulos, circulos y texto (fuente bitmap 3x5) sobre
          un buffer RGB usando slices por fila (rapido incluso en 4K).
          La profundidad es un PNG en grises: fondo oscuro, frente claro.
          """
          import math

          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.font_bitmap import (
              ANCHO as GLIFO_ANCHO,
              ALTO as GLIFO_ALTO,
              texto_a_lineas,
          )
          from apps.laboratorio.infrastructure.providers.png_encoder import (
              encode_png_gray,
              encode_png_rgb,
          )
          from apps.laboratorio.shared.adapters.engine_adapter import AdaptadorMotor
          from apps.laboratorio.shared.exceptions.render_errors import (
              EscenaVaciaError,
              RenderFallidoError,
          )
          from apps.laboratorio.shared.interfaces.renderer import Renderer, ResultadoRender

          PROFUNDIDAD_POR_CAPA = {"fondo": 60, "medio": 150, "frente": 255}


          def hex_a_rgb(color: str) -> tuple:
              """Convierte #RRGGBB a (r, g, b) enteros."""
              color = str(color).strip()
              if not color.startswith("#") or len(color) != 7:
                  raise RenderFallidoError("Color invalido: " + repr(color))
              try:
                  return (
                      int(color[1:3], 16), int(color[3:5], 16), int(color[5:7], 16)
                  )
              except ValueError as exc:
                  raise RenderFallidoError("Color invalido: " + repr(color)) from exc


          class RasterizadorBase:
              """Lienzo RGB + profundidad con operaciones por slice."""

              def __init__(self, ancho: int, alto: int, color_fondo: tuple):
                  if ancho < 16 or alto < 16:
                      raise RenderFallidoError("Dimensiones del lienzo invalidas.")
                  self.w = int(ancho)
                  self.h = int(alto)
                  self.buf = bytearray(bytes(color_fondo) * (self.w * self.h))
                  self.depth = bytearray(self.w * self.h)

              def _clip(self, x, y, w, h):
                  x0 = max(0, int(x))
                  y0 = max(0, int(y))
                  x1 = min(self.w, int(x + w))
                  y1 = min(self.h, int(y + h))
                  return x0, y0, x1, y1

              def rect(self, x, y, w, h, color: tuple, depth_val: int) -> None:
                  x0, y0, x1, y1 = self._clip(x, y, w, h)
                  if x1 <= x0 or y1 <= y0:
                      return
                  fila = bytes(color) * (x1 - x0)
                  for yy in range(y0, y1):
                      base = yy * self.w
                      self.buf[(base + x0) * 3:(base + x1) * 3] = fila
                      self.depth[base + x0:base + x1] = bytes([depth_val]) * (x1 - x0)

              def circle(self, cx, cy, r, color: tuple, depth_val: int) -> None:
                  if r <= 0:
                      return
                  r = int(r)
                  fila_color = None
                  for dy in range(-r, r + 1):
                      yy = int(cy) + dy
                      if yy < 0 or yy >= self.h:
                          continue
                      half = int(math.sqrt(max(0.0, r * r - dy * dy)))
                      x0 = max(0, int(cx) - half)
                      x1 = min(self.w, int(cx) + half + 1)
                      if x1 <= x0:
                          continue
                      if fila_color is None or len(fila_color) != (x1 - x0) * 3:
                          fila_color = bytes(color) * (x1 - x0)
                      base = yy * self.w
                      self.buf[(base + x0) * 3:(base + x1) * 3] = fila_color
                      self.depth[base + x0:base + x1] = bytes([depth_val]) * (x1 - x0)

              def texto(self, x, y, contenido: str, color: tuple, depth_val: int, escala: int = 2) -> None:
                  """Rasteriza texto con la fuente 3x5 a la escala dada."""
                  if escala < 1:
                      raise RenderFallidoError("Escala de texto invalida.")
                  px = x
                  for caracter, patrones in texto_a_lineas(contenido):
                      for fy, fila_bits in enumerate(patrones):
                          for fx in range(GLIFO_ANCHO):
                              if not (fila_bits >> (GLIFO_ANCHO - 1 - fx)) & 1:
                                  continue
                              self.rect(
                                  px + fx * escala, y + fy * escala,
                                  escala, escala, color, depth_val,
                              )
                      px += (GLIFO_ANCHO + 1) * escala
                      if px > self.w:
                          break

              def imagen_png(self) -> bytes:
                  """Codifica el lienzo RGB a PNG real."""
                  return encode_png_rgb(self.w, self.h, bytes(self.buf))

              def profundidad_png(self) -> bytes:
                  """Codifica el canal de profundidad a PNG en grises."""
                  return encode_png_gray(self.w, self.h, bytes(self.depth))


          class MotorRenderRaster(AdaptadorMotor, Renderer):
              """Calidad ALTA: PNG 1920x1080 con relleno solido + profundidad."""

              def __init__(self):
                  AdaptadorMotor.__init__(self, "renderer_raster", "renderer", "1.0.0")
                  self.marcar_disponible()

              def capacidades(self) -> dict:
                  return {
                      "calidades": ["alta"],
                      "profundidad": True,
                      "formato": "png",
                      "texto": "fuente bitmap 3x5 real",
                      "nota": "El canal de profundidad se produce como PNG en grises",
                  }

              def renderizar(self, escena, opciones) -> ResultadoRender:
                  if not isinstance(escena, Escena3D):
                      raise RenderFallidoError("Se esperaba una Escena3D.")
                  if not escena.es_renderizable:
                      raise EscenaVaciaError("La escena no tiene objetos.")
                  ancho = int(opciones.get("ancho", escena.ancho))
                  alto = int(opciones.get("alto", escena.alto))
                  lienzo = RasterizadorBase(ancho, alto, (15, 23, 42))
                  sx = ancho / escena.ancho
                  sy = alto / escena.alto
                  escala_texto = max(2, int(round(min(sx, sy) * 2)))
                  orden = ("fondo", "medio", "frente")
                  for capa in orden:
                      depth_val = PROFUNDIDAD_POR_CAPA[capa]
                      for obj in escena.objetos:
                          if obj.get("capa", "medio") != capa:
                              continue
                          color = hex_a_rgb(obj["color"])
                          if obj["forma"] == "rect":
                              lienzo.rect(
                                  obj["x"] * sx, obj["y"] * sy,
                                  obj["w"] * sx, obj["h"] * sy, color, depth_val,
                              )
                          elif obj["forma"] == "circle":
                              lienzo.circle(
                                  obj["cx"] * sx, obj["cy"] * sy,
                                  obj["r"] * min(sx, sy), color, depth_val,
                              )
                          else:
                              lienzo.texto(
                                  obj["x"] * sx, obj["y"] * sy,
                                  obj["contenido"], color, depth_val, escala_texto,
                              )
                  return ResultadoRender(
                      imagen_bytes=lienzo.imagen_png(),
                      profundidad_bytes=lienzo.profundidad_png(),
                      ancho=ancho,
                      alto=alto,
                      metadata={"formato": "png", "motor": "renderer_raster", "profundidad": True},
                  )
          ZYRA_EOF
          echo "=== MOTOR 3D (proyeccion perspectiva real) ==="
          escribir apps/laboratorio/infrastructure/providers/renderer_3d.py << 'ZYRA_EOF'
          """Motor 3D: proyeccion perspectiva REAL sobre el rasterizador.

          Cada capa recibe una profundidad Z (fondo lejos, frente cerca) y
          los objetos se proyectan hacia un punto de fuga central:
            escala = f / (f + z)   y   x' = cx + (x - cx) * escala
          El resultado es un PNG con perspectiva verdadera + PROFUNDIDAD.
          """
          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.renderer_raster import (
              PROFUNDIDAD_POR_CAPA,
              MotorRenderRaster,
              RasterizadorBase,
              hex_a_rgb,
          )
          from apps.laboratorio.shared.adapters.engine_adapter import AdaptadorMotor
          from apps.laboratorio.shared.exceptions.render_errors import (
              EscenaVaciaError,
              RenderFallidoError,
          )
          from apps.laboratorio.shared.interfaces.renderer import Renderer, ResultadoRender

          Z_POR_CAPA = {"fondo": 2.0, "medio": 1.0, "frente": 0.2}
          DISTANCIA_FOCAL = 3.0


          class MotorRender3D(AdaptadorMotor, Renderer):
              """Calidad 3D: perspectiva con punto de fuga + profundidad."""

              def __init__(self):
                  AdaptadorMotor.__init__(self, "renderer_3d", "renderer", "1.0.0")
                  self.marcar_disponible()

              def capacidades(self) -> dict:
                  return {
                      "calidades": ["3d"],
                      "profundidad": True,
                      "proyeccion": "perspectiva con punto de fuga central",
                      "z_por_capa": Z_POR_CAPA,
                  }

              @staticmethod
              def _proyectar(valor, centro, z) -> float:
                  """Proyeccion perspectiva de una coordenada sobre un eje."""
                  escala = DISTANCIA_FOCAL / (DISTANCIA_FOCAL + z)
                  return centro + (valor - centro) * escala

              def renderizar(self, escena, opciones) -> ResultadoRender:
                  if not isinstance(escena, Escena3D):
                      raise RenderFallidoError("Se esperaba una Escena3D.")
                  if not escena.es_renderizable:
                      raise EscenaVaciaError("La escena no tiene objetos.")
                  ancho = int(opciones.get("ancho", escena.ancho))
                  alto = int(opciones.get("alto", escena.alto))
                  cx, cy = ancho / 2.0, alto / 2.0
                  lienzo = RasterizadorBase(ancho, alto, (15, 23, 42))
                  sx = ancho / escena.ancho
                  sy = alto / escena.alto
                  escala_texto = max(2, int(round(min(sx, sy) * 2)))
                  orden = ("fondo", "medio", "frente")
                  for capa in orden:
                      z = Z_POR_CAPA[capa]
                      depth_val = PROFUNDIDAD_POR_CAPA[capa]
                      for obj in escena.objetos:
                          if obj.get("capa", "medio") != capa:
                              continue
                          color = hex_a_rgb(obj["color"])
                          if obj["forma"] == "rect":
                              x1 = self._proyectar(obj["x"] * sx, cx, z)
                              y1 = self._proyectar(obj["y"] * sy, cy, z)
                              x2 = self._proyectar((obj["x"] + obj["w"]) * sx, cx, z)
                              y2 = self._proyectar((obj["y"] + obj["h"]) * sy, cy, z)
                              lienzo.rect(x1, y1, x2 - x1, y2 - y1, color, depth_val)
                          elif obj["forma"] == "circle":
                              cxp = self._proyectar(obj["cx"] * sx, cx, z)
                              cyp = self._proyectar(obj["cy"] * sy, cy, z)
                              rp = obj["r"] * min(sx, sy) * (DISTANCIA_FOCAL / (DISTANCIA_FOCAL + z))
                              lienzo.circle(cxp, cyp, rp, color, depth_val)
                          else:
                              lienzo.texto(
                                  self._proyectar(obj["x"] * sx, cx, z),
                                  self._proyectar(obj["y"] * sy, cy, z),
                                  obj["contenido"], color, depth_val, escala_texto,
                              )
                  return ResultadoRender(
                      imagen_bytes=lienzo.imagen_png(),
                      profundidad_bytes=lienzo.profundidad_png(),
                      ancho=ancho,
                      alto=alto,
                      metadata={
                          "formato": "png", "motor": "renderer_3d",
                          "profundidad": True, "proyeccion": "perspectiva",
                      },
                  )
          ZYRA_EOF
          echo "=== MOTOR FOTOREAL (iluminacion real + 4K) ==="
          escribir apps/laboratorio/infrastructure/providers/renderer_photoreal.py << 'ZYRA_EOF'
          """Motor FOTOREAL: iluminacion real sobre el rasterizador en 4K.

          Aplica el programa de luz de la escena (color dominante e
          intensidad) con atenuacion por capa: el frente recibe mas luz
          que el fondo. Es el primer escalon del fotorrealismo; el ray
          tracing y el PBR completo llegan con el motor GPU.
          """
          from apps.laboratorio.domain.lighting import ProgramaLuz
          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.renderer_3d import (
              Z_POR_CAPA,
              MotorRender3D,
          )
          from apps.laboratorio.infrastructure.providers.renderer_raster import (
              PROFUNDIDAD_POR_CAPA,
              RasterizadorBase,
              hex_a_rgb,
          )
          from apps.laboratorio.shared.adapters.engine_adapter import AdaptadorMotor
          from apps.laboratorio.shared.exceptions.render_errors import (
              EscenaVaciaError,
              RenderFallidoError,
          )
          from apps.laboratorio.shared.interfaces.renderer import Renderer, ResultadoRender

          LUZ_POR_CAPA = {"fondo": 0.55, "medio": 0.75, "frente": 1.0}
          LUZ_DEFECTO = ("#E2E8F0", 0.45)


          class MotorRenderFotoreal(AdaptadorMotor, Renderer):
              """Calidad FOTORREAL: 4K, iluminacion por programa, profundidad."""

              def __init__(self):
                  AdaptadorMotor.__init__(self, "renderer_photoreal", "renderer", "0.1.0")
                  self.marcar_disponible()

              def capacidades(self) -> dict:
                  return {
                      "calidades": ["fotorreal"],
                      "profundidad": True,
                      "iluminacion": "programa de luz + atenuacion por capa",
                      "resolucion": "4K segun PoliticaCalidad",
                      "nota": "Ray tracing y PBR completo llegan con el motor GPU",
                  }

              @staticmethod
              def _luz_de(programa_luz) -> tuple:
                  """Color e intensidad de luz desde el programa real o defecto."""
                  if programa_luz is None:
                      return (
                          hex_a_rgb(LUZ_DEFECTO[0]), float(LUZ_DEFECTO[1])
                      )
                  if not isinstance(programa_luz, ProgramaLuz):
                      raise RenderFallidoError("Programa de luz invalido.")
                  color = hex_a_rgb(programa_luz.color_dominate)
                  mejor_intensidad = 0.0
                  for paso in programa_luz.pasos:
                      intensidad = float(paso.get("intensidad", 0.0))
                      if intensidad > mejor_intensidad:
                          mejor_intensidad = intensidad
                  return color, max(0.05, min(1.0, mejor_intensidad))

              def renderizar(self, escena, opciones, programa_luz=None) -> ResultadoRender:
                  if not isinstance(escena, Escena3D):
                      raise RenderFallidoError("Se esperaba una Escena3D.")
                  if not escena.es_renderizable:
                      raise EscenaVaciaError("La escena no tiene objetos.")
                  ancho = int(opciones.get("ancho", escena.ancho))
                  alto = int(opciones.get("alto", escena.alto))
                  luz_rgb, luz_int = self._luz_de(programa_luz)
                  proyector = MotorRender3D()
                  cx, cy = ancho / 2.0, alto / 2.0
                  lienzo = RasterizadorBase(ancho, alto, (15, 23, 42))
                  sx = ancho / escena.ancho
                  sy = alto / escena.alto
                  escala_texto = max(2, int(round(min(sx, sy) * 2)))
                  orden = ("fondo", "medio", "frente")
                  for capa in orden:
                      z = Z_POR_CAPA[capa]
                      depth_val = PROFUNDIDAD_POR_CAPA[capa]
                      factor = LUZ_POR_CAPA[capa]
                      ambiente = 1.0 - luz_int
                      for obj in escena.objetos:
                          if obj.get("capa", "medio") != capa:
                              continue
                          base = hex_a_rgb(obj["color"])
                          color = tuple(
                              max(0, min(255, int(
                                  c * (ambiente + luz_int * factor * (l / 255.0))
                              )))
                              for c, l in zip(base, luz_rgb)
                          )
                          if obj["forma"] == "rect":
                              x1 = proyector._proyectar(obj["x"] * sx, cx, z)
                              y1 = proyector._proyectar(obj["y"] * sy, cy, z)
                              x2 = proyector._proyectar((obj["x"] + obj["w"]) * sx, cx, z)
                              y2 = proyector._proyectar((obj["y"] + obj["h"]) * sy, cy, z)
                              lienzo.rect(x1, y1, x2 - x1, y2 - y1, color, depth_val)
                          elif obj["forma"] == "circle":
                              cxp = proyector._proyectar(obj["cx"] * sx, cx, z)
                              cyp = proyector._proyectar(obj["cy"] * sy, cy, z)
                              rp = obj["r"] * min(sx, sy) * (3.0 / (3.0 + z))
                              lienzo.circle(cxp, cyp, rp, color, depth_val)
                          else:
                              lienzo.texto(
                                  proyector._proyectar(obj["x"] * sx, cx, z),
                                  proyector._proyectar(obj["y"] * sy, cy, z),
                                  obj["contenido"], color, depth_val, escala_texto,
                              )
                  return ResultadoRender(
                      imagen_bytes=lienzo.imagen_png(),
                      profundidad_bytes=lienzo.profundidad_png(),
                      ancho=ancho,
                      alto=alto,
                      metadata={
                          "formato": "png", "motor": "renderer_photoreal",
                          "profundidad": True, "iluminacion": True,
                      },
                  )
