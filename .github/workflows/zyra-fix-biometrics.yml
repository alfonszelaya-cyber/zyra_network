                                     birth_date="", sire_id="",
                                     dam_id="", created_at=""):
                  ensure_db(db)
                  if not str(species).strip():
                      raise ValueError("species requerida")
                  for pid_val in (sire_id, dam_id):
                      if str(pid_val).strip():
                          parent = db.query_one(
                              "SELECT animal_id FROM"
                              " agro_animals WHERE animal_id ="
