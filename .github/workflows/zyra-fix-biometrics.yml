name: "AGRO LIMPIEZA v2: consolidaciones pendientes + borrado no-esencial + verificacion completa"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - consolidar: migraciones->agro_store.py"
        run: |
          python3 - <<'C1EOF'
          import textwrap
          from pathlib import Path

          mig = Path(
              "apps/agro/infrastructure/persistence/"
              "agro_migrations.py")
          store = Path(
              "apps/agro/infrastructure/persistence/"
              "agro_store.py")
          st = store.read_text(encoding="utf-8")

          if "run_agro_migrations" in st:
              print("SKIP (ya consolidado)")
          else:
              assert mig.exists(), "mig no existe"
              mt = mig.read_text(encoding="utf-8")
              i = mt.find("MIGRATIONS = (")
              assert i >= 0
              bloque = mt[i:]
              st = st.rstrip("\n") + "\n" + (
                  "\n\n# ---- additive: migraciones\n"
                  "# versionadas consolidadas aqui.\n"
                  + bloque
              )
              compile(st, str(store), "exec")
              store.write_text(st, encoding="utf-8")
              assert "run_agro_migrations" in store.read_text(encoding="utf-8")
              print("OK migraciones -> agro_store.py")
          C1EOF

      - name: "Paso 2 - consolidar: TEXTOS -> constants/business/constants.py"
        run: |
          python3 - <<'C2EOF'
          import textwrap
          from pathlib import Path

          es = Path("apps/agro/assets/translations/es.py")
          cons = Path(
              "apps/agro/constants/business/constants.py")
          ct = cons.read_text(encoding="utf-8")

          if "TEXTOS" in ct:
              print("SKIP (ya consolidado)")
          else:
              assert es.exists()
              et = es.read_text(encoding="utf-8")
              i = et.find("TEXTOS = {")
              assert i >= 0
              ct = ct.rstrip("\n") + "\n" + (
                  "\n\n# ---- additive: contrato de UI.\n"
                  + et[i:]
              )
              compile(ct, str(cons), "exec")
              cons.write_text(ct, encoding="utf-8")
              assert "TEXTOS" in cons.read_text(encoding="utf-8")
              print("OK TEXTOS -> constants")
          C2EOF

      - name: "Paso 3 - consolidar: plantilla -> shared/utils.py"
        run: |
          python3 - <<'C3EOF'
          from pathlib import Path

          pb = Path(
              "apps/agro/assets/templates/page_base.py")
          utils = Path("apps/agro/shared/utils.py")
          ut = utils.read_text(encoding="utf-8")

          if "render_page" in ut:
              print("SKIP (ya consolidado)")
          else:
              assert pb.exists()
              pt = pb.read_text(encoding="utf-8")
              i = pt.find("PAGE_CSS = (")
              assert i >= 0
              ut = ut.rstrip("\n") + "\n" + (
                  "\n\n# ---- additive: plantilla base.\n"
                  + pt[i:]
              )
              compile(ut, str(utils), "exec")
              utils.write_text(ut, encoding="utf-8")
              assert "render_page" in utils.read_text(encoding="utf-8")
              print("OK plantilla -> utils")
          C3EOF

      - name: "Paso 4 - consolidar: test_agro_superapp -> test_agro_e2e_full (helpers _sapp_*)"
        run: |
          python3 - <<'C4EOF'
          import re
          from pathlib import Path

          sup = Path(
              "apps/agro/tests/test_agro_superapp.py")
          full = Path(
              "apps/agro/tests/test_agro_e2e_full.py")
          ft = full.read_text(encoding="utf-8")

          if "test_acceptance_full_producer_journey" in ft:
              print("SKIP (ya consolidado)")
          else:
              assert sup.exists()
              st = sup.read_text(encoding="utf-8")
              cuerpo = st
              for viejo, nuevo in [
                  ("_post_code", "_sapp_post_code"),
                  ("_register_sec", "_sapp_register_sec"),
                  ("_boot_sec", "_sapp_boot_sec"),
                  ("_post_sec", "_sapp_post_sec"),
                  ("_get_sec", "_sapp_get_sec"),
                  ("_govj", "_sapp_govj"),
                  ("_gjp", "_sapp_gjp"),
                  ("_register", "_sapp_register"),
                  ("_seed", "_sapp_seed"),
                  ("_post", "_sapp_post"),
                  ("_get", "_sapp_get"),
                  ("_pj", "_sapp_pj"),
                  ("_html", "_sapp_html"),
              ]:
                  cuerpo = re.sub(
                      r"\b" + viejo + r"\b", nuevo,
                      cuerpo)
              cuerpo = cuerpo.replace(
                  "from __future__ import annotations\n",
                  "")
              cuerpo = cuerpo.replace(
                  "from apps.agro.infrastructure.persistence.agro_migrations import",
                  "from apps.agro.infrastructure.persistence.agro_store import")
              cuerpo = cuerpo.replace(
                  "from apps.agro.assets.translations.es import",
                  "from apps.agro.constants.business.constants import")

              imports_extra = []
              for frag, token in [
                  ("import json\n", "json."),
                  ("import threading\n", "threading.Thread"),
                  ("import time\n", "time.sleep"),
                  ("import urllib.error\n", "urllib.error"),
                  ("import urllib.request\n", "urllib.request."),
                  ("from pathlib import Path\n", "Path("),
                  ("from shared_engines.common.clocks import FrozenClock\n", "FrozenClock"),
                  ("from shared_engines.storage.database import SQLiteAdapter\n", "SQLiteAdapter"),
                  ("from shared_engines.runtime.capabilities import ZyraCapabilities\n", "ZyraCapabilities"),
                  ("from shared_engines.runtime.combined_api import serve_combined\n", "serve_combined"),
                  ("from shared_engines.runtime.config import RuntimeConfig\n", "RuntimeConfig"),
                  ("from shared_engines.runtime.kernel import ZyraKernel\n", "ZyraKernel"),
                  ("from shared_engines.security.biometrics import BiometricsEngine\n", "BiometricsEngine"),
                  ("from shared_engines.verification.signatures import Ed25519Signer\n", "Ed25519Signer"),
                  ("from apps.agro.infrastructure.network.network_client import NetworkClient\n", "NetworkClient"),
                  ("from apps.agro.services.zyra_link import ZyraLink\n", "ZyraLink"),
              ]:
                  if token in cuerpo and frag not in ft:
                      imports_extra.append(frag)

              if imports_extra:
                  lines = ft.splitlines(keepends=True)
                  out = []
                  done = False
                  for l in lines:
                      out.append(l)
                      if not done and l.strip().startswith(
                          "from __future__ import"):
                          for frag in imports_extra:
                              out.append(frag)
                          done = True
                  ft = "".join(out)

              ft = ft.rstrip("\n") + "\n" + (
                  "\n\n# ====== RUN A-G consolidado\n"
                  "# (desde test_agro_superapp.py)\n"
                  "# ======\n"
              ) + cuerpo

              compile(ft, str(full), "exec")
              full.write_text(ft, encoding="utf-8")
              print("OK superapp -> e2e_full")

          escrito = full.read_text(encoding="utf-8")
          for req in (
              "test_navigation_by_roles",
              "test_commerce_full_cycle",
              "test_acceptance_full_producer_journey",
              "test_load_basic_throughput",
              "test_audit_chain_and_tamper_detection",
              "AgroFullE2E",
          ):
              assert req in escrito, "falta " + req
          print("OK e2e_full completo verificado")
          C4EOF

      - name: "Paso 5 - escaneo corregido + BORRADO (imports dinamicos)"
        run: |
          python3 - <<'DELEOF'
          import json
          import shutil
          from pathlib import Path

          app = Path("apps/agro")
          archivos = {}
          for p in sorted(app.rglob("*.py")):
              if "__pycache__" in p.parts:
                  continue
              archivos[p] = p.read_text(
                  encoding="utf-8", errors="ignore")

          def resolve_abs(mod):
              base = Path(mod.replace(".", "/"))
              for c in (base.with_suffix(".py"),
                        base / "__init__.py"):
                  if c.exists():
                      return c
              return None

          deps = {}
          for src, t in archivos.items():
              s = set()
              for m in re_findimports(t):
                  pass
              deps[src] = s

          def re_findimports(t):
              return []

          # -- solucion sin funciones anidadas rotas --
          deps = {}
          for src, t in archivos.items():
              s = set()
              # estaticos relativos
              for m in __import__("re").finditer(
                  r'^\s*from\s+((?:\.)+)([\w\.]*)\s+import\s+(.+)$',
                  t, __import__("re").M):
                  ndots = len(m.group(1))
                  d = src.parent
                  for _ in range(ndots - 1):
                      d = d.parent
                  mod = m.group(2)
                  if mod:
                      target = d / mod.replace(".", "/")
                      for c2 in (
                          target.with_suffix(".py"),
                          target / "__init__.py"):
                          if c2.exists():
                              s.add(c2)
                  for nm in [
                      x.strip().split(" as ")[0].strip()
                      for x in m.group(3).split(",")]:
                      nm2 = (
                          mod + "." + nm) if mod else nm
                      target = d / nm2.replace(".", "/")
                      for c2 in (
                          target.with_suffix(".py"),
                          target / "__init__.py"):
                          if c2.exists():
                              s.add(c2)
              # absolutos y DINAMICOS (strings)
              for m in __import__("re").finditer(
                  r'"(apps\.agro[\w\.]*)"',
                  t):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      s.add(c)
              for m in __import__("re").finditer(
                  r'^\s*from\s+(apps\.agro[\w\.]*)\s+import',
                  t, __import__("re").M):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      s.add(c)
              for m in __import__("re").finditer(
                  r'^\s*import\s+(apps\.agro[\w\.]*)',
                  t, __import__("re").M):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      s.add(c)
              deps[src] = s

          roots = [app / "server.py"] + [
              p for p in archivos
              if "tests" in p.parts
              and p.name.startswith("test_")
          ]
          keep = set()
          work = list(roots)
          while work:
              f = work.pop(0)
              if f in keep or f not in archivos:
                  continue
              keep.add(f)
              for d in deps.get(f, set()):
                  work.append(d)
          for p in list(keep):
              d = p.parent
              while True:
                  ini = d / "__init__.py"
                  if ini.exists() and ini in archivos:
                      keep.add(ini)
                  if d == app or d == app.parent:
                      break
                  d = d.parent

          borrar = [
              p for p in archivos if p not in keep
          ]
          n = 0
          for p in borrar:
              if p.exists():
                  p.unlink()
                  n += 1
          print("archivos .py borrados:", n)
          print("archivos .py restantes:",
                len(list(app.rglob("*.py"))))
          print("KEEP total:", len(keep))
          DELEOF

      - name: "Paso 6 - carpetas vacias fuera"
        run: |
          python3 - <<'CVFEOF'
          import shutil
          from pathlib import Path
          app = Path("apps/agro")
          carpetas = 0
          for d in sorted(
              app.rglob("*"), reverse=True):
              if not d.is_dir() or "__pycache__" in d.parts:
                  continue
              resto = [
                  x for x in d.iterdir()
                  if x.name != "__pycache__"
              ]
              if not resto:
                  shutil.rmtree(d)
                  carpetas += 1
          for pc in app.rglob("__pycache__"):
              shutil.rmtree(pc, ignore_errors=True)
          print("carpetas vacias eliminadas:", carpetas)
          CVFEOF

      - name: "Paso 7 - eliminar restos duplicados conocidos"
        run: |
          python3 - <<'RESTEOF'
          from pathlib import Path
          for rel in (
              "apps/agro/infrastructure/persistence/"
              "agro_migrations.py",
              "apps/agro/assets/translations/es.py",
              "apps/agro/assets/templates/page_base.py",
              "apps/agro/tests/test_agro_superapp.py",
              "apps/agro/services/market_service.py",
          ):
              p = Path(rel)
              if p.exists():
                  p.unlink()
                  print("ELIMINADO", rel)
          exe = Path("apps/agro/modules/executive")
          if exe.exists():
              import shutil
              solo = all(
                  (p.name == "__init__.py"
                   and not p.read_text(
                       encoding="utf-8",
                       errors="ignore").strip())
                  for p in exe.rglob("*.py")
              )
              if solo:
                  shutil.rmtree(exe)
                  print("ELIMINADA modules/executive")
          RESTEOF

      - name: "Paso 8 - verificacion dura con interprete fresco"
        run: |
          python3 -c "
          import apps.agro.server as s
          assert hasattr(s, 'serve_agro')
          from apps.agro.services.zyra_link import ZyraLink, emit_event_db, AGRO_EVENT_CATALOG
          assert len(AGRO_EVENT_CATALOG) == 12
          from apps.agro.security.operation_matrix import OperationMatrix, OPERATIONS
          assert 'network.emit' in OPERATIONS
          from apps.agro.infrastructure.persistence.agro_store import run_agro_migrations, MIGRATIONS
          assert len(MIGRATIONS) >= 6
          from apps.agro.constants.business.constants import TEXTOS
          assert TEXTOS['panel_titulo'] == 'Mi Panel'
          from apps.agro.shared.utils import render_page
          assert 'DOCTYPE' in render_page('T', 'x')
          print('OK: server + todos los simbolos vivos tras limpieza')
          "

      - name: "Paso 9 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: "Paso 10 - inventario final"
        run: |
          python3 -c "
          from pathlib import Path
          app = Path('apps/agro')
          pys = [p for p in app.rglob('*.py') if '__pycache__' not in p.parts]
          con_codigo = [p for p in pys if p.read_text(encoding='utf-8', errors='ignore').strip()]
          dirs = set(p.parent for p in pys)
          print('ARQUITECTURA LIMPIA AGRO:')
          print('  archivos .py totales:', len(pys))
          print('  con codigo:', len(con_codigo))
          print('  carpetas:', len(dirs))
          "

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO LIMPIEZA v2: consolidaciones + borrado no-esencial" -m "Consolidaciones pendientes de RUN H (migraciones->store, TEXTOS->constants, plantilla->utils, superapp->e2e_full con _sapp_*); borrado con escaneo que detecta imports dinamicos (strings apps.agro.*); carpetas vacias fuera; restos duplicados eliminados; verificacion dura interprete fresco + GATE."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
