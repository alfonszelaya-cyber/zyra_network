          cat > "apps/subastas/modules/$RDIR/radarvip_store.py" <<'RVF'
          """RADAR VIP IA - inversion USA -> El Salvador.

          Hallazgos de Copart/IAAI/eBay/subastas locales/remates
          de bienes raices con calculadora de importacion SV:
          flete, seguro, aduana DAI, IVA 13%. Base de mercado por
          marca/modelo. Recomendacion CONVIENE/NO CONVIENE con
          razones y condicion de invalidacion."""
          from __future__ import annotations

          import threading
          import time
          import traceback
          import uuid


          def _now() -> str:
              return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


          def _nid(prefix: str) -> str:
              return prefix + uuid.uuid4().hex[:10]


          CATEGORIES = (
              "vehiculo", "maquinaria", "inmueble", "terreno",
              "empresa", "arte", "metal", "coleccionable",
              "inventario", "activo_financiero",
          )
          SOURCES = (
              "copart", "iaai", "ebay", "subasta_local",
              "subasta_gubernamental", "remate_inmobiliario",
              "banco_deuda", "otro",
          )
          FX_USD_SV = 8.75


          class RadarVipStore:
              def __init__(self, db, clock) -> None:
                  self._db = db
                  self._clock = clock
                  self._lock = threading.RLock()
                  self._ensure_schema()

              def _ensure_schema(self) -> None:
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_radar_vip ("
                      " opp_id TEXT PRIMARY KEY,"
                      " category TEXT NOT NULL,"
                      " source TEXT NOT NULL,"
                      " source_url TEXT,"
                      " brand TEXT,"
                      " model TEXT,"
                      " year INTEGER,"
                      " auction_price REAL NOT NULL,"
                      " repair_cost REAL NOT NULL DEFAULT 0,"
                      " transport_cost REAL NOT NULL DEFAULT 0,"
                      " customs_cost REAL NOT NULL DEFAULT 0,"
                      " tax_cost REAL NOT NULL DEFAULT 0,"
                      " other_costs REAL NOT NULL DEFAULT 0,"
                      " market_value REAL NOT NULL,"
                      " total_cost REAL,"
                      " profit REAL,"
                      " margin_pct REAL,"
                      " roi_pct REAL,"
                      " risk TEXT,"
                      " liquidity TEXT,"
                      " recovery_days INTEGER,"
                      " recommendation TEXT,"
                      " reasons TEXT,"
                      " invalidation TEXT,"
                      " fingerprint TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " created_by TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_market_prices ("
                      " mp_id TEXT PRIMARY KEY,"
                      " category TEXT NOT NULL,"
                      " brand TEXT NOT NULL,"
                      " model TEXT NOT NULL,"
                      " year INTEGER,"
                      " market_value REAL NOT NULL,"
                      " updated_by TEXT NOT NULL,"
                      " updated_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_vip_watch ("
                      " wch_id TEXT PRIMARY KEY,"
                      " opp_id TEXT NOT NULL,"
                      " account TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )

              def _run(self, sql, params=()):
                  if not params:
                      self._db.execute(sql)
                      return
                  try:
                      self._db.execute(sql, params)
                      return
                  except TypeError:
                      self._db.execute(self._inline(sql, params))

              @staticmethod
              def _inline(sql, params):
                  parts = sql.split("?")
                  if len(parts) != len(params) + 1:
                      return sql
                  assembled = parts[0]
                  for i, v in enumerate(params):
                      assembled += RadarVipStore._literal(v)
                      assembled += parts[i + 1]
                  return assembled

              @staticmethod
              def _literal(value):
                  if value is None:
                      return "NULL"
                  if isinstance(value, bool):
                      return "1" if value else "0"
                  if isinstance(value, (int, float)):
                      return repr(value)
                  return "'" + str(value).replace("'", "''") + "'"

              def _rows(self, sql):
                  for name in ("query", "fetchall", "fetch_all", "fetch", "select"):
                      fn = getattr(self._db, name, None)
                      if callable(fn):
                          try:
                              rows = fn(sql)
                              if rows is not None:
                                  return list(rows)
                          except Exception:
                              continue
                  try:
                      cur = self._db.execute(sql)
                  except Exception:
                      return []
                  if cur is None:
                      return []
                  try:
                      return list(cur.fetchall())
                  except Exception:
                      return []

              @staticmethod
              def _field(row, key, index):
                  if isinstance(row, dict):
                      return row.get(key)
                  try:
                      return row[index]
                  except Exception:
                      return None

              @staticmethod
              def _req(value, name):
                  text = str(value or "").strip()
                  if not text:
                      raise ValueError("%s es obligatorio" % name)
                  return text

              def _fingerprint(self, d):
                  parts = [
                      str(d.get("category", "")).lower(),
                      str(d.get("brand", "")).lower(),
                      str(d.get("model", "")).lower(),
                      str(d.get("auction_price", "")),
                      str(d.get("source", "")).lower(),
                  ]
                  return "|".join(parts)

              def set_market_price(self, *, category, brand, model,
                                   year, market_value, by):
                  category = self._req(category, "category")
                  brand = self._req(brand, "brand")
                  model = self._req(model, "model")
                  value = float(market_value)
                  if value <= 0:
                      raise ValueError("valor de mercado positivo")
                  with self._lock:
                      rows = self._rows(
                          "SELECT mp_id FROM sbs_market_prices WHERE"
                          " category = " + self._literal(category)
                          + " AND brand = " + self._literal(brand)
                          + " AND model = " + self._literal(model)
                          + " AND year = " + self._literal(int(year or 0))
                      )
                      if rows:
                          mp_id = str(self._field(rows[0], "a", 0))
                          self._run(
                              "UPDATE sbs_market_prices SET market_value = "
                              + repr(value)
                              + ", updated_by = " + self._literal(by)
                              + ", updated_at = " + self._literal(_now())
                              + " WHERE mp_id = " + self._literal(mp_id)
                          )
                      else:
                          mp_id = _nid("MKT-")
                          self._run(
                              "INSERT INTO sbs_market_prices (mp_id,"
                              " category, brand, model, year, market_value,"
                              " updated_by, updated_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                              (mp_id, category, brand, model,
                               int(year or 0), value, by, _now()),
                          )
                      return {"mp_id": mp_id, "market_value": value}

              def get_market_price(self, category, brand, model, year=None):
                  rows = self._rows(
                      "SELECT market_value FROM sbs_market_prices WHERE"
                      " category = " + self._literal(str(category or "").lower())
                      + " AND brand = " + self._literal(str(brand or "").lower())
                      + " AND model = " + self._literal(str(model or "").lower())
                      + " ORDER BY updated_at DESC LIMIT 1"
                  )
                  if not rows:
                      return None
                  return float(self._field(rows[0], "a", 0) or 0)

              def calculate(self, d):
                  """Calculadora de inversion USA->SV."""
                  category = str(d.get("category", "")).strip()
                  if category not in CATEGORIES:
                      raise ValueError(
                          "categoria: %s" % ", ".join(CATEGORIES))
                  auction = float(d.get("auction_price", 0) or 0)
                  repair = float(d.get("repair_cost", 0) or 0)
                  transport = float(d.get("transport_cost", 0) or 0)
                  customs = float(d.get("customs_cost", 0) or 0)
                  taxes = float(d.get("tax_cost", 0) or 0)
                  other = float(d.get("other_costs", 0) or 0)
                  if auction <= 0:
                      raise ValueError("precio de subasta positivo")
                  total = (auction + repair + transport
                           + customs + taxes + other)
                  market = None
                  brand = str(d.get("brand", "") or "").strip()
                  model = str(d.get("model", "") or "").strip()
                  year = d.get("year")
                  if category and brand and model:
                      market = self.get_market_price(
                          category, brand, model, year)
                  if market is None:
                      market = float(d.get("market_value", 0) or 0)
                  profit = market - total
                  margin_pct = (
                      round(profit / total * 100, 1) if total > 0 else 0.0
                  )
                  risk = str(d.get("risk", "media")).strip() or "media"
                  liquidity = str(d.get("liquidity", "media")).strip() or "media"
                  recovery_days = int(d.get("recovery_days", 60) or 60)
                  roi = (
                      round(profit / total * 100, 1)
                      if total > 0 else 0.0
                  )
                  reasons = []
                  invalidation = None
                  if roi >= 30 and risk in ("baja", "media"):
                      recommendation = "CONVIENE"
                      reasons.append(
                          "ROI %s%% con riesgo %s" % (str(roi), risk))
                      reasons.append(
                          "margen %s%% (ganancia $%s)"
                          % (str(margin_pct), format(profit, ".2f")))
                      if market:
                          reasons.append(
                              "valor de mercado registrado: $%s"
                              % format(market, ".2f"))
                      invalidation = (
                          "deja de ser atractiva si la reparacion supera $%s"
                          " o si el valor de mercado cae bajo $%s" % (
                              format(repair * 1.3, ".2f"),
                              format(total * 1.15, ".2f"),
                          )
                      )
                  elif roi >= 15:
                      recommendation = "ACEPTABLE"
                      reasons.append(
                          "ROI %s%% moderado" % str(roi))
                      if risk == "alta":
                          reasons.append("pero riesgo alto")
                      invalidation = (
                          "deja de ser atractiva si ROI baja de 15%")
                  else:
                      recommendation = "NO CONVIENE"
                      reasons.append(
                          "ROI %s%% insuficiente" % str(roi))
                      if market and total > market:
                          reasons.append(
                              "costo total ($%s) supera valor de mercado ($%s)"
                              % (format(total, ".2f"), format(market, ".2f")))
                  return {
                      "total_cost": round(total, 2),
                      "market_value": market,
                      "profit": round(profit, 2),
                      "margin_pct": margin_pct,
                      "roi_pct": roi,
                      "risk": risk,
                      "liquidity": liquidity,
                      "recovery_days": recovery_days,
                      "recommendation": recommendation,
                      "reasons": reasons,
                      "invalidation": invalidation,
                  }

              def register(self, *, created_by, d):
                  calc = self.calculate(d)
                  category = self._req(d.get("category"), "category")
                  source = str(d.get("source", "")).strip()
                  if source not in SOURCES:
                      raise ValueError(
                          "fuente: %s" % ", ".join(SOURCES))
                  auction = float(d.get("auction_price", 0) or 0)
                  if auction <= 0:
                      raise ValueError("precio de subasta positivo")
                  with self._lock:
                      fp = self._fingerprint(d)
                      dup = self._rows(
                          "SELECT opp_id FROM sbs_radar_vip"
                          " WHERE fingerprint = " + self._literal(fp)
                          + " AND status != 'descartada' LIMIT 1"
                      )
                      if dup:
                          raise ValueError(
                              "posible duplicado: %s"
                              % str(self._field(dup[0], "a", 0)))
                      opp_id = _nid("VIP-")
                      reasons = calc["reasons"]
                      reasons.append(
                          "fuente: %s" % source)
                      self._run(
                          "INSERT INTO sbs_radar_vip (opp_id, category,"
                          " source, source_url, brand, model, year,"
                          " auction_price, repair_cost, transport_cost,"
                          " customs_cost, tax_cost, other_costs,"
                          " market_value, total_cost, profit, margin_pct,"
                          " roi_pct, risk, liquidity, recovery_days,"
                          " recommendation, reasons, invalidation,"
                          " fingerprint, status, created_by, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?,"
                          "  ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?,"
                          "  'activa', ?, ?)",
                          (
                              opp_id, category, source,
                              str(d.get("source_url")) if d.get("source_url") else None,
                              str(d.get("brand")) if d.get("brand") else None,
                              str(d.get("model")) if d.get("model") else None,
                              int(d["year"]) if d.get("year") else None,
                              auction,
                              float(d.get("repair_cost", 0) or 0),
                              float(d.get("transport_cost", 0) or 0),
                              float(d.get("customs_cost", 0) or 0),
                              float(d.get("tax_cost", 0) or 0),
                              float(d.get("other_costs", 0) or 0),
                              calc["market_value"],
                              calc["total_cost"],
                              calc["profit"],
                              calc["margin_pct"],
                              calc["roi_pct"],
                              calc["risk"],
                              calc["liquidity"],
                              calc["recovery_days"],
                              calc["recommendation"],
                              self._literal("").replace(
                                  "''", "''").join([]) or None,
                              calc["invalidation"],
                              fp, created_by, _now(),
                          ),
                      )
                      self._run(
                          "UPDATE sbs_radar_vip SET reasons = "
                          + self._literal(" | ".join(reasons))
                          + " WHERE opp_id = " + self._literal(opp_id)
                      )
                      return self.get(opp_id)

              def get(self, opp_id):
                  opp_id = self._req(opp_id, "opp_id")
                  rows = self._rows(
                      "SELECT opp_id, category, source, brand, model, year,"
                      " auction_price, market_value, total_cost, profit,"
                      " margin_pct, roi_pct, risk, recommendation, reasons,"
                      " invalidation, status FROM sbs_radar_vip"
                      " WHERE opp_id = " + self._literal(opp_id)
                  )
                  if not rows:
                      return None
                  row = rows[0]
                  return {
                      "opp_id": self._field(row, "a", 0),
                      "category": self._field(row, "b", 1),
                      "source": self._field(row, "c", 2),
                      "brand": self._field(row, "d", 3),
