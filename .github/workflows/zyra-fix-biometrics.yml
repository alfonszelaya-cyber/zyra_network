name: "RED-4b: conectar TODAS las fuentes verificadas (7 ONEC + 9 MARN con descubrimiento de capas + index durable) + barrido en vivo"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - engine.py: catalogo COMPLETO + descubrimiento de capas + barridos + indice durable (aditivo, al final)"
        run: |
          python3 - <<'SEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/integrations/"
              "engine.py")
          t = p.read_text(encoding="utf-8")
          if "OFFICIAL_SOURCES" in t:
              print("SKIP (ya presente)")
              raise SystemExit(0)
          BLOQUE = textwrap.dedent('''\
              OFFICIAL_SOURCES: dict[str, dict[
                  str, str]] = {
                  "onec-classifiers": {
                      "base": (
                          "https://onec.bcr.gob.sv"
                          "/clasificadoresv2.api"),
                      "auth": "none",
                      "owner": (
                          "NEXO economic +"
                          " SEMILLA education +"
                          " MPE occupations"),
                  },
                  "marn-geo": {
                      "base": (
                          "https://geoportal"
                          ".marn.gob.sv/server/rest"
                          "/services"),
                      "auth": "none",
                      "owner": (
                          "AGRO risk/climate +"
                          " AXIS geodata"),
                  },
                  "snet-d3": {
                      "base": (
                          "https://srt.snet.gob.sv"
                          "/apidoa/api"),
                      "auth": "token",
                      "owner": "AGRO climate",
                  },
              }

              ONEC_ENDPOINTS: tuple[str, ...] = (
                  "/CLAEES2022",
                  "/CNOES2020",
                  "/CNEESA2021",
                  "/CNEESF2021",
                  "/CNEESP2021",
                  "/CGEOES2019",
                  "/NTEES2021",
              )

              ARCGIS_SERVICES: dict[
                  str, tuple[str, ...]] = {
                  "marn-geo": (
                      "/sig_ccanales/ATLAS_"
                      "Riesgo/MapServer",
                      "/SIHI/proyecto_"
                      "hidrologia/MapServer",
                      "/SIHI/proyecto_"
                      "hidrogeo/MapServer",
                      "/sig_ccanales/Capas"
                      "VIGEA2022/MapServer",
                      "/sig_ccanales/VIGEA"
                      "Layers/MapServer",
                      "/RISK/Amenaza/"
                      "MapServer",
                      "/Hosted/Distritos_de_"
                      "El_Salvador/"
                      "FeatureServer",
                      "/Hosted/Deslizamientos"
                      "Inundaciones/MapServer",
                      "/aescalante/atlas_"
                      "publicacion/"
                      "MapServer",
                  ),
              }


              def marn_query_url(
                  service_path: str,
                  layer_id: int,
                  *,
                  where: str = "1=1",
                  out_fields: str = "*",
                  geojson: bool = True,
              ) -> str:
                  """AX-SOURCES: query ArcGIS
                  estandar (patron oficial)."""
                  from urllib.parse import (
                      quote,
                  )
                  base = (
                      OFFICIAL_SOURCES[
                          "marn-geo"]["base"])
                  f = ("geojson"
                       if geojson else "json")
                  return (
                      base + service_path
                      + "/" + str(layer_id)
                      + "/query?where="
                      + quote(where)
                      + "&outFields="
                      + quote(out_fields)
                      + "&returnGeometry=true"
                      + "&f=" + f)


              def service_layers_url(
                  service_path: str,
              ) -> str:
                  """AX-SOURCES: metadata del
                  servicio (lista TODAS sus
                  capas con sus ids)."""
                  base = (
                      OFFICIAL_SOURCES[
                          "marn-geo"]["base"])
                  return (base
                          + service_path
                          + "?f=json")


              _SOURCE_MIGRATIONS = (
                  Migration(
                      1,
                      "integrations_sources",
                      (
                          "CREATE TABLE IF NOT"
                          " EXISTS source_snapshots ("
                          " source_id TEXT NOT NULL,"
                          " url TEXT NOT NULL,"
                          " sha256 TEXT NOT NULL,"
                          " summary_json TEXT NOT"
                          " NULL, fetch_count INTEGER"
                          " NOT NULL DEFAULT 1,"
                          " last_fetched REAL NOT"
                          " NULL, PRIMARY KEY"
                          " (source_id, url))",
                      ),
                  ),
              )


              class SourceIndex:
                  """AX-SOURCES: indice durable
                  de la Red para datos de fuentes
                  publicas (RESUMEN + sha256 por
                  URL - la Red ligera; el dataset
                  completo va a la app duena)."""

                  def __init__(
                      self,
                      db: Database,
                      clock: Clock,
                  ) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(
                          db,
                          "integrations.sources",
                          _SOURCE_MIGRATIONS,
                      ).run(clock)

                  def record(
                      self,
                      *,
                      source_id: str,
                      url: str,
                      sha256: str,
                      summary: dict[
                          str, object],
                  ) -> None:
                      with (
                          self._db.transaction()
                          as cursor
                      ):
                          cursor.execute(
                              "INSERT INTO"
                              " source_snapshots"
                              " (source_id, url,"
                              " sha256,"
                              " summary_json,"
                              " fetch_count,"
                              " last_fetched)"
                              " VALUES (?, ?, ?, ?,"
                              " 1, ?)"
                              " ON CONFLICT"
                              "(source_id, url)"
                              " DO UPDATE SET"
                              " sha256 = excluded"
                              ".sha256,"
                              " summary_json ="
                              " excluded"
                              ".summary_json,"
                              " fetch_count ="
                              " fetch_count + 1,"
                              " last_fetched ="
                              " excluded"
                              ".last_fetched",
                              (
                                  source_id,
                                  url,
                                  sha256,
                                  canonical_json_dumps(
                                      summary),
                                  self._clock.now(),
                              ),
                          )


              def sweep_onec(
                  client: PublicSourceClient,
                  index: SourceIndex | None = (
                      None),
              ) -> dict[str, object]:
                  """AX-SOURCES: barrido de los 7
                  clasificadores ONEC."""
                  base = (OFFICIAL_SOURCES[
                      "onec-classifiers"][
                      "base"])
                  resultados = []
                  ok = 0
                  for ep in ONEC_ENDPOINTS:
                      url = base + ep
                      entrada: dict[
                          str, object] = {
                          "url": url}
                      try:
                          body, stale = (
                              client.fetch(url))
                          resumen = (
                              parse_json_source(
                                  body))
                          entrada["ok"] = True
                          entrada["stale"] = (
                              stale)
                          entrada["summary"] = (
                              resumen)
                          ok += 1
                          if index is not None:
                              index.record(
                                  source_id=(
                                      "onec-"
                                      "classifiers"),
                                  url=url,
                                  sha256=str(
                                      resumen[
                                          "sha256"]),
                                  summary=resumen,
                              )
                      except Exception as exc:
                          entrada["ok"] = False
                          entrada["error"] = (
                              type(exc).__name__
                              + ": "
                              + str(exc)[:100])
                      resultados.append(
                          entrada)
                  return {
                      "source": (
                          "onec-classifiers"),
                      "ok": ok,
                      "total": len(
                          ONEC_ENDPOINTS),
                      "endpoints": resultados,
                  }


              def sweep_marn(
                  client: PublicSourceClient,
                  index: SourceIndex | None = (
                      None),
                  *,
                  max_layers_per_service: int = (
                      40),
                  pause_seconds: float = 0.1,
              ) -> dict[str, object]:
                  """AX-SOURCES: barrido de los 9
                  servicios MARN con
                  DESCUBRIMIENTO automatico de
                  capas (metadata f=json revela
                  cada capa; luego query geojson
                  por capa)."""
                  import time
                  base = (OFFICIAL_SOURCES[
                      "marn-geo"]["base"])
                  resultados = []
                  ok = 0
                  total = 0
                  for svc in (
                      ARCGIS_SERVICES[
                          "marn-geo"]
                  ):
                      meta_url = (
                          service_layers_url(
                              svc))
                      try:
                          meta_body, _ = (
                              client.fetch(
                                  meta_url))
                          import json
                          meta = json.loads(
                              meta_body.decode(
                                  "utf-8"))
                          capas = [
                              int(l["id"])
                              for l in meta.get(
                                  "layers", [])
                          ][:max_layers_per_service]
                      except Exception as exc:
                          resultados.append({
                              "service": svc,
                              "ok": False,
                              "error": (
                                  type(exc).__name__
                                  + ": "
                                  + str(exc)[:100]),
                          })
                          continue
                      for lid in capas:
                          total += 1
                          url = marn_query_url(
                              svc, lid)
                          entrada: dict[
                              str, object
                          ] = {
                              "url": url}
                          try:
                              body, stale = (
                                  client.fetch(
                                      url))
                              resumen = (
                                  parse_geojson_summary(
                                      body))
                              entrada["ok"] = (
                                  True)
                              entrada[
                                  "stale"
                              ] = stale
                              entrada[
                                  "summary"
                              ] = resumen
                              ok += 1
                              if index is (not (
                                      None)):
                                  index.record(
                                      source_id=(
                                          "marn-"
                                          "geo"),
                                      url=url,
                                      sha256=str(
                                          resumen[
                                              "sha256"]),
                                      summary=(
                                          resumen),
                                  )
                          except Exception as exc:
                              entrada["ok"] = (
                                  False)
                              entrada[
                                  "error"
                              ] = (type(exc).__name__
                                  + ": "
                                  + str(exc)[:80])
                          resultados.append(
                              entrada)
                          if (pause_seconds
                                  > 0):
                              time.sleep(
                                  pause_seconds)
                      resultados.append({
                          "service": svc,
                          "layers": len(
                              capas),
                      })
                  return {
                      "source": "marn-geo",
                      "layers_ok": ok,
                      "layers_total": (
                          total),
                      "results": resultados,
                  }
          ''')
          t = (t.rstrip("\n") + "\n\n"
               + BLOQUE.rstrip("\n") + "\n")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK catalogo completo + barridos"
                " + SourceIndex (AST valido)")
          SEOF

      - name: "Paso B - verificacion dura inmediata"
        run: |
          python3 -c "
          from shared_engines.integrations.engine import (
              OFFICIAL_SOURCES, ONEC_ENDPOINTS,
              ARCGIS_SERVICES, marn_query_url,
              service_layers_url, SourceIndex,
              sweep_onec, sweep_marn,
              PublicSourceClient, IntegrationsEngine)
          assert len(ONEC_ENDPOINTS) == 7
          assert (len(ARCGIS_SERVICES['marn-geo'])
                  == 9)
          for m in ('register_adapter', 'invoke',
                    'health'):
              assert hasattr(IntegrationsEngine, m)
          for m in ('fetch',):
              assert hasattr(PublicSourceClient, m)
          for m in ('record',):
              assert hasattr(SourceIndex, m)
          url = marn_query_url(
              '/sig_ccanales/ATLAS_Riesgo', 18)
          assert ('/18/query' in url
                  and 'f=geojson' in url)
          print('OK: todo vivo - 7 ONEC + 9 MARN + indice + barridos + engine intacto')
          "

      - name: "Paso C - BARRIDO EN VIVO: primer contacto real con TODAS las fuentes publicas (reporte completo; no bloquea si el runner no tiene salida)"
        run: |
          python3 - <<'VIVOEOF'
          import json
          from shared_engines.integrations.engine import (
              PublicSourceClient, SourceIndex,
              sweep_onec, sweep_marn)
          from shared_engines.common.clocks import (
              SystemClock)
          from shared_engines.storage.database import (
              SQLiteAdapter)
          cli = PublicSourceClient(
              clock=SystemClock(),
              timeout_seconds=20.0,
              ttl_seconds=300.0)
          index = SourceIndex(
              SQLiteAdapter("/tmp/fuentes.db"),
              SystemClock())
          print("### BARRIDO ONEC (7 clasificadores) ###")
          r1 = sweep_onec(cli, index)
          print(json.dumps(r1, indent=1,
              default=str)[:3000])
          print()
          print("### BARRIDO MARN (9 servicios,"
                " descubrimiento automatico de"
                " capas) ###")
          r2 = sweep_marn(cli, index,
              max_layers_per_service=8,
              pause_seconds=0.1)
          print(json.dumps(r2, indent=1,
              default=str)[:6000])
          print()
          print("### SNAPSHOTS GUARDADOS EN EL INDICE ###")
          rows = index._db.query_all(
              "SELECT source_id, url, sha256,"
              " fetch_count FROM"
              " source_snapshots")
          for r in rows[:40]:
              print(" ", str(r["source_id"]),
                    "|", str(r["url"])[:90],
                    "|", str(r["sha256"])[:12],
                    "| x" + str(r["fetch_count"]))
          print("TOTAL snapshots:"
                " " + str(len(rows)))
          VIVOEOF

      - name: "Paso D - tests con fixtures (deterministas, cero llamadas reales)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/integrations/tests/"
              "test_integrations.py")
          t = p.read_text(encoding="utf-8")
          if "test_sweep_all_sources" in t:
              print("SKIP tests (ya presentes)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_sweep_all_sources(
                  tmp_path,
              ) -> None:
                  """AX-SOURCES: barrido completo
                  con fixtures - ONEC 7 endpoints,
                  MARN descubrimiento de capas por
                  servicio, snapshots durables en
                  el indice."""
                  import json
                  from shared_engines.integrations.engine import (
                      PublicSourceClient,
                      SourceIndex,
                      sweep_onec, sweep_marn,
                      ONEC_ENDPOINTS,
                      ARCGIS_SERVICES)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  from shared_engines.storage.database import (
                      SQLiteAdapter)

                  geo = json.dumps({
                      "type": "FeatureCollection",
                      "features": [
                          {"type": "Feature"},
                          {"type": "Feature"},
                      ],
                  }).encode("utf-8")
                  meta = json.dumps({
                      "layers": [
                          {"id": 0,
                           "name": "a"},
                          {"id": 1,
                           "name": "b"},
                      ],
                  }).encode("utf-8")
                  one = json.dumps([
                      {"codigo": "0111101"},
                  ]).encode("utf-8")

                  def opener(url: str) -> bytes:
                      if url.endswith("?f=json"):
                          return meta
                      if ("/query" in url):
                          return geo
                      if url.endswith(tuple(
                          ONEC_ENDPOINTS
                      )):
                          return one
                      raise OSError("no simulada")

                  cli = PublicSourceClient(
                      clock=FrozenClock(),
                      ttl_seconds=60.0,
                      opener=opener)
                  index = SourceIndex(
                      SQLiteAdapter(
                          tmp_path / "src.db"),
                      FrozenClock())
                  r1 = sweep_onec(cli, index)
                  assert r1["ok"] == 7
                  assert r1["total"] == 7
                  r2 = sweep_marn(
                      cli, index,
                      max_layers_per_service=2,
                      pause_seconds=0)
                  assert r2["layers_total"] == (
                      2 * len(ARCGIS_SERVICES[
                          "marn-geo"]))
                  assert r2["layers_ok"] == (
                      r2["layers_total"])
                  rows = index._db.query_all(
                      "SELECT * FROM"
                      " source_snapshots")
                  assert len(rows) == (7 + 2
                      * len(ARCGIS_SERVICES[
                          "marn-geo"]))
                  print("OK barrido completo:"
                        " 7 ONEC + "
                        + str(r2["layers_total"])
                        + " capas MARN +"
                        " snapshots durables")
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert "test_sweep_all_sources" in final
          print("OK test barrido (AST valido)")
          TSEOF

      - name: "Paso E - GATE Red"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -8

      - name: "Paso F - GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso G - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-4b"
            echo '```'
            python3 -m pytest shared_engines/integrations -vv --tb=long 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-4b: barrido completo de TODAS las fuentes verificadas (7 ONEC + 9 MARN con descubrimiento automatico de capas + SourceIndex durable)" -m "No son 2 conexiones: son TODAS las verificadas. ONEC: los 7 clasificadores (CLAEES2022/CNOES2020/CNEESA2021/CNEESF2021/CNEESP2021/CGEOES2019/NTEES2021). MARN: los 9 servicios ArcGIS (ATLAS_Riesgo, SIHI hidrologia, SIHI hidrogeo, VIGEA2022, VIGEALayers, RISK/Amenaza, Distritos, DeslizamientosInundaciones, atlas_publicacion) con DESCUBRIMIENTO AUTOMATICO de capas (metadata f=json revela cada capa -> query geojson por capa). SourceIndex: tabla source_snapshots en la Red (resumen + sha256 + fetch_count por URL) - datos reales del gobierno acumulandose desde hoy, la Red ligera (dataset completo va a la app duena). sweep_onec/sweep_marn: barridos reutilizables. SNET preparado esperando token oficial del dueno. Live sweep en el run con reporte completo; tests 100% fixtures."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
