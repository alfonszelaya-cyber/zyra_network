name: ZYRA S2d market con permiso ZID y menu aprobado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseS2d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: S2d
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SB = ROOT / 'apps' / 'subastas' / 'server.py'
          SPY = ROOT / 'superapp.py'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 's2d.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  with OP.open(q, timeout=25) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, '', str(e)
          orig_sb = SB.read_bytes()
          orig_sp = SPY.read_bytes()
          def revertir():
              try:
                  SB.write_bytes(orig_sb)
                  SPY.write_bytes(orig_sp)
              except Exception:
                  pass
          t0 = orig_sb.decode('utf-8')
          add('# S2d - MARKET: _home nueva + Bolsa + permiso')
          add('')
          add('## E1. Anclas reales (de S2c2)')
          add('')
          A_HOME = '    def _home(self) -> str:'
          A_LIST = '    def _listings_html(self) -> str:'
          A_NAV = '    def _nav_html(self) -> str:'
          n1 = t0.count(A_HOME)
          n2 = t0.count(A_LIST)
          n3 = t0.count(A_NAV)
          add('- _home: %d | _listings_html: %d | _nav_html: %d' % (n1, n2, n3))
          gate('anclas', n1 == 1 and n2 == 1 and n3 == 1)
          if not (n1 == 1 and n2 == 1 and n3 == 1):
              add('**NO UNICO: nada editado.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('s2d.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS - sin cambios')
          add('')
          add('## E2. Nueva _home (ZID+clave -> APROBADO -> menu bajo boton)')
          add('')
          HOMEL = [
          '    def _home(self) -> str:',
          '        P = []',
          '        P.append("<html><head><meta charset=\'utf-8\'>")',
          '        P.append("<meta name=\'viewport\' content=\'width=device-width, initial-scale=1\'>")',
          '        P.append("<title>ZYRA MARKET</title>")',
          '        P.append("<style>body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:24px 16px;box-sizing:border-box}")',
          '        P.append(".caja{max-width:520px;background:#11162b;border:1px solid #242c4f;border-radius:14px;padding:18px;margin:0 auto 14px}")',
          '        P.append("h1{margin:0 0 14px;font-size:26px}input{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px}")',
          '        P.append("button{padding:13px 22px;border-radius:10px;border:none;background:#238636;color:#fff;font-size:15px;font-weight:700}")',
          '        P.append(".aprobado{color:#3fb950;font-weight:800;font-size:18px;margin:10px 0}#menu{display:none;margin-top:14px}a.item{display:block;color:#e6edf3;text-decoration:none;padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;margin:6px 0;font-weight:700}</style></head><body>")',
          '        P.append("<h1>ZYRA MARKET</h1>")',
          '        P.append("<div class=\'caja\' id=\'cajaAcceso\'>")',
          '        P.append("<h2 style=\'margin:0 0 10px;font-size:17px\'>Acceso con tu identidad ZYRA</h2>")',
          '        P.append("<input id=\'zid\' placeholder=\'Tu ZID\'>")',
          '        P.append("<input id=\'clave\' type=\'password\' placeholder=\'Tu clave\'>")',
          '        P.append("<button onclick=\'pedirPermiso()\'>Solicitar permiso</button>")',
          '        P.append("<div id=\'estado\' style=\'margin-top:12px;font-size:14px\'></div>")',
          '        P.append("</div>")',
          '        P.append("<div id=\'menu\'><div class=\'caja\'>")',
          '        P.append("<h2 style=\'margin:0 0 10px;font-size:17px\'>ZYRA MARKET</h2>")',
          '        P.append("<p style=\'color:#8b949e;font-size:14px\'>El super mercado de la Red ZYRA. Roles: vendedor | comprador | gobierno</p>")',
          '        P.append("<a class=\'item\' href=\'/subastas/menu\'>IR AL MENU</a>")',
          '        P.append("</div></div>")',
          '        P.append("<script>")',
          '        P.append("async function pedirPermiso(){")',
          '        P.append("var E=document.getElementById(\'estado\');")',
          '        P.append("var z=document.getElementById(\'zid\').value.trim();")',
          '        P.append("var c=document.getElementById(\'clave\').value.trim();")',
          '        P.append("if(!z||!c){E.innerHTML=\'<p style=color:#f0b429>Escribe tu ZID y clave.</p>\';return;}")',
          '        P.append("E.innerHTML=\'<p style=color:#8b949e>Solicitando permiso a la Red...</p>\';")',
          '        P.append("try{var r=await fetch(\'/subastas/permiso\',{method:\'POST\',headers:{\'Content-Type\':\'application/json\'},body:JSON.stringify({zid:z,clave:c})});")',
          '        P.append("var j=await r.json();")',
          '        P.append("if(j.aprobado){E.innerHTML=\'<p class=aprobado>APROBADO - acceso concedido</p>\';")',
          '        P.append("document.getElementById(\'menu\').style.display=\'block\';")',
          '        P.append("document.getElementById(\'cajaAcceso\').style.display=\'none\';}")',
          '        P.append("else{E.innerHTML=\'<p style=color:#f85149>\'+(j.error||\'Acceso denegado\')+\'</p>\';}}")',
          '        P.append("catch(e){E.innerHTML=\'<p style=color:#f85149>Sin conexion con la Red.</p>\';}}")',
          '        P.append("</script></body></html>")',
          '        return "".join(P)',
          '',
          ]
          i_h = t0.find(A_HOME)
          i_l = t0.find(A_LIST)
          t = t0[:i_h] + '\n'.join(HOMEL) + '\n' + t0[i_l:]
          add('- _home reescrita: sin nav, sin biometria, ZID+clave -> APROBADO -> IR AL MENU.')
          gate('home_nueva', True)
          add('')
          add('## E3. Bolsa en el nav')
          add('')
          i_nav = t.find(A_NAV)
          zona = t[i_nav:i_nav + 3000]
          if '/subastas/radar' in zona:
              add('- ya presente.')
              gate('bolsa', True)
          else:
              p_ap = t.find('parts.append', i_nav)
              if p_ap > -1:
                  INY = ('        parts.append(\'<a href="/subastas/radar" style="color:#e6edf3;'
                         'text-decoration:none;padding:6px 12px;background:#0d1117;'
                         'border:1px solid #30363d;border-radius:8px">Bolsa</a>\')\n')
                  t = t[:p_ap] + INY + t[p_ap:]
                  add('- Bolsa agregada al nav.')
                  gate('bolsa', True)
              else:
                  add('- parts.append no hallado.')
                  gate('bolsa', False)
          SB.write_text(t, encoding='utf-8')
          add('')
          add('## E4. superapp.py: /subastas/permiso')
          add('')
          tsp = orig_sp.decode('utf-8')
          if '/subastas/permiso' in tsp:
              add('- ya existe.')
              gate('permiso', True)
          else:
              ANCLA = '        if path == "/mpe/register":'
              n_m = tsp.count(ANCLA)
              if n_m == 1:
                  PERM = '\n'.join([
                  '        if path == "/subastas/permiso":',
                  '            largo = int(self.headers.get("Content-Length", 0) or 0)',
                  '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
                  '            try:',
                  '                dd = json.loads(crudo or "{}")',
                  '            except Exception:',
                  '                dd = {}',
                  '            zid_p = str(dd.get("zid", "")).strip()',
                  '            clave_p = str(dd.get("clave", ""))',
                  '            ok_c = False',
                  '            try:',
                  '                import sqlite3 as _sq, hashlib as _hs',
                  '                con = _sq.connect(str(DATA_DIR / "credenciales.db"))',
                  '                fila = con.execute("SELECT sal, hash FROM credenciales WHERE zid = ?", (zid_p,)).fetchone()',
                  '                con.close()',
                  '                if fila:',
                  '                    ok_c = (_hs.sha256((fila[0] + clave_p).encode()).hexdigest() == fila[1])',
                  '            except Exception:',
                  '                ok_c = False',
                  '            owner = os.environ.get("ZYRA_OWNER_ZID", "")',
                  '            clave_o = os.environ.get("ZYRA_CLAVE_DUENO", "")',
                  '            if zid_p == owner and clave_o and clave_p == clave_o:',
                  '                ok_c = True',
                  '            if ok_c:',
                  '                self._send(200, "application/json", json.dumps({"aprobado": True, "rol": "comprador"}).encode())',
                  '            else:',
                  '                self._send(200, "application/json", json.dumps({"aprobado": False, "error": "ZID o clave incorrectos. La Red no autoriza."}).encode())',
                  '            return',
                  '',
                  ])
                  p2 = tsp.find(ANCLA)
                  tsp = tsp[:p2] + PERM + tsp[p2:]
                  SPY.write_text(tsp, encoding='utf-8')
                  add('- creado.')
                  gate('permiso', True)
              else:
                  add('- ancla mpe/register: %d. OMITIDO.' % n_m)
                  gate('permiso', False)
          add('')
          add('## E5. Compilacion')
          add('')
          okc = True
          try:
              py_compile.compile(str(SB), doraise=True)
              py_compile.compile(str(SPY), doraise=True)
              add('- ambos OK')
          except Exception as e:
              okc = False
              add('- FALLO: %s' % e)
          gate('compila', okc)
          add('')
          add('## E6. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zs2d', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/ss2d', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          tv = time.time()
          while time.time() - tv < 40:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              tv = time.time()
              while time.time() - tv < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s' % (vivo, spv))
          if spv:
              st, ct, b = pedir(BSP + '/subastas/')
              ok_h = (st == 200 and 'Solicitar permiso' in b and 'Registrarme' not in b)
              add('- MARKET nuevo: %s' % ('OK' if ok_h else 'FALLO'))
              gate('market_nuevo', ok_h)
              st, _h, b = pedir(BSP + '/subastas/permiso',
                                data=json.dumps({'zid': 'Z-DUENO-CI', 'clave': 'clave-ci-9999'}).encode())
              try:
                  aprob = json.loads(b).get('aprobado') is True
              except Exception:
                  aprob = False
              add('- permiso correcto -> APROBADO: %s' % aprob)
              gate('permiso_ok', st == 200 and aprob)
              st, _h, b = pedir(BSP + '/subastas/permiso',
                                data=json.dumps({'zid': 'FALSO', 'clave': 'x'}).encode())
              try:
                  deneg = json.loads(b).get('aprobado') is False
              except Exception:
                  deneg = False
              add('- permiso falso -> denegado: %s' % deneg)
              gate('permiso_denegado', deneg)
          else:
              for g in ('market_nuevo', 'permiso_ok', 'permiso_denegado'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**S2d VERIFICADO. Commit.**')
              add('')
              add('MARKET: ZID+clave -> APROBADO -> IR AL MENU -> menu completo con Bolsa.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('s2d.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('S2d terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/subastas/server.py superapp.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(S2d): market con permiso ZID, menu bajo boton verde, Bolsa en nav"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
