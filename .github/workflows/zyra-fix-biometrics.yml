name: ZYRA - Fase 1: inspección dirigida + limpieza segura

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fase1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspección dirigida + generar correcciones seguras
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          SKIP = {'.git', '__pycache__'}
          OUT = []

          def add(s=''):
              OUT.append(str(s))

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def mask(l):
              return re.sub(r'["\'][^"\']{8,}["\']',
                            lambda m: m.group(0)[:4] + '***' + m.group(0)[-1], l)

          add('# FASE 1 — INSPECCIÓN DIRIGIDA + LIMPIEZA SEGURA')
          add('')
          add('Principio: medir antes de borrar. Solo correcciones de riesgo cero.')
          add('')

          add('## P1. Los archivos de "236 bytes idénticos": ¿contenido real o relleno?')
          add('')
          gi = txt(ROOT / '.gitignore')
          add('`.gitignore` actual completo (%d bytes):' % len(gi.encode('utf-8', errors='replace')))
          add('```')
          add(gi.strip()[:400] if gi.strip() else '(vacío)')
          add('```')
          lic = txt(ROOT / 'LICENSE').strip()
          add('LICENSE (%d bytes): `%s`' % (len(lic), lic.replace('\n', ' | ')[:180]))
          add('')
          add('> Si es texto genérico igual entre archivos = RELLENO. LICENSE con relleno = sin licencia válida (decisión pendiente del propietario).')
          add('')

          add('## P2. Autenticación: ¿quién envía y quién exige el token?')
          add('')
          for ruta in ('shared_engines/network/network_client.py',
                       'shared_engines/runtime/api.py',
                       'main.py'):
              p = ROOT / ruta
              ls = txt(p).splitlines()
              hits = [(i + 1, l.strip()) for i, l in enumerate(ls)
                      if re.search(r'(?i)authorization|bearer|api[_-]?token|require[_-]?token|headers?\s*=', l)]
              add('`%s` — %d líneas relevantes:' % (ruta, len(hits)))
              add('```python')
              for n, l in hits[:25]:
                  add('%d: %s' % (n, l[:150]))
              add('```')
          add('')

          add('## P3. ¿A qué aplicaciones referencia realmente superapp.py?')
          add('')
          nombres = ('agro', 'axis', 'semilla', 'nexo', 'subastas', 'mi_primer_empleo',
                     'ciclo', 'laboratorio', 'futuro')
          ls = txt(ROOT / 'superapp.py').splitlines()
          hits = [(i + 1, l.strip()) for i, l in enumerate(ls)
                  if any(n in l.lower() for n in nombres)]
          add('%d líneas mencionan apps:' % len(hits))
          add('```python')
          for n, l in hits[:50]:
              add('%d: %s' % (n, l[:150]))
          add('```')
          add('')

          add('## P4. Posible secreto en test_viva3.py:72 (valor ENMASCARADO)')
          add('')
          ls = txt(ROOT / 'shared_engines/runtime/tests/test_viva3.py').splitlines()
          if ls:
              ini = 66 if len(ls) > 78 else 0
              add('```python')
              for i in range(ini, min(ini + 12, len(ls))):
                  add('%d: %s' % (i + 1, mask(ls[i]).strip()[:150]))
              add('```')
              if len(ls) >= 72:
                  vals = re.findall(r'["\']([^"\']{8,})["\']', ls[71])
                  if vals:
                      v = vals[0]
                      dummy = bool(re.search(r'(?i)test|dummy|fake|example|sample|xxx|1234|abcdef|secret', v))
                      add('- Longitud=%d | parece dato de prueba=%s | patrón clave real (sk-/-----)=%s'
                          % (len(v), dummy, v.startswith(('sk-', '-----'))))
          add('')

          add('## P5. render.yaml: estructura real')
          add('')
          ls = txt(ROOT / 'render.yaml').splitlines()
          add('```yaml')
          for i, l in enumerate(ls[:40]):
              add('%d: %s' % (i + 1, l.rstrip()[:150]))
          add('```')
          add('')

          add('## P6. migrations/versions y formato real del NAMESPACE_MANIFEST')
          add('')
          vd = ROOT / 'migrations' / 'versions'
          if vd.is_dir():
              add('Archivos: %s' % sorted(x.name for x in vd.iterdir() if x.is_file()))
          add('')
          add('Primeras 25 líneas de NAMESPACE_MANIFEST.md:')
          add('```markdown')
          add('\n'.join(txt(ROOT / 'NAMESPACE_MANIFEST.md').splitlines()[:25]))
          add('```')
          add('')

          add('## P7. Referencias a los duplicados (¿se puede limpiar sin romper?)')
          add('')
          cnt = {'legacy': 0, 'verif': 0, 'appjs': 0}
          ej = []
          for p in ROOT.rglob('*'):
              if not p.is_file() or SKIP & set(p.parts):
                  continue
              if p.suffix.lower() not in ('.py', '.html', '.md', '.js', '.json'):
                  continue
              if 'legacy_variants' in p.parts:
                  continue
              t = txt(p)
              if 'legacy_variants' in t or 'agro_network_client' in t:
                  cnt['legacy'] += 1
                  if len(ej) < 6:
                      ej.append(str(p.relative_to(ROOT)))
              if 'verificar.js' in t:
                  cnt['verif'] += 1
              if 'app.js' in t:
                  cnt['appjs'] += 1
          add('- Referencias a `legacy_variants`/`agro_network_client`: **%d** %s' % (cnt['legacy'], ej))
          add('- Referencias a `verificar.js`: **%d** | a `app.js`: **%d**' % (cnt['verif'], cnt['appjs']))
          add('- Regla: 0 referencias = convertible a shim/eliminable sin romper imports.')
          add('')

          add('## P8. Variables de entorno que el código realmente usa')
          add('')
          pat = re.compile(r'(?:os\.environ(?:\.get)?\s*\[?|getenv\s*\()\s*[\"\']([A-Z][A-Z0-9_]{2,})[\"\']')
          envs = set()
          for p in ROOT.rglob('*.py'):
              if SKIP & set(p.parts):
                  continue
              envs.update(pat.findall(txt(p)))
          conocidas = ['ZYRA_ROOT_KEY', 'ZYRA_API_TOKEN', 'ZYRA_REQUIRE_TOKEN',
                       'ZYRA_URL', 'ZYRA_HOST', 'ZYRA_DATA_DIR', 'SUPERAPP_DATA_DIR']
          todos = sorted(set(conocidas) | envs)
          add('Total: %d variables' % len(todos))
          add('')
          add(', '.join('`%s`' % v for v in todos[:80]))
          add('')

          GITIGNORE = """# === ZYRA / JAZA — generado por auditoria (fase 1) ===

# Python
__pycache__/
*.py[cod]
*.egg-info/
.pytest_cache/
.mypy_cache/
.ruff_cache/
.venv/
venv/
build/
dist/

# Secretos y entorno local
.env
.env.*
!.env.example

# Bases de datos locales (cada app crea las suyas en runtime)
*.db
*.sqlite
*.sqlite3
*.db-journal

# Registros
*.log
logs/*
!logs/.gitkeep

# IDE / SO
.idea/
.vscode/
.DS_Store

# Salidas de auditoria
auditoria_zyra/
audit_report.json
audit_report.md
inspeccion.json
"""

          lineas = ['# === ZYRA / JAZA - generado desde el codigo real (fase 1) ===',
                    '# NUNCA commitear valores reales. Rellenar solo en el despliegue.', '']
          for v in todos:
              if v in conocidas:
                  lineas.append('%s=  # requerida por el runtime central' % v)
              else:
                  lineas.append('%s=' % v)
          (ROOT / '.env.example').write_text('\n'.join(lineas) + '\n', encoding='utf-8')
          (ROOT / '.gitignore').write_text(GITIGNORE, encoding='utf-8')

          add('## Aplicado en este run (riesgo cero)')
          add('')
          add('- `.gitignore` reemplazado (antes: relleno de 236 bytes).')
          add('- `.env.example` regenerado con %d variables detectadas.' % len(todos))
          add('- `.pyc` desrastreados (ver paso siguiente). Código fuente intacto.')
          add('- Pendiente de TU decisión: LICENSE, JS portal duplicado, legacy client, 10 apps faltantes, clasificación de ciclo_digital/futuro_os/laboratorio.')
          add('')
          add('*Próxima auditoría esperará: pyc=0 (-2394), archivos≈4574. Delta negativo = limpieza de binarios, NO pérdida de código (python_total sigue en 4506).*')

          data = {'fecha': datetime.now(timezone.utc).isoformat(),
                  'envs_detectadas': sorted(envs), 'todas': todos,
                  'referencias': cnt, 'ejemplos_legacy': ej}
          Path('inspeccion.json').write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding='utf-8')

          out = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if out:
              Path(out).write_text('\n'.join(OUT), encoding='utf-8')
          else:
              Path('inspeccion.md').write_text('\n'.join(OUT), encoding='utf-8')
          print('Inspeccion OK. Envs detectadas:', len(envs))
          PYEOF

      - name: Desrastrear .pyc y commitear limpieza
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          COUNT=$(git ls-files '*.pyc' | wc -l)
          echo "pyc rastreados: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            git ls-files '*.pyc' | xargs -r git rm --cached --quiet
          fi
          find . -path ./.git -prune -o -type d -name '__pycache__' -print0 | xargs -0 -r rm -rf
          git add .gitignore .env.example 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(fase1): gitignore y env.example reales; desrastrear pyc compilados"
            git push
            {
              echo ""
              echo "## ✅ Commit de limpieza aplicado"
              echo "- pyc desrastreados: $COUNT"
              echo "- El push dispara este workflow otra vez: el 2º run dirá 'sin cambios' (normal, es idempotente)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios que aplicar (ya limpio)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspeccion-zyra
          path: inspeccion.json
