name: "ZYRA NEXO E1b v3: finanzas_total + use cases + tests"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Escribir finanzas_total + use cases faltantes
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def escribir(ruta, marca, contenido):
              try:
                  p = pathlib.Path(ruta)
                  if p.exists() and marca in p.read_text(encoding="utf-8"):
                      out("- **" + p.name + ": YA**")
                      return
                  ast.parse(contenido)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(str(p), doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          FIN = "apps/nexo/domain/finance"
          UC = "apps/nexo/application/accounting_use_cases"

          FT = D(r'''
              # finanzas_total.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations

              from decimal import Decimal
              from typing import Dict
              import uuid

              from apps.nexo.domain.accounting.accounting_engine import (
                  AccountingEngine)
              from apps.nexo.domain.finance.declaration_engine import (
                  DeclarationEngine)
              from apps.nexo.domain.finance.document_fiscal_engine import (
                  FiscalDocumentEngine)
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database


              class FinanzasTotal:
                  """Agregador financiero supremo
                  (Decimal, persistente)."""

                  def __init__(self, db: Database, clock: Clock, *,
                               audit=None) -> None:
                      self.accounting_engine = AccountingEngine(
                          db, clock, audit=audit)
                      self.declaration_engine = DeclarationEngine(
                          db, clock)
                      self.document_engine = FiscalDocumentEngine(
                          db, clock)
                      self._clock = clock

                  def generar_reporte_maestro(self) -> Dict:
                      entries = self.accounting_engine.get_entries()
                      ingresos = Decimal("0")
                      egresos = Decimal("0")
                      for entry in entries:
                          amount = Decimal(str(entry.get("amount", "0")))
                          if entry.get("entry_type") == "CREDIT":
                              ingresos += amount
                          else:
                              egresos += amount
                      declaraciones = (
                          self.declaration_engine
                          .get_all_declarations())
                      documentos = (
                          self.document_engine
                          .get_all_documents())
                      ganancia = ingresos - egresos
                      return {"report_id": f"FIN-{uuid.uuid4()}",
                              "generated_at": self._clock.now(),
                              "report_type": "FINANZAS_TOTAL",
                              "metricas": {
                                  "ingresos": str(ingresos),
                                  "egresos": str(egresos),
                                  "impuestos": "0",
                                  "ganancia_neta": str(ganancia)},
                              "declaraciones": len(declaraciones),
                              "documentos_fiscales": len(documentos),
                              "asientos_contables": len(entries),
                              "status": "GENERATED"}

                  def dashboard_snapshot(self) -> Dict:
                      return self.generar_reporte_maestro()

                  def get_summary(self) -> Dict:
                      report = self.generar_reporte_maestro()
                      return {"report_id": report["report_id"],
                              "ganancia_neta": report["metricas"]["ganancia_neta"],
                              "declaraciones": report["declaraciones"],
                              "documentos": report["documentos_fiscales"],
                              "generated_at": report["generated_at"]}
          ''')

          escribir(FIN + "/finanzas_total.py", "class FinanzasTotal", FT)

          UC1 = D(r'''
              from __future__ import annotations
              from decimal import Decimal
              from apps.nexo.domain.accounting.accounting_engine import (
                  AccountingEngine)
              from apps.nexo.domain.accounting.journal_engine import (
                  JournalEngine)


              class CreateJournalEntryUseCase:
                  """Crea asiento de partida doble
                  (debit + credit iguales)."""

                  def __init__(self, accounting_engine: AccountingEngine,
                               journal_engine: JournalEngine) -> None:
                      self._engine = accounting_engine
                      self._journal = journal_engine

                  def execute(self, *, company_id: str,
                              debit_account: str, credit_account: str,
                              amount, description: str,
                              created_by: str) -> dict:
                      amt = Decimal(str(amount))
                      if amt <= 0:
                          raise ValueError(
                              "Amount must be greater than zero")
                      d = self._engine.create_entry(
                          account_code=debit_account, amount=amt,
                          entry_type="DEBIT",
                          description=description,
                          reference_id=company_id)
                      c = self._engine.create_entry(
                          account_code=credit_account, amount=amt,
                          entry_type="CREDIT",
                          description=description,
                          reference_id=company_id)
                      self._journal.register_entry(d)
                      self._journal.register_entry(c)
                      return {"entry_id": d["entry_id"],
                              "debit": d, "credit": c,
                              "amount": str(amt),
                              "company_id": company_id,
                              "created_by": created_by,
                              "status": "POSTED"}
          ''')
          escribir(UC + "/create_journal_entry_use_case.py",
                   "class CreateJournalEntryUseCase", UC1)

          UC6 = D(r'''
              from __future__ import annotations
              from apps.nexo.domain.accounting.accounting_validation_engine import (
                  AccountingValidationEngine)


              class ValidateAccountingUseCase:
                  def __init__(self, validation_engine:
                               AccountingValidationEngine) -> None:
                      self._engine = validation_engine

                  def execute(self, journal_entry: dict) -> dict:
                      return self._engine.validate_entry(journal_entry)
          ''')
          escribir(UC + "/validate_accounting_use_case.py",
                   "class ValidateAccountingUseCase", UC6)

          try:
              for d in (FIN, UC):
                  ip = pathlib.Path(d) / "__init__.py"
                  if not ip.exists():
                      ip.write_text("", encoding="utf-8")
              lista = sorted(f.name for f in pathlib.Path(FIN).iterdir())
              out("- **carpeta finance:** " + str(lista))
              lista2 = sorted(f.name for f in pathlib.Path(UC).iterdir())
              out("- **carpeta use_cases:** " + str(lista2))
          except Exception:
              pass
          exit(0)
          EOF

      - name: "B1: tests (auto-crea si falta)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          if [ ! -f apps/nexo/tests/test_finance_migrated.py ]; then
          cat > apps/nexo/tests/test_finance_migrated.py << 'PYEOF'
          import pytest
          from decimal import Decimal
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.audit.chain import AuditTrail
          from shared_engines.storage.database import SQLiteAdapter
          from apps.nexo.domain.accounting.accounting_engine import AccountingEngine
          from apps.nexo.domain.accounting.journal_engine import JournalEngine
          from apps.nexo.domain.finance.Zyra_finance_master import ZyraFinanceMaster
          from apps.nexo.domain.finance.finanzas_total import FinanzasTotal
          from apps.nexo.domain.finance.tax_declarations import TaxDeclarationsEngine
          from apps.nexo.application.accounting_use_cases.create_journal_entry_use_case import CreateJournalEntryUseCase
          from apps.nexo.application.accounting_use_cases.validate_accounting_use_case import ValidateAccountingUseCase


          def _db(tmp_path):
              return SQLiteAdapter(tmp_path / "fin.db")


          def test_finance_master_pnl(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              master = ZyraFinanceMaster(db, clock, audit=AuditTrail(db, clock))
              master.accounting_engine.create_entry(account_code="4001", amount="1000.00", entry_type="CREDIT", description="venta")
              master.accounting_engine.create_entry(account_code="5001", amount="400.00", entry_type="DEBIT", description="costo")
              r = master.generar_reporte_maestro()
              assert Decimal(r["revenue"]) == Decimal("1000.00")
              assert Decimal(r["profit"]) == Decimal("600.00")
              print("OK: finance master PNL")


          def test_finanzas_total(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              ft = FinanzasTotal(db, clock, audit=AuditTrail(db, clock))
              ft.accounting_engine.create_entry(account_code="4001", amount="500.00", entry_type="CREDIT", description="v")
              ft.accounting_engine.create_entry(account_code="5001", amount="300.00", entry_type="DEBIT", description="e")
              r = ft.generar_reporte_maestro()
              assert Decimal(r["metricas"]["ganancia_neta"]) == Decimal("200.00")
              print("OK: finanzas_total ganancia 200")


          def test_tax_declarations(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              tax = TaxDeclarationsEngine(db, clock, audit=AuditTrail(db, clock))
              tax.accounting_engine.create_entry(account_code="4001", amount="2000.00", entry_type="CREDIT", description="venta")
              tax.accounting_engine.create_entry(account_code="5001", amount="800.00", entry_type="DEBIT", description="gasto")
              acc = tax.calcular_acumulados()
              assert Decimal(acc["utilidad"]) == Decimal("1200.00")
              print("OK: fiscal acumulados")


          def test_use_case_journal_entry(tmp_path) -> None:
              db = _db(tmp_path)
              clock = FrozenClock()
              eng = AccountingEngine(db, clock, audit=AuditTrail(db, clock))
              jrn = JournalEngine(db, clock)
              uc = CreateJournalEntryUseCase(eng, jrn)
              r = uc.execute(company_id="C1", debit_account="1101", credit_account="4001", amount="250.00", description="venta", created_by="contador")
              assert Decimal(r["amount"]) == Decimal("250.00")
              print("OK: use case partida doble")
          PYEOF
          fi
          timeout 120 python3 -m pytest apps/nexo/tests/test_finance_migrated.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/b1.out 2>&1
          echo $? > /tmp/b1
          if [ "$(cat /tmp/b1)" = "0" ]; then echo "- B1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- B1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### B1 detalle"; echo '```'; tail -80 /tmp/b1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "B2: nexo completo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/b2.out 2>&1
          echo $? > /tmp/b2
          if [ "$(cat /tmp/b2)" = "0" ]; then echo "- B2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- B2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### B2 detalle"; echo '```'; tail -50 /tmp/b2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "B3: apps otras + shared"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/b3.out 2>&1
          echo $? > /tmp/b3
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/b3b.out 2>&1
          ok3=$?
          if [ "$(cat /tmp/b3)" = "0" ] && [ "$ok3" = "0" ]; then echo "- B3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- B3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### B3 detalle"; echo '```'; tail -60 /tmp/b3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in b1 b2 b3; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: B1-B3 VERDES — LOTE 1b COMPLETO**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-E1b): finanzas_total + use cases + tests completos (B1-B3 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 1b CERRADO. Sigue LOTE 2 clients.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
