name: "ZYRA NEXO E4 v2: bunker corregido"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Forzar 17 archivos executive
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def wf(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          EXE = "apps/nexo/domain/executive"
          UCE = "apps/nexo/application/executive_use_cases"

          # ===== ENGINES (7, compactos) =====
          wf(EXE + "/executive_dashboard_engine.py", D(r'''
              """Executive Dashboard - NEXO / ZYRA."""
              from __future__ import annotations
              from datetime import datetime
              from typing import Dict, List

              class ExecutiveDashboardEngine:
                  def __init__(self):
                      self._snapshots = []

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def build_dashboard(self, *, kpis, metrics, alerts, decisions):
                      critical = len([a for a in alerts if a.get("level") == "CRITICAL"])
                      open_a = len([a for a in alerts if a.get("status") == "OPEN"])
                      d = {"generated_at": self._now(), "kpis": kpis, "metrics": metrics,
                           "alerts": alerts, "decisions": decisions,
                           "critical_alerts": critical, "open_alerts": open_a,
                           "total_decisions": len(decisions), "status": "ACTIVE"}
                      self._snapshots.append(d)
                      return d

                  def get_snapshots(self):
                      return list(self._snapshots)

                  def get_last_snapshot(self):
                      return self._snapshots[-1] if self._snapshots else None

                  def generate_executive_summary(self):
                      d = self.get_last_snapshot()
                      if not d:
                          return {"status": "NO_DATA", "generated_at": self._now()}
                      return {"generated_at": self._now(), "critical_alerts": d["critical_alerts"],
                              "open_alerts": d["open_alerts"],
                              "total_decisions": d["total_decisions"], "status": d["status"]}

                  def generate_report(self):
                      return {"report_type": "EXECUTIVE_DASHBOARD",
                              "snapshots": self.get_snapshots(),
                              "generated_at": self._now()}
          '''))

          wf(EXE + "/executive_alert_engine.py", D(r'''
              """Executive Alert - NEXO / ZYRA."""
              from __future__ import annotations
              from datetime import datetime
              from uuid import uuid4
              from typing import Dict, List, Optional

              class ExecutiveAlertEngine:
                  VALID_LEVELS = ("INFO", "LOW", "MEDIUM", "HIGH", "CRITICAL")
                  VALID_STATUS = ("OPEN", "IN_PROGRESS", "RESOLVED", "CLOSED", "ESCALATED")

                  def __init__(self):
                      self._alerts = []

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def validate_alert(self, level, title, description):
                      if level not in self.VALID_LEVELS:
                          return False
                      if not title:
                          return False
                      if not description:
                          return False
                      return True

                  def create_alert(self, *, level, title, description,
                                   source_module=None, reference_id=None, metadata=None):
                      if not self.validate_alert(level, title, description):
                          raise ValueError("Invalid alert data")
                      alert = {"alert_id": f"ALT-{uuid4()}", "level": level, "title": title,
                               "description": description, "source_module": source_module,
                               "reference_id": reference_id, "metadata": metadata or {},
                               "status": "OPEN", "created_at": self._now(),
                               "updated_at": self._now()}
                      self._alerts.append(alert)
                      return alert

                  def get_alert(self, alert_id):
                      for a in self._alerts:
                          if a["alert_id"] == alert_id:
                              return a
                      return None

                  def get_alerts(self):
                      return list(self._alerts)

                  def get_open_alerts(self):
                      return [a for a in self._alerts if a["status"] == "OPEN"]

                  def get_critical_alerts(self):
                      return [a for a in self._alerts if a["level"] == "CRITICAL"]

                  def update_status(self, alert_id, status):
                      if status not in self.VALID_STATUS:
                          return None
                      alert = self.get_alert(alert_id)
                      if not alert:
                          return None
                      alert["status"] = status
                      alert["updated_at"] = self._now()
                      return alert

                  def escalate_alert(self, alert_id):
                      alert = self.get_alert(alert_id)
                      if not alert:
                          return None
                      alert["status"] = "ESCALATED"
                      alert["updated_at"] = self._now()
                      return alert

                  def close_alert(self, alert_id):
                      alert = self.update_status(alert_id, "CLOSED")
                      if alert:
                          alert["closed_at"] = self._now()
                      return alert

                  def generate_summary(self):
                      return {"total_alerts": len(self._alerts),
                              "open_alerts": len(self.get_open_alerts()),
                              "critical_alerts": len(self.get_critical_alerts()),
                              "generated_at": self._now()}

                  def generate_report(self):
                      return {"report_type": "EXECUTIVE_ALERTS",
                              "alerts": self.get_alerts(),
                              "summary": self.generate_summary(),
                              "generated_at": self._now()}
          '''))

          wf(EXE + "/executive_decision_engine.py", D(r'''
              """Executive Decision - NEXO / ZYRA."""
              from __future__ import annotations
              from datetime import datetime
              from uuid import uuid4
              from typing import Dict, List, Optional

              class ExecutiveDecisionEngine:
                  VALID_STATUS = ("READY", "APPROVED", "REJECTED", "EXECUTED", "CANCELLED")

                  def __init__(self):
                      self._decisions = []

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def support_decision(self, *, decision_context,
                                       recommendation="REVIEW_REQUIRED", priority="NORMAL"):
                      d = {"decision_id": f"DEC-{uuid4()}", "generated_at": self._now(),
                           "context": decision_context, "recommendation": recommendation,
                           "priority": priority, "status": "READY"}
                      self._decisions.append(d)
                      return d

                  def get_decision(self, decision_id):
                      for d in self._decisions:
                          if d["decision_id"] == decision_id:
                              return d
                      return None

                  def get_decisions(self):
                      return list(self._decisions)

                  def update_status(self, decision_id, status):
                      if status not in self.VALID_STATUS:
                          return None
                      d = self.get_decision(decision_id)
                      if not d:
                          return None
                      d["status"] = status
                      d["updated_at"] = self._now()
                      return d

                  def evaluate_impact(self, *, decision_id, financial, operational, compliance):
                      d = self.get_decision(decision_id)
                      if not d:
                          return None
                      d["impact"] = {"financial": financial, "operational": operational,
                                     "compliance": compliance}
                      d["updated_at"] = self._now()
                      return d

                  def generate_summary(self):
                      return {"total_decisions": len(self._decisions),
                              "ready": len([d for d in self._decisions if d["status"] == "READY"]),
                              "approved": len([d for d in self._decisions if d["status"] == "APPROVED"]),
                              "executed": len([d for d in self._decisions if d["status"] == "EXECUTED"]),
                              "generated_at": self._now()}

                  def generate_report(self):
                      return {"report_type": "EXECUTIVE_DECISIONS",
                              "decisions": self.get_decisions(),
                              "summary": self.generate_summary(),
                              "generated_at": self._now()}
          '''))

          wf(EXE + "/executive_kpi_engine.py", D(r'''
              """Executive KPI - NEXO / ZYRA."""
              from __future__ import annotations
              from datetime import datetime
              from typing import Dict, List

              class ExecutiveKPIEngine:
                  def __init__(self):
                      self._history = []

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def generate_kpis(self, *, metrics):
                      kpis = {"revenue_growth": metrics.get("revenue_growth", 0),
                              "profit_margin": metrics.get("profit_margin", 0),
                              "cash_flow": metrics.get("cash_flow", 0),
                              "customer_growth": metrics.get("customer_growth", 0),
                              "generated_at": self._now()}
                      self._history.append(kpis)
                      return kpis

                  def get_history(self):
                      return list(self._history)

                  def get_last_kpis(self):
                      return self._history[-1] if self._history else None

                  def calculate_executive_score(self, *, kpis):
                      values = [float(kpis.get("revenue_growth", 0)),
                                float(kpis.get("profit_margin", 0)),
                                float(kpis.get("cash_flow", 0)),
                                float(kpis.get("customer_growth", 0))]
                      if not values:
                          return 0.0
                      return round(sum(values) / len(values), 2)

                  def generate_summary(self):
                      last = self.get_last_kpis()
                      if not last:
                          return {"status": "NO_DATA", "generated_at": self._now()}
                      return {"executive_score": self.calculate_executive_score(kpis=last),
                              "generated_at": self._now(), "status": "ACTIVE"}

                  def generate_report(self):
                      return {"report_type": "EXECUTIVE_KPI",
                              "records": len(self._history),
                              "history": self.get_history(),
                              "summary": self.generate_summary(),
                              "generated_at": self._now()}
          '''))

          wf(EXE + "/executive_metrics_engine.py", D(r'''
              """Executive Metrics - NEXO / ZYRA."""
              from __future__ import annotations
              from datetime import datetime
              from typing import Dict, List, Optional

              class ExecutiveMetricsEngine:
                  def __init__(self):
                      self._metrics_history = []

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def calculate_metrics(self, *, source_data):
                      m = {"generated_at": self._now(), "metrics": source_data,
                           "status": "CALCULATED"}
                      self._metrics_history.append(m)
                      return m

                  def get_metrics_history(self):
                      return list(self._metrics_history)

                  def get_last_metrics(self):
                      return self._metrics_history[-1] if self._metrics_history else None

                  def generate_summary(self):
                      if not self._metrics_history:
                          return {"status": "NO_DATA", "generated_at": self._now()}
                      return {"records": len(self._metrics_history),
                              "generated_at": self._now(), "status": "ACTIVE"}

                  def generate_report(self):
                      return {"report_type": "EXECUTIVE_METRICS",
                              "history": self.get_metrics_history(),
                              "summary": self.generate_summary(),
                              "generated_at": self._now()}
          '''))

          wf(EXE + "/executive_monitor_engine.py", D(r'''
              """Executive Monitor - NEXO / ZYRA."""
              from __future__ import annotations
              from datetime import datetime
              from typing import Dict, List, Optional

              class ExecutiveMonitorEngine:
                  def __init__(self):
                      self._monitoring_history = []

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def monitor_business(self, *, indicators):
                      m = {"checked_at": self._now(), "indicators": indicators,
                           "status": "MONITORED"}
                      self._monitoring_history.append(m)
                      return m

                  def get_monitoring_history(self):
                      return list(self._monitoring_history)

                  def get_last_monitoring(self):
                      return self._monitoring_history[-1] if self._monitoring_history else None

                  def detect_anomalies(self, *, indicators, threshold=100.0):
                      anomalies = []
                      for key, value in indicators.items():
                          if isinstance(value, (int, float)):
                              if value > threshold:
                                  anomalies.append({"indicator": key, "value": value,
                                                    "threshold": threshold,
                                                    "detected_at": self._now()})
                      return anomalies

                  def generate_summary(self):
                      return {"monitoring_records": len(self._monitoring_history),
                              "generated_at": self._now(), "status": "ACTIVE"}

                  def generate_report(self):
                      return {"report_type": "EXECUTIVE_MONITOR",
                              "history": self.get_monitoring_history(),
                              "summary": self.generate_summary(),
                              "generated_at": self._now()}
          '''))

          wf(EXE + "/executive_report_engine.py", D(r'''
              """Executive Report - NEXO / ZYRA."""
              from __future__ import annotations
              from datetime import datetime
              from uuid import uuid4
              from typing import Dict, List, Optional

              class ExecutiveReportEngine:
                  def __init__(self):
                      self._reports = []

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def generate_report(self, *, dashboard_data, report_scope="GLOBAL"):
                      report = {"report_id": f"EXR-{uuid4()}",
                                "generated_at": self._now(),
                                "report_type": "EXECUTIVE",
                                "report_scope": report_scope,
                                "data": dashboard_data, "status": "GENERATED"}
                      self._reports.append(report)
                      return report

                  def get_reports(self):
                      return list(self._reports)

                  def get_report(self, report_id):
                      for r in self._reports:
                          if r["report_id"] == report_id:
                              return r
                      return None

                  def get_last_report(self):
                      return self._reports[-1] if self._reports else None

                  def generate_summary(self):
                      return {"total_reports": len(self._reports),
                              "generated_at": self._now(), "status": "ACTIVE"}

                  def export_report(self, report_id):
                      report = self.get_report(report_id)
                      if not report:
                          return None
                      return {"report_id": report["report_id"],
                              "exported_at": self._now(),
                              "status": "EXPORTED", "data": report}

                  def generate_global_report(self):
                      return {"report_type": "EXECUTIVE_REPORT_ENGINE",
                              "reports": self.get_reports(),
                              "summary": self.generate_summary(),
                              "generated_at": self._now()}
          '''))

          # ===== USE CASES (7) =====
          wf(UCE + "/analyze_metrics_use_case.py", D(r'''
              from __future__ import annotations
              from apps.nexo.domain.executive.executive_metrics_engine import ExecutiveMetricsEngine

              class AnalyzeMetricsUseCase:
                  def __init__(self, metrics_engine):
                      self._engine = metrics_engine

                  def execute(self, *, source_data):
                      return self._engine.calculate_metrics(source_data=source_data)
          '''))

          wf(UCE + "/generate_alerts_use_case.py", D(r'''
              from __future__ import annotations
              from apps.nexo.domain.executive.executive_alert_engine import ExecutiveAlertEngine

              class GenerateAlertsUseCase:
                  def __init__(self, alert_engine):
                      self._engine = alert_engine

                  def execute(self, *, level, title, description,
                              source_module=None, reference_id=None, metadata=None):
                      return self._engine.create_alert(
                          level=level, title=title, description=description,
                          source_module=source_module, reference_id=reference_id,
                          metadata=metadata)
          '''))

          wf(UCE + "/generate_dashboard_use_case.py", D(r'''
              from __future__ import annotations
              from apps.nexo.domain.executive.executive_dashboard_engine import ExecutiveDashboardEngine

              class GenerateDashboardUseCase:
                  def __init__(self, dashboard_engine):
                      self._engine = dashboard_engine

                  def execute(self, *, kpis, metrics, alerts, decisions):
                      return self._engine.build_dashboard(
                          kpis=kpis, metrics=metrics, alerts=alerts,
                          decisions=decisions)
          '''))

          wf(UCE + "/generate_executive_report_use_case.py", D(r'''
              from __future__ import annotations
              from apps.nexo.domain.executive.executive_report_engine import ExecutiveReportEngine

              class GenerateExecutiveReportUseCase:
                  def __init__(self, report_engine):
                      self._engine = report_engine

                  def execute(self, *, dashboard_data, report_scope="GLOBAL"):
                      return self._engine.generate_report(
                          dashboard_data=dashboard_data, report_scope=report_scope)
          '''))

          wf(UCE + "/generate_kpi_use_case.py", D(r'''
              from __future__ import annotations
              from apps.nexo.domain.executive.executive_kpi_engine import ExecutiveKPIEngine

              class GenerateKPIUseCase:
                  def __init__(self, kpi_engine):
                      self._engine = kpi_engine

                  def execute(self, *, metrics):
                      return self._engine.generate_kpis(metrics=metrics)
          '''))

          wf(UCE + "/monitor_business_use_case.py", D(r'''
              from __future__ import annotations
              from apps.nexo.domain.executive.executive_monitor_engine import ExecutiveMonitorEngine

              class MonitorBusinessUseCase:
                  def __init__(self, monitor_engine):
                      self._engine = monitor_engine

                  def execute(self, *, indicators):
                      monitoring = self._engine.monitor_business(indicators=indicators)
                      anomalies = self._engine.detect_anomalies(indicators=indicators)
                      return {"monitoring": monitoring, "anomalies": anomalies,
                              "status": "MONITORED"}
          '''))

          wf(UCE + "/support_decision_use_case.py", D(r'''
              from __future__ import annotations
              from apps.nexo.domain.executive.executive_decision_engine import ExecutiveDecisionEngine

              class SupportDecisionUseCase:
                  def __init__(self, decision_engine):
                      self._engine = decision_engine

                  def execute(self, *, decision_context,
                              recommendation="REVIEW_REQUIRED", priority="NORMAL"):
                      return self._engine.support_decision(
                          decision_context=decision_context,
                          recommendation=recommendation, priority=priority)
          '''))

          # ===== MODULE 001 (CORREGIDO: todo a nivel de modulo) =====
          wf("apps/nexo/module/modulo_001_super_bunker.py", D(r'''
              """Modulo 001 Super Bunker Gold - NEXO / ZYRA
              (v2: todas las funciones a nivel de modulo)."""
              from __future__ import annotations
              from datetime import datetime
              from typing import Dict, List

              _bunker_events: List[Dict] = []

              def emit(event_name):
                  """Registra evento del bunker."""
                  _bunker_events.append({
                      "event": event_name,
                      "timestamp": datetime.utcnow().isoformat()})

              def get_bunker_events():
                  return list(_bunker_events)

              def pause():
                  input("\nPresiona ENTER para continuar...")

              def menu(title, options):
                  while True:
                      print("\n=== " + title + " ===")
                      for i, k in enumerate(options.keys(), 1):
                          print(str(i) + ". " + k)
                      print("0. Volver")
                      op = input("> ").strip()
                      if op == "0":
                          return
                      try:
                          list(options.values())[int(op) - 1]()
                      except Exception:
                          print("Opcion invalida")
                          pause()

              def accion(nombre):
                  def inner():
                      print("\n[ACCION] " + nombre)
                      pause()
                  return inner

              def eventos_menores():
                  emit("SB_EVENTOS_MENORES")
                  menu("Eventos Menores", {
                      "Reset de Contraseña": accion("Reset de Contraseña"),
                      "Verificación por Código SMS": accion("Verificación por Código SMS"),
                      "Bloqueo Temporal de Sesión": accion("Bloqueo Temporal de Sesión"),
                      "Registro de Evento": accion("Registro de Evento")})

              def eventos_graves():
                  emit("SB_EVENTOS_GRAVES")
                  menu("Eventos Graves", {
                      "Bloqueo de Cuenta": accion("Bloqueo de Cuenta"),
                      "Congelación de Fondos": accion("Congelación de Fondos"),
                      "Alerta a Seguridad": accion("Alerta a Seguridad"),
                      "Evidencia Forense": accion("Evidencia Forense")})

              def crisis_suprema():
                  emit("SB_CRISIS_SUPREMA")
                  menu("Crisis Suprema", {
                      "Aislamiento Total del Usuario": accion("Aislamiento Total del Usuario"),
                      "Cierre de Canales": accion("Cierre de Canales"),
                      "Alerta ROOT": accion("Alerta ROOT"),
                      "Modo Crisis Global": accion("Modo Crisis Global")})

              def identidad_seguridad():
                  emit("SB_IDENTIDAD")
                  menu("Identidad & Verificación", {
                      "Validación Biométrica": accion("Validación Biométrica"),
                      "Verificación Facial": accion("Verificación Facial"),
                      "Revisión Manual Identidad": accion("Revisión Manual Identidad")})

              def auditoria_suprema():
                  emit("SB_AUDITORIA")
                  menu("Auditoría Suprema", {
                      "Auditoría de Accesos": accion("Auditoría de Accesos"),
                      "Auditoría de Cambios": accion("Auditoría de Cambios"),
                      "Auditoría de Decisiones": accion("Auditoría de Decisiones")})

              def dominio_riesgos():
                  emit("SB_DOMINIO_RIESGOS")
                  menu("Gestión de Riesgos", {
                      "Eventos Menores": eventos_menores,
                      "Eventos Graves": eventos_graves})

              def dominio_crisis():
                  emit("SB_DOMINIO_CRISIS")
                  menu("Gestión de Crisis", {
                      "Crisis Suprema": crisis_suprema})

              def dominio_identidad():
                  emit("SB_DOMINIO_IDENTIDAD")
                  menu("Identidad & Accesos", {
                      "Verificación de Identidad": identidad_seguridad})

              def dominio_auditoria():
                  emit("SB_DOMINIO_AUDITORIA")
                  menu("Auditoría & Evidencia", {
                      "Auditoría Suprema": auditoria_suprema})

              def modulo_001_super_bunker():
                  emit("SUPER_BUNKER_GOLD_ACTIVO")
                  menu("SUPER BUNKER GOLD - SEGURIDAD ABSOLUTA", {
                      "Gestión de Riesgos": dominio_riesgos,
                      "Gestión de Crisis": dominio_crisis,
                      "Identidad & Accesos": dominio_identidad,
                      "Auditoría & Evidencia": dominio_auditoria})
          '''))

          # ===== MODULE 1 (orquestador) =====
          wf("apps/nexo/module/modulo_1_panel_ejecutivo.py", D(r'''
              """Modulo 1 Panel Ejecutivo - orquestador."""
              from __future__ import annotations
              from typing import Dict
              from apps.nexo.domain.executive.executive_dashboard_engine import (
                  ExecutiveDashboardEngine)
              from apps.nexo.domain.executive.executive_alert_engine import (
                  ExecutiveAlertEngine)
              from apps.nexo.domain.executive.executive_decision_engine import (
                  ExecutiveDecisionEngine)
              from apps.nexo.domain.executive.executive_kpi_engine import (
                  ExecutiveKPIEngine)
              from apps.nexo.domain.executive.executive_metrics_engine import (
                  ExecutiveMetricsEngine)
              from apps.nexo.domain.executive.executive_monitor_engine import (
                  ExecutiveMonitorEngine)
              from apps.nexo.domain.executive.executive_report_engine import (
                  ExecutiveReportEngine)

              class Modulo1PanelEjecutivo:
                  """Panel Ejecutivo: orquesta los 7 engines."""

                  def __init__(self):
                      self.dashboard = ExecutiveDashboardEngine()
                      self.alerts = ExecutiveAlertEngine()
                      self.decisions = ExecutiveDecisionEngine()
                      self.kpis = ExecutiveKPIEngine()
                      self.metrics = ExecutiveMetricsEngine()
                      self.monitor = ExecutiveMonitorEngine()
                      self.reports = ExecutiveReportEngine()

                  def resumen_general(self):
                      kpis = self.kpis.get_last_kpis() or {}
                      alerts = self.alerts.get_open_alerts()
                      decisions = self.decisions.get_decisions()
                      return self.dashboard.build_dashboard(
                          kpis=kpis, metrics={}, alerts=alerts,
                          decisions=decisions)

                  def crear_alerta(self, *, level, title, description,
                                   source_module=None):
                      return self.alerts.create_alert(
                          level=level, title=title,
                          description=description,
                          source_module=source_module)

                  def crear_decision(self, *, context,
                                     recommendation="REVIEW_REQUIRED",
                                     priority="NORMAL"):
                      return self.decisions.support_decision(
                          decision_context=context,
                          recommendation=recommendation,
                          priority=priority)

                  def calcular_kpis(self, *, metrics):
                      k = self.kpis.generate_kpis(metrics=metrics)
                      score = self.kpis.calculate_executive_score(kpis=k)
                      return {"kpis": k, "executive_score": score}

                  def monitorear(self, *, indicators):
                      m = self.monitor.monitor_business(indicators=indicators)
                      anomalies = self.monitor.detect_anomalies(indicators=indicators)
