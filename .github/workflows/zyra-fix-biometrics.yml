name: ZYRA D6 registro con actor pantalla limpia y redireccion mpe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD6:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: D6 completo
        run: |
          python3 - <<'PYEOF'
          import base64, hashlib, json, os, py_compile, re, secrets, sqlite3, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          PORTAL = ROOT / 'portal'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD6.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          class NoRedir(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(NoRedir)

          def pedir(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  resp = OPENER.open(req, timeout=20)
                  return resp.status, resp.headers, resp.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, None, str(e)

          def png_min(rgb=(90, 90, 160)):
              def chunk(tipo, datos):
                  cuerpo = tipo + datos
                  return struct.pack('>I', len(datos)) + cuerpo + struct.pack('>I', zlib.crc32(cuerpo) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', 8, 8, 8, 2, 0, 0, 0)
              fila = b'\x00' + bytes(rgb) * 8
              raw = fila * 8
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')

          DOC_B64 = base64.b64encode(png_min()).decode('ascii')
          SELF_B64 = base64.b64encode(png_min((160, 90, 90))).decode('ascii')

          sp_orig = SP_FILE.read_bytes()
          idx = PORTAL / 'index.html'
          regf = PORTAL / 'registro.html'
          swf = PORTAL / 'sw.js'
          verf = PORTAL / 'version.txt'
          originales = {'sp': sp_orig, 'idx': idx.read_bytes(),
                        'reg': regf.read_bytes() if regf.exists() else b'',
                        'sw': swf.read_bytes() if swf.exists() else b''}
          creados = []

          def revertir():
              try:
                  SP_FILE.write_bytes(originales['sp'])
                  idx.write_bytes(originales['idx'])
                  if originales['reg']:
                      regf.write_bytes(originales['reg'])
                  if originales['sw']:
                      swf.write_bytes(originales['sw'])
                  for c in creados:
                      p = ROOT / c
                      if p.exists():
                          p.unlink()
              except Exception:
                  pass

          nf0 = np0 = 0
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              nf0 += 1
              if p.suffix == '.py':
                  np0 += 1

          t0sp = sp_orig.decode('utf-8')
          add('# D6 - REGISTRO CON ACTOR + PANTALLA LIMPIA + REDIRECCION MPE')
          add('')
          add('Corrige #788: ZYRA_URL en el test, estado de pantalla, ruta /version,')
          add('intercepcion /mpe/register en el proxy (sin tocar MPE), y campo actor')
          add('exigido por la Red en /identity/enroll (escalera de sondas).')
          add('Snapshot inicial: archivos=%d python=%d' % (nf0, np0))
          add('')

          add('## W1. Escalera de sondas: encontrar el actor que la Red acepta')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d6', 'ZYRA_PORT': str(NP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              try:
                  urllib.request.urlopen(BASE + '/health', timeout=2)
                  vivo = True
                  break
              except urllib.error.HTTPError:
                  vivo = True
                  break
              except Exception:
                  time.sleep(1.0)
          H = {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN}
          ACTOR = None
          if vivo:
              for cand in ('superapp', 'system', 'ZYRA', 'Z-OWNER-ALFONSZELAYA', 'admin'):
                  pl = {'kind': 'person', 'name': 'Sonda D6', 'actor': cand,
                        'doc_image_b64': DOC_B64, 'selfie_image_b64': SELF_B64}
                  req = urllib.request.Request(BASE + '/identity/enroll', data=json.dumps(pl).encode('utf-8'), headers=H, method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=15) as r:
                          st, cuerpo = r.status, r.read().decode('utf-8', errors='replace')
                  except urllib.error.HTTPError as e:
                      st, cuerpo = e.code, e.read().decode('utf-8', errors='replace')
                  pidio_actor = 'actor' in cuerpo and 'faltante' in cuerpo
                  add('- actor=%s -> %s | %s' % (cand, st, cuerpo[:200]))
                  if st in (200, 201):
                      ACTOR = cand
                      add('- **ENROLL EXITOSO con actor=%s**' % cand)
                      break
                  if not pidio_actor and ACTOR is None:
                      ACTOR = cand
                      add('- actor=%s supera el campo actor (sigue: %s)' % (cand, cuerpo[:120]))
                      break
          gate('actor_sondeado', ACTOR is not None)
          if ACTOR is None:
              ACTOR = 'superapp'
          add('- **ACTOR ELEGIDO: %s** (configurable via ZYRA_ENROLL_ACTOR)' % ACTOR)
          DATA['actor'] = ACTOR
          add('')

          try:
              if proc.poll() is None:
                  proc.terminate()
                  proc.wait(timeout=10)
          except Exception:
              try:
                  proc.kill()
              except Exception:
                  pass

          add('## W2. registro.html biometrico')
          add('')
          REG = (
          '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n'
          '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
          '<title>Registro - ZYRA</title>\n<style>\n'
          'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:#0a0e27;'
          'color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:28px 14px;box-sizing:border-box}\n'
          '.caja{max-width:480px;width:100%;background:#11162b;border:1px solid #242c4f;'
          'border-radius:16px;padding:24px 20px;box-sizing:border-box}\n'
          'h1{margin:0 0 6px;font-size:21px;text-align:center}\n'
          'p{color:#8b949e;font-size:13px;line-height:1.5;margin:6px 0;text-align:center}\n'
          'label{display:block;font-size:13px;color:#8b949e;margin:10px 0 4px}\n'
          'input{width:100%;padding:12px;border-radius:10px;border:1px solid #30363d;'
          'background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px}\n'
          'video{width:100%;border-radius:12px;background:#000;margin-top:6px}\n'
          'canvas{display:none}\n'
          'button{width:100%;margin-top:10px;padding:13px;border-radius:12px;border:none;'
          'background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);color:#fff;font-size:15px;font-weight:700}\n'
          '.mini{background:#1f2a44;font-size:14px}\n'
          '.hecho{outline:2px solid #238636;opacity:.85}\n'
          'a{color:#8b5cf6;text-decoration:none}\n'
          '#resp{margin-top:12px;text-align:center;font-size:14px;word-break:break-all}\n'
          '.zid{color:#3fb950;font-weight:800;font-size:20px}\n'
          '</style>\n</head>\n<body>\n<div class="caja">\n'
          '<h1>Registro de ciudadanos</h1>\n'
          '<p>Un solo registro para toda la vida. La Red verifica tu identidad con biometria y crea tu <b>ZID unico e inmutable</b>.</p>\n'
          '<form id="f" onsubmit="return enviar(event)">\n'
          '<label>Nombre completo</label>\n<input id="nombre" required>\n'
          '<label>1) Foto del documento (DUI o pasaporte)</label>\n'
          '<input id="doc" type="file" accept="image/*" capture="environment" required>\n'
          '<label>2) Selfie en vivo</label>\n'
          '<video id="cam" autoplay playsinline></video>\n'
          '<button type="button" class="mini" id="bcam" onclick="abrirCam()">Abrir camara</button>\n'
          '<button type="button" class="mini" id="bself" onclick="tomarSelfie()">Capturar selfie</button>\n'
          '<label>3) Crea tu clave de acceso</label>\n'
          '<input id="clave" type="password" minlength="8" required>\n'
          '<label>Repite la clave</label>\n<input id="clave2" type="password" minlength="8" required>\n'
          '<div id="resp"></div>\n'
          '<button type="submit" id="bcrear">Crear mi ZID</button>\n'
          '</form>\n'
          '<p style="margin-top:14px"><a href="/">Volver</a> | <a href="/entrar">Ya tengo ZID</a></p>\n'
          '</div>\n<script>\n'
          'function abrirCam(){navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(function(s){document.getElementById("cam").srcObject=s;});}\n'
          'function capturar(video){var c=document.getElementById("lienzo");if(!c){c=document.createElement("canvas");c.id="lienzo";c.style.display="none";document.body.appendChild(c);}c.width=video.videoWidth||640;c.height=video.videoHeight||480;c.getContext("2d").drawImage(video,0,0);return c.toDataURL("image/jpeg",0.85).split(",")[1];}\n'
          'function tomarSelfie(){var v=document.getElementById("cam");if(!v.srcObject){alert("Abre la camara primero");return;}var b=capturar(v);document.getElementById("bself").dataset.selfie=b;document.getElementById("bself").classList.add("hecho");document.getElementById("bself").textContent="Selfie capturada";}\n'
          'document.getElementById("doc").addEventListener("change",function(){var f=document.getElementById("doc");if(!f.files[0]){return;}var r=new FileReader();r.onload=function(){f.dataset.b64=r.result.split(",")[1];f.classList.add("hecho");};r.readAsDataURL(f.files[0]);});\n'
          'async function enviar(ev){ev.preventDefault();\n'
          'var c1=document.getElementById("clave").value,c2=document.getElementById("clave2").value;\n'
          'var respEl=document.getElementById("resp");\n'
          'if(c1!==c2){respEl.innerHTML="<p style=\'color:#f85149\'>Las claves no coinciden.</p>";return false;}\n'
          'var docb=document.getElementById("doc").dataset.b64;\n'
          'var selfb=document.getElementById("bself").dataset.selfie;\n'
          'if(!docb){respEl.innerHTML="<p>Falta la foto del documento.</p>";return false;}\n'
          'if(!selfb){respEl.innerHTML="<p>Falta la selfie en vivo.</p>";return false;}\n'
          'respEl.innerHTML="<p>Enviando a la Red... verificando biometria...</p>";\n'
          'var r=await fetch("/registro/nuevo",{method:"POST",headers:{"Content-Type":"application/json"},'
          'body:JSON.stringify({nombre:document.getElementById("nombre").value,clave:c1,'
          'doc_image_b64:docb,selfie_image_b64:selfb})});\n'
          'var j=await r.json();\n'
          'if(j.ok&&j.zid){respEl.innerHTML='
          '"<p>La Red creo tu identidad:</p><p class=\'zid\'>"+j.zid+"</p>"'
          '+"<p>Guarda tu ZID y tu clave.</p><p><a href=\'/entrar\'>Entrar con mi ZID</a></p>";}'
          'else{respEl.innerHTML="<p style=\'color:#f85149\'>"+(j.error||"La Red no completo el registro")+"</p>";}\n'
          'return false;}\n'
          '</script>\n</body>\n</html>\n'
          )
          regf.write_text(REG, encoding='utf-8')
          gate('registro_html', True)
          add('')

          add('## W3. index.html limpio con instalar y banner')
          add('')
          INDEX = (
          '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n'
          '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
          '<link rel="manifest" href="/manifest.json">\n<meta name="theme-color" content="#0a0e27">\n'
          '<title>ZYRA</title>\n<style>\n'
          'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;'
          'background:radial-gradient(circle at 20% 10%,#141a3d 0%,#0a0e27 55%);'
          'color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:40px 20px;box-sizing:border-box}\n'
          '.logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#8b5cf6,#3b82f6,#ec4899);'
          'display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;'
          'box-shadow:0 8px 30px rgba(139,92,246,0.45)}\n'
          'h1{margin:18px 0 4px;font-size:34px;letter-spacing:6px}\n'
          '.tag{color:#8b949e;margin:0 0 26px;text-align:center;max-width:420px}\n'
          '.estado{font-size:14px;margin:0 0 20px;padding:6px 14px;border-radius:99px;border:1px solid #238636;color:#3fb950}\n'
          '.menu{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}\n'
          '.opcion{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:#11162b;'
          'border:1px solid #242c4f;border-radius:14px;padding:16px 18px}\n'
          '.opcion:hover{border-color:#8b5cf6}\n'
          '.opcion b{font-size:17px}\n.opcion span{font-size:13px;color:#8b949e}\n'
          '#btn-instalar{display:none;width:100%;max-width:420px;margin-top:12px;padding:14px;border-radius:14px;'
          'border:none;background:#238636;color:#fff;font-size:16px;font-weight:700}\n'
          '#banner-act{display:none;width:100%;max-width:420px;margin-top:16px;background:#1f2a44;'
          'border:1px solid #8b5cf6;border-radius:14px;padding:14px;text-align:center}\n'
          '#banner-act button{margin-top:8px;padding:10px 22px;border-radius:10px;border:none;'
          'background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;font-weight:700}\n'
          '.pie{margin-top:30px;color:#4a5370;font-size:12px;letter-spacing:2px}\n'
          '</style>\n</head>\n<body>\n<div class="logo">Z</div>\n<h1>ZYRA</h1>\n'
          '<p class="tag">Red de confianza digital. Tu identidad, verificada y tuya.</p>\n'
          '__ESTADO__\n'
          '<div class="menu">\n'
          '<a class="opcion" href="/registro"><b>Registro</b><span>Crea tu ZID unico con biometria</span></a>\n'
          '<a class="opcion" href="/entrar"><b>Entrar</b><span>Si ya estas registrado</span></a>\n'
          '<a class="opcion" href="/verificar"><b>Verificar</b><span>Confirma la autenticidad de un documento</span></a>\n'
          '</div>\n'
          '<button id="btn-instalar" onclick="instalarApp()">Instalar app</button>\n'
          '<div id="banner-act"><div>Nueva version disponible</div>'
          '<button onclick="aplicarActualizacion()">Actualizar</button></div>\n'
          '<p class="pie">JAZA GLOBAL SYSTEMS</p>\n'
          '<script>\nvar _zp=null;\n'
          "window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_zp=e;document.getElementById('btn-instalar').style.display='block';});\n"
          'function instalarApp(){if(_zp){_zp.prompt();_zp=null;}}\n'
          "if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}\n"
          "fetch('/version').then(function(r){return r.text();}).then(function(v){"
