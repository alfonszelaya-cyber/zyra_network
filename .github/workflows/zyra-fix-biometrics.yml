      - name: Escribir pruebas (corregidas con contratos reales del log)
        run: |
          cat > apps/laboratorio/tests/test_gemelo_vivo.py <<'TG_EOF'
          """Gemelo digital en vivo - datos reales, deltas y alertas honestas."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.simulation_engine import GemeloVivo
          from apps.laboratorio.tests.conftest import assert_2xx


          def test_registrar_y_actualizar_con_delta():
              gem = GemeloVivo()
              gem.registrar_fuente("sensor-rio", "sensor", 2.0, umbral_alto=5.0)
              res = gem.actualizar("sensor-rio", 3.5)
              assert res["valor_anterior"] == 2.0
              assert res["valor_nuevo"] == 3.5
              assert res["delta"] == 1.5
              assert res["alertas"] == []


          def test_alerta_umbral_alto_y_bajo():
              gem = GemeloVivo()
              gem.registrar_fuente("rio", "sensor", 3.0, umbral_alto=5.0, umbral_bajo=1.0)
              assert gem.actualizar("rio", 6.0)["alertas"][0]["tipo"] == "umbral_alto_superado"
              assert gem.actualizar("rio", 0.5)["alertas"][0]["tipo"] == "umbral_bajo_superado"


          def test_fuente_no_registrada_rechaza():
              gem = GemeloVivo()
              with pytest.raises(ValueError):
                  gem.actualizar("fantasma", 1.0)


          def test_tipo_invalido_y_umbrales_invalidos_rechazan():
              gem = GemeloVivo()
              with pytest.raises(ValueError):
                  gem.registrar_fuente("a", "telepatia", 1.0)
              with pytest.raises(ValueError):
                  gem.registrar_fuente("b", "sensor", 1.0, umbral_alto=5.0, umbral_bajo=5.0)


          def test_estado_y_historico_reales():
              gem = GemeloVivo()
              gem.registrar_fuente("api-sismos", "api", 1.0)
              gem.actualizar("api-sismos", 2.0)
              gem.actualizar("api-sismos", 4.0)
              assert gem.estado()["actualizaciones_totales"] == 2
              assert gem.historico("api-sismos")["valores"] == [1.0, 2.0, 4.0]


          def test_gemelo_por_http(despachar):
              cuerpo = json.dumps({"id": "sensor-aforo", "tipo": "sensor", "valor": 10.0,
                                   "umbral_alto": 20.0, "etiqueta": "aforo"}).encode("utf-8")
              status, _h, datos = despachar("POST", "/laboratorio/api/v1/twin/sources", cuerpo)
              assert_2xx(status, datos)
              status2, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/twin/sources/sensor-aforo",
                  json.dumps({"valor": 25.0}).encode("utf-8"),
              )
              assert_2xx(status2, datos2)
              assert datos2["datos"]["alertas"][0]["tipo"] == "umbral_alto_superado"
              status3, _h3, datos3 = despachar("GET", "/laboratorio/api/v1/twin")
              assert_2xx(status3, datos3)
              assert datos3["datos"]["total_fuentes"] == 1
          TG_EOF
          cat > apps/laboratorio/tests/test_presentacion_interactiva.py <<'TP_EOF'
          """Presentacion holografica interactiva: crear, controlar, tocar, proyectar."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.presentation_remote import (
              PresentacionRemota,
              SesionPresentacion,
          )
          from apps.laboratorio.infrastructure.providers.display_holo3d import MotorHolo3D
          from apps.laboratorio.tests.conftest import OBJETOS, assert_2xx


          class _PasoFalso:
              def __init__(self, titulo, contenido):
                  self.titulo = titulo
                  self.contenido = contenido

              def a_dict(self):
                  return {"titulo": self.titulo, "contenido": self.contenido}


          class _PresentacionFalsa:
              id = "pres-test"
              pasos = [
                  _PasoFalso("Inicio", "Bienvenidos al proyecto"),
                  _PasoFalso("Modelo 3D", "Este es el modelo"),
                  _PasoFalso("Cierre", "Preguntas"),
              ]


          def _sesion():
              return SesionPresentacion("ses-test", _PresentacionFalsa(), MotorHolo3D())


          def _gestor():
              repo = type("R", (), {"obtener_exigir": staticmethod(lambda pid: _PresentacionFalsa())})()
              return PresentacionRemota(repo, MotorHolo3D())


          def test_crear_sesion_con_pasos_reales():
              res = _gestor().crear_sesion("pres-test")
              assert res["total_pasos"] == 3
              assert "view" in res["vista_control"]
              assert isinstance(res["sesion"], str) and res["sesion"]


          def test_sesion_desconocida_rechaza():
              with pytest.raises(ValueError):
                  _gestor().sesion("fantasma")


          def test_avanzar_retroceder_ir_a():
              s = _sesion()
              assert s.avanzar()["paso"] == 1
              assert s.avanzar()["paso"] == 2
              assert s.avanzar()["paso"] == 2
              assert s.retroceder()["paso"] == 1
              assert s.ir_a(0)["paso"] == 0
              with pytest.raises(ValueError):
                  s.ir_a(99)


          def test_tocar_punto_registra_anotacion():
              s = _sesion()
              a = s.tocar_punto(120.5, 80.2, "entrada")
              assert a["paso"] == 0 and a["x"] == 120.5
              assert len(s.anotaciones_del_paso(0)) == 1
              assert s.anotaciones_del_paso(1) == []
              with pytest.raises(ValueError):
                  s.tocar_punto(-1, 0)


          def test_frame_holograma_incluye_titulo_y_anotaciones():
              s = _sesion()
              s.tocar_punto(100, 100, "punto clave")
              frame = s.frame_holograma().decode("utf-8")
              assert "<svg" in frame and "Inicio" in frame and "circle" in frame


          def test_proyectar_paso_actual_por_salida_universal():
              res = _gestor().crear_sesion("pres-test")
              salida = _gestor().proyectar_paso_actual(res["sesion"])
              assert salida["paso"] == 0
              assert salida["proyeccion"]["entregado"] is True


          def test_finalizar_devuelve_historial_completo():
              s = _sesion()
              s.avanzar()
              s.tocar_punto(10, 10)
              res = s.finalizar()
              assert res["anotaciones"] == 1
              acciones = [h["accion"] for h in res["historial"]]
              assert "avanzar" in acciones and "tocar_punto" in acciones and "finalizar" in acciones


          def test_ciclo_completo_por_http(despachar):
              _s, _h, datos = despachar("POST", "/laboratorio/api/v1/projects", json.dumps({
                  "titulo": "Proy presentacion", "tipo": "negocio",
              }).encode("utf-8"))
              assert_2xx(_s, datos)
              proyecto_id = datos["datos"]["proyecto"]["id"]
              status_sc, _hs, datos_sc = despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/scenes",
                  json.dumps({"nombre": "Escena de la presentacion", "objetos": OBJETOS}).encode("utf-8"),
              )
              assert_2xx(status_sc, datos_sc)
              escena_id = datos_sc["datos"]["escena"]["id"]
              status, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/presentations",
                  json.dumps({"titulo": "Mi presentacion", "pasos": [
                      {"titulo": "Inicio", "contenido": "Hola", "duracion_segundos": 30, "escena_id": escena_id},
                      {"titulo": "Demo", "contenido": "Mira", "duracion_segundos": 45, "escena_id": escena_id},
                  ]}).encode("utf-8"),
              )
              assert_2xx(status, datos2)
              presentacion_id = datos2["datos"]["presentacion"]["id"]
              status3, _h3, datos3 = despachar(
                  "POST", "/laboratorio/api/v1/presentations/remote",
                  json.dumps({"presentacion_id": presentacion_id}).encode("utf-8"),
              )
              assert_2xx(status3, datos3)
              sesion_id = datos3["datos"]["sesion"]
              status4, _h4, datos4 = despachar(
                  "POST", "/laboratorio/api/v1/presentations/remote/" + sesion_id + "/accion",
                  json.dumps({"accion": "avanzar"}).encode("utf-8"),
              )
              assert_2xx(status4, datos4)
              assert datos4["paso"] == 1
              status5, _h5, datos5 = despachar(
                  "POST", "/laboratorio/api/v1/presentations/remote/" + sesion_id + "/tocar",
                  json.dumps({"x": 200, "y": 150, "etiqueta": "aqui"}).encode("utf-8"),
              )
              assert_2xx(status5, datos5)
              status6, _h6, datos6 = despachar("GET", "/laboratorio/api/v1/presentations/remote/" + sesion_id)
              assert_2xx(status6, datos6)
              assert datos6["anotaciones_total"] == 1
              status7, _h7, _d7 = despachar("GET", "/laboratorio/api/v1/presentations/remote/" + sesion_id + "/view")
              assert_2xx(status7, _d7)
          TP_EOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - Run 2C"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "EX Run 2 - presentacion holografica interactiva corregida (ids str, Escena3D real, pasos con escena)"
            git push
          fi
