name: "AXIS AX-8: AUDITORIA FINAL - certificacion AXIS (informe en Resumen del run)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: axis-audit
  cancel-in-progress: true

jobs:
  final_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "1. Estado estructural: sintaxis + carpetas esqueleto"
        run: |
          python3 - <<'ESTEOF'
          from pathlib import Path
          import ast
          malos = 0
          total = 0
          for f in Path("apps/axis").rglob("*.py"):
              total += 1
              try:
                  ast.parse(f.read_text(encoding="utf-8",
                      errors="replace"))
              except SyntaxError:
                  malos += 1
          print("archivos escaneados: " + str(total))
          print("SINTAXIS_ERRORES=" + str(malos))
          base = Path("apps/axis")
          vacias = 0
          for d in base.rglob("*"):
              if not d.is_dir():
                  continue
              if "tests" in str(d):
                  continue
              hijos = list(d.iterdir())
              if not hijos or all(
                  h.name == "__init__.py"
                  and h.stat().st_size == 0
                  for h in hijos):
                  vacias += 1
          print("CARPETAS_SKELETO_VACIO=" + str(vacias))
          ESTEOF

      - name: "2. GATE completo 4 apps (veredicto funcional)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tee /tmp/gate.txt | tail -4
          grep -E "leftover threads" -A 12 /tmp/gate.txt || true

      - name: "3. CHECKLIST 9 puntos GPT + vision + transversal"
        run: |
          python3 - <<'CHKEOF'
          from pathlib import Path
          srv = Path("apps/axis/server.py").read_text(encoding="utf-8")
          link = Path("apps/axis/services/axis_link.py").read_text(encoding="utf-8")
          ob = Path("apps/axis/life_history/outbox_bridge.py").read_text(encoding="utf-8")
          tst = Path("apps/axis/tests/test_axis.py").read_text(encoding="utf-8")
          perm = Path("apps/axis/life_history/permissions.py").read_text(encoding="utf-8")
          R = []
          R.append(("P1 ley biometrica", "biometria:" in link and "use enroll_person" in link))
          R.append(("P1 serve_axis auto-wire", "outbox_bridge = outbox_bridge" in srv))
          R.append(("P1 audit/verify cadena nacional", '"audit", "verify"' in srv))
          R.append(("P1 verify publico", '"verify", "redeem"' in srv and '"verify", "generate"' in srv))
          R.append(("P2 censo nacional vivo", '"gobierno", "censo' in srv))
          R.append(("P3 guardias authorize", "_zax_auth" in srv and 'if s == ["gobierno", "ingesta"]:' in srv))
          R.append(("P4 catalogo 11 eventos", "def validate_event_type" in ob))
          R.append(("P4 network/sync", 'if s == ["network", "sync"]:' in srv))
          R.append(("P5 aceptacion e2e", "test_axz5_acceptance_full" in tst))
          R.append(("P5 carga 50 concurrentes", "test_axz5_load_50_births_chain" in tst))
          R.append(("P6 hilos 0 + idempotente", "_axz_kill_servers" in tst and "IF NOT EXISTS" in ob))
          R.append(("TRANSVERSAL sello documentos", "seal" in link))
          R.append(("VISION censo desde cadenas", "_censo_data" in srv))
          R.append(("VISION doble entrada", "_api_post" in srv and "birth-register" in srv))
          R.append(("VISION internacional", "def authorize(" in perm))
          verdes = sum(1 for _, v in R if v)
          for n, v in R:
              print(("VERDE  " if v else "ROJO   ") + n)
          print("CHECKLIST: " + str(verdes) + "/" + str(len(R)))
          assert verdes == len(R), "hay puntos en rojo"
          CHKEOF

      - name: "4. INFORME FINAL en el Resumen del run (heredoc shell, sin Python)"
        run: |
          GATE_LINE=$(grep -E "passed|failed" /tmp/gate.txt | tail -1)
          cat >> "$GITHUB_STEP_SUMMARY" <<'FINRESUMEN'
          ## CERTIFICACION FINAL AXIS (AX-1..AX-8)

          | Punto | Estado |
          |---|---|
          | AX-1 ley + serve_axis + audit/verify + verify publico | CERRADO |
          | AX-2 censo nacional 200/403 | CERRADO |
          | AX-3 guardias + ZID automatico + fix raiz ingesta | CERRADO |
          | AX-4 catalogo 11 eventos + network/sync | CERRADO |
          | AX-5 aceptacion e2e + carga 50 concurrentes | CERRADO |
          | AX-6 utcnow 0 + migraciones idempotentes + hilos 0 | CERRADO |
          | AX-7 auditoria estructura (0 rotos, 0 duplicados, 0 islas) | CERRADO |
          | AX-8 certificacion final | ESTE RUN |

          Resultado del GATE: GATE_LINE_PLACEHOLDER

          Backlog de Red (no AXIS): GET /history/{zid} 500
          Fases futuras: Vista General de Gobierno (5 apps), super-app por rol, motor transversal de documentos, IA plugable, DB productiva (conexion abierta, sin demos).
          FINRESUMEN
          sed -i "s/GATE_LINE_PLACEHOLDER/$GATE_LINE/" "$GITHUB_STEP_SUMMARY"
          echo "informe escrito en el Resumen"
          echo "GATE: $GATE_LINE"

      - name: "Contexto"
        run: |
          git log --oneline -5
