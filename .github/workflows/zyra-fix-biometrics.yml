name: zyra-fix-biometrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Corregir superapp.py y probar todo
        run: |
          cat > "$RUNNER_TEMP/zyra_fix_v3.py" <<'ZYRA_PY_EOF'
          # -*- coding: utf-8 -*-
          # ZYRA-FIX v3 - Parche solo-agregar + pruebas completas para superapp.py (registro ZID)
          # Reglas: no crea archivos en el repo, no toca docVencido, no toca la guia/marco del documento.
          # Escribe solo en RUNNER_TEMP. Sale 0 solo si todas las pruebas pasan.
          import io, os, re, sys, json, subprocess

          RUTA = os.path.join(os.getcwd(), 'superapp.py')
          TMP = os.environ.get('RUNNER_TEMP') or os.path.dirname(os.path.abspath(__file__))
          try:
              os.makedirs(TMP, exist_ok=True)
          except Exception:
              pass

          FALLOS = []
          PRUEBAS = []
          EST = {'ok': [], 'ya': [], 'sin_ancla': [], 'opcional_falta': []}


          def leer_archivo(p):
              ultimo = None
              for enc in ('utf-8', 'latin-1'):
                  try:
                      f = io.open(p, 'r', encoding=enc)
                      s = f.read()
                      f.close()
                      return s, enc
                  except UnicodeDecodeError as e:
                      ultimo = e
              raise SystemExit('No se pudo leer superapp.py: ' + str(ultimo))


          def escribir_archivo(p, s, enc):
              f = io.open(p, 'w', encoding=enc, newline='')
              f.write(s)
              f.close()


          # ---------- hooks JS (se insertan justo despues del ancla, en la misma instruccion) ----------
          SNIP_B = ';/*ZYRA-NOMREJ-SET*/try{window.__zyraNombreRechazo = true;}catch(_e){}'
          SNIP_C1 = ';/*ZYRA-BIOREJ-SET*/try{window.__zyraBioRechazada = true;}catch(_e){}'
          SNIP_C2 = ';/*ZYRA-BIOREJ-CLEAR*/try{window.__zyraBioRechazada = false;}catch(_e){}'
          SNIP_D = ';/*ZYRA-BIOOK-SET*/try{window.__zyraBioOk = true;}catch(_e){}'

          # ---------- IIFE v3 completa (bloqueo por nombre, tipo de documento y biometrico) ----------
          JS_V3 = r'''(function(){
            'use strict';
            try{
              if (window.__zyraV3) { return; }
              window.__zyraV3 = true;

              function norm(s){
                try{
                  return String(s || '').normalize('NFD').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').replace(/ +/g, ' ').trim();
                }catch(_e){ return ''; }
              }

              var STOP = { 'DE':1, 'LA':1, 'DEL':1, 'LOS':1, 'LAS':1, 'EL':1, 'Y':1, 'VAN':1 };

              function toks(s){
                var a = norm(s).split(' ');
                var r = [];
                for (var i = 0; i < a.length; i++){
                  var t = a[i];
                  if (t && t.length > 1 && !STOP[t]) { r.push(t); }
                }
                return r;
              }

              function nombreCoincide(reg, doc){
                try{
                  var a = toks(reg);
                  var b = toks(doc);
                  if (!a.length || !b.length) { return false; }
                  var hit = 0;
                  for (var i = 0; i < a.length; i++){
                    for (var j = 0; j < b.length; j++){
                      if (a[i] === b[j] || (a[i].length >= 4 && b[j].indexOf(a[i]) === 0)) { hit++; break; }
                    }
                  }
                  return (hit * 100) >= (60 * a.length);
                }catch(_e){ return false; }
              }

              var FAMS = {
                dui: ['DOCUMENTO UNICO DE IDENTIDAD', 'DOCUMENTO UNICO', 'DUI', 'CARNET DE IDENTIDAD', 'NUMERO DE IDENTIDAD'],
                pasaporte: ['PASAPORTE', 'PASSPORT', 'PASSEPORT', 'PASPORT'],
                licencia: ['LICENCIA DE CONDUCIR', 'LICENCIA PARA CONDUCIR', 'DRIVER LICENSE', 'DRIVERS LICENSE', 'DRIVING LICENCE', 'LICENSE', 'LICENCE', 'LICENCIA'],
                residente: ['RESIDENTE PERMANENTE', 'RESIDENT CARD', 'RESIDENCE CARD', 'TARJETA DE RESIDENTE', 'RESIDENTE']
              };
              var ORDEN = ['dui', 'pasaporte', 'licencia', 'residente'];

              function familiaDeTexto(txt){
                try{
                  var t = ' ' + norm(txt) + ' ';
                  for (var k = 0; k < ORDEN.length; k++){
                    var lista = FAMS[ORDEN[k]];
                    for (var i = 0; i < lista.length; i++){
                      if (t.indexOf(lista[i]) >= 0) { return ORDEN[k]; }
                    }
                  }
                }catch(_e){}
                return '';
              }

              function familiaSeleccionada(){
                try{
                  var sel = document.querySelector('#ps1 select');
                  if (!sel) { return ''; }
                  var op = (sel.options && sel.selectedIndex >= 0) ? sel.options[sel.selectedIndex] : null;
                  var s = norm((op && (op.text || op.label)) || '') + ' ' + norm(sel.value || '');
                  if (/DUI|DOCUMENTO UNICO|IDENTIDAD|CARNET/.test(s)) { return 'dui'; }
                  if (/PASAPORTE|PASSPORT/.test(s)) { return 'pasaporte'; }
                  if (/LICENCIA|LICENCE|LICENSE|DRIVER|CONDUCIR/.test(s)) { return 'licencia'; }
                  if (/RESIDENT|RESIDENCIA|MIGRAC/.test(s)) { return 'residente'; }
                }catch(_e){}
                return '';
              }

              function textoDocumento(){
                var partes = [];
                var cands = ['textoPDF417', 'pdf417Texto', 'ocrTexto', 'textoOCR', 'ocrResult', 'ocrText', 'textoDoc', 'docTexto', 'rawOCR', 'pdf417', 'ocr', 'textoCapturado', 'datosDoc'];
                for (var i = 0; i < cands.length; i++){
                  try{
                    var v = window[cands[i]];
                    if (typeof v === 'string' && v.length > 8) { partes.push(v); }
                    else if (v && typeof v.textContent === 'string' && v.textContent.length > 8) { partes.push(v.textContent); }
                  }catch(_e){}
                }
                try{
                  var zonas = [document.getElementById('ps3'), document.getElementById('ps2')];
                  for (var z = 0; z < zonas.length; z++){
                    var zn = zonas[z];
                    if (!zn) { continue; }
                    var tx = (zn.textContent || zn.innerText || '');
                    if (tx && tx.length > 8) { partes.push(tx); }
                  }
                }catch(_e){}
                return partes.join(' | ');
              }

              function nombreRegistro(){
                var ids = ['nombre', 'nombreRegistro', 'rNombre', 'inpNombre', 'nombreUsuario', 'iNombre', 'txtNombre'];
                for (var i = 0; i < ids.length; i++){
                  try{
                    var el = document.getElementById(ids[i]);
                    if (el && typeof el.value === 'string' && el.value.length >= 4) { return el.value; }
                  }catch(_e){}
                }
                try{
                  var inp = document.querySelector('#ps1 input');
                  if (inp && typeof inp.value === 'string' && inp.value.length >= 4) { return inp.value; }
                }catch(_e){}
                return '';
              }

              function aviso(msg){
                try{
                  var d = document.getElementById('zyraAvisoV3');
                  if (!d){
                    d = document.createElement('div');
                    d.id = 'zyraAvisoV3';
                    (document.body || document.documentElement).appendChild(d);
                  }
                  d.setAttribute('style', 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;max-width:92vw;background:#7a1020;color:#ffffff;padding:12px 16px;border-radius:10px;font:500 14px/1.4 sans-serif;box-shadow:0 6px 20px rgba(0,0,0,0.35);text-align:center;');
                  d.textContent = msg;
                  d.style.display = 'block';
                  if (d.__t) { clearTimeout(d.__t); }
                  d.__t = setTimeout(function(){ try{ d.style.display = 'none'; }catch(_e2){} }, 6000);
                }catch(_e){
                  try{ alert(msg); }catch(_e2){}
                }
              }

              function visible(zona){
                try{
                  var z = document.getElementById(zona);
                  if (!z) { return true; }
                  if (z.hidden === true) { return false; }
                  var est = (z.style && z.style.display) || '';
                  return est !== 'none';
                }catch(_e){ return true; }
              }

              function evaluarDoc(){
                var nomReg = nombreRegistro();
                var nomDoc = textoDocumento();
                if (!nomReg || !nomDoc){
                  return { ok: false, msj: 'No pudimos leer el nombre para verificarlo. Vuelve a capturar el documento con buena luz y sin brillos.' };
                }
                if (!nombreCoincide(nomReg, nomDoc)){
                  return { ok: false, msj: 'El nombre del registro no coincide con el nombre del documento. Usa tu nombre exactamente como aparece en el documento.' };
                }
                var famSel = familiaSeleccionada();
                var famDoc = familiaDeTexto(nomDoc);
                if (famSel && famDoc && famSel !== famDoc){
                  return { ok: false, msj: 'Seleccionaste ' + famSel + ' pero el documento capturado parece ser ' + famDoc + '. Captura el documento correcto.' };
                }
                if (famSel && !famDoc){
                  return { ok: false, msj: 'No pudimos confirmar el tipo de documento capturado. Toma la foto de nuevo con todos los datos visibles.' };
                }
                return { ok: true };
              }

              function imagenDe(zona){
                var z = null;
                try{ z = document.getElementById(zona); }catch(_e){ z = null; }
                if (!z) { return null; }
                var els = [];
                try{ els = z.querySelectorAll('canvas, img, video'); }catch(_e){ els = []; }
                for (var i = 0; i < els.length; i++){
                  var el = els[i];
                  try{
                    var tg = (el.tagName || '').toUpperCase();
                    if (tg === 'CANVAS' && el.width > 20 && el.height > 20) { return el; }
                    if (tg === 'IMG' && el.src && String(el.src).indexOf('data:') === 0 && el.naturalWidth > 20) { return el; }
                    if (tg === 'VIDEO' && el.videoWidth > 20){
                      var c = document.createElement('canvas');
                      c.width = el.videoWidth;
                      c.height = el.videoHeight;
                      c.getContext('2d').drawImage(el, 0, 0, c.width, c.height);
                      return c;
                    }
                  }catch(_e){}
                }
                return null;
              }

              function opcionesDetector(fapi){
                try{
                  if (fapi.nets && fapi.nets.tinyFaceDetector && fapi.nets.tinyFaceDetector.isLoaded){
                    return new fapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 });
                  }
                  if (fapi.nets && fapi.nets.ssdMobilenetv1 && fapi.nets.ssdMobilenetv1.isLoaded){
                    return new fapi.SsdMobilenetv1Options({ minConfidence: 0.4 });
                  }
                }catch(_e){}
                return null;
              }

              function evaluarBio(){
                return new Promise(function(resolve){
                  try{
                    if (window.__zyraBioRechazada === true){
                      resolve({ ok: false, msj: 'La verificacion del rostro fue rechazada. Toma la selfie de nuevo con buena luz, de frente y sin lentes.' });
                      return;
                    }
                    var fapi = window.faceapi || window.faceApi || window.faceAPI;
                    var det = fapi ? opcionesDetector(fapi) : null;
                    var puede = false;
                    try{
                      puede = !!(fapi && det && fapi.nets.faceRecognitionNet && fapi.nets.faceRecognitionNet.isLoaded && (fapi.nets.faceLandmark68Net || fapi.nets.faceLandmark68TinyNet));
                    }catch(_e){ puede = false; }
                    if (puede){
                      var fS = imagenDe('ps4');
                      var fD = imagenDe('ps2') || imagenDe('ps3');
                      if (!fS || !fD){
                        if (window.__zyraBioOk === true) { resolve({ ok: true }); return; }
                        resolve({ ok: false, msj: 'Falta la selfie o la foto del documento. Vuelve a capturarlas.' });
                        return;
                      }
                      Promise.all([
                        fapi.detectSingleFace(fS, det).withFaceLandmarks().withFaceDescriptor(),
                        fapi.detectSingleFace(fD, det).withFaceLandmarks().withFaceDescriptor()
                      ]).then(function(rs){
                        try{
                          var a = rs && rs[0];
                          var b = rs && rs[1];
                          if (!a || !b || !a.descriptor || !b.descriptor){
                            if (window.__zyraBioOk === true) { resolve({ ok: true }); return; }
                            resolve({ ok: false, msj: 'No detectamos bien el rostro. Toma la selfie de nuevo con buena luz y sin lentes.' });
                            return;
                          }
                          var dist = fapi.euclideanDistance(a.descriptor, b.descriptor);
                          if (dist <= 0.60) { resolve({ ok: true }); }
                          else { resolve({ ok: false, msj: 'Tu selfie no coincide con el rostro del documento. Intenta de nuevo con buena luz.' }); }
                        }catch(_e){
                          resolve({ ok: false, msj: 'No pudimos comparar los rostros. Intenta de nuevo.' });
                        }
                      }).catch(function(){
                        if (window.__zyraBioOk === true) { resolve({ ok: true }); return; }
                        resolve({ ok: false, msj: 'No pudimos comparar los rostros. Toma la selfie de nuevo.' });
                      });
                      return;
                    }
                    if (window.__zyraBioOk === true) { resolve({ ok: true }); return; }
                    resolve({ ok: false, msj: 'No pudimos verificar tu rostro en este momento. Espera unos segundos, toma la selfie de nuevo e intenta otra vez.' });
                  }catch(_e){
                    resolve({ ok: false, msj: 'No pudimos verificar tu rostro. Intenta de nuevo.' });
                  }
                });
              }

              document.addEventListener('click', function(ev){
                try{
                  var btn = (ev.target && ev.target.closest) ? ev.target.closest('#bIr4') : null;
                  if (!btn) { return; }
                  if (!visible('ps3')) { return; }
                  if (btn.__zyraV3Pass4) { btn.__zyraV3Pass4 = false; return; }
                  var res = evaluarDoc();
                  if (res && res.ok){
                    btn.__zyraV3Pass4 = true;
                    ev.preventDefault();
                    ev.stopPropagation();
                    setTimeout(function(){ try{ btn.click(); }catch(_e){} }, 0);
                  } else {
                    ev.preventDefault();
                    ev.stopPropagation();
                    aviso((res && res.msj) || 'Datos del documento no verificados.');
                  }
                }catch(_e){}
              }, true);

              document.addEventListener('click', function(ev){
                try{
                  var btn = (ev.target && ev.target.closest) ? ev.target.closest('#bIr5') : null;
                  if (!btn) { return; }
                  if (!visible('ps4')) { return; }
                  if (btn.__zyraV3Pass5) { btn.__zyraV3Pass5 = false; return; }
                  ev.preventDefault();
                  ev.stopPropagation();
                  var p = null;
                  try{ p = evaluarBio(); }catch(_e){ p = null; }
                  Promise.resolve(p).then(function(res){
                    if (res && res.ok){
                      btn.__zyraV3Pass5 = true;
                      setTimeout(function(){ try{ btn.click(); }catch(_e){} }, 0);
                    } else {
                      aviso((res && res.msj) || 'Verificacion del rostro no aprobada. Intenta de nuevo.');
                    }
                  }).catch(function(){
                    aviso('No pudimos verificar tu rostro. Intenta de nuevo.');
                  });
                }catch(_e){}
              }, true);

              try{
                var _toData = HTMLCanvasElement.prototype.toDataURL;
                HTMLCanvasElement.prototype.toDataURL = function(){
                  try{
                    if (this.width > 1280 || this.height > 1280){
                      var esc = Math.min(1280 / this.width, 1280 / this.height);
                      var c = document.createElement('canvas');
                      c.width = Math.round(this.width * esc);
                      c.height = Math.round(this.height * esc);
                      c.getContext('2d').drawImage(this, 0, 0, c.width, c.height);
                      return _toData.apply(c, arguments);
                    }
                  }catch(_e){}
                  return _toData.apply(this, arguments);
                };
              }catch(_e){}

              try{
                if (!window.__zyraFetchV3){
                  window.__zyraFetchV3 = true;
                  var _fetch = window.fetch;
                  if (typeof _fetch === 'function'){
                    window.fetch = function(){
                      var args = arguments;
                      return _fetch.apply(this, args).then(function(r){
                        try{
                          if (r && r.status >= 400){
                            aviso('El servidor respondio con error ' + r.status + '. Revisa tu conexion e intenta de nuevo en unos segundos.');
                          }
                        }catch(_e){}
                        return r;
                      }).catch(function(e){
                        aviso('No pudimos conectar con el servidor. Revisa tu internet e intenta de nuevo.');
                        throw e;
                      });
                    };
                  }
                }
              }catch(_e){}

              window.__zyraNombreCoincide = nombreCoincide;
              window.__zyraFamiliaDeTexto = familiaDeTexto;
              window.__zyraEvaluarDoc = evaluarDoc;
              window.__zyraEvaluarBio = evaluarBio;
              window.__zyraAvisoV3 = aviso;
            }catch(_eGlobal){}
          })();'''

          IIFE_BLOQUE = ('\n<script>\n'
                         '/* ZYRA-REG-HARDENING v3 (ini): bloqueo por nombre, tipo de documento y biometrico fail-closed - no modifica la guia ni el marco del documento */\n'
                         + JS_V3 +
                         '\n/* ZYRA-REG-HARDENING v3 (fin) */\n</script>')

          CSS_COMPACTO = '''
          /* ZYRA-CAP-COMPACT v2 (ini): pantalla de captura mas compacta y profesional - NO modifica la guia ni el marco del documento */
          #ps2, #ps3 { max-width: 520px !important; margin-left: auto !important; margin-right: auto !important; }
          #ps2 video, #ps3 video, #ps2 canvas, #ps3 canvas { max-width: min(440px, 92vw) !important; max-height: 58vh !important; }
          #ps2 img, #ps3 img { max-width: min(440px, 92vw) !important; max-height: 42vh !important; }
          #ps2 h1, #ps2 h2, #ps2 h3, #ps3 h1, #ps3 h2, #ps3 h3 { font-size: 1.05rem !important; }
          #ps2 button, #ps3 button { padding: 8px 14px !important; font-size: 0.95rem !important; }
          /* ZYRA-CAP-COMPACT v2 (fin) */
          '''

          WARMUP = '''
          # ZYRA-WARMUP v1 (ini): precarga de modelos ONNX al arranque para evitar error 502 en el primer uso
          def _zyra_warmup_modelos():
              try:
                  for _n in ('cargar_modelos', 'load_models', 'precargar_modelos', 'init_models', '_cargar_modelos', '_load_models'):
                      try:
                          _f = globals().get(_n)
                          if callable(_f):
                              _f()
                      except Exception:
                          pass
                  try:
                      import cv2
                      for _k in list(globals().keys()):
                          try:
                              _ku = _k.upper()
                              if ('YUNET' in _ku or 'SFACE' in _ku) and isinstance(globals().get(_k), str) and os.path.exists(globals().get(_k)):
                                  if 'YUNET' in _ku:
                                      cv2.FaceDetectorYN.create(globals().get(_k), '', (320, 320))
                                  else:
                                      cv2.FaceRecognizerSF.create(globals().get(_k), '')
                          except Exception:
                              pass
                  except Exception:
                      pass
              except Exception:
                  pass

          try:
              import threading as _zyra_threading
              _zyra_hilo = _zyra_threading.Thread(target=_zyra_warmup_modelos, daemon=True)
              _zyra_hilo.start()
          except Exception:
              pass
          # ZYRA-WARMUP v1 (fin)'''

          # ---------- prueba JS en sandbox (node): casos reales del usuario ----------
          JS_TEST = r'''
          var fallos = [];
          function chk(n, c){ if (c) { console.log('OK   ' + n); } else { fallos.push(n); console.log('FALLO ' + n); } }

          function El(tag){
            this.tagName = String(tag).toUpperCase();
            this.style = {};
            this.children = [];
            this.innerText = '';
            this.textContent = '';
            this.value = '';
            this.id = '';
            this.hidden = false;
            this.width = 0;
            this.height = 0;
          }
          El.prototype.setAttribute = function(k, v){ this.style['__' + k] = v; };
          El.prototype.appendChild = function(c){ this.children.push(c); return c; };
          El.prototype.getContext = function(){ return { drawImage: function(){} }; };
          El.prototype.querySelectorAll = function(){ return []; };
          El.prototype.closest = function(sel){
            var id = sel.charAt(0) === '#' ? sel.slice(1) : sel;
            var cur = this;
            while (cur){
              if (cur.id === id) { return cur; }
              cur = cur.__padre || null;
            }
            return null;
          };

          var D = {
            __ids: {},
            __sel: {},
            __manejadores: {},
            body: new El('body'),
            getElementById: function(id){
              if (this.__ids[id]) { return this.__ids[id]; }
              var hallado = null;
              function buscar(n){
                if (!n || hallado) { return; }
                if (n.id === id) { hallado = n; return; }
                var cs = n.children || [];
                for (var i = 0; i < cs.length; i++) { buscar(cs[i]); }
              }
              buscar(this.body);
              return hallado;
            },
            querySelector: function(sel){ return this.__sel[sel] || null; },
            querySelectorAll: function(){ return []; },
            createElement: function(tag){ return new El(tag); },
            addEventListener: function(t, fn){
              if (!this.__manejadores[t]) { this.__manejadores[t] = []; }
              this.__manejadores[t].push(fn);
            }
          };

          var W = {};
          function CanvasFalso(){}
          CanvasFalso.prototype.toDataURL = function(){ return 'data:image/png;base64,QVNS'; };

          var IIFE = __IIFE__;
          new Function('window', 'document', 'HTMLCanvasElement', IIFE)(W, D, CanvasFalso);

          chk('IIFE v3 instalada', W.__zyraV3 === true);
          chk('expone __zyraNombreCoincide', typeof W.__zyraNombreCoincide === 'function');
          chk('expone __zyraFamiliaDeTexto', typeof W.__zyraFamiliaDeTexto === 'function');
          chk('expone __zyraEvaluarDoc', typeof W.__zyraEvaluarDoc === 'function');
          chk('expone __zyraEvaluarBio', typeof W.__zyraEvaluarBio === 'function');

          chk('CASO REAL: "Jose pacheco" vs "SALINAS PADILLA" NO coincide', W.__zyraNombreCoincide('Jose pacheco', 'SALINAS PADILLA') === false);
          chk('"JOSE SALINAS" vs "SALINAS PADILLA JOSE" coincide', W.__zyraNombreCoincide('JOSE SALINAS', 'SALINAS PADILLA JOSE') === true);
          chk('acentos ignorados: "jose maria" vs "JOSE MARIA SALINAS"', W.__zyraNombreCoincide('jose maria', 'JOSE MARIA SALINAS') === true);
          chk('texto licencia California detecta familia licencia', W.__zyraFamiliaDeTexto('CALIFORNIA DRIVER LICENSE DL 12345678') === 'licencia');
          chk('texto DUI El Salvador detecta familia dui', W.__zyraFamiliaDeTexto('EL SALVADOR DOCUMENTO UNICO DE IDENTIDAD DUI 01234567-8') === 'dui');

          var bIr4 = new El('button');
          bIr4.id = 'bIr4';
          var ps1 = new El('div'); ps1.id = 'ps1';
          var ps2 = new El('div'); ps2.id = 'ps2';
          var ps3 = new El('div'); ps3.id = 'ps3';
          var ps4 = new El('div'); ps4.id = 'ps4';
          var inpNombre = new El('input'); inpNombre.id = 'nombre';
          D.__ids = { ps1: ps1, ps2: ps2, ps3: ps3, ps4: ps4, nombre: inpNombre, bIr4: bIr4 };
          var selFalso = { selectedIndex: 0, options: [{ text: 'DUI El Salvador' }], value: 'dui' };
          D.__sel['#ps1 select'] = selFalso;

          function evClick(el){
            var ev = { target: el, preventDefault: function(){ this.pd = true; }, stopPropagation: function(){ this.sp = true; } };
            var ls = D.__manejadores['click'] || [];
            for (var i = 0; i < ls.length; i++) { ls[i](ev); }
            return ev;
          }

          inpNombre.value = 'Jose pacheco';
          ps3.textContent = 'SALINAS PADILLA CALIFORNIA DRIVER LICENSE DL 12345678';
          var evA = evClick(bIr4);
          chk('gate bIr4 bloquea nombre y tipo incorrectos (caso Jose pacheco)', evA.pd === true && evA.sp === true);
