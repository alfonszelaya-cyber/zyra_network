name: "AXIS DIAG: axis_link + axis_link_ext + server.py (solo lectura)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Dump: axis_link.py + axis_link_ext.py + server.py (1559 lineas)"
        run: |
          python3 - <<'DUMPEOF'
          from pathlib import Path

          FILES = [
              "apps/axis/services/axis_link.py",
              "apps/axis/services/axis_link_ext.py",
              "apps/axis/server.py",
          ]
          for f in FILES:
              p = Path(f)
              print("")
              if not p.exists():
                  print("NO EXISTE:", f)
                  continue
              t = p.read_text(
                  encoding="utf-8", errors="ignore")
              lines = t.splitlines()
              print("=" * 20 + " " + f
                    + " (" + str(len(lines))
                    + " lineas) " + "=" * 20)
              for i, l in enumerate(lines, 1):
                  print(f"{i:4d}| {l}")
          DUMPEOF
