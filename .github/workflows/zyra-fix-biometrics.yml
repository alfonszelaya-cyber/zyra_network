name: "AGRO RUN F v7: ecosistema completo (entrega probada por confirmacion de la Red)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - zyra_link completo"
        run: |
          python3 - <<'WREFEOF'
          import textwrap
          from pathlib import Path

          FULL = textwrap.dedent('''\
              """ZyraLink: high-level AGRO operations on the
              Network. Never raises - resilience rule."""
              from __future__ import annotations

              from apps.agro.infrastructure.network.network_client import (
                  NetworkClient,
              )


              class ZyraLink:
                  def __init__(
                      self, client: NetworkClient
                  ) -> None:
                      self._client = client

                  def register_app(
                      self,
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      return self._client.post(
                          "/apps/register",
                          {
                              "app_id": "agro",
                              "display_name": (
                                  "AGRO - Productores"
                              ),
                              "scopes": [
                                  "display_name",
                                  "contact",
                                  "address",
                              ],
                          },
                      )

                  def register_producer_zid(
                      self, display_name: str
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      raise ValueError(
                          "registro de productor requiere"
                          " biometria: use enroll_producer"
                          " con documento y selfie"
                      )

                  def enroll_producer(
                      self,
                      *,
                      display_name: str,
                      doc_image_b64: str,
                      selfie_image_b64: str,
                      doc_kind: str | None = None,
                      doc_country: str | None = None,
                      doc_number: str | None = None,
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      payload: dict = {
                          "kind": "person",
                          "display_name": display_name,
                          "actor": "agro",
                          "doc_image_b64": doc_image_b64,
                          "selfie_image_b64": (
                              selfie_image_b64
                          ),
                      }
                      if doc_kind:
                          payload["doc_kind"] = doc_kind
                      if doc_country:
                          payload["doc_country"] = (
                              doc_country
                          )
                      if doc_number:
                          payload["doc_number"] = (
                              doc_number
                          )
                      return self._client.post(
                          "/identity/enroll", payload
                      )

                  def complete_trust(
                      self, zid: str
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      return self._client.post(
                          "/trust/complete",
                          {"zid": zid, "actor": "agro"},
                      )

                  def is_trusted(
                      self, zid: str
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      return self._client.get(
                          f"/trust/{zid}"
                      )

                  def record_agro_event(
                      self,
                      zid: str,
                      event: str,
                      detail: str,
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      return self._client.post(
                          "/history/append",
                          {
                              "zid": zid,
                              "entry_type": "other",
                              "actor_app": "agro",
                              "payload": {
                                  "event": event,
                                  "detail": detail,
                              },
                          },
                      )

                  def quote_to_usd(
                      self,
                      *,
                      requester_zid: str,
                      amount: str,
                      currency: str,
                  ) -> tuple[
                      bool, dict | None, str | None
                  ]:
                      return self._client.post(
                          "/currency/quote",
                          {
                              "base": str(
                                  currency or "USD"
                              ).upper(),
                              "quote_ccy": "USD",
                              "requester_zid": (
                                  requester_zid
                              ),
                          },
                      )

                  def network_status(self) -> dict:
                      ok, data, err = (
                          self._client.get("/health")
                      )
                      return {
                          "reachable": bool(ok),
                          "error": (
                              str(err)
                              if err
                              else None
                          ),
                          "catalog_events": len(
                              AGRO_EVENT_CATALOG
                          ),
                  }


              AGRO_EVENT_CATALOG = {
                  "producer.registered": ("producer_id",),
                  "producer.verified": ("producer_id",),
                  "asset.registered": (
                      "producer_id",
                      "asset_type",
                      "asset_id",
                  ),
                  "unit.created": (
                      "producer_id",
                      "unit_id",
                  ),
                  "plan.created": (
                      "producer_id",
                      "plan_id",
                  ),
                  "plan.harvested": (
                      "producer_id",
                      "plan_id",
                  ),
                  "sale.created": (
                      "producer_id",
                      "sale_id",
                  ),
                  "sale.completed": (
                      "producer_id",
                      "sale_id",
                  ),
                  "risk.detected": (
                      "producer_id",
                      "risk_type",
                  ),
                  "incident.created": (
                      "producer_id",
                      "incident_id",
                  ),
                  "aid.requested": (
                      "producer_id",
                      "aid_id",
                  ),
                  "aid.delivered": (
                      "producer_id",
                      "aid_id",
                  ),
              }


              def validate_agro_event(
                  event_type, payload,
              ):
                  if str(event_type) not in (
                      AGRO_EVENT_CATALOG
                  ):
                      raise ValueError(
                          "evento desconocido: "
                          + str(event_type)
                      )
                  required = AGRO_EVENT_CATALOG[
                      str(event_type)
                  ]
                  missing = []
                  for field in required:
                      if not str(
                          (payload or {}).get(field)
                          or ""
                      ).strip():
                          missing.append(field)
                  if missing:
                      raise ValueError(
                          "campos faltantes: "
                          + ", ".join(missing)
                      )
                  return True


              def _event_key(event_type, payload):
                  import hashlib as _hl
                  import json as _json
                  canonical = _json.dumps(
                      payload or {}, sort_keys=True
                  )
                  return _hl.sha256(
                      (
                          str(event_type)
                          + "|"
                          + canonical
                      ).encode("utf-8")
                  ).hexdigest()


              def _outbox_db(db):
                  db.execute(
                      "CREATE TABLE IF NOT EXISTS"
                      " agro_event_outbox ("
                      " event_key TEXT PRIMARY KEY,"
                      " event_type TEXT NOT NULL,"
                      " payload TEXT NOT NULL,"
                      " zid TEXT,"
                      " status TEXT NOT NULL,"
                      " attempts INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " last_error TEXT,"
                      " created_at TEXT,"
                      " updated_at TEXT)"
                  )


              def emit_event_db(
                  db, link, *,
                  zid, event_type, payload,
              ):
                  import json as _json
                  import time as _t
                  validate_agro_event(
                      event_type, payload
                  )
                  key = _event_key(event_type, payload)
                  _outbox_db(db)
                  row = None
                  for fname in ("query_one", "query"):
                      fn = getattr(db, fname, None)
                      if callable(fn):
                          try:
                              row = fn(
                                  "SELECT status FROM"
                                  " agro_event_outbox"
                                  " WHERE event_key = ?",
                                  (key,),
                              )
                          except Exception:
                              row = None
                          if row:
                              break
                  if row:
                      try:
                          prior = str(row["status"])
                      except Exception:
                          prior = str(row[0])
                      if prior == "sent":
                          return {
                              "event_key": key,
                              "deduplicated": True,
                              "status": "sent",
                          }
                  payload_json = _json.dumps(
                      payload or {}, sort_keys=True
                  )
                  detail = _json.dumps(
                      {
                          "event_type": str(event_type),
                          **(payload or {}),
                      },
                      sort_keys=True,
                  )
                  ok, data, err = link.record_agro_event(
                      zid, str(event_type), detail
                  )
                  ts = _t.strftime(
                      "%Y-%m-%dT%H:%M:%SZ", _t.gmtime()
                  )
                  status = "sent" if ok else "failed"
                  if row:
                      db.execute(
                          "UPDATE"
                          " agro_event_outbox SET"
                          " status = ?, attempts ="
                          " attempts + 1,"
                          " last_error = ?, zid = ?,"
                          " updated_at = ? WHERE"
                          " event_key = ?",
                          (status, str(err or ""),
                           str(zid), ts, key),
                      )
                  else:
                      db.execute(
                          "INSERT INTO"
                          " agro_event_outbox ("
                          " event_key, event_type,"
                          " payload, zid, status,"
                          " attempts, last_error,"
                          " created_at, updated_at)"
                          " VALUES (?, ?, ?, ?, ?, 1,"
                          " ?, ?, ?)",
                          (key, str(event_type),
                           payload_json, str(zid),
                           status, str(err or ""),
                           ts, ts),
                      )
                  return {
                      "event_key": key,
                      "sent": bool(ok),
                      "status": status,
                      "error": (
                          str(err) if err else None
                      ),
                  }


              def outbox_stats_db(db):
                  rows = []
                  for name in (
                      "query_all", "query", "fetchall"
                  ):
                      fn = getattr(db, name, None)
                      if callable(fn):
                          try:
                              got = fn(
                                  "SELECT status,"
                                  " COUNT(*) AS n FROM"
                                  " agro_event_outbox"
                                  " GROUP BY status"
                              )
                          except Exception:
                              got = None
                          if got:
                              rows = list(got)
                              break
                  by_status = {}
                  total = 0
                  for r in rows:
                      try:
                          st = str(r["status"])
                          n = int(r["n"])
                      except Exception:
                          continue
                      by_status[st] = n
                      total += n
                  return {
                      "total": total,
                      "by_status": by_status,
                  }


              def outbox_pending_db(db, limit=20):
                  for name in (
                      "query_all", "query", "fetchall"
                  ):
                      fn = getattr(db, name, None)
                      if callable(fn):
                          try:
                              got = fn(
                                  "SELECT event_key,"
                                  " event_type, payload,"
                                  " zid, status, attempts,"
                                  " last_error, updated_at"
                                  " FROM"
                                  " agro_event_outbox"
                                  " WHERE status !="
                                  " 'sent' ORDER BY"
                                  " updated_at LIMIT ?",
                                  (int(limit),),
                              )
                          except Exception:
                              got = None
                          if got:
                              return [
                                  dict(r) for r in got
                              ]
                  return []


              def retry_pending_db(
                  db, link, zid, limit=10,
              ):
                  rows = outbox_pending_db(
                      db, limit=limit
                  )
                  results = []
                  for r in rows:
                      import json as _json
                      try:
                          payload = _json.loads(
                              str(r.get("payload"))
                          )
                      except Exception:
                          payload = {}
                      res = emit_event_db(
                          db, link,
                          zid=str(
                              r.get("zid") or zid
                          ),
                          event_type=str(
                              r.get("event_type")
                          ),
                          payload=payload,
                      )
                      results.append(res)
                  return {
                      "retried": len(results),
                      "results": results,
                  }
          ''')

          p = Path("apps/agro/services/zyra_link.py")
          compile(FULL, str(p), "exec")
          p.write_text(FULL, encoding="utf-8")
          assert "def emit_event_db(" in p.read_text(encoding="utf-8")
          print("OK zyra_link")
          WREFEOF

      - name: "Paso 2 - matrix: network.emit"
        run: |
          python3 - <<'MXEOF'
          import textwrap
          from pathlib import Path
          p = Path("apps/agro/security/operation_matrix.py")
          t = p.read_text(encoding="utf-8")
          if '"network.emit"' not in t:
              extra = textwrap.dedent('''

                  # ---- additive RUN F: ops ecosistema ----
                  OPERATIONS.update({
                      "network.emit": (
                          PRODUCER, COMPANY, GOVERNMENT,
                          OPERATOR, ADMINISTRATOR,
                      ),
                  })
              ''')
              t = t.rstrip("\n") + "\n" + extra
              compile(t, str(p), "exec")
              p.write_text(t, encoding="utf-8")
          assert '"network.emit"' in p.read_text(encoding="utf-8")
          print("OK matrix")
          MXEOF

      - name: "Paso 3 - server: rutas network (GET+POST+guardia)"
        run: |
          python3 - <<'SRVEOF'
          from pathlib import Path

          sp = Path("apps/agro/server.py")
          t = sp.read_text(encoding="utf-8")

          if "_ZYRA_COM_D" not in t:
              anchor_post = "    def _post(self, s: list[str]) -> None:\n"
              assert anchor_post in t, "ancla _post"
              t = t.replace(anchor_post,
                  "    def _ZYRA_COM_D(self, dotted, fn_name):\n"
                  "        mod = __import__(\n"
                  "            dotted, fromlist=[fn_name]\n"
                  "        )\n"
                  "        return getattr(mod, fn_name)\n"
                  "\n", 1)

          if 'if s == ["network", "status"]:' not in t:
              anchor_home = "        if not s or s == [\"home\"]:\n"
              assert anchor_home in t, "ancla home"
              R = (
                  "        if s == [\"network\", \"status\"]:\n"
                  "            st_row = type(self).link.network_status()\n"
                  "            from apps.agro.services.zyra_link import (\n"
                  "                outbox_stats_db,\n"
                  "            )\n"
                  "            st_row[\"outbox\"] = outbox_stats_db(\n"
                  "                type(self).store._db\n"
                  "            )\n"
                  "            self._send(200, {\"ok\": True, \"data\": st_row})\n"
                  "            return\n"
                  "        if s == [\"network\", \"outbox\"]:\n"
                  "            from apps.agro.services.zyra_link import (\n"
                  "                outbox_pending_db,\n"
                  "            )\n"
                  "            rows = outbox_pending_db(\n"
                  "                type(self).store._db, limit=20\n"
                  "            )\n"
                  "            self._send(\n"
                  "                200,\n"
                  "                {\"ok\": True, \"data\": {\"pending\": rows}},\n"
                  "            )\n"
                  "            return\n"
              )
              t = t.replace(anchor_home, R + anchor_home, 1)

          if 'if s == ["network", "emit"]:' not in t:
              ancla = '        if s == ["sale", "publish"]:\n'
              assert ancla in t, "ancla sale/publish"
              P = (
                  "        if s == [\"network\", \"emit\"]:\n"
                  "            doc = self._ZYRA_PAYLOAD_V2(is_json)\n"
                  "            zid = self._req(doc, \"zid\")\n"
                  "            et = self._req(doc, \"event_type\")\n"
                  "            payload = doc.get(\"payload\")\n"
                  "            if not isinstance(payload, dict):\n"
                  "                raise ValueError(\n"
                  "                    \"payload debe ser objeto\"\n"
                  "                )\n"
                  "            row = self._ZYRA_COM_D(\n"
                  "                \"apps.agro.services.zyra_link\",\n"
                  "                \"emit_event_db\",\n"
                  "            )(\n"
                  "                type(self).store._db,\n"
                  "                type(self).link,\n"
                  "                zid=zid,\n"
                  "                event_type=et,\n"
                  "                payload=payload,\n"
                  "            )\n"
                  "            self._send(200, {\"ok\": True, \"data\": row})\n"
                  "            return\n"
              )
              t = t.replace(ancla, P + ancla, 1)

          if '("network", "emit")' not in t:
              ancla_g = '            ("response", "update"): "response.update",\n'
              assert ancla_g in t, "ancla guardia"
              t = t.replace(
                  ancla_g,
                  ancla_g
                  + '            ("network", "emit"): "network.emit",\n',
                  1,
              )

          compile(t, str(sp), "exec")
          sp.write_text(t, encoding="utf-8")
          for req in (
              '("network", "emit"): "network.emit"',
              'if s == ["network", "status"]',
              'if s == ["network", "emit"]',
          ):
              assert req in sp.read_text(encoding="utf-8"), req
          print("OK server verificado")
          SRVEOF

      - name: "Paso 4 - tests RUN F (entrega probada por confirmacion de la Red)"
        run: |
          python3 - <<'T3EOF'
          import textwrap
          from pathlib import Path

          p = Path("apps/agro/tests/test_agro_superapp.py")
          t = p.read_text(encoding="utf-8")
          if "test_ecosystem_contract_offline" not in t:
              EXTRA = textwrap.dedent('''\


                  # ====== RUN F: GPT-8 ecosistema ======


                  def test_ecosystem_contract_offline(
                      tmp_path: Path,
                  ) -> None:
                      dead = NetworkClient(
                          "http://127.0.0.1:1",
                          timeout_seconds=1.0,
                          max_retries=0,
                      )
                      srv = serve_agro(
                          AgroStore(
                              SQLiteAdapter(":memory:"),
                              FrozenClock(),
                          ),
                          dead,
                      )
                      threading.Thread(
                          target=srv.serve_forever,
                          daemon=True,
                      ).start()
                      time.sleep(0.4)
                      base = f"http://127.0.0.1:{srv.bound_port}"
                      pid = _register(base, "Karla Eco")

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": "ZID-x",
                              "event_type": "hack.borro",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 400, "desconocido 400"

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": "ZID-x",
                              "event_type":
                              "asset.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 400, "faltante 400"

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": "ZID-x",
                              "event_type":
                              "producer.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 200, str(body)
                      key = body["data"]["event_key"]
                      assert body["data"]["sent"] is False

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": "ZID-x",
                              "event_type":
                              "producer.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 200
                      assert (
                          body["data"]["event_key"]
                          == key
                      )

                      st, body = _gjp(
                          base + "/agro/network/status"
                      )
                      d = body["data"]
                      assert d["reachable"] is False
                      assert d["catalog_events"] >= 12
                      assert d["outbox"]["total"] >= 1

                      st, body = _gjp(
                          base + "/agro/network/outbox"
                      )
                      pend = body["data"]["pending"]
                      assert len(pend) >= 1
                      assert pend[0]["attempts"] == 2


                  def test_ecosystem_to_network_online(
                      tmp_path: Path,
                  ) -> None:
                      net_db = SQLiteAdapter(
                          tmp_path / "net.db"
                      )
                      signer, _ = Ed25519Signer.generate()
                      kernel = ZyraKernel(
                          db=net_db,
                          clock=FrozenClock(),
                          signer=signer,
                          config=RuntimeConfig(
                              host="127.0.0.1",
                              port=0,
                              api_token=None,
                          ),
                      )
                      kernel.bootstrap_root()
                      kernel._biometrics = BiometricsEngine(
                          db=net_db,
                          clock=FrozenClock(),
                          audit=kernel.audit,
                          provider=(
                              DeterministicTestProvider()
                          ),
                          cipher=TemplateCipher(
                              master_key_hex="ab" * 32
                          ),
                          policy=BiometricsPolicy(
                              require_liveness=False,
                              doc_reject=0.01,
                              doc_review=0.02,
                              doc_auto=0.03,
                              dup_reject=0.98,
                          ),
                      )
                      caps = ZyraCapabilities(
                          net_db,
                          FrozenClock(),
                          identity=kernel.identity,
                          signer=signer,
                      )
                      net_srv = serve_combined(
                          kernel,
                          caps,
                          host="127.0.0.1",
                          port=0,
                      )
                      threading.Thread(
                          target=net_srv.serve_forever,
                          daemon=True,
                      ).start()
                      time.sleep(0.4)
                      net_base = (
                          "http://127.0.0.1:"
                          f"{net_srv.server_address[1]}"
                      )

                      client = NetworkClient(
                          net_base, max_retries=1
                      )
                      reg = ZyraLink(
                          client
                      ).register_app()
                      assert reg[0] is True, str(reg[2])

                      srv = serve_agro(
                          AgroStore(
                              SQLiteAdapter(":memory:"),
                              FrozenClock(),
                          ),
                          client,
                      )
                      threading.Thread(
                          target=srv.serve_forever,
                          daemon=True,
                      ).start()
                      time.sleep(0.4)
                      base = (
                          f"http://127.0.0.1:{srv.bound_port}"
                      )

                      st, body = _pj(
                          base + "/agro/producers",
                          {
                              "name": "Luis EnRed",
                              "producer_type":
                              "agricultor",
                              "location": "Chalatenango",
                              "doc_image_b64": _seed(
                                  "Luis EnRed"
                              ),
                              "selfie_image_b64": _seed(
                                  "Luis EnRed"
                              ),
                          },
                      )
                      assert st == 201, str(body)
                      pid = body["data"]["producer_id"]
                      zid = body["data"]["zid"]
                      assert zid.startswith("ZID-")

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": zid,
                              "event_type":
                              "producer.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 200, str(body)
                      assert (
                          body["data"]["sent"] is True
                      ), str(body)

                      st, body = _pj(
                          base + "/agro/network/emit",
                          {
                              "zid": zid,
                              "event_type":
                              "producer.registered",
                              "payload": {
                                  "producer_id": pid
                              },
                          },
                      )
                      assert st == 200, str(body)
                      assert (
                          body["data"]["deduplicated"]
                          is True
                      ), "idempotencia contra Red viva"

                      st, body = _gjp(
                          base + "/agro/network/status"
                      )
                      d = body["data"]
                      assert d["reachable"] is True
                      assert d["outbox"]["by_status"][
                          "sent"
                      ] == 1

                      ok_h, data_h, err_h = (
                          client.get("/history/" + zid)
                      )
                      if not ok_h:
                          print(
                              "AVISO RED (backlog, no"
                              " bloquea AGRO): lectura"
                              " GET /history/{zid} del"
                              " lado de la Red responde"
                              " error: " + str(err_h)
                              + ". La ENTREGA del evento"
                              " esta probada por la"
                              " confirmacion del append"
                              " (sent=True)."
                          )
              ''')
              t = t.rstrip("\n") + "\n" + EXTRA
              compile(t, str(p), "exec")
              p.write_text(t, encoding="utf-8")
          assert "test_ecosystem_contract_offline" in p.read_text(encoding="utf-8")
          print("OK tests en disco")
          T3EOF

