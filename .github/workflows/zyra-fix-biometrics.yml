name: ZYRA AXIS Block 7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix fake network (knows the mother too)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/axis/life_history/tests/"
              "test_justice_service.py"
          )
          src = path.read_text(encoding="utf-8")

          old = 'if zid == _CLIENT_ZID:'
          new = (
              'if zid in (\n'
              '                      _CLIENT_ZID,\n'
              '                      "ZID-mother-c",\n'
              '                  ):'
          )
          if new in src:
              print("RESULT: already patched")
          elif old in src:
              fixed = src.replace(old, new, 1)
              path.write_text(
                  fixed, encoding="utf-8"
              )
              print("RESULT: PATCHED OK")
          else:
              raise SystemExit(
                  "anchor not found"
              )

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("SYNTAX OK")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/3 Justice service tests (4 E2E)
        run: python -m apps.axis.life_history.tests.test_justice_service -v

      - name: 2/3 Life History regression (7+5+3+3+3)
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q

      - name: 3/3 Full regression (biometrics 13 + AXIS 7 + TCP 6)
        run: |
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit fix (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/tests/test_justice_service.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "justice: fake network knows the mother ZID too"
            git push
          fi
