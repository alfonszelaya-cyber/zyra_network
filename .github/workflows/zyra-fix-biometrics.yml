        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (GRUPO B v5): integral - 3 motores + wiring + E2E f-string" -m "Everything in one run: cartera (RLock), traduccion, radar + wiring + E2E with f-strings and non-throwing steps. Full diagnostic in logs. Commit only on green."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
