name: "AGRO LIMPIEZA TOTAL: escaneo corregido + borrar todo lo no esencial + GATE"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - escaneo CORREGIDO (imports dinamicos incluidos) + reporte antes de borrar"
        run: |
          python3 - <<'SCANEOF'
          import json
          import re
          from pathlib import Path

          app = Path("apps/agro")
          archivos = {}
          for p in sorted(app.rglob("*.py")):
              if "__pycache__" in p.parts:
                  continue
              archivos[p] = p.read_text(
                  encoding="utf-8", errors="ignore")

          def resolve_abs(mod):
              base = Path(mod.replace(".", "/"))
              for c in (base.with_suffix(".py"),
                        base / "__init__.py"):
                  if c.exists():
                      return c
              return None

          # grafos: imports estaticos + DINAMICOS
          # (cualquier string "apps.agro.x.y" en
          # cualquier archivo se resuelve como
          # import potencial - cubre _ZYRA_FN_V6,
          # _ZYRA_COM_D, helpers de server, etc.)
          deps = {}
          for src, t in archivos.items():
              s = set()
              for m in re.finditer(
                  r'^\s*from\s+((?:\.)+)([\w\.]*)\s+import',
                  t, re.M):
                  ndots = len(m.group(1))
                  d = src.parent
                  for _ in range(ndots - 1):
                      d = d.parent
                  mod = m.group(2)
                  if mod:
                      c = resolve_abs_rel(d, mod) if False else None
                      target = d / mod.replace(".", "/")
                      for c2 in (
                          target.with_suffix(".py"),
                          target / "__init__.py"):
                          if c2.exists():
                              s.add(c2)
                  continue
              for m in re.finditer(
                  r'"(apps\.agro[\w\.]*)"',
                  t):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      s.add(c)
              for m in re.finditer(
                  r'^\s*from\s+(apps\.agro[\w\.]*)\s+import',
                  t, re.M):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      s.add(c)
              for m in re.finditer(
                  r'^\s*import\s+(apps\.agro[\w\.]*)',
                  t, re.M):
                  c = resolve_abs(m.group(1))
                  if c and c != src:
                      s.add(c)
              deps[src] = s

          def resolve_abs_rel(d, mod):
              return None

          # closures desde server.py y desde cada test
          roots = [app / "server.py"]
          roots += [
              p for p in archivos
              if "tests" in p.parts
              and p.name.startswith("test_")
          ]
          keep = set()
          work = list(roots)
          while work:
              f = work.pop(0)
              if f in keep or f not in archivos:
                  continue
              keep.add(f)
              for d in deps.get(f, set()):
                  work.append(d)

          # __init__.py de carpetas con archivos keep
          for p in list(keep):
              d = p.parent
              while d != app.parent:
                  ini = d / "__init__.py"
                  if ini.exists() and ini in archivos:
                      keep.add(ini)
                  if d == app:
                      break
                  d = d.parent

          borrar = [
              p for p in archivos if p not in keep
          ]
          reporte = {
              "total": len(archivos),
              "keep": sorted(
                  str(p.relative_to(app))
                  for p in keep),
              "borrar": sorted(
                  str(p.relative_to(app))
                  for p in borrar),
          }
          Path("limpieza_reporte.json").write_text(
              json.dumps(reporte, indent=1),
              encoding="utf-8")
          print("KEEP:", len(keep))
          print("BORRAR:", len(borrar))
          print("--- KEEP ---")
          for k in reporte["keep"]:
              print("  " + k)
          print("--- BORRAR (primeros 80) ---")
          for k in reporte["borrar"][:80]:
              print("  " + k)
          SCANEOF

      - name: "Paso 2 - BORRAR todo lo no esencial + carpetas vacias resultantes"
        run: |
          python3 - <<'DELEOF'
          import json
          import shutil
          from pathlib import Path

          rep = json.loads(
              Path("limpieza_reporte.json")
              .read_text(encoding="utf-8"))
          app = Path("apps/agro")
          keep = {
              app / k for k in rep["keep"]
          }
          borrar = [
              app / k for k in rep["borrar"]
          ]

          n = 0
          for p in borrar:
              if p.exists():
                  p.unlink()
                  n += 1
          print("archivos .py borrados:", n)

          # carpetas vacias tras el borrado
          carpetas = 0
          for d in sorted(
              app.rglob("*"), reverse=True
          ):
              if not d.is_dir() or "__pycache__" in d.parts:
                  continue
              resto = [
                  x for x in d.iterdir()
                  if x.name != "__pycache__"
              ]
              if not resto:
                  shutil.rmtree(d)
                  carpetas += 1
          for pc in app.rglob("__pycache__"):
              shutil.rmtree(pc, ignore_errors=True)
          print("carpetas vacias eliminadas:", carpetas)

          # verificacion dura
          for k in keep:
              assert k.exists(), "KEEP perdido: " + str(k)
          restantes = len(list(app.rglob("*.py")))
          print("archivos .py restantes en AGRO:",
                restantes)
          DELEOF

      - name: "Paso 3 - server compila e importa (interprete fresco)"
        run: |
          python3 -c "
          import apps.agro.server as s
          assert hasattr(s, 'serve_agro')
          print('OK server importa tras limpieza')
          from apps.agro.services.zyra_link import ZyraLink, emit_event_db
          from apps.agro.security.operation_matrix import OperationMatrix, OPERATIONS
          assert 'network.emit' in OPERATIONS
          from apps.agro.infrastructure.persistence.agro_store import run_agro_migrations
          from apps.agro.constants.business.constants import TEXTOS
          from apps.agro.shared.utils import render_page
          print('OK todos los simbolos consolidados vivos')
          "

      - name: "Paso 4 - GATE: 4 apps completas (la prueba final de que la limpieza no rompio nada)"
        run: |
          python3 -m pytest apps/agro/tests apps/subastas/tests apps/mi_primer_empleo/tests apps/semilla/tests -q --tb=short

      - name: "Paso 5 - inventario final"
        run: |
          python3 -c "
          from pathlib import Path
          app = Path('apps/agro')
          pys = [p for p in app.rglob('*.py') if '__pycache__' not in p.parts]
          con_codigo = [p for p in pys if p.read_text(encoding='utf-8', errors='ignore').strip()]
          print('ARQUITECTURA LIMPIA AGRO:')
          print('  archivos .py totales:', len(pys))
          print('  con codigo:', len(con_codigo))
          print('  vacios (__init__):', len(pys) - len(con_codigo))
          dirs = set(p.parent for p in pys)
          print('  carpetas:', len(dirs))
          "

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO LIMPIEZA TOTAL: solo lo esencial" -m "Escaneo corregido con imports dinamicos (strings apps.agro.* en server). KEEP = server + transitivos + tests + __init__ de sus paquetes. BORRADO: todo .py sin uso, carpetas que quedaron vacias (incluye executive paralela, routers, registry sin uso, configs sin uso, scaffolds). Verificacion: server importa fresco, simbolos consolidados presentes, GATE 4 apps verde. Nada se pierde: git history conserva todo."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
