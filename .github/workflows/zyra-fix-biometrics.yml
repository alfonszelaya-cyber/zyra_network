                          value=value, unit=unit)
                      return self._met.latest(name)
          '''))

          forzar(UCM + "/coordinate_institutions_use_case.py", D(r'''
              from __future__ import annotations

              class CoordinateInstitutionsUseCase:
                  """Propone acuerdo interinstitucional y
                  opcionalmente lo activa."""

                  def __init__(self, coordination):
                      self._coord = coordination

                  def execute(self, *, institutions, subject,
                              activate=False) -> dict:
                      a = self._coord.propose_agreement(
                          institutions=institutions,
                          subject=subject)
                      if activate:
                          a = self._coord.activate(
                              a["agreement_id"])
                      return a
          '''))

          forzar(UCM + "/coordinate_strategy_use_case.py", D(r'''
              from __future__ import annotations

              class CoordinateStrategyUseCase:
                  """Crea objetivo de estrategia y define avance."""

                  def __init__(self, strategy):
                      self._strat = strategy

                  def execute(self, *, title, target_period,
                              progress_pct=0) -> dict:
                      o = self._strat.create_objective(
                          title=title,
                          target_period=target_period)
                      if progress_pct:
                          o = self._strat.update_progress(
                              objective_id=o["objective_id"],
                              progress_pct=progress_pct)
                      return o
          '''))

          forzar(UCM + "/analyze_governance_use_case.py", D(r'''
              from __future__ import annotations

              class AnalyzeGovernanceUseCase:
                  """Ejecuta analitica de gobernanza."""

                  def __init__(self, analytics):
                      self._an = analytics

                  def execute(self, *, period="") -> dict:
                      return self._an.analyze(period=period)
          '''))

          forzar(UCM + "/support_public_decision_use_case.py", D(r'''
              from __future__ import annotations

              class SupportPublicDecisionUseCase:
                  """Soporte de decision: propuesta + analisis +
                  decision entre opciones (nivel 5 Coordinacion)."""

                  def __init__(self, decisions):
                      self._eng = decisions

                  def execute(self, *, title, options,
                              analysis="", chosen=None) -> dict:
                      d = self._eng.propose_decision(
                          title=title, options=options)
                      if analysis:
                          d = self._eng.record_analysis(
                              decision_id=d["decision_id"],
                              analysis=analysis)
                      if chosen:
                          d = self._eng.decide(
                              decision_id=d["decision_id"],
                              chosen=chosen)
                      return d
          '''))

          out("## FIN NG6 meta gobierno")
          exit(0)
