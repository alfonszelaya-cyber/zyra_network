name: ZYRA A4c dump completo del proxy y menus de gobernador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faseA4c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography

      - name: Dump del proxy y menus con rol gobernador
        run: |
          python3 - <<'PYEOF'
          import json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)
          ZID = 'Z-PRUEBA-CI-0001'

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseA4c.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _man

          def pedir(url, headers=None):
              req = urllib.request.Request(url)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=8) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, '', str(e)

          add('# A4c - DUMP DEL PROXY + MENUS DE GOBERNADOR (solo lectura)')
          add('')

          add('## D1. Sistema arriba y puerto del laboratorio')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-a4c', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-a4c', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _c, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          salud = {}
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _c, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          salud = json.loads(cuerpo).get('apps', {})
                      except Exception:
                          salud = {}
                      break
                  time.sleep(1.5)
          puerto = salud.get('/laboratorio', {}).get('port')
          add('- red=%s superapp=%s apps=%d puerto_lab=%s' % (vivo, spv, len(salud), puerto))
          add('')

          menus = []
          if puerto:
              add('## D2. Acceso directo con rol LAB_GOBERNADOR')
              add('')
              INT = 'http://127.0.0.1:%d' % puerto
              hdr = {'x-zyra-zid': ZID, 'x-zyra-roles': 'LAB_GOBERNADOR'}
              st, ct, cuerpo = pedir(INT + '/laboratorio/ui', hdr)
              abierto = (st == 200 and 'text/html' in ct.lower())
              add('- home UI -> %s (%s) %s' % (st, 'HTML' if abierto else ct[:20], 'ABRE' if abierto else ''))
              if abierto:
                  menus = sorted(set(re.findall(r'/laboratorio/ui/([a-z0-9_\-]{2,40})', cuerpo)))
                  add('- menus visibles para gobernador: %d' % len(menus))
                  for m in menus[:30]:
                      add('  - %s' % m)
                      st2, ct2, _b2 = pedir(INT + '/laboratorio/ui/' + m, hdr)
                      add('    panel -> %s (%s)' % (st2, 'HTML' if 'html' in ct2.lower() else ct2[:16]))
              DATA['menus'] = menus
              add('')
          else:
              add('## D2. Sin puerto del laboratorio, no se prueba directo')
              add('')

          add('## D3. superapp.py COMPLETO (parte 1 de 2)')
          add('')
          ls = (ROOT / 'superapp.py').read_text(encoding='utf-8', errors='replace').splitlines()
          add('- total de lineas: %d' % len(ls))
          add('```python')
          for i in range(0, min(240, len(ls))):
              add('%d: %s' % (i + 1, ls[i].rstrip()[:150]))
          add('```')
          add('')

          add('## D4. superapp.py COMPLETO (parte 2 de 2)')
          add('')
          add('```python')
          for i in range(240, len(ls)):
              add('%d: %s' % (i + 1, ls[i].rstrip()[:150]))
          add('```')
          add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          add('## Siguiente: A4d (LA EDICION)')
          add('')
          add('1. Sesion simple en el portal: una vez escribes tu ZID, queda guardado (cookie).')
          add('2. El proxy inyecta x-zyra-zid y x-zyra-roles en cada reenvio a las apps.')
          add('3. Las tarjetas del laboratorio apuntan a sus menus reales.')
          add('Resultado: entras UNA vez y todas las apps te reconocen.')
          add('')

          Path('faseA4c.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('A4c terminada. Menus gobernador:', len(menus))
          PYEOF

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseA4c-zyra
          path: faseA4c.json
          if-no-files-found: ignore
