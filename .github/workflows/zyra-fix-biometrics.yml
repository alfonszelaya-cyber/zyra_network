      - name: "[ESCRITURA] N-11 utcnow en 3 modulos NEXO (nunca se committe en v2 — se rehace)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, re, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          FILES = [
              "apps/nexo/module/modulo_9_meta_gobierno.py",
              "apps/nexo/module/modulo_8_gobierno.py",
              "apps/nexo/module/modulo_001_super_bunker.py",
          ]
          for p_str in FILES:
              p = pathlib.Path(p_str)
              try:
                  src = p.read_text(encoding="utf-8")
                  if "utcnow" not in src:
                      out("- N-11 " + p.name + ": ya limpio")
                      continue
                  orig = src
                  if re.search(r"^from datetime import",
                               src, re.M):
                      def _ext(m):
                          line = m.group(0)
                          if "timezone" in line:
                              return line
                          return (line.rstrip("\n")
                                  + ", timezone\n")
                      new = re.sub(r"^from datetime import"
                                   r"[^\n]*\n", _ext, src,
                                   count=1, flags=re.M)
                      new = new.replace(
                          "datetime.utcnow()",
                          "datetime.now(timezone.utc)")
                  else:
                      new = src.replace(
                          "datetime.utcnow()",
                          "datetime.datetime.now("
                          "timezone.utc)")
                      if "from datetime import timezone" \
                              not in new:
                          new = ("from datetime import"
                                 " timezone\n" + new)
                  try:
                      ast.parse(new)
                  except SyntaxError:
                      out("- N-11 " + p.name
                          + ": sintaxis (revertido)")
                      continue
                  p.write_text(new, encoding="utf-8")
                  try:
                      py_compile.compile(p_str, doraise=True)
                      out("- **N-11 " + p.name + ": OK ("
                          + str(new.count("utcnow"))
                          + " utcnow restantes)**")
                  except Exception:
                      p.write_text(orig, encoding="utf-8")
                      out("- N-11 " + p.name
                          + ": compile (revertido)")
              except Exception:
                  out("- N-11 " + p_str + ": EXCEPCION")
                  out("```\n"
                      + traceback.format_exc().strip()
                      + "\n```")
          exit(0)
          PYEOF

