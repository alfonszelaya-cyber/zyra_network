name: "RED-CONSENT v5: Paso 6 con indentacion medida del ancla (patron probado)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - migraciones v2/v3 (idempotente)"
        run: |
          python3 - <<'MEOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "profile_consents" in t:
              print("SKIP 1 (ya presentes)")
              raise SystemExit(0)
          ANCLA = (
              '            " PRIMARY KEY (zid, field))",\n'
              "        ),\n"
              "    ),\n"
              ")\n"
          )
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla " + str(cnt)
          NUEVO = (
              '            " PRIMARY KEY (zid, field))",\n'
              "        ),\n"
              "    ),\n"
              "    Migration(\n"
              "        2,\n"
              '        "network_profile_consent",\n'
              "        (\n"
              '            "CREATE TABLE IF NOT EXISTS profile_consents ("\n'
              '            " consent_id TEXT PRIMARY KEY, zid TEXT NOT NULL,"\n'
              '            " app_id TEXT NOT NULL, fields TEXT NOT NULL,"\n'
              '            " granted_at REAL NOT NULL, expires_at REAL NOT NULL,"\n'
              '            " face_score REAL, revoked_at REAL)",\n'
              "        ),\n"
              "    ),\n"
              "    Migration(\n"
              "        3,\n"
              '        "network_profile_freeze",\n'
              "        (\n"
              '            "CREATE TABLE IF NOT EXISTS zid_freezes ("\n'
              '            " zid TEXT PRIMARY KEY, frozen_at REAL NOT NULL,"\n'
              '            " reason TEXT, unfreeze_code TEXT)",\n'
              "        ),\n"
              "    ),\n"
              ")\n"
          )
          t = t.replace(ANCLA, NUEVO, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 1: migraciones v2/v3 (AST valido)")
          MEOF

      - name: "Paso 2 - metodos (clase) + FrozenIdentityError (final, idempotente)"
        run: |
          python3 - <<'CEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "def grant_consent(" in t:
              print("SKIP 2 (ya presentes)")
              raise SystemExit(0)
          METODOS = textwrap.indent(textwrap.dedent('''\
              def grant_consent(self, *, zid: str, app_id: str, fields: tuple[str, ...], face_score: float, ttl_hours: float = 24.0) -> dict[str, object]:
                  """AX-CONSENT: el dueno autoriza a una app ver campos especificos por tiempo limitado. Evidencia: puntaje biometrico."""
                  import secrets
                  require_non_empty_str(zid, "zid")
                  require_non_empty_str(app_id, "app_id")
                  if not fields:
                      raise ValueError("fields required")
                  if not (0.0 <= face_score <= 1.0):
                      raise ValueError("face_score invalid")
                  now = self._clock.now()
                  consent_id = "CON-" + secrets.token_hex(6)
                  expires = now + ttl_hours * 3600.0
                  with self._db.transaction() as cursor:
                      cursor.execute("INSERT INTO profile_consents (consent_id, zid, app_id, fields, granted_at, expires_at, face_score) VALUES (?, ?, ?, ?, ?, ?, ?)", (consent_id, zid, app_id, ",".join(fields), now, expires, face_score))
                  self._audit.append(event_type="network.consent.granted", actor=zid, subject=consent_id, payload={"app": app_id, "fields": list(fields)})
                  return {"consent_id": consent_id, "expires_at": expires, "fields": list(fields)}

              def check_consent(self, *, zid: str, app_id: str):
                  """Campos autorizados vigentes; None si no hay o expiro."""
                  now = self._clock.now()
                  rows = self._db.query_all("SELECT fields FROM profile_consents WHERE zid = ? AND app_id = ? AND expires_at > ? AND revoked_at IS NULL", (zid, app_id, now))
                  if not rows:
                      return None
                  campos = set()
                  for r in rows:
                      campos.update(str(r["fields"]).split(","))
                  return tuple(sorted(campos))

              def revoke_consent(self, *, zid: str, consent_id: str) -> None:
                  require_non_empty_str(consent_id, "consent_id")
                  with self._db.transaction() as cursor:
                      cursor.execute("UPDATE profile_consents SET revoked_at = ? WHERE consent_id = ? AND zid = ?", (self._clock.now(), consent_id, zid))
                  self._audit.append(event_type="network.consent.revoked", actor=zid, subject=consent_id, payload={})

              def consents_of(self, *, zid: str) -> tuple[dict[str, object], ...]:
                  """El dueno ve sus permisos: quien, que campos, hasta cuando."""
                  rows = self._db.query_all("SELECT * FROM profile_consents WHERE zid = ? ORDER BY granted_at DESC", (zid,))
                  return tuple({"consent_id": str(r["consent_id"]), "app_id": str(r["app_id"]), "fields": str(r["fields"]).split(","), "expires_at": float(r["expires_at"]), "revoked": r["revoked_at"] is not None} for r in rows)

              def freeze_zid(self, *, zid: str, reason: str = "") -> dict[str, str]:
                  """AX-FREEZE: boton de panico. Congela el ZID: NINGUNA verificacion pasa. Devuelve el codigo de desbloqueo de un solo uso."""
                  import secrets
                  require_non_empty_str(zid, "zid")
                  code = secrets.token_hex(4)
                  with self._db.transaction() as cursor:
                      cursor.execute("INSERT INTO zid_freezes (zid, frozen_at, reason, unfreeze_code) VALUES (?, ?, ?, ?) ON CONFLICT(zid) DO UPDATE SET frozen_at = excluded.frozen_at, reason = excluded.reason, unfreeze_code = excluded.unfreeze_code", (zid, self._clock.now(), reason, code))
                  self._audit.append(event_type="network.identity.frozen", actor=zid, subject=zid, payload={"reason": reason})
                  return {"zid": zid, "unfreeze_code": code}

              def is_frozen(self, *, zid: str) -> bool:
                  row = self._db.query_one("SELECT 1 FROM zid_freezes WHERE zid = ?", (zid,))
                  return row is not None

              def unfreeze_zid(self, *, zid: str, code: str) -> bool:
                  """Descongela SOLO con el codigo entregado al congelar."""
                  require_non_empty_str(code, "code")
                  row = self._db.query_one("SELECT unfreeze_code FROM zid_freezes WHERE zid = ?", (zid,))
                  if row is None:
                      return False
                  if str(row["unfreeze_code"]) != code:
                      return False
                  with self._db.transaction() as cursor:
                      cursor.execute("DELETE FROM zid_freezes WHERE zid = ?", (zid,))
                  self._audit.append(event_type="network.identity.unfrozen", actor=zid, subject=zid, payload={})
                  return True
          ''').rstrip("\n"), "    ")
          CLASE = (
              "\n\nclass FrozenIdentityError(PermissionError):\n"
              '    """AX-FREEZE: el ZID esta congelado por su dueno."""\n'
          )
          t = (t.rstrip("\n") + "\n\n" + METODOS + CLASE)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 2: metodos + FrozenIdentityError (AST valido)")
          CEOF

      - name: "Paso 3 - verificacion dura metodos"
        run: |
          python3 -c "
          from shared_engines.network.portable_profile import (
              ProfileRegistry, FrozenIdentityError, age_of)
          for m in ('grant_consent', 'check_consent', 'revoke_consent',
                    'consents_of', 'freeze_zid', 'is_frozen', 'unfreeze_zid'):
              assert hasattr(ProfileRegistry, m), m
          for m in ('register_app', 'set_field', 'view_for_app',
                    'universal_view', 'verification_verdict'):
              assert hasattr(ProfileRegistry, m), m
          assert issubclass(FrozenIdentityError, PermissionError)
          print('OK 3: consent + freeze en ProfileRegistry; FrozenIdentityError en modulo')
          "

      - name: "Paso 4 - guardias is_frozen por posicion (idempotente)"
        run: |
          python3 - <<'GEOF'
          import ast
          from pathlib import Path
          p = Path("shared_engines/network/portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if t.count("FrozenIdentityError") >= 3:
              print("SKIP 4 (guardias ya presentes)")
              raise SystemExit(0)
          GUARD = [
              "if self.is_frozen(zid=zid):",
              '    raise FrozenIdentityError(',
              '        "ZID congelado por su dueno (AX-FREEZE)")',
          ]

          def insertar(texto, ancla_def, marcador):
              idf = texto.find(ancla_def)
              assert idf >= 0, "def no hallado: " + ancla_def
              im = texto.find(marcador, idf)
              assert im > idf, "marcador no hallado tras def: " + marcador
              ls = texto.rfind("\n", 0, im) + 1
              linea = texto[ls:im]
              ind = linea[:len(linea) - len(linea.lstrip())]
              guard = "".join(ind + gl + "\n" for gl in GUARD)
              return texto[:ls] + guard + texto[ls:]

          t = insertar(t, "def verification_verdict(",
                       "base = self.universal_view(")
          print("OK guardia en verification_verdict")
          t = insertar(t, "def universal_view(",
                       "scopes = self.app_scopes(")
          print("OK guardia en universal_view")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK 4: guardias insertadas (AST valido)")
          GEOF

      - name: "Paso 5 - verificacion dura guardias (conteo: clase + 2 guardias = 3)"
        run: |
          python3 -c "
          src = open('shared_engines/network/portable_profile.py').read()
          n = src.count('FrozenIdentityError')
          assert n >= 3, n
          import shared_engines.network.portable_profile
          print('OK 5: guardias activas (' + str(n) + ' usos), modulo compila')
          "

      - name: "Paso 6 - rutas del dueno (INDENTACION MEDIDA del ancla en GET y POST)"
        run: |
          python3 - <<'RTEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/runtime/capabilities_api.py")
          t = p.read_text(encoding="utf-8")
          if 's == ["consent", "grant"]' in t:
              print("SKIP 6 (rutas ya presentes)")
              raise SystemExit(0)

          # --- GET /consent/list/{zid}: tras la linea caps, con SU indentacion medida ---
          ig = t.find("def _route_get(")
          assert ig >= 0, "no _route_get"
          ic = t.find("caps = type(self).caps", ig)
          assert ic > ig, "no caps en _route_get"
          ic_ls = t.rfind("\n", 0, ic) + 1
          linea_caps = t[ic_ls:ic]
          IND_GET = linea_caps[:len(linea_caps) - len(linea_caps.lstrip())]
          le = t.find("\n", ic) + 1
          GET_CUERPO = textwrap.dedent('''\
              if (
                  len(s) == 3
                  and s[0] == "consent"
                  and s[1] == "list"
              ):
                  reg = caps.profiles
                  self._ok(list(reg.consents_of(zid=s[2])))
                  return
          ''')
          GET_R = textwrap.indent(
              GET_CUERPO.rstrip("\n"), IND_GET) + "\n"
          t = t[:le] + GET_R + t[le:]
          print("OK GET /consent/list/{zid} (indent "
                + str(len(IND_GET)) + " espacios)")

          # --- POST consent/freeze: antes de documents/register, con SU indentacion medida ---
          marker = 'if s == ["documents", "register"]:'
          idx = t.find(marker)
          assert idx >= 0, "no documents/register"
          ls = t.rfind("\n", 0, idx) + 1
          linea = t[ls:idx]
          IND = linea[:len(linea) - len(linea.lstrip())]
          POST_CUERPO = textwrap.dedent('''\
              if s == ["consent", "grant"]:
                  import base64 as _b64c
                  bio = getattr(type(self).kernel, "_biometrics", None)
                  if bio is None:
                      self._error(503, "not_wired", "biometrics not configured")
                      return
                  zid_c = self._req(doc, "zid")
                  selfie_c = _b64c.b64decode(self._req(doc, "selfie_b64"))
                  reporte = bio.verify_face(zid_c, selfie_image=selfie_c, actor=zid_c)
                  match_c = bool(getattr(reporte, "match", False))
                  score_c = float(getattr(reporte, "score", 0.0))
                  if not match_c:
                      self._error(403, "face_rejected", "biometria no coincide: consentimiento denegado")
                      return
                  campos_c = tuple(str(doc.get("fields", "")).split(","))
                  res = caps.profiles.grant_consent(zid=zid_c, app_id=self._req(doc, "app_id"), fields=campos_c, face_score=score_c, ttl_hours=float(doc.get("ttl_hours", 24)))
                  self._send(201, {"ok": True, "data": res})
                  return
              if s == ["consent", "revoke"]:
                  caps.profiles.revoke_consent(zid=self._req(doc, "zid"), consent_id=self._req(doc, "consent_id"))
                  self._send(200, {"ok": True})
                  return
              if s == ["freeze"]:
                  res = caps.profiles.freeze_zid(zid=self._req(doc, "zid"), reason=str(doc.get("reason", "")))
                  self._send(200, {"ok": True, "data": res})
                  return
              if s == ["unfreeze"]:
                  ok_u = caps.profiles.unfreeze_zid(zid=self._req(doc, "zid"), code=self._req(doc, "unfreeze_code"))
                  if not ok_u:
                      self._error(403, "bad_code", "codigo de desbloqueo invalido")
                      return
                  self._send(200, {"ok": True})
                  return
          ''')
          BLOQUE = textwrap.indent(
              POST_CUERPO.rstrip("\n"), IND) + "\n"
          t = t[:ls] + BLOQUE + t[ls:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          tq2 = p.read_text(encoding="utf-8")
          assert 's == ["consent", "grant"]:' in tq2
          assert 's == ["freeze"]:' in tq2
          print("OK 6: rutas consent/freeze (AST valido)")
          RTEOF

      - name: "Paso 7 - tests (idempotente)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          target = Path("shared_engines/network/tests/test_portable_identity.py")
          assert target.exists()
          t = target.read_text(encoding="utf-8")
          if "test_consent_and_freeze_flow" in t:
              print("SKIP 7 (tests ya presentes)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_consent_and_freeze_flow(tmp_path) -> None:
                  """AX-CONSENT/FREEZE: otorgar con biometria -> expiracion -> revocacion; freeze bloquea verdict; unfreeze solo con codigo."""
                  from shared_engines.network.portable_profile import ProfileRegistry, FrozenIdentityError
                  from shared_engines.audit.chain import AuditTrail
                  from shared_engines.events.outbox import Outbox
                  from shared_engines.events.contracts import EventCatalog
                  from shared_engines.storage.database import SQLiteAdapter
                  from shared_engines.common.clocks import SystemClock
                  db = SQLiteAdapter(tmp_path / "cf.db")
                  clock = SystemClock()
                  reg = ProfileRegistry(db, clock, audit=AuditTrail(db, clock), outbox=Outbox(db, clock))
                  zid = "ZID-fraud-test-00000001"
                  reg.set_field(zid=zid, field="display_name", value="Pedro", verified=True)
                  reg.register_app(app_id="banco", display_name="Banco", scopes=("display_name", "national_id"))
                  c = reg.grant_consent(zid=zid, app_id="banco", fields=("display_name", "national_id"), face_score=0.92, ttl_hours=24.0)
                  assert c["consent_id"].startswith("CON-")
                  campos = reg.check_consent(zid=zid, app_id="banco")
                  assert campos is not None and "display_name" in campos
                  db.execute("UPDATE profile_consents SET expires_at = 1")
                  assert reg.check_consent(zid=zid, app_id="banco") is None
                  c2 = reg.grant_consent(zid=zid, app_id="banco", fields=("display_name",), face_score=0.92)
                  reg.revoke_consent(zid=zid, consent_id=c2["consent_id"])
                  assert reg.check_consent(zid=zid, app_id="banco") is None
                  res = reg.freeze_zid(zid=zid, reason="robo de telefono")
                  assert res["unfreeze_code"]
                  congelado = False
                  try:
                      reg.verification_verdict(app_id="banco", zid=zid, face_verdict={"match": True, "score": 0.95}, signer=None, clock=clock)
                  except FrozenIdentityError:
                      congelado = True
                  assert congelado, "freeze no bloqueo"
                  assert reg.is_frozen(zid=zid)
                  assert reg.unfreeze_zid(zid=zid, code="000000") is False
                  assert reg.unfreeze_zid(zid=zid, code=res["unfreeze_code"]) is True
                  assert not reg.is_frozen(zid=zid)
                  lista = reg.consents_of(zid=zid)
                  assert len(lista) >= 2
                  print("OK AX-CONSENT/FREEZE: otorgar, expirar, revocar, congelar, desbloquear con codigo, historial visible")
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          target.write_text(t, encoding="utf-8")
          final = target.read_text(encoding="utf-8")
          assert "test_consent_and_freeze_flow" in final
          print("OK 7: test consent/freeze (AST valido)")
          TSEOF

      - name: "Paso 8 - GATE Red"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -10

      - name: "Paso 9 - GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso 10 - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-CONSENT v5"
            echo '```'
            python3 -m pytest shared_engines/network/tests -vv --tb=long 2>&1 | tail -70 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-CONSENT+FREEZE: consentimientos con biometria + boton de panico de ZID (tokens/codigos)" -m "Control del dueno de datos (tokens/codigos): grant_consent (autoriza campos con puntaje biometrico como evidencia, TTL), check_consent (vigentes), revoke_consent (al instante), consents_of (el dueno ve quien/que/hasta cuando). FREEZE: freeze_zid congela el ZID (NINGUNA verificacion pasa - como bloquear la tarjeta del banco) y devuelve codigo de desbloqueo de un solo uso; unfreeze_zid solo con ese codigo; is_frozen. Guardias FrozenIdentityError en verification_verdict y universal_view (posicion medida tras cada def). Fixes: (1) v2 - migraciones de un statement con coma final; metodos antes de la clase de excepcion, (2) v4 - conteo de guardias 3 (clase+2), (3) v5 - rutas con INDENTACION MEDIDA del ancla en GET y POST (v4 usaba dedent que perdia la indentacion -> unexpected indent). Rutas: POST /consent/grant (exige biometria fresca), /consent/revoke, /freeze, /unfreeze, GET /consent/list/{zid}. Anti-fraude: robo de telefono no basta, consentimiento expira, panico instantaneo."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
