          class CasoPublicarIndicador:
              def __init__(self, repo_red, repo_proyectos, repo_historial, outbox, cliente_zyra, auditoria):
                  self._red = repo_red
                  self._proyectos = repo_proyectos
                  self._historial = repo_historial
                  self._outbox = outbox
                  self._cliente = cliente_zyra
                  self._auditoria = auditoria

              def ejecutar(self, identidad, tipo: str, valor: int = None) -> dict:
                  if valor is None:
                      valor = self._valor_real(tipo)
                  indicador = IndicadorNacional(
                      id=nuevo_id("ind"), nombre="LABORATORIO/" + tipo,
                      tipo=tipo, valor=int(valor), origen="laboratorio",
                  )
                  self._red.agregar_indicador(indicador)
                  self._outbox.encolar(
                      "laboratorio.indicador.publicado",
                      DESTINO_INDICADOR,
                      {
                          "nombre": indicador.nombre,
                          "valor": indicador.valor,
                          "origen": indicador.origen,
                      },
                  )
                  self._outbox.procesar(self._cliente.entregar)
                  estadisticas = self._outbox.estadisticas()
                  if estadisticas.get("pendiente", 0) > 0:
                      indicador.estado = "pendiente"
                  elif estadisticas.get("error", 0) > 0:
                      indicador.estado = "error"
                  else:
                      indicador.estado = "enviado"
                      indicador.marcar_enviado()
                  self._red.actualizar_indicador(indicador)
                  self._historial.agregar(EntradaHistorial(
                      id=nuevo_id("his"), proyecto_id=None,
                      autor_zid=identidad.zid, accion="indicador.publicado",
                      detalle={"tipo": tipo, "valor": indicador.valor,
                               "estado": indicador.estado},
                  ))
                  self._auditoria.registrar(
                      identidad, "indicador.publicar", str(indicador.id), "exito",
                      {"tipo": tipo, "valor": indicador.valor, "estado": indicador.estado},
                  )
                  return {
                      "indicador": self._a_dict(indicador),
                      "estado_envio": indicador.estado,
                      "outbox": estadisticas,
                  }

              def _valor_real(self, tipo: str) -> int:
                  """Cuenta el valor real del indicador en la base de datos."""
                  conexion = None
                  repos_map = {
                      "proyectos": ("repo_proyectos", "contar"),
                      "escenas": ("repo_escenas", None),
                      "evaluaciones": ("repo_evaluaciones", None),
                  }
                  if tipo == "proyectos":
                      return self._proyectos.contar_zid("")
                  raise ValueError("Para " + tipo + " provide un valor explicito.")

              @staticmethod
              def _a_dict(indicador) -> dict:
                  return {
                      "id": str(indicador.id),
