name: "ZYRA VIVA-1 v2: bus + FX env-gated"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Wiring v2 (4 parches)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF'
          import ast, pathlib, py_compile, re, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def fix(nombre, fn):
              try:
                  out("- **" + nombre + ": " + fn() + "**")
              except Exception:
                  out("- **" + nombre + ": ERROR (no bloquea)**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          def fa():
              p = pathlib.Path("shared_engines/runtime/kernel.py")
              src = p.read_text(encoding="utf-8")
              if "VIVA-1-FX-LIVE" in src:
                  return "YA"
              imp_v = "from shared_engines.currency.rates import StaticTableRateProvider"
              if imp_v not in src:
                  raise RuntimeError("ancla import no hallada")
              src = src.replace(imp_v,
                  "from shared_engines.currency.rates import (\n"
                  "    StaticTableRateProvider,\n"
                  "    ErApiRateProvider,\n"
                  "    CryptoRateProvider,\n"
                  "    ChainlinkOracleProvider,\n"
                  ")  # VIVA-1-FX-LIVE", 1)
              viejo = (
                  "        self._currency = CurrencyEngine(\n"
                  "            db=db,\n"
                  "            clock=clock,\n"
                  "            providers=[\n"
                  "                StaticTableRateProvider(\n"
                  "                    fx_rates\n"
                  "                    if fx_rates is not None\n"
                  "                    else DEFAULT_FX_RATES,\n"
                  "                    clock,\n"
                  "                )\n"
                  "            ],"
              )
              if viejo not in src:
                  raise RuntimeError("ancla CurrencyEngine no hallada")
              nuevo = (
                  "        _fx_live = (\n"
                  "            os.environ.get(\"ZYRA_FX_LIVE\", \"\")\n"
                  "            == \"1\")  # VIVA-1-FX-LIVE\n"
                  "        self._currency = CurrencyEngine(\n"
                  "            db=db,\n"
                  "            clock=clock,\n"
                  "            providers=(\n"
                  "                [\n"
                  "                    ErApiRateProvider(),\n"
                  "                    CryptoRateProvider(),\n"
                  "                    ChainlinkOracleProvider(),\n"
                  "                ]\n"
                  "                if _fx_live\n"
                  "                else []\n"
                  "            )\n"
                  "            + [\n"
                  "                StaticTableRateProvider(\n"
                  "                    fx_rates\n"
                  "                    if fx_rates is not None\n"
                  "                    else DEFAULT_FX_RATES,\n"
                  "                    clock,\n"
                  "                )\n"
                  "            ],"
              )
              src = src.replace(viejo, nuevo, 1)
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK(env-gated: ZYRA_FX_LIVE=1)"

          def fb():
              p = pathlib.Path("shared_engines/runtime/capabilities.py")
              src = p.read_text(encoding="utf-8")
              if "VIVA-1-BRIDGE" in src:
                  return "YA"
              ancla = (
                  "        self.encryption = EncryptionEngine(\n"
                  "            db,\n"
                  "            clock,\n"
                  "            namespace=\"capabilities\",\n"
                  "        )"
              )
              if ancla not in src:
                  raise RuntimeError("ancla encryption no hallada")
              src = src.replace(ancla, ancla + "\n"
                  "        from shared_engines.events.outbox import (\n"
                  "            InterAppBridge,\n"
                  "        )  # VIVA-1-BRIDGE\n"
                  "        self.bridge = InterAppBridge(\n"
                  "            db=db,\n"
                  "            clock=clock,\n"
                  "            source=self.outbox,\n"
                  "        )  # VIVA-1-BRIDGE", 1)
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"

          def fb2():
              p = pathlib.Path("shared_engines/runtime/combined_api.py")
              src = p.read_text(encoding="utf-8")
              if "VIVA-1-BRIDGE-ROUTES" in src:
                  return "YA"
              src, n = re.subn(
                  r'(CAPS_\w+_PREFIXES = frozenset\(\s*\{)',
                  r'\1  # VIVA-1-BRIDGE-ROUTES\n        "bridge",',
                  src)
              if n == 0:
                  raise RuntimeError("sin CAPS_*_PREFIXES")
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK(" + str(n) + " prefijos)"

          def fc():
              p = pathlib.Path("main.py")
              src = p.read_text(encoding="utf-8")
              if "VIVA-1-RELAY-FOREVER" in src:
                  return "YA"
              viejo = (
                  "    server = serve_combined(\n"
                  "        kernel,\n"
                  "        caps,\n"
                  "        host=config.host,\n"
                  "        port=config.port,\n"
                  "    )\n"
              )
              if viejo not in src:
                  raise RuntimeError("ancla serve_combined no hallada")
              nuevo = (
                  "    import threading as _threading\n"
                  "    _relay_stop = _threading.Event()\n"
                  "    _relay_thread = _threading.Thread(\n"
                  "        target=caps.bridge.relay_forever,\n"
                  "        kwargs={\"stop\": _relay_stop,\n"
                  "                \"interval_seconds\": 1.0},\n"
                  "        daemon=True,\n"
                  "        name=\"zyra-relay-forever\",\n"
                  "    )\n"
                  "    _relay_thread.start()\n"
                  "    # VIVA-1-RELAY-FOREVER: cartero autonomo\n"
                  "    server = serve_combined(\n"
                  "        kernel,\n"
                  "        caps,\n"
                  "        host=config.host,\n"
                  "        port=config.port,\n"
                  "    )\n"
              )
              src = src.replace(viejo, nuevo, 1)
              viejo_fin = (
                  "    finally:\n"
                  "        server.server_close()\n"
                  "        db.close()"
              )
              if viejo_fin in src:
                  src = src.replace(viejo_fin,
                      "    finally:\n"
                      "        _relay_stop.set()\n"
                      "        _relay_thread.join(timeout=5)\n"
                      "        server.server_close()\n"
                      "        db.close()", 1)
              ast.parse(src)
              p.write_text(src, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"

          def fd():
              TEST = (
                  '"""VIVA-1: bus vivo de la Red - pruebas."""\n'
                  'from __future__ import annotations\n'
                  '\n'
                  'import threading\n'
                  '\n'
                  'from shared_engines.events.contracts import EventCatalog\n'
                  'from shared_engines.events.inbox import Inbox\n'
                  'from shared_engines.events.outbox import (\n'
                  '    Outbox, InterAppBridge)\n'
                  'from shared_engines.storage.database import SQLiteAdapter\n'
                  'from shared_engines.common.clocks import FrozenClock\n'
                  '\n'
                  '\n'
                  'def test_bus_vivo_evento_viaja_solo(tmp_path) -> None:\n'
                  '    cat = EventCatalog()\n'
                  '    cat.register("app.event")\n'
                  '    db = SQLiteAdapter(tmp_path / "bus.db")\n'
                  '    clock = FrozenClock()\n'
                  '    out = Outbox(db, clock)\n'
                  '    out.ensure_schema()\n'
                  '    inbox_b = Inbox(db, clock)\n'
                  '    recibidos = []\n'
                  '    llego = threading.Event()\n'
                  '\n'
                  '    def handler(ev):\n'
                  '        recibidos.append(ev.event_id)\n'
                  '        llego.set()\n'
                  '\n'
                  '    bridge = InterAppBridge(\n'
                  '        db=db, clock=clock, source=out)\n'
                  '    bridge.subscribe(\n'
                  '        app_id="app-b",\n'
                  '        event_types=("app.event",),\n'
                  '        inbox=inbox_b,\n'
                  '        handler=handler)\n'
                  '    stop = threading.Event()\n'
                  '    hilo = threading.Thread(\n'
                  '        target=lambda: bridge.relay_forever(\n'
                  '            stop=stop, interval_seconds=0.05),\n'
                  '        daemon=True)\n'
                  '    hilo.start()\n'
                  '    ev = cat.build(\n'
                  '        "app.event", aggregate_id="A1",\n'
                  '        payload={"msg": "hola-b"}, clock=clock)\n'
                  '    out.enqueue(ev)\n'
                  '    assert llego.wait(timeout=10), (\n'
                  '        "bus vivo no entrego")\n'
                  '    stop.set()\n'
                  '    hilo.join(timeout=5)\n'
                  '    assert not hilo.is_alive()\n'
                  '    assert recibidos\n'
                  '    print("OK VIVA-1: evento viajo por el bus sin llamada manual")\n'
                  '\n'
                  '\n'
                  'def test_fx_static_por_defecto(tmp_path, monkeypatch) -> None:\n'
                  '    """VIVA-1: sin ZYRA_FX_LIVE, el kernel es\n'
                  '    determinista (static) - CI estable."""\n'
                  '    monkeypatch.delenv("ZYRA_FX_LIVE", raising=False)\n'
                  '    from shared_engines.runtime.kernel import ZyraKernel\n'
                  '    from shared_engines.verification.signatures import (\n'
                  '        Ed25519Signer)\n'
                  '    db = SQLiteAdapter(tmp_path / "fx.db")\n'
                  '    s, _ = Ed25519Signer.generate()\n'
                  '    k = ZyraKernel(db=db, clock=FrozenClock(),\n'
                  '                   signer=s,\n'
                  '                   config=None) if False else None\n'
                  '    from shared_engines.runtime.config import RuntimeConfig\n'
                  '    k = ZyraKernel(db=db, clock=FrozenClock(),\n'
                  '                   signer=s,\n'
                  '                   config=RuntimeConfig(\n'
                  '                       host="127.0.0.1", port=0,\n'
                  '                       api_token=None))\n'
                  '    q = k.currency.quote(\n'
                  '        base="USD", quote_ccy="EUR",\n'
                  '        requester_zid=k.bootstrap_root().zid)\n'
                  '    assert q.quote.source == "static-table", str(q.quote)\n'
                  '    print("OK VIVA-1: FX determinista sin env (static)")\n'
              )
              p = pathlib.Path("shared_engines/runtime/tests/test_bus_vivo.py")
              ast.parse(TEST)
              p.write_text(TEST, encoding="utf-8")
              py_compile.compile(str(p), doraise=True)
              return "OK"

          fix("FIX-A FX env-gated", fa)
          fix("FIX-B bridge capabilities", fb)
          fix("FIX-B2 rutas bridge dispatcher", fb2)
          fix("FIX-C relay_forever main", fc)
          fix("FIX-D tests", fd)
          exit(0)
          EOF

      - name: "V1: tests bus vivo + fx determinista"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 180 python3 -m pytest shared_engines/runtime/tests/test_bus_vivo.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/v1.out 2>&1
          echo $? > /tmp/v1
          if [ "$(cat /tmp/v1)" = "0" ]; then echo "- V1: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- V1: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### V1 detalle"; echo '```'; tail -70 /tmp/v1.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "V2: bridge route 200"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          python3 << 'EOF' > /tmp/v2.out 2>&1
          import json, threading, time, urllib.request
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.verification.signatures import Ed25519Signer
          db = SQLiteAdapter(":memory:")
          s, _ = Ed25519Signer.generate()
          k = ZyraKernel(db=db, clock=SystemClock(), signer=s, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
          k.bootstrap_root()
          caps = ZyraCapabilities(db, SystemClock(), identity=k.identity, signer=s)
          srv = serve_combined(k, caps, host="127.0.0.1", port=0)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          time.sleep(0.4)
          base = "http://127.0.0.1:" + str(srv.server_address[1])
          with urllib.request.urlopen(base + "/bridge/subscriptions/app-x", timeout=10) as r:
              print("BRIDGE:", r.status, r.read().decode()[:120])
          srv.shutdown()
          srv.server_close()
          EOF
          echo $? > /tmp/v2
          if [ "$(cat /tmp/v2)" = "0" ]; then echo "- V2 bridge 200: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- V2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### V2 detalle"; echo '```'; tail -30 /tmp/v2.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "V3: regresion shared_engines completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/v3.out 2>&1
          echo $? > /tmp/v3
          if [ "$(cat /tmp/v3)" = "0" ]; then echo "- V3: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- V3: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### V3 detalle"; echo '```'; tail -60 /tmp/v3.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "V4: apps intactas"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          set +e
          timeout 600 python3 -m pytest apps/nexo/tests apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/v4.out 2>&1
          echo $? > /tmp/v4
          if [ "$(cat /tmp/v4)" = "0" ]; then echo "- V4: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- V4: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### V4 detalle"; echo '```'; tail -40 /tmp/v4.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in v1 v2 v3 v4; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: V1-V4 VERDES — RED DESPIERTA (determinista en CI, viva con ZYRA_FX_LIVE=1 en produccion)**"
          find shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add shared_engines main.py
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(VIVA-1): bus vivo (bridge cableado + rutas + relay_forever en runtime) + FX vivo env-gated ZYRA_FX_LIVE=1 con static fallback (V1-V4 verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — RED VIVA. Sigue VIVA-2.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2) — RED VIVA.**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
