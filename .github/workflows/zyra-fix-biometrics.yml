              "apps/agro/modules/productores/documentos/document_service.py": textwrap.dedent('''\
                  """AGRO - validacion documental (GPT-1):
                  documentos del productor con hash
                  sha256 y verificacion de gobierno."""
                  from __future__ import annotations

                  import hashlib
                  import uuid


                  class DocumentService:
                      def __init__(self, db) -> None:
                          self._db = db
                          self._db.execute(
                              "CREATE TABLE IF NOT EXISTS"
                              " agro_docs ("
                              " doc_id TEXT PRIMARY KEY,"
                              " producer_id TEXT NOT NULL,"
                              " doc_kind TEXT NOT NULL,"
                              " content_sha256 TEXT NOT NULL,"
                              " verified INTEGER NOT NULL"
                              " DEFAULT 0,"
                              " reviewer TEXT,"
                              " created_at TEXT)"
                          )

                      def submit(
                          self, *, producer_id,
                          doc_kind, content_b64,
                      ) -> dict:
                          import time as _t
                          digest = hashlib.sha256(
                              str(content_b64 or "").encode(
                                  "utf-8"
                              )
                          ).hexdigest()
                          doc_id = (
                              "DOCAG-"
                              + uuid.uuid4().hex[:10]
                          )
                          ts = _t.strftime(
                              "%Y-%m-%dT%H:%M:%SZ",
                              _t.gmtime(),
                          )
                          self._db.execute(
                              "INSERT INTO agro_docs ("
                              " doc_id, producer_id,"
                              " doc_kind, content_sha256,"
                              " verified, reviewer,"
                              " created_at)"
                              " VALUES (?, ?, ?, ?, 0,"
                              " NULL, ?)",
                              (doc_id, producer_id,
                               doc_kind, digest, ts),
                          )
                          return {
                              "doc_id": doc_id,
                              "producer_id": producer_id,
                              "doc_kind": doc_kind,
                              "content_sha256": digest,
                              "verified": False,
                          }

                      def verify(
                          self, *, doc_id, reviewer,
                      ) -> dict:
                          self._db.execute(
                              "UPDATE agro_docs SET"
                              " verified = 1, reviewer = ?"
                              " WHERE doc_id = ?",
                              (reviewer, doc_id),
                          )
                          return {
                              "doc_id": doc_id,
                              "verified": True,
                              "reviewer": reviewer,
                          }

                      def documents_of(
                          self, producer_id,
                      ) -> list:
                          for name in (
                              "query_all", "query",
                              "fetchall",
                          ):
                              fn = getattr(
                                  self._db, name, None
                              )
                              if callable(fn):
                                  try:
                                      got = fn(
                                          "SELECT doc_id,"
                                          " producer_id,"
                                          " doc_kind,"
                                          " content_sha256,"
                                          " verified, reviewer,"
                                          " created_at FROM"
                                          " agro_docs WHERE"
                                          " producer_id = ?",
                                          (producer_id,),
                                      )
                                  except Exception:
                                      got = None
                                  if got:
                                      rows = []
                                      for r in got:
                                          d = dict(r)
                                          d["verified"] = bool(
                                              d.get("verified")
                                          )
                                          rows.append(d)
                                      return rows
                          return []
              '''),
              "apps/agro/modules/produccion/planificacion/planning_service.py": textwrap.dedent('''\
                  """AGRO - planificacion de produccion (GPT-2):
                  plan por unidad productiva con etapas
                  validadas en orden de negocio."""
                  from __future__ import annotations

                  import uuid


                  STAGES = (
                      "planned",
                      "planted",
                      "growing",
                      "harvested",
                  )


                  class PlanningService:
                      def __init__(self, db) -> None:
                          self._db = db
                          self._db.execute(
                              "CREATE TABLE IF NOT EXISTS"
                              " agro_plans ("
                              " plan_id TEXT PRIMARY KEY,"
                              " producer_id TEXT NOT NULL,"
                              " unit_id TEXT NOT NULL,"
                              " crop TEXT NOT NULL,"
                              " planned_quantity REAL NOT"
                              " NULL DEFAULT 0,"
                              " status TEXT NOT NULL,"
                              " created_at TEXT)"
                          )
                          self._db.execute(
                              "CREATE TABLE IF NOT EXISTS"
                              " agro_stage_log ("
                              " log_id INTEGER PRIMARY KEY"
                              " AUTOINCREMENT,"
                              " plan_id TEXT NOT NULL,"
                              " stage TEXT NOT NULL,"
                              " detail TEXT,"
                              " logged_at TEXT)"
                          )

                      def create_plan(
                          self, *, producer_id,
                          unit_id, crop,
                          planned_quantity,
                      ) -> dict:
                          import time as _t
                          if float(
                              planned_quantity or 0
                          ) < 0:
                              raise ValueError(
                                  "planned_quantity no"
                                  " puede ser negativa"
                              )
                          unit = None
                          for name in (
                              "query_one", "query"
                          ):
                              fn = getattr(
                                  self._db, name, None
                              )
                              if callable(fn):
                                  try:
                                      unit = fn(
                                          "SELECT unit_id FROM"
                                          " agro_units WHERE"
                                          " unit_id = ?",
                                          (unit_id,),
                                      )
                                  except Exception:
                                      unit = None
                                  if unit:
                                      break
                          if not unit:
                              raise LookupError(
                                  "unidad productiva no"
                                  " encontrada: "
                                  + str(unit_id)
                              )
                          plan_id = (
                              "PLN-"
                              + uuid.uuid4().hex[:10]
                          )
                          ts = _t.strftime(
                              "%Y-%m-%dT%H:%M:%SZ",
                              _t.gmtime(),
                          )
                          self._db.execute(
                              "INSERT INTO agro_plans ("
                              " plan_id, producer_id,"
                              " unit_id, crop,"
                              " planned_quantity, status,"
                              " created_at)"
                              " VALUES (?, ?, ?, ?, ?,"
                              " 'planned', ?)",
                              (plan_id, producer_id,
                               unit_id, crop,
                               float(planned_quantity), ts),
                          )
                          self._db.execute(
                              "INSERT INTO agro_stage_log ("
                              " plan_id, stage, detail,"
                              " logged_at)"
                              " VALUES (?, 'planned',"
                              " 'plan creado', ?)",
                              (plan_id, ts),
                          )
                          return {
                              "plan_id": plan_id,
                              "producer_id": producer_id,
                              "unit_id": unit_id,
                              "crop": crop,
                              "planned_quantity": float(
                                  planned_quantity
                              ),
                              "status": "planned",
                          }

                      def advance(
                          self, *, plan_id, detail="",
                      ) -> dict:
                          import time as _t
                          row = None
                          for name in (
                              "query_one", "query"
                          ):
                              fn = getattr(
                                  self._db, name, None
                              )
                              if callable(fn):
                                  try:
                                      row = fn(
                                          "SELECT plan_id,"
                                          " status, crop,"
                                          " producer_id FROM"
                                          " agro_plans WHERE"
                                          " plan_id = ?",
                                          (plan_id,),
                                      )
                                  except Exception:
                                      row = None
                                  if row:
                                      break
                          if not row:
                              raise LookupError(
                                  "plan no encontrado: "
                                  + str(plan_id)
                              )
                          try:
                              current = str(row["status"])
                          except Exception:
                              current = str(row[1])
                          if current not in STAGES:
                              raise ValueError(
                                  "estado invalido: "
                                  + current
                              )
                          idx = STAGES.index(current)
                          if idx >= len(STAGES) - 1:
                              raise ValueError(
                                  "el plan ya esta en la"
                                  " etapa final (harvested)"
                              )
                          nxt = STAGES[idx + 1]
                          ts = _t.strftime(
                              "%Y-%m-%dT%H:%M:%SZ",
                              _t.gmtime(),
                          )
                          self._db.execute(
                              "UPDATE agro_plans SET"
                              " status = ? WHERE"
                              " plan_id = ?",
                              (nxt, plan_id),
                          )
                          self._db.execute(
                              "INSERT INTO agro_stage_log ("
                              " plan_id, stage, detail,"
                              " logged_at)"
                              " VALUES (?, ?, ?, ?)",
                              (plan_id, nxt,
                               str(detail or ""), ts),
                          )
                          return {
                              "plan_id": plan_id,
                              "from_stage": current,
                              "to_stage": nxt,
                          }

                      def plans_of(
                          self, producer_id,
                      ) -> list:
                          for name in (
                              "query_all", "query",
                              "fetchall",
                          ):
                              fn = getattr(
                                  self._db, name, None
                              )
                              if callable(fn):
                                  try:
                                      got = fn(
                                          "SELECT plan_id,"
                                          " producer_id,"
                                          " unit_id, crop,"
                                          " planned_quantity,"
                                          " status, created_at"
                                          " FROM agro_plans"
                                          " WHERE producer_id"
                                          " = ? ORDER BY"
                                          " created_at",
                                          (producer_id,),
                                      )
                                  except Exception:
                                      got = None
                                  if got:
                                      return [
                                          dict(r) for r in got
                                      ]
                          return []
              '''),
              "apps/agro/modules/produccion/seguimiento/tracking_service.py": textwrap.dedent('''\
                  """AGRO - trazabilidad por unidad productiva
                  (GPT-2): historial de etapas de cada plan."""
                  from __future__ import annotations


