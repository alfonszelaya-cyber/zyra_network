              # ============ GPT-7: seguridad (matriz + cadena) ============


              def _seed_sec(name):
                  return (
                      name.strip().encode("utf-8").hex()
                      + "zyra" * 16
                  )[:64]


              def _post_sec(base, path, doc, role=None):
                  headers = {
                      "Content-Type": "application/json"
                  }
                  if role:
                      headers["X-ZYRA-Actor-Role"] = role
                  request = Request(
                      base + path,
                      data=json.dumps(doc).encode(),
                      headers=headers,
                      method="POST",
                  )
                  try:
                      with urlopen(request, timeout=10) as r:
                          return r.status, r.read().decode()
                  except HTTPError as exc:
                      return exc.code, exc.read().decode()


              def _get_sec(base, path):
                  with urlopen(base + path, timeout=10) as r:
                      return r.status, r.read().decode()


              def _boot_sec():
                  db = SQLiteAdapter(":memory:")
                  store = AgroStore(db, FrozenClock())
                  dead_client = NetworkClient(
                      "http://127.0.0.1:1",
                      timeout_seconds=1.0,
                      max_retries=0,
                  )
                  server = serve_agro(store, dead_client)
                  thread = threading.Thread(
                      target=server.serve_forever,
                      daemon=True,
                  )
                  thread.start()
                  base = (
                      "http://127.0.0.1:"
                      f"{server.bound_port}"
                  )
                  return db, store, server, thread, base


              def _register_sec(base, store, name):
                  code = _post_sec(
                      base + "/agro/register",
                      {
                          "name": name,
                          "producer_type": "maiz",
                          "role": "agricultor",
                          "doc_image_b64": _seed_sec(name),
                          "selfie_image_b64": _seed_sec(name),
                      },
                  )
                  assert code == 200
                  return store.list_producers()[0][
                      "producer_id"
                  ]


              def test_gov_ops_require_gobierno_role() -> None:
                  db, store, server, thread, base = _boot_sec()
                  try:
                      pid = _register_sec(
                          base, store, "Rosa Permisos"
                      )
                      st, body = _post_sec(
                          base + "/agro/producers/verify",
                          {"producer_id": pid},
                      )
                      assert st == 403, body[:200]
                      st, body = _post_sec(
                          base + "/agro/producers/verify",
                          {"producer_id": pid},
                          role="agricultor",
                      )
                      assert st == 403, body[:200]
                      st, body = _post_sec(
                          base + "/agro/producers/verify",
                          {"producer_id": pid},
                          role="gobierno",
                      )
                      assert st == 400, body[:200]
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()


              def test_matrix_by_role_and_institution() -> None:
                  db, store, server, thread, base = _boot_sec()
                  try:
                      pid = _register_sec(
                          base, store, "Luis Matriz"
                      )
                      land = {
                          "producer_id": pid,
                          "location": "Norte",
                          "size_hectares": 5,
                          "land_use": "maiz",
                      }
                      st, body = _post_sec(
                          base + "/agro/land",
                          land,
                          role="banco",
                      )
                      assert st == 403, body[:200]
                      st, body = _post_sec(
                          base + "/agro/land",
                          land,
                          role="agricultor",
                      )
                      assert st == 201, body[:200]
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()


              def test_block_after_ten_denies() -> None:
                  db, store, server, thread, base = _boot_sec()
                  try:
                      pid = _register_sec(
                          base, store, "Mati Intruso"
                      )
                      last = None
                      for _ in range(11):
                          last = _post_sec(
                              base + "/agro/producers/verify",
                              {"producer_id": pid},
                              role="agricultor",
                          )[0]
                      assert last == 403
                      st, _b = _post_sec(
                          base + "/agro/land",
                          {
                              "producer_id": pid,
                              "location": "x",
                              "size_hectares": 1,
                          },
                          role="agricultor",
                      )
                      assert st == 403
                      st, body = _post_sec(
                          base + "/agro/security/unblock",
                          {"actor": "anon"},
                          role="gobierno",
                      )
                      assert st == 200, body[:200]
                      st, _b = _post_sec(
                          base + "/agro/land",
                          {
                              "producer_id": pid,
                              "location": "x",
                              "size_hectares": 1,
                          },
                          role="agricultor",
                      )
                      assert st == 201, _b[:200]
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()


              def test_audit_chain_and_tamper_detection() -> None:
                  db, store, server, thread, base = _boot_sec()
                  try:
                      pid = _register_sec(
                          base, store, "Ana Auditoria"
                      )
                      _post_sec(
                          base + "/agro/land",
                          {
                              "producer_id": pid,
                              "location": "Sur",
                              "size_hectares": 3,
                          },
                          role="agricultor",
                      )
                      st, body = _get_sec(
                          base + "/agro/audit/verify"
                      )
                      data = json.loads(body)["data"]
                      assert data["ok"] is True, str(data)
                      assert data["entries"] >= 2
                      st, body = _get_sec(
                          base + "/agro/audit/list"
                      )
                      lst = json.loads(body)["data"]["entries"]
                      assert len(lst) >= 2
                      db.execute(
                          "UPDATE agro_audit_chain SET"
                          " operation = 'HACKED'"
                          " WHERE seq = 1"
                      )
                      st, body = _get_sec(
                          base + "/agro/audit/verify"
                      )
                      data = json.loads(body)["data"]
                      assert data["ok"] is False, str(data)
                      assert data["broken_at"] == 1, str(data)
                  finally:
                      server.shutdown()
                      server.server_close()
                      thread.join(timeout=5)
                      db.close()
          ''')

          if "import json" not in tr:
