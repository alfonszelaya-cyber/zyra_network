name: "ZYRA RUN8d: R-1..R-9 SIN duplicar (capas finas que componen LifeHistory/DocumentExchange/Biometrics/IdentityEngine existentes) + pip robusto"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias (con reintento — el fallo pip transitorio mato el 8c)
        run: |
          for i in 1 2 3; do
            python3 -m pip install --upgrade pip && break
            echo "pip reintento $i"; sleep 10
          done
          for i in 1 2 3; do
            python3 -m pip install pytest pytest-timeout && break
            echo "pytest reintento $i"; sleep 10
          done
          python3 -c "import pytest; print('pytest OK', pytest.__version__)"
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || echo "requirements opcional fallo"
          fi

      - name: "[ESCRITURA] 5 capas finas R-1/R-2/R-4/R-5/R-9 (componen lo EXISTENTE de la Red)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("shared_engines/identity/guardian_engine.py",
                     D(r'''
              """Guardian Engine (R-2) - la relacion tutor<->menor
              CANONICA de la Red, por REFERENCIA a ZIDs del
              IdentityEngine existente (regla 63/69: no re-crea
              ZIDs, no toca la tabla identities que es del
              IdentityEngine). Roles: MADRE/PADRE/TUTOR/
              REPRESENTANTE/ENCARGADO. UNIQUE(guardian,menor,rol)
              activo, revocacion con motivo, re-activacion,
              is_guardian() para TODAS las apps. Reglas 66/68/76."""
              from __future__ import annotations
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import (
                  Database)
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "zid_guardian_links", (
                      "CREATE TABLE IF NOT EXISTS"
                      " zid_guardian_links (link_id TEXT PRIMARY"
                      " KEY, guardian_zid TEXT NOT NULL, minor_zid"
                      " TEXT NOT NULL, role TEXT NOT NULL, status"
                      " TEXT NOT NULL DEFAULT 'activa', revoked"
                      "_reason TEXT NOT NULL DEFAULT '', created"
                      "_at REAL NOT NULL)",
                      "CREATE UNIQUE INDEX IF NOT EXISTS"
                      " uq_guardian_active ON zid_guardian_links"
                      " (guardian_zid, minor_zid, role,"
                      " CASE WHEN status = 'activa' THEN 1 ELSE"
                      " NULL END)",
                  )),
              )
              _ROLES = ("MADRE", "PADRE", "TUTOR",
                        "REPRESENTANTE", "ENCARGADO")


              class GuardianEngine:
                  """Vinculo tutor<->menor canonico de la Red."""

                  def __init__(self, db: Database, clock: Clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "zid.guardian",
                                      _MIGRATIONS).run(clock)

                  def link(self, *, guardian_zid, minor_zid,
                           role):
                      g = str(guardian_zid).strip()
                      m = str(minor_zid).strip()
                      if not g or not m:
                          raise ValueError(
                              "guardian_zid y minor_zid"
                              " requeridos")
                      if g == m:
                          raise ValueError(
                              "guardian y minor iguales")
                      r = str(role).upper()
                      if r not in _ROLES:
                          raise ValueError("role debe ser "
                                           + "/".join(_ROLES))
                      dup = self._db.query_one(
                          "SELECT link_id, status FROM"
                          " zid_guardian_links WHERE guardian"
                          "_zid = ? AND minor_zid = ? AND role ="
                          " ?", (g, m, r))
                      if dup is not None and str(
                              dup["status"]) == "activa":
                          raise ValueError(
                              "vinculo ya activo (regla 66)")
                      if dup is not None:
                          self._db.execute(
                              "UPDATE zid_guardian_links SET"
                              " status = 'activa', revoked_reason"
                              " = '' WHERE link_id = ?",
                              (str(dup["link_id"]),))
                          return {"link_id": str(
                                      dup["link_id"]),
                                  "status": "activa",
                                  "reactivated": True}
                      lid = ("ZGL-"
                             + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO zid_guardian_links"
                          " (link_id, guardian_zid, minor_zid,"
                          " role, status, created_at)"
                          " VALUES (?, ?, ?, ?, 'activa', ?)",
                          (lid, g, m, r, self._clock.now()))
                      return {"link_id": lid,
                              "guardian_zid": g,
                              "minor_zid": m, "role": r,
                              "status": "activa"}

                  def revoke(self, link_id, *, reason):
                      row = self._db.query_one(
                          "SELECT status FROM zid_guardian_links"
                          " WHERE link_id = ?", (str(link_id),))
                      if row is None:
                          raise KeyError(link_id)
                      if str(row["status"]) != "activa":
                          raise ValueError("ya revocado")
                      if not str(reason).strip():
                          raise ValueError(
                              "motivo obligatorio")
                      self._db.execute(
                          "UPDATE zid_guardian_links SET status"
                          " = 'revocada', revoked_reason = ?"
                          " WHERE link_id = ?",
                          (str(reason), str(link_id)))
                      return {"link_id": str(link_id)}

                  def guardians_of(self, minor_zid):
                      rows = self._db.query_all(
                          "SELECT link_id, guardian_zid, role"
                          " FROM zid_guardian_links WHERE minor"
                          "_zid = ? AND status = 'activa' ORDER"
                          " BY rowid", (str(minor_zid),))
                      return [{"link_id": str(r["link_id"]),
                               "guardian_zid": str(
                                   r["guardian_zid"]),
                               "role": str(r["role"])}
                              for r in rows]

                  def minors_of(self, guardian_zid):
                      rows = self._db.query_all(
                          "SELECT link_id, minor_zid, role FROM"
                          " zid_guardian_links WHERE guardian"
                          "_zid = ? AND status = 'activa' ORDER"
                          " BY rowid", (str(guardian_zid),))
                      return [{"link_id": str(r["link_id"]),
                               "minor_zid": str(
                                   r["minor_zid"]),
                               "role": str(r["role"])}
                              for r in rows]

                  def is_guardian(self, guardian_zid, minor_zid,
                                  role=None):
                      if role:
                          row = self._db.query_one(
                              "SELECT link_id FROM"
                              " zid_guardian_links WHERE"
                              " guardian_zid = ? AND minor_zid ="
                              " ? AND role = ? AND status ="
                              " 'activa'",
                              (str(guardian_zid),
                               str(minor_zid),
                               str(role).upper()))
                      else:
                          row = self._db.query_one(
                              "SELECT link_id FROM"
                              " zid_guardian_links WHERE"
                              " guardian_zid = ? AND minor_zid ="
                              " ? AND status = 'activa'",
                              (str(guardian_zid),
                               str(minor_zid)))
                      return row is not None
              '''))
              forzar("shared_engines/identity/birth_registry_engine.py",
                     D(r'''
              """Birth Registry Engine (R-1) - CAPA CIVIL FINA de
              nacimiento que COMPONE lo existente de la Red
              (regla 69, textual de la guia R-3: "integracion con
              Documents/Verification que YA existen - NO motor
              nuevo"):
              - El ZID del nacido lo emite el IdentityEngine
                EXISTENTE (si se provee; sino queda pendiente)
              - El historico vive en LifeHistory EXISTENTE
                (entry_type='birth_registration', su hash-chain
                por ZID - si se provee; fallback: tabla propia
                fina documentada)
              - El certificado se sella con DocumentExchange
                EXISTENTE (si se provee; sino guarda hash local)
              NO duplica cadenas ni ZIDs. Reglas 63/66/68/76/78."""
              from __future__ import annotations
              import hashlib
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import (
                  Database)
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "zid_births_civil", (
                      "CREATE TABLE IF NOT EXISTS zid_births_civil"
                      " (birth_id TEXT PRIMARY KEY, child_name"
                      " TEXT NOT NULL, birth_date TEXT NOT NULL"
                      " DEFAULT '', birth_place TEXT NOT NULL"
                      " DEFAULT '', sex TEXT NOT NULL DEFAULT '',"
                      " mother_zid TEXT NOT NULL, father_zid TEXT"
                      " NOT NULL DEFAULT '', child_zid TEXT NOT"
                      " NULL DEFAULT '', cert_code TEXT NOT NULL,"
                      " cert_hash TEXT NOT NULL, life_seq INTEGER,"
                      " sealed_doc_id TEXT NOT NULL DEFAULT '',"
                      " created_at REAL NOT NULL)",
                  )),
              )
              _SEX = ("M", "F", "I")


              def _sha(t):
                  return hashlib.sha256(
                      t.encode("utf-8")).hexdigest()


              class BirthRegistryEngine:
                  """Capa civil de nacimiento (compone la Red)."""

                  def __init__(self, db: Database, clock: Clock,
                               identity_engine=None,
                               life_history=None,
                               document_exchange=None):
                      self._db = db
                      self._clock = clock
                      self._ids = identity_engine
                      self._life = life_history
                      self._docs = document_exchange
                      MigrationRunner(db, "zid.birthcivil",
                                      _MIGRATIONS).run(clock)

                  def register_birth(self, *, child_name,
                                     mother_zid, father_zid="",
                                     birth_date="",
                                     birth_place="", sex=""):
                      if not str(child_name).strip():
                          raise ValueError(
                              "child_name requerido")
                      if not str(mother_zid).strip():
                          raise ValueError(
                              "mother_zid requerido")
                      s = str(sex).upper()
                      if s and s not in _SEX:
                          raise ValueError("sex debe ser "
                                           + "/".join(_SEX))
                      child_zid = ""
                      if self._ids is not None:
                          ident = self._ids.register_identity(
                              kind=self._ids_kind(),
                              display_name=str(
                                  child_name).strip(),
                              actor="birth_registry")
                          child_zid = str(ident.zid)
                      bid = ("ZB-"
                             + uuid.uuid4().hex[:10])
                      ch = _sha(bid + "|" + str(child_name)
                                + "|" + str(mother_zid) + "|"
                                + str(father_zid) + "|"
                                + str(child_zid))
                      cert = ("ZCERT-"
                              + uuid.uuid4().hex[:10])
                      life_seq = None
                      if self._life is not None:
                          entry = self._life.append(
                              zid=(child_zid or bid),
                              entry_type="birth_registration",
                              actor_app="axis",
                              payload={"birth_id": bid,
                                       "child_name": str(
                                           child_name).strip(),
                                       "mother_zid": str(
                                           mother_zid),
                                       "father_zid": str(
                                           father_zid),
                                       "cert_code": cert})
                          life_seq = int(entry.entry_seq)
                      self._db.execute(
                          "INSERT INTO zid_births_civil (birth_id,"
                          " child_name, birth_date, birth_place,"
                          " sex, mother_zid, father_zid, child_zid,"
                          " cert_code, cert_hash, life_seq,"
                          " created_at) VALUES (?, ?, ?, ?, ?, ?,"
                          " ?, ?, ?, ?, ?, ?)",
                          (bid, str(child_name).strip(),
                           str(birth_date), str(birth_place), s,
                           str(mother_zid), str(father_zid),
                           str(child_zid), cert, ch, life_seq,
                           self._clock.now()))
                      sealed_doc = ""
                      if self._docs is not None and child_zid:
                          try:
                              sealed = self._docs.seal_document(
                                  owner_zid=child_zid,
                                  title="Acta de nacimiento "
                                        + cert,
                                  content={"cert_code": cert,
                                           "cert_hash": ch,
                                           "birth_id": bid},
                                  actor_app="axis")
                              sealed_doc = str(
                                  sealed.get("document_id",
                                             ""))
                          except Exception:
                              sealed_doc = ""
                      if sealed_doc:
                          self._db.execute(
                              "UPDATE zid_births_civil SET"
                              " sealed_doc_id = ? WHERE birth_id"
                              " = ?", (sealed_doc, bid))
                      return {"birth_id": bid,
                              "cert_code": cert,
                              "cert_hash": ch,
                              "child_zid": child_zid,
                              "life_seq": life_seq,
                              "sealed_doc_id": sealed_doc}

                  @staticmethod
                  def _ids_kind():
                      from shared_engines.identity.contracts import (
                          IdentityKind,
                      )
                      return IdentityKind.PERSON

                  def bind_existing_zid(self, birth_id, *, zid):
                      row = self._db.query_one(
                          "SELECT child_zid FROM zid_births_civil"
                          " WHERE birth_id = ?",
                          (str(birth_id),))
                      if row is None:
                          raise KeyError(birth_id)
                      if str(row["child_zid"]).strip():
                          raise ValueError(
                              "ya tiene ZID (regla 78: UNO)")
                      if not str(zid).strip():
                          raise ValueError("zid requerido")
                      self._db.execute(
                          "UPDATE zid_births_civil SET child_zid"
                          " = ? WHERE birth_id = ?",
                          (str(zid), str(birth_id)))
                      return {"birth_id": str(birth_id),
                              "child_zid": str(zid)}

                  def get_birth(self, birth_id):
                      row = self._db.query_one(
                          "SELECT * FROM zid_births_civil WHERE"
                          " birth_id = ?", (str(birth_id),))
                      if row is None:
                          return {"found": False}
                      return {"found": True,
                              "child_name": str(
                                  row["child_name"]),
                              "mother_zid": str(
                                  row["mother_zid"]),
                              "father_zid": str(
                                  row["father_zid"]),
                              "child_zid": str(
                                  row["child_zid"]),
                              "cert_code": str(
                                  row["cert_code"]),
                              "cert_hash": str(
                                  row["cert_hash"]),
                              "life_seq": (int(row["life_seq"])
                                           if row["life_seq"]
                                           is not None
                                           else None),
                              "sealed_doc_id": str(
                                  row["sealed_doc_id"])}
              '''))
              forzar("shared_engines/identity/minor_biometrics_engine.py",
                     D(r'''
              """Minor Biometrics Engine (R-4) - la capa de
              MENORES de la regla 78 ENCIMA del BiometricsEngine
              EXISTENTE (regla 69: ese motor dueno de templates
              sellados AES-GCM, 1:N y assurance NO se toca):
              - fase PENDING_BIOMETRIC al nacer (regla 78)
              - enrolamiento EXIGE tutor activo (GuardianEngine,
                proteccion de menores)
              - template JAMAS en claro: hash (regla 63); el
                sellado fuerte vive en BiometricsEngine cuando
                se provee
              - actualizacion por crecimiento (reemplazo) y
                revocacion total. Patron _DDL + ensure_db."""
              from __future__ import annotations
              import hashlib
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import (
                  Database)
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "zid_minor_bio", (
                      "CREATE TABLE IF NOT EXISTS zid_minor_bio ("
                      " bio_id TEXT PRIMARY KEY, zid TEXT NOT"
                      " NULL, kind TEXT NOT NULL, template_hash"
                      " TEXT NOT NULL, quality INTEGER NOT NULL"
                      " DEFAULT 0, status TEXT NOT NULL DEFAULT"
                      " 'activa', enrolled_by TEXT NOT NULL"
                      " DEFAULT '', created_at REAL NOT NULL)",
                  )),
              )
              _KINDS = ("HUELLA", "ROSTRO", "IRIS")


              def _sha(t):
                  return hashlib.sha256(
                      t.encode("utf-8")).hexdigest()


              class MinorBiometricsEngine:
                  """Lifecycle biometrico de menores (regla 78)."""

                  def __init__(self, db: Database, clock: Clock,
                               guardian_engine=None):
                      self._db = db
                      self._clock = clock
                      self._guardians = guardian_engine
                      MigrationRunner(db, "zid.minorbio",
                                      _MIGRATIONS).run(clock)

                  def phase_of(self, zid):
                      rows = self._db.query_all(
                          "SELECT bio_id, kind, status, quality"
                          " FROM zid_minor_bio WHERE zid = ? ORDER"
                          " BY rowid", (str(zid),))
                      if not rows:
                          return {"zid": str(zid),
                                  "phase":
                                      "PENDING_BIOMETRIC",
                                  "note": "regla 78: nace sin"
                                          " biometria",
                                  "entries": []}
                      active = [r for r in rows
                                if str(r["status"])
                                == "activa"]
                      return {"zid": str(zid),
                              "phase": ("ENROLADO" if active
                                        else "REVOCADO"),
                              "entries": [{"bio_id": str(
                                  r["bio_id"]),
                                  "kind": str(r["kind"]),
                                  "status": str(r["status"])}
                                  for r in rows]}

                  def enroll(self, *, zid, kind, template_b64,
                             guardian_zid, quality=0):
                      if not str(zid).strip():
                          raise ValueError(
                              "zid requerido (mismo ZID del"
                              " nacimiento, regla 78)")
                      k = str(kind).upper()
                      if k not in _KINDS:
                          raise ValueError("kind debe ser "
                                           + "/".join(_KINDS))
                      if not str(template_b64).strip():
                          raise ValueError(
                              "template_b64 requerido")
                      if int(quality) < 0 or \
                              int(quality) > 100:
                          raise ValueError("quality 0..100")
                      if self._guardians is None:
                          raise ValueError(
                              "proteccion de menores: este"
                              " engine requiere GuardianEngine")
                      g = str(guardian_zid or "").strip()
                      if not g:
                          raise ValueError(
                              "guardian_zid requerido (menor)")
                      if not self._guardians.is_guardian(
                              g, str(zid)):
                          raise ValueError(
                              "guardian_zid NO es tutor activo"
                              " de este menor (regla 66)")
                      th = _sha(str(template_b64))
                      dup = self._db.query_one(
                          "SELECT bio_id FROM zid_minor_bio WHERE"
                          " zid = ? AND kind = ? AND status ="
                          " 'activa'", (str(zid), k))
                      if dup is not None:
                          self._db.execute(
                              "UPDATE zid_minor_bio SET status ="
                              " 'reemplazada' WHERE bio_id = ?",
                              (str(dup["bio_id"]),))
                      bid = ("ZMB-"
                             + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO zid_minor_bio (bio_id,"
                          " zid, kind, template_hash, quality,"
                          " status, enrolled_by, created_at)"
                          " VALUES (?, ?, ?, ?, ?, 'activa', ?,"
                          " ?)",
                          (bid, str(zid), k, th, int(quality),
                           g, self._clock.now()))
                      return {"bio_id": bid,
                              "template_hash": th}

                  def verify(self, *, zid, kind, template_b64):
                      k = str(kind).upper()
                      th = _sha(str(template_b64))
                      row = self._db.query_one(
                          "SELECT bio_id, template_hash FROM"
                          " zid_minor_bio WHERE zid = ? AND kind"
                          " = ? AND status = 'activa'",
                          (str(zid), k))
                      if row is None:
                          return {"matched": False,
                                  "reason": "sin plantilla"}
                      return {"matched":
                                  str(row["template_hash"])
                                  == th}

                  def revoke_all(self, zid, *, reason):
                      if not str(reason).strip():
                          raise ValueError(
                              "motivo obligatorio")
                      n = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM zid_minor_bio"
                          " WHERE zid = ? AND status = 'activa'",
                          (str(zid),))
                      self._db.execute(
                          "UPDATE zid_minor_bio SET status ="
                          " 'revocada' WHERE zid = ? AND status ="
                          " 'activa'", (str(zid),))
                      return {"zid": str(zid),
                              "revoked": int(n["n"])}
              '''))
              forzar("shared_engines/identity/representation_engine.py",
                     D(r'''
              """Representation Engine (R-5) - 'este adulto puede
              actuar POR este menor para ESTE servicio', central
              en la Red (centraliza lo que SEMILLA ya hace, regla
              69): alcance por servicio o '*', EXIGE vinculo
              GuardianEngine activo, expiracion, revocacion,
              can_act() canonico. Patron clase. Reglas 66/68/76."""
              from __future__ import annotations
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import (
                  Database)
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "zid_representations", (
                      "CREATE TABLE IF NOT EXISTS"
                      " zid_representations (rep_id TEXT PRIMARY"
                      " KEY, guardian_zid TEXT NOT NULL, minor_zid"
                      " TEXT NOT NULL, service TEXT NOT NULL,"
                      " status TEXT NOT NULL DEFAULT 'activa',"
                      " expires_at REAL, revoked_reason TEXT NOT"
                      " NULL DEFAULT '', granted_by TEXT NOT NULL"
                      " DEFAULT '', created_at REAL NOT NULL)",
                  )),
              )


              class RepresentationEngine:
                  """Representacion legal de menores."""

                  def __init__(self, db: Database, clock: Clock,
                               guardian_engine=None):
                      self._db = db
                      self._clock = clock
                      self._guardians = guardian_engine
                      MigrationRunner(db, "zid.rep",
                                      _MIGRATIONS).run(clock)

                  def grant(self, *, guardian_zid, minor_zid,
                            service, expires_at=None,
                            granted_by=""):
                      g = str(guardian_zid).strip()
                      m = str(minor_zid).strip()
                      if not g or not m:
                          raise ValueError(
                              "guardian_zid y minor_zid"
                              " requeridos")
                      if not str(service).strip():
                          raise ValueError(
                              "service (alcance) requerido")
                      if self._guardians is not None and \
                              not self._guardians.is_guardian(
                                  g, m):
                          raise ValueError(
                              "sin vinculo tutor activo"
                              " (regla 66)")
                      rid = ("ZREP-"
                             + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO zid_representations"
                          " (rep_id, guardian_zid, minor_zid,"
                          " service, status, expires_at,"
                          " granted_by, created_at)"
                          " VALUES (?, ?, ?, ?, 'activa', ?, ?,"
                          " ?)",
                          (rid, g, m, str(service),
                           (float(expires_at)
                            if expires_at is not None
                            else None), str(granted_by),
                           self._clock.now()))
                      return {"rep_id": rid,
                              "service": str(service)}

                  def revoke(self, rep_id, *, reason):
                      row = self._db.query_one(
                          "SELECT status FROM"
                          " zid_representations WHERE rep_id ="
                          " ?", (str(rep_id),))
                      if row is None:
                          raise KeyError(rep_id)
                      if str(row["status"]) != "activa":
                          raise ValueError("ya revocada")
                      if not str(reason).strip():
                          raise ValueError(
                              "motivo obligatorio")
                      self._db.execute(
                          "UPDATE zid_representations SET"
                          " status = 'revocada', revoked_reason"
                          " = ? WHERE rep_id = ?",
                          (str(reason), str(rep_id)))
                      return {"rep_id": str(rep_id)}

                  def can_act(self, guardian_zid, minor_zid,
                              service):
                      now = self._clock.now()
                      row = self._db.query_one(
                          "SELECT rep_id FROM"
                          " zid_representations WHERE guardian"
                          "_zid = ? AND minor_zid = ? AND status"
                          " = 'activa' AND service IN (?, '*')"
                          " AND (expires_at IS NULL OR expires_at"
                          " > ?) LIMIT 1",
                          (str(guardian_zid),
                           str(minor_zid), str(service), now))
                      return row is not None

                  def representations_of(self, minor_zid):
                      rows = self._db.query_all(
                          "SELECT rep_id, guardian_zid, service,"
                          " status FROM zid_representations WHERE"
                          " minor_zid = ? ORDER BY rowid",
                          (str(minor_zid),))
                      return [{"rep_id": str(r["rep_id"]),
                               "guardian_zid": str(
                                   r["guardian_zid"]),
                               "service": str(r["service"]),
                               "status": str(r["status"])}
                              for r in rows]
              '''))
              forzar("shared_engines/protocol/sessions/signatures_engine.py",
                     D(r'''
              """Session & Signature Engine (R-9) - pobla la
              carpeta protocol/sessions/signatures/ (la UNICA
              vacia de la Red segun la guia): sesiones de ZID con
              TTL y FIRMAS de mensajes con sello sha256
              verificable. No duplica nada de la auditoria 8c
              (no existia sessions en la Red). Patron clase.
              Reglas 63/66/68/76."""
              from __future__ import annotations
              import hashlib
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import (
                  Database)
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "zid_sessions", (
                      "CREATE TABLE IF NOT EXISTS zid_sessions ("
                      " session_id TEXT PRIMARY KEY, zid TEXT NOT"
                      " NULL, app TEXT NOT NULL DEFAULT '', status"
                      " TEXT NOT NULL DEFAULT 'abierta', opened_at"
                      " REAL NOT NULL, expires_at REAL, closed_at"
                      " REAL)",
                  )),
                  Migration(2, "zid_signatures", (
                      "CREATE TABLE IF NOT EXISTS zid_signatures ("
                      " sig_id TEXT PRIMARY KEY, session_id TEXT"
                      " NOT NULL, zid TEXT NOT NULL, message_hash"
                      " TEXT NOT NULL, seal TEXT NOT NULL, created"
                      "_at REAL NOT NULL)",
                  )),
              )


              def _sha(t):
                  return hashlib.sha256(
                      t.encode("utf-8")).hexdigest()


              class SessionSignatureEngine:
                  """Sesiones y firmas de mensajes de la Red."""

                  def __init__(self, db: Database, clock: Clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "zid.sess",
                                      _MIGRATIONS).run(clock)

                  def open_session(self, *, zid, app="",
                                   ttl_seconds=None):
                      if not str(zid).strip():
                          raise ValueError("zid requerido")
                      exp = (self._clock.now()
                             + float(ttl_seconds)
                             if ttl_seconds else None)
                      sid = ("ZSES-"
                             + uuid.uuid4().hex[:12])
                      self._db.execute(
                          "INSERT INTO zid_sessions (session_id,"
                          " zid, app, status, opened_at,"
                          " expires_at, closed_at) VALUES (?, ?,"
                          " ?, 'abierta', ?, ?, NULL)",
                          (sid, str(zid), str(app),
                           self._clock.now(), exp))
                      return {"session_id": sid,
                              "status": "abierta"}

                  def _session(self, session_id):
                      row = self._db.query_one(
                          "SELECT * FROM zid_sessions WHERE"
                          " session_id = ?",
                          (str(session_id),))
                      if row is None:
                          raise LookupError(
                              "sesion no encontrada: "
                              + str(session_id))
                      return row

                  def close_session(self, session_id):
                      row = self._session(session_id)
                      if str(row["status"]) != "abierta":
                          raise ValueError("ya cerrada")
                      self._db.execute(
                          "UPDATE zid_sessions SET status ="
                          " 'cerrada', closed_at = ? WHERE"
                          " session_id = ?",
                          (self._clock.now(),
                           str(session_id)))
                      return {"session_id": str(session_id)}

                  def _live(self, session_id):
                      row = self._session(session_id)
                      if str(row["status"]) != "abierta":
                          raise ValueError("sesion cerrada")
                      exp = row["expires_at"]
                      if exp is not None and \
                              float(exp) <= self._clock.now():
                          raise ValueError("sesion expirada")
                      return row

                  def sign(self, session_id, *, message):
                      row = self._live(session_id)
                      if not str(message).strip():
                          raise ValueError(
                              "message requerido")
                      mh = _sha(str(message))
                      seal = _sha(mh + "|" + str(
                          row["session_id"]) + "|"
                          + str(row["zid"]))
                      sid = ("ZSIG-"
                             + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO zid_signatures (sig_id,"
                          " session_id, zid, message_hash, seal,"
                          " created_at) VALUES (?, ?, ?, ?, ?,"
                          " ?)",
                          (sid, str(row["session_id"]),
                           str(row["zid"]), mh, seal,
                           self._clock.now()))
                      return {"sig_id": sid, "seal": seal}

                  def verify(self, sig_id, *, message):
                      row = self._db.query_one(
                          "SELECT session_id, zid, message_hash,"
                          " seal FROM zid_signatures WHERE sig_id"
                          " = ?", (str(sig_id),))
                      if row is None:
                          return {"valid": False,
                                  "reason": "no encontrada"}
                      mh = _sha(str(message))
                      if mh != str(row["message_hash"]):
                          return {"valid": False,
                                  "reason": "mensaje alterado"}
                      seal = _sha(mh + "|" + str(
                          row["session_id"]) + "|"
                          + str(row["zid"]))
                      return {"valid": seal == str(
                          row["seal"])}

                  def sessions_of(self, zid):
                      rows = self._db.query_all(
                          "SELECT session_id, app, status FROM"
                          " zid_sessions WHERE zid = ? ORDER BY"
                          " rowid", (str(zid),))
                      return [{"session_id": str(
                                   r["session_id"]),
                               "app": str(r["app"]),
                               "status": str(r["status"])}
                              for r in rows]
              '''))
              out("## FIN 5 capas finas R-1/R-2/R-4/R-5/R-9")
          except Exception:
              out("## ERROR")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          finally:
              exit(0)
          PYEOF

