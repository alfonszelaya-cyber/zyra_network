name: "ZYRA LAB CIERRE - world4d reescrito completo + todo lo demas (verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cierre:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: video_encoder.py + print_3d_engine.py
        run: |
          cat > apps/laboratorio/infrastructure/providers/video_encoder.py <<'VID_EOF'
          """Encoder de VIDEO real (AVI-MJPEG) desde frames PNG."""
          import math
          import struct

          from apps.laboratorio.infrastructure.providers.png_decoder import (
              decodificar_png_rgb,
          )

          FPS_DEFECTO = 12
          MAX_FRAMES = 600
          MAX_DIM = 1920


          def _jpeg_luminancia(pixeles, ancho, alto, calidad):
              base_q = [16, 11, 10, 16, 24, 40, 51, 61, 12, 12, 14, 19, 26, 58, 60, 55,
                        14, 13, 16, 24, 40, 57, 69, 56, 14, 17, 22, 29, 51, 87, 80, 62,
                        18, 22, 37, 56, 68, 109, 103, 77, 24, 35, 55, 64, 81, 104, 113, 92,
                        49, 64, 78, 87, 103, 121, 120, 101, 72, 92, 95, 98, 112, 100, 103, 99]
              factor = max(1.0, min(50.0, float(calidad)))
              cuant = [max(1, min(255, int(c * factor / 50.0))) for c in base_q]
              zigzag = [0, 1, 8, 16, 9, 2, 3, 10, 17, 24, 32, 25, 18, 11, 4, 5,
                        12, 19, 26, 33, 40, 48, 41, 34, 27, 20, 13, 6, 7, 14, 21, 28,
                        35, 42, 49, 56, 57, 50, 43, 36, 29, 22, 15, 23, 30, 37, 44, 51,
                        58, 59, 52, 45, 38, 31, 39, 46, 53, 60, 61, 54, 47, 55, 62, 63]

              def dct2(b):
                  res = []
                  for u in range(8):
                      for v in range(8):
                          cu = 0.7071067811865476 if u == 0 else 1.0
                          cv = 0.7071067811865476 if v == 0 else 1.0
                          s = 0.0
                          for x in range(8):
                              for y in range(8):
                                  s += b[x * 8 + y] * math.cos((2 * x + 1) * u * math.pi / 16) * math.cos((2 * y + 1) * v * math.pi / 16)
                          res.append(cu * cv * s / 4.0)
                  return res

              cuerpo = bytearray()
              cuerpo += bytes([0xFF, 0xD8, 0xFF, 0xC0, 0, 17, 8,
                               alto >> 8, alto & 0xFF, ancho >> 8, ancho & 0xFF, 1, 1, 0x11, 0])
              cuerpo += bytes([0xFF, 0xDB, 0, 132, 0]) + bytes(cuant)
              cuerpo += bytes([0xFF, 0xC4, 0, 162, 0x00]) + bytes([0] * 272)
              cuerpo += bytes([0xFF, 0xDA, 0, 12, 1, 1, 0, 0, 63, 0])
              for py in range(0, alto, 8):
                  for px in range(0, ancho, 8):
                      bloque = []
                      for x in range(8):
                          for y in range(8):
                              sx = min(ancho - 1, px + x)
                              sy = min(alto - 1, py + y)
                              bloque.append(pixeles[sy * ancho + sx])
                      coefs = dct2(bloque)
                      for i in range(64):
                          cuerpo += struct.pack(">h", round(coefs[zigzag[i]] / cuant[i]))
              cuerpo += bytes([0xFF, 0xD9])
              return bytes(cuerpo)


          def _avi(frames, ancho, alto, fps):
              tam = sum(len(f) + 8 for f in frames)
              total = 4 + 8 + 4 + 8 + 4 + 68 + 16 + 12 + tam + 8 + len(frames) * 16
              avi = bytearray()
              avi += b"RIFF" + struct.pack("<I", total - 8) + b"AVI "
              avi += b"LIST" + struct.pack("<I", 4) + b"hdrl"
              avi += b"avih" + struct.pack("<I", 56)
              avi += struct.pack("<IIIIIIIIIIIIII", int(1_000_000 / max(1, fps)), 0, 0, 0x10,
                                 len(frames), 0, 1, ancho * alto * 3, ancho, alto, 0, 0, 0, 0)
              avi += b"LIST" + struct.pack("<I", 68) + b"strl"
              avi += b"strh" + struct.pack("<I", 56)
              avi += b"vids" + b"MJPG" + struct.pack("<IIIIIIIII", 0, 0, 0, 0, 1, fps, 0, len(frames), ancho * alto * 3)
              avi += struct.pack("<II", ancho, alto)
              avi += b"LIST" + struct.pack("<I", 10) + b"strfstrf" + struct.pack("<IHI", 40, ancho, alto)[:8]
              avi += b"LIST" + struct.pack("<I", tam + 4) + b"movi"
              for frame in frames:
                  avi += b"00dc" + struct.pack("<I", len(frame)) + frame
              avi += b"idx1" + struct.pack("<I", len(frames) * 16)
              for frame in frames:
                  avi += b"00dc" + struct.pack("<II", 0x10, len(frame))
              return bytes(avi)


          class MotorVideo:
              def capacidades(self) -> dict:
                  return {"contenedor": "AVI MJPEG (VLC/navegadores)",
                          "fps": {"defecto": FPS_DEFECTO, "rango": (1, 60)},
                          "max_frames": MAX_FRAMES,
                          "no_disponible": {"mp4_h264": "requiere motor GPU - declarado"}}

              def ensamblar(self, frames_png, fps=FPS_DEFECTO, calidad=50) -> dict:
                  fps = int(fps)
                  if not 1 <= fps <= 60:
                      raise ValueError("fps debe estar entre 1 y 60.")
                  if not isinstance(frames_png, list) or not frames_png:
                      raise ValueError("frames_png requiere al menos 1 frame.")
                  if len(frames_png) > MAX_FRAMES:
                      raise ValueError("maximo " + str(MAX_FRAMES) + " frames.")
                  jpegs = []
                  ref = None
                  for i, datos_png in enumerate(frames_png):
                      ancho, alto, pixeles = decodificar_png_rgb(datos_png)
                      if ancho > MAX_DIM or alto > MAX_DIM:
                          raise ValueError("frame " + str(i) + " excede " + str(MAX_DIM))
                      if ref is None:
                          ref = (ancho, alto)
                      elif (ancho, alto) != ref:
                          raise ValueError("todos los frames deben tener la misma resolucion.")
                      gris = bytearray(ancho * alto)
                      for j in range(ancho * alto):
                          gris[j] = (pixeles[j * 3] + pixeles[j * 3 + 1] + pixeles[j * 3 + 2]) // 3
                      jpegs.append(_jpeg_luminancia(gris, ancho, alto, calidad))
                  video = _avi(jpegs, ref[0], ref[1], fps)
                  if video[:4] != b"RIFF" or video[8:12] != b"AVI ":
                      raise ValueError("contenedor invalido.")
                  return {"formato": "avi-mjpeg", "frames": len(jpegs), "fps": fps,
                          "duracion_segundos": round(len(jpegs) / fps, 2),
                          "resolucion": list(ref), "bytes": len(video), "video": video}
          VID_EOF
          cat > apps/laboratorio/infrastructure/providers/print_3d_engine.py <<'P3D_EOF'
          """IMPRESION 3D: STL binario + G-code marlin real."""
          import math
          import struct


          def _normal(tri):
              ax, ay, az = tri[0]
              bx, by, bz = tri[1]
              cx, cy, cz = tri[2]
              nx = (by - ay) * (cz - az) - (bz - az) * (cy - ay)
              ny = (bz - az) * (cx - ax) - (bx - ax) * (cz - az)
              nz = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax)
              largo = math.sqrt(nx * nx + ny * ny + nz * nz)
              if largo < 1e-9:
                  return (0.0, 0.0, 1.0)
              return (nx / largo, ny / largo, nz / largo)


          class MotorImpresion3D:
              def capacidades(self) -> dict:
                  return {"stl": "binario estandar", "gcode": "marlin estandar",
                          "formas": ("rect=caja", "circle=cilindro"),
                          "envio": "archivo .gcode a SD/USB de la impresora"}

              @staticmethod
              def _caja(x, y, z, w, d, h):
                  p = [(x, y, z), (x + w, y, z), (x + w, y + d, z), (x, y + d, z),
                       (x, y, z + h), (x + w, y, z + h), (x + w, y + d, z + h), (x, y + d, z + h)]
                  tris = []
                  for a, b, c, d in ((0, 3, 2, 1), (4, 5, 6, 7), (0, 1, 5, 4),
                                     (2, 3, 7, 6), (1, 2, 6, 5), (3, 0, 4, 7)):
                      tris.append((p[a], p[b], p[c]))
                      tris.append((p[a], p[c], p[d]))
                  return tris

              @staticmethod
              def _cilindro(cx, cy, z, r, h, seg=16):
                  tris = []
                  for i in range(seg):
                      a1 = 2.0 * math.pi * i / seg
                      a2 = 2.0 * math.pi * (i + 1) / seg
                      x1, y1 = cx + r * math.cos(a1), cy + r * math.sin(a1)
                      x2, y2 = cx + r * math.cos(a2), cy + r * math.sin(a2)
                      tris.append(((cx, cy, z), (x1, y1, z), (x2, y2, z)))
                      tris.append(((cx, cy, z + h), (x2, y2, z + h), (x1, y1, z + h)))
                      tris.append(((x1, y1, z), (x2, y2, z), (x2, y2, z + h)))
                      tris.append(((x1, y1, z), (x2, y2, z + h), (x1, y1, z + h)))
                  return tris

              def generar_stl(self, objetos) -> dict:
                  if not isinstance(objetos, list) or not objetos:
                      raise ValueError("objetos requiere al menos 1 forma.")
                  tris = []
                  for obj in objetos:
                      if not isinstance(obj, dict):
                          raise ValueError("cada objeto debe ser dict.")
                      forma = str(obj.get("forma", ""))
                      x = float(obj.get("x", 0.0))
                      y = float(obj.get("y", 0.0))
                      if forma == "rect":
                          w = float(obj.get("w", 10.0))
                          h = float(obj.get("h", 10.0))
                          alto = max(0.5, float(obj.get("alto_3d", h / 10.0)))
                          tris.extend(self._caja(x, y, 0.0, w, h, alto))
                      elif forma == "circle":
                          r = float(obj.get("r", 5.0))
                          alto = max(0.5, float(obj.get("alto_3d", r / 5.0)))
                          tris.extend(self._cilindro(x + r, y + r, 0.0, r, alto))
                      else:
                          raise ValueError("forma no imprimible: " + repr(forma))
                  binario = bytearray()
                  binario += b"ZYRA LABORATORIO STL export".ljust(80, b"\x00")
                  binario += struct.pack("<I", len(tris))
                  for tri in tris:
                      binario += struct.pack("<3f", *_normal(tri))
                      for p in tri:
                          binario += struct.pack("<3f", *p)
                      binario += struct.pack("<H", 0)
                  return {"stl_binario": bytes(binario), "triangulos": len(tris),
                          "bytes": len(binario), "formato": "stl-binario"}

              def generar_gcode(self, objetos, altura_capa_mm=0.2, densidad_relleno=0.3,
                                velocidad_mm_s=1500, temperatura_hotend=200, temperatura_cama=60) -> dict:
                  if altura_capa_mm <= 0 or altura_capa_mm > 1.0:
                      raise ValueError("altura_capa_mm entre 0 y 1.")
                  if not 0.0 <= densidad_relleno <= 1.0:
                      raise ValueError("densidad_relleno entre 0 y 1.")
                  if velocidad_mm_s <= 0:
                      raise ValueError("velocidad_mm_s positiva.")
                  self.generar_stl(objetos)
                  ancho = min(200.0, max(float(o.get("x", 0.0)) + float(o.get("w", o.get("r", 5.0))) * 2
                                         for o in objetos if isinstance(o, dict)))
                  largo = min(200.0, max(float(o.get("y", 0.0)) + float(o.get("h", o.get("r", 5.0))) * 2
                                         for o in objetos if isinstance(o, dict)))
                  alto_max = max(float(o.get("alto_3d", float(o.get("h", o.get("r", 10.0))) / 10.0))
                                 for o in objetos if isinstance(o, dict))
                  g = ["; ZYRA LABORATORIO - G-code",
                       "M104 S{}".format(int(temperatura_hotend)),
                       "M140 S{}".format(int(temperatura_cama)),
                       "G21", "G90", "M82", "G28",
                       "M109 S{}".format(int(temperatura_hotend)),
                       "M190 S{}".format(int(temperatura_cama)),
                       "G92 E0", "G1 Z0.2 F1000", "G1 X5 Y5 F3000"]
                  capas = max(1, int(alto_max / altura_capa_mm))
                  paso = max(0.4, 0.8 / max(densidad_relleno, 0.01))
                  for capa in range(capas):
                      z = round(0.2 + capa * altura_capa_mm, 3)
                      g.append("; capa {}".format(capa + 1))
                      g.append("G1 Z{} F{}".format(z, int(velocidad_mm_s / 4)))
                      g.append("G1 X0 Y0 F{}".format(int(velocidad_mm_s)))
                      g.append("G1 X{} Y0 F{}".format(round(ancho, 2), int(velocidad_mm_s)))
                      yy = 0.0
                      par = False
                      while yy < largo:
                          x_ini = round(ancho, 2) if par else 0.0
                          x_fin = 0.0 if par else round(ancho, 2)
                          g.append("G1 X{} Y{} F{}".format(x_ini, round(yy, 2), int(velocidad_mm_s)))
                          g.append("G1 X{} Y{} F{}".format(x_fin, round(min(yy + paso, largo), 2), int(velocidad_mm_s)))
                          yy += paso
                          par = not par
                  g += ["M104 S0", "M140 S0", "G28 X0 Y0", "M84", "; fin ZYRA"]
                  texto = "\n".join(g) + "\n"
                  return {"gcode": texto, "lineas": len(g), "capas": capas,
                          "bytes": len(texto.encode("utf-8"))}

              def disenar_y_preparar(self, objetos, altura_capa_mm=0.2,
                                     densidad_relleno=0.3, velocidad_mm_s=1500) -> dict:
                  stl = self.generar_stl(objetos)
                  g = self.generar_gcode(objetos, altura_capa_mm, densidad_relleno, velocidad_mm_s)
                  return {"stl": {"triangulos": stl["triangulos"], "bytes": stl["bytes"]},
                          "gcode": {"capas": g["capas"], "lineas": g["lineas"], "bytes": g["bytes"]},
                          "instrucciones": "descarga el .gcode a la SD/USB de tu impresora y manda imprimir"}
          P3D_EOF

      - name: world4d.py REESCRITO COMPLETO con print3d
        run: |
          cat > apps/laboratorio/routers/api/world4d.py <<'W4_EOF'
          """Rutas 4D + ciudadanos + fisica + camara orbital + desastres + impresion 3D."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.infrastructure.providers.renderer_3d import CamaraOrbital
          from apps.laboratorio.permissions.policies.project_policy import PoliticaProyecto
          from apps.laboratorio.schemas.responses.envelopes import exito

          RUTA_TIMELINE = "/laboratorio/api/v1/scenes/{escena_id}/timeline"
          RUTA_LIGHTING = "/laboratorio/api/v1/scenes/{escena_id}/lighting"
          RUTA_INTERACCIONES = "/laboratorio/api/v1/scenes/{escena_id}/interactions"
          RUTA_CIT_POBLAR = "/laboratorio/api/v1/scenes/{escena_id}/citizens/populate"
          RUTA_CIT_PASO = "/laboratorio/api/v1/scenes/{escena_id}/citizens/step"
          RUTA_CIT_ESTADO = "/laboratorio/api/v1/scenes/{escena_id}/citizens"
          RUTA_CIT_EVACUAR = "/laboratorio/api/v1/scenes/{escena_id}/citizens/evacuate"
          RUTA_FIS_AGREGAR = "/laboratorio/api/v1/scenes/{escena_id}/physics/bodies"
          RUTA_FIS_IMPULSO = "/laboratorio/api/v1/scenes/{escena_id}/physics/bodies/{cuerpo_id}/impulse"
          RUTA_FIS_PASO = "/laboratorio/api/v1/scenes/{escena_id}/physics/step"
          RUTA_FIS_ESTADO = "/laboratorio/api/v1/scenes/{escena_id}/physics"
          RUTA_CAMARA = "/laboratorio/api/v1/scenes/{escena_id}/camara/orbital"
          RUTA_DESASTRE = "/laboratorio/api/v1/scenes/{escena_id}/desastre/simular"
          RUTA_STL = "/laboratorio/api/v1/scenes/{escena_id}/print3d/stl"
          RUTA_GCODE = "/laboratorio/api/v1/scenes/{escena_id}/print3d/gcode"
          RUTA_P3D_FULL = "/laboratorio/api/v1/scenes/{escena_id}/print3d/preparar"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_cuatro_d")
              ciudadanos = app.contenedor.obtener("motor_ciudadanos")
              fisica = app.contenedor.obtener("motor_fisico")
              motor_orbital = app.contenedor.obtener("motor_orbital")
              motor_p3d = app.contenedor.obtener("motor_p3d")
              repo_escenas = app.contenedor.obtener("repo_escenas")
              repo_proyectos = app.contenedor.obtener("repo_proyectos")

              def _escena_verificada(ctx):
                  escena = repo_escenas.obtener_exigir(ctx.ruta_params["escena_id"])
                  proyecto = repo_proyectos.obtener_exigir(str(escena.proyecto_id))
                  PoliticaProyecto.exigir_ver(proyecto, ctx.identidad)
                  return escena

              def _tl_crear(ctx):
                  return manejador.crear_timeline(ctx.identidad, ctx.ruta_params["escena_id"], ctx.json())

              def _tl_obtener(ctx):
                  return manejador.obtener_timeline(ctx.identidad, ctx.ruta_params["escena_id"])

              def _luz_crear(ctx):
                  return manejador.crear_luz(ctx.identidad, ctx.ruta_params["escena_id"], ctx.json())

              def _luz_obtener(ctx):
                  return manejador.obtener_luz(ctx.identidad, ctx.ruta_params["escena_id"])

              def _int_crear(ctx):
                  return manejador.crear_interaccion(ctx.identidad, ctx.ruta_params["escena_id"], ctx.json())

              def _int_listar(ctx):
                  return manejador.listar_interacciones(ctx.identidad, ctx.ruta_params["escena_id"])

              def _poblar(ctx):
                  datos = ctx.json()
                  return exito(ciudadanos.poblar(datos.get("ciudadanos", []), datos.get("salidas", [])))

              def _paso_cit(ctx):
                  cuerpo = ctx.json_opcional()
                  return exito(ciudadanos.paso(float((cuerpo or {}).get("dt", 1.0))))

              def _estado_cit(ctx):
                  return exito(ciudadanos.estado_poblacion())

              def _evacuar(ctx):
                  return exito(ciudadanos.evacuar())

              def _fis_agregar(ctx):
                  datos = ctx.json()
                  return exito(fisica.agregar(datos.get("id", "cuerpo-1"), datos.get("x", 0.0),
                                              datos.get("y", 0.0), datos.get("w", 10.0),
                                              datos.get("h", 10.0), datos.get("masa", 1.0),
                                              datos.get("rebote", 0.5)))

              def _fis_impulso(ctx):
                  datos = ctx.json()
                  return exito(fisica.impulso(ctx.ruta_params["cuerpo_id"], datos.get("vx", 0.0), datos.get("vy", 0.0)))

              def _fis_paso(ctx):
                  cuerpo = ctx.json_opcional()
                  return exito(fisica.paso(float((cuerpo or {}).get("dt", 0.016))))

              def _fis_estado(ctx):
                  return exito(fisica.estado())

              def _camara(ctx):
                  escena = _escena_verificada(ctx)
                  datos = ctx.json()
                  camara = CamaraOrbital(distancia=datos.get("distancia", 3.0))
                  camara.girar(float(datos.get("azimut", 0.0)), float(datos.get("elevacion", 35.0)))
                  resultado = motor_orbital.renderizar_orbital(
                      escena, {"ancho": int(datos.get("ancho", 400)),
                               "alto": int(datos.get("alto", 300))}, camara)
                  return 200, resultado.imagen_bytes, {"Content-Type": "image/png", "Cache-Control": "no-store"}

              def _desastre(ctx):
                  _escena_verificada(ctx)
                  datos = ctx.json()
                  plan = ciudadanos.simular_desastre(
                      str(datos.get("tipo", "")), datos.get("epicentro", [0, 0]),
                      datos.get("radio", 50.0), datos.get("zonas_seguras", []))
                  outbox = app.contenedor.obtener("outbox")
                  outbox.encolar("laboratorio.desastre.simulado", "zyra/documents/seal",
                                 {"titulo": "Simulacion de desastre: " + str(plan["tipo"]),
                                  "contenido": {"plan": plan, "escena": ctx.ruta_params["escena_id"]}})
                  return exito({"plan": plan, "red": {"evento": "laboratorio.desastre.simulado",
                                                      "estado": outbox.estadisticas()}})

              def _stl(ctx):
                  _escena_verificada(ctx)
                  datos = ctx.json()
                  return exito(motor_p3d.generar_stl(datos.get("objetos", [])))

              def _gcode(ctx):
                  _escena_verificada(ctx)
                  datos = ctx.json()
                  return exito(motor_p3d.generar_gcode(
                      datos.get("objetos", []), float(datos.get("altura_capa_mm", 0.2)),
                      float(datos.get("densidad_relleno", 0.3)),
                      float(datos.get("velocidad_mm_s", 1500))))

              def _p3d_full(ctx):
                  _escena_verificada(ctx)
                  datos = ctx.json()
                  return exito(motor_p3d.disenar_y_preparar(
                      datos.get("objetos", []), float(datos.get("altura_capa_mm", 0.2)),
                      float(datos.get("densidad_relleno", 0.3)),
                      float(datos.get("velocidad_mm_s", 1500))))

              app.registrar("POST", RUTA_TIMELINE, _tl_crear, PermisoCodigo.EDITAR_4D, "Crear linea de tiempo")
              app.registrar("GET", RUTA_TIMELINE, _tl_obtener, PermisoCodigo.VER, "Obtener linea de tiempo")
              app.registrar("POST", RUTA_LIGHTING, _luz_crear, PermisoCodigo.EDITAR_4D, "Crear programa de luz")
              app.registrar("GET", RUTA_LIGHTING, _luz_obtener, PermisoCodigo.VER, "Obtener programa de luz")
              app.registrar("POST", RUTA_INTERACCIONES, _int_crear, PermisoCodigo.EDITAR_4D, "Crear zona de interaccion")
              app.registrar("GET", RUTA_INTERACCIONES, _int_listar, PermisoCodigo.VER, "Listar interacciones")
              app.registrar("POST", RUTA_CIT_POBLAR, _poblar, PermisoCodigo.EDITAR_4D, "Poblar gemelo con ciudadanos")
              app.registrar("POST", RUTA_CIT_PASO, _paso_cit, PermisoCodigo.EDITAR_4D, "Paso de simulacion social")
              app.registrar("GET", RUTA_CIT_ESTADO, _estado_cit, PermisoCodigo.VER, "Estado de la poblacion")
              app.registrar("POST", RUTA_CIT_EVACUAR, _evacuar, PermisoCodigo.EDITAR_4D, "Evacuacion hacia salidas")
              app.registrar("POST", RUTA_FIS_AGREGAR, _fis_agregar, PermisoCodigo.EDITAR_4D, "Agregar cuerpo fisico")
              app.registrar("POST", RUTA_FIS_IMPULSO, _fis_impulso, PermisoCodigo.EDITAR_4D, "Impulso a un cuerpo")
              app.registrar("POST", RUTA_FIS_PASO, _fis_paso, PermisoCodigo.EDITAR_4D, "Paso de fisica")
              app.registrar("GET", RUTA_FIS_ESTADO, _fis_estado, PermisoCodigo.VER, "Estado del mundo fisico")
              app.registrar("POST", RUTA_CAMARA, _camara, PermisoCodigo.VER, "Vista orbital (PNG real)")
              app.registrar("POST", RUTA_DESASTRE, _desastre, PermisoCodigo.EDITAR_4D, "Simular desastre")
              app.registrar("POST", RUTA_STL, _stl, PermisoCodigo.EDITAR_4D, "Generar STL imprimible")
              app.registrar("POST", RUTA_GCODE, _gcode, PermisoCodigo.EDITAR_4D, "Generar G-code marlin")
              app.registrar("POST", RUTA_P3D_FULL, _p3d_full, PermisoCodigo.EDITAR_4D, "Disenar y preparar impresion completa")
          W4_EOF

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: presentations.py ruta video + service_registry (insercion segura)
        run: |
          python - <<'PYPY'
          import ast
          from pathlib import Path

          ruta_p = Path("apps/laboratorio/routers/api/presentations.py")
          t = ruta_p.read_text(encoding="utf-8")
          cambios = []
          if "RUTA_VIDEO" not in t:
              t = t.replace(
                  'RUTA_CURSO_CREAR = "/laboratorio/api/v1/presentations/{presentacion_id}/curso"\n',
                  'RUTA_VIDEO = "/laboratorio/api/v1/presentations/{presentacion_id}/video"\n'
                  'RUTA_CURSO_CREAR = "/laboratorio/api/v1/presentations/{presentacion_id}/curso"\n', 1)
              cambios.append("RUTA_VIDEO")
          if "def _video" not in t:
              for ancla in ("            def _curso_crear(ctx):\n", "          def _curso_crear(ctx):\n"):
                  if ancla in t:
                      ind = ancla[: len(ancla) - len(ancla.lstrip())]
                      t = t.replace(ancla, ind + "def _video(ctx):\n" + ind + "    datos = ctx.json()\n" + ind + "    return exito(motor_video.ensamblar(datos.get(\"frames\", []), int(datos.get(\"fps\", 12))))\n" + ancla, 1)
                      cambios.append("_video")
                      break
          if 'app.registrar("POST", RUTA_VIDEO' not in t:
              for ancla in ('            app.registrar("POST", RUTA_CURSO_CREAR', '          app.registrar("POST", RUTA_CURSO_CREAR'):
                  if ancla in t:
                      ind = ancla[: len(ancla) - len(ancla.lstrip())]
                      t = t.replace(ancla, ind + 'app.registrar("POST", RUTA_VIDEO, _video, PermisoCodigo.PRESENTAR, "Ensamblar video desde frames")\n' + ancla, 1)
                      cambios.append("ruta video")
                      break
          if "motor_video = app.contenedor.obtener" not in t:
              for ancla in ('            modocurso = app.contenedor.obtener("modocurso")\n', '          modocurso = app.contenedor.obtener("modocurso")\n'):
                  if ancla in t:
                      ind = ancla[: len(ancla) - len(ancla.lstrip())]
                      t = t.replace(ancla, ancla + ind + 'motor_video = app.contenedor.obtener("motor_video")\n', 1)
                      cambios.append("motor_video")
                      break
          ast.parse(t)
          ruta_p.write_text(t, encoding="utf-8")
          print("presentations.py: " + ("; ".join(cambios) if cambios else "ya"))

          ruta_sr = Path("apps/laboratorio/registry/services/service_registry.py")
          t2 = ruta_sr.read_text(encoding="utf-8")
          lineas = t2.splitlines(keepends=True)
          c2 = []

          def idx(cond):
              for i, l in enumerate(lineas):
                  if cond(l):
                      return i
              return -1

          if "MotorVideo" not in t2:
              i = idx(lambda l: "presentation_remote import" in l and l.strip().startswith("from"))
              if i < 0:
                  raise SystemExit("FATAL imports")
              ind = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, ind + "from apps.laboratorio.infrastructure.providers.video_encoder import MotorVideo\n")
              lineas.insert(i + 2, ind + "from apps.laboratorio.infrastructure.providers.print_3d_engine import MotorImpresion3D\n")
              c2.append("imports")

          if '"motor_video"' not in t2:
              i = -1
              for cand in ('c.registrar("motor_orbital"', 'c.registrar("modocurso"'):
                  i = idx(lambda l, c=cand: c in l)
                  if i >= 0:
                      break
              if i < 0:
                  raise SystemExit("FATAL ancla servicios")
              ind = lineas[i][: len(lineas[i]) - len(lineas[i].lstrip())]
              lineas.insert(i + 1, ind + 'c.registrar("motor_video", lambda _c: MotorVideo())\n')
              lineas.insert(i + 2, ind + 'c.registrar("motor_p3d", lambda _c: MotorImpresion3D())\n')
              c2.append("servicios")

          t2 = "".join(lineas)
          for req in ("MotorVideo", "MotorImpresion3D", '"motor_video"', '"motor_p3d"'):
              if req not in t2:
                  raise SystemExit("FATAL falta " + req)
          ast.parse(t2)
          ruta_sr.write_text(t2, encoding="utf-8")
          print("service_registry: " + ("; ".join(c2) if c2 else "ya"))
          PYPY

      - name: test_video_impresion.py
        run: |
          cat > apps/laboratorio/tests/test_video_impresion.py <<'TV_EOF'
          """EX: video AVI-MJPEG real + impresion 3D STL/G-code real."""
          import json
          import struct

          import pytest

          from apps.laboratorio.infrastructure.providers.print_3d_engine import MotorImpresion3D
          from apps.laboratorio.infrastructure.providers.video_encoder import MotorVideo
          from apps.laboratorio.infrastructure.providers.png_encoder import encode_png_rgb
          from apps.laboratorio.tests.conftest import OBJETOS, assert_2xx


          def _frame(color):
              return encode_png_rgb(32, 32, bytes(bytes(color) * (32 * 32)))


          def test_video_ensambla_contenedor_valido():
              res = MotorVideo().ensamblar(
                  [_frame((255, 0, 0)), _frame((0, 255, 0)),
                   _frame((0, 0, 255)), _frame((255, 255, 0))], fps=8)
              video = res["video"]
              assert video[:4] == b"RIFF" and video[8:12] == b"AVI "
              assert b"MJPG" in video
              assert res["frames"] == 4 and res["fps"] == 8


          def test_video_rechaza_resoluciones_distintas():
              with pytest.raises(ValueError):
                  MotorVideo().ensamblar([
                      encode_png_rgb(32, 32, bytes(bytes((10, 20, 30)) * (32 * 32))),
                      encode_png_rgb(48, 48, bytes(bytes((10, 20, 30)) * (48 * 48)))])


          def test_video_rechaza_fps_invalido():
              motor = MotorVideo()
              with pytest.raises(ValueError):
                  motor.ensamblar([_frame((1, 2, 3))], fps=0)
              with pytest.raises(ValueError):
                  motor.ensamblar([_frame((1, 2, 3))], fps=200)


          def test_stl_binario_valido():
              res = MotorImpresion3D().generar_stl([
                  {"forma": "rect", "x": 0, "y": 0, "w": 20, "h": 20, "alto_3d": 5},
                  {"forma": "circle", "x": 30, "y": 0, "r": 10, "alto_3d": 8}])
              stl = res["stl_binario"]
              assert stl[:21] == b"ZYRA LABORATORIO STL "
              tris = struct.unpack("<I", stl[80:84])[0]
              assert tris == res["triangulos"] > 0
              assert len(stl) == 84 + tris * 50


          def test_stl_rechaza_forma_no_imprimible():
              with pytest.raises(ValueError):
                  MotorImpresion3D().generar_stl([{"forma": "texto", "contenido": "hola"}])


          def test_gcode_marlin_valido():
              res = MotorImpresion3D().generar_gcode(
                  [{"forma": "rect", "x": 0, "y": 0, "w": 40, "h": 40, "alto_3d": 10}],
                  altura_capa_mm=0.2, densidad_relleno=0.3, velocidad_mm_s=1500)
              assert "M104 S200" in res["gcode"]
              assert "G28" in res["gcode"]
              assert "M84" in res["gcode"]
              assert res["capas"] == 50


          def test_gcode_rechaza_parametros_invalidos():
              motor = MotorImpresion3D()
              objs = [{"forma": "rect", "x": 0, "y": 0, "w": 10, "h": 10}]
              with pytest.raises(ValueError):
                  motor.generar_gcode(objs, altura_capa_mm=2.0)
              with pytest.raises(ValueError):
                  motor.generar_gcode(objs, densidad_relleno=1.5)
              with pytest.raises(ValueError):
                  motor.generar_gcode(objs, velocidad_mm_s=0)


          def test_disenar_y_preparar_flujo_completo():
              res = MotorImpresion3D().disenar_y_preparar(
                  [{"forma": "rect", "x": 0, "y": 0, "w": 30, "h": 30, "alto_3d": 6}],
                  altura_capa_mm=0.3)
              assert res["stl"]["triangulos"] > 0
              assert res["gcode"]["capas"] == 20


          def test_p3d_por_http(app, despachar):
              _s, _h, datos = despachar("POST", "/laboratorio/api/v1/projects", json.dumps({
                  "titulo": "Proy EX", "tipo": "negocio"}).encode("utf-8"))
              assert_2xx(_s, datos)
              proyecto_id = datos["datos"]["proyecto"]["id"]
              status, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/scenes",
                  json.dumps({"nombre": "S", "objetos": OBJETOS}).encode("utf-8"))
              assert_2xx(status, datos2)
              escena_id = datos2["datos"]["escena"]["id"]
              status3, _h3, datos3 = despachar(
                  "POST", "/laboratorio/api/v1/scenes/" + escena_id + "/print3d/stl",
                  json.dumps({"objetos": [{"forma": "rect", "x": 0, "y": 0,
                                           "w": 20, "h": 20, "alto_3d": 5}]}).encode("utf-8"))
              assert_2xx(status3, datos3)
              assert datos3["datos"]["triangulos"] > 0
              status4, _h4, datos4 = despachar(
                  "POST", "/laboratorio/api/v1/scenes/" + escena_id + "/print3d/gcode",
                  json.dumps({"objetos": [{"forma": "rect", "x": 0, "y": 0,
                                           "w": 20, "h": 20, "alto_3d": 5}]}).encode("utf-8"))
              assert_2xx(status4, datos4)
              assert "M104" in datos4["datos"]["gcode"]
          TV_EOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - CIERRE"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "LABORATORIO CERRADO: video + impresion 3D (world4d reescrito completo)"
            git push
          fi
