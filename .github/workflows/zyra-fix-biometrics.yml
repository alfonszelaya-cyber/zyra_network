name: ZYRA LABORATORIO - Lote 10A (Fase 10 final - gobierno, idempotencia y cierre)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Gate de sintaxis (ast.parse)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          errores = []
          for p in pathlib.Path('.').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
              except SyntaxError as e:
                  errores.append(f"{p}:{e.lineno} {e.msg}")
          if errores:
              print("ERRORES DE SINTAXIS:")
              print("\n".join(errores))
              sys.exit(1)
          print("OK - sintaxis limpia en todo el repositorio")
          PY

      - name: Ejecutar tests de las 5 apps
        run: |
          python - <<'PY'
          import subprocess, sys, pathlib
          carpetas = sorted(
              {p for p in pathlib.Path('.').rglob('tests')
               if p.is_dir() and '.git' not in p.parts and '__pycache__' not in p.parts}
          )
          if not carpetas:
              print("No se encontraron carpetas tests/")
              sys.exit(1)
          fallos = []
          for c in carpetas:
              print(f"=== Ejecutando {c} ===")
              r = subprocess.run([sys.executable, '-m', 'pytest', str(c), '-q', '--tb=short'])
              if r.returncode != 0:
                  fallos.append(str(c))
          if fallos:
              print("TESTS EN FALLO:")
              print("\n".join(fallos))
              sys.exit(1)
          print("TODOS LOS TESTS EN VERDE")
          PY

      - name: Commit y push solo si esta verde
        run: |
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "Lote 10A - fase 10 final - gobierno idempotencia y cierre (verde)"
            git push
          fi
