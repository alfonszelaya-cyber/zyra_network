              '                self._send(400, "application/json", json.dumps({"ok": False, "error": "Falta nombre, clave (min 8), documento o selfie"}).encode())',
              '                return',
              '            ok_r, dr, er = _SimpleClient(ZYRA_URL).post("/identity/enroll", {"kind": "person", "name": nombre, "display_name": nombre, "actor": os.environ.get("ZYRA_ENROLL_ACTOR", "superapp"), "doc_image_b64": db64, "selfie_image_b64": sb64})',
              '            if not ok_r:',
              '                self._send(502, "application/json", json.dumps({"ok": False, "error": "La Red responde: " + str(er)[:250]}).encode())',
              '                return',
              '            zid = ""',
              '            if isinstance(dr, dict):',
              '                dx = dr.get("data") or dr',
              '                if isinstance(dx, dict):',
              '                    zid = str(dx.get("zid") or dx.get("identity_id") or dx.get("id") or "")',
              '            if not zid:',
              '                self._send(500, "application/json", json.dumps({"ok": False, "error": "La Red no devolvio ZID"}).encode())',
              '                return',
              '            import secrets as _sc, hashlib as _hs, sqlite3 as _sq',
              '            sal = _sc.token_hex(16)',
              '            hc = _hs.sha256((sal + clave).encode()).hexdigest()',
              '            con = _sq.connect(str(DATA_DIR / "credenciales.db"))',
              '            con.execute("CREATE TABLE IF NOT EXISTS credenciales (zid TEXT PRIMARY KEY, sal TEXT, hash TEXT)")',
              '            con.execute("INSERT OR REPLACE INTO credenciales VALUES (?, ?, ?)", (zid, sal, hc))',
              '            con.commit()',
              '            con.close()',
              '            self._send(200, "application/json", json.dumps({"ok": True, "zid": zid}).encode())',
              '            return',
              '',
              '        if path == "/mpe/register":',
              '            self._send_html(200, "<!doctype html><html lang=\'es\'><head><meta charset=\'utf-8\'><meta http-equiv=\'refresh\' content=\'0;url=/registro\'><title>ZYRA</title></head><body></body></html>")',
              '            return'])
          VER = '\n'.join([
              '        if path == "/version":',
              '            try:',
              '                dv = self._read_portal("version.txt")',
              '            except Exception:',
              '                dv = b"0"',
              '            self._send(200, "text/plain; charset=utf-8", dv)',
              '            return'])
          cnt = {'est1': t0.count(EST1), 'est2': t0.count(EST2),
                 'entrar': t0.count(ENT0),
                 'verify': t0.count('        if path == "/verify":'),
                 'verificar': t0.count('        if path == "/verificar":'),
                 'health': t0.count('        if path == "/health":'),
                 'regnuevo_ya': t0.count('/registro/nuevo'),
                 'version_ya': t0.count('        if path == "/version":')}
          for k, v in cnt.items():
              add('- %s: %d' % (k, v))
          okA = (cnt['est1'] == 1 and cnt['est2'] == 1 and cnt['entrar'] == 1
                 and cnt['verify'] == 1 and cnt['verificar'] == 1 and cnt['health'] == 1
                 and cnt['regnuevo_ya'] == 0 and cnt['version_ya'] == 0)
          gate('anclas_exactas', okA)
          if not okA:
              add('**ANCHORS NO UNICOS: nada editado.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('faseD9.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS - sin cambios')
          t = t0
          t = t.replace(EST1, EST1N, 1)
          t = t.replace(EST2, "                estado = ''", 1)
          t = t.replace(ENT0, ENT1, 1)
          p = t.find('        if path == "/verificar":')
          t = t[:p] + VER + '\n' + t[p:]
          p = t.find('        if path == "/verify":')
          t = t[:p] + REGN + '\n' + t[p:]
          SPY.write_text(t, encoding='utf-8')
          add('- ediciones aplicadas.')
          gate('ediciones', True)
          add('')
          add('## F5. Compilacion')
          add('')
          try:
              py_compile.compile(str(SPY), doraise=True)
              add('- superapp.py: OK')
              gate('compila', True)
          except Exception as e:
              add('- FALLO: %s' % e)
              gate('compila', False)
          add('')
          add('## F6. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zd9s', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/sd9', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t1 = time.time()
          while time.time() - t1 < 40:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t1 = time.time()
              while time.time() - t1 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cu = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cu).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps', spv and len(apps) == 8)
          if spv:
              st, _h, b = pedir(BSP + '/')
              gate('pantalla_limpia', st == 200 and 'Sin sesion' not in b
                   and 'btn-instalar' in b and 'banner-act' in b)
              st, _h, b = pedir(BSP + '/version')
              gate('version_sirve', st == 200 and 'ZYRA-' in b)
              cuerpo = json.dumps({'nombre': 'Prima de Prueba', 'clave': 'clave-prima-99',
                                   'doc_image_b64': DOC, 'selfie_image_b64': SEL}).encode()
              st, _h, b = pedir(BSP + '/registro/nuevo', data=cuerpo)
              try:
                  j = json.loads(b)
                  zid = j.get('zid', '')
                  err = str(j.get('error', ''))[:250]
              except Exception:
                  zid, err = '', b[:250]
              add('- registro prima -> %s | zid=%s | err=%s' % (st, zid or '-', err))
              bio_real = any(x in err.lower() for x in ('rostro', 'face', 'no face', 'detect',
                                                        'liveness', 'template', 'calid', 'blur'))
              gate('registro_fluye', (st == 200 and zid) or (st == 502 and bio_real))
              if zid:
                  st, h, _b = pedir(BSP + '/entrar',
                                    data=('zid=%s&clave=clave-prima-99' % zid).encode())
                  sc = (h.get('Set-Cookie') or '').split(';')[0] if h else ''
                  gate('prima_entrar', st == 303 and sc)
                  if sc:
                      st, _h, b = pedir(BSP + '/', {'Cookie': sc})
                      gate('prima_conectada', ('Conectado: ' + zid) in b)
                      st, _h, b = pedir(BSP + '/laboratorio/ui', {'Cookie': sc})
                      gate('prima_en_lab', st == 200)
              st, _h, _b = pedir(BSP + '/entrar',
                                 data=('zid=%s&clave=malaclave1' % (zid or 'Z-X')).encode())
              gate('clave_mala_403', st == 403)
              st, _h, b = pedir(BSP + '/mpe/register')
              gate('mpe_redirige', st == 200 and '/registro' in b)
              st, _h, _b = pedir(BSP + '/laboratorio/ui')
              gate('guard_intacto', st == 401)
          else:
              for g in ('pantalla_limpia', 'version_sirve', 'registro_fluye', 'prima_entrar',
                        'prima_conectada', 'prima_en_lab', 'clave_mala_403', 'mpe_redirige',
                        'guard_intacto'):
                  gate(g, False)
          add('')
          crit = ('anclas_exactas', 'compila', 'ocho_apps', 'pantalla_limpia',
                  'version_sirve', 'guard_intacto', 'mpe_redirige')
          fallos = [n for n, o in GATES if not o]
          if any(n in fallos for n in crit):
              revertir()
              add('## REVERSION APLICADA - restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in crit))
              add('')
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          fallos = [n for n, o in GATES if not o]
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D9 VERIFICADO. Commit.**')
              add('')
              add('El registro queda cableado de punta a punta y el proveedor facial se demuestra en CI.')
              add('Para activarlo en Render (lanzzamiento): plan con RAM suficiente + las librerias faciales en requirements-render.txt. Decision del dueno.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('faseD9.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D9 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(D9): registro completo cableado + proveedor facial probado en CI"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faseD9-zyra
          path: faseD9.json
          if-no-files-found: ignore
