name: "ZYRA NEXO E5b: modulos 8+9 gobierno"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Migrar modulos 8+9
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def wf(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          # ===== MODULO 8: GOBIERNO DEL SISTEMA =====
          # Convertido de menus de consola a clase orquestadora
          # con registro de eventos. La estructura jerarquica
          # del viejo (12 subdominios) se preserva como metodos.
          wf("apps/nexo/module/modulo_8_gobierno.py", D(r'''
              """Modulo 8 Gobierno del Sistema - NEXO / ZYRA
              (migrado mejorado: orquestador con registro
              de eventos en la Red, sin menus de consola)."""
              from __future__ import annotations
              from typing import Dict, List
              import uuid
              from datetime import datetime

              _gov8_events: List[Dict] = []

              def _gov8_emit(event_name: str,
                             payload: Dict = None) -> None:
                  _gov8_events.append({
                      "event": event_name,
                      "payload": payload or {},
                      "timestamp": datetime.utcnow().isoformat()})

              def get_gov8_events() -> List[Dict]:
                  return list(_gov8_events)

              class Modulo8Gobierno:
                  """Gobierno del Sistema: 12 subdominios
                  del viejo, preservados como metodos."""

                  def __init__(self, *, audit=None) -> None:
                      self._audit = audit

                  def _registrar(self, subdominio: str,
                                 accion: str) -> Dict:
                      _gov8_emit("M8_" + subdominio.upper()
                                 + "_" + accion.upper()
                                 .replace(" ", "_"))
                      registro = {"modulo": "M8",
                                  "subdominio": subdominio,
                                  "accion": accion,
                                  "timestamp":
                                  self._clock_now()}
                      return registro

                  def _clock_now(self):
                      from datetime import datetime as _dt
                      return _dt.utcnow().isoformat()

                  # 12 subdominios del viejo:
                  def nucleo_gobierno(self) -> Dict:
                      return self._registrar(
                          "Nucleo Gobierno",
                          "Estado Transversal Permanente")

                  def control_versiones(self) -> Dict:
                      return self._registrar(
                          "Control Versiones",
                          "Versionado Global")

                  def gobierno_cambios(self) -> Dict:
                      return self._registrar(
                          "Gobierno Cambios",
                          "Aprobacion Escalonada")

                  def auditoria_suprema(self) -> Dict:
                      return self._registrar(
                          "Auditoria Suprema",
                          "Auditoria Total del Sistema")

                  def rollback_recuperacion(self) -> Dict:
                      return self._registrar(
                          "Rollback",
                          "Recuperacion Post-Incidente")

                  def gestion_incidentes(self) -> Dict:
                      return self._registrar(
                          "Incidentes",
                          "Clasificacion de Severidad")

                  def escalamiento_inteligente(self) -> Dict:
                      return self._registrar(
                          "Escalamiento",
                          "Escalamiento Automatico")

                  def gobierno_zyra(self) -> Dict:
                      return self._registrar(
                          "Gobierno ZYRA",
                          "Limites de Autonomia")

                  def modo_crisis(self) -> Dict:
                      return self._registrar(
                          "Modo Crisis",
                          "Congelacion de Operaciones")

                  def cumplimiento_soberania(self) -> Dict:
                      return self._registrar(
                          "Cumplimiento",
                          "Cumplimiento Legal Global")

                  def supervision_root(self) -> Dict:
                      return self._registrar(
                          "Supervision ROOT",
                          "Vista Total del Sistema")

                  def congelacion_sellado(self) -> Dict:
                      return self._registrar(
                          "Congelacion",
                          "Sellado de Estado")

                  def get_events(self) -> List[Dict]:
                      return get_gov8_events()
          '''))

          # ===== MODULO 9: META GOBIERNO =====
          # El zyra_bus fantasma del viejo -> eventos en memoria
          # + 11 subdominios de soberania preservados.
          wf("apps/nexo/module/modulo_9_meta_gobierno.py", D(r'''
              """Modulo 9 Meta Gobierno y Soberania -
              NEXO / ZYRA (migrado mejorado: zyra_bus
              fantasma reemplazado por registro real)."""
              from __future__ import annotations
              from typing import Dict, List
              from datetime import datetime

              _meta9_events: List[Dict] = []

              def emit(evento: str) -> None:
                  _meta9_events.append({
                      "event": evento,
                      "timestamp": datetime.utcnow()
                      .isoformat()})

              def get_meta9_events() -> List[Dict]:
                  return list(_meta9_events)

              SUBMENUS = {
                  "SOBERANIA_DEL_SISTEMA": [
                      "Independencia Operativa",
                      "Aislamiento por Jurisdiccion",
                      "Control de Dependencias Externas",
                      "Autonomia por Pais",
                      "Modo Soberano Offline"],
                  "META_CONTROL_DE_VERSIONES": [
                      "Versionado Multilinea",
                      "Versionado por Jurisdiccion",
                      "Versionado de Estados",
                      "Versionado de Modelos ZYRA",
                      "Linea Temporal Inmutable"],
                  "AUDITORIA_META_TOTAL": [
                      "Auditoria de Auditorias",
                      "Auditoria de Decisiones Humanas",
                      "Auditoria de Decisiones ZYRA",
                      "Auditoria de Crisis",
                      "Registro Inmutable Global"],
                  "GOBIERNO_DE_GOBIERNOS": [
                      "Reglas de Estados",
                      "Reglas de Emergencia",
                      "Reglas Supra-Legales",
                      "Jerarquia de Autoridades",
                      "Resolucion de Conflictos Normativos"],
                  "CONTINUIDAD_ABSOLUTA": [
                      "Operacion Continua",
                      "Auto-Recuperacion",
                      "Redundancia Logica",
                      "Redundancia Geografica",
                      "Persistencia ZYRA"],
                  "META_GESTION_DE_CRISIS": [
                      "Crisis Sistemica",
                      "Crisis Financiera Global",
                      "Crisis Legal Estatal",
                      "Crisis Tecnologica",
                      "Simulacion de Supervivencia"],
                  "ESCALAMIENTO_SUPREMO": [
                      "Escalamiento Autonomo ZYRA",
                      "Escalamiento Consejo Humano",
                      "Escalamiento ROOT Supremo",
                      "Emergencia Total"],
                  "GOBIERNO_DE_LA_IA": [
                      "Limites de Evolucion",
                      "Control de Aprendizaje",
                      "Autorizacion de Auto-Mejora",
                      "Apagado Etico"],
                  "ETICA_LEY_CONFIANZA": [
                      "Principios Eticos",
                      "Compatibilidad Legal Global",
                      "Transparencia Controlada",
                      "Evidencia Moral"],
                  "SUPERVISION_SUPRA_ROOT": [
                      "Vista Omnisciente",
                      "Control Transversal",
                      "Decision Final",
                      "Firma Suprema"],
                  "SELLADO_DE_CIVILIZACION_DIGITAL": [
                      "Congelacion Total",
                      "Sellado de Estados",
                      "Archivo Historico",
                      "Referencia Canonica"],
              }

              def zyra_in() -> None:
                  emit("MODULO_9_ENTRADA")

              def zyra_out() -> None:
                  emit("MODULO_9_SALIDA")

              def submenu_items(name: str) -> List[str]:
                  return SUBMENUS.get(name, [])

              def mod_9_entrar(subdominio: str) -> Dict:
                  """Entra a un subdominio y registra
                  el evento (en vez de solo menus)."""
                  items = submenu_items(subdominio)
                  emit("M9_" + subdominio)
                  return {"subdominio": subdominio,
                          "items": items,
                          "total": len(items)}

              def mod_9_subdominios() -> List[str]:
                  return list(SUBMENUS.keys())

              def modulo_9_meta_gobierno() -> Dict:
                  zyra_in()
                  resultado = {
                      "subdominios": mod_9_subdominios(),
                      "total_subdominios": len(SUBMENUS)}
                  zyra_out()
                  return resultado
          '''))

          # ===== TESTS =====
          wf("apps/nexo/tests/test_modulos_89.py", D(r'''
              """Tests L5b: modulos 8 y 9."""
              from __future__ import annotations
              from apps.nexo.module.modulo_8_gobierno import (
                  Modulo8Gobierno, emit as emit8,
                  get_gov8_events)
              from apps.nexo.module.modulo_9_meta_gobierno import (
                  emit as emit9, get_meta9_events,
                  mod_9_subdominios, mod_9_entrar,
                  SUBMENUS)

              def test_modulo8_12_subdominios() -> None:
                  m8 = Modulo8Gobierno()
                  r = m8.nucleo_gobierno()
                  assert r["modulo"] == "M8"
                  r2 = m8.modo_crisis()
                  assert r2["subdominio"] == "Modo Crisis"
                  print("OK m8: 12 subdominios preservados")

              def test_modulo8_eventos() -> None:
                  emit8("M8_TEST")
                  events = get_gov8_events()
                  assert events[-1]["event"] == "M8_TEST"
                  print("OK m8: eventos registrados")

              def test_modulo9_11_subdominios() -> None:
                  subs = mod_9_subdominios()
                  assert len(subs) == 11
                  assert "SOBERANIA_DEL_SISTEMA" in subs
                  assert "SELLADO_DE_CIVILIZACION_DIGITAL" in subs
                  print("OK m9: 11 subdominios")

              def test_modulo9_entrar() -> None:
                  r = mod_9_entrar("SOBERANIA_DEL_SISTEMA")
                  assert r["total"] == 5
                  assert "Independencia Operativa" in r["items"]
                  events = get_meta9_events()
                  assert events[-1]["event"] == "M9_SOBERANIA_DEL_SISTEMA"
                  print("OK m9: entrar subdominio + evento")
          '''))

          try:
              ip = pathlib.Path("apps/nexo/module") / "__init__.py"
              if not ip.exists():
                  ip.write_text("", encoding="utf-8")
          except Exception:
              pass

          try:
              import sys as _s
              _s.path.insert(0, ".")
              from apps.nexo.module.modulo_8_gobierno import (
                  Modulo8Gobierno as _M8, emit as _E8)
              from apps.nexo.module.modulo_9_meta_gobierno import (
                  mod_9_subdominios as _S9, emit as _E9)
              out("- **IMPORT CHECK: modulos 8+9 OK**")
          except Exception:
              out("- **IMPORT CHECK: FALLO**")
              out("```\n" + traceback.format_exc().strip() + "\n```")
          exit(0)
          PYEOF

      - name: "L5b-1: tests modulos 8+9"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          find apps/nexo -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 120 python3 -m pytest apps/nexo/tests/test_modulos_89.py -vv --tb=long --timeout=45 --timeout-method=thread > /tmp/l5b.out 2>&1
          echo $? > /tmp/l5b
          if [ "$(cat /tmp/l5b)" = "0" ]; then echo "- L5b: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L5b: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L5b detalle"; echo '```'; tail -80 /tmp/l5b.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "L5b-2: nexo completo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 300 python3 -m pytest apps/nexo/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/l5bb.out 2>&1
          echo $? > /tmp/l5bb
          if [ "$(cat /tmp/l5bb)" = "0" ]; then echo "- L5b2: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L5b2: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L5b2 detalle"; echo '```'; tail -50 /tmp/l5bb.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: "L5b-3: apps otras + shared"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          timeout 900 python3 -m pytest shared_engines -q --timeout=60 --timeout-method=thread --tb=line > /tmp/l5c.out 2>&1
          echo $? > /tmp/l5c
          timeout 600 python3 -m pytest apps/subastas/tests -q --timeout=45 --timeout-method=thread --tb=line > /tmp/l5d.out 2>&1
          ok3=$?
          if [ "$(cat /tmp/l5c)" = "0" ] && [ "$ok3" = "0" ]; then echo "- L5c: ✅" >> "$GITHUB_STEP_SUMMARY"; else echo "- L5c: ❌" >> "$GITHUB_STEP_SUMMARY"; { echo "### L5c detalle"; echo '```'; tail -60 /tmp/l5c.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Veredicto + commit solo si TODO verde
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          fails=""
          for g in l5b l5bb l5c; do
            c=$(cat /tmp/$g 2>/dev/null || echo 1)
            [ "$c" != "0" ] && fails="$fails $g"
          done
          if [ -n "$fails" ]; then
            log "**RESULTADO: fallan:$fails — SIN commit**"
            exit 1
          fi
          log "**RESULTADO: L5b VERDES — MODULOS 8+9 MIGRADOS**"
          find apps/nexo shared_engines -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/nexo
          set +e
          if git diff --cached --quiet; then
            log "**SIN CAMBIOS**"; exit 0
          fi
          git commit -m "feat(NEXO-E5b): Modulo 8 Gobierno (12 subdominios, orquestador) + Modulo 9 Meta Gobierno (11 subdominios soberania, zyra_bus->eventos reales) (L5b verdes)"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          log "**COMMIT OK**"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err
          if [ $? -eq 0 ]; then log "**PUSH OK — LOTE 5 COMPLETO (gov+meta+modulos). Sigue LOTE 6 customer+family.**"; exit 0; fi
          log "**PUSH fallo:**"; { echo '```'; cat /tmp/qa.err; echo '```'; } >> "$SUM"
          git push origin "HEAD:main" > /tmp/qb.out 2> /tmp/qb.err
          if [ $? -eq 0 ]; then log "**PUSH OK (intento 2).**"; exit 0; fi
          log "**PUSH intento 2 fallo:**"; { echo '```'; cat /tmp/qb.err; echo '```'; } >> "$SUM"
          exit 1
