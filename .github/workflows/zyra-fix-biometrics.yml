/* ================= camara: preview SIEMPRE chico ================= */
function letraDe(psId){ return ({'2':'F','3':'A','4':'S'})[psId]||'F'; }
function findVideo(psId){
  var letra=letraDe(psId);
  var ids=['vz'+letra,'vd'+letra,'v'+letra], i;
  var cont=$('ps'+psId);
  for(i=0;i<ids.length;i++){
    var cand=$(ids[i]);
    if(cand && cand.tagName==='VIDEO'){ return cand; }
  }
  if(cont){
    var v=cont.querySelector('video');
    if(v){ return v; }
  }
  return null;
}
function estiloChico(v){
  if(!v){ return; }
  v.style.maxWidth='280px';
  v.style.width='100%';
  v.style.maxHeight='320px';
  try{ v.style.aspectRatio='3 / 4'; }catch(e){}
  v.style.objectFit='cover';
  v.style.borderRadius='12px';
  v.style.background='#000';
  v.style.display='block';
  v.style.margin='0 auto';
}
function abrirCam(psId, facing, stId, capId){
  var v=findVideo(psId);
  if(!v){ msg(stId,'No encontre el video de la camara en la pagina.', '#c00'); return Promise.reject(new Error('sin video')); }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg(stId,'Tu navegador no permite camara. Usa la opcion de galeria.', '#c00');
    return Promise.reject(new Error('sin camara'));
  }
  pararCam(psId);
  msg(stId,'Pidiendo permiso de camara...','');
  return navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}}}).then(function(st){
    streams[psId]=st;
    v.srcObject=st;
    try{ v.setAttribute('playsinline','playsinline'); }catch(e){}
    v.muted=true;
    var p=v.play(); if(p&&p.catch){ p.catch(function(){}); }
    estiloChico(v);
    var cap=$(capId);
    if(cap){ cap.disabled=false; cap.style.display=''; cap.style.visibility='visible'; cap.style.pointerEvents='auto'; cap.style.position=cap.style.position||'relative'; cap.style.zIndex='9999'; }
    var OV={'2':'ovF','3':'ovA','4':'ovS'};
    var ov=$(OV[psId]);
    if(ov){ ov.style.pointerEvents='none'; }
    msg(stId,'Camara lista. Pon el documento dentro del marco y toca CAPTURAR.','#080');
    return true;
  }).catch(function(e){
    msg(stId,'No pude abrir la camara ('+(e&&e.name?e.name:'error')+'). Puedes usar la galeria o revisa el permiso.','#c00');
    throw e;
  });
}
function pararCam(psId){
  var st=streams[psId];
  if(st){
    try{ st.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); }catch(e){}
    streams[psId]=null;
  }
}
function pararTodas(){ var k; for(k in streams){ pararCam(k); } }
function capturarVideo(psId, maxDim){
  var v=findVideo(psId);
  if(!v || !v.videoWidth){ return null; }
  var w=v.videoWidth, h=v.videoHeight;
  var sc=Math.min(1,(maxDim||1024)/Math.max(w,h));
  var c=document.createElement('canvas');
  c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  var d=c.toDataURL('image/jpeg',0.85);
  pararCam(psId);
  return d;
}
function downscale(dataUrl, maxDim){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){
      var sc=Math.min(1,(maxDim||1024)/Math.max(im.width,im.height));
      var c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*sc));
      c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.85));
    };
    im.onerror=function(){ res(dataUrl); };
    im.src=dataUrl;
  });
}
function archivoADatos(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(String(fr.result)); };
    fr.onerror=function(){ rej(new Error('no pude leer el archivo')); };
    fr.readAsDataURL(file);
  });
}

/* ================= OCR con cache ================= */
var cacheOcr={};
function hacerOcr(dataUrl){
  if(cacheOcr[dataUrl]){ return Promise.resolve(cacheOcr[dataUrl]); }
  if(typeof Tesseract==='undefined' || !Tesseract.recognize){
    return Promise.reject(new Error('OCR no disponible, revisa tu internet'));
  }
  return Tesseract.recognize(dataUrl,'spa+eng',{logger:function(){}}).then(function(r){
    var t=(r&&r.data&&r.data.text)?r.data.text:'';
    cacheOcr[dataUrl]=t;
    return t;
  }).catch(function(e){
    return Tesseract.recognize(dataUrl,'eng',{logger:function(){}}).then(function(r2){
      var t2=(r2&&r2.data&&r2.data.text)?r2.data.text:'';
      cacheOcr[dataUrl]=t2;
      return t2;
    });
  });
}

/* ================= biometria facial ================= */
var faceP=null;
function cargarFaceApi(){
  if(faceP){ return faceP; }
  faceP=new Promise(function(res,rej){
    function listo(){ return W.faceapi && W.faceapi.nets && W.faceapi.nets.tinyFaceDetector && W.faceapi.nets.faceRecognitionNet; }
    function modelos(base){
      return Promise.all([
        W.faceapi.nets.tinyFaceDetector.loadFromUri(base),
        W.faceapi.nets.faceLandmark68Net.loadFromUri(base),
        W.faceapi.nets.faceRecognitionNet.loadFromUri(base)
      ]);
    }
    function iniciar(){
      var base='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
      modelos(base).then(function(){ res(); }, function(){ modelos('https://justadudewhohacks.github.io/face-api.js/models').then(function(){ res(); }, rej); });
    }
    if(listo()){ iniciar(); return; }
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
    s.onload=function(){ if(listo()){ iniciar(); } else { rej(new Error('faceapi no quedo listo')); } };
    s.onerror=function(){ rej(new Error('no se pudo cargar el verificador facial')); };
    document.head.appendChild(s);
  });
  return faceP;
}
function conTimeout(p, ms){
  return Promise.race([p, new Promise(function(res){ setTimeout(function(){ res(null); }, ms); })]);
}
function detectarCaraEn(dataUrl){
  return cargarFaceApi().then(function(){
    return new Promise(function(res){
      var im=new Image();
      im.onload=function(){
        try{
          var opt=new W.faceapi.TinyFaceDetectorOptions({inputSize:320, scoreThreshold:0.4});
          W.faceapi.detectSingleFace(im,opt).withFaceLandmarks().withFaceDescriptor().then(function(r){ res(r||null); }).catch(function(){ res(null); });
        }catch(e){ res(null); }
      };
      im.onerror=function(){ res(null); };
      im.src=dataUrl;
    });
  }).catch(function(){ return null; });
}
function distF(a,b){
  var s=0,i;
  for(i=0;i<a.length;i++){ var d=a[i]-b[i]; s+=d*d; }
  return Math.sqrt(s);
}

/* ================= guardian de orden 1-2-3-4-5 ================= */
function permitidoHasta(){
  var p=1;
  if(EST.nombreOk){ p=2; }
  if(EST.nombreOk && EST.frenteOk){ p=3; }
  if(EST.nombreOk && EST.frenteOk && (EST.reversoOk || !EST.necesitaReverso)){ p=4; }
  if(EST.selfieOk && p>=4){ p=5; }
  return p;
}
function mostrarPaso(n){
  var i,el;
  for(i=1;i<=5;i++){
    el=$('ps'+i);
    if(el){
      el.className='paso'+(i===n?' act':'');
      el.style.display='';
    }
  }
  var pr=$('prog');
  if(pr){ pr.textContent='PASO '+n+' DE 5'; }
  if(EST.paso>=2 && EST.paso<=4 && EST.paso!==n){ try{ pararCam(EST.paso); }catch(e){} }
  EST.paso=n;
  if(n===5){
    var a=$('clave'), b=$('clave2');
    if(a){ a.disabled=false; }
    if(b){ b.disabled=false; }
  }
  try{ var act=$('ps'+n); if(act&&act.scrollIntoView){ act.scrollIntoView({behavior:'smooth',block:'start'}); } }catch(e){}
}
function avanzar(n){ mostrarPaso(n); }
function verificar(){
  try{
    var act=document.querySelector('.paso.act');
    var rn=act&&act.id?parseInt(String(act.id).replace('ps',''),10):0;
    if(rn>=1&&rn<=5&&rn!==EST.paso){ EST.paso=rn; }
  }catch(e){}
  try{ validarPaso1(true); }catch(e){}
  var per=permitidoHasta();
  if(EST.paso>per){
    if(per===1){ msg('zyGuardia','Para seguir, escribe tu nombre y elige el tipo de documento en el paso 1.','#a60'); }
    else{ msg('zyGuardia','Te regreso al paso '+per+' para seguir en orden.','#a60'); }
    mostrarPaso(per);
  }
  var sel=$('tipoDoc');
  if(sel && sel.value && /pasaporte|passport/i.test((sel.options&&sel.options[sel.selectedIndex]&&sel.options[sel.selectedIndex].text)||'')){
    var ps3=$('ps3'), nr=$('notaRev');
    if(ps3){ ps3.style.display='none'; }
    if(nr){ nr.style.display='none'; }
  }
}
var vtimer=null;
function programarVerificar(){
  if(vtimer){ return; }
  vtimer=setTimeout(function(){ vtimer=null; try{ verificar(); }catch(e){} },120);
}
try{
  new MutationObserver(programarVerificar).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class','hidden','disabled']});
}catch(e){}

/* ================= paso 1: solo formato del nombre (valida SOLO al continuar, nunca mientras escribes) ================= */
function validarPaso1(silencioso){
  var inp=$('nombre'), sel=$('tipoDoc');
  var v=inp?(inp.value||'').trim():'';
  var letras=/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+( [A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*$/.test(v);
  var ok=(v.length>=3 && letras);
  var t=clasificarTipo();
  EST.tipo=t.k;
  EST.necesitaReverso=t.reverso;
  var tipoOk=!!(sel && String(sel.value||'').length>0);
  EST.nombreOk=ok;
  EST.escrito=norm(v);
  if(silencioso){ return ok&&tipoOk; }
  if(inp){ inp.style.borderColor=ok?'':'#c00'; }
  var mno='';
  if(!ok){ mno=v?'El nombre solo puede llevar letras y espacios (sin numeros ni simbolos).':'Escribe tu nombre para continuar.'; }
  msg('zyErrNombre',mno,mno?'#c00':'');
  var mti=tipoOk?'':'Elige tu tipo de documento en la lista.';
  msg('zyErrTipo',mti,mti?'#c00':'');
  return ok&&tipoOk;
}
function limpiarErroresPaso1(){
  var e1=$('zyErrNombre'); if(e1 && e1.textContent){ e1.textContent=''; e1.style.color=''; }
  var e2=$('zyErrTipo'); if(e2 && e2.textContent){ e2.textContent=''; e2.style.color=''; }
  var inp=$('nombre'); if(inp && inp.style.borderColor){ inp.style.borderColor=''; }
}
function resetearDocumento(){
  EST.frenteOk=false; EST.reversoOk=false; EST.selfieOk=false; EST.intentos=3;
}

/* ================= paso 2: frente ================= */
function procesarFrente(dataUrl){
  busy(true);
  msg('stF','Leyendo el documento...','');
  EST.frenteImg=dataUrl;
  showImg('pF',dataUrl);
  var pCara=conTimeout(detectarCaraEn(dataUrl),12000);
  var pTxt=hacerOcr(dataUrl).catch(function(e){ return 'OCR_ERR:'+(e&&e.message?e.message:''); });
  Promise.all([pCara,pTxt]).then(function(r){
    var cara=r[0], texto=r[1]||'';
    if(texto.indexOf('OCR_ERR:')===0){ busy(false); msg('stF','No pude leer el documento ('+texto.slice(8)+'). Toca CAPTURAR de nuevo, con buena luz y sin brillo.','#c00'); return; }
    if(texto.replace(/\s/g,'').length<15){ busy(false); msg('stF','No leí suficiente texto. Acércate, buena luz, que el documento llene el marco y toca CAPTURAR.','#c00'); return; }
    var lado=detectarLado(texto,!!(cara&&cara.detection));
    if(lado==='reverso'){
      busy(false);
      msg('stF','Eso es el REVERSO (se ven direcciones o la zona MRZ). Necesito el FRENTE: donde está tu FOTO y tus datos. Vuelve a capturar.','#c00');
      return;
    }
    if(lado!=='frente' && !(cara&&cara.detection)){
      busy(false);
      msg('stF','No pude confirmar que sea el FRENTE. Asegúrate de que se vea tu foto y tus datos, sin brillo, y vuelve a capturar.','#c00');
      return;
    }
    var nc=nombreCoincide(EST.escrito,texto);
    if(nc.hay && !nc.ok){
      busy(false);
      nombreNoCoincideMsg('Lo que escribiste no coincide con el documento (leí: '+nc.leido+'). Corrige tu nombre en el paso 1.');
      return;
    }
    EST.frenteOk=true;
    EST.frenteTexto=texto;
    msg('stF','✓ Frente leído correctamente.'+(nc.ok?(' Nombre: '+nc.leido+'.'):''),'#080');
    busy(false);
    avanzar(EST.necesitaReverso?3:4);
  });
}
function nombreNoCoincideMsg(txt){
  resetearDocumento();
  var nn=$('nombreNoCoincide');
  if(nn){ nn.textContent=txt; nn.style.display='block'; nn.style.color='#c00'; }
  msg('stA',''); msg('stF','');
  msg('zyErrNombre',txt,'#c00');
  avanzar(1);
}

/* ================= paso 3: reverso ================= */
function reversoAceptable(texto){
  var t=(texto||'').toUpperCase();
  if((t.match(/</g)||[]).length>=6){ return true; }
  if(/PDF4I?7/.test(t.replace(/\s/g,''))){ return true; }
  var fuertes=['DOMICILIO','DIRECCION','DIRECCIÓN','COLONIA','BARRIO','RESIDENCIA','CASERIO','CANTON','ALDEA','OBSERVACION','OBSERVACIÓN','ESTADO CIVIL','DONANTE','GRUPO SANG','TIPO DE SANG','ENDORSEMENT','RESTRICTION','ADDRESS'];
  var i,c=0;
  for(i=0;i<fuertes.length;i++){ if(t.indexOf(fuertes[i])>=0){ c++; } }
  if(c>=2){ return true; }
  if(EST.tipo==='usa' && /\b(ISS|EXP|DD|4D|4F|REST|END|DL)\b/.test(t)){ return true; }
  return false;
}
function procesarReverso(dataUrl){
  busy(true);
  msg('stA','Leyendo el reverso...','');
  EST.reversoImg=dataUrl;
  showImg('pA',dataUrl);
  hacerOcr(dataUrl).then(function(texto){
    if(texto.replace(/\s/g,'').length<10 && !reversoAceptable(texto)){
      busy(false);
      msg('stA','No leí suficiente texto en el reverso. Acércate, buena luz, y vuelve a capturar.','#c00');
      return;
    }
    var caraPend=null;
    var lado=detectarLado(texto,false);
    if(lado==='frente'){
      busy(false);
      msg('stA','Eso es el FRENTE (se ve la foto y los datos). Necesito el REVERSO: direcciones o la zona MRZ. Vuelve a capturar.','#c00');
      return;
    }
    if(lado!=='reverso' && !reversoAceptable(texto)){
      busy(false);
      msg('stA','No pude confirmar que sea el REVERSO. Muestra las direcciones o la zona de rayitas/MRZ y vuelve a capturar.','#c00');
      return;
    }
    var nc=nombreCoincide(EST.escrito,texto);
    if(nc.hay && !nc.ok){
      busy(false);
      nombreNoCoincideMsg('El nombre del reverso ('+nc.leido+') no coincide con lo que escribiste. Corrige tu nombre en el paso 1.');
      return;
    }
    EST.reversoOk=true;
    EST.reversoTexto=texto;
    msg('stA','✓ Reverso leído correctamente.','#080');
    busy(false);
    avanzar(4);
  }).catch(function(e){
    busy(false);
    msg('stA','Error leyendo el reverso: '+(e&&e.message?e.message:'')+'. Vuelve a capturar.','#c00');
  });
}

/* ================= paso 4: selfie ================= */
function procesarSelfie(){
  var img=capturarVideo('4',1048);
  if(!img){ msg('stV','Primero abre la cámara y pon tu cara dentro del marco.','#c00'); return; }
  EST.selfieImg=img;
  showImg('pS',img);
  busy(true);
  msg('stV','Comparando tu cara con la del documento...','');
  var pDoc=conTimeout(detectarCaraEn(EST.frenteImg||EST.reversoImg||''),15000);
  var pSel=conTimeout(detectarCaraEn(img),15000);
  Promise.all([pDoc,pSel]).then(function(r){
    var enDoc=r[0], enSel=r[1];
    if(!enDoc || !enDoc.detection){
      busy(false);
      falloSelfie('No pude ver bien la cara en la foto del documento. Vamos a repetir la foto del documento con mejor luz.');
      return;
    }
    if(!enSel || !enSel.detection){
      busy(false);
      falloSelfie('No pude ver tu cara en la selfie. Mejor la luz, quítate gorra o lentes oscuros.');
      return;
    }
    var d=distF(enDoc.descriptor,enSel.descriptor);
    if(d<=0.60){
      EST.selfieOk=true;
      EST.intentos=3;
      msg('stV','✓ Verificación facial superada. Pasando a tu clave.','#080');
      busy(false);
      avanzar(5);
    }else{
      busy(false);
      falloSelfie('Tu cara no coincide con la del documento (distancia '+d.toFixed(2)+').');
    }
  }).catch(function(e){
    busy(false);
    falloSelfie('El verificador facial no cargó: '+(e&&e.message?e.message:'')+'. Revisa tu internet y reintenta.');
  });
}
function falloSelfie(m){
  EST.intentos--;
  if(EST.intentos<=0){
    EST.intentos=3;
    EST.selfieOk=false;
    msg('stV','Se agotaron los 3 intentos. Volvemos a la foto del documento; revísala y vuelve a tomarla, y seguimos en orden por los pasos.','#a60');
    avanzar(2);
  }else{
    msg('stV','✗ '+m+' Te quedan '+EST.intentos+' intento(s). Toca CAPTURAR de nuevo.','#c00');
  }
}

/* ================= paso 5: clave + ZID ================= */
function validarClaves(){
  var a=$('clave'), b=$('clave2'), d=$('desglose');
  if(!a||!b){ return; }
  if(!b.value){ if(d){ d.textContent=''; } return; }
  if(a.value===b.value){
    if(d){ d.textContent='✓ Las claves coinciden. Toca el botón para crear tu ZID.'; d.style.color='#080'; }
    habilitarSubmit();
  }else{
    if(d){ d.textContent='✗ Las claves no coinciden. Corrígelas aquí, no sales del paso 5 hasta que coincidan.'; d.style.color='#c00'; }
  }
}
function habilitarSubmit(){
  var ps=$('ps5');
  if(!ps){ return; }
  var btns=ps.querySelectorAll('button, input[type=button], input[type=submit], [role=button]'), i, hay=false;
  for(i=0;i<btns.length;i++){
    var t=((btns[i].textContent||'')+' '+(btns[i].value||'')).toUpperCase();
    if(/CREAR|REGISTR|FINALIZAR|CONTINUAR|ENVIAR|ACEPTAR|ZID/.test(t)){ btns[i].disabled=false; hay=true; }
  }
  if(!hay){ msg('zyClaveOk','Si no ves el botón para crear tu ZID, avísame.','#a60'); }
}

/* ================= interruptor de botones ================= */
var MIO={'bAbrirF':1,'bCapF':1,'bAbrirA':1,'bCapA':1,'bAbrirCam':1,'bSelfie':1,'bRepSelfie':1,'bIr4':1,'bIr5':1};
function manejar(id){
  switch(id){
    case 'bAbrirF': abrirCam('2','environment','stF','bCapF').catch(function(){}); break;
    case 'bCapF': { var f=capturarVideo('2',1024); if(!f){ msg('stF','Abre la cámara primero (botón abrir cámara).','#c00'); } else { procesarFrente(f); } break; }
    case 'bAbrirA': abrirCam('3','environment','stA','bCapA').catch(function(){}); break;
    case 'bCapA': { var a=capturarVideo('3',1024); if(!a){ msg('stA','Abre la cámara primero (botón abrir cámara).','#c00'); } else { procesarReverso(a); } break; }
    case 'galF': clickArchivo('2'); break;
    case 'galA': clickArchivo('3'); break;
    case 'bAbrirCam': abrirCam('4','user','stV','bSelfie').catch(function(){}); break;
    case 'bSelfie': procesarSelfie(); break;
    case 'bRepSelfie': abrirCam('4','user','stV','bSelfie').catch(function(){}); break;
    case 'bIr4':
      if(permitidoHasta()>=4){ avanzar(4); }
      else{ msg('stA','Aún no puedes pasar: primero completa el documento (frente'+(EST.necesitaReverso?' y reverso':'')+').','#c00'); }
      break;
    case 'bIr5':
      if(permitidoHasta()>=5){ avanzar(5); }
      else{ msg('stV','Aún no puedes pasar: primero pasa la verificación facial.','#c00'); }
      break;
  }
}
document.addEventListener('click',function(e){
  var el=e.target;
  while(el && el!==document && !(el.id && MIO[el.id])){ el=el.parentNode; }
  if(!el || el===document){ return; }
  if(e.preventDefault){ e.preventDefault(); }
  if(e.stopPropagation){ e.stopPropagation(); }
  if(e.stopImmediatePropagation){ e.stopImmediatePropagation(); }
  try{ manejar(el.id,e); }catch(err){ log('error en',el.id,err); }
},true);

/* ================= galeria ================= */
function clickArchivo(psId){
  var cont=$('ps'+psId);
  var inp=cont?cont.querySelector('input[type=file]'):null;
  if(inp){ inp.click(); }
  else{ msg(psId==='2'?'stF':'stA','No encontré el selector de archivos.','#c00'); }
}
function engancharGaleria(id,psId){
  var el=$(id);
  if(!el){ return; }
  if(el.tagName==='INPUT' && (el.type||'').toLowerCase()==='file'){
    el.addEventListener('change',function(){
      var f=el.files&&el.files[0];
      if(!f){ return; }
      archivoADatos(f).then(function(d){ return downscale(d,1024); }).then(function(d){
        if(psId==='2'){ procesarFrente(d); } else { procesarReverso(d); }
      }).catch(function(er){ msg(psId==='2'?'stF':'stA','No pude leer la imagen: '+(er&&er.message?er.message:''),'#c00'); });
    });
  }else{
    MIO[id]=1;
  }
}

/* ================= eventos de pasos 1 y 5 ================= */
function engancharPaso1(){
  var inp=$('nombre'), sel=$('tipoDoc');
  if(inp){
    inp.addEventListener('input',function(){
      var antesOk=EST.nombreOk;
      validarPaso1(true);
      if(!EST.nombreOk && antesOk && EST.paso>1){
        resetearDocumento();
        msg('zyErrNombre','El nombre cambió y ya no es válido. Corrígelo y toca Continuar.','#c00');
        avanzar(1);
        return;
      }
      limpiarErroresPaso1();
    });
  }
  if(sel){
    sel.addEventListener('change',function(){
      validarPaso1(true);
      resetearDocumento();
      limpiarErroresPaso1();
    });
  }
}
function engancharPaso5(){
  var a=$('clave'), b=$('clave2');
  if(a){ a.addEventListener('input',validarClaves); }
  if(b){ b.addEventListener('input',validarClaves); }
}

/* ================= arranque ================= */
function init(){
  engancharPaso1();
  engancharPaso5();
  engancharGaleria('galF','2');
  engancharGaleria('galA','3');
  ['ovF','ovA','ovS'].forEach(function(oid){ var o=$(oid); if(o){ o.style.pointerEvents='none'; } });
  validarPaso1(true);
  verificar();
  setTimeout(function(){ cargarFaceApi().catch(function(){}); },1500);
  try{ if(document.title.indexOf('REV E')<0){ document.title=document.title+' · REV E'; } }catch(e){}
  log('nucleo revE activo. Estado:', JSON.stringify(EST));
}
try{
  W.__ZYRA_REVE_TEST__={validarPaso1:validarPaso1,verificar:verificar,mostrarPaso:mostrarPaso,permitidoHasta:permitidoHasta,engancharPaso1:engancharPaso1,limpiarErroresPaso1:limpiarErroresPaso1,estado:function(){ return JSON.parse(JSON.stringify(EST)); },norm:norm,detectarLado:detectarLado,nombreCoincide:nombreCoincide,simNombres:simNombres,mrzNombres:mrzNombres};
}catch(e){}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
W.__ZYRA_REVD_INFO=function(){ return JSON.parse(JSON.stringify(EST)); };
})();
