name: ZYRA A2e portada laboratorio plantilla por lineas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseA2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow antes de todo
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: Reescritura controlada del indice del laboratorio
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          ARCHIVO = ROOT / 'apps' / 'laboratorio' / 'routers' / 'public' / 'health.py'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseA2e.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO - archivo restaurado')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _manejador

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def pedir(url):
              try:
                  with urllib.request.urlopen(url, timeout=8) as r:
                      return r.status, r.headers.get('Content-Type', ''), r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, '', e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, '', str(e)

          PORTADA = (
              "<!doctype html><html lang='es'><head><meta charset='utf-8'>"
              "<meta name='viewport' content='width=device-width, initial-scale=1'>"
              "<title>LABORATORIO</title>"
              "<style>body{font-family:system-ui,sans-serif;background:#0d1117;"
              "color:#e6edf3;max-width:720px;margin:0 auto;padding:24px 16px}"
              ".mod{background:#161b22;border:1px solid #30363d;"
              "border-radius:10px;padding:12px 14px;margin:8px 0}"
              ".mut{color:#8b949e}</style></head><body>"
              "<div id='lab-portada'></div>"
              "<h1>LABORATORIO</h1>"
              "<p class='mut'>Experimentos, simulaciones y proyecciones"
              " dentro de ZYRA Network.</p>"
              "<div class='mod'>Captura</div>"
              "<div class='mod'>Creacion y Diseno</div>"
              "<div class='mod'>Exportar y Biblioteca</div>"
              "<div class='mod'>Presentar y Proyeccion</div>"
              "<div class='mod'>Renderizar y Simulacion</div>"
              "<div class='mod'>Comprension y Mundo 4D</div>"
              "<p class='mut'>ZYRA Network</p>"
              "</body></html>"
          )

          PLANTILLA_LINES = [
              '"""Salud e indice publicos de LABORATORIO (sin ZID)."""',
              '',
              'from apps.laboratorio.schemas.responses.envelopes import exito',
              '',
              'RUTA_SALUD = "/laboratorio/health"',
              'RUTA_INDICE = "/laboratorio"',
              '',
              'MIME_HTML = "text/html; charset=utf-8"',
              '',
              '_PORTADA = __PORTADA__',
              '',
              '',
              'def registrar_rutas(app) -> None:',
              '    estado_salud = app.contenedor.obtener("estado_salud")',
              '',
              '    def _salud(ctx):',
              '        return exito(estado_salud.estado())',
              '',
              '    def _indice(ctx):',
              '        return 200, _PORTADA.encode("utf-8"), {"Content-Type": MIME_HTML}',
              '',
              '    app.registrar("GET", RUTA_SALUD, _salud, None,',
              '                  "Estado de salud real", publica=True)',
              '    app.registrar("GET", RUTA_INDICE, _indice, None,',
              '                  "Indice de la aplicacion", publica=True)',
          ]
          PLANTILLA = '\n'.join(PLANTILLA_LINES) + '\n'

          add('# A2e - REESCRITURA TOTAL con plantilla por lineas (sin multilínea suelto)')
          add('')

          add('## V1. Verificacion del archivo original')
          add('')
          original = ARCHIVO.read_bytes()
          texto = original.decode('utf-8')

          def revertir():
              try:
                  ARCHIVO.write_bytes(original)
              except Exception:
                  pass

          anclas = {
              'def _indice': texto.count('def _indice(ctx):'),
              'listar_rutas': texto.count('"rutas": app.listar_rutas()'),
              'RUTA_INDICE': texto.count('RUTA_INDICE = "/laboratorio"'),
              'registrar_salud': texto.count('app.registrar("GET", RUTA_SALUD'),
              'registrar_indice': texto.count('app.registrar("GET", RUTA_INDICE'),
          }
          for k, v in anclas.items():
              add('- %s: %d (se requiere 1)' % (k, v))
          estructura_ok = all(v == 1 for v in anclas.values())
          gate('archivo_original_conocido', estructura_ok)
          if not estructura_ok:
              add('')
              add('**ARCHIVO DIFERENTE AL ESPERADO: nada editado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseA2e.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ARCHIVO NO RECONOCIDO - sin cambios')
          add('')

          ya = '_PORTADA' in texto
          add('## V2. Reescritura')
          add('')
          if ya:
              add('- Ya aplicado antes (idempotente, sin cambios).')
          else:
              ARCHIVO.write_text(PLANTILLA.replace('__PORTADA__', repr(PORTADA)), encoding='utf-8')
              add('- Archivo reescrito (%d bytes antes, %d despues).' % (len(original), ARCHIVO.stat().st_size))
          gate('reescritura_aplicada', True)
          add('')

          add('## V3. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(ARCHIVO), doraise=True)
              add('- py_compile: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## V4. Arranque real del sistema')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-a2e', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-a2e', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _c, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sproc = None
          sp_vivo = False
          apps = []
          if vivo:
              sproc = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sproc.poll() is not None:
                      break
                  st, _c, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      sp_vivo = True
                      try:
                          apps = list(json.loads(cuerpo).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red: %s | superapp: %s | apps: %d' % (vivo, sp_vivo, len(apps)))
          gate('ocho_apps_vivas', sp_vivo and len(apps) == 8 and '/laboratorio' in apps)
          add('')

          add('## V5. Comportamiento verificado')
          add('')
          if sp_vivo:
              for nombre, url in (('con_barra', BSP + '/laboratorio/'), ('sin_barra', BSP + '/laboratorio')):
                  st, ct, cuerpo = pedir(url)
                  ok = (st == 200 and 'text/html' in ct.lower() and 'lab-portada' in cuerpo)
                  add('- %s: GET %s -> %s %s | %s' % (nombre, url.replace(BSP, ''), st, ct[:25], 'OK' if ok else 'FALLO'))
                  gate('portada_' + nombre, ok)
              st, ct, cuerpo = pedir(BSP + '/laboratorio/health')
              salud_ok = (st == 200 and 'json' in ct.lower())
              add('- API de salud intacta: GET /laboratorio/health -> %s | %s' % (st, 'OK' if salud_ok else 'FALLO'))
              gate('api_salud_intacta', salud_ok)
              st, ct, cuerpo = pedir(BSP + '/laboratorio/ui')
              add('- panel responde con su acceso actual: GET /laboratorio/ui -> %s' % st)
              gate('panel_existe', st in (200, 401))
          else:
              gate('portada_con_barra', False)
              gate('portada_sin_barra', False)
              gate('api_salud_intacta', False)
              gate('panel_existe', False)
          add('')

          criticos = ('archivo_original_conocido', 'compila', 'ocho_apps_vivas', 'portada_con_barra', 'portada_sin_barra', 'api_salud_intacta')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos) and not ya:
              revertir()
              add('## REVERSION APLICADA - archivo restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p in (sproc, proc):
              try:
                  if p and p.poll() is None:
                      p.terminate()
                      p.wait(timeout=10)
              except Exception:
                  try:
                      p.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**PORTADA VERIFICADA CON 8 APPS VIVAS. Commit.**')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseA2e.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('A2e terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A apps/laboratorio
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(laboratorio): portada HTML en la raiz en lugar de catalogo JSON"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios que commitear" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseA2e-zyra
          path: faseA2e.json
          if-no-files-found: ignore
