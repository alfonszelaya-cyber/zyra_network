# ═══════════════════════════════════════════════════════════════════
#  ZYRA AUDITORÍA TOTAL v1.0 — Auditoría completa del repositorio
# ═══════════════════════════════════════════════════════════════════
#  CÓMO USARLO (desde el móvil):
#   1. Pega TODO este código en un archivo dentro de .github/workflows/
#      (puedes reemplazar el contenido de tu archivo actual y guardar)
#   2. Toca "Commit changes" para guardar
#   3. Ve a la pestaña Actions → "ZYRA Auditoría Total del Repositorio"
#      → botón "Run workflow" → Run
#   4. Abre la ejecución y verás la NOTA DE SALUD (0-100) y los hallazgos.
#      Al final de la página, en "Artefactos", descarga el informe
#      completo: informe-auditoria
#
#  IMPORTANTE:
#   - Esta auditoría es SOLO LECTURA: no modifica ni borra nada del repo.
#   - Se ejecuta MANUALMENTE cuando tú quieras (no gasta minutos solos).
#   - Si pegas este código en zyra-fix-biometrics.yml, tu build normal
#     quedará reemplazado mientras tanto (guarda el código anterior).
# ═══════════════════════════════════════════════════════════════════

name: "ZYRA Auditoría Total del Repositorio"

on:
  workflow_dispatch:
    inputs:
      profundo:
        description: "Escaneo profundo (más patrones de seguridad)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  auditoria:
    name: "Auditar todo el repositorio"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "1. Descargar el repositorio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2. Inventario e higiene del repositorio"
        run: |
          set +e
          A=/tmp/audit; mkdir -p "$A"
          add() { printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" "$5" "$6" >> "$A/findings.tsv"; }
          cd "$GITHUB_WORKSPACE" || exit 1

          # ── Datos generales ──
          {
            echo "REPO=$GITHUB_REPOSITORY"
            echo "RUN=$GITHUB_RUN_NUMBER"
            echo "BRANCH=$GITHUB_REF_NAME"
            echo "ACTOR=$GITHUB_ACTOR"
            echo "SHA=$(git rev-parse --short HEAD 2>/dev/null || echo 's/d')"
            echo "FECHA=$(date -u '+%d/%m/%Y %H:%M') UTC"
            echo "COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo 's/d')"
            echo "ULTIMO=$(git log -1 --format='%h | %s | %ad' --date=short 2>/dev/null || echo 's/d')"
          } > "$A/meta.env"

          # ── Listado general de archivos (sin .git) ──
          find . -path ./.git -prune -o -type f -print 2>/dev/null | sed 's|^\./||' | sort > "$A/files.list"
          echo "TOTAL_ARCHIVOS=$(wc -l < "$A/files.list" | tr -d ' ')" >> "$A/meta.env"
          echo "DIRS=$(find . -path ./.git -prune -o -type d -print 2>/dev/null | grep -c .)" >> "$A/meta.env"
          echo "TAMANO=$(du -sh --exclude=.git . 2>/dev/null | cut -f1)" >> "$A/meta.env"

          # ── Archivos por extensión ──
          awk -F/ '{f=$NF; n=split(f,p,"."); if (f ~ /^\./) print "[archivo oculto]"; else if (n==1) print "[sin extensión]"; else print tolower(p[n])}' "$A/files.list" | sort | uniq -c | sort -rn | head -25 > "$A/exts.txt"

          # ── Líneas de código por tipo de archivo ──
          : > "$A/lines.txt"
          for ext in py sh yml yaml json xml html css js java kt kts c cpp h md txt gradle properties bat cmd sql; do
            n=$(find . -path ./.git -prune -o -type f -name "*.$ext" -print0 2>/dev/null | xargs -0 -r cat 2>/dev/null | wc -l | tr -d ' ')
            [ -n "$n" ] && [ "$n" -gt 0 ] && printf '%s\t%s\n' "$n" "$ext" >> "$A/lines.txt"
          done
          sort -rn "$A/lines.txt" -o "$A/lines.txt"

          # ── Archivos más grandes ──
          find . -path ./.git -prune -o -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -15 | awk -F'\t' '{s=$1; if (s>=1048576) printf "%.1f MB\t%s\n", s/1048576, substr($2,3); else printf "%.0f KB\t%s\n", s/1024, substr($2,3)}' > "$A/biggest.txt"

          # ── Hallazgos: archivos muy grandes ──
          while IFS=$'\t' read -r s p; do
            [ -z "$s" ] && continue; p=${p#./}; mb=$(( s / 1048576 ))
            if [ "$mb" -ge 10 ]; then
              add AVISO HIGIENE HYG-BIGFILE "$p" 0 "Archivo muy grande (${mb} MB) — ralentiza el clonado del repo"
            else
              add INFO HIGIENE HYG-BIGFILE "$p" 0 "Archivo grande (${mb} MB)"
            fi
          done < <(find . -path ./.git -prune -o -type f -size +1M -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -20)

          # ── Hallazgos: archivos de secretos (.env) ──
          while IFS= read -r f; do
            [ -z "$f" ] && continue; f=${f#./}
            add CRITICO SEGURIDAD SEC-ENVFILE "$f" 0 "Archivo de variables/secretos (.env) guardado en el repositorio"
          done < <(find . -path ./.git -prune -o -type f \( -name ".env" -o -name ".env.*" -o -name "*.env" \) -print 2>/dev/null | head -10)

          # ── Hallazgos: keystores de firma ──
          while IFS= read -r f; do
            [ -z "$f" ] && continue; f=${f#./}
            add AVISO SEGURIDAD SEC-KEYSTORE "$f" 0 "Keystore de firma dentro del repo — mejor guardarlo en Secrets"
          done < <(find . -path ./.git -prune -o -type f \( -iname "*.jks" -o -iname "*.keystore" \) -print 2>/dev/null | head -10)

          # ── Hallazgos: archivos con nombres sensibles ──
          while IFS= read -r f; do
            [ -z "$f" ] && continue; f=${f#./}
            add AVISO SEGURIDAD SEC-CREDNAME "$f" 0 "Archivo con nombre sensible (credenciales/clave) — revisa su contenido"
          done < <(find . -path ./.git -prune -o -type f \( -iname "*credential*" -o -iname "id_rsa*" -o -iname "*.pem" -o -iname "*.p12" -o -iname "*.pfx" \) -print 2>/dev/null | head -10)

          # ── Hallazgos: repositorios anidados ──
          while IFS= read -r f; do
            [ -z "$f" ] && continue; f=${f#./}
            add AVISO HIGIENE HYG-NESTEDGIT "$f" 0 "Carpeta .git anidada (repositorio dentro de otro)"
          done < <(find . -mindepth 2 -name ".git" -type d -print 2>/dev/null | head -5)

          # ── Hallazgos: archivos vacíos ──
          empt=$(find . -path ./.git -prune -o -type f -empty -print 2>/dev/null | sed 's|^\./||' | head -15)
          nemp=$(printf '%s\n' "$empt" | grep -c .)
          [ "$nemp" -gt 0 ] && add INFO HIGIENE HYG-EMPTY "-" 0 "$nemp archivo(s) vacío(s): $(printf '%s\n' "$empt" | head -3 | tr '\n' ' ')"

          # ── Hallazgos: nombres con espacios ──
          sp=$(find . -path ./.git -prune -o -type f -name "* *" -print 2>/dev/null | sed 's|^\./||' | head -10 | tr '\n' ' ')
          [ -n "$(echo "$sp" | tr -d ' ')" ] && add INFO HIGIENE HYG-SPACES "-" 0 "Archivos con espacios en el nombre: $sp"

          # ── Hallazgos: duplicados por contenido (hasta 20 MB por archivo) ──
          find . -path ./.git -prune -o -type f -size -20M -print0 2>/dev/null | xargs -0 -r sha1sum 2>/dev/null | sort | awk '{h=$1; $1=""; sub(/^ +/,""); sub(/^\.\//,""); if (h==ph) {c[ph]++; f[ph]=f[ph] " | " $0} else {if (c[ph]>1) print c[ph] "\t" f[ph]; ph=h; c[ph]=1; f[ph]=$0}} END {if (c[ph]>1) print c[ph] "\t" f[ph]}' > "$A/dups.txt"
          while IFS=$'\t' read -r c files; do
            [ -z "$c" ] && continue
            add INFO HIGIENE HYG-DUP "-" 0 "$c copias idénticas del mismo contenido: $(printf '%.80s' "$files")..."
          done < "$A/dups.txt"

          # ── Hallazgos: finales de línea de Windows (CRLF) ──
          while IFS= read -r f; do
            [ -z "$f" ] && continue; f=${f#./}
            if head -c 300000 "$f" 2>/dev/null | grep -q $'\r'; then
              add AVISO CALIDAD QUAL-CRLF "$f" 0 "Tiene finales de línea de Windows (CRLF) — puede romper scripts y workflows en Linux"
            fi
          done < <(find . -path ./.git -prune -o -type f \( -name "*.sh" -o -name "*.py" -o -name "*.yml" -o -name "*.yaml" -o -name "*.json" \) -print 2>/dev/null)

          # ── Estructura de primer nivel (para el informe) ──
          ls -A 2>/dev/null | grep -v '^\.git$' | head -40 > "$A/root.txt"
          echo "PASO2 OK"

      - name: "3. Escaneo de seguridad (secretos y patrones peligrosos)"
        env:
          DEEP: ${{ inputs.profundo }}
        run: |
          set +e
          A=/tmp/audit
          add() { printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" "$5" "$6" >> "$A/findings.tsv"; }
          cd "$GITHUB_WORKSPACE" || exit 1

          scan() {
            local sev="$1" cat="$2" code="$3" msg="$4" re="$5" filt="${6:-}" hits l f r n t
            hits=$(grep -r -I -n -i -E --exclude-dir=.git --exclude=zyra-auditoria.yml --exclude=zyra-fix-biometrics.yml -- "$re" . 2>/dev/null)
            if [ -n "$filt" ]; then
              hits=$(printf '%s\n' "$hits" | grep -v -i -E -- "$filt")
            fi
            hits=$(printf '%s\n' "$hits" | head -20)
            [ -z "$hits" ] && return 0
            while IFS= read -r l; do
              [ -z "$l" ] && continue
              f=${l%%:*}; r=${l#*:}; n=${r%%:*}; t=${r#*:}
              t=$(printf '%s' "$t" | sed 's/\t/ /g; s/^[[:space:]]*//; s/[[:space:]]*$//' | cut -c1-140)
              add "$sev" "$cat" "$code" "${f#./}" "$n" "$msg › $t"
            done <<< "$hits"
            return 0
          }

          Q="['\"]"

          scan CRITICO SEGURIDAD SEC-GHTOKEN "Posible token de GitHub expuesto" 'ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|ghu_[A-Za-z0-9]{36}|ghs_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}'
          scan CRITICO SEGURIDAD SEC-AWSKEY "Posible clave de acceso de AWS expuesta" 'AKIA[0-9A-Z]{16}'
          scan CRITICO SEGURIDAD SEC-GOOGLE "Posible clave API de Google expuesta" 'AIza[0-9A-Za-z_-]{35}'
          scan CRITICO SEGURIDAD SEC-PRIVKEY "Clave privada dentro del repositorio" '-----BEGIN (RSA |EC |OPENSSH |PGP |DSA |ENCRYPTED )?PRIVATE KEY'
          scan CRITICO SEGURIDAD SEC-BOT "Posible token de bot (Telegram) expuesto" '[0-9]{8,10}:AA[A-Za-z0-9_-]{33}'
          scan CRITICO SEGURIDAD SEC-FIREBASE "Credenciales de cuenta de servicio (Firebase/Google)" '"type"[[:space:]]*:[[:space:]]*"service_account"'
          scan CRITICO SEGURIDAD SEC-SLACK "Webhook o token de Slack expuesto" 'xox[baprs]-[A-Za-z0-9-]{10,}'
          scan CRITICO SEGURIDAD SEC-RMF "Comando de borrado peligroso (rm -rf / o ~)" 'rm[[:space:]]+-[a-zA-Z]*[rf][a-zA-Z]*[[:space:]]+'"${Q}"'?(/|~)([[:space:]]|'"${Q}"'|$)'
          scan AVISO SEGURIDAD SEC-JWT "Token JWT incluido en un archivo" 'eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}'
          scan AVISO SEGURIDAD SEC-PASSWD "Posible contraseña escrita en el código" "(password|passwd|contrase|senha)${Q}?[[:space:]]*[:=][[:space:]]*${Q}[^${Q}]{4,}${Q}" "\$\{\{|scan_pat\(|[Ee]xample|XXXX"
          scan AVISO SEGURIDAD SEC-APIKEY "Posible clave API/token escrita en el código" "(api[_-]?key|apikey|access[_-]?token|secret[_-]?key|client[_-]?secret|auth[_-]?token)${Q}?[[:space:]]*[:=][[:space:]]*${Q}[A-Za-z0-9_+/.-]{16,}${Q}" "\$\{\{|scan_pat\(|[Ee]xample|XXXX"
          scan AVISO SEGURIDAD SEC-CURLBASH "Descarga y ejecución de código remoto (curl | bash)" '(curl|wget)[^|#]*\|[[:space:]]*(sudo[[:space:]]+)?(ba|z|da)?sh([[:space:]]|$)'
          scan AVISO SEGURIDAD SEC-CHMOD "Permisos 777 concedidos (riesgo de seguridad)" 'chmod[[:space:]]+(-R[[:space:]]+)?777'
          scan AVISO SEGURIDAD SEC-NGROK "Túnel o servicio público expuesto en el código" 'ngrok|trycloudflare\.com|serveo\.net|localtunnel\.me'
          scan AVISO SEGURIDAD SEC-WEBHOOK "URL de webhook con token dentro del código" 'hooks\.slack\.com/services/|discord(app)?\.com/api/webhooks|webhook\.site/'

          DEEP=$(printf '%s' "${DEEP:-true}" | tr 'A-Z' 'a-z')
          if [ "$DEEP" = "true" ]; then
            scan INFO SEGURIDAD SEC-B64 "Bloque base64 grande incrustado (posible llave o zip)" '[A-Za-z0-9+/]{400,}'
            scan INFO SEGURIDAD SEC-EVAL "Uso de eval (revisar de dónde viene el texto)" '\beval[[:space:]]*(\(|")'
            scan INFO SEGURIDAD SEC-URLPASS "URL con usuario:contraseña incrustados" '[a-zA-Z][a-zA-Z0-9+.-]*://[^/[:space:]@]+:[^@[:space:]]{3,}@'
            scan INFO SEGURIDAD SEC-IP "Dirección IP escrita en el código" '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' '127\.0\.0\.1|0\.0\.0\.0|[Vv]ersi'
          fi
          echo "PASO3 OK"

      - name: "4. Validación de código (YAML, JSON, XML, Shell, Python)"
        run: |
          set +e
          A=/tmp/audit
          add() { printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" "$5" "$6" >> "$A/findings.tsv"; }
          cd "$GITHUB_WORKSPACE" || exit 1
          python3 -c "import yaml" 2>/dev/null || pip install pyyaml --quiet

          python3 << 'PYEOF'
          import os, json
          import xml.etree.ElementTree as ET
          A = "/tmp/audit"
          def add(cat, sev, code, f, n, msg):
              with open(A + "/findings.tsv", "a", encoding="utf-8") as fh:
                  fh.write("\t".join([sev, cat, code, str(f), str(n), msg]) + "\n")
          def walk(exts):
              for root, dirs, files in os.walk("."):
                  if ".git" in dirs:
                      dirs.remove(".git")
                  for name in files:
                      if "." in name and name.lower().rsplit(".", 1)[-1] in exts:
                          p = os.path.join(root, name)
                          yield p[2:] if p.startswith("./") else p
          try:
              import yaml
              from yaml.loader import SafeLoader
              class ULoader(SafeLoader):
                  pass
              def no_dup(loader, node, deep=False):
                  m = {}
                  for k_node, v_node in node.value:
                      k = loader.construct_object(k_node, deep=deep)
                      try:
                          hash(k)
                      except TypeError:
                          k = str(k)
                      if k in m:
                          raise yaml.YAMLError("clave duplicada: '%s'" % k)
                      m[k] = loader.construct_object(v_node, deep=deep)
                  return m
              ULoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_dup)
              n_yaml = 0
              for p in walk({"yml", "yaml"}):
                  n_yaml += 1
                  try:
                      with open(p, encoding="utf-8", errors="replace") as fh:
                          list(yaml.load_all(fh, Loader=ULoader))
                  except Exception as e:
                      add("CALIDAD", "AVISO", "QUAL-YAML", p, 0, "YAML inválido: " + str(e).splitlines()[0][:150])
              print("Archivos YAML revisados:", n_yaml)
          except ImportError:
              print("PyYAML no disponible; se omite la validación YAML")
          n_json = 0
          for p in walk({"json"}):
              n_json += 1
              try:
                  with open(p, encoding="utf-8", errors="replace") as fh:
                      json.load(fh)
              except Exception as e:
                  add("CALIDAD", "AVISO", "QUAL-JSON", p, 0, "JSON inválido: " + str(e).splitlines()[0][:150])
          n_xml = 0
          for p in walk({"xml", "svg"}):
              n_xml += 1
              try:
                  ET.parse(p)
              except Exception as e:
                  add("CALIDAD", "AVISO", "QUAL-XML", p, 0, "XML inválido: " + str(e).splitlines()[0][:150])
          print("JSON revisados:", n_json, "| XML revisados:", n_xml)
          PYEOF

          # ── Scripts Shell ──
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            out=$(bash -n "$f" 2>&1)
            if [ -n "$out" ]; then
              add AVISO CALIDAD QUAL-SH "${f#./}" 0 "Script Shell con errores de sintaxis: $(printf '%.140s' "$out" | tr '\n' ' ')"
            fi
          done < <(find . -path ./.git -prune -o -type f -name "*.sh" -print 2>/dev/null | sed 's|^\./||')

          # ── Scripts Python ──
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            out=$(python3 -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8',errors='replace').read())" "$f" 2>&1)
            if [ -n "$out" ]; then
              err=$(printf '%s\n' "$out" | grep -i 'error' | tail -1)
              [ -z "$err" ] && err=$(printf '%s\n' "$out" | tail -1)
              add AVISO CALIDAD QUAL-PY "${f#./}" 0 "Script Python con errores de sintaxis: $(printf '%.140s' "$err" | tr '\n' ' ')"
            fi
          done < <(find . -path ./.git -prune -o -type f -name "*.py" -print 2>/dev/null | sed 's|^\./||')
          echo "PASO4 OK"

      - name: "5. Auditoría de los workflows (.github/workflows)"
        run: |
          set +e
          A=/tmp/audit
          cd "$GITHUB_WORKSPACE" || exit 1

          python3 << 'PYEOF'
          import os, glob, re
          A = "/tmp/audit"
          def add(cat, sev, code, f, n, msg):
              with open(A + "/findings.tsv", "a", encoding="utf-8") as fh:
                  fh.write("\t".join([sev, cat, code, str(f), str(n), msg]) + "\n")
          try:
              import yaml
              from yaml.loader import SafeLoader
          except ImportError:
              print("PyYAML no disponible; se omite la auditoría de workflows")
              raise SystemExit(0)
          rows = []
          paths = set(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml") + glob.glob(".github/workflows/**/*.yml", recursive=True) + glob.glob(".github/workflows/**/*.yaml", recursive=True))
          paths = sorted(paths)
          if not paths:
              rows.append(["(sin workflows)", "-", "-", "-", "-"])
          for p in paths:
              rel = p[2:] if p.startswith("./") else p
              jobs_n = 0
              steps_n = 0
              try:
                  with open(p, encoding="utf-8", errors="replace") as fh:
                      docs = list(yaml.load_all(fh, Loader=SafeLoader))
                  data = docs[0] if docs else {}
                  if not isinstance(data, dict):
                      raise yaml.YAMLError("estructura no reconocida")
              except Exception as e:
                  add("WORKFLOW", "AVISO", "WF-SYNTAX", rel, 0, "YAML del workflow con errores: " + str(e).splitlines()[0][:120])
                  rows.append([rel, "ERROR DE SINTAXIS", "-", "-", "-"])
                  continue
              wname = data.get("name") or "(sin nombre)"
              trig = data.get("on")
              if trig is None:
                  trig = data.get(True)
              if trig is None:
                  trig_txt = "(ninguno)"
                  add("WORKFLOW", "INFO", "WF-NOON", rel, 0, "El workflow no tiene disparadores (on:) — nunca se ejecutará")
              elif isinstance(trig, dict):
                  trig_txt = ", ".join(str(k) for k in trig.keys())
              elif isinstance(trig, list):
                  trig_txt = ", ".join(str(k) for k in trig)
              else:
                  trig_txt = str(trig)
              perms = data.get("permissions")
              jobs = data.get("jobs", {})
              unpinned = 0
              if isinstance(jobs, dict):
                  for jid, job in jobs.items():
                      if not isinstance(job, dict):
                          continue
                      jobs_n += 1
                      st = job.get("steps") or []
                      steps_n += len(st)
                      jperms = job.get("permissions", None)
                      eff = jperms if jperms is not None else perms
                      if eff is None:
                          add("WORKFLOW", "AVISO", "WF-PERM", rel, 0, "Job '%s' sin bloque 'permissions' — GitHub le da permisos amplios por defecto" % jid)
                      elif eff == "write-all":
                          add("WORKFLOW", "AVISO", "WF-PERMW", rel, 0, "Permiso total de escritura (write-all) en el job '%s'" % jid)
                      elif isinstance(eff, dict) and eff.get("contents") == "write":
                          add("WORKFLOW", "INFO", "WF-PERMW", rel, 0, "El job '%s' pide contents: write (escritura al repositorio)" % jid)
                      if "timeout-minutes" not in job:
                          add("WORKFLOW", "INFO", "WF-TIMEOUT", rel, 0, "Job '%s' sin timeout-minutes (si se cuelga, puede durar horas)" % jid)
                      for s in st:
                          if not isinstance(s, dict):
                              continue
                          u = s.get("uses")
                          if isinstance(u, str) and "@" in u:
                              ref = u.rsplit("@", 1)[1]
                              if not re.fullmatch(r"[0-9a-f]{40}", ref):
                                  unpinned += 1
                          if s.get("continue-on-error") is True:
                              add("WORKFLOW", "INFO", "WF-COE", rel, 0, "Paso con continue-on-error: true (oculta los fallos)")
                  if unpinned:
                      add("WORKFLOW", "INFO", "WF-PIN", rel, 0, "%d acción(es) fijadas por etiqueta en vez de por SHA (menor seguridad)" % unpinned)
              trig_s = str(trig)
              if "pull_request_target" in trig_s:
                  add("WORKFLOW", "AVISO", "WF-PRT", rel, 0, "Usa pull_request_target (puede ejecutar código externo con permisos del repo)")
              rows.append([rel, str(wname), trig_txt, str(jobs_n), str(steps_n)])
          with open(A + "/wf_info.tsv", "w", encoding="utf-8") as fh:
              for r in rows:
                  fh.write("\t".join(r) + "\n")
          print("Workflows revisados:", len(paths))
          PYEOF
          echo "PASO5 OK"

      - name: "6. Generar informe y nota de salud"
        run: |
          set +e
          python3 << 'PYEOF'
          import os, collections
          A = "/tmp/audit"
          WS = os.environ.get("GITHUB_WORKSPACE", ".")
          OUT = os.path.join(WS, "audit_tmp")
          os.makedirs(OUT, exist_ok=True)

          meta = {}
          try:
              for line in open(A + "/meta.env", encoding="utf-8", errors="replace"):
                  line = line.strip()
                  if "=" in line:
                      k, v = line.split("=", 1)
                      meta[k] = v
          except FileNotFoundError:
              pass

          findings = []
          try:
              for line in open(A + "/findings.tsv", encoding="utf-8", errors="replace"):
                  parts = line.rstrip("\n").split("\t", 5)
                  if len(parts) == 6:
                      findings.append(parts)
          except FileNotFoundError:
              pass
          SEVS = {"CRITICO", "AVISO", "INFO"}
          CATS = {"SEGURIDAD", "CALIDAD", "WORKFLOW", "HIGIENE"}
          norm = []
          for sev, cat, code, f, n, msg in findings:
              if sev not in SEVS and cat in SEVS:
                  sev, cat = cat, sev
              if sev not in SEVS:
                  sev = "INFO"
              if cat not in CATS:
                  cat = "HIGIENE"
              norm.append([sev, cat, code, f, n, msg])
          findings = norm
          vistos = set()
          unicos = []
          for x in findings:
              k = (x[0], x[2], x[3], x[4], x[5])
              if k not in vistos:
                  vistos.add(k)
                  unicos.append(x)
          findings = unicos

          SEV_ORDER = {"CRITICO": 0, "AVISO": 1, "INFO": 2}
          cats = ["SEGURIDAD", "CALIDAD", "WORKFLOW", "HIGIENE"]
          per_cat = {c: [0, 0, 0] for c in cats}
          for sev, cat, code, f, n, msg in findings:
              if cat not in per_cat:
                  cat = "HIGIENE"
              per_cat[cat][SEV_ORDER.get(sev, 2)] += 1

          def nota(c):
              crit, av, inf = per_cat[c]
              return max(0, 100 - 20 * crit - 7 * av - 1 * inf)
          notas = {c: nota(c) for c in cats}
          nota_final = int(round(0.40 * notas["SEGURIDAD"] + 0.25 * notas["CALIDAD"] + 0.20 * notas["WORKFLOW"] + 0.15 * notas["HIGIENE"]))

          def sem(n):
              return "🟢" if n >= 80 else ("🟡" if n >= 50 else "🔴")
          ICON = {"CRITICO": "🔴", "AVISO": "🟠", "INFO": "🔵"}
          SEV_ES = {"CRITICO": "crítico", "AVISO": "aviso", "INFO": "informativo"}
          LABEL = {"SEGURIDAD": "🔐 Seguridad", "CALIDAD": "🧪 Calidad de código", "WORKFLOW": "⚙️ Workflows (Actions)", "HIGIENE": "🧹 Higiene del repo"}

          RECS = {
              "SEC-GHTOKEN": "Ese token está expuesto: revócalo YA en github.com/settings/tokens y nunca lo escribas en archivos; usa Secrets del repo (Settings → Secrets and variables → Actions).",
              "SEC-AWSKEY": "Clave de AWS expuesta: desactívala en la consola de AWS y crea una nueva; guarda la nueva en Secrets.",
              "SEC-GOOGLE": "Clave API de Google expuesta: regenera la clave en Google Cloud Console y restringe su uso.",
              "SEC-PRIVKEY": "Una clave privada está en el repo: revócala, genera una nueva y elimínala también del historial (git filter-repo).",
              "SEC-BOT": "El token del bot está expuesto: regenera el token en @BotFather y guarda el nuevo en Secrets.",
              "SEC-FIREBASE": "Credenciales de cuenta de servicio en el repo: rota la clave en Google Cloud IAM y usa Secrets.",
              "SEC-SLACK": "Webhook/token de Slack expuesto: regenera el webhook y muévelo a Secrets.",
              "SEC-RMF": "Revisa ese comando de borrado: puede destruir archivos del runner o del repo.",
              "SEC-JWT": "El JWT está expuesto: expíralo/renuévalo y usa Secrets.",
              "SEC-PASSWD": "Quita la contraseña del archivo y muévela a Secrets del repositorio; si ya era pública, cámbiala.",
              "SEC-APIKEY": "Quita la clave del archivo y muévela a Secrets del repositorio; si ya era pública, regenérala.",
              "SEC-CURLBASH": "Descargar y ejecutar código de internet sin verificar es riesgoso: fija una versión concreta, o descárgalo, revísalo y ejecútalo por pasos.",
              "SEC-CHMOD": "Usa permisos mínimos (755 para scripts, 644 para datos) en lugar de 777.",
              "SEC-NGROK": "Revisa por qué hay un túnel público en el código; puede exponer servicios internos.",
              "SEC-WEBHOOK": "Las URLs de webhook contienen tokens: muévelas a Secrets del repositorio.",
              "SEC-B64": "Parece contenido codificado en base64 (¿keystore o zip?): guárdalo en Secrets y decodifícalo dentro del workflow.",
              "SEC-EVAL": "eval ejecuta texto como código: verifica que la entrada sea de confianza o elimínalo.",
              "SEC-URLPASS": "La URL lleva usuario y contraseña dentro: usa variables de entorno o Secrets.",
              "SEC-IP": "Si la IP es de un servidor privado o de producción, sácala a una variable de configuración.",
              "SEC-ENVFILE": "Elimina el .env del repo (git rm --cached .env), añádelo a .gitignore y CAMBIA todas las credenciales que contenía (quedan en el historial).",
              "SEC-KEYSTORE": "Guarda el keystore en un Secret codificado en base64 y añádelo a .gitignore; si el repo es público, usa un keystore nuevo.",
              "SEC-CREDNAME": "Renombra o elimina el archivo; si contiene claves reales, muévelas a Secrets y bórralo del repo.",
              "QUAL-YAML": "Corrige el error de sintaxis YAML: un YAML inválido rompe workflows y builds.",
              "QUAL-JSON": "Corrige el error de sintaxis del JSON.",
              "QUAL-XML": "Corrige el error de sintaxis del XML.",
              "QUAL-SH": "Corrige el error de sintaxis del script: si falla, tu build se rompe.",
              "QUAL-PY": "Corrige el error de sintaxis del script Python.",
              "QUAL-CRLF": "Convierte el archivo a finales de línea Unix (LF). Si editas desde el móvil, activa 'LF' en el editor o pasa dos2unix; CRLF rompe scripts .sh en Linux.",
              "WF-PERM": "Añade al workflow un bloque permissions: contents: read (o los mínimos necesarios) para no heredar permisos amplios.",
              "WF-PERMW": "Revisa si de verdad necesitas escritura en el repo; reduce los permisos al mínimo posible.",
              "WF-PRT": "pull_request_target ejecuta código de PRs externos con permisos del repo: revisa bien su uso (riesgo conocido de GitHub).",
              "WF-PIN": "Fija cada acción a una versión concreta (@v4) o al SHA completo para mayor seguridad y reproducibilidad.",
              "WF-TIMEOUT": "Añade timeout-minutes al job para cortar ejecuciones colgadas.",
              "WF-COE": "continue-on-error oculta fallos reales: revisa si es intencional.",
              "WF-NOON": "El workflow no tiene disparadores (on:) y nunca se ejecutará; añade workflow_dispatch o push si lo necesitas.",
              "WF-SYNTAX": "El YAML del workflow tiene errores: GitHub no podrá ejecutarlo. Corrige la línea indicada.",
              "HYG-BIGFILE": "Los archivos grandes ralentizan el clonado: usa Git LFS o elimina lo que no sea necesario.",
              "HYG-EMPTY": "Borra los archivos vacíos o añádeles contenido.",
              "HYG-DUP": "Deja una sola copia y elimina los duplicados idénticos.",
              "HYG-SPACES": "Renombra los archivos sin espacios (usa guiones o guion bajo): los espacios complican los scripts.",
              "HYG-NESTEDGIT": "Hay una carpeta .git dentro de otra carpeta del repo: elimínala o usa submódulos.",
          }

          def esc(s):
              return s.replace("|", "\\|")

          L = []
          L.append("# 🔍 INFORME DE AUDITORÍA TOTAL")
          L.append("")
          L.append("**Repositorio:** `%s`  " % meta.get("REPO", "?"))
          L.append("**Rama:** `%s` · **Commit:** `%s` · **Ejecución:** #%s  " % (meta.get("BRANCH", "?"), meta.get("SHA", "?"), meta.get("RUN", "?")))
          L.append("**Fecha:** %s · **Ejecutado por:** @%s  " % (meta.get("FECHA", "?"), meta.get("ACTOR", "?")))
          L.append("**Último commit:** %s" % meta.get("ULTIMO", "?"))
          L.append("")
          L.append("## 🎯 Nota de salud del repositorio: %d/100 %s" % (nota_final, sem(nota_final)))
          L.append("")
          L.append("| Categoría | Nota | 🔴 Críticos | 🟠 Avisos | 🔵 Info |")
          L.append("|---|---|---|---|---|")
          for c in cats:
              L.append("| %s | %d/100 %s | %d | %d | %d |" % (LABEL[c], notas[c], sem(notas[c]), per_cat[c][0], per_cat[c][1], per_cat[c][2]))
          L.append("")
          ncrit = sum(1 for x in findings if x[0] == "CRITICO")
          nav = sum(1 for x in findings if x[0] == "AVISO")
          ninf = sum(1 for x in findings if x[0] == "INFO")
          L.append("**Total de hallazgos:** %d 🔴 críticos · %d 🟠 avisos · %d 🔵 informativos" % (ncrit, nav, ninf))
          L.append("")
          if nota_final >= 80:
              v = "🟢 **BUEN ESTADO** — El repositorio está bien cuidado. Atiende los avisos con calma y mantén las buenas prácticas actuales."
          elif nota_final >= 50:
              v = "🟡 **ATENCIÓN** — Hay problemas importantes que conviene corregir pronto, sobre todo los marcados en rojo y naranja."
          else:
              v = "🔴 **URGENTE** — Hay hallazgos graves (posibles secretos expuestos o código roto). Corrígelos lo antes posible."
          L.append(v)
          L.append("")

          for cat in cats:
              items = [x for x in findings if (x[1] if x[1] in per_cat else "HIGIENE") == cat]
              items.sort(key=lambda x: (SEV_ORDER.get(x[0], 2), x[2], x[3]))
              L.append("---")
              L.append("")
              L.append("## %s — hallazgos (%d)" % (LABEL[cat], len(items)))
              L.append("")
              if not items:
                  L.append("✅ Sin problemas detectados en esta categoría. ¡Bien!")
                  L.append("")
                  continue
              grupos = collections.OrderedDict()
              for x in items:
                  grupos.setdefault((x[0], x[2]), []).append(x)
              for (sev, code), grupo in grupos.items():
                  L.append("### %s `%s` — %s" % (ICON[sev], code, SEV_ES[sev]))
                  L.append("")
                  mostrados = 0
                  for sev2, cat2, code2, f, n, msg in grupo:
                      if mostrados < 12:
                          loc = "`%s`" % f if f not in ("-", "") else ""
                          ln = (" línea " + n) if n not in ("0", "-", "") else ""
                          L.append("- %s%s — %s" % (loc, ln, esc(msg)))
                      mostrados += 1
                  if mostrados > 12:
                      L.append("- …y %d caso(s) más con el mismo código." % (mostrados - 12))
                  L.append("")
                  L.append("  💡 **Cómo corregirlo:** %s" % RECS.get(code, "Revisa el hallazgo y corrígelo cuando puedas."))
                  L.append("")

          L.append("---")
          L.append("")
          L.append("## 📁 Inventario del repositorio")
          L.append("")
          L.append("**Resumen:** %s archivos · %s carpetas · %s de tamaño total · %s commits" % (meta.get("TOTAL_ARCHIVOS", "?"), meta.get("DIRS", "?"), meta.get("TAMANO", "?"), meta.get("COMMITS", "?")))
          L.append("")
          try:
              root = [l.rstrip("\n") for l in open(A + "/root.txt", encoding="utf-8", errors="replace") if l.strip()]
          except FileNotFoundError:
              root = []
          if root:
              L.append("**Contenido principal (raíz):**")
              L.append("")
              L.append("```")
              for r in root:
                  L.append("  " + r)
              L.append("```")
              L.append("")
          try:
              wf = [l.rstrip("\n").split("\t") for l in open(A + "/wf_info.tsv", encoding="utf-8", errors="replace") if l.strip()]
          except FileNotFoundError:
              wf = []
          if wf:
              L.append("**Workflows encontrados (.github/workflows):**")
              L.append("")
              L.append("| Archivo | Nombre | Disparadores | Jobs | Pasos |")
              L.append("|---|---|---|---|---|")
              for r in wf:
                  r = (r + ["-"] * 5)[:5]
                  L.append("| %s | %s | %s | %s | %s |" % tuple(esc(c) for c in r))
              L.append("")
          try:
              exts = [l.strip() for l in open(A + "/exts.txt", encoding="utf-8", errors="replace") if l.strip()]
          except FileNotFoundError:
              exts = []
          if exts:
              L.append("**Tipos de archivo (top %d):**" % len(exts))
              L.append("")
              L.append("| Tipo | Archivos |")
              L.append("|---|---|")
              for e in exts:
                  p = e.split(None, 1)
                  if len(p) == 2:
                      L.append("| %s | %s |" % (p[1], p[0]))
              L.append("")
          LANG = {"py": "Python", "sh": "Shell", "yml": "YAML", "yaml": "YAML", "json": "JSON", "xml": "XML", "html": "HTML", "css": "CSS", "js": "JavaScript", "java": "Java", "kt": "Kotlin", "kts": "Kotlin", "c": "C", "cpp": "C++", "h": "Cabeceras C/C++", "md": "Markdown", "txt": "Texto", "gradle": "Gradle", "properties": "Propiedades", "bat": "Batch", "cmd": "Batch", "sql": "SQL"}
          try:
              lns = [l.split("\t") for l in open(A + "/lines.txt", encoding="utf-8", errors="replace").read().strip().splitlines() if l.strip()]
          except FileNotFoundError:
              lns = []
          if lns:
              total = sum(int(x[0]) for x in lns if x and x[0].isdigit())
              nombres = ", ".join(LANG.get(x[1], x[1]) for x in lns[:6])
              L.append("**Líneas de código revisables:** ~%s líneas en %d tipos de archivo (%s, …)" % ("{:,}".format(total).replace(",", "."), len(lns), nombres))
              L.append("")
              L.append("| Tipo | Líneas |")
              L.append("|---|---|")
              for x in lns[:12]:
                  if x and x[0].isdigit():
                      L.append("| %s | %s |" % (LANG.get(x[1], x[1]), "{:,}".format(int(x[0])).replace(",", ".")))
              L.append("")
          try:
              big = [l.rstrip("\n") for l in open(A + "/biggest.txt", encoding="utf-8", errors="replace") if l.strip()]
          except FileNotFoundError:
              big = []
          if big:
              L.append("**Archivos más grandes:**")
              L.append("")
              L.append("```")
              for b in big[:12]:
                  L.append("  " + b.replace("\t", "  —  "))
              L.append("```")
              L.append("")
          ndup = sum(1 for x in findings if x[2] == "HYG-DUP")
          if ndup:
              L.append("**Archivos duplicados (mismo contenido):** %d grupo(s) — ver sección Higiene." % ndup)
              L.append("")

          L.append("---")
          L.append("")
          L.append("## ✅ Plan de acción recomendado")
          L.append("")
          pasos = []
          if ncrit:
              pasos.append("1. **HOY:** revisa los %d hallazgos 🔴 CRÍTICOS de la sección Seguridad. Si son secretos reales, revócalos o regenéralos ya mismo." % ncrit)
          if nav:
              pasos.append("%d. **Esta semana:** corrige los avisos 🟠 (errores de sintaxis y configuración de workflows)." % (len(pasos) + 1))
          if ninf:
              pasos.append("%d. **Cuando puedas:** limpieza 🔵 (duplicados, archivos grandes, vacíos, permisos)." % (len(pasos) + 1))
          pasos.append("%d. **Buenas prácticas permanentes:** toda credencial va en Secrets del repo; usa .gitignore para archivos locales; permisos mínimos en cada workflow." % (len(pasos) + 1))
          L.extend(pasos)
          L.append("")
          L.append("_Auditoría generada automáticamente por el workflow «ZYRA Auditoría Total» · solo lectura · no modificó ningún archivo._")

          informe = "\n".join(L) + "\n"
          with open(os.path.join(OUT, "informe_auditoria.md"), "w", encoding="utf-8") as fh:
              fh.write(informe)

          R = []
          R.append("# 🔍 ZYRA Auditoría Total — Resultado")
          R.append("")
          R.append("## 🎯 Nota de salud: **%d/100** %s" % (nota_final, sem(nota_final)))
          R.append("")
          R.append("| Categoría | Nota | 🔴 | 🟠 | 🔵 |")
          R.append("|---|---|---|---|---|")
          for c in cats:
              R.append("| %s | %d/100 %s | %d | %d | %d |" % (LABEL[c], notas[c], sem(notas[c]), per_cat[c][0], per_cat[c][1], per_cat[c][2]))
          R.append("")
          top = sorted(findings, key=lambda x: SEV_ORDER.get(x[0], 2))[:12]
          if top:
              R.append("### Hallazgos principales")
              R.append("")
              for sev, cat, code, f, n, msg in top:
                  loc = "`%s`" % f if f not in ("-", "") else ""
                  R.append("- %s **%s** %s — %s" % (ICON[sev], code, loc, esc(msg)[:170]))
          else:
              R.append("✅ **Sin hallazgos.** El repositorio pasó todas las revisiones.")
          R.append("")
          R.append("📥 **Informe completo:** descárgalo en la sección **Artefactos** (parte inferior de esta página) → `informe-auditoria`.")
          with open(A + "/resumen.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(R) + "\n")

          with open(A + "/nota.txt", "w", encoding="utf-8") as fh:
              fh.write(str(nota_final))
          ann = sorted(findings, key=lambda x: SEV_ORDER.get(x[0], 2))[:20]
          with open(A + "/ann.txt", "w", encoding="utf-8") as fh:
              for sev, cat, code, f, n, msg in ann:
                  fh.write("\t".join([sev, f, n, "[" + code + "] " + msg]) + "\n")
          print("INFORME GENERADO — nota final:", nota_final)
          PYEOF
          echo "PASO6 OK"

      - name: "7. Publicar nota y resumen en la ejecución"
        if: always()
        run: |
          set +e
          A=/tmp/audit
          NOTA=$(cat "$A/nota.txt" 2>/dev/null || echo "?")
          echo "══════════════════════════════════════════════════"
          echo "   ZYRA AUDITORÍA TOTAL — NOTA DE SALUD: ${NOTA}/100"
          echo "   🔴 menos de 50: urgente · 🟡 50-79: atención · 🟢 80+: bien"
          echo "══════════════════════════════════════════════════"
          if [ -f "$A/resumen.md" ]; then
            cat "$A/resumen.md" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          echo ""
          echo "::group::📋 VER INFORME COMPLETO (toca para desplegar)"
          cat "$GITHUB_WORKSPACE/audit_tmp/informe_auditoria.md" 2>/dev/null
          echo "::endgroup::"
          if [ -f "$A/ann.txt" ]; then
            ne=0; nw=0
            while IFS=$'\t' read -r lvl f l m; do
              [ -z "$lvl" ] && continue
              m=$(printf '%s' "$m" | tr '\t\n' '  ' | sed 's/%//g' | cut -c1-180)
              if [ "$lvl" = "CRITICO" ] && [ "$ne" -lt 10 ]; then
                if [ "$f" != "-" ] && [ -n "$f" ]; then
                  echo "::error file=${f// /%20},line=${l}::$m"
                else
                  echo "::error::$m"
                fi
                ne=$((ne+1))
              elif [ "$lvl" = "AVISO" ] && [ "$nw" -lt 10 ]; then
                if [ "$f" != "-" ] && [ -n "$f" ]; then
                  echo "::warning file=${f// /%20},line=${l}::$m"
                else
                  echo "::warning::$m"
                fi
                nw=$((nw+1))
              fi
            done < "$A/ann.txt"
          fi
          echo "PASO7 OK"

      - name: "8. Publicar informe descargable (artefacto)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-auditoria
          path: audit_tmp/informe_auditoria.md
          retention-days: 30
          if-no-files-found: warn

      - name: "9. Limpiar archivos temporales"
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/audit_tmp"
          echo "Limpieza OK — el repositorio quedó intacto"
