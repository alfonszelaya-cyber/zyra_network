name: ZYRA Clearance Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest

      - name: Write clearance engine (network-native)
        run: |
          cat > shared_engines/security/clearance.py <<'CEOF'
          """ZYRA Clearance Engine - network-native.

          Official background-check certification layer.
          Lives in the Network (authority), consumed by
          apps (AXIS etc). Additive, own tables.

          Reports ACTIVE records only:
          - justice cases in non-closed stages
          - security incidents in non-archived stages
          - sealed/expired records are NOT reported
            (the legal sealing layer controls
            visibility without breaking the chain)

          Every certification request is AUDITED:
          who asked, about whom, when, result.
          Response is signed (HMAC-SHA256 with key
          derived from ZYRA_ROOT_KEY) so third parties
          can verify authenticity.
          """
          from __future__ import annotations

          import hashlib
          import hmac
          import os
          import time
          import unittest
          import uuid

          from shared_engines.common.clocks import (
              Clock,
              SystemClock,
          )
          from shared_engines.storage.database import (
              Database,
              SQLiteAdapter,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _INFO = (
              b"ZYRA:security:clearance:v1"
          )
          _AUDIT_TABLE = (
              "CREATE TABLE IF NOT EXISTS"
              " clearance_requests ("
              " request_id TEXT PRIMARY KEY,"
              " requester TEXT NOT NULL,"
              " subject_zid TEXT NOT NULL,"
              " finding TEXT NOT NULL,"
              " response_hash TEXT NOT NULL,"
              " created_at REAL NOT NULL)"
          )


          class ClearanceEngine:
              """Background-check authority."""

              def __init__(
                  self,
                  *,
                  db: Database,
                  clock: Clock,
                  master_key_hex: str,
                  db_file: str | None = None,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  raw = bytes.fromhex(
                      master_key_hex
                  )
                  self._key = hashlib.sha256(
                      raw + _INFO
                  ).digest()
                  if db_file is not None:
                      import sqlite3

                      conn = sqlite3.connect(
                          db_file
                      )
                      conn.execute(_AUDIT_TABLE)
                      conn.commit()
                      conn.close()
                  else:
                      db.execute(_AUDIT_TABLE)

              def _sign(
                  self, payload: str,
              ) -> str:
                  return hmac.new(
                      self._key,
                      payload.encode("utf-8"),
                      hashlib.sha256,
                  ).hexdigest()

              def certify(
                  self,
                  *,
                  requester: str,
                  subject_zid: str,
                  life_store=None,
                  subject_lifes: dict | None = None,
              ) -> dict[str, object]:
                  """Certifies ACTIVE records for a ZID.

                  life_store: optional LifeHistoryStore
                  (AXIS side) whose life_events contain
                  justice_*/security_* events for the
                  subject. subject_lifes: optional dict
                  {zid: life_store} for multi-DB setups.
                  When no sources are provided, returns
                  a clean certification (the Network only
                  vouches for what it can see).
                  """
                  if not requester.strip():
                      raise ValueError(
                          "requester required"
                      )
                  if not subject_zid.startswith(
                      "ZID-"
                  ):
                      raise ValueError(
                          "subject must be a ZID"
                      )
                  now = self._clock.now()
                  findings: list[dict] = []

                  sources: list = []
                  if life_store is not None:
                      sources.append(life_store)
                  if subject_lifes:
                      for ls in (
                          subject_lifes.values()
                      ):
                          if ls not in sources:
                              sources.append(ls)

                  for source in sources:
                      try:
                          rows = (
                              source._db.query_all(
                                  "SELECT * FROM"
                                  " life_events WHERE"
                                  " person_id IN"
                                  " (SELECT person_id"
                                  " FROM life_persons"
                                  " WHERE zid = ?)"
                                  " ORDER BY occurred_at",
                                  (subject_zid,),
                              )
                          )
                      except Exception:
                          rows = []
                      for row in rows:
                          etype = str(
                              row["event_type"]
                          )
                          detail = str(
                              row["detail"] or ""
                          )
                          if etype == (
                              "justice_case"
                          ):
                              findings.append(
                                  {
                                      "type": "justicia",
                                      "ref": (
                                          detail.split(
                                              " "
                                          )[0]
                                      ),
                                      "status": (
                                          "activo"
                                      ),
                                  }
                              )
                          elif etype == (
                              "security_incident"
                          ):
                              ref = (
                                  detail.split(" ")[0]
                              )
                              status = (
                                  "activo"
                              )
                              if source._db is not None:
                                  inc = (
                                      source._db.query_one(
                                          "SELECT"
                                          " description"
                                          " FROM"
                                          " axis_incidents"
                                          " WHERE"
                                          " incident_id"
                                          " = ?",
                                          (ref,),
                                      )
                                  )
                                  if (
                                      inc
                                      is not None
                                      and str(
                                          inc[
                                              "description"
                                          ]
                                      ).startswith(
                                          "["
                                      ):
                                          stage = str(
                                              inc[
                                                  "description"
                                              ]
                                          ).split(
                                              "]"
                                          )[
                                              0
                                          ][
                                              1:
                                          ]
                                          if stage in (
                                              "resuelto",
                                              "archivado",
                                          ):
                                              status = (
                                                  "cerrado"
                                              )
                              if status == "activo":
                                  findings.append(
                                      {
                                          "type": "seguridad",
                                          "ref": ref,
                                          "status": status,
                                      }
                                  )
                          elif etype == (
                              "justice_status"
                          ):
                              ref = detail.split(
                                  " ->"
                              )[0]
                              for f in findings:
                                  if f["ref"] == ref:
                                      f[
                                          "status"
                                      ] = "cerrado"
                      active = [
                          f
                          for f in findings
                          if f["status"] == "activo"
                      ]

                  finding = (
                      "CON_ANTECEDENTES_ACTIVOS"
                      if active
                      else "SIN_ANTECEDENTES_ACTIVOS"
                  )
                  issued_at = now
                  cert_id = (
                      "CLR-"
                      + uuid.uuid4().hex[:12]
                  )
                  payload = "|".join(
                      (
                          cert_id,
                          requester,
                          subject_zid,
                          finding,
                          str(issued_at),
                      )
                  )
                  signature = self._sign(payload)
                  request_id = (
                      "CRQ-"
                      + uuid.uuid4().hex[:10]
                  )
                  self._db.execute(
                      "INSERT INTO"
                      " clearance_requests ("
                      " request_id, requester,"
                      " subject_zid, finding,"
                      " response_hash, created_at)"
                      " VALUES (?, ?, ?, ?, ?, ?)",
                      (
                          request_id,
                          requester.strip(),
                          subject_zid,
                          finding,
                          signature,
                          issued_at,
                      ),
                  )
                  return {
                      "cert_id": cert_id,
                      "requester": (
                          requester.strip()
                      ),
                      "subject_zid": subject_zid,
                      "finding": finding,
                      "active_records": active,
                      "issued_at": issued_at,
                      "signature": signature,
                      "verify_payload": payload,
                  }

              def verify(
                  self,
                  *,
                  cert: dict[str, object],
              ) -> bool:
                  """Third-party verification: recomputes
                  the signature from the cert fields."""
                  payload = "|".join(
                      (
                          str(cert["cert_id"]),
                          str(cert["requester"]),
                          str(cert["subject_zid"]),
                          str(cert["finding"]),
                          str(cert["issued_at"]),
                      )
                  )
                  expected = self._sign(payload)
                  return hmac.compare_digest(
                      expected,
                      str(cert["signature"]),
                  )


          class ClearanceTests(unittest.TestCase):
              def _engine(self, db):
                  return ClearanceEngine(
                      db=db,
                      clock=SystemClock(),
                      master_key_hex="ab" * 32,
                  )

              def test_clean_certification(
                  self,
              ) -> None:
                  db = SQLiteAdapter(":memory:")
                  engine = self._engine(db)
                  cert = engine.certify(
                      requester="Banco-X",
                      subject_zid="ZID-clean-1",
                  )
                  self.assertEqual(
                      "SIN_ANTECEDENTES_ACTIVOS",
                      cert["finding"],
                  )
                  self.assertEqual(
                      [], cert["active_records"]
                  )
                  self.assertTrue(
                      engine.verify(cert=cert)
                  )

              def test_verify_rejects_tamper(
                  self,
              ) -> None:
                  db = SQLiteAdapter(":memory:")
                  engine = self._engine(db)
                  cert = engine.certify(
                      requester="Banco-X",
                      subject_zid="ZID-clean-2",
                  )
                  tampered = dict(cert)
                  tampered["finding"] = (
                      "CON_ANTECEDENTES_ACTIVOS"
                  )
                  self.assertFalse(
                      engine.verify(
                          cert=tampered
                      )
                  )

              def test_requests_are_audited(
                  self,
              ) -> None:
                  db = SQLiteAdapter(":memory:")
                  engine = self._engine(db)
                  engine.certify(
                      requester="Empleador-Y",
                      subject_zid="ZID-clean-3",
                  )
                  engine.certify(
                      requester="Empleador-Y",
                      subject_zid="ZID-clean-4",
                  )
                  rows = db.query_all(
                      "SELECT * FROM"
                      " clearance_requests"
                  )
                  self.assertEqual(2, len(rows))
                  self.assertEqual(
                      "Empleador-Y",
                      str(rows[0]["requester"]),
                  )

              def test_invalid_zid_rejected(
                  self,
              ) -> None:
                  db = SQLiteAdapter(":memory:")
                  engine = self._engine(db)
                  with self.assertRaises(
                      ValueError
                  ):
                      engine.certify(
                          requester="Banco",
                          subject_zid="no-es-zid",
                      )


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          CEOF
          python3 -c "import ast; ast.parse(open('shared_engines/security/clearance.py').read()); print('clearance OK')"

      - name: 1/2 Clearance engine tests (4)
        run: python -m shared_engines.security.clearance -v

      - name: 2/2 Security regression stays green
        run: python -m shared_engines.security.biometrics -q

      - name: Commit clearance engine (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared_engines/security/clearance.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "clearance: network-native background-check engine with signed responses + audit trail (4 tests)"
            git push
          fi
