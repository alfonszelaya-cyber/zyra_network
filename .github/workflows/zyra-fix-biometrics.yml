name: "ZYRA S50 auditoria completa del registro contra los requisitos del dueño (solo lectura)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s50:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "S50 — auditoria A: formulario actual en superapp.py"
        run: |
          {
            echo "## A1 — estado del formulario"
            echo '````'
            echo "v28: $(grep -c 'registro v28' superapp.py || true)"
            echo "escaner vivo (camD/loopDoc): $(grep -c 'loopDoc' superapp.py || true)"
            echo "sesion persistente (saveSes): $(grep -c 'saveSes' superapp.py || true)"
            echo "OCR (ocrDoc): $(grep -c 'ocrDoc' superapp.py || true)"
            echo "codigo (leerCodigo): $(grep -c 'leerCodigo' superapp.py || true)"
            echo "parseAAMVA: $(grep -c 'parseAAMVA' superapp.py || true)"
            echo "validacion nombre min-palabras: $(grep -c 'partesNombre' superapp.py || true)"
            echo "gate vencido: $(grep -c 'docVencido' superapp.py || true)"
            echo "gate menor: $(grep -c 'minorBloqueado' superapp.py || true)"
            echo "gate nombreNoCoincide: $(grep -c 'nombreNoCoincide' superapp.py || true)"
            echo "deteccion de LADO (frontal/reverso por lectura): $(grep -c 'esFrontal\|detectarLado\|ladoReal' superapp.py || true)"
            echo "puntaje visible: $(grep -c 'puntaje:' superapp.py || true)"
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "S50 — auditoria B: menores (minor_biometrics + guardian + birth)"
        run: |
          {
            echo "## B1 — minor_biometrics_engine.py COMPLETO"
            echo '````'
            cat shared_engines/identity/minor_biometrics_engine.py
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## B2 — guardian_engine.py (primeras 120)"
            echo '````'
            sed -n '1,120p' shared_engines/identity/guardian_engine.py
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## B3 — birth_registry_engine.py (0-100)"
            echo '````'
            sed -n '1,100p' shared_engines/identity/birth_registry_engine.py
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## B4 — rutas de menores/nacimiento en api.py"
            echo '````'
            grep -n 'birth\|minor\|guardian\|transition' shared_engines/runtime/api.py | head -20
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "S50 — auditoria C: detector de firmas (para autorizacion de familiares)"
        run: |
          {
            echo "## C1 — busqueda de detector de firmas en todo el repo"
            echo '````'
            grep -rn 'detector.*firma\|firma.*detect\|signature_detect\|SignatureDetect\|firmas' --include='*.py' . 2>/dev/null | grep -v '.git/' | head -30
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## C2 — busqueda de consentimiento / autorizacion"
            echo '````'
            grep -rn 'consent\|autorizac\|authorization' --include='*.py' shared_engines/identity/ 2>/dev/null | head -20
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "S50 — auditoria D: motor y umbrales actuales"
        run: |
          {
            echo "## D1 — BiometricsPolicy actual"
            echo '````'
            sed -n '160,210p' shared_engines/security/biometrics.py
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## D2 — politica y fabrica en kernel.py"
            echo '````'
            grep -n '_biometrics_policy\|doc_auto\|doc_review\|doc_reject\|dup_reject' shared_engines/runtime/kernel.py | head -20
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## D3 — liveness y submit_case (biometrics.py)"
            echo '````'
            grep -n 'def check_liveness\|def submit_case\|def verify_face\|doc_match_score\|liveness_verdict' shared_engines/security/biometrics.py shared_engines/security/biometrics_face.py | head -20
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## D4 — veredicto del motor en vivo"
            echo '````'
            curl -sS -m 30 "https://zyra-network-or16.onrender.com/provider" || echo "(sin respuesta)"
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "S50 — auditoria E: OCR y lectura (lo que existe para leer TODO el documento)"
        run: |
          {
            echo "## E1 — funciones de lectura en superapp.py (lineas completas)"
            echo '````'
            grep -n 'function parseAAMVA\|function ocrDoc\|function leerCodigo\|function leerTodo\|function edadDe\|function nombresCoinciden' superapp.py
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## E2 — campos que el formulario envia a /registro/nuevo"
            echo '````'
            grep -n 'JSON.stringify({nombre' superapp.py
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## E3 — campos que el enroll acepta (doc_kind/country/number)"
            echo '````'
            sed -n '595,640p' shared_engines/runtime/api.py
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "S50 — auditoria F: camara viva (que quedo del escaner de la S19)"
        run: |
          {
            echo "## F1 — escaner vivo en la pagina actual"
            echo '````'
            echo "abrirCamDoc: $(grep -c 'abrirCamDoc' superapp.py || true)"
            echo "videozonaDoc: $(grep -c 'videozonaDoc' superapp.py || true)"
            echo "capturarDoc (camara en vivo): $(grep -c 'function capturarDoc' superapp.py || true)"
            echo "inputs file (camara nativa): $(grep -c 'capture=\"environment\"' superapp.py || true)"
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Guardar auditoria"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-s50
          path: |
            superapp.py
            shared_engines/identity/minor_biometrics_engine.py
            shared_engines/identity/guardian_engine.py
