          sys.modules["apps.laboratorio"] = pkg_lab

          from apps.laboratorio.application.services.template_check import verificar_plantillas
          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.infrastructure.database.migrations import aplicar_migraciones, version_actual
          from apps.laboratorio.infrastructure.database.connection import ConexionBD
          from apps.laboratorio.infrastructure.database.tables import TABLAS_ESPERADAS, tablas_existentes
          from apps.laboratorio.infrastructure.providers.calibrator_manual import (
              CalibradorManual,
              aplicar,
              invertir3x3,
          )
          from apps.laboratorio.infrastructure.providers.png_decoder import decodificar_png_rgb
          from apps.laboratorio.infrastructure.providers.png_encoder import encode_png_rgb
          from apps.laboratorio.infrastructure.providers.scanner_photo import MotorEscaneoFoto
          from apps.laboratorio.infrastructure.providers.test_pattern import patron_prueba
          from apps.laboratorio.infrastructure.providers.warper import warpear
          from apps.laboratorio.registry.engines.capabilities import Capacidad
          from apps.laboratorio.shared.enums.display_kind import DisplayKind
          from apps.laboratorio.shared.enums.surface_kind import SurfaceKind
          from apps.laboratorio.shared.utilities.image_utils import dimensiones_png

          MANIFEST = "/tmp/lab_lote_8a.manifest"
          RESUMEN = os.environ.get("GITHUB_STEP_SUMMARY", "")

          def sum_write(texto=""):
              if RESUMEN:
                  with open(RESUMEN, "a", encoding="utf-8") as f:
                      f.write(texto + "\n")

          errores = 0
          objetivos = []
          with open(MANIFEST, encoding="utf-8") as f:
              for linea in f:
                  linea = linea.strip()
                  if linea:
                      ruta, estado = linea.split("|", 1)
                      objetivos.append((ruta, estado))

          sum_write("## ZYRA LABORATORIO - Lote 8Ae (Fase 8 completa + escaneo + avatar)")
          sum_write("")
          sum_write("### Escritura y verificacion por tipo (Reglas 1-3 y 6)")
          sum_write("")
          sum_write("| Archivo | Escritura | Verificacion |")
          sum_write("|---|---|---|")
          for ruta, estado in objetivos:
              marca = "OK"
              try:
                  p = pathlib.Path(ruta)
                  datos = p.read_bytes()
                  assert datos.strip(), "archivo vacio"
                  if ruta.endswith(".py"):
                      texto = datos.decode("utf-8")
                      compile(texto, ruta, "exec")
                      nombre = "apps.laboratorio." + ruta[len("apps/laboratorio/"):-3].replace("/", ".")
                      importlib.import_module(nombre)
                  elif ruta.endswith(".json"):
                      obj = json.loads(datos.decode("utf-8"))
                      assert isinstance(obj, dict), "json debe ser objeto"
                  elif ruta.endswith(".html"):
                      texto = datos.decode("utf-8")
                      assert "{{" in texto and "}}" in texto, "plantilla sin marcadores"
                  else:
                      raise ValueError("Tipo desconocido: " + ruta)
              except Exception as exc:
                  errores += 1
                  marca = "FALLO: " + type(exc).__name__ + ": " + str(exc)
              sum_write("| `" + ruta + "` | " + estado + " | " + marca + " |")

          app = montar_aplicacion(":memory:")
          H_DUENO = {"X-ZYRA-ZID": "ZID-DUENO-1", "X-ZYRA-ROLES": "LAB_CREADOR,LAB_ANALISTA,LAB_OPERADOR"}
          H_OTRO = {"X-ZYRA-ZID": "ZID-OTRO-2"}

          def llamada(metodo, ruta, cuerpo=None, headers=None):
              h = dict(headers or {})
              datos = b"" if cuerpo is None else json.dumps(cuerpo).encode("utf-8")
              status, headers_out, salida = app.despachar(metodo, ruta, h, datos)
              ctype = headers_out.get("Content-Type", "")
              if "json" in ctype:
                  try:
                      parsed = json.loads(salida.decode("utf-8"))
                  except Exception:
                      parsed = None
              else:
                  parsed = None
              return status, parsed, salida, headers_out

          resultados = []

          def check(nombre, funcion):
              global errores
              try:
                  funcion()
                  resultados.append(("OK", nombre))
              except Exception as exc:
                  errores += 1
                  resultados.append(("FALLO", nombre + " -> " + type(exc).__name__ + ": " + str(exc)))

          ref = {}

          def preparar():
              tmp = ConexionBD(":memory:")
              assert aplicar_migraciones(tmp) == 8
              assert version_actual(tmp) == 8
              for t in TABLAS_ESPERADAS:
                  assert t in tablas_existentes(tmp), "falta tabla " + t
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects", {
                  "titulo": "Muro ZYRA", "tipo": "arquitectura",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status)
              ref["proyecto"] = cuerpo["datos"]["proyecto"]
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/scenes", {
                  "nombre": "Contenido del muro", "ancho": 800, "alto": 600,
                  "objetos": [
                      {"forma": "rect", "color": "#1A2B3C", "x": 0, "y": 0, "w": 800, "h": 600, "capa": "fondo"},
                      {"forma": "circle", "color": "#38BDF8", "cx": 400, "cy": 300, "r": 80, "capa": "medio"},
                      {"forma": "texto", "color": "#E2E8F0", "x": 40, "y": 80, "contenido": "PROYECCION", "capa": "frente"},
                  ],
              }, headers=H_DUENO)
              assert status == 201, "escena: " + str(status)
              ref["escena"] = cuerpo["datos"]["escena"]
              patron = patron_prueba(160, 90)
              ref["patron_b64"] = __import__("base64").b64encode(patron).decode("ascii")
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/inputs", {
                  "titulo": "Foto de edificio", "tipo": "foto", "contenido": ref["patron_b64"],
              }, headers=H_DUENO)
              assert status == 201, "entrada foto: " + str(status)
              ref["foto"] = cuerpo["datos"]["entrada"]

          def t_registrar_superficie():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces", {
                  "nombre": "Pared principal", "tipo": "pared",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              sup = cuerpo["datos"]["superficie"]
              assert sup["tipo"] == "pared" and sup["calibrada"] is False
              ref["superficie"] = sup
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces", {
                  "nombre": "Mala", "tipo": "nube",
              }, headers=H_DUENO)
              assert status == 400, "tipo invalido: " + str(status)

          def t_calibrar():
              sid = ref["superficie"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces/" + sid + "/calibrate", {
                  "corners": [[0, 0], [640, 0], [640, 360], [0, 360]],
              }, headers=H_DUENO)
              assert status == 200, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              sup = cuerpo["datos"]["superficie"]
              assert sup["calibrada"] is True and len(sup["homografia"]) == 9
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces/" + sid + "/calibrate", {
                  "corners": [[0, 0], [640, 0]],
              }, headers=H_DUENO)
              assert status == 400, "recalibrar debe 400"
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces", {
                  "nombre": "Segunda", "tipo": "piso",
              }, headers=H_DUENO)
              assert status == 201
              ref["superficie2"] = cuerpo["datos"]["superficie"]

          def t_calibracion_matematica():
              cal = CalibradorManual()
              H = cal.calibrar([[0, 0], [640, 0], [640, 360], [0, 360]], 640, 360)
              u, v = aplicar(H, 320, 180)
              assert abs(u - 320) < 1e-6 and abs(v - 180) < 1e-6, "identidad rota"
              H2 = cal.calibrar([[100, 50], [500, 50], [500, 300], [100, 300]], 640, 360)
              u, v = aplicar(H2, 0, 0)
              assert abs(u - 100) < 1e-6 and abs(v - 50) < 1e-6, "mapeo esquina roto"
              Hinv = invertir3x3(H2)
              x, y = aplicar(Hinv, 100, 50)
              assert abs(x) < 1e-6 and abs(y) < 1e-6, "inversa rota"

          def t_warp_unitario_directo():
              escenas = app.contenedor.obtener("repo_escenas")
              escena = escenas.obtener_exigir(ref["escena"]["id"])
              from apps.laboratorio.infrastructure.providers.renderer_raster import MotorRenderRaster
              resultado = MotorRenderRaster().renderizar(escena, {"ancho": 640, "alto": 360})
              cal = CalibradorManual()
              H = cal.calibrar([[0, 0], [640, 0], [640, 360], [0, 360]], 640, 360)
              frame = warpear(resultado.imagen_bytes, H, 640, 360)
              assert dimensiones_png(frame) == (640, 360), "dims=" + str(dimensiones_png(frame))
              ancho, alto, pix = decodificar_png_rgb(frame)
              idx = (10 * ancho + 10) * 3
              assert (pix[idx], pix[idx + 1], pix[idx + 2]) == (26, 43, 60), \
                  "pixel(10,10)=" + str((pix[idx], pix[idx + 1], pix[idx + 2]))

          def t_proyectar_identity():
              sid = ref["escena"]["id"]
              sup_id = ref["superficie"]["id"]
              status, cuerpo, datos, headers_out = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/project", {
                  "surface_id": sup_id,
              }, headers=H_DUENO)
              assert status == 200, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              assert headers_out["Content-Type"] == "image/png"
              assert dimensiones_png(datos) == (640, 360), "dims=" + str(dimensiones_png(datos))
              ancho, alto, pix = decodificar_png_rgb(datos)
              idx = (10 * ancho + 10) * 3
              assert (pix[idx], pix[idx + 1], pix[idx + 2]) == (26, 43, 60), \
                  "pixel(10,10)=" + str((pix[idx], pix[idx + 1], pix[idx + 2]))

          def t_proyectar_warp_real():
              sid = ref["escena"]["id"]
              sup2 = ref["superficie2"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces/" + sup2 + "/calibrate", {
                  "corners": [[100, 50], [500, 50], [500, 300], [100, 300]],
              }, headers=H_DUENO)
              assert status == 200, "calibrar 2: " + str(status)
              status, cuerpo, datos, headers_out = llamada("POST", "/laboratorio/api/v1/scenes/" + sid + "/project", {
                  "surface_id": sup2,
              }, headers=H_DUENO)
              assert status == 200, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              assert dimensiones_png(datos) == (400, 250), "dims=" + str(dimensiones_png(datos))
              ancho, alto, pix = decodificar_png_rgb(datos)
              idx = (0 * ancho + 0) * 3
              assert (pix[idx], pix[idx + 1], pix[idx + 2]) == (26, 43, 60), \
                  "pixel(0,0) warpeado=" + str((pix[idx], pix[idx + 1], pix[idx + 2]))

          def t_proyectar_sin_calibrar_y_403():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/surfaces", {
                  "nombre": "Tercera", "tipo": "fachada",
              }, headers=H_DUENO)
              assert status == 201
              sid3 = cuerpo["datos"]["superficie"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + ref["escena"]["id"] + "/project", {
                  "surface_id": sid3,
              }, headers=H_DUENO)
              assert status == 400, "sin calibrar: " + str(status)
              assert "calibrada" in cuerpo["error"]["mensaje"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/scenes/" + ref["escena"]["id"] + "/project", {
                  "surface_id": ref["superficie"]["id"],
              }, headers=H_OTRO)
              assert status == 403, "espectador no proyecta: " + str(status)

          def t_salidas():
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/displays", {
                  "nombre": "Pantalla del estudio", "kind": "pantalla",
              }, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              pant = cuerpo["datos"]["salida"]
              assert pant["disponible"] is True and pant["motivo"] == ""
              ref["pantalla"] = pant
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/displays", {
                  "nombre": "Holo futurista", "kind": "holografico",
              }, headers=H_DUENO)
              assert status == 201, "holo status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              holo = cuerpo["datos"]["salida"]
              assert holo["disponible"] is False and "hardware" in holo["motivo"]
              ref["holo"] = holo
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/displays", {
                  "nombre": "Malo", "kind": "teletransportador",
              }, headers=H_DUENO)
              assert status == 400, "kind invalido: " + str(status)

          def t_probar_salida():
              pid = ref["pantalla"]["id"]
              status, _, datos, headers_out = llamada("POST", "/laboratorio/api/v1/displays/" + pid + "/test", None, headers=H_DUENO)
              assert status == 200, "status=" + str(status)
              assert headers_out["Content-Type"] == "image/png"
              assert dimensiones_png(datos) == (320, 180)
              ancho, alto, pix = decodificar_png_rgb(datos)
              assert tuple(pix[0:3]) == (255, 255, 255), "rejilla blanca en (0,0)=" + str(tuple(pix[0:3]))
              hid = ref["holo"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/displays/" + hid + "/test", None, headers=H_DUENO)
              assert status == 400, "holo debe rechazar: " + str(status)
              assert "hardware" in cuerpo["error"]["mensaje"]

          def t_escanear_foto():
              eid = ref["foto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/inputs/" + eid + "/scan", None, headers=H_DUENO)
              assert status == 200, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              esc = cuerpo["datos"]["escaneo"]
              assert esc["dimensiones"] == [160, 90]
              assert esc["total_bordes"] > 20, "bordes=" + str(esc["total_bordes"])
              assert len(esc["esquinas"]) > 0
              assert len(esc["malla"]) > 0 and len(esc["malla"]) <= 400
              assert len(esc["profundidad_estimada"]) == len(esc["malla"])

          def t_escanear_texto_rechaza():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/inputs", {
                  "titulo": "Texto normal", "tipo": "texto",
                  "contenido": "Texto que no es foto y no se puede escanear como imagen.",
              }, headers=H_DUENO)
              assert status == 201
              eid = cuerpo["datos"]["entrada"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/inputs/" + eid + "/scan", None, headers=H_DUENO)
              assert status == 400, "texto no se escanea: " + str(status)
              assert "foto" in cuerpo["error"]["mensaje"]

          def t_avatar_desde_foto():
              eid = ref["foto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/inputs/" + eid + "/avatar", None, headers=H_DUENO)
              assert status == 201, "status=" + str(status) + " cuerpo=" + json.dumps(cuerpo or {})[:300]
              av = cuerpo["datos"]["avatar"]
              assert av["tipo"] == "svg"
              assert len(av["hash_sha256"]) == 64
              assert "avatar" in av["etiquetas"]
              status, cuerpo, _, _ = llamada("GET", "/laboratorio/api/v1/assets/search?etiqueta=avatar", headers=H_DUENO)
              assert status == 200 and cuerpo["datos"]["total"] >= 1

          def t_avatar_contenido_real():
              activos = app.contenedor.obtener("repo_activos").listar_por_propietario("ZID-DUENO-1")
              avatar_svg = None
              for a in activos:
                  if "avatar" in a.etiquetas:
                      avatar_svg = a.contenido
                      break
              assert avatar_svg is not None, "avatar debe estar en la biblioteca"
              assert "<animateTransform" in avatar_svg, "el avatar debe correr (animacion)"
              assert "<circle" in avatar_svg and "fill=" in avatar_svg

          def t_avatar_texto_rechaza():
              pid = ref["proyecto"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/projects/" + pid + "/inputs", {
                  "titulo": "Otro texto", "tipo": "texto",
                  "contenido": "Segundo texto sin imagen para probar rechazo de avatar.",
              }, headers=H_DUENO)
              assert status == 201
              eid = cuerpo["datos"]["entrada"]["id"]
              status, cuerpo, _, _ = llamada("POST", "/laboratorio/api/v1/inputs/" + eid + "/avatar", None, headers=H_DUENO)
              assert status == 400, "texto no genera avatar: " + str(status)

          def t_ui_paneles_fase8():
              status, _, html, _ = llamada("GET", "/laboratorio/ui/proyectar", headers=H_DUENO)
              assert status == 200, "proyectar status=" + str(status)
              texto = html.decode("utf-8")
              assert "EN VIVO" in texto
              assert texto.count('data-accion=') == 3, "Ley 3, hay " + str(texto.count('data-accion='))
              assert 'id="form-superficie"' in texto and 'id="form-calibrar"' in texto and 'id="form-proyectar"' in texto
              assert "Pared principal" in texto
              status, _, html, _ = llamada("GET", "/laboratorio/ui/salidas", headers=H_DUENO)
              assert status == 200, "salidas status=" + str(status)
              texto = html.decode("utf-8")
              assert "EN VIVO" in texto and 'id="form-display"' in texto
              assert "disponible" in texto and "no disponible" in texto
              assert 'data-test="' in texto
              status, _, html, _ = llamada("GET", "/laboratorio/ui/capturar", headers=H_DUENO)
              texto = html.decode("utf-8")
              assert 'data-scan="' in texto, "enlace escanear en foto"
              assert 'data-avatar="' in texto, "enlace avatar en foto"

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              total = len(cuerpo["datos"]["rutas"])
              assert total == 66, "se esperaban 66 rutas (57 + 4 superficies + 3 displays + 2 escaneo/avatar), hay " + str(total)
              ids_modulos = {m["id"] for m in cuerpo["datos"]["modulos"]}
              assert ids_modulos == {"capture", "simulation", "understanding", "design", "creation", "library", "world4d", "render", "presentation", "export", "projection", "display"}, str(ids_modulos)
              capacidades = app.contenedor.obtener("capacidades")
              assert capacidades.disponible(Capacidad.PROYECCION_WARP) is True
              assert capacidades.disponible(Capacidad.PROFUNDIDAD) is True
              assert capacidades.disponible(Capacidad.RENDER_3D) is True
              assert capacidades.disponible(Capacidad.HOLO_3D) is False, "holo honesto"

          def t_enums_validar():
              assert DisplayKind.validar("pantalla") is DisplayKind.PANTALLA
              assert DisplayKind.validar(" VR ") is DisplayKind.VR
              try:
                  DisplayKind.validar("laser")
                  raise AssertionError("debia fallar")
              except ValueError:
                  pass
              assert SurfaceKind.validar("pared") is SurfaceKind.PARED

          def t_plantillas_completas():
              assert verificar_plantillas() == 18

          sum_write("")
          sum_write("### Pruebas end-to-end Fase 8 (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Migracion v8 + escena + foto de prueba", preparar)
          check("Registrar superficie + tipo invalido (400)", t_registrar_superficie)
          check("Calibrar con 4 esquinas + recalibrado 400", t_calibrar)
          check("Homografia DLT matematicamente verificada", t_calibracion_matematica)
          check("Pipeline directo: render + warp + pixel exacto", t_warp_unitario_directo)
          check("Proyectar identidad: PNG 640x360 pixel exacto", t_proyectar_identity)
          check("Proyectar warp real con offset", t_proyectar_warp_real)
          check("Sin calibrar (400) + 403 espectador", t_proyectar_sin_calibrar_y_403)
          check("Salidas: pantalla disponible, holo honesto", t_salidas)
          check("Patron de prueba real + holo rechaza", t_probar_salida)
          check("Escanear foto: bordes, esquinas, profundidad", t_escanear_foto)
          check("Escanear texto rechazado (400)", t_escanear_texto_rechaza)
          check("Avatar desde foto: SVG en biblioteca", t_avatar_desde_foto)
          check("Avatar animado real (corre) + colores de la foto", t_avatar_contenido_real)
          check("Avatar desde texto rechazado (400)", t_avatar_texto_rechaza)
          check("UI proyectar/salidas/capturar EN VIVO con Ley 3", t_ui_paneles_fase8)
          check("Indice: 66 rutas, 12 modulos, capacidades", t_indice_publico)
          check("Enums validar", t_enums_validar)
          check("18 plantillas verificadas", t_plantillas_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 8 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 8Ae aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 8Ae - Fase 8 completa con conexion de escaneo corregida"
            git push
          fi
