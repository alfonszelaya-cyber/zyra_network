          form.lab-form{display:grid;gap:12px;max-width:520px}
          form.lab-form input,form.lab-form select,form.lab-form textarea{font:inherit;font-size:14px;background:var(--fondo);color:var(--texto);border:1px solid var(--borde);border-radius:var(--radio-b);padding:10px 12px;width:100%}
          form.lab-form textarea{resize:vertical;min-height:120px}
