name: ZYRA AUDITORIA - REPO COMPLETO (funciona, no funciona, duplicados, borrables) [LECTURA]

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - "shared_engines/**"

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auditoria total del repositorio
        run: |
          python - <<'PY'
          import ast, hashlib, json, os, re, subprocess, sys, time
          from pathlib import Path
          from collections import defaultdict, Counter

          RAIZ = Path(".")
          EXCL_PARTS = {".git", "__pycache__"}
          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          # ---------- FASE 0: censo de archivos ----------
          todos = [p for p in RAIZ.rglob("*")
                   if p.is_file() and not (EXCL_PARTS & set(p.parts))]
          py_files = [p for p in todos if p.suffix == ".py"]
          pyc_files = [p for p in todos if p.suffix == ".pyc"]
          pycache_dirs = [p for p in RAIZ.rglob("*") if p.is_dir() and p.name == "__pycache__"]
          vacios = [p for p in todos if p.stat().st_size <= 1]
          vacios_py = [p for p in vacios if p.suffix == ".py"]
          inits_vacios = [p for p in vacios_py if p.name == "__init__.py"]
          noinit_vacios = [p for p in vacios_py if p.name != "__init__.py"]
          carpetas = [p for p in RAIZ.rglob("*") if p.is_dir() and ".git" not in p.parts]
          carpetas_vacias = [c for c in carpetas
                             if not any(f.is_file() for f in c.rglob("*"))
                             and c.name != "__pycache__"]

          por_top = Counter()
          bytes_top = Counter()
          for p in todos:
              top = p.parts[0] if len(p.parts) > 1 else "(raiz)"
              por_top[top] += 1
              try: bytes_top[top] += p.stat().st_size
              except Exception: pass

          # ---------- FASE 1: sintaxis ----------
          errores_sintaxis = []
          fuentes = {}
          for p in py_files:
              try:
                  t = p.read_text(encoding="utf-8", errors="replace")
              except Exception as e:
                  errores_sintaxis.append(f"{p}: lectura {e}")
                  continue
              fuentes[str(p)] = t
              try:
                  ast.parse(t)
              except SyntaxError as e:
                  errores_sintaxis.append(f"{p}:{e.lineno} {e.msg}")

          # ---------- FASE 2: mapa de modulos + imports rotos ----------
          mod_paths = set()
          for p in py_files:
              rel = p.relative_to(RAIZ).with_suffix("")
              partes = list(rel.parts)
              if partes[-1] == "__init__":
                  partes = partes[:-1]
              if partes:
                  mod_paths.add(".".join(partes))
          top_names = {m.split(".")[0] for m in mod_paths}
          stdlib = set(getattr(sys, "stdlib_module_names", set()))
          installed_cache = {}
          def top_existe(name):
              if name in top_names or name in stdlib:
                  return True
              if name not in installed_cache:
                  try:
                      installed_cache[name] = __import__("importlib.util", fromlist=["x"]).find_spec(name) is not None
                  except Exception:
                      installed_cache[name] = True  # no bloquear por duda
              return installed_cache[name]

          imports_rotos = []
          for ruta, t in fuentes.items():
              p = Path(ruta)
              try:
                  arbol = ast.parse(t)
              except SyntaxError:
                  continue
              paq_dir = p.parent
              for nodo in ast.walk(arbol):
                  if isinstance(nodo, ast.Import):
                      for a in nodo.names:
                          top = a.name.split(".")[0]
                          if top not in top_names and not top_existe(top):
                              imports_rotos.append(f"{ruta}: import {a.name} (modulo inexistente)")
                  elif isinstance(nodo, ast.ImportFrom):
                      if nodo.level > 0:
                          base = paq_dir
                          for _ in range(nodo.level - 1):
                              base = base.parent
                          obj = base / (nodo.module.replace(".", "/") if nodo.module else "")
                          ok = (obj.with_suffix(".py").is_file() or (obj / "__init__.py").is_file()
                                or obj.is_dir() or (nodo.module is None))
                          if not ok:
                              imports_rotos.append(f"{ruta}: from {'.'*nodo.level}{nodo.module or ''} (ruta inexistente)")
                      else:
                          top = (nodo.module or "").split(".")[0]
                          if nodo.module and top not in top_names and not top_existe(top):
                              imports_rotos.append(f"{ruta}: from {nodo.module} (modulo inexistente)")
          imports_rotos = sorted(set(imports_rotos))

          # ---------- FASE 3: pruebas completas con conteos ----------
          carpetas_tests = sorted({p.parent for p in py_files if p.parent.name == "tests"})
          resultados_tests = []
          for c in carpetas_tests:
              t0 = time.time()
              try:
                  r = subprocess.run([sys.executable, "-m", "pytest", str(c), "-q", "--tb=short"],
                                     capture_output=True, text=True, timeout=900)
                  salida = (r.stdout or "") + (r.stderr or "")
                  code = r.returncode
              except subprocess.TimeoutExpired:
                  salida, code = "TIMEOUT 900s", -1
              dur = time.time() - t0
              lineas = salida.splitlines()
              conteo = ""
              for l in reversed(lineas):
                  if "passed" in l or "failed" in l or "error" in l or "no tests ran" in l:
                      conteo = l.strip(); break
              resultados_tests.append({
                  "carpeta": str(c), "code": code, "duracion": round(dur, 1),
                  "conteo": conteo, "cola": "\n".join(lineas[-40:]),
                  "fallos": [l for l in lineas if l.startswith("FAILED") or l.startswith("ERROR")][:50],
              })

          # ---------- FASE 4: duplicados ----------
          pat_ruta = re.compile(r'@\s*\w+\.(get|post|put|delete|patch|websocket)\s*\(\s*["\']([^"\']+)["\']')
          rutas = defaultdict(list)
          for ruta, t in fuentes.items():
              for i, l in enumerate(t.splitlines(), 1):
                  m = pat_ruta.search(l)
                  if m:
                      rutas[(m.group(1).upper(), m.group(2))].append(f"{ruta}:{i}")
          rutas_dup = {k: v for k, v in rutas.items() if len(v) > 1}

          sim_dup = defaultdict(list)
          for ruta, t in fuentes.items():
              try:
                  arbol = ast.parse(t)
              except SyntaxError:
                  continue
              paq = str(p.parent)
              for nodo in arbol.body:
                  if isinstance(nodo, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      sim_dup[(paq, type(nodo).__name__, nodo.name)].append(f"{ruta}:{nodo.lineno}")
          sim_dup = {k: v for k, v in sim_dup.items() if len(v) > 1}

          hash_groups = defaultdict(list)
          for p in py_files:
              if p.stat().st_size <= 1:
                  continue
              try:
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  hash_groups[h].append(str(p))
              except Exception:
                  pass
          archivos_identicos = [v for v in hash_groups.values() if len(v) > 1]

          # ---------- FASE 5: shims y market_service ----------
          shims = []
          for p in py_files:
              t = fuentes.get(str(p), "")
              if not t or len(t.splitlines()) > 40:
                  continue
              try:
                  arbol = ast.parse(t)
              except SyntaxError:
                  continue
              cuerpo = [n for n in arbol.body
                        if not (isinstance(n, ast.Expr) and isinstance(n.value, ast.Constant))]
              if cuerpo and all(isinstance(n, (ast.Import, ast.ImportFrom)) or
                                (isinstance(n, ast.Assign) and any(getattr(d, "id", "") == "__all__" for d in n.targets))
                                for n in cuerpo):
                  objetivos = []
                  for n in arbol.body:
                      if isinstance(n, ast.ImportFrom) and n.module:
                          objetivos.append(n.module)
                  shims.append({"archivo": str(p), "lineas": len(t.splitlines()), "objetivos": objetivos,
                                "objetivo_existe": all(o in mod_paths or o.split(".")[0] in stdlib or top_existe(o.split(".")[0]) for o in objetivos)})

          market = Path("apps/agro/services/market_service.py")
          market_estado = {
              "existe": market.is_file(),
              "bytes": market.stat().st_size if market.is_file() else 0,
              "lineas": len(fuentes.get(str(market), "").splitlines()) if str(market) in fuentes else 0,
          }
          refs_market = []
          patron_market = re.compile(r'\bmarket_service\b|\bfrom\s+[\w.]*market_service')
          for ruta, t in fuentes.items():
              if ruta == str(market):
                  continue
              for i, l in enumerate(t.splitlines(), 1):
                  if patron_market.search(l):
                      refs_market.append(f"{ruta}:{i} {l.strip()[:120]}")

          # ---------- FASE 6: vacios no-init clasificados ----------
          contenidos = {r: t for r, t in fuentes.items() if t}
          stems = sorted({p.stem for p in noinit_vacios}, key=len, reverse=True)
          refs = defaultdict(set)
          if stems:
              gran_regex = re.compile(r'\b(' + "|".join(re.escape(s) for s in stems) + r')\b')
              for ruta, t in contenidos.items():
                  for m in gran_regex.finditer(t):
                      refs[m.group(1)].add(ruta)
          vacios_huerfanos, vacios_referenciados, vacios_pruebas = [], [], []
          ref_detalle = {}
          for p in noinit_vacios:
              es_test = p.parent.name == "tests" or p.name.startswith("test_")
              docena = refs.get(p.stem, set())
              docena = {x for x in docena if x != str(p)}
              dot = str(p.relative_to(RAIZ).with_suffix("")).replace("/", ".")
              refs_dot = [r for r, t in contenidos.items() if r != str(p) and dot in t]
              total_refs = sorted(set(docena) | set(refs_dot))
              if es_test:
                  vacios_pruebas.append(str(p))
              elif total_refs:
                  vacios_referenciados.append(str(p))
                  ref_detalle[str(p)] = total_refs[:8]
              else:
                  vacios_huerfanos.append(str(p))

          # ---------- FASE 7: punto a punto entre apps / inversiones ----------
          p2p = []
          for ruta, t in fuentes.items():
              for m in re.finditer(r'^\s*(?:from|import)\s+(apps\.(\w+))', t, re.M):
                  destino = m.group(2)
                  origen = ruta.split("/")[1] if ruta.startswith("apps/") and len(ruta.split("/")) > 2 else None
                  if origen and origen != destino:
                      p2p.append(f"{ruta} -> apps.{destino}")
          inversion = [f"{ruta}: shared_engines importa apps.*" for ruta, t in fuentes.items()
                       if ruta.startswith("shared_engines/") and re.search(r'^\s*(?:from|import)\s+apps\.', t, re.M)]

          # ---------- FASE 8: stubs y TODOs ----------
          stubs, todos_mk = [], []
          for ruta, t in fuentes.items():
              try:
                  arbol = ast.parse(t)
              except SyntaxError:
                  continue
              for nodo in arbol.body:
                  if isinstance(nodo, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      cuerpo = list(nodo.body)
                      if cuerpo and isinstance(cuerpo[0], ast.Expr) and isinstance(cuerpo[0].value, ast.Constant):
                          cuerpo = cuerpo[1:]
                      if not cuerpo or (len(cuerpo) == 1 and isinstance(cuerpo[0], ast.Pass)) or \
                         (len(cuerpo) == 1 and isinstance(cuerpo[0], ast.Expr) and cuerpo[0].value is Ellipsis):
                          stubs.append(f"{ruta}:{nodo.lineno} {nodo.name}")
              for i, l in enumerate(t.splitlines(), 1):
                  if re.search(r'\b(TODO|FIXME|XXX|HACK)\b', l):
                      todos_mk.append(f"{ruta}:{i}")

          # ---------- SALIDA ----------
          L = []
          A = lambda s: L.append(s)
          A("# 🔬 AUDITORIA TOTAL DEL REPOSITORIO — LECTURA PURA\n")
          A("**Nada fue modificado ni borrado. La lista de borrado es PROPUESTA y requiere aprobacion del dueno.**\n")

          A("## 1. CENSO (explica el salto de archivos)\n")
          total_relevante = len(todos) - len(pyc_files)
          A(f"- Archivos del proyecto (sin .pyc): **{total_relevante}**")
          A(f"- Basura de distribucion: {len(pyc_files)} archivos .pyc en {len(pycache_dirs)} carpetas __pycache__ (**excluir del ZIP — candidatos de limpieza**)")
          A(f"- Archivos .py: {len(py_files)} · vacios (<=1 byte): {len(vacios_py)} ({len(inits_vacios)} __init__ normales + {len(noinit_vacios)} funcionales)")
          A(f"- Carpetas vacias: {len(carpetas_vacias)}\n")
          A("| Directorio | Archivos | KB |")
          A("|---|---|---|")
          for top, n in por_top.most_common():
              A(f"| {top} | {n} | {bytes_top[top]//1024} |")
          A("")

          A("## 2. ✅ LO QUE FUNCIONA (evidencia)\n")
          A("| Carpeta de pruebas | Resultado | Conteo | Duracion |")
          A("|---|---|---|---|")
          for r in resultados_tests:
              e = "✅" if r["code"] == 0 else ("⏭ SIN TESTS" if r["code"] == 5 else "❌")
              A(f"| {r['carpeta']} | {e} | {r['conteo']} | {r['duracion']}s |")
          A("")
          verdes = [r for r in resultados_tests if r["code"] == 0]
          A(f"**Suites en verde: {len(verdes)}/{len(resultados_tests)}** — estos modulos estan acreditados por pruebas ejecutadas.\n")

          A("## 3. ❌ LO QUE NO FUNCIONA\n")
          fallidos = [r for r in resultados_tests if r["code"] not in (0, 5)]
          if fallidos:
              for r in fallidos:
                  A(f"### ❌ {r['carpeta']} ({r['conteo']})\n")
                  if r["fallos"]:
                      A("**Tests fallidos:**\n```")
                      A("\n".join(r["fallos"])); A("```")
                  A("<details><summary>Salida completa</summary>\n```")
                  A(r["cola"]); A("```\n</details>\n")
          else:
              A("(ningun fallo de pruebas)\n")
          if errores_sintaxis:
              A("### Errores de sintaxis\n```"); A("\n".join(errores_sintaxis)); A("```\n")
          if imports_rotos:
              A(f"### Imports rotos ({len(imports_rotos)}) — codigo que pide modulos inexistentes\n```")
              A("\n".join(imports_rotos[:200])); A("```\n")
          if inversion:
              A("### Inversion arquitectonica (shared_engines importa apps)\n```")
              A("\n".join(inversion)); A("```\n")

          A("## 4. 🔁 ERRORES Y DUPLICADOS\n")
          A(f"### Rutas HTTP duplicadas: {len(rutas_dup)}\n")
          for (met, path), sitios in sorted(rutas_dup.items()):
              A(f"- `{met} {path}` -> {', '.join(sitios)}")
          A("")
          A(f"### Simbolos duplicados en el mismo paquete: {len(sim_dup)}\n")
          for (paq, tipo, nom), sitios in sorted(sim_dup.items()):
              A(f"- {tipo} `{nom}` en `{paq}` -> {', '.join(sitios)}")
          A("")
          A(f"### Archivos .py con contenido IDENTICO: {len(archivos_identicos)} grupos\n")
          for g in archivos_identicos[:60]:
              A(f"- {', '.join(g)}")
          A("")

          A("## 5. SHIMS de red (validacion de los clientes sustituidos)\n")
          A(f"Detectados: {len(shims)}\n")
          for s in shims:
              A(f"- `{s['archivo']}` ({s['lineas']} lineas) -> {s['objetivos']} [{'✅ OK' if s['objetivo_existe'] else '❌ OBJETIVO ROTO'}]")
          A("")

          A("## 6. apps/agro/services/market_service.py\n")
          A(f"- Existe: **{market_estado['existe']}** · bytes: {market_estado['bytes']} · lineas: {market_estado['lineas']}")
          A(f"- Referencias en el repo: {len(refs_market)}")
          for r in refs_market[:30]:
              A(f"  - {r}")
          A("")

          A("## 7. 🗑️ CLASIFICACION DE VACIOS FUNCIONALES (base de la lista de borrado)\n")
          A(f"### HUERFANOS (0 referencias -> CANDIDATOS A BORRAR, requiere tu aprobacion): {len(vacios_huerfanos)}\n```")
          A("\n".join(vacios_huerfanos) if vacios_huerfanos else "(ninguno)"); A("```")
          A(f"### REFERENCIADOS (NO se pueden borrar -> A IMPLEMENTAR): {len(vacios_referenciados)}\n")
          for v in vacios_referenciados[:120]:
              A(f"- `{v}` <- referenciado por {', '.join(ref_detalle.get(v, []))}")
          A("")
          A(f"### PRUEBAS VACIAS (reemplazar por pruebas reales): {len(vacios_pruebas)}\n```")
          A("\n".join(vacios_pruebas) if vacios_pruebas else "(ninguna)"); A("```")
          A("")

          A(f"## 8. Stubs: {len(stubs)} · TODO/FIXME: {len(todos_mk)}\n")
          if stubs:
              A("```"); A("\n".join(stubs[:80])); A("```")
          A("")

          A("## 9. LISTA DE BORRADO PROPUESTA (NADA SE BORRA AUN)\n")
          A("| Categoria | Cantidad | Accion propuesta |")
          A("|---|---|---|")
          A(f"| {len(pyc_files)} archivos .pyc + {len(pycache_dirs)} __pycache__ | {len(pycache_dirs)} | Excluir del ZIP de distribucion (limpieza) |")
          A(f"| Vacios huerfanos (0 referencias) | {len(vacios_huerfanos)} | Borrar con tu aprobacion |")
          A(f"| Archivos identicos duplicados | {len(archivos_identicos)} grupos | Consolidar 1, revisar imports |")
          A(f"| Vacios referenciados | {len(vacios_referenciados)} | NO borrar: implementar |")
          A(f"| Pruebas vacias | {len(vacios_pruebas)} | NO borrar: reemplazar |")
          A("")
          A("## 10. Conexiones punto a punto entre apps\n")
          if p2p:
              for c in sorted(set(p2p))[:60]:
                  A(f"- {c}")
          else:
              A("(ninguna)")
          A("")

          md = "\n".join(L)
          Path("auditoria_repo_completo.md").write_text(md, encoding="utf-8")
          Path("auditoria_repo_completo.json").write_text(json.dumps({
              "censo": {"total": total_relevante, "pyc": len(pyc_files), "py": len(py_files),
                        "vacios_noinit": len(noinit_vacios), "carpetas_vacias": len(carpetas_vacias)},
              "sintaxis": errores_sintaxis, "imports_rotos": imports_rotos,
              "tests": [{k: v for k, v in r.items()} for r in resultados_tests],
              "rutas_dup": {f"{k[0]} {k[1]}": v for k, v in rutas_dup.items()},
              "sim_dup": {f"{k[0]}|{k[1]}|{k[2]}": v for k, v in sim_dup.items()},
              "identicos": archivos_identicos, "shims": shims,
              "market_service": {"estado": market_estado, "referencias": refs_market},
              "vacios_huerfanos": vacios_huerfanos, "vacios_referenciados": vacios_referenciados,
              "vacios_pruebas": vacios_pruebas, "stubs": stubs, "todos": todos_mk,
              "p2p": sorted(set(p2p)), "inversion": inversion,
          }, indent=2, ensure_ascii=False), encoding="utf-8")

          if summary:
              salida = md
              if len(salida) > 900000:
                  salida = salida[:900000] + "\n\n**(RECORTE — reporte COMPLETO en el artefacto)**\n"
              with open(summary, "a") as fh:
                  fh.write(salida)
          print(f"OK auditoria: {total_relevante} archivos proyecto, {len(pyc_files)} pyc, "
                f"{len(vacios_huerfanos)} huerfanos, {len(vacios_referenciados)} referenciados, "
                f"{len(imports_rotos)} imports rotos")
          PY

      - name: Publicar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-repo-completo
          path: |
            auditoria_repo_completo.md
            auditoria_repo_completo.json
