          echo $? > /tmp/x5
          for par in "x6 Red" "x1 nexo" "x2 axis" "x3 agro" "x4 semilla" "x5 subastas"
          do
            set -- $par
            code=$(cat /tmp/$1 2>/dev/null || echo 1)
            passed=$(grep -oE "[0-9]+ passed" /tmp/$1.out 2>/dev/null | tail -1)
            if [ "$code" = "0" ]; then
              echo "- REG $2: ✅ ($passed)" >> "$SUM"
            else
              echo "- REG $2: ❌ ($passed)" >> "$SUM"
              { echo "### $2 fallos"; echo '```'; tail -30 /tmp/$1.out; echo '```'; } >> "$SUM"
            fi
          done
