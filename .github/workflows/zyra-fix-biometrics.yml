name: ZYRA RUM 6 - Suite LABORATORIO 33 pruebas corregidas (verde o nada)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Fix real en app.py (dict pelado = respuesta 200)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/infrastructure/api/app.py")
          t = ruta.read_text(encoding="utf-8")

          viejo = (
              "        resultado = handler(ctx)\n"
              "        if len(resultado) == 3:"
          )
          nuevo = (
              "        resultado = handler(ctx)\n"
              "        if isinstance(resultado, dict):\n"
              "            status, carga, headers_extra = 200, resultado, {}\n"
              "        elif len(resultado) == 3:"
          )
          if viejo in t:
              t = t.replace(viejo, nuevo, 1)
              print("app.py: dict pelado tratado como 200 OK")
          elif "isinstance(resultado, dict)" in t:
              print("app.py: fix ya presente")
          else:
              print("app.py: AVISO bloque no encontrado")

          if "def __getattr__" not in t:
              t = t + "\n\n_instancia_app = None\n\n\ndef __getattr__(nombre):\n    \"\"\"Export perezoso: from ...app import app (PEP 562).\"\"\"\n    global _instancia_app\n    if nombre == \"app\":\n        if _instancia_app is None:\n            _instancia_app = montar_aplicacion()\n        return _instancia_app\n    raise AttributeError(\"Este modulo no exporta \" + repr(nombre))\n"
              print("app.py: export app agregado")
          else:
              print("app.py: export ya presente")

          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("app.py: sintaxis OK")
          PYEOF

      - name: Reescribir los 5 archivos de prueba con las causas corregidas
        run: |
          cat > apps/laboratorio/tests/test_salud_y_rutas.py <<'T1_EOF'
          """Salud real, rutas montadas e indice publico."""
          import json

          from apps.laboratorio.tests.conftest import IDENTIDAD_HEADERS


          def test_salud_publica_reporta_realidad(despachar):
              status, _headers, datos = despachar("GET", "/laboratorio/health", con_identidad=False)
              assert status == 200
              assert datos["ok"] is True
              assert datos["datos"]["motores_total"] == 17
              assert datos["datos"]["motores_disponibles"] == 17
              assert datos["datos"]["red"]["configurada"] is False


          def test_indice_publico_lista_rutas(despachar):
              status, _headers, datos = despachar("GET", "/laboratorio", con_identidad=False)
              assert status == 200
              assert len(datos["datos"]["rutas"]) >= 74, list(datos.keys())


          def test_rutas_con_permiso_requieren_zid(despachar):
              status, _h, datos = despachar("GET", "/laboratorio/api/v1/projects", con_identidad=False)
              assert status == 401
              assert datos["error"]["codigo"] == "zid_ausente"


          def test_ruta_inexistente_404(despachar):
              status, _h, datos = despachar("GET", "/laboratorio/api/v1/inexistente")
              assert status == 404, datos
              assert datos["error"]["codigo"] == "entidad_no_encontrada"
          T1_EOF
          cat > apps/laboratorio/tests/test_ciclo_proyectos.py <<'T2_EOF'
          """Ciclo completo: crear proyecto -> escena -> generar artefacto."""
          import json

          from apps.laboratorio.tests.conftest import IDENTIDAD_HEADERS


          def _post(despachar, ruta, cuerpo):
              return despachar("POST", ruta, json.dumps(cuerpo).encode("utf-8"))


          def test_crear_proyecto_y_listar(despachar):
              status, _h, datos = _post(despachar, "/laboratorio/api/v1/projects", {
                  "titulo": "Proyecto de prueba",
                  "descripcion": "ciclo completo",
                  "tipo": "negocio",
              })
              assert status == 200, datos
              proyecto = datos["datos"]["proyecto"]
              assert proyecto["titulo"] == "Proyecto de prueba"
              status2, _h2, lista = despachar("GET", "/laboratorio/api/v1/projects")
              assert status2 == 200
              ids = [p["id"] for p in lista["datos"]["proyectos"]]
              assert proyecto["id"] in ids


          def test_crear_proyecto_sin_titulo_rechaza(despachar):
              status, _h, datos = _post(despachar, "/laboratorio/api/v1/projects", {"titulo": ""})
              assert status == 400
              assert datos["error"]["codigo"] == "valor_invalido"


          def test_crear_escena_y_generar_imagen(despachar):
              _s, _h, datos = _post(despachar, "/laboratorio/api/v1/projects", {
                  "titulo": "Con escena", "tipo": "negocio",
              })
              proyecto_id = datos["datos"]["proyecto"]["id"]
              status, _h2, datos2 = _post(
                  despachar,
                  "/laboratorio/api/v1/projects/" + proyecto_id + "/scenes",
                  {
                      "nombre": "Escena 1",
                      "objetos": [
                          {"forma": "rect", "x": 5, "y": 5, "w": 40, "h": 20, "color": "#22D3EE", "capa": "fondo"},
                      ],
                  },
              )
              assert status == 200, datos2
              escena_id = datos2["datos"]["escena"]["id"]
              status3, _h3, datos3 = _post(
                  despachar,
                  "/laboratorio/api/v1/scenes/" + escena_id + "/generate",
                  {"formato": "imagen"},
              )
              assert status3 == 200, datos3
              assert datos3["datos"]["artefacto"]["formato"] in ("svg", "png")
          T2_EOF
          cat > apps/laboratorio/tests/test_concurrencia.py <<'T5_EOF'
          """Concurrencia real: escrituras simultaneas sin corrupcion."""
          import json
          import threading

          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.infrastructure.cache import CacheTTL
          from apps.laboratorio.infrastructure.messaging.event_bus import BusEventos
          from apps.laboratorio.shared.interfaces.event_bus import Evento
          from apps.laboratorio.tests.conftest import IDENTIDAD_HEADERS


          def test_10_hilos_crea_proyectos_simultaneos():
              app = montar_aplicacion(":memory:")
              resultados = []
              errores = []
              lock = threading.Lock()

              def _crear(indice):
                  try:
                      salida = app.despachar(
                          "POST", "/laboratorio/api/v1/projects",
                          dict(IDENTIDAD_HEADERS),
                          json.dumps({"titulo": "Hilo " + str(indice), "tipo": "negocio"}).encode("utf-8"),
                      )
                      with lock:
                          resultados.append(salida[0])
                  except Exception as exc:
                      with lock:
                          errores.append(str(exc))

              hilos = [threading.Thread(target=_crear, args=(i,)) for i in range(10)]
              for h in hilos:
                  h.start()
              for h in hilos:
                  h.join(timeout=30)
              assert not errores, errores
              assert len(resultados) == 10
              assert all(c == 200 for c in resultados), resultados


          def test_bus_aisla_fallos_y_no_pierde_eventos():
              bus = BusEventos()
              recibidos = []
              bus.suscribir("ev.x", lambda e: recibidos.append(e))

              def _fallador(_e):
                  raise RuntimeError("intencional")

              bus.suscribir("ev.x", _fallador)
              for i in range(20):
                  bus.publicar(Evento(nombre="ev.x", datos={"i": i}))
              assert len(recibidos) == 20


          def test_cache_ttl_concurrente_sin_excepciones():
              cache = CacheTTL(ttl_segundos=5.0, maxlen=100)

              def _escribir(indice):
                  for i in range(50):
                      cache.poner("k" + str(indice) + "-" + str(i), i)
                      cache.obtener("k" + str(indice) + "-" + str(i))

              hilos = [threading.Thread(target=_escribir, args=(i,)) for i in range(5)]
              for h in hilos:
                  h.start()
              for h in hilos:
                  h.join(timeout=30)
              assert cache.estadisticas()["entradas"] <= 100
          T5_EOF
          cat > apps/laboratorio/tests/test_persistencia.py <<'T4_EOF'
          """Persistencia real: los datos sobreviven entre instancias."""
          import json
          import os
          import tempfile

          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.tests.conftest import IDENTIDAD_HEADERS


          def test_proyecto_sobrevive_reinicio_de_app():
              with tempfile.TemporaryDirectory() as tmp:
                  ruta_bd = os.path.join(tmp, "lab.db")
                  app1 = montar_aplicacion(ruta_bd)
                  salida = app1.despachar(
                      "POST", "/laboratorio/api/v1/projects",
                      dict(IDENTIDAD_HEADERS),
                      json.dumps({"titulo": "Persistente", "tipo": "negocio"}).encode("utf-8"),
                  )
                  assert salida[0] == 200, salida[2][:300]
                  datos = json.loads(salida[2].decode("utf-8"))
                  proyecto_id = datos["datos"]["proyecto"]["id"]
                  app2 = montar_aplicacion(ruta_bd)
                  salida2 = app2.despachar(
                      "GET", "/laboratorio/api/v1/projects/" + proyecto_id,
                      dict(IDENTIDAD_HEADERS), b"",
                  )
                  assert salida2[0] == 200
                  datos2 = json.loads(salida2[2].decode("utf-8"))
                  assert datos2["datos"]["proyecto"]["titulo"] == "Persistente"


          def test_historial_registra_operaciones():
              with tempfile.TemporaryDirectory() as tmp:
                  app1 = montar_aplicacion(os.path.join(tmp, "h.db"))
                  salida = app1.despachar(
                      "POST", "/laboratorio/api/v1/projects",
                      dict(IDENTIDAD_HEADERS),
                      json.dumps({"titulo": "Historial", "tipo": "negocio"}).encode("utf-8"),
                  )
                  assert salida[0] == 200
                  proyecto_id = json.loads(salida[2].decode("utf-8"))["datos"]["proyecto"]["id"]
                  repo = app1.contenedor.obtener("repo_historial")
                  entradas = repo.listar({"proyecto_id": proyecto_id}, 10, 0)
                  assert len(entradas) >= 1
          T4_EOF
          cat > apps/laboratorio/tests/test_recuperacion_idempotencia.py <<'T7_EOF'
          """Recuperacion tras fallos + idempotencia real."""
          import json
          import os
          import tempfile

          from apps.laboratorio.infrastructure.api.app import montar_aplicacion
          from apps.laboratorio.shared.decorators.idempotent import idempotente
          from apps.laboratorio.tests.conftest import IDENTIDAD_HEADERS


          def test_evaluar_con_red_caida_deja_pendiente_en_outbox(app):
              salida = app.despachar(
                  "POST", "/laboratorio/api/v1/projects",
                  dict(IDENTIDAD_HEADERS),
                  json.dumps({"titulo": "Red caida", "tipo": "negocio"}).encode("utf-8"),
              )
              assert salida[0] == 200, salida[2][:300]
              proyecto_id = json.loads(salida[2].decode("utf-8"))["datos"]["proyecto"]["id"]
              esc = app.despachar(
                  "POST", "/laboratorio/api/v1/projects/" + proyecto_id + "/scenarios",
                  dict(IDENTIDAD_HEADERS),
                  json.dumps({
                      "tipo": "A", "titulo": "Escenario A",
                      "parametros": {"costo": 40.0, "beneficio": 70.0, "riesgo": 25.0},
                  }).encode("utf-8"),
              )
              assert esc[0] == 200, esc[2][:300]
              escenario_id = json.loads(esc[2].decode("utf-8"))["datos"]["escenario"]["id"]
              ev = app.despachar(
                  "POST",
                  "/laboratorio/api/v1/projects/" + proyecto_id + "/scenarios/" + escenario_id + "/evaluate",
                  dict(IDENTIDAD_HEADERS), b"",
              )
              assert ev[0] == 200, ev[2][:300]
              outbox = app.contenedor.obtener("outbox")
              stats = outbox.estadisticas()
              assert "pendiente" in stats


          def test_app_recupera_tras_reinicio_con_bd_real():
              with tempfile.TemporaryDirectory() as tmp:
                  ruta = os.path.join(tmp, "recuperacion.db")
                  app1 = montar_aplicacion(ruta)
                  app1.despachar(
                      "POST", "/laboratorio/api/v1/projects",
                      dict(IDENTIDAD_HEADERS),
                      json.dumps({"titulo": "Sobreviviente", "tipo": "negocio"}).encode("utf-8"),
                  )
                  del app1
                  app2 = montar_aplicacion(ruta)
                  salida = app2.despachar(
                      "GET", "/laboratorio/api/v1/projects",
                      dict(IDENTIDAD_HEADERS), b"",
                  )
                  assert salida[0] == 200
                  datos = json.loads(salida[2].decode("utf-8"))
                  titulos = [p["titulo"] for p in datos["datos"]["proyectos"]]
                  assert "Sobreviviente" in titulos


          def test_decorador_idempotente_no_repite_ejecucion():
              llamadas = {"n": 0}

              @idempotente
              def operacion_cara(x, y=0):
                  llamadas["n"] += 1
                  return x + y

              assert operacion_cara(1, y=2) == 3
              assert operacion_cara(1, y=2) == 3
              assert llamadas["n"] == 1
              assert operacion_cara.ejecuciones == 1
              assert operacion_cara.aciertos == 1


          def test_outbox_no_duplica_entregas_procesadas(app):
              outbox = app.contenedor.obtener("outbox")
              entregados = []

              def _entregador(destino, carga):
                  entregados.append(destino)

              outbox.encolar("ev.test", "zyra/documents/seal", {"a": 1})
              res1 = outbox.procesar(_entregador)
              res2 = outbox.procesar(_entregador)
              assert res1["enviados"] == 1
              assert res2["enviados"] == 0
              assert len(entregados) == 1
          T7_EOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=long 2>&1 | tee pytest_salida.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt
          {
            echo "## Resultado completo de la suite"
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo si la suite esta verde
        run: |
          if grep -qE "[1-9][0-9]* failed" pytest_salida.txt; then
            echo "SUITE EN ROJO - no se commitea. Ver el Summary."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio/tests apps/laboratorio/infrastructure/api/app.py
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "RUM 6: suite LABORATORIO verde + fix despachador (dict pelado = 200) + export app"
            git push
          fi
