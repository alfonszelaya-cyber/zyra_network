          def test_a6_cosecha_lotes_trazabilidad(tmp_path) -> None:
              db = _db(tmp_path, "a6.db")
              db.execute(
                  "INSERT INTO agro_plans (plan_id,"
                  " producer_id, unit_id, crop, target,"
                  " status, created_at) VALUES ('PLN-2',"
                  " 'P1', 'U-1', 'MAIZ', 100.0, 'harvested',"
