name: "ZYRA NEXO NG9+NG10 family office extras + menus y registry"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[LECTURA] Estructura de server.py para wiring NG12"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          out("## server.py (solo lectura, para wiring NG12)")
          p = pathlib.Path("apps/nexo/server.py")
          if not p.exists():
              out("- NO EXISTE")
          else:
              tree = ast.parse(p.read_text(encoding="utf-8",
                                           errors="replace"))
              for node in tree.body:
                  if isinstance(node, ast.ClassDef):
                      ms = [n.name for n in node.body
                            if isinstance(n, (ast.FunctionDef,
                                              ast.AsyncFunctionDef))]
                      out("- **class " + node.name + "**: "
                          + ", ".join(ms[:30]))
                  elif isinstance(node, (ast.FunctionDef,
                                         ast.AsyncFunctionDef)):
                      out("- def " + node.name)
              import re
              txt = p.read_text(encoding="utf-8",
                                errors="replace")
              rutas = sorted(set(re.findall(
                  r'[\'"](/[\w\-/\{\}\.:]+)[\'"]', txt)))
              out("- rutas: " + ", ".join(rutas[:60]))
          out("- NOTA: el wiring de menus al server se hace en NG12")
          PYEOF
          exit 0

      - name: "[ESCRITURA] NG9 family office extras (7 engines + 15 use cases)"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          FO = "apps/nexo/domain/family_office"
          UF = "apps/nexo/application/family_office_use_cases"

          ENGINES = [
              ("agricultural_land_engine.py",
               "AgriculturalLandEngine",
               "nexo_fo_agri_land", "nexo.fo.agri", "AG",
               "Tierras Agricolas",
               ["hectares", "crop_type", "location"],
               "manage_agricultural_land_use_case.py",
               "ManageAgriculturalLandUseCase"),
              ("art_engine.py", "ArtEngine",
               "nexo_fo_art", "nexo.fo.art", "ART",
               "Obras de Arte",
               ["artist", "year", "medium"],
               "manage_art_assets_use_case.py",
               "ManageArtAssetsUseCase"),
              ("business_assets_engine.py",
               "BusinessAssetsEngine",
               "nexo_fo_business_assets", "nexo.fo.biz", "BIZ",
               "Activos Empresariales",
               ["business_name", "ownership_pct"],
               "manage_business_assets_use_case.py",
               "ManageBusinessAssetsUseCase"),
              ("collectibles_engine.py", "CollectiblesEngine",
               "nexo_fo_collectibles", "nexo.fo.col", "COL",
               "Coleccionables",
               ["category", "condition_grade"],
               "manage_collectibles_use_case.py",
               "ManageCollectiblesUseCase"),
              ("metals_engine.py", "MetalsEngine",
               "nexo_fo_metals", "nexo.fo.met", "MET",
               "Metales Preciosos",
               ["metal_type", "weight_grams", "purity"],
               "manage_metals_use_case.py",
               "ManageMetalsUseCase"),
              ("real_estate_engine.py", "RealEstateEngine",
               "nexo_fo_real_estate", "nexo.fo.re", "RE",
               "Bienes Raices",
               ["property_type", "location", "area_m2"],
               "manage_real_estate_use_case.py",
               "ManageRealEstateUseCase"),
              ("vehicles_engine.py", "VehiclesEngine",
               "nexo_fo_vehicles", "nexo.fo.veh", "VEH",
               "Vehiculos",
               ["make", "model", "model_year", "plate"],
               "manage_vehicles_use_case.py",
               "ManageVehiclesUseCase"),
          ]

          ENG_TMPL = D(r'''
              """@@LABEL@@ Engine - Family Office (NG9).
              Activo especializado del portfolio familiar: valor
              SIEMPRE Decimal 2 decimales (regla 61), persistencia
              real (regla 66). Autocontenido (tabla propia, no toca
              engines existentes)."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _Q = "0.01"

              _MIGRATIONS = (
                  Migration(1, "@@TABLE@@", (
                      "CREATE TABLE IF NOT EXISTS @@TABLE@@ (asset_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, name TEXT NOT NULL, value TEXT NOT NULL DEFAULT '0', @@COLS_SQL@@, status TEXT NOT NULL DEFAULT 'ACTIVE', created_at REAL NOT NULL)",
                  )),
              )

              class @@CLASS@@:
                  """@@LABEL@@ del family office (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "@@MIGID@@",
                                      _MIGRATIONS).run(clock)

                  def register(self, *, company_id, name, value,
                               @@FIELDS@@) -> dict:
                      from decimal import Decimal as _D
                      val = _D(str(value)).quantize(_D(_Q))
                      aid = "@@PREFIX@@" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO @@TABLE@@"
                              " (asset_id, company_id, name,"
                              " value, @@FIELDS@@, status,"
                              " created_at)"
                              " VALUES (?, ?, ?, ?, @@PH@@,"
                              " 'ACTIVE', ?)",
                              (aid, company_id, name, str(val),
                               @@ARGS@@, now))
                      return self.get(aid)

                  def _row(self, r) -> dict:
                      from decimal import Decimal as _D
                      d = {"asset_id": str(r["asset_id"]),
                           "company_id": str(r["company_id"]),
                           "name": str(r["name"]),
                           "value": str(_D(str(r["value"]))
                                        .quantize(_D(_Q))),
                           "status": str(r["status"])}
              @@ROWEXTRA@@
                      return d

                  def get(self, asset_id) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM @@TABLE@@ WHERE"
                          " asset_id = ?", (asset_id,))
                      return self._row(row) if row else None

                  def list_for(self, company_id) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT asset_id FROM @@TABLE@@ WHERE"
                          " company_id = ? ORDER BY created_at",
                          (company_id,))
                      return [self.get(str(r["asset_id"]))
                              for r in rows]

                  def total_value(self, company_id) -> str:
                      from decimal import Decimal as _D
                      rows = self._db.query_all(
                          "SELECT value FROM @@TABLE@@ WHERE"
                          " company_id = ? AND status = 'ACTIVE'",
                          (company_id,))
                      total = _D("0")
                      for r in rows:
                          total = total + _D(str(r["value"]))
                      return str(total.quantize(_D(_Q)))

                  def update_value(self, asset_id,
                                   new_value) -> dict:
                      from decimal import Decimal as _D
                      val = _D(str(new_value)).quantize(_D(_Q))
                      self._db.execute(
                          "UPDATE @@TABLE@@ SET value = ? WHERE"
                          " asset_id = ?", (str(val), asset_id))
                      return self.get(asset_id)

                  def deactivate(self, asset_id) -> dict:
                      self._db.execute(
                          "UPDATE @@TABLE@@ SET"
                          " status = 'INACTIVE' WHERE"
                          " asset_id = ?", (asset_id,))
                      return self.get(asset_id)
          ''')

          UC_TMPL = D(r'''
              """@@LABEL@@: use case de gestion (NG9)."""
              from __future__ import annotations
              from apps.nexo.domain.family_office.@@ENGFILE@@ import (
                  @@ENGCLASS@@)

              class @@UCCLASS@@:
                  """Alta, listado y valor total de @@LABEL@@."""

                  def __init__(self, engine):
                      self._eng = engine

                  def execute(self, *, action, company_id,
                              **kwargs) -> dict:
                      if action == "register":
                          return {"registered":
                                      self._eng.register(
                                          company_id=company_id,
                                          **kwargs)}
                      if action == "list":
                          return {"assets":
                                      self._eng.list_for(
                                          company_id)}
                      if action == "total":
                          return {"total":
                                      self._eng.total_value(
                                          company_id)}
                      return {"error": "accion desconocida: "
                              + str(action)}
          ''')

          for spec in ENGINES:
              (efile, ecls, table, migid, prefix, label, fields,
               ucfile, uccls) = spec
              cols_sql = ", ".join(f + " TEXT NOT NULL DEFAULT ''"
                                   for f in fields)
              content = (ENG_TMPL
                         .replace("@@LABEL@@", label)
                         .replace("@@TABLE@@", table)
                         .replace("@@CLASS@@", ecls)
                         .replace("@@MIGID@@", migid)
                         .replace("@@PREFIX@@", prefix)
                         .replace("@@FIELDS@@",
                                  ", ".join(fields))
                         .replace("@@ARGS@@",
                                  ", ".join("str(" + f + ")"
                                            for f in fields))
                         .replace("@@PH@@",
                                  ", ".join(["?"] * len(fields)))
                         .replace("@@COLS_SQL@@", cols_sql)
                         .replace("@@ROWEXTRA@@",
                                  "\n".join(
                                      '            d["' + f
                                      + '"] = str(r["'
                                      + f + '"])'
                                      for f in fields)))
              forzar(FO + "/" + efile, content)
              uc_content = (UC_TMPL
                            .replace("@@LABEL@@", label)
                            .replace("@@ENGFILE@@", efile)
                            .replace("@@ENGCLASS@@", ecls)
                            .replace("@@UCCLASS@@", uccls))
              forzar(UF + "/" + ucfile, uc_content)

          forzar(UF + "/asset_valuation_use_case.py", D(r'''
              from apps.nexo.application.family_office_use_cases.asset_valuation import (
                  AssetValuationUseCase)
          '''))
          forzar(UF + "/create_trust_use_case.py", D(r'''
              from apps.nexo.application.family_office_use_cases.create_trust import (
                  CreateTrustUseCase)
          '''))
          forzar(UF + "/inheritance_planning_use_case.py", D(r'''
              from apps.nexo.application.family_office_use_cases.inheritance_planning import (
                  InheritancePlanningUseCase)
          '''))
          forzar(UF + "/manage_wealth_use_case.py", D(r'''
              from apps.nexo.application.family_office_use_cases.manage_wealth import (
                  ManageWealthUseCase)
          '''))
          forzar(UF + "/register_family_asset_use_case.py", D(r'''
              from apps.nexo.application.family_office_use_cases.register_family_asset import (
                  RegisterFamilyAssetUseCase)
          '''))
          forzar(UF + "/world_heritage_management_use_case.py", D(r'''
              from apps.nexo.application.family_office_use_cases.world_heritage_management import (
                  WorldHeritageManagementUseCase)
          '''))

          forzar(UF + "/family_governance_use_case.py", D(r'''
              """Gobierno familiar: use case (NG9)."""
              from __future__ import annotations
              from apps.nexo.domain.family_office.family_governance_engine import (
                  FamilyGovernanceEngine)

              class FamilyGovernanceUseCase:
                  """Registrar y consultar decisiones familiares."""

                  def __init__(self, governance_engine):
                      self._eng = governance_engine

                  def execute(self, *, action, subject="",
                              participants=None,
                              resolution="") -> dict:
                      if action == "register":
                          return {"decision":
                                      self._eng.register_decision(
                                          subject=subject,
                                          participants=(participants
                                                        or []),
                                          resolution=resolution)}
                      if action == "list":
                          return {"decisions":
                                      self._eng.get_decisions()}
                      return {"error": "accion desconocida: "
                              + str(action)}
          '''))

          forzar(UF + "/succession_planning_use_case.py", D(r'''
              """Planeacion sucesoria: use case (NG9)."""
              from __future__ import annotations
              from apps.nexo.domain.family_office.succession_engine import (
                  SuccessionEngine)

              class SuccessionPlanningUseCase:
                  """Crear y consultar planes sucesorios."""

                  def __init__(self, succession_engine):
                      self._eng = succession_engine

                  def execute(self, *, action, title="",
                              successors=None, assets=None) -> dict:
                      if action == "create":
                          return {"plan":
                                      self._eng.create_plan(
                                          title=title,
                                          successors=(successors
                                                      or []),
                                          assets=(assets or []))}
                      if action == "list":
                          return {"plans":
                                      self._eng.get_plans()}
                      return {"error": "accion desconocida: "
                              + str(action)}
          '''))

          out("## FIN NG9: family office extras")
          exit(0)
          PYEOF

      - name: "[ESCRITURA] NG10 menus de modulos + registry + router"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
