name: "DOCS-1: auditoria motor transversal de documentos (SOLO LECTURA) - document_exchange + seal + lo que existe"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: docs-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Dump 1: document_exchange.py COMPLETO (el candidato a nucleo del motor)"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          p = Path(
              "shared_engines/network/document_exchange.py")
          print("=== document_exchange.py ===")
          if p.exists():
              for i, l in enumerate(
                  p.read_text(encoding="utf-8").splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          else:
              print("NO EXISTE; busco otros:")
              for f in Path("shared_engines").rglob("*.py"):
                  t = f.read_text(encoding="utf-8",
                      errors="replace")
                  if "document" in t.lower() and "exchange" in t.lower():
                      print("  candidato: " + str(f))
          D1EOF

      - name: "Dump 2: API HTTP de documentos (rutas documents en capabilities_api + api)"
        run: |
          python3 - <<'D2EOF'
          from pathlib import Path
          for nombre in ("shared_engines/runtime/capabilities_api.py",
                         "shared_engines/runtime/api.py"):
              p = Path(nombre)
              lines = p.read_text(
                  encoding="utf-8").splitlines()
              print()
              print("=== " + nombre
                    + " (rutas documents/seal/download) ===")
              for i, l in enumerate(lines, 1):
                  if ("documents" in l
                          or "seal" in l
                          or "download" in l):
                      print(str(i).rjust(5)
                            + ": " + l.strip()[:120])
          D2EOF

      - name: "Dump 3: publico de document_exchange (firmas) + su test"
        run: |
          python3 - <<'D3EOF'
          import inspect
          from pathlib import Path
          try:
              from shared_engines.network import (
                  document_exchange as de)
              print("=== document_exchange publico ===")
              for n in sorted(
                  a for a in dir(de)
                  if not a.startswith("_")):
                  o = getattr(de, n)
                  if inspect.isfunction(o) or inspect.isclass(o):
                      try:
                          print(n, inspect.signature(o))
                      except Exception:
                          print(n, "(sin firma)")
          except Exception as e:
              print("import fallo:", e)
          t = Path(
              "shared_engines/network/tests/test_document_exchange.py")
          print()
          print("=== test_document_exchange.py ===")
          if t.exists():
              for i, l in enumerate(
                  t.read_text(encoding="utf-8").splitlines(), 1):
                  print(str(i).rjust(4) + ": " + l)
          else:
              print("NO EXISTE test")
          D3EOF

      - name: "Dump 4: que tiene cada app para documentos hoy (superficie existente)"
        run: |
          python3 - <<'D4EOF'
          from pathlib import Path
          apps = ["apps/agro", "apps/axis", "apps/nexo",
                  "apps/subastas", "apps/semilla"]
          print("=== archivos de nombre documento/documents por app ===")
          for a in apps:
              base = Path(a)
              if not base.exists():
                  continue
              for f in sorted(base.rglob("*.py")):
                  if ("document" in f.name.lower()
                      or "doc_" in f.name.lower()):
                      print("  " + str(f))
              txt_hits = 0
              for f in base.rglob("*.py"):
                  try:
                      t = f.read_text(encoding="utf-8",
                          errors="replace")
                  except Exception:
                      continue
                  if "documents/seal" in t or "documents/" in t:
                      txt_hits += 1
              print("  -> " + a
                    + ": " + str(txt_hits)
                    + " archivos mencionan rutas documents/")
          D4EOF

      - name: "Contexto"
        run: |
          git log --oneline -3
