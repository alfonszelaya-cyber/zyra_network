      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (GRUPO A): 011 Seguridad + 006 Operaciones + 008 Logistica" -m "Three modules in their real folders: Seguridad (audit log, incidents, rules), Operaciones (extended order states, tasks), Logistica (carriers, customs, labels, incidents). Pages+API in modules, wired via importlib on fixed anchor. E2E 12 steps with cookies."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
