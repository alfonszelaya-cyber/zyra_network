name: ZYRA AGRO Block 2 Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Write agro_events.py
        run: |
          cat > apps/agro/services/agro_events.py <<'GEOF'
          """AGRO events - connect all important flows
          to the Network via ZyraLink. Never raises."""
          from __future__ import annotations

          from apps.agro.services.zyra_link import (
              ZyraLink,
          )


          class AgroEventService:
              def __init__(self, *, store, link):
                  self._store = store
                  self._link = link

              def _emit(self, producer_id, event, detail):
                  try:
                      producer = self._store.get_producer(
                          producer_id
                      )
                  except LookupError:
                      return None
                  zid = producer.get("zid")
                  if not zid:
                      return None
                  try:
                      ok, data, _err = (
                          self._link.record_agro_event(
                              str(zid), event, detail
                          )
                      )
                  except Exception:
                      return None
                  if not ok or data is None:
                      return None
                  for key in (
                      "seq",
                      "sequence",
                      "network_seq",
                      "entry_seq",
                  ):
                      value = data.get(key)
                      if isinstance(value, int):
                          return value
                  return None

              def producer_registered(
                  self, *, producer_id, producer_type,
              ):
                  return self._emit(
                      producer_id,
                      "producer.registered",
                      "type=" + producer_type,
                  )

              def producer_verified(
                  self, *, producer_id,
              ):
                  return self._emit(
                      producer_id,
                      "producer.verified",
                      "verified=True",
                  )

              def production_registered(
                  self,
                  *,
                  producer_id,
                  product,
                  quantity,
                  unit,
              ):
                  return self._emit(
                      producer_id,
                      "production.registered",
                      f"{product}: {quantity} {unit}",
                  )

              def sale_created(
                  self, *, producer_id, sale_id, detail,
              ):
                  return self._emit(
                      producer_id,
                      "sale.created",
                      f"{sale_id}: {detail}",
                  )

              def sale_completed(
                  self, *, producer_id, sale_id,
              ):
                  return self._emit(
                      producer_id,
                      "sale.completed",
                      sale_id,
                  )

              def aid_transition(
                  self, *, producer_id, aid_id, transition,
              ):
                  return self._emit(
                      producer_id,
                      "aid." + transition.lower(),
                      aid_id,
                  )

              def risk_detected(
                  self, *, producer_id, risk_type, detail,
              ):
                  return self._emit(
                      producer_id,
                      "risk.detected",
                      f"{risk_type}: {detail}",
                  )

              def incident_created(
                  self,
                  *,
                  producer_id,
                  incident_id,
                  detail,
              ):
                  return self._emit(
                      producer_id,
                      "incident.created",
                      f"{incident_id}: {detail}",
                  )

              def asset_registered(
                  self, *, producer_id, asset_type, detail,
              ):
                  return self._emit(
                      producer_id,
                      "asset.registered",
                      f"{asset_type}: {detail}",
                  )
          GEOF
          python3 -c "import ast; ast.parse(open('apps/agro/services/agro_events.py').read()); print('agro_events OK')"

      - name: Write agro events tests (complete, real signature)
        run: |
          cat > apps/agro/tests/test_agro_events.py <<'G2EOF'
          """AGRO events E2E tests."""
          from __future__ import annotations

          import unittest
          import uuid

          from apps.agro.services.agro_events import (
              AgroEventService,
          )
          from apps.agro.infrastructure.persistence.agro_store import (
              AgroStore,
          )
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter


          class _FakeLink:
              def __init__(self, working=True):
                  self.working = working
                  self.calls = []
                  self._seq = 100

              def record_agro_event(self, zid, event, detail):
                  self.calls.append((zid, event, detail))
                  if not self.working:
                      return (False, None, "network down")
                  self._seq += 1
                  return (True, {"seq": self._seq}, None)


          class AgroEventsE2E(unittest.TestCase):
              def _boot(self, has_zid=True, link_ok=True):
                  db = SQLiteAdapter(":memory:")
                  clock = FrozenClock()
                  store = AgroStore(db, clock)
                  producer_id = (
                      "PRD-" + uuid.uuid4().hex[:10]
                  )
                  store.add_producer(
                      producer_id=producer_id,
                      zid=(
                          "ZID-agro-1"
                          if has_zid
                          else None
                      ),
                      name="Jose Rural",
                      role="agricultor",
                      synced=has_zid,
                      producer_type="agricultor",
                      location="Chalatenango",
                  )
                  link = _FakeLink(working=link_ok)
                  svc = AgroEventService(
                      store=store, link=link
                  )
                  return svc, link, producer_id

              def test_producer_events_with_zid(self):
                  svc, link, producer_id = self._boot()
                  seq1 = svc.producer_registered(
                      producer_id=producer_id,
                      producer_type="agricultor",
                  )
                  self.assertIsNotNone(seq1)
                  seq2 = svc.producer_verified(
                      producer_id=producer_id
                  )
                  self.assertIsNotNone(seq2)
                  self.assertEqual(2, len(link.calls))
                  self.assertEqual(
                      "ZID-agro-1",
                      link.calls[0][0],
                  )
                  self.assertEqual(
                      "producer.registered",
                      link.calls[0][1],
                  )

              def test_production_and_sale_events(self):
                  svc, link, producer_id = self._boot()
                  seq1 = svc.production_registered(
                      producer_id=producer_id,
                      product="maiz",
                      quantity=50,
                      unit="quintal",
                  )
                  seq2 = svc.sale_created(
                      producer_id=producer_id,
                      sale_id="SALE-1",
                      detail="50 qq exportacion",
                  )
                  seq3 = svc.sale_completed(
                      producer_id=producer_id,
                      sale_id="SALE-1",
                  )
                  self.assertIsNotNone(seq1)
                  self.assertIsNotNone(seq2)
                  self.assertIsNotNone(seq3)
                  self.assertEqual(3, len(link.calls))

              def test_aid_risk_asset_events(self):
                  svc, link, producer_id = self._boot()
                  svc.aid_transition(
                      producer_id=producer_id,
                      aid_id="AID-1",
                      transition="AID_REQUESTED",
                  )
                  svc.aid_transition(
                      producer_id=producer_id,
                      aid_id="AID-1",
                      transition="AID_DELIVERED",
                  )
                  svc.risk_detected(
                      producer_id=producer_id,
                      risk_type="climatico",
                      detail="sequia",
                  )
                  svc.incident_created(
                      producer_id=producer_id,
                      incident_id="INC-1",
                      detail="plaga",
                  )
                  svc.asset_registered(
                      producer_id=producer_id,
                      asset_type="maquinaria",
                      detail="tractor",
                  )
                  self.assertEqual(5, len(link.calls))
                  kinds = [c[1] for c in link.calls]
                  self.assertIn("aid.requested", kinds)
                  self.assertIn("risk.detected", kinds)
                  self.assertIn(
                      "asset.registered", kinds
                  )

              def test_no_zid_returns_none(self):
                  svc, link, producer_id = self._boot(
                      has_zid=False
                  )
                  seq = svc.producer_registered(
                      producer_id=producer_id,
                      producer_type="agricultor",
                  )
                  self.assertIsNone(seq)
                  self.assertEqual(0, len(link.calls))

              def test_network_down_never_raises(self):
                  svc, link, producer_id = self._boot(
                      link_ok=False
                  )
                  seq = svc.production_registered(
                      producer_id=producer_id,
                      product="frijol",
                      quantity=10,
                      unit="quintal",
                  )
                  self.assertIsNone(seq)


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          G2EOF
          python3 -c "import ast; ast.parse(open('apps/agro/tests/test_agro_events.py').read()); print('test OK')"

      - name: 1/3 Agro events tests (5)
        run: python -m pytest apps/agro/tests/test_agro_events.py -v

      - name: 2/3 AGRO regression
        run: python -m pytest apps/agro/tests -q

      - name: 3/3 Full system regression
        run: |
          python -m pytest apps/axis/life_history/tests apps/axis/tests -q
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/agro/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "agro: AgroEventService complete - 12 event types via ZyraLink, real add_producer signature, never raises (5 tests)"
            git push
          fi
