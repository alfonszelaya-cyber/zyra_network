name: "ZYRA NEXO E2: clients migrado mejorado"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Migrar clients (6 engines + registry + 7 use cases)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'EOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **FORZADO " + p.name + ": OK**")
              except Exception:
                  out("- **FORZADO " + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          CL = "apps/nexo/domain/clients"
          UCC = "apps/nexo/application/clients_use_cases"

          # 1) CLIENT ENGINE (persistente + AuditTrail)
          forzar(CL + "/client_engine.py", D(r'''
              # client_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_clients", (
                      "CREATE TABLE IF NOT EXISTS nexo_clients (client_id TEXT PRIMARY KEY, name TEXT NOT NULL, document TEXT NOT NULL DEFAULT '', email TEXT NOT NULL DEFAULT '', phone TEXT, country TEXT NOT NULL DEFAULT 'N/A', client_type TEXT NOT NULL DEFAULT 'PERSON', status TEXT NOT NULL DEFAULT 'ACTIVE', risk_level TEXT NOT NULL DEFAULT 'NORMAL', financial_score INTEGER NOT NULL DEFAULT 0, fiscal_score INTEGER NOT NULL DEFAULT 0, operational_score INTEGER NOT NULL DEFAULT 0, zyra_score INTEGER NOT NULL DEFAULT 0, created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                  )),
              )

              class ClientEngine:
                  """Motor central de clientes (persistente)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.clients",
                                      _MIGRATIONS).run(clock)

                  def create_client(self, *, name: str, document: str,
                                    email: str, client_type: str = "PERSON",
                                    country: str = "N/A",
                                    phone: Optional[str] = None) -> dict:
                      client_id = f"CLI-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_clients"
                              " (client_id, name, document, email,"
                              " phone, country, client_type, status,"
                              " risk_level, created_at, updated_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?,"
                              " 'ACTIVE', 'NORMAL', ?, ?)",
                              (client_id, name, document, email,
                               phone, country, client_type, now, now))
                      return self.get_client(client_id)

                  def update_client(self, client_id: str,
                                    updates: Dict) -> Optional[dict]:
                      client = self.get_client(client_id)
                      if not client:
                          return None
                      sets = []
                      params = []
                      allowed = ("name", "email", "phone", "country",
                                 "status", "risk_level",
                                 "financial_score", "fiscal_score",
                                 "operational_score", "zyra_score")
                      for k, v in updates.items():
                          if k in allowed:
                              sets.append(f"{k} = ?")
                              params.append(v)
                      if not sets:
                          return client
                      sets.append("updated_at = ?")
                      params.append(self._clock.now())
                      params.append(client_id)
                      self._db.execute(
                          "UPDATE nexo_clients SET "
                          + ", ".join(sets)
                          + " WHERE client_id = ?", tuple(params))
                      return self.get_client(client_id)

                  def get_client(self, client_id: str) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM nexo_clients"
                          " WHERE client_id = ?", (client_id,))
                      return self._row(row) if row else None

                  def get_all_clients(self) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_clients"
                          " ORDER BY created_at")
                      return [self._row(r) for r in rows]

                  def _row(self, r) -> dict:
                      return {"client_id": str(r["client_id"]),
                              "name": str(r["name"]),
                              "document": str(r["document"]),
                              "email": str(r["email"]),
                              "phone": (str(r["phone"])
                                        if r["phone"] else None),
                              "country": str(r["country"]),
                              "client_type": str(r["client_type"]),
                              "status": str(r["status"]),
                              "risk_level": str(r["risk_level"]),
                              "financial_score": int(r["financial_score"]),
                              "fiscal_score": int(r["fiscal_score"]),
                              "operational_score": int(r["operational_score"]),
                              "zyra_score": int(r["zyra_score"]),
                              "created_at": float(r["created_at"]),
                              "updated_at": float(r["updated_at"])}

                  def block_client(self, client_id: str) -> Optional[dict]:
                      return self.update_client(
                          client_id, {"status": "BLOCKED"})

                  def activate_client(self, client_id: str) -> Optional[dict]:
                      return self.update_client(
                          client_id, {"status": "ACTIVE"})

                  def update_risk_level(self, client_id: str,
                                        risk_level: str) -> Optional[dict]:
                      return self.update_client(
                          client_id, {"risk_level": risk_level})

                  def generate_summary(self) -> Dict:
                      clients = self.get_all_clients()
                      active = len([c for c in clients
                                    if c["status"] == "ACTIVE"])
                      blocked = len([c for c in clients
                                     if c["status"] == "BLOCKED"])
                      return {"total_clients": len(clients),
                              "active_clients": active,
                              "blocked_clients": blocked,
                              "generated_at": self._clock.now()}
          '''))

          # 2) CLIENT HISTORY (persistente)
          forzar(CL + "/client_history_engine.py", D(r'''
              # client_history_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_client_history", (
                      "CREATE TABLE IF NOT EXISTS nexo_client_history (event_id TEXT PRIMARY KEY, client_id TEXT NOT NULL, event_type TEXT NOT NULL, details_json TEXT NOT NULL DEFAULT '{}', created_at REAL NOT NULL)",
                  )),
                  Migration(2, "nexo_client_history_idx", (
                      "CREATE INDEX nexo_client_history_client ON nexo_client_history (client_id, event_type)",
                  )),
              )

              class ClientHistoryEngine:
                  """Motor de historial de clientes (persistente)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.clienthistory",
                                      _MIGRATIONS).run(clock)

                  def register_event(self, client_id: str,
                                     event_type: str,
                                     details: dict) -> dict:
                      import json as _j
                      event_id = f"HIS-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_client_history"
                              " (event_id, client_id, event_type,"
                              " details_json, created_at)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (event_id, client_id, event_type,
                               _j.dumps(details, default=str), now))
                      return {"event_id": event_id,
                              "client_id": client_id,
                              "event_type": event_type,
                              "details": details,
                              "created_at": now}

                  def register_financial_event(self, client_id, details):
                      return self.register_event(client_id, "FINANCIAL", details)

                  def register_fiscal_event(self, client_id, details):
                      return self.register_event(client_id, "FISCAL", details)

                  def register_operational_event(self, client_id, details):
                      return self.register_event(client_id, "OPERATIONAL", details)

                  def register_risk_event(self, client_id, details):
                      return self.register_event(client_id, "RISK", details)

                  def register_compliance_event(self, client_id, details):
                      return self.register_event(client_id, "COMPLIANCE", details)

                  def register_audit_event(self, client_id, details):
                      return self.register_event(client_id, "AUDIT", details)

                  def get_client_history(self, client_id: str) -> List[dict]:
                      import json as _j
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_client_history"
                          " WHERE client_id = ? ORDER BY created_at",
                          (client_id,))
                      return [{"event_id": str(r["event_id"]),
                               "client_id": str(r["client_id"]),
                               "event_type": str(r["event_type"]),
                               "details": _j.loads(
                                   str(r["details_json"])),
                               "created_at": float(r["created_at"])}
                              for r in rows]

                  def get_events_by_type(self, client_id: str,
                                         event_type: str) -> List[dict]:
                      return [e for e in self.get_client_history(client_id)
                              if e["event_type"] == event_type]

                  def get_total_events(self, client_id: str) -> int:
                      return len(self.get_client_history(client_id))

                  def generate_timeline(self, client_id: str) -> List[dict]:
                      return sorted(
                          self.get_client_history(client_id),
                          key=lambda x: x["created_at"],
                          reverse=True)

                  def generate_summary(self, client_id: str) -> dict:
                      history = self.get_client_history(client_id)
                      return {"client_id": client_id,
                              "total_events": len(history),
                              "financial_events": len(
                                  self.get_events_by_type(
                                      client_id, "FINANCIAL")),
                              "fiscal_events": len(
                                  self.get_events_by_type(
                                      client_id, "FISCAL")),
                              "operational_events": len(
                                  self.get_events_by_type(
                                      client_id, "OPERATIONAL")),
                              "risk_events": len(
                                  self.get_events_by_type(
                                      client_id, "RISK")),
                              "generated_at": self._clock.now()}
          '''))

          # 3) CLIENT PROFILE (calculador puro, sin cambios estructurales)
          forzar(CL + "/client_profile.py", D(r'''
              # client_profile.py - NEXO / ZYRA (migrado)
              from __future__ import annotations
              from typing import Dict, List
              from datetime import datetime

              class ClientProfile:
                  """Perfil ejecutivo consolidado del cliente."""

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def calculate_risk_level(self, history: List[dict]) -> str:
                      risk_events = len([
                          x for x in history
                          if x.get("event_type") in (
                              "RISK", "COMPLIANCE", "AUDIT")])
                      if risk_events >= 20:
                          return "CRITICAL"
                      if risk_events >= 10:
                          return "HIGH"
                      if risk_events >= 5:
                          return "MEDIUM"
                      return "NORMAL"

                  def calculate_zyra_score(self, history: List[dict]) -> int:
                      score = 100
                      for item in history:
                          et = item.get("event_type", "")
                          if et == "RISK":
                              score -= 10
                          elif et == "COMPLIANCE":
                              score -= 15
                          elif et == "AUDIT":
                              score -= 5
                      return max(score, 0)

                  def build_profile(self, client_data: Dict,
                                    history: List[dict],
                                    companies: List[dict]) -> Dict:
                      risk_level = self.calculate_risk_level(history)
                      zyra_score = self.calculate_zyra_score(history)
                      return {"client": client_data,
                              "history": history,
                              "companies": companies,
                              "risk_level": risk_level,
                              "zyra_score": zyra_score,
                              "profile_completed": True,
                              "total_events": len(history),
                              "total_companies": len(companies),
                              "financial_score": client_data.get(
                                  "financial_score", 0),
                              "fiscal_score": client_data.get(
                                  "fiscal_score", 0),
                              "operational_score": client_data.get(
                                  "operational_score", 0),
                              "status": client_data.get(
                                  "status", "ACTIVE"),
                              "generated_at": self._now()}

                  def executive_summary(self, profile: Dict) -> Dict:
                      return {"client_id": profile["client"].get("client_id"),
                              "name": profile["client"].get("name"),
                              "status": profile.get("status"),
                              "risk_level": profile.get("risk_level"),
                              "zyra_score": profile.get("zyra_score"),
                              "companies": profile.get("total_companies"),
                              "events": profile.get("total_events"),
                              "generated_at": self._now()}
          '''))

          # 4) CLIENT RELATIONSHIP (persistente)
          forzar(CL + "/client_relationship_engine.py", D(r'''
              # client_relationship_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_client_relationships", (
                      "CREATE TABLE IF NOT EXISTS nexo_client_relationships (relationship_id TEXT PRIMARY KEY, client_id TEXT NOT NULL, company_id TEXT NOT NULL, relationship TEXT NOT NULL DEFAULT 'OWNER', ownership_percentage REAL NOT NULL DEFAULT 100.0, status TEXT NOT NULL DEFAULT 'LINKED', created_at REAL NOT NULL, updated_at REAL)",
                  )),
              )

              class ClientRelationshipEngine:
                  """Motor de relaciones cliente-empresa (persistente)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.clientrel",
                                      _MIGRATIONS).run(clock)

                  def link_company(self, client_id: str, company_id: str,
                                   relationship: str = "OWNER",
                                   ownership_percentage: float = 100.0) -> dict:
                      rel_id = f"REL-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_client_relationships"
                              " (relationship_id, client_id, company_id,"
                              " relationship, ownership_percentage,"
                              " status, created_at)"
                              " VALUES (?, ?, ?, ?, ?, 'LINKED', ?)",
                              (rel_id, client_id, company_id,
                               relationship, ownership_percentage, now))
                      return {"relationship_id": rel_id,
                              "client_id": client_id,
                              "company_id": company_id,
                              "relationship": relationship,
                              "ownership_percentage":
                              ownership_percentage,
                              "status": "LINKED",
                              "created_at": now}

                  def get_relationship(self, relationship_id: str) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM nexo_client_relationships"
                          " WHERE relationship_id = ?",
                          (relationship_id,))
                      return self._row(row) if row else None

                  def get_client_relationships(self, client_id: str) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_client_relationships"
                          " WHERE client_id = ?", (client_id,))
                      return [self._row(r) for r in rows]

                  def get_company_relationships(self, company_id: str) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_client_relationships"
                          " WHERE company_id = ?", (company_id,))
                      return [self._row(r) for r in rows]

                  def _row(self, r) -> dict:
                      return {"relationship_id": str(r["relationship_id"]),
                              "client_id": str(r["client_id"]),
                              "company_id": str(r["company_id"]),
                              "relationship": str(r["relationship"]),
                              "ownership_percentage":
                              float(r["ownership_percentage"]),
                              "status": str(r["status"]),
                              "created_at": float(r["created_at"])}

                  def unlink_company(self, relationship_id: str) -> Optional[dict]:
                      rel = self.get_relationship(relationship_id)
                      if not rel:
                          return None
                      self._db.execute(
                          "UPDATE nexo_client_relationships"
                          " SET status = 'UNLINKED', updated_at = ?"
                          " WHERE relationship_id = ?",
                          (self._clock.now(), relationship_id))
                      return self.get_relationship(relationship_id)

                  def suspend_relationship(self, relationship_id: str) -> Optional[dict]:
                      rel = self.get_relationship(relationship_id)
                      if not rel:
                          return None
                      self._db.execute(
                          "UPDATE nexo_client_relationships"
                          " SET status = 'SUSPENDED', updated_at = ?"
                          " WHERE relationship_id = ?",
                          (self._clock.now(), relationship_id))
                      return self.get_relationship(relationship_id)

                  def link_owner(self, client_id, company_id, percentage):
                      return self.link_company(client_id, company_id,
                                               "OWNER", percentage)

                  def link_legal_representative(self, client_id, company_id):
                      return self.link_company(client_id, company_id,
                                               "LEGAL_REPRESENTATIVE", 0)

                  def link_shareholder(self, client_id, company_id, percentage):
                      return self.link_company(client_id, company_id,
                                               "SHAREHOLDER", percentage)

                  def link_beneficiary(self, client_id, company_id):
                      return self.link_company(client_id, company_id,
                                               "BENEFICIARY", 0)

                  def generate_summary(self) -> dict:
                      rows = self._db.query_all(
                          "SELECT status, COUNT(*) AS n FROM"
                          " nexo_client_relationships GROUP BY status")
                      total = sum(int(r["n"]) for r in rows)
                      active = sum(int(r["n"]) for r in rows
                                   if r["status"] == "LINKED")
                      return {"relationships": total,
                              "active_relationships": active,
                              "generated_at": self._clock.now()}
          '''))

          # 5) CLIENT SEGMENTATION (calculador puro)
          forzar(CL + "/client_segmentation_engine.py", D(r'''
              # client_segmentation_engine.py - NEXO / ZYRA (migrado)
              from __future__ import annotations
              from typing import Dict
              from datetime import datetime

              class ClientSegmentationEngine:
                  """Motor de segmentación."""

                  def _now(self):
                      return datetime.utcnow().isoformat()

                  def segment(self, annual_volume: float) -> str:
                      if annual_volume >= 10000000:
                          return "CORPORATE"
                      if annual_volume >= 1000000:
                          return "ENTERPRISE"
                      if annual_volume >= 100000:
                          return "BUSINESS"
                      return "STANDARD"

                  def risk_segment(self, risk_level: str) -> str:
                      if risk_level == "CRITICAL":
                          return "HIGH_RISK"
                      if risk_level == "HIGH":
                          return "RISK"
                      if risk_level == "MEDIUM":
                          return "MONITORED"
                      return "NORMAL"

                  def vip_segment(self, zyra_score: int,
                                  annual_volume: float) -> str:
                      if (annual_volume >= 1000000
                              and zyra_score >= 90):
                          return "VIP"
                      return "STANDARD"

                  def build_segmentation(self, annual_volume: float,
                                         risk_level: str,
                                         zyra_score: int) -> Dict:
                      return {"commercial_segment":
                              self.segment(annual_volume),
                              "risk_segment":
                              self.risk_segment(risk_level),
                              "vip_segment":
                              self.vip_segment(zyra_score,
                                               annual_volume),
                              "annual_volume": annual_volume,
                              "risk_level": risk_level,
                              "zyra_score": zyra_score,
                              "generated_at": self._now()}

                  def generate_summary(self, segmentation: Dict) -> Dict:
                      return {"commercial_segment":
                              segmentation.get("commercial_segment"),
                              "risk_segment":
                              segmentation.get("risk_segment"),
                              "vip_segment":
                              segmentation.get("vip_segment"),
                              "generated_at": self._now()}
          '''))

          # 6) CLIENT VALIDATION (reconstruido indentado + persistente)
          forzar(CL + "/client_validation_engine.py", D(r'''
              # client_validation_engine.py - NEXO / ZYRA (migrado mejorado)
              from __future__ import annotations
              import re
              from typing import Dict, List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "client_validation_log", (
                      "CREATE TABLE IF NOT EXISTS client_validation_log (validation_id TEXT PRIMARY KEY, action TEXT NOT NULL, result INTEGER NOT NULL, data_json TEXT NOT NULL, timestamp REAL NOT NULL)",
                  )),
              )

              class ClientValidationEngine:
                  """Motor de validación de clientes (persistente)."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.clientvalidation",
                                      _MIGRATIONS).run(clock)

                  def _audit(self, action: str, data: dict) -> None:
                      import json as _j
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO client_validation_log"
                              " (validation_id, action, result,"
                              " data_json, timestamp)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (f"CVAL-{uuid.uuid4()}", action,
                               0, _j.dumps(data, default=str), now))

                  def validate_required_fields(self, client_data: Dict) -> bool:
                      required = ("name", "document", "email")
                      return all(
                          f in client_data and client_data[f]
                          for f in required)

                  def validate_email(self, email: str) -> bool:
                      pattern = r"^[^@]+@[^@]+\.[^@]+$"
                      return bool(re.match(pattern, email or ""))

                  def validate_document(self, document: str) -> bool:
                      return len(str(document).strip()) >= 4

                  def validate(self, client_data: Dict) -> bool:
                      result = (
                          self.validate_required_fields(client_data)
                          and self.validate_email(
                              client_data.get("email", ""))
                          and self.validate_document(
                              client_data.get("document", "")))
                      self._audit("CLIENT_VALIDATION", {
                          "client": client_data.get(
                              "document", "N/A"),
                          "result": result})
                      return result

                  def validation_report(self, client_data: Dict) -> List[str]:
                      issues = []
                      if not client_data.get("name"):
                          issues.append("Missing name")
                      if not self.validate_document(
                              client_data.get("document", "")):
                          issues.append("Invalid document")
                      if not self.validate_email(
                              client_data.get("email", "")):
                          issues.append("Invalid email")
                      return issues

                  def summary(self) -> Dict:
                      row = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " client_validation_log")
                      return {"audit_events":
                              int(row["n"]) if row else 0,
                              "generated_at": self._clock.now()}
          '''))

          # 7) CLIENT REGISTRY NUEVO (el puente que los use cases esperan)
          forzar(CL + "/client_registry.py", D(r'''
              # client_registry.py - NEXO / ZYRA (NUEVO: el registro
              # central que los use cases del viejo esperaban)
              from __future__ import annotations
              from typing import Dict, List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "client_registry", (
                      "CREATE TABLE IF NOT EXISTS client_registry (client_id TEXT PRIMARY KEY, client_json TEXT NOT NULL, total_transactions INTEGER NOT NULL DEFAULT 0, created_at REAL NOT NULL, updated_at REAL NOT NULL)",
                  )),
                  Migration(2, "client_registry_history", (
                      "CREATE TABLE IF NOT EXISTS client_registry_history (history_id TEXT PRIMARY KEY, client_id TEXT NOT NULL, event_type TEXT NOT NULL, description TEXT NOT NULL, created_at REAL NOT NULL)",
                  )),
                  Migration(3, "client_registry_links", (
                      "CREATE TABLE IF NOT EXISTS client_registry_links (link_id TEXT PRIMARY KEY, client_id TEXT NOT NULL, company_id TEXT NOT NULL, created_at REAL NOT NULL)",
                  )),
              )

              class ClientRegistry:
                  """Registro central de clientes:
                  store + consultas + historial + links.
                  Cumple el contrato que los use cases
                  del sistema esperan."""

                  def __init__(self, db: Database, clock: Clock) -> None:
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.clientregistry",
                                      _MIGRATIONS).run(clock)

                  def store(self, client: Dict) -> Dict:
                      import json as _j
                      client_id = client.get(
                          "client_id", f"CLI-{uuid.uuid4()}")
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT OR REPLACE INTO client_registry"
                              " (client_id, client_json,"
                              " total_transactions, created_at,"
                              " updated_at)"
                              " VALUES (?, ?, COALESCE("
                              " (SELECT total_transactions FROM"
                              "  client_registry WHERE client_id = ?),"
                              " 0), COALESCE((SELECT created_at FROM"
                              " client_registry WHERE client_id = ?), ?), ?)",
                              (client_id,
                               _j.dumps(client, default=str),
                               client_id, client_id, now, now))
                      return client

                  def get_by_id(self, client_id: str) -> Optional[Dict]:
                      import json as _j
                      row = self._db.query_one(
                          "SELECT * FROM client_registry"
                          " WHERE client_id = ?", (client_id,))
                      if not row:
                          return None
                      client = _j.loads(str(row["client_json"]))
                      client["total_transactions"] = int(
                          row["total_transactions"])
                      return client

                  def update(self, client_id: str,
                             updates: Dict) -> Optional[Dict]:
                      client = self.get_by_id(client_id)
                      if not client:
                          return None
                      client.update(updates)
                      import json as _j
                      self._db.execute(
                          "UPDATE client_registry SET"
                          " client_json = ?, updated_at = ?"
                          " WHERE client_id = ?",
                          (_j.dumps(client, default=str),
                           self._clock.now(), client_id))
                      return client

                  def link_company(self, *, client_id: str,
                                   company_id: str) -> Dict:
                      link_id = f"LNK-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO client_registry_links"
                              " (link_id, client_id, company_id,"
                              " created_at) VALUES (?, ?, ?, ?)",
                              (link_id, client_id, company_id, now))
                      return {"client_id": client_id,
                              "company_id": company_id,
                              "link_id": link_id,
                              "status": "LINKED"}

                  def register_history(self, *, client_id: str,
                                       history_event: Dict) -> Dict:
                      hid = f"H-{uuid.uuid4()}"
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO client_registry_history"
                              " (history_id, client_id, event_type,"
                              " description, created_at)"
                              " VALUES (?, ?, ?, ?, ?)",
                              (hid, client_id,
                               str(history_event.get(
                                   "event_type", "")),
                               str(history_event.get(
                                   "description", "")), now))
                      return history_event

                  def bump_transactions(self, client_id: str) -> None:
                      self._db.execute(
                          "UPDATE client_registry SET"
                          " total_transactions ="
                          " total_transactions + 1"
                          " WHERE client_id = ?", (client_id,))
          '''))

          # 8) USE CASES re-apuntados (client_registry nuestro + AuditTrail)
