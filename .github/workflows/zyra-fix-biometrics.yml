name: "FASE B tramo 1 v2: crear ZyraMixin con _risk_routes (bloque RIESGO de 144 lineas, lineas 1085-1228 del mapa) + herencia + delegacion — todo verificado antes de commit"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[FASE B-1] crear zyra_mixin.py COMPLETO + herencia + delegacion + regresion riesgo"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, subprocess, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              # backup en el repo para revert garantizado
              pathlib.Path("apps/agro/server_backup_b1.py") \
                  .write_text(src, encoding="utf-8")

              # localizar el bloque RIESGO (lineas 1085-1228
              # segun mapa #629, verificado por grep)
              i_start = src.find(
                  '        if s == ["risk", "climate"]:')
              i_end = src.find(
                  '        if s == ["sale", "publish"]:')
              assert i_start != -1, "inicio riesgo no hallado"
              assert i_end != -1, "fin (sale publish) no hallado"
              assert i_end > i_start, "orden invalido"
              # el bloque termina ANTES del siguiente if
              block = src[i_start:i_end]
              n_block = len(block.splitlines())
              out("- bloque RIESGO localizado: "
                  + str(n_block) + " lineas ("
                  + str(src[:i_start].count("\n") + 1)
                  + " a " + str(src[:i_end].count("\n"))
                  + ")")

              # ---------- crear zyra_mixin.py ----------
              # el bloque es codigo con indentacion de 8
              # (dentro de _post que esta en la clase). Para
              # el mixin: dedent a 4 (nivel de metodo de
              # clase) + envolver en def _risk_routes
              ded = textwrap.dedent(block)
              # el bloque empieza con "if s == ..." a
              # columna 0 despues del dedent. Indent 4
              # para que quede dentro del metodo
              body = textwrap.indent(ded, "    ")
              # agregar return False al final (si ninguna
              # ruta aplico)
              method = ("    def _risk_routes(self, s,"
                        " is_json, _ZV6_ACTOR):\n"
                        + body
                        + "        return False\n")
              mixin_src = (
                  '"""AGRO Zyra Mixin (CONSOL-3 fase B,'
                  ' regla 77)\n'
                  '- metodos del _post extraidos aqui\n'
                  '- el handler hereda de esta clase:\n'
                  '  self._send/_req/_ZYRA_* funcionan por'
                  ' herencia"""\n'
                  'from __future__ import annotations\n'
                  'import json\n\n\n'
                  'class ZyraMixin:\n\n'
                  + method)
              ast.parse(mixin_src)
              zm = pathlib.Path(
                  "apps/agro/routers/zyra_mixin.py")
              zm.write_text(mixin_src, encoding="utf-8")
              py_compile.compile(str(zm), doraise=True)
              out("- **zyra_mixin.py CREADO con _risk_routes"
                  " (compila OK)**")

              # ---------- herencia en AgroApiHandler ----------
              tree = ast.parse(src)
              cls = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and \
                          node.name == "AgroApiHandler":
                      cls = node
                      break
              assert cls is not None
              # la clase esta declarada multilinea:
              # class AgroApiHandler(\n    BaseHTTPRequestHandler\n):
              l0 = cls.lineno - 1
              # buscar la linea de cierre "):" de la clase
              close = None
              for j in range(cls.lineno,
                             min(cls.lineno + 10, len(lines := src.splitlines(keepends=True)))):
                  if lines[j].strip() == "):":
                      close = j
                      break
              if close is None:
                  # declaracion de una sola linea
                  out("- clase de una linea, agregando"
                      " herencia...")
              # reemplazar: quitar las lineas de la clase
              # original y poner una sola con las bases
              new_cls_line = ("class AgroApiHandler(ZyraMixin,"
                              " BaseHTTPRequestHandler):\n")
              # eliminar lineas l0 a close inclusive
              src = ("".join(lines[:l0])
                     + new_cls_line
                     + "".join(lines[close+1:]))

              # ---------- delegacion en _post ----------
              # reemplazar el bloque RIESGO por la delegacion
              i_start2 = src.find(
                  '        if s == ["risk", "climate"]:')
              i_end2 = src.find(
                  '        if s == ["sale", "publish"]:')
              assert i_start2 != -1 and i_end2 != -1
              i_end2 = src.rfind("\n", 0, i_end2) + 1
              deleg = (
                  '        if self._risk_routes(s, is_json,\n'
                  '                _ZV6_ACTOR):\n'
                  '            return\n')
              src = (src[:i_start2] + deleg + src[i_end2:])
              ast.parse(src)
              SP.write_text(src, encoding="utf-8")
              py_compile.compile(str(SP), doraise=True)
              out("- **server.py: bloque RIESGO ->"
                  " delegacion | total: "
                  + str(len(src.splitlines()))
                  + " lineas (de 2811)**")

              # correr los tests de riesgo del dueno
              import subprocess
              env = dict(os.environ)
              env["PYTHONPATH"] = (os.getcwd() + ":"
                                   + os.getcwd()
                                   + "/shared_engines")
              r = subprocess.run(
                  ["python3", "-m", "pytest",
                   "apps/agro/tests", "-q", "-x",
                   "--timeout=45",
                   "--timeout-method=thread",
                   "--tb=line", "-k", "risk"],
                  capture_output=True, text=True,
                  env=env, timeout=300)
              if r.returncode != 0:
                  raise RuntimeError(
                      "tests de riesgo fallaron:"
                      + r.stdout[-800:])
              out("- tests de riesgo: OK")

              # eliminar backup (ya committeado en git)
              os.system("rm -f"
                        " apps/agro/server_backup_b1.py"
                        " 2>/dev/null")
              with open("/tmp/consol3b1", "w") as f:
                  f.write("OK")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO — revert automatico")
              os.system("git checkout -- apps/agro/server.py"
                        " 2>/dev/null")
              os.system("git checkout --"
                        " apps/agro/routers/zyra_mixin.py"
                        " 2>/dev/null")
              os.system("rm -f"
                        " apps/agro/server_backup_b1.py"
                        " 2>/dev/null")
              out("- restaurado")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              with open("/tmp/consol3b1", "w") as f:
                  f.write("FAIL")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion AGRO completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — tramo 1 VALIDADO" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed)" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -50 /tmp/x3.out; echo '```'; } >> "$SUM"
            cp apps/agro/server_backup_b1.py apps/agro/server.py 2>/dev/null
            git checkout -- apps/agro/routers/zyra_mixin.py 2>/dev/null
            echo "- REVERT: restaurado" >> "$SUM"
            echo "FAIL" > /tmp/consol3b1
          fi
          exit 0

      - name: "[ENTREGA] commit solo si AGRO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/consol3b1 2>/dev/null || echo FAIL)" != "OK" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**FASE B tramo 1 BLOQUEADA — revert aplicado (estado estable)**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**FASE B tramo 1: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(CONSOL-3 fase B tramo 1, regla 77): bloque RIESGO del _post (144 lineas: risk climate/productive/impact/recovery + alert resolve + response create/update) extraido a ZyraMixin._risk_routes + AgroApiHandler hereda de ZyraMixin (self._send/_req/_ZYRA_* por MRO) + delegacion de 3 lineas + tests de riesgo del dueno OK + regresion AGRO verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**FASE B tramo 1 OK. Tramo 2 siguiente (ventas/comercio ~200 lineas). Server bajando por tramos con regresion inmediata.**"
          exit 0
