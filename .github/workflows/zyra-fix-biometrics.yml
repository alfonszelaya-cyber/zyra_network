name: ZYRA Fix Registro v37

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Control nombre-documento + captura compacta
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aplicar correccion v37 (solo lo pedido)
        run: |
          python3 - <<'PYEOF'
          import io, os, sys, py_compile, datetime

          ROOT = os.getcwd()
          PATH = os.path.join(ROOT, "superapp.py")
          OUT = []

          def p(s=""):
              OUT.append(str(s))
              print(s)

          def escribir_resumen():
              txt = chr(10).join(OUT)
              sp = os.environ.get("GITHUB_STEP_SUMMARY")
              if sp:
                  with io.open(sp, "a", encoding="utf-8") as f:
                      f.write("## ZYRA Fix Registro v37" + chr(10) + chr(10) + "```" + chr(10) + txt + chr(10) + "```" + chr(10))

          p("======================================================================")
          p("ZYRA FIX REGISTRO v37 - SOLO LO PEDIDO:")
          p("  1) Puerta: el nombre del registro debe coincidir con el")
          p("     documento antes de pasar al PASO 4 (selfie).")
          p("  2) Pantalla de captura mas pequena y profesional (guia intacta).")
          p("Fecha UTC: " + datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M"))
          p("======================================================================")

          if not os.path.exists(PATH):
              p("[ABORTADO] no existe superapp.py")
              escribir_resumen()
              sys.exit(1)

          with io.open(PATH, "r", encoding="utf-8") as f:
              content = f.read()
          original = content

          if "Crear mi ZID" not in content:
              p("[ABORTADO] superapp.py no contiene la pagina de registro")
              escribir_resumen()
              sys.exit(1)

          CSS_VIEJO1 = ".videozona{display:none;position:relative;border-radius:12px;overflow:hidden;margin-top:8px;background:#000}"
          CSS_NUEVO1 = ".videozona{display:none;position:relative;border-radius:12px;overflow:hidden;margin-top:8px;margin-left:auto;margin-right:auto;background:#000;max-width:330px;border:1px solid #2a2f55;box-shadow:0 6px 24px rgba(0,0,0,0.5)}"

          CSS_VIEJO2 = ".preview{display:none;width:100%;border-radius:10px;margin-top:6px}"
          CSS_NUEVO2 = ".preview{display:none;width:100%;max-width:330px;border-radius:10px;margin:6px auto 0;border:1px solid #2a2f55}"

          VER_VIEJO = "ZYRA registro v36 - parser verificado"
          VER_NUEVO = "ZYRA registro v37 - control de nombre + captura compacta"

          PATCH_JS = """
          (function(){
            if (window.__zyraPuertaV37) { return; }
            window.__zyraPuertaV37 = true;
            function R(id){ return document.getElementById(id); }
            function toast(msg, mal){
              var t = document.getElementById("toastv37");
              if (!t) {
                t = document.createElement("div");
                t.id = "toastv37";
                t.style.cssText = "position:fixed;left:12px;right:12px;bottom:18px;z-index:99999;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,0.5);display:none";
                document.body.appendChild(t);
              }
              t.style.background = mal ? "#b62324" : "#1f6f3f";
              t.textContent = msg;
              t.style.display = "block";
              if (t.__h) { clearTimeout(t.__h); }
              t.__h = setTimeout(function(){ t.style.display = "none"; }, 7000);
            }
            function normTokens(s){
              var v = (s || "").toUpperCase();
              var de = "ÁÀÄÂÃÉÈËÊÍÌÏÎÓÒÖÔÕÚÙÜÛÑÇ";
              var aa = "AAAAAEEEEIIIIOOOOOUUUUNC";
              var i = 0;
              for (i = 0; i < de.length; i++) { v = v.split(de.charAt(i)).join(aa.charAt(i)); }
              v = v.replace(/[^A-Z ]/g, " ");
              var parts = v.split(" ");
              var out = [];
              var j = 0;
              for (j = 0; j < parts.length; j++) { if (parts[j].length > 1) { out.push(parts[j]); } }
              return out;
            }
            function coincide(nombreDoc, nombreReg){
              var d = normTokens(nombreDoc);
              var r = normTokens(nombreReg);
              if (d.length === 0 || r.length === 0) { return false; }
              if (r.length === 1) { return (d.length === 1 && d[0] === r[0]); }
              var k = 0;
              for (k = 0; k < r.length; k++) { if (d.indexOf(r[k]) === -1) { return false; } }
              return true;
            }
            function sesion(){
              try { return JSON.parse(sessionStorage.getItem("zyraReg") || "null"); } catch (e) { return null; }
            }
            function nombreRegistro(){
              var el = R("nombre");
              if (el && el.value) { return el.value; }
              var s = sesion();
              return (s && s.nm) ? s.nm : "";
            }
            function imagenFrente(){
              var s = sesion();
              return (s && s.DF) ? s.DF : "";
            }
            async function verificarNombre(){
              var reg = nombreRegistro();
              if (normTokens(reg).length < 2) {
                toast("Escribe tu nombre completo (1 o 2 nombres y 1 o 2 apellidos) en el PASO 1.", true);
                return false;
              }
              if (window.nombreNoCoincide === true) {
                toast("EL NOMBRE NO COINCIDE con el documento. No puedes pasar a la biometría.", true);
                return false;
              }
              var df = imagenFrente();
              if (!df) {
                toast("No encuentro la foto del documento. Vuelve al PASO 2 y toma la foto del frente.", true);
                return false;
              }
              toast("Verificando que tu nombre coincida con el documento...", false);
              var texto = "";
              try {
                if (typeof Tesseract === "undefined") {
                  if (typeof cargarScript === "function") {
                    await cargarScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
                  }
                }
                var imgArg = (df.indexOf("data:") === 0) ? df : ("data:image/jpeg;base64," + df);
                var r = await Tesseract.recognize(imgArg, "eng");
                texto = (r && r.data && r.data.text) ? r.data.text : "";
              } catch (e) { texto = ""; }
              if (!texto) {
                toast("No pudimos leer el documento. Toma la foto de nuevo: buena luz, sin reflejos, documento llenando la guía.", true);
                return false;
              }
              var nombreDoc = (typeof nombreDeTexto === "function") ? nombreDeTexto(texto) : null;
              if (!nombreDoc) {
                toast("No pudimos leer el NOMBRE del documento. Vuelve al PASO 2 y reescanea con buena luz.", true);
                return false;
              }
              if (!coincide(nombreDoc, reg)) {
                toast("EL NOMBRE NO COINCIDE: el documento dice '" + nombreDoc + "'. No puedes pasar a la biometría.", true);
                return false;
              }
              return true;
            }
            var original = window.irAPaso;
            if (typeof original !== "function") { return; }
            window.irAPaso = function(n){
              if (n === 4) {
                verificarNombre().then(function(ok){
                  if (ok) { toast("Nombre verificado: coincide con el documento.", false); original(4); }
                });
                return;
              }
              return original(n);
            };
          })();
          """

          hechos = []
          errores = []

          def reemplazar(nombre, viejo, nuevo):
              global content
              n = content.count(viejo)
              p("[ANCLA] %s -> %d aparicion(es)" % (nombre, n))
              if n != 1:
                  errores.append(nombre + ": aparecio %d veces (se esperaba 1)" % n)
                  return
              content = content.replace(viejo, nuevo)
              hechos.append(nombre)

          reemplazar("CSS videozona (pantalla mas pequena)", CSS_VIEJO1, CSS_NUEVO1)
          reemplazar("CSS preview (foto capturada mas pequena)", CSS_VIEJO2, CSS_NUEVO2)
          reemplazar("version visible v36 -> v37", VER_VIEJO, VER_NUEVO)

          if not errores:
              idx = content.rfind("</script>")
              if idx == -1:
                  errores.append("no se encontro el cierre del script del registro")
              else:
                  corte = idx + len("</script>")
                  content = content[:corte] + "\n<script>\n" + PATCH_JS + "\n</script>" + content[corte:]
                  hechos.append("puerta de nombre antes del PASO 4 (selfie)")

          if errores:
              p("")
              p("[ABORTADO] No se cambio NADA en el repositorio. Motivos:")
              for e in errores:
                  p("  - " + e)
              escribir_resumen()
              sys.exit(1)

          with io.open(PATH, "w", encoding="utf-8") as f:
              f.write(content)

          try:
              py_compile.compile(PATH, doraise=True)
              p("[OK] superapp.py compila sin errores")
          except Exception as exc:
              with io.open(PATH, "w", encoding="utf-8") as f:
                  f.write(original)
              p("[ABORTADO] superapp.py no compilo; archivo restaurado sin cambios: %r" % (exc,))
              escribir_resumen()
              sys.exit(1)

          p("")
          p("[HECHO] Cambios aplicados:")
          for h in hechos:
              p("  + " + h)
          p("")
          p("PLAN DE PRUEBAS (cuando Render publique, 3-5 minutos):")
          p("  A) Debe BLOQUEAR: nombre 'Jose Pacheco' + el documento de")
          p("     California -> mensaje rojo EL NOMBRE NO COINCIDE, no pasa al paso 4.")
          p("  B) Debe PASAR: escribe el nombre EXACTO del documento -> pasa a la selfie.")
          p("  C) La pantalla de camara se ve mas chica, con la misma guia.")
          p("  El pie de pagina debe decir v37. Si dice v36, espera y refresca.")
          escribir_resumen()
          PYEOF

      - name: Guardar y publicar el cambio
        run: |
          git config user.name "zyra-fix"
          git config user.email "zyra-fix@users.noreply.github.com"
          git add superapp.py
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "ZYRA registro v37: control nombre-documento + captura compacta"
            git push origin HEAD
          fi
