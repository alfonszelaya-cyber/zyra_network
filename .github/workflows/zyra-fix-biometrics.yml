name: "RED-RELAY v3: scheduler autonomo + GATE por motor con timeout 120s (identifica el cuelgue exacto)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Bloque 1 - RelayScheduler + serve_combined con bridge"
        run: |
          python3 - <<'BEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/runtime/combined_api.py")
          t = p.read_text(encoding="utf-8")
          if "class RelayScheduler" not in t:
              SCHED = textwrap.dedent('''\


                  import threading


                  class RelayScheduler:
                      """AX-RELAY: daemon que drena el cartero cada N segundos. Nunca muere: reintenta en el proximo tick."""

                      def __init__(self, *, bridge, interval_seconds: float = 30.0) -> None:
                          self._bridge = bridge
                          self._interval = max(0.2, float(interval_seconds))
                          self._stop_event = threading.Event()
                          self._thread = threading.Thread(target=self._loop, daemon=True, name="zyra-relay")

                      def _loop(self) -> None:
                          while not self._stop_event.wait(self._interval):
                              try:
                                  self._bridge.relay()
                              except Exception:
                                  pass

                      def start(self) -> None:
                          self._thread.start()

                      def stop(self) -> None:
                          self._stop_event.set()
                          self._thread.join(timeout=5)
              ''')
              t = (t.rstrip("\n") + "\n" + SCHED.rstrip("\n") + "\n")
              print("OK 1a: RelayScheduler")
          VIEJO = (
              "def serve_combined(\n"
              "    kernel: ZyraKernel,\n"
              "    caps: ZyraCapabilities,\n"
              "    *,\n"
              "    host: str,\n"
              "    port: int,\n"
              ") -> ThreadingHTTPServer:\n"
              '    """Bind both surfaces to one server."""\n'
              "    CombinedHandler.kernel = kernel\n"
              "    CombinedHandler.caps = caps\n"
              "    return ThreadingHTTPServer(\n"
              "        (host, port), CombinedHandler\n"
              "    )\n"
          )
          NUEVO = (
              "def serve_combined(\n"
              "    kernel: ZyraKernel,\n"
              "    caps: ZyraCapabilities,\n"
              "    *,\n"
              "    host: str,\n"
              "    port: int,\n"
              "    bridge=None,\n"
              "    relay_interval: float = 30.0,\n"
              ") -> ThreadingHTTPServer:\n"
              '    """Bind both surfaces to one server. AX-RELAY: si hay bridge, distribuye AUTONOMAMENTE y cablea caps.bridge."""\n'
              "    CombinedHandler.kernel = kernel\n"
              "    CombinedHandler.caps = caps\n"
              "    if bridge is not None:\n"
              "        caps.bridge = bridge\n"
              "    server = ThreadingHTTPServer(\n"
              "        (host, port), CombinedHandler\n"
              "    )\n"
              "    if bridge is not None:\n"
              "        scheduler = RelayScheduler(\n"
              "            bridge=bridge,\n"
              "            interval_seconds=relay_interval,\n"
              "        )\n"
              "        scheduler.start()\n"
              "        server._zyra_relay_scheduler = scheduler\n"
              "    return server\n"
          )
          if VIEJO in t:
              t = t.replace(VIEJO, NUEVO, 1)
              print("OK 1b: serve_combined con bridge")
          elif "bridge=None," in t:
              print("SKIP 1b (ya presente)")
          else:
              raise AssertionError("serve_combined no hallado")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK bloque 1 (AST valido)")
          BEOF

      - name: "Bloque 2 - rutas bridge/status + relay + sources/sweep"
        run: |
          python3 - <<'RTEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/runtime/capabilities_api.py")
          t = p.read_text(encoding="utf-8")
          if 's == ["bridge", "relay"]' in t:
              print("SKIP 2 (ya presentes)")
              raise SystemExit(0)
          ig = t.find("def _route_get(")
          assert ig >= 0
          ic = t.find("caps = type(self).caps", ig)
          assert ic > ig
          ic_ls = t.rfind("\n", 0, ic) + 1
          linea = t[ic_ls:ic]
          IND_G = linea[:len(linea) - len(linea.lstrip())]
          le = t.find("\n", ic) + 1
          GET_CUERPO = textwrap.dedent('''\
              if (
                  len(s) == 2
                  and s[0] == "bridge"
                  and s[1] == "status"
              ):
                  bridge = getattr(caps, "bridge", None)
                  if bridge is None:
                      self._ok({"wired": False})
                      return
                  self._ok({"wired": True})
                  return
          ''')
          GET_R = textwrap.indent(GET_CUERPO.rstrip("\n"), IND_G) + "\n"
          t = t[:le] + GET_R + t[le:]
          print("OK GET /bridge/status")
          marker = 'if s == ["documents", "register"]:'
          idx = t.find(marker)
          assert idx >= 0
          ls = t.rfind("\n", 0, idx) + 1
          linea = t[ls:idx]
          IND = linea[:len(linea) - len(linea.lstrip())]
          POST_CUERPO = textwrap.dedent('''\
              if s == ["bridge", "relay"]:
                  bridge = getattr(caps, "bridge", None)
                  if bridge is None:
                      self._error(503, "not_wired", "bridge not wired")
                      return
                  res = bridge.relay()
                  self._send(200, {"ok": True, "data": res})
                  return
              if s == ["sources", "sweep"]:
                  from shared_engines.integrations.engine import (
                      PublicSourceClient, SourceIndex,
                      sweep_onec, sweep_marn)
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  cli = PublicSourceClient(
                      clock=type(self).kernel.clock,
                      timeout_seconds=20.0,
                      ttl_seconds=300.0)
                  index = SourceIndex(
                      SQLiteAdapter(":memory:"),
                      type(self).kernel.clock)
                  r1 = sweep_onec(cli, index)
                  r2 = sweep_marn(cli, index,
                      max_layers_per_service=8,
                      pause_seconds=0.1)
                  self._send(200, {"ok": True, "data": {"onec": r1, "marn": r2}})
                  return
          ''')
          BLOQUE = textwrap.indent(POST_CUERPO.rstrip("\n"), IND) + "\n"
          t = t[:ls] + BLOQUE + t[ls:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          tq2 = p.read_text(encoding="utf-8")
          assert ('s == ["bridge", "relay"]:' in tq2)
          assert ('s == ["sources", "sweep"]:' in tq2)
          print("OK 2: rutas relay/status/sweep (AST valido)")
          RTEOF

      - name: "Bloque 3 - test de distribucion autonoma"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          target = Path("shared_engines/runtime/tests/test_capabilities_api.py")
          assert target.exists()
          t = target.read_text(encoding="utf-8")
          if "test_relay_autonomous_delivery" in t:
              print("SKIP 3 (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_relay_autonomous_delivery(tmp_path) -> None:
                  """AX-RELAY: la Red distribuye SOLA - nadie llama al relay."""
                  import threading
                  import time as _time
                  from shared_engines.storage.database import SQLiteAdapter
                  from shared_engines.common.clocks import FrozenClock
                  from shared_engines.runtime.config import RuntimeConfig
                  from shared_engines.runtime.kernel import ZyraKernel
                  from shared_engines.runtime.capabilities import ZyraCapabilities
                  from shared_engines.runtime.combined_api import serve_combined
                  from shared_engines.verification.signatures import Ed25519Signer
                  from shared_engines.events.outbox import Outbox, InterAppBridge
                  from shared_engines.events.inbox import Inbox
                  from shared_engines.events.contracts import EventCatalog
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(db=net_db, clock=FrozenClock(), signer=signer, config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None))
                  kernel.bootstrap_root()
                  caps = ZyraCapabilities(net_db, FrozenClock(), identity=kernel.identity, signer=signer)
                  red_db = SQLiteAdapter(tmp_path / "red.db")
                  nexo_db = SQLiteAdapter(tmp_path / "nexo.db")
                  clock = FrozenClock()
                  out_red = Outbox(red_db, clock)
                  out_red.ensure_schema()
                  cat = EventCatalog()
                  cat.register("agro.sale.created")
                  bridge = InterAppBridge(db=red_db, clock=clock, source=out_red)
                  recibidos = []
                  bridge.subscribe(app_id="nexo", event_types=("agro.sale.created",), inbox=Inbox(nexo_db, clock), handler=recibidos.append)
                  srv = serve_combined(kernel, caps, host="127.0.0.1", port=0, bridge=bridge, relay_interval=0.4)
                  try:
                      assert caps.bridge is bridge
                      ev = cat.build("agro.sale.created", aggregate_id="S1", payload={"total": 100}, clock=clock)
                      out_red.enqueue(ev)
                      inicio = _time.time()
                      while len(recibidos) == 0 and (_time.time() - inicio) < 6.0:
                          _time.sleep(0.1)
                      assert len(recibidos) == 1, "el scheduler NO entrego solo: " + str(len(recibidos))
                      print("OK AX-RELAY: distribucion autonoma funcionando")
                  finally:
                      sched = getattr(srv, "_zyra_relay_scheduler", None)
                      if sched is not None:
                          sched.stop()
                      srv.shutdown()
                      srv.server_close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          target.write_text(t, encoding="utf-8")
          final = target.read_text(encoding="utf-8")
          assert "test_relay_autonomous_delivery" in final
          print("OK 3: test distribucion autonoma (AST valido)")
          TSEOF

      - name: "Bloque 4 - GATE POR MOTOR con timeout 120s (identifica el cuelgue exacto)"
        run: |
          set +e
          FAIL_TOTAL=0
          HANGS=""
          for dir in shared_engines/*/; do
            motor=$(basename "$dir")
            if [ -d "shared_engines/$motor/tests" ] && ls "shared_engines/$motor/tests"/test_*.py >/dev/null 2>&1; then
              timeout 120 python3 -m pytest "shared_engines/$motor/tests" -q --tb=line > "/tmp/gate_$motor.txt" 2>&1
              CODE=$?
              if [ $CODE -eq 124 ]; then
                echo "HANG: $motor (timeout 120s)"
                HANGS="$HANGS $motor"
                FAIL_TOTAL=$((FAIL_TOTAL+1))
              elif [ $CODE -ne 0 ]; then
                echo "FALLO: $motor"
                tail -5 "/tmp/gate_$motor.txt"
                FAIL_TOTAL=$((FAIL_TOTAL+1))
              else
                RES=$(tail -1 "/tmp/gate_$motor.txt")
                echo "VERDE: $motor :: $RES"
              fi
            fi
          done
          # runtime tiene tests en runtime/tests (no runtime/tests/tests)
          timeout 120 python3 -m pytest shared_engines/runtime/tests -q --tb=line > /tmp/gate_runtime.txt 2>&1
          CODE=$?
          if [ $CODE -eq 124 ]; then
            echo "HANG: runtime (timeout 120s)"
            HANGS="$HANGS runtime"
            FAIL_TOTAL=$((FAIL_TOTAL+1))
          elif [ $CODE -ne 0 ]; then
            echo "FALLO: runtime"
            tail -5 /tmp/gate_runtime.txt
            FAIL_TOTAL=$((FAIL_TOTAL+1))
          else
            echo "VERDE: runtime :: $(tail -1 /tmp/gate_runtime.txt)"
          fi
          echo "=============================="
          if [ $FAIL_TOTAL -gt 0 ]; then
            echo "GATE ROJO: $FAIL_TOTAL problemas.$HANGS"
            exit 1
          fi
          echo "GATE VERDE: todos los motores pasaron"
          exit 0

      - name: "Bloque 5 - SOLO SI FALLO: diagnostico del motor culpable al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO GATE POR MOTOR"
            echo
            echo "### Resultados guardados:"
            for f in /tmp/gate_*.txt; do
              echo
              echo "#### $f"
              tail -12 "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-RELAY: scheduler autonomo del cartero + rutas bridge/status/relay + sources/sweep" -m "La energia siempre conectada: RelayScheduler (daemon anti-muerte) anadido a combined_api.py; serve_combined acepta bridge=None + relay_interval -> si hay bridge: cablea caps.bridge y arranca el scheduler solo. Rutas: GET /bridge/status, POST /bridge/relay, POST /sources/sweep (barrido on-demand de ONEC 7 + MARN 9). Test e2e: evento emitido se entrega SOLO por el scheduler. GATE nuevo por motor con timeout 120s (regla 23): identifica el cuelgue exacto; v2 corria la suite completa opaca que colgaba 25min."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
