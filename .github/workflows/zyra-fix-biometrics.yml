name: "RED-8 v2: puente inter-app (InterAppBridge) - nonlocal corregido"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - outbox.py: append InterAppBridge (nonlocal CORREGIDO)"
        run: |
          python3 - <<'BREOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/events/"
              "outbox.py")
          t = p.read_text(encoding="utf-8")
          if "class InterAppBridge" in t:
              print("SKIP (ya presente)")
              raise SystemExit(0)
          CUERPO = textwrap.dedent('''\
              from shared_engines.common.validation import (
                  require_non_empty_str,
              )
              from shared_engines.events.inbox import (
                  Inbox,
              )

              _BRIDGE_MIGRATIONS = (
                  Migration(
                      1,
                      "events_bridge",
                      (
                          "CREATE TABLE IF NOT EXISTS"
                          " bridge_subscriptions ("
                          " app_id TEXT NOT NULL,"
                          " event_type TEXT NOT NULL,"
                          " PRIMARY KEY (app_id,"
                          " event_type))",
                      ),
                  ),
              )


              class InterAppBridge:
                  """AX-BRIDGE: cartero inter-app
                  de la Red. Drena el outbox fuente
                  y entrega cada evento UNA VEZ a
                  cada app suscrita (Inbox dedup
                  transaccional). Internas y
                  externas entran por la misma
                  puerta: app_id + tipos."""

                  def __init__(
                      self,
                      *,
                      db: Database,
                      clock: Clock,
                      source: Outbox,
                  ) -> None:
                      self._db = db
                      self._clock = clock
                      self._source = source
                      self._targets: dict[
                          str,
                          tuple[Inbox,
                          Callable[[Event],
                          None], set[str]],
                      ] = {}
                      MigrationRunner(
                          db,
                          "events.bridge",
                          _BRIDGE_MIGRATIONS,
                      ).run(clock)

                  def subscribe(
                      self,
                      *,
                      app_id: str,
                      event_types: tuple[
                          str, ...],
                      inbox: Inbox,
                      handler: Callable[
                          [Event], None],
                  ) -> None:
                      """Registra/actualiza la
                      suscripcion de una app
                      (interna o externa: misma
                      puerta)."""
                      require_non_empty_str(
                          app_id, "app_id")
                      if not event_types:
                          raise ValueError(
                              "event_types"
                              " required")
                      for et in event_types:
                          require_non_empty_str(
                              et, "event_type")
                      with (
                          self._db.transaction()
                          as cursor
                      ):
                          cursor.execute(
                              "DELETE FROM"
                              " bridge_subscriptions"
                              " WHERE app_id = ?",
                              (app_id,),
                          )
                          for et in event_types:
                              cursor.execute(
                                  "INSERT INTO"
                                  " bridge_subscriptions"
                                  " (app_id,"
                                  " event_type)"
                                  " VALUES (?, ?)",
                                  (app_id, et),
                              )
                      self._targets[app_id] = (
                          inbox,
                          handler,
                          set(event_types),
                      )

                  def _route(
                      self, event: Event,
                  ) -> int:
                      entregados = 0
                      for app_id in sorted(
                          self._targets):
                          inbox, handler, (
                              tipos
                          ) = self._targets[
                              app_id]
                          if (event.event_type
                                  not in
                                  tipos):
                              continue
                          if inbox.process(
                              event,
                              handler,
                          ):
                              entregados += 1
                      return entregados

                  def relay(
                      self,
                      *,
                      batch_size: int = 100,
                  ) -> dict[str, int]:
                      """Drena el outbox fuente
                      y entrega a suscriptores."""
                      duplicados = 0
                      recibidos = 0

                      def entregador(
                          event: Event,
                      ) -> None:
                          nonlocal duplicados, recibidos
                          recibidos += 1
                          if self._route(
                              event,
                          ) == 0:
                              duplicados += 1

                      drenados = (
                          self._source.
                          dispatch_pending(
                              entregador,
                              batch_size=(
                                  batch_size),
                          )
                      )
                      return {
                          "drained": drenados,
                          "delivered": (
                              recibidos
                              - duplicados),
                          "duplicates": (
                              duplicados),
                      }

                  def subscriptions(
                      self,
                      *,
                      app_id: str,
                  ) -> tuple[str, ...]:
                      rows = self._db.query_all(
                          "SELECT event_type FROM"
                          " bridge_subscriptions"
                          " WHERE app_id = ?"
                          " ORDER BY event_type",
                          (app_id,),
                      )
                      return tuple(
                          str(r["event_type"])
                          for r in rows)
          ''')
          BLOQUE = CUERPO.rstrip("\n")
          t = (t.rstrip("\n") + "\n\n"
               + BLOQUE + "\n")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK InterAppBridge (AST valido)")
          BREOF

      - name: "Paso B - verificacion dura: puente vivo, Outbox original intacto"
        run: |
          python3 -c "
          from shared_engines.events.outbox import (
              Outbox, InterAppBridge)
          for m in ('enqueue', 'pending',
                    'dispatch_pending',
                    'claim_batch', 'complete',
                    'fail',
                    'reap_expired_leases',
                    'dead_letter',
                    'requeue_dead'):
              assert hasattr(Outbox, m), m
          for m in ('subscribe', 'relay',
                    'subscriptions'):
              assert hasattr(InterAppBridge, m), m
          print('OK: Outbox intacto + InterAppBridge con subscribe/relay/subscriptions')
          "

      - name: "Paso C - rutas HTTP: POST /bridge/relay + GET /bridge/subscriptions/{app}"
        run: |
          python3 - <<'RTEOF'
          import ast
          from pathlib import Path
          q = Path(
              "shared_engines/runtime/"
              "capabilities_api.py")
          tq = q.read_text(encoding="utf-8")
          if 's[1] == "subscriptions"' in tq:
              print("SKIP rutas (ya presentes)")
              raise SystemExit(0)
          ig = tq.find("def _route_get(")
          assert ig >= 0
          ic = tq.find(
              "caps = type(self).caps", ig)
          assert ic > ig
          le = tq.find("\n", ic) + 1
          GET_ROUTE = (
              "        if (\n"
              "            len(s) == 3\n"
              "            and s[0] == \"bridge\"\n"
              "            and s[1] == \"subscriptions\"\n"
              "        ):\n"
              "            bridge = getattr(\n"
              "                caps, \"bridge\","
              " None)\n"
              "            if bridge is None:\n"
              "                self._send(\n"
              "                    503,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                        \"type\":\n"
              "                        \"not_wired\"}})\n"
              "                return\n"
              "            tipos = (\n"
              "                bridge.subscriptions(\n"
              "                    app_id=s[2]))\n"
              "            self._ok(list(tipos))\n"
              "            return\n"
          )
          tq = tq[:le] + GET_ROUTE + tq[le:]
          print("OK GET /bridge/subscriptions/{app}")
          marker = (
              'if s == ["documents", "register"]:'
          )
          idx = tq.find(marker)
          assert idx >= 0, (
              "ancla documents/register")
          ls = tq.rfind("\n", 0, idx) + 1
          IND = tq[ls:idx]
          POST_ROUTE = (
              IND
              + 'if s == ["bridge", "relay"]:\n'
              + IND + "    bridge = getattr(\n"
              + IND + "        type(self).caps,"
              " \"bridge\", None)\n"
              + IND + "    if bridge is None:\n"
              + IND + "        self._send(\n"
              + IND + "            503,\n"
              + IND + "            {\n"
              + IND + "                \"ok\": False,\n"
              + IND + "                \"error\": {\n"
              + IND + "                \"type\":\n"
              + IND + "                \"not_wired\"}})\n"
              + IND + "        return\n"
              + IND + "    resultado = (\n"
              + IND + "        bridge.relay())\n"
              + IND + "    self._send(\n"
              + IND + "        200,\n"
              + IND + "        {\n"
              + IND + "            \"ok\": True,\n"
              + IND + "            \"data\": ("
              "resultado)},\n"
              + IND + "    )\n"
              + IND + "    return\n"
          )
          tq = tq[:ls] + POST_ROUTE + tq[ls:]
          print("OK POST /bridge/relay")
          ast.parse(tq)
          q.write_text(tq, encoding="utf-8")
          tq2 = q.read_text(encoding="utf-8")
          assert ('if s == ["bridge", "relay"]:'
                  in tq2)
          assert ('s[1] == "subscriptions"'
                  in tq2)
          assert ('if s == ["documents",'
                  ' "register"]:' in tq2)
          print("OK rutas bridge (AST valido)")
          RTEOF

      - name: "Paso D - tests del puente (entrega unica + dedup crash + enrutamiento por tipo)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/events/tests/"
              "test_events.py")
          t = p.read_text(encoding="utf-8")
          if ("test_bridge_deliver_once"
                  "_and_dedup" in t):
              print("SKIP tests (ya presentes)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_bridge_deliver_once_and_dedup(
                  tmp_path,
              ) -> None:
                  """AX-BRIDGE: la Red reparte ->
                  NEXO recibe UNA vez; simulacion
                  de crash (evento vuelve a
                  PENDING) -> re-relay NO duplica
                  efecto (Inbox dedup)."""
                  from shared_engines.events.outbox import (
                      Outbox, InterAppBridge)
                  from shared_engines.events.inbox import (
                      Inbox)
                  from shared_engines.events.contracts import (
                      EventCatalog)
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  cat = EventCatalog()
                  cat.register(
                      "agro.sale.created")
                  db_red = SQLiteAdapter(
                      tmp_path / "red.db")
                  db_nexo = SQLiteAdapter(
                      tmp_path / "nexo.db")
                  clock = FrozenClock()
                  out_red = Outbox(db_red, clock)
                  out_red.ensure_schema()
                  ev = cat.build(
                      "agro.sale.created",
                      aggregate_id="S1",
                      payload={"total": 100},
                      clock=clock)
                  out_red.enqueue(ev)
                  inbox_nexo = Inbox(
                      db_nexo, clock)
                  recibidos = []
                  bridge = InterAppBridge(
                      db=db_red, clock=clock,
                      source=out_red)
                  bridge.subscribe(
                      app_id="nexo",
                      event_types=(
                          "agro.sale"
                          ".created",),
                      inbox=inbox_nexo,
                      handler=(
                          recibidos.append))
                  r1 = bridge.relay()
                  assert r1["drained"] == 1, str(r1)
                  assert r1["delivered"] == 1, str(r1)
                  assert len(recibidos) == 1
                  db_red.execute(
                      "UPDATE events_outbox SET"
                      " state = 'PENDING',"
                      " published_at = NULL"
                      " WHERE event_id = ?",
                      (ev.event_id,))
                  r2 = bridge.relay()
                  assert r2["drained"] == 1
                  assert (r2["delivered"]
                          == 0), str(r2)
                  assert r2["duplicates"] == 1, str(r2)
                  assert len(recibidos) == 1, (
                      "dedup fallo")
                  assert (bridge.subscriptions(
                      app_id="nexo")
                      == ("agro.sale"
                          ".created",))


              def test_bridge_routes_by_type(
                  tmp_path,
              ) -> None:
                  """AX-BRIDGE: cada evento llega
                  solo a quien se suscribio a su
                  tipo (fuente unica por dominio);
                  no suscrito NO recibe."""
                  from shared_engines.events.outbox import (
                      Outbox, InterAppBridge)
                  from shared_engines.events.inbox import (
                      Inbox)
                  from shared_engines.events.contracts import (
                      EventCatalog)
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  cat = EventCatalog()
                  cat.register(
                      "life.birth.registered")
                  cat.register(
                      "agro.sale.created")
                  db_s = SQLiteAdapter(
                      tmp_path / "s.db")
                  db_r = SQLiteAdapter(
                      tmp_path / "r.db")
                  clock = FrozenClock()
                  out_s = Outbox(db_s, clock)
                  out_r = Outbox(db_r, clock)
                  out_s.ensure_schema()
                  out_r.ensure_schema()
                  e1 = cat.build(
                      "life.birth.registered",
                      aggregate_id="P1",
                      payload={}, clock=clock)
                  e2 = cat.build(
                      "agro.sale.created",
                      aggregate_id="S2",
                      payload={}, clock=clock)
                  out_s.enqueue(e1)
                  out_s.enqueue(e2)
                  out_r.enqueue(e1)
                  out_r.enqueue(e2)
                  got_axis = []
                  got_nexo = []
                  bridge = InterAppBridge(
                      db=db_r, clock=clock,
                      source=out_r)
                  bridge.subscribe(
                      app_id="axis",
                      event_types=(
                          "life.birth"
                          ".registered",),
                      inbox=Inbox(
                          SQLiteAdapter(
                              tmp_path
                              / "ax.db"),
                          clock),
                      handler=(
                          got_axis.append))
                  bridge.subscribe(
                      app_id="nexo",
                      event_types=(
                          "agro.sale"
                          ".created",),
                      inbox=Inbox(
                          SQLiteAdapter(
                              tmp_path
                              / "nx.db"),
                          clock),
                      handler=(
                          got_nexo.append))
                  bridge.relay()
                  assert len(got_axis) == 1
                  assert (got_axis[0]
                          .event_type
                          == "life.birth"
                          ".registered")
                  assert len(got_nexo) == 1
                  assert (got_nexo[0]
                          .event_type
                          == "agro.sale"
                          ".created")
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert ("test_bridge_deliver_once"
                  "_and_dedup" in final)
          assert ("test_bridge_routes"
                  "_by_type" in final)
          print("OK tests puente (AST valido)")
          TSEOF

      - name: "Paso E - GATE Red (shared_engines completo)"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -8

      - name: "Paso F - GATE apps (4 apps)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso G - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-8 v2"
            echo '```'
            python3 -m pytest shared_engines/events -vv --tb=long 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-8: puente inter-app (InterAppBridge: suscripciones durables + relay con dedup Inbox)" -m "El cartero de la Red: drena el outbox fuente y entrega cada evento UNA VEZ a cada app suscrita (Inbox dedup transaccional - at-least-once nunca duplica efecto, probado con simulacion de crash: evento vuelve a PENDING y el re-relay entrega 0). Suscripcion por app_id + tipos (tabla bridge_subscriptions, durable): internas (AGRO/AXIS/NEXO/SEMILLA/SUBASTAS) y externas (bancos/alcaldias/instituciones) entran por la MISMA puerta. Enrutamiento por event_type (fuente unica por dominio). Rutas: POST /bridge/relay + GET /bridge/subscriptions/{app} (503 not_wired si sin bridge). Outbox original intacto (9 metodos verificados). Fix de v1: nonlocal duplicados, recibidos sin parentesis (SyntaxError)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
