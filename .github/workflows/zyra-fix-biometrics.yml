name: "AGRO DIAG: lectura de archivos de seguridad y servicios (solo lectura, no modifica)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump archivos reales (solo lectura)
        run: |
          python3 - <<'DUMPEOF'
          from pathlib import Path

          FILES = [
              "apps/agro/constants/roles/constants.py",
              "apps/agro/security/security_context.py",
              "apps/agro/security/security_gateway.py",
              "apps/agro/security/access_control.py",
              "apps/agro/modules/seguridad/auditoria/audit_service.py",
              "apps/agro/modules/seguridad/identidad/identity_service.py",
              "apps/agro/modules/seguridad/accesos/access_service.py",
              "apps/agro/modules/seguridad/control/security_control_service.py",
              "apps/agro/modules/productores/perfil/profile_service.py",
              "apps/agro/modules/productores/unidades_productivas/unit_service.py",
              "apps/agro/modules/productores/documentos/document_service.py",
              "apps/agro/modules/productores/historial/history_service.py",
              "apps/agro/modules/productores/estado/status_service.py",
              "apps/agro/modules/productores/registro/producer_registration.py",
              "apps/agro/modules/produccion/planificacion/planning_service.py",
              "apps/agro/modules/produccion/seguimiento/tracking_service.py",
              "apps/agro/modules/produccion/rendimiento/yield_service.py",
              "apps/agro/modules/produccion/reportes/production_report.py",
              "apps/agro/modules/operaciones/incidencias/incident_service.py",
              "apps/agro/modules/comercializacion/ventas/sales_service.py",
              "apps/agro/modules/comercializacion/mercado/market_service.py",
              "apps/agro/modules/comercializacion/exportacion/export_service.py",
              "apps/agro/modules/comercializacion/logistica/logistics_adapter.py",
              "apps/agro/modules/riesgo/alertas/risk_alert_service.py",
              "apps/agro/modules/riesgo/impacto/impact_service.py",
              "apps/agro/modules/recursos_y_activos/valoracion/valuation_service.py",
              "apps/agro/modules/recursos_y_activos/tierras/land_service.py",
              "apps/agro/services/producer_service.py",
              "apps/agro/services/production_service.py",
          ]
          for f in FILES:
              p = Path(f)
              print("")
              if not p.exists():
                  print("NO EXISTE:", f)
                  continue
              t = p.read_text(encoding="utf-8", errors="ignore")
              print("=" * 20, f, "(" + str(len(t.splitlines())) + " lineas)", "=" * 20)
              print(t)
          DUMPEOF
