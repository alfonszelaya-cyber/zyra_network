name: ZYRA AXIS Block C Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: Create judicial_automation.py complete
        run: |
          cat > apps/axis/life_history/judicial_automation.py <<'JEOF'
          """AXIS Judicial automation - complete."""
          import hashlib
          import uuid

          from apps.axis.life_history.access_control import (
              authorize,
          )

          BRANCHES = {
              "penal": {
                  "evidence_required": True,
                  "sentencer": ("juez_penal", "gobierno"),
              },
              "civil": {
                  "evidence_required": False,
                  "sentencer": ("juez_civil", "gobierno"),
              },
              "familiar": {
                  "evidence_required": False,
                  "sentencer": ("juez_familiar", "gobierno"),
              },
              "laboral": {
                  "evidence_required": False,
                  "sentencer": ("juez_laboral", "gobierno"),
              },
              "comercial": {
                  "evidence_required": False,
                  "sentencer": ("juez_comercial", "gobierno"),
              },
              "administrativo": {
                  "evidence_required": False,
                  "sentencer": ("gobierno",),
              },
          }

          START_STAGES = {
              "penal": "denuncia",
              "civil": "demanda",
              "familiar": "demanda",
              "laboral": "demanda",
              "comercial": "demanda",
              "administrativo": "recurso",
          }


          class JudicialAutomationError(Exception):
              pass


          class JudicialAutomation:
              def __init__(self, *, life, db):
                  self._life = life
                  self._db = db
                  self._db.execute(
                      "CREATE TABLE IF NOT EXISTS"
                      " judicial_cases ("
                      " case_id TEXT PRIMARY KEY,"
                      " person_id TEXT NOT NULL,"
                      " branch TEXT NOT NULL,"
                      " stage TEXT NOT NULL,"
                      " actor TEXT NOT NULL,"
                      " created_at REAL NOT NULL,"
                      " updated_at REAL NOT NULL)"
                  )
                  self._db.execute(
                      "CREATE TABLE IF NOT EXISTS"
                      " judicial_evidence ("
                      " evidence_id TEXT PRIMARY KEY,"
                      " case_id TEXT NOT NULL,"
                      " description TEXT NOT NULL,"
                      " sealed_doc TEXT,"
                      " created_at REAL NOT NULL)"
                  )
                  self._db.execute(
                      "CREATE TABLE IF NOT EXISTS"
                      " judicial_audiencias ("
                      " audiencia_id TEXT PRIMARY KEY,"
                      " case_id TEXT NOT NULL,"
                      " scheduled_at TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " created_at REAL NOT NULL)"
                  )

              def open_case(
                  self, *, case_id, person_id,
                  branch, actor, actor_role,
                  detail,
              ):
                  if branch not in BRANCHES:
                      raise (
                          JudicialAutomationError(
                              "unknown branch: "
                              + str(branch)
                          )
                      )
                  if not authorize(
                      "justice.case", actor_role
                  ):
                      raise (
                          JudicialAutomationError(
                              "role not authorized"
                          )
                      )
                  now = (
                      self._life._store._clock.now()
                  )
                  start = START_STAGES[branch]
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO judicial_cases"
                          " (case_id, person_id,"
                          " branch, stage, actor,"
                          " created_at, updated_at)"
                          " VALUES (?,?,?,?,?,?,?)",
                          (
                              case_id,
                              person_id,
                              branch,
                              start,
                              actor,
                              now,
                              now,
                          ),
                      )
                      self._chain_event(
                          cursor,
                          person_id=person_id,
                          actor=actor,
                          event_type=(
                              "justice_case"
                          ),
                          detail=case_id
                          + " abierto ["
                          + branch
                          + "]",
                          now=now,
                      )
                  return self.get_case(case_id)

              def add_evidence(
                  self, *, case_id, actor,
                  actor_role, description,
                  sealed_doc=None,
              ):
                  if not authorize(
                      "justice.case", actor_role
                  ):
                      raise (
                          JudicialAutomationError(
                              "not authorized"
                          )
                      )
                  case = self.get_case(case_id)
                  if case is None:
                      raise (
                          JudicialAutomationError(
                              "unknown case"
                          )
                      )
                  now = (
                      self._life._store._clock.now()
                  )
                  eid = (
                      "EVD-"
                      + uuid.uuid4().hex[:10]
                  )
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " judicial_evidence ("
                          " evidence_id, case_id,"
                          " description, sealed_doc,"
                          " created_at)"
                          " VALUES (?,?,?,?,?)",
                          (
                              eid,
                              case_id,
                              description,
                              sealed_doc,
                              now,
                          ),
                      )
                      self._chain_event(
                          cursor,
                          person_id=str(
                              case["person_id"]
                          ),
                          actor=actor,
                          event_type=(
                              "justice_evidence"
                          ),
                          detail=eid
                          + ": "
                          + description[:40],
                          now=now,
                      )
                  return {"evidence_id": eid}

              def schedule_audiencia(
                  self, *, case_id, actor,
                  actor_role, scheduled_at,
              ):
                  case = self.get_case(case_id)
                  if case is None:
                      raise (
                          JudicialAutomationError(
                              "unknown case"
                          )
                      )
                  cfg = BRANCHES[
                      str(case["branch"])
                  ]
                  if cfg["evidence_required"]:
                      ev = self._db.query_one(
                          "SELECT 1 FROM"
                          " judicial_evidence"
                          " WHERE case_id = ?",
                          (case_id,),
                      )
                      if ev is None:
                          raise (
                              JudicialAutomationError(
                                  "evidence required"
                                  " before audiencia"
                              )
                          )
                  now = (
                      self._life._store._clock.now()
                  )
                  aid = (
                      "AUD-"
                      + uuid.uuid4().hex[:10]
                  )
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " judicial_audiencias ("
                          " audiencia_id, case_id,"
                          " scheduled_at, status,"
                          " created_at)"
                          " VALUES (?,?,?,?,?)",
                          (
                              aid,
                              case_id,
                              scheduled_at,
                              "programada",
                              now,
                          ),
                      )
                      self._advance_stage(
                          cursor,
                          case_id=case_id,
                          stage="audiencia",
                          actor=actor,
                          now=now,
                      )
                  return {"audiencia_id": aid}

              def sentence(
                  self, *, case_id, actor,
                  actor_role, verdict,
              ):
                  case = self.get_case(case_id)
                  if case is None:
                      raise (
                          JudicialAutomationError(
                              "unknown case"
                          )
                      )
                  cfg = BRANCHES[
                      str(case["branch"])
                  ]
                  if actor_role not in cfg[
                      "sentencer"
                  ]:
                      raise (
                          JudicialAutomationError(
                              "role cannot sentence:"
                              " " + actor_role
                          )
                      )
                  now = (
                      self._life._store._clock.now()
                  )
                  with self._db.transaction() as cursor:
                      self._advance_stage(
                          cursor,
                          case_id=case_id,
                          stage="sentencia",
                          actor=actor,
                          now=now,
                      )
                      self._chain_event(
                          cursor,
                          person_id=str(
                              case["person_id"]
                          ),
                          actor=actor,
                          event_type=(
                              "justice_status"
                          ),
                          detail=case_id
                          + " sentencia: "
                          + verdict[:60],
                          now=now,
                      )
                  return {"sentenced": True}

              def close_case(
                  self, *, case_id, actor,
              ):
                  now = (
                      self._life._store._clock.now()
                  )
                  with self._db.transaction() as cursor:
                      self._advance_stage(
                          cursor,
                          case_id=case_id,
                          stage="cerrado",
                          actor=actor,
                          now=now,
                      )
                  return {"closed": True}

              def _advance_stage(
                  self, cursor, *, case_id,
                  stage, actor, now,
              ):
                  cursor.execute(
                      "UPDATE judicial_cases SET"
                      " stage = ?, updated_at = ?"
                      " WHERE case_id = ?",
                      (stage, now, case_id),
                  )
                  row = cursor.execute(
                      "SELECT person_id FROM"
                      " judicial_cases WHERE"
                      " case_id = ?",
                      (case_id,),
                  ).fetchone()
                  if row is not None:
                      self._chain_event(
                          cursor,
                          person_id=str(
                              row["person_id"]
                          ),
                          actor=actor,
                          event_type=(
                              "justice_status"
                          ),
                          detail=case_id
                          + " -> "
                          + stage,
                          now=now,
                      )

              def _chain_event(
                  self, cursor, *, person_id,
                  actor, event_type, detail,
                  now,
              ):
                  row = cursor.execute(
                      "SELECT event_hash FROM"
                      " life_events WHERE"
                      " person_id = ? ORDER BY"
                      " rowid DESC LIMIT 1",
                      (person_id,),
                  ).fetchone()
                  previous = (
                      str(row["event_hash"])
                      if row is not None
                      else "GENESIS"
                  )
                  payload = "|".join(
                      (
                          person_id,
                          previous,
                          actor,
                          event_type,
                          detail or "",
                          str(now),
                      )
                  )
                  event_hash = hashlib.sha256(
                      payload.encode("utf-8")
                  ).hexdigest()
                  event_id = (
                      "LHE-"
                      + uuid.uuid4().hex[:10]
                  )
                  cursor.execute(
                      "INSERT INTO life_events ("
                      " event_id, person_id,"
                      " previous_hash, event_hash,"
                      " actor, event_type, detail,"
                      " occurred_at)"
                      " VALUES (?,?,?,?,?,?,?,?)",
                      (
                          event_id,
                          person_id,
                          previous,
                          event_hash,
                          actor,
                          event_type,
                          detail,
                          now,
                      ),
                  )
                  return {
                      "event_id": event_id
                  }

              def get_case(self, case_id):
                  row = self._db.query_one(
                      "SELECT * FROM judicial_cases"
                      " WHERE case_id = ?",
                      (case_id,),
                  )
                  if row is None:
                      return None
                  return {
                      "case_id": str(
                          row["case_id"]
                      ),
                      "person_id": str(
                          row["person_id"]
                      ),
                      "branch": str(
                          row["branch"]
                      ),
                      "stage": str(
                          row["stage"]
                      ),
                  }
          JEOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/judicial_automation.py').read()); print('judicial OK')"

      - name: Write tests
        run: |
          cat > apps/axis/life_history/tests/test_judicial_automation.py <<'J2EOF'
          """Judicial automation E2E tests."""
          from __future__ import annotations

          import unittest

          from apps.axis.life_history.judicial_automation import (
              JudicialAutomation,
              JudicialAutomationError,
          )
          from apps.axis.life_history.service import (
              LifeHistoryService,
          )
          from apps.axis.life_history.store import (
              LifeHistoryStore,
          )
          from shared_engines.common.clocks import SystemClock
          from shared_engines.storage.database import SQLiteAdapter

          _MOTHER = "ZID-mother-jud"


          class _FakeNet:
              def get(self, path):
                  zid = path.rsplit("/", 1)[-1]
                  if zid in (_MOTHER, "ZID-acused-1"):
                      return True, {"status": "ACTIVE"}, None
                  return False, None, "unknown identity"

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return True, {"document_id": "DOC-j"}, None
                  if path == "/history/append":
                      return True, {"appended": True}, None
                  return False, None, "unknown"


          class JudicialE2E(unittest.TestCase):
              def _boot(self):
                  db = SQLiteAdapter(":memory:")
                  clock = SystemClock()
                  life = LifeHistoryService(
                      store=LifeHistoryStore(db, clock),
                      client=_FakeNet(),
                  )
                  birth = life.register_birth_with_network(
                      registrar_account="AX-reg-1",
                      child_name="Acusado Nacido",
                      birth_date="1990-06-01",
                      birth_place="San Salvador",
                      sex="M",
                      mother_name="Madre J",
                      mother_zid=_MOTHER,
                  )
                  person_id = str(birth["person_id"])
                  life.attach_zid_with_audit(
                      person_id,
                      zid="ZID-acused-1",
                      actor="biometric-enroll",
                  )
                  auto = JudicialAutomation(life=life, db=db)
                  return life, auto, person_id

              def test_full_penal_flow(self):
                  life, auto, person_id = self._boot()
                  case = auto.open_case(
                      case_id="JC-pen-1",
                      person_id=person_id,
                      branch="penal",
                      actor="AX-abogado",
                      actor_role="abogado",
                      detail="robo",
                  )
                  self.assertEqual("denuncia", case["stage"])
                  auto.add_evidence(
                      case_id="JC-pen-1",
                      actor="AX-fiscal",
                      actor_role="gobierno",
                      description="camara",
                  )
                  aud = auto.schedule_audiencia(
                      case_id="JC-pen-1",
                      actor="AX-juez-penal",
                      actor_role="juez_penal",
                      scheduled_at="viernes 9am",
                  )
                  self.assertTrue(
                      aud["audiencia_id"].startswith("AUD-")
                  )
                  auto.sentence(
                      case_id="JC-pen-1",
                      actor="AX-juez-penal",
                      actor_role="juez_penal",
                      verdict="condena parcial",
                  )
                  case = auto.get_case("JC-pen-1")
                  self.assertEqual("sentencia", case["stage"])
                  auto.close_case(
                      case_id="JC-pen-1",
                      actor="AX-juez-penal",
                  )
                  self.assertEqual(
                      "cerrado",
                      auto.get_case("JC-pen-1")["stage"],
                  )
                  self.assertTrue(
                      life._store.events_verify(person_id)
                  )
                  types = [
                      e["event_type"]
                      for e in life._store.events_of(
                          person_id
                      )
                  ]
                  self.assertIn("justice_evidence", types)

              def test_penal_requires_evidence(self):
                  life, auto, person_id = self._boot()
                  auto.open_case(
                      case_id="JC-pen-2",
                      person_id=person_id,
                      branch="penal",
                      actor="AX-abogado",
                      actor_role="abogado",
                      detail="sin pruebas",
                  )
                  with self.assertRaises(
                      JudicialAutomationError
                  ):
                      auto.schedule_audiencia(
                          case_id="JC-pen-2",
                          actor="AX-juez",
                          actor_role="juez_penal",
                          scheduled_at="x",
                      )

              def test_wrong_sentencer_rejected(self):
                  life, auto, person_id = self._boot()
                  auto.open_case(
                      case_id="JC-pen-3",
                      person_id=person_id,
                      branch="penal",
                      actor="AX-abogado",
                      actor_role="abogado",
                      detail="x",
                  )
                  auto.add_evidence(
                      case_id="JC-pen-3",
                      actor="AX-fiscal",
                      actor_role="gobierno",
                      description="prueba",
                  )
                  with self.assertRaises(
                      JudicialAutomationError
                  ):
                      auto.sentence(
                          case_id="JC-pen-3",
                          actor="AX-medico",
                          actor_role="medico",
                          verdict="x",
                      )

              def test_civil_no_evidence_needed(self):
                  life, auto, person_id = self._boot()
                  auto.open_case(
                      case_id="JC-civ-1",
                      person_id=person_id,
                      branch="civil",
                      actor="AX-abogado",
                      actor_role="abogado",
                      detail="deuda",
                  )
                  aud = auto.schedule_audiencia(
                      case_id="JC-civ-1",
                      actor="AX-juez-civil",
                      actor_role="juez_civil",
                      scheduled_at="lunes",
                  )
                  self.assertTrue(
                      aud["audiencia_id"].startswith("AUD-")
                  )

              def test_unknown_branch_rejected(self):
                  life, auto, person_id = self._boot()
                  with self.assertRaises(
                      JudicialAutomationError
                  ):
                      auto.open_case(
                          case_id="JC-bad",
                          person_id=person_id,
                          branch="venganza",
                          actor="AX-x",
                          actor_role="abogado",
                          detail="x",
                      )


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          J2EOF
          python3 -c "import ast; ast.parse(open('apps/axis/life_history/tests/test_judicial_automation.py').read()); print('test OK')"

      - name: 1/3 Judicial tests (5 E2E)
        run: python -m pytest apps/axis/life_history/tests/test_judicial_automation.py -v

      - name: 2/3 Life History regression
        run: |
          python -m pytest apps/axis/life_history/tests/test_outbox_bridge.py apps/axis/life_history/tests/test_service.py apps/axis/life_history/tests/test_verification.py apps/axis/life_history/tests/test_health_link.py apps/axis/life_history/tests/test_longitudinal_screen.py apps/axis/life_history/tests/test_justice_service.py apps/axis/life_history/tests/test_security_service.py apps/axis/life_history/tests/test_ops_server.py apps/axis/life_history/tests/test_clearance_ops.py apps/axis/life_history/tests/test_concurrency_recovery.py -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "judicial automation complete: uuid import, 6 branches, full workflow (5 E2E)"
            git push
          fi
