name: ZYRA D5 diseno completo registro biometrico y sesion unica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD5:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: D5 completo
        run: |
          python3 - <<'PYEOF'
          import base64, hashlib, json, os, py_compile, re, secrets, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          PORTAL = ROOT / 'portal'
          MPE = ROOT / 'apps' / 'mi_primer_empleo' / 'server.py'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD5.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          class NoRedir(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(NoRedir)

          def pedir(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  resp = OPENER.open(req, timeout=20)
                  return resp.status, resp.headers, resp.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, None, str(e)

          def png_min(rgb=(90, 90, 160), w=8, h=8):
              def chunk(tipo, datos):
                  cuerpo = tipo + datos
                  return struct.pack('>I', len(datos)) + cuerpo + struct.pack('>I', zlib.crc32(cuerpo) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              fila = b'\x00' + bytes(rgb) * w
              raw = fila * h
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')

          sp_orig = SP_FILE.read_bytes()
          idx = PORTAL / 'index.html'
          regf = PORTAL / 'registro.html'
          verf = PORTAL / 'version.txt'
          swf = PORTAL / 'sw.js'
          originales = {
              'sp': sp_orig,
              'idx': idx.read_bytes(),
              'reg': regf.read_bytes() if regf.exists() else b'',
              'mpe': MPE.read_bytes(),
          }
          creados = []

          def revertir():
              try:
                  SP_FILE.write_bytes(originales['sp'])
                  idx.write_bytes(originales['idx'])
                  if originales['reg']:
                      regf.write_bytes(originales['reg'])
                  MPE.write_bytes(originales['mpe'])
                  for c in creados:
                      p = ROOT / c
                      if p.exists():
                          p.unlink()
              except Exception:
                  pass

          nf0 = np0 = 0
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              nf0 += 1
              if p.suffix == '.py':
                  np0 += 1

          t0sp = sp_orig.decode('utf-8')
          add('# D5 - DISENO COMPLETO (pantalla + registro biometrico + sesion)')
          add('')
          add('Snapshot inicial: archivos=%d python=%d' % (nf0, np0))
          add('')

          add('## U1. Sonda /identity/enroll con imagenes de prueba')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d5', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-d5', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              try:
                  urllib.request.urlopen(BASE + '/health', timeout=2)
                  vivo = True
                  break
              except urllib.error.HTTPError:
                  vivo = True
                  break
              except Exception:
                  time.sleep(1.0)
          H = {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN}
          enroll_ok = None
          resp_enroll = None
          if vivo:
              pl = {'kind': 'person', 'name': 'Sonda D5',
                    'doc_image_b64': base64.b64encode(png_min()).decode('ascii'),
                    'selfie_image_b64': base64.b64encode(png_min((160, 90, 90))).decode('ascii')}
              req = urllib.request.Request(BASE + '/identity/enroll', data=json.dumps(pl).encode('utf-8'), headers=H, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      st, cuerpo = r.status, r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  st, cuerpo = e.code, e.read().decode('utf-8', errors='replace')
              add('- POST /identity/enroll -> %s | %s' % (st, cuerpo[:300]))
              resp_enroll = (st, cuerpo)
              enroll_ok = st in (200, 201)
              if enroll_ok:
                  add('- **LA RED ACEPTO EL ENROLL: registro biometrico funcional en pruebas**')
              else:
                  add('- La Red rechazo con las imagenes sinteticas (esperable si valida rostro real).')
                  add('- El flujo queda cableado igual: con documento+selfie reales la Red decide.')
          gate('sonda_enroll', resp_enroll is not None)
          add('')

          add('## U2. Contracto de respuesta (donde esta el zid)')
          add('')
          campos = []
          if resp_enroll:
              try:
                  j = json.loads(resp_enroll[1])
                  d = j.get('data', j)
                  if isinstance(d, dict):
                      campos = sorted(d.keys())
                      add('- campos de respuesta: %s' % campos)
              except Exception:
                  pass
          if not campos:
              add('- respuesta no JSON o rechazo: el proxy tomara zid/identity_id/id si existen')
          DATA['campos'] = campos
          add('')

          try:
              if proc.poll() is None:
                  proc.terminate()
                  proc.wait(timeout=10)
          except Exception:
              try:
                  proc.kill()
              except Exception:
                  pass

          add('## U3. registro.html: biometria con camara')
          add('')
          REG = (
          '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n'
          '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
          '<title>Registro - ZYRA</title>\n<style>\n'
          'body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:#0a0e27;'
          'color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:28px 14px;box-sizing:border-box}\n'
          '.caja{max-width:480px;width:100%;background:#11162b;border:1px solid #242c4f;'
          'border-radius:16px;padding:24px 20px;box-sizing:border-box}\n'
          'h1{margin:0 0 6px;font-size:21px;text-align:center}\n'
          'p{color:#8b949e;font-size:13px;line-height:1.5;margin:6px 0;text-align:center}\n'
          'label{display:block;font-size:13px;color:#8b949e;margin:10px 0 4px}\n'
          'input{width:100%;padding:12px;border-radius:10px;border:1px solid #30363d;'
          'background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px}\n'
          'video{width:100%;border-radius:12px;background:#000;margin-top:6px}\n'
          'canvas{display:none}\n'
          'button{width:100%;margin-top:10px;padding:13px;border-radius:12px;border:none;'
          'background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);color:#fff;font-size:15px;font-weight:700}\n'
          '.mini{background:#1f2a44;font-size:14px}\n'
          '.hecho{outline:2px solid #238636;opacity:.85}\n'
          'a{color:#8b5cf6;text-decoration:none}\n'
          '#resp{margin-top:12px;text-align:center;font-size:14px;word-break:break-all}\n'
          '.zid{color:#3fb950;font-weight:800;font-size:20px}\n'
          '</style>\n</head>\n<body>\n<div class="caja">\n'
          '<h1>Registro de ciudadanos</h1>\n'
          '<p>Un solo registro para toda la vida. La Red verifica tu identidad con biometria y crea tu <b>ZID unico e inmutable</b>.</p>\n'
          '<form id="f" onsubmit="return enviar(event)">\n'
          '<label>Nombre completo</label>\n<input id="nombre" required>\n'
