name: "ZYRA S53 registro definitivo (cuadro sigue el documento + bloqueos en cada paso + biometria dura antes de la clave)"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  s53:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Validar YAML"
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml', encoding='utf-8')); print('YAML OK')"

      - name: "S53 servidor (sin cambios si ya esta)"
        run: |
          cat > /tmp/s53_srv.py << 'PYEOF'
          import os, sys
          REPO = os.getcwd()
          OUT = []
          def P(s=""): OUT.append(str(s))
          def compila(t, n):
              try:
                  compile(t, n, "exec")
                  return True
              except Exception as e:
                  P("compile fallo en %s: %s" % (n, repr(e)[:250]))
                  return False
          LF = chr(10)
          AP = os.path.join(REPO, "shared_engines", "runtime", "api.py")
          asrc = open(AP, encoding="utf-8", errors="replace").read()
          if "doc_match_score" in asrc:
              P("puntaje: YA ESTABA")
          else:
              A1 = LF.join([
                '                        "reason": (',
                '                            case.result.reason',
                '                            if case.result is not None',
                '                            else None',
                '                        ),',
              ])
              c1 = asrc.count(A1)
              P("ancla reason: %d" % c1)
              if c1 == 1:
                  N1 = A1 + LF + LF.join([
                    '                        "doc_match_score": (',
                    '                            float(case.result.doc_match_score)',
                    '                            if case.result is not None',
                    '                            and case.result.doc_match_score is not None',
                    '                            else None',
                    '                        ),',
                  ])
                  a2 = asrc.find(A1)
                  asrc2 = asrc[:a2] + N1 + asrc[a2 + len(A1):]
                  if compila(asrc2, "api.py"):
                      open(AP, "w", encoding="utf-8").write(asrc2)
                      P("puntaje: APLICADO")
                  else:
                      P("puntaje: no compilo, sin cambio")
              else:
                  P("puntaje: ancla no unica, sin cambio")
          KP = os.path.join(REPO, "shared_engines", "runtime", "kernel.py")
          ksrc = open(KP, encoding="utf-8", errors="replace").read()
          if "_biometrics_policy" in ksrc:
              P("umbrales: YA ESTABAN")
          else:
              A2 = LF.join([
                '                    policy=BiometricsPolicy(',
                '                        require_liveness=True',
                '                    ),',
              ])
              c2 = ksrc.count(A2)
              if c2 == 1:
                  ksrc = ksrc.replace(A2, '                    policy=_biometrics_policy(),', 1)
                  A3 = 'class ZyraKernel:'
                  c3 = ksrc.count(A3)
                  if c3 == 1:
                      FN = LF.join([
                        'def _biometrics_policy():',
                        '    choice = (',
                        '        os.environ.get(',
                        '            "ZYRA_BIOMETRICS_PROVIDER",',
                        '            "fail-closed",',
                        '        )',
                        '        .strip()',
                        '        .lower()',
                        '    )',
                        '    if choice == "zyra":',
                        '        return BiometricsPolicy(',
                        '            require_liveness=True,',
                        '            doc_auto=0.40,',
                        '            doc_review=0.28,',
                        '            doc_reject=0.25,',
                        '            dup_reject=0.55,',
                        '        )',
                        '    return BiometricsPolicy(',
                        '        require_liveness=True',
                        '    )',
                        '',
                        '',
                        'class ZyraKernel:',
                      ])
                      ksrc = ksrc.replace(A3, FN, 1)
                      if compila(ksrc, "kernel.py"):
                          open(KP, "w", encoding="utf-8").write(ksrc)
                          P("umbrales: APLICADOS")
                      else:
                          P("umbrales: no compilo, sin cambio")
                  else:
                      P("umbrales: clase no unica, sin cambio")
              else:
                  P("umbrales: ancla no unica, sin cambio")
          P("S53 SRV OK")
          print("\n".join(OUT))
          PYEOF
          python3 /tmp/s53_srv.py > /tmp/s53_srv.txt 2>&1 || true
          cat /tmp/s53_srv.txt
          { echo "## S53 — servidor"; echo '````'; cat /tmp/s53_srv.txt; echo '````'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "S53 formulario v32 completo"
        run: |
          cat > /tmp/s53_fix.py << 'PYEOF'
          import os, sys, re, subprocess

          REPO = os.getcwd()
          OUT = []
          def P(s=""): OUT.append(str(s))

          SP = os.path.join(REPO, "superapp.py")
          src = open(SP, encoding="utf-8", errors="replace").read()

          A = "_reg_html = '''"
          if src.count(A) != 1:
              P("ancla no unica — NO SE ESCRIBE")
              print("\n".join(OUT)); sys.exit(1)
          a = src.find(A) + len(A)
          e = src.find("\n'''", a)

          PAGE = r'''<!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ZYRA - Crear mi ZID</title>
          <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
          <style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:system-ui,Arial;background:#12162e;color:#e8eaf6;padding:16px;max-width:520px;margin:0 auto}
          h1{font-size:22px;text-align:center;margin:8px 0 4px;color:#fff}
          .sub{text-align:center;color:#9aa0c3;font-size:13px;margin-bottom:8px}
          .prog{text-align:center;color:#7c8cf8;font-weight:800;font-size:13px;margin-bottom:12px;letter-spacing:1px}
          .paso{display:none}
          .paso.act{display:block}
          label{display:block;color:#9aa0c3;font-size:14px;margin:14px 0 6px}
          input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2f55;background:#0d1126;color:#fff;font-size:16px}
          .estado{text-align:center;font-size:13px;color:#9aa0c3;padding:6px;min-height:20px}
          .preview{display:none;width:100%;border-radius:10px;margin-top:6px}
          button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;font-size:15px;font-weight:700;color:#fff;background:#262b52}
          button.ok{background:#1f6f43}
          button.big{margin-top:16px;padding:15px;font-size:16px;font-weight:800;background:linear-gradient(90deg,#7c5cff,#ff5c8a)}
          button:disabled{opacity:.45}
