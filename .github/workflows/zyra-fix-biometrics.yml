name: "AGRO RUN G v3: autocontenido - migraciones+assets+tests+fix ruta (todo en un run)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: agro-complete
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - migraciones versionadas (siempre idempotente)"
        run: |
          python3 - <<'MGEOF'
          import textwrap
          from pathlib import Path

          mp = Path(
              "apps/agro/infrastructure/persistence/"
              "agro_migrations.py"
          )
          assert mp.parent.exists(), "carpeta persistence no existe"
          if mp.exists() and "run_agro_migrations" in mp.read_text(encoding="utf-8"):
              print("SKIP migraciones (ya existen)")
          else:
              content = textwrap.dedent('''\
                  """AGRO - migraciones versionadas (GPT-9).
                  Pre-crea el esquema completo agro_* en orden;
                  idempotente. Los servicios usan CREATE TABLE
                  IF NOT EXISTS: nunca rompe nada."""
                  from __future__ import annotations

                  MIGRATIONS = (
                      (1, "perfil_y_historial", (
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_producer_profiles ("
                          " producer_id TEXT PRIMARY KEY,"
                          " phone TEXT, location TEXT,"
                          " notes TEXT, updated_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_profile_history ("
                          " hid INTEGER PRIMARY KEY"
                          " AUTOINCREMENT,"
                          " producer_id TEXT NOT NULL,"
                          " actor TEXT NOT NULL,"
                          " changed TEXT NOT NULL,"
                          " at TEXT NOT NULL)",
                      )),
                      (2, "unidades_y_planes", (
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_units ("
                          " unit_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " name TEXT NOT NULL,"
                          " unit_type TEXT NOT NULL,"
                          " land_id TEXT, created_at TEXT,"
                          " closed_at TEXT, closed_by TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_plans ("
                          " plan_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " unit_id TEXT NOT NULL,"
                          " crop TEXT NOT NULL,"
                          " target REAL NOT NULL,"
                          " status TEXT NOT NULL,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_stage_log ("
                          " log_id INTEGER PRIMARY KEY"
                          " AUTOINCREMENT,"
                          " plan_id TEXT NOT NULL,"
                          " stage TEXT NOT NULL,"
                          " detail TEXT, logged_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_plan_costs ("
                          " cost_id INTEGER PRIMARY KEY"
                          " AUTOINCREMENT,"
                          " plan_id TEXT NOT NULL,"
                          " concept TEXT NOT NULL,"
                          " amount REAL NOT NULL,"
                          " currency TEXT NOT NULL,"
                          " actor TEXT NOT NULL,"
                          " created_at TEXT)",
                      )),
                      (3, "seguridad_y_auditoria", (
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_audit_chain ("
                          " seq INTEGER PRIMARY KEY"
                          " AUTOINCREMENT,"
                          " ts TEXT NOT NULL,"
                          " actor TEXT NOT NULL,"
                          " role TEXT NOT NULL,"
                          " operation TEXT NOT NULL,"
                          " outcome TEXT NOT NULL,"
                          " detail TEXT NOT NULL DEFAULT"
                          " '',"
                          " prev_hash TEXT NOT NULL,"
                          " event_hash TEXT NOT NULL)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_blocked_actors ("
                          " actor TEXT PRIMARY KEY,"
                          " reason TEXT NOT NULL,"
                          " at TEXT NOT NULL)",
                      )),
                      (4, "comercializacion", (
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_sales_plus ("
                          " sale_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " product TEXT NOT NULL,"
                          " quantity REAL NOT NULL,"
                          " remaining REAL NOT NULL,"
                          " unit TEXT NOT NULL DEFAULT"
                          " 'quintal',"
                          " buyer TEXT,"
                          " offer_price REAL,"
                          " total REAL,"
                          " currency TEXT NOT NULL DEFAULT"
                          " 'USD',"
                          " status TEXT NOT NULL,"
                          " paid_at TEXT, delivered_at"
                          " TEXT,"
                          " closed_at TEXT, created_at"
                          " TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_sale_offers ("
                          " offer_id TEXT PRIMARY KEY,"
                          " sale_id TEXT NOT NULL,"
                          " buyer TEXT NOT NULL,"
                          " amount REAL NOT NULL,"
                          " currency TEXT NOT NULL DEFAULT"
                          " 'USD',"
                          " status TEXT NOT NULL,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_inventory_plus ("
                          " inv_id INTEGER PRIMARY KEY"
                          " AUTOINCREMENT,"
                          " producer_id TEXT NOT NULL,"
                          " product TEXT NOT NULL,"
                          " quantity REAL NOT NULL,"
                          " unit TEXT NOT NULL,"
                          " updated_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_market_prices ("
                          " price_id INTEGER PRIMARY KEY"
                          " AUTOINCREMENT,"
                          " product TEXT NOT NULL,"
                          " price REAL NOT NULL,"
                          " actor TEXT NOT NULL,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_exports ("
                          " export_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL,"
                          " product TEXT NOT NULL,"
                          " destination TEXT NOT NULL,"
                          " quantity REAL NOT NULL,"
                          " status TEXT NOT NULL,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_shipments ("
                          " shipment_id TEXT PRIMARY KEY,"
                          " sale_id TEXT NOT NULL,"
                          " origin TEXT NOT NULL,"
                          " destination TEXT NOT NULL,"
                          " cargo TEXT NOT NULL,"
                          " status TEXT NOT NULL,"
                          " engine TEXT NOT NULL,"
                          " created_at TEXT)",
                      )),
                      (5, "recursos_y_riesgo", (
                          "CREATE TABLE IF NOT EXISTS"
