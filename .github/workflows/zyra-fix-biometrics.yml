name: ZYRA AXIS Block 8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix clock access
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/axis/life_history/"
              "security_service.py"
          )
          src = path.read_text(encoding="utf-8")

          old = ").run(life._clock)"
          new = ").run(life._store._clock)"
          if new in src:
              print("RESULT: already fixed")
          elif old in src:
              fixed = src.replace(old, new, 1)
              path.write_text(fixed, encoding="utf-8")
              print("RESULT: FIXED")
          else:
              raise SystemExit("anchor not found")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("SYNTAX OK")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/3 Security service tests (4 E2E)
        run: python -m apps.axis.life_history.tests.test_security_service -v

      - name: 2/3 Life History regression
        run: |
          python -m apps.axis.life_history.store -q
          python -m apps.axis.life_history.tests.test_service -q
          python -m apps.axis.life_history.tests.test_verification -q
          python -m apps.axis.life_history.tests.test_health_link -q
          python -m apps.axis.life_history.tests.test_longitudinal_screen -q
          python -m apps.axis.life_history.tests.test_justice_service -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit fix (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/security_service.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "security: clock from store not service"
            git push
          fi
