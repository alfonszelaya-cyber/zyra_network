name: ZYRA S2m ruta permiso con ancla conteo cero

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseS2m:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: S2m
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SB = ROOT / 'apps' / 'subastas' / 'server.py'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 's2m.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  with OP.open(q, timeout=25) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, str(e)
          orig = SB.read_bytes()
          def revertir():
              try:
                  SB.write_bytes(orig)
              except Exception:
                  pass
          t0 = orig.decode('utf-8')
          add('# S2m - INSERTAR RUTA PERMISO (ancla conteo=0)')
          add('')
          add('## M1. Condicion de insercion: la ruta NO debe existir')
          add('')
          RUTA = 'if path == "/subastas/permiso":'
          n_ruta = t0.count(RUTA)
          add('- veces que aparece: %d (debe ser 0 para insertar)' % n_ruta)
          if n_ruta > 0:
              add('- YA EXISTE (idempotente). Sin cambios.')
              gate('insercion', True)
          else:
              A_DOPOST = '    def do_POST(self) -> None:'
              n_dp = t0.count(A_DOPOST)
              add('- def do_POST(self) -> None: %d (1)' % n_dp)
              gate('ancla_dopost', n_dp == 1)
              if n_dp != 1:
                  DATA['gates'] = {n: o for n, o in GATES}
                  Path('s2m.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
                  escribe()
                  raise SystemExit('ANCHOR - sin cambios')
              HANDLER = '\n'.join([
              '        if path == "/subastas/permiso":',
              '            try:',
              '                zid_h = (self.headers.get("x-zyra-zid") or "").strip()',
              '                aprobado = bool(zid_h)',
              '                motivo = ""',
              '                if not aprobado:',
              '                    try:',
              '                        dd = self._read_json() or {}',
              '                    except Exception:',
              '                        dd = {}',
              '                    z = str(dd.get("zid", "")).strip()',
              '                    c = str(dd.get("clave", ""))',
              '                    owner = os.environ.get("ZYRA_OWNER_ZID", "")',
              '                    clave_o = os.environ.get("ZYRA_CLAVE_DUENO", "")',
              '                    if owner and z == owner and clave_o and c == clave_o:',
              '                        aprobado = True',
              '                    elif not owner or not clave_o:',
              '                        motivo = "Servidor sin credenciales de propietario configuradas"',
              '                    else:',
              '                        motivo = "ZID o clave no autorizados. Inicia sesion en la SuperApp."',
              '                if aprobado:',
              '                    self._send_json(200, {"aprobado": True, "rol": "comprador"})',
              '                else:',
              '                    self._send_json(200, {"aprobado": False, "error": motivo})',
              '            except Exception as exc:',
              '                self._send_json(200, {"aprobado": False, "error": "ERR: " + repr(exc)[:200]})',
              '            return',
              '',
              ])
              p = t0.find(A_DOPOST)
              fin = p + len(A_DOPOST) + 1
              t0 = t0[:fin] + HANDLER + t0[fin:]
              add('- manejador insertado al inicio de do_POST.')
              gate('insercion', True)
          SB.write_text(t0, encoding='utf-8')
          add('')
          add('## M2. Verificacion: la ruta ahora SI existe')
          add('')
          n2 = t0.count(RUTA)
          add('- veces que aparece: %d (debe ser 1)' % n2)
          gate('ruta_presente', n2 == 1)
          add('')
          add('## M3. Compilacion')
          add('')
          try:
              py_compile.compile(str(SB), doraise=True)
              gate('compila', True)
              add('- OK')
          except Exception as e:
              gate('compila', False)
              add('- FALLO: %s' % e)
          add('')
          add('## M4. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zs2m', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/ss2m', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          tv = time.time()
          while time.time() - tv < 40:
              if proc.poll() is not None:
                  break
              st, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              tv = time.time()
              while time.time() - tv < 70:
                  if sp.poll() is not None:
                      break
                  st, _b = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s' % (vivo, spv))
          if spv:
              st, b = pedir(BSP + '/subastas/')
              gate('pantalla', st == 200 and 'Verificando tus permisos' in b)
              st, b = pedir(BSP + '/subastas/permiso',
                            data=json.dumps({'zid': 'Z-DUENO-CI', 'clave': 'clave-ci-9999'}).encode())
              try:
                  aprob = json.loads(b).get('aprobado') is True
              except Exception:
                  aprob = False
              add('- permiso dueno -> APROBADO: %s' % aprob)
              gate('permiso_ok', aprob)
              st, b = pedir(BSP + '/subastas/permiso',
                            data=json.dumps({'zid': 'FALSO', 'clave': 'x'}).encode())
              try:
                  deneg = json.loads(b).get('aprobado') is False
              except Exception:
                  deneg = False
              add('- permiso falso -> denegado: %s' % deneg)
              gate('permiso_denegado', deneg)
          else:
              for g in ('pantalla', 'permiso_ok', 'permiso_denegado'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**S2m VERIFICADO. Commit. SUBASTAS CERRADO.**')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('s2m.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('S2m terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/subastas/server.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(S2m): ruta /subastas/permiso real con aprobado por sesion"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
