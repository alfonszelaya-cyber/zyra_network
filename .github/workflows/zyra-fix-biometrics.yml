      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AGRO RUN C: GPT-1/2 perfil, unidades, documentos, planes" -m "Perfil actualizable, unidades productivas validadas, documentos con sha256 + verificacion de gobierno, planificacion con etapas en orden estricto (planned->planted->growing->harvested) con trazabilidad, incidencias con resolucion, reporte de rendimiento planificado vs producido; matriz y guard ampliadas; 2 tests nuevos en archivo existente."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
