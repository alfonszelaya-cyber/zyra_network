name: "ZYRA AUDIT RED: nexo axis semilla agro subastas + conexiones (solo lectura)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5

      - name: "[LECTURA] Auditoria red de 5 apps"
        run: |
          python3 << 'PYEOF'
          import ast, os, pathlib, re
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def info_py(p):
              d = {"path": str(p), "size": 0, "state": "code",
                   "classes": [], "funcs": []}
              try:
                  d["size"] = p.stat().st_size
                  src = p.read_text(encoding="utf-8",
                                    errors="replace")
              except Exception:
                  d["state"] = "unreadable"
                  return d
              if len(src.strip()) <= 1:
                  d["state"] = "empty"
                  return d
              try:
                  tree = ast.parse(src)
              except Exception:
                  d["state"] = "syntax_error"
                  return d
              for n in ast.walk(tree):
                  if isinstance(n, ast.ClassDef):
                      d["classes"].append(n.name)
                  elif isinstance(n, (ast.FunctionDef,
                                      ast.AsyncFunctionDef)):
                      d["funcs"].append(n.name)
              return d

          APPS = ("nexo", "axis", "semilla", "agro", "subastas")
          resumen = {}

          for app in APPS:
              base = pathlib.Path("apps") / app
              out("")
              out("# ================= " + app.upper()
                  + " =================")
              if not base.exists():
                  out("- NO EXISTE apps/" + app)
                  resumen[app] = {"codigo": 0, "vacios": 0,
                                  "tests": 0, "server": "NO"}
                  continue
              llenos = []
              vacios = 0
              rotos = 0
              for f in sorted(base.rglob("*.py")):
                  d = info_py(f)
                  if d["state"] == "code":
                      llenos.append(d)
                  elif d["state"] == "empty":
                      vacios = vacios + 1
                  elif d["state"] == "syntax_error":
                      rotos = rotos + 1
              out("- codigo: " + str(len(llenos)) + " | vacios: "
                  + str(vacios) + " | syntax_error: "
                  + str(rotos))

              out("## Dominios")
              dom = base / "domain"
              if dom.exists():
                  for carp in sorted(dom.iterdir()):
                      if not carp.is_dir():
                          continue
                      files = [info_py(f) for f in
                               sorted(carp.rglob("*.py"))]
                      con = [f for f in files
                             if f["state"] == "code"]
                      sin = len([f for f in files
                                 if f["state"] == "empty"])
                      clases = []
                      for f in con:
                          clases.extend(f["classes"])
                      out("- **" + carp.name + "**: "
                          + ("LLENO" if con else "VACIO")
                          + " (llenos=" + str(len(con))
                          + " vacios=" + str(sin) + ")"
                          + (" | " + ", ".join(clases[:8])
                             if clases else ""))

              out("## Services/gateways/runtime")
              for sub in ("services", "infrastructure"):
                  sv = base / sub
                  if not sv.exists():
                      continue
                  for f in sorted(sv.rglob("*.py")):
                      d = info_py(f)
                      rel = str(f.relative_to(base))
                      if d["state"] == "empty":
                          out("- vacio: " + rel)
                      elif (d["classes"] or "gateway" in f.name
                            or "runtime" in f.name
                            or "boot" in f.name
                            or "startup" in f.name
                            or "bridge" in f.name
                            or "link" in f.name
                            or "bus" in f.name):
                          out("- **" + rel + "** (" + str(d["size"])
                              + "b, clases="
                              + str(len(d["classes"])) + ")")

              out("## Server y rutas")
              svp = base / "server.py"
              tiene_server = "NO"
              if svp.exists():
                  tiene_server = "SI"
                  txt = svp.read_text(encoding="utf-8",
                                      errors="replace")
                  rutas = sorted(set(re.findall(
                      r'[\'"](/[\w\-/\{\}\.:]+)[\'"]', txt)))
                  menus = "/menus" in " ".join(rutas)
                  out("- server.py " + str(svp.stat().st_size)
                      + "b — " + str(len(rutas)) + " rutas"
                      + (" — INCLUYE /menus" if menus else ""))
                  for r in rutas[:25]:
                      out("    - " + r)
              resumen[app] = {"codigo": len(llenos),
                              "vacios": vacios,
                              "server": tiene_server}

              out("## Conexion a la Red ZYRA")
              for pat in ("network_client", "NetworkClient",
                          "_link", "Link(", "ZYRA_URL",
                          "identity/register", "trust/complete",
                          "history/append", "documents/seal",
                          "verification/credentials",
                          "record_milestone", "outbox",
                          "Outbox", "record_reputation"):
                  count = 0
                  ejemplos = []
                  for f in sorted(base.rglob("*.py")):
                      try:
                          txt = f.read_text(encoding="utf-8",
                                            errors="replace")
                      except Exception:
                          continue
                      if pat in txt:
                          count = count + 1
                          if len(ejemplos) < 2:
                              ejemplos.append(
                                  str(f.relative_to(base)))
                  if count > 0:
                      out("- **" + pat + "**: " + str(count)
                          + " archivos (" + ", ".join(ejemplos)
                          + ")")

              out("## Conexiones a OTRAS apps (punto a punto)")
              for otra in APPS:
                  if otra == app:
                      continue
                  count = 0
                  ejemplos = []
                  for f in sorted(base.rglob("*.py")):
                      try:
                          txt = f.read_text(encoding="utf-8",
                                            errors="replace")
                      except Exception:
                          continue
                      if ("apps." + otra) in txt or (
                              "/" + otra) in txt:
                          count = count + 1
                          if len(ejemplos) < 2:
                              ejemplos.append(
                                  str(f.relative_to(base)))
                  if count > 0:
                      out("- **hacia " + otra + "**: "
                          + str(count) + " archivos ("
                          + ", ".join(ejemplos) + ")")

              out("## Tests")
              tdir = base / "tests"
              total = 0
              vacios_t = 0
              if tdir.exists():
                  for f in sorted(tdir.rglob("test_*.py")):
                      d = info_py(f)
                      nt = sum(1 for x in d["funcs"]
                               if x.startswith("test"))
                      total = total + nt
                      if d["state"] == "empty":
                          vacios_t = vacios_t + 1
                          out("- vacio: " + f.name)
                      else:
                          out("- **" + f.name + "**: " + str(nt)
                              + " tests")
                  out("- **TOTAL: " + str(total) + " tests | "
                      + str(vacios_t) + " archivos vacios**")

              out("## Deuda tecnica")
              utc_count = 0
              menus_vacios = 0
              for f in sorted(base.rglob("*.py")):
                  try:
                      txt = f.read_text(encoding="utf-8",
                                        errors="replace")
                  except Exception:
                      continue
                  if "datetime.utcnow()" in txt:
                      utc_count = utc_count + 1
                  if f.name == "menu.py" and len(txt.strip()) <= 1:
                      menus_vacios = menus_vacios + 1
              out("- datetime.utcnow() deprecated: "
                  + str(utc_count) + " archivos")
              out("- menu.py vacios: " + str(menus_vacios))
              evs = set()
              pref = app.upper()
              for f in sorted(base.rglob("*.py")):
                  try:
                      txt = f.read_text(encoding="utf-8",
                                        errors="replace")
                  except Exception:
                      continue
                  for m in re.findall(pref + r"_[A-Z_]+", txt):
                      evs.add(m)
              out("- eventos " + pref + "_*: " + str(len(evs)))

          out("")
          out("# ================ SUPERAPP / RUNTIME GLOBAL ================")
          for target in ("superapp.py", "main.py"):
              p = pathlib.Path(target)
              out("## " + target)
              if not p.exists():
                  out("- NO EXISTE")
                  continue
              try:
                  tree = ast.parse(p.read_text(encoding="utf-8",
                                               errors="replace"))
                  for node in tree.body:
                      if isinstance(node, ast.ClassDef):
                          ms = [n.name for n in node.body
                                if isinstance(n, (ast.FunctionDef,
                                                  ast.AsyncFunctionDef))]
                          out("- **class " + node.name + "**: "
                              + ", ".join(ms[:20]))
                      elif isinstance(node, (ast.FunctionDef,
                                             ast.AsyncFunctionDef)):
                          out("- def " + node.name)
              except Exception as e:
                  out("- ERROR parse: " + str(e)[:120])
          rt = pathlib.Path("shared_engines/runtime")
          if rt.exists():
              out("## shared_engines/runtime (server global)")
              for f in sorted(rt.rglob("*.py")):
                  d = info_py(f)
                  if d["state"] == "code" and d["classes"]:
                      out("- **" + f.name + "**: "
                          + ", ".join(d["classes"][:8]))

          out("")
          out("# ================ SHARED ENGINES USO POR APP ================")
          for app in APPS:
              base = pathlib.Path("apps") / app
              if not base.exists():
                  continue
              uso = {}
              for f in sorted(base.rglob("*.py")):
                  d = info_py(f)
                  if d["state"] != "code":
                      continue
                  try:
                      txt = f.read_text(encoding="utf-8",
                                        errors="replace")
                  except Exception:
                      continue
                  for m in re.findall(
                          r"shared_engines\.(\w+)", txt):
                      uso[m] = uso.get(m, 0) + 1
              out("- **" + app + "**: " + (", ".join(
                  k + "(" + str(v) + ")"
                  for k, v in sorted(uso.items())) or "ninguno"))

          out("")
          out("# ================ RESUMEN FINAL ================")
          out("| App | Codigo | Vacios | Server |")
          out("|---|---|---|---|---|")
          for app in APPS:
              r = resumen.get(app, {})
              out("| " + app + " | " + str(r.get("codigo", 0))
                  + " | " + str(r.get("vacios", 0)) + " | "
                  + str(r.get("server", "NO")) + " |")
          out("")
          out("--- FIN AUDITORIA RED 5 APPS (solo lectura) ---")
          PYEOF
          echo "AUDITORIA COMPLETA"
          exit 0
