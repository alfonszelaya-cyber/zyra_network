name: "ZYRA LAB - parche final (3 fixes, verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parche:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Aplicar los 3 parches
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          # Fix 1: index de buffer gris en el encoder (bug real, 1 linea)
          ruta = Path("apps/laboratorio/infrastructure/providers/video_encoder.py")
          t = ruta.read_text(encoding="utf-8")
          viejo = "                              i = (sy * ancho + sx) * 3\n"
          nuevo = "                              i = sy * ancho + sx\n"
          if viejo in t:
              t = t.replace(viejo, nuevo, 1)
              print("fix encoder: indice gris corregido")
          elif "i = sy * ancho + sx" in t:
              print("fix encoder ya presente")
          else:
              raise SystemExit("FATAL: linea no encontrada en video_encoder")
          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")

          # Fix 2 y 3: en el test (_frame correcto + header assert)
          rt = Path("apps/laboratorio/tests/test_video_impresion.py")
          tt = rt.read_text(encoding="utf-8")
          viejo_f = "return encode_png_rgb(32, 32, bytes(color * (32 * 32 * 3)))"
          nuevo_f = "return encode_png_rgb(32, 32, bytes(bytes(color) * (32 * 32 * 3)))"
          if viejo_f in tt:
              tt = tt.replace(viejo_f, nuevo_f, 1)
              print("fix test: _frame correcto")
          elif "bytes(bytes(color)" in tt:
              print("fix test _frame ya presente")
          else:
              raise SystemExit("FATAL: _frame no encontrado")

          viejo_h = 'assert stl[:21] == b"ZYRA LABORATORIO STL e"'
          nuevo_h = 'assert stl[:21] == b"ZYRA LABORATORIO STL "'
          if viejo_h in tt:
              tt = tt.replace(viejo_h, nuevo_h, 1)
              print("fix test: header STL ajustado")
          elif 'stl[:21] == b"ZYRA LABORATORIO STL "' in tt:
              print("fix header ya presente")
          else:
              raise SystemExit("FATAL: assert header no encontrado")

          ast.parse(tt)
          rt.write_text(tt, encoding="utf-8")
          print("todos los parches OK")
          PYEOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - parche final"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "LABORATORIO CERRADO: fix indice gris del encoder + tests (80/80)"
            git push
          fi
