      - name: "Paso 7e - sonda IN-PROC de ingesta (logica + serializacion, sin HTTP)"
        run: |
          python3 - <<'PROBEOF' || true
          import base64, json, threading, time, traceback
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import (
              FrozenClock, SystemClock)
          from shared_engines.runtime.config import (
              RuntimeConfig)
          from shared_engines.runtime.kernel import (
              ZyraKernel)
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities)
          from shared_engines.runtime.combined_api import (
              serve_combined)
          from shared_engines.verification.signatures import (
              Ed25519Signer)
          from shared_engines.security.biometrics import (
              BiometricsEngine, BiometricsPolicy,
              DeterministicTestProvider, TemplateCipher)
          from apps.axis.infrastructure.persistence.axis_store import (
              AxisStore)
          from apps.axis.infrastructure.network.network_client import (
              NetworkClient)
          from apps.axis.life_history.integration import (
              build_life_history)
          from apps.axis.services.axis_link import AxisLink

          resultado = {}

          def _run():
              try:
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db, clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1", port=0,
                          api_token=None))
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(
                      db=net_db, clock=FrozenClock(),
                      audit=kernel.audit,
                      provider=DeterministicTestProvider(),
                      cipher=TemplateCipher(
                          master_key_hex="ab" * 32),
                      policy=BiometricsPolicy(
                          require_liveness=False,
                          doc_reject=0.01,
                          doc_review=0.02,
                          doc_auto=0.03,
                          dup_reject=0.98))
                  caps = ZyraCapabilities(
                      net_db, FrozenClock(),
                      identity=kernel.identity,
                      signer=signer)
                  net_srv = serve_combined(
                      kernel, caps,
                      host="127.0.0.1", port=0)
                  threading.Thread(
                      target=net_srv.serve_forever,
                      daemon=True).start()
                  time.sleep(0.4)
                  net_base = ("http://127.0.0.1:"
                      + str(
                          net_srv.server_address[1]))
                  client = NetworkClient(
                      net_base, timeout_seconds=10,
                      max_retries=1)
                  assert AxisLink(
                      client).register_app()[
                      0] is True
                  seed = base64.b64encode(
                      b"axis-bio-madre-gov"
                      ).decode("ascii")
                  ok_m, data_m, err_m = client.post(
                      "/identity/enroll",
                      {"kind": "person",
                       "display_name": "Madre Gov",
                       "actor": "axis",
                       "doc_image_b64": seed,
                       "selfie_image_b64": seed})
                  assert ok_m, str(err_m)
                  zid_madre = (
                      ((data_m or {}).get("identity")
                       or {}).get("zid"))
                  ok_t, _td, err_t = client.post(
                      "/identity/transition",
                      {"zid": zid_madre,
                       "to_status": "ACTIVE",
                       "actor": "axis",
                       "reason": "onboarding"})
                  assert ok_t, str(err_t)
                  store = AxisStore(
                      SQLiteAdapter(":memory:"),
                      SystemClock())
                  life = build_life_history(
                      db=store._db,
                      clock=SystemClock(),
                      network_client=client)
                  res = life.register_birth_with_network(
                      registrar_account="AX-gob-x",
                      child_name="Bebe Sonda",
                      birth_date="2025-09-03",
                      birth_place="SS",
                      sex="F",
                      mother_name="Madre Gov",
                      mother_zid=zid_madre,
                      source_hospital="ministerio-salud")
                  resultado["logica"] = "OK"
                  resultado["claves"] = sorted(
                      str(k) for k in res.keys())
                  try:
                      json.dumps(res)
                      resultado["json"] = (
                          "serializa sin default=str")
                  except TypeError as te:
                      json.dumps(res, default=str)
                      resultado["json"] = (
                          "NECESITA default=str"
                          " -> " + str(te))
              except Exception as exc:
                  resultado["error"] = (
                      type(exc).__name__ + ": "
                      + str(exc))
                  import io as _io
                  buf = _io.StringIO()
                  traceback.print_exc(file=buf)
                  resultado["traceback"] = (
                      buf.getvalue()[-2500:])

          th = threading.Thread(
              target=_run, daemon=True)
          th.start()
          th.join(timeout=45)
          if th.is_alive():
              print("SONDA: colgada 45s")
              raise SystemExit(1)
          print("SONDA RESULTADO: "
                + json.dumps(resultado,
                    indent=2, default=str))
          if resultado.get("logica") == "OK":
              print("OK sonda: logica de ingesta"
                    " funciona")
          PROBEOF

