name: "ZYRA FIX v6: enroll biometrico alineado + subastas/mpe verdes"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-fix-biometrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 0 - Diagnostico: radar_motor + handlers clave + usos de identity/register"
        run: |
          python3 - <<'DUMPEOF'
          import glob
          from pathlib import Path

          SKIP = {".git", "__pycache__", ".venv", "venv", "node_modules"}

          def dump_file(path, tag):
              p = Path(path)
              if not p.exists():
                  print(f"--- {tag}: {path} NO EXISTE ---")
                  return
              lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
              print(f"===== {tag}: {path} ({len(lines)} lineas) =====")
              for i, l in enumerate(lines, 1):
                  print(f"{i:4d}| {l}")

          cand = None
          c = glob.glob("apps/subastas/modules/motores/radar_motor.py")
          if c:
              cand = c[0]
          if not cand:
              for p in Path("apps").rglob("radar_motor.py"):
                  if not any(x in p.parts for x in SKIP):
                      cand = str(p)
                      break
          if cand:
              dump_file(cand, "RADAR_MOTOR COMPLETO (para corregir crash)")
          else:
              print("radar_motor.py NO EXISTE")

          sp = Path("apps/semilla/server.py")
          if sp.exists():
              t = sp.read_text(encoding="utf-8", errors="ignore")
              i = t.find('"/semilla/register"')
              if i < 0:
                  i = t.find("semilla/register")
              if i >= 0:
                  print("===== SEMILLA server.py (region handler register) =====")
                  print(t[max(0, i - 2500): i + 5000])
              else:
                  print("SEMILLA: '/semilla/register' no aparece en server.py")
          else:
              print("apps/semilla/server.py NO EXISTE")

          cp = Path("shared_engines/runtime/capabilities_api.py")
          if cp.exists():
              t = cp.read_text(encoding="utf-8", errors="ignore")
              for key in ("reputation/record", "history/append", "trust/complete"):
                  i = t.find(key)
                  if i >= 0:
                      print(f"===== CAPS region {key} =====")
                      print(t[max(0, i - 800): i + 2200])
          else:
              print("capabilities_api.py NO EXISTE en runtime")

          print("===== USOS DE /identity/register EN TODAS LAS APPS =====")
          for p in Path("apps").rglob("*.py"):
              if any(x in p.parts for x in SKIP):
                  continue
              try:
                  t = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if '"/identity/register"' in t or "'/identity/register'" in t:
                  print(f"--- {p} ---")
                  lines = t.splitlines()
                  for n, l in enumerate(lines, 1):
                      if "/identity/register" in l:
                          a = max(0, n - 6)
                          b = min(len(lines), n + 6)
                          for k in range(a, b):
                              print(f"{k+1:4d}| {lines[k]}")
                          print("     ...")
          DUMPEOF

      - name: "Paso 1 - fix buy() bolsa con regex robusto (idempotente)"
        run: |
          python3 - <<'PYEOF'
          import re as _re
          import sys
          from pathlib import Path
          import glob
          cands = glob.glob("apps/subastas/modules/005*/bolsa_store.py")
          if not cands:
              cands = glob.glob("apps/subastas/**/bolsa_store.py", recursive=True)
          if not cands:
              cands = glob.glob("**/bolsa_store.py", recursive=True)
          if not cands:
              print("SKIP: bolsa_store.py no encontrado. Se continua.")
              raise SystemExit(0)
          if len(cands) > 1:
              preferidos = []
              for c in cands:
                  try:
                      if "deposit(account, 0)" in Path(c).read_text(encoding="utf-8", errors="ignore"):
                          preferidos.append(c)
                  except Exception:
                      pass
              if preferidos:
                  cands = preferidos
          print("CANDIDATOS:", cands)
          P = Path(cands[0])
          txt = P.read_text(encoding="utf-8")
          pat = _re.compile(r"self\._car\.deposit\(account,\s*0\)")
          if not pat.search(txt):
              print("SKIP: ya sin deposit(0)")
          else:
              lines = txt.splitlines(keepends=True)
              out = []
              for l in lines:
                  if pat.search(l):
                      print("REMOVED: deposit(0) line:", l.strip())
                      continue
                  out.append(l)
              txt = "".join(out)
          try:
              compile(txt, str(P), "exec")
          except SyntaxError as e:
              print("COMPILE-FAIL:", e.msg, e.lineno)
              sys.exit(1)
          P.write_text(txt, encoding="utf-8")
          print("WROTE", P)
          PYEOF

      - name: "Paso 2 - fix docker-compose: ZYRA_PORT=8000 (conexion con main.py)"
        run: |
          python3 - <<'COMPEOF'
          import re
          from pathlib import Path
          p = Path("docker/docker-compose.yml")
          if not p.exists():
              print("SKIP docker-compose.yml no existe")
          else:
              t = p.read_text(encoding="utf-8")
              if "ZYRA_PORT" in t:
                  print("SKIP ZYRA_PORT ya presente")
              else:
                  new, n = re.subn(
                      r"( *)- NETWORK_PORT=8000\n",
                      r"\1- NETWORK_PORT=8000\n\1- ZYRA_PORT=8000\n",
                      t, count=1)
                  if n != 1:
                      print("MISS ancla NETWORK_PORT no encontrada")
                  else:
                      p.write_text(new, encoding="utf-8")
                      print("OK ZYRA_PORT=8000 anadido a docker-compose")
          COMPEOF

      - name: "Paso 3 - parches: ley de identidad + revision + tests biometricos"
        run: |
          python3 - <<'PATCHEOF'
          import re
          from pathlib import Path

          REPORT = []

          def patch(name, path, fn):
              p = Path(path)
              if not p.exists():
                  REPORT.append(f"MISS  {name} ({path} no existe)")
                  return
              txt = p.read_text(encoding="utf-8")
              try:
                  res = fn(txt)
              except Exception as exc:
                  REPORT.append(f"MISS  {name} ({exc})")
                  return
              if res is None:
                  REPORT.append(f"SKIP  {name} (ya aplicado)")
                  return
              try:
                  compile(res, path, "exec")
              except SyntaxError as exc:
                  REPORT.append(f"FAIL  {name} (syntax linea {exc.lineno}: {exc.msg})")
                  return
              p.write_text(res, encoding="utf-8")
              REPORT.append(f"OK    {name}")

          WIRE = (
              "        from shared_engines.security.biometrics import (\n"
              "            BiometricsEngine,\n"
              "            BiometricsPolicy,\n"
              "            DeterministicTestProvider,\n"
              "            TemplateCipher,\n"
              "        )\n"
              "        self.kernel._biometrics = BiometricsEngine(\n"
              "            db=self.net_db,\n"
              "            clock=FrozenClock(),\n"
              "            audit=self.kernel.audit,\n"
              "            provider=DeterministicTestProvider(),\n"
              "            cipher=TemplateCipher(\n"
              "                master_key_hex=\"ab\" * 32\n"
              "            ),\n"
              "            policy=BiometricsPolicy(\n"
              "                require_liveness=False,\n"
              "                doc_reject=0.0,\n"
              "                doc_review=0.05,\n"
              "                doc_auto=0.10,\n"
              "                dup_reject=0.98,\n"
              "            ),\n"
              "        )\n"
          )

          def wire_apply(txt):
              anchor = "        self.kernel.bootstrap_root()\n"
              if anchor not in txt:
                  raise ValueError("ancla bootstrap_root no encontrada")
              return txt.replace(anchor, anchor + WIRE, 1)

          # ---------- A: texto de revision de SUBASTAS (busca en toda la app) ----------
          def fix_revision_any():
              hits = []
              base = Path("apps/subastas")
              if not base.exists():
                  return hits
              for p in base.rglob("*.py"):
                  if "__pycache__" in p.parts:
                      continue
                  try:
                      t = p.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  if "Revision ZYRA MARKET" in t:
                      new = t.replace("Revision ZYRA MARKET", "Revision SUBASTAS")
                      compile(new, str(p), "exec")
                      p.write_text(new, encoding="utf-8")
                      hits.append(str(p))
                  elif "Revision SUBASTAS" in t:
                      hits.append(str(p) + " (ya)")
              return hits

          try:
              hits = fix_revision_any()
              if hits:
                  REPORT.append("OK    A revision-text -> " + ", ".join(hits))
              else:
                  REPORT.append("MISS  A revision-text (texto no encontrado en apps/subastas)")
          except Exception as exc:
              REPORT.append(f"FAIL  A revision-text ({exc})")

          # ---------- B: subastas_link.register_account -> /identity/enroll ----------
          NEW_REGISTER = (
              "    def register_account(\n"
              "        self, name: str,\n"
              "        *,\n"
              "        doc_image_b64: str | None = None,\n"
              "        selfie_image_b64: str | None = None,\n"
              "    ) -> tuple[bool, dict | None]:\n"
              "        \"\"\"LAW: a person is born ONLY via /identity/enroll\n"
              "        (document + selfie). The legacy /identity/register\n"
              "        door refuses persons, so it is never attempted.\"\"\"\n"
              "        if not doc_image_b64 or not selfie_image_b64:\n"
              "            return (\n"
              "                False,\n"
              "                {\n"
              "                    \"error\": \"biometria_requerida\",\n"
              "                    \"message\": (\n"
              "                        \"registro de persona requiere\"\n"
              "                        \" documento y selfie\"\n"
              "                    ),\n"
              "                },\n"
              "            )\n"
              "        payloads = (\n"
              "            {\n"
              "                \"kind\": \"person\",\n"
              "                \"display_name\": name,\n"
              "                \"actor\": \"subastas\",\n"
              "                \"doc_image_b64\": doc_image_b64,\n"
              "                \"selfie_image_b64\": selfie_image_b64,\n"
              "            },\n"
              "            {\n"
              "                \"kind\": \"person\",\n"
              "                \"display_name\": name,\n"
              "                \"doc_image_b64\": doc_image_b64,\n"
              "                \"selfie_image_b64\": selfie_image_b64,\n"
              "            },\n"
              "        )\n"
              "        for payload in payloads:\n"
              "            ok, data, _err = (\n"
              "                self._client.post(\n"
              "                    \"/identity/enroll\",\n"
              "                    payload,\n"
              "                )\n"
              "            )\n"
              "            if ok and data:\n"
              "                zid = _find_value(\n"
              "                    data, (\"zid\",)\n"
              "                )\n"
              "                if isinstance(\n"
              "                    zid, str\n"
              "                ) and zid.startswith(\n"
              "                    \"ZID-\"\n"
              "                ):\n"
              "                    return (\n"
              "                        True,\n"
              "                        {\"zid\": zid},\n"
              "                    )\n"
              "        return (\n"
              "            False,\n"
              "            None,\n"
              "        )\n\n"
          )

          def fix_link(txt):
              start = txt.find("    def register_account(")
              if start < 0:
                  raise ValueError("register_account no encontrado")
              end = txt.find("    def give_reputation(")
              if end < 0 or end <= start:
                  raise ValueError("give_reputation no encontrado")
              seg = txt[start:end]
              if '"/identity/enroll"' in seg:
                  return None
              return txt[:start] + NEW_REGISTER + txt[end:]

          patch("B subastas-link-enroll", "apps/subastas/services/subastas_link.py", fix_link)

          # ---------- C: test_subastas_e2e con flujo biometrico real ----------
          def fix_sbs_e2e(txt):
              if "_b64t" not in txt:
                  txt = "import base64 as _b64t\n" + txt
              if "DeterministicTestProvider" not in txt:
                  txt = wire_apply(txt)
              pat = r"reg_s = eco\.link\.register_account\(\s*\"Vendedor Uno\"\s*\)"
              repl = (
                  "reg_s = eco.link.register_account(\n"
                  "            \"Vendedor Uno\",\n"
                  "            doc_image_b64=_b64t.b64encode(\n"
                  "                b\"zyra-identity-Vendedor Uno\"\n"
                  "            ).decode(\"ascii\"),\n"
                  "            selfie_image_b64=_b64t.b64encode(\n"
                  "                b\"zyra-identity-Vendedor Uno\"\n"
                  "            ).decode(\"ascii\"),\n"
                  "        )"
              )
              txt, n = re.subn(pat, repl, txt, count=1)
              if n != 1 and "doc_image_b64=_b64t" in txt:
                  return txt
              if n != 1:
                  raise ValueError("llamada register_account no encontrada")
              return txt

          patch("C test-subastas-e2e", "apps/subastas/tests/test_subastas_e2e.py", fix_sbs_e2e)

          # ---------- D: cuentas con ZID real antes de reputacion ----------
          NEW_ACCOUNTS = (
              "def _accounts(eco) -> None:\n"
              "    \"\"\"Cuentas CON ZID real antes de reputacion e\n"
              "    historial (ley de la red). El ZID nace del\n"
              "    enrollment biometrico de la super-app; aqui se\n"
              "    emite por el kernel y se vincula igual que en\n"
              "    produccion.\"\"\"\n"
              "    from shared_engines.identity.contracts import IdentityKind\n"
              "    z_sell = eco.kernel.identity.register_identity(\n"
              "        kind=IdentityKind.PERSON,\n"
              "        display_name=\"Vendedor Uno\",\n"
              "        actor=\"test-super-app\",\n"
              "    )\n"
              "    z_buy = eco.kernel.identity.register_identity(\n"
              "        kind=IdentityKind.PERSON,\n"
              "        display_name=\"Comprador Uno\",\n"
              "        actor=\"test-super-app\",\n"
              "    )\n"
              "    eco.store.add_account(\n"
              "        account_id=\"SBS-seller01\", zid=z_sell.zid, name=\"Vendedor Uno\"\n"
              "    )\n"
              "    eco.store.add_account(\n"
              "        account_id=\"SBS-buyer001\", zid=z_buy.zid, name=\"Comprador Uno\"\n"
              "    )"
          )

          def fix_accounts(txt):
              if "zid=z_sell.zid" in txt:
                  return None
              pat = r"def _accounts\(eco\) -> None:.*?name=\"Comprador Uno\"\n\s*\)"
              new, n = re.subn(pat, NEW_ACCOUNTS, txt, count=1, flags=re.S)
              if n != 1:
                  raise ValueError("_accounts no encontrada")
              return new

          patch("D test-commerce-zid", "apps/subastas/tests/test_subastas_commerce_e2e.py", fix_accounts)

          # ---------- E: test_mpe_e2e con doc+selfie ----------
          def fix_mpe_e2e(txt):
              if "_b64t" not in txt:
                  txt = "import base64 as _b64t\n" + txt
              if "DeterministicTestProvider" not in txt:
                  txt = wire_apply(txt)
              pat = (
                  r"\{\s*\"role\": \"trabajador\",\s*"
                  r"\"name\": \"Pedro Albanil\",\s*"
                  r"\"profession\": \"albanil\",\s*\}"
              )
              repl = (
                  "{\n"
                  "                \"role\": \"trabajador\",\n"
                  "                \"name\": \"Pedro Albanil\",\n"
                  "                \"profession\": \"albanil\",\n"
                  "                \"doc_image_b64\": _b64t.b64encode(\n"
                  "                    b\"zyra-identity-Pedro Albanil\"\n"
                  "                ).decode(\"ascii\"),\n"
                  "                \"selfie_image_b64\": _b64t.b64encode(\n"
                  "                    b\"zyra-identity-Pedro Albanil\"\n"
                  "                ).decode(\"ascii\"),\n"
                  "            }"
              )
              txt, n = re.subn(pat, repl, txt, count=1)
              if n != 1 and "zyra-identity-Pedro" in txt:
                  return txt
              if n != 1:
                  raise ValueError("registro de trabajador no encontrado")
              return txt

          patch("E test-mpe-e2e", "apps/mi_primer_empleo/tests/test_mpe_e2e.py", fix_mpe_e2e)

          # ---------- F: test_mpe_hiring_e2e con doc+selfie por trabajador ----------
          def fix_mpe_hiring(txt):
              if "_b64t" not in txt:
                  txt = "import base64 as _b64t\n" + txt
              if "DeterministicTestProvider" not in txt:
                  txt = wire_apply(txt)
              pat = (
                  r"\"name\": \"Albanil \"\s*\n\s*\+\s*str\(index\),\s*\n"
                  r"\s*\"profession\":\s*\n\s*\"albanil\","
              )
              repl = (
                  "\"name\": \"Albanil \"\n"
                  "                    + str(index),\n"
                  "                    \"profession\":\n"
                  "                    \"albanil\",\n"
                  "                    \"doc_image_b64\": _b64t.b64encode(\n"
                  "                        b\"zyra-identity-Albanil-\"\n"
                  "                        + str(index).encode(\"utf-8\")\n"
                  "                    ).decode(\"ascii\"),\n"
                  "                    \"selfie_image_b64\": _b64t.b64encode(\n"
                  "                        b\"zyra-identity-Albanil-\"\n"
                  "                        + str(index).encode(\"utf-8\")\n"
                  "                    ).decode(\"ascii\"),"
              )
              txt, n = re.subn(pat, repl, txt, count=1)
              if n != 1 and "zyra-identity-Albanil-" in txt:
                  return txt
              if n != 1:
                  raise ValueError("loop de trabajadores no encontrado")
              return txt

          patch("F test-mpe-hiring", "apps/mi_primer_empleo/tests/test_mpe_hiring_e2e.py", fix_mpe_hiring)

          # ---------- G: test_semilla_tutor_e2e con doc+selfie ----------
          def fix_semilla(txt):
              if "_b64t" not in txt:
                  txt = "import base64 as _b64t\n" + txt
              if "DeterministicTestProvider" not in txt:
                  txt = wire_apply(txt)
              pat = (
                  r"\{\s*\"role\": role,\s*\"name\": name,\s*"
                  r"\"school\": \"Escuela Central\",\s*\"grade\": \"primaria\",\s*\}"
              )
              repl = (
                  "{\n"
                  "            \"role\": role,\n"
                  "            \"name\": name,\n"
                  "            \"school\": \"Escuela Central\",\n"
                  "            \"grade\": \"primaria\",\n"
                  "            \"doc_image_b64\": _b64t.b64encode(\n"
                  "                b\"zyra-identity-\" + name.encode(\"utf-8\")\n"
                  "            ).decode(\"ascii\"),\n"
                  "            \"selfie_image_b64\": _b64t.b64encode(\n"
                  "                b\"zyra-identity-\" + name.encode(\"utf-8\")\n"
                  "            ).decode(\"ascii\"),\n"
                  "        }"
              )
              txt, n = re.subn(pat, repl, txt, count=1)
              if n != 1 and "zyra-identity-" in txt:
                  return txt
              if n != 1:
                  raise ValueError("payload de registro semilla no encontrado")
              return txt

          patch("G test-semilla-tutor", "apps/semilla/tests/test_semilla_tutor_e2e.py", fix_semilla)

          # ---------- H: mpe_link.register_user rechaza personas (ley) ----------
          def fix_mpe_link(txt):
              start = txt.find("    def register_user(")
              if start < 0:
                  raise ValueError("register_user no encontrado")
              end = txt.find("    def enroll_user(")
              if end < 0 or end <= start:
                  raise ValueError("enroll_user no encontrado")
              seg = txt[start:end]
              if "requiere biometria" in seg:
                  return None
              new_method = (
                  "    def register_user(\n"
                  "        self, display_name: str\n"
                  "    ) -> tuple[bool, dict | None, str | None]:\n"
                  "        \"\"\"LAW: person registration requires biometric\n"
                  "        enrollment. Legacy door is rejected here;\n"
                  "        use enroll_user with document + selfie.\"\"\"\n"
                  "        raise ValueError(\n"
                  "            \"registro de persona requiere biometria:\"\n"
                  "            \" use enroll_user con documento y selfie\"\n"
                  "        )\n\n"
              )
              return txt[:start] + new_method + txt[end:]

          patch("H mpe-link-ley", "apps/mi_primer_empleo/services/mpe_link.py", fix_mpe_link)

          print("")
          print("======== REPORTE DE PARCHES ========")
          for r in REPORT:
              print(r)
          print("====================================")
          PATCHEOF

      - name: "Paso 4 - GATE: pytest subastas + mpe (debe pasar para commitear)"
        run: |
          python3 -m pytest apps/subastas/tests apps/mi_primer_empleo/tests -q --tb=short

      - name: "Paso 5 - reporte semilla + agro (diagnostico, no bloquea)"
        if: always()
        run: |
          python3 -m pytest apps/semilla/tests apps/agro/tests -q --tb=short || true

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA FIX v6: enroll biometrico alineado" -m "subastas_link usa /identity/enroll (ley); tests subastas/mpe/semilla con doc+selfie y red de prueba con biometria; ZID real antes de reputacion; texto Revision SUBASTAS; mpe_link.register_user aplica la ley; ZYRA_PORT=8000 en docker-compose. Dump radar_motor y handlers para siguiente ronda."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
