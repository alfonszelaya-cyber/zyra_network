              assert status == 200
              texto = html.decode("utf-8")
              assert 'id="form-escena"' not in texto
              assert ">Crear<" not in texto

          def t_indice_publico():
              status, cuerpo, _, _ = llamada("GET", "/laboratorio")
              assert status == 200, "status=" + str(status)
              total = len(cuerpo["datos"]["rutas"])
              assert total == 31, "se esperaban 31 rutas, hay " + str(total)
              ids_modulos = {m["id"] for m in cuerpo["datos"]["modulos"]}
              assert ids_modulos == {"capture", "simulation", "understanding", "design", "creation", "library"}, str(ids_modulos)

          def t_motor_unitario():
              motor = MotorGeneracionReal()
              caps = motor.capacidades()
              assert "imagen" in caps["disponibles"] and "video_mp4" in caps["no_disponibles"]
              from apps.laboratorio.shared.models.identifiers import nuevo_id
              from apps.laboratorio.domain.scene import Escena3D
              escena = Escena3D(id=nuevo_id("scn"), proyecto_id=nuevo_id("proy"), nombre="t")
              escena.agregar_objeto({"forma": "rect", "color": "#111111", "x": 5, "y": 5, "w": 30, "h": 30})
              img = motor.generar(escena, "imagen")
              assert img.startswith(b"<?xml")
              try:
                  motor.generar(escena, "video_mp4")
                  raise AssertionError("video debia fallar")
              except ValueError:
                  pass

          def t_plantillas_completas():
              assert verificar_plantillas() == 9

          sum_write("")
          sum_write("### Pruebas end-to-end Fase 3 (Regla 6)")
          sum_write("")
          sum_write("| Resultado | Prueba |")
          sum_write("|---|---|")
          check("Migracion v3 + datos base", preparar)
          check("Crear escena 3D con 3 objetos", t_crear_escena)
          check("Escenas invalidas rechazadas (400)", t_escena_invalida)
          check("Generar imagen SVG real", t_generar_imagen)
          check("Generar pagina HTML real", t_generar_pagina)
          check("Generar modelo glTF-lite real", t_generar_modelo)
          check("Generar animacion SVG real", t_generar_animacion)
          check("Video MP4 honesto: rechaza con fase 6", t_video_honesto)
          check("Descargar artefactos (mime y escape)", t_descargar_artefactos)
          check("Listados + 403 a espectador", t_listados)
          check("Biblioteca: crear, hash, buscar", t_biblioteca)
          check("UI crear y biblioteca EN VIVO con Ley 3", t_ui_paneles_fase3)
          check("Espectador sin acceso a crear", t_ui_sin_acceso_otro)
          check("Indice publico: 31 rutas, 6 modulos", t_indice_publico)
          check("Motor unitario: capacidades honestas", t_motor_unitario)
          check("9 plantillas verificadas", t_plantillas_completas)

          for estado_p, nombre_p in resultados:
              sum_write("| " + estado_p + " | " + nombre_p + " |")
          sum_write("")
          if errores:
              sum_write("**RECHAZADO: " + str(errores) + " errores - NO SE PUBLICA NADA**")
              print("TOTAL ERRORES: " + str(errores) + " - NO SE PUBLICA NADA")
              sys.exit(1)
          total_pruebas = sum(1 for e, _ in resultados if e == "OK")
          sum_write("**APROBADO: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores - FASE 3 CERRADA**")
          print("VERIFICACION COMPLETA: " + str(len(objetivos)) + " archivos, " + str(total_pruebas) + "/" + str(len(resultados)) + " pruebas OK, 0 errores")
          ZYRA_CHECK
          echo "=== RESUMEN: Lote 3A aplicado y verificado ==="

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name "zyra-lab-bot"
          git config user.email "zyra-lab-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios: el lote ya estaba aplicado."
          else
            git commit -m "LABORATORIO Lote 3A - Fase 3 crear y biblioteca EN VIVO con generacion real"
            git push
          fi
