name: ZYRA Fase 6b red viva y contrato ZID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fase6b:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Base de dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pytest

      - name: Red viva, auth y contrato ZID
        run: |
          python3 - <<'PYEOF'
          import importlib.util, json, os, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}
          GATES = []
          PUERTO = 8765
          BASE = 'http://127.0.0.1:%d' % PUERTO
          ENV = dict(os.environ)
          ENV['ZYRA_ROOT_KEY'] = secrets.token_hex(32)
          ENV['ZYRA_API_TOKEN'] = 'e2e-token-' + secrets.token_hex(16)
          ENV['ZYRA_REQUIRE_TOKEN'] = '1'
          ENV['ZYRA_DATA_DIR'] = '/tmp/zyra-6b-data'
          ENV['ZYRA_PORT'] = str(PUERTO)
          ENV['PYTHONUNBUFFERED'] = '1'
          TOKEN = ENV['ZYRA_API_TOKEN']
          MOD_MAP = {'cv2': 'opencv-python-headless', 'onnx': 'onnxruntime',
                     'Crypto': 'pycryptodome', 'PIL': 'pillow'}

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('fase6b.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _manejador(tipo, valor, tb):
              add('')
              add('## ERROR INESPERADO')
              add('```')
              for l in traceback.format_exception(tipo, valor, tb):
                  add(l.rstrip())
              add('```')
              escribe()

          sys.excepthook = _manejador

          def gate(nombre, ok):
              GATES.append((nombre, bool(ok)))
              add('- gate %s: %s' % (nombre, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          add('# FASE 6b - RED VIVA Y CONTRATO ZID')
          add('')
          add('Decision registrada: datos efimeros OK para pruebas de este mes.')
          add('Sonda /verify-existence: segun la vision debe ser publica; se reporta su estado real.')
          add('Contrato ZID: se aprende de los errores del servidor (POST vacio -> campos exigidos).')
          add('')

          add('## S1. Descubrimiento mejorado de rutas')
          add('')
          KEY = ('identity', 'identidad', 'verify', 'verif', 'exist', 'token', 'cert',
                 'history', 'historial', 'document', 'documento', 'search', 'reputation',
                 'reputacion', 'export', 'zid', 'register', 'registro', 'health')
          rutas = set()
          for rel in ('shared_engines/runtime/api.py',
                      'shared_engines/runtime/combined_api.py',
                      'shared_engines/runtime/capabilities_api.py',
                      'main.py'):
              t = txt(ROOT / rel)
              for m in re.finditer(r'"([a-z0-9_/\-\.]{3,60})"', t):
                  c = m.group(1)
                  if any(k in c for k in KEY) or c.startswith('/'):
                      if not c.startswith(('http', '/tmp', '/var')):
                          rutas.add(c if c.startswith('/') else '/' + c)
          rutas = sorted(rutas)
          add('- Rutas candidatas: %d' % len(rutas))
          for r in rutas[:70]:
              add('  - `%s`' % r)
          DATA['rutas'] = rutas
          add('')

          add('## S2. ARRANQUE con auto-curacion de dependencias')
          add('')
          proc = None
          vivo = False
          logs_fallo = []
          for intento in range(1, 5):
              proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT),
                                      env=ENV, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, text=True)
              t0 = time.time()
              vivo = False
              while time.time() - t0 < 30:
                  if proc.poll() is not None:
                      break
                  try:
                      urllib.request.urlopen(BASE + '/health', timeout=2)
                      vivo = True
                      break
                  except urllib.error.HTTPError:
                      vivo = True
                      break
                  except Exception:
                      time.sleep(1.0)
              if vivo:
                  add('- **RED ARRIBA en intento %d** (%s, REQUIRE_TOKEN=1)' % (intento, BASE))
                  break
              proc.terminate()
              try:
                  salida, _ = proc.communicate(timeout=15)
              except Exception:
                  proc.kill()
                  salida = ''
              logs_fallo.append(salida)
              m = re.search(r"No module named '([^']+)'", salida)
              if not m:
                  add('- Fallo sin modulo faltante identificado (intento %d).' % intento)
                  break
              mod = m.group(1).split('.')[0]
              paq = MOD_MAP.get(mod, mod)
              add('- Intento %d: falta %s -> instalando %s...' % (intento, mod, paq))
              try:
                  subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', paq],
                                 timeout=600)
              except Exception as e:
                  add('- pip fallo: %s' % e)
                  break
          gate('red_arranca', vivo)
          add('')

          add('## S3. Health sin token (con REQUIRE_TOKEN=1)')
          add('')
          st_sin = None
          if vivo:
              try:
                  rp = urllib.request.urlopen(BASE + '/health', timeout=5)
                  st_sin = rp.status
              except urllib.error.HTTPError as e:
                  st_sin = int(e.code)
              except Exception as e:
                  st_sin = 'error: %s' % e
              add('- GET /health sin token -> %s (esperado 401)' % st_sin)
          add('')

          add('## S4. Auth end-to-end con cliente canonico')
          add('')
          e2e_ok = False
          if vivo:
              spec = importlib.util.spec_from_file_location(
                  'nc6b', str(ROOT / 'shared_engines' / 'network' / 'network_client.py'))
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              cliente = mod.NetworkClient(BASE, api_token=TOKEN,
                                          timeout_seconds=5, max_retries=1)
              ok, datos, error = cliente.get('/health')
              add('- /health CON Bearer: ok=%s datos=%s error=%s' % (ok, datos, error))
              e2e_ok = bool(ok)
              if e2e_ok:
                  add('')
                  add('**CADENA COMPLETA DEMOSTRADA: cliente -> Bearer -> hmac -> ok.**')
          gate('auth_end_to_end', e2e_ok)
          add('')

          add('## S5. Sonda /verify-existence (consulta publica de la vision)')
          add('')
          verif = {}
          if vivo:
              pruebas = [('/verify-existence', None, False),
                         ('/verify-existence', None, True),
                         ('/verify-existence?zid=Z-TEST-1', None, True),
                         ('/verify-existence?nombre=Pedro', None, True)]
              for ruta, cuerpo, con_token in pruebas:
                  try:
                      req = urllib.request.Request(BASE + ruta, method='GET')
                      if con_token:
                          req.add_header('Authorization', 'Bearer ' + TOKEN)
                      with urllib.request.urlopen(req, timeout=5) as rp:
                          cuerpo_txt = rp.read().decode('utf-8', errors='replace')[:220]
                          verif[ruta + ('|auth' if con_token else '|publico')] = (rp.status, cuerpo_txt)
                          add('- GET %s (%s) -> %d | %s' % (ruta, 'token' if con_token else 'SIN token', rp.status, cuerpo_txt))
                  except urllib.error.HTTPError as e:
                      verif[ruta + ('|auth' if con_token else '|publico')] = (e.code, '')
                      add('- GET %s (%s) -> HTTP %d' % (ruta, 'token' if con_token else 'SIN token', e.code))
                  except Exception as e:
                      add('- GET %s -> error: %s' % (ruta, e))
              publica = any(k.endswith('|publico') and v[0] == 200 for k, v in verif.items())
              add('')
              add('- Estado actual: %s' % ('publica SIN token (cumple la vision)' if publica else 'protegida o sin contrato definido -> en 6c se separa ruta publica (cambio de codigo)'))
          DATA['verify_existence'] = {k: list(v) for k, v in verif.items()}
          add('')

          add('## S6. Contrato ZID: POST vacio a rutas de identidad (aprendizaje por errores)')
          add('')
          cand = [r for r in rutas if any(k in r for k in
                  ('identity', 'identidad', 'register', 'registro', 'zid'))][:8]
          if not cand:
              cand = ['/identity', '/identity/register', '/identidad', '/identidad/registro']
          contrato = {}
          if vivo:
              for ruta in cand:
                  try:
                      req = urllib.request.Request(
                          BASE + ruta, method='POST',
                          data=json.dumps({}).encode('utf-8'),
                          headers={'Content-Type': 'application/json',
                                   'Authorization': 'Bearer ' + TOKEN})
                      with urllib.request.urlopen(req, timeout=5) as rp:
                          cuerpo = rp.read().decode('utf-8', errors='replace')[:250]
                          contrato[ruta] = (rp.status, cuerpo)
                          add('- POST %s -> %d | %s' % (ruta, rp.status, cuerpo))
                  except urllib.error.HTTPError as e:
                      cuerpo = e.read().decode('utf-8', errors='replace')[:250]
                      contrato[ruta] = (e.code, cuerpo)
                      add('- POST %s -> %d | %s' % (ruta, e.code, cuerpo))
                  except Exception as e:
                      contrato[ruta] = ('error', str(e)[:120])
                      add('- POST %s -> error: %s' % (ruta, e))
              add('')
              add('Los mensajes de error revelan los campos exigidos por el servidor (contrato real).')
          DATA['contrato_zid'] = {k: list(v) for k, v in contrato.items()}
          add('')

          if proc is not None:
              try:
                  if proc.poll() is None:
                      proc.terminate()
                      proc.wait(timeout=10)
              except Exception:
                  try:
                      proc.kill()
                  except Exception:
                      pass

          add('## Resultado de gates')
          add('')
          fallos = [n for n, ok in GATES if not ok]
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s.** Diagnosticar con los logs de S2.' % ', '.join(fallos))
          else:
              add('**RED VIVA Y AUTENTICADA. Siguiente (6c): flujo ZID completo y ruta publica.**')
          add('')
          if not vivo and logs_fallo:
              add('## Log del ultimo intento de arranque (diagnostico)')
              add('```')
              for l in [x for x in logs_fallo[-1].splitlines() if x.strip()][-25:]:
                  add(l[:160])
              add('```')

          DATA['gates'] = {n: ok for n, ok in GATES}
          DATA['vivo'] = vivo
          Path('fase6b.json').write_text(
              json.dumps(DATA, indent=2, ensure_ascii=False, default=str),
              encoding='utf-8')
          escribe()
          print('Fase 6b terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase6b-zyra
          path: fase6b.json
          if-no-files-found: ignore
