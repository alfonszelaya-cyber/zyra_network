          print("OK plantilla")
          ASEOF

      - name: "Paso 3 - server: sales/all antes de la generica (idempotente)"
        run: |
          python3 - <<'SVFEOF'
          from pathlib import Path

          sp = Path("apps/agro/server.py")
          t = sp.read_text(encoding="utf-8")
          if 'if s == ["sales", "all"]' in t:
              print("SKIP sales/all ya correcta")
          else:
              bloque_gen = (
                  '        if len(s) == 2 and s[0] == "sales":\n'
                  "            rows = self._ZYRA_COM_D(\n"
                  "                \"apps.agro.modules.comercializacion.venta_simple.simple_sale_service\",\n"
                  "                \"sales_of_db\",\n"
                  "            )(type(self).store._db, s[1])\n"
                  "            self._send(\n"
                  "                200,\n"
                  "                {\"ok\": True, \"data\": {\"sales\": rows}},\n"
                  "            )\n"
                  "            return\n"
              )
              assert bloque_gen in t, "bloque generico sales no encontrado"
              bloque_esp = (
                  '        if s == ["sales", "all"]:\n'
                  "            rows = self._ZYRA_COM_D(\n"
                  "                \"apps.agro.modules.comercializacion.venta_simple.simple_sale_service\",\n"
                  "                \"sales_of_db\",\n"
                  "            )(type(self).store._db, None)\n"
                  "            self._send(\n"
                  "                200,\n"
                  "                {\"ok\": True, \"data\": {\"sales\": rows}},\n"
                  "            )\n"
                  "            return\n"
              )
              t = t.replace(bloque_gen, bloque_esp + bloque_gen, 1)
              compile(t, str(sp), "exec")
              sp.write_text(t, encoding="utf-8")
          assert 'if s == ["sales", "all"]' in sp.read_text(encoding="utf-8")
          print("OK sales/all en disco")
          SVFEOF

