name: ZYRA EX Run 1 - Gemelo digital en vivo reforzando simulation_engine (auto-escritor)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reforzar simulation_engine.py con GemeloVivo (archivo existente completo)
        run: |
          cat > apps/laboratorio/infrastructure/providers/simulation_engine.py <<'SIM_EOF'
          """Motor de evolucion + GEMELO DIGITAL EN VIVO.

          Parte 1 (existente, intacta): proyeccion temporal determinista
          de un escenario A/B/C a lo largo del tiempo.

          Parte 2 (nueva, mismo archivo): GemeloVivo — datos reales del
          mundo (sensores, APIs, archivos) actualizan el gemelo y producen
          alertas honestas cuando cruzan umbrales. Determinista y sin
          fingir: una fuente sin actualizar no miente su estado.
          """
          from apps.laboratorio.domain.scenario import Escenario

          TIPOS_FUENTE = ("sensor", "api", "csv", "manual")


          class MotorEvolucionReal:
              """Proyecta un escenario A/B/C a lo largo del tiempo."""

              EFICIENCIA_ANUAL = 0.02
              RIESGO_ANUAL = 0.01

              def capacidades(self) -> dict:
                  return {
                      "horizonte_anios": (1, 30),
                      "crecimiento_pct": (-50, 200),
                      "modelo": "beneficio crece - costo mejora 2pct anual - riesgo +1pct anual",
                  }

              def ejecutar(self, escenario: Escenario, horizonte_anios: int, crecimiento_pct: float) -> dict:
                  if not isinstance(escenario, Escenario):
                      raise ValueError("Se esperaba un Escenario.")
                  if not (1 <= int(horizonte_anios) <= 30):
                      raise ValueError("horizonte_anios fuera de rango 1-30.")
                  if not (-50.0 <= float(crecimiento_pct) <= 200.0):
                      raise ValueError("crecimiento_pct fuera de rango -50 a 200.")
                  for clave in ("costo", "beneficio", "riesgo"):
                      if clave not in escenario.parametros:
                          raise ValueError("El escenario requiere el parametro " + clave)
                  costo0 = float(escenario.parametros["costo"])
                  beneficio0 = float(escenario.parametros["beneficio"])
                  riesgo0 = float(escenario.parametros["riesgo"])
                  factor_b = 1.0 + float(crecimiento_pct) / 100.0
                  serie = []
                  sum_beneficio = 0.0
                  sum_costo = 0.0
                  punto_equilibrio = 0
                  for i in range(int(horizonte_anios) + 1):
                      beneficio = beneficio0 * (factor_b ** i)
                      costo = costo0 * ((1.0 - self.EFICIENCIA_ANUAL) ** i)
                      riesgo = min(100.0, riesgo0 * (1.0 + self.RIESGO_ANUAL * i))
                      puntaje = min(
                          100.0,
                          0.4 * (100.0 - costo) + 0.4 * beneficio + 0.2 * (100.0 - riesgo),
                      )
                      if i >= 1:
                          sum_beneficio += beneficio
                          sum_costo += costo
                          if punto_equilibrio == 0 and beneficio > costo:
                              punto_equilibrio = i
                      serie.append({
                          "anio": i,
                          "costo": round(costo, 4),
                          "beneficio": round(beneficio, 4),
                          "riesgo": round(riesgo, 4),
                          "puntaje": round(puntaje, 4),
                      })
                  if sum_costo > 0:
                      roi = round((sum_beneficio - sum_costo) / sum_costo * 100.0, 2)
                  else:
                      roi = 0.0
                  inicial = serie[0]["puntaje"]
                  final = serie[-1]["puntaje"]
                  if final > inicial * 1.01:
                      tendencia = "creciente"
                  elif final < inicial * 0.99:
                      tendencia = "decreciente"
                  else:
                      tendencia = "estable"
                  metricas = {
                      "punto_equilibrio_anio": punto_equilibrio,
                      "roi_pct": roi,
                      "puntaje_inicial": inicial,
                      "puntaje_final": final,
                      "tendencia": tendencia,
                  }
                  return {"serie": serie, "metricas": metricas}


          class GemeloVivo:
              """Gemelo digital en vivo: fuentes reales -> estado -> alertas.

              Una fuente representa un dato del mundo real (sensor de agua,
              API de sismos, fila CSV de aforo). actualizar() registra el
              valor nuevo, calcula el delta y dispara alerta si cruza los
              umbrales declarados. Sin umbrales no hay alerta (honesto).
              """

              def __init__(self):
                  self._fuentes = {}
                  self._historico = {}
                  self._actualizaciones = 0

              def capacidades(self) -> dict:
                  return {
                      "tipos_fuente": TIPOS_FUENTE,
                      "salidas": ("estado", "delta", "alertas_por_umbral", "historico"),
                      "uso": "gemelo digital conectado a datos reales del mundo",
                  }

              def registrar_fuente(
                  self, id_fuente, tipo, valor,
                  umbral_alto=None, umbral_bajo=None, etiqueta="",
              ) -> dict:
                  id_limpio = str(id_fuente or "").strip()
                  if not id_limpio:
                      raise ValueError("id_fuente requerido.")
                  if tipo not in TIPOS_FUENTE:
                      raise ValueError(
                          "tipo desconocido: " + repr(tipo)
                          + ". Validos: " + ", ".join(TIPOS_FUENTE)
                      )
                  if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                      raise ValueError("valor inicial debe ser numerico.")
                  fuente = {
                      "id": id_limpio,
                      "tipo": tipo,
                      "valor": float(valor),
                      "anterior": float(valor),
                      "umbral_alto": None,
                      "umbral_bajo": None,
                      "etiqueta": str(etiqueta or "")[:80],
                      "actualizaciones": 0,
                  }
                  if umbral_alto is not None:
                      if isinstance(umbral_alto, bool) or not isinstance(umbral_alto, (int, float)):
                          raise ValueError("umbral_alto debe ser numerico.")
                      fuente["umbral_alto"] = float(umbral_alto)
                  if umbral_bajo is not None:
                      if isinstance(umbral_bajo, bool) or not isinstance(umbral_bajo, (int, float)):
                          raise ValueError("umbral_bajo debe ser numerico.")
                      fuente["umbral_bajo"] = float(umbral_bajo)
                  if (
                      fuente["umbral_alto"] is not None
                      and fuente["umbral_bajo"] is not None
                      and fuente["umbral_bajo"] >= fuente["umbral_alto"]
                  ):
                      raise ValueError("umbral_bajo debe ser menor que umbral_alto.")
                  self._fuentes[id_limpio] = fuente
                  self._historico[id_limpio] = [float(valor)]
                  return dict(fuente)

              def actualizar(self, id_fuente, valor) -> dict:
                  id_limpio = str(id_fuente or "").strip()
                  fuente = self._fuentes.get(id_limpio)
                  if fuente is None:
                      raise ValueError("Fuente no registrada: " + id_limpio)
                  if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                      raise ValueError("valor debe ser numerico.")
                  valor = float(valor)
                  anterior = fuente["valor"]
                  delta = round(valor - anterior, 6)
                  fuente["anterior"] = anterior
                  fuente["valor"] = valor
                  fuente["actualizaciones"] += 1
                  self._actualizaciones += 1
                  historico = self._historico.setdefault(id_limpio, [])
                  historico.append(valor)
                  if len(historico) > 500:
                      del historico[:-500]
                  alertas = []
                  if fuente["umbral_alto"] is not None and valor > fuente["umbral_alto"]:
                      alertas.append({
                          "tipo": "umbral_alto_superado",
                          "valor": valor,
                          "umbral": fuente["umbral_alto"],
                          "exceso": round(valor - fuente["umbral_alto"], 6),
                      })
                  if fuente["umbral_bajo"] is not None and valor < fuente["umbral_bajo"]:
                      alertas.append({
                          "tipo": "umbral_bajo_superado",
                          "valor": valor,
                          "umbral": fuente["umbral_bajo"],
                          "deficit": round(fuente["umbral_bajo"] - valor, 6),
                      })
                  return {
                      "id": id_limpio,
                      "valor_anterior": anterior,
                      "valor_nuevo": valor,
                      "delta": delta,
                      "alertas": alertas,
                      "actualizaciones": self._actualizaciones,
                  }

              def estado(self) -> dict:
                  fuentes = []
                  for id_ in sorted(self._fuentes):
                      fuente = dict(self._fuentes[id_])
                      fuente["ultimo_delta"] = round(
                          fuente["valor"] - fuente["anterior"], 6
                      )
                      fuentes.append(fuente)
                  return {
                      "fuentes": fuentes,
                      "total_fuentes": len(fuentes),
                      "actualizaciones_totales": self._actualizaciones,
                      "historico_puntos": sum(
                          len(v) for v in self._historico.values()
                      ),
                  }

              def historico(self, id_fuente, limite=50) -> dict:
                  id_limpio = str(id_fuente or "").strip()
                  if id_limpio not in self._fuentes:
                      raise ValueError("Fuente no registrada: " + id_limpio)
                  serie = list(self._historico.get(id_limpio, []))
                  return {
                      "id": id_limpio,
                      "puntos": len(serie),
                      "valores": serie[-int(limite):],
                  }
          SIM_EOF

      - name: Reforzar routers/api/decisions.py con rutas del gemelo (archivo existente)
        run: |
          cat > apps/laboratorio/routers/api/decisions.py <<'DEC_EOF'
          """Rutas API de decisiones - simulacion, comparacion, optimizacion, Monte Carlo y gemelo en vivo."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.schemas.responses.envelopes import exito

          RUTA_SIMULAR = "/laboratorio/api/v1/projects/{proyecto_id}/simulate"
          RUTA_SIMS = "/laboratorio/api/v1/projects/{proyecto_id}/simulations"
          RUTA_COMPARAR = "/laboratorio/api/v1/projects/{proyecto_id}/compare"
          RUTA_COMPARACION = "/laboratorio/api/v1/comparisons/{comparacion_id}"
          RUTA_INFORME = RUTA_COMPARACION + "/report.html"
          RUTA_OPTIMIZAR = "/laboratorio/api/v1/scenarios/{escenario_id}/optimize"
          RUTA_APLICAR = "/laboratorio/api/v1/optimizations/{optimizacion_id}/apply"
          RUTA_MONTE = "/laboratorio/api/v1/projects/{proyecto_id}/monte-carlo"
          RUTA_MONTE_COMPARA = "/laboratorio/api/v1/projects/{proyecto_id}/monte-carlo/comparar"
          RUTA_GEMELO_FUENTES = "/laboratorio/api/v1/twin/sources"
          RUTA_GEMELO_FUENTE = "/laboratorio/api/v1/twin/sources/{fuente_id}"
          RUTA_GEMELO_HISTORICO = "/laboratorio/api/v1/twin/sources/{fuente_id}/history"
          RUTA_GEMELO_ESTADO = "/laboratorio/api/v1/twin"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_decisiones")
              motor_mc = app.contenedor.obtener("motor_monte_carlo")
              gemelo = app.contenedor.obtener("gemelo_vivo")

              def _simular(ctx):
                  return manejador.simular(ctx.identidad, ctx.ruta_params["proyecto_id"], ctx.json())

              def _sims(ctx):
                  return manejador.listar_simulaciones(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _comparar(ctx):
                  return manejador.comparar(ctx.identidad, ctx.ruta_params["proyecto_id"])

              def _comparacion(ctx):
                  return manejador.obtener_comparacion(ctx.identidad, ctx.ruta_params["comparacion_id"])

              def _informe(ctx):
                  return manejador.informe_comparacion(ctx.identidad, ctx.ruta_params["comparacion_id"])

              def _optimizar(ctx):
                  return manejador.optimizar(ctx.identidad, ctx.ruta_params["escenario_id"])

              def _aplicar(ctx):
                  return manejador.aplicar(ctx.identidad, ctx.ruta_params["optimizacion_id"], ctx.json_opcional())

              def _monte(ctx):
                  return exito(motor_mc.simular(ctx.json()))

              def _monte_compara(ctx):
                  return exito(motor_mc.comparar(ctx.json()))

              def _gem_registrar(ctx):
                  datos = ctx.json()
                  return exito(gemelo.registrar_fuente(
                      datos.get("id", ""),
                      str(datos.get("tipo", "sensor")).strip(),
                      datos.get("valor", 0.0),
                      datos.get("umbral_alto"),
                      datos.get("umbral_bajo"),
                      str(datos.get("etiqueta", "")),
                  ))

              def _gem_actualizar(ctx):
                  datos = ctx.json()
                  return exito(gemelo.actualizar(
                      ctx.ruta_params["fuente_id"], datos.get("valor"),
                  ))

              def _gem_historico(ctx):
                  return exito(gemelo.historico(ctx.ruta_params["fuente_id"]))

              def _gem_estado(ctx):
                  return exito(gemelo.estado())

              app.registrar("POST", RUTA_SIMULAR, _simular, PermisoCodigo.SIMULAR, "Simular evolucion temporal")
              app.registrar("GET", RUTA_SIMS, _sims, PermisoCodigo.VER, "Listar simulaciones")
              app.registrar("POST", RUTA_COMPARAR, _comparar, PermisoCodigo.COMPARAR, "Comparar escenarios evaluados")
              app.registrar("GET", RUTA_COMPARACION, _comparacion, PermisoCodigo.VER, "Obtener comparacion")
              app.registrar("GET", RUTA_INFORME, _informe, PermisoCodigo.VER, "Informe HTML de la comparacion")
              app.registrar("POST", RUTA_OPTIMIZAR, _optimizar, PermisoCodigo.OPTIMIZAR, "Sugerir optimizacion")
              app.registrar("POST", RUTA_APLICAR, _aplicar, PermisoCodigo.OPTIMIZAR, "Aplicar optimizacion como escenario nuevo")
              app.registrar("POST", RUTA_MONTE, _monte, PermisoCodigo.SIMULAR, "Monte Carlo reproducible con IC95 y convergencia")
              app.registrar("POST", RUTA_MONTE_COMPARA, _monte_compara, PermisoCodigo.COMPARAR, "Comparar configuraciones con Monte Carlo")
              app.registrar("POST", RUTA_GEMELO_FUENTES, _gem_registrar, PermisoCodigo.SIMULAR, "Registrar fuente real del gemelo (sensor/api/csv/manual)")
              app.registrar("POST", RUTA_GEMELO_FUENTE, _gem_actualizar, PermisoCodigo.SIMULAR, "Actualizar valor real de una fuente del gemelo")
              app.registrar("GET", RUTA_GEMELO_HISTORICO, _gem_historico, PermisoCodigo.VER, "Historico real de una fuente")
              app.registrar("GET", RUTA_GEMELO_ESTADO, _gem_estado, PermisoCodigo.VER, "Estado del gemelo digital en vivo")
          DEC_EOF

      - name: Cablear gemelo en service_registry (idempotente, archivo existente)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/registry/services/service_registry.py")
          t = ruta.read_text(encoding="utf-8")
          cambios = []

          viejo_import = "from apps.laboratorio.infrastructure.providers.simulation_engine import MotorEvolucionReal\n"
          nuevo_import = "from apps.laboratorio.infrastructure.providers.simulation_engine import GemeloVivo, MotorEvolucionReal\n"
          if "GemeloVivo" not in t:
              if viejo_import in t:
                  t = t.replace(viejo_import, nuevo_import, 1)
                  cambios.append("import ampliado")
              else:
                  print("AVISO: import de simulation_engine no encontrado tal cual")

          ancla = '          c.registrar("motor_monte_carlo", lambda _c: MotorMonteCarlo())\n'
          linea = '          c.registrar("gemelo_vivo", lambda _c: GemeloVivo())\n'
          if '"gemelo_vivo"' not in t:
              if ancla in t:
                  t = t.replace(ancla, ancla + linea, 1)
                  cambios.append("servicio gemelo_vivo cableado")
              else:
                  print("AVISO: ancla de servicio no encontrada")

          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("service_registry - " + ("; ".join(cambios) if cambios else "ya al dia"))
          PYEOF

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Escribir pruebas del gemelo (carpeta tests existente)
        run: |
          cat > apps/laboratorio/tests/test_gemelo_vivo.py <<'TG_EOF'
          """Gemelo digital en vivo - datos reales, deltas y alertas honestas."""
          import json

          import pytest

          from apps.laboratorio.infrastructure.providers.simulation_engine import GemeloVivo
          from apps.laboratorio.tests.conftest import assert_2xx


          def test_registrar_y_actualizar_con_delta():
              gem = GemeloVivo()
              gem.registrar_fuente("sensor-rio", "sensor", 2.0, umbral_alto=5.0)
              res = gem.actualizar("sensor-rio", 3.5)
              assert res["valor_anterior"] == 2.0
              assert res["valor_nuevo"] == 3.5
              assert res["delta"] == 1.5
              assert res["alertas"] == []


          def test_alerta_umbral_alto_y_bajo():
              gem = GemeloVivo()
              gem.registrar_fuente("rio", "sensor", 3.0, umbral_alto=5.0, umbral_bajo=1.0)
              alta = gem.actualizar("rio", 6.0)
              assert alta["alertas"][0]["tipo"] == "umbral_alto_superado"
              baja = gem.actualizar("rio", 0.5)
              assert baja["alertas"][0]["tipo"] == "umbral_bajo_superado"


          def test_fuente_no_registrada_rechaza():
              gem = GemeloVivo()
              with pytest.raises(ValueError):
                  gem.actualizar("fantasma", 1.0)


          def test_tipo_invalido_y_umbrales_invalidos_rechazan():
              gem = GemeloVivo()
              with pytest.raises(ValueError):
                  gem.registrar_fuente("a", "telepatia", 1.0)
              with pytest.raises(ValueError):
                  gem.registrar_fuente("b", "sensor", 1.0, umbral_alto=5.0, umbral_bajo=5.0)


          def test_estado_y_historico_reales():
              gem = GemeloVivo()
              gem.registrar_fuente("api-sismos", "api", 1.0)
              gem.actualizar("api-sismos", 2.0)
              gem.actualizar("api-sismos", 4.0)
              estado = gem.estado()
              assert estado["total_fuentes"] == 1
              assert estado["actualizaciones_totales"] == 2
              hist = gem.historico("api-sismos")
              assert hist["valores"] == [1.0, 2.0, 4.0]


          def test_gemelo_por_http(despachar):
              cuerpo = json.dumps({
                  "id": "sensor-aforo", "tipo": "sensor", "valor": 10.0,
                  "umbral_alto": 20.0, "etiqueta": "aforo parque",
              }).encode("utf-8")
              status, _h, datos = despachar(
                  "POST", "/laboratorio/api/v1/twin/sources", cuerpo,
              )
              assert_2xx(status, datos)
              cuerpo2 = json.dumps({"valor": 25.0}).encode("utf-8")
              status2, _h2, datos2 = despachar(
                  "POST", "/laboratorio/api/v1/twin/sources/sensor-aforo", cuerpo2,
              )
              assert_2xx(status2, datos2)
              alertas = datos2["datos"]["alertas"]
              assert alertas and alertas[0]["tipo"] == "umbral_alto_superado"
              status3, _h3, datos3 = despachar("GET", "/laboratorio/api/v1/twin")
              assert_2xx(status3, datos3)
              assert datos3["datos"]["total_fuentes"] == 1
          TG_EOF

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado de la suite - Run 1 gemelo en vivo"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "EX Run 1 - gemelo digital en vivo reforzando simulation_engine (fuentes reales, deltas, alertas por umbral)"
            git push
          fi
