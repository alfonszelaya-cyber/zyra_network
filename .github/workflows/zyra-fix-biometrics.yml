name: "AGRO audit paso 2: verificar /agro/sales/all en vivo (SOLO LECTURA - decide cierre del backlog #2)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: agro-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "1. Dump: implementacion exacta de la ruta sales/all (server.py 470-510) + sales_of_db"
        run: |
          python3 - <<'D1EOF'
          from pathlib import Path
          lines = Path(
              "apps/agro/server.py"
          ).read_text(encoding="utf-8").splitlines()
          print("=== server.py 470-510 (ruta sales/all exacta) ===")
          for n in range(469, min(510, len(lines))):
              print(str(n + 1).rjust(5)
                    + ": " + lines[n])
          print()
          f = Path(
              "apps/agro/modules/comercializacion/"
              "venta_simple/simple_sale_service.py")
          if f.exists():
              lines = f.read_text(
                  encoding="utf-8").splitlines()
              ini = None
              for i, l in enumerate(lines):
                  if "def sales_of_db" in l:
                      ini = i
                      break
              if ini is not None:
                  print("=== sales_of_db (desde "
                        + str(ini + 1) + ") ===")
                  for n in range(ini,
                                 min(ini + 30,
                                     len(lines))):
                      print(str(n + 1).rjust(5)
                            + ": " + lines[n])
          D1EOF

      - name: "2. Test real de carga AGRO (imprime 'ventas via HTTP: N' - EL DATO QUE DECIDE)"
        run: |
          python3 -m pytest apps/agro/tests/test_agro_superapp.py -q -s --tb=short 2>&1 | tee /tmp/agro.txt | tail -25
          echo "=============================="
          echo "LINEAS CARGA/HTTP DEL TEST:"
          grep -E "CARGA|ventas via HTTP" /tmp/agro.txt || true

      - name: "3. Resultado del archivo completo de tests AGRO (contexto)"
        run: |
          python3 -m pytest apps/agro/tests -q --tb=line 2>&1 | tail -5

      - name: "Contexto"
        run: |
          git log --oneline -3
