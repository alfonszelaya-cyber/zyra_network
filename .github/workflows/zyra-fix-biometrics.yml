      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Verificacion completa del cierre RUM 1
        run: |
          python - <<'PYEOF'
          import ast, importlib, os, sys, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append
          A("# Cierre RUM 1 — resultado\n")

          archivos = [
              "apps/laboratorio/infrastructure/network/zyra_client.py",
              "apps/laboratorio/infrastructure/network/health.py",
              "apps/laboratorio/registry/services/service_registry.py",
          ]
          for ruta in archivos:
              t = Path(ruta).read_text(encoding="utf-8", errors="replace")
              try:
                  ast.parse(t)
                  A("- sintaxis OK: " + ruta)
              except SyntaxError as e:
                  A("- sintaxis FALLO: " + ruta + " -> " + str(e))
                  if summary:
                      with open(summary, "a") as fh:
                          fh.write("\n".join(L) + "\n")
                  sys.exit(1)
          A("")

          A("## Montaje real de la aplicacion")
          A("```")
          try:
              mod = importlib.import_module(
                  "apps.laboratorio.registry.services.service_registry"
              )
              c = mod.construir_contenedor(":memory:")
              salud = c.obtener("estado_salud").estado()
              A("health: " + str(salud))
              motores = c.obtener("registro_motores").reporte_todos()
              A("motores: " + str(len(motores)) + " total, "
                + str(salud["motores_disponibles"]) + " disponibles")

              appmod = importlib.import_module(
                  "apps.laboratorio.infrastructure.api.app"
              )
              app = appmod.montar_aplicacion(":memory:")
              rutas = app.listar_rutas()
              A("rutas montadas: " + str(len(rutas)))

              ok = True
              if salud["motores_total"] != 16:
                  A("FALLO: motores_total != 16"); ok = False
              if salud["motores_disponibles"] != 15:
                  A("FALLO: motores_disponibles != 15"); ok = False
              red = salud.get("red", {})
              if red.get("configurada") is not False:
                  A("FALLO: red.configurada debe ser False sin env"); ok = False
              if red.get("conectada") is not False:
                  A("FALLO: red.conectada debe ser False sin env"); ok = False
              if len(rutas) != 66:
                  A("FALLO: rutas != 66"); ok = False

              from apps.laboratorio.config.network.network_config import NetworkConfig
              from apps.laboratorio.infrastructure.network.zyra_client import ClienteZyra
              from apps.laboratorio.shared.exceptions.network_errors import RedNoDisponibleError

              cli_sin = ClienteZyra(NetworkConfig.cargar())
              resp = cli_sin.sellar_documento("t", "c")
              if resp.get("sellado") is not False:
                  A("FALLO: sellar sin config debe devolver sellado False"); ok = False
              A("sin URL configurada: sellado degradado honesto OK")

              cfg_fake = NetworkConfig(
                  url_zyra_core="http://127.0.0.1:59999",
                  app_id="laboratorio",
                  api_token="",
                  timeout_segundos=1.0,
                  reintentos=2,
              )
              cli_dead = ClienteZyra(cfg_fake)
              estado = cli_dead.estado_conexion()
              if estado.get("conectada") is not False:
                  A("FALLO: servidor muerto no puede estar conectada"); ok = False
              A("servidor muerto: estado honesto con motivo -> "
                + str(estado.get("motivo", ""))[:100])
              try:
                  cli_dead.sellar_documento("t", "c")
                  A("FALLO: con URL configurada y servidor muerto debe lanzar error")
                  ok = False
              except RedNoDisponibleError:
                  A("servidor muerto con URL: error honesto lanzado OK (reintentos agotados)")

              if ok:
                  A("RUM 1 CERRADO CORRECTAMENTE")
              else:
                  sys.exit(1)
          except SystemExit:
              raise
          except Exception:
              A(traceback.format_exc()[-2000:])
              sys.exit(1)
          A("```")

          md = "\n".join(L)
          if summary:
              with open(summary, "a") as fh:
                  fh.write(md + "\n")
          print(md)
          PYEOF

      - name: Commit y push automatico
        run: |
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio/infrastructure/network/zyra_client.py
          git add apps/laboratorio/infrastructure/network/health.py
          git add apps/laboratorio/registry/services/service_registry.py
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "RUM 1 cierre: cliente con reintentos, health con red real, 16 motores cableados"
            git push
          fi
