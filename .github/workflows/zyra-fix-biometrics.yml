name: "AXIS SYNC TOTAL: estado real + aplica ley/rutas/guardia/tests + verificacion dura"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - ESTADO REAL: que existe y que falta"
        run: |
          python3 - <<'STATEOF'
          from pathlib import Path
          al = (Path("apps/axis/services/axis_link.py")
                .read_text(encoding="utf-8"))
          sv = Path("apps/axis/server.py").read_text(
              encoding="utf-8")
          ta = Path("apps/axis/tests/test_axis.py").read_text(
              encoding="utf-8")
          api = Path(
              "shared_engines/runtime/api.py").read_text(
              encoding="utf-8")
          estado = {
              "ley en axis_link":
                  "biometria: use enroll_person" in al,
              "verify_service ClassVar":
                  "verify_service: ClassVar" in sv,
              "auto-wire life_history":
                  "build_life_history" in sv,
              "rutas audit/verify":
                  '"audit", "verify"' in sv,
              "rutas verify generate":
                  '"verify", "generate"' in sv,
              "guardia birth-register":
                  "_ZAX3_GUARD" in sv,
              "censo (AX-2)": "_censo_data" in sv,
              "ingesta (AX-2)":
                  '["gobierno", "ingesta"]' in sv,
              "tests AX en test_axis":
                  "test_ax1_" in ta
                  or "test_axz_" in ta,
              "RED birth-zid":
                  '"birth-zid"' in api,
          }
          for k, v in estado.items():
              print(("OK  " if v else "FALTA") + " | " + k)
          STATEOF

      - name: "Paso 2 - RED: birth-zid (idempotente)"
        run: |
          python3 - <<'BZEOF'
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/api.py")
          t = p.read_text(encoding="utf-8")
          if '"birth-zid"' in t:
              print("SKIP RED")
              raise SystemExit(0)
          ancla = (
              '        if s == ["identity",'
              ' "register"]:\n'
          )
          assert ancla in t, "ancla register"
          R = (
              '        if s == ["identity",'
              ' "birth-zid"]:\n'
              "            self._handle_birth_zid()\n"
              "            return\n"
          )
          t = t.replace(ancla, R + ancla, 1)
          ancla_h = (
              "    def _handle_register_identity"
              "(self) -> None:\n"
          )
          assert ancla_h in t, "ancla handler"
          H = (
              "    def _handle_birth_zid("
              "self) -> None:\n"
              "        doc = self._read_json()\n"
              "        actor_zid = self._require_str("
              "doc, \"actor_zid\")\n"
              "        cert_hash = self._require_str("
              "doc, \"cert_hash\")\n"
              "        child_name = self._require_str("
              "doc, \"child_name\")\n"
              "        actor = type(self).kernel."
              "identity.get_identity(actor_zid)\n"
              "        if actor is None:\n"
              "            raise ApiError(403,"
              " \"forbidden\","
              " \"actor desconocido\")\n"
              "        if actor.status.value"
              " != \"ACTIVE\":\n"
              "            raise ApiError(403,"
              " \"forbidden\", \"actor no ACTIVE\")\n"
              "        from"
              " shared_engines.identity.contracts"
              " import IdentityKind\n"
              "        identity = type(self).kernel."
              "identity.register_identity(\n"
              "            kind=IdentityKind.PERSON,\n"
              "            display_name=child_name,\n"
              "            actor=(\"birth-zid:\""
              " + actor_zid),\n"
              "        )\n"
              "        type(self).kernel.audit.append(\n"
              "            event_type=(\n"
              "                \"identity.birth_zid\"),\n"
              "            actor=actor_zid,\n"
              "            subject=identity.zid,\n"
              "            detail={\n"
              "                \"cert_hash\": cert_hash,\n"
              "            },\n"
              "        )\n"
              "        self._ok(\n"
              "            {\n"
              "                \"identity\": (\n"
              "                    _identity_json(\n"
              "                        identity\n"
              "                    )\n"
              "                ),\n"
              "                \"cert_hash\": cert_hash,\n"
              "            },\n"
              "            status=201,\n"
              "        )\n\n"
          )
          t = t.replace(ancla_h, H + ancla_h, 1)
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          assert "_handle_birth_zid" in p.read_text(
              encoding="utf-8")
          print("OK RED birth-zid")
          BZEOF

      - name: "Paso 2b - RED: verificacion import fresco"
        run: |
          python3 -c "
          from shared_engines.runtime.api import ZyraApiHandler
          assert hasattr(ZyraApiHandler, '_handle_birth_zid')
          print('OK birth-zid vivo en la Red')
          "

      - name: "Paso 3 - server: verify_service + auto-wire + rutas + guardia (todo con compile-check)"
        run: |
          python3 - <<'SVCEOF'
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          cambios = []

          if "verify_service: ClassVar" not in t:
              ancla = (
                  "    life_history_service:"
                  " ClassVar[object] = None\n"
              )
              assert ancla in t, "ancla ClassVar"
              t = t.replace(
                  ancla,
                  ancla
                  + "    verify_service:"
                  " ClassVar[object] = None\n",
                  1)
              cambios.append("verify_service")

          if "build_life_history" not in t:
              idx = t.find("def serve_axis(")
              assert idx >= 0, "serve_axis"
              nueva = (
                  "def serve_axis(\n"
                  "    store: AxisStore,\n"
                  "    client: NetworkClient,\n"
                  "    *,\n"
                  "    host: str = \"127.0.0.1\",\n"
                  "    port: int = 0,\n"
                  "    life_history_service=None,\n"
                  "    verify_service=None,\n"
                  ") -> AxisServer:\n"
                  "    if life_history_service"
                  " is None:\n"
                  "        from apps.axis."
                  "life_history.integration import (\n"
                  "            build_life_history,\n"
                  "        )\n"
                  "        life_history_service = (\n"
                  "            build_life_history(\n"
                  "                db=store._db,\n"
                  "                clock=store._clock,\n"
                  "                network_client=(\n"
                  "                    client\n"
                  "                ),\n"
                  "            )\n"
                  "        )\n"
                  "    AxisApiHandler.store = store\n"
                  "    AxisApiHandler.link = (\n"
                  "        AxisLink(client)\n"
                  "    )\n"
                  "    AxisApiHandler."
                  "life_history_service = (\n"
                  "        life_history_service\n"
                  "    )\n"
                  "    AxisApiHandler.verify_service"
                  " = verify_service\n"
                  "    return AxisServer(\n"
                  "        (host, port)\n"
                  "    )\n"
              )
              t = t[:idx] + nueva
              cambios.append("auto-wire")

          if '"audit", "verify"' not in t:
              ancla = (
                  '        if s == ["health"]:\n'
              )
              assert ancla in t, "ancla health"
              GET = (
                  '        if s == ["audit",'
                  ' "verify"]:\n'
                  "            life = (\n"
                  "                type(self).\n"
                  "                life_history_service\n"
                  "            )\n"
                  "            if life is None:\n"
                  "                self._send(\n"
                  "                    503,\n"
                  "                    {\n"
                  "                        \"ok\": False,\n"
                  "                        \"error\": {\n"
                  "                            \"type\":"
                  " \"not_wired\"\n"
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            ok_b, count = (\n"
                  "                life._store.\n"
                  "                births_chain_verify()\n"
                  "            )\n"
                  "            self._send(\n"
                  "                200,\n"
                  "                {\n"
                  "                    \"ok\": True,\n"
                  "                    \"data\": {\n"
                  "                        \"births_chain\": {\n"
                  "                            \"ok\": ok_b,\n"
                  "                            \"checked\": (\n"
                  "                                count\n"
                  "                            ),\n"
                  "                        },\n"
                  "                    },\n"
                  "                },\n"
                  "            )\n"
                  "            return\n"
                  "        if (\n"
                  "            len(s) == 3\n"
                  "            and s[0] == \"audit\"\n"
                  "            and s[1] == \"verify\"\n"
                  "        ):\n"
                  "            life = (\n"
                  "                type(self).\n"
                  "                life_history_service\n"
                  "            )\n"
                  "            if life is None:\n"
                  "                self._send(\n"
                  "                    503,\n"
                  "                    {\n"
                  "                        \"ok\": False,\n"
                  "                        \"error\": {\n"
                  "                            \"type\":"
                  " \"not_wired\"\n"
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            pid = s[2]\n"
                  "            ok_e = (\n"
                  "                life._store.\n"
                  "                events_verify(pid)\n"
                  "            )\n"
                  "            n = len(\n"
                  "                life._store.\n"
                  "                events_of(pid)\n"
                  "            )\n"
                  "            self._send(\n"
                  "                200,\n"
                  "                {\n"
                  "                    \"ok\": True,\n"
                  "                    \"data\": {\n"
                  "                        \"person_id\": pid,\n"
                  "                        \"events_chain_ok\": (\n"
                  "                            ok_e\n"
                  "                        ),\n"
                  "                        \"events\": n,\n"
                  "                    },\n"
                  "                },\n"
                  "            )\n"
                  "            return\n"
              )
              t = t.replace(ancla, GET + ancla, 1)
              cambios.append("rutas audit")

          if '"verify", "generate"' not in t:
              ancla = (
                  '        if s == ["emergencies"]:\n'
              )
              assert ancla in t, "ancla emergencies"
              POST = (
                  '        if s == ["verify",'
                  ' "generate"]:\n'
                  "            svc = (\n"
                  "                type(self).\n"
                  "                verify_service\n"
                  "            )\n"
                  "            if svc is None:\n"
                  "                self._send(\n"
                  "                    503,\n"
                  "                    {\n"
                  "                        \"ok\": False,\n"
                  "                        \"error\": {\n"
                  "                            \"type\":"
                  " \"not_wired\"\n"
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            from apps.axis."
                  "life_history.public_verify import (\n"
                  "                NotAuthorizedError,\n"
                  "            )\n"
                  "            try:\n"
                  "                code = svc."
                  "generate_code(\n"
                  "                    subject_zid=(\n"
                  "                        self._req(\n"
                  "                            doc,"
                  " \"subject_zid\")\n"
                  "                    ),\n"
                  "                    operator_account=(\n"
                  "                        self._req(\n"
                  "                            doc,"
                  " \"operator_account\")\n"
                  "                    ),\n"
                  "                    operator_role=(\n"
                  "                        self._req(\n"
                  "                            doc,"
                  " \"operator_role\")\n"
                  "                    ),\n"
                  "                )\n"
                  "            except NotAuthorizedError"
                  " as exc:\n"
                  "                self._send(\n"
                  "                    403,\n"
                  "                    {\n"
                  "                        \"ok\": False,\n"
                  "                        \"error\": {\n"
                  "                            \"type\":"
                  " \"forbidden\",\n"
                  "                            \"message\":"
                  " str(exc),\n"
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            self._send(\n"
                  "                201,\n"
                  "                {\n"
                  "                    \"ok\": True,\n"
                  "                    \"data\": code,\n"
                  "                },\n"
                  "            )\n"
                  "            return\n"
                  "        if s == [\"verify\","
                  " \"redeem\"]:\n"
                  "            svc = (\n"
                  "                type(self).\n"
                  "                verify_service\n"
                  "            )\n"
                  "            if svc is None:\n"
                  "                self._send(\n"
                  "                    503,\n"
                  "                    {\n"
                  "                        \"ok\": False,\n"
                  "                        \"error\": {\n"
                  "                            \"type\":"
                  " \"not_wired\"\n"
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            from apps.axis."
                  "life_history.public_verify import (\n"
                  "                NotAuthorizedError,\n"
                  "                CodeNotFoundError,\n"
                  "                CodeAlreadyUsedError,\n"
                  "                CodeExpiredError,\n"
                  "            )\n"
                  "            try:\n"
                  "                cert = svc.redeem_code(\n"
                  "                    code=(\n"
                  "                        self._req(\n"
                  "                            doc, \"code\")\n"
                  "                    ),\n"
                  "                    requester=(\n"
                  "                        self._req(\n"
                  "                            doc,"
                  " \"requester\")\n"
                  "                    ),\n"
                  "                    requester_role=(\n"
                  "                        self._req(\n"
                  "                            doc,\n"
                  "                            \"requester_role\")\n"
                  "                    ),\n"
                  "                )\n"
                  "            except NotAuthorizedError"
                  " as exc:\n"
                  "                self._send(\n"
                  "                    403,\n"
                  "                    {\n"
                  "                        \"ok\": False,\n"
                  "                        \"error\": {\n"
                  "                            \"type\":"
                  " \"forbidden\",\n"
                  "                            \"message\":"
                  " str(exc),\n"
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            except CodeNotFoundError"
                  " as exc:\n"
                  "                self._send(\n"
                  "                    404,\n"
                  "                    {\n"
                  "                        \"ok\": False,\n"
                  "                        \"error\": {\n"
                  "                            \"type\":"
                  " \"not_found\",\n"
                  "                            \"message\":"
                  " str(exc),\n"
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            except CodeAlreadyUsedError"
                  " as exc:\n"
                  "                self._send(\n"
                  "                    409,\n"
                  "                    {\n"
                  "                        \"ok\": False,\n"
                  "                        \"error\": {\n"
                  "                            \"type\":"
                  " \"already_used\",\n"
                  "                            \"message\":"
                  " str(exc),\n"
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            except CodeExpiredError"
                  " as exc:\n"
                  "                self._send(\n"
                  "                    410,\n"
                  "                    {\n"
                  "                        \"ok\": False,\n"
                  "                        \"error\": {\n"
                  "                            \"type\":"
                  " \"expired\",\n"
                  "                            \"message\":"
                  " str(exc),\n"
                  "                        },\n"
                  "                    },\n"
                  "                )\n"
                  "                return\n"
                  "            self._send(\n"
                  "                200,\n"
                  "                {\n"
                  "                    \"ok\": True,\n"
                  "                    \"data\": cert,\n"
                  "                },\n"
                  "            )\n"
                  "            return\n"
              )
              t = t.replace(ancla, POST + ancla, 1)
              cambios.append("rutas verify")

          if "_ZAX3_GUARD" not in t:
              ancla = (
                  '        if s == ["birth-register"]:\n'
              )
              assert ancla in t, "ancla birth-register"
              GUARD = (
                  "        _ZAX3_role = (\n"
                  "            self.headers.get(\n"
                  "                \"X-ZYRA-Actor-Role\"\n"
                  "            ) or \"\"\n"
                  "        ).strip()\n"
                  "        if not _ZAX3_role:\n"
                  "            _ZAX3_reg = str(\n"
                  "                doc.get(\n"
                  "                    \"registrar_account\"\n"
                  "                ) or \"\"\n"
                  "            )\n"
                  "            if _ZAX3_reg:\n"
                  "                try:\n"
                  "                    _ZAX3_role = str(\n"
                  "                        type(self)."
                  "store.get_account(\n"
                  "                            _ZAX3_reg\n"
                  "                        ).get(\"role\")\n"
                  "                    )\n"
                  "                except LookupError:\n"
                  "                    _ZAX3_role = \"\"\n"
                  "        from apps.axis.life_history."
                  "access_control import (\n"
                  "            authorize as _ZAX3_auth,\n"
                  "        )\n"
                  "        try:\n"
                  "            _ZAX3_ok = _ZAX3_auth(\n"
                  "                \"birth.register\",\n"
                  "                _ZAX3_role,\n"
                  "            )\n"
                  "        except ValueError:\n"
                  "            _ZAX3_ok = False\n"
                  "        if not _ZAX3_ok:\n"
                  "            self._html(\n"
                  "                403,\n"
                  "                _page(\n"
                  "                    \"AXIS - Rechazado\",\n"
                  "                    \"<h1>Sin"
                  " autorizacion</h1><p>Solo\"\n"
                  "                    \" registradores"
                  " civiles (rol: \"\n"
                  "                    + (_ZAX3_role or"
                  " \"ninguno\") + \").</p>\"\n"
                  "                    \"<a href='/axis'>\"\n"
                  "                    \"<button>Volver\"\n"
                  "                    \"</button></a>\",\n"
                  "                ),\n"
                  "            )\n"
                  "            return\n"
              )
              t = t.replace(ancla, GUARD + ancla, 1)
              cambios.append("guardia")

          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          for req in (
              "verify_service: ClassVar",
              "build_life_history",
              '"audit", "verify"',
              '"verify", "generate"',
              "_ZAX3_role",
          ):
              assert req in escrito, req
          print("OK server cambios: " + str(cambios))
          SVCEOF

      - name: "Paso 3b - server: verificacion import fresco"
        run: |
          python3 -c "
          import apps.axis.server as s
          from apps.axis.server import serve_axis, AxisApiHandler
          assert hasattr(AxisApiHandler, 'verify_service')
          print('OK server compila e importa')
          "

      - name: "Paso 4 - tests AX (con rol gobierno, imports locales)"
        run: |
          python3 - <<'TSEOF'
          import textwrap
          from pathlib import Path

          p = Path("apps/axis/tests/test_axis.py")
          t = p.read_text(encoding="utf-8")
          if "test_axz_" in t:
              print("SKIP tests (ya existen)")
              raise SystemExit(0)

          EXTRA = textwrap.dedent('''\


              # ====== AX-1/AX-2/AX-3 tests ======


              def _axz_seed(name):
                  import base64 as _b64
                  return _b64.b64encode(
                      ("axis-bio-" + name).encode()
                  ).decode("ascii")


              def _axz_boot(with_verify=False,
                            net_base=None):
                  import threading
                  import time as _time
                  from apps.axis.infrastructure.persistence.axis_store import (
                      AxisStore)
                  from apps.axis.infrastructure.network.network_client import (
                      NetworkClient)
                  from apps.axis.server import (
                      serve_axis)
                  from apps.axis.life_history.integration import (
                      build_life_history)
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      SystemClock)
                  db = SQLiteAdapter(":memory:")
                  store = AxisStore(db, SystemClock())
                  if net_base:
                      client = NetworkClient(
                          net_base, max_retries=1)
                  else:
                      client = NetworkClient(
                          "http://127.0.0.1:1",
                          timeout_seconds=1.0,
                          max_retries=0)
                  life = build_life_history(
                      db=db,
                      clock=SystemClock(),
                      network_client=client)
                  verify = None
                  if with_verify:
                      from apps.axis.life_history.public_verify import (
                          PublicVerifyService)
                      verify = PublicVerifyService(
                          life=life,
                          network_db=SQLiteAdapter(
                              ":memory:"),
                          master_key_hex="ab" * 32)
                  srv = serve_axis(
                      store,
                      client,
                      life_history_service=life,
                      verify_service=verify)
                  threading.Thread(
                      target=srv.serve_forever,
                      daemon=True).start()
                  _time.sleep(0.4)
                  base = ("http://127.0.0.1:"
                          + str(srv.bound_port))
                  return store, life, client, base


              def _axz_form(url, form,
                            role="gobierno"):
                  import urllib.error
                  import urllib.parse
                  import urllib.request
                  headers = {}
                  if role:
                      headers["X-ZYRA-Actor-Role"] = (
                          role)
                  req = urllib.request.Request(
                      url,
                      data=urllib.parse.urlencode(
                          form).encode(),
                      method="POST",
                      headers=headers)
                  try:
                      with urllib.request.urlopen(
                          req, timeout=10) as r:
                          return (r.status,
                                  r.read().decode())
                  except urllib.error.HTTPError as e:
                      return (e.code,
                              e.read().decode(
                                  "utf-8", "replace"))


              def _axz_json(method, url, doc=None,
                            role="gobierno"):
                  import json as _json
                  import urllib.error
                  import urllib.request
                  headers = {
                      "Content-Type":
                          "application/json"}
                  if role:
                      headers["X-ZYRA-Actor-Role"] = (
                          role)
                  data = (
                      _json.dumps(doc).encode()
                      if doc is not None else None)
                  req = urllib.request.Request(
                      url, data=data, method=method,
                      headers=headers)
                  try:
                      with urllib.request.urlopen(
                          req, timeout=10) as r:
                          return (r.status,
                                  _json.loads(
                                      r.read().decode()))
                  except urllib.error.HTTPError as e:
                      try:
                          return (e.code,
                                  _json.loads(
                                      e.read().decode()))
                      except Exception:
                          return e.code, {}


              def test_axz_law_blocks_register_person():
                  from apps.axis.services.axis_link import (
                      AxisLink)
                  from apps.axis.infrastructure.network.network_client import (
                      NetworkClient)
                  link = AxisLink(
                      NetworkClient(
                          "http://127.0.0.1:1"))
                  try:
                      link.register_person("X")
                  except ValueError as exc:
                      assert "biometria" in str(exc)
                      return
                  raise AssertionError(
                      "ley no aplicada")


              def test_axz_full_government_flow(tmp_path):
                  import base64 as _b64
                  import json as _json
                  import re as _re
                  import threading
                  import time as _time
                  import urllib.request as _rq
                  import urllib.error as _ue
                  from apps.axis.infrastructure.persistence.axis_store import (
                      AxisStore)
                  from apps.axis.infrastructure.network.network_client import (
                      NetworkClient)
                  from apps.axis.server import (
                      serve_axis)
                  from apps.axis.life_history.integration import (
                      build_life_history)
                  from apps.axis.services.axis_link import (
                      AxisLink)
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock, SystemClock)
                  from shared_engines.runtime.config import (
                      RuntimeConfig)
                  from shared_engines.runtime.kernel import (
                      ZyraKernel)
                  from shared_engines.runtime.capabilities import (
                      ZyraCapabilities)
                  from shared_engines.runtime.combined_api import (
                      serve_combined)
                  from shared_engines.verification.signatures import (
                      Ed25519Signer)
                  from shared_engines.security.biometrics import (
                      BiometricsEngine, BiometricsPolicy,
                      DeterministicTestProvider,
                      TemplateCipher)
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db, clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1", port=0,
                          api_token=None))
                  kernel.bootstrap_root()
                  kernel._biometrics = BiometricsEngine(
                      db=net_db, clock=FrozenClock(),
                      audit=kernel.audit,
                      provider=DeterministicTestProvider(),
                      cipher=TemplateCipher(
                          master_key_hex="ab" * 32),
                      policy=BiometricsPolicy(
                          require_liveness=False,
                          doc_reject=0.01,
                          doc_review=0.02,
                          doc_auto=0.03,
                          dup_reject=0.98))
                  caps = ZyraCapabilities(
                      net_db, FrozenClock(),
                      identity=kernel.identity,
                      signer=signer)
                  net_srv = serve_combined(
                      kernel, caps,
                      host="127.0.0.1", port=0)
                  threading.Thread(
                      target=net_srv.serve_forever,
                      daemon=True).start()
                  _time.sleep(0.4)
                  net_base = ("http://127.0.0.1:"
                              + str(
                                  net_srv.server_address[
                                      1]))
                  client = NetworkClient(
                      net_base, max_retries=1)
                  assert AxisLink(client).register_app()[
                      0] is True
                  store = AxisStore(
                      SQLiteAdapter(":memory:"),
                      SystemClock())
                  life = build_life_history(
                      db=store._db,
                      clock=SystemClock(),
                      network_client=client)
                  srv = serve_axis(
                      store, client,
                      life_history_service=life)
                  threading.Thread(
                      target=srv.serve_forever,
                      daemon=True).start()
                  _time.sleep(0.4)
                  base = ("http://127.0.0.1:"
                          + str(srv.bound_port))
                  seed = _axz_seed("madre-gov")
                  st, html = _axz_form(
                      base + "/axis/register",
                      {"name": "Madre Gov",
                       "role": "gobierno",
                       "doc_image_b64": seed,
                       "selfie_image_b64": seed})
                  assert st == 200, html[:300]
                  m = _re.search(r"ZID-[a-f0-9]+", html)
                  assert m, html[:400]
                  zid_madre = m.group(0)
                  st, html = _axz_form(
                      base + "/axis/birth-register",
                      {"registrar_account": "AX-gob-x",
                       "child_name": "Bebe Censo",
                       "birth_date": "2025-09-01",
                       "birth_place": "SS",
                       "sex": "F",
                       "mother_name": "Madre Gov",
                       "mother_zid": zid_madre})
                  assert st == 200, html[:300]
                  persons = life._store._db.query_all(
                      "SELECT person_id, zid FROM"
                      " life_persons")
                  con_zid = [p for p in persons
                             if p["zid"]]
                  assert len(con_zid) >= 1, (
                      "bebe debe nacer con ZID"
                      " automatico")
                  st, body = _axz_json(
                      "GET",
                      base
                      + "/axis/api/audit/verify")
                  assert st == 200, str(body)
                  assert body["data"][
                      "births_chain"]["ok"] is True
                  st, body = _axz_json(
                      "GET",
                      base
                      + "/axis/api/gobierno/censo",
                      role="gobierno")
                  assert st == 200, str(body)
                  d = body["data"]
                  assert d[
                      "poblacion_registrada"] >= 1
                  assert d["con_zid"] >= 1
                  st, body = _axz_json(
                      "GET",
                      base
                      + "/axis/api/gobierno/censo",
                      role=None)
                  assert st == 403, "censo sin rol 403"
                  st, body = _axz_json(
                      "POST",
                      base
                      + "/axis/api/gobierno/ingesta",
                      {"registrar_account": "AX-gob-x",
                       "child_name": "Bebe Ingesta",
                       "birth_date": "2025-09-02",
                       "birth_place": "SS",
                       "sex": "M",
                       "mother_name": "Madre Gov",
                       "mother_zid": zid_madre,
                       "source": "ministerio-salud"},
                      role="gobierno")
                  assert st == 201, str(body)
                  st, body = _axz_json(
                      "GET",
                      base
                      + "/axis/api/gobierno/censo",
                      role="gobierno")
                  assert body["data"][
                      "poblacion_registrada"] >= 2
                  st, body = _axz_json(
                      "POST",
                      base + "/axis/api/verify/generate",
                      {"subject_zid": zid_madre,
                       "operator_account": "AX-gob-x",
                       "operator_role": "paciente"},
                      role=None)
                  assert st == 403, str(body)
                  st, body = _axz_json(
                      "POST",
                      base + "/axis/api/verify/generate",
                      {"subject_zid": zid_madre,
                       "operator_account": "AX-gob-x",
                       "operator_role": "gobierno"})
                  assert st == 201, str(body)
                  code = body["data"]["code"]
                  st, body = _axz_json(
