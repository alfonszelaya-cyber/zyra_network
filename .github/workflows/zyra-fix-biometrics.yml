      - name: Commit and push
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add apps/subastas/server.py portal/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "ZYRA MARKET (Bloque 1): rename + navigation + role pages" -m "Visible rename SUBASTAS->ZYRA MARKET (routes/architecture unchanged). Injected common nav on all pages. New pages: menu, vendedor, comprador, operaciones, gobierno, order detail. Listings as cards. Portal card renamed."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK (attempt $i)"
              exit 0
            fi
            echo "push failed, retry $i"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
