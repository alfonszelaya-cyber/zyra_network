name: "ZYRA: cierre AGRO+SEMILLA v3 (git fixed)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-cierre-final
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repo state report
        run: |
          echo "=== marcadores actuales en GitHub ==="
          echo "agro legacy calls: $(grep -c 'link.register_producer_zid(' apps/agro/server.py || true)"
          echo "semilla legacy calls: $(grep -c 'link.register_person(' apps/semilla/server.py || true)"
          echo "semilla blocker: $(grep -c 'def person_register_blocked' apps/semilla/services/semilla_link.py || true)"
          echo "render /tmp: $(grep -c '/tmp/zyra-data' render.yaml || true)"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Apply closing patches
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path


          def fail(msg):
              print("PATCH-ERROR:", msg)
              sys.exit(1)


          def read_lines(p):
              f = Path(p)
              if not f.exists():
                  fail("file not found: " + p)
              return f.read_text(encoding="utf-8").splitlines(keepends=True)


          def to_text(lines):
              return "".join(lines)


          def leading(line):
              return line[: len(line) - len(line.lstrip())]


          def find_seq(lines, seq):
              n = len(seq)
              hits = []
              for i in range(len(lines) - n + 1):
                  ok = True
                  for j in range(n):
                      if lines[i + j].strip() != seq[j]:
                          ok = False
                          break
                  if ok:
                      hits.append(i)
              return hits


          def delete_seq(lines, seq, path, tag):
              hits = find_seq(lines, seq)
              if len(hits) != 1:
                  fail("%s count %d (need 1) in %s" % (tag, len(hits), path))
              print("DELETE %s in %s (%d lines)" % (tag, path, len(seq)))
              return lines[: hits[0]] + lines[hits[0] + len(seq):]


          def replace_seq(lines, seq, block, path, tag):
              hits = find_seq(lines, seq)
              if len(hits) != 1:
                  fail("%s count %d (need 1) in %s" % (tag, len(hits), path))
              print("REPLACE %s in %s" % (tag, path))
              ind = leading(lines[hits[0]])
              new = [(ind + t + "\n") if t else "\n" for t in block]
              return lines[: hits[0]] + new + lines[hits[0] + len(seq):]


          def safe_compile(src, path):
              try:
                  compile(src, path, "exec")
                  print("COMPILE OK:", path)
              except SyntaxError as e:
                  print("COMPILE-FAIL:", path)
                  print("  error:", e.msg)
                  print("  line:", e.lineno)
                  if e.text:
                      print("  text:", e.text.rstrip())
                  lines = src.splitlines()
                  ln = e.lineno or 0
                  lo = max(0, ln - 12)
                  print("  --- context ---")
                  for k in range(lo, min(len(lines), ln + 8)):
                      mark = ">>" if k == ln - 1 else "  "
                      print("  %s %4d| %s" % (mark, k + 1, lines[k]))
                  fail("compile failed - NOTHING was written")


          P_AGRO = "apps/agro/server.py"
          P_SEM = "apps/semilla/server.py"
          P_SEM_LINK = "apps/semilla/services/semilla_link.py"
          P_RENDER = "render.yaml"

          AGRO_SEQ = [
              "zid: str | None = None",
              "synced = False",
              "ok, data, _error = (",
              "link.register_producer_zid(",
              "name",
              ")",
              ")",
              "if ok and data is not None:",
              'zid = str(data.get("zid"))',
              "synced = True",
          ]

          AGRO_NEW = [
              "doc_b64 = str(",
              '    doc.get("doc_image_b64") or ""',
              ")",
              "selfie_b64 = str(",
              '    doc.get("selfie_image_b64") or ""',
              ")",
              "if not doc_b64 or not selfie_b64:",
              "    if is_json:",
              "        raise ValueError(",
              '            "por ley se requiere"',
              '            " doc_image_b64 y selfie_image_b64"',
              "        )",
              "    self._html(",
              "        400,",
              "        _page(",
              '            "AGRO - Registro",',
              '            "<h1>Faltan las fotos</h1>"',
              '            "<p>Por ley el registro requiere"',
              '            " foto del documento y selfie en vivo.</p>"',
              "            \"<a href='/agro/home'>\"",
              '            "<button>Volver</button></a>",',
              "        ),",
              "    )",
              "    return",
              "",
              "def _prd_find_zid(obj):",
              "    if isinstance(obj, dict):",
              "        for k, v in obj.items():",
              "            if (",
              '                str(k).lower() == "zid"',
              "                and isinstance(v, str)",
              '                and v.startswith("ZID-")',
              "            ):",
              "                return v",
              "        for v in obj.values():",
              "            found = _prd_find_zid(v)",
              "            if found is not None:",
              "                return found",
              "    elif isinstance(obj, list):",
              "        for item in obj:",
              "            found = _prd_find_zid(item)",
              "            if found is not None:",
              "                return found",
              "    return None",
              "zid: str | None = None",
              "synced = False",
              "ok, data, _error = (",
              "    link.enroll_producer(",
              "        display_name=name,",
              "        doc_image_b64=doc_b64,",
              "        selfie_image_b64=selfie_b64,",
              "    )",
              ")",
              "if not ok:",
              "    if is_json:",
              "        raise ValueError(",
              '            "registro rechazado: " + str(_error)',
              "        )",
              "    self._html(",
              "        400,",
              "        _page(",
              '            "AGRO - Registro rechazado",',
              '            "<h1>Registro rechazado</h1>"',
              '            "<p>" + str(_error) + "</p>"',
              "            \"<a href='/agro/home'>\"",
              '            "<button>Volver</button></a>",',
              "        ),",
              "    )",
              "    return",
              "if data is not None:",
              "    zid = _prd_find_zid(data)",
              "    synced = zid is not None",
          ]

          agro_lines = read_lines(P_AGRO)
          if "link.register_producer_zid(" in to_text(agro_lines):
              agro_lines = replace_seq(agro_lines, AGRO_SEQ, AGRO_NEW, P_AGRO, "producers-api-route")
          else:
              print("SKIP AGRO (already fixed)")

          sem_link_lines = read_lines(P_SEM_LINK)
          if "def person_register_blocked" not in to_text(sem_link_lines):
              anchors = [i for i, l in enumerate(sem_link_lines) if l.strip().startswith("def complete_trust(")]
              if len(anchors) != 1:
                  fail("semilla link anchor def complete_trust count %d (need 1)" % len(anchors))
              ind = leading(sem_link_lines[anchors[0]])
              BLOCKER = [
                  "def person_register_blocked(",
                  "    self, *args, **kwargs",
                  ") -> tuple[bool, dict | None, str | None]:",
                  "    \"\"\"LAW: person registration requires",
                  "    biometric enrollment. Legacy calls are",
                  "    rejected here, no network round-trip.\"\"\"",
                  "    raise ValueError(",
                  '        "registro de persona requiere biometria:"',
                  '        " use el registro con documento y selfie"',
                  "    )",
                  "",
                  "",
              ]
              new = [(ind + t + "\n") if t else "\n" for t in BLOCKER]
              sem_link_lines = sem_link_lines[: anchors[0]] + new + sem_link_lines[anchors[0]:]
              print("INSERTED person_register_blocked in semilla_link")
          else:
              print("SKIP semilla_link blocker (already present)")

          SEM_SEQ = [
              "zid: str | None = None",
              'if role == "alumno":',
              "ok, data, _error = (",
              "link.register_person(",
              "name",
              ")",
              ")",
              "if (",
              "ok",
              "and data is not None",
              "):",
              "zid = str(",
              'data.get("zid")',
              ")",
              "link.record_milestone(",
              "zid,",
              '"inscripcion",',
              "name,",
              ")",
          ]

          sem_lines = read_lines(P_SEM)
          if find_seq(sem_lines, SEM_SEQ):
              sem_lines = delete_seq(sem_lines, SEM_SEQ, P_SEM, "semilla-remnant")
          else:
              print("SKIP semilla-remnant (already deleted)")

          occ = [i for i, l in enumerate(sem_lines) if "link.register_person(" in l]
          if occ:
              print("FOUND %d legacy person-register call site(s):" % len(occ))
              for i in occ:
                  print("  --- context around line %d ---" % (i + 1))
                  for k in range(max(0, i - 10), min(len(sem_lines), i + 12)):
                      mark = ">>" if k == i else "  "
                      print("  %s %4d| %s" % (mark, k + 1, sem_lines[k].rstrip()))
              for i in occ:
                  sem_lines[i] = sem_lines[i].replace(
                      "link.register_person(",
                      "link.person_register_blocked(",
                  )
              print("NEUTRALIZED %d legacy call site(s)" % len(occ))
          else:
              print("NO legacy person-register call sites remain")

          render_txt = Path(P_RENDER).read_text(encoding="utf-8")
          if "/tmp/zyra-data" in render_txt:
              render_txt = render_txt.replace(
                  '"/tmp/zyra-data"',
                  '"/opt/render/project/src/data"',
              )
              Path(P_RENDER).write_text(render_txt, encoding="utf-8")
              print("FIXED render.yaml data dir")
          else:
              print("SKIP render.yaml (already fixed)")

          safe_compile(to_text(agro_lines), P_AGRO)
          safe_compile(to_text(sem_lines), P_SEM)
          safe_compile(to_text(sem_link_lines), P_SEM_LINK)

          Path(P_AGRO).write_text(to_text(agro_lines), encoding="utf-8")
          Path(P_SEM).write_text(to_text(sem_lines), encoding="utf-8")
          Path(P_SEM_LINK).write_text(to_text(sem_link_lines), encoding="utf-8")
          print("WROTE: 4 files")

          agro_txt = Path(P_AGRO).read_text(encoding="utf-8")
          sem_txt = Path(P_SEM).read_text(encoding="utf-8")
          sem_link_txt = Path(P_SEM_LINK).read_text(encoding="utf-8")
          if "link.register_producer_zid(" in agro_txt:
              fail("post-check: register_producer_zid still called in agro server")
          if "link.enroll_producer(" not in agro_txt:
              fail("post-check: enroll_producer missing in agro server")
          if "link.register_person(" in sem_txt:
              fail("post-check: register_person still called in semilla server")
          if "link.person_register_blocked(" not in sem_txt:
              fail("post-check: blocked call missing in semilla server")
          if "def person_register_blocked" not in sem_link_txt:
              fail("post-check: blocker method missing in semilla link")
          if "link.enroll_person(" not in sem_txt:
              fail("post-check: enroll_person missing in semilla server")
          if "link.register_organization(" not in sem_txt:
              fail("post-check: register_organization missing in semilla server")
          if "/tmp/zyra-data" in Path(P_RENDER).read_text(encoding="utf-8"):
              fail("post-check: render.yaml still uses /tmp")

          print("ALL PATCHES APPLIED OK")
          PYEOF

      - name: Syntax check
        run: |
          python3 -m py_compile apps/agro/server.py apps/semilla/server.py apps/semilla/services/semilla_link.py
          echo "SYNTAX OK"

      - name: Network biometrics self-test
        run: python3 -m shared_engines.security.biometrics -v

      - name: Commit and push (autostash + retry)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git status --porcelain | head -20
          git add apps/agro/server.py apps/semilla/server.py apps/semilla/services/semilla_link.py render.yaml
          if git diff --cached --quiet; then
            echo "No changes (already patched)."
          else
            git commit -m "AGRO producers API + SEMILLA: enforce biometric enrollment everywhere; render data dir durable" -m "AGRO /agro/producers requires doc+selfie via enroll_producer (JSON and HTML). SEMILLA: remnant deleted; remaining legacy call sites neutralized via person_register_blocked. render.yaml: durable data dir."
          fi
          git pull --rebase --autostash origin main || {
            echo "rebase retry with stash"
            git stash -u || true
            git pull --rebase origin main || true
            git stash pop || true
          }
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK (attempt $i)"
              exit 0
            fi
            echo "push failed, retry $i"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED after 3 attempts"
          exit 1
