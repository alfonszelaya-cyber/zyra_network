name: ZYRA AXIS Block C

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add missing uuid import
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/axis/life_history/"
              "judicial_automation.py"
          )
          src = path.read_text(encoding="utf-8")

          if "import uuid" in src:
              print("RESULT: already has uuid")
          else:
              anchor = "from __future__ import annotations\n"
              assert anchor in src, "anchor missing"
              fixed = src.replace(
                  anchor,
                  anchor + "\nimport uuid\n",
                  1,
              )
              path.write_text(fixed, encoding="utf-8")
              print("RESULT: UUID IMPORT ADDED")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("SYNTAX OK")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/3 Judicial automation tests (5 E2E)
        run: python -m pytest apps/axis/life_history/tests/test_judicial_automation.py -v

      - name: 2/3 Life History regression
        run: |
          python -m pytest apps/axis/life_history/tests/test_outbox_bridge.py apps/axis/life_history/tests/test_service.py apps/axis/life_history/tests/test_verification.py apps/axis/life_history/tests/test_health_link.py apps/axis/life_history/tests/test_longitudinal_screen.py apps/axis/life_history/tests/test_justice_service.py apps/axis/life_history/tests/test_security_service.py apps/axis/life_history/tests/test_ops_server.py apps/axis/life_history/tests/test_clearance_ops.py apps/axis/life_history/tests/test_concurrency_recovery.py -q

      - name: 3/3 Full regression
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m pytest apps/axis/tests -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/axis/life_history/judicial_automation.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "judicial: add missing uuid import"
            git push
          fi
