name: ZYRA LABORATORIO - Lote 8Ae (Fase 8 completa - conexion de escaneo corregida)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar y aplicar lote (Reglas 1-8)
        run: |
          set -e
          RESUMEN_EARLY="${GITHUB_STEP_SUMMARY:-}"
          MANIFEST=/tmp/lab_lote_8a.manifest
          : > "$MANIFEST"
          fallar_early() {
            msg="$1"
            echo "**FALLO TEMPRANO: $msg**" >> "$RESUMEN_EARLY" 2>/dev/null || true
            echo "FALLO: $msg"
            exit 1
          }
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          reemplazar_verificado() {
            ruta="$1"; firma="$2"
            if [ ! -s "$ruta" ]; then
              fallar_early "$ruta no existe para reemplazo verificado"
            fi
            if ! grep -qF "$firma" "$ruta"; then
              fallar_early "firma ausente en $ruta (contenido inesperado, NO se toca)"
            fi
            cat > "$ruta"
            echo "REEMPLAZADO-VERIFICADO: $ruta"
            echo "$ruta|REEMPLAZADO" >> "$MANIFEST"
          }
          mkdir -p apps/laboratorio/shared/enums apps/laboratorio/domain apps/laboratorio/infrastructure/persistence apps/laboratorio/infrastructure/repositories apps/laboratorio/infrastructure/providers apps/laboratorio/application/use_cases apps/laboratorio/application/handlers apps/laboratorio/routers/api apps/laboratorio/modules apps/laboratorio/templates/dashboards
          echo "=== ANCLAS: app.py y service_registry.py (CONEXION DE ESCANEO CORREGIDA) ==="
          python3 - << 'PYANCHOR'
          from pathlib import Path
          p = Path("apps/laboratorio/infrastructure/api/app.py")
          codigo = p.read_text(encoding="utf-8")
          ancla1 = "from apps.laboratorio.routers.public.health import registrar_rutas as registrar_salud"
          ancla2 = "registrar_salud(app)"
          assert ancla1 in codigo and ancla2 in codigo, "anclas ausentes en app.py"
          cambios = []
          if "conectar_proyeccion(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.projection_module import conectar as conectar_proyeccion")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_proyeccion(app)")
              cambios.append("projection")
          if "conectar_salidas(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.display_module import conectar as conectar_salidas")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_salidas(app)")
              cambios.append("display")
          p.write_text(codigo, encoding="utf-8")
          print("app.py:", ", ".join(cambios) if cambios else "ya estaba")
          p2 = Path("apps/laboratorio/registry/services/service_registry.py")
          c2 = p2.read_text(encoding="utf-8")
          a_imp = "from apps.laboratorio.application.handlers.export_handler import ManejadorExportaciones"
          assert a_imp in c2, "ancla import ausente en service_registry.py"
          if "manejador_proyeccion" not in c2:
              nuevos_imp = (
                  "from apps.laboratorio.application.handlers.projection_handler import ManejadorProyeccion\n"
                  "from apps.laboratorio.application.handlers.display_handler import ManejadorSalidas\n"
                  "from apps.laboratorio.application.handlers.scan_handler import ManejadorEscaneo\n"
                  "from apps.laboratorio.application.use_cases.projection import (\n"
                  "    CasoRegistrarSuperficie,\n"
                  "    CasoCalibrarSuperficie,\n"
                  "    CasoProyectarEnVivo,\n"
                  ")\n"
                  "from apps.laboratorio.application.use_cases.displays import (\n"
                  "    CasoRegistrarSalida,\n"
                  "    CasoProbarSalida,\n"
                  ")\n"
                  "from apps.laboratorio.application.use_cases.scan_photo import (\n"
                  "    CasoAvatarDesdeFoto,\n"
                  "    CasoEscanearFoto,\n"
                  ")\n"
                  "from apps.laboratorio.infrastructure.providers.calibrator_manual import CalibradorManual\n"
                  "from apps.laboratorio.infrastructure.providers.scanner_photo import MotorEscaneoFoto\n"
                  "from apps.laboratorio.infrastructure.providers.avatar_engine import MotorAvatar\n"
                  "from apps.laboratorio.infrastructure.persistence.surface_store import SurfaceStore\n"
                  "from apps.laboratorio.infrastructure.persistence.display_store import DisplayStore\n"
                  "from apps.laboratorio.infrastructure.repositories.surface_repository import SurfaceRepository\n"
                  "from apps.laboratorio.infrastructure.repositories.display_repository import DisplayRepository\n"
              )
              c2 = c2.replace(a_imp, nuevos_imp + a_imp)
              a_reg = '    c.obtener("suscriptor_zyra")'
              assert a_reg in c2, "ancla registro ausente"
              nuevos_reg = (
                  '    c.registrar("surface_store", lambda _c: SurfaceStore(conexion))\n'
                  '    c.registrar("display_store", lambda _c: DisplayStore(conexion))\n'
                  '    c.registrar("repo_superficies", lambda _c: SurfaceRepository(_c.obtener("surface_store")))\n'
                  '    c.registrar("repo_salidas", lambda _c: DisplayRepository(_c.obtener("display_store")))\n'
                  '    c.registrar("calibrador", lambda _c: CalibradorManual())\n'
                  '    c.registrar("motor_scanner", lambda _c: MotorEscaneoFoto())\n'
                  '    c.registrar("motor_avatar", lambda _c: MotorAvatar())\n'
                  '    c.registrar("caso_registrar_superficie", lambda _c: CasoRegistrarSuperficie(_c.obtener("repo_superficies"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_calibrar", lambda _c: CasoCalibrarSuperficie(_c.obtener("repo_superficies"), _c.obtener("calibrador"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_proyectar", lambda _c: CasoProyectarEnVivo(_c.obtener("repo_superficies"), _c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_registrar_salida", lambda _c: CasoRegistrarSalida(_c.obtener("repo_salidas"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_probar_salida", lambda _c: CasoProbarSalida(_c.obtener("repo_salidas"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_escanear_foto", lambda _c: CasoEscanearFoto(_c.obtener("repo_inputs"), _c.obtener("repo_proyectos"), _c.obtener("motor_scanner"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_avatar_foto", lambda _c: CasoAvatarDesdeFoto(_c.obtener("repo_inputs"), _c.obtener("repo_proyectos"), _c.obtener("caso_crear_activo"), _c.obtener("motor_avatar"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_escaneo", lambda _c: ManejadorEscaneo(_c.obtener("caso_escanear_foto"), _c.obtener("caso_avatar_foto")))\n'
                  '    c.registrar("manejador_proyeccion", lambda _c: ManejadorProyeccion(_c.obtener("caso_registrar_superficie"), _c.obtener("caso_calibrar"), _c.obtener("caso_proyectar"), _c.obtener("repo_superficies"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_salidas", lambda _c: ManejadorSalidas(_c.obtener("caso_registrar_salida"), _c.obtener("caso_probar_salida"), _c.obtener("repo_salidas"), _c.obtener("auditoria_sink")))\n'
              )
              c2 = c2.replace(a_reg, nuevos_reg + a_reg)
              vieja_warp = 'capacidades.declarar(Capacidad.PROYECCION_WARP, False, "pipeline de proyeccion llega en fase 8")'
              if vieja_warp in c2:
                  c2 = c2.replace(vieja_warp, 'capacidades.declarar(Capacidad.PROYECCION_WARP, True)')
              vieja_prof = 'capacidades.declarar(Capacidad.PROFUNDIDAD, False, "canal de profundidad llega en fase 4")'
              if vieja_prof in c2:
                  c2 = c2.replace(vieja_prof, 'capacidades.declarar(Capacidad.PROFUNDIDAD, True)')
              vieja_3d = 'capacidades.declarar(Capacidad.RENDER_3D, False, "motor 3D llega en fase 6")'
              if vieja_3d in c2:
                  c2 = c2.replace(vieja_3d, 'capacidades.declarar(Capacidad.RENDER_3D, True)')
              p2.write_text(c2, encoding="utf-8")
              print("service_registry.py ACTUALIZADO: Fase 8 + escaneo CONECTADO CORRECTAMENTE")
          else:
              print("service_registry.py: ya contenia Fase 8")
          PYANCHOR
          echo "apps/laboratorio/infrastructure/api/app.py|ACTUALIZADO" >> "$MANIFEST"
          echo "apps/laboratorio/registry/services/service_registry.py|ACTUALIZADO" >> "$MANIFEST"
          echo "=== FIX DisplayKind.validar (reemplazo verificado) ==="
          reemplazar_verificado apps/laboratorio/shared/enums/display_kind.py "class DisplayKind(str, Enum):" << 'ZYRA_EOF'
          """Destinos de salida de la Display Abstraction."""

          from enum import Enum


          class DisplayKind(str, Enum):
              """El mismo contenido puede salir por cualquiera de estos destinos."""

              PANTALLA = "pantalla"
              PROYECTOR = "proyector"
              HOLOGRAFICO = "holografico"
              LIGHT_FIELD = "light_field"
              AR = "ar"
              VR = "vr"
              FUTURO = "futuro"

              @classmethod
              def validar(cls, valor: str) -> "DisplayKind":
                  """Convierte y valida un texto a DisplayKind."""
                  if not isinstance(valor, str):
                      raise ValueError("El tipo de salida debe ser texto.")
                  limpio = valor.strip().lower()
                  try:
                      return cls(limpio)
                  except ValueError:
                      validos = ", ".join(t.value for t in cls)
                      raise ValueError(
                          "Tipo de salida invalido: " + repr(valor)
                          + ". Validos: " + validos
                      )
          ZYRA_EOF
          echo "=== FIX CRITICO: renderer_raster buffer exacto (reemplazo verificado) ==="
          reemplazar_verificado apps/laboratorio/infrastructure/providers/renderer_raster.py "class RasterizadorBase" << 'ZYRA_EOF'
          """Motor raster: PNG REAL con buffer exacto y canal de PROFUNDIDAD."""
          import math

          from apps.laboratorio.domain.scene import Escena3D
          from apps.laboratorio.infrastructure.providers.font_bitmap import (
              ANCHO as GLIFO_ANCHO,
              ALTO as GLIFO_ALTO,
              texto_a_lineas,
          )
          from apps.laboratorio.infrastructure.providers.png_encoder import (
              encode_png_gray,
              encode_png_rgb,
          )
          from apps.laboratorio.shared.adapters.engine_adapter import AdaptadorMotor
          from apps.laboratorio.shared.exceptions.render_errors import (
              EscenaVaciaError,
              RenderFallidoError,
          )
          from apps.laboratorio.shared.interfaces.renderer import Renderer, ResultadoRender

          PROFUNDIDAD_POR_CAPA = {"fondo": 60, "medio": 150, "frente": 255}


          def hex_a_rgb(color: str) -> tuple:
              color = str(color).strip()
              if not color.startswith("#") or len(color) != 7:
                  raise RenderFallidoError("Color invalido: " + repr(color))
              try:
                  return (int(color[1:3], 16), int(color[3:5], 16), int(color[5:7], 16))
              except ValueError as exc:
                  raise RenderFallidoError("Color invalido: " + repr(color)) from exc


          class RasterizadorBase:
              """Lienzo RGB (buffer w*h*3 exacto) + profundidad w*h."""

              def __init__(self, ancho: int, alto: int, color_fondo: tuple):
                  if ancho < 16 or alto < 16:
                      raise RenderFallidoError("Dimensiones del lienzo invalidas.")
                  self.w = int(ancho)
                  self.h = int(alto)
                  self.buf = bytearray(bytes(color_fondo) * (self.w * self.h * 3))
                  self.depth = bytearray(self.w * self.h)

              def _clip(self, x, y, w, h):
                  x0 = max(0, int(x))
                  y0 = max(0, int(y))
                  x1 = min(self.w, int(x + w))
                  y1 = min(self.h, int(y + h))
                  return x0, y0, x1, y1

              def rect(self, x, y, w, h, color: tuple, depth_val: int) -> None:
                  x0, y0, x1, y1 = self._clip(x, y, w, h)
                  if x1 <= x0 or y1 <= y0:
                      return
                  fila = bytes(color) * (x1 - x0)
                  for yy in range(y0, y1):
                      base = yy * self.w
                      self.buf[(base + x0) * 3:(base + x1) * 3] = fila
                      self.depth[base + x0:base + x1] = bytes([depth_val]) * (x1 - x0)

              def circle(self, cx, cy, r, color: tuple, depth_val: int) -> None:
                  if r <= 0:
                      return
                  r = int(r)
                  for dy in range(-r, r + 1):
                      yy = int(cy) + dy
                      if yy < 0 or yy >= self.h:
                          continue
                      half = int(math.sqrt(max(0.0, r * r - dy * dy)))
                      x0 = max(0, int(cx) - half)
                      x1 = min(self.w, int(cx) + half + 1)
                      if x1 <= x0:
                          continue
                      base = yy * self.w
                      self.buf[(base + x0) * 3:(base + x1) * 3] = bytes(color) * (x1 - x0)
                      self.depth[base + x0:base + x1] = bytes([depth_val]) * (x1 - x0)

              def texto(self, x, y, contenido: str, color: tuple, depth_val: int, escala: int = 2) -> None:
                  if escala < 1:
                      raise RenderFallidoError("Escala de texto invalida.")
                  px = x
                  for caracter, patrones in texto_a_lineas(contenido):
                      for fy, fila_bits in enumerate(patrones):
                          for fx in range(GLIFO_ANCHO):
                              if not (fila_bits >> (GLIFO_ANCHO - 1 - fx)) & 1:
                                  continue
                              self.rect(
                                  px + fx * escala, y + fy * escala,
                                  escala, escala, color, depth_val,
                              )
                      px += (GLIFO_ANCHO + 1) * escala
                      if px > self.w:
                          break

              def imagen_png(self) -> bytes:
                  return encode_png_rgb(self.w, self.h, bytes(self.buf))

              def profundidad_png(self) -> bytes:
                  return encode_png_gray(self.w, self.h, bytes(self.depth))


          class MotorRenderRaster(AdaptadorMotor, Renderer):
              """Calidad ALTA: PNG con relleno solido + profundidad."""

              def __init__(self):
                  AdaptadorMotor.__init__(self, "renderer_raster", "renderer", "1.1.0")
                  self.marcar_disponible()

              def capacidades(self) -> dict:
                  return {
                      "calidades": ["alta"],
                      "profundidad": True,
                      "formato": "png",
                      "texto": "fuente bitmap 3x5 real",
                  }

              def renderizar(self, escena, opciones) -> ResultadoRender:
                  if not isinstance(escena, Escena3D):
                      raise RenderFallidoError("Se esperaba una Escena3D.")
                  if not escena.es_renderizable:
                      raise EscenaVaciaError("La escena no tiene objetos.")
                  ancho = int(opciones.get("ancho", escena.ancho))
                  alto = int(opciones.get("alto", escena.alto))
                  lienzo = RasterizadorBase(ancho, alto, (15, 23, 42))
                  sx = ancho / escena.ancho
                  sy = alto / escena.alto
                  escala_texto = max(2, int(round(min(sx, sy) * 2)))
                  for capa in ("fondo", "medio", "frente"):
                      depth_val = PROFUNDIDAD_POR_CAPA[capa]
                      for obj in escena.objetos:
                          if obj.get("capa", "medio") != capa:
                              continue
                          color = hex_a_rgb(obj["color"])
                          if obj["forma"] == "rect":
                              lienzo.rect(
                                  obj["x"] * sx, obj["y"] * sy,
                                  obj["w"] * sx, obj["h"] * sy, color, depth_val,
                              )
                          elif obj["forma"] == "circle":
                              lienzo.circle(
                                  obj["cx"] * sx, obj["cy"] * sy,
                                  obj["r"] * min(sx, sy), color, depth_val,
                              )
                          else:
                              lienzo.texto(
                                  obj["x"] * sx, obj["y"] * sy,
                                  obj["contenido"], color, depth_val, escala_texto,
                              )
                  return ResultadoRender(
                      imagen_bytes=lienzo.imagen_png(),
                      profundidad_bytes=lienzo.profundidad_png(),
                      ancho=ancho,
                      alto=alto,
                      metadata={"formato": "png", "motor": "renderer_raster", "profundidad": True},
                  )
          ZYRA_EOF
          echo "=== DOMINIO SUPERFICIE + SALIDA ==="
          escribir apps/laboratorio/domain/surface.py << 'ZYRA_EOF'
          """Superficie proyectable: pared, piso, fachada, maqueta."""
          from dataclasses import dataclass, field

          from apps.laboratorio.shared.enums.surface_kind import SurfaceKind
          from apps.laboratorio.shared.models.base import EntidadBase

          MAX_COORD = 100000


          @dataclass
          class Superficie(EntidadBase):
              """Una superficie fisica donde se puede proyectar."""

              prefijo_id = "sup"

              propietario_zid: str = ""
              nombre: str = ""
              tipo: SurfaceKind = SurfaceKind.PARED
              corners: list = field(default_factory=list)
              homografia: list = field(default_factory=list)
              calibrada: bool = False

              def __post_init__(self):
                  if not self.propietario_zid.strip():
                      raise ValueError("La superficie requiere propietario ZID.")
                  if not self.nombre.strip():
                      raise ValueError("La superficie requiere nombre.")
                  if not isinstance(self.tipo, SurfaceKind):
                      raise ValueError("Tipo de superficie invalido.")
                  self.propietario_zid = self.propietario_zid.strip()
                  self.nombre = self.nombre.strip()

              def definir_corners(self, corners) -> list:
                  """Valida y guarda las 4 esquinas del cuadrilatero."""
                  if self.calibrada:
                      raise ValueError("La superficie ya esta calibrada.")
                  if not isinstance(corners, list) or len(corners) != 4:
                      raise ValueError("Se requieren exactamente 4 esquinas.")
                  limpias = []
                  for punto in corners:
                      if not isinstance(punto, (list, tuple)) or len(punto) != 2:
                          raise ValueError("Cada esquina debe ser [x, y].")
                      x, y = float(punto[0]), float(punto[1])
                      if not (0.0 <= x <= MAX_COORD and 0.0 <= y <= MAX_COORD):
                          raise ValueError("Esquina fuera de rango 0-100000.")
                      limpias.append([round(x, 3), round(y, 3)])
                  self.corners = limpias
                  self.marcar_actualizacion()
                  return self.corners

              def marcar_calibrada(self, homografia) -> None:
                  if not isinstance(homografia, list) or len(homografia) != 9:
                      raise ValueError("La homografia debe tener 9 valores.")
                  valores = []
                  for v in homografia:
                      if isinstance(v, bool) or not isinstance(v, (int, float)):
                          raise ValueError("La homografia debe ser numerica.")
                      valores.append(round(float(v), 8))
                  self.homografia = valores
                  self.calibrada = True
                  self.marcar_actualizacion()
          ZYRA_EOF
          escribir apps/laboratorio/domain/display.py << 'ZYRA_EOF'
          """Destino de salida registrado (Ley 1: honesto)."""
          from dataclasses import dataclass

          from apps.laboratorio.shared.enums.display_kind import DisplayKind
          from apps.laboratorio.shared.models.base import EntidadBase

          KINDS_DISPONIBLES = ("pantalla", "proyector")


          @dataclass
          class DestinoSalida(EntidadBase):
              """Un destino de salida registrado por un usuario."""

              prefijo_id = "dsp"

              propietario_zid: str = ""
              nombre: str = ""
              kind: DisplayKind = DisplayKind.PANTALLA

              def __post_init__(self):
                  if not self.propietario_zid.strip():
                      raise ValueError("La salida requiere propietario ZID.")
                  if not self.nombre.strip():
                      raise ValueError("La salida requiere nombre.")
                  if not isinstance(self.kind, DisplayKind):
                      raise ValueError("Tipo de salida invalido.")
                  self.propietario_zid = self.propietario_zid.strip()
                  self.nombre = self.nombre.strip()

              @property
              def disponible(self) -> bool:
                  return self.kind.value in KINDS_DISPONIBLES

              @property
              def motivo_estado(self) -> str:
                  if self.disponible:
                      return ""
                  return "hardware " + self.kind.value + " no conectado; se activara al conectarlo"
          ZYRA_EOF
          echo "=== PNG DECODER + PATRON + CALIBRADOR + WARPER + ESCANEO + AVATAR ==="
          escribir apps/laboratorio/infrastructure/providers/png_decoder.py << 'ZYRA_EOF'
          """Decodificador PNG para formatos producidos por LABORATORIO."""
          import struct
          import zlib

          FIRMA = b"\x89PNG\r\n\x1a\n"


          def decodificar_png_rgb(datos: bytes) -> tuple:
              """Devuelve (ancho, alto, pixeles_rgb) de PNG RGB 8 bits filtro 0."""
              if not isinstance(datos, (bytes, bytearray)) or bytes(datos[:8]) != FIRMA:
                  raise ValueError("No es un PNG valido.")
              crudo = bytes(datos[8:])
              pos = 0
              ancho = alto = None
              idat = bytearray()
              while pos + 8 <= len(crudo):
                  largo = struct.unpack(">I", crudo[pos:pos + 4])[0]
                  tipo = crudo[pos + 4:pos + 8]
                  cuerpo = crudo[pos + 8:pos + 8 + largo]
                  if tipo == b"IHDR":
                      if largo != 13:
                          raise ValueError("IHDR invalido.")
                      ancho, alto, profundidad, color_tipo = struct.unpack(
                          ">IIBB", cuerpo[:10]
                      )
                      if profundidad != 8 or color_tipo != 2:
                          raise ValueError(
                              "Solo se decodifican PNG RGB de 8 bits producidos "
                              "por LABORATORIO. La camara del navegador captura en PNG."
                          )
                  elif tipo == b"IDAT":
                      idat += cuerpo
                  elif tipo == b"IEND":
                      break
                  pos += 12 + largo
              if ancho is None or not idat:
                  raise ValueError("PNG incompleto: faltan IHDR o IDAT.")
              inflado = zlib.decompress(bytes(idat))
              paso = ancho * 3
              if len(inflado) != (paso + 1) * alto:
                  raise ValueError("Datos de imagen corruptos.")
              pixeles = bytearray(ancho * alto * 3)
              for y in range(alto):
                  base = y * (paso + 1)
                  if inflado[base] != 0:
                      raise ValueError("Filtro PNG no soportado.")
                  fila = inflado[base + 1:base + 1 + paso]
                  pixeles[y * paso:(y + 1) * paso] = fila
              return ancho, alto, bytes(pixeles)
          ZYRA_EOF
          escribir apps/laboratorio/infrastructure/providers/test_pattern.py << 'ZYRA_EOF'
          """Patron de prueba real para destinos de salida."""
          from apps.laboratorio.infrastructure.providers.png_encoder import encode_png_rgb

          BARRAS = (
              (229, 57, 53), (240, 196, 32), (67, 160, 71),
              (30, 99, 235), (245, 245, 245),
          )


          def patron_prueba(ancho: int, alto: int) -> bytes:
              """Genera un PNG de barras de color con rejilla blanca."""
              if ancho < 16 or alto < 16:
                  raise ValueError("Dimensiones del patron invalidas.")
              if ancho > 2048 or alto > 2048:
                  raise ValueError("El patron maximo es 2048x2048.")
              filas = bytearray()
              for y in range(alto):
                  for x in range(ancho):
                      banda = min(len(BARRAS) - 1, x * len(BARRAS) // ancho)
                      r, g, b = BARRAS[banda]
                      if x % 40 < 2 or y % 40 < 2:
                          r, g, b = 255, 255, 255
                      filas += bytes((r, g, b))
              return encode_png_rgb(ancho, alto, bytes(filas))
