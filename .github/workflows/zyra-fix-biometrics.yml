name: "ZYRA AUDIT NEXO y conexiones (solo lectura)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auditoria NEXO y conexiones
        run: |
          python3 << 'PYEOF'
          import ast, os, pathlib, re, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def sec(t):
              out("")
              out("## " + t)
          def lim(items, n=120):
              items = list(items)
              if len(items) <= n:
                  return items
              return items[:n] + ["... y " + str(len(items) - n) + " mas"]

          def info_py(p):
              d = {"path": str(p), "size": 0, "state": "code",
                   "classes": [], "funcs": [], "imports": []}
              try:
                  d["size"] = p.stat().st_size
                  src = p.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  d["state"] = "unreadable"
                  return d
              if len(src.strip()) <= 1:
                  d["state"] = "empty"
                  return d
              try:
                  tree = ast.parse(src)
              except Exception:
                  d["state"] = "syntax_error"
                  return d
              for n in ast.walk(tree):
                  if isinstance(n, ast.ClassDef):
                      d["classes"].append(n.name)
                  elif isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      d["funcs"].append(n.name)
                  elif isinstance(n, ast.ImportFrom):
                      if n.module:
                          d["imports"].append(n.module)
                  elif isinstance(n, ast.Import):
                      for a in n.names:
                          d["imports"].append(a.name)
              return d

          NX = pathlib.Path("apps/nexo")
          SE = pathlib.Path("shared_engines")

          try:
              sec("0. MAPA TOP-LEVEL DEL REPO")
              for base in ["apps", "apps/nexo", "shared_engines",
                           "runtime", "integrations"]:
                  p = pathlib.Path(base)
                  if p.exists():
                      items = sorted([x.name for x in p.iterdir()])
                      out("- **" + base + "/** (" + str(len(items))
                          + " entradas): " + ", ".join(lim(items, 40)))
                  else:
                      out("- **" + base + "/** NO EXISTE")
          except Exception:
              out("ERROR seccion 0: " + traceback.format_exc())

          try:
              sec("1. NUCLEO NEXO (archivos raiz clave)")
              claves = ["server.py", "nexo_store.py", "nexo_link.py",
                        "network_client.py", "main.py"]
              for name in claves:
                  hits = []
                  if pathlib.Path(name).exists():
                      hits.append(pathlib.Path(name))
                  if NX.exists():
                      hits.extend(sorted(NX.rglob(name)))
                  if not hits:
                      out("- **" + name + ": NO ENCONTRADO**")
                      continue
                  for h in hits[:3]:
                      d = info_py(h)
                      out("- **" + d["path"] + "** (" + str(d["size"])
                          + " bytes, estado=" + d["state"]
                          + ", clases=" + str(len(d["classes"]))
                          + ", funciones=" + str(len(d["funcs"])) + ")"
                          + (" — clases: "
                             + ", ".join(d["classes"][:10])
                             if d["classes"] else ""))
          except Exception:
              out("ERROR seccion 1: " + traceback.format_exc())

          try:
              sec("2. DOMINIOS apps/nexo/domain (que hay y que falta)")
              dom = NX / "domain"
              if dom.exists():
                  for carp in sorted(dom.iterdir()):
                      if not carp.is_dir():
                          continue
                      files = [info_py(f) for f in sorted(carp.rglob("*.py"))]
                      con_codigo = [f for f in files
                                    if f["state"] == "code"]
                      vacios = [f for f in files if f["state"] == "empty"]
                      rotos = [f for f in files
                               if f["state"] == "syntax_error"]
                      clases = []
                      for f in con_codigo:
                          clases.extend(f["classes"])
                      out("- **" + carp.name + "**: archivos="
                          + str(len(files)) + " | con_codigo="
                          + str(len(con_codigo)) + " | vacios="
                          + str(len(vacios)) + " | syntax_error="
                          + str(len(rotos))
                          + (" | clases: " + ", ".join(lim(clases, 12))
                             if clases else ""))
                      for v in lim(vacios, 15):
                          out("    - vacio: " + v["path"])
              else:
                  out("NO EXISTE apps/nexo/domain")
          except Exception:
              out("ERROR seccion 2: " + traceback.format_exc())

          try:
              sec("3. USE CASES apps/nexo/application (llenos vs vacios)")
              app = NX / "application"
              if app.exists():
                  for carp in sorted(app.iterdir()):
                      if not carp.is_dir():
                          continue
                      files = [info_py(f) for f in sorted(carp.rglob("*.py"))]
                      con_codigo = [f for f in files
                                    if f["state"] == "code"]
                      vacios = [f for f in files if f["state"] == "empty"]
                      out("- **" + carp.name + "**: total="
                          + str(len(files)) + " | llenos="
                          + str(len(con_codigo)) + " | vacios="
                          + str(len(vacios)))
                      for v in lim(vacios, 15):
                          out("    - vacio: " + v["path"])
              else:
                  out("NO EXISTE apps/nexo/application")
          except Exception:
              out("ERROR seccion 3: " + traceback.format_exc())

          try:
              sec("4. MODULOS apps/nexo/module")
              mod = NX / "module"
              if mod.exists():
                  files = [info_py(f) for f in sorted(mod.rglob("*.py"))]
                  for f in files:
                      out("- **" + f["path"] + "** (" + str(f["size"])
                          + " bytes, estado=" + f["state"]
                          + ", funciones=" + str(len(f["funcs"])) + ")")
              else:
                  out("NO EXISTE apps/nexo/module")
          except Exception:
              out("ERROR seccion 4: " + traceback.format_exc())

          try:
              sec("5. TESTS DE NEXO")
              tdir = NX / "tests"
              if tdir.exists():
                  total_tests = 0
                  for f in sorted(tdir.rglob("test_*.py")):
                      d = info_py(f)
                      ntest = sum(1 for x in d["funcs"]
                                  if x.startswith("test"))
                      total_tests = total_tests + ntest
                      out("- **" + f.name + "**: " + str(ntest)
                          + " tests (estado=" + d["state"] + ")")
                  out("- **TOTAL tests NEXO: " + str(total_tests) + "**")
              else:
                  out("NO EXISTE apps/nexo/tests")
              nucleo = sorted(pathlib.Path(".").rglob("test_nexo*.py"))
              for f in nucleo[:10]:
                  out("- nucleo: **" + str(f) + "**")
          except Exception:
              out("ERROR seccion 5: " + traceback.format_exc())

          try:
              sec("6. CONEXIONES NEXO -> shared_engines (que motores usa YA)")
              uso = {}
              for f in sorted(NX.rglob("*.py")):
                  d = info_py(f)
                  if d["state"] != "code":
                      continue
                  for imp in d["imports"]:
                      if imp.startswith("shared_engines"):
                          partes = imp.split("/")
                          mod = imp.replace("/", ".")
                          partes2 = mod.split(".")
                          if len(partes2) >= 2:
                              clave = partes2[0] + "." + partes2[1]
                          else:
                              clave = mod
                          uso.setdefault(clave, set()).add(d["path"])
              if uso:
                  for k in sorted(uso):
                      out("- **" + k + "** <- usado por "
                          + str(len(uso[k])) + " archivos de nexo")
              else:
                  out("- NINGUNA conexion directa a shared_engines")
          except Exception:
              out("ERROR seccion 6: " + traceback.format_exc())

          try:
              sec("7. CONEXIONES A LA RED (nexo_link, bridge, eventos)")
              patrones = ["nexo_link", "network_client", "interapp",
                          "caps", "bridge", "apps.register",
                          "documents/seal", "history/append",
                          "trust/complete"]
              for pat in patrones:
                  count = 0
                  ejemplos = []
                  for f in sorted(NX.rglob("*.py")):
                      try:
                          txt = f.read_text(encoding="utf-8",
                                            errors="replace")
                      except Exception:
                          continue
                      c = txt.count(pat)
                      if c > 0:
                          count = count + 1
                          if len(ejemplos) < 3:
                              ejemplos.append(str(f))
                  out("- **" + pat + "**: presente en " + str(count)
                      + " archivos"
                      + (" (ej: " + ", ".join(ejemplos) + ")"
                         if ejemplos else ""))
          except Exception:
              out("ERROR seccion 7: " + traceback.format_exc())

          try:
              sec("8. RUTAS HTTP DEL SERVER (como funciona el server)")
              candidatos = []
              if pathlib.Path("server.py").exists():
                  candidatos.append(pathlib.Path("server.py"))
              if NX.exists():
                  candidatos.extend(sorted(NX.rglob("server.py")))
              rutas = []
              for sv in candidatos[:2]:
                  txt = sv.read_text(encoding="utf-8", errors="replace")
                  encontradas = re.findall(
                      r'[\'"](/[\w\-/\{\}\.:]+)[\'"]', txt)
                  unicas = sorted(set(encontradas))
                  out("- server: **" + str(sv) + "** — "
                      + str(len(unicas)) + " rutas unicas")
                  for r in lim(unicas, 80):
                      out("    - " + r)
                  m = [r for r in unicas if "nexo" in r.lower()]
                  out("- **rutas con nexo: " + str(len(m)) + "**")
                  for r in m[:40]:
                      out("    - " + r)
              if not candidatos:
                  out("- server.py NO ENCONTRADO en raiz ni en apps/nexo")
          except Exception:
              out("ERROR seccion 8: " + traceback.format_exc())

          try:
              sec("9. EVENTOS NEXO_* (cartero)")
              eventos = set()
              for f in sorted(NX.rglob("*.py")):
                  try:
                      txt = f.read_text(encoding="utf-8",
                                        errors="replace")
                  except Exception:
                      continue
                  for m in re.findall(r"NEXO_[A-Z_]+", txt):
                      eventos.add(m)
              out("- eventos NEXO_* encontrados en apps/nexo: "
                  + str(len(eventos)))
              for e in lim(sorted(eventos), 40):
                  out("    - " + e)
          except Exception:
              out("ERROR seccion 9: " + traceback.format_exc())

          try:
              sec("10. INVENTARIO shared_engines (motores disponibles para conectar)")
              if SE.exists():
                  for carp in sorted(SE.iterdir()):
                      if not carp.is_dir():
                          continue
                      files = [info_py(f) for f in sorted(carp.rglob("*.py"))]
                      con_codigo = [f for f in files
                                    if f["state"] == "code"]
                      clases = []
                      for f in con_codigo:
                          clases.extend(f["classes"])
                      out("- **shared_engines/" + carp.name + "**: codigo="
                          + str(len(con_codigo)) + " | vacios="
                          + str(len([f for f in files
                                     if f["state"] == "empty"]))
                          + (" | clases: " + ", ".join(lim(clases, 8))
                             if clases else ""))
              else:
                  out("NO EXISTE shared_engines")
          except Exception:
              out("ERROR seccion 10: " + traceback.format_exc())

          try:
              sec("11. ARCHIVOS VACIOS PENDIENTES EN NEXO (total)")
              vacios = []
              for f in sorted(NX.rglob("*.py")):
                  d = info_py(f)
                  if d["state"] == "empty":
                      vacios.append(d["path"])
              out("- **total vacios en apps/nexo: "
                  + str(len(vacios)) + "**")
              for v in lim(vacios, 100):
                  out("    - " + v)
          except Exception:
              out("ERROR seccion 11: " + traceback.format_exc())

          try:
              sec("12. CONCLUSION NUMERICA")
              dom = NX / "domain"
              n_dom = 0
              n_dom_llenos = 0
              if dom.exists():
                  for carp in dom.iterdir():
                      if carp.is_dir():
                          n_dom = n_dom + 1
                          files = list(carp.rglob("*.py"))
                          if any(f.stat().st_size > 1 for f in files):
                              n_dom_llenos = n_dom_llenos + 1
              app = NX / "application"
              n_uc = 0
              n_uc_llenos = 0
              if app.exists():
                  for carp in app.iterdir():
                      if carp.is_dir():
                          n_uc = n_uc + 1
                          files = list(carp.rglob("*.py"))
                          if any(f.stat().st_size > 1 for f in files):
                              n_uc_llenos = n_uc_llenos + 1
              out("- dominios en domain/: " + str(n_dom)
                  + " | con codigo: " + str(n_dom_llenos))
              out("- carpetas use_cases en application/: " + str(n_uc)
                  + " | con codigo: " + str(n_uc_llenos))
              out("- esta auditoria fue SOLO LECTURA: 0 archivos escritos, 0 commits")
              out("")
              out("**FIN AUDITORIA — pegar este Summary en el chat para el plan del punto 7**")
          except Exception:
              out("ERROR seccion 12: " + traceback.format_exc())

          out("")
          out("--- FIN ---")
          PYEOF
          echo "AUDITORIA COMPLETA (solo lectura)"
          exit 0
