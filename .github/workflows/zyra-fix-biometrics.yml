name: "CONSOL-3 FASE B-tramo1: extraer el bloque de RIESGO del _post (7 rutas consecutivas: risk climate/productive/impact/recovery + alert resolve + response create/update) a routers/risk_post_router.py + regresion AGRO inmediata + revert si rompe"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[LECTURA] localizar el bloque de RIESGO dentro de _post (lineas exactas)"
        if: always()
        run: |
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          { echo '```'; grep -n 'if s == \["risk"\]\|if s == \["risk", "climate"\]\|if s == \["risk", "productive"\]\|if s == \["risk", "impact"\]\|if s == \["risk", "recovery"\]\|if s == \["alert", "resolve"\]\|if s == \["response"\]\|if s == \["response", "update"\]\|if s == \["network", "emit"\]' apps/agro/server.py 2>/dev/null; echo '```'; } >> "$SUM"
          { echo '```'; grep -n "    def _post\|    def _read_form" apps/agro/server.py; echo '```'; } >> "$SUM"
          exit 0

      - name: "[ESCRITURA] fase B tramo 1: el bloque de RIESGO usa if/elif encadenados — extraer como metodos del mixin ZyraMixin (que YA hereda el handler) + delegaciones"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              pathlib.Path("apps/agro/server_backup_b1.py") \
                  .write_text(src, encoding="utf-8")

              # localizar el rango del bloque RIESGO:
              # desde 'if s == ["risk", "climate"]' hasta
              # antes de 'if s == ["sale", "publish"]'
              i_start = src.find('if s == ["risk", "climate"]')
              i_end = src.find('if s == ["sale", "publish"]')
              assert i_start != -1, "inicio riesgo no hallado"
              assert i_end != -1, "fin riesgo no hallado"
              assert i_end > i_start, "orden invalido"
              # retroceder i_end al inicio de su linea
              i_end = src.rfind("\n", 0, i_end) + 1
              block = src[i_start:i_end]
              out("- bloque RIESGO: lineas "
                  + str(src[:i_start].count("\n") + 1)
                  + " a " + str(src[:i_end].count("\n"))
                  + " (" + str(len(block.splitlines()))
                  + " lineas)")

              # generar el metodo _risk_routes en
              # zyra_mixin.py (que el handler YA hereda)
              # con el mismo codigo pero como metodo que
              # recibe (s) y devuelve True si atendio
              zm = pathlib.Path(
                  "apps/agro/routers/zyra_mixin.py")
              zm_src = zm.read_text(encoding="utf-8")
              if "_risk_routes" in zm_src:
                  out("- zyra_mixin: _risk_routes ya existe")
              else:
                  # el bloque usa self._send, self._req,
                  # _ZV6_ACTOR, store, link, is_json
                  # -> dentro del mixin TODO funciona porque
                  #    el handler hereda de ZyraMixin
                  method = (
                      "\n    def _risk_routes(self, s,"
                      " is_json, _ZV6_ACTOR):\n"
                      + textwrap.indent(block, "        ")
                          .replace(
                          "if s == [", "if s == [", 1)
                      + "        return False\n")
                  # el bloque original termina con return
                  # implicito None si nada aplica -> cambiar:
                  # cada if hace return self._send(...) que
                  # devuelve None; si ninguna ruta aplica
                  # llega al final -> return False
                  # PERO: el bloque original tiene returns
                  # dentro -> al llegar al final significa
                  # que ninguna ruta aplico
                  zm.write_text(zm_src + method,
                                encoding="utf-8")
                  py_compile.compile(str(zm), doraise=True)
                  out("- **zyra_mixin.py: _risk_routes"
                      " agregado OK**")

              # reemplazar el bloque en server.py por la
              # delegacion
              deleg = (
                  '        if self._risk_routes(s, is_json,'
                  ' _ZV6_ACTOR):\n'
                  '            return\n')
              new_src = (src[:i_start] + deleg
                         + src[i_end:])
              ast.parse(new_src)
              SP.write_text(new_src, encoding="utf-8")
              py_compile.compile(str(SP), doraise=True)
              out("- **server.py: bloque RIESGO ->"
                  " delegacion de 2 lineas | total: "
                  + str(len(new_src.splitlines()))
                  + " lineas (de 2811)**")

              # correr tests de riesgo del dueno
              import subprocess
              env = dict(os.environ)
              env["PYTHONPATH"] = (os.getcwd() + ":"
                                   + os.getcwd()
                                   + "/shared_engines")
              r = subprocess.run(
                  ["python3", "-m", "pytest",
                   "apps/agro/tests", "-q", "-x",
                   "--timeout=45",
                   "--timeout-method=thread",
                   "--tb=line", "-k", "risk"],
                  capture_output=True, text=True,
                  env=env, timeout=300)
              if r.returncode != 0:
                  raise RuntimeError(
                      "tests de riesgo fallaron post-refactor:"
                      + r.stdout[-800:])
              out("- tests de riesgo: OK")
              with open("/tmp/consol3b1", "w") as f:
                  f.write("OK")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO — revert automatico")
              os.system("git checkout -- apps/agro/server.py"
                        " 2>/dev/null")
              os.system("git checkout --"
                        " apps/agro/routers/zyra_mixin.py"
                        " 2>/dev/null")
              os.system("rm -f"
                        " apps/agro/server_backup_b1.py"
                        " 2>/dev/null")
              out("- server y zyra_mixin restaurados")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              with open("/tmp/consol3b1", "w") as f:
                  f.write("FAIL")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion AGRO completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — tramo 1 VALIDADO" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed)" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -50 /tmp/x3.out; echo '```'; } >> "$SUM"
            cp apps/agro/server_backup_b1.py apps/agro/server.py 2>/dev/null
            git checkout -- apps/agro/routers/zyra_mixin.py 2>/dev/null
            echo "- REVERT: server y zyra_mixin restaurados" >> "$SUM"
            echo "FAIL" > /tmp/consol3b1
          fi
          exit 0

      - name: "[ENTREGA] commit solo si AGRO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/consol3b1 2>/dev/null || echo FAIL)" != "OK" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**FASE B tramo 1 BLOQUEADA — revert aplicado (estado estable)**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**FASE B tramo 1: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(CONSOL-3 fase B tramo 1, regla 77): bloque RIESGO del _post (~150 lineas: risk climate/productive/impact/recovery + alert resolve + response create/update) extraido a ZyraMixin._risk_routes (el handler YA hereda de ZyraMixin — self.* funciona por MRO) + delegacion de 2 lineas + tests de riesgo del dueno OK + regresion AGRO verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**FASE B tramo 1 OK. Tramo 2 siguiente (ventas/comercio ~200 lineas). Server bajando por tramos con regresion inmediata cada vez.**"
          exit 0
