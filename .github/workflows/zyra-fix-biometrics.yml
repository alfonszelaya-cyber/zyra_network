name: ZYRA LABORATORIO - Lote 1A-2 (excepciones, models, helpers, constants y dominio)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar, escribir y verificar (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          echo "=== REGLA 1+2+3: AUDITORIA Y ESCRITURA SOLO EN CARPETAS EXISTENTES ==="
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO (no se toca): $ruta"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
            fi
          }
          mkdir -p apps/laboratorio/shared/exceptions apps/laboratorio/shared/models apps/laboratorio/shared/types apps/laboratorio/shared/mixins apps/laboratorio/shared/helpers apps/laboratorio/shared/value_objects apps/laboratorio/constants/permissions apps/laboratorio/constants/roles apps/laboratorio/constants/events apps/laboratorio/constants/system apps/laboratorio/constants/security apps/laboratorio/constants/business apps/laboratorio/domain
          escribir apps/laboratorio/shared/exceptions/base.py << 'ZYRA_EOF'
          """Jerarquia base de errores de LABORATORIO."""


          class LaboratorioError(Exception):
              """Error raiz de toda la aplicacion LABORATORIO."""

              codigo = "laboratorio_error"

              def __init__(self, mensaje: str, detalle: str = ""):
                  self.mensaje = mensaje
                  self.detalle = detalle
                  super().__init__(mensaje)

              def to_dict(self) -> dict:
                  """Representacion serializable del error."""
                  datos = {"error": self.codigo, "mensaje": self.mensaje}
                  if self.detalle:
                      datos["detalle"] = self.detalle
                  return datos
          ZYRA_EOF
          escribir apps/laboratorio/shared/exceptions/domain_errors.py << 'ZYRA_EOF'
          """Errores de reglas de negocio del dominio."""

          from apps.laboratorio.shared.exceptions.base import LaboratorioError


          class EntidadNoEncontradaError(LaboratorioError):
              """La entidad solicitada no existe."""

              codigo = "entidad_no_encontrada"


          class EstadoInvalidoError(LaboratorioError):
              """El estado actual no permite la operacion."""

              codigo = "estado_invalido"


          class ValorInvalidoError(LaboratorioError):
              """Un valor de dominio viola sus reglas."""

              codigo = "valor_invalido"


          class PermisoDenegadoError(LaboratorioError):
              """El usuario no tiene permiso para la operacion."""

              codigo = "permiso_denegado"
          ZYRA_EOF
          escribir apps/laboratorio/shared/exceptions/pipeline_errors.py << 'ZYRA_EOF'
          """Errores de las cadenas de trabajo (pipeline D1 y proyeccion)."""

