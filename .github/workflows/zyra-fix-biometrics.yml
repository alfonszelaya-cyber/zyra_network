name: "ZYRA MARKET (Bloque 5 v2): 005 Tiendas COMPLETO"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: zyra-market-b5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Paso 0 - detectar carpeta real 005"
        run: |
          python3 - <<'DETF'
          from pathlib import Path
          base = Path("apps/subastas/modules")
          real = None
          for d in sorted(base.iterdir()):
              if d.is_dir() and d.name.startswith("005"):
                  real = d.name
                  break
          if real is None:
              print("NO_EXISTE_CARPETA_005")
              raise SystemExit(2)
          Path("_t005.txt").write_text(real, encoding="utf-8")
          print("CARPETA 005 REAL:", real)
          DETF

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - escribir tiendas_store.py COMPLETO (store + paginas + API)"
        run: |
          TDIR=$(cat _t005.txt)
          cat > "apps/subastas/modules/$TDIR/tiendas_store.py" <<'TSF'
          """ZYRA MARKET - Modulo Tiendas (completo).

          Crear tienda, catalogo, inventario, equipo con roles,
          promociones, ventas con comision, metricas, verificacion
          de gobierno. Paginas y API incluidas. Patron join."""
          from __future__ import annotations

          import threading
          import time
          import uuid


          def _now() -> str:
              return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


          def _nid(prefix: str) -> str:
              return prefix + uuid.uuid4().hex[:10]


          STORE_ROLES = ("administrador", "vendedor")


          class TiendasStore:
              def __init__(self, db, clock) -> None:
                  self._db = db
                  self._clock = clock
                  self._lock = threading.Lock()
                  self._ensure_schema()

              def _ensure_schema(self) -> None:
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_stores ("
                      " store_id TEXT PRIMARY KEY,"
                      " owner TEXT NOT NULL,"
                      " name TEXT NOT NULL,"
                      " description TEXT,"
                      " commission REAL NOT NULL DEFAULT 5.0,"
                      " status TEXT NOT NULL,"
                      " created_at TEXT NOT NULL,"
                      " updated_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_store_members ("
                      " member_id TEXT PRIMARY KEY,"
                      " store_id TEXT NOT NULL,"
                      " account TEXT NOT NULL,"
                      " role TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_store_items ("
                      " item_id TEXT PRIMARY KEY,"
                      " store_id TEXT NOT NULL,"
                      " title TEXT NOT NULL,"
                      " price REAL NOT NULL,"
                      " stock INTEGER NOT NULL DEFAULT 0,"
                      " promo_pct REAL NOT NULL DEFAULT 0,"
                      " promo_active INTEGER NOT NULL DEFAULT 0,"
                      " created_at TEXT NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS sbs_store_sales ("
                      " sale_id TEXT PRIMARY KEY,"
                      " store_id TEXT NOT NULL,"
                      " item_id TEXT NOT NULL,"
                      " qty INTEGER NOT NULL,"
                      " total REAL NOT NULL,"
                      " commission REAL NOT NULL,"
                      " sold_by TEXT NOT NULL,"
                      " created_at TEXT NOT NULL)"
                  )

              def _run(self, sql, params=()):
                  if not params:
                      self._db.execute(sql)
                      return
                  try:
                      self._db.execute(sql, params)
                      return
                  except TypeError:
                      self._db.execute(self._inline(sql, params))

              @staticmethod
              def _inline(sql, params):
                  parts = sql.split("?")
                  if len(parts) != len(params) + 1:
                      return sql
                  assembled = parts[0]
                  for i, v in enumerate(params):
                      assembled += TiendasStore._literal(v)
                      assembled += parts[i + 1]
                  return assembled

              @staticmethod
              def _literal(value):
                  if value is None:
                      return "NULL"
                  if isinstance(value, bool):
                      return "1" if value else "0"
                  if isinstance(value, (int, float)):
                      return repr(value)
                  return "'" + str(value).replace("'", "''") + "'"

              def _rows(self, sql):
                  for name in ("query", "fetchall", "fetch_all", "fetch", "select"):
                      fn = getattr(self._db, name, None)
                      if callable(fn):
                          try:
                              rows = fn(sql)
                              if rows is not None:
                                  return list(rows)
                          except Exception:
                              continue
                  try:
                      cur = self._db.execute(sql)
                  except Exception:
                      return []
                  if cur is None:
                      return []
                  try:
                      return list(cur.fetchall())
                  except Exception:
                      return []

              @staticmethod
              def _field(row, key, index):
                  if isinstance(row, dict):
                      return row.get(key)
                  try:
                      return row[index]
                  except Exception:
                      return None

              @staticmethod
              def _req(value, name):
                  text = str(value or "").strip()
                  if not text:
                      raise ValueError("%s es obligatorio" % name)
                  return text

              def _store_row(self, store_id):
                  rows = self._rows(
                      "SELECT store_id, owner, name, description, commission,"
                      " status, created_at, updated_at FROM sbs_stores"
                      " WHERE store_id = " + self._literal(store_id)
                  )
                  if not rows:
                      return None
                  return rows[0]

              def get_store(self, store_id):
                  row = self._store_row(self._req(store_id, "store_id"))
                  if row is None:
                      return None
                  return {
                      "store_id": self._field(row, "a", 0),
                      "owner": self._field(row, "b", 1),
                      "name": self._field(row, "c", 2),
                      "description": self._field(row, "d", 3),
                      "commission": self._field(row, "e", 4),
                      "status": self._field(row, "f", 5),
                  }

              def create_store(self, *, owner, name, description=None, commission=5.0):
                  owner = self._req(owner, "owner")
                  name = self._req(name, "name")
                  c = float(commission)
                  if c < 0 or c > 50:
                      raise ValueError("comision entre 0 y 50")
                  with self._lock:
                      dup = self._rows(
                          "SELECT store_id FROM sbs_stores WHERE owner = "
                          + self._literal(owner) + " LIMIT 1"
                      )
                      if dup:
                          raise ValueError("ya tienes una tienda")
                      store_id = _nid("STR-")
                      now = _now()
                      self._run(
                          "INSERT INTO sbs_stores (store_id, owner, name,"
                          " description, commission, status, created_at, updated_at)"
                          " VALUES (?, ?, ?, ?, ?, 'pending', ?, ?)",
                          (store_id, owner, name,
                           str(description) if description else None,
                           c, now, now),
                      )
                      self._run(
                          "INSERT INTO sbs_store_members (member_id, store_id,"
                          " account, role, created_at)"
                          " VALUES (?, ?, ?, 'administrador', ?)",
                          (_nid("MBR-"), store_id, owner, now),
                      )
                      return self.get_store(store_id)

              def my_store(self, account):
                  account = self._req(account, "account")
                  rows = self._rows(
                      "SELECT store_id FROM sbs_stores WHERE owner = "
                      + self._literal(account) + " LIMIT 1"
                  )
                  if not rows:
                      return None
                  return self.get_store(str(self._field(rows[0], "a", 0)))

              def verify_store(self, store_id, *, approve):
                  store_id = self._req(store_id, "store_id")
                  with self._lock:
                      status = "verified" if approve else "rejected"
                      self._run(
                          "UPDATE sbs_stores SET status = "
                          + self._literal(status)
                          + ", updated_at = " + self._literal(_now())
                          + " WHERE store_id = " + self._literal(store_id)
                      )
                  return self.get_store(store_id)

              def list_stores(self, status=None):
                  sql = (
                      "SELECT store_id, owner, name, description, commission,"
                      " status, created_at, updated_at FROM sbs_stores"
                  )
                  if status:
                      sql += " WHERE status = " + self._literal(str(status))
                  sql += " ORDER BY created_at DESC"
                  out = []
                  for row in self._rows(sql):
                      out.append({
                          "store_id": self._field(row, "a", 0),
                          "owner": self._field(row, "b", 1),
                          "name": self._field(row, "c", 2),
                          "status": self._field(row, "f", 5),
                      })
                  return out

              def _require_owner(self, store_id, account):
                  row = self._store_row(store_id)
                  if row is None:
                      raise LookupError("tienda no encontrada")
                  if str(self._field(row, "b", 1)) != str(account):
                      raise PermissionError("solo el dueno de la tienda")
                  return row

              def add_item(self, *, store_id, account, title, price, stock):
                  store_id = self._req(store_id, "store_id")
                  self._req(account, "account")
                  with self._lock:
                      self._require_owner(store_id, account)
                      item_id = _nid("ITM-")
                      self._run(
                          "INSERT INTO sbs_store_items (item_id, store_id,"
                          " title, price, stock, promo_pct, promo_active, created_at)"
                          " VALUES (?, ?, ?, ?, ?, 0, 0, ?)",
                          (
                              item_id, store_id,
                              self._req(title, "title"),
                              float(price),
                              int(stock),
                              _now(),
                          ),
                      )
                      return self.get_item(item_id)

              def get_item(self, item_id):
                  item_id = self._req(item_id, "item_id")
                  rows = self._rows(
                      "SELECT item_id, store_id, title, price, stock,"
                      " promo_pct, promo_active, created_at"
                      " FROM sbs_store_items WHERE item_id = "
                      + self._literal(item_id)
                  )
                  if not rows:
                      return None
                  row = rows[0]
                  return {
                      "item_id": self._field(row, "a", 0),
                      "store_id": self._field(row, "b", 1),
                      "title": self._field(row, "c", 2),
                      "price": self._field(row, "d", 3),
                      "stock": self._field(row, "e", 4),
                      "promo_pct": self._field(row, "f", 5),
                      "promo_active": bool(self._field(row, "g", 6)),
                  }

              def list_items(self, store_id):
                  store_id = self._req(store_id, "store_id")
                  out = []
                  for row in self._rows(
                      "SELECT item_id, store_id, title, price, stock,"
                      " promo_pct, promo_active, created_at"
                      " FROM sbs_store_items WHERE store_id = "
                      + self._literal(store_id)
                      + " ORDER BY created_at ASC"
                  ):
                      out.append({
                          "item_id": self._field(row, "a", 0),
                          "title": self._field(row, "c", 2),
                          "price": self._field(row, "d", 3),
                          "stock": self._field(row, "e", 4),
                          "promo_pct": self._field(row, "f", 5),
                          "promo_active": bool(self._field(row, "g", 6)),
                      })
                  return out

              def stock_move(self, item_id, *, account, delta):
                  item_id = self._req(item_id, "item_id")
                  self._req(account, "account")
                  with self._lock:
                      rows = self._rows(
                          "SELECT store_id, stock FROM sbs_store_items WHERE item_id = "
                          + self._literal(item_id)
                      )
                      if not rows:
                          raise LookupError("item no encontrado")
                      sid = str(self._field(rows[0], "a", 0))
                      stock = int(self._field(rows[0], "b", 1) or 0)
                      self._require_owner(sid, account)
                      new_stock = stock + int(delta)
                      if new_stock < 0:
                          raise ValueError("stock no puede quedar negativo")
                      self._run(
                          "UPDATE sbs_store_items SET stock = "
                          + str(new_stock)
                          + " WHERE item_id = " + self._literal(item_id)
                      )
                      return self.get_item(item_id)

              def set_promo(self, item_id, *, account, pct, active=True):
                  item_id = self._req(item_id, "item_id")
                  self._req(account, "account")
                  p = float(pct)
                  if p < 0 or p > 90:
                      raise ValueError("promocion entre 0 y 90 por ciento")
                  with self._lock:
                      rows = self._rows(
                          "SELECT store_id FROM sbs_store_items WHERE item_id = "
                          + self._literal(item_id)
                      )
                      if not rows:
                          raise LookupError("item no encontrado")
                      sid = str(self._field(rows[0], "a", 0))
                      self._require_owner(sid, account)
                      self._run(
                          "UPDATE sbs_store_items SET promo_pct = "
                          + repr(p)
                          + ", promo_active = "
                          + ("1" if active else "0")
                          + " WHERE item_id = " + self._literal(item_id)
                      )
                      return self.get_item(item_id)

              def add_member(self, *, store_id, owner, member, role):
                  store_id = self._req(store_id, "store_id")
                  self._req(owner, "owner")
                  member = self._req(member, "member")
                  role = str(role or "").strip()
                  if role not in STORE_ROLES:
                      raise ValueError("rol debe ser: %s" % ", ".join(STORE_ROLES))
                  with self._lock:
                      self._require_owner(store_id, owner)
                      dup = self._rows(
                          "SELECT member_id FROM sbs_store_members WHERE store_id = "
                          + self._literal(store_id)
                          + " AND account = " + self._literal(member)
                      )
                      if dup:
                          raise ValueError("ya es miembro")
                      mid = _nid("MBR-")
                      self._run(
                          "INSERT INTO sbs_store_members (member_id, store_id,"
                          " account, role, created_at) VALUES (?, ?, ?, ?, ?)",
                          (mid, store_id, member, role, _now()),
                      )
                      return {"member_id": mid, "store_id": store_id,
                              "account": member, "role": role}

              def remove_member(self, *, store_id, owner, member):
                  store_id = self._req(store_id, "store_id")
                  self._req(owner, "owner")
                  member = self._req(member, "member")
                  with self._lock:
                      self._require_owner(store_id, owner)
                      self._run(
                          "DELETE FROM sbs_store_members WHERE store_id = "
                          + self._literal(store_id)
                          + " AND account = " + self._literal(member)
                      )
                      return {"removed": member}

              def list_members(self, store_id):
                  store_id = self._req(store_id, "store_id")
                  out = []
                  for row in self._rows(
                      "SELECT member_id, account, role, created_at"
                      " FROM sbs_store_members WHERE store_id = "
                      + self._literal(store_id)
                      + " ORDER BY created_at ASC"
                  ):
                      out.append({
                          "member_id": self._field(row, "a", 0),
                          "account": self._field(row, "b", 1),
                          "role": self._field(row, "c", 2),
                      })
                  return out

              def record_sale(self, *, store_id, item_id, qty, sold_by):
                  store_id = self._req(store_id, "store_id")
                  item_id = self._req(item_id, "item_id")
                  self._req(sold_by, "sold_by")
                  qty = int(qty)
                  if qty <= 0:
                      raise ValueError("cantidad debe ser positiva")
                  with self._lock:
                      rows = self._rows(
                          "SELECT stock, price, promo_pct, promo_active"
                          " FROM sbs_store_items WHERE item_id = "
                          + self._literal(item_id)
                      )
                      if not rows:
                          raise LookupError("item no encontrado")
                      stock = int(self._field(rows[0], "a", 0) or 0)
                      price = float(self._field(rows[0], "b", 1) or 0)
                      pct = float(self._field(rows[0], "c", 2) or 0)
                      active = bool(self._field(rows[0], "d", 3))
                      if stock < qty:
                          raise ValueError("stock insuficiente")
                      unit = price * (1 - pct / 100.0) if active else price
                      total = unit * qty
                      srow = self._store_row(store_id)
                      commission_pct = float(self._field(srow, "e", 4) or 0) if srow else 0
                      commission = total * commission_pct / 100.0
                      self._run(
                          "UPDATE sbs_store_items SET stock = "
                          + str(stock - qty)
                          + " WHERE item_id = " + self._literal(item_id)
                      )
                      sale_id = _nid("SAL-")
                      self._run(
                          "INSERT INTO sbs_store_sales (sale_id, store_id,"
                          " item_id, qty, total, commission, sold_by, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                          (sale_id, store_id, item_id, qty, total,
                           commission, sold_by, _now()),
                      )
                      return {
                          "sale_id": sale_id,
                          "item_id": item_id,
                          "qty": qty,
                          "total": round(total, 2),
                          "commission": round(commission, 2),
                      }

              def metrics(self, store_id):
                  store_id = self._req(store_id, "store_id")
                  items = self.list_items(store_id)
                  total_stock = sum(int(i["stock"] or 0) for i in items)
                  sales = self._rows(
                      "SELECT qty, total, commission FROM sbs_store_sales"
                      " WHERE store_id = " + self._literal(store_id)
                  )
                  total_sales = 0
                  total_commission = 0
                  total_qty = 0
                  for s in sales:
                      total_qty += int(self._field(s, "a", 0) or 0)
                      total_sales += float(self._field(s, "b", 1) or 0)
                      total_commission += float(self._field(s, "c", 2) or 0)
                  members = self.list_members(store_id)
                  return {
                      "items": len(items),
                      "stock_total": total_stock,
                      "sales_count": len(sales),
                      "units_sold": total_qty,
                      "revenue": round(total_sales, 2),
                      "commission_earned": round(total_commission, 2),
                      "members": len(members),
                  }


          def market_tiendas_page(self) -> str:
              user = self._sess_user()
              if user is None:
                  body = "".join([
                      "<div class='card'><h2>Tiendas</h2>",
                      "<p>Necesitas sesion para gestionar tu tienda.</p>",
                      "<p><a href='/subastas/inscripcion'><button>Entrar</button></a></p>",
                      "</div>",
                  ])
                  return self._page_wrap("ZYRA MARKET - Tiendas", body)
              account = user["username"]
              st = self.tdr.my_store(account)
              if st is None:
                  body = "".join([
                      "<div class='card'><h2>Crear mi tienda</h2>",
                      "<input id='tName' placeholder='Nombre de la tienda'>",
                      "<input id='tDesc' placeholder='Descripcion'>",
                      "<input id='tComm' type='number' step='0.1' value='5' placeholder='Comision %'>",
                      "<button id='btnCreate'>Crear tienda</button>",
                      "<p id='msg'></p>",
                      "</div>",
                      "<script>",
                      "document.getElementById('btnCreate').addEventListener('click',function(){",
                      "function g(i){return document.getElementById(i).value;}",
                      "fetch('/subastas/api/tiendas',{method:'POST',",
                      "headers:{'Content-Type':'application/json'},",
                      "body:JSON.stringify({action:'create',name:g('tName'),description:g('tDesc'),commission:parseFloat(g('tComm'))})})",
                      ".then(function(r){return r.json();})",
                      ".then(function(d){if(d.ok){location.reload();}",
                      "else{document.getElementById('msg').textContent='Error: '+(d.error||'');}})",
                      ".catch(function(e){document.getElementById('msg').textContent='Error: '+e;});});",
                      "</script>",
                  ])
                  return self._page_wrap("ZYRA MARKET - Tiendas", body)
              sid = st["store_id"]
              items = self.tdr.list_items(sid)
              members = self.tdr.list_members(sid)
              metrics = self.tdr.metrics(sid)
              i_rows = []
              for i in items:
                  promo = ""
                  if i["promo_active"]:
                      promo = " | PROMO -%s%%" % str(i["promo_pct"])
                  i_rows.append(
                      "<p>- <b>%s</b> $%s stock:%s%s <code>%s</code></p>" % (
                          i["title"], format(float(i["price"] or 0), ".2f"),
                          str(i["stock"]), promo, i["item_id"]))
              if not i_rows:
                  i_rows.append("<p>Sin items en el catalogo.</p>")
              m_rows = []
              for m in members:
                  m_rows.append(
                      "<p>- %s (%s)</p>" % (m["account"], m["role"]))
              body = "".join([
                  "<div class='card'><h2>%s</h2>" % st["name"],
                  "<p>Estado: <b>%s</b> | Comision: %s%%</p>" % (
                      st["status"], str(st["commission"])),
                  "<p>ID: <code>%s</code></p>" % sid,
                  "</div>",
                  "<div class='card'><h2>Metricas</h2>",
                  "<p>Items: %s | Stock total: %s</p>" % (
                      str(metrics["items"]), str(metrics["stock_total"])),
                  "<p>Ventas: %s (%s unidades) | Ingresos: $%s</p>" % (
                      str(metrics["sales_count"]), str(metrics["units_sold"]),
                      format(float(metrics["revenue"]), ".2f")),
                  "<p>Comision de la tienda: $%s | Miembros: %s</p>" % (
                      format(float(metrics["commission_earned"]), ".2f"),
                      str(metrics["members"])),
                  "</div>",
                  "<div class='card'><h2>Catalogo</h2>",
                  "".join(i_rows),
                  "<h3>Agregar item</h3>",
                  "<input id='iT' placeholder='Titulo'>",
                  "<input id='iP' type='number' step='0.01' placeholder='Precio'>",
                  "<input id='iS' type='number' placeholder='Stock inicial'>",
                  "<button id='btnItem'>Agregar item</button>",
                  "</div>",
                  "<div class='card'><h2>Inventario / Promocion / Venta</h2>",
                  "<input id='aItem' placeholder='ID de item (ITM-...)'>",
                  "<input id='aDelta' type='number' placeholder='Delta stock (+/-)'>",
                  "<button id='btnStock'>Mover stock</button>",
                  "<input id='aPct' type='number' step='1' placeholder='Promo %'>",
                  "<button id='btnPromo'>Activar promo</button>",
                  "<input id='aQty' type='number' placeholder='Cantidad vendida'>",
                  "<button id='btnSale'>Registrar venta</button>",
                  "</div>",
                  "<div class='card'><h2>Equipo</h2>",
                  "".join(m_rows),
                  "<input id='mAcc' placeholder='Cuenta a invitar'>",
                  "<select id='mRole'>",
                  "<option value='vendedor'>vendedor</option>",
                  "<option value='administrador'>administrador</option>",
                  "</select>",
                  "<button id='btnMember'>Invitar</button>",
                  "</div>",
                  "<p id='msg'></p>",
                  "<script>",
                  "function v(id){return document.getElementById(id).value;}",
                  "function num(id){var x=parseFloat(v(id));return isNaN(x)?0:x;}",
                  "function post(payload){",
                  "fetch('/subastas/api/tiendas',{method:'POST',",
                  "headers:{'Content-Type':'application/json'},",
                  "body:JSON.stringify(payload)})",
                  ".then(function(r){return r.json();})",
                  ".then(function(d){if(d.ok){location.reload();}",
                  "else{document.getElementById('msg').textContent='Error: '+(d.error||'');}})",
                  ".catch(function(e){document.getElementById('msg').textContent='Error: '+e;});}",
                  "document.getElementById('btnItem').addEventListener('click',function(){",
                  "post({action:'add_item',title:v('iT'),price:num('iP'),stock:num('iS')});});",
                  "document.getElementById('btnStock').addEventListener('click',function(){",
                  "post({action:'stock',item_id:v('aItem'),delta:num('aDelta')});});",
                  "document.getElementById('btnPromo').addEventListener('click',function(){",
                  "post({action:'promo',item_id:v('aItem'),pct:num('aPct')});});",
                  "document.getElementById('btnSale').addEventListener('click',function(){",
                  "post({action:'sale',item_id:v('aItem'),qty:num('aQty')});});",
                  "document.getElementById('btnMember').addEventListener('click',function(){",
                  "post({action:'add_member',member:v('mAcc'),role:v('mRole')});});",
                  "</script>",
              ])
              return self._page_wrap("ZYRA MARKET - Tiendas", body)


          def market_gov_tiendas_page(self) -> str:
              user = self._sess_user()
              if user is None or user.get("role") not in ("gobierno", "admin"):
                  body = "<p>Solo gobierno/admin.</p>"
                  return self._page_wrap("ZYRA MARKET - Gov Tiendas", body)
              stores = self.tdr.list_stores()
              s_rows = []
              for s in stores:
                  s_rows.append(
                      "<p>- <b>%s</b> (%s) %s: <code>%s</code></p>" % (
                          s["name"], s["owner"], s["status"], s["store_id"]))
              if not s_rows:
                  s_rows.append("<p>Sin tiendas.</p>")
              body = "".join([
                  "<div class='card'><h2>Verificar tienda</h2>",
                  "<input id='sId' placeholder='ID de tienda (STR-...)'>",
                  "<select id='sOk'>",
                  "<option value='true'>Verificar</option>",
                  "<option value='false'>Rechazar</option>",
                  "</select>",
                  "<button id='btnSv'>Aplicar</button>",
                  "".join(s_rows),
                  "</div>",
                  "<p id='msg'></p>",
                  "<script>",
                  "document.getElementById('btnSv').addEventListener('click',function(){",
                  "function g(i){return document.getElementById(i).value;}",
                  "fetch('/subastas/api/gov-tiendas',{method:'POST',",
                  "headers:{'Content-Type':'application/json'},",
                  "body:JSON.stringify({store_id:g('sId'),approve:g('sOk')==='true'})})",
                  ".then(function(r){return r.json();})",
                  ".then(function(d){if(d.ok){location.reload();}",
                  "else{document.getElementById('msg').textContent='Error: '+(d.error||'');}})",
                  ".catch(function(e){document.getElementById('msg').textContent='Error: '+e;});});",
                  "</script>",
              ])
              return self._page_wrap("ZYRA MARKET - Gov Tiendas", body)


          def market_tiendas_api(self) -> None:
              user = self._sess_user()
              if user is None:
                  self._send_json(401, {"ok": False, "error": "sesion requerida"})
                  return
              account = user["username"]
              doc = self._read_json()
              if doc is None:
                  self._send_json(400, {"ok": False, "error": "invalid JSON"})
                  return
              action = str(doc.get("action", ""))
              if action == "create":
                  st = self.tdr.create_store(
                      owner=account,
                      name=str(doc.get("name", "")),
                      description=doc.get("description"),
                      commission=doc.get("commission", 5.0),
                  )
                  self._send_json(201, {"ok": True, "data": st})
                  return
              st = self.tdr.my_store(account)
              if st is None:
                  self._send_json(400, {"ok": False, "error": "no tienes tienda"})
                  return
              sid = st["store_id"]
              if action == "add_item":
                  item = self.tdr.add_item(
                      store_id=sid, account=account,
                      title=str(doc.get("title", "")),
                      price=doc.get("price", 0),
                      stock=doc.get("stock", 0),
                  )
                  self._send_json(201, {"ok": True, "data": item})
                  return
              if action == "stock":
                  item = self.tdr.stock_move(
                      str(doc.get("item_id", "")),
                      account=account, delta=doc.get("delta", 0),
                  )
                  self._send_json(200, {"ok": True, "data": item})
                  return
              if action == "promo":
                  item = self.tdr.set_promo(
                      str(doc.get("item_id", "")),
                      account=account, pct=doc.get("pct", 0),
                      active=bool(doc.get("active", True)),
                  )
                  self._send_json(200, {"ok": True, "data": item})
                  return
              if action == "sale":
                  sale = self.tdr.record_sale(
                      store_id=sid,
                      item_id=str(doc.get("item_id", "")),
                      qty=doc.get("qty", 0),
                      sold_by=account,
                  )
                  self._send_json(201, {"ok": True, "data": sale})
                  return
              if action == "add_member":
                  mem = self.tdr.add_member(
                      store_id=sid, owner=account,
                      member=str(doc.get("member", "")),
                      role=str(doc.get("role", "vendedor")),
                  )
                  self._send_json(201, {"ok": True, "data": mem})
                  return
              if action == "remove_member":
                  res = self.tdr.remove_member(
                      store_id=sid, owner=account,
                      member=str(doc.get("member", "")),
                  )
                  self._send_json(200, {"ok": True, "data": res})
                  return
              if action == "metrics":
                  self._send_json(200, {"ok": True, "data": self.tdr.metrics(sid)})
                  return
              self._send_json(
                  400, {"ok": False, "error": "accion desconocida: %s" % action}
              )


          def market_gov_tiendas_api(self) -> None:
              user = self._sess_user()
              if user is None or user.get("role") not in ("gobierno", "admin"):
                  self._send_json(403, {"ok": False, "error": "solo gobierno/admin"})
                  return
              doc = self._read_json()
              if doc is None:
                  self._send_json(400, {"ok": False, "error": "invalid JSON"})
                  return
              st = self.tdr.verify_store(
                  str(doc.get("store_id", "")),
                  approve=bool(doc.get("approve", False)),
              )
              self._send_json(200, {"ok": True, "data": st})
          TSF
          echo "tiendas_store.py: $(wc -l < apps/subastas/modules/$TDIR/tiendas_store.py) lines"

