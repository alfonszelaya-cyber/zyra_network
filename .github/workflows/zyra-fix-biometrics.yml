name: "AUDIT SIMPLE"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Ver codigo
        run: |
          sed -n '40,55p' shared_engines/runtime/combined_api.py > /tmp/out1.txt
          sed -n '615,630p' shared_engines/runtime/tests/test_runtime_api.py > /tmp/out2.txt
          sed -n '520,530p' shared_engines/runtime/tests/test_capabilities_api.py > /tmp/out3.txt
          sed -n '470,480p' shared_engines/network/tests/test_portable_identity.py > /tmp/out4.txt
          sed -n '640,660p' shared_engines/runtime/tests/test_runtime_api.py > /tmp/out5.txt
          cat /tmp/out1.txt /tmp/out2.txt /tmp/out3.txt /tmp/out4.txt /tmp/out5.txt
      - name: Tests con traceback
        run: |
          python3 -m pytest "shared_engines/runtime/tests/test_runtime_api.py::test_death_lifecycle_deceased" -vv --tb=long 2>&1 | tail -40 || true
          python3 -m pytest "shared_engines/runtime/tests/test_runtime_api.py::test_verify_existence_public" -vv --tb=long 2>&1 | tail -40 || true
          python3 -m pytest "shared_engines/runtime/tests/test_capabilities_api.py::test_verification_verdict_signed" -vv --tb=long 2>&1 | tail -40 || true
          python3 -m pytest "shared_engines/network/tests/test_portable_identity.py::test_expediente_legal_pedro" -vv --tb=long 2>&1 | tail -40 || true
