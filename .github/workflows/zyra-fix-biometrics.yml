name: "ZYRA - fix nombres de metodo en test (verde o nada)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parche:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Fix - ensamblar -> ensamblar_avi en los 3 tests
        run: |
          cat > /tmp/fix_test.py <<'FIX_EOF'
          from pathlib import Path

          ruta = Path("apps/laboratorio/tests/test_video_impresion.py")
          texto = ruta.read_text(encoding="utf-8")

          reemplazos = (
              ("MotorVideo().ensamblar([_frame((1, 2, 3))], fps=0)",
               "MotorVideo().ensamblar_avi([_frame((1, 2, 3))], fps=0)"),
              ("MotorVideo().ensamblar([_frame((1, 2, 3))], fps=200)",
               "MotorVideo().ensamblar_avi([_frame((1, 2, 3))], fps=200)"),
              ("res = MotorVideo().ensamblar(\n                  [_frame((255, 0, 0)), _frame((0, 255, 0)),\n                   _frame((0, 0, 255)), _frame((255, 255, 0))], fps=8)",
               "res = MotorVideo().ensamblar_avi(\n                  [_frame((255, 0, 0)), _frame((0, 255, 0)),\n                   _frame((0, 0, 255)), _frame((255, 255, 0))], fps=8)"),
          )

          for viejo, nuevo in reemplazos:
              if viejo in texto:
                  texto = texto.replace(viejo, nuevo, 1)
                  print("OK:", viejo.split("(")[0][-30:] + " -> ensamblar_avi")

          restantes = texto.count(".ensamblar(")
          if restantes:
              raise SystemExit("FATAL: quedan " + str(restantes) + " llamadas a .ensamblar(")

          ruta.write_text(texto, encoding="utf-8")
          print("test corregido: todas las llamadas usan ensamblar_avi")
          FIX_EOF
          python /tmp/fix_test.py

      - name: Correr la suite completa
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado - fix nombres de metodo"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "fix: tests usan ensamblar_avi (nombre real del metodo)"
            git push
          fi
