name: ZYRA Hardening Block 4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography pytest

      - name: Ensure network package marker
        run: |
          if [ ! -f network/__init__.py ]; then
            printf '"""ZYRA Network primitives layer."""\n' > network/__init__.py
            echo "created network/__init__.py"
          else
            echo "network/__init__.py already present"
          fi

      - name: 1/3 TCP transport tests (real sockets, auth, reconnect)
        run: python -m network.transport.tcp_transport -v

      - name: 2/3 Full security regression (biometrics 13 + PAD)
        run: |
          pip install "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"
          python -m shared_engines.security.biometrics -v
          python - <<'PYEOF'
          import unittest

          loader = unittest.TestLoader()
          from shared_engines.security import (
              biometrics_face,
          )

          suite = loader.loadTestsFromName(
              "shared_engines.security.biometrics_face"
              ".LivenessHeuristicTests"
          )
          result = unittest.TextTestRunner(
              verbosity=1
          ).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print("PAD OK")
          PYEOF

      - name: 3/3 Runtime tests stay green
        run: python -m pytest shared_engines/runtime/tests -q

      - name: Commit package marker (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add network/__init__.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "network: add package marker so the transport layer is importable"
            git push
          fi
