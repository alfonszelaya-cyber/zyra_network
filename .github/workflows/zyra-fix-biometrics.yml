          escribir apps/laboratorio/shared/types/json_type.py << 'ZYRA_EOF'
          """Alias de tipos para datos JSON seguros."""

          from typing import Any, Dict, List, Union

          ValorJSON = Union[None, bool, int, float, str, List[Any], Dict[str, Any]]
          ObjetoJSON = Dict[str, Any]
          ListaJSON = List[ValorJSON]
          ZYRA_EOF
          escribir apps/laboratorio/shared/types/confidence.py << 'ZYRA_EOF'
          """Tipo de confianza con validacion 0.0 a 1.0."""

          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Confianza:
              """Valor de confianza normalizado entre 0.0 y 1.0."""

              valor: float

              def __post_init__(self):
                  if isinstance(self.valor, bool) or not isinstance(
                      self.valor, (int, float)
                  ):
                      raise ValueError("La confianza debe ser numerica.")
                  if not 0.0 <= float(self.valor) <= 1.0:
                      raise ValueError(
                          "La confianza debe estar entre 0.0 y 1.0: " + str(self.valor)
                      )

              @property
              def porcentaje(self) -> float:
                  """Confianza como porcentaje 0-100."""
                  return round(float(self.valor) * 100.0, 2)

              @classmethod
              def alta(cls) -> "Confianza":
                  """Confianza alta estandar (0.9)."""
                  return cls(0.9)

              @classmethod
              def media(cls) -> "Confianza":
                  """Confianza media estandar (0.6)."""
                  return cls(0.6)

              @classmethod
              def baja(cls) -> "Confianza":
                  """Confianza baja estandar (0.3)."""
                  return cls(0.3)
          ZYRA_EOF
          escribir apps/laboratorio/shared/models/identifiers.py << 'ZYRA_EOF'
          """Identificadores unicos con prefijo por entidad."""

          import secrets
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Identificador:
              """ID inmutable con prefijo de entidad y sufijo aleatorio."""

              prefijo: str
              valor: str

              def __post_init__(self):
                  if not self.prefijo or not self.prefijo.replace("_", "").isalnum():
                      raise ValueError(
                          "Prefijo de identificador invalido: " + repr(self.prefijo)
                      )
                  if not self.valor:
                      raise ValueError("El identificador requiere un valor.")

              def __str__(self) -> str:
                  return self.prefijo + "_" + self.valor


          def nuevo_id(prefijo: str) -> Identificador:
              """Genera un identificador nuevo: prefijo_ + 16 hex aleatorios."""
              return Identificador(prefijo=prefijo, valor=secrets.token_hex(8))


          def id_desde_texto(prefijo: str, texto: str) -> Identificador:
              """Valida y convierte texto 'prefijo_valor' a Identificador."""
              esperado = prefijo + "_"
              if not isinstance(texto, str) or not texto.startswith(esperado):
                  raise ValueError(
                      "Identificador invalido para '" + prefijo + "': " + repr(texto)
                  )
              valor = texto[len(esperado):]
              if not valor:
                  raise ValueError("Identificador sin valor: " + repr(texto))
              return Identificador(prefijo=prefijo, valor=valor)
          ZYRA_EOF
          escribir apps/laboratorio/shared/models/base.py << 'ZYRA_EOF'
          """Base comun de las entidades de dominio."""

          from dataclasses import dataclass, field
          from datetime import datetime, timezone

          from apps.laboratorio.shared.models.identifiers import Identificador


          def ahora_utc() -> datetime:
              """Momento actual en UTC con zona explicita."""
              return datetime.now(timezone.utc)


          @dataclass
          class EntidadBase:
              """Toda entidad tiene id y marcas de tiempo UTC."""

              id: Identificador
              creado_en: datetime = field(default_factory=ahora_utc)
              actualizado_en: datetime = field(default_factory=ahora_utc)

              def marcar_actualizacion(self) -> None:
                  """Actualiza la marca de la ultima modificacion."""
                  self.actualizado_en = ahora_utc()
          ZYRA_EOF
          escribir apps/laboratorio/shared/models/page.py << 'ZYRA_EOF'
          """Paginacion estandar para consultas de listas."""

          from dataclasses import dataclass, field
          from typing import List


          @dataclass
          class Pagina:
              """Resultado paginado generico."""

              items: List = field(default_factory=list)
              total: int = 0
              pagina: int = 1
              por_pagina: int = 20

              def __post_init__(self):
                  if self.pagina < 1:
                      raise ValueError("pagina debe ser mayor o igual a 1.")
                  if self.por_pagina < 1 or self.por_pagina > 100:
                      raise ValueError("por_pagina debe estar entre 1 y 100.")

              @property
              def total_paginas(self) -> int:
                  """Numero total de paginas."""
                  if self.total == 0:
                      return 0
                  return (self.total + self.por_pagina - 1) // self.por_pagina

              @property
              def hay_mas(self) -> bool:
                  """Indica si existe una pagina siguiente."""
                  return self.pagina < self.total_paginas
          ZYRA_EOF
          escribir apps/laboratorio/shared/mixins/serializable.py << 'ZYRA_EOF'
          """Mixin de serializacion a diccionario JSON."""

          from dataclasses import asdict, is_dataclass
          from datetime import date, datetime
          from enum import Enum

          from apps.laboratorio.shared.models.identifiers import Identificador


          def _valor_serializable(valor):
              """Convierte un valor cualquiera a algo serializable por JSON."""
              if isinstance(valor, Enum):
                  return valor.value
              if isinstance(valor, (datetime, date)):
                  return valor.isoformat()
              if isinstance(valor, Identificador):
                  return str(valor)
              if is_dataclass(valor) and not isinstance(valor, type):
                  if hasattr(valor, "to_dict"):
                      return valor.to_dict()
                  return asdict(valor)
              if isinstance(valor, dict):
                  return {str(k): _valor_serializable(v) for k, v in valor.items()}
              if isinstance(valor, (list, tuple)):
                  return [_valor_serializable(v) for v in valor]
              return valor


          class SerializableMixin:
              """Convierte dataclasses a dict listo para JSON."""

              def to_dict(self) -> dict:
                  """Serializa la entidad a diccionario."""
                  if not is_dataclass(self):
                      raise TypeError("SerializableMixin requiere una dataclass.")
                  return {k: _valor_serializable(v) for k, v in asdict(self).items()}
          ZYRA_EOF
          escribir apps/laboratorio/shared/mixins/versioned.py << 'ZYRA_EOF'
          """Mixin de version incremental."""

          from dataclasses import dataclass, field


          @dataclass
          class VersionadoMixin:
              """Lleva el numero de version y la nota de cada cambio.

              Al heredar, listar este mixin despues de EntidadBase.
              """

              version: int = 1
              notas_version: list = field(default_factory=list)

              def nueva_version(self, nota: str = "") -> int:
                  """Incrementa y devuelve el numero de version."""
                  if not isinstance(nota, str):
                      raise ValueError("La nota de version debe ser texto.")
                  self.version += 1
                  self.notas_version.append(nota)
                  return self.version
          ZYRA_EOF
          escribir apps/laboratorio/shared/helpers/hashing.py << 'ZYRA_EOF'
          """Utilidades de hash SHA-256 (estandar de integridad ZYRA)."""

          import hashlib


          def sha256_texto(texto: str) -> str:
              """Hash SHA-256 hexadecimal de un texto UTF-8."""
              if not isinstance(texto, str):
                  raise ValueError("Se esperaba texto para calcular hash.")
              return hashlib.sha256(texto.encode("utf-8")).hexdigest()


          def sha256_bytes(datos: bytes) -> str:
              """Hash SHA-256 hexadecimal de datos binarios."""
              if not isinstance(datos, (bytes, bytearray)):
                  raise ValueError("Se esperaban bytes para calcular hash.")
              return hashlib.sha256(bytes(datos)).hexdigest()


          def verificar_texto(texto: str, hash_esperado: str) -> bool:
              """Compara el hash de un texto contra un hash esperado."""
              return sha256_texto(texto) == (hash_esperado or "").lower()
          ZYRA_EOF
          escribir apps/laboratorio/shared/helpers/json_helpers.py << 'ZYRA_EOF'
          """Utilidades JSON seguras para persistencia y API."""

          import json
          from typing import Any

          from apps.laboratorio.shared.types.json_type import ObjetoJSON


          def a_json(objeto: Any, ordenado: bool = True) -> str:
              """Serializa a texto JSON seguro."""
              return json.dumps(objeto, ensure_ascii=True, sort_keys=ordenado, default=str)


          def desde_json(texto: str) -> ObjetoJSON:
              """Deserializa un texto JSON y exige que sea un objeto."""
              if not isinstance(texto, str) or not texto.strip():
                  raise ValueError("Texto JSON vacio o invalido.")
              datos = json.loads(texto)
              if not isinstance(datos, dict):
                  raise ValueError("El JSON debe representar un objeto {clave: valor}.")
              return datos


          def intentar_desde_json(texto: str) -> ObjetoJSON:
              """Deserializa o devuelve dict vacio si es invalido."""
              try:
                  return desde_json(texto)
              except ValueError:
                  return {}
          ZYRA_EOF
          escribir apps/laboratorio/shared/helpers/validation_helpers.py << 'ZYRA_EOF'
          """Validaciones comunes reutilizables en toda la aplicacion."""


          def exigir_texto(valor, nombre_campo: str, minimo: int = 1, maximo: int = 5000) -> str:
              """Valida texto no vacio dentro de limites; lo devuelve limpio."""
              if not isinstance(valor, str):
                  raise ValueError(nombre_campo + " debe ser texto.")
              limpio = valor.strip()
              if len(limpio) < minimo:
                  raise ValueError(
                      nombre_campo + " debe tener al menos " + str(minimo) + " caracteres."
                  )
              if len(limpio) > maximo:
                  raise ValueError(
                      nombre_campo + " no puede exceder " + str(maximo) + " caracteres."
                  )
              return limpio


          def exigir_entero(
              valor, nombre_campo: str, minimo: int = 0, maximo: int = 1000000
          ) -> int:
              """Valida que sea entero dentro de rango; lo devuelve."""
              if isinstance(valor, bool) or not isinstance(valor, int):
                  raise ValueError(nombre_campo + " debe ser un numero entero.")
              if valor < minimo or valor > maximo:
                  raise ValueError(
                      nombre_campo + " fuera de rango: "
                      + str(minimo) + " a " + str(maximo) + "."
                  )
              return valor


          def exigir_flotante(
              valor, nombre_campo: str, minimo: float = 0.0, maximo: float = 1e12
          ) -> float:
              """Valida que sea numero real dentro de rango; lo devuelve."""
              if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                  raise ValueError(nombre_campo + " debe ser un numero.")
              numero = float(valor)
              if numero < minimo or numero > maximo:
                  raise ValueError(
                      nombre_campo + " fuera de rango: "
                      + str(minimo) + " a " + str(maximo) + "."
                  )
              return numero


          def limpiar_texto_multilinea(valor, nombre_campo: str, maximo: int = 20000) -> str:
              """Normaliza un texto largo de varias lineas."""
              if not isinstance(valor, str):
                  raise ValueError(nombre_campo + " debe ser texto.")
              normalizado = "\n".join(
                  linea.rstrip() for linea in valor.strip().splitlines()
              )
              if not normalizado:
                  raise ValueError(nombre_campo + " no puede estar vacio.")
              if len(normalizado) > maximo:
                  raise ValueError(
                      nombre_campo + " excede el maximo de " + str(maximo) + " caracteres."
                  )
              return normalizado
          ZYRA_EOF
          escribir apps/laboratorio/shared/helpers/geometry_math.py << 'ZYRA_EOF'
          """Matematica geometrica compartida (los objetos viven en value_objects)."""

          import math

          from apps.laboratorio.shared.value_objects.geometry import Point3D, Vector3D


          def punto_medio(a: Point3D, b: Point3D) -> Point3D:
              """Punto exactamente en medio entre dos puntos."""
              return Point3D((a.x + b.x) / 2.0, (a.y + b.y) / 2.0, (a.z + b.z) / 2.0)


          def vector_entre(origen: Point3D, destino: Point3D) -> Vector3D:
              """Vector que va de origen a destino."""
              return Vector3D(
                  destino.x - origen.x, destino.y - origen.y, destino.z - origen.z
              )


          def angulo_entre(u: Vector3D, v: Vector3D) -> float:
              """Angulo en radianes entre dos vectores."""
              lu = u.longitud()
              lv = v.longitud()
              if lu == 0.0 or lv == 0.0:
                  raise ValueError("No hay angulo con vectores de longitud cero.")
              coseno = u.producto_punto(v) / (lu * lv)
              coseno = max(-1.0, min(1.0, coseno))
              return math.acos(coseno)


          def distancia(a: Point3D, b: Point3D) -> float:
              """Distancia entre dos puntos."""
              return a.distancia_a(b)
          ZYRA_EOF
          escribir apps/laboratorio/shared/value_objects/transform.py << 'ZYRA_EOF'
          """Transformacion 3D: posicion + orientacion + escala (inmutable)."""

          from dataclasses import dataclass

          from apps.laboratorio.shared.value_objects.geometry import (
              Point3D,
              Quaternion,
              Vector3D,
          )


          @dataclass(frozen=True)
          class Transform:
              """Ubicacion completa de un objeto en la escena 3D."""

              posicion: Point3D = Point3D()
              orientacion: Quaternion = Quaternion()
              escala: Vector3D = Vector3D(1.0, 1.0, 1.0)

              def __post_init__(self):
                  if self.escala.x == 0.0 or self.escala.y == 0.0 or self.escala.z == 0.0:
                      raise ValueError("La escala no puede tener componentes en cero.")

              def trasladar(self, delta: Vector3D) -> "Transform":
                  """Devuelve la transform movida por un vector."""
                  return Transform(
                      posicion=self.posicion.sumar_vector(delta),
                      orientacion=self.orientacion,
                      escala=self.escala,
                  )

              def escalar_por(self, factor: float) -> "Transform":
                  """Devuelve la transform escalada uniformemente."""
                  if factor <= 0.0:
                      raise ValueError("El factor de escala debe ser mayor que cero.")
                  return Transform(
                      posicion=self.posicion,
                      orientacion=self.orientacion,
                      escala=Vector3D(
                          self.escala.x * factor,
                          self.escala.y * factor,
                          self.escala.z * factor,
                      ),
                  )
          ZYRA_EOF
          escribir apps/laboratorio/shared/value_objects/resolution.py << 'ZYRA_EOF'
          """Resolucion de imagen/render (pixeles validados)."""

          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Resolucion:
              """Resolucion en pixeles con limites de produccion."""

              ancho: int
              alto: int

              MINIMO = 16
              MAXIMO = 8192

              def __post_init__(self):
                  if isinstance(self.ancho, bool) or isinstance(self.alto, bool):
                      raise ValueError("Resolucion debe ser entera en pixeles.")
                  if not isinstance(self.ancho, int) or not isinstance(self.alto, int):
                      raise ValueError("Resolucion debe ser entera en pixeles.")
                  if not (self.MINIMO <= self.ancho <= self.MAXIMO):
                      raise ValueError(
                          "ancho fuera de rango 16-8192: " + str(self.ancho)
                      )
                  if not (self.MINIMO <= self.alto <= self.MAXIMO):
                      raise ValueError(
                          "alto fuera de rango 16-8192: " + str(self.alto)
                      )

              @property
              def total_pixeles(self) -> int:
                  """Cantidad total de pixeles."""
                  return self.ancho * self.alto

              @property
              def relacion_aspecto(self) -> float:
                  """Relacion ancho/alto redondeada."""
                  return round(self.ancho / self.alto, 4)

              @classmethod
              def hd(cls) -> "Resolucion":
                  """1920x1080."""
                  return cls(1920, 1080)

              @classmethod
              def cuatro_k(cls) -> "Resolucion":
                  """3840x2160."""
                  return cls(3840, 2160)
          ZYRA_EOF
          escribir apps/laboratorio/shared/value_objects/duration.py << 'ZYRA_EOF'
          """Duracion temporal en segundos (eje TIEMPO del 4D)."""

          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Duracion:
              """Intervalo de tiempo en segundos, de 0.001 a 24 horas."""

              segundos: float

              MIN = 0.001
              MAX = 86400.0

              def __post_init__(self):
                  if isinstance(self.segundos, bool) or not isinstance(
                      self.segundos, (int, float)
                  ):
                      raise ValueError("La duracion debe ser numerica en segundos.")
                  valor = float(self.segundos)
                  if not (self.MIN <= valor <= self.MAX):
                      raise ValueError("Duracion fuera de rango: " + str(valor))

              @property
              def milisegundos(self) -> int:
                  """Duracion en milisegundos enteros."""
                  return int(round(self.segundos * 1000.0))

              def mas(self, otra: "Duracion") -> "Duracion":
                  """Suma dos duraciones validando el maximo."""
                  return Duracion(self.segundos + otra.segundos)

              @classmethod
              def desde_minutos(cls, minutos: float) -> "Duracion":
                  """Crea una duracion desde minutos."""
                  return cls(float(minutos) * 60.0)
          ZYRA_EOF
          escribir apps/laboratorio/constants/permissions/permission_codes.py << 'ZYRA_EOF'
