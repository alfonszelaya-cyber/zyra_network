name: "AGRO AUDIT v1: pares dominio/schema + nombres repetidos + wiring real (solo lectura)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - PARES dominio vs schema (production + producer)"
        run: |
          python3 - <<'PARES'
          import hashlib
          import re
          from pathlib import Path

          OUT = "agro_audit_pares.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          def classes_defs(t):
              cls = re.findall(r'^class\s+(\w+)', t, re.M)
              fns = re.findall(r'^\s*def\s+(\w+)', t, re.M)
              return cls, fns

          pares = [
              ("production",
               "apps/agro/domain/entities/production.py",
               "apps/agro/schemas/entities/production.py"),
              ("producer",
               "apps/agro/domain/entities/producer.py",
               "apps/agro/schemas/entities/producer.py"),
          ]

          log("======== PARES DOMINIO vs SCHEMA ========")
          for name, dp, sp in pares:
              log("")
              log("--- PAR: " + name + " ---")
              d = Path(dp)
              s = Path(sp)
              datos = {}
              for tag, p in (("domain", d), ("schema", s)):
                  if not p.exists():
                      log(tag + ": NO EXISTE (" + str(p) + ")")
                      continue
                  t = p.read_text(encoding="utf-8", errors="ignore")
                  datos[tag] = t
                  lines = t.splitlines()
                  cls, fns = classes_defs(t)
                  h = hashlib.sha256(t.encode()).hexdigest()[:12]
                  log(tag + ": " + str(p))
                  log("    lineas=" + str(len(lines)) + " sha256=" + h)
                  log("    classes: " + (", ".join(cls) if cls else "(ninguna)"))
                  log("    defs(" + str(len(fns)) + "): " + (", ".join(fns) if fns else "(ninguna)"))
                  noempty = [l for l in lines if l.strip()]
                  log("    primeras 30 lineas con contenido:")
                  for l in noempty[:30]:
                      log("      | " + l.rstrip())
              if "domain" in datos and "schema" in datos:
                if datos["domain"].strip() == datos["schema"].strip():
                    log("VEREDICTO BRUTO: IDENTICOS (duplicado confirmado)")
                else:
                    dc, df = classes_defs(datos["domain"])
                    sc, sf = classes_defs(datos["schema"])
                    log("VEREDICTO BRUTO: DISTINTOS")
                    log("  domain define clases: " + ", ".join(dc))
                    log("  schema define clases: " + ", ".join(sc))
                    log("  domain tiene logica propia (defs no triviales): " + str(len(df)))
                    log("  schema solo transporte si sus defs son __init__/to_dict/from_dict/validacion")
          log("")
          log("======== FIN PARES ========")
          rep.close()
          PARES

      - name: "Paso 2 - NOMBRES REPETIDOS: tabla con integracion real"
        run: |
          python3 - <<'REPE'
          import re
          from collections import defaultdict
          from pathlib import Path

          OUT = "agro_audit_repetidos.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          app = Path("apps/agro")
          textos = {}
          for p in app.rglob("*.py"):
              if "__pycache__" in p.parts:
                  continue
              try:
                  t = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if t.strip():
                  textos[p] = t

          grupos = defaultdict(list)
          for p, t in textos.items():
              grupos[p.name].append(p)

          log("======== NOMBRES REPETIDOS (con codigo real) ========")
          log("total archivos con codigo: " + str(len(textos)))
          for name in sorted(grupos):
              lst = grupos[name]
              if len(lst) < 2:
                  continue
              log("")
              log("--- " + name + "  x" + str(len(lst)) + " ---")
              patron = re.compile(
                  r'(from\s+[\w\.]+\s+import[^\n]*\b' + name[:-3] + r'\b'
                  r'|(?:import\s+[\w\.]*\.' + name[:-3] + r'\b)'
                  r'|(?:import\s+' + name[:-3] + r'\b))'
              )
              for p in sorted(lst):
                  t = textos[p]
                  lines = len(t.splitlines())
                  ncls = len(re.findall(r'^class\s+', t, re.M))
                  ndef = len(re.findall(r'^\s*def\s+', t, re.M))
                  refs = 0
                  for q, tq in textos.items():
                      if q == p:
                          continue
                      if patron.search(tq):
                          refs += 1
                  log("  " + str(p.relative_to(app)))
                  log("      lineas=" + str(lines)
                      + " classes=" + str(ncls)
                      + " defs=" + str(ndef)
                      + " importado_por=" + str(refs))
          log("")
          log("======== FIN NOMBRES REPETIDOS ========")
          rep.close()
          REPE

      - name: "Paso 3 - WIRING REAL: que esta conectado al server y que no"
        run: |
          python3 - <<'WIRE'
          import re
          from collections import defaultdict
          from pathlib import Path

          OUT = "agro_audit_wiring.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          app = Path("apps/agro")
          textos = {}
          for p in app.rglob("*.py"):
              if "__pycache__" in p.parts:
                  continue
              try:
                  t = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if t.strip():
                  textos[p] = t

          def resolve_abs(mod):
              base = Path(mod.replace(".", "/"))
              for c in (base.with_suffix(".py"), base / "__init__.py"):
                  if c.exists():
                      return c
              return None

          def resolve_rel(src, ndots, modpath):
              d = src.parent
              for _ in range(ndots - 1):
                  d = d.parent
              target = d
              if modpath:
                  target = d / modpath.replace(".", "/")
              for c in (target.with_suffix(".py"), target / "__init__.py"):
                  if c.exists() and c in textos:
                      return c
              return None

          start = app / "server.py"
          if start not in textos:
              log("server.py sin codigo: auditoria wiring imposible")
              rep.close()
              raise SystemExit(0)

          seen = set()
          work = [start]
          while work:
              f = work.pop(0)
              if f in seen or f not in textos:
                  continue
              seen.add(f)
              t = textos[f]
              for m in re.finditer(
                      r'^\s*from\s+((?:\.)+)([\w\.]*)\s+import\s+(.+)$',
                      t, re.M):
                  ndots = len(m.group(1))
                  mod = m.group(2)
                  names = m.group(3)
                  if mod:
                      tgt = resolve_rel(f, ndots, mod)
                      if tgt:
                          work.append(tgt)
                  for nm in [x.strip().split(" as ")[0].strip()
                             for x in names.split(",")]:
                      tgt2 = resolve_rel(f, ndots,
                                         (mod + "." + nm) if mod else nm)
                      if tgt2:
                          work.append(tgt2)
              for m in re.finditer(
                      r'^\s*from\s+(apps\.agro[\w\.]*)\s+import\s+(.+)$',
                      t, re.M):
                  mod = m.group(1)
                  tgt = resolve_abs(mod)
                  if tgt:
                      work.append(tgt)
                  for nm in [x.strip().split(" as ")[0].strip()
                             for x in m.group(2).split(",")]:
                      tgt2 = resolve_abs(mod + "." + nm)
                      if tgt2:
                          work.append(tgt2)
              for m in re.finditer(
                      r'^\s*import\s+(apps\.agro[\w\.]*)', t, re.M):
                  tgt = resolve_abs(m.group(1))
                  if tgt:
                      work.append(tgt)

          unreachable = set(textos) - seen
          log("======== WIRING REAL DE AGRO ========")
          log("archivos con codigo        : " + str(len(textos)))
          log("alcanzables desde server.py: " + str(len(seen)))
          log("NO cableados               : " + str(len(unreachable)))
          log("")
          log("--- ALCANZABLES (vivos) ---")
          for p in sorted(seen):
              log("  " + str(p.relative_to(app)))
          log("")
          grupos = defaultdict(list)
          for p in unreachable:
              rel = p.relative_to(app)
              if len(rel.parts) >= 2:
                  clave = "/".join(rel.parts[:2])
              else:
                  clave = "(raiz)"
              grupos[clave].append(p)
          log("--- NO CABLEADOS por carpeta ---")
          for clave in sorted(grupos):
              log("  " + clave + ": " + str(len(grupos[clave])))
          log("")
          log("--- DETALLE NO CABLEADOS (hasta 10 por carpeta) ---")
          for clave in sorted(grupos):
              log("  [" + clave + "]")
              for p in sorted(grupos[clave])[:10]:
                  log("      " + str(p.relative_to(app)))
              if len(grupos[clave]) > 10:
                  log("      ... y " + str(len(grupos[clave]) - 10) + " mas")

          log("")
          log("--- MODULOS DE NEGOCIO (primer nivel) ---")
          mods = app / "modules"
          if mods.exists():
              for d in sorted(mods.iterdir()):
                  if not d.is_dir():
                      continue
                  reales = 0
                  vacios = 0
                  for p in d.rglob("*.py"):
                      if "__pycache__" in p.parts:
                          continue
                      if p.read_text(encoding="utf-8",
                                     errors="ignore").strip():
                          reales += 1
                      else:
                          vacios += 1
                  vivo = "VIVO" if any(
                      p in seen for p in d.rglob("*.py")) else "NO-WIRE"
                  log("  " + d.name
                      + ": reales=" + str(reales)
                      + " vacios=" + str(vacios)
                      + " -> " + vivo)
          log("")
          log("======== FIN WIRING ========")
          rep.close()
          WIRE

      - name: "Paso 4 - RUTAS + STORES + LINK"
        run: |
          python3 - <<'RUTAS'
          import re
          from pathlib import Path

          OUT = "agro_audit_rutas.txt"
          rep = open(OUT, "w", encoding="utf-8")

          def log(s):
              print(s)
              rep.write(s + "\n")
              rep.flush()

          app = Path("apps/agro")
          server = app / "server.py"
          if server.exists():
              st = server.read_text(encoding="utf-8", errors="ignore")
              urls_server = sorted(set(
                  re.findall(r'["\'](/agro/[\w\-/]*)["\']', st)))
              log("======== RUTAS EN server.py ========")
              log("total strings de ruta: " + str(len(urls_server)))
              for u in urls_server:
                  log("  " + u)
              urls_tests = set()
              for p in (app / "tests").rglob("test_*.py"):
                  tt = p.read_text(encoding="utf-8", errors="ignore")
                  urls_tests |= set(
                      re.findall(r'["\'](/agro/[\w\-/]*)["\']', tt))
              log("")
              log("======== RUTAS EJERCITADAS POR TESTS ========")
              for u in sorted(urls_tests):
                  log("  " + u)
              sin_cover = [u for u in urls_server
                           if u not in urls_tests
                           and u not in ("/agro", "/agro/home")]
              log("")
              log("RUTAS SIN TEST DIRECTO: " + str(len(sin_cover)))
              for u in sin_cover[:40]:
                  log("  " + u)
          log("")

          log("======== SUPERFICIE DE STORES ========")
          for sp in ("apps/agro/infrastructure/persistence/agro_store.py",
                     "apps/agro/infrastructure/persistence/agro_area_store.py"):
              p = Path(sp)
              if not p.exists():
                  log(sp + ": NO EXISTE")
                  continue
              t = p.read_text(encoding="utf-8", errors="ignore")
              defs = re.findall(r'^    def (\w+)\(', t, re.M)
              log(sp)
              log("  metodos(" + str(len(defs)) + "): " + ", ".join(defs))
          log("")

          log("======== zyra_link.py AGRO COMPLETO ========")
          lp = app / "services" / "zyra_link.py"
          if lp.exists():
              lines = lp.read_text(
                  encoding="utf-8", errors="ignore").splitlines()
              log("lineas: " + str(len(lines)))
              for i, l in enumerate(lines, 1):
                  log(f"{i:4d}| {l}")
          else:
              log("zyra_link.py NO EXISTE")
          rep.close()
          RUTAS

      - name: "Resumen final + artifact"
        uses: actions/upload-artifact@v4
        with:
          name: agro-audit-reporte
          path: |
            agro_audit_pares.txt
            agro_audit_repetidos.txt
            agro_audit_wiring.txt
            agro_audit_rutas.txt
          if-no-files-found: warn

      - name: "Resumen en consola"
        run: |
          echo "=========================================="
          echo " AUDITORIA AGRO COMPLETADA (solo lectura)"
          echo " Reportes en artifact 'agro-audit-reporte':"
          echo "  - agro_audit_pares.txt     (duplicados dominio/schema)"
          echo "  - agro_audit_repetidos.txt (nombres repetidos + refs)"
          echo "  - agro_audit_wiring.txt    (vivo vs no cableado)"
          echo "  - agro_audit_rutas.txt     (rutas + stores + link)"
          echo "=========================================="
