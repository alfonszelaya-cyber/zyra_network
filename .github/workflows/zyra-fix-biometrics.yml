name: ZYRA LABORATORIO - Lote 9A (Fase 9 - red, contratos y GOV-DATA EN VIVO)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar y aplicar lote (Reglas 1-8)
        run: |
          set -e
          RESUMEN_EARLY="${GITHUB_STEP_SUMMARY:-}"
          MANIFEST=/tmp/lab_lote_9a.manifest
          : > "$MANIFEST"
          fallar_early() {
            msg="$1"
            echo "**FALLO TEMPRANO: $msg**" >> "$RESUMEN_EARLY" 2>/dev/null || true
            echo "FALLO: $msg"
            exit 1
          }
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          reemplazar_verificado() {
            ruta="$1"; firma="$2"
            if [ ! -s "$ruta" ]; then
              fallar_early "$ruta no existe para reemplazo verificado"
            fi
            if ! grep -qF "$firma" "$ruta"; then
              fallar_early "firma ausente en $ruta (contenido inesperado, NO se toca)"
            fi
            cat > "$ruta"
            echo "REEMPLAZADO-VERIFICADO: $ruta"
            echo "$ruta|REEMPLAZADO" >> "$MANIFEST"
          }
          mkdir -p apps/laboratorio/shared/contracts apps/laboratorio/domain apps/laboratorio/infrastructure/persistence apps/laboratorio/infrastructure/repositories apps/laboratorio/application/use_cases apps/laboratorio/application/handlers apps/laboratorio/routers/api apps/laboratorio/modules apps/laboratorio/templates/dashboards
          echo "=== ANCLAS: app.py y service_registry.py ==="
          python3 - << 'PYANCHOR'
          from pathlib import Path
          p = Path("apps/laboratorio/infrastructure/api/app.py")
          codigo = p.read_text(encoding="utf-8")
          ancla1 = "from apps.laboratorio.routers.public.health import registrar_rutas as registrar_salud"
          ancla2 = "registrar_salud(app)"
          assert ancla1 in codigo and ancla2 in codigo, "anclas ausentes en app.py"
          if "conectar_red(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.network_module import conectar as conectar_red")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_red(app)")
              p.write_text(codigo, encoding="utf-8")
              print("app.py: network conectado")
          else:
              print("app.py: ya contenia network")
          p2 = Path("apps/laboratorio/registry/services/service_registry.py")
          c2 = p2.read_text(encoding="utf-8")
          a_imp = "from apps.laboratorio.application.handlers.scan_handler import ManejadorEscaneo"
          assert a_imp in c2, "ancla import ausente en service_registry.py"
          if "manejador_red" not in c2:
              nuevos_imp = (
                  "from apps.laboratorio.application.handlers.network_handler import ManejadorRed\n"
                  "from apps.laboratorio.application.use_cases.network import (\n"
                  "    CasoPublicarIndicador,\n"
                  "    CasoSolicitarDatos,\n"
                  "    CasoListarContratos,\n"
                  ")\n"
                  "from apps.laboratorio.infrastructure.persistence.network_store import NetworkStore\n"
                  "from apps.laboratorio.infrastructure.repositories.network_repository import NetworkRepository\n"
              )
              c2 = c2.replace(a_imp, nuevos_imp + a_imp)
              a_reg = '    c.obtener("suscriptor_zyra")'
              assert a_reg in c2, "ancla registro ausente"
              nuevos_reg = (
                  '    c.registrar("network_store", lambda _c: NetworkStore(conexion))\n'
                  '    c.registrar("repo_red", lambda _c: NetworkRepository(_c.obtener("network_store")))\n'
                  '    c.registrar("caso_publicar_indicador", lambda _c: CasoPublicarIndicador(_c.obtener("repo_red"), _c.obtener("repo_proyectos"), _c.obtener("repo_historial"), _c.obtener("outbox"), _c.obtener("cliente_zyra"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_solicitar_datos", lambda _c: CasoSolicitarDatos(_c.obtener("repo_red"), _c.obtener("repo_historial"), _c.obtener("outbox"), _c.obtener("cliente_zyra"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("caso_listar_contratos", lambda _c: CasoListarContratos(_c.obtener("repo_red")))\n'
                  '    c.registrar("manejador_red", lambda _c: ManejadorRed(_c.obtener("caso_publicar_indicador"), _c.obtener("caso_solicitar_datos"), _c.obtener("caso_listar_contratos"), _c.obtener("auditoria_sink")))\n'
              )
              c2 = c2.replace(a_reg, nuevos_reg + a_reg)
              p2.write_text(c2, encoding="utf-8")
              print("service_registry.py ACTUALIZADO: Fase 9")
          else:
              print("service_registry.py: ya contenia Fase 9")
          PYANCHOR
          echo "apps/laboratorio/infrastructure/api/app.py|ACTUALIZADO" >> "$MANIFEST"
          echo "apps/laboratorio/registry/services/service_registry.py|ACTUALIZADO" >> "$MANIFEST"
          echo "=== CLIENTE ZYRA ampliado (reemplazo verificado, existe desde 1A-4) ==="
          reemplazar_verificado apps/laboratorio/infrastructure/network/zyra_client.py "def entregar" << 'ZYRA_EOF'
          """LAB-CORE: cliente de ZYRA Core (registro, sellado, confianza).

          Ley 1: si la red no esta configurada, lo reporta; nunca simula exito.
          Usa solo stdlib, igual que las demas apps de ZYRA.
          """
          import json as _json
          import urllib.error
          import urllib.request

          from apps.laboratorio.constants.system.system_constants import SistemaConstantes
          from apps.laboratorio.shared.exceptions.network_errors import (
              RedNoDisponibleError,
              RespuestaInvalidaError,
          )

          DESTINO_SELLO = "zyra/documents/seal"
          DESTINO_INDICADOR = "zyra/govdata/indicator"
          DESTINO_DATOS = "zyra/contracts/data-request"


          class ClienteZyra:
              """Unica puerta HTTP hacia ZYRA Core."""

              def __init__(self, config_red):
                  if config_red is None:
                      raise ValueError("ClienteZyra requiere su configuracion.")
                  self._cfg = config_red

              @property
              def configurado(self) -> bool:
                  return self._cfg.configurada

              def _peticion(self, metodo: str, ruta: str, carga: dict = None) -> dict:
                  if not self.configurado:
                      raise RedNoDisponibleError("URL de ZYRA Core no configurada.")
                  url = self._cfg.url_zyra_core.rstrip("/") + ruta
                  datos = _json.dumps(carga or {}).encode("utf-8")
                  peticion = urllib.request.Request(
                      url, data=datos if metodo != "GET" else None, method=metodo
                  )
                  peticion.add_header("Content-Type", "application/json")
                  peticion.add_header("X-ZYRA-APP", self._cfg.app_id)
                  if self._cfg.api_token:
                      peticion.add_header("Authorization", "Bearer " + self._cfg.api_token)
                  try:
                      with urllib.request.urlopen(
                          peticion, timeout=self._cfg.timeout_segundos
                      ) as respuesta:
                          crudo = respuesta.read()
                  except urllib.error.HTTPError as exc:
                      raise RedNoDisponibleError(
                          "ZYRA Core respondio HTTP " + str(exc.code)
                      ) from exc
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      raise RedNoDisponibleError(
                          "ZYRA Core inalcanzable: " + str(exc)
                      ) from exc
                  try:
                      cuerpo = _json.loads(crudo.decode("utf-8"))
                  except (ValueError, UnicodeDecodeError) as exc:
                      raise RespuestaInvalidaError(
                          "Respuesta de ZYRA Core no es JSON valido."
                      ) from exc
                  if not isinstance(cuerpo, dict):
                      raise RespuestaInvalidaError(
                          "Respuesta de ZYRA Core debe ser un objeto JSON."
                      )
                  return cuerpo

              def registrar_app(self) -> dict:
                  if not self.configurado:
                      return {"registrado": False, "motivo": "URL de ZYRA Core no configurada"}
                  return self._peticion(
                      "POST",
                      "/apps/register",
                      {
                          "app_id": self._cfg.app_id,
                          "nombre": SistemaConstantes.NOMBRE_APP,
                          "version": SistemaConstantes.VERSION_APP,
                      },
                  )

              def sellar_documento(self, titulo: str, contenido: str) -> dict:
                  if not self.configurado:
                      return {"sellado": False, "motivo": "URL de ZYRA Core no configurada"}
                  return self._peticion(
                      "POST", "/documents/seal", {"titulo": titulo, "contenido": contenido}
                  )

              def verificar_documento(self, documento_id: str) -> dict:
                  if not documento_id:
                      raise ValueError("documento_id requerido.")
                  return self._peticion("GET", "/documents/" + documento_id + "/verify")

              def entregar(self, destino: str, carga: dict) -> dict:
                  """Punto de entrega usado por el outbox (falla si no hay red)."""
                  if not self.configurado:
                      raise RedNoDisponibleError("URL de ZYRA Core no configurada.")
                  if destino == DESTINO_SELLO:
                      return self.sellar_documento(
                          str(carga.get("titulo", "")), str(carga.get("contenido", ""))
                      )
                  if destino == DESTINO_INDICADOR:
                      return self._peticion(
                          "POST", "/govdata/indicators",
                          {
                              "nombre": str(carga.get("nombre", "")),
                              "valor": carga.get("valor", 0),
                              "origen": str(carga.get("origen", "laboratorio")),
                          },
                      )
                  if destino == DESTINO_DATOS:
                      return self._peticion(
                          "POST", "/contracts/data-request",
                          {
                              "app_destino": str(carga.get("app_destino", "")),
                              "contrato": str(carga.get("contrato", "")),
                              "solicitante": str(carga.get("solicitante", "")),
                              "carga": carga.get("carga", {}),
                          },
                      )
                  raise RespuestaInvalidaError("Destino de entrega desconocido: " + destino)
          ZYRA_EOF
          echo "=== CATALOGO UNICO DE CONTRATOS ==="
          escribir apps/laboratorio/shared/contracts/apps_catalog.py << 'ZYRA_EOF'
          """Dueno unico del catalogo de apps ZYRA y sus contratos.

          LABORATORIO consume informacion autorizada de estas apps por
          contratos; nunca duplica sus motores (regla central de la red).
          """

          APPS = (
              {
                  "id": "nexo",
                  "nombre": "NEXO",
                  "dominio": "financiero, empresarial y patrimonial",
