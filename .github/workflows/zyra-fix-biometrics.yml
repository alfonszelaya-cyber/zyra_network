              b + "return\n",
              ind + 'if path == "/subastas/empresa":\n',
              b + "self.market_register_company()\n",
              b + "return\n",
              ind + 'if path == "/subastas/api/empresa/verificar":\n',
              b + "self.market_verify_company()\n",
              b + "return\n",
          ]
          lines = lines[:i] + proutes + lines[i:]
          print("INSERT: 7 POST routes")

          i = find_one('"disputes": DisputesStore(store._db, store._clock),')
          ind = leading(lines[i])
          attach = [
              ind + '"accounts": AccountsStore(store._db, store._clock),\n',
              ind + '"accounts": AccountsStore(store._db, store._clock),\n',
              ind + '"market_inscripcion_page": market_inscripcion_page,\n',
