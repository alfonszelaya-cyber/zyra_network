name: "AXIS AX-3: guardia Registro Civil (REGISTRY_OPERATORS) + dump test_axis original"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - guardia birth-register: solo REGISTRY_OPERATORS"
        run: |
          python3 - <<'GDGEOF'
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if "_ZAX3_GUARD" in t:
              print("SKIP guardia (ya aplicada)")
              raise SystemExit(0)

          # ancla: inicio del bloque birth-register en _post
          ancla = '        if s == ["birth-register"]:\n'
          assert ancla in t, "ancla birth-register"
          GUARD = (
              "        _ZAX3_GUARD = False\n"
              "        if True:\n"
              "            from"
              " apps.axis.life_history.access_control"
              " import (\n"
              "                authorize as _ax3_auth,\n"
              "            )\n"
              "            from"
              " apps.axis.life_history.permissions"
              " import (\n"
              "                REGISTRY_OPERATORS,\n"
              "            )\n"
              "            _ax3_role = (\n"
              "                self.headers.get(\n"
              "                    \"X-ZYRA-Actor-Role\"\n"
              "                ) or \"\"\n"
              "            ).strip()\n"
              "            if not _ax3_role:\n"
              "                _ax3_reg = str(\n"
              "                    doc.get(\n"
              "                        \"registrar_account\"\n"
              "                    ) or \"\"\n"
              "                )\n"
              "                if _ax3_reg:\n"
              "                    try:\n"
              "                        _ax3_acc = (\n"
              "                            type(self).\n"
              "                            store.\n"
              "                            get_account(\n"
              "                                _ax3_reg\n"
              "                            )\n"
              "                        )\n"
              "                        _ax3_role = str(\n"
              "                            _ax3_acc.get(\n"
              "                                \"role\"\n"
              "                            ) or \"\"\n"
              "                        )\n"
              "                    except LookupError:\n"
              "                        _ax3_role = \"\"\n"
              "            try:\n"
              "                _ax3_ok = _ax3_auth(\n"
              "                    \"birth.register\",\n"
              "                    _ax3_role,\n"
              "                )\n"
              "            except ValueError:\n"
              "                _ax3_ok = False\n"
              "            if not _ax3_ok:\n"
              "                self._html(\n"
              "                    403,\n"
              "                    _page(\n"
              "                        \"AXIS - Rechazado\",\n"
              "                        \"<h1>Sin autorizacion\"\n"
              "                        \"</h1><p>Solo\"\n"
              "                        \" registradores\"\n"
              "                        \" civiles (rol: \"\n"
              "                        + (_ax3_role or"
              " \"ninguno\")\n"
              "                        + \") pueden\"\n"
              "                        \" registrar\"\n"
              "                        \" partidas.</p>\"\n"
              "                        \"<a href='/axis'>\"\n"
              "                        \"<button>Volver\"\n"
              "                        \"</button></a>\",\n"
              "                    ),\n"
              "                )\n"
              "                return\n"
          )
          t = t.replace(
              ancla, GUARD + ancla, 1)
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert "_ZAX3_GUARD" in escrito
          assert "_ax3_auth" in escrito
          print("OK guardia birth-register"
                " (verificada en disco)")
          GDGEOF

      - name: "Paso 2 - tests AX-1 con rol gobierno en birth-register"
        run: |
          python3 - <<'TSEOF'
          from pathlib import Path
          p = Path(
              "apps/axis/tests/test_axis.py")
          t = p.read_text(encoding="utf-8")
          n = 0
          viejo = (
              'st, body = _ax1_post_form(\n'
              '                      base'
              ' + "/axis/birth-register",'
          )
          nuevo = (
              'st, body = _ax1_post_form(\n'
              '                      base'
              ' + "/axis/birth-register"'
              ' if False else None,'
          )
          # enfoque mas simple: anadir header al helper
          if ("X-ZYRA-Actor-Role" in t
                  and "_ax1_post_form" in t):
              print("SKIP headers (ya presentes)")
              raise SystemExit(0)
          # reescribir helper con header gobierno
          viejo_helper = (
              "def _ax1_post_form(url, form):\n"
              "                  import urllib.error\n"
              "                  import urllib.parse\n"
              "                  import urllib.request\n"
              "                  req = urllib.request.Request(\n"
              "                      url,\n"
              "                      data=urllib.parse.urlencode(\n"
              "                          form\n"
              "                      ).encode(),\n"
              "                      method=\"POST\",\n"
              "                  )"
          )
          nuevo_helper = (
              "def _ax1_post_form(url, form):\n"
              "                  import urllib.error\n"
              "                  import urllib.parse\n"
              "                  import urllib.request\n"
              "                  req = urllib.request.Request(\n"
              "                      url,\n"
              "                      data=urllib.parse.urlencode(\n"
              "                          form\n"
              "                      ).encode(),\n"
              "                      method=\"POST\",\n"
              "                      headers={\n"
              "                          \"X-ZYRA-Actor-Role\":\n"
              "                          \"gobierno\",\n"
              "                      },\n"
              "                  )"
          )
          if viejo_helper in t:
              t = t.replace(viejo_helper, nuevo_helper, 1)
              n += 1
          else:
              # buscar el helper con indentacion real
              i = t.find("def _ax1_post_form(")
              assert i >= 0, "helper no hallado"
              j = t.find("req = urllib.request.Request(", i)
              assert j >= 0, "Request no hallado en helper"
              k = t.find("method=\"POST\",", j)
              assert k >= 0
              k_end = t.find("\n", k)
              ins = (
                  "\n                      headers={\n"
                  "                          \"X-ZYRA-Actor-Role\":\n"
                  "                          \"gobierno\",\n"
                  "                      },"
              )
              t = t[:k_end] + ins + t[k_end:]
              n += 1
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          assert "X-ZYRA-Actor-Role" in p.read_text(
              encoding="utf-8")
          print("OK tests con rol gobierno ("
                + str(n) + " parche)")
          TSEOF

      - name: "Paso 2b - verificacion interprete fresco"
        run: |
          python3 -c "
          import apps.axis.server as s
          t = open('apps/axis/server.py').read()
          assert '_ZAX3_GUARD' in t
          assert '_ax3_auth' in t
          print('OK guardia viva en server')
          "

      - name: "Paso 3 - dump test_axis.py original (para guardia completa AX-3b)"
        run: |
          python3 - <<'DMPEOF'
          from pathlib import Path
          p = Path(
              "apps/axis/tests/test_axis.py")
          t = p.read_text(
              encoding="utf-8", errors="ignore")
          print("===== test_axis.py ("
                + str(len(t.splitlines()))
                + " lineas) =====")
          print(t)
          DMPEOF

      - name: "Paso 4 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AXIS AX-3: guardia Registro Civil" -m "birth-register exige REGISTRY_OPERATORS via access_control.authorize (rol por header X-ZYRA-Actor-Role o por rol de registrar_account en el store; 403 con motivo si no). Tests AX-1 envian rol gobierno. Dump de test_axis.py original en el log para disenar la guardia completa de medical/case/incident en AX-3b sin romper tests."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
