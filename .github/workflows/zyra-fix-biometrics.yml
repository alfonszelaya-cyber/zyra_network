          'display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;'
          'box-shadow:0 8px 30px rgba(139,92,246,0.45)}\n'
          'h1{margin:18px 0 4px;font-size:34px;letter-spacing:6px}\n'
          '.tag{color:#8b949e;margin:0 0 26px;text-align:center;max-width:420px}\n'
          '.estado{font-size:14px;margin:0 0 20px;padding:6px 14px;border-radius:99px;border:1px solid #238636;color:#3fb950}\n'
          '.menu{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}\n'
