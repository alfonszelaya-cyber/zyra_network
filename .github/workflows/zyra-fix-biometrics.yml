                      MigrationRunner(db, "zid.cap",
                                      _MIGRATIONS).run(clock)

                  def grant(self, *, zid, app, resource, action,
                            expires_at=None):
                      if not str(zid).strip() or \
                              not str(app).strip() or \
                              not str(resource).strip():
                          raise ValueError(
                              "zid/app/resource requeridos"
                              " (regla 63: por referencia)")
                      a = str(action).lower()
                      if a not in _ACTIONS:
                          raise ValueError("action debe ser "
                                           + "/".join(_ACTIONS))
                      cid = ("ZCAP-"
                             + uuid.uuid4().hex[:10])
                      self._db.execute(
                          "INSERT INTO zid_capabilities (cap_id,"
                          " zid, app, resource, action, status,"
                          " expires_at, created_at)"
                          " VALUES (?, ?, ?, ?, ?, 'activa', ?,"
                          " ?)",
                          (cid, str(zid), str(app),
                           str(resource), a,
                           (float(expires_at)
                            if expires_at is not None
                            else None),
                           self._clock.now()))
                      return {"cap_id": cid}

                  def can(self, zid, app, resource, action):
                      now = self._clock.now()
                      a = str(action).lower()
                      if a not in _ACTIONS:
                          raise ValueError("action invalida")
                      if a == "read":
