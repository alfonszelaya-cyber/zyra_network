name: "ZYRA NEXO NG2 operations contable (migrado mejorado del viejo)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Construir NG2 operations contable
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          OPS = "apps/nexo/domain/operations"
          UCO = "apps/nexo/application/operations_use_cases"

          # ==================================================
          # 1) OPERATIONS ENGINE (migrado mejorado)
          #    viejo: memoria, sin montos, sin empresa, sin
          #    numeracion. Nuevo: persistente, Decimal, numeracion
          #    secuencial por empresa (libro contable), maquina de
          #    estados estricta, LOGISTICS_COST (regla 70).
          # ==================================================
          forzar(OPS + "/operations_engine.py", D(r'''
              """Operations Engine - NEXO / ZYRA (migrado mejorado).

              Area operativa-contable de NEXO: ciclo de vida completo
              de operaciones contables, financieras y documentales de
              empresas, alcaldias, gobiernos y bancos. Numeracion
              secuencial por empresa (libro contable real). Montos
              SIEMPRE Decimal (regla 61). LOGISTICS_COST registra el
              costo contable de fletes/transportes (regla 70: solo lo
              contable de la logistica vive en NEXO). Toda operacion
              deja rastro auditable."""
              from __future__ import annotations
              from typing import Dict, List, Optional
              import json as _j
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              OPERATION_TYPES = ("TRANSACTION", "ADJUSTMENT", "REPORT",
                                 "DECLARATION", "AUDIT", "DOCUMENT_FLOW",
                                 "PAYMENT", "COLLECTION", "LOGISTICS_COST")
              OPERATION_STATUSES = ("DRAFT", "PENDING", "VALIDATED",
                                    "APPROVED", "IN_PROGRESS", "COMPLETED",
                                    "REJECTED", "CANCELLED")
              PRIORITIES = ("LOW", "NORMAL", "HIGH", "CRITICAL")

              _TRANSITIONS = {
                  "DRAFT": ("PENDING", "CANCELLED"),
                  "PENDING": ("VALIDATED", "REJECTED", "CANCELLED"),
                  "VALIDATED": ("APPROVED", "REJECTED", "CANCELLED"),
                  "APPROVED": ("IN_PROGRESS", "CANCELLED"),
                  "IN_PROGRESS": ("COMPLETED", "CANCELLED"),
                  "COMPLETED": (),
                  "REJECTED": (),
                  "CANCELLED": (),
              }

              _MIGRATIONS = (
                  Migration(1, "nexo_operations", (
                      "CREATE TABLE IF NOT EXISTS nexo_operations (operation_id TEXT PRIMARY KEY, operation_number INTEGER NOT NULL, company_id TEXT NOT NULL, operation_type TEXT NOT NULL, description TEXT NOT NULL DEFAULT '', amount TEXT NOT NULL DEFAULT '0', currency TEXT NOT NULL DEFAULT 'USD', status TEXT NOT NULL DEFAULT 'DRAFT', priority TEXT NOT NULL DEFAULT 'NORMAL', requested_by TEXT NOT NULL DEFAULT '', approved_by TEXT, completed_at REAL, created_at REAL NOT NULL, updated_at REAL NOT NULL, metadata_json TEXT NOT NULL DEFAULT '{}')",
                  )),
                  Migration(2, "nexo_op_counter", (
                      "CREATE TABLE IF NOT EXISTS nexo_op_counter (company_id TEXT PRIMARY KEY, last_number INTEGER NOT NULL)",
                  )),
              )

              class OperationsEngine:
                  """Motor de operaciones contables (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.operations",
                                      _MIGRATIONS).run(clock)

                  def _next_number(self, cursor, company_id) -> int:
                      cursor.execute(
                          "SELECT last_number FROM nexo_op_counter"
                          " WHERE company_id = ?", (company_id,))
                      row = cursor.fetchone()
                      if row is None:
                          cursor.execute(
                              "INSERT INTO nexo_op_counter"
                              " (company_id, last_number) VALUES (?, 1)",
                              (company_id,))
                          return 1
                      nxt = int(row["last_number"]) + 1
                      cursor.execute(
                          "UPDATE nexo_op_counter SET last_number = ?"
                          " WHERE company_id = ?", (nxt, company_id))
                      return nxt

                  def create_operation(self, *, company_id,
                                       operation_type, description="",
                                       amount="0", currency="USD",
                                       priority="NORMAL",
                                       requested_by="",
                                       metadata=None) -> dict:
                      from decimal import Decimal as _D
                      val = _D(str(amount))
                      if operation_type not in OPERATION_TYPES:
                          operation_type = "TRANSACTION"
                      if priority not in PRIORITIES:
                          priority = "NORMAL"
                      oid = "OP-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          num = self._next_number(cursor, company_id)
                          cursor.execute(
                              "INSERT INTO nexo_operations"
                              " (operation_id, operation_number,"
                              " company_id, operation_type,"
                              " description, amount, currency,"
                              " status, priority, requested_by,"
                              " approved_by, completed_at,"
                              " created_at, updated_at,"
                              " metadata_json)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?, 'DRAFT',"
                              " ?, ?, NULL, NULL, ?, ?, ?)",
                              (oid, num, company_id, operation_type,
                               description, str(val), currency,
                               priority, requested_by, now, now,
                               _j.dumps(metadata or {},
                                        default=str)))
                      return self.get_operation(oid)

                  def get_operation(self,
                                    operation_id) -> Optional[dict]:
                      row = self._db.query_one(
                          "SELECT * FROM nexo_operations"
                          " WHERE operation_id = ?", (operation_id,))
                      return self._row(row) if row else None

                  def _row(self, r) -> dict:
                      return {"operation_id": str(r["operation_id"]),
                              "operation_number":
                                  int(r["operation_number"]),
                              "company_id": str(r["company_id"]),
                              "operation_type": str(r["operation_type"]),
                              "description": str(r["description"]),
                              "amount": str(r["amount"]),
                              "currency": str(r["currency"]),
                              "status": str(r["status"]),
                              "priority": str(r["priority"]),
                              "requested_by": str(r["requested_by"]),
                              "approved_by": (str(r["approved_by"])
                                              if r["approved_by"]
                                              else None),
                              "completed_at": (float(r["completed_at"])
                                               if r["completed_at"]
                                               else None),
                              "created_at": float(r["created_at"]),
                              "updated_at": float(r["updated_at"])}

                  def transition(self, *, operation_id, new_status,
                                 actor="") -> dict:
                      op = self.get_operation(operation_id)
                      if not op:
                          raise KeyError(operation_id)
                      cur = op["status"]
                      if new_status not in _TRANSITIONS.get(cur, ()):
                          raise ValueError(
                              "transicion invalida: " + cur
                              + " -> " + new_status)
                      now = self._clock.now()
                      completed = (now if new_status == "COMPLETED"
                                   else None)
                      self._db.execute(
                          "UPDATE nexo_operations SET status = ?,"
                          " approved_by = CASE WHEN ? = 'APPROVED'"
                          " THEN ? ELSE approved_by END,"
                          " completed_at = CASE WHEN ? = 'COMPLETED'"
                          " THEN ? ELSE completed_at END,"
                          " updated_at = ? WHERE operation_id = ?",
                          (new_status, new_status, actor,
                           new_status, completed, now,
                           operation_id))
                      return self.get_operation(operation_id)

                  def list_by_company(self, company_id,
                                      status="") -> List[dict]:
                      if status:
                          rows = self._db.query_all(
                              "SELECT * FROM nexo_operations"
                              " WHERE company_id = ? AND status = ?"
                              " ORDER BY operation_number",
                              (company_id, status))
                      else:
                          rows = self._db.query_all(
                              "SELECT * FROM nexo_operations"
                              " WHERE company_id = ?"
                              " ORDER BY operation_number",
                              (company_id,))
                      return [self._row(r) for r in rows]

                  def company_totals(self, company_id) -> dict:
                      from decimal import Decimal as _D
                      rows = self._db.query_all(
                          "SELECT amount, status FROM"
                          " nexo_operations"
                          " WHERE company_id = ?", (company_id,))
                      total = _D("0")
                      completed = 0
                      for r in rows:
                          st = str(r["status"])
                          if st in ("COMPLETED", "IN_PROGRESS"):
                              total = total + _D(str(r["amount"]))
                              if st == "COMPLETED":
                                  completed = completed + 1
                      return {"total_operations": len(rows),
                              "completed": completed,
                              "active_amount": str(total)}
          '''))

          # ==================================================
          # 2) OPERATIONAL CONTROL ENGINE (controles reales)
          # ==================================================
          forzar(OPS + "/operational_control_engine.py", D(r'''
              """Operational Control Engine - NEXO / ZYRA (migrado
              mejorado). Controles de produccion sobre operaciones:
              limite de monto (Decimal) y anti-duplicado por
              fingerprint. Persistente y auditable."""
              from __future__ import annotations
              from typing import List, Optional
              import json as _j
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              CONTROL_TYPES = ("AMOUNT_LIMIT", "PERMISSION",
                               "DUPLICATE", "CONSISTENCY", "CUSTOM")

              _MIGRATIONS = (
                  Migration(1, "nexo_operation_controls", (
                      "CREATE TABLE IF NOT EXISTS nexo_operation_controls (control_id TEXT PRIMARY KEY, operation_id TEXT NOT NULL, control_type TEXT NOT NULL, rule TEXT NOT NULL DEFAULT '', status TEXT NOT NULL DEFAULT 'PENDING', passed INTEGER, result_json TEXT NOT NULL DEFAULT '{}', checked_at REAL, created_at REAL NOT NULL)",
                  )),
              )

              class OperationalControlEngine:
                  """Controles operativos (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.opcontrols",
                                      _MIGRATIONS).run(clock)

                  def register_control(self, *, operation_id,
                                       control_type, rule="") -> dict:
                      if control_type not in CONTROL_TYPES:
                          control_type = "CUSTOM"
                      cid = "CTRL-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_operation_controls"
                              " (control_id, operation_id,"
                              " control_type, rule, status, passed,"
                              " result_json, checked_at, created_at)"
                              " VALUES (?, ?, ?, ?, 'PENDING', NULL,"
                              " '{}', NULL, ?)",
                              (cid, operation_id, control_type,
                               rule, now))
                      return {"control_id": cid,
                              "operation_id": operation_id,
                              "control_type": control_type,
                              "rule": rule, "status": "PENDING"}

                  def check_amount_limit(self, *, control_id,
                                         amount, limit) -> dict:
                      from decimal import Decimal as _D
                      a = _D(str(amount))
                      l = _D(str(limit))
                      ok = a <= l
                      now = self._clock.now()
                      self._db.execute(
                          "UPDATE nexo_operation_controls SET"
                          " status = 'CHECKED', passed = ?,"
                          " result_json = ?, checked_at = ?"
                          " WHERE control_id = ?",
                          (1 if ok else 0,
                           _j.dumps({"amount": str(a),
                                     "limit": str(l),
                                     "passed": ok}), now,
                           control_id))
                      return {"control_id": control_id,
                              "passed": ok,
                              "amount": str(a), "limit": str(l)}

                  def check_duplicate(self, *, control_id,
                                      fingerprint,
                                      previous_fingerprints) -> dict:
                      ok = fingerprint not in (
                          previous_fingerprints or [])
                      now = self._clock.now()
                      self._db.execute(
                          "UPDATE nexo_operation_controls SET"
                          " status = 'CHECKED', passed = ?,"
                          " result_json = ?, checked_at = ?"
                          " WHERE control_id = ?",
                          (1 if ok else 0,
                           _j.dumps({"fingerprint": fingerprint,
                                     "duplicate": not ok}), now,
                           control_id))
                      return {"control_id": control_id,
                              "passed": ok,
                              "duplicate": not ok}

                  def controls_of(self,
                                  operation_id) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_operation_controls"
                          " WHERE operation_id = ?"
                          " ORDER BY created_at", (operation_id,))
                      return [{"control_id": str(r["control_id"]),
                               "control_type": str(r["control_type"]),
                               "rule": str(r["rule"]),
                               "status": str(r["status"]),
                               "passed": (bool(r["passed"])
                                          if r["passed"]
                                          is not None else None)}
                              for r in rows]

                  def all_passed(self, operation_id) -> bool:
                      rows = self._db.query_all(
                          "SELECT passed, status FROM"
                          " nexo_operation_controls"
                          " WHERE operation_id = ?", (operation_id,))
                      if not rows:
                          return True
                      for r in rows:
                          if str(r["status"]) == "PENDING":
                              return False
                          if not r["passed"]:
                              return False
                      return True
          '''))

          # ==================================================
          # 3) OPERATIONS VALIDATION ENGINE (ID unico por fila)
          # ==================================================
          forzar(OPS + "/operations_validation_engine.py", D(r'''
              """Operations Validation Engine - NEXO / ZYRA (migrado
              mejorado). Validaciones de produccion: monto positivo
              (Decimal), descripcion requerida. Persistidas con id
              unico por fila (leccion NG1). Resumen agregado."""
              from __future__ import annotations
              from typing import List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_operation_validations", (
                      "CREATE TABLE IF NOT EXISTS nexo_operation_validations (validation_id TEXT PRIMARY KEY, operation_id TEXT NOT NULL, validation_type TEXT NOT NULL, passed INTEGER NOT NULL, detail TEXT NOT NULL DEFAULT '', validated_at REAL NOT NULL)",
                  )),
              )

              class OperationsValidationEngine:
                  """Validaciones de operaciones (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.opvalidations",
                                      _MIGRATIONS).run(clock)

                  def validate_operation(self, *, operation_id,
                                         amount, description) -> dict:
                      from decimal import Decimal as _D
                      checks = []
                      try:
                          ok = _D(str(amount)) > 0
                          detail = "monto=" + str(amount)
                      except Exception:
                          ok = False
                          detail = "monto invalido"
                      checks.append(("AMOUNT_POSITIVE", ok, detail))
                      checks.append(("DESCRIPTION_REQUIRED",
                                     bool(str(description).strip()),
                                     "len="
                                     + str(len(str(description)))))
                      now = self._clock.now()
                      ids = []
                      with self._db.transaction() as cursor:
                          for vtype, cok, cdetail in checks:
                              vid = "VAL-" + str(uuid.uuid4())
                              cursor.execute(
                                  "INSERT INTO"
                                  " nexo_operation_validations"
                                  " (validation_id, operation_id,"
                                  " validation_type, passed, detail,"
                                  " validated_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?)",
                                  (vid, operation_id, vtype,
                                   1 if cok else 0, cdetail, now))
                              ids.append(vid)
                      failed = [c for c in checks if not c[1]]
                      return {"operation_id": operation_id,
                              "row_ids": ids,
                              "valid": len(failed) == 0,
                              "checks": [{"check": c,
                                          "passed": okk,
                                          "detail": d}
                                         for c, okk, d in checks]}

                  def validations_of(self,
                                     operation_id) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_operation_validations"
                          " WHERE operation_id = ?"
                          " ORDER BY validated_at", (operation_id,))
                      return [{"validation_id":
                                   str(r["validation_id"]),
                               "validation_type":
                                   str(r["validation_type"]),
                               "passed": bool(r["passed"]),
                               "detail": str(r["detail"])}
                              for r in rows]

                  def summary(self) -> dict:
                      row = self._db.query_one(
                          "SELECT COUNT(*) AS total,"
                          " SUM(CASE WHEN passed = 1 THEN 1"
                          " ELSE 0 END) AS ok FROM"
                          " nexo_operation_validations")
                      total = int(row["total"]) if row else 0
                      ok = int(row["ok"] or 0) if row else 0
                      return {"validations": total,
                              "successful": ok,
                              "failed": total - ok,
                              "generated_at": self._clock.now()}
          '''))

          # ==================================================
          # 4) OPERATIONAL METRICS ENGINE (Decimal, periodo)
          # ==================================================
          forzar(OPS + "/operational_metrics_engine.py", D(r'''
              """Operational Metrics Engine - NEXO / ZYRA (migrado
              mejorado). Metricas operativas por empresa y periodo,
              calculadas de nexo_operations y PERSISTIDAS (el viejo
              era en memoria). Montos Decimal (regla 61). Sirve para
              reportes a gobiernos, alcaldias y bancos."""
              from __future__ import annotations
              from typing import List
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_operation_metrics", (
                      "CREATE TABLE IF NOT EXISTS nexo_operation_metrics (metric_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, period TEXT NOT NULL, metric_name TEXT NOT NULL, metric_value TEXT NOT NULL, computed_at REAL NOT NULL)",
                  )),
              )

              class OperationalMetricsEngine:
                  """Metricas operativas (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.opmetrics",
                                      _MIGRATIONS).run(clock)

                  def compute_company_metrics(self, *, company_id,
                                              period) -> dict:
                      from decimal import Decimal as _D
                      ops = self._db.query_all(
                          "SELECT status, amount FROM"
                          " nexo_operations"
                          " WHERE company_id = ?", (company_id,))
                      total = len(ops)
                      completed = sum(1 for o in ops
                                      if str(o["status"])
                                      == "COMPLETED")
                      active_amt = _D("0")
                      for o in ops:
                          if str(o["status"]) in ("COMPLETED",
                                                  "IN_PROGRESS"):
                              active_amt = (active_amt
                                            + _D(str(o["amount"])))
                      success = (round(completed * 100.0 / total, 2)
                                 if total else 0.0)
                      metrics = {"total_operations": str(total),
                                 "completed_operations":
                                     str(completed),
                                 "active_amount": str(active_amt),
                                 "success_rate_pct": str(success)}
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          for name, value in metrics.items():
                              cursor.execute(
                                  "INSERT INTO"
                                  " nexo_operation_metrics"
                                  " (metric_id, company_id, period,"
                                  " metric_name, metric_value,"
                                  " computed_at)"
                                  " VALUES (?, ?, ?, ?, ?, ?)",
                                  ("MET-" + str(uuid.uuid4()),
                                   company_id, period, name,
                                   value, now))
                      return {"company_id": company_id,
                              "period": period,
                              "metrics": metrics}

                  def get_metrics(self, company_id,
                                  period="") -> List[dict]:
                      if period:
                          rows = self._db.query_all(
                              "SELECT * FROM nexo_operation_metrics"
                              " WHERE company_id = ? AND period = ?"
                              " ORDER BY computed_at",
                              (company_id, period))
                      else:
                          rows = self._db.query_all(
                              "SELECT * FROM nexo_operation_metrics"
                              " WHERE company_id = ?"
                              " ORDER BY computed_at",
                              (company_id,))
                      return [{"period": str(r["period"]),
                               "metric_name": str(r["metric_name"]),
                               "metric_value": str(r["metric_value"]),
                               "computed_at": float(r["computed_at"])}
                              for r in rows]
          '''))

          # ==================================================
          # 5) PROCESS TRACKING ENGINE (trazabilidad auditable)
          # ==================================================
          forzar(OPS + "/process_tracking_engine.py", D(r'''
              """Process Tracking Engine - NEXO / ZYRA (migrado
              mejorado). Trazabilidad completa de procesos: cada
              evento queda persistido (quien, que, cuando, detalle).
              Evidencia auditable para Hacienda, bancos, alcaldias
              y auditorias internas."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_process_events", (
                      "CREATE TABLE IF NOT EXISTS nexo_process_events (event_id TEXT PRIMARY KEY, process_id TEXT NOT NULL, event_type TEXT NOT NULL, actor TEXT NOT NULL DEFAULT '', detail TEXT NOT NULL DEFAULT '', created_at REAL NOT NULL)",
                  )),
              )

              class ProcessTrackingEngine:
                  """Trazabilidad de procesos (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.proctrack",
                                      _MIGRATIONS).run(clock)

                  def append_event(self, *, process_id, event_type,
                                   actor="", detail="") -> dict:
                      eid = "EVT-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_process_events"
                              " (event_id, process_id, event_type,"
                              " actor, detail, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?)",
                              (eid, process_id, event_type, actor,
                               detail, now))
                      return {"event_id": eid,
                              "process_id": process_id,
                              "event_type": event_type,
                              "actor": actor, "detail": detail,
                              "created_at": now}

                  def get_timeline(self, process_id) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_process_events"
                          " WHERE process_id = ?"
                          " ORDER BY created_at, event_id",
                          (process_id,))
                      return [{"event_id": str(r["event_id"]),
                               "event_type": str(r["event_type"]),
                               "actor": str(r["actor"]),
                               "detail": str(r["detail"]),
                               "created_at": float(r["created_at"])}
                              for r in rows]

                  def get_last_event(self,
                                     process_id) -> Optional[dict]:
                      tl = self.get_timeline(process_id)
                      return tl[-1] if tl else None

                  def event_count(self, process_id) -> int:
                      row = self._db.query_one(
                          "SELECT COUNT(*) AS c FROM"
                          " nexo_process_events"
                          " WHERE process_id = ?", (process_id,))
                      return int(row["c"]) if row else 0
          '''))

          # ==================================================
          # 6-11) LOS 6 USE CASES (reparados: las firmas del viejo
          # llamaban metodos inexistentes; ahora matchean 100%)
          # ==================================================
