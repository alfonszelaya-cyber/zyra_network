name: "CONSOL-3 v3: extraccion con textwrap.dedent (arregla IndentationError de metodos anidados) + delegaciones AST + regresion + marcadores"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[ESCRITURA] routers con dedent + server con delegaciones AST"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              tree = ast.parse(src)
              cls = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and \
                          "Handler" in node.name:
                      cls = node
              if cls is None:
                  raise RuntimeError("no handler")

              targets = ["_aid_payload", "_aid_network_seq",
                         "_aid_request", "_aid_eligibility",
                         "_aid_approve", "_aid_assign",
                         "_aid_deliver", "_aid_confirm",
                         "_screen_ayudas",
                         "_screen_ayudas_gobierno",
                         "_screen_producer",
                         "_screen_government",
                         "_screen_bank", "_home"]
              nodes = {}
              for node in cls.body:
                  if isinstance(node, (ast.FunctionDef,
                                       ast.AsyncFunctionDef)) \
                          and node.name in targets:
                      nodes[node.name] = node
              out("- encontrados " + str(len(nodes)) + "/"
                  + str(len(targets)))
              if len(nodes) < 14:
                  raise RuntimeError("faltan — abort")

              def call_args(node):
                  parts = []
                  a = node.args
                  for arg in (a.posonlyargs + a.args):
                      if arg.arg == "self":
                          continue
                      parts.append(arg.arg)
                  if a.vararg:
                      parts.append("*" + a.vararg.arg)
                  for arg in a.kwonlyargs:
                      parts.append(arg.arg + "="
                                   + arg.arg)
                  if a.kwarg:
                      parts.append("**" + a.kwarg.arg)
                  return ", ".join(parts)

              lines = src.splitlines(keepends=True)
              aid_parts = []
              scr_parts = []
              items = sorted(nodes.items(),
                             key=lambda kv: -kv[1].lineno)
              for name, node in items:
                  lo = node.lineno
                  hi = node.end_lineno
                  full = "".join(lines[lo-1:hi])
                  # DEDENT: normaliza cualquier nivel de
                  # indentacion (causa del IndentationError)
                  ded = textwrap.dedent(full)
                  fn = "h_" + name[1:]
                  rtext = ded.replace(
                      "def " + name + "(",
                      "def " + fn + "(", 1)
                  # validar que el metodo extraido compila
                  ast.parse(rtext)
                  if name.startswith("_aid"):
                      aid_parts.append(rtext)
                  else:
                      scr_parts.append(rtext)
                  call = call_args(node)
                  imp = ("from apps.agro.routers."
                         + ("aid_router import " + fn
                            if name.startswith("_aid")
                            else "screens_router import "
                                 + fn))
                  deleg = ("        " + imp + "\n"
                           "        return " + fn + "(self"
                           + (", " + call if call else "")
                           + ")\n")
                  bs = node.body[0].lineno
                  tail = lines[hi:]
                  lines = (lines[:bs-1] + [deleg] + tail)
              hdr = ('"""AGRO routers (CONSOL-3 v3, regla 77)\n'
                     '- funciones extraidas de server.py con'
                     ' dedent + firma original\n'
                     '- primer parametro "self" = el'
                     ' handler"""\n'
                     'from __future__ import annotations\n'
                     'import json\n'
                     'import uuid\n\n\n')
              rp1 = pathlib.Path(
                  "apps/agro/routers/aid_router.py")
              rp1.write_text(hdr + "\n\n".join(aid_parts),
                             encoding="utf-8")
              py_compile.compile(str(rp1), doraise=True)
              out("- **aid_router.py: "
                  + str(len(aid_parts)) + " OK**")
              rp2 = pathlib.Path(
                  "apps/agro/routers/screens_router.py")
              rp2.write_text(hdr + "\n\n".join(scr_parts),
                             encoding="utf-8")
              py_compile.compile(str(rp2), doraise=True)
              out("- **screens_router.py: "
                  + str(len(scr_parts)) + " OK**")

              new_src = "".join(lines)
              ast.parse(new_src)
              SP.write_text(new_src, encoding="utf-8")
              py_compile.compile(str(SP), doraise=True)
              out("- **server.py: 2811 -> "
                  + str(len(new_src.splitlines()))
                  + " lineas**")
              bak = pathlib.Path(
                  "apps/agro/server_backup_original.py")
              if bak.exists():
                  bak.unlink()
                  out("- backup redundante eliminado")
              with open("/tmp/consol3_ok", "w") as f:
                  f.write("OK")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO — revert automatico")
              os.system("git checkout -- apps/agro/server.py"
                        " 2>/dev/null")
              os.system("rm -f apps/agro/routers/aid_router.py"
                        " apps/agro/routers/screens_router.py"
                        " 2>/dev/null")
              out("- server y routers restaurados")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              with open("/tmp/consol3_ok", "w") as f:
                  f.write("FAIL")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion AGRO completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — refactor VALIDADO" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed)" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -50 /tmp/x3.out; echo '```'; } >> "$SUM"
            git checkout -- apps/agro/server.py 2>/dev/null
            rm -f apps/agro/routers/aid_router.py apps/agro/routers/screens_router.py
            echo "- server y routers RESTAURADOS (estado estable)" >> "$SUM"
            echo "FAIL" > /tmp/consol3_ok
          fi
          exit 0

      - name: "[ENTREGA] commit solo si marcador OK + AGRO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/consol3_ok 2>/dev/null || echo FAIL)" != "OK" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**CONSOL-3 v3 BLOQUEADA — sistema restaurado al estado estable (57 tests verde). Detalle arriba para correccion puntual.**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**CONSOL-3: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(CONSOL-3 v3, regla 77): server.py AGRO — 14 metodos extraidos a routers/aid_router.py y screens_router.py con textwrap.dedent (arregla IndentationError de metodos anidados en bloques if/try) + validacion ast.parse de cada metodo extraido ANTES de escribir + delegaciones con nombres AST + regresion AGRO verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**CONSOL-3 v3 OK — server reducido y validado. El server cumple funcionalidad completa; fase B (_post gigante) opcional a decision del dueno.**"
          exit 0
