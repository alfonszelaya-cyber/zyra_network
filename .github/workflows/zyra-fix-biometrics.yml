name: "ZYRA AUDIT 2 (integraciones)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Estado del repo
        run: |
          echo "=== ARCHIVOS DE WORKFLOW ==="
          ls -la .github/workflows || true
          echo ""
          echo "=== ULTIMOS COMMITS ==="
          git --no-pager log --oneline -8 || true
          echo ""
          echo "=== CAMBIOS SIN COMMIT ==="
          git status --short || true
          exit 0

      - name: Mapa de integraciones
        run: |
          echo "=== ARCHIVOS ==="
          find shared_engines/integrations -name "*.py" | sort || true
          echo ""
          echo "=== FUNCIONES DEL MOTOR ==="
          grep -n "def " shared_engines/integrations/engine.py | head -50 || true
          echo ""
          echo "=== SWEEP (todas las menciones) ==="
          grep -rn "sweep" shared_engines/integrations --include='*.py' | head -40 || true
          echo ""
          echo "=== DISABLED (todas las menciones) ==="
          grep -rni "disabled" shared_engines/integrations --include='*.py' | head -40 || true
          echo ""
          echo "=== MapServer (donde viven las 9 fuentes) ==="
          grep -rn "MapServer" shared_engines --include='*.py' | head -20 || true
          exit 0

      - name: Dump del test y del motor
        run: |
          ver() {
            f="$1"; s="$2"; e="$3"
            echo ""
            echo "##### $f lineas $s-$e"
            awk -v a="$s" -v b="$e" 'NR>=a && NR<=b {printf "%5d| %s\n", NR, $0}' "$f" || true
          }

          T="shared_engines/integrations/tests/test_integrations.py"
          if [ -f "$T" ]; then
            echo "### TOTAL LINEAS: $(wc -l < "$T")"
            ver "$T" 1 45
            L=$(grep -n "def test_sweep_all_sources_DISABLED" "$T" | head -1 | cut -d: -f1 || true)
            if [ -n "$L" ]; then
              s=$((L-5)); [ "$s" -lt 1 ] && s=1 || true
              ver "$T" "$s" $((L+120))
            else
              echo "!!!! no se encontro la funcion"
              grep -n "def test" "$T" || true
            fi
          else
            echo "!!!! NO EXISTE $T"
          fi

          SW=$(grep -rn "def sweep" shared_engines/integrations --include='*.py' | head -1 || true)
          if [ -n "$SW" ]; then
            F=$(echo "$SW" | cut -d: -f1)
            L=$(echo "$SW" | cut -d: -f2)
            s=$((L-10)); [ "$s" -lt 1 ] && s=1 || true
            ver "$F" "$s" $((L+130))
          else
            echo "!!!! no hay 'def sweep' en integrations"
            grep -rn "sweep_all" shared_engines --include='*.py' | head -20 || true
          fi
          exit 0

      - name: Run completo del archivo (traceback largo)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          timeout 120 python3 -m pytest shared_engines/integrations/tests/test_integrations.py -vv --tb=long 2>&1 | tail -100 || true
          exit 0
