                  return {"watch_id": str(watch_id),
                          "removed": True}


                  return None


              def publish_offer_db(db, *, category, ref,
                                   value=0.0, detail="",
                                   created_at=""):
                  """Publica una oferta y DISPARA alertas a los
                  compradores VIP que siguen esa categoria con
                  min_value <= value. Cada alerta es un evento
                  para el cartero (radar.offer_alert)."""
                  ensure_db(db)
                  if not str(category).strip() or \
                          not str(ref).strip():
                      raise ValueError(
                          "category y ref requeridos")
                  watchers = db.query_all(
                      "SELECT watch_id, buyer, min_value FROM"
                      " sb_radar_watch WHERE category = ?",
                      (str(category),))
                  fired = []
                  for w in watchers:
                      if float(value) >= \
                              float(w["min_value"]):
                          aid = ("SBA-"
                                 + uuid.uuid4().hex[:10]
                                 [::-1][:8]
                                 + uuid.uuid4().hex[:2])
                          aid = ("SBR-"
                                 + uuid.uuid4().hex[:10])
                          db.execute(
                              "INSERT INTO sb_radar_alerts"
                              " (alert_id, buyer, category,"
                              " ref, value, detail, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?)",
                              (aid, str(w["buyer"]),
                               str(category), str(ref),
                               _sf(value), str(detail),
                               str(created_at)))
                          fired.append(str(w["buyer"]))
                  return {"category": str(category),
                          "ref": str(ref),
                          "alerts_fired": len(fired),
                          "buyers": fired,
                          "event": "radar.offer_alert"}


                  return None


