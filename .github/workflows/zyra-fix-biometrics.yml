              with pytest.raises(ValueError):
                  ss.close_session(s["session_id"])
              assert len(ss.sessions_of("ZID-1")) == 1
              print("OK R-9: sesiones con TTL + firmas con sello verificable (alteracion detectada) + cierre terminal")
