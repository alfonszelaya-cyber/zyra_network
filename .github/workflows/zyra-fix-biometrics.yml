              forzar("apps/agro/modules/recursos_y_activos/inventarios/inventory_batch_engine.py",
                     D(r'''
                  """Inventory Batch Engine (A-8) - inventario
                  avanzado con LOTES: batch tracking, fecha de
                  VENCIMIENTO, consumo FIFO (primero en entra
                  primero en sale, por entry_seq) o FEFO (primero
                  en vencer primero en sale), movimientos
                  trazables y reporte de VENCIDOS. Stock
                  insuficiente -> ValueError con disponible
                  (regla 66). Reglas 68/76."""
                  from __future__ import annotations
                  import uuid
                  from shared_engines.storage.database import (
                      Database)
                  from shared_engines.storage.migrations import (
                      Migration, MigrationRunner)

                  _MIGRATIONS = (
                      Migration(1, "batch_tables", (
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_inventory_batches ("
                          " batch_id TEXT PRIMARY KEY,"
                          " producer_id TEXT NOT NULL, product"
                          " TEXT NOT NULL, quantity REAL NOT"
                          " NULL, unit TEXT NOT NULL DEFAULT '',"
                          " expiry_date TEXT NOT NULL DEFAULT"
                          " '', entry_seq INTEGER NOT NULL,"
                          " created_at TEXT)",
                          "CREATE TABLE IF NOT EXISTS"
                          " agro_batch_moves ("
                          " move_id TEXT PRIMARY KEY, batch_id"
                          " TEXT NOT NULL, quantity REAL NOT"
                          " NULL, direction TEXT NOT NULL,"
                          " reason TEXT NOT NULL DEFAULT '',"
                          " created_at TEXT)",
                      )),
                  )


                  def add_batch_db(db, *, producer_id, product,
                                   quantity, unit="",
                                   expiry_date="",
                                   created_at=""):
                      if float(quantity) <= 0:
                          raise ValueError(
                              "cantidad positiva")
                      seq_row = db.query_one(
                          "SELECT COALESCE(MAX(entry_seq), 0)"
                          " AS mx FROM agro_inventory_batches"
                          " WHERE producer_id = ?",
                          (str(producer_id),))
                      seq = int(seq_row["mx"]) + 1
                      bid = ("BTCH-"
                             + uuid.uuid4().hex[:10])
                      db.execute(
                          "INSERT INTO"
                          " agro_inventory_batches (batch_id,"
                          " producer_id, product, quantity,"
                          " unit, expiry_date, entry_seq,"
                          " created_at) VALUES (?, ?, ?, ?, ?,"
                          " ?, ?, ?)",
                          (bid, str(producer_id),
                           str(product), float(quantity),
                           str(unit), str(expiry_date), seq,
                           str(created_at)))
                      db.execute(
                          "INSERT INTO agro_batch_moves"
                          " (move_id, batch_id, quantity,"
                          " direction, reason, created_at)"
                          " VALUES (?, ?, ?, 'IN', 'alta de"
                          " lote', ?)",
                          ("BMOV-" + uuid.uuid4().hex[:10],
                           bid, float(quantity),
                           str(created_at)))
                      return {"batch_id": bid,
                              "entry_seq": seq,
                              "quantity": float(quantity)}


                  def _pick_order(policy):
                      p = str(policy).upper()
                      if p == "FIFO":
                          return (p, "entry_seq ASC")
                      if p == "FEFO":
                          return (p,
                                  "CASE WHEN expiry_date = ''"
                                  " THEN '9999-12-31' ELSE"
                                  " expiry_date END ASC,"
                                  " entry_seq ASC")
                      raise ValueError(
                          "policy debe ser FIFO o FEFO")


                  def consume_db(db, *, producer_id, product,
                                 quantity, policy="FIFO",
                                 reason="", created_at=""):
                      p, order = _pick_order(policy)
                      need = float(quantity)
                      if need <= 0:
                          raise ValueError(
                              "cantidad positiva")
                      rows = db.query_all(
                          "SELECT batch_id, quantity,"
                          " expiry_date FROM"
                          " agro_inventory_batches WHERE"
                          " producer_id = ? AND product = ?"
                          " AND quantity > 0 ORDER BY "
                          + order,
                          (str(producer_id),
                           str(product)))
                      available = sum(float(r["quantity"])
                                      for r in rows)
                      if available < need:
                          raise ValueError(
                              "stock insuficiente:"
                              " pedido "
                              + str(need)
                              + ", disponible "
                              + str(available)
                              + " (" + p + ")")
                      taken = []
                      rest = need
                      for r in rows:
                          if rest <= 0:
                              break
                          bid = str(r["batch_id"])
                          have = float(r["quantity"])
                          take = min(have, rest)
                          db.execute(
                              "UPDATE"
                              " agro_inventory_batches SET"
                              " quantity = quantity - ? WHERE"
                              " batch_id = ?", (take, bid))
                          db.execute(
                              "INSERT INTO agro_batch_moves"
                              " (move_id, batch_id, quantity,"
                              " direction, reason, created_at)"
                              " VALUES (?, ?, ?, 'OUT', ?, ?)",
                              ("BMOV-"
                               + uuid.uuid4().hex[:10],
                               bid, take,
                               (str(reason) + " [" + p
                                + "]"),
                               str(created_at)))
                          taken.append({"batch_id": bid,
                                        "taken": take,
                                        "expiry": str(
                                            r["expiry_date"])})
                          rest -= take
                      return {"policy": p,
                              "consumed": need,
                              "from_batches": taken}


                  def stock_of_db(db, producer_id, product=""):
                      if str(product).strip():
                          rows = db.query_all(
                              "SELECT product, unit,"
                              " SUM(quantity) AS total FROM"
                              " agro_inventory_batches WHERE"
                              " producer_id = ? AND product ="
                              " ? GROUP BY product, unit ORDER"
                              " BY product",
                              (str(producer_id),
                               str(product)))
                      else:
                          rows = db.query_all(
                              "SELECT product, unit,"
                              " SUM(quantity) AS total FROM"
                              " agro_inventory_batches WHERE"
                              " producer_id = ? GROUP BY"
                              " product, unit ORDER BY"
                              " product",
                              (str(producer_id),))
                      return [{"product": str(r["product"]),
                               "unit": str(r["unit"]),
                               "total": float(r["total"]
                                              or 0.0)}
                              for r in rows]


                  def batches_of_db(db, producer_id,
                                    product=""):
                      if str(product).strip():
                          rows = db.query_all(
                              "SELECT batch_id, product,"
                              " quantity, unit, expiry_date,"
                              " entry_seq FROM"
                              " agro_inventory_batches WHERE"
                              " producer_id = ? AND product ="
                              " ? ORDER BY entry_seq",
                              (str(producer_id),
                               str(product)))
                      else:
                          rows = db.query_all(
                              "SELECT batch_id, product,"
                              " quantity, unit, expiry_date,"
                              " entry_seq FROM"
                              " agro_inventory_batches WHERE"
                              " producer_id = ? ORDER BY"
                              " entry_seq",
                              (str(producer_id),))
                      return [{"batch_id": str(
                                   r["batch_id"]),
                               "product": str(r["product"]),
                               "quantity": float(
                                   r["quantity"]),
                               "unit": str(r["unit"]),
                               "expiry_date": str(
                                   r["expiry_date"]),
                               "entry_seq": int(
                                   r["entry_seq"])}
                              for r in rows]


                  def moves_of_db(db, batch_id):
                      rows = db.query_all(
                          "SELECT move_id, quantity, direction,"
                          " reason, created_at FROM"
                          " agro_batch_moves WHERE batch_id ="
                          " ? ORDER BY rowid",
                          (str(batch_id),))
                      return [{"move_id": str(r["move_id"]),
                               "quantity": float(
                                   r["quantity"]),
                               "direction": str(
                                   r["direction"]),
                               "reason": str(r["reason"]),
                               "created_at": str(
                                   r["created_at"])}
                              for r in rows]


                  def expired_of_db(db, producer_id,
                                    as_of=""):
                      rows = db.query_all(
                          "SELECT batch_id, product, quantity,"
                          " unit, expiry_date FROM"
                          " agro_inventory_batches WHERE"
