# =====================================================================
# ZYRA - workflow revD (reemplaza COMPLETO el archivo
# .github/workflows/zyra-fix-biometrics.yml y se dispara a mano).
#
# Que hace:
#   1. Localiza superapp.py (unico archivo del repo con bloque ZYRA-V6).
#   2. Reemplaza SOLO el contenido entre /*ZYRA-V6-BEGIN*/ y /*ZYRA-V6-END*/
#      por el nucleo revD. Todo lo demas queda byte a byte igual
#      (verificacion de esqueleto integrada; si cambia algo, aborta).
#   3. Valida antes de publicar (todo-o-nada):
#        - py_compile de superapp.py original y parcheado
#        - node --check del nucleo revD (sintaxis JS real)
#        - marcadores unicos, protecciones base intactas
#   4. Si TODO pasa: hace commit y push. Si algo falla: no publica nada.
#
# Reglas del flujo revD (las que confirmo el dueno):
#   R1 Paso 1: solo formato del nombre (aun no hay fotos que comparar).
#   R2 Paso 2: FRENTE = lado con la FOTO y los datos. Camara en marco
#      pequeno con CAPTURAR visible. Falla -> se queda en paso 2.
#   R3 Paso 3: REVERSO = lado de la DIRECCION / codigo MRZ. Nombre del
#      documento distinto -> paso 1. Mala lectura -> queda en paso 3.
#      Vencido -> queda en paso 3. Pasaporte: 1 solo lado, no pide reverso.
#   R4 Nunca se saltan pasos ni se reinicia todo: regresa solo al paso que
#      fallo (excepto nombre mal, que regresa al paso 1).
#   R5 Paso 4: selfie con 3 intentos; tras 3 fallas regresa al paso del
#      documento que dio la cara y se repite en orden (3 -> 4).
#   R6 Paso 5: claves iguales -> ZID; si no, se queda en paso 5.
# =====================================================================
name: zyra-fix-biometrics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zyra-fix-biometrics
  cancel-in-progress: false

