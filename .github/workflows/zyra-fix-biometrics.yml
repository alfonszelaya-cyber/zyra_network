name: "ZYRA - AUDITORIA EX-4/EX-3/EX-DES (solo lectura, 2 min)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Auditar los 3 puntos
        run: |
          python - <<'PYEOF'
          import ast, importlib, os, subprocess, sys, traceback
          from pathlib import Path

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          L = []
          A = L.append


          def finalizar():
              md = "\n".join(L)
              if summary:
                  with open(summary, "a") as fh:
                      fh.write(md + "\n")
              sys.exit(0)


          A("# 🔍 AUDITORIA EX-4 (capacitacion) · EX-3 (camara) · EX-DES (desastres)\n")

          A("## 1. EX-4 Capacitacion — que existe\n")
          p = Path("apps/laboratorio/application/use_cases/build_presentation.py")
          A("- build_presentation.py: " + ("existe" if p.is_file() else "NO EXISTE"))
          if p.is_file():
              t = p.read_text(errors="replace")
              for marca in ("class CasoCrearPresentacion", "class CasoReproducirPresentacion",
                            "class CasoSellarPresentacion", "pasos"):
                  A("  - " + marca + ": " + ("SI" if marca in t else "NO"))
          p2 = Path("apps/laboratorio/domain/presentation.py")
          A("- domain/presentation.py: " + ("existe" if p2.is_file() else "NO EXISTE"))
          if p2.is_file():
              t2 = p2.read_text(errors="replace")
              A("  - estructura de Paso: " + str([n.name for n in ast.parse(t2).body if isinstance(n, ast.ClassDef)]))
          p3 = Path("apps/laboratorio/infrastructure/providers/presentation_remote.py")
          A("- presentation_remote.py (control interactivo): " + ("existe" if p3.is_file() else "NO"))
          A("- evaluacion/certificado: " + ("BUSCAR: no existe ningun archivo de evaluacion"
            if not list(Path("apps/laboratorio").rglob("*evaluacion*")) and not list(Path("apps/laboratorio").rglob("*certificado*"))
            else "hay archivos relacionados"))
          A("")

          A("## 2. EX-3 Camara orbital — que existe\n")
          for ruta, marcas in (
              ("apps/laboratorio/domain/scene.py", ["class Escena3D", "objetos"]),
              ("apps/laboratorio/infrastructure/providers/renderer_3d.py", ["DISTANCIA_FOCAL", "_proyectar", "Z_POR_CAPA"]),
              ("apps/laboratorio/domain/timeline.py", ["class"]),
              ("apps/laboratorio/infrastructure/providers/warper.py", ["def warpear", "invertir3x3"]),
          ):
              p = Path(ruta)
              if not p.is_file():
                  A("- " + ruta + ": NO EXISTE")
                  continue
              t = p.read_text(errors="replace")
              A("- " + ruta + ": existe")
              for marca in marcas:
                  A("  - " + marca + ": " + ("SI" if marca in t else "NO"))
          A("")

          A("## 3. EX-DES Gemelo-AXIS desastres — que existe\n")
          axis_p = Path("apps/axis/life_history/emergency_dispatch.py")
          A("- AXIS emergency_dispatch: " + ("existe" if axis_p.is_file() else "NO EXISTE"))
          if axis_p.is_file():
              t = axis_p.read_text(errors="replace")
              A("  - clases: " + str([n.name for n in ast.parse(t).body if isinstance(n, ast.ClassDef)]))
          puente = Path("apps/laboratorio/infrastructure/providers/citizens_engine.py")
          A("- citizens_engine (evacuacion): " + ("existe" if puente.is_file() else "NO"))
          if puente.is_file():
              t = puente.read_text(errors="replace")
              A("  - evacuar: " + ("SI" if "def evacuar" in t else "NO"))
              A("  - salidas: " + ("SI" if "_salidas" in t else "NO"))
          A("- EVENTOS de la Red (para conectar AXIS->gemelo):")
          ev = Path("apps/laboratorio/constants/events/event_names.py")
          if ev.is_file():
              A("  - event_names.py existe: " + str([n.value for n in ast.parse(ev.read_text()).body
                  if isinstance(n, ast.Assign)][:0] or "ver archivo"))
          outbox = Path("apps/laboratorio/infrastructure/messaging/outbox.py")
          A("- outbox (entrega a la Red): " + ("existe" if outbox.is_file() else "NO"))
          A("")

          A("## 4. Montaje real + suite actual\n")
          try:
              mod = importlib.import_module("apps.laboratorio.infrastructure.api.app")
              app = mod.montar_aplicacion(":memory:")
              A("- montaje OK · rutas: " + str(len(app.listar_rutas())))
          except Exception:
              A("- MONTAJE FALLO:")
              A("```")
              A(traceback.format_exc()[-900:])
              A("```")
          r = subprocess.run([sys.executable, "-m", "pytest", "apps/laboratorio/tests", "-q", "--tb=line"],
                             capture_output=True, text=True, timeout=600)
          A("- suite: " + str(r.returncode) + " -> " + ((r.stdout or r.stderr or "").strip().splitlines()[-1] if (r.stdout or r.stderr) else "?"))
          A("")

          A("## 5. LO QUE SE NECESITA\n")
          A("- EX-4: clase EvaluacionCurso + CasoCertificar (reforzando presentation_remote y sellando via outbox existente)")
          A("- EX-3: motor camara orbital (posicion/angulo/proyeccion) reforzando renderer_3d + ruta de recorrido en world4d")
          A("- EX-DES: puente desastres (mapa tipo de desastre -> zonas seguras + ayuda) reforzando citizens_engine.evacuar + evento Red via outbox hacia AXIS")
          finalizar()
          PYEOF

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-ex3
          path: auditoria_ex3.md
