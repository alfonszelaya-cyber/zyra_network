name: "ZYRA NEXO NG5+NG6 fiscal completo + gobierno y meta gobierno"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] Construir NG5 fiscal completo"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          FI = "apps/nexo/domain/finance"

          forzar(FI + "/fiscal_engine.py", D(r'''
              """Fiscal Engine - motor fiscal configurable (NG5).
              Tipos de impuesto (IVA, RENTA, RETENCION, MUNICIPAL,
              ESPECIAL) con tasas por pais. Calculo sobre base,
              obligaciones fiscales (declarar -> pagar) y resumen
              del periodo. Montos SIEMPRE 2 decimales (regla 61).
              La conexion con cada Hacienda es conector externo;
              el motor fiscal pertenece a NEXO."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              TAX_TYPES = ("IVA", "RENTA", "RETENCION",
                           "MUNICIPAL", "ESPECIAL")
              _Q = "0.01"

              _MIGRATIONS = (
                  Migration(1, "nexo_fiscal_rates", (
                      "CREATE TABLE IF NOT EXISTS nexo_fiscal_rates (rate_id TEXT PRIMARY KEY, country TEXT NOT NULL, tax_type TEXT NOT NULL, rate_pct TEXT NOT NULL, active INTEGER NOT NULL DEFAULT 1, created_at REAL NOT NULL, UNIQUE(country, tax_type))",
                  )),
                  Migration(2, "nexo_fiscal_obligations", (
                      "CREATE TABLE IF NOT EXISTS nexo_fiscal_obligations (obligation_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, period TEXT NOT NULL, tax_type TEXT NOT NULL, base TEXT NOT NULL, tax_amount TEXT NOT NULL, paid TEXT NOT NULL DEFAULT '0', currency TEXT NOT NULL DEFAULT 'USD', status TEXT NOT NULL DEFAULT 'PENDING', created_at REAL NOT NULL)",
                  )),
              )

              class FiscalEngine:
                  """Motor fiscal configurable (Decimal 2d)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.fiscal",
                                      _MIGRATIONS).run(clock)

                  def set_rate(self, *, country, tax_type,
                               rate_pct) -> dict:
                      from decimal import Decimal as _D
                      if tax_type not in TAX_TYPES:
                          raise ValueError(
                              "tipo invalido: " + str(tax_type))
                      rate = _D(str(rate_pct)).quantize(_D(_Q))
                      if rate < 0:
                          raise ValueError("tasa >= 0")
                      rid = "FR-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_fiscal_rates"
                              " (rate_id, country, tax_type,"
                              " rate_pct, active, created_at)"
                              " VALUES (?, ?, ?, ?, 1, ?)"
                              " ON CONFLICT(country, tax_type)"
                              " DO UPDATE SET rate_pct ="
                              " excluded.rate_pct",
                              (rid, country, tax_type, str(rate),
                               now))
                      return {"country": country,
                              "tax_type": tax_type,
                              "rate_pct": str(rate)}

                  def get_rate(self, country,
                               tax_type) -> str:
                      from decimal import Decimal as _D
                      row = self._db.query_one(
                          "SELECT rate_pct FROM nexo_fiscal_rates"
                          " WHERE country = ? AND tax_type = ?"
                          " AND active = 1", (country, tax_type))
                      if not row:
                          raise ValueError("sin tasa: " + country
                                           + "/" + tax_type)
                      return str(_D(str(row["rate_pct"])
                                ).quantize(_D(_Q)))

                  def calculate_tax(self, *, base, tax_type,
                                    country="SV") -> str:
                      from decimal import Decimal as _D
                      b = _D(str(base)).quantize(_D(_Q))
                      if b < 0:
                          raise ValueError("base >= 0")
                      rate = _D(self.get_rate(country, tax_type))
                      return str((b * rate
                                  / _D("100")).quantize(_D(_Q)))

                  def declare_obligation(self, *, company_id,
                                         period, tax_type, base,
                                         country="SV",
                                         currency="USD") -> dict:
                      tax = self.calculate_tax(
                          base=base, tax_type=tax_type,
                          country=country)
                      oid = "FOB-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO"
                              " nexo_fiscal_obligations"
                              " (obligation_id, company_id,"
                              " period, tax_type, base,"
                              " tax_amount, paid, currency,"
                              " status, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, '0', ?,"
                              " 'PENDING', ?)",
                              (oid, company_id, period, tax_type,
                               str(base), tax, currency, now))
                      return self.get_obligation(oid)

                  def get_obligation(self,
                                     obligation_id) -> Optional[dict]:
                      from decimal import Decimal as _D
                      row = self._db.query_one(
                          "SELECT * FROM nexo_fiscal_obligations"
                          " WHERE obligation_id = ?",
                          (obligation_id,))
                      if not row:
                          return None
                      tax = _D(str(row["tax_amount"]))
                      paid = _D(str(row["paid"]))
                      return {"obligation_id":
                                  str(row["obligation_id"]),
                              "company_id":
                                  str(row["company_id"]),
                              "period": str(row["period"]),
                              "tax_type": str(row["tax_type"]),
                              "base": str(row["base"]),
                              "tax_amount": str(tax),
                              "paid": str(paid.quantize(_D(_Q))),
                              "balance": str(
                                  (tax - paid).quantize(_D(_Q))),
                              "currency": str(row["currency"]),
                              "status": str(row["status"])}

                  def register_payment(self, *, obligation_id,
                                       amount) -> dict:
                      from decimal import Decimal as _D
                      obl = self.get_obligation(obligation_id)
                      if not obl:
                          raise KeyError(obligation_id)
                      pay = _D(str(amount)).quantize(_D(_Q))
                      if pay <= 0:
                          raise ValueError("pago positivo")
                      bal = _D(obl["balance"])
                      if pay > bal:
                          raise ValueError("pago mayor que saldo")
                      new_paid = (_D(obl["paid"])
                                  + pay).quantize(_D(_Q))
                      tax = _D(obl["tax_amount"])
                      status = ("PAID" if new_paid == tax
                                else "PARTIAL")
                      self._db.execute(
                          "UPDATE nexo_fiscal_obligations SET"
                          " paid = ?, status = ? WHERE"
                          " obligation_id = ?",
                          (str(new_paid), status,
                           obligation_id))
                      return self.get_obligation(obligation_id)

                  def obligations_of(self, company_id,
                                     period="") -> List[dict]:
                      if period:
                          rows = self._db.query_all(
                              "SELECT obligation_id FROM"
                              " nexo_fiscal_obligations WHERE"
                              " company_id = ? AND period = ?"
                              " ORDER BY created_at",
                              (company_id, period))
                      else:
                          rows = self._db.query_all(
                              "SELECT obligation_id FROM"
                              " nexo_fiscal_obligations WHERE"
                              " company_id = ?"
                              " ORDER BY created_at",
                              (company_id,))
                      return [self.get_obligation(
                          str(r["obligation_id"]))
                          for r in rows]

                  def summary(self, company_id, period) -> dict:
                      from decimal import Decimal as _D
                      obls = self.obligations_of(company_id,
                                                 period)
                      declared = _D("0")
                      paid = _D("0")
                      for o in obls:
                          declared = (declared
                                      + _D(o["tax_amount"]))
                          paid = paid + _D(o["paid"])
                      declared = declared.quantize(_D(_Q))
                      paid = paid.quantize(_D(_Q))
                      return {"company_id": company_id,
                              "period": period,
                              "declared": str(declared),
                              "paid": str(paid),
                              "pending": str(
                                  (declared - paid
                                   ).quantize(_D(_Q))),
                              "obligations": len(obls)}
          '''))

          forzar(FI + "/fiscal_calendar_engine.py", D(r'''
              """Fiscal Calendar Engine - calendario de vencimientos
              fiscales (NG5). Fechas limite por impuesto y periodo,
              proximos vencimientos, vencidos, marcado de
              presentacion. Persistente."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _MIGRATIONS = (
                  Migration(1, "nexo_fiscal_deadlines", (
                      "CREATE TABLE IF NOT EXISTS nexo_fiscal_deadlines (deadline_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, period TEXT NOT NULL, tax_type TEXT NOT NULL, due_at REAL NOT NULL, description TEXT NOT NULL DEFAULT '', filed INTEGER NOT NULL DEFAULT 0, created_at REAL NOT NULL)",
                  )),
              )

              class FiscalCalendarEngine:
                  """Vencimientos fiscales (persistente)."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.fiscalcal",
                                      _MIGRATIONS).run(clock)

                  def add_deadline(self, *, company_id, period,
                                   tax_type, due_days,
                                   description="") -> dict:
                      did = "FDL-" + str(uuid.uuid4())
                      now = self._clock.now()
                      due = now + (int(due_days) * 86400)
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO"
                              " nexo_fiscal_deadlines"
                              " (deadline_id, company_id, period,"
                              " tax_type, due_at, description,"
                              " filed, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?, 0, ?)",
                              (did, company_id, period, tax_type,
                               due, description, now))
                      return {"deadline_id": did,
                              "company_id": company_id,
                              "period": period,
                              "tax_type": tax_type,
                              "due_at": due,
                              "filed": False}

                  def _row(self, r) -> dict:
                      return {"deadline_id":
                                  str(r["deadline_id"]),
                              "company_id":
                                  str(r["company_id"]),
                              "period": str(r["period"]),
                              "tax_type": str(r["tax_type"]),
                              "due_at": float(r["due_at"]),
                              "description":
                                  str(r["description"]),
                              "filed": bool(r["filed"])}

                  def upcoming(self, company_id,
                               days=30) -> List[dict]:
                      now = self._clock.now()
                      limit = now + (int(days) * 86400)
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_fiscal_deadlines"
                          " WHERE company_id = ? AND filed = 0"
                          " AND due_at >= ? AND due_at <= ?"
                          " ORDER BY due_at",
                          (company_id, now, limit))
                      return [self._row(r) for r in rows]

                  def overdue(self, company_id) -> List[dict]:
                      now = self._clock.now()
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_fiscal_deadlines"
                          " WHERE company_id = ? AND filed = 0"
                          " AND due_at < ? ORDER BY due_at",
                          (company_id, now))
                      return [self._row(r) for r in rows]

                  def mark_filed(self, deadline_id) -> dict:
                      self._db.execute(
                          "UPDATE nexo_fiscal_deadlines SET"
                          " filed = 1 WHERE deadline_id = ?",
                          (deadline_id,))
                      row = self._db.query_one(
                          "SELECT * FROM nexo_fiscal_deadlines"
                          " WHERE deadline_id = ?", (deadline_id,))
                      return self._row(row) if row else None
          '''))

          forzar(FI + "/fiscal_reconciliation_engine.py", D(r'''
              """Fiscal Reconciliation Engine - conciliacion
              fiscal-contable (NG5). Compara obligaciones fiscales
              declaradas vs lo registrado en contabilidad por tipo
              de impuesto. Diferencias reportadas y persistidas."""
              from __future__ import annotations
              from typing import Dict, List
              import json as _j
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _Q = "0.01"

              _MIGRATIONS = (
                  Migration(1, "nexo_fiscal_reconciliations", (
                      "CREATE TABLE IF NOT EXISTS nexo_fiscal_reconciliations (reconciliation_id TEXT PRIMARY KEY, company_id TEXT NOT NULL, period TEXT NOT NULL, matched INTEGER NOT NULL, differences_json TEXT NOT NULL DEFAULT '[]', created_at REAL NOT NULL)",
                  )),
              )

              class FiscalReconciliationEngine:
                  """Conciliacion fiscal vs contable."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.fiscalrec",
                                      _MIGRATIONS).run(clock)

                  def reconcile(self, *, company_id, period,
                                fiscal_by_type,
                                book_by_type) -> dict:
                      from decimal import Decimal as _D
                      tipos = set(list(fiscal_by_type.keys())
                                  + list(book_by_type.keys()))
                      items = []
                      matched = 0
                      for t in sorted(tipos):
                          f = _D(str(fiscal_by_type.get(t, "0"))
                                 ).quantize(_D(_Q))
                          b = _D(str(book_by_type.get(t, "0"))
                                 ).quantize(_D(_Q))
                          ok = f == b
                          if ok:
                              matched = matched + 1
                          items.append({
                              "tax_type": t,
                              "fiscal": str(f),
                              "book": str(b),
                              "difference":
                                  str((f - b).quantize(_D(_Q))),
                              "matched": ok})
                      rid = "FREC-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO"
                              " nexo_fiscal_reconciliations"
                              " (reconciliation_id, company_id,"
                              " period, matched,"
                              " differences_json, created_at)"
                              " VALUES (?, ?, ?, ?, ?, ?)",
                              (rid, company_id, period, matched,
                               _j.dumps(items, default=str),
                               now))
                      return {"reconciliation_id": rid,
                              "company_id": company_id,
                              "period": period,
                              "matched": matched,
                              "total": len(items),
                              "all_matched":
                                  matched == len(items),
                              "items": items}
          '''))

          out("## FIN NG5: fiscal completo")
          exit(0)
          PYEOF

      - name: "[ESCRITURA] Construir NG6 gobierno (7 engines + 7 use cases)"
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  out("- **" + p.name + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip() + "\n```")

          GOV = "apps/nexo/domain/government"
          UCG = "apps/nexo/application/government_use_cases"

          forzar(GOV + "/government_registry.py", D(r'''
              """Government Registry - instituciones y presupuesto
              publico (NG6). Programas con ejecucion presupuestaria
              en 4 fases: presupuesto -> comprometido -> devengado
              (accrued) -> pagado, con validacion de saldos en cada
              fase. Contabilidad gubernamental real para alcaldias,
              ministerios e instituciones. Decimal 2d (regla 61)."""
              from __future__ import annotations
              from typing import List, Optional
              import uuid
              from shared_engines.common.clocks import Clock
              from shared_engines.storage.database import Database
              from shared_engines.storage.migrations import (
                  Migration, MigrationRunner)

              _Q = "0.01"
              INSTITUTION_KINDS = ("MINISTRY", "MUNICIPALITY",
                                   "AGENCY", "AUTONOMOUS")

              _MIGRATIONS = (
                  Migration(1, "nexo_gov_institutions", (
                      "CREATE TABLE IF NOT EXISTS nexo_gov_institutions (institution_id TEXT PRIMARY KEY, name TEXT NOT NULL, kind TEXT NOT NULL DEFAULT 'AGENCY', country TEXT NOT NULL DEFAULT 'SV', active INTEGER NOT NULL DEFAULT 1, created_at REAL NOT NULL)",
                  )),
                  Migration(2, "nexo_gov_programs", (
                      "CREATE TABLE IF NOT EXISTS nexo_gov_programs (program_id TEXT PRIMARY KEY, institution_id TEXT NOT NULL, name TEXT NOT NULL, period TEXT NOT NULL, budgeted TEXT NOT NULL DEFAULT '0', committed TEXT NOT NULL DEFAULT '0', accrued TEXT NOT NULL DEFAULT '0', paid TEXT NOT NULL DEFAULT '0', currency TEXT NOT NULL DEFAULT 'USD', status TEXT NOT NULL DEFAULT 'ACTIVE', created_at REAL NOT NULL)",
                  )),
              )

              class GovernmentRegistry:
                  """Instituciones + presupuesto publico ejecutado."""

                  def __init__(self, db, clock):
                      self._db = db
                      self._clock = clock
                      MigrationRunner(db, "nexo.govreg",
                                      _MIGRATIONS).run(clock)

                  def create_institution(self, *, name,
                                         kind="AGENCY",
                                         country="SV") -> dict:
                      if kind not in INSTITUTION_KINDS:
                          kind = "AGENCY"
                      iid = "GOV-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO"
                              " nexo_gov_institutions"
                              " (institution_id, name, kind,"
                              " country, active, created_at)"
                              " VALUES (?, ?, ?, ?, 1, ?)",
                              (iid, name, kind, country, now))
                      return {"institution_id": iid,
                              "name": name, "kind": kind,
                              "country": country,
                              "active": True}

                  def institutions(self,
                                   active=True) -> List[dict]:
                      rows = self._db.query_all(
                          "SELECT * FROM nexo_gov_institutions"
                          " WHERE active = ? ORDER BY name",
                          (1 if active else 0,))
                      return [{"institution_id":
                                   str(r["institution_id"]),
                               "name": str(r["name"]),
                               "kind": str(r["kind"]),
                               "country": str(r["country"]),
                               "active": bool(r["active"])}
                              for r in rows]

                  def create_program(self, *, institution_id,
                                     name, period, budgeted,
                                     currency="USD") -> dict:
                      from decimal import Decimal as _D
                      b = _D(str(budgeted)).quantize(_D(_Q))
                      if b < 0:
                          raise ValueError("presupuesto >= 0")
                      pid = "PRG-" + str(uuid.uuid4())
                      now = self._clock.now()
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO nexo_gov_programs"
                              " (program_id, institution_id,"
                              " name, period, budgeted,"
                              " committed, accrued, paid,"
                              " currency, status, created_at)"
                              " VALUES (?, ?, ?, ?, ?, '0', '0',"
                              " '0', ?, 'ACTIVE', ?)",
                              (pid, institution_id, name,
                               period, str(b), currency, now))
                      return self.get_program(pid)

                  def get_program(self,
                                  program_id) -> Optional[dict]:
                      from decimal import Decimal as _D
                      row = self._db.query_one(
                          "SELECT * FROM nexo_gov_programs WHERE"
                          " program_id = ?", (program_id,))
                      if not row:
                          return None
                      q = lambda c: str(_D(
                          str(row[c])).quantize(_D(_Q)))
                      b = _D(q("budgeted"))
                      paid = _D(q("paid"))
                      pct = (round(float(paid / b) * 100, 2)
                             if b > 0 else 0.0)
                      return {"program_id":
                                  str(row["program_id"]),
                              "institution_id":
                                  str(row["institution_id"]),
                              "name": str(row["name"]),
                              "period": str(row["period"]),
                              "budgeted": q("budgeted"),
                              "committed": q("committed"),
                              "accrued": q("accrued"),
                              "paid": q("paid"),
                              "available_budget": str(
                                  (b - _D(q("committed"))
                                   ).quantize(_D(_Q))),
                              "execution_pct": pct,
                              "currency":
                                  str(row["currency"]),
                              "status": str(row["status"])}

                  def commit_funds(self, *, program_id,
                                   amount) -> dict:
                      from decimal import Decimal as _D
                      p = self.get_program(program_id)
                      amt = _D(str(amount)).quantize(_D(_Q))
                      if amt <= 0:
                          raise ValueError("monto positivo")
                      avail = (_D(p["budgeted"])
                               - _D(p["committed"]))
                      if amt > avail:
                          raise ValueError(
                              "compromiso excede presupuesto:"
                              " disponible " + str(avail))
                      new = (_D(p["committed"])
                             + amt).quantize(_D(_Q))
                      self._db.execute(
                          "UPDATE nexo_gov_programs SET"
                          " committed = ? WHERE program_id = ?",
                          (str(new), program_id))
                      return self.get_program(program_id)

                  def accrue(self, *, program_id, amount) -> dict:
                      from decimal import Decimal as _D
                      p = self.get_program(program_id)
                      amt = _D(str(amount)).quantize(_D(_Q))
                      if amt <= 0:
                          raise ValueError("monto positivo")
                      avail = (_D(p["committed"])
                               - _D(p["accrued"]))
                      if amt > avail:
                          raise ValueError(
                              "devengo excede comprometido:"
                              " disponible " + str(avail))
                      new = (_D(p["accrued"])
                             + amt).quantize(_D(_Q))
                      self._db.execute(
                          "UPDATE nexo_gov_programs SET"
                          " accrued = ? WHERE program_id = ?",
                          (str(new), program_id))
                      return self.get_program(program_id)

                  def pay(self, *, program_id, amount) -> dict:
                      from decimal import Decimal as _D
                      p = self.get_program(program_id)
                      amt = _D(str(amount)).quantize(_D(_Q))
                      if amt <= 0:
                          raise ValueError("monto positivo")
                      avail = (_D(p["accrued"])
                               - _D(p["paid"]))
                      if amt > avail:
                          raise ValueError(
                              "pago excede devengado:"
                              " disponible " + str(avail))
                      new = (_D(p["paid"])
                             + amt).quantize(_D(_Q))
                      self._db.execute(
                          "UPDATE nexo_gov_programs SET"
                          " paid = ? WHERE program_id = ?",
