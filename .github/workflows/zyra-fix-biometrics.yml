                  st, body = _axz_json(
                      "POST",
                      base + "/axis/api/verify/redeem",
                      {"code": code,
                       "requester": "Otro",
                       "requester_role": "empleador"},
                      role=None)
                  assert st == 409, "re-uso 409"
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          for req in (
