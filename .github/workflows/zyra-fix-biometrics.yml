name: ZYRA D3 contrato de la red e icono 3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: Contrato de registro y biometria, e icono 3D
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          PORTAL = ROOT / 'portal'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseD3.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def pedir(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  resp = urllib.request.urlopen(req, timeout=10)
                  return resp.status, resp.headers, resp.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, None, str(e)

          def chunk(tipo, datos):
              cuerpo = tipo + datos
              return struct.pack('>I', len(datos)) + cuerpo + struct.pack('>I', zlib.crc32(cuerpo) & 0xffffffff)

          def hexa(v):
              return max(0, min(255, int(v)))

          def icono_3d(size):
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              m = int(size * 0.10)
              cubo_izq = m
              cubo_der = size - m
              cubo_sup = int(size * 0.16)
              cubo_inf = size - int(size * 0.20)
              fila_cubo = cubo_der - cubo_izq
              grosor_lado = int(fila_cubo * 0.12)
              purp = (139, 92, 246)
              azul = (59, 130, 246)
              rosa = (236, 72, 153)
              fondo_arriba = (10, 14, 39)
              fondo_abajo = (6, 9, 24)
              filas = []
              for y in range(size):
                  fila = bytearray()
                  fila.append(4)
                  for x in range(size):
                      tf = y / float(size - 1)
                      r = hexa(fondo_arriba[0] + (fondo_abajo[0] - fondo_arriba[0]) * tf)
                      g = hexa(fondo_arriba[1] + (fondo_abajo[1] - fondo_arriba[1]) * tf)
                      b = hexa(fondo_arriba[2] + (fondo_abajo[2] - fondo_arriba[2]) * tf)
                      dentro = (cubo_izq <= x < cubo_der) and (cubo_sup <= y < cubo_inf)
                      if dentro:
                          dx = (x - cubo_izq) / float(fila_cubo)
                          dy = (y - cubo_sup) / float(cubo_inf - cubo_sup)
                          t = (dx + dy) / 2.0
                          if t < 0.5:
                              k = t / 0.5
                              cr = purp[0] + (azul[0] - purp[0]) * k
                              cg = purp[1] + (azul[1] - purp[1]) * k
                              cb = purp[2] + (azul[2] - purp[2]) * k
                          else:
                              k = (t - 0.5) / 0.5
                              cr = azul[0] + (rosa[0] - azul[0]) * k
                              cg = azul[1] + (rosa[1] - azul[1]) * k
                              cb = azul[2] + (rosa[2] - azul[2]) * k
                          alto = 0.55 + 0.45 * dy
                          cr *= alto
                          cg *= alto
                          cb *= alto
                          borde = (dx < 0.06 or dx > 0.94 or dy < 0.06 or dy > 0.94)
                          if borde:
                              cr = min(255, cr * 1.35 + 30)
                              cg = min(255, cg * 1.35 + 30)
                              cb = min(255, cb * 1.35 + 30)
                          t_diag = (dx - 0.5) * 0.9 + (dy - 0.5) * 0.4
                          if abs(t_diag - 0.16) < 0.05 or abs(t_diag + 0.12) < 0.045:
                              cr, cg, cb = 255, 255, 255
                          t_diag2 = (dx - 0.5) * 0.55 + (dy - 0.5) * 0.9
                          if abs(t_diag2 - 0.18) < 0.045:
                              cr, cg, cb = 255, 255, 255
                          fila += bytes((hexa(cr), hexa(cg), hexa(cb), 255))
                      else:
                          en_sombra = (cubo_izq - grosor_lado * 0.4 <= x < cubo_der + grosor_lado * 0.4) and (cubo_inf <= y < size - m * 0.4)
                          if en_sombra:
                              ts = (y - cubo_inf) / float(max(1, size - m * 0.4 - cubo_inf))
                              r = hexa(r * 0.5 + 40 * (1 - ts))
                              g = hexa(g * 0.5 + 50 * (1 - ts))
                              b = hexa(min(255, b * 0.6 + 120 * (1 - ts)))
                          brillo = (cubo_izq - grosor_lado <= x < cubo_izq) and (cubo_sup + grosor_lado <= y < cubo_inf)
                          if brillo:
                              r, g, b = hexa(purp[0] * 0.8 + 25), hexa(purp[1] * 0.8 + 25), hexa(purp[2] * 0.8 + 40)
                          fila += bytes((r, g, b, 255))
                  filas.append(bytes(fila))
              raw = b''.join(filas)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')

          sp_orig = SP_FILE.read_bytes()
          ico1 = PORTAL / 'icon-192.png'
          ico2 = PORTAL / 'icon-512.png'
          originales = {'sp': sp_orig, 'i1': ico1.read_bytes(), 'i2': ico2.read_bytes()}
          creados = []

          def revertir():
              try:
                  SP_FILE.write_bytes(originales['sp'])
                  ico1.write_bytes(originales['i1'])
                  ico2.write_bytes(originales['i2'])
                  for c in creados:
                      p = ROOT / c
                      if p.exists():
                          p.unlink()
              except Exception:
                  pass

          nf0, np0 = 0, 0
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              nf0 += 1
              if p.suffix == '.py':
                  np0 += 1

          add('# D3 - CONTRATO DE LA RED + ICONO 3D')
          add('')

          add('## B1. Contrato de /identity/register (el texto de la Red)')
          add('')
          for rel in ('shared_engines/runtime/api.py',
                      'shared_engines/runtime/combined_api.py',
                      'shared_engines/runtime/capabilities_api.py',
                      'main.py'):
              t = txt(ROOT / rel)
              if not t:
                  continue
              hits = []
              for i, ln in enumerate(t.splitlines()):
                  if re.search(r'(?i)identity/register|kind|register', ln) and re.search(r'(?i)(def |route|path|==|startswith|req|field|campo)', ln):
                      hits.append('%d: %s' % (i + 1, ln.strip()[:150]))
              if hits:
                  add('**%s** (%d lineas):' % (rel, len(hits)))
                  add('```python')
                  for h in hits[:25]:
                      add(h)
                  add('```')
          add('')

          add('## B2. Valores validos de kind (busqueda en todo shared_engines)')
          add('')
          valores = set()
          for p in (ROOT / 'shared_engines').rglob('*.py'):
              if '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              if p.stat().st_size == 0:
                  continue
              for m in re.finditer(r'(?i)(?:kind|tipo)\s*(?:==|in)\s*["\'](\w+)["\']|["\'](persona|ciudadano|empresa|menor|adulto|individual)["\']', txt(p)):
                  valores.add(m.group(1) or m.group(2))
          add('- Valores encontrados en el codigo: %s' % sorted(valores))
          DATA['kinds'] = sorted(valores)
          add('')

          add('## B3. Motor biometrico: como recibe documento y selfie')
          add('')
          bio_hits = []
          for p in (ROOT / 'shared_engines').rglob('*.py'):
              if '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              t = txt(p)
              if 'biomet' in t.lower() and ('def ' in t or 'path ==' in t or 'route' in t.lower()):
                  rel = str(p.relative_to(ROOT))
                  for i, ln in enumerate(t.splitlines()):
                      if re.search(r'(?i)(def .*bio|bio.*path|/bio|verify_face|compar|selfie|documento|id_document|base64|multipart)', ln):
                          bio_hits.append('%s:%d: %s' % (rel, i + 1, ln.strip()[:140]))
                          if len(bio_hits) >= 30:
                              break
              if len(bio_hits) >= 30:
                  break
          add('%d lineas relevantes:' % len(bio_hits))
          add('```python')
          for h in bio_hits:
              add(h)
          add('```')
          add('')

          add('## B4. Sonda en vivo: registro con kind y campos de prueba')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-d3', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-d3', 'PORT': str(SP), 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sonda = []
          if vivo:
              H = {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN}
              pruebas = [
                  {'kind': 'persona'},
                  {'kind': 'persona', 'name': 'Prueba CI'},
                  {'kind': 'persona', 'name': 'Prueba CI', 'document': '00000000-0'},
                  {'kind': 'persona', 'name': 'Prueba CI', 'document': '00000000-0', 'birth_date': '1990-01-01'},
              ]
              for i, payload in enumerate(pruebas, 1):
                  req = urllib.request.Request(BASE + '/identity/register', data=json.dumps(payload).encode('utf-8'), headers=H, method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=8) as r:
                          sonda.append((i, r.status, r.read().decode('utf-8', errors='replace')[:300]))
                  except urllib.error.HTTPError as e:
                      sonda.append((i, e.code, e.read().decode('utf-8', errors='replace')[:300]))
                  except Exception as e:
                      sonda.append((i, None, str(e)[:150]))
              for i, st, cuerpo in sonda:
                  add('- prueba %d -> %s | %s' % (i, st, cuerpo[:220]))
          else:
              add('- red no arranco, sonda omitida')
          DATA['sonda'] = [(str(a), str(b), c[:200]) for a, b, c in sonda]
          gate('sonda_ejecutada', len(sonda) >= 1)
          add('')

          try:
              if proc.poll() is None:
                  proc.terminate()
                  proc.wait(timeout=10)
          except Exception:
              try:
                  proc.kill()
              except Exception:
                  pass

          add('## B5. Icono 3D nuevo (estilo cubo de cristal, degradado, Z)')
          add('')
          ico1.write_bytes(icono_3d(192))
          ico2.write_bytes(icono_3d(512))
          add('- icon-192.png e icon-512.png regenerados: cubo con caras iluminadas,')
          add('  bordes brillantes, Z dibujada en trazos blancos, sombra base con')
          add('  reflejo azul/rosa. Estilo de la referencia que enviaste.')
          gate('icono_3d', True)
          add('')

          add('## B6. Verificacion de los PNG')
          add('')
          for n in ('icon-192.png', 'icon-512.png'):
              p = PORTAL / n
              ok = p.exists() and p.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n' and len(p.read_bytes()) > 500
              add('- %s: %s (%d bytes)' % (n, 'OK' if ok else 'FALLO', p.stat().st_size if p.exists() else 0))
              gate('png_' + n.replace('-', '_').replace('.png', ''), ok)
          add('')

          add('## Compilacion y sistema (rapido)')
          add('')
          comp = True
          try:
              py_compile.compile(str(SP_FILE), doraise=True)
          except Exception:
              comp = False
          gate('sp_intacto_compila', comp)
          add('')

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit del contrato (icono si se guardara).**' % ', '.join(fallos))
          else:
              add('**CONTRATO CAPTURADO + ICONO 3D LISTO. Commit.**')
              add('')
              add('Con B1-B4 se disenia el registro biométrico exacto; te lo presento en palabras para tu aprobacion.')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          Path('faseD3.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D3 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portal/icon-192.png portal/icon-512.png
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(diseno): icono 3D cubo de cristal con degradado y Z"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseD3-zyra
          path: faseD3.json
          if-no-files-found: ignore
