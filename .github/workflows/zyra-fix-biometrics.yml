          n_e = t0sp.count(VIEJO_ENTRAR)
          add('- bloque /entrar actual: %d (1)' % n_e)

          ANCLA_HEALTH = '        if path == "/health":'
          n_h = t0sp.count(ANCLA_HEALTH)
          add('- ancla /health: %d (1)' % n_h)
          ANCLA_VERIFY = '        if path == "/verify":'
          n_v = t0sp.count(ANCLA_VERIFY)
          add('- ancla /verify: %d (1)' % n_v)
          ANCLA_LOOP = '        for prefix, info in APPS.items():'
          n_l = t0sp.count(ANCLA_LOOP)
          add('- ancla loop APPS: %d (2)' % n_l)
          anclas_ok = (n_a == 1 and n_b == 1 and n_e == 1 and n_h == 1
                       and n_v == 1 and n_l == 2)
          gate('anclas_exactas', anclas_ok)
          if not anclas_ok:
              add('**ANCHORS NO UNICOS: nada editado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseD6.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS NO UNICOS - sin cambios')
          add('')

          BLOQUE_ENTRAR = '\n'.join([
          '        if path == "/entrar":',
          '            largo = int(self.headers.get("Content-Length", 0) or 0)',
          '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
          '            from urllib.parse import unquote_plus as _uq',
          '            zid = ""',
          '            clave = ""',
