name: "AXIS AX-2 v3: ZID nacimiento + censo + ingesta (helper con except corregido)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso 1 - RED: /identity/birth-zid (idempotente)"
        run: |
          python3 - <<'BZEOF'
          from pathlib import Path
          p = Path(
              "shared_engines/runtime/api.py")
          t = p.read_text(encoding="utf-8")
          if '"birth-zid"' in t:
              print("SKIP birth-zid (ya existe)")
              raise SystemExit(0)
          ancla = (
              '        elif s == ["identity",'
              ' "enroll"]:\n'
          )
          assert ancla in t, "ancla elif enroll"
          R = (
              '        if s == ["identity",'
              ' "birth-zid"]:\n'
              "            self._handle_birth_zid()\n"
              "            return\n"
          )
          t = t.replace(ancla, R + ancla, 1)
          ancla_h = (
              "    def _handle_identity_enroll"
              "(self) -> None:\n"
          )
          assert ancla_h in t, "ancla handler"
          H = (
              "    def _handle_birth_zid("
              "self) -> None:\n"
              "        \"\"\"ADDITIVE: ZID de"
              " nacimiento. Actor ACTIVE,"
              " REGISTERED sin biometria"
              " (upgrade posterior al MISMO"
              " ZID via proofing/bind).\"\"\"\n"
              "        doc = self._read_json()\n"
              "        actor_zid = (\n"
              "            self._require_str(\n"
              "                doc, \"actor_zid\"\n"
              "            )\n"
              "        )\n"
              "        cert_hash = (\n"
              "            self._require_str(\n"
              "                doc, \"cert_hash\"\n"
              "            )\n"
              "        )\n"
              "        child_name = (\n"
              "            self._require_str(\n"
              "                doc, \"child_name\"\n"
              "            )\n"
              "        )\n"
              "        actor = type(self)."
              "kernel.identity.get_identity("
              "actor_zid)\n"
              "        if actor is None:\n"
              "            raise ApiError(\n"
              "                403,\n"
              "                \"forbidden\",\n"
              "                \"actor desconocido\",\n"
              "            )\n"
              "        if actor.status.value"
              " != \"ACTIVE\":\n"
              "            raise ApiError(\n"
              "                403,\n"
              "                \"forbidden\",\n"
              "                \"actor no ACTIVE\",\n"
              "            )\n"
              "        from"
              " shared_engines.identity.contracts"
              " import IdentityKind\n"
              "        identity = type("
              "self).kernel.identity."
              "register_identity(\n"
              "            kind=(\n"
              "                IdentityKind.PERSON\n"
              "            ),\n"
              "            display_name=child_name,\n"
              "            actor=(\n"
              "                \"birth-zid:\"\n"
              "                + actor_zid\n"
              "            ),\n"
              "        )\n"
              "        type(self).kernel.audit."
              "append(\n"
              "            event_type=(\n"
              "                \"identity.birth_zid\"\n"
              "            ),\n"
              "            actor=actor_zid,\n"
              "            subject=identity.zid,\n"
              "            detail={\n"
              "                \"cert_hash\": (\n"
              "                    cert_hash\n"
              "                ),\n"
              "            },\n"
              "        )\n"
              "        self._ok(\n"
              "            {\n"
              "                \"identity\": (\n"
              "                    _identity_json(\n"
              "                        identity\n"
              "                    )\n"
              "                ),\n"
              "                \"cert_hash\": (\n"
              "                    cert_hash\n"
              "                ),\n"
              "            },\n"
              "            status=201,\n"
              "        )\n\n"
          )
          t = t.replace(
              ancla_h, H + ancla_h, 1)
          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          assert "_handle_birth_zid" in escrito
          print("OK RED birth-zid (en disco)")
          BZEOF

      - name: "Paso 2 - RED: verificacion import fresco"
        run: |
          python3 -c "
          from shared_engines.runtime.api import ZyraApiHandler
          assert hasattr(ZyraApiHandler, '_handle_birth_zid')
          print('OK birth-zid vivo en la Red')
          "

      - name: "Paso 3 - server AXIS: helper ZID + automatico + censo + ingesta (un solo parche)"
        run: |
          python3 - <<'SVCEOF'
          from pathlib import Path
          p = Path("apps/axis/server.py")
          t = p.read_text(encoding="utf-8")
          if "_birth_zid_request" in t:
              print("SKIP server (ya aplicado)")
              raise SystemExit(0)

          # ---- helper censo (antes de _lh) ----
          ancla = "    def _lh(self):\n"
          assert ancla in t, "ancla _lh"
          CENSO = (
              "    def _censo_data(self):\n"
              "        life = self._lh()\n"
              "        db = life._store._db\n"
              "        def _count(sql):\n"
              "            row = db.query_one(sql)\n"
              "            if row is None:\n"
              "                return 0\n"
              "            try:\n"
              "                return int(row[\"n\"])\n"
              "            except Exception:\n"
              "                try:\n"
              "                    return int(row[0])\n"
              "                except Exception:\n"
              "                    return 0\n"
              "        total = _count(\n"
              "            \"SELECT COUNT(*) AS n\"\n"
              "            \" FROM life_persons\"\n"
              "        )\n"
              "        verificados = _count(\n"
              "            \"SELECT COUNT(*) AS n\"\n"
              "            \" FROM life_persons WHERE\"\n"
              "            \" status =\"\n"
              "            \" 'biometric_verified'\"\n"
              "        )\n"
              "        con_zid = _count(\n"
              "            \"SELECT COUNT(*) AS n\"\n"
              "            \" FROM life_persons WHERE\"\n"
              "            \" zid IS NOT NULL\"\n"
              "        )\n"
              "        por_sexo = {}\n"
              "        for row in (\n"
              "            db.query_all(\n"
              "                \"SELECT sex, COUNT(*)\"\n"
              "                \" AS n FROM\"\n"
              "                \" life_persons GROUP\"\n"
              "                \" BY sex\"\n"
              "            )\n"
              "            or []\n"
              "        ):\n"
              "            try:\n"
              "                por_sexo[\n"
              "                    str(row[\"sex\"])\n"
              "                ] = int(row[\"n\"])\n"
              "            except Exception:\n"
              "                continue\n"
              "        return {\n"
              "            \"poblacion_registrada\": (\n"
              "                total\n"
              "            ),\n"
              "            \"verificados\": (\n"
              "                verificados\n"
              "            ),\n"
              "            \"con_zid\": con_zid,\n"
              "            \"sin_zid\": (\n"
              "                total - con_zid\n"
              "            ),\n"
              "            \"por_sexo\": por_sexo,\n"
              "            \"fuente\": (\n"
              "                \"cadena nacional\"\n"
              "                \" inmodificable\"\n"
              "            ),\n"
              "        }\n"
              "\n"
          )
          t = t.replace(ancla, CENSO + ancla, 1)
          print("OK helper censo")

          # ---- helper birth-zid (con except corregido) ----
          ancla = "    def _lh(self):\n"
          BZ = (
              "    def _birth_zid_request(\n"
              "        self, cert_hash, child_name,\n"
              "    ):\n"
              "        from"
              " apps.axis.life_history.permissions"
              " import (\n"
              "            REGISTRY_OPERATORS,\n"
              "        )\n"
              "        store = type(self).store\n"
              "        rows = (\n"
              "            store._db.query_all(\n"
              "                \"SELECT account_id,\"\n"
              "                \" zid, role FROM\"\n"
              "                \" axis_accounts\"\n"
              "            )\n"
              "            or []\n"
              "        )\n"
              "        for row in rows:\n"
              "            try:\n"
              "                zid = row[\"zid\"]\n"
              "                role = row[\"role\"]\n"
              "            except Exception:\n"
              "                continue\n"
              "            if zid is None:\n"
              "                continue\n"
              "            if role not in (\n"
              "                REGISTRY_OPERATORS\n"
              "            ):\n"
              "                continue\n"
              "            ok, data, err = (\n"
              "                type(self).link.\n"
              "                _client.post(\n"
              "                    \"/identity/\"\n"
              "                    \"birth-zid\",\n"
              "                    {\n"
              "                        \"actor_zid\":\n"
              "                        str(zid),\n"
              "                        \"cert_hash\":\n"
              "                        str(cert_hash),\n"
              "                        \"child_name\":\n"
              "                        str(child_name),\n"
              "                    },\n"
              "                )\n"
              "            )\n"
              "            if ok and data:\n"
              "                ident = (\n"
              "                    (data or {}).get(\n"
              "                        \"identity\"\n"
              "                    ) or {}\n"
              "                )\n"
              "                z = ident.get(\"zid\")\n"
              "                if isinstance(\n"
              "                    z, str\n"
              "                ) and z.startswith(\n"
              "                    \"ZID-\"\n"
              "                ):\n"
              "                    return z\n"
              "        return None\n"
              "\n"
          )
          t = t.replace(ancla, BZ + ancla, 1)
          print("OK helper birth-zid (try con except)")

          # ---- insertar ZID automatico antes de seal = ( ----
          ancla_s = "        seal = (\n"
          assert ancla_s in t, "ancla seal"
          INS = (
              "        zid_nacimiento = None\n"
              "        try:\n"
              "            zid_nacimiento = (\n"
              "                self._birth_zid_request(\n"
              "                    str(birth.get(\n"
              "                        \"cert_hash\"\n"
              "                    )),\n"
              "                    str(birth.get(\n"
              "                        \"child_name\"\n"
              "                    ) or \"\"),\n"
              "                )\n"
              "            )\n"
              "            if zid_nacimiento:\n"
              "                life._store.attach_zid(\n"
              "                    str(birth.get(\n"
              "                        \"person_id\"\n"
              "                    )),\n"
              "                    zid=zid_nacimiento,\n"
              "                    actor=\"birth-zid\",\n"
              "                )\n"
              "        except Exception:\n"
              "            zid_nacimiento = None\n"
          )
          t = t.replace(ancla_s, INS + ancla_s, 1)
          print("OK ZID automatico en partida")

          # ---- rutas censo + ingesta ----
          ancla_home = (
              "        if not s or s == [\"home\"]:\n"
          )
          assert ancla_home in t, "ancla home"
          t = t.replace(
              ancla_home,
              "        if s == [\"gobierno\", \"censo\"]:\n"
              "            self._censo_screen()\n"
              "            return\n"
              + ancla_home,
              1)
          print("OK ruta censo pantalla")

          ancla_api = '        if s == ["health"]:\n'
          assert ancla_api in t, "ancla api health"
          API = (
              "        if s == [\"gobierno\", \"censo\"]:\n"
              "            from"
              " apps.axis.life_history.permissions"
              " import authorize\n"
              "            role = (\n"
              "                self.headers.get(\n"
              "                    \"X-ZYRA-Actor-Role\"\n"
              "                ) or \"\"\n"
              "            )\n"
              "            if role != \"gobierno\":\n"
              "                self._send(\n"
              "                    403,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"forbidden\",\n"
              "                            \"message\":\n"
              "                            \"censo solo\"\n"
              "                            \" gobierno\",\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            self._send(\n"
              "                200,\n"
              "                {\n"
              "                    \"ok\": True,\n"
              "                    \"data\": (\n"
              "                        self._censo_data()\n"
              "                    ),\n"
              "                },\n"
              "            )\n"
              "            return\n"
              "        if s == [\"gobierno\", \"ingesta\"]:\n"
              "            from"
              " apps.axis.life_history.permissions"
              " import authorize\n"
              "            role = (\n"
              "                self.headers.get(\n"
              "                    \"X-ZYRA-Actor-Role\"\n"
              "                ) or \"\"\n"
              "            )\n"
              "            if not authorize(\n"
              "                \"birth.register\", role\n"
              "            ):\n"
              "                self._send(\n"
              "                    403,\n"
              "                    {\n"
              "                        \"ok\": False,\n"
              "                        \"error\": {\n"
              "                            \"type\":\n"
              "                            \"forbidden\",\n"
              "                            \"message\":\n"
              "                            \"ingesta solo\"\n"
              "                            \" registradores\",\n"
              "                        },\n"
              "                    },\n"
              "                )\n"
              "                return\n"
              "            doc = self._read_json()\n"
              "            life = self._lh()\n"
              "            birth = life.\n"
              "            register_birth_with_network(\n"
              "                registrar_account=(\n"
              "                    str(doc.get(\n"
              "                        \"registrar_account\"\n"
              "                    ) or \"ingesta\")\n"
              "                ),\n"
              "                child_name=self._req(\n"
              "                    doc, \"child_name\"\n"
              "                ),\n"
              "                birth_date=self._req(\n"
              "                    doc, \"birth_date\"\n"
              "                ),\n"
              "                birth_place=str(\n"
              "                    doc.get(\n"
              "                        \"birth_place\"\n"
              "                    ) or \"\"\n"
              "                ),\n"
              "                sex=self._req(\n"
              "                    doc, \"sex\"\n"
              "                ),\n"
              "                mother_name=self._req(\n"
              "                    doc, \"mother_name\"\n"
              "                ),\n"
              "                mother_zid=self._req(\n"
              "                    doc, \"mother_zid\"\n"
              "                ),\n"
              "                father_name=doc.get(\n"
              "                    \"father_name\"\n"
              "                ),\n"
              "                father_zid=doc.get(\n"
              "                    \"father_zid\"\n"
              "                ),\n"
              "                source_hospital=str(\n"
              "                    doc.get(\"source\")\n"
              "                    or \"ingesta\"\n"
              "                ),\n"
              "            )\n"
              "            self._send(\n"
              "                201,\n"
              "                {\n"
              "                    \"ok\": True,\n"
              "                    \"data\": {\n"
              "                        \"birth_id\": str(\n"
              "                            birth.get(\n"
              "                                \"birth_id\"\n"
              "                            )\n"
              "                        ),\n"
              "                        \"person_id\": str(\n"
              "                            birth.get(\n"
              "                                \"person_id\"\n"
              "                            )\n"
              "                        ),\n"
              "                        \"network_ok\": bool(\n"
              "                            birth.get(\n"
              "                                \"network_ok\"\n"
              "                            )\n"
              "                        ),\n"
              "                    },\n"
              "                },\n"
              "            )\n"
              "            return\n"
          )
          t = t.replace(
              ancla_api, API + ancla_api, 1)
          print("OK rutas API censo+ingesta")

          # ---- pantalla censo falta: metodo _censo_screen ----
          ancla_scr = "    def _censo_data(self):\n"
          assert ancla_scr in t
          if "_censo_screen" not in t:
              SCR = (
                  "    def _censo_screen(self) -> None:\n"
                  "        d = self._censo_data()\n"
                  "        body = (\n"
                  "            \"<h1>📊 Censo Nacional\"\n"
                  "            \" en Vivo</h1>\"\n"
                  "            \"<p>Fuente: \"\n"
                  "            + d[\"fuente\"] + \"</p>\"\n"
                  "            \"<div class='card'>\"\n"
                  "            \"<p>Poblacion: <b>\"\n"
                  "            + str(d[\n"
                  "                \"poblacion_registrada\"\n"
                  "            ]) + \"</b></p>\"\n"
                  "            \"<p>Verificados: <b>\"\n"
                  "            + str(d[\"verificados\"])\n"
                  "            + \"</b></p>\"\n"
                  "            \"<p>Con ZID: <b>\"\n"
                  "            + str(d[\"con_zid\"])\n"
                  "            + \"</b> | Sin ZID: <b>\"\n"
                  "            + str(d[\"sin_zid\"])\n"
                  "            + \"</b></p>\"\n"
                  "            \"<p>Por sexo: \"\n"
                  "            + str(d[\"por_sexo\"])\n"
                  "            + \"</p></div>\"\n"
                  "            \"<a href='/axis/gobierno'>\"\n"
                  "            \"<button>Volver</button></a>\"\n"
                  "        )\n"
                  "        self._html(\n"
                  "            200,\n"
                  "            _page(\n"
                  "                \"AXIS - Censo\", body\n"
                  "            ),\n"
                  "        )\n"
                  "\n"
              )
              t = t.replace(
                  ancla_scr, SCR + ancla_scr, 1)
              print("OK pantalla censo")

          compile(t, str(p), "exec")
          p.write_text(t, encoding="utf-8")
          escrito = p.read_text(encoding="utf-8")
          for req in (
              "_birth_zid_request",
              "_censo_data",
              "_censo_screen",
              "zid_nacimiento",
              '["gobierno", "censo"]',
              '["gobierno", "ingesta"]',
          ):
              assert req in escrito, req
          print("OK server completo (verificado en disco)")
          SVCEOF

      - name: "Paso 4 - verificacion interprete fresco"
        run: |
          python3 -c "
          from shared_engines.runtime.api import ZyraApiHandler
          assert hasattr(ZyraApiHandler, '_handle_birth_zid')
          import apps.axis.server as s
          print('OK import fresco: RED + server compilan')
          "

      - name: "Paso 5 - GATE: 4 apps completas"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AXIS AX-2 v3: ZID nacimiento + censo + ingesta" -m "FIX: helper _birth_zid_request tenia try sin except (sintaxis invalida detectada por compile antes de escribir; repo intacto). RED: POST /identity/birth-zid (actor ACTIVE, REGISTERED sin biometria, upgrade al MISMO ZID). AXIS: ZID automatico al registrar partida (bebe nace CON ZID), censo de gobierno en vivo (403 sin rol), ingesta gubernamental (solo registradores)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
