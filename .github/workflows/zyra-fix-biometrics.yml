name: zyra-fix-biometrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ZYRA-FIX v4 (parchear, probar, verificar)
        id: fix
        run: |
          cat > "$RUNNER_TEMP/zyra_fix.py" << 'ZYRA_PY_EOF'
          import os, re, sys, subprocess

          TMP = os.environ.get('RUNNER_TEMP') or '/tmp'
          REPO = os.getcwd()
          RUTA = os.path.join(REPO, 'superapp.py')
          SUMA = os.environ.get('GITHUB_STEP_SUMMARY') or os.path.join(TMP, 'zyra_informe.md')
          SALIDA = os.environ.get('GITHUB_OUTPUT') or os.path.join(TMP, 'zyra_out.txt')

          EST = {'aplicados': [], 'ya': [], 'sin_ancla': [], 'opcionales': []}
          REP = []

          def rep(s):
              REP.append(s)

          def aplicar(txt, etiqueta, marcador, patrones_linea, nuevo_linea, patrones_sub=None, nuevo_sub=None, opcional=False):
              if marcador in txt:
                  EST['ya'].append(etiqueta)
                  return txt
              for p in patrones_linea:
                  m = re.search(p, txt)
                  if m:
                      linea = m.group(0)
                      ind = re.match(r'[ \t]*', linea).group(0)
                      nuevo2 = nuevo_linea.replace('{MATCH}', linea).replace('{IND}', ind)
                      EST['aplicados'].append(etiqueta)
                      return txt[:m.start()] + nuevo2 + txt[m.end():]
              if patrones_sub:
                  for p in patrones_sub:
                      m = re.search(p, txt)
                      if m:
                          nuevo2 = nuevo_sub.replace('{MATCH}', m.group(0))
                          EST['aplicados'].append(etiqueta + ' (via subcadena)')
                          return txt[:m.start()] + nuevo2 + txt[m.end():]
              if opcional:
                  EST['opcionales'].append(etiqueta)
              else:
                  EST['sin_ancla'].append(etiqueta)
              return txt

          def es_subsecuencia(a, b):
              it = iter(b)
              for c in a:
                  if c not in it:
                      return False
              return True

          def leer():
              if not os.path.exists(RUTA):
                  return None, None
              for enc in ('utf-8', 'latin-1'):
                  try:
                      with open(RUTA, 'r', encoding=enc, newline='') as f:
                          return f.read(), enc
                  except UnicodeDecodeError:
                      continue
              return None, None

          PY_WARMUP = r'''# ZYRA-WARMUP-ONNX v2 (ini): precarga de modelos al arranque para evitar 502 en la primera peticion fria (Render)
          def _zyra_precargar_modelos():
              import time as _zy_t
              import os as _zy_os
              try:
                  import cv2 as _zy_cv
              except Exception:
                  _zy_cv = None
              try:
                  _zy_t.sleep(2.0)
              except Exception:
                  pass
              _zy_rutas = []
              try:
                  for _zy_v in list(globals().values()):
                      try:
                          if isinstance(_zy_v, str) and _zy_v.lower().strip().endswith('.onnx') and _zy_os.path.exists(_zy_v):
                              if _zy_v not in _zy_rutas:
                                  _zy_rutas.append(_zy_v)
                      except Exception:
                          pass
              except Exception:
                  pass
              _zy_ok = []
              if _zy_cv is not None:
                  for _zy_r in _zy_rutas:
                      try:
                          _zy_nom = _zy_os.path.basename(_zy_r).lower()
                          if 'yunet' in _zy_nom:
                              _zy_cv.FaceDetectorYN.create(_zy_r, '', (320, 320))
                              _zy_ok.append(_zy_nom)
                          elif 'sface' in _zy_nom:
                              _zy_cv.FaceRecognizerSF.create(_zy_r, '')
                              _zy_ok.append(_zy_nom)
                          else:
                              with open(_zy_r, 'rb') as _zy_f:
                                  _zy_f.read(64)
                              _zy_ok.append(_zy_nom)
                      except Exception:
                          pass
              for _zy_fn in ('cargar_modelos', 'precargar_modelos', 'init_modelos', 'cargar_rostros', 'load_models'):
                  try:
                      _zy_f2 = globals().get(_zy_fn)
                      if callable(_zy_f2):
                          _zy_f2()
                          _zy_ok.append(_zy_fn)
                  except Exception:
                      pass
              try:
                  print('[ZYRA-WARMUP] modelos precargados al arranque: ' + (', '.join(_zy_ok) if _zy_ok else 'ninguno detectado'), flush=True)
              except Exception:
                  pass

          def _zyra_lanzar_warmup():
              try:
                  import threading as _zy_th
                  _zy_h = _zy_th.Thread(target=_zyra_precargar_modelos, daemon=True)
                  _zy_h.start()
              except Exception:
                  pass

          _zyra_lanzar_warmup()
          # ZYRA-WARMUP-ONNX v2 (fin)'''

          JS_CSS = r'''/* ZYRA-CAP-COMPACT v4 (ini): captura mas compacta y profesional - NO modifica la guia ni el marco del documento */
          #ps2, #ps3 { max-width: 520px !important; margin-left: auto !important; margin-right: auto !important; }
          #ps2 video, #ps3 video, #ps2 canvas, #ps3 canvas, #ps2 img, #ps3 img { max-width: min(440px, 92vw) !important; max-height: 58vh !important; width: auto !important; height: auto !important; }
          /* ZYRA-CAP-COMPACT v4 (fin) */'''

          JS_IIFE = r'''/* ZYRA-REG-HARDENING v4 (ini): bloqueo fail-closed por nombre, tipo de documento y biometria facial. No modifica la guia ni el marco del documento. */
          (function(){
            'use strict';
            if(window.__zyraHardeningV4){ return; }
            window.__zyraHardeningV4 = true;
            var _ocupado = false;
            var _avisoTimer = 0;
            function _asegurarUI(){
              try{
                if(document.getElementById('zyraCarga') && document.getElementById('zyraAviso')){ return; }
                var st = document.createElement('style');
                st.id = 'zyraEstiloV4';
                st.textContent = '#zyraCarga{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(15,23,42,0.45);display:none;align-items:center;justify-content:center;z-index:2147483000}'
                  + '#zyraCarga.zOn{display:flex}'
                  + '#zyraCarga .zC{background:#ffffff;border-radius:14px;padding:16px 22px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;font-weight:500;color:#0f172a;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,0.25)}'
                  + '.zGiro{width:22px;height:22px;border:3px solid #cbd5e1;border-top-color:#0284c7;border-radius:50%;animation:zGiroV4 1s linear infinite}'
                  + '@keyframes zGiroV4{to{transform:rotate(360deg)}}'
                  + '#zyraAviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2147483600;background:#ffffff;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;font-weight:500;line-height:1.45;padding:14px 18px;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.3);max-width:min(480px,92vw);display:none;border-left:6px solid #0284c7}'
                  + '#zyraAviso.zMal{border-left-color:#dc2626}';
                (document.head || document.documentElement).appendChild(st);
                var c = document.createElement('div');
                c.id = 'zyraCarga';
                c.innerHTML = '<div class="zC"><div class="zGiro"></div><span id="zyraCargaTxt">Verificando...</span></div>';
                (document.body || document.documentElement).appendChild(c);
                var a = document.createElement('div');
                a.id = 'zyraAviso';
                (document.body || document.documentElement).appendChild(a);
              }catch(e){}
            }
            function _aviso(msg, mal){
              try{
                _asegurarUI();
                var a = document.getElementById('zyraAviso');
                if(!a){ return; }
                a.textContent = String(msg || '');
                if(mal){ a.className = 'zMal'; } else { a.className = ''; }
                a.style.display = 'block';
                if(_avisoTimer){ clearTimeout(_avisoTimer); }
                _avisoTimer = setTimeout(function(){ try{ a.style.display = 'none'; }catch(e){} }, 7000);
              }catch(e){}
            }
            function _cargando(on, txt){
              try{
                _asegurarUI();
                var c = document.getElementById('zyraCarga');
                if(!c){ return; }
                c.className = on ? 'zOn' : '';
                var t = document.getElementById('zyraCargaTxt');
                if(t && txt){ t.textContent = txt; }
              }catch(e){}
            }
            /* ZYRA-PURE v4 (ini) */
            var UMBRAL_NOMBRE = 0.6;
            var UMBRAL_ROSTRO = 0.60;
            function _zyraNorm(s){
              try{
                var t = String(s || '').toUpperCase();
                if(t.normalize){ t = t.normalize('NFD'); }
                var out = '';
                for(var i = 0; i < t.length; i++){
                  var c = t.charAt(i);
                  var d = t.charCodeAt(i);
                  if(d >= 768 && d <= 879){ continue; }
                  if((c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9') || c === ' '){ out += c; } else { out += ' '; }
                }
                var parts = out.split(' ');
                var fin = [];
                for(var j = 0; j < parts.length; j++){ if(parts[j].length > 0){ fin.push(parts[j]); } }
                return fin.join(' ');
              }catch(e){ return ''; }
            }
            function _zyraTokens(s){
              try{
                var t = _zyraNorm(s).split(' ');
                var out = [];
                for(var i = 0; i < t.length; i++){ if(t[i].length >= 3){ out.push(t[i]); } }
                return out;
              }catch(e){ return []; }
            }
            function _zyraPctNombre(nombreReg, textoDoc){
              try{
                var toks = _zyraTokens(nombreReg);
                if(toks.length === 0){ return 0; }
                var doc = ' ' + _zyraNorm(textoDoc) + ' ';
                var ok = 0;
                for(var i = 0; i < toks.length; i++){
                  if(doc.indexOf(' ' + toks[i]) !== -1){ ok++; }
                }
                return ok / toks.length;
              }catch(e){ return 0; }
            }
            function _zyraFamiliaDeTexto(t){
              try{
                var s = ' ' + _zyraNorm(t) + ' ';
                var p = { dui: 0, licencia: 0, pasaporte: 0, residente: 0 };
                if(s.indexOf(' DUI ') !== -1 || s.indexOf('DOCUMENTO UNICO DE IDENTIDAD') !== -1 || s.indexOf('UNICO DE IDENTIDAD') !== -1 || s.indexOf('IDENTIDAD') !== -1){ p.dui += 5; }
                if(s.indexOf('LICENCIA') !== -1 || s.indexOf('DRIVER LICENSE') !== -1 || s.indexOf('DRIVER LICEN') !== -1 || s.indexOf('CONDUCTOR') !== -1 || s.indexOf('DMV') !== -1){ p.licencia += 5; }
                if(s.indexOf('PASAPORTE') !== -1 || s.indexOf('PASSPORT') !== -1){ p.pasaporte += 5; }
                if(s.indexOf('RESIDENTE') !== -1 || s.indexOf('RESIDENCIA') !== -1 || s.indexOf('RESIDENT CARD') !== -1 || s.indexOf('EXTRANJERIA') !== -1){ p.residente += 5; }
                var mejor = 'desconocida';
                var pt = 0;
                for(var k in p){ if(p[k] > pt){ pt = p[k]; mejor = k; } }
                return mejor;
              }catch(e){ return 'desconocida'; }
            }
            function _zyraFamiliaDeOpcion(t){
              try{
                var s = ' ' + _zyraNorm(t) + ' ';
                if(s.indexOf(' DUI ') !== -1 || s.indexOf('IDENTIDAD') !== -1){ return 'dui'; }
                if(s.indexOf('LICENCIA') !== -1 || s.indexOf('CONDUCIR') !== -1 || s.indexOf('DRIVER') !== -1 || s.indexOf('LICENSE') !== -1){ return 'licencia'; }
                if(s.indexOf('PASAPORTE') !== -1 || s.indexOf('PASSPORT') !== -1){ return 'pasaporte'; }
                if(s.indexOf('RESIDENTE') !== -1 || s.indexOf('RESIDENCIA') !== -1 || s.indexOf('EXTRANJER') !== -1 || s.indexOf('CARNET') !== -1){ return 'residente'; }
                return '';
              }catch(e){ return ''; }
            }
            function _zyraRostroAprueba(d){
              try{
                if(typeof d !== 'number'){ return false; }
                if(!isFinite(d)){ return false; }
                if(d < 0){ return false; }
                return d <= UMBRAL_ROSTRO;
              }catch(e){ return false; }
            }
            /* ZYRA-PURE v4 (fin) */
            try{
              if(!window.__zyraFetchV4 && typeof window.fetch === 'function'){
                window.__zyraFetchV4 = true;
                var _zf = window.fetch;
                window.fetch = function(){
                  var args = arguments;
                  var p = _zf.apply(this, args);
                  return p.then(function(res){
                    try{
                      if(res && res.status && (res.status >= 500 || res.status === 413)){
                        _aviso('El servidor no pudo procesar la solicitud (error ' + res.status + '). Espere unos segundos e intente de nuevo.', true);
                      }
                    }catch(e){}
                    return res;
                  }).catch(function(err){
                    try{ _aviso('No hay conexión con el servidor. Verifique su internet e intente de nuevo.', true); }catch(e2){}
                    throw err;
                  });
                };
              }
            }catch(e){}
            try{
              if(!window.HTMLCanvasElement.prototype.__zyraBigV4){
                var _ztdd = window.HTMLCanvasElement.prototype.toDataURL;
                window.HTMLCanvasElement.prototype.toDataURL = function(){
                  try{
                    var MAX = 1280;
                    var w = this.width || 0;
                    var h = this.height || 0;
                    if(w > MAX || h > MAX){
                      var esc = Math.min(MAX / w, MAX / h);
                      var c2 = document.createElement('canvas');
                      c2.width = Math.round(w * esc);
                      c2.height = Math.round(h * esc);
                      var ctx = c2.getContext('2d');
                      if(ctx){
                        ctx.drawImage(this, 0, 0, c2.width, c2.height);
                        return _ztdd.apply(c2, arguments);
                      }
                    }
                  }catch(e){}
                  return _ztdd.apply(this, arguments);
                };
                window.HTMLCanvasElement.prototype.__zyraBigV4 = true;
              }
            }catch(e){}
            function _imgDe(paso, permitirVideo){
              try{
                var root = document.getElementById(paso);
                if(!root){ return null; }
                var mejor = null;
                var mejorA = 0;
                var cs = root.getElementsByTagName('canvas');
                for(var i = 0; i < cs.length; i++){
                  var w = cs[i].width || 0;
                  var h = cs[i].height || 0;
                  if(w > 60 && h > 60 && (w * h) > mejorA){ mejorA = w * h; mejor = cs[i]; }
                }
                if(mejor){ return mejor; }
                var ims = root.getElementsByTagName('img');
                for(var j = 0; j < ims.length; j++){
                  var s = ims[j].getAttribute('src') || '';
                  var nw = ims[j].naturalWidth || ims[j].width || 0;
                  var nh = ims[j].naturalHeight || ims[j].height || 0;
                  if((s.indexOf('data:image') === 0 || s.indexOf('blob:') === 0) && nw > 60 && nh > 60 && (nw * nh) > mejorA){
                    mejorA = nw * nh;
                    mejor = ims[j];
                  }
                }
                if(mejor){ return mejor; }
                if(permitirVideo){
                  var vs = root.getElementsByTagName('video');
                  for(var k = 0; k < vs.length; k++){
                    var vw = vs[k].videoWidth || 0;
                    var vh = vs[k].videoHeight || 0;
                    if(vw > 60 && vh > 60){
                      try{
                        var c = document.createElement('canvas');
                        c.width = vw;
                        c.height = vh;
                        var cx = c.getContext('2d');
                        if(cx){
                          cx.drawImage(vs[k], 0, 0, vw, vh);
                          return c;
                        }
                      }catch(e2){}
                    }
                  }
                }
                return null;
              }catch(e){ return null; }
            }
            function _ocrImg(img){
              return new Promise(function(res){
                try{
                  if(!img || !window.Tesseract || !window.Tesseract.recognize){ res(''); return; }
                  window.Tesseract.recognize(img, 'eng').then(function(r){
                    try{
                      var t = (r && r.data && r.data.text) ? String(r.data.text) : '';
                      if(t && t.split(' ').join('').length >= 8){
                        window.__zyraUltimoTextoDoc = t;
                      }
                      res(t);
                    }catch(e){ res(''); }
                  }).catch(function(){ res(''); });
                }catch(e){ res(''); }
              });
            }
            function _textoDoc(){
              return new Promise(function(res){
                try{
                  var f = _imgDe('ps2', false);
                  _ocrImg(f).then(function(t1){
                    if(t1 && t1.split(' ').join('').length >= 8){ res(t1); return; }
                    var b = _imgDe('ps3', false);
                    _ocrImg(b).then(function(t2){
                      if(t2 && t2.split(' ').join('').length >= 8){ res(t2); return; }
                      var cands = ['textoOCR', 'ocrTexto', 'textoDoc', 'ocrText', 'textoFrontal', 'ocrFrontal', 'textoPDF417', 'pdf417Texto', 'pdf417Text', 'textoBarra'];
                      for(var i = 0; i < cands.length; i++){
                        try{
                          var v = window[cands[i]];
                          if(typeof v === 'string' && v.split(' ').join('').length >= 8){ res(v); return; }
                        }catch(e){}
                      }
                      res('');
                    });
                  });
                }catch(e){ res(''); }
              });
            }
            function _nombreRegistro(){
              try{
                var cands = [];
                var ps1 = document.getElementById('ps1');
                var list = (ps1 || document).getElementsByTagName('input');
                for(var i = 0; i < list.length; i++){ cands.push(list[i]); }
                if(!ps1){
                  var list2 = document.getElementsByTagName('input');
                  for(var j = 0; j < list2.length; j++){ cands.push(list2[j]); }
                }
                for(var k = 0; k < cands.length; k++){
                  var el = cands[k];
                  var ty = (el.type || 'text').toLowerCase();
                  if(ty === 'hidden' || ty === 'password' || ty === 'file' || ty === 'checkbox' || ty === 'radio'){ continue; }
                  var sig = ((el.id || '') + ' ' + (el.name || '') + ' ' + (el.placeholder || '') + ' ' + (el.className || '')).toLowerCase();
                  var v = (el.value || '').trim();
                  if(v.length < 3){ continue; }
                  if(sig.indexOf('nombr') !== -1 || sig.indexOf('apellido') !== -1 || sig.indexOf('name') !== -1){ return v; }
                }
                var mejor = '';
                for(var k2 = 0; k2 < cands.length; k2++){
                  var el2 = cands[k2];
                  var ty2 = (el2.type || 'text').toLowerCase();
                  if(ty2 === 'hidden' || ty2 === 'password' || ty2 === 'file' || ty2 === 'checkbox' || ty2 === 'radio'){ continue; }
                  var v2 = (el2.value || '').trim();
                  if(v2.length > mejor.length && /[A-Za-z]/.test(v2)){ mejor = v2; }
                }
                return mejor.length >= 3 ? mejor : '';
              }catch(e){ return ''; }
            }
            function _familiaSeleccionada(){
              try{
                var sel = null;
                var ps1 = document.getElementById('ps1');
                if(ps1){
                  var ss = ps1.getElementsByTagName('select');
                  if(ss.length > 0){ sel = ss[0]; }
                }
                if(!sel){
                  var s2 = document.getElementsByTagName('select');
                  for(var i = 0; i < s2.length; i++){
                    var sig = ((s2[i].id || '') + ' ' + (s2[i].name || '')).toLowerCase();
                    if(sig.indexOf('tipo') !== -1 || sig.indexOf('doc') !== -1 || sig.indexOf('ident') !== -1){ sel = s2[i]; break; }
                  }
                  if(!sel && s2.length > 0){ sel = s2[0]; }
                }
                if(!sel || !sel.options || sel.selectedIndex < 0){ return ''; }
                var op = sel.options[sel.selectedIndex];
                return _zyraFamiliaDeOpcion((op.text || '') + ' ' + (op.value || ''));
              }catch(e){ return ''; }
            }
            function _asegurarModelos(){
              return new Promise(function(res){
                try{
                  if(!window.faceapi){ res(false); return; }
                  var n = window.faceapi.nets;
                  if(!n || !n.tinyFaceDetector || !n.faceLandmark68TinyNet || !n.faceRecognitionNet){ res(false); return; }
                  if(n.tinyFaceDetector.isLoaded && n.faceLandmark68TinyNet.isLoaded && n.faceRecognitionNet.isLoaded){ res(true); return; }
                  var U = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
                  n.tinyFaceDetector.loadFromUri(U).then(function(){
                    return n.faceLandmark68TinyNet.loadFromUri(U);
                  }).then(function(){
                    return n.faceRecognitionNet.loadFromUri(U);
                  }).then(function(){
                    res(!!(n.tinyFaceDetector.isLoaded && n.faceLandmark68TinyNet.isLoaded && n.faceRecognitionNet.isLoaded));
                  }).catch(function(){ res(false); });
                }catch(e){ res(false); }
              });
            }
            function _descriptor(img){
              return new Promise(function(res){
                try{
                  if(!window.faceapi){ res(null); return; }
                  var op = new window.faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.4 });
                  window.faceapi.detectSingleFace(img, op).withFaceLandmarks(true).withFaceDescriptor().then(function(d){
                    res(d && d.descriptor ? d.descriptor : null);
                  }).catch(function(){ res(null); });
                }catch(e){ res(null); }
              });
            }
            function _etq(f){
              if(f === 'dui'){ return 'DUI'; }
              if(f === 'licencia'){ return 'LICENCIA DE CONDUCIR'; }
              if(f === 'pasaporte'){ return 'PASAPORTE'; }
              if(f === 'residente'){ return 'RESIDENCIA'; }
              return f;
            }
            function _finCarga(){ _cargando(false, ''); }
            function _seguir(btn){
              try{
                if(btn.id === 'bIr5' && window.__zyraBioRechazada === true){
                  _finCarga();
                  _aviso('La verificación biométrica fue rechazada. Vuelva a tomar la selfie.', true);
                  return;
                }
              }catch(e){}
              try{ btn.disabled = false; }catch(e){}
              btn.__zyraPassV4 = true;
              btn.click();
            }
            async function _gate(btn){
              var es4 = (btn.id === 'bIr4');
              try{
                _cargando(true, es4 ? 'Verificando documento...' : 'Verificando rostro...');
                if(es4){
                  var nomReg = _nombreRegistro();
                  if(!nomReg){
                    _finCarga();
                    _aviso('Complete su nombre completo en el paso 1 antes de continuar.', true);
                    return;
                  }
                  var texto = await _textoDoc();
                  if(!texto || _zyraNorm(texto).length < 5){
                    _finCarga();
                    _aviso('No se pudo leer el documento. Vuelva a capturarlo con buena luz y sin reflejos.', true);
                    return;
                  }
                  var pct = _zyraPctNombre(nomReg, texto);
                  if(pct < UMBRAL_NOMBRE){
                    _finCarga();
                    _aviso('BLOQUEADO: el nombre del registro no coincide con el nombre del documento capturado. Verifique que el documento sea legible y suyo.', true);
                    return;
                  }
                  var famSel = _familiaSeleccionada();
                  var famDoc = _zyraFamiliaDeTexto(texto);
                  if(famDoc === 'desconocida'){
                    _finCarga();
                    _aviso('No se pudo confirmar el tipo de documento capturado. Vuelva a capturarlo.', true);
                    return;
                  }
                  if(famSel && famSel !== famDoc){
                    _finCarga();
