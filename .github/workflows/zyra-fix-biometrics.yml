name: "AGRO DIAG E: lectura de recursos y riesgo (solo lectura)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump recursos + riesgo (solo lectura)
        run: |
          python3 - <<'DUMPEOF'
          from pathlib import Path

          FILES = [
              "apps/agro/modules/recursos_y_activos/equipos/equipment_service.py",
              "apps/agro/modules/recursos_y_activos/infraestructura/infrastructure_service.py",
              "apps/agro/modules/recursos_y_activos/inventarios/inventory_service.py",
              "apps/agro/modules/recursos_y_activos/maquinaria/machinery_service.py",
              "apps/agro/modules/recursos_y_activos/recursos_hidricos/water_service.py",
              "apps/agro/modules/recursos_y_activos/tecnologia/asset_technology_service.py",
              "apps/agro/modules/riesgo/resiliencia/resilience_service.py",
              "apps/agro/modules/riesgo/respuesta/response_service.py",
              "apps/agro/modules/riesgo/riesgo_climatico/climate_risk_service.py",
              "apps/agro/modules/riesgo/riesgo_productivo/productive_risk_service.py",
              "apps/agro/modules/riesgo/riesgo_territorial/territorial_risk_service.py",
          ]
          for f in FILES:
              p = Path(f)
              print("")
              if not p.exists():
                  print("NO EXISTE:", f)
                  continue
              t = p.read_text(encoding="utf-8", errors="ignore")
              print("=" * 20, f, "(" + str(len(t.splitlines())) + " lineas)", "=" * 20)
              print(t)
          DUMPEOF
