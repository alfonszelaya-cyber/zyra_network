name: ZYRA A4d sesion unica e inyeccion de identidad en el proxy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseA4d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Validar YAML de este workflow
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"

      - name: Sesion unica y proxy con identidad
        run: |
          python3 - <<'PYEOF'
          import json, os, py_compile, re, secrets, subprocess, sys, time, traceback
          import urllib.request, urllib.error
          from pathlib import Path

          ROOT = Path.cwd()
          SP_FILE = ROOT / 'superapp.py'
          OUT = []
          DATA = {}
          GATES = []
          NP, SP = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % SP
          TOKEN = 'e2e-token-' + secrets.token_hex(16)
          ROOTKEY = secrets.token_hex(32)
          ZID_DUENO = 'Z-DUENO-TEST'
          CLAVE_DUENO = 'clave-dueno-ci'
          ZID_OTRO = 'Z-OTRO-TEST'

          def add(s=''):
              OUT.append(str(s))

          def escribe():
              out = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if out:
                  Path(out).write_text('\n'.join(OUT), encoding='utf-8')
              else:
                  Path('faseA4d.md').write_text('\n'.join(OUT), encoding='utf-8')

          def _man(t, v, tb):
              add('')
              add('## ERROR INESPERADO - archivo restaurado')
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()

          sys.excepthook = _man

          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)

          def pedir(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.headers, r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None, None, str(e)

          add('# A4d - SESION UNICA + PROXY CON IDENTIDAD (x-zyra-zid)')
          add('')
          add('Entrar una vez en /entrar -> cookie -> el proxy inyecta el ZID')
          add('y los roles en cada app. Dueño = acceso total. Otros = espectador.')
          add('')

          original = SP_FILE.read_bytes()
          texto0 = original.decode('utf-8')

          def revertir():
              try:
                  SP_FILE.write_bytes(original)
              except Exception:
                  pass

          ya = 'zyra_zid' in texto0 and '_pagina_entrar' in texto0
          add('## E1. Verificacion de anclas (todas deben ser exactamente 1)')
          add('')
          anclas = {
              'def _proxy': texto0.count('    def _proxy(self, target):'),
              'headers_vacio': texto0.count('        headers = {}'),
              'get_verificar': texto0.count('        if path == "/verificar":'),
              'post_verify': texto0.count('        if path == "/verify":'),
          }
          for k, v in anclas.items():
              add('- %s: %d' % (k, v))
          anclas_ok = all(v == 1 for v in anclas.values())
          gate('anclas_unicas', anclas_ok)
          add('')

          if not anclas_ok:
              add('**ANCHOR NO UNICO: nada editado, nada guardado.**')
              DATA['gates'] = {n: ok for n, ok in GATES}
              Path('faseA4d.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS NO UNICOS - sin cambios')

          if ya:
              add('## E2. Ya aplicado antes (idempotente, sin cambios).')
          else:
              add('## E2. Cuatro ediciones con ancla unica')
              add('')
              METODOS = [
              '    def _sesion(self):',
              '        cruda = self.headers.get("Cookie", "") or ""',
              '        for parte in cruda.split(";"):',
              '            if "=" in parte:',
              '                k, v = parte.split("=", 1)',
              '                if k.strip() == "zyra_zid":',
              '                    return v.strip()',
              '        return None',
              '',
              '    def _pagina_entrar(self, mensaje):',
              '        aviso = ""',
              '        if mensaje:',
              "            aviso = \"<p style='color:#f85149'>\" + mensaje + \"</p>\"",
              '        html = (',
              "            \"<!doctype html><html lang='es'><head><meta charset='utf-8'>\"",
              "            \"<meta name='viewport' content='width=device-width, initial-scale=1'>\"",
              '            "<title>Entrar a ZYRA</title>"',
              '            "<style>body{font-family:system-ui,sans-serif;background:#0d1117;"',
              '            "color:#e6edf3;max-width:520px;margin:0 auto;padding:32px 16px}"',
              '            "input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;"',
              '            "border:1px solid #30363d;background:#161b22;color:#e6edf3;"',
              '            "box-sizing:border-box;font-size:16px}"',
              '            "button{background:#238636;border:none;font-weight:700}"',
              "            \"</style></head><body>\"",
              '            "<h1>Entrar a ZYRA</h1>"',
              '            + aviso +',
              "            \"<form method='POST' action='/entrar'>\"",
              "            \"<input name='zid' placeholder='Tu ZID' required>\"",
              "            \"<input name='clave' type='password' placeholder='Clave de dueno (solo propietario)'>\"",
              '            "<button>Entrar</button></form>"',
              "            \"<p><a href='/' style='color:#8b949e'>Volver al portal</a></p>\"",
              '            "</body></html>"',
              '        )',
              '        return html',
              '',
              ]
              INYECT = [
              '        zid_s = self._sesion()',
              '        if zid_s:',
              '            headers["x-zyra-zid"] = zid_s',
              '            ruta_obj = (self.path or "").split("?", 1)[0]',
              '            if ruta_obj.startswith("/laboratorio"):',
              '                if zid_s == os.environ.get("ZYRA_OWNER_ZID", "Z-OWNER-ALFONSZELAYA"):',
              '                    headers["x-zyra-roles"] = os.environ.get(',
              '                        "ZYRA_ROLES_DUENO", "LAB_GOBERNADOR")',
              '                else:',
              '                    headers["x-zyra-roles"] = "LAB_ESPECTADOR"',
              ]
              GET_RUTAS = [
              '        if path == "/entrar":',
              '            self._send_html(200, self._pagina_entrar(""))',
              '            return',
              '        if path == "/salir":',
              '            self.send_response(303)',
              '            self.send_header("Set-Cookie", "zyra_zid=; Max-Age=0; Path=/")',
              '            self.send_header("Location", "/")',
              '            self.end_headers()',
              '            return',
              ]
              POST_RUTA = [
              '        if path == "/entrar":',
              '            largo = int(self.headers.get("Content-Length", 0) or 0)',
              '            crudo = self.rfile.read(largo).decode("utf-8") if largo else ""',
              '            import re as _re',
              '            from urllib.parse import unquote_plus as _uq',
              '            campos = {}',
              '            for par in crudo.split("&"):',
              '                if "=" in par:',
              '                    k, v = par.split("=", 1)',
              '                    campos[k] = _uq(v)',
              '            zid = (campos.get("zid") or "").strip()',
              '            clave = (campos.get("clave") or "").strip()',
              '            if not _re.match(r"^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$", zid or ""):',
              '                self._send_html(400, self._pagina_entrar("ZID invalido o vacio."))',
              '                return',
              '            es_dueno = (zid == os.environ.get("ZYRA_OWNER_ZID", "Z-OWNER-ALFONSZELAYA"))',
              '            clave_req = os.environ.get("ZYRA_CLAVE_DUENO", "")',
              '            if es_dueno and clave_req and clave != clave_req:',
              '                self._send_html(403, self._pagina_entrar("Clave de dueno incorrecta."))',
              '                return',
              '            self.send_response(303)',
              '            self.send_header("Set-Cookie", "zyra_zid=" + zid + "; Path=/; Max-Age=604800")',
              '            self.send_header("Location", "/")',
              '            self.end_headers()',
              '            return',
              ]
              t = texto0
              a1 = '    def _proxy(self, target):'
              pos = t.find(a1)
              t = t[:pos] + '\n'.join(METODOS) + '\n' + t[pos:]
              a2 = '        headers = {}'
              pos = t.find(a2)
              fin = t.find('\n', pos) + 1
              t = t[:fin] + '\n'.join(INYECT) + '\n' + t[fin:]
              a3 = '        if path == "/verificar":'
              pos = t.find(a3)
              t = t[:pos] + '\n'.join(GET_RUTAS) + '\n' + t[pos:]
              a4 = '        if path == "/verify":'
              pos = t.find(a4)
              t = t[:pos] + '\n'.join(POST_RUTA) + '\n' + t[pos:]
              SP_FILE.write_text(t, encoding='utf-8')
              add('- 4 ediciones aplicadas (metodos, inyeccion, rutas GET, ruta POST).')
          gate('ediciones_aplicadas', True)
          add('')

          add('## E3. Compilacion')
          add('')
          comp = True
          try:
              py_compile.compile(str(SP_FILE), doraise=True)
              add('- py_compile: OK')
          except Exception as e:
              comp = False
              add('- FALLO: %s' % e)
          gate('compila', comp)
          add('')

          add('## E4. Arranque real del sistema')
          add('')
          env = dict(os.environ)
          env.update({'ZYRA_ROOT_KEY': ROOTKEY, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1', 'ZYRA_DATA_DIR': '/tmp/zyra-a4d', 'ZYRA_PORT': str(NP), 'SUPERAPP_DATA_DIR': '/tmp/super-a4d', 'PORT': str(SP), 'ZYRA_OWNER_ZID': ZID_DUENO, 'ZYRA_CLAVE_DUENO': CLAVE_DUENO, 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t0 = time.time()
          while time.time() - t0 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env, stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cuerpo = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cuerpo).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps_vivas', spv and len(apps) == 8)
          add('')

          add('## E5. PRUEBA REAL: entrar una vez, todo reconocido')
          add('')
          if spv:
              class NoRedir(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              op = urllib.request.build_opener(NoRedir)
              cuerpo_post = ('zid=' + ZID_DUENO + '&clave=' + CLAVE_DUENO).encode('utf-8')
              req = urllib.request.Request(BSP + '/entrar', data=cuerpo_post)
              req.add_header('Content-Type', 'application/x-www-form-urlencoded')
              try:
                  r = op.open(req, timeout=10)
                  st_login, hdr_login = r.status, r.headers
              except urllib.error.HTTPError as e:
                  st_login, hdr_login = e.code, e.headers
              cookie = (hdr_login.get('Set-Cookie') or '') if hdr_login else ''
              token_cookie = cookie.split(';')[0] if cookie else ''
              add('- POST /entrar (dueno) -> %s | cookie=%s' % (st_login, token_cookie or 'NINGUNA'))
              gate('entrar_dueno', st_login == 303 and 'zyra_zid=' + ZID_DUENO in token_cookie)
              hdr_d = {'Cookie': token_cookie}
              st1, h1, b1 = pedir(BSP + '/laboratorio/ui', hdr_d)
              ok1 = (st1 == 200 and 'text/html' in (h1.get('Content-Type') or '').lower())
              add('- con sesion dueno: GET /laboratorio/ui -> %s %s' % (st1, 'ABRE' if ok1 else 'FALLO'))
              gate('proxy_inyecta_dueno', ok1)
              menus = sorted(set(re.findall(r'/laboratorio/ui/([a-z0-9_\-]{2,40})', b1))) if ok1 else []
              add('- menus visibles para dueno: %d' % len(menus))
              gate('dueno_ve_todos', len(menus) >= 10)
              st2, _h2, _b2 = pedir(BSP + '/laboratorio/ui', {'Cookie': 'zyra_zid=' + ZID_OTRO})
              add('- con sesion normal (otro zid): GET /laboratorio/ui -> %s (200 esperado, espectador)' % st2)
              gate('usuario_normal_200', st2 == 200)
              st3, _h3, b3 = pedir(BSP + '/laboratorio/ui')
              add('- sin sesion: GET /laboratorio/ui -> %s (401 esperado, guard intacto)' % st3)
              gate('guard_intacto', st3 == 401)
          else:
              gate('entrar_dueno', False)
              gate('proxy_inyecta_dueno', False)
              gate('dueno_ve_todos', False)
              gate('usuario_normal_200', False)
              gate('guard_intacto', False)
          add('')

          criticos = ('anclas_unicas', 'compila', 'ocho_apps_vivas', 'entrar_dueno', 'proxy_inyecta_dueno', 'guard_intacto')
          fallos = [n for n, ok in GATES if not ok]
          if any(n in fallos for n in criticos) and not ya:
              revertir()
              add('## REVERSION APLICADA - superapp.py restaurado, repo intacto')
              add('- Causa: %s' % ', '.join(f for f in fallos if f in criticos))
              add('')

          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass

          fallos = [n for n, ok in GATES if not ok]
          add('## Resultado de gates')
          add('')
          for n, ok in GATES:
              add('- %s: %s' % (n, 'OK' if ok else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**VERIFICADO: entrar una vez -> todas las apps reconocen la identidad. Commit.**')
              add('')
              add('Para Render (secrets, NO en codigo): ZYRA_OWNER_ZID=Z-ALFONSZELAYA y ZYRA_CLAVE_DUENO=(tu clave secreta).')
          add('')

          DATA['gates'] = {n: ok for n, ok in GATES}
          DATA['menus_dueno'] = menus if spv else []
          Path('faseA4d.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('A4d terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF

      - name: Commit si hay cambios
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(superapp): sesion unica e inyeccion de identidad en el proxy"
            git push
            echo "## Commit aplicado - Render desplegara automatico" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faseA4d-zyra
          path: faseA4d.json
          if-no-files-found: ignore
