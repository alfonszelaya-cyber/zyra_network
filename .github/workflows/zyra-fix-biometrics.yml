name: ZYRA S5 auditoria completa del registro (solo lectura)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  s5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar YAML del propio workflow
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml', encoding='utf-8')); print('YAML OK')"

      - name: S5 auditoria solo lectura
        run: |
          cat > /tmp/s5_audit.py << 'PYEOF'
          import os, re, hashlib

          REPO = os.getcwd()
          OUT = []

          def P(s=""):
              OUT.append(str(s))

          def sec(t):
              P("")
              P("=" * 72)
              P("S5 >>> " + t)
              P("=" * 72)

          SKIP = {".git", "__pycache__", ".github", "node_modules"}

          def find_file(name, prefer=None):
              hits = []
              for root, dirs, files in os.walk(REPO):
                  dirs[:] = [d for d in dirs if d not in SKIP]
                  if name in files:
                      hits.append(os.path.join(root, name).replace(os.sep, "/"))
              chosen = None
              if prefer:
                  for h in hits:
                      if prefer in h:
                          chosen = h
                          break
              if chosen is None and hits:
                  hits.sort(key=lambda p: os.path.getsize(p), reverse=True)
                  chosen = hits[0]
              return chosen, hits

          def load(path):
              with open(path, encoding="utf-8", errors="replace") as f:
                  return f.read()

          def fingerprint(path):
              b = open(path, "rb").read()
              return "%s -> bytes=%d sha256=%s" % (path, len(b), hashlib.sha256(b).hexdigest()[:16])

          def dump_range(lines, a, b, label):
              P("--- %s | lineas %d a %d ---" % (label, a + 1, min(b, len(lines))))
              for i in range(max(0, a), min(len(lines), b)):
                  P("%4d | %s" % (i + 1, lines[i]))

          sec("1. UBICACION Y HUELLA DE ARCHIVOS")
          sp, sp_hits = find_file("superapp.py")
          rg, rg_hits = find_file("registro.html")
          ap, _x = find_file("api.py", prefer="shared_engines")
          bm, _y = find_file("biometrics.py", prefer="security")
          P("superapp.py elegido: " + str(sp))
          P("superapp.py candidatos: " + str(sp_hits))
          P("registro.html elegido: " + str(rg))
          P("registro.html candidatos: " + str(rg_hits))
          P("api.py elegido: " + str(ap))
          P("biometrics.py elegido: " + str(bm))
          for x in (sp, rg, ap, bm):
              if x:
                  P(fingerprint(x))

          sec("1b. version.txt")
          vt = None
          for c in (os.path.join(REPO, "portal", "version.txt"), os.path.join(REPO, "version.txt")):
              if os.path.exists(c):
                  vt = c
                  break
          P(("contenido: " + load(vt).strip()) if vt else "no encontrado en raiz ni portal/")

          sec("2. requirements-render.txt COMPLETO")
          rrp = os.path.join(REPO, "requirements-render.txt")
          P(load(rrp) if os.path.exists(rrp) else "NO EXISTE")

          sec("3. superapp.py — BLOQUE COMPLETO /registro/nuevo")
          if sp:
              sall = load(sp)
              lines = sall.splitlines()
              idx = None
              for i, l in enumerate(lines):
                  if "/registro/nuevo" in l:
                      idx = i
                      break
              if idx is None:
                  P("NO SE ENCONTRO /registro/nuevo en superapp.py")
              else:
                  P("ancla linea %d: %s" % (idx + 1, lines[idx].strip()))
                  ind0 = len(lines[idx]) - len(lines[idx].lstrip())
                  end = idx + 1
                  limit = min(len(lines), idx + 220)
                  while end < limit:
                      s = lines[end].strip()
                      if s:
                          ind = len(lines[end]) - len(lines[end].lstrip())
                          if ind <= ind0 and (s.startswith("if ") or s.startswith("elif ") or s.startswith("else:") or s.startswith("def ") or s.startswith("class ")):
                              break
                      end += 1
                  dump_range(lines, idx, end + 1, "bloque /registro/nuevo")
              P("lineas con '/registro': " + str([i + 1 for i, l in enumerate(lines) if "/registro" in l][:40]))
              zl = [i for i, l in enumerate(lines) if "ZYRA_URL" in l]
              P("lineas con ZYRA_URL: " + str([i + 1 for i in zl][:30]))
              for i in zl[:10]:
                  dump_range(lines, max(0, i - 2), i + 3, "contexto ZYRA_URL")
              P("contiene 'identity/enroll': %d" % sall.count("identity/enroll"))
              P("contiene 'proofing/submit': %d" % sall.count("proofing/submit"))
              P("contiene 'urllib': %d" % sall.count("urllib"))
          else:
              P("superapp.py no encontrado")

          sec("4. registro.html — CONTEOS sobre el archivo COMPLETO")
          if rg:
              rsrc = load(rg)
              lines = rsrc.splitlines()
              P("ruta: " + rg)
              P("total lineas: %d" % len(lines))
              for t in ["comprimir", "maxLado", "toDataURL", "drawImage", "quality", "0.6", "0.75", "0.85", "getUserMedia", "facingMode", "doc_image_b64", "selfie_image_b64", "doc_back_b64", "doc_type", "doc_front", "selfie", "nombre", "clave", "usuario", "zid", "registro/nuevo", "identity/enroll", "FormData", "JSON.stringify", "fetch(", "attestation", "actor"]:
                  P("%-18s : %d" % (t, rsrc.count(t)))
          else:
              P("registro.html no encontrado")

          sec("5. registro.html — FUNCION enviar() COMPLETA")
          if rg:
              ei = None
              for i, l in enumerate(lines):
                  if re.search(r"function\s+enviar", l):
                      ei = i
                      break
              P("ancla function enviar: " + (str(ei + 1) if ei is not None else "NO ENCONTRADA"))
              if ei is not None:
                  end = ei + 1
                  limit = min(len(lines), ei + 170)
                  while end < limit:
                      if re.search(r"function\s+\w+\s*\(", lines[end]):
                          break
                      end += 1
                  dump_range(lines, ei, end, "enviar()")

          sec("6. registro.html — TODOS los fetch() con contexto")
          if rg:
              fcs = [i for i, l in enumerate(lines) if "fetch(" in l]
              P("fetch( en lineas: " + str([i + 1 for i in fcs]))
              for i in fcs[:6]:
                  dump_range(lines, max(0, i - 3), min(len(lines), i + 22), "fetch linea %d" % (i + 1))

          sec("7. registro.html — CONSTRUCCION DEL PAYLOAD (JSON.stringify / FormData)")
          if rg:
              pls = [i for i, l in enumerate(lines) if ("JSON.stringify" in l) or ("new FormData" in l)]
              P("payload en lineas: " + str([i + 1 for i in pls]))
              for i in pls[:6]:
                  dump_range(lines, max(0, i - 12), min(len(lines), i + 32), "payload linea %d" % (i + 1))

          sec("8. api.py — CONTRATO REAL de /identity/enroll")
          if ap:
              lines = load(ap).splitlines()
              rts = [i for i, l in enumerate(lines) if "identity/enroll" in l]
              P("lineas con 'identity/enroll': " + str([i + 1 for i in rts][:10]))
              for i in rts[:4]:
                  dump_range(lines, max(0, i - 3), min(len(lines), i + 6), "ruta enroll")
              hi = None
              for i, l in enumerate(lines):
                  if "def _handle_enroll" in l:
                      hi = i
                      break
              if hi is None:
                  P("no existe def _handle_enroll* en api.py (revisar dumps de rutas)")
              else:
                  ind0 = len(lines[hi]) - len(lines[hi].lstrip())
                  end = hi + 1
                  limit = min(len(lines), hi + 130)
                  while end < limit:
                      s = lines[end].strip()
                      if s and (len(lines[end]) - len(lines[end].lstrip())) <= ind0 and s.startswith("def "):
                          break
                      end += 1
                  dump_range(lines, hi, end, "handler enroll")
                  blk = "\n".join(lines[hi:end])
                  P("campos exigidos por _require_str en el handler: " + str(re.findall(r"_require_str\(\s*doc\s*,\s*['\"]([^'\"]+)['\"]", blk)))
          else:
              P("api.py no encontrado")

          sec("9. biometrics.py — ANCLAS del 'no instalado'")
          if bm:
              lines = load(bm).splitlines()
              P("total lineas: %d" % len(lines))
              for a in ["ZYRA_BIOMETRICS_PROVIDER", "not installed", "biometrics_unavailable", "def extract", "def compare"]:
                  idxs = [i for i, l in enumerate(lines) if a in l]
                  if not idxs:
                      P("ancla NO encontrada: " + a)
                  else:
                      P("ancla '%s' en lineas %s" % (a, [i + 1 for i in idxs[:5]]))
                      i = idxs[0]
                      dump_range(lines, max(0, i - 6), min(len(lines), i + 20), "ancla " + a)
          else:
              P("biometrics.py no encontrado")

          sec("10. sw.js — puede estar interceptando el POST del registro")
          swp = None
          if rg:
              cand = os.path.join(os.path.dirname(rg), "sw.js")
              if os.path.exists(cand):
                  swp = cand
          if swp:
              ssrc = load(swp)
              lines = ssrc.splitlines()
              P("ruta: " + swp)
              P("total lineas: %d" % len(lines))
              done = False
              for i, l in enumerate(lines):
                  if ("'fetch'" in l) or ('"fetch"' in l):
                      dump_range(lines, max(0, i - 4), min(len(lines), i + 42), "listener fetch")
                      done = True
                      break
              if not done:
                  P("no se vio listener de fetch")
              P("contiene 'registro': %d" % ssrc.count("registro"))
              P("contiene 'CACHE': %d | 'caches': %d" % (ssrc.count("CACHE"), ssrc.count("caches")))
          else:
              P("sw.js no encontrado junto a registro.html")

          sec("11. CONTENIDO DE LA CARPETA DEL PORTAL")
          if rg:
              pd = os.path.dirname(rg)
              P("carpeta: " + pd)
              for n in sorted(os.listdir(pd)):
                  fp2 = os.path.join(pd, n)
                  if os.path.isfile(fp2):
                      P("%10d  %s" % (os.path.getsize(fp2), n))

          sec("12. FIN — SOLO LECTURA, NINGUN ARCHIVO DEL PROYECTO FUE MODIFICADO")
          print("\n".join(OUT))
          PYEOF
          python3 /tmp/s5_audit.py
