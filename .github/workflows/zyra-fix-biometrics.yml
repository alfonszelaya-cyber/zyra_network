            "accounting/libro_diario/menu.py": ("accounting", "Libro Diario", "Registrar movimiento|Consultar diario"),
            "accounting/libro_mayor/menu.py": ("accounting", "Libro Mayor", "Saldos por cuenta|Movimientos por cuenta"),
