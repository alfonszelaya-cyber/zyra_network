          if "presentation_remote" not in t:
              for i, l in enumerate(lineas):
                  if "simulation_engine import" in l and l.strip().startswith("from"):
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(i + 1, indent + "from apps.laboratorio.infrastructure.providers.presentation_remote import PresentacionRemota\n")
                      cambios.append("import PresentacionRemota")
                      break

          if "citizens_engine" not in t:
              for i, l in enumerate(lineas):
                  if "simulation_engine import" in l and l.strip().startswith("from"):
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(i + 1, indent + "from apps.laboratorio.infrastructure.providers.citizens_engine import MotorCiudadanos\n")
                      lineas.insert(i + 2, indent + "from apps.laboratorio.infrastructure.providers.physics_engine import MotorFisico\n")
                      cambios.append("imports ciudadanos+fisica")
                      break

          if '"gemelo_vivo"' not in t:
              ok = False
              for i, l in enumerate(lineas):
                  if 'c.registrar("motor_monte_carlo"' in l:
                      indent = l[: len(l) - len(l.lstrip())]
                      lineas.insert(i + 1, indent + 'c.registrar("gemelo_vivo", lambda _c: GemeloVivo())\n')
                      lineas.insert(i + 2, indent + 'c.registrar("motor_ciudadanos", lambda _c: MotorCiudadanos())\n')
                      lineas.insert(i + 3, indent + 'c.registrar("motor_fisico", lambda _c: MotorFisico())\n')
                      lineas.insert(i + 4, indent + 'c.registrar("presentacion_remota", lambda _c: PresentacionRemota(_c.obtener("repo_presentaciones"), _c.obtener("salidas_universales")))\n')
                      ok = True
                      cambios.append("4 servicios cableados")
                      break
              if not ok:
                  raise SystemExit("FATAL: sin ancla motor_monte_carlo")

          t = "".join(lineas)
          for requerido in ("GemeloVivo", "PresentacionRemota", "MotorCiudadanos", "MotorFisico",
                            '"gemelo_vivo"', '"presentacion_remota"', '"motor_ciudadanos"', '"motor_fisico"'):
              if requerido not in t:
                  raise SystemExit("FATAL: falta " + requerido)
          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("service_registry: " + ("; ".join(cambios) if cambios else "ya al dia") + " - verificado")
