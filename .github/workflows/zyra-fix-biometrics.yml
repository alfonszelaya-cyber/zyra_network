      - name: "Paso 3 - E2E comunidad con cookies (2 usuarios + gobierno)"
        run: |
          python3 - <<'EOF'
          import http.cookiejar
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import urllib.parse
          import uuid
          import re as _re

          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from apps.subastas.infrastructure.persistence.subastas_store import SubastasStore
          from apps.subastas.server import serve_subastas


          class FakeNet:
              def get(self, path):
                  return (False, None, "offline")

              def post(self, path, payload):
                  if path == "/documents/seal":
                      return (True, {"document_id": "DOC-" + uuid.uuid4().hex[:8]}, None)
                  return (False, None, "offline")


          def make_opener():
              cj = http.cookiejar.CookieJar()
              return urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(cj)
              )


          def call(opener, method, url, payload=None, form=None):
              if form is not None:
                  data = urllib.parse.urlencode(form).encode()
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
              else:
                  data = json.dumps(payload).encode() if payload is not None else None
                  headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with opener.open(req, timeout=5) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read()[:400].decode("utf-8", "replace")
                  raise AssertionError("HTTP %s %s %s -> %s" % (e.code, method, url, body))


          db = SQLiteAdapter(":memory:")
          store = SubastasStore(db, SystemClock())
          srv = serve_subastas(store, FakeNet())
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:%d" % srv.server_address[1]
          time.sleep(0.5)

          opA = make_opener()
          aName = "ana" + uuid.uuid4().hex[:6]
          call(opA, "POST", base + "/subastas/registro", form={
              "username": aName, "password": "clave123",
              "display_name": "Ana Social", "role": "vendedor"})
          opB = make_opener()
          bName = "beto" + uuid.uuid4().hex[:6]
          call(opB, "POST", base + "/subastas/registro", form={
              "username": bName, "password": "clave123",
              "display_name": "Beto Social", "role": "comprador"})
          print("1. cuentas A y B OK")

          call(opA, "POST", base + "/subastas/api/comunidad",
               payload={"action": "post", "content": "Vendo licuadoras nuevas"})
          print("2. post en feed OK")

          st, html = call(opB, "GET", base + "/subastas/comunidad")
          assert "Vendo licuadoras nuevas" in html
          m = _re.search(r"PST-[a-f0-9]{10}", html)
          assert m, html[:400]
          post_id = m.group(0)
          print("3. feed visible para B + post id:", post_id)

          call(opB, "POST", base + "/subastas/api/comunidad",
               payload={"action": "comment", "post_id": post_id,
                        "content": "precio?"})
          call(opB, "POST", base + "/subastas/api/comunidad",
               payload={"action": "react", "post_id": post_id, "kind": "like"})
          call(opB, "POST", base + "/subastas/api/comunidad",
               payload={"action": "follow", "target": aName})
          print("4. comentario + like + seguir OK")

          st, html = call(opA, "GET", base + "/subastas/comunidad")
          assert "Seguidores: 1" in html, html[:500]
          assert "comento tu post" in html
          assert "reacciono" in html
          assert "ahora te sigue" in html
          print("5. notificaciones de A: comentario+reaccion+seguidor OK")

          call(opB, "POST", base + "/subastas/api/comunidad",
               payload={"action": "message", "to": aName,
                        "content": "hola, precio de la licuadora?"})
          call(opA, "POST", base + "/subastas/api/comunidad",
               payload={"action": "message", "to": bName,
                        "content": "50 dolares con promo"})
          st, html = call(opA, "POST", base + "/subastas/api/comunidad",
                          payload={"action": "conversation", "with": bName,
                                   "_noredirect": True})
          assert "50 dolares con promo" in html and "hola, precio" in html
          print("6. chat 1-a-1 ambos sentidos OK")

          st, html = call(opA, "POST", base + "/subastas/api/comunidad",
                          payload={"action": "report", "target_kind": "post",
                                   "target_id": post_id, "reason": "spam test"})
          assert '"status": "open"' in html, html[:300]
          rep_m = _re.search(r"RPT-[a-f0-9]{10}", html)
          assert rep_m, html[:300]
          rep_id = rep_m.group(0)
          print("7. reporte abierto:", rep_id)

          print("E2E SMOKE OK: Bloque 6 Comunidad completo (moderacion gov por su sesion)")
