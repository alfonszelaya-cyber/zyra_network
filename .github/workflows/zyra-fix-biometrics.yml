name: ZYRA AGRO Block 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix test boot (add_producer real signature)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path(
              "apps/agro/tests/"
              "test_agro_events.py"
          )
          src = path.read_text(encoding="utf-8")

          old = (
              '                  created = store.add_producer(\n'
              '                      name="Jose Rural",\n'
              '                      producer_type="agricultor",\n'
              '                      location="Chalatenango",\n'
              '                  )\n'
          )
          new = (
              '                  import uuid as _uuid\n'
              '                  created = store.add_producer(\n'
              '                      producer_id="PRD-"\n'
              '                      + _uuid.uuid4().hex[:10],\n'
              '                      zid="ZID-agro-1"\n'
              '                      if has_zid\n'
              '                      else None,\n'
              '                      name="Jose Rural",\n'
              '                      role="agricultor",\n'
              '                      synced=has_zid,\n'
              '                      producer_type="agricultor",\n'
              '                      location="Chalatenango",\n'
              '                  )\n'
          )
          if '"producer_id": producer_id' in src and (
              old in src
          ):
              fixed = src.replace(old, new, 1)
              path.write_text(fixed, encoding="utf-8")
              print("PATCHED: boot signature")
          elif old not in src:
              print("BOOT BLOCK NOT FOUND - searching alternative...")
          else:
              print("ALREADY PATCHED")

          import ast

          ast.parse(
              path.read_text(encoding="utf-8")
          )
          print("SYNTAX OK")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/3 Agro events tests (5)
        run: python -m pytest apps/agro/tests/test_agro_events.py -v

      - name: 2/3 AGRO regression
        run: python -m pytest apps/agro/tests -q

      - name: 3/3 Full system regression
        run: |
          python -m pytest apps/axis/life_history/tests apps/axis/tests -q
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/agro/tests/test_agro_events.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "agro events: test boot matches real add_producer signature"
            git push
          fi
