name: "RED-NIVEL1: existencia publica de ZID (sin datos personales) - ruta abierta + test"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - ruta GET /verify-existence/{zid} en api.py (publica, sin auth, sin datos personales)"
        run: |
          python3 - <<'REOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("shared_engines/runtime/api.py")
          t = p.read_text(encoding="utf-8")
          if '"verify-existence"' in t:
              print("SKIP (ruta ya presente)")
              raise SystemExit(0)
          ANCLA = 'if segments == ["verify"] and method == "POST":'
          cnt = t.count(ANCLA)
          assert cnt == 1, "ancla verify " + str(cnt)
          i = t.find(ANCLA)
          ls = t.rfind("\n", 0, i) + 1
          linea = t[ls:i]
          IND = linea[:len(linea) - len(linea.lstrip())]
          CUERPO = textwrap.dedent('''\
              if (
                  len(segments) == 2
                  and segments[0] == "verify-existence"
                  and method == "GET"
              ):
                  zid_q = segments[1]
                  existe = (
                      type(self).kernel.identity
                      .get_identity(zid_q))
                  if existe is None:
                      self._send_json(200, {
                          "ok": True,
                          "data": {
                              "exists": False,
                              "status": None,
                          },
                      })
                      return
                  estado = str(existe.status.value)
                  self._send_json(200, {
                      "ok": True,
                      "data": {
                          "exists": True,
                          "status": estado,
                          "active": estado == "ACTIVE",
                      },
                  })
                  return
          ''')
          BLOQUE = textwrap.indent(
              CUERPO.rstrip("\n"), IND) + "\n"
          t = t[:ls] + BLOQUE + t[ls:]
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          assert '"verify-existence"' in p.read_text(
              encoding="utf-8")
          print("OK ruta GET /verify-existence/{zid}"
                " (AST valido)")
          REOF

      - name: "Paso B - test: existe/activo, no existe, y cero datos personales en la respuesta"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          target = Path(
              "shared_engines/runtime/tests/"
              "test_runtime_api.py")
          assert target.exists()
          t = target.read_text(encoding="utf-8")
          if "test_verify_existence_public" in t:
              print("SKIP test (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_verify_existence_public(
                  tmp_path,
              ) -> None:
                  """AX-NIVEL1: consulta publica de
                  existencia - mata documentos
                  falsos. Solo existe/status; cero
                  datos personales en la respuesta."""
                  import json as _json
                  import threading
                  import time as _time
                  import urllib.request
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  from shared_engines.runtime.config import (
                      RuntimeConfig)
                  from shared_engines.runtime.kernel import (
                      ZyraKernel)
                  from shared_engines.runtime.capabilities import (
                      ZyraCapabilities)
                  from shared_engines.runtime.combined_api import (
                      serve_combined)
                  from shared_engines.verification.signatures import (
                      Ed25519Signer)
                  from shared_engines.identity.contracts import (
                      IdentityKind)
                  net_db = SQLiteAdapter(":memory:")
                  signer, _ = Ed25519Signer.generate()
                  kernel = ZyraKernel(
                      db=net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None))
                  kernel.bootstrap_root()
                  caps = ZyraCapabilities(
                      net_db, FrozenClock(),
                      identity=kernel.identity,
                      signer=signer)
                  srv = serve_combined(
                      kernel, caps,
                      host="127.0.0.1", port=0)
                  threading.Thread(
                      target=(srv.serve_forever),
                      daemon=True).start()
                  _time.sleep(0.3)
                  base = ("http://127.0.0.1:"
                          + str(
                              srv.server_address[
                                  1]))
                  try:
                      real = (kernel.identity
                          .register_identity(
                              kind=(
                                  IdentityKind
                                  .PERSON),
                              display_name=(
                                  "Pedro Real"),
                              actor="test"))
                      def get(zid):
                          with urllib.request.urlopen(
                              base
                              + "/verify-existence/"
                              + zid,
                              timeout=15,
                          ) as r:
                              return (r.status,
                                  _json.loads(
                                      r.read().decode()))

                      st, r1 = get(real.zid)
                      assert st == 200, str(r1)
                      d1 = r1["data"]
                      assert d1["exists"] is True
                      assert d1["status"] in (
                          "REGISTERED", "ACTIVE")
                      assert "display_name" not in (
                          str(d1))
                      assert "birth" not in (
                          str(d1).lower())
                      assert "national" not in (
                          str(d1).lower())

                      st, r2 = get(
                          "ZID-falso-estafador-000")
                      assert st == 200
                      d2 = r2["data"]
                      assert d2["exists"] is False
                      print("OK AX-NIVEL1: existencia"
                            " publica funciona (real:"
                            " existe; falso: no existe)"
                            " y NO filtra datos"
                            " personales")
                  finally:
                      srv.shutdown()
                      srv.server_close()
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          target.write_text(t, encoding="utf-8")
          final = target.read_text(encoding="utf-8")
          assert "test_verify_existence_public" in final
          print("OK test NIVEL1 (AST valido)")
          TSEOF

      - name: "Paso C - GATE Red"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -10

      - name: "Paso D - GATE apps"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso E - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-NIVEL1"
            echo '```'
            python3 -m pytest shared_engines/runtime/tests/test_runtime_api.py::test_verify_existence_public -vv --tb=long 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-NIVEL1: consulta publica de existencia de ZID (sin datos personales)" -m "El arma anti-estafadores: cualquiera verifica GET /verify-existence/{zid} y obtiene SOLO exists + status (+ active). Un documento falso con ZID inventado o revocado se detecta al instante, gratis, sin login. La respuesta NO incluye ningun dato personal (ni nombre, ni documento, ni fechas) - probado en el test. Publica sin auth porque no expone nada: es el equivalente de verificar que un billete existe. Cierra el bloque anti-fraude: biometria obligatoria + verify_face 1:1 + veredicto firmado (RED-VERIF) + consentimientos con TTL y boton de panico (RED-CONSENT) + existencia publica (este run)."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
