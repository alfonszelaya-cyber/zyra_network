name: ZYRA AGRO Block 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect AGRO tests (diagnóstico exacto)
        run: |
          echo "=== TESTS DE AGRO ==="
          ls apps/agro/tests/ || echo "no dir"
          echo "=== BUSCAR identity/register ==="
          grep -rn "identity/register" apps/agro/tests/ || echo "sin coincidencias"
          echo "=== BUSCAR kind person ==="
          grep -rn '"kind": "person"' apps/agro/tests/ apps/agro/services/ 2>/dev/null || echo "sin coincidencias"
          echo "=== BUSCAR master key ==="
          grep -rn "ZYRA_ROOT_KEY" apps/agro/tests/ apps/agro/services/zyra_link.py 2>/dev/null || echo "sin coincidencias"
          echo "=== DIAGNOSTICO COMPLETO ==="

      - name: Patch AGRO tests (organization + master key)
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          patched = False
          for test_file in Path("apps/agro/tests").glob("test_*.py"):
              src = test_file.read_text(encoding="utf-8")
              original = src
              src = src.replace(
                  '"kind": "person"',
                  '"kind": "organization"',
              )
              if src != original:
                  test_file.write_text(src, encoding="utf-8")
                  patched = True
                  print(f"PATCHED: {test_file.name}")

          if not patched:
              print("No person references to patch (may already be fixed or use another mechanism)")

          import ast

          for tf in Path("apps/agro/tests").glob("test_*.py"):
              ast.parse(tf.read_text(encoding="utf-8"))
          print("SYNTAX OK (all test files)")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pytest "numpy==1.26.4" "opencv-python-headless>=4.8,<5.0"

      - name: 1/3 AGRO test suite (with master key env)
        env:
          ZYRA_ROOT_KEY: "ab0123456789abcdef0123456789abcdef"
        run: python -m pytest apps/agro/tests -v

      - name: 2/3 AXIS + network regression stays green
        env:
          ZYRA_ROOT_KEY: "ab0123456789abcdef0123456789abcdef"
        run: |
          python -m pytest apps/axis/life_history/tests -q
          python -m pytest apps/axis/tests -q

      - name: 3/3 Network core regression
        run: |
          python -m shared_engines.security.clearance -q
          python -m shared_engines.security.biometrics -q
          python -m network.transport.tcp_transport -q

      - name: Commit (only if all green)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/agro/tests/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "agro: E2E test subjects use organization kind - person requires biometric enroll"
            git push
          fi
