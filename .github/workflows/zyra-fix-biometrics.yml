name: "ZYRA Auditoría ZID - Resumen Activo"

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  audit_zid_summary:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout del Repo"
        uses: actions/checkout@v4

      - name: "AUDITORÍA ZID Y GENERACIÓN DE RESUMEN"
        run: |
          # Inicializar el archivo de resumen de GitHub Actions
          echo "# 📋 REPORTE DE AUDITORÍA ZID (OCR y UI)" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fecha:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          # 1. Buscar archivos Frontend
          echo "## 1. Archivos Frontend (Interfaz de Registro)" >> $GITHUB_STEP_SUMMARY
          FRONTEND_FILES=$(find . -type f \( -name "*.html" -o -name "*.js" \) | grep -iE "register|zid|paso|step|crear" | grep -v node_modules | grep -v ".git" | head -n 20)
          if [ -z "$FRONTEND_FILES" ]; then
              echo "⚠️ No se encontraron archivos frontend con nombres coincidentes." >> $GITHUB_STEP_SUMMARY
          else
              echo "```text" >> $GITHUB_STEP_SUMMARY
              echo "$FRONTEND_FILES" >> $GITHUB_STEP_SUMMARY
              echo "```" >> $GITHUB_STEP_SUMMARY
          fi

          # 2. Buscar archivos Backend
          echo "## 2. Archivos Backend (API y OCR)" >> $GITHUB_STEP_SUMMARY
          BACKEND_FILES=$(find . -type f -name "*.py" | grep -iE "register|zid|ocr|document|identity|biometric|selfie|capture" | grep -v __pycache__ | grep -v ".pyc" | head -n 20)
          if [ -z "$BACKEND_FILES" ]; then
              echo "⚠️ No se encontraron archivos backend con nombres coincidentes." >> $GITHUB_STEP_SUMMARY
          else
              echo "```text" >> $GITHUB_STEP_SUMMARY
              echo "$BACKEND_FILES" >> $GITHUB_STEP_SUMMARY
              echo "```" >> $GITHUB_STEP_SUMMARY
          fi

          # 3. Análisis de Hardcodeo de País
          echo "## 3. Análisis de Hardcodeo de País (El Salvador / 503)" >> $GITHUB_STEP_SUMMARY
          COUNTRY_HARDCODE=$(grep -rE "El Salvador|DUI|503|\+503|country.*SV" --include="*.py" --include="*.js" --include="*.html" . | grep -v node_modules | grep -v ".git" | head -n 15)
          if [ -z "$COUNTRY_HARDCODE" ]; then
              echo "✅ No se encontraron referencias hardcodeadas de país." >> $GITHUB_STEP_SUMMARY
          else
              echo "⚠️ **Referencias encontradas (Requiere multi-país):**" >> $GITHUB_STEP_SUMMARY
              echo "```text" >> $GITHUB_STEP_SUMMARY
              echo "$COUNTRY_HARDCODE" >> $GITHUB_STEP_SUMMARY
              echo "```" >> $GITHUB_STEP_SUMMARY
          fi

          # 4. Análisis de UI de Cámara (Tamaño)
          echo "## 4. Análisis de UI de Cámara (Tamaño de pantalla)" >> $GITHUB_STEP_SUMMARY
          CAMERA_UI=$(grep -rE "width.*100%|height.*100%|video.*style|camera.*size|max-width" --include="*.html" --include="*.js" . | grep -v node_modules | head -n 10)
          if [ -z "$CAMERA_UI" ]; then
              echo "ℹ️ No se detectaron configuraciones de cámara obvias en el escaneo rápido." >> $GITHUB_STEP_SUMMARY
          else
              echo "📷 **Configuraciones detectadas:**" >> $GITHUB_STEP_SUMMARY
              echo "```text" >> $GITHUB_STEP_SUMMARY
              echo "$CAMERA_UI" >> $GITHUB_STEP_SUMMARY
              echo "```" >> $GITHUB_STEP_SUMMARY
          fi

          # 5. Validación de Nombres (OCR vs Input)
          echo "## 5. Validación de Nombres (OCR vs Input)" >> $GITHUB_STEP_SUMMARY
          NAME_VALIDATION=$(grep -rE "name.*match|validate.*name|compare.*ocr|nombre.*igual" --include="*.py" --include="*.js" . | grep -v node_modules | head -n 10)
          if [ -z "$NAME_VALIDATION" ]; then
              echo "🔴 **CRÍTICO:** No se encontró lógica de validación de nombres entre el input y el OCR." >> $GITHUB_STEP_SUMMARY
          else
              echo "✅ **Lógica de validación encontrada:**" >> $GITHUB_STEP_SUMMARY
              echo "```text" >> $GITHUB_STEP_SUMMARY
              echo "$NAME_VALIDATION" >> $GITHUB_STEP_SUMMARY
              echo "```" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Auditoría completada. Revisa el resumen arriba.**" >> $GITHUB_STEP_SUMMARY
