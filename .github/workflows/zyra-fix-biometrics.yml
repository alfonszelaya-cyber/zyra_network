name: "AXIS AX-6 (reintento): fixture autouse via patron dedent probado"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: axis-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - AX-6.1 y 6.2: utcnow==0 + migraciones idempotentes"
        run: |
          python3 - <<'VEREOF'
          from pathlib import Path
          total = 0
          for f in Path("apps/axis").rglob("*.py"):
              try:
                  txt = f.read_text(encoding="utf-8")
              except Exception:
                  continue
              total += txt.count("utcnow")
          assert total == 0, (
              "utcnow presentes: " + str(total))
          print("AX6.1 OK: 0 usages de utcnow")
          for f in sorted(Path("apps/axis").rglob("*.py")):
              s = str(f)
              if ("axis_store.py" in s
                      or s.endswith("store.py")
                      or "/tests/" in s
                      or "__init__" in s):
                  continue
              try:
                  txt = f.read_text(encoding="utf-8")
              except Exception:
                  continue
              for i, l in enumerate(
                  txt.splitlines(), 1):
                  if "CREATE TABLE" in l.upper():
                      assert "IF NOT EXISTS" in l, (
                          s + ":" + str(i))
          print("AX6.2 OK: tablas de servicios"
                " idempotentes")
          VEREOF

      - name: "Paso B - AX-6.3: fixture autouse APPEND al final (patron dedent probado)"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path("apps/axis/tests/test_axis.py")
          t = p.read_text(encoding="utf-8")
          if "_axz_kill_servers" in t:
              print("SKIP fixture (ya presente)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              # ====== AX-6.3: apagado de servidores tras cada test ======


              import pytest


              @pytest.fixture(autouse=True)
              def _axz_kill_servers():
                  yield
                  import threading as _th
                  for _t in list(_th.enumerate()):
                      _tgt = getattr(
                          _t, "_target", None)
                      if _tgt is None:
                          continue
                      _srv = getattr(
                          _tgt, "__self__", None)
                      if _srv is None:
                          continue
                      _cls = type(_srv).__name__
                      if ("Server" not in _cls
                              and "HTTP" not in _cls):
                          continue
                      if not (hasattr(
                              _srv, "shutdown")
                              and hasattr(
                              _srv, "server_close")):
                          continue
                      try:
                          _srv.shutdown()
                          _srv.server_close()
                      except Exception:
                          pass
                      try:
                          _t.join(timeout=3)
                      except Exception:
                          pass
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert "_axz_kill_servers" in final
          print("OK fixture autouse agregada"
                " al final de test_axis.py"
                " (AST valido)")
          TSEOF

      - name: "Paso C - GATE 4 apps (ver la linea 'ZYRA leftover threads')"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q -s --tb=short

      - name: "Paso D - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO AX-6"
            echo '```'
            python3 -m pytest apps/axis/tests/test_axis.py -vv --tb=long -x 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "AXIS AX-6: utcnow 0 + migraciones idempotentes (verificados) + fixture autouse que apaga servidores de tests axz" -m "6.1 utcnow: 0 usages en apps/axis (verificacion dura en cada run). 6.2 migraciones: axis_* en axis_store.py, life_* en store.py (dueno de dominio), tablas de servicios 100% CREATE TABLE IF NOT EXISTS (schema-on-first-use idempotente) - verificado automaticamente. 6.3 hilos: fixture autouse _axz_kill_servers en test_axis.py que tras cada test localiza servidores HTTP vivos (thread._target.__self__) y ejecuta shutdown+server_close+join; los autouse aplican al modulo completo sin importar la posicion en el archivo. El intento anterior fallo por un SyntaxError en el script generador (no en el repo); este usa el patron dedent probado de AX-4/AX-5."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
