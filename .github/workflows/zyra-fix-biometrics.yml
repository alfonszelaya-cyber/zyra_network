# ZYRA REV D v3 - parche del nucleo de registro ZID (todo-o-nada)
#
# USO: reemplaza TODO el contenido de .github/workflows/zyra-fix-biometrics.yml
# con este archivo y ejecuta el workflow (Run workflow). Si puedes, sube el
# archivo con "Add file > Upload files" en vez de copiar/pegar.

name: ZYRA fix biometricos REV D

'on':
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zyra-fix-biometrics
  cancel-in-progress: true

jobs:
  revd:
    name: Parchear nucleo de registro (REV D)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NUC: 
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Diagnostico previo (solo lectura)
        run: |
          echo "== superapp.py en el repo (todas las copias) =="
          (git ls-files | grep -i "superapp.py$" || true)
          for f in $(git ls-files | grep -i "superapp.py$" || true); do
            echo "-- $f: $(wc -c < "$f") bytes | BEGIN=$(grep -c "ZYRA-V6-BEGIN" "$f" || true) END=$(grep -c "ZYRA-V6-END" "$f" || true)"
          done
          if [ -f superapp.py ]; then sha256sum superapp.py; fi

      - name: Parchear superapp.py (todo o nada)
        run: |
          python3 - <<'PYEOF'
          import base64, gzip, hashlib, os, re, shutil, sys, traceback, py_compile
          from pathlib import Path

          B = '/*ZYRA-V6-BEGIN*/'
          E = '/*ZYRA-V6-END*/'
          SHA_GZ = '401a534c267cdc2a0f646a6213f8862f2d81592eca5801c8308f23c114fe4519'
          LARGO_GZ = 12700
          SHA_JS = '18722285c2afd5e25c06041c407c99b4232237eff70d5c5c98a16f58100abc9d'
          LARGO_JS = 28837
          LARGO_PLANO = 38636
          TOK = ('bAbrirF', 'bCapF', 'galF', 'bAbrirA', 'bCapA', 'bIr4', 'bIr5', 'tipoDoc',
                 'nombreNoCoincide', 'bioRechazada', 'docVencido', 'ps5', 'clave2', 'Tesseract')

          RES = []

          def decir(s):
              s = str(s)
              RES.append(s)
              print(s, flush=True)
              try:
                  p = os.environ.get('GITHUB_STEP_SUMMARY')
                  if p:
                      d = os.path.dirname(p)
                      if d and not os.path.isdir(d):
                          os.makedirs(d, exist_ok=True)
                      with open(p, 'a', encoding='utf-8') as f:
                          f.write(s.rstrip() + '\n')
              except Exception:
                  pass

          def falla(msg):
              decir('')
              decir('ERROR: ' + msg)
              decir('')
              decir('NO SE PUBLICO NADA (regla todo-o-nada). Pega este Resumen completo en el chat.')
              sys.exit(1)

          def main():
              decir('## ZYRA REV D v3 - parche del nucleo de registro (todo-o-nada)')
              decir('')
              decir('### 0) Integridad del nucleo recibido')
              gz = re.sub(r'\s+', '', os.environ.get('NUC', ''))
              decir('- Nucleo comprimido recibido: ' + str(len(gz)) + ' chars (esperado ' + str(LARGO_GZ) + ')')
              if len(gz) != LARGO_GZ:
                  falla('EL YAML QUEDO CORTO O EDITADO AL COPIARLO. No copies/pegues: sube el archivo .yml completo con "Add file > Upload files" en GitHub.')
              if hashlib.sha256(gz.encode('ascii')).hexdigest() != SHA_GZ:
                  falla('El nucleo recibido NO coincide con el SHA esperado: el YAML se corrompio al copiarlo. Sube el archivo .yml con "Add file > Upload files", sin copiar/pegar.')
              try:
                  js = gzip.decompress(base64.b64decode(gz)).decode('utf-8')
              except Exception as e:
                  falla('El nucleo no se pudo decodificar (%r): el YAML quedo cortado. Sube el archivo .yml con Upload files.' % e)
              if len(js) != LARGO_JS or hashlib.sha256(js.encode('utf-8')).hexdigest() != SHA_JS:
                  falla('El nucleo decodificado no coincide con lo esperado.')
              for req in ('ZYRA-REVD', 'function detectarLado', 'function simNombres', 'function mrzNombres', 'function verificar'):
                  if req not in js:
                      falla('Falta en el nucleo: ' + req)
              decir('- Integridad del nucleo: OK (SHA ' + SHA_JS[:16] + '...)')

              decir('')
              decir('### 1) Localizar superapp.py (tolera copias multiples)')
              cands = sorted(str(p) for p in Path('.').rglob('superapp.py') if '.git' not in p.parts)
              decir('- Copias de superapp.py en el repo: ' + (', '.join(cands) if cands else 'NINGUNA'))
              if not cands:
                  falla('No encontre superapp.py en el repositorio.')
              marcadas = []
              for c in cands:
                  try:
                      t = Path(c).read_text(encoding='utf-8')
                  except Exception as e:
                      decir('- aviso: no pude leer ' + c + ' (' + str(e)[:80] + ')')
                      continue
                  if (B in t) and (E in t):
                      marcadas.append((c, t))
              if len(marcadas) == 0:
                  falla('Ningun superapp.py tiene los marcadores ' + B + ' ... ' + E + ' (el repo no esta en estado revC). Pega el Resumen del inspector.')
              if len(marcadas) > 1:
                  falla('Varias copias tienen marcadores: ' + ', '.join(c for c, _t in marcadas) + '. Pega este Resumen y lo ajusto.')
              ruta, src = marcadas[0]
              decir('- Archivo elegido: ' + ruta)

              decir('')
              decir('### 2) Verificaciones del archivo (antes de tocar nada)')
              if src.count(B) != 1 or src.count(E) != 1:
                  falla('Los marcadores no son unicos: BEGIN=%d END=%d' % (src.count(B), src.count(E)))
              i = src.index(B)
              j = src.index(E)
              if j <= i:
                  falla('Los marcadores estan en orden incorrecto.')
              old = src[i + len(B):j]
              pre = src[:i + len(B)]
              post = src[j:]
              oldc = re.sub(r'\s+', '', old)
              if not re.fullmatch(r'[A-Za-z0-9+/=]*', oldc):
                  falla('Lo que hay entre los marcadores NO es base64; aborto para no romper nada.')
              if len(oldc) < 100:
                  falla('El nucleo actual entre marcadores parece vacio (%d chars).' % len(oldc))
              decir('- Linea del bloque marcado: ' + str(src[:i].count('\n') + 1))
              decir('- Nucleo anterior: ' + str(len(oldc)) + ' chars base64')
              try:
                  py_compile.compile(str(ruta), cfile='/tmp/zyra_base.pyc', doraise=True)
              except Exception as e:
                  falla('El superapp.py actual no compila: ' + str(e)[:200])
              decir('- py_compile del archivo actual: OK')

              plano = base64.b64encode(js.encode('utf-8')).decode('ascii')
              if len(plano) != LARGO_PLANO:
                  falla('El nucleo re-encodeado mide ' + str(len(plano)) + ' y deben ser ' + str(LARGO_PLANO) + '.')
              try:
                  viejo_js = base64.b64decode(oldc).decode('utf-8')
                  ya = hashlib.sha256(viejo_js.encode('utf-8')).hexdigest() == SHA_JS
              except Exception:
                  ya = False
              if oldc == plano or ya:
                  decir('')
                  decir('RESULTADO: REV D YA ESTABA APLICADO en ' + ruta + '. No se toca nada (run idempotente).')
                  sys.exit(0)

              decir('')
              decir('### 3) Aplicar el parche (solo el bloque marcado; resto byte a byte)')
              nuevo = pre + plano + post
              if nuevo[:len(pre)] != pre or nuevo[-len(post):] != post:
                  falla('Fallo la conservacion fuera del bloque.')
              perdidos = [t for t in TOK if nuevo.count(t) < src.count(t)]
              if perdidos:
                  falla('El parche quito referencias de: ' + ', '.join(perdidos))
              tmp = Path('/tmp/zyra_superapp_new.py')
              tmp.write_text(nuevo, encoding='utf-8')
              try:
                  py_compile.compile(str(tmp), cfile='/tmp/zyra_new.pyc', doraise=True)
              except Exception as e:
                  falla('El archivo parchado no compila: ' + str(e)[:200])
              shutil.copyfile(str(tmp), str(ruta))
              decir('- Conservacion fuera del bloque: OK (byte a byte)')
              decir('- Referencias del base conservadas: OK (14/14)')
              decir('- py_compile del archivo parchado: OK')

              decir('')
              decir('### 4) Resultado')
              for l in (
                  '- Archivo parchado: `' + ruta + '`',
                  '- Nucleo nuevo: ' + str(len(plano)) + ' chars base64 / ' + str(len(js)) + ' bytes JS',
                  '- SHA256 del JS nuevo: `' + SHA_JS + '`',
                  '- Resultado: PATCH_OK',
              ):
                  decir(l)
              decir('')
              decir('PATCH_OK')

          def arrancar():
              try:
                  main()
              except SystemExit:
                  raise
              except Exception:
                  try:
                      decir('')
                      decir('ERROR INESPERADO. Traza completa:')
                      decir(traceback.format_exc())
                      decir('NO SE PUBLICO NADA (regla todo-o-nada).')
                  except Exception:
                      pass
                  sys.exit(1)

          arrancar()
          PYEOF

      - name: Publicar solo si todo valido
        run: |
          set -e
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios: el nucleo REV D ya estaba aplicado"
            echo "Sin cambios: el nucleo REV D ya estaba aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "ZYRA REV D v3: nucleo de registro (regreso al paso exacto, MRZ del reverso, preview chico, pasaporte 1 lado)"
            git push
            echo "Publicada revision REV D v3 (commit $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          fi
