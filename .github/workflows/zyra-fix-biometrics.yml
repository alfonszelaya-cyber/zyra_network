name: ZYRA LABORATORIO - Lote 6A (Fase 6 - renderizar con escalera fotoreal y profundidad)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar y aplicar lote (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_6a.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          reemplazar_verificado() {
            ruta="$1"; firma="$2"
            if [ ! -s "$ruta" ]; then
              echo "FALLO: $ruta no existe para reemplazo verificado"; exit 1
            fi
            if ! grep -qF "$firma" "$ruta"; then
              echo "FALLO: firma ausente en $ruta (contenido inesperado, NO se toca)"; exit 1
            fi
            cat > "$ruta"
            echo "REEMPLAZADO-VERIFICADO: $ruta"
            echo "$ruta|REEMPLAZADO" >> "$MANIFEST"
          }
          mkdir -p apps/laboratorio/domain apps/laboratorio/infrastructure/persistence apps/laboratorio/infrastructure/repositories apps/laboratorio/infrastructure/providers apps/laboratorio/application/use_cases apps/laboratorio/application/handlers apps/laboratorio/application/workflows apps/laboratorio/routers/api apps/laboratorio/modules apps/laboratorio/templates/dashboards
          echo "=== ANCLAS: app.py y service_registry.py ==="
          python3 - << 'PYANCHOR'
          from pathlib import Path
          p = Path("apps/laboratorio/infrastructure/api/app.py")
          codigo = p.read_text(encoding="utf-8")
          ancla1 = "from apps.laboratorio.routers.public.health import registrar_rutas as registrar_salud"
          ancla2 = "registrar_salud(app)"
          assert ancla1 in codigo and ancla2 in codigo, "anclas ausentes en app.py"
          if "conectar_render(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.render_module import conectar as conectar_render")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_render(app)")
              p.write_text(codigo, encoding="utf-8")
              print("app.py: render conectado")
          else:
              print("app.py: ya contenia render")
          p2 = Path("apps/laboratorio/registry/services/service_registry.py")
          c2 = p2.read_text(encoding="utf-8")
          a_imp = "from apps.laboratorio.application.handlers.decision_handler import ManejadorDecisiones"
          assert a_imp in c2, "ancla import ausente en service_registry.py"
          if "manejador_renders" not in c2:
              nuevos_imp = (
                  "from apps.laboratorio.application.handlers.render_handler import ManejadorRenders\n"
                  "from apps.laboratorio.application.use_cases.render_world import CasoRenderizarEscena\n"
                  "from apps.laboratorio.application.workflows.photoreal_ladder import EscaleraFotoreal\n"
                  "from apps.laboratorio.infrastructure.persistence.render_store import RenderStore\n"
                  "from apps.laboratorio.infrastructure.repositories.render_repository import RenderRepository\n"
              )
              c2 = c2.replace(a_imp, nuevos_imp + a_imp)
              a_reg = '    c.obtener("suscriptor_zyra")'
              assert a_reg in c2, "ancla registro ausente"
              nuevos_reg = (
                  '    c.registrar("render_store", lambda _c: RenderStore(conexion))\n'
                  '    c.registrar("repo_renders", lambda _c: RenderRepository(_c.obtener("render_store")))\n'
                  '    c.registrar("escalera_fotoreal", lambda _c: EscaleraFotoreal())\n'
                  '    c.registrar("caso_renderizar", lambda _c: CasoRenderizarEscena(_c.obtener("repo_renders"), _c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("repo_luces"), _c.obtener("repo_historial"), _c.obtener("escalera_fotoreal"), _c.obtener("auditoria_sink")))\n'
                  '    c.registrar("manejador_renders", lambda _c: ManejadorRenders(_c.obtener("caso_renderizar"), _c.obtener("repo_renders"), _c.obtener("repo_escenas"), _c.obtener("repo_proyectos"), _c.obtener("auditoria_sink")))\n'
              )
              c2 = c2.replace(a_reg, nuevos_reg + a_reg)
              p2.write_text(c2, encoding="utf-8")
              print("service_registry.py ACTUALIZADO: 5 servicios de Fase 6")
          else:
              print("service_registry.py: ya contenia Fase 6")
          PYANCHOR
          echo "apps/laboratorio/infrastructure/api/app.py|ACTUALIZADO" >> "$MANIFEST"
          echo "apps/laboratorio/registry/services/service_registry.py|ACTUALIZADO" >> "$MANIFEST"
          echo "=== ENCODER PNG REAL (stdlib) ==="
          escribir apps/laboratorio/infrastructure/providers/png_encoder.py << 'ZYRA_EOF'
          """Encoder PNG real con stdlib (struct + zlib).

          Produce PNGs validos sin dependencias externas. Verificable con
          shared/utilities/image_utils (firma y dimensiones IHDR).
          """
          import struct
          import zlib

          FIRMA = b"\x89PNG\r\n\x1a\n"


          def _chunk(tipo: bytes, datos: bytes) -> bytes:
              """Chunk PNG: longitud + tipo + datos + CRC32."""
              if len(tipo) != 4:
                  raise ValueError("Tipo de chunk debe tener 4 bytes.")
              return (
                  struct.pack(">I", len(datos)) + tipo + datos
                  + struct.pack(">I", zlib.crc32(tipo + datos) & 0xFFFFFFFF)
              )


          def encode_png_rgb(ancho: int, alto: int, pixeles: bytes) -> bytes:
              """Codifica un buffer RGB de 8 bits (3 bytes por pixel) a PNG."""
              if ancho < 1 or alto < 1:
                  raise ValueError("Dimensiones del PNG invalidas.")
              esperado = ancho * alto * 3
              if not isinstance(pixeles, (bytes, bytearray)) or len(pixeles) != esperado:
                  raise ValueError(
                      "El buffer RGB debe tener " + str(esperado) + " bytes."
                  )
              ihdr = struct.pack(">IIBBBBB", ancho, alto, 8, 2, 0, 0, 0)
              filas = bytearray()
              paso = ancho * 3
              for y in range(alto):
                  filas.append(0)
                  filas += pixeles[y * paso:(y + 1) * paso]
              idat = zlib.compress(bytes(filas), 6)
              return (
                  FIRMA + _chunk(b"IHDR", ihdr)
                  + _chunk(b"IDAT", idat) + _chunk(b"IEND", b"")
              )


          def encode_png_gray(ancho: int, alto: int, pixeles: bytes) -> bytes:
              """Codifica un buffer de escala de grises de 8 bits a PNG."""
              if ancho < 1 or alto < 1:
                  raise ValueError("Dimensiones del PNG invalidas.")
              esperado = ancho * alto
              if not isinstance(pixeles, (bytes, bytearray)) or len(pixeles) != esperado:
                  raise ValueError(
                      "El buffer de grises debe tener " + str(esperado) + " bytes."
                  )
              ihdr = struct.pack(">IIBBBBB", ancho, alto, 8, 0, 0, 0, 0)
              filas = bytearray()
              for y in range(alto):
                  filas.append(0)
                  filas += pixeles[y * ancho:(y + 1) * ancho]
              idat = zlib.compress(bytes(filas), 6)
              return (
                  FIRMA + _chunk(b"IHDR", ihdr)
                  + _chunk(b"IDAT", idat) + _chunk(b"IEND", b"")
              )
          ZYRA_EOF
          echo "=== FUENTE BITMAP 3x5 (texto raster real) ==="
          escribir apps/laboratorio/infrastructure/providers/font_bitmap.py << 'ZYRA_EOF'
          """Fuente bitmap 3x5 para rasterizar texto real en PNG.

          Cubre A-Z, 0-9, espacio y signos basicos. Los caracteres no
          cubiertos se dibujan como bloque (declarado en metadata).
          """

          G = {
              "A": (2, 5, 7, 5, 5), "B": (6, 5, 6, 5, 6), "C": (3, 4, 4, 4, 3),
              "D": (6, 5, 5, 5, 6), "E": (7, 4, 6, 4, 7), "F": (7, 4, 6, 4, 4),
              "G": (3, 4, 5, 5, 3), "H": (5, 5, 7, 5, 5), "I": (7, 2, 2, 2, 7),
              "J": (1, 1, 1, 5, 2), "K": (5, 5, 6, 5, 5), "L": (4, 4, 4, 4, 7),
              "M": (5, 7, 7, 5, 5), "N": (5, 7, 7, 7, 5), "O": (2, 5, 5, 5, 2),
              "P": (6, 5, 6, 4, 4), "Q": (2, 5, 5, 6, 3), "R": (6, 5, 6, 5, 5),
              "S": (3, 4, 2, 1, 6), "T": (7, 2, 2, 2, 2), "U": (5, 5, 5, 5, 7),
              "V": (5, 5, 5, 5, 2), "W": (5, 5, 7, 7, 5), "X": (5, 5, 2, 5, 5),
              "Y": (5, 5, 2, 2, 2), "Z": (7, 1, 2, 4, 7),
              "0": (7, 5, 5, 5, 7), "1": (2, 6, 2, 2, 7), "2": (6, 1, 2, 4, 7),
              "3": (7, 1, 2, 1, 7), "4": (5, 5, 7, 1, 1), "5": (7, 4, 6, 1, 6),
              "6": (3, 4, 7, 5, 7), "7": (7, 1, 2, 2, 2), "8": (7, 5, 2, 5, 7),
              "9": (7, 5, 7, 1, 6),
              " ": (0, 0, 0, 0, 0), "-": (0, 0, 7, 0, 0), ".": (0, 0, 0, 0, 2),
              "+": (0, 2, 7, 2, 0), "%": (5, 1, 2, 4, 5), ":": (0, 2, 0, 2, 0),
          }
          BLOQUE = (7, 5, 5, 5, 7)
          ANCHO = 3
          ALTO = 5


          def glifo_de(caracter: str) -> tuple:
              """Devuelve los 5 patrones de 3 bits del caracter."""
              if not isinstance(caracter, str) or len(caracter) != 1:
                  raise ValueError("glifo_de requiere un caracter.")
              c = caracter.upper()
              return G.get(c, BLOQUE)


          def texto_a_lineas(texto: str) -> list:
              """Convierte texto a lista de (caracter, patrones)."""
              if not texto:
                  return []
              return [(c, glifo_de(c)) for c in str(texto)[:120]]
          ZYRA_EOF
          echo "=== DOMINIO RENDER ==="
          escribir apps/laboratorio/domain/render.py << 'ZYRA_EOF'
          """Trabajo de render: un render real de una escena en una calidad.

          La imagen y su profundidad se guardan como bytes reales (BLOB).
          El hash sella la imagen (integridad ZYRA) y la duracion es
          medida, no estimada.
          """
          from dataclasses import dataclass

          from apps.laboratorio.shared.enums.render_quality import RenderQuality
          from apps.laboratorio.shared.models.base import EntidadBase
          from apps.laboratorio.shared.models.identifiers import Identificador


          @dataclass
          class TrabajoRender(EntidadBase):
              """Render terminado y descargable."""

              prefijo_id = "rnd"

              proyecto_id: Identificador = None
              escena_id: Identificador = None
              calidad: RenderQuality = RenderQuality.BORRADOR
              formato: str = "svg"
              ancho: int = 0
              alto: int = 0
              imagen: bytes = b""
              profundidad: bytes = b""
              hash_sha256: str = ""
              duracion_ms: float = 0.0

              def __post_init__(self):
                  if self.proyecto_id is None or self.escena_id is None:
                      raise ValueError("El render requiere proyecto_id y escena_id.")
                  if not isinstance(self.calidad, RenderQuality):
                      raise ValueError("Calidad de render invalida.")
                  if self.formato not in ("svg", "png"):
                      raise ValueError("Formato de render invalido: " + repr(self.formato))
                  if self.ancho < 16 or self.alto < 16:
                      raise ValueError("Dimensiones del render invalidas.")
                  if not self.imagen:
                      raise ValueError("Un render sin imagen no es valido.")
                  if self.duracion_ms < 0:
                      raise ValueError("La duracion no puede ser negativa.")

              @property
              def mime(self) -> str:
                  """MIME oficial del formato del render."""
                  if self.formato == "svg":
                      return "image/svg+xml"
                  return "image/png"

              @property
              def tiene_profundidad(self) -> bool:
                  """True si el canal PROFUNDIDAD fue producido."""
                  return bool(self.profundidad)
          ZYRA_EOF
