# ZYRA-FIX v5 - registro ZID (rev 2 - YAML validado en sandbox)
# Paso 1 - rollback al estado estable y push inmediato (la pagina vuelve a funcionar SIEMPRE)
# Paso 2 - diagnostico de la version rota, parche v5 endurecido y validaciones duras
# Paso 3 - commit solo si TODO pasa; si algo falla, queda publicado el estado estable
name: zyra-fix-biometrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paso 1 - Rollback al estado estable y push inmediato
        run: |
          set -e
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          if ! git cat-file -e f785b49 2>/dev/null; then
            echo "::error::No se encontro el commit f785b49"
            exit 2
          fi
          git checkout f785b49^ -- superapp.py
          echo "## Informe ZYRA-FIX v5 (registro ZID)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Paso 1 - Rollback del parche que rompio los botones" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet HEAD -- superapp.py; then
            echo "- superapp.py ya estaba en el estado estable; sin cambios." >> "$GITHUB_STEP_SUMMARY"
          else
            git add superapp.py
            git commit -m "ZYRA-FIX v5 punto 1 - rollback al estado estable"
            git push origin HEAD
            echo "- superapp.py restaurado al estado estable y PUBLICADO. La pagina vuelve a funcionar aunque todo lo demas falle." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Paso 2 - Diagnostico parche v5 y validaciones
        run: |
          mkdir -p _zyra
          python3 <<'PYEOF'
          import re, os, sys, json, subprocess, tempfile, py_compile

          Z = os.path.join(os.getcwd(), "_zyra")
          os.makedirs(Z, exist_ok=True)
          SUM = os.environ.get("GITHUB_STEP_SUMMARY") or os.path.join(Z, "resumen.md")

          def suma(s):
              with open(SUM, "a", encoding="utf-8") as f:
                  f.write(s.rstrip() + "\n")

          rechazos = []
          def rechazo(m):
              rechazos.append(m)
              suma("- RECHAZO: " + m)

          RUTA = "superapp.py"
          if not os.path.exists(RUTA):
              hallado = None
              for raiz, _dirs, files in os.walk("."):
                  if ".git" in raiz:
                      continue
                  if "superapp.py" in files:
                      hallado = os.path.join(raiz, "superapp.py")
                      break
              RUTA = hallado
          if not RUTA:
              rechazo("no se encontro superapp.py en el repositorio")
              with open(os.path.join(Z, "RECHAZO"), "w", encoding="utf-8") as f:
                  f.write("superapp.py no encontrado")
              with open(os.path.join(Z, "ruta.txt"), "w", encoding="utf-8") as f:
                  f.write("superapp.py")
              sys.exit(0)

          with open(os.path.join(Z, "ruta.txt"), "w", encoding="utf-8") as f:
              f.write(RUTA)

          with open(RUTA, encoding="utf-8") as f:
              base = f.read()

          IIFE = r"""/*ZYRA-V5-IIFE-BEGIN*/
          (function(){
          "use strict";
          try{
          if(window.__zyraV5){ return; }
          window.__zyraV5 = true;
          var D = document;
          try{
          var stCss=D.createElement("style");
          stCss.id="zyraCssV5";
          stCss.textContent="#ps2,#ps3{max-width:520px;margin-left:auto;margin-right:auto}#ps2 video,#ps3 video,#ps2 img,#ps3 img{max-width:100%;height:auto}#ps2 img,#ps3 img{max-height:58vh}";
          (D.head||D.documentElement).appendChild(stCss);
          }catch(e){}
          function $(id){ try{ return D.getElementById(id); }catch(e){ return null; } }
          /*ZTEST-BEGIN*/
          function norm(s){ try{ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/ +/g," ").trim(); }catch(e){ return String(s||"").toUpperCase().trim(); } }
          function tokens(s){ return norm(s).split(" ").filter(function(x){ return x.length>1; }); }
          function levd(a,b){ var m=a.length, n=b.length, i, j; if(!m){ return n; } if(!n){ return m; }
          var prev=new Array(n+1), cur=new Array(n+1);
          for(j=0;j<=n;j++){ prev[j]=j; }
          for(i=1;i<=m;i++){ cur[0]=i;
          for(j=1;j<=n;j++){ var c=(a.charAt(i-1)===b.charAt(j-1))?0:1;
          var v=prev[j]+1; if(cur[j-1]+1<v){ v=cur[j-1]+1; } if(prev[j-1]+c<v){ v=prev[j-1]+c; }
          cur[j]=v; }
          for(j=0;j<=n;j++){ prev[j]=cur[j]; } }
          return prev[n]; }
          function tokEn(tok, B){ var j;
          for(j=0;j<B.length;j++){ if(tok===B[j]){ return true; }
          var L=tok.length, tol=(L>=7)?2:((L>=4)?1:0);
          if(tol>0 && Math.abs(tok.length-B[j].length)<=tol && levd(tok,B[j])<=tol){ return true; } }
          return false; }
          function simNombres(a,b){ try{
          var A=tokens(a), B=tokens(b);
          if(!A.length || !B.length){ return 0; }
          var hit=0, i;
          for(i=0;i<A.length;i++){ if(tokEn(A[i],B)){ hit++; } }
          return hit/Math.max(A.length,B.length);
          }catch(e){ return 0; } }
          function familiaDoc(ocr){ try{
          var x=norm(ocr);
          if(x.indexOf("DOCUMENTO UNICO")>=0 || x.indexOf("IDENTIDAD")>=0 || x.search(/(^|[^A-Z0-9])DUI([^A-Z0-9]|$)/)>=0){ return "dui"; }
          if(x.indexOf("LICENCIA")>=0 || x.indexOf("LICENSE")>=0 || x.indexOf("DRIVER")>=0){ return "licencia"; }
          if(x.indexOf("PASAPORTE")>=0 || x.indexOf("PASSPORT")>=0){ return "pasaporte"; }
          if(x.indexOf("RESIDENTE")>=0 || x.indexOf("RESIDENCIA")>=0){ return "residente"; }
          return "";
          }catch(e){ return ""; } }
          function familiaTipo(sel){ try{
          var x=norm(sel);
          if(x.indexOf("DUI")>=0){ return "dui"; }
          if(x.indexOf("LICENCIA")>=0){ return "licencia"; }
          if(x.indexOf("PASAPORTE")>=0){ return "pasaporte"; }
          if(x.indexOf("RESIDENT")>=0){ return "residente"; }
          return "";
          }catch(e){ return ""; } }
          /*ZTEST-END*/
          function banner(msg, esError){ try{
          var b=$("zyraBnnV5");
          if(!b){ b=D.createElement("div"); b.id="zyraBnnV5";
          b.setAttribute("style","position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:2147483000;max-width:92vw;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.45;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,0.4);text-align:center;display:none;font-family:system-ui,sans-serif;");
          (D.body||D.documentElement).appendChild(b); }
          b.style.background = esError ? "#b3261e" : "#2c2c34";
          b.textContent = String(msg||"");
          b.style.display = "block";
          if(b.__t){ clearTimeout(b.__t); }
          b.__t = setTimeout(function(){ try{ b.style.display="none"; }catch(e){} }, esError?6500:3500);
          }catch(e){} }
          function overlay(mostrar, txt){ try{
          var o=$("zyraOvlV5");
          if(!o && mostrar){ o=D.createElement("div"); o.id="zyraOvlV5";
          o.setAttribute("style","position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(8,8,14,0.62);z-index:2147482000;display:flex;align-items:center;justify-content:center;");
          var c=D.createElement("div"); c.id="zyraOvlTxtV5";
          c.setAttribute("style","background:#17171f;color:#fff;padding:18px 20px;border-radius:14px;font-size:15px;text-align:center;max-width:78vw;font-family:system-ui,sans-serif;");
          o.appendChild(c); (D.body||D.documentElement).appendChild(o); }
          if(o){ if(mostrar){ var c2=$("zyraOvlTxtV5"); if(c2){ c2.textContent=String(txt||"Procesando..."); } o.style.display="flex"; } else { o.style.display="none"; } }
          }catch(e){} }
          function inputNombre(){ try{
          var lista=D.querySelectorAll("input");
          var i, it, ty, ph;
          for(i=0;i<lista.length;i++){
          it=lista[i]; ty=(it.type||"").toLowerCase();
          if(ty==="file"||ty==="checkbox"||ty==="radio"||ty==="password"||ty==="hidden"||ty==="submit"||ty==="button"){ continue; }
          ph=((it.placeholder||"")+" "+(it.name||"")+" "+(it.id||"")).toLowerCase();
          if(ph.indexOf("nombre")>=0){ return it; } }
          for(i=0;i<lista.length;i++){
          it=lista[i]; ty=(it.type||"").toLowerCase();
          if(ty===""||ty==="text"||ty==="tel"){ if(String(it.value||"").trim().length>3){ return it; } } }
          return null;
          }catch(e){ return null; } }
          function selectTipo(){ try{
          var s=D.querySelector("#ps1 select") || D.querySelector("select");
          if(!s){ return ""; }
          var o=(s.options && s.selectedIndex>=0) ? s.options[s.selectedIndex] : null;
          return o ? (o.text||o.value||"") : "";
          }catch(e){ return ""; } }
          function mediaEn(sec){ try{
          var q=sec ? ("#"+sec+" ") : "";
          var tipos=["img","canvas","video"];
          for(var i=0;i<tipos.length;i++){
          var els=D.querySelectorAll(q+tipos[i]);
          if(els.length){ return els[els.length-1]; } }
          return null;
          }catch(e){ return null; } }
          function aCanvas(el, maxLado){ try{
          if(!el){ return null; }
          var w=0, h=0;
          if(el.tagName==="VIDEO"){ w=el.videoWidth||0; h=el.videoHeight||0; }
          else { w=el.naturalWidth||el.width||0; h=el.naturalHeight||el.height||0; }
          if(!w || !h){ return null; }
          var esc=Math.min(1, (maxLado||1024)/Math.max(w,h));
          var c=D.createElement("canvas");
          c.width=Math.max(1,Math.round(w*esc)); c.height=Math.max(1,Math.round(h*esc));
          var cx=c.getContext("2d"); if(!cx){ return null; }
          cx.drawImage(el,0,0,c.width,c.height);
          return c;
          }catch(e){ return null; } }
          function firma(el){ try{
          var th=aCanvas(el,64);
          if(!th){ return String(el.tagName||"?")+String(el.src||"").slice(-80); }
          return String(el.tagName||"?")+String(th.toDataURL?th.toDataURL().length:0);
          }catch(e){ return String(Math.random()); } }
          function ocrDe(el){ try{
          if(!window.Tesseract || !el){ return Promise.resolve(""); }
          var c=aCanvas(el,1024);
          if(!c){ return Promise.resolve(""); }
          return Promise.race([
          window.Tesseract.recognize(c,"spa"),
          new Promise(function(res){ setTimeout(function(){ res({data:{text:""}}); },20000); })
          ]).then(function(r){ try{ return (r && r.data && r.data.text) ? String(r.data.text) : ""; }catch(e){ return ""; } },
          function(){ return ""; });
          }catch(e){ return Promise.resolve(""); } }
          var cacheOcr={k:"", txt:""};
          function ocrDocActual(){ try{
          var el=mediaEn("ps2")||mediaEn("ps3")||mediaEn(null);
          if(!el){ return Promise.resolve(""); }
          var k=firma(el);
          if(k && k===cacheOcr.k && cacheOcr.txt){ return Promise.resolve(cacheOcr.txt); }
          return ocrDe(el).then(function(txt){ try{ if(txt){ cacheOcr={k:k, txt:txt}; } }catch(e){} return txt; });
          }catch(e){ return Promise.resolve(""); } }
          function buscarBoton(nom){ try{
          var e=$(nom);
          if(e){ return e; }
          var q=D.querySelectorAll("[id*='"+nom.toLowerCase()+"'],[id*='"+nom+"']");
          if(q.length){ return q[q.length-1]; }
          var w=window[nom];
          if(w && w.nodeType===1){ return w; }
          return null;
          }catch(e){ return null; } }
          var fallasDoc=0;
          function pasar(el){ try{ el.__zV5=1; setTimeout(function(){ try{ el.click(); }catch(e){} }, 40); }catch(e){} }
          function bloquear(ev){ try{ ev.preventDefault(); }catch(e){} try{ ev.stopPropagation(); }catch(e){} try{ ev.stopImmediatePropagation(); }catch(e){} }
          function gateDoc(ev, el){ try{
          var inp=inputNombre();
          var nom=inp ? String(inp.value||"").trim() : "";
          if(!nom){ bloquear(ev); overlay(false); banner("Escriba su nombre completo tal como aparece en el documento antes de continuar.", true); return; }
          var tipo=selectTipo();
          bloquear(ev);
          overlay(true, "Verificando nombre y tipo de documento...");
          ocrDocActual().then(function(txt){ try{
          var tx=String(txt||"");
          if(!tx){ overlay(false); fallasDoc++;
          if(fallasDoc>=2){ fallasDoc=0; pasar(el); }
          else { banner("No se pudo leer el documento. Mejore la luz y vuelva a capturar, o presione continuar de nuevo.", true); }
          return; }
          var s=simNombres(nom, tx);
          var fD=familiaDoc(tx), fT=familiaTipo(tipo);
          if(s<0.60){ overlay(false); fallasDoc=0;
          banner("El nombre NO coincide con el documento ("+Math.round(s*100)+"%). Corrija su nombre o vuelva a capturar el documento.", true); return; }
          if(fD && fT && fD!==fT){ overlay(false); fallasDoc=0;
          banner("Capturó un documento tipo "+fD+" pero seleccionó "+fT+". Debe capturar el documento seleccionado.", true); return; }
          overlay(false); fallasDoc=0; pasar(el);
          }catch(e){ overlay(false); fallasDoc++; if(fallasDoc>=2){ fallasDoc=0; pasar(el); } else { banner("No se pudo verificar el documento. Intente de nuevo.", true); } }
          }, function(){ overlay(false); fallasDoc++; if(fallasDoc>=2){ fallasDoc=0; pasar(el); } else { banner("No se pudo verificar el documento. Intente de nuevo.", true); } });
          }catch(e){ try{ overlay(false); pasar(el); }catch(e2){} } }
          function compararRostros(docEl, selfEl){ try{
          var f=window.faceapi;
          if(!f || !f.nets || !f.nets.faceRecognitionNet || !f.nets.faceRecognitionNet.isLoaded){ return null; }
          var det=null;
          try{ if(f.nets.tinyFaceDetector && f.nets.tinyFaceDetector.isLoaded){ det=new f.TinyFaceDetectorOptions({inputSize:320, scoreThreshold:0.4}); } }catch(e){}
          try{ if(!det && f.nets.ssdMobilenetv1 && f.nets.ssdMobilenetv1.isLoaded){ det=new f.SsdMobilenetv1Options({minConfidence:0.4}); } }catch(e){}
          if(!det){ return null; }
          var cD=aCanvas(docEl,640), cS=aCanvas(selfEl,640);
          if(!cD || !cS){ return null; }
          var pD=f.detectSingleFace(cD,det).withFaceDescriptor();
          var pS=f.detectSingleFace(cS,det).withFaceDescriptor();
          return Promise.all([pD,pS]).then(function(rs){ try{
          if(!rs || !rs[0] || !rs[1]){ return null; }
          var d=0, x, i;
          for(i=0;i<rs[0].length;i++){ x=rs[0][i]-rs[1][i]; d+=x*x; }
          d=Math.sqrt(d);
          return d<0.60;
          }catch(e){ return null; } }, function(){ return null; });
          }catch(e){ return null; } }
          function gateBio(ev, el){ try{
          var r=null;
          try{ r=compararRostros(mediaEn("ps2")||mediaEn("ps3"), mediaEn("ps4")); }catch(e){ r=null; }
          if(r===null || r===undefined){ banner("Aviso: no se pudo verificar el rostro automáticamente en este dispositivo.", false); return; }
          bloquear(ev);
          overlay(true, "Verificando rostro...");
          Promise.resolve(r).then(function(res){ try{
          overlay(false);
          if(res===true){ pasar(el); return; }
          if(res===false){ banner("El rostro de la selfie NO coincide con el rostro del documento. Tome una nueva selfie.", true); return; }
          banner("No se pudo comparar los rostros. Intente de nuevo.", false);
          }catch(e){ try{ overlay(false); }catch(e2){} }
          }, function(){ try{ overlay(false); banner("No se pudo comparar los rostros. Intente de nuevo.", false); }catch(e){} });
          }catch(e){} }
          D.addEventListener("click", function(ev){ try{
          if(ev && ev.isTrusted===false){ return; }
          var tg=ev && ev.target ? ev.target : null;
          if(tg && tg.__zV5){ tg.__zV5=0; return; }
          var el4=buscarBoton("bIr4"), el5=buscarBoton("bIr5");
          function deBoton(el){ try{ return !!(el && tg && (tg===el || (tg.closest && el.id && tg.closest("#"+el.id)===el))); }catch(e){ return false; } }
          if(deBoton(el4)){ gateDoc(ev, el4); }
          else if(deBoton(el5)){ gateBio(ev, el5); }
          }catch(e){} }, true);
          try{
          if(typeof window.fetch==="function" && !window.__zFchV5){ window.__zFchV5=true;
          var _f=window.fetch;
          window.fetch=function(){ var a=arguments;
          return _f.apply(window,a).then(function(r){ try{
          if(r && (r.status===413 || r.status===500 || r.status===502 || r.status===503)){
          banner("El servidor no respondió bien ("+r.status+"). Espere unos segundos y vuelva a intentarlo.", true); }
          }catch(e){} return r; },
          function(err){ try{ banner("Error de red. Verifique su conexión e intente de nuevo.", true); }catch(e){} throw err; }); };
          }
          }catch(e){}
          }catch(e){ try{ window.__zyraV5=false; }catch(e2){} }
          })();
          /*ZYRA-V5-IIFE-END*/"""

          suma("")
          suma("### 0) Nota de esta version")
          suma("- La corrida #944 inyecto codigo que rompio el JavaScript combinado de la pagina: por eso ningun boton respondia.")
          suma("- La corrida #947 restauro su pagina (paso 1, publicado) y rechazo el parche: el CSS multilinea rompia el Python en la zona del estilo. En v5.1 el CSS va dentro del JavaScript: UN solo punto de insercion, ya probado en #944 y #947.")
          suma("- Esta version restaura primero la pagina estable (paso 1, ya publicado) y aplica los gates v5 con validacion NUEVA que revisa el JS COMBINADO completo (habria detectado el fallo de la v4).")
          suma("- Si alguna validacion falla, NO se publica el parche y su pagina queda funcionando en el estado estable.")

          def bloques(t):
              return [m.group(1) for m in re.finditer(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", t, re.S | re.I)]

          def node_check(cod):
              fd, p = tempfile.mkstemp(suffix=".js")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(cod)
                  r = subprocess.run(["node", "--check", p], capture_output=True, text=True, timeout=60)
                  return (r.returncode == 0), ((r.stderr or "") + (r.stdout or "")).strip()
              except Exception as e:
                  return False, str(e)
              finally:
                  try:
                      os.unlink(p)
                  except Exception:
                      pass

          suma("")
          suma("### 1) Diagnostico de la version rota (#944)")
          try:
              r = subprocess.run(["git", "show", "f785b49:" + RUTA], capture_output=True, text=True)
              if r.returncode == 0:
                  roto = r.stdout
                  fallas = 0
                  for i, cod in enumerate(bloques(roto)):
                      okB, eB = node_check(cod)
                      if not okB:
                          fallas += 1
                          primera = (eB.splitlines() or ["(sin detalle)"])[0][:220]
                          suma("- Bloque script " + str(i + 1) + ": ERROR de sintaxis JS -> " + primera)
                  if fallas == 0:
                      suma("- Ningun bloque falla el chequeo de sintaxis: el fallo de la v4 fue de EJECUCION (codigo sembrado en medio del flujo). El rollback del paso 1 lo elimina; la v5 siembra un unico bloque al final con fail-open de emergencia.")
              else:
                  suma("- No se pudo leer la version rota; se omite el diagnostico detallado.")
          except Exception as e:
              suma("- Diagnostico omitido: " + str(e)[:200])

          suma("")
          suma("### 2) Parches v5 aplicados")
          def limpiar_v5(x):
              x = re.sub(r"/\*ZYRA-V5-IIFE-BEGIN\*/.*?/\*ZYRA-V5-IIFE-END\*/\n?", "", x, flags=re.S)
              x = re.sub(r"/\*ZYRA-V5-CSS-BEGIN\*/.*?/\*ZYRA-V5-CSS-END\*/\n?", "", x, flags=re.S)
              return x
          base_limpio = limpiar_v5(base)
          t = base_limpio

          if "bIr4" not in t:
              rechazo("no se encontro bIr4 en superapp.py")
          if "bIr5" not in t:
              rechazo("no se encontro bIr5 en superapp.py")

          idx = t.rfind("bIr4")
          fin = t.find("</script>", idx) if idx != -1 else -1
          if idx == -1 or fin == -1:
              rechazo("no se encontro el bloque script principal (bIr4 + cierre de script)")
          else:
              cierre_prev = t.rfind("</script>", 0, fin)
              apertura = t.rfind("<script", 0, fin)
              if apertura == -1 or apertura < cierre_prev:
                  rechazo("el punto de insercion de la IIFE no queda dentro de un bloque script")
              else:
                  t = t[:fin] + IIFE + "\n" + t[fin:]
                  suma("- P-A IIFE v5.1 (gate de nombre 60% + gate de tipo de documento + gate biometrico 0.60 + CSS compacto en vivo + avisos de servidor) insertada en UN unico punto: al final del bloque principal del registro.")
                  suma("- P-B CSS compacto inyectado desde el propio JavaScript (video e imagen limitados; lienzos, guias y marcos intactos).")

          if limpiar_v5(t) != base_limpio:
              rechazo("conservacion fallida: hay cambios que no son inserciones marcadas v5")

          if base_limpio.count("docVencido") != t.count("docVencido"):
              rechazo("docVencido cambio de numero de apariciones")
          else:
              suma("- docVencido intacto: OK (" + str(base_limpio.count("docVencido")) + " apariciones, sin cambios).")

          agregadas = len(t.splitlines()) - len(base_limpio.splitlines())
          suma("- Lineas agregadas: " + str(max(0, agregadas)) + " / eliminadas: 0 (solo inserciones marcadas).")

          with open(RUTA, "w", encoding="utf-8") as f:
              f.write(t)

          suma("")
          suma("### 3) Validaciones")
          try:
              py_compile.compile(RUTA, cfile=os.path.join(Z, "chk.pyc"), doraise=True)
              suma("- Sintaxis Python (py_compile): OK")
          except Exception as e:
              rechazo("py_compile fallo: " + str(e)[:300])

          B = bloques(base_limpio)
          P = bloques(t)
          suma("- Bloques script: estable=" + str(len(B)) + " parchado=" + str(len(P)))
          if len(B) != len(P):
              rechazo("el numero de bloques script cambio")
          else:
              regre = 0
              for i in range(len(B)):
                  okB, _eB = node_check(B[i])
                  okP, eP = node_check(P[i])
                  if okB and not okP:
                      regre += 1
                      primera = (eP.splitlines() or ["(sin detalle)"])[0][:220]
                      rechazo("el bloque script " + str(i + 1) + " quedo roto tras el parche: " + primera)
              if regre == 0:
                  suma("- node --check diferencial del JS COMBINADO completo: sin regresiones OK (este chequeo habria detectado el fallo de la v4).")

          for mk in ["/*ZYRA-V5-IIFE-BEGIN*/", "/*ZYRA-V5-IIFE-END*/"]:
              n = t.count(mk)
              if n != 1:
                  rechazo("marcador " + mk + " aparece " + str(n) + " veces (debe ser 1)")
          if not any("marcador" in r for r in rechazos):
              suma("- Marcadores v5 unicos: OK")

          mI = re.search(r"/\*ZYRA-V5-IIFE-BEGIN\*/(.*?)/\*ZYRA-V5-IIFE-END\*/", t, re.S)
          if mI and "</script" in mI.group(1).lower():
              rechazo("la IIFE contiene la secuencia de cierre de script")

          STUBS = "var window={}; var document={};\n"
          TESTS = r'''
          function aser(cond, msg){ if(!cond){ console.error("FALLA: " + msg); process.exit(1); } }
          aser(simNombres("ALFON SZELAYA","ALFON SZELAYA") >= 0.9, "nombre identico pasa");
          aser(simNombres("jose pacheco","SALINAS PADILLA") < 0.6, "caso real Jose pacheco vs SALINAS PADILLA bloquea");
          aser(simNombres("jose antonio salinas padilla","SALINAS PADILLA JOSE ANTONIO") >= 0.6, "nombre completo del doc pasa");
          aser(simNombres("ALFON SZELAYA","ALFON SZELEYA LOPEZ") >= 0.6, "tolerancia a error OCR de 1 letra");
          aser(levd("SZELAYA","SZELEYA") === 1, "levd basico");
          aser(familiaDoc("LICENCIA DE CONDUCIR CALIFORNIA DRIVER LICENSE") === "licencia", "familia licencia");
          aser(familiaDoc("DOCUMENTO UNICO DE IDENTIDAD EL SALVADOR") === "dui", "familia dui");
          aser(familiaDoc("CALIFORNIA DRIVER LICENSE") !== "dui", "licencia CA no es dui");
          aser(familiaTipo("DUI El Salvador (2 lados)") === "dui", "tipo dui seleccionado");
          aser(familiaTipo("Licencia de conducir") === "licencia", "tipo licencia seleccionado");
          aser(familiaDoc("CALIFORNIA DRIVER LICENSE") !== familiaTipo("DUI El Salvador (2 lados)"), "licencia CA con DUI seleccionado se detecta como distinto");
          console.log("PRUEBAS JS OK (11)");
          '''
          if mI:
              ck = re.search(r"/\*ZTEST-BEGIN\*/(.*?)/\*ZTEST-END\*/", mI.group(1), re.S)
              if ck:
                  ptest = os.path.join(Z, "pruebas_v5.js")
                  with open(ptest, "w", encoding="utf-8") as f:
                      f.write(STUBS + "\n" + ck.group(1) + "\n" + TESTS + "\n")
                  r = subprocess.run(["node", ptest], capture_output=True, text=True, timeout=60)
                  if r.returncode == 0:
                      ultima = (r.stdout.strip().splitlines() or ["OK"])[-1]
                      suma("- Pruebas JS de gates con casos reales: OK (" + ultima + ")")
                  else:
                      rechazo("pruebas JS fallaron: " + ((r.stderr or r.stdout).strip()[:300]))
              else:
                  rechazo("no se encontro la seccion ZTEST dentro de la IIFE")

          suma("")
          suma("### 4) Estructura detectada (auditoria)")
          try:
              ids_vistos = []
              for m in re.finditer(r"<(?:button|input|select|canvas|video|img|a|div|section|form)\b[^>]*>", base):
                  mi = re.search(r"\bid=[\"']([A-Za-z0-9_\-]+)[\"']", m.group(0))
                  if mi and mi.group(1) not in ids_vistos:
                      ids_vistos.append(mi.group(1))
              gbi = sorted(set(re.findall(r"getElementById\(\s*[\"']([^\"']+)[\"']\s*\)", base)))
              opts = [o.strip() for o in re.findall(r"<option[^>]*>([^<]{0,60})</option>", base)][:10]
              presencia = ["Tesseract", "faceapi", "pdf417", "PDF417", "XMLHttpRequest", "fetch(", "nombreNoCoincide", "bioRechazada", "bioOk", "docVencido"]
              pres = {k: (k in base) for k in presencia}
              with open(os.path.join(Z, "estructura.txt"), "w", encoding="utf-8") as f:
                  f.write("IDs de elementos: " + json.dumps(ids_vistos[:60]) + "\n")
                  f.write("getElementById usados: " + json.dumps(gbi[:60]) + "\n")
                  f.write("Opciones de select: " + json.dumps(opts) + "\n")
                  f.write("Presencia: " + json.dumps(pres) + "\n")
              suma("- IDs de botones y campos detectados: " + ", ".join(ids_vistos[:18]) + (" ..." if len(ids_vistos) > 18 else ""))
              if opts:
                  suma("- Opciones del select de tipo: " + " | ".join(opts))
              else:
                  suma("- Sin opciones de select detectadas")
              suma("- Presentes en la pagina: " + ", ".join(k for k, v in pres.items() if v))
          except Exception as e:
              suma("- Auditoria de estructura omitida: " + str(e)[:200])

          suma("")
          suma("### 5) Pruebas en su telefono (tras el deploy de Render)")
          suma("1. Paso 1 nombre + DUI y Continuar debe avanzar normal (los botones vuelven a funcionar).")
          suma("2. Nombre distinto al documento: al pasar de captura a selfie debe BLOQUEAR con mensaje rojo.")
          suma("3. DUI seleccionado pero licencia capturada: debe BLOQUEAR antes de la selfie.")
          suma("4. Selfie de otra persona: debe BLOQUEAR. Selfie propia: debe pasar a contrasena y crear el ZID.")
          suma("5. La pantalla de captura se ve mas compacta; la guia y el marco no cambian.")
          suma("6. Si el servidor falla (500/502), vera un aviso claro en pantalla.")
          suma("(El warmup anti-502 del arranque se aplica en la siguiente corrida; esta version prioriza restaurar y no romper.)")

          if rechazos:
              with open(os.path.join(Z, "RECHAZO"), "w", encoding="utf-8") as f:
                  f.write("\n".join(rechazos))
          PYEOF

      - name: Paso 3 - Veredicto y commit condicional
        run: |
          if [ -f _zyra/RECHAZO ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Veredicto final - RECHAZADO (RC=2). NO se publica el parche v5. Su pagina queda en el estado estable restaurado del paso 1." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          RUTA=$(cat _zyra/ruta.txt 2>/dev/null || echo "superapp.py")
          git add "$RUTA"
          if git diff --cached --quiet; then
            echo "## Veredicto final - sin cambios que publicar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "ZYRA-FIX v5 - gates de nombre, tipo y biometria validados + CSS compacto"
          git push origin HEAD
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Veredicto final - APROBADO (RC=0). Commit y push realizados." >> "$GITHUB_STEP_SUMMARY"

      - name: Artefacto informes y diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra-fix-v5-informe
          path: _zyra
