name: "FASE B tramo 1 v3: _risk_routes construido con AST (parse del bloque envuelto en try/def temporal + unparse — indentacion garantizada por Python)"
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pytest pytest-timeout cryptography > /tmp/pip.log 2>&1
          python3 -c "import pytest, cryptography; print('deps OK')" || { cat /tmp/pip.log; exit 1; }
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt > /tmp/req.log 2>&1 || cat /tmp/req.log
          fi

      - name: "[FASE B-1] _risk_routes via AST (envolver bloque en def temporal + unparse + indent)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")

          try:
              SP = pathlib.Path("apps/agro/server.py")
              src = SP.read_text(encoding="utf-8")
              pathlib.Path("apps/agro/server_backup_b1.py") \
                  .write_text(src, encoding="utf-8")

              i_start = src.find(
                  '        if s == ["risk", "climate"]:')
              i_end = src.find(
                  '        if s == ["sale", "publish"]:')
              assert i_start != -1, "inicio no hallado"
              assert i_end != -1, "fin no hallado"
              i_end = src.rfind("\n", 0, i_end) + 1
              block = src[i_start:i_end]
              out("- bloque RIESGO: "
                  + str(len(block.splitlines())) + " lineas")

              # TRUCO DEFINITIVO: envolver el bloque en un
              # def temporal CON LA INDENTACION EXACTA QUE
              # YA TIENE (8 espacios), ast.parse lo valida
              # tal cual, luego ast.unparse lo re-imprime
              # a columna 0 limpio
              wrapper = ("def _tmp(s, is_json, actor):\n"
                         + block
                         + "    return False\n")
              tree = ast.parse(wrapper)
              fn_node = tree.body[0]
              assert isinstance(fn_node, ast.FunctionDef)
              # re-imprimir LIMPIO a columna 0
              clean = ast.unparse(fn_node)
              # verificar que compila limpio
              ast.parse(clean)
              out("- bloque limpiado via ast.unparse ("
                  + str(len(clean.splitlines())) + " lineas)")

              # extraer SOLO el cuerpo del metodo limpio
              # (sin la linea def, con indent 4 para el mixin)
              body_lines = clean.splitlines()[1:]
              method_body = "\n".join(
                  ("    " + ln if ln.strip() else "")
                  for ln in body_lines) + "\n"

              # construir zyra_mixin.py
              mixin = (
                  '"""AGRO Zyra Mixin (CONSOL-3 fase B,'
                  ' regla 77): handlers extraidos del _post'
                  ' via ast.unparse (self.* por herencia)"""\n'
                  'from __future__ import annotations\n'
                  'import json\n\n\n'
                  'class ZyraMixin:\n\n'
                  '    def _risk_routes(self, s, is_json,\n'
                  '                        _ZV6_ACTOR):\n'
                  '        """Bloque RIESGO del _post original:'
                  ' rutas risk/alert/response/network.\n'
                  '        Devuelve True si atendio la'
                  ' ruta."""\n'
                  + method_body
                  + "        return False\n")
              ast.parse(mixin)
              zm = pathlib.Path(
                  "apps/agro/routers/zyra_mixin.py")
              zm.write_text(mixin, encoding="utf-8")
              py_compile.compile(str(zm), doraise=True)
              out("- **zyra_mixin.py OK (compila)**")

              # herencia: localizar y modificar la clase
              tree2 = ast.parse(src)
              cls2 = None
              for node in tree2.body:
                  if isinstance(node, ast.ClassDef) and \
                          node.name == "AgroApiHandler":
                      cls2 = node
                      break
              assert cls2 is not None
              lines2 = src.splitlines(keepends=True)
              l0 = cls2.lineno - 1
              # buscar cierre "):" de la clase multilinea
              close = None
              for j in range(cls2.lineno,
                             min(cls2.lineno + 10,
                                 len(lines2))):
                  if lines2[j].strip() == "):":
                      close = j
                      break
              new_cls = ("class AgroApiHandler(ZyraMixin,"
                         " BaseHTTPRequestHandler):\n")
              if close is not None:
                  src2 = ("".join(lines2[:l0])
                          + new_cls
                          + "".join(lines2[close+1:]))
              else:
                  src2 = src.replace(
                      "class AgroApiHandler(",
                      "class AgroApiHandler(ZyraMixin,", 1)
              ast.parse(src2)

              # delegacion: reemplazar el bloque RIESGO
              i_s2 = src2.find(
                  '        if s == ["risk", "climate"]:')
              i_e2 = src2.find(
                  '        if s == ["sale", "publish"]:')
              assert i_s2 != -1 and i_e2 != -1
              i_e2 = src2.rfind("\n", 0, i_e2) + 1
              deleg = ('        if self._risk_routes(\n'
                       '                s, is_json,\n'
                       '                _ZV6_ACTOR):\n'
                       '            return\n')
              src2 = (src2[:i_s2] + deleg + src2[i_e2:])
              ast.parse(src2)
              SP.write_text(src2, encoding="utf-8")
              py_compile.compile(str(SP), doraise=True)
              out("- **server.py: bloque RIESGO ->"
                  " delegacion | total: "
                  + str(len(src2.splitlines()))
                  + " lineas (de 2811)**")

              import subprocess
              env = dict(os.environ)
              env["PYTHONPATH"] = (os.getcwd() + ":"
                                   + os.getcwd()
                                   + "/shared_engines")
              r = subprocess.run(
                  ["python3", "-m", "pytest",
                   "apps/agro/tests", "-q", "-x",
                   "--timeout=45",
                   "--timeout-method=thread",
                   "--tb=line", "-k", "risk"],
                  capture_output=True, text=True,
                  env=env, timeout=300)
              if r.returncode != 0:
                  raise RuntimeError(
                      "tests riesgo fallaron:"
                      + r.stdout[-600:])
              out("- tests de riesgo: OK")
              with open("/tmp/consol3b1", "w") as f:
                  f.write("OK")
          except SystemExit:
              raise
          except Exception:
              out("## CRASHEO — revert automatico")
              os.system("git checkout -- apps/agro/server.py"
                        " 2>/dev/null")
              os.system("rm -f apps/agro/routers/zyra_mixin.py"
                        " apps/agro/server_backup_b1.py"
                        " 2>/dev/null")
              out("- restaurado")
              out("```\n" + traceback.format_exc().strip()
                  + "\n```")
              with open("/tmp/consol3b1", "w") as f:
                  f.write("FAIL")
              raise SystemExit(1)
          exit(0)
          PYEOF

      - name: "[LECTURA] regresion AGRO completa"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          set +e
          SUM="$GITHUB_STEP_SUMMARY"
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          timeout 300 python3 -m pytest apps/agro/tests -q --timeout=45 --timeout-method=thread --tb=short > /tmp/x3.out 2>&1
          echo $? > /tmp/x3
          code=$(cat /tmp/x3 2>/dev/null || echo 1)
          passed=$(grep -oE "[0-9]+ passed" /tmp/x3.out 2>/dev/null | tail -1)
          if [ "$code" = "0" ]; then
            echo "- REG agro: ✅ ($passed) — tramo 1 VALIDADO" >> "$SUM"
          else
            echo "- REG agro: ❌ ($passed)" >> "$SUM"
            { echo "### fallos"; echo '```'; tail -50 /tmp/x3.out; echo '```'; } >> "$SUM"
            cp apps/agro/server_backup_b1.py apps/agro/server.py 2>/dev/null
            git checkout -- apps/agro/routers/zyra_mixin.py 2>/dev/null
            echo "- REVERT: restaurado" >> "$SUM"
            echo "FAIL" > /tmp/consol3b1
          fi
          exit 0

      - name: "[ENTREGA] commit solo si AGRO verde"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          log() { echo "$1" >> "$SUM"; echo "$1"; }
          if [ "$(cat /tmp/consol3b1 2>/dev/null || echo FAIL)" != "OK" ] || [ "$(cat /tmp/x3 2>/dev/null || echo 1)" != "0" ]; then
            log "**FASE B tramo 1 BLOQUEADA — revert aplicado**"
            exit 1
          fi
          find apps -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          rm -rf .pytest_cache || true
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/agro
          set +e
          if git diff --cached --quiet; then
            log "**FASE B tramo 1: SIN CAMBIOS**"; exit 0
          fi
          git commit -m "refactor(CONSOL-3 fase B tramo 1, regla 77): bloque RIESGO del _post (144 lineas: risk climate/productive/impact/recovery + alert resolve + response create/update) extraido a ZyraMixin._risk_routes via AST (envolver en def temporal + ast.unparse = indentacion garantizada por Python) + AgroApiHandler hereda de ZyraMixin + delegacion de 3 lineas + tests de riesgo del dueno OK + regresion AGRO verde"
          [ $? -ne 0 ] && { log "**COMMIT FALLO**"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main" > /tmp/qa.out 2> /tmp/qa.err || git push origin "HEAD:main" > /tmp/qc.out 2> /tmp/qd.err
          log "**FASE B tramo 1 OK. Tramo 2 siguiente (ventas/comercio).**"
          exit 0
