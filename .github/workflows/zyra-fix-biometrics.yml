name: "ZYRA NEXO NG10 menus de modulos + registry + router (fix menu_id)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] NG10 menus + registry + router"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, pathlib, py_compile, textwrap, traceback
          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- " + p.name + " (" + str(p.parent.name)
                      + "): OK")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          MENUS = {
            "accounting/menu.py": ("accounting", "Contabilidad", "Resumen contable|Libro diario|Libro mayor|Balances|Cierres"),
