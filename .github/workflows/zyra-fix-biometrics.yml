            "clients/menu.py": ("clients", "Clientes", "Empresas|Personas|Relaciones|Segmentacion"),
            "clients/empresas/menu.py": ("clients", "Empresas", "Registro|Perfil|Documentos|Historial|Verificacion"),
            "clients/empresas/documentos/menu.py": ("clients", "Documentos de Empresa", "Consultar|Registrar"),
            "clients/empresas/historial/menu.py": ("clients", "Historial de Empresa", "Consultar historial"),
