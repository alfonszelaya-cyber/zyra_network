# ZYRA-FIX v6 revB - registro ZID (orden de pasos obligatorio)
# Paso 1 - verifica que superapp.py base compile (lo repara desde el historial si no)
# Paso 2 - aplica el parche v6 revB CODIFICADO (base64 en UNA linea + sha256) en un unico punto y valida TODO antes de publicar
# Paso 3 - commit solo si TODO pasa; si algo falla, no se publica nada
name: zyra-fix-biometrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paso 1 - Verificar base estable de superapp.py
        run: |
          set -e
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          rm -rf __pycache__
          BASE_OK=0
          if python3 -m py_compile superapp.py 2>/dev/null; then
            BASE_OK=1
            echo "- superapp.py actual compila (estado estable confirmado)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- superapp.py NO compila; restaurando desde el historial..." >> "$GITHUB_STEP_SUMMARY"
            git checkout HEAD -- superapp.py 2>/dev/null || true
            if python3 -m py_compile superapp.py 2>/dev/null; then
              BASE_OK=1
              echo "- restaurado desde HEAD: OK" >> "$GITHUB_STEP_SUMMARY"
            else
              i=1
              while [ $i -le 12 ] && [ $BASE_OK -eq 0 ]; do
                if git checkout "HEAD~$i" -- superapp.py 2>/dev/null; then
                  if python3 -m py_compile superapp.py 2>/dev/null; then
                    BASE_OK=1
                    echo "- restaurado desde HEAD~$i: OK" >> "$GITHUB_STEP_SUMMARY"
                  fi
                else
                  break
                fi
                i=$((i+1))
              done
            fi
          fi
          rm -rf __pycache__
          if [ "$BASE_OK" -ne 1 ]; then
            echo "## Veredicto - BASE IRREPARABLE (RC=3). Se requiere revision manual." >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
          if ! git diff --quiet -- superapp.py; then
            git add superapp.py
            git commit -m "ZYRA-FIX v6 revB punto 1 - restaurar superapp.py estable y verificable"
            git push origin HEAD
            echo "- superapp.py restaurado y PUBLICADO. La pagina funciona aunque todo lo demas falle." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Lista base: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Paso 2 - Aplicar parche v6 revB y validar
        env:
          NUCLEO_B64_A: 
          NUCLEO_B64_B: 
          NUCLEO_B64_C: 
          NUCLEO_B64_D: 
        run: |
          mkdir -p _zyra
          python3 <<'PYEOF'
          # -*- coding: utf-8 -*-
          # ZYRA-FIX v6 revB - parche del registro ZID (orden de pasos obligatorio + gates + anti-502)
          # Cambios revB sobre la corrida #950:
          #   (a) Causa raiz de #950: el nucleo viajaba partido en 362 lineas con comillas y el pegado
          #       desde el telefono corrompio una comilla -> atob() produjo JS con ""style".
          #       revB: el nucleo viaja en 4 PARTES base64 (variables de entorno, sin comillas internas),
          #       cada parte validada por separado y las 4 juntas verificadas con sha256 ANTES de tocar
          #       nada. Si el pegado llega corrupto, el rechazo es limpio e inmediato e indica la parte.
          #   (b) Todo RECHAZO corta de inmediato (en #950 siguio validando y confundio el resumen
          #       con "marcadores v6 no son unicos (ini=0, fin=0)" que era solo consecuencia).
          #   (c) El fragmento insertado NO tiene llaves {}: no puede romper f-strings ni .format()
          #       en runtime (py_compile no detecta eso; causa latente desde #947).
          #   (d) La insercion se prefiere dentro de cadenas triple-quoted de la plantilla HTML;
          #       cada candidato se valida con py_compile ANTES de aceptarse.
          import os, re, io, sys, json, base64, hashlib, subprocess, tempfile, tokenize, py_compile

          SHA_ESPERADO = "d76c95ddc3fbce5e7a54ef1285224dc9120dab45c8d365683fff3f5c761a9c55"
          MARCA_INI = "/*ZYRA-V6-BEGIN*/"
          MARCA_FIN = "/*ZYRA-V6-END*/"
          MIN_PRUEBAS = 35

          STUBS = "var window={}; var document={};\n"

          TESTS = r'''var TOTAL = 0;
          function aser(cond, msg){ TOTAL++; if(!cond){ console.error("FALLA: " + msg); process.exit(1); } }
          function vec128(delta){ var a = [], i; for(i = 0; i < 128; i++){ a.push(0.01 + (delta || 0)); } return a; }

          /* 1. normalizacion */
          aser(norm("Jose PACHECO") === "JOSE PACHECO", "norm basico");
          aser(norm("Jos\u00e9 P\u00c9REZ-L\u00f3pez") === "JOSE PEREZ LOPEZ", "norm acentos y signos");

          /* 2. levenshtein */
          aser(levd("SZELAYA","SZELEYA") === 1, "levd basico");

          /* 3. similitud de nombres */
          aser(simNombres("ALFON SZELAYA","ALFON SZELAYA") >= 0.9, "nombre identico pasa");
          aser(simNombres("jose pacheco","SALINAS PADILLA") < 0.6, "caso real Jose pacheco vs SALINAS PADILLA bloquea");
          aser(simNombres("jose antonio salinas padilla","SALINAS PADILLA JOSE ANTONIO") >= 0.6, "nombre completo del doc pasa sin importar orden");
          aser(simNombres("ALFON SZELAYA","ALFON SZELEYA LOPEZ") >= 0.6, "tolerancia a error OCR de 1 letra");

          /* 4. REGRESION v5: el OCR completo tiene muchos tokens; la fraccion se calcula sobre el NOMBRE del usuario */
          aser(simNombres("MARIA SALINAS PADILLA","CALIFORNIA DRIVER LICENSE\nLN 12-3456789\nSALINAS PADILLA\nFN MARIA ISABEL\nDOB 08/15/1990\n1234 MAIN ST\nLOS ANGELES CA 90001\nDL 12-3456789\nISS 03-10-2024 EXP 03-10-2028") >= 0.6, "nombre correcto contra OCR largo del documento pasa");
          aser(simNombres("MARIA SALINAS","CALIFORNIA DRIVER LICENSE\nLN 12-3456789\nSALINAS PADILLA\nFN MARIA ISABEL\n1234 MAIN ST\nLOS ANGELES CA 90001") >= 0.6, "nombre parcial correcto contra OCR largo tambien pasa");
          aser(simNombres("JOSE PACHECO","CALIFORNIA DRIVER LICENSE\nLN 12-3456789\nSALINAS PADILLA\nFN MARIA ISABEL\nLOS ANGELES CA") < 0.6, "nombre ajeno contra OCR largo sigue bloqueando");

          /* 5. familia del documento (OCR) */
          aser(familiaDoc("DOCUMENTO UNICO DE IDENTIDAD EL SALVADOR") === "dui", "familia dui");
          aser(familiaDoc("CALIFORNIA DRIVER LICENSE DMV") === "licencia", "familia licencia");
          aser(familiaDoc("CALIFORNIA DRIVER LICENSE") !== "dui", "licencia CA no es dui");
          aser(familiaDoc("PASAPORTE DE MEXICO PASSPORT MX") === "pasaporte", "familia pasaporte");
          aser(familiaDoc("EMPLOYMENT AUTHORIZATION DOCUMENT USA") === "id_usa", "familia EAD");
          aser(familiaDoc("") === "", "OCR vacio sin familia");
          /* 5b. REGRESION revB: licencia salvadorena NO se detecta como DUI (dice EL SALVADOR + IDENTIDAD) */
          aser(familiaDoc("REPUBLICA DE EL SALVADOR LICENCIA DE CONDUCIR DUI 12345678-9 NUMERO DE IDENTIDAD CATEGORIA LIVIANA") === "licencia", "licencia salvadorena no se confunde con dui");
          aser(familiaDoc("CALIFORNIA IDENTIFICATION CARD DMV 1234 MAIN ST") === "id_usa", "ID de estado CA no se confunde con licencia");
          aser(familiaDoc("STATE OF CALIFORNIA DRIVER LICENSE DL 12345678 LN SALINAS FN MARIA") === "licencia", "OCR real de licencia CA da licencia");
          aser(familiaDoc("PASAPORTE DE EL SALVADOR PASSPORT") === "pasaporte", "pasaporte salvadoreno no se confunde con dui");

          /* 6. familia del tipo seleccionado (incluye el arreglo EAD y Permiso de v5) */
          aser(familiaTipo("DUI El Salvador (2 lados)") === "dui", "tipo dui seleccionado");
          aser(familiaTipo("Pasaporte (1 lado)") === "pasaporte", "tipo pasaporte seleccionado");
          aser(familiaTipo("Licencia de conducir (2 lados)") === "licencia", "tipo licencia seleccionado");
          aser(familiaTipo("ID de estado / EAD USA (2 lados)") === "id_usa", "tipo EAD USA ahora se mapea (v5 devolvia vacio)");
          aser(familiaTipo("Permiso legal / otro documento") === "otro", "tipo Permiso legal ahora se mapea (v5 devolvia vacio)");

          /* 7. gate de tipo de documento: el bug reportado (DUI seleccionado, licencia capturada) */
          aser(tipoDistinto("licencia","dui") === true, "DUI seleccionado + licencia capturada se detecta como distinto");
          aser(tipoDistinto("dui","dui") === false, "mismo tipo pasa");
          aser(tipoDistinto("licencia","otro") === false, "Permiso legal/otro no bloquea ningun documento");
          aser(tipoDistinto("","dui") === false, "sin familia OCR no bloquea (fail-open)");

          /* 8. biometria */
          aser(distEucl(vec128(0), vec128(0)) === 0, "distancia de vectores iguales es 0");
          aser(levd("AB","ABCD") === 2, "levd longitudes distintas");
          aser(distEucl(vec128(0), vec128(0.06)) > 0.6, "distancia del caso rechazable mayor al umbral");
          aser(decidirBio(vec128(0), vec128(0.04)).bloquea === false, "rostro similar pasa (dist ~0.45)");
          aser(decidirBio(vec128(0), vec128(0.06)).bloquea === true, "rostro distinto bloquea (dist ~0.68)");
          aser(distEucl(vec128(0), vec128(0).slice(0,64)) === -1, "vectores de longitud distinta dan -1");

          console.log("PRUEBAS JS OK (" + TOTAL + ")");
          '''

          RECHAZOS = []

          def suma(s):
              try:
                  SUM = os.environ.get("GITHUB_STEP_SUMMARY") or os.path.join(os.getcwd(), "_zyra", "resumen.md")
                  d = os.path.dirname(SUM)
                  if d and not os.path.isdir(d):
                      os.makedirs(d, exist_ok=True)
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(s.rstrip() + "\n")
              except Exception:
                  pass

          def decir(s):
              print(s, flush=True)
              suma(s)

          class Rechazo(Exception):
              pass

          def rechazo(m):
              RECHAZOS.append(m)
              decir("- RECHAZO: " + m)
              d = os.path.join(os.getcwd(), "_zyra")
              try:
                  os.makedirs(d, exist_ok=True)
                  with open(os.path.join(d, "RECHAZO"), "w", encoding="utf-8") as f:
                      f.write("\n".join(RECHAZOS))
              except Exception:
                  pass
              raise Rechazo(m)

          def node_check(cod):
              fd, p = tempfile.mkstemp(suffix=".js")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(cod)
                  r = subprocess.run(["node", "--check", p], capture_output=True, text=True, timeout=90)
                  return (r.returncode == 0), ((r.stderr or "") + (r.stdout or "")).strip()
              except Exception as e:
                  return False, str(e)
              finally:
                  try: os.unlink(p)
                  except Exception: pass

          def node_run(p):
              try:
                  r = subprocess.run(["node", p], capture_output=True, text=True, timeout=120)
                  return (r.returncode == 0), ((r.stderr or "") + (r.stdout or "")).strip()
              except Exception as e:
                  return False, str(e)

          def pyok(texto):
              fd, p = tempfile.mkstemp(suffix=".py")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(texto)
                  py_compile.compile(p, cfile=p + "c", doraise=True)
                  return True, ""
              except Exception as e:
                  return False, str(e)
              finally:
                  try: os.unlink(p)
                  except Exception: pass
                  try: os.unlink(p + "c")
                  except Exception: pass

          def limpiar(x):
              x = re.sub(r"<script>\s*/\*\s*ZYRA-V6-BEGIN\s*\*/.*?/\*\s*ZYRA-V6-END\s*\*/\s*</script>\n?", "", x, flags=re.S)
              x = re.sub(r"/\*\s*ZYRA-V6-BEGIN\s*\*/.*?/\*\s*ZYRA-V6-END\s*\*/\n?", "", x, flags=re.S)
              x = re.sub(r"/\*\s*ZYRA-V5-IIFE-BEGIN\s*\*/.*?/\*\s*ZYRA-V5-IIFE-END\s*\*/\n?", "", x, flags=re.S)
              x = re.sub(r"/\*\s*ZYRA-V5-CSS-BEGIN\s*\*/.*?/\*\s*ZYRA-V5-CSS-END\s*\*/\n?", "", x, flags=re.S)
              return x

          def _posicion_umbral(t):
              umbral = -1
              for pat in (r"<html", r"id=[\"']ps1[\"']", r"id=[\"']nombre[\"']"):
                  m = re.search(pat, t, re.I)
                  if m and m.start() > umbral:
                      umbral = m.start()
              return umbral

          def _triple_y_fstrings(t):
              """Devuelve (spans_triple, spans_fstring) en offsets absolutos usando tokenize."""
              offs = [0]
              for ln in t.split("\n"):
                  offs.append(offs[-1] + len(ln) + 1)
              def abso(row, col):
                  return offs[row - 1] + col
              triples = []
              fstr = []
              try:
                  toks = list(tokenize.generate_tokens(io.StringIO(t).readline))
              except Exception:
                  return triples, fstr
              f_ini = None
              for tk in toks:
                  if tk.type == tokenize.STRING:
                      m = re.match(r"[A-Za-z]*", tk.string)
                      pref = m.group(0) if m else ""
                      cuerpo = tk.string[len(pref):]
                      a, b = abso(*tk.start), abso(*tk.end)
                      if "f" in pref.lower() or "F" in pref:
                          fstr.append((a, b))
                      elif cuerpo.startswith(('"""', "'''")):
                          triples.append((a, b))
                  elif tk.type == tokenize.FSTRING_START:
                      f_ini = abso(*tk.start)
                  elif tk.type == tokenize.FSTRING_END:
                      if f_ini is not None:
                          fstr.append((f_ini, abso(*tk.end)))
                      f_ini = None
              return triples, fstr

          def _en_spans(pos, spans):
              for a, b in spans:
                  if a < pos < b:
                      return True
              return False

          def _candidatos(t):
              """Anclas ordenadas por preferencia: dentro de triple-quoted primero."""
              umbral = _posicion_umbral(t)
              triples, fstr = _triple_y_fstrings(t)
              brutas = []
              for tok in ("</body>", "</html>", "</script>"):
                  p = t.rfind(tok)
                  while p > 0:
                      if p > umbral:
                          brutas.append((tok, p))
                          break
                      p = t.rfind(tok, 0, p)
              buenos, otros = [], []
              for tok, p in brutas:
                  if _en_spans(p, fstr):
                      continue
                  (buenos if _en_spans(p, triples) else otros).append((tok, p))
              vistos, salida = set(), []
              for tok, p in buenos + otros:
                  if p not in vistos:
                      vistos.add(p)
                      salida.append((tok, p))
              return salida

          def aplicar(t):
              if MARCA_INI in t or MARCA_FIN in t:
                  rechazo("marcadores v6 preexistentes no eliminados")
              for req in ("bIr4", "bIr5"):
                  if req not in t:
                      rechazo("no se encontro " + req + " en superapp.py (anclas de los gates)")
              if "docVencido" in PAYLOAD:
                  rechazo("el nucleo v6 no debe tocar docVencido")
              for tok in ("nombreNoCoincide", "bioRechazada"):
                  if tok in PAYLOAD:
                      rechazo("el nucleo v6 no debe tocar " + tok)
              errores = []
              for tok, pos in _candidatos(t):
                  for nombre_var, codigo in (
                      ("simple", "eval(atob('" + NUCLEO_B64 + "'))"),
                      ("doble", "eval(atob(\"" + NUCLEO_B64 + "\"))"),
                  ):
                      if tok == "</script>":
                          frag = MARCA_INI + codigo + MARCA_FIN
                      else:
                          frag = "<script>" + MARCA_INI + codigo + MARCA_FIN + "</script>"
                      cand = t[:pos] + frag + t[pos:]
                      okc, msgc = pyok(cand)
                      if okc:
                          return cand, {"ancla": tok, "posicion": pos, "variante": nombre_var, "tam": len(frag)}
                      errores.append(tok + "/" + nombre_var + ": " + (msgc.splitlines() or ["?"])[0][:160])
              rechazo("ningun punto de insercion seguro (py_compile fallo en todas las variantes): " + " | ".join(errores[-3:]))

          def bloque_js(t):
              return [m.group(1) for m in re.finditer(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", t, re.S | re.I)]

          def _pruebas_js():
              m = re.search(r"/\*ZTEST-BEGIN\*/(.*?)/\*ZTEST-END\*/", PAYLOAD, re.S)
              if not m:
                  rechazo("no se encontro la seccion ZTEST en el nucleo v6")
              d = os.path.join(os.getcwd(), "_zyra")
              os.makedirs(d, exist_ok=True)
              ptest = os.path.join(d, "pruebas_v6.js")
              with open(ptest, "w", encoding="utf-8") as f:
                  f.write(STUBS + "\n" + m.group(1) + "\n" + TESTS + "\n")
              okp, sal = node_run(ptest)
              mm = re.search(r"PRUEBAS JS OK \((\d+)\)", sal)
              n = int(mm.group(1)) if mm else 0
              if okp and n >= MIN_PRUEBAS:
                  decir("- Pruebas JS de los gates con casos reales: OK (" + str(n) + "/" + str(n) + ")")
              else:
                  rechazo("pruebas JS fallaron (" + str(n) + " pruebas): " + sal[:300])

          def main():
              decir("")
              decir("ZYRA-FIX v6 revB (orden de pasos obligatorio + gates + anti-502)")
              decir("")
              decir("0) Nota de esta version")
              decir("- Causa del rechazo #950 corregida: el nucleo ya no viaja en 362 lineas con comillas (se corrompian al pegar desde el telefono); ahora viaja en 4 PARTES base64, cada una validada, y las 4 juntas se verifican con sha256.")
              decir("- El nucleo se inserta en UN unico punto, sin llaves {}: no puede romper cadenas ni f-strings de Python. Cada candidato se valida con py_compile antes de aceptarse.")
              decir("- Orden obligatorio: nombre mal -> regresa al Paso 1 y borra las fotos; tipo equivocado -> igual; sin pasos previos no se entra a biometria ni a la clave; rostro distinto al documento no pasa; si el ZID no se crea tras un reintento, el registro se reinicia completo.")

              RUTA = None
              base = None
              base_limpio = None
              try:
                  RUTA = "superapp.py"
                  if not os.path.exists(RUTA):
                      hallado = None
                      for raiz, _dirs, files in os.walk("."):
                          if ".git" in raiz:
                              continue
                          if "superapp.py" in files:
                              hallado = os.path.join(raiz, "superapp.py")
                              break
                      RUTA = hallado
                  if not RUTA:
                      rechazo("no se encontro superapp.py en el repositorio")
                  d = os.path.join(os.getcwd(), "_zyra")
                  os.makedirs(d, exist_ok=True)
                  with open(os.path.join(d, "ruta.txt"), "w", encoding="utf-8") as f:
                      f.write(RUTA)
                  decir("")
                  decir("1) Base")
                  with open(RUTA, encoding="utf-8") as f:
                      base = f.read()
                  base_limpio = limpiar(base)
                  if base_limpio != base:
                      decir("- Se detectaron restos de parches v5/v6 anteriores; se limpiaron antes de aplicar v6 revB.")
                  else:
                      decir("- Sin restos de parches anteriores.")
                  okb, msgb = pyok(base_limpio)
                  if not okb:
                      rechazo("el superapp.py base no compila: " + msgb[:300])
                  decir("- Base estable verificada con py_compile: OK (" + str(len(base_limpio)) + " caracteres)")

                  decir("")
                  decir("2) Integridad y nucleo v6 revB")
                  partes = []
                  for k in ("A", "B", "C", "D"):
                      v = (os.environ.get("NUCLEO_B64_" + k) or "").strip()
                      if not v or not re.fullmatch(r"[A-Za-z0-9+/=]+", v) or len(v) % 4 != 0:
                          rechazo("la parte " + k + " del nucleo no llego integra (base64 invalido). Copie el YAML COMPLETO, reemplazando todo el contenido del archivo.")
                      partes.append(v)
                  b64 = "".join(partes)
                  if len(b64) < 200:
                      rechazo("el nucleo llego incompleto (menos de 200 caracteres base64)")
                  sha = hashlib.sha256(b64.encode("ascii")).hexdigest()
                  if SHA_ESPERADO and sha != SHA_ESPERADO:
                      rechazo("el nucleo no llego integro (sha256 no coincide: " + sha[:16] + "...). Copie el YAML COMPLETO, reemplazando todo el contenido del archivo.")
                  decir("- Integridad del nucleo (sha256 + 4 partes base64 validadas una por una): OK")
                  try:
                      PAYLOAD_B64 = b64
                      globals()["PAYLOAD"] = base64.b64decode(PAYLOAD_B64, validate=True).decode("utf-8")
                      globals()["NUCLEO_B64"] = b64
                  except Exception as e:
                      rechazo("el nucleo no se pudo decodificar: " + str(e)[:200])
                  if not PAYLOAD or "nombreCoincide" not in PAYLOAD and "simNombres" not in PAYLOAD:
                      rechazo("el nucleo decodificado esta vacio o incompleto")
                  noascii = sum(1 for ch in PAYLOAD if ord(ch) > 127)
                  if noascii:
                      rechazo("el nucleo decodificado tiene " + str(noascii) + " bytes no-ASCII (corrupcion)")
                  okn, msgn = node_check(PAYLOAD)
                  if not okn:
                      rechazo("el nucleo v6 tiene errores de sintaxis: " + msgn[:300])
                  decir("- Sintaxis del nucleo (node --check del decodificado): OK (" + str(len(PAYLOAD)) + " caracteres)")

                  decir("")
                  decir("3) Insercion y validaciones")
                  t, info = aplicar(base_limpio)
                  decir("- Insercion UNICA del bloque codificado: ancla " + info["ancla"] + " | variante de comillas: " + info["variante"] + " | tamano: " + str(info["tam"]) + " caracteres")
                  decir("- CSS compacto de captura via JavaScript (contenedor 520px, media max 58vh); guia y marco del documento intactos.")
                  decir("- Gates: nombre vs documento (60%), tipo de documento (incluye EAD USA y Permiso legal), biometria facial (distancia 0.60), orden de pasos obligatorio con regreso automatico al Paso 1, avisos 500/502/503/413, 1 reintento en clave y warmup anti-502.")

                  if limpiar(t) != base_limpio:
                      rechazo("conservacion fallida: hay cambios que no son el bloque marcado v6")
                  if base_limpio.count("docVencido") != t.count("docVencido"):
                      rechazo("docVencido cambio de numero de apariciones")
                  else:
                      decir("- docVencido intacto: OK (" + str(base_limpio.count("docVencido")) + " apariciones, sin cambios)")
                  vivos = [k for k in ("bIr4", "bIr5", "bAbrirF", "bCapF", "galF", "tipoDoc", "ps1", "ps2", "ps3") if base_limpio.count(k) != t.count(k)]
                  if vivos:
                      rechazo("la insercion altero elementos de la pagina: " + ", ".join(vivos))
                  decir("- Botones y campos vivos (bIr4, bIr5, bAbrirF, bCapF, galF, tipoDoc): OK")

                  decir("- Fragmento de " + str(info["tam"]) + " caracteres insertado en una sola pieza frente al ancla " + info["ancla"] + "; el resto del archivo queda byte a byte identico (conservacion verificada).")

                  okf, msgf = pyok(t)
                  if not okf:
                      rechazo("py_compile fallo tras el parche: " + msgf[:300])
                  decir("- Sintaxis Python (py_compile) del archivo parchado: OK")

                  B = bloque_js(base_limpio)
                  P = bloque_js(t)
                  decir("- Bloques script: estable=" + str(len(B)) + " parchado=" + str(len(P)))
                  if len(P) < len(B):
                      rechazo("la cantidad de bloques script disminuyo")
                  regre = 0
                  for i in range(len(B)):
                      okB, _eB = node_check(B[i])
                      okP, eP = node_check(P[i])
                      if okB and not okP:
                          regre += 1
                          primera = (eP.splitlines() or ["(sin detalle)"])[0][:220]
                          rechazo("el bloque script " + str(i + 1) + " quedo roto tras el parche: " + primera)
                  extra = P[len(B):] if len(P) > len(B) else []
                  for j, ex in enumerate(extra):
                      okE, eE = node_check(ex)
                      if not okE:
                          regre += 1
                          rechazo("el bloque nuevo " + str(j + 1) + " no compila: " + (eE.splitlines() or ["?"])[0][:200])
                  if regre == 0:
                      decir("- node --check diferencial de TODOS los bloques (incluido el nuevo): sin regresiones OK")

                  n_ini = t.count(MARCA_INI)
                  n_fin = t.count(MARCA_FIN)
                  if n_ini != 1 or n_fin != 1:
                      rechazo("marcadores v6 no son unicos (ini=" + str(n_ini) + ", fin=" + str(n_fin) + ")")
                  decir("- Marcadores v6 unicos (ini=1, fin=1): OK")

                  try:
                      t2, info2 = aplicar(limpiar(t))
                      if t2 == t:
                          decir("- Idempotencia (2da pasada produce el mismo archivo): OK")
                      else:
                          rechazo("idempotencia fallida: la 2da pasada produce un archivo distinto")
                  except Rechazo as e:
                      rechazo("idempotencia fallida: " + str(e)[:300])

                  _pruebas_js()

                  decir("")
                  decir("Estructura detectada (auditoria)")
                  try:
                      ids_vistos = []
                      for mm in re.finditer(r"<(?:button|input|select|canvas|video|img|a|div|section|form)\b[^>]*>", base):
                          mi = re.search(r"\bid=[\"']([A-Za-z0-9_\-]+)[\"']", mm.group(0))
                          if mi and mi.group(1) not in ids_vistos:
                              ids_vistos.append(mi.group(1))
                      opts = [o.strip() for o in re.findall(r"<option[^>]*>([^<]{0,60})</option>", base)][:10]
                      presencia = ["Tesseract", "faceapi", "pdf417", "fetch(", "nombreNoCoincide", "bioRechazada", "docVencido"]
                      pres = {k: (k in base) for k in presencia}
                      with open(os.path.join(d, "estructura.txt"), "w", encoding="utf-8") as f:
                          f.write("IDs: " + json.dumps(ids_vistos[:60]) + "\n")
                          f.write("Opciones: " + json.dumps(opts) + "\n")
                          f.write("Presencia: " + json.dumps(pres) + "\n")
                      decir("- IDs detectados: " + ", ".join(ids_vistos[:18]) + (" ..." if len(ids_vistos) > 18 else ""))
                      if opts:
                          decir("- Opciones del select: " + " | ".join(opts))
                      decir("- Presentes: " + ", ".join(k for k, v in pres.items() if v))
                  except Exception as e:
                      decir("- Auditoria de estructura omitida: " + str(e)[:200])

                  with open(RUTA, "w", encoding="utf-8") as f:
                      f.write(t)
                  decir("")
                  decir("4) Pruebas en su telefono (tras el deploy de Render)")
                  decir("1. Nombre vacio o sin apellido: al avanzar lo regresa al Paso 1 con aviso.")
                  decir("2. Nombre distinto al documento: al continuar de fotos, avisa y lo regresa al PASO 1; las fotos se borran para tomarlas de nuevo.")
                  decir("3. DUI seleccionado pero licencia capturada: mismo tratamiento (regresa al Paso 1 a corregir el tipo).")
                  decir("4. Sin pasos previos completos, la biometria y la clave no se alcanzan: el orden se corrige solo.")
                  decir("5. Selfie de otra persona: NO pasa a la clave. Selfie propia: pasa.")
                  decir("6. Clave y ZID: si el servidor falla (502/503), reintenta solo; si vuelve a fallar, avisa y reinicia el registro completo desde el Paso 1.")
                  decir("7. La pantalla de captura se ve mas compacta; la guia y el marco no cambian.")
              except Rechazo:
                  try:
                      if RUTA and base is not None and base_limpio != base:
                          okc, _mc = pyok(base_limpio)
                          if okc:
                              with open(RUTA, "w", encoding="utf-8") as f:
                                  f.write(base_limpio)
                              decir("- Archivo dejado en estado estable (solo limpieza de restos).")
                  except Exception:
                      pass
              except Exception as e:
                  rechazo("error inesperado del parcheador: " + str(e)[:300])
              sys.exit(0)

          if __name__ == "__main__":
              main()

          PYEOF

      - name: Paso 3 - Veredicto y commit condicional
        run: |
          if [ -f _zyra/RECHAZO ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Veredicto final - RECHAZADO (RC=2). NO se publica el parche v6 revB. Su pagina queda en el estado estable." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          RUTA=$(cat _zyra/ruta.txt 2>/dev/null || echo "superapp.py")
          rm -rf __pycache__
          git add "$RUTA"
          if git diff --cached --quiet; then
            echo "## Veredicto final - sin cambios que publicar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "ZYRA-FIX v6 revB - orden de pasos obligatorio + gates de nombre, tipo y biometria + anti-502"
          git push origin HEAD
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Veredicto final - APROBADO (RC=0). Commit y push realizados: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Avisos (no bloquean)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node 20 en las acciones de GitHub esta obsoleto (aviso del runner, cosmico; no afecta este workflow)." >> "$GITHUB_STEP_SUMMARY"
          echo "- ubuntu-latest migra a Ubuntu 26 el 19-oct-2026; este workflow solo usa python3, node y git, disponibles tambien ahi." >> "$GITHUB_STEP_SUMMARY"

      - name: Artefacto informes y diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyra-fix-v6-revb-informe
          path: _zyra
