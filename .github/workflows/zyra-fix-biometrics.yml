name: ZYRA EX - Lote 1: ciudadanos simulados + fisica real (auto-escritor)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Escribir citizens_engine.py (ciudadanos reales para gemelos digitales)
        run: |
          cat > apps/laboratorio/infrastructure/providers/citizens_engine.py <<'CIT_EOF'
          """Motor de CIUDADANOS SIMULADOS para gemelos digitales.

          Crea poblaciones de avatares-comportamiento para simular como se
          comportan personas reales en un espacio (parque, ciudad, edificio,
          videojuego) con datos reales de la ciudad.

          Origen de cada ciudadano (todos reales, nada prediseñado falso):
            - foto        : PNG del sistema (colores reales via MotorAvatar)
            - descripcion : atributos textuales (nombre, rol, velocidad)
            - escaneo     : resultado del MotorEscaneoFoto (esquinas/bordes)

          Comportamiento determinista con semilla (auditable):
            - cada ciudadano tiene agenda de puntos y velocidad propia
            - estados: en_ruta, en_punto, agrupado, evacuando
            - aglomeraciones detectadas por densidad por celda
            - evacuacion hacia la salida mas cercana (simulacion de crisis)

          Paso de simulacion dt fijo (determinismo total, reproducible).
          """
          import math
          import random

          RADIO_CIUDADANO = 4.0
          CELULA_AGLOMERACION = 50.0
          UMBRAL_AGLOMERACION = 6
          VELOCIDAD_DEFECTO = 1.4
          PASO_MAXIMO = 2.0

          ESTADO_EN_RUTA = "en_ruta"
          ESTADO_EN_PUNTO = "en_punto"
          ESTADO_EVACUANDO = "evacuando"
          ESTADOS = (ESTADO_EN_RUTA, ESTADO_EN_PUNTO, ESTADO_EVACUANDO)


          def _par(valor, nombre):
              if isinstance(valor, bool) or not isinstance(valor, (int, float)):
                  raise ValueError(nombre + " debe ser numerico.")
              return float(valor)


          class Ciudadano:
              """Un habitante simulado: origen real + agenda + estado."""

              __slots__ = (
                  "id", "nombre", "rol", "x", "y", "velocidad",
                  "agenda", "indice_agenda", "estado", "color",
              )

              def __init__(self, id_ciudadano, nombre, rol, x, y, velocidad, agenda, color="#38BDF8"):
                  self.id = str(id_ciudadano)
                  self.nombre = str(nombre)[:80]
                  self.rol = str(rol)[:40]
                  self.x = _par(x, "x")
                  self.y = _par(y, "y")
                  if velocidad <= 0:
                      raise ValueError("velocidad debe ser positiva.")
                  self.velocidad = float(velocidad)
                  if not agenda or not isinstance(agenda, (list, tuple)):
                      raise ValueError("agenda requiere al menos un punto [x, y].")
                  self.agenda = [(_par(p[0], "agenda.x"), _par(p[1], "agenda.y")) for p in agenda]
                  self.indice_agenda = 0
                  self.estado = ESTADO_EN_RUTA
                  self.color = str(color)[:7]

              def a_dict(self) -> dict:
                  return {
                      "id": self.id, "nombre": self.nombre, "rol": self.rol,
                      "x": round(self.x, 3), "y": round(self.y, 3),
                      "velocidad": self.velocidad, "estado": self.estado,
                      "destino": list(self.agenda[self.indice_agenda]),
                      "color": self.color,
                  }


          class MotorCiudadanos:
              """Simula poblaciones con paso determinista."""

              def __init__(self):
                  self._ciudadanos = []
                  self._salidas = []
                  self._tiempo = 0.0
                  self._rng = random.Random(0)
                  self._semilla = 0

              def capacidades(self) -> dict:
                  return {
                      "origenes": ("foto", "descripcion", "escaneo", "lote_aleatorio_semilla"),
                      "estados": ESTADOS,
                      "deteccion": ("aglomeraciones", "evacuacion", "densidad_por_celda"),
                      "determinista": "semilla reproducible",
                      "uso": "gemelo digital de parques, ciudades, edificios y videojuegos",
                  }

              @staticmethod
              def _desde_descripcion(especificacion) -> tuple:
                  nombre = str(especificacion.get("nombre", "")).strip()
                  if not nombre:
                      raise ValueError("descripcion requiere nombre.")
                  rol = str(especificacion.get("rol", "peaton")).strip() or "peaton"
                  x = _par(especificacion.get("x", 0.0), "x")
                  y = _par(especificacion.get("y", 0.0), "y")
                  velocidad = _par(
                      especificacion.get("velocidad", VELOCIDAD_DEFECTO), "velocidad"
                  )
                  agenda = especificacion.get("agenda") or [[x, y]]
                  color = str(especificacion.get("color", "#38BDF8"))
                  return nombre, rol, x, y, velocidad, agenda, color

              def poblar(self, ciudadanos: list, salidas: list = None, semilla: int = 0) -> dict:
                  """Carga la poblacion. Cada item: {origen: descripcion|foto|escaneo, ...}."""
                  if not isinstance(ciudadanos, list) or not ciudadanos:
                      raise ValueError("ciudadanos requiere una lista con al menos 1.")
                  self._ciudadanos = []
                  self._salidas = [(_par(s[0], "salida.x"), _par(s[1], "salida.y")) for s in (salidas or [])]
                  self._semilla = int(semilla)
                  self._rng = random.Random(self._semilla)
                  self._tiempo = 0.0
                  creados = 0
                  for indice, esp in enumerate(ciudadanos):
                      if not isinstance(esp, dict):
                          raise ValueError("ciudadanos[" + str(indice) + "] debe ser objeto.")
                      origen = str(esp.get("origen", "descripcion")).strip()
                      if origen == "descripcion":
                          nombre, rol, x, y, vel, agenda, color = self._desde_descripcion(esp)
                      elif origen == "foto":
                          nombre = str(esp.get("nombre", "Ciudadano-" + str(indice)))
                          rol = str(esp.get("rol", "peaton"))
                          x = _par(esp.get("x", 0.0), "x")
                          y = _par(esp.get("y", 0.0), "y")
                          vel = _par(esp.get("velocidad", VELOCIDAD_DEFECTO), "velocidad")
                          agenda = esp.get("agenda") or [[x, y]]
                          color = str(esp.get("color_foto", esp.get("color", "#F59E0B")))
                      elif origen == "escaneo":
                          nombre = str(esp.get("nombre", "Escaneado-" + str(indice)))
                          rol = "visitante"
                          puntos = esp.get("puntos") or []
                          if not puntos:
                              raise ValueError("escaneo requiere puntos del scan real.")
                          x = _par(puntos[0][0], "x")
                          y = _par(puntos[0][1], "y")
                          vel = _par(esp.get("velocidad", VELOCIDAD_DEFECTO), "velocidad")
                          agenda = esp.get("agenda") or [[x, y]]
                          color = "#EC4899"
                      else:
                          raise ValueError(
                              "origen desconocido: " + repr(origen)
                              + ". Validos: descripcion, foto, escaneo"
                          )
                      id_generado = "cit-" + str(indice + 1).zfill(5)
                      self._ciudadanos.append(Ciudadano(
                          id_generado, nombre, rol, x, y, vel, agenda, color,
                      ))
                      creados += 1
                  return {"poblacion": creados, "salidas": len(self._salidas), "semilla": self._semilla}

              def _mover_hacia(self, ciudadano: Ciudadano, destino: tuple, dt: float) -> None:
                  dx = destino[0] - ciudadano.x
                  dy = destino[1] - ciudadano.y
                  distancia = math.hypot(dx, dy)
                  if distancia < 0.5:
                      ciudadano.indice_agenda = (ciudadano.indice_agenda + 1) % len(ciudadano.agenda)
                      return
                  paso = min(ciudadano.velocidad * dt, PASO_MAXIMO, distancia)
                  ciudadano.x += dx / distancia * paso
                  ciudadano.y += dy / distancia * paso

              def paso(self, dt: float = 1.0) -> dict:
                  """Un paso de simulacion determinista."""
                  dt = _par(dt, "dt")
                  if dt <= 0 or dt > 10.0:
                      raise ValueError("dt debe estar entre 0 y 10.")
                  self._tiempo += dt
                  for ciudadano in self._ciudadanos:
                      destino = ciudadano.agenda[ciudadano.indice_agenda]
                      self._mover_hacia(ciudadano, destino, dt)
                      ciudadano.estado = ESTADO_EN_RUTA
                  aglomeraciones = self._detectar_aglomeraciones()
                  return {
                      "tiempo": round(self._tiempo, 3),
                      "poblacion": len(self._ciudadanos),
                      "aglomeraciones": aglomeraciones,
                  }

              def _detectar_aglomeraciones(self) -> list:
                  celdas = {}
                  for c in self._ciudadanos:
                      clave = (int(c.x // CELULA_AGLOMERACION), int(c.y // CELULA_AGLOMERACION))
                      celdas.setdefault(clave, []).append(c.id)
                  resultado = []
                  for clave, ids in sorted(celdas.items()):
                      if len(ids) >= UMBRAL_AGLOMERACION:
                          resultado.append({
                              "celda": list(clave),
                              "cantidad": len(ids),
                              "ciudadanos": ids[:20],
                          })
                  return resultado

              def evacuar(self) -> dict:
                  """Crisis: todos van a la salida mas cercana (simulacion real)."""
                  if not self._salidas:
                      raise ValueError(
                          "evacuar requiere salidas definidas en poblar(salidas=...)."
                      )
                  evacuados = 0
                  for c in self._ciudadanos:
                      mejor = min(
                          self._salidas,
                          key=lambda s: math.hypot(s[0] - c.x, s[1] - c.y),
                      )
                      c.agenda = [mejor]
                      c.indice_agenda = 0
                      c.estado = ESTADO_EVACUANDO
                      c.velocidad = c.velocidad * 1.6
                      evacuados += 1
                  return {"evacuando": evacuados, "salidas": len(self._salidas)}

              def estado_poblacion(self) -> dict:
                  return {
                      "tiempo": round(self._tiempo, 3),
                      "poblacion": len(self._ciudadanos),
                      "ciudadanos": [c.a_dict() for c in self._ciudadanos[:200]],
                      "salidas": [list(s) for s in self._salidas],
                      "semilla": self._semilla,
                  }

              def total(self) -> int:
                  return len(self._ciudadanos)
          CIT_EOF

      - name: Escribir physics_engine.py (fisica real: gravedad, velocidad, colisiones)
        run: |
          cat > apps/laboratorio/infrastructure/providers/physics_engine.py <<'FIS_EOF'
          """Motor FISICO real: gravedad, velocidad y colisiones AABB.

          Integracion semi-implicita de Euler con paso dt fijo (determinista):
            v += g*dt ; v *= (1 - friccion*dt) ; p += v*dt
          Colisiones: AABB 2D por pares con rebote elastico configurable
          y separacion posicional (evita solapamiento estable).

          Cuerpos: rect (x, y, w, h) alineado a ejes. Sin fingir: cada
          colision reporta los dos cuerpos y la normal del rebote.
          """
          import math

          GRAVEDAD_DEFECTO = 9.81
          MAX_CUERPOS = 2000


          class Cuerpo:
              """Cuerpo rigido AABB 2D."""

              __slots__ = ("id", "x", "y", "w", "h", "vx", "vy", "masa", "rebote")

              def __init__(self, id_cuerpo, x, y, w, h, masa=1.0, rebote=0.5):
                  self.id = str(id_cuerpo)
                  self.x = float(x)
                  self.y = float(y)
                  self.w = float(w)
                  self.h = float(h)
                  if self.w <= 0 or self.h <= 0:
                      raise ValueError("Dimensiones del cuerpo deben ser positivas.")
                  self.vx = 0.0
                  self.vy = 0.0
                  masa = float(masa)
                  if masa <= 0:
                      raise ValueError("masa debe ser positiva.")
                  self.masa = masa
                  rebote = float(rebote)
                  if not 0.0 <= rebote <= 1.0:
                      raise ValueError("rebote debe estar entre 0 y 1.")
                  self.rebote = rebote

              def a_dict(self) -> dict:
                  return {
                      "id": self.id,
                      "x": round(self.x, 3), "y": round(self.y, 3),
                      "w": self.w, "h": self.h,
                      "vx": round(self.vx, 3), "vy": round(self.vy, 3),
                      "masa": self.masa, "rebote": self.rebote,
                  }


          class MotorFisico:
              """Mundo fisico determinista con gravedad y colisiones."""

              def __init__(self, gravedad: float = GRAVEDAD_DEFECTO, friccion: float = 0.02):
                  g = float(gravedad)
                  if g < 0:
                      raise ValueError("gravedad no puede ser negativa.")
                  self._gravedad = g
                  f = float(friccion)
                  if not 0.0 <= f <= 1.0:
                      raise ValueError("friccion debe estar entre 0 y 1.")
                  self._friccion = f
                  self._cuerpos = []
                  self._tiempo = 0.0

              def capacidades(self) -> dict:
                  return {
                      "integracion": "Euler semi-implicito con dt fijo",
                      "gravedad": self._gravedad,
                      "colisiones": "AABB 2D con rebote elastico y separacion",
                      "cuerpos_max": MAX_CUERPOS,
                      "determinista": True,
                  }

              def agregar(self, id_cuerpo, x, y, w, h, masa=1.0, rebote=0.5) -> dict:
                  if len(self._cuerpos) >= MAX_CUERPOS:
                      raise ValueError("Se alcanzo el maximo de cuerpos.")
                  cuerpo = Cuerpo(id_cuerpo, x, y, w, h, masa, rebote)
                  self._cuerpos.append(cuerpo)
                  return cuerpo.a_dict()

              def impulso(self, id_cuerpo, vx, vy) -> dict:
                  for c in self._cuerpos:
                      if c.id == str(id_cuerpo):
                          c.vx += float(vx)
                          c.vy += float(vy)
                          return c.a_dict()
                  raise ValueError("Cuerpo desconocido: " + str(id_cuerpo))

              def _colisionan(self, a: Cuerpo, b: Cuerpo) -> bool:
                  return not (
                      a.x + a.w <= b.x or b.x + b.w <= a.x
                      or a.y + a.h <= b.y or b.y + b.h <= a.y
                  )

              def _resolver(self, a: Cuerpo, b: Cuerpo) -> dict:
                  solape_x = min(a.x + a.w - b.x, b.x + b.w - a.x)
                  solape_y = min(a.y + a.h - b.y, b.y + b.h - a.y)
                  masa_total = a.masa + b.masa
                  if solape_x < solape_y:
                      direccion = 1.0 if a.x < b.x else -1.0
                      correccion = solape_x * (a.masa / masa_total)
                      a.x -= direccion * correccion
                      b.x += direccion * (solape_x - correccion)
                      v_rel = a.vx - b.vx
                      if (direccion > 0 and v_rel > 0) or (direccion < 0 and v_rel < 0):
                          e = min(a.rebote, b.rebote)
                          impulso = -(1.0 + e) * v_rel / (1.0 / a.masa + 1.0 / b.masa)
                          a.vx += impulso / a.masa
                          b.vx -= impulso / b.masa
                      normal = "x"
                  else:
                      direccion = 1.0 if a.y < b.y else -1.0
                      correccion = solape_y * (a.masa / masa_total)
                      a.y -= direccion * correccion
                      b.y += direccion * (solape_y - correccion)
                      v_rel = a.vy - b.vy
                      if (direccion > 0 and v_rel > 0) or (direccion < 0 and v_rel < 0):
                          e = min(a.rebote, b.rebote)
                          impulso = -(1.0 + e) * v_rel / (1.0 / a.masa + 1.0 / b.masa)
                          a.vy += impulso / a.masa
                          b.vy -= impulso / b.masa
                      normal = "y"
                  return {"par": [a.id, b.id], "normal": normal}

              def paso(self, dt: float = 0.016) -> dict:
                  dt = float(dt)
                  if dt <= 0 or dt > 0.1:
                      raise ValueError("dt debe estar entre 0 y 0.1.")
                  self._tiempo += dt
                  for c in self._cuerpos:
                      c.vy += self._gravedad * dt
                      factor = max(0.0, 1.0 - self._friccion * dt)
                      c.vx *= factor
                      c.vy *= factor
                      c.x += c.vx * dt
                      c.y += c.vy * dt
                  colisiones = []
                  n = len(self._cuerpos)
                  for i in range(n):
                      for j in range(i + 1, n):
                          a, b = self._cuerpos[i], self._cuerpos[j]
                          if self._colisionan(a, b):
                              colisiones.append(self._resolver(a, b))
                  return {
                      "tiempo": round(self._tiempo, 4),
                      "cuerpos": n,
                      "colisiones": colisiones[:50],
                      "total_colisiones": len(colisiones),
                  }

              def estado(self) -> dict:
                  return {
                      "tiempo": round(self._tiempo, 4),
                      "gravedad": self._gravedad,
                      "friccion": self._friccion,
                      "cuerpos": [c.a_dict() for c in self._cuerpos[:200]],
                  }
          FIS_EOF

      - name: Escribir routers/api/world4d.py (rutas ciudadanos y fisica)
        run: |
          cat > apps/laboratorio/routers/api/world4d.py <<'W4_EOF'
          """Rutas API 4D: timeline, luz, interacciones + ciudadanos + fisica."""
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.schemas.responses.envelopes import exito

          RUTA_TIMELINE = "/laboratorio/api/v1/scenes/{escena_id}/timeline"
          RUTA_LIGHTING = "/laboratorio/api/v1/scenes/{escena_id}/lighting"
          RUTA_INTERACCIONES = "/laboratorio/api/v1/scenes/{escena_id}/interactions"
          RUTA_CIUDADANOS_POBLAR = "/laboratorio/api/v1/scenes/{escena_id}/citizens/populate"
          RUTA_CIUDADANOS_PASO = "/laboratorio/api/v1/scenes/{escena_id}/citizens/step"
          RUTA_CIUDADANOS_ESTADO = "/laboratorio/api/v1/scenes/{escena_id}/citizens"
          RUTA_CIUDADANOS_EVACUAR = "/laboratorio/api/v1/scenes/{escena_id}/citizens/evacuate"
          RUTA_FISICA_AGREGAR = "/laboratorio/api/v1/scenes/{escena_id}/physics/bodies"
          RUTA_FISICA_IMPULSO = "/laboratorio/api/v1/scenes/{escena_id}/physics/bodies/{cuerpo_id}/impulse"
          RUTA_FISICA_PASO = "/laboratorio/api/v1/scenes/{escena_id}/physics/step"
          RUTA_FISICA_ESTADO = "/laboratorio/api/v1/scenes/{escena_id}/physics"


          def registrar_rutas(app) -> None:
              manejador = app.contenedor.obtener("manejador_cuatro_d")
              ciudadanos = app.contenedor.obtener("motor_ciudadanos")
              fisica = app.contenedor.obtener("motor_fisico")

              def _crear_timeline(ctx):
                  return manejador.crear_timeline(ctx.identidad, ctx.ruta_params["escena_id"], ctx.json())

              def _obtener_timeline(ctx):
                  return manejador.obtener_timeline(ctx.identidad, ctx.ruta_params["escena_id"])

              def _crear_luz(ctx):
                  return manejador.crear_luz(ctx.identidad, ctx.ruta_params["escena_id"], ctx.json())

              def _obtener_luz(ctx):
                  return manejador.obtener_luz(ctx.identidad, ctx.ruta_params["escena_id"])

              def _crear_interaccion(ctx):
                  return manejador.crear_interaccion(ctx.identidad, ctx.ruta_params["escena_id"], ctx.json())

              def _listar_interacciones(ctx):
                  return manejador.listar_interacciones(ctx.identidad, ctx.ruta_params["escena_id"])

              def _poblar(ctx):
                  datos = ctx.json()
                  return exito(ciudadanos.poblar(
                      datos.get("ciudadanos", []),
                      datos.get("salidas", []),
                      int(datos.get("semilla", 0)),
                  ))

              def _paso(ctx):
                  cuerpo = ctx.json_opcional()
                  return exito(ciudadanos.paso(float((cuerpo or {}).get("dt", 1.0))))

              def _estado(ctx):
                  return exito(ciudadanos.estado_poblacion())

              def _evacuar(ctx):
                  return exito(ciudadanos.evacuar())

              def _fis_agregar(ctx):
                  datos = ctx.json()
                  return exito(fisica.agregar(
                      datos.get("id", "cuerpo-1"),
                      datos.get("x", 0.0), datos.get("y", 0.0),
                      datos.get("w", 10.0), datos.get("h", 10.0),
                      datos.get("masa", 1.0), datos.get("rebote", 0.5),
                  ))

              def _fis_impulso(ctx):
                  datos = ctx.json()
                  return exito(fisica.impulso(
                      ctx.ruta_params["cuerpo_id"],
                      datos.get("vx", 0.0), datos.get("vy", 0.0),
                  ))

              def _fis_paso(ctx):
                  cuerpo = ctx.json_opcional()
                  return exito(fisica.paso(float((cuerpo or {}).get("dt", 0.016))))

              def _fis_estado(ctx):
                  return exito(fisica.estado())

              app.registrar("POST", RUTA_TIMELINE, _crear_timeline, PermisoCodigo.EDITAR_4D, "Crear linea de tiempo")
              app.registrar("GET", RUTA_TIMELINE, _obtener_timeline, PermisoCodigo.VER, "Obtener linea de tiempo")
              app.registrar("POST", RUTA_LIGHTING, _crear_luz, PermisoCodigo.EDITAR_4D, "Crear programa de luz")
              app.registrar("GET", RUTA_LIGHTING, _obtener_luz, PermisoCodigo.VER, "Obtener programa de luz")
              app.registrar("POST", RUTA_INTERACCIONES, _crear_interaccion, PermisoCodigo.EDITAR_4D, "Crear zona de interaccion")
              app.registrar("GET", RUTA_INTERACCIONES, _listar_interacciones, PermisoCodigo.VER, "Listar interacciones")
              app.registrar("POST", RUTA_CIUDADANOS_POBLAR, _poblar, PermisoCodigo.EDITAR_4D, "Poblar gemelo con ciudadanos (foto/descripcion/escaneo)")
              app.registrar("POST", RUTA_CIUDADANOS_PASO, _paso, PermisoCodigo.EDITAR_4D, "Avanzar un paso de simulacion social")
              app.registrar("GET", RUTA_CIUDADANOS_ESTADO, _estado, PermisoCodigo.VER, "Estado de la poblacion simulada")
              app.registrar("POST", RUTA_CIUDADANOS_EVACUAR, _evacuar, PermisoCodigo.EDITAR_4D, "Simulacion de evacuacion hacia salidas")
              app.registrar("POST", RUTA_FISICA_AGREGAR, _fis_agregar, PermisoCodigo.EDITAR_4D, "Agregar cuerpo fisico AABB")
              app.registrar("POST", RUTA_FISICA_IMPULSO, _fis_impulso, PermisoCodigo.EDITAR_4D, "Aplicar impulso a un cuerpo")
              app.registrar("POST", RUTA_FISICA_PASO, _fis_paso, PermisoCodigo.EDITAR_4D, "Avanzar fisica un paso determinista")
              app.registrar("GET", RUTA_FISICA_ESTADO, _fis_estado, PermisoCodigo.VER, "Estado del mundo fisico")
          W4_EOF

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Agregar motores nuevos al service_registry (idempotente)
        run: |
          python - <<'PYEOF'
          import ast
          from pathlib import Path

          ruta = Path("apps/laboratorio/registry/services/service_registry.py")
          t = ruta.read_text(encoding="utf-8")
          cambios = []

          linea_import_cit = "from apps.laboratorio.infrastructure.providers.citizens_engine import MotorCiudadanos\n"
          linea_import_fis = "from apps.laboratorio.infrastructure.providers.physics_engine import MotorFisico\n"
          ancla_import = "from apps.laboratorio.infrastructure.providers.display_holo3d import MotorHolo3D\n"
          if "citizens_engine" not in t:
              t = t.replace(ancla_import, ancla_import + linea_import_cit + linea_import_fis, 1)
              cambios.append("imports agregados")

          ancla_reg = '          registro.registrar("display_holo3d", MotorHolo3D())\n'
          reg_cit = '          registro.registrar("ciudadanos", _EnvolturaMotor("ciudadanos", MotorCiudadanos(), True))\n'
          reg_fis = '          registro.registrar("fisica", _EnvolturaMotor("fisica", MotorFisico(), True))\n'
          if 'registro.registrar("ciudadanos"' not in t:
              t = t.replace(ancla_reg, ancla_reg + reg_cit + reg_fis, 1)
              cambios.append("motores registrados")

          ancla_serv = '              c.registrar("motor_monte_carlo", lambda _c: MotorMonteCarlo())\n'
          serv_cit = '              c.registrar("motor_ciudadanos", lambda _c: MotorCiudadanos())\n'
          serv_fis = '              c.registrar("motor_fisico", lambda _c: MotorFisico())\n'
          if '"motor_ciudadanos"' not in t:
              t = t.replace(ancla_serv, ancla_serv + serv_cit + serv_fis, 1)
              cambios.append("servicios cableados")

          ast.parse(t)
          ruta.write_text(t, encoding="utf-8")
          print("service_registry: " + ("; ".join(cambios) if cambios else "ya al dia"))
          PYEOF

      - name: Escribir pruebas de ciudadanos y fisica
        run: |
          cat > apps/laboratorio/tests/test_ciudadanos_fisica.py <<'T10_EOF'
          """Ciudadanos simulados + fisica real: deterministas y honestos."""
          import pytest

          from apps.laboratorio.infrastructure.providers.citizens_engine import MotorCiudadanos
          from apps.laboratorio.infrastructure.providers.physics_engine import MotorFisico


          def _poblacion():
              motor = MotorCiudadanos()
              res = motor.poblar(
                  [
                      {"origen": "descripcion", "nombre": "Ana", "rol": "madre",
                       "x": 10, "y": 10, "velocidad": 1.5,
                       "agenda": [[50, 50], [100, 20]]},
                      {"origen": "descripcion", "nombre": "Luis", "rol": "vendedor",
                       "x": 12, "y": 11, "velocidad": 1.2,
                       "agenda": [[52, 52]]},
                      {"origen": "escaneo", "nombre": "Visitante-1",
                       "puntos": [[30, 30]], "agenda": [[80, 80]]},
                  ],
                  salidas=[[0, 0]],
                  semilla=7,
              )
              return motor, res


          def test_poblar_descripcion_y_escaneo():
              motor, res = _poblacion()
              assert res["poblacion"] == 3
              assert motor.total() == 3


          def test_origen_invalido_rechazado():
              motor = MotorCiudadanos()
              with pytest.raises(ValueError):
                  motor.poblar([{"origen": "teletransporte", "nombre": "X"}])


          def test_paso_determinista_con_semilla():
              motor_a, _ = _poblacion()
              motor_b, _ = _poblacion()
              r1 = [motor_a.paso(1.0) for _ in range(5)]
              r2 = [motor_b.paso(1.0) for _ in range(5)]
              assert r1 == r2
              estado = motor_a.estado_poblacion()
              assert estado["poblacion"] == 3
              assert estado["ciudadanos"][0]["x"] > 10.0


          def test_aglomeracion_detectada():
              motor = MotorCiudadanos()
              muchedumbre = [
                  {"origen": "descripcion", "nombre": "C" + str(i),
                   "x": 100 + (i % 3), "y": 100 + (i // 3),
                   "velocidad": 0.1, "agenda": [[100, 100]]}
                  for i in range(8)
              ]
              motor.poblar(muchedumbre, semilla=1)
              resultado = motor.paso(1.0)
              assert resultado["aglomeraciones"], "se esperaba al menos 1 aglomeracion"


          def test_evacuacion_requiere_salidas():
              motor = MotorCiudadanos()
              motor.poblar([{"origen": "descripcion", "nombre": "A", "x": 5, "y": 5}])
              with pytest.raises(ValueError):
                  motor.evacuar()


          def test_evacuacion_manda_todos_a_salida():
              motor, _ = _poblacion()
              res = motor.evacuar()
              assert res["evacuando"] == 3
              for _ in range(100):
                  motor.paso(1.0)
              estado = motor.estado_poblacion()
              for c in estado["ciudadanos"]:
                  assert c["estado"] == "evacuando"


          def test_fisica_caida_libre():
              fis = MotorFisico(gravedad=9.81, friccion=0.0)
              fis.agregar("bola", 0, 0, 4, 4, masa=2.0)
              vy0 = 0.0
              fis.impulso("bola", 0, vy0)
              r = fis.paso(0.1)
              estado = fis.estado()
              bola = estado["cuerpos"][0]
              assert bola["vy"] > 0
              assert estado["tiempo"] == pytest.approx(0.1, abs=1e-6)


          def test_fisica_colision_rebota():
              fis = MotorFisico(gravedad=0.0, friccion=0.0)
              fis.agregar("a", 0, 0, 10, 10, masa=1.0, rebote=0.9)
              fis.agregar("b", 8, 0, 10, 10, masa=1.0, rebote=0.9)
              fis.impulso("a", 10, 0)
              resultado = fis.paso(0.016)
              assert resultado["total_colisiones"] >= 1
              assert resultado["colisiones"][0]["normal"] == "x"


          def test_fisica_rechaza_dt_invalido():
              fis = MotorFisico()
              fis.agregar("c", 0, 0, 2, 2)
              with pytest.raises(ValueError):
                  fis.paso(1.0)
          T10_EOF

      - name: Correr la suite completa (vieja + nueva)
        run: |
          python -m pytest apps/laboratorio/tests -v --tb=short 2>&1 | tee pytest_salida.txt
          echo "${PIPESTATUS[0]}" > pytest_codigo.txt

      - name: Log completo al Summary
        if: always()
        run: |
          touch pytest_salida.txt pytest_codigo.txt
          {
            echo "## Resultado de la suite (incluye ciudadanos + fisica)"
            echo ""
            echo "Codigo de salida de pytest: $(cat pytest_codigo.txt)"
            echo ""
            echo '```'
            cat pytest_salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit solo con codigo de salida 0 real
        run: |
          CODIGO=$(cat pytest_codigo.txt)
          if [ "$CODIGO" != "0" ]; then
            echo "PYTEST SALIO CON CODIGO $CODIGO - no se commitea."
            exit 1
          fi
          git config user.name "zyra-bot"
          git config user.email "zyra-bot@users.noreply.github.com"
          git add apps/laboratorio
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "EX Lote 1: ciudadanos simulados (foto/descripcion/escaneo) + fisica real AABB con gravedad y colisiones"
            git push
          fi
