          class CasoSolicitarDatos:
              def __init__(self, repo_red, repo_historial, outbox, cliente_zyra, auditoria):
                  self._red = repo_red
                  self._historial = repo_historial
                  self._outbox = outbox
                  self._cliente = cliente_zyra
                  self._auditoria = auditoria

              def ejecutar(self, identidad, app_destino: str, contrato: str, carga: dict = None) -> dict:
                  if not existe_app(app_destino):
                      raise ValueError("App ZYRA desconocida: " + repr(app_destino))
                  contratos_validos = contratos_de(app_destino)
                  if contrato not in contratos_validos:
                      raise ValueError(
                          "Contrato invalido para " + app_destino + ": " + repr(contrato)
                          + ". Validos: " + ", ".join(contratos_validos)
                      )
                  solicitud = SolicitudRed(
                      id=nuevo_id("sol"),
                      app_destino=app_destino,
                      contrato=contrato,
                      solicitante_zid=identidad.zid,
                  )
                  self._red.agregar_solicitud(solicitud)
                  self._outbox.encolar(
                      "laboratorio.datos.solicitados",
                      DESTINO_DATOS,
                      {
                          "app_destino": app_destino,
                          "contrato": contrato,
                          "solicitante": identidad.zid,
                          "carga": dict(carga or {}),
                      },
                  )
                  self._outbox.procesar(self._cliente.entregar)
                  estadisticas = self._outbox.estadisticas()
                  if estadisticas.get("pendiente", 0) > 0:
                      solicitud.respuesta = "Encolada; se entrega cuando ZYRA Core responda."
                  elif estadisticas.get("error", 0) > 0:
                      solicitud.marcar_error("Error de red al entregar")
                  else:
                      solicitud.marcar_enviada("Entregada a ZYRA Core")
                  self._red.actualizar_solicitud(solicitud)
                  self._historial.agregar(EntradaHistorial(
                      id=nuevo_id("his"), proyecto_id=None,
                      autor_zid=identidad.zid, accion="datos.solicitados",
                      detalle={"app": app_destino, "contrato": contrato,
                               "estado": solicitud.estado},
                  ))
                  self._auditoria.registrar(
                      identidad, "solicitud.crear", str(solicitud.id), "exito",
                      {"app": app_destino, "contrato": contrato, "estado": solicitud.estado},
                  )
                  return {
                      "solicitud": self._a_dict(solicitud),
                      "estado": solicitud.estado,
                      "outbox": estadisticas,
                  }

              @staticmethod
              def _a_dict(solicitud) -> dict:
                  return {
                      "id": str(solicitud.id),
                      "app_destino": solicitud.app_destino,
                      "contrato": solicitud.contrato,
                      "solicitante_zid": solicitud.solicitante_zid,
