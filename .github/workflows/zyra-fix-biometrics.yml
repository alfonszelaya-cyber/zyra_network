name: "ZYRA RUN5b v3: AX-4..AX-9 (1 linea de test: condenados_db(db,...))"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: "[ESCRITURA] 6 engines AX-4..AX-9 (identicos — 6/6 verdes en 2 runs)"
        if: always()
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines:$(pwd)"
          python3 << 'PYEOF'
          import ast, os, pathlib, py_compile, textwrap, traceback
          SUM = os.environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              p = None
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- **" + p.name + ": OK**")
              except Exception:
                  if p is not None and p.exists():
                      try:
                          p.unlink()
                      except Exception:
                          pass
                  out("- **" + ruta + ": ERROR (no escrito)**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          try:
              forzar("apps/axis/life_history/justice_extended.py",
                     D(r'''
              """AXIS Justice Extended (AX-4): resoluciones,
              recursos, medidas, ordenes, correspondencia (regla
              79), prision con ZID (exige sentencia, regla 66),
              estado de procesos. Patron _DDL + ensure_db."""
              from __future__ import annotations
              import uuid
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS ax_justice_res ("
                  " res_id TEXT PRIMARY KEY, case_id TEXT NOT"
                  " NULL, kind TEXT NOT NULL, judge TEXT NOT"
                  " NULL, body TEXT NOT NULL DEFAULT '',"
                  " issued_at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_justice_rec ("
                  " rec_id TEXT PRIMARY KEY, case_id TEXT NOT"
                  " NULL, kind TEXT NOT NULL, base TEXT NOT"
                  " NULL DEFAULT '', filed_by TEXT NOT NULL,"
                  " outcome TEXT NOT NULL DEFAULT 'pendiente',"
                  " resolved_by TEXT NOT NULL DEFAULT '',"
                  " created_at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_justice_med ("
                  " med_id TEXT PRIMARY KEY, case_id TEXT NOT"
                  " NULL, kind TEXT NOT NULL, target_person TEXT"
                  " NOT NULL, detail TEXT NOT NULL DEFAULT '',"
                  " status TEXT NOT NULL DEFAULT 'activa',"
                  " issued_by TEXT NOT NULL, lifted_at TEXT NOT"
                  " NULL DEFAULT '', issued_at TEXT NOT NULL"
                  " DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_justice_ord ("
                  " ord_id TEXT PRIMARY KEY, case_id TEXT NOT"
                  " NULL DEFAULT '', kind TEXT NOT NULL,"
                  " target_person TEXT NOT NULL DEFAULT '',"
                  " issued_by TEXT NOT NULL, status TEXT NOT"
                  " NULL DEFAULT 'emitida', executed_by TEXT"
                  " NOT NULL DEFAULT '', executed_at TEXT NOT"
                  " NULL DEFAULT '', issued_at TEXT NOT NULL"
                  " DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_justice_mail ("
                  " mail_id TEXT PRIMARY KEY, case_id TEXT NOT"
                  " NULL DEFAULT '', to_account TEXT NOT NULL,"
                  " subject TEXT NOT NULL, body TEXT NOT NULL"
                  " DEFAULT '', sent_at TEXT NOT NULL DEFAULT"
                  " '')",
                  "CREATE TABLE IF NOT EXISTS ax_justice_pris ("
                  " pris_id TEXT PRIMARY KEY, case_id TEXT NOT"
                  " NULL, person_id TEXT NOT NULL, zid TEXT NOT"
                  " NULL DEFAULT '', sentence_days INTEGER NOT"
                  " NULL DEFAULT 0, status TEXT NOT NULL DEFAULT"
                  " 'preso', entry_by TEXT NOT NULL, entry_at"
                  " TEXT NOT NULL DEFAULT '', exit_at TEXT NOT"
                  " NULL DEFAULT '')",
              )
              _RES = ("SENTENCIA", "AUTO", "DECRETO",
                      "EXHORTO")
              _REC = ("APELACION", "CASACION", "REVISION")
              _MED = ("PROHIBICION", "PRISION_PREVENTIVA",
                      "INMOVILIZACION", "SUSPENSION")
              _ORD = ("ORDEN_JUDICIAL", "ORDEN_CAPTURA")


              def ensure_db(db):
                  for stmt in _DDL:
                      db.execute(stmt)


              def issue_resolucion_db(db, *, case_id, kind,
                                      judge, body="",
                                      issued_at=""):
                  ensure_db(db)
                  k = str(kind).upper()
                  if k not in _RES:
                      raise ValueError("kind debe ser "
                                       + "/".join(_RES))
                  if not str(judge).strip():
                      raise ValueError("judge requerido")
                  rid = ("AXR-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_justice_res (res_id,"
                      " case_id, kind, judge, body, issued_at)"
                      " VALUES (?, ?, ?, ?, ?, ?)",
                      (rid, str(case_id), k, str(judge),
                       str(body), str(issued_at)))
                  return {"res_id": rid, "case_id":
                          str(case_id), "kind": k}


              def res_of_db(db, case_id):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT res_id, kind, judge, body,"
                      " issued_at FROM ax_justice_res WHERE"
                      " case_id = ? ORDER BY rowid",
                      (str(case_id),))
                  return [{"res_id": str(r["res_id"]),
                           "kind": str(r["kind"]),
                           "judge": str(r["judge"]),
                           "body": str(r["body"]),
                           "issued_at": str(r["issued_at"])}
                          for r in rows]


              def file_recurso_db(db, *, case_id, kind, base,
                                  filed_by, created_at=""):
                  ensure_db(db)
                  k = str(kind).upper()
                  if k not in _REC:
                      raise ValueError("kind debe ser "
                                       + "/".join(_REC))
                  if not str(base).strip():
                      raise ValueError(
                          "base del recurso requerida")
                  sid = ("AXRC-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_justice_rec (rec_id,"
                      " case_id, kind, base, filed_by, outcome,"
                      " resolved_by, created_at)"
                      " VALUES (?, ?, ?, ?, ?, 'pendiente',"
                      " '', ?)",
                      (sid, str(case_id), k, str(base),
                       str(filed_by), str(created_at)))
                  return {"rec_id": sid, "kind": k,
                          "outcome": "pendiente"}


              def resolve_recurso_db(db, rec_id, *, outcome,
                                     resolved_by):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT outcome FROM ax_justice_rec WHERE"
                      " rec_id = ?", (str(rec_id),))
                  if row is None:
                      raise KeyError(rec_id)
                  if str(row["outcome"]) != "pendiente":
                      raise ValueError(
                          "recurso ya resuelto")
                  o = str(outcome).upper()
                  if o not in ("CONFIRMADA", "REVOCADA",
                               "PARCIAL"):
                      raise ValueError(
                          "outcome CONFIRMADA/REVOCADA/"
                          "PARCIAL")
                  db.execute(
                      "UPDATE ax_justice_rec SET outcome = ?,"
                      " resolved_by = ? WHERE rec_id = ?",
                      (o, str(resolved_by), str(rec_id)))
                  return {"rec_id": str(rec_id),
                          "outcome": o}


              def issue_medida_db(db, *, case_id, kind,
                                  target_person, detail="",
                                  issued_by="",
                                  issued_at=""):
                  ensure_db(db)
                  k = str(kind).upper()
                  if k not in _MED:
                      raise ValueError("kind debe ser "
                                       + "/".join(_MED))
                  if not str(target_person).strip():
                      raise ValueError(
                          "target_person requerido")
                  mid = ("AXM-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_justice_med (med_id,"
                      " case_id, kind, target_person, detail,"
                      " status, issued_by, lifted_at, issued_at)"
                      " VALUES (?, ?, ?, ?, ?, 'activa', ?,"
                      " '', ?)",
                      (mid, str(case_id), k,
                       str(target_person), str(detail),
                       str(issued_by), str(issued_at)))
                  return {"med_id": mid, "kind": k,
                          "status": "activa"}


              def lift_medida_db(db, med_id, *, lifted_at=""):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT status FROM ax_justice_med WHERE"
                      " med_id = ?", (str(med_id),))
                  if row is None:
                      raise KeyError(med_id)
                  if str(row["status"]) != "activa":
                      raise ValueError(
                          "medida ya levantada")
                  db.execute(
                      "UPDATE ax_justice_med SET status ="
                      " 'levantada', lifted_at = ? WHERE"
                      " med_id = ?",
                      (str(lifted_at), str(med_id)))
                  return {"med_id": str(med_id),
                          "status": "levantada"}


              def issue_orden_db(db, *, kind, case_id="",
                                 target_person="",
                                 issued_by="",
                                 issued_at=""):
                  ensure_db(db)
                  k = str(kind).upper()
                  if k not in _ORD:
                      raise ValueError("kind debe ser "
                                       + "/".join(_ORD))
                  if k == "ORDEN_CAPTURA" and \
                          not str(target_person).strip():
                      raise ValueError(
                          "ORDEN_CAPTURA exige target")
                  oid = ("AXO-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_justice_ord (ord_id,"
                      " case_id, kind, target_person, issued_by,"
                      " status, executed_by, executed_at,"
                      " issued_at) VALUES (?, ?, ?, ?, ?,"
                      " 'emitida', '', '', ?)",
                      (oid, str(case_id), k,
                       str(target_person), str(issued_by),
                       str(issued_at)))
                  return {"ord_id": oid, "kind": k,
                          "status": "emitida"}


              def execute_orden_db(db, ord_id, *,
                                   executed_by="",
                                   executed_at=""):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT status FROM ax_justice_ord WHERE"
                      " ord_id = ?", (str(ord_id),))
                  if row is None:
                      raise KeyError(ord_id)
                  if str(row["status"]) != "emitida":
                      raise ValueError(
                          "orden ya ejecutada")
                  db.execute(
                      "UPDATE ax_justice_ord SET status ="
                      " 'ejecutada', executed_by = ?,"
                      " executed_at = ? WHERE ord_id = ?",
                      (str(executed_by), str(executed_at),
                       str(ord_id)))
                  return {"ord_id": str(ord_id),
                          "status": "ejecutada"}


              def send_mail_db(db, *, to_account, subject,
                               case_id="", body="",
                               sent_at=""):
                  ensure_db(db)
                  if not str(to_account).strip() or \
                          not str(subject).strip():
                      raise ValueError(
                          "to_account y subject requeridos")
                  mid = ("AXMAIL-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_justice_mail (mail_id,"
                      " case_id, to_account, subject, body,"
                      " sent_at) VALUES (?, ?, ?, ?, ?, ?)",
                      (mid, str(case_id), str(to_account),
                       str(subject), str(body),
                       str(sent_at)))
                  return {"mail_id": mid,
                          "to_account": str(to_account)}


              def mail_of_db(db, to_account):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT mail_id, case_id, subject, body,"
                      " sent_at FROM ax_justice_mail WHERE"
                      " to_account = ? ORDER BY rowid",
                      (str(to_account),))
                  return [{"mail_id": str(r["mail_id"]),
                           "case_id": str(r["case_id"]),
                           "subject": str(r["subject"]),
                           "body": str(r["body"]),
                           "sent_at": str(r["sent_at"])}
                          for r in rows]


              def imprison_db(db, *, case_id, person_id,
                              zid="", sentence_days=0,
                              entry_by="", entry_at=""):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " ax_justice_res WHERE case_id = ? AND"
                      " kind = 'SENTENCIA'",
                      (str(case_id),))
                  if int(row["n"]) < 1:
                      raise ValueError(
                          "prision exige SENTENCIA previa"
                          " (regla 66)")
                  if not str(person_id).strip():
                      raise ValueError(
                          "person_id requerido")
                  if int(sentence_days) < 0:
                      raise ValueError(
                          "sentence_days no negativos")
                  pid = ("AXP-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_justice_pris (pris_id,"
                      " case_id, person_id, zid, sentence_days,"
                      " status, entry_by, entry_at, exit_at)"
                      " VALUES (?, ?, ?, ?, ?, 'preso', ?, ?,"
                      " '')",
                      (pid, str(case_id), str(person_id),
                       str(zid), int(sentence_days),
                       str(entry_by), str(entry_at)))
                  return {"pris_id": pid, "status": "preso",
                          "person_id": str(person_id),
                          "zid": str(zid)}


              def release_prision_db(db, pris_id, *,
                                     exit_at=""):
                  ensure_db(db)
                  row = db.query_one(
                      "SELECT status FROM ax_justice_pris WHERE"
                      " pris_id = ?", (str(pris_id),))
                  if row is None:
                      raise KeyError(pris_id)
                  if str(row["status"]) != "preso":
                      raise ValueError("ya liberado")
                  db.execute(
                      "UPDATE ax_justice_pris SET status ="
                      " 'libre', exit_at = ? WHERE pris_id ="
                      " ?", (str(exit_at), str(pris_id)))
                  return {"pris_id": str(pris_id),
                          "status": "libre"}


              def condenados_db(db, only_activos=True):
                  ensure_db(db)
                  if only_activos:
                      rows = db.query_all(
                          "SELECT pris_id, case_id, person_id,"
                          " zid, sentence_days, status FROM"
                          " ax_justice_pris WHERE status ="
                          " 'preso' ORDER BY rowid")
                  else:
                      rows = db.query_all(
                          "SELECT pris_id, case_id, person_id,"
                          " zid, sentence_days, status FROM"
                          " ax_justice_pris ORDER BY rowid")
                  return [{"pris_id": str(r["pris_id"]),
                           "case_id": str(r["case_id"]),
                           "person_id": str(r["person_id"]),
                           "zid": str(r["zid"]),
                           "sentence_days": int(
                               r["sentence_days"]),
                           "status": str(r["status"])}
                          for r in rows]


              def estado_procesos_db(db, case_id=""):
                  ensure_db(db)
                  if str(case_id).strip():
                      ids = [str(case_id)]
                  else:
                      rows = db.query_all(
                          "SELECT case_id FROM"
                          " ax_justice_res UNION SELECT"
                          " case_id FROM ax_justice_rec UNION"
                          " SELECT case_id FROM ax_justice_med"
                          " UNION SELECT case_id FROM"
                          " ax_justice_ord UNION SELECT"
                          " case_id FROM ax_justice_pris")
                      ids = sorted(set(
                          str(r["case_id"]) for r in rows
                          if str(r["case_id"]).strip()))
                  out = []
                  for cid in ids:
                      def cnt(t):
                          r = db.query_one(
                              "SELECT COUNT(*) AS n FROM "
                              + t + " WHERE case_id = ?",
                              (cid,))
                          return int(r["n"])
                      pr = db.query_one(
                          "SELECT status FROM"
                          " ax_justice_pris WHERE case_id = ?"
                          " ORDER BY rowid DESC LIMIT 1",
                          (cid,))
                      out.append({
                          "case_id": cid,
                          "resoluciones": cnt(
                              "ax_justice_res"),
                          "recursos": cnt(
                              "ax_justice_rec"),
                          "medidas": cnt(
                              "ax_justice_med"),
                          "ordenes": cnt(
                              "ax_justice_ord"),
                          "prision": (str(pr["status"])
                                      if pr is not None
                                      else "")})
                  return out
              '''))
              forzar("apps/axis/life_history/health_ehr.py",
                     D(r'''
              """AXIS Health EHR (AX-5): expediente clinico con
              ZID + recetas. Patron _DDL + ensure_db."""
              from __future__ import annotations
              import uuid
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS ax_health_rec ("
                  " rec_id TEXT PRIMARY KEY, person_id TEXT NOT"
                  " NULL, kind TEXT NOT NULL, detail TEXT NOT"
                  " NULL DEFAULT '', code TEXT NOT NULL DEFAULT"
                  " '', actor TEXT NOT NULL DEFAULT '',"
                  " recorded_at TEXT NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_health_rx ("
                  " rx_id TEXT PRIMARY KEY, person_id TEXT NOT"
                  " NULL, medication TEXT NOT NULL, dose TEXT"
                  " NOT NULL DEFAULT '', days INTEGER NOT NULL"
                  " DEFAULT 0, prescribed_by TEXT NOT NULL,"
                  " rec_id TEXT NOT NULL DEFAULT '', issued_at"
                  " TEXT NOT NULL DEFAULT '')",
              )
              _KINDS = ("DIAGNOSTICO", "MEDICAMENTO",
                        "ALERGIA", "VACUNA", "CRONICO",
                        "CIRUGIA", "HOSPITALIZACION",
                        "REFERENCIA")


              def ensure_db(db):
                  for stmt in _DDL:
                      db.execute(stmt)


              def add_record_db(db, *, person_id, kind,
                                detail="", code="", actor="",
                                recorded_at=""):
                  ensure_db(db)
                  if not str(person_id).strip():
                      raise ValueError(
                          "person_id requerido")
                  k = str(kind).upper()
                  if k not in _KINDS:
                      raise ValueError("kind debe ser "
                                       + "/".join(_KINDS))
                  if not str(detail).strip():
                      raise ValueError(
                          "detail requerido")
                  rid = ("AXHR-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_health_rec (rec_id,"
                      " person_id, kind, detail, code, actor,"
                      " recorded_at) VALUES (?, ?, ?, ?, ?, ?,"
                      " ?)",
                      (rid, str(person_id), k, str(detail),
                       str(code), str(actor),
                       str(recorded_at)))
                  return {"rec_id": rid, "kind": k}


              def records_of_db(db, person_id, kind=""):
                  ensure_db(db)
                  if str(kind).strip():
                      rows = db.query_all(
                          "SELECT rec_id, kind, detail, code,"
                          " actor, recorded_at FROM"
                          " ax_health_rec WHERE person_id = ?"
                          " AND kind = ? ORDER BY rowid",
                          (str(person_id),
                           str(kind).upper()))
                  else:
                      rows = db.query_all(
                          "SELECT rec_id, kind, detail, code,"
                          " actor, recorded_at FROM"
                          " ax_health_rec WHERE person_id = ?"
                          " ORDER BY rowid", (str(person_id),))
                  return [{"rec_id": str(r["rec_id"]),
                           "kind": str(r["kind"]),
                           "detail": str(r["detail"]),
                           "code": str(r["code"]),
                           "recorded_at": str(
                               r["recorded_at"])}
                          for r in rows]


              def add_prescription_db(db, *, person_id,
                                      medication, dose="",
                                      days=0, prescribed_by="",
                                      rec_id="", issued_at=""):
                  ensure_db(db)
                  if not str(medication).strip():
                      raise ValueError(
                          "medication requerida")
                  if int(days) < 0:
                      raise ValueError("days no negativos")
                  if not str(prescribed_by).strip():
                      raise ValueError(
                          "prescribed_by requerido")
                  rid = ("AXRX-"
                         + uuid.uuid4().hex[:10])
                  db.execute(
                      "INSERT INTO ax_health_rx (rx_id,"
                      " person_id, medication, dose, days,"
                      " prescribed_by, rec_id, issued_at)"
                      " VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                      (rid, str(person_id), str(medication),
                       str(dose), int(days),
                       str(prescribed_by), str(rec_id),
                       str(issued_at)))
                  return {"rx_id": rid,
                          "medication": str(medication)}


              def prescriptions_of_db(db, person_id):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT rx_id, medication, dose, days,"
                      " prescribed_by, issued_at FROM"
                      " ax_health_rx WHERE person_id = ? ORDER"
                      " BY rowid", (str(person_id),))
                  return [{"rx_id": str(r["rx_id"]),
                           "medication": str(
                               r["medication"]),
                           "dose": str(r["dose"]),
                           "days": int(r["days"]),
                           "issued_at": str(
                               r["issued_at"])}
                          for r in rows]


              def ehr_summary_db(db, person_id):
                  ensure_db(db)
                  rows = db.query_all(
                      "SELECT kind, COUNT(*) AS n FROM"
                      " ax_health_rec WHERE person_id = ?"
                      " GROUP BY kind", (str(person_id),))
                  by_kind = {str(r["kind"]): int(r["n"])
                             for r in rows}
                  allergies = [
                      str(r["detail"]) for r in
                      db.query_all(
                          "SELECT detail FROM ax_health_rec"
                          " WHERE person_id = ? AND kind ="
                          " 'ALERGIA' ORDER BY rowid",
                          (str(person_id),))]
                  vaccines = [
                      str(r["detail"]) for r in
                      db.query_all(
                          "SELECT detail FROM ax_health_rec"
                          " WHERE person_id = ? AND kind ="
                          " 'VACUNA' ORDER BY rowid",
                          (str(person_id),))]
                  chronic = [
                      str(r["detail"]) for r in
                      db.query_all(
                          "SELECT detail FROM ax_health_rec"
                          " WHERE person_id = ? AND kind ="
                          " 'CRONICO' ORDER BY rowid",
                          (str(person_id),))]
                  n_rx = db.query_one(
                      "SELECT COUNT(*) AS n FROM ax_health_rx"
                      " WHERE person_id = ?",
                      (str(person_id),))
                  return {"person_id": str(person_id),
                          "by_kind": by_kind,
                          "allergies": allergies,
                          "vaccines": vaccines,
                          "chronic": chronic,
                          "prescriptions": int(n_rx["n"])}
              '''))
              forzar("apps/axis/life_history/police_registry.py",
                     D(r'''
              """AXIS Police Registry (AX-6): agentes, denuncias,
              buscados con ZID, capturas. Patron _DDL +
              ensure_db."""
              from __future__ import annotations
              import uuid
              from shared_engines.storage.database import (
                  Database)

              _DDL = (
                  "CREATE TABLE IF NOT EXISTS ax_pol_agents ("
                  " agent_id TEXT PRIMARY KEY, name TEXT NOT"
                  " NULL, unit TEXT NOT NULL DEFAULT '', active"
                  " INTEGER NOT NULL DEFAULT 1, created_at TEXT"
                  " NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_pol_denuncias ("
                  " den_id TEXT PRIMARY KEY, complainant TEXT"
                  " NOT NULL, against_person TEXT NOT NULL"
                  " DEFAULT '', facts TEXT NOT NULL, status TEXT"
                  " NOT NULL DEFAULT 'ingresada', police_actor"
                  " TEXT NOT NULL DEFAULT '', created_at TEXT"
                  " NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_pol_wanted ("
                  " wanted_id TEXT PRIMARY KEY, person_id TEXT"
                  " NOT NULL DEFAULT '', zid TEXT NOT NULL"
                  " DEFAULT '', reason TEXT NOT NULL, ref_case"
                  "_id TEXT NOT NULL DEFAULT '', status TEXT"
                  " NOT NULL DEFAULT 'buscado', requested_by"
                  " TEXT NOT NULL DEFAULT '', created_at TEXT"
                  " NOT NULL DEFAULT '')",
                  "CREATE TABLE IF NOT EXISTS ax_pol_captures ("
                  " cap_id TEXT PRIMARY KEY, wanted_id TEXT NOT"
                  " NULL, by_agent TEXT NOT NULL, captured_at"
                  " TEXT NOT NULL DEFAULT '', released_at TEXT"
                  " NOT NULL DEFAULT '')",
              )


              def ensure_db(db):
                  for stmt in _DDL:
                      db.execute(stmt)


              def register_agent_db(db, *, name, unit="",
                                    created_at=""):
