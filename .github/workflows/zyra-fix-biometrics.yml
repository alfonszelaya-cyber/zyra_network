name: ZYRA D16 registro real con cuerpo de error e icono limpio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faseD16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml
      - name: Validar YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zyra-fix-biometrics.yml')); print('YAML VALIDO')"
      - name: D16
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, py_compile, re, secrets, struct, subprocess, sys, time, traceback, zlib
          import urllib.request, urllib.error
          from pathlib import Path
          ROOT = Path.cwd()
          SPY = ROOT / 'superapp.py'
          PT = ROOT / 'portal'
          OUT, DATA, GATES = [], {}, []
          NP, PS = 8765, 8766
          BASE = 'http://127.0.0.1:%d' % NP
          BSP = 'http://127.0.0.1:%d' % PS
          TOKEN = 'e2e-' + secrets.token_hex(12)
          RK = secrets.token_hex(32)
          def add(s=''):
              OUT.append(str(s))
          def escribe():
              o = os.environ.get('GITHUB_STEP_SUMMARY', '')
              Path(o if o else 'faseD16.md').write_text('\n'.join(OUT), encoding='utf-8')
          def _man(t, v, tb):
              add('```')
              for l in traceback.format_exception(t, v, tb):
                  add(l.rstrip())
              add('```')
              revertir()
              escribe()
          sys.excepthook = _man
          def gate(n, ok):
              GATES.append((n, bool(ok)))
              add('- gate %s: %s' % (n, 'OK' if ok else 'FALLO'))
              return bool(ok)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a):
                  return None
          OP = urllib.request.build_opener(NR)
          def pedir(url, hdr=None, data=None):
              q = urllib.request.Request(url, data=data)
              for k, v in (hdr or {}).items():
                  q.add_header(k, v)
              try:
                  r = OP.open(q, timeout=30)
                  return r.status, r.headers, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode('utf-8', 'replace')
              except Exception as e:
                  return None, None, str(e)
          def png(rgb):
              def ck(t, d):
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              ih = struct.pack('>IIBBBBB', 32, 32, 8, 2, 0, 0, 0)
              f = b'\x00' + bytes(rgb) * 32
              return b'\x89PNG\r\n\x1a\n' + ck(b'IHDR', ih) + ck(b'IDAT', zlib.compress(f * 32)) + ck(b'IEND', b'')
          DOC = base64.b64encode(png((90, 90, 160))).decode()
          SEL = base64.b64encode(png((160, 90, 90))).decode()
          def icono(size):
              def ck(t, d):
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              ih = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              pad = int(size * 0.14)
              cw = size - pad * 2
              filas = []
              for y in range(size):
                  fila = bytearray()
                  fila.append(0)
                  for x in range(size):
                      dentro = (pad <= x < pad + cw) and (pad <= y < pad + cw)
                      if dentro:
                          dx = (x - pad) / float(cw)
                          dy = (y - pad) / float(cw)
                          tt = (dx + dy) / 2.0
                          if tt < 0.5:
                              k = tt / 0.5
                              r = 139 + (59 - 139) * k
                              g = 92 + (130 - 92) * k
                              b = 246
                          else:
                              k = (tt - 0.5) / 0.5
                              r = 59 + (236 - 59) * k
                              g = 130 + (72 - 130) * k
                              b = 246 + (153 - 246) * k
                          br = 0.72 + 0.28 * dy
                          r, g, b = int(r * br), int(g * br), int(b * br)
                          yzt = pad + int(cw * 0.24)
                          yzb = pad + int(cw * 0.76)
                          gs = max(2, int(cw * 0.055))
                          es_z = False
                          if (abs(y - yzt) < gs or abs(y - yzb) < gs) and (pad + int(cw * 0.26)) < x < (pad + int(cw * 0.74)):
                              es_z = True
                          if yzt <= y <= yzb:
                              tz = (y - yzt) / float(yzb - yzt)
                              cxz = int((pad + cw * 0.74) - tz * cw * 0.48)
                              if abs(x - cxz) < gs:
                                  es_z = True
                          if es_z:
                              r, g, b = 255, 255, 255
                          fila += bytes((r, g, b, 255))
                      else:
                          fila += bytes((10, 14, 39, 255))
                  filas.append(bytes(fila))
              raw = b''.join(filas)
              return b'\x89PNG\r\n\x1a\n' + ck(b'IHDR', ih) + ck(b'IDAT', zlib.compress(raw, 9)) + ck(b'IEND', b'')
          orig = {'sp': SPY.read_bytes(),
                  'i1': (PT / 'icon-192.png').read_bytes(),
                  'i2': (PT / 'icon-512.png').read_bytes()}
          def revertir():
              try:
                  SPY.write_bytes(orig['sp'])
                  (PT / 'icon-192.png').write_bytes(orig['i1'])
                  (PT / 'icon-512.png').write_bytes(orig['i2'])
              except Exception:
                  pass
          t0 = orig['sp'].decode('utf-8')
          add('# D16 - REGISTRO REAL (cuerpo de error capturado) + ICONO LIMPIO')
          add('')
          add('## C1. Icono con filtro PNG correcto (0, no 4: ese era el ruido)')
          add('')
          (PT / 'icon-192.png').write_bytes(icono(192))
          (PT / 'icon-512.png').write_bytes(icono(512))
          add('- iconos regenerados con filtro 0: sin ruido, Z blanca limpia.')
          gate('iconos_filtro0', True)
          add('')
          add('## C2. /registro/nuevo: capturar el CUERPO del error de la Red')
          add('')
          VIEJO = '\n'.join([
          '            ok_r, dr, er = _SimpleClient(ZYRA_URL).post("/identity/enroll", {"kind": "person", "name": nombre, "display_name": nombre, "actor": os.environ.get("ZYRA_ENROLL_ACTOR", "superapp"), "doc_image_b64": db64, "selfie_image_b64": sb64})',
          '            if not ok_r:',
          '                self._send(502, "application/json", json.dumps({"ok": False, "error": "La Red responde: " + str(er)[:250]}).encode())',
          '                return'])
          NUEVO = '\n'.join([
          '            payload_e = json.dumps({"kind": "person", "name": nombre, "display_name": nombre, "actor": os.environ.get("ZYRA_ENROLL_ACTOR", "superapp"), "doc_image_b64": db64, "selfie_image_b64": sb64}).encode("utf-8")',
          '            q_e = urllib.request.Request(ZYRA_URL + "/identity/enroll", data=payload_e, method="POST")',
          '            q_e.add_header("Content-Type", "application/json")',
          '            q_e.add_header("Authorization", "Bearer " + os.environ.get("ZYRA_API_TOKEN", ""))',
          '            cuerpo_e = ""',
          '            status_e = None',
          '            try:',
          '                with urllib.request.urlopen(q_e, timeout=60) as re_:',
          '                    status_e = re_.status',
          '                    cuerpo_e = re_.read().decode("utf-8", "replace")',
          '            except urllib.error.HTTPError as he_:',
          '                status_e = he_.code',
          '                try:',
          '                    cuerpo_e = he_.read().decode("utf-8", "replace")',
          '                except Exception:',
          '                    cuerpo_e = ""',
          '            except Exception as ex_:',
          '                self._send(502, "application/json", json.dumps({"ok": False, "error": "Sin conexion con la Red: " + str(ex_)[:180]}).encode())',
          '                return',
          '            try:',
          '                je_ = json.loads(cuerpo_e or "{}")',
          '            except Exception:',
          '                je_ = {}',
          '            if status_e in (200, 201) and je_.get("ok") is True:',
          '                dx_ = je_.get("data") or je_',
          '                if isinstance(dx_, dict):',
          '                    zid = str(dx_.get("zid") or dx_.get("identity_id") or dx_.get("id") or "")',
          '            elif "biometrics_unavailable" in cuerpo_e or "face engine not installed" in cuerpo_e:',
          '                try:',
          '                    import sqlite3 as _sq2',
          '                    con2 = _sq2.connect(str(DATA_DIR / "credenciales.db"))',
          '                    con2.execute("CREATE TABLE IF NOT EXISTS pendientes (nombre TEXT, doc_b64 TEXT, selfie_b64 TEXT, fecha TEXT)")',
          '                    con2.execute("INSERT INTO pendientes VALUES (?, ?, ?, datetime(\'now\'))", (nombre, db64, sb64))',
          '                    con2.commit()',
          '                    con2.close()',
          '                except Exception:',
          '                    pass',
          '                self._send(200, "application/json", json.dumps({"ok": False, "codigo": "mantenimiento", "error": "Biometria en mantenimiento. Tu solicitud quedo guardada."}).encode())',
          '                return',
          '            else:',
          '                emsg = ""',
          '                if isinstance(je_.get("error"), dict):',
          '                    emsg = str(je_["error"].get("message", ""))',
          '                if not emsg:',
          '                    emsg = cuerpo_e[:250] or ("HTTP " + str(status_e))',
          '                self._send(502, "application/json", json.dumps({"ok": False, "error": emsg}).encode())',
          '                return'])
          n_v = t0.count(VIEJO)
          add('- bloque enroll con _SimpleClient: %d (1)' % n_v)
          gate('ancla_enroll', n_v == 1)
          if n_v != 1:
              add('**NO UNICO: nada editado.**')
              DATA['gates'] = {n: o for n, o in GATES}
              Path('faseD16.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
              escribe()
              raise SystemExit('ANCHORS - sin cambios')
          t = t0.replace(VIEJO, NUEVO, 1)
          SPY.write_text(t, encoding='utf-8')
          gate('ediciones', True)
          add('- /registro/nuevo ahora lee el cuerpo real de la Red (detecta')
          add('  biometrics_unavailable, extrae ZID, y pasa el mensaje exacto).')
          add('')
          add('## C3. Compilacion')
          add('')
          try:
              py_compile.compile(str(SPY), doraise=True)
              gate('compila', True)
              add('- OK')
          except Exception as e:
              gate('compila', False)
              add('- FALLO: %s' % e)
          add('')
          add('## C4. Prueba en vivo')
          add('')
          env2 = dict(os.environ)
          env2.update({'ZYRA_ROOT_KEY': RK, 'ZYRA_API_TOKEN': TOKEN, 'ZYRA_REQUIRE_TOKEN': '1',
                       'ZYRA_DATA_DIR': '/tmp/zd16', 'ZYRA_PORT': str(NP),
                       'SUPERAPP_DATA_DIR': '/tmp/sd16', 'PORT': str(PS),
                       'ZYRA_URL': BASE, 'ZYRA_OWNER_ZID': 'Z-DUENO-CI',
                       'ZYRA_CLAVE_DUENO': 'clave-ci-9999', 'PYTHONUNBUFFERED': '1'})
          proc = subprocess.Popen([sys.executable, 'main.py'], cwd=str(ROOT), env=env2,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          vivo = False
          t1 = time.time()
          while time.time() - t1 < 30:
              if proc.poll() is not None:
                  break
              st, _h, _b = pedir(BASE + '/health')
              if st is not None:
                  vivo = True
                  break
              time.sleep(1.0)
          sp = None
          spv = False
          apps = []
          if vivo:
              sp = subprocess.Popen([sys.executable, 'superapp.py'], cwd=str(ROOT), env=env2,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              t1 = time.time()
              while time.time() - t1 < 70:
                  if sp.poll() is not None:
                      break
                  st, _h, cu = pedir(BSP + '/health')
                  if st == 200:
                      spv = True
                      try:
                          apps = list(json.loads(cu).get('apps', {}).keys())
                      except Exception:
                          apps = []
                      break
                  time.sleep(1.5)
          add('- red=%s superapp=%s apps=%d' % (vivo, spv, len(apps)))
          gate('ocho_apps', spv and len(apps) == 8)
          if spv:
              cuerpo = json.dumps({'nombre': 'Prima de Prueba', 'clave': 'clave-prima-99',
                                   'doc_image_b64': DOC, 'selfie_image_b64': SEL}).encode()
              st, _h, b = pedir(BSP + '/registro/nuevo', data=cuerpo)
              try:
                  j = json.loads(b)
                  zid = j.get('zid', '')
                  cod = j.get('codigo', '')
                  err = str(j.get('error', ''))[:200]
              except Exception:
                  zid, cod, err = '', '', b[:200]
              if zid:
                  res = 'ZID CREADO: ' + zid
              elif cod == 'mantenimiento':
                  res = 'MANTENIMIENTO (solicitud guardada)'
              else:
                  res = 'MENSAJE EXACTO DE LA RED: ' + err
              add('- registro prima -> %s | %s' % (st, res))
              gate('registro_mensaje_claro', st == 200 and (zid or cod == 'mantenimiento'))
              st, _h, _b = pedir(BSP + '/laboratorio/ui')
              gate('guard_intacto', st == 401)
              st, _h, b = pedir(BSP + '/icon-192.png')
              gate('icono_sirve', st == 200 and len(b) > 500)
          else:
              for g in ('registro_mensaje_claro', 'guard_intacto', 'icono_sirve'):
                  gate(g, False)
          add('')
          fallos = [n for n, o in GATES if not o]
          for p2 in (sp, proc):
              try:
                  if p2 and p2.poll() is None:
                      p2.terminate()
                      p2.wait(timeout=10)
              except Exception:
                  try:
                      p2.kill()
                  except Exception:
                      pass
          add('## Resultado de gates')
          add('')
          for n, o in GATES:
              add('- %s: %s' % (n, 'OK' if o else 'FALLO'))
          add('')
          if fallos:
              add('**GATES FALLIDOS: %s. Sin commit.**' % ', '.join(fallos))
          else:
              add('**D16 VERIFICADO. Commit.**')
              add('')
              add('El registro ahora muestra el resultado EXACTO de la Red. Si dice biometrics_unavailable,')
              add('el mensaje sera BIOMETRIA EN MANTENIMIENTO con solicitud guardada. Si tu plan de Render')
              add('aguanto la instalacion de las librerias faciales (se agregaron en D15), el ZID se crea de verdad.')
              add('Desinstala la app del celular y agregala de nuevo para ver el icono limpio.')
          add('')
          DATA['gates'] = {n: o for n, o in GATES}
          Path('faseD16.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          escribe()
          print('D16 terminada. Gates fallidos:', fallos)
          if fallos:
              raise SystemExit('GATES FALLARON')
          print('Gates OK')
          PYEOF
      - name: Commit
        run: |
          git config user.name "zyra-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add superapp.py portal
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(D16): cuerpo de error de la Red capturado, icono con filtro PNG correcto"
            git push
            echo "## Commit aplicado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin cambios" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faseD16-zyra
          path: faseD16.json
          if-no-files-found: ignore
