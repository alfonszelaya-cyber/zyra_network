name: ZYRA LABORATORIO - Lote 1A-5 (UI real, capturador de documentos y 3 botones)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lote:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar, escribir y verificar (Reglas 1, 2, 3 y 6)
        run: |
          set -e
          MANIFEST=/tmp/lab_lote_1a5.manifest
          : > "$MANIFEST"
          escribir() {
            ruta="$1"
            if [ -s "$ruta" ]; then
              echo "PROTEGIDO: $ruta"
              echo "$ruta|PROTEGIDO" >> "$MANIFEST"
            else
              cat > "$ruta"
              echo "ESCRITO: $ruta"
              echo "$ruta|ESCRITO" >> "$MANIFEST"
            fi
          }
          mkdir -p apps/laboratorio/infrastructure/services apps/laboratorio/application/services apps/laboratorio/application/handlers apps/laboratorio/application/use_cases apps/laboratorio/templates/dashboards apps/laboratorio/routers/public apps/laboratorio/routers/api apps/laboratorio/modules apps/laboratorio/assets/logos apps/laboratorio/assets/icons apps/laboratorio/assets/templates apps/laboratorio/assets/translations
          echo "=== ACTUALIZACION POR ANCLAS: app.py y service_registry.py ==="
          python3 - << 'PYANCHOR'
          from pathlib import Path
          p = Path("apps/laboratorio/infrastructure/api/app.py")
          codigo = p.read_text(encoding="utf-8")
          ancla1 = "from apps.laboratorio.routers.public.health import registrar_rutas as registrar_salud"
          ancla2 = "registrar_salud(app)"
          assert ancla1 in codigo, "ANCLA 1 ausente en app.py: abortando"
          assert ancla2 in codigo, "ANCLA 2 ausente en app.py: abortando"
          cambios = []
          if "registrar_ui(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.routers.public.ui import registrar_rutas as registrar_ui")
              codigo = codigo.replace(ancla2, ancla2 + "\n    registrar_ui(app)")
              cambios.append("ui")
          if "conectar_captura(app)" not in codigo:
              codigo = codigo.replace(ancla1, ancla1 + "\n    from apps.laboratorio.modules.capture_module import conectar as conectar_captura")
              codigo = codigo.replace(ancla2, ancla2 + "\n    conectar_captura(app)")
              cambios.append("captura")
          p.write_text(codigo, encoding="utf-8")
          print("app.py ACTUALIZADO:", ", ".join(cambios) if cambios else "ya estaba")
          p2 = Path("apps/laboratorio/registry/services/service_registry.py")
          codigo2 = p2.read_text(encoding="utf-8")
          if "manejador_documentos" not in codigo2:
              a_imp = "from apps.laboratorio.application.use_cases.create_project import CasoCrearProyecto"
              assert a_imp in codigo2, "ANCLA import ausente en service_registry.py: abortando"
              codigo2 = codigo2.replace(
                  a_imp,
                  a_imp + "\nfrom apps.laboratorio.application.handlers.document_handler import ManejadorDocumentos\nfrom apps.laboratorio.application.use_cases.create_project_from_document import CasoCrearProyectoDesdeDocumento",
              )
              a_reg = '    c.obtener("suscriptor_zyra")'
              assert a_reg in codigo2, "ANCLA registro ausente en service_registry.py: abortando"
              nuevos = (
                  '    c.registrar("caso_crear_desde_documento", lambda _c: CasoCrearProyectoDesdeDocumento(_c.obtener("caso_crear_proyecto")))\n'
                  '    c.registrar("manejador_documentos", lambda _c: ManejadorDocumentos(_c.obtener("caso_crear_desde_documento"), _c.obtener("auditoria_sink")))\n'
              )
              codigo2 = codigo2.replace(a_reg, nuevos + a_reg)
              p2.write_text(codigo2, encoding="utf-8")
              print("service_registry.py ACTUALIZADO: servicios de documentos registrados")
          else:
              print("service_registry.py: ya contenia los servicios de documentos")
          PYANCHOR
          echo "apps/laboratorio/infrastructure/api/app.py|ACTUALIZADO" >> "$MANIFEST"
          echo "apps/laboratorio/registry/services/service_registry.py|ACTUALIZADO" >> "$MANIFEST"
          echo "=== MOTOR DE PLANTILLAS ==="
          escribir apps/laboratorio/infrastructure/services/template_render.py << 'ZYRA_EOF'
          """Motor de plantillas minimo y seguro: sustitucion con auto-escape.

          Convencion: {{clave}} escapa el valor; {{clave!raw}} lo inserta tal
          cual (solo para HTML ya construido con escape interno). Una clave
          ausente aborta el render: nunca se publica una pagina incompleta.
          """
          import re

          from apps.laboratorio.infrastructure.security.html_sanitizer import escapar

          PATRON = re.compile(r"\{\{\s*([a-zA-Z_][a-zA-Z0-9_]*)(!raw)?\s*\}\}")


          def render(plantilla: str, contexto: dict) -> str:
              if not isinstance(plantilla, str) or not plantilla.strip():
                  raise ValueError("Plantilla vacia o invalida.")
              if not isinstance(contexto, dict):
                  raise ValueError("El contexto debe ser un dict.")

              def _reemp(m):
                  clave = m.group(1)
                  crudo = bool(m.group(2))
                  if clave not in contexto:
                      raise ValueError("Falta clave de plantilla: " + clave)
                  valor = contexto[clave]
                  texto = valor if isinstance(valor, str) else str(valor)
                  return texto if crudo else escapar(texto)

              return PATRON.sub(_reemp, plantilla)


          def validar_plantilla(plantilla: str) -> list:
              """Devuelve las claves que la plantilla requiere."""
              return sorted({m.group(1) for m in PATRON.finditer(plantilla)})
          ZYRA_EOF
          echo "=== PARSER DE DOCUMENTOS (capturador real) ==="
          escribir apps/laboratorio/application/services/document_parser.py << 'ZYRA_EOF'
          """Parser de documentos: convierte texto libre en datos de proyecto.

          Produccion real y deterministica: recibe cualquier documento pegado
          (una ley, una idea de negocio, una finca, un edificio, una app),
          extrae el titulo (primera linea), la descripcion (el resto) y
          detecta el tipo de creacion oficial por palabras clave del dominio.
          """

          import re

          from apps.laboratorio.shared.enums.creation_type import CreationType

          MINIMO_CARACTERES = 20
          MAXIMO_CARACTERES = 50000
          TITULO_MAX = 200
          DESCRIPCION_MAX = 2000

          PALABRAS_POR_TIPO = {
              "ley": ("ley", "decreto", "articulo", "reforma", "legislativo", "legislacion", "jurisdiccion"),
              "arquitectura": ("edificio", "construccion", "arquitectura", "fachada", "planta baja", "planos", "vivienda", "estructura"),
              "negocio": ("negocio", "tienda", "comercio", "ventas", "clientes", "emprendimiento", "sucursal"),
              "app": ("app", "aplicacion", "software", "plataforma", "pantalla", "usuarios", "movil", "sistema"),
              "agro": ("finca", "cultivo", "ganado", "cosecha", "siembra", "parcela", "agricola", "riego", "ganadera", "manzanas"),
              "empleo": ("empleo", "trabajador", "vacante", "contratacion", "candidato", "salario", "puesto de trabajo"),
              "educacion": ("escuela", "estudiante", "educacion", "beca", "universidad", "maestro", "clases", "colegio", "prekinder"),
              "producto": ("producto", "maquina", "invento", "prototipo", "fabricar", "manufactura", "piezas"),
              "gobierno": ("gobierno", "politica", "ministerio", "alcaldia", "municipal", "plan nacional", "publico"),
              "infraestructura": ("carretera", "puente", "infraestructura", "obra civil", "autopista", "drenaje", "camino", "alcantarillado"),
              "presentacion": ("presentacion", "diapositiva", "exposicion", "inversionistas", "pitch", "audiencia"),
          }


          def _detectar_tipo(texto: str) -> tuple:
              minusculas = texto.lower()
              conteo = {}
              for tipo, palabras in PALABRAS_POR_TIPO.items():
                  total = 0
                  for palabra in palabras:
                      total += len(re.findall(r"\b" + re.escape(palabra) + r"\b", minusculas))
                  if total:
                      conteo[tipo] = total
              if not conteo:
                  return CreationType.PRESENTACION.value, False, 0
              mejor = max(conteo, key=lambda k: conteo[k])
              return mejor, True, conteo[mejor]


          def parsear_documento(texto) -> dict:
              """Convierte un documento en titulo + descripcion + tipo detectado."""
              if not isinstance(texto, str):
                  raise ValueError("El documento debe ser texto.")
              limpio = texto.strip()
              if len(limpio) < MINIMO_CARACTERES:
                  raise ValueError(
                      "Documento demasiado corto: se requieren al menos "
                      + str(MINIMO_CARACTERES) + " caracteres."
                  )
              if len(limpio) > MAXIMO_CARACTERES:
                  raise ValueError(
                      "Documento demasiado largo: maximo "
                      + str(MAXIMO_CARACTERES) + " caracteres."
                  )
              lineas = [l.strip() for l in limpio.splitlines() if l.strip()]
              if not lineas:
                  raise ValueError("Documento vacio.")
              titulo = lineas[0][:TITULO_MAX].strip()
              if not titulo:
                  raise ValueError("No se pudo extraer un titulo del documento.")
              descripcion = " ".join(lineas[1:])[:DESCRIPCION_MAX].strip()
              tipo, detectado, coincidencias = _detectar_tipo(limpio)
              return {
                  "titulo": titulo,
                  "descripcion": descripcion,
                  "tipo": tipo,
                  "tipo_detectado": detectado,
                  "coincidencias": coincidencias,
                  "palabras": len(limpio.split()),
                  "lineas": len(lineas),
              }
          ZYRA_EOF
          echo "=== SERVICIO DE UI ==="
          escribir apps/laboratorio/application/services/ui_fases.py << 'ZYRA_EOF'
          """Fase del plan aprobado en la que vive cada menu (Ley 1: honesto).

          Un menu con fase mayor a 1 declara que su backend llega en esa fase;
          la UI lo muestra y sus botones aparecen deshabilitados con motivo.
          """

          FASE_POR_MENU = {
              "inicio": 1,
              "simular": 1,
              "capturar": 2,
              "comprender": 2,
              "disenar": 2,
              "biblioteca": 3,
              "crear": 3,
              "cuatro_d": 4,
              "probar": 5,
              "comparar": 5,
              "optimizar": 5,
              "renderizar": 6,
              "presentar": 7,
              "exportar": 7,
              "proyectar": 8,
              "salidas": 8,
              "red": 9,
              "gobierno": 10,
          }
          ZYRA_EOF
          escribir apps/laboratorio/application/services/ui_service.py << 'ZYRA_EOF'
          """Servicio de UI: construye las vistas desde las fuentes unicas.

          Fuentes: menu_tree (dueño unico de navegacion), role_definitions
          (menus por rol), es.json (textos), ui_tokens.json (sistema de
          diseno declarativo). Ley 3: maximo 3 botones por vista. Ley 1:
          los paneles sin backend declaran su fase, nunca simulan.
          """
          import json
          from pathlib import Path
          from urllib.parse import quote

          from apps.laboratorio.application.services.ui_fases import FASE_POR_MENU
          from apps.laboratorio.constants.permissions.permission_codes import PermisoCodigo
          from apps.laboratorio.infrastructure.security.html_sanitizer import escapar
          from apps.laboratorio.infrastructure.services.template_render import render
          from apps.laboratorio.permissions.roles.role_definitions import menus_de
          from apps.laboratorio.registry.menus.menu_tree import MENUS, existe as existe_menu
          from apps.laboratorio.shared.enums.creation_type import CreationType
          from apps.laboratorio.shared.exceptions.domain_errors import EntidadNoEncontradaError

          RAIZ_APP = Path(__file__).resolve().parents[2]
          RUTA_PLANTILLAS = RAIZ_APP / "templates" / "dashboards"
          RUTA_TRADUCCIONES = RAIZ_APP / "assets" / "translations"

          ICONO_POR_MENU = {
              "inicio": "i-home", "capturar": "i-capturar", "comprender": "i-comprender",
              "disenar": "i-disenar", "crear": "i-crear", "cuatro_d": "i-4d",
              "simular": "i-simular", "probar": "i-probar", "comparar": "i-comparar",
              "optimizar": "i-optimizar", "renderizar": "i-render", "presentar": "i-presentar",
              "proyectar": "i-proyectar", "salidas": "i-salidas", "exportar": "i-exportar",
              "biblioteca": "i-biblioteca", "red": "i-red", "gobierno": "i-gobierno",
          }

          _cache = {"plantillas": {}, "textos": None}


          def cargar_plantilla(nombre: str) -> str:
              if nombre not in _cache["plantillas"]:
                  ruta = RUTA_PLANTILLAS / nombre
                  if not ruta.is_file():
                      raise ValueError("Plantilla inexistente: " + nombre)
                  _cache["plantillas"][nombre] = ruta.read_text(encoding="utf-8")
              return _cache["plantillas"][nombre]


          def textos() -> dict:
              if _cache["textos"] is None:
                  ruta = RUTA_TRADUCCIONES / "es.json"
                  if not ruta.is_file():
                      raise ValueError("Catalogo de textos ausente: es.json")
                  datos = json.loads(ruta.read_text(encoding="utf-8"))
                  if not isinstance(datos, dict):
                      raise ValueError("es.json debe ser un objeto JSON.")
                  _cache["textos"] = datos
              return _cache["textos"]


          def _t(clave: str) -> str:
              return str(textos().get(clave, clave))


          def rol_principal(identidad) -> str:
              return identidad.roles[0] if identidad.roles else "sin_rol"


          def _menus_permitidos(identidad) -> set:
              permitidos = set()
              for rol in identidad.roles:
                  permitidos |= set(menus_de(rol))
              return permitidos


          def _nav(identidad, menu_activo: str) -> str:
              permitidos = _menus_permitidos(identidad)
              grupos = {}
              for m in MENUS:
                  if m["id"] in permitidos:
                      grupos.setdefault(m["grupo"], []).append(m)
              partes = []
              for grupo in sorted(grupos):
                  partes.append('<div class="grupo"><div class="grupo-titulo">' + escapar(grupo) + "</div>")
                  for m in grupos[grupo]:
                      clase = "nav-item activo" if m["id"] == menu_activo else "nav-item"
                      icono = ICONO_POR_MENU.get(m["id"], "i-home")
                      partes.append(
                          '<a class="' + clase + '" href="/laboratorio/ui/' + m["id"] + '">'
                          + '<svg class="ic" aria-hidden="true"><use href="/laboratorio/ui/assets/icons.svg#' + icono + '"/></svg>'
                          + "<span>" + escapar(m["nombre"]) + "</span></a>"
                      )
                  partes.append("</div>")
              return "\n".join(partes)


          def _botones(botones, fase: int, vivo: bool) -> str:
              partes = []
              for b in botones:
                  if vivo:
                      partes.append(
                          '<button class="btn btn-primary" data-accion="' + escapar(b) + '">'
                          + escapar(b) + "</button>"
                      )
                  else:
                      partes.append(
                          '<button class="btn btn-ghost" disabled title="'
                          + escapar(_t("ui.fase") + " " + str(fase)) + '">'
                          + escapar(b) + '<span class="badge">F' + str(fase) + "</span></button>"
                      )
              return "\n".join(partes)


          def _pagina(titulo: str, nav: str, contenido: str, identidad) -> str:
              esqueleto = cargar_plantilla("base.html")
              return render(esqueleto, {
                  "titulo": titulo,
                  "nav": nav,
                  "contenido": contenido,
                  "rol_nombre": rol_principal(identidad),
                  "zid": identidad.zid,
                  "roles": ",".join(identidad.roles),
              })


          def render_home(identidad, repo_proyectos) -> str:
              proyectos = repo_proyectos.listar({"propietario_zid": identidad.zid}, 50, 0)
              filas = []
              for p in proyectos:
                  filas.append(
                      "<tr><td>" + escapar(p.titulo) + "</td>"
                      + '<td><span class="pill">' + escapar(p.tipo_creacion.value) + "</span></td>"
                      + "<td>" + escapar(p.etapa_actual.value) + "</td>"
                      + '<td><a class="link" href="/laboratorio/api/v1/projects/'
                      + str(p.id) + '/scenarios">escenarios</a></td></tr>'
                  )
              cuerpo_tabla = "\n".join(filas) or (
                  '<tr><td colspan="4" class="vacio">' + escapar(_t("ui.sin_proyectos")) + "</td></tr>"
              )
              seccion_crear = ""
              if identidad.tiene_permiso(PermisoCodigo.PROYECTO_CREAR):
                  opciones = "".join(
                      '<option value="' + t.value + '">' + escapar(t.value) + "</option>"
                      for t in CreationType
                  )
                  seccion_crear = render(cargar_plantilla("crear.html"), {
                      "btn_nuevo": _t("ui.nuevo_proyecto"),
                      "btn_documento": _t("ui.documento"),
                      "btn_simular": _t("ui.simular"),
                      "ayuda_doc": _t("ui.ayuda_doc"),
                      "titulo_opcional": _t("ui.titulo_opcional"),
                      "tipo_auto": _t("ui.tipo_auto"),
                      "placeholder_doc": _t("ui.placeholder_doc"),
                      "btn_crear_doc": _t("ui.crear_doc"),
                      "opciones_tipo": opciones,
                  })
              contenido = render(cargar_plantilla("home.html"), {
                  "saludo": "Hola, " + identidad.zid,
                  "total_proyectos": str(len(proyectos)),
                  "seccion_crear": seccion_crear,
                  "filas": cuerpo_tabla,
              })
              return _pagina("Inicio - ZYRA LABORATORIO", _nav(identidad, "inicio"), contenido, identidad)


          def _tabla_simulacion(identidad, repo_proyectos, repo_escenarios) -> str:
              proyectos = repo_proyectos.listar({"propietario_zid": identidad.zid}, 50, 0)
              filas = []
              for p in proyectos:
                  escs = repo_escenarios.listar({"proyecto_id": p.id}, 20, 0)
                  resumen = ", ".join(e.tipo.value + ": " + e.titulo for e in escs)
                  filas.append(
                      "<tr><td>" + escapar(p.titulo) + "</td><td>"
                      + escapar(resumen or "sin escenarios") + "</td>"
                      + '<td><a class="link" href="/laboratorio/api/v1/projects/'
                      + str(p.id) + '/scenarios">ver JSON</a></td></tr>'
                  )
              cuerpo = "\n".join(filas) or (
                  '<tr><td colspan="3" class="vacio">' + escapar(_t("ui.sin_proyectos")) + "</td></tr>"
              )
              return (
                  '<section class="tarjeta"><h2>Proyectos y escenarios (datos reales)</h2>'
                  + '<table><thead><tr><th>Proyecto</th><th>Escenarios</th><th>API</th></tr></thead>'
                  + "<tbody>" + cuerpo + "</tbody></table></section>"
              )


          def render_panel(identidad, menu_id: str, sub_nombre: str, repo_proyectos, repo_escenarios) -> str:
              if not existe_menu(menu_id):
                  raise EntidadNoEncontradaError("Menu inexistente.", menu_id)
              permitidos = _menus_permitidos(identidad)
              if menu_id not in permitidos:
                  from apps.laboratorio.shared.exceptions.domain_errors import PermisoDenegadoError
                  raise PermisoDenegadoError(
                      "Tu rol no tiene acceso al menu " + menu_id + "."
                  )
              menu = next(m for m in MENUS if m["id"] == menu_id)
              fase = FASE_POR_MENU.get(menu_id, 10)
              vivo = menu_id in ("inicio", "simular")
              tabs = []
              for s in menu["submenus"]:
                  activa = ' class="tab activo"' if s["nombre"] == sub_nombre else ' class="tab"'
                  tabs.append(
                      '<a' + activa + ' href="/laboratorio/ui/' + menu_id
                      + "?sub=" + quote(s["nombre"]) + '">' + escapar(s["nombre"]) + "</a>"
                  )
              tabs_html = "\n".join(tabs) or '<span class="tab activo">Vista general</span>'
              sub_actual = None
              for s in menu["submenus"]:
                  if s["nombre"] == sub_nombre:
                      sub_actual = s
                      break
              if sub_actual is None and menu["submenus"]:
                  sub_actual = menu["submenus"][0]
              botones_html = ""
              if sub_actual is not None:
                  botones_html = _botones(sub_actual["botones"], fase, vivo)
              estado_html = (
                  '<div class="estado ok">' + escapar(_t("ui.en_vivo")) + "</div>"
                  if vivo
                  else '<div class="estado">' + escapar(_t("ui.fase") + " " + str(fase)) + "</div>"
              )
              extra = ""
              if menu_id == "simular":
                  extra = _tabla_simulacion(identidad, repo_proyectos, repo_escenarios)
              contenido = render(cargar_plantilla("panel.html"), {
                  "menu_nombre": menu["nombre"],
                  "sub_nombre": sub_actual["nombre"] if sub_actual else "Vista general",
                  "tabs": tabs_html,
                  "estado": estado_html,
                  "botones": botones_html,
                  "extra": extra,
              })
              return _pagina(
                  menu["nombre"] + " - ZYRA LABORATORIO",
                  _nav(identidad, menu_id), contenido, identidad,
              )
          ZYRA_EOF
          escribir apps/laboratorio/application/services/template_check.py << 'ZYRA_EOF'
          """Verificacion de integridad de las plantillas HTML de UI."""

          from apps.laboratorio.application.services.ui_service import cargar_plantilla


          def verificar_plantillas() -> int:
              """Valida que las 4 plantillas existan y sean legibles."""
              total = 0
              for nombre in ("base.html", "home.html", "panel.html", "crear.html"):
                  cargar_plantilla(nombre)
                  total += 1
              return total
          ZYRA_EOF
          echo "=== CAPA DE APLICACION: DOCUMENTOS (2) ==="
          escribir apps/laboratorio/application/use_cases/create_project_from_document.py << 'ZYRA_EOF'
          """Caso de uso: crear proyecto desde cualquier documento pegado.

          Reusa CasoCrearProyecto (cero duplicacion): parsea el documento,
          permite titulo/tipo manual como override, y agrega evidencia del
          parseo al resultado.
          """

          from apps.laboratorio.application.commands.project_commands import (
              ComandoCrearProyecto,
          )
          from apps.laboratorio.application.services.document_parser import (
              parsear_documento,
          )
          from apps.laboratorio.shared.enums.creation_type import CreationType


          class CasoCrearProyectoDesdeDocumento:
              def __init__(self, caso_crear):
                  if caso_crear is None:
                      raise ValueError("Requiere el caso de creacion de proyectos.")
                  self._caso_crear = caso_crear

              def ejecutar(self, identidad, texto_documento: str, titulo: str = None, tipo: str = None) -> dict:
                  parseo = parsear_documento(texto_documento)
                  titulo_final = parseo["titulo"]
                  if titulo is not None:
                      if not isinstance(titulo, str) or not titulo.strip():
                          raise ValueError("El titulo manual no puede estar vacio.")
                      titulo_final = titulo.strip()[:200]
                  if tipo is not None:
                      tipo_final = CreationType.validar(tipo).value
                  else:
                      tipo_final = parseo["tipo"]
                  comando = ComandoCrearProyecto(
                      titulo=titulo_final,
                      descripcion=parseo["descripcion"],
                      tipo=tipo_final,
                      etiquetas=("documento",),
                      propietario_zid=identidad.zid,
                  )
                  resultado = self._caso_crear.ejecutar(comando, identidad)
                  resultado["documento"] = {
                      "palabras": parseo["palabras"],
                      "lineas": parseo["lineas"],
                      "tipo_detectado": parseo["tipo_detectado"],
                      "coincidencias": parseo["coincidencias"],
                      "tipo_usado": tipo_final,
