          '<div id="resp"></div>\n'
          '<button type="submit" id="bcrear">Crear mi ZID</button>\n'
          '</form>\n'
          '<p style="margin-top:14px"><a href="/">Volver</a> | <a href="/entrar">Ya tengo ZID</a></p>\n'
          '</div>\n<script>\n'
          'var flujo=new MediaStream();\n'
          'function abrirCam(){navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(function(s){flujo=s;document.getElementById("cam").srcObject=s;});}\n'
          'function capturar(video){var c=document.getElementById("lienzo");if(!c){c=document.createElement("canvas");c.id="lienzo";c.style.display="none";document.body.appendChild(c);}c.width=video.videoWidth||640;c.height=video.videoHeight||480;c.getContext("2d").drawImage(video,0,0);return c.toDataURL("image/jpeg",0.85).split(",")[1];}\n'
          'function tomarSelfie(){var v=document.getElementById("cam");if(!v.srcObject){alert("Abre la camara primero");return;}var b=capturar(v);document.getElementById("bself").dataset.selfie=b;document.getElementById("bself").classList.add("hecho");document.getElementById("bself").textContent="Selfie capturada";}\n'
          'function usarDocArchivo(){var f=document.getElementById("doc");if(!f.files[0]){alert("Elige el archivo del documento primero");return;}var r=new FileReader();r.onload=function(){document.getElementById("doc").dataset.b64=r.result.split(",")[1];f.classList.add("hecho");};r.readAsDataURL(f.files[0]);}\n'
          'document.getElementById("doc").addEventListener("change",usarDocArchivo);\n'
          'async function enviar(ev){ev.preventDefault();\n'
          'var c1=document.getElementById("clave").value,c2=document.getElementById("clave2").value;\n'
          'if(c1!==c2){resp("Las claves no coinciden.");return false;}\n'
          'var docb=document.getElementById("doc").dataset.b64;\n'
          'var selfb=document.getElementById("bself").dataset.selfie;\n'
          'if(!docb){resp("Captura o elige la foto del documento.");return false;}\n'
          'if(!selfb){resp("Captura tu selfie en vivo.");return false;}\n'
          'resp("Enviando a la Red... verificando biometria...");\n'
          'var r=await fetch("/registro/nuevo",{method:"POST",headers:{"Content-Type":"application/json"},'
          'body:JSON.stringify({nombre:document.getElementById("nombre").value,clave:c1,'
          'doc_image_b64:docb,selfie_image_b64:selfb})});\n'
          'var j=await r.json();\n'
          'if(j.ok&&j.zid){document.getElementById("resp").innerHTML='
          '"<p>La Red creo tu identidad:</p><p class=\'zid\'>"+j.zid+"</p>"'
          '+"<p>Guarda tu ZID y tu clave. Con ellos entras a las apps autorizadas.</p>"'
          '+"<p><a href=\'/entrar\'>Entrar con mi ZID</a></p>";}'
          'else{resp(j.error||"La Red no pudo completar el registro. Intenta de nuevo.");}\n'
          'return false;}\n'
          'function resp(m){document.getElementById("resp").innerHTML="<p>"+m+"</p>";}\n'
          '</script>\n</body>\n</html>\n'
          )
          regf.write_text(REG, encoding='utf-8')
          add('- registro.html: nombre + foto de documento + selfie con camara + clave.')
          add('- Todo viaja a /registro/nuevo y de ahi a /identity/enroll de la Red.')
          gate('registro_biometrico_html', True)
          add('')

