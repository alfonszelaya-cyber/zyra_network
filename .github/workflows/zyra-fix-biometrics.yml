          SUM = __import__("os").environ.get("GITHUB_STEP_SUMMARY", "")
          def out(t):
              print(t, flush=True)
              if SUM:
                  with open(SUM, "a", encoding="utf-8") as f:
                      f.write(t + "\n")
          def D(s):
              return textwrap.dedent(s)
          def forzar(ruta, contenido):
              try:
                  ast.parse(contenido)
                  p = pathlib.Path(ruta)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(contenido, encoding="utf-8")
                  py_compile.compile(ruta, doraise=True)
                  out("- " + p.name + " (" + str(p.parent.name)
                      + "): OK")
              except Exception:
                  out("- **" + ruta + ": ERROR**")
                  out("```\n" + traceback.format_exc().strip()
                      + "\n```")

          MENUS = {
            "accounting/menu.py": ("accounting", "Contabilidad", "Resumen contable|Libro diario|Libro mayor|Balances|Cierres"),
            "accounting/asientos/menu.py": ("accounting", "Asientos Contables", "Registrar asiento|Consultar asientos|Validar asiento"),
