name: "RED-ID: campos universales del documento (id_country/id_type/id_number/nationality) + universal_view + tests"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: red-work
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "Paso A - portable_profile.py: extender ALL_FIELDS (4 campos universales)"
        run: |
          python3 - <<'F1EOF'
          import ast
          from pathlib import Path
          p = Path(
              "shared_engines/network/"
              "portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if '"id_country"' in t:
              print("SKIP (campos ya presentes)")
              raise SystemExit(0)
          VIEJO = (
              'ALL_FIELDS = (\n'
              '    "display_name",\n'
              '    "contact",\n'
              '    "national_id",\n'
              '    "birth_date",\n'
              '    "address",\n'
              ')\n'
          )
          NUEVO = (
              'ALL_FIELDS = (\n'
              '    "display_name",\n'
              '    "contact",\n'
              '    "national_id",\n'
              '    "id_country",\n'
              '    "id_type",\n'
              '    "id_number",\n'
              '    "nationality",\n'
              '    "birth_date",\n'
              '    "address",\n'
              ')\n'
          )
          cnt = t.count(VIEJO)
          assert cnt == 1, (
              "ancla ALL_FIELDS hallada "
              + str(cnt) + " (esperaba 1)")
          t = t.replace(VIEJO, NUEVO, 1)
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          assert '"id_country"' in p.read_text(
              encoding="utf-8")
          print("OK ALL_FIELDS extendida con"
                " 4 campos universales (AST valido)")
          F1EOF

      - name: "Paso B - metodos nuevos: universal_view (paquete del verificador) + age_of (derivada de birth_date) - append al final con indent forzada"
        run: |
          python3 - <<'MEOF'
          import ast
          import textwrap
          from pathlib import Path
          p = Path(
              "shared_engines/network/"
              "portable_profile.py")
          t = p.read_text(encoding="utf-8")
          if "def universal_view(" in t:
              print("SKIP metodos (ya presentes)")
              raise SystemExit(0)
          CUERPO = textwrap.dedent('''\
              def age_of(birth_date: str) -> int:
                  """Edad DERIVADA de birth_date
                  (nunca se guarda: no caduca).
                  Formato ISO YYYY-MM-DD."""
                  import datetime
                  parts = str(birth_date).split(
                      "-")
                  if len(parts) != 3:
                      raise ValueError(
                          "birth_date must be"
                          " YYYY-MM-DD")
                  nac = datetime.date(
                      int(parts[0]),
                      int(parts[1]),
                      int(parts[2]))
                  hoy = datetime.date.today()
                  edad = hoy.year - nac.year
                  if ((hoy.month, hoy.day)
                          < (nac.month,
                             nac.day)):
                      edad -= 1
                  return edad


              _UNIVERSAL_FIELDS = (
                  "display_name",
                  "national_id",
                  "id_country",
                  "id_type",
                  "id_number",
                  "nationality",
                  "birth_date",
                  "address",
              )

              _UNIVERSAL_METHODS = (
                  "register_app",
                  "set_field",
                  "view_for_app",
              )
          ''')
          METODOS = textwrap.indent(
              textwrap.dedent('''\
                  def universal_view(
                      self,
                      *,
                      app_id: str,
                      zid: str,
                  ) -> dict[str, object]:
                      """AX-ID: EL paquete del
                      verificador (banco, consulado,
                      empleador). Identidad universal
                      de una consulta: campos
                      universales con nivel,
                      edad DERIVADA de birth_date,
                      y auditoria del acceso. La
                      app debe tener scope sobre
                      los campos que ve (mismo
                      esquema de view_for_app)."""
                      require_non_empty_str(
                          app_id, "app_id")
                      require_non_empty_str(
                          zid, "zid")
                      scopes = self.app_scopes(
                          app_id)
                      if scopes is None:
                          raise PermissionError(
                              "app not registered:"
                              " " + app_id)
                      vista = self.view_for_app(
                          app_id=app_id, zid=zid)
                      campos = {}
                      niveles = {}
                      for f in (
                          _UNIVERSAL_FIELDS
                      ):
                          if f not in (
                              vista.fields
                          ):
                              continue
                          campos[f] = (
                              vista.fields[f])
                          niveles[f] = (
                              vista.levels[f])
                      edad = None
                      if "birth_date" in campos:
                          edad = age_of(
                              campos[
                                  "birth_date"])
                      self._audit.append(
                          event_type=(
                              "network.profile"
                              ".universal_access"
                          ),
                          actor=app_id,
                          subject=zid,
                          payload={
                              "fields": sorted(
                                  campos.keys()),
                          },
                      )
                      return {
                          "zid": zid,
                          "status": "profile",
                          "fields": campos,
                          "levels": niveles,
                          "age": edad,
                      }
              '''), "    ")
          t = (t.rstrip("\n") + "\n\n"
               + METODOS.rstrip("\n") + "\n")
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          print("OK age_of + universal_view"
                " (AST valido)")
          MEOF

      - name: "Paso C - verificacion dura inmediata: clase intacta + metodo nuevo + campos vivos"
        run: |
          python3 -c "
          from shared_engines.network.portable_profile import (
              ProfileRegistry, age_of, ALL_FIELDS)
          for m in ('register_app', 'set_field',
                    'view_for_app'):
              assert hasattr(ProfileRegistry, m), m
          assert hasattr(ProfileRegistry,
              'universal_view'), 'universal_view falta'
          assert 'id_country' in ALL_FIELDS
          assert 'id_type' in ALL_FIELDS
          assert 'id_number' in ALL_FIELDS
          assert 'nationality' in ALL_FIELDS
          assert age_of('2000-05-10') >= 24
          print('OK: clase intacta + universal_view + 4 campos universales + age derivada')
          "

      - name: "Paso D - tests: Maria (Guatemala/pasaporte) + Juan (El Salvador/DUI) + edad + niveles + audit"
        run: |
          python3 - <<'TSEOF'
          import ast
          import textwrap
          from pathlib import Path
          cand = [
              Path("shared_engines/network/tests/"
                   "test_portable_profile.py"),
              Path("shared_engines/network/tests/"
                   "test_document_exchange.py"),
          ]
          target = None
          for c in cand:
              if c.exists():
                  target = c
                  break
          assert target is not None, (
              "no encontre archivo de tests de"
              " network; revisar")
          t = target.read_text(encoding="utf-8")
          if "test_universal_id_maria_and_juan" in t:
              print("SKIP tests (ya presentes)")
              raise SystemExit(0)
          EXTRA = textwrap.dedent('''\


              def test_universal_id_maria_and_juan(
                  tmp_path,
              ) -> None:
                  """AX-ID: identidad universal.
                  Maria (Guatemala, pasaporte) y
                  Juan (El Salvador, DUI) con
                  campos tipados, edad derivada,
                  niveles, audit. La Red no
                  depende del pais."""
                  import time
                  from shared_engines.network.portable_profile import (
                      ProfileRegistry)
                  from shared_engines.audit.chain import (
                      AuditTrail)
                  from shared_engines.events.outbox import (
                      Outbox)
                  from shared_engines.events.contracts import (
                      EventCatalog)
                  from shared_engines.storage.database import (
                      SQLiteAdapter)
                  from shared_engines.common.clocks import (
                      FrozenClock)
                  db = SQLiteAdapter(
                      tmp_path / "id.db")
                  clock = FrozenClock()
                  audit = AuditTrail(db, clock)
                  outbox = Outbox(db, clock)
                  outbox.ensure_schema()
                  cat = EventCatalog()
                  for et in (
                      "network.profile.updated",
                      "network.profile.accessed",
                      "network.profile.universal_access",
                  ):
                      cat.register(et)
                  reg = ProfileRegistry(
                      db, clock, audit=audit,
                      outbox=outbox)
                  reg.register_app(
                      app_id="banco-ny",
                      display_name="Banco NY",
                      scopes=(
                          "display_name",
                          "national_id",
                          "id_country",
                          "id_type",
                          "id_number",
                          "nationality",
                          "birth_date",
                          "address",
                      ),
                  )
                  maria_zid = ("ZID-maria-gt"
                               "-000000000001")
                  reg.set_field(
                      zid=maria_zid,
                      field="display_name",
                      value="Maria Perez",
                      verified=True)
                  reg.set_field(
                      zid=maria_zid,
                      field="id_country",
                      value="GT",
                      verified=True)
                  reg.set_field(
                      zid=maria_zid,
                      field="id_type",
                      value="passport",
                      verified=True)
                  reg.set_field(
                      zid=maria_zid,
                      field="id_number",
                      value="GT-PASS-8842",
                      verified=True)
                  reg.set_field(
                      zid=maria_zid,
                      field="nationality",
                      value="GT",
                      verified=True)
                  reg.set_field(
                      zid=maria_zid,
                      field="birth_date",
                      value="1998-03-15",
                      verified=True)
                  reg.set_field(
                      zid=maria_zid,
                      field="address",
                      value="Cdad de Guatemala")
                  juan_zid = ("ZID-juan-sv"
                             "-000000000001")
                  reg.set_field(
                      zid=juan_zid,
                      field="display_name",
                      value="Juan Lopez",
                      verified=True)
                  reg.set_field(
                      zid=juan_zid,
                      field="id_country",
                      value="SV",
                      verified=True)
                  reg.set_field(
                      zid=juan_zid,
                      field="id_type",
                      value="dui",
                      verified=True)
                  reg.set_field(
                      zid=juan_zid,
                      field="id_number",
                      value="00000000-0",
                      verified=True)
                  reg.set_field(
                      zid=juan_zid,
                      field="nationality",
                      value="SV",
                      verified=True)
                  reg.set_field(
                      zid=juan_zid,
                      field="birth_date",
                      value="1990-06-01",
                      verified=True)
                  v = reg.universal_view(
                      app_id="banco-ny",
                      zid=maria_zid)
                  assert v["fields"][
                      "id_country"] == "GT"
                  assert v["fields"][
                      "id_type"] == "passport"
                  assert v["age"] >= 24, str(
                      v["age"])
                  assert v["levels"][
                      "id_number"
                  ] == "VERIFIED"
                  assert (v["levels"][
                      "address"]
                      == "SELF_DECLARED"), str(
                      v["levels"])
                  assert v["fields"].get(
                      "contact") is None, (
                      "scope limita: contact no"
                      " fue pedido")
                  vj = reg.universal_view(
                      app_id="banco-ny",
                      zid=juan_zid)
                  assert vj["fields"][
                      "id_type"] == "dui"
                  assert vj["fields"][
                      "id_country"] == "SV"
                  assert vj["age"] >= 33
                  rows = db.query_all(
                      "SELECT event_type FROM"
                      " events_outbox WHERE"
                      " event_type ="
                      " 'network.profile"
                      ".universal_access'")
                  assert len(rows) >= 2, str(
                      len(rows))
                  print("OK AX-ID: Maria GT pasaporte"
                        " y Juan SV DUI, edad derivada,"
                        " niveles y audit funcionando")
          ''')
          t = t.rstrip("\n") + "\n" + EXTRA
          ast.parse(t)
          p.write_text(t, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert ("test_universal_id_maria"
                  "_and_juan" in final)
          print("OK test universal_id (AST valido)")
          TSEOF

      - name: "Paso E - GATE Red (shared_engines completo)"
        run: |
          python3 -m pytest shared_engines -q --tb=short 2>&1 | tail -8

      - name: "Paso F - GATE apps (4 apps)"
        run: |
          python3 -m pytest apps/axis/tests apps/axis/life_history/tests apps/subastas/tests apps/semilla/tests -q --tb=short 2>&1 | tail -4

      - name: "Paso G - SOLO SI FALLO: diagnostico al Resumen"
        if: failure()
        run: |
          {
            echo "## DIAGNOSTICO RED-ID"
            echo '```'
            python3 -m pytest shared_engines/network -vv --tb=long 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Commit and push (solo si verde)
        run: |
          git config user.name "zyra-pilot-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "RED-ID: identidad universal - campos tipados del documento (id_country/id_type/id_number/nationality) + universal_view + edad derivada" -m "El ZID ya era universal de raiz (tabla identities SIN pais). Ahora el documento legal tambien es universal: 4 campos nuevos en ALL_FIELDS (id_country, id_type: dui/dni/passport/id_usa, id_number, nationality) - el documento nacional es un ATRIBUTO anexado al ZID, no su raiz (regla 15). age_of(): la edad se DERIVA de birth_date, nunca se guarda (no caduca). universal_view(): EL paquete del verificador (banco/consulado/empleador) - campos universales con nivel VERIFIED/SELF_DECLARED + edad + audit del acceso (network.profile.universal_access). Probado: Maria (Guatemala, pasaporte) y Juan (El Salvador, DUI) en la misma Red, mismo mecanismo. Scopes siguen limitando lo que cada app ve."
          fi
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "PUSH OK"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "PUSH FAILED"
          exit 1
