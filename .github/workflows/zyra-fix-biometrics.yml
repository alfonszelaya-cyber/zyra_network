name: "ZYRA AUDIT (solo lectura)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias tolerantes
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest httpx
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          if [ -f shared_engines/requirements.txt ]; then
            python3 -m pip install -r shared_engines/requirements.txt || true
          fi
          echo "DEPENDENCIAS OK"

      - name: Mapa del repo
        run: |
          echo "===== TESTS ====="
          find . -name "test_*.py" -type f | sort || true
          echo ""
          echo "===== CONFTEST ====="
          find . -name "conftest.py" -type f | sort || true
          echo ""
          echo "===== REQUIREMENTS ====="
          find . -name "requirements*.txt" -type f | sort || true
          echo ""
          echo "===== CORE_PREFIXES ====="
          grep -rn "CORE_PREFIXES" shared_engines --include='*.py' | head -20 || true
          echo ""
          echo "===== BIOMETRIC_TEMPLATES ====="
          grep -rn "biometric_templates" shared_engines --include='*.py' | head -20 || true
          echo ""
          echo "===== CREATE TABLE ====="
          grep -rn "CREATE TABLE" shared_engines --include='*.py' | head -40 || true
          echo ""
          echo "===== SEEDS (imagenes) ====="
          grep -rn "doc_image_b64" shared_engines --include='*.py' | head -15 || true
          grep -rn "selfie_image_b64" shared_engines --include='*.py' | head -15 || true

      - name: Codigo relevante (ventanas dinamicas)
        run: |
          dump() {
            f="$1"; pat="$2"; ctx="${3:-50}"
            echo ""
            echo "##### $f :: '$pat'"
            if [ ! -f "$f" ]; then
              echo "!!!!! NO EXISTE EL ARCHIVO"
              return 0
            fi
            loc=$(grep -n "$pat" "$f" 2>/dev/null | head -1 | cut -d: -f1 || true)
            if [ -z "$loc" ]; then
              echo "!!!!! SIN COINCIDENCIAS"
              return 0
            fi
            grep -n "$pat" "$f" 2>/dev/null | head -12 || true
            start=$((loc - 5))
            if [ "$start" -lt 1 ]; then start=1; fi
            end=$((loc + ctx))
            echo "----- lineas $start-$end -----"
            awk -v s="$start" -v e="$end" 'NR>=s && NR<=e {printf "%5d| %s\n", NR, $0}' "$f"
            return 0
          }

          APIF=$(find . -name "combined_api.py" -type f | head -1 || true)
          TRT=$(find . -name "test_runtime_api.py" -type f | head -1 || true)
          TCA=$(find . -name "test_capabilities_api.py" -type f | head -1 || true)
          TPI=$(find . -name "test_portable_identity.py" -type f | head -1 || true)
          echo "API=$APIF"
          echo "TRT=$TRT"
          echo "TCA=$TCA"
          echo "TPI=$TPI"

          if [ -n "$APIF" ]; then
            echo ""
            echo "================ COMBINED_API: CABECERA ================"
            awk 'NR<=60 {printf "%5d| %s\n", NR, $0}' "$APIF" || true
            echo "================ COMBINED_API: PUNTOS CLAVE ================"
            dump "$APIF" "CORE_PREFIXES" 25
            dump "$APIF" "FastAPI(" 25
            dump "$APIF" "include_router" 30
            dump "$APIF" "verify-existence" 45
            dump "$APIF" "verification-verdict" 45
            dump "$APIF" "expediente" 45
            dump "$APIF" "biometric" 30
            dump "$APIF" "death" 45
            dump "$APIF" "deceased" 25
          fi

          if [ -n "$TRT" ]; then
            echo ""
            echo "================ TEST_RUNTIME_API ================"
            dump "$TRT" "def test_verify_existence_public" 55
            dump "$TRT" "def test_death_lifecycle_deceased" 70
          fi
          if [ -n "$TCA" ]; then
            echo ""
            echo "================ TEST_CAPABILITIES_API ================"
            dump "$TCA" "def test_verification_verdict_signed" 60
          fi
          if [ -n "$TPI" ]; then
            echo ""
            echo "================ TEST_PORTABLE_IDENTITY ================"
            dump "$TPI" "def test_expediente_legal_pedro" 60
          fi
          exit 0

      - name: Coleccion global
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          echo "===== COLECCION (errores de import se ven aqui) ====="
          python3 -m pytest shared_engines --collect-only -q 2>&1 | tail -25 || true

      - name: Tracebacks de los 4 tests
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          TRT=$(find . -name "test_runtime_api.py" -type f | head -1 || true)
          TCA=$(find . -name "test_capabilities_api.py" -type f | head -1 || true)
          TPI=$(find . -name "test_portable_identity.py" -type f | head -1 || true)
          t() {
            echo ""
            echo "======================================================"
            echo "##### $1"
            echo "======================================================"
            python3 -m pytest "$1" -vv --tb=long 2>&1 | tail -70 || true
          }
          t "$TRT::test_verify_existence_public" || true
          t "$TRT::test_death_lifecycle_deceased" || true
          t "$TCA::test_verification_verdict_signed" || true
          t "$TPI::test_expediente_legal_pedro" || true
          exit 0
