                         VehiclesEngine, AgriculturalLandEngine,
                         ArtEngine, BusinessAssetsEngine,
                         CollectiblesEngine]
              for cls in engines:
                  db = SQLiteAdapter(tmp_path / (cls.__name__
                                                 + ".db"))
                  eng = cls(db, clock)
