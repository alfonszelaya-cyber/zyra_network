name: "RED-1 paso 2: reproducir rama exacta en-proceso + serializacion (SOLO LECTURA)"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: red-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "1. En-proceso: timeline(keyword) + dumps del payload de la rama + _ok"
        run: |
          python3 - <<'PROEOF'
          import base64, json, threading, time
          import traceback
          import urllib.request
          from shared_engines.storage.database import (
              SQLiteAdapter)
          from shared_engines.common.clocks import (
              FrozenClock)
          from shared_engines.runtime.config import (
              RuntimeConfig)
          from shared_engines.runtime.kernel import (
              ZyraKernel)
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities)
          from shared_engines.runtime.combined_api import (
              serve_combined)
          from shared_engines.verification.signatures import (
              Ed25519Signer)
          from shared_engines.security.biometrics import (
              BiometricsEngine, BiometricsPolicy,
              DeterministicTestProvider, TemplateCipher)
          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=net_db, clock=FrozenClock(),
              signer=signer,
              config=RuntimeConfig(
                  host="127.0.0.1", port=0,
                  api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=net_db, clock=FrozenClock(),
              audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(
                  master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(
              net_db, FrozenClock(),
              identity=kernel.identity,
              signer=signer)
          srv = serve_combined(
              kernel, caps,
              host="127.0.0.1", port=0)
          threading.Thread(
              target=srv.serve_forever,
              daemon=True).start()
          time.sleep(0.4)
          base = ("http://127.0.0.1:"
              + str(srv.server_address[1]))
          req = urllib.request.Request(
              base + "/identity/enroll",
              data=json.dumps({
                  "kind": "person",
                  "display_name": "User Red12",
                  "actor": "audit",
                  "doc_image_b64": base64.b64encode(
                      b"red12-history-user"
                      ).decode("ascii"),
                  "selfie_image_b64": base64.b64encode(
                      b"red12-history-user"
                      ).decode("ascii"),
              }).encode(),
              method="POST",
              headers={"Content-Type":
                  "application/json"})
          with urllib.request.urlopen(
              req, timeout=15) as r:
              body = json.loads(r.read().decode())
          zid = ((body.get("data") or {}).get(
              "identity") or {}).get("zid")
          print("ZID=" + str(zid))
          assert zid

          print()
          print("### A. timeline EN-PROCESO (keyword, como el server)")
          try:
              tl = caps.history.timeline(zid=zid)
              print("timeline OK: " + str(len(list(tl)))
                    + " entradas (nuevo zid = 0 esperado)")
          except Exception:
              print("timeline FALLO:")
              traceback.print_exc()

          print()
          print("### B. append un evento (para probar serializacion con contenido)")
          try:
              entry = caps.history.append(
                  zid=zid,
                  entry_type="network.history.appended",
                  actor_app="audit",
                  payload={"prueba": "red1",
                           "valor": 123})
              print("append OK: seq="
                    + str(getattr(entry, "entry_seq",
                        "?")))
          except Exception:
              print("append FALLO:")
              traceback.print_exc()

          print()
          print("### C. serializar EXACTO como la rama _route_get")
          try:
              tl = caps.history.timeline(zid=zid)
              replica = [
                  {
                      "seq": e.entry_seq,
                      "type": e.entry_type,
                      "actor": e.actor_app,
                      "payload": e.payload,
                      "hash": e.content_hash,
                  }
                  for e in tl
              ]
              crudo = json.dumps(replica)
              print("json.dumps RAMA OK ("
                    + str(len(crudo)) + " bytes)")
          except TypeError as te:
              print("CAUSA CONFIRMADA DEL 500:")
              print("json.dumps TypeError -> "
                    + str(te))
              traceback.print_exc()
          except Exception as exc:
              print("CAUSA CONFIRMADA (otro tipo):")
              traceback.print_exc()

          print()
          print("### D. que serializa _ok (codigo real)")
          from shared_engines.runtime import api as _api
          import inspect
          src = inspect.getsource(
              _api.ZyraApiHandler._ok)
          print(src)
          PROEOF

      - name: "2. HTTP con el mismo zid para correlacionar (500 vs causa en-proceso)"
        run: |
          python3 - <<'HTTPEOF'
          import base64, json, threading, time
          import urllib.error, urllib.request
          from shared_engines.storage.database import (
              SQLiteAdapter)
          from shared_engines.common.clocks import (
              FrozenClock)
          from shared_engines.runtime.config import (
              RuntimeConfig)
          from shared_engines.runtime.kernel import (
              ZyraKernel)
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities)
          from shared_engines.runtime.combined_api import (
              serve_combined)
          from shared_engines.verification.signatures import (
              Ed25519Signer)
          from shared_engines.security.biometrics import (
              BiometricsEngine, BiometricsPolicy,
              DeterministicTestProvider, TemplateCipher)
          net_db = SQLiteAdapter(":memory:")
          signer, _ = Ed25519Signer.generate()
          kernel = ZyraKernel(
              db=net_db, clock=FrozenClock(),
              signer=signer,
              config=RuntimeConfig(
                  host="127.0.0.1", port=0,
                  api_token=None))
          kernel.bootstrap_root()
          kernel._biometrics = BiometricsEngine(
              db=net_db, clock=FrozenClock(),
              audit=kernel.audit,
              provider=DeterministicTestProvider(),
              cipher=TemplateCipher(
                  master_key_hex="ab" * 32),
              policy=BiometricsPolicy(
                  require_liveness=False,
                  doc_reject=0.01, doc_review=0.02,
                  doc_auto=0.03, dup_reject=0.98))
          caps = ZyraCapabilities(
              net_db, FrozenClock(),
              identity=kernel.identity,
              signer=signer)
          srv = serve_combined(
              kernel, caps,
              host="127.0.0.1", port=0)
          threading.Thread(
              target=srv.serve_forever,
              daemon=True).start()
          time.sleep(0.4)
          base = ("http://127.0.0.1:"
              + str(srv.server_address[1]))
          req = urllib.request.Request(
              base + "/identity/enroll",
              data=json.dumps({
                  "kind": "person",
                  "display_name": "User HTTP",
                  "actor": "audit",
                  "doc_image_b64": base64.b64encode(
                      b"http-history-user"
                      ).decode("ascii"),
                  "selfie_image_b64": base64.b64encode(
                      b"http-history-user"
                      ).decode("ascii"),
              }).encode(),
              method="POST",
              headers={"Content-Type":
                  "application/json"})
          with urllib.request.urlopen(
              req, timeout=15) as r:
              body = json.loads(r.read().decode())
          zid = ((body.get("data") or {}).get(
              "identity") or {}).get("zid")
          print("ZID=" + str(zid))
          try:
              with urllib.request.urlopen(
                  base + "/history/" + zid,
                  timeout=15) as r:
                  print("GET /history -> "
                        + str(r.status)
                        + " " + r.read().decode(
                            "utf-8",
                            "replace")[:300])
          except urllib.error.HTTPError as e:
              print("GET /history -> "
                    + str(e.code)
                    + " " + e.read().decode(
                        "utf-8",
                        "replace")[:300])
          HTTPEOF

      - name: "Contexto"
        run: |
          git log --oneline -3
