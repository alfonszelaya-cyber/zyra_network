name: "ZYRA AUDIT RED-5 (currency en vivo)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout || true
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          echo "DEPS OK"

      - name: Mapa currency
        run: |
          {
          echo "## Mapa currency"
          echo '```'
          echo "=== archivos ==="
          find shared_engines/currency -name "*.py" | sort || true
          echo ""
          echo "=== defs del engine ==="
          grep -n "^class \|    def \|^def " shared_engines/currency/engine.py | head -40 || true
          echo ""
          echo "=== exchange_rates en el repo ==="
          grep -rn "exchange_rates" shared_engines --include='*.py' | head -15 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Fuente engine.py currency
        run: |
          {
          echo "## currency/engine.py completo"
          echo '```python'
          awk '{printf "%5d| %s\n", NR, $0}' shared_engines/currency/engine.py 2>/dev/null | head -300 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Fuente tests currency
        run: |
          {
          echo "## test_currency.py"
          echo '```python'
          awk '{printf "%5d| %s\n", NR, $0}' shared_engines/currency/tests/test_currency.py 2>/dev/null | head -200 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Sonda proveedores publicos (heredoc limpio)
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          python3 << 'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import urllib.request

          URLS = [
              "https://open.er-api.com/v6/latest/USD",
              "https://api.frankfurter.app/latest?from=USD&to=EUR",
              "https://api.exchangerate.host/latest?base=USD",
          ]
          print("## Proveedores publicos de tasas (prueba en vivo)")
          print("```")
          for url in URLS:
              print("--- " + url)
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "zyra-network-audit"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      d = json.loads(r.read().decode())
                  rates = (d.get("rates")
                           or d.get("conversion_rates") or {})
                  pares = {
                      k: rates.get(k)
                      for k in ("EUR", "GTQ", "HNL",
                                "NIO", "MXN")}
                  print("OK | monedas:", len(rates),
                        "|", json.dumps(pares))
              except Exception as e:
                  print("FALLO:",
                        type(e).__name__,
                        str(e)[:100])
          print("```")
          EOF
          exit 0

      - name: Suite currency actual
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/shared_engines"
          {
          echo "## Suite currency actual"
          echo '```'
          timeout 120 python3 -m pytest shared_engines/currency/tests -q --timeout=45 --timeout-method=thread --tb=line 2>&1 | tail -10 || true
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
