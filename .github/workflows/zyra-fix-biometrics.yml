name: ZYRA Fase 2 verificacion previa a la edicion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fase2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificacion fina de solo lectura
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, re
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = []
          DATA = {}

          def add(s=''):
              OUT.append(str(s))

          def txt(p):
              try:
                  return p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return ''

          def numbered(path, limit=200):
              ls = txt(path).splitlines()
              out = []
              for i, l in enumerate(ls[:limit]):
                  out.append('%d: %s' % (i + 1, l.rstrip()))
              if len(ls) > limit:
                  out.append('... (%d lineas en total)' % len(ls))
              return out

          add('# FASE 2 - VERIFICACION FINA (solo lectura, sin cambios)')
          add('')
          add('Objetivo: ver el codigo exacto antes de editar la autenticacion.')
          add('')

          add('## A. Re-inventario tras la limpieza de pyc')
          add('')
          n_files = n_py = n_pyc = 0
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              n_files += 1
              if p.suffix == '.py':
                  n_py += 1
              elif p.suffix.lower() == '.pyc':
                  n_pyc += 1
          add('- archivos: %d (previa 6968, delta esperado por limpieza de pyc)' % n_files)
          add('- python: %d (debe seguir en 4506, si bajo se perdio codigo)' % n_py)
          add('- pyc en disco: %d (esperado 0)' % n_pyc)
          DATA['inventario'] = {'archivos': n_files, 'py': n_py, 'pyc': n_pyc}
          add('')

          add('## B. Cliente canonico COMPLETO (base de la edicion de auth)')
          add('')
          canon = ROOT / 'shared_engines' / 'network' / 'network_client.py'
          if canon.exists():
              add('`shared_engines/network/network_client.py` (%d bytes):' % canon.stat().st_size)
              add('```python')
              for ln in numbered(canon):
                  add(ln)
              add('```')
          else:
              add('NO EXISTE el cliente canonico')
          add('')

          add('## C. Shims de las apps (deben heredar la auth del canonico)')
          add('')
          apps7 = ('agro', 'axis', 'ciclo_digital', 'mi_primer_empleo',
                   'nexo', 'semilla', 'subastas')
          hashes = {}
          for a in apps7:
              sp = ROOT / 'apps' / a / 'infrastructure' / 'network' / 'network_client.py'
              if sp.exists():
                  hashes[a] = hashlib.sha256(sp.read_bytes()).hexdigest()[:12]
          add('- Hash por shim: %s' % json.dumps(hashes))
          if hashes:
              vals = set(hashes.values())
              add('- Shims identicos entre si: %s (%d grupos de %d shims)' % (len(vals) == 1, len(vals), len(hashes)))
          prim = ROOT / 'apps' / 'agro' / 'infrastructure' / 'network' / 'network_client.py'
          if prim.exists():
              add('')
              add('Shim de ejemplo (agro) completo:')
              add('```python')
              for ln in numbered(prim):
                  add(ln)
              add('```')
          ev = ROOT / 'apps' / 'nexo' / 'infrastructure' / 'network' / 'event_client.py'
          if ev.exists():
              add('')
              add('nexo event_client.py (lineas con import/headers/auth):')
              add('```python')
              for i, l in enumerate(txt(ev).splitlines()):
                  if re.search(r'import|headers|authorization|token', l, re.I):
                      add('%d: %s' % (i + 1, l.rstrip()[:150]))
              add('```')
          DATA['shim_hashes'] = hashes
          add('')

          add('## D. superapp.py: como construye el cliente y salud')
          add('')
          ls = txt(ROOT / 'superapp.py').splitlines()
          hits = []
          for i, l in enumerate(ls):
              if re.search(r'NetworkClient\(|ZYRA_URL|ZYRA_HOST|/health|api_token', l, re.I):
                  hits.append('%d: %s' % (i + 1, l.strip()[:150]))
          add('%d lineas relevantes:' % len(hits))
          add('```python')
          for h in hits[:40]:
              add(h)
          add('```')
          add('')

          add('## E. main.py: todas las lecturas de entorno')
          add('')
          ls = txt(ROOT / 'main.py').splitlines()
          add('```python')
          for i, l in enumerate(ls):
              if re.search(r'environ|getenv', l):
                  add('%d: %s' % (i + 1, l.strip()[:150]))
          add('```')
          add('')

          add('## F. NAMESPACE_MANIFEST verificado (check corregido)')
          add('')
          rows = []
          seccion = ''
          for ln in txt(ROOT / 'NAMESPACE_MANIFEST.md').splitlines():
              if ln.startswith('## '):
                  seccion = ln[3:].strip()
                  continue
              s = ln.strip()
              if s.startswith('|') and s.count('|') >= 2:
                  cells = [c.strip() for c in s.strip('|').split('|')]
                  if len(cells) >= 2 and cells[0].endswith('/') and cells[0] != 'Namespace':
                      rows.append((seccion, cells[0].strip('`* '), cells[1].strip('`* ')))
          add('Filas de namespace detectadas: %d' % len(rows))
          contras = []
          for seccion, ns, label in rows[:60]:
              lab = label.upper()
              base = None
              if 'shared_engines' in seccion.lower():
                  base = ROOT / 'shared_engines' / ns.rstrip('/')
              impl = 0
              if base is not None and base.is_dir():
                  for x in base.rglob('*.py'):
                      if x.name == '__init__.py':
                          continue
                      try:
                          if x.stat().st_size > 0:
                              impl += 1
                      except OSError:
                          pass
              marca = ''
              if lab.startswith('FUTURE') and impl > 0:
                  marca = 'CONTRADICCION: FUTURE pero tiene %d modulos con codigo' % impl
                  contras.append({'ns': ns, 'label': lab, 'impl': impl})
              elif lab in ('ACTIVO', 'ACTIVA', 'ACTIVE', 'ESTABLE') and impl == 0:
                  marca = 'CONTRADICCION: activo sin implementacion'
                  contras.append({'ns': ns, 'label': lab, 'impl': 0})
              add('- (%s) %s [%s] modulos=%d %s' % (seccion, ns, lab, impl, marca))
          DATA['manifiesto_contradicciones'] = contras
          add('')
          add('Nota: el check anterior recortaba la barra final (ai/ se volvia ai) y saltaba todas las filas. Corregido: ahora cuenta modulos reales excluyendo __init__.py.')
          add('')

          add('## G. Quien referencia verificar.js y app.js')
          add('')
          refv, refa = [], []
          for h in ROOT.rglob('*'):
              if not h.is_file() or '.git' in h.parts:
                  continue
              if h.suffix.lower() not in ('.html', '.py', '.js'):
                  continue
              t = txt(h)
              if 'verificar.js' in t:
                  refv.append(str(h.relative_to(ROOT)))
              if 'app.js' in t:
                  refa.append(str(h.relative_to(ROOT)))
          add('- verificar.js referenciado por: %s' % refv)
          add('- app.js referenciado por: %s' % refa)
          DATA['js_refs'] = {'verificar': refv, 'app': refa}
          add('')

          add('## H. ZYRA_PORT: render lo define, el codigo lo lee?')
          add('')
          add('- main.py menciona ZYRA_PORT: %s' % ('ZYRA_PORT' in txt(ROOT / 'main.py')))
          add('- superapp.py menciona ZYRA_PORT: %s' % ('ZYRA_PORT' in txt(ROOT / 'superapp.py')))
          add('')

          add('## Cierre de hallazgos previos')
          add('')
          add('- test_viva3.py:72 CERRADO: token dummy de prueba, sin rotacion necesaria.')
          add('- Grupo de 236 archivos: eran VACIOS de 1 byte (salto de linea), no relleno. .gitignore y .env.example ya tienen contenido real.')
          add('- migrations/versions sigue sin linea base (solo __init__.py).')
          add('- Pendiente de decision del propietario: LICENSE y clasificacion de ciclo_digital / futuro_os / laboratorio.')
          add('')

          Path('fase2.json').write_text(json.dumps(DATA, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          out = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if out:
              Path(out).write_text('\n'.join(OUT), encoding='utf-8')
          else:
              Path('fase2.md').write_text('\n'.join(OUT), encoding='utf-8')
          print('Fase 2 OK')
          PYEOF

      - name: Subir artefacto JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2-zyra
          path: fase2.json
          if-no-files-found: ignore
