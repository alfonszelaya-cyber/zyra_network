name: zyra-n5a-subastas-files

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-n5a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SUBASTAS NetworkClient
        run: |
          set -euo pipefail
          mkdir -p apps/subastas/infrastructure/network
          cat > apps/subastas/infrastructure/network/network_client.py <<'PYEOF'
          """SUBASTAS HTTP client to ZYRA Network."""
          from __future__ import annotations

          import json
          import os
          import urllib.request


          class NetworkClient:
              def __init__(
                  self,
                  base_url: str | None = None,
                  *,
                  timeout_seconds: float = 5.0,
                  max_retries: int = 2,
              ) -> None:
                  self._base = (
                      base_url
                      or os.environ.get("ZYRA_URL", "")
                  ).rstrip("/")
                  self._timeout = timeout_seconds
                  self._retries = max(0, max_retries)

              def get(self, path: str) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._call("GET", path)

              def post(
                  self, path: str, payload: dict
              ) -> tuple[bool, dict | None, str | None]:
                  return self._call("POST", path, payload)

              def _call(
                  self,
                  method: str,
                  path: str,
                  payload: dict | None = None,
              ) -> tuple[bool, dict | None, str | None]:
                  if not self._base:
                      return (
                          False,
                          None,
                          "ZYRA_URL not configured",
                      )
                  url = self._base + path
                  data = None
                  if payload is not None:
                      data = json.dumps(
                          payload
                      ).encode("utf-8")
                  last_error = "unknown"
                  for attempt in range(
                      self._retries + 1
                  ):
                      try:
                          request = urllib.request.Request(
                              url,
                              data=data,
                              method=method,
                              headers={
                                  "Content-Type":
                                  "application/json"
                              },
                          )
                          with urllib.request.urlopen(
                              request,
                              timeout=self._timeout,
                          ) as response:
                              body = json.loads(
                                  response.read()
                                  .decode("utf-8")
                              )
                          if body.get("ok") is True:
                              return (
                                  True,
                                  body.get("data"),
                                  None,
                              )
                          error = body.get("error", {})
                          return (
                              False,
                              None,
                              str(
                                  error.get(
                                      "message",
                                      "rejected",
                                  )
                              ),
                          )
                      except Exception as exc:
                          last_error = str(exc)
                  return False, None, last_error
          PYEOF

      - name: SubastasLink (identity + seal listings + reputation)
        run: |
          set -euo pipefail
          mkdir -p apps/subastas/services
          cat > apps/subastas/services/subastas_link.py <<'PYEOF'
          """SubastasLink: marketplace ops on the Network.
          Never raises - resilience rule."""
          from __future__ import annotations

          import base64

          from apps.subastas.infrastructure.network.network_client import (
              NetworkClient,
          )


          class SubastasLink:
              def __init__(
                  self, client: NetworkClient
              ) -> None:
                  self._client = client

              def register_app(self) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/apps/register",
                      {
                          "app_id": "subastas",
                          "display_name": (
                              "SUBASTAS - Mercado"
                          ),
                          "scopes": [
                              "display_name",
                              "contact",
                          ],
                      },
                  )

              def register_account(
                  self,
                  display_name: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": "person",
                          "display_name": display_name,
                          "actor": "subastas",
                      },
                  )

              def seal_listing(
                  self,
                  *,
                  owner_zid: str,
                  listing_id: str,
                  title: str,
                  description: str,
              ) -> tuple[bool, dict | None, str | None]:
                  content = (
                      "LISTING|"
                      + listing_id
                      + "|"
                      + title
                      + "|"
                      + description
                  ).encode("utf-8")
                  encoded = base64.b64encode(
                      content
                  ).decode("ascii")
                  return self._client.post(
                      "/documents/seal",
                      {
                          "owner_zid": owner_zid,
                          "title": "Listado: "
                          + title,
                          "content_b64": encoded,
                          "actor_app": "subastas",
                      },
                  )

              def give_reputation(
                  self,
                  subject_zid: str,
                  actor_zid: str,
                  kind: str,
                  evidence: str,
              ) -> tuple[bool, dict | None, str | None]:
                  evidence_b64 = base64.b64encode(
                      evidence.encode("utf-8")
                  ).decode("ascii")
                  return self._client.post(
                      "/reputation/record",
                      {
                          "subject_zid": subject_zid,
                          "actor_zid": actor_zid,
                          "kind": kind,
                          "evidence_b64": (
                              evidence_b64
                          ),
                      },
                  )
          PYEOF

      - name: SubastasStore (accounts, listings, bids)
        run: |
          set -euo pipefail
          mkdir -p apps/subastas/infrastructure/persistence
          cat > apps/subastas/infrastructure/persistence/subastas_store.py <<'PYEOF'
          """SUBASTAS durable store."""
          from __future__ import annotations

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "subastas",
                  (
                      "CREATE TABLE sbs_accounts ("
                      " account_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE sbs_listings ("
                      " listing_id TEXT PRIMARY KEY,"
                      " seller_account TEXT NOT NULL,"
                      " seller_zid TEXT,"
                      " title TEXT NOT NULL,"
                      " description TEXT NOT NULL,"
                      " base_price REAL NOT NULL,"
                      " document_id TEXT,"
                      " status TEXT NOT NULL"
                      " DEFAULT 'open',"
                      " winner_account TEXT,"
                      " final_price REAL,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE sbs_bids ("
                      " bid_id TEXT PRIMARY KEY,"
                      " listing_id TEXT NOT NULL,"
                      " bidder_account TEXT NOT NULL,"
                      " amount REAL NOT NULL,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class SubastasStore:
              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "subastas", _MIGRATIONS
                  ).run(clock)

              def add_account(
                  self,
                  *,
                  account_id: str,
                  zid: str | None,
                  name: str,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO sbs_accounts"
                          " (account_id, zid, name,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?)",
                          (
                              account_id,
                              zid,
                              name,
                              now,
                          ),
                      )
                  return self.get_account(account_id)

              def get_account(
                  self, account_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM sbs_accounts"
                      " WHERE account_id = ?",
                      (account_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown account:"
                          f" {account_id}"
                      )
                  zid = row["zid"]
                  return {
                      "account_id": str(
                          row["account_id"]
                      ),
                      "zid": (
                          str(zid)
                          if zid is not None
                          else None
                      ),
                      "name": str(row["name"]),
                  }

              def add_listing(
                  self,
                  *,
                  listing_id: str,
                  seller_account: str,
                  seller_zid: str | None,
                  title: str,
                  description: str,
                  base_price: float,
                  document_id: str | None,
              ) -> dict[str, object]:
                  if base_price <= 0:
                      raise ValueError(
                          "base_price must be"
                          " positive"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO sbs_listings"
                          " (listing_id,"
                          "  seller_account,"
                          "  seller_zid, title,"
                          "  description, base_price,"
                          "  document_id, status,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?,"
                          "  ?, 'open', ?)",
                          (
                              listing_id,
                              seller_account,
                              seller_zid,
                              title,
                              description,
                              base_price,
                              document_id,
                              now,
                          ),
                      )
                  return self.get_listing(listing_id)

              def get_listing(
                  self, listing_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM sbs_listings"
                      " WHERE listing_id = ?",
                      (listing_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown listing:"
                          f" {listing_id}"
                      )
                  doc = row["document_id"]
                  winner = row["winner_account"]
                  return {
                      "listing_id": str(
                          row["listing_id"]
                      ),
                      "seller_account": str(
                          row["seller_account"]
                      ),
                      "seller_zid": (
                          str(row["seller_zid"])
                          if row["seller_zid"]
                          is not None
                          else None
                      ),
                      "title": str(row["title"]),
                      "description": str(
                          row["description"]
                      ),
                      "base_price": float(
                          row["base_price"]
                      ),
                      "document_id": (
                          str(doc)
                          if doc is not None
                          else None
                      ),
                      "status": str(row["status"]),
                      "winner_account": (
                          str(winner)
                          if winner is not None
                          else None
                      ),
                      "final_price": (
                          float(row["final_price"])
                          if row["final_price"]
                          is not None
                          else None
                      ),
                  }

              def list_open(self) -> tuple[
                  dict[str, object], ...
              ]:
                  rows = self._db.query_all(
                      "SELECT listing_id FROM"
                      " sbs_listings WHERE"
                      " status = 'open'"
                      " ORDER BY created_at DESC"
                  )
                  return tuple(
                      self.get_listing(
                          str(r["listing_id"])
                      )
                      for r in rows
                  )

              def place_bid(
                  self,
                  *,
                  bid_id: str,
                  listing_id: str,
                  bidder_account: str,
                  amount: float,
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM sbs_listings"
                      " WHERE listing_id = ?"
                      " AND status = 'open'",
                      (listing_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "listing not open:"
                          f" {listing_id}"
                      )
                  seller = str(row["seller_account"])
                  if seller == bidder_account:
                      raise ValueError(
                          "seller cannot bid on"
                          " own listing"
                      )
                  top = self._db.query_one(
                      "SELECT amount FROM sbs_bids"
                      " WHERE listing_id = ?"
                      " ORDER BY amount DESC"
                      " LIMIT 1",
                      (listing_id,),
                  )
                  minimum = float(
                      row["base_price"]
                  )
                  if top is not None:
                      minimum = float(top["amount"])
                  if amount <= minimum:
                      raise ValueError(
                          "bid must exceed"
                          f" {minimum}"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO sbs_bids"
                          " (bid_id, listing_id,"
                          "  bidder_account, amount,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              bid_id,
                              listing_id,
                              bidder_account,
                              amount,
                              now,
                          ),
                      )
                  return {
                      "bid_id": bid_id,
                      "listing_id": listing_id,
                      "amount": amount,
                  }

              def close_listing(
                  self,
                  *,
                  listing_id: str,
                  seller_account: str,
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM sbs_listings"
                      " WHERE listing_id = ?"
                      " AND status = 'open'",
                      (listing_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "listing not open:"
                          f" {listing_id}"
                      )
                  if str(row["seller_account"]) != (
                      seller_account
                  ):
                      raise ValueError(
                          "only the seller can"
                          " close the listing"
                      )
                  top = self._db.query_one(
                      "SELECT bidder_account, amount"
                      " FROM sbs_bids WHERE"
                      " listing_id = ?"
                      " ORDER BY amount DESC"
                      " LIMIT 1",
                      (listing_id,),
                  )
                  winner = (
                      str(top["bidder_account"])
                      if top is not None
                      else None
                  )
                  final = (
                      float(top["amount"])
                      if top is not None
                      else float(row["base_price"])
                  )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE sbs_listings SET"
                          " status = 'sold',"
                          " winner_account = ?,"
                          " final_price = ?"
                          " WHERE listing_id = ?",
                          (
                              winner,
                              final,
                              listing_id,
                          ),
                      )
                  return self.get_listing(listing_id)

              def bids_for(
                  self, *, listing_id: str
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM sbs_bids"
                      " WHERE listing_id = ?"
                      " ORDER BY amount DESC",
                      (listing_id,),
                  )
                  return tuple(
                      {
                          "bid_id": str(
                              r["bid_id"]
                          ),
                          "bidder_account": str(
                              r["bidder_account"]
                          ),
                          "amount": float(
                              r["amount"]
                          ),
                      }
                      for r in rows
                  )
          PYEOF

      - name: SUBASTAS HTTP surface
        run: |
          set -euo pipefail
          cat > apps/subastas/server.py <<'PYEOF'
          """SUBASTAS HTTP surface."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.subastas.infrastructure.persistence.subastas_store import (
              SubastasStore,
          )
          from apps.subastas.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.subastas.services.subastas_link import (
              SubastasLink,
          )

          _CSS = (
              "body{font-family:system-ui,sans-serif;"
              "background:#0d1117;color:#e6edf3;"
              "display:flex;justify-content:center;"
              "padding:20px;margin:0}"
              ".wrap{max-width:680px;width:100%}"
              "h1{font-size:1.3rem}"
              "h2{font-size:1rem;margin-top:20px;"
              "color:#58a6ff}"
              ".card{background:#161b22;border:1px solid"
              " #30363d;border-radius:10px;padding:14px;"
              "margin-top:10px}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px 18px;border-radius:8px;"
              "font-size:1rem;cursor:pointer;margin:6px 4px"
              " 0 0;width:100%;text-align:left}"
              "button.gray{background:#30363d}"
              "input,select,textarea{width:100%;"
              "box-sizing:border-box;background:#0d1117;"
              "color:#e6edf3;border:1px solid #30363d;"
              "border-radius:6px;padding:8px;margin:4px 0;"
              "font-size:0.95rem}"
              ".ok{background:#0f2417;border:1px solid"
              " #238636;border-radius:8px;padding:10px;"
              "margin:8px 0}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html lang='es'><head>"
                  "<meta charset='utf-8'>"
                  "<meta name='viewport' content='width="
                  "device-width, initial-scale=1'>"
                  f"<title>{title}</title>"
                  f"<style>{_CSS}</style></head><body>"
                  f"<div class='wrap'>{body}</div></body>"
                  "</html>"
              )


          class SubastasApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[SubastasStore]
              link: ClassVar[SubastasLink]

              def log_message(
                  self, format: str, *args: object
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(self, method: str) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._html(
                          404,
                          _page(
                              "No encontrado",
                              "<h1>404</h1>"
                              f"<p>{exc}</p>",
                          ),
                      )
                  except ValueError as exc:
                      self._html(
                          400,
                          _page(
                              "Error",
                              "<h1>Dato invalido"
                              f"</h1><p>{exc}</p>",
                          ),
                      )
                  except Exception as exc:
                      self._html(
                          500,
                          _page(
                              "Error",
                              "<h1>Error interno"
                              f"</h1><p>{exc}</p>",
                          ),
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != ["subastas"]:
                      self._html(
                          404,
                          _page(
                              "404",
                              "<h1>Fuera de"
                              " SUBASTAS</h1>",
                          ),
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_get(s[1:])
                      return
                  store = type(self).store
                  if not s or s == ["home"]:
                      self._home()
                      return
                  if s == ["listings"]:
                      listings = store.list_open()
                      items = ""
                      for l in listings:
                          items = (
                              items
                              + "<li>• "
                              + l["title"]
                              + " - base $"
                              + str(l["base_price"])
                              + " <small>("
                              + l["listing_id"]
                              + ")</small></li>"
                          )
                      if not items:
                          items = (
                              "<li>Sin listados"
                              " abiertos</li>"
                          )
                      self._html(
                          200,
                          _page(
                              "SUBASTAS - Listados",
                              "<h1>Listados abiertos"
                              "</h1><ul>"
                              + items
                              + "</ul>"
                              "<a href='/subastas'>"
                              "<button class='gray'>"
                              "Inicio</button></a>",
                          ),
                      )
                      return
                  if s == ["summary"]:
                      listings = store.list_open()
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "open_listings": len(
                                      listings
                                  ),
                              },
                          },
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>No"
                      " encontrado</h1>"),
                  )

              def _post(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_post(s[1:])
                      return
                  store = type(self).store
                  link = type(self).link
                  doc = self._read_form()
                  if s == ["register"]:
                      name = self._req(doc, "name")
                      account_id = (
                          "SBS-"
                          + uuid.uuid4().hex[:12]
                      )
                      zid: str | None = None
                      ok, data, _error = (
                          link.register_account(name)
                      )
                      if ok and data is not None:
                          zid = str(data.get("zid"))
                      store.add_account(
                          account_id=account_id,
                          zid=zid,
                          name=name,
                      )
                      zid_text = (
                          zid
                          if zid is not None
                          else "pendiente de conexion"
                      )
                      self._html(
                          200,
                          _page(
                              "Cuenta creada",
                              "<h1>Cuenta creada"
                              "</h1>"
                              "<p>Tu ID: <b>"
                              + account_id
                              + "</b></p>"
                              "<p>Tu ZID: <b>"
                              + zid_text
                              + "</b></p>"
                              "<a href='/subastas'>"
                              "<button>Inicio"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["listing"]:
                      seller_account = self._req(
                          doc, "seller_account"
                      )
                      seller = store.get_account(
                          seller_account
                      )
                      title = self._req(
                          doc, "title"
                      )
                      description = self._req(
                          doc, "description"
                      )
                      base_price = float(
                          doc.get("base_price", 0)
                      )
                      listing_id = (
                          "LST-"
                          + uuid.uuid4().hex[:10]
                      )
                      document_id: str | None = None
                      zid = seller.get("zid")
                      if zid is not None:
                          ok, data, _error = (
                              link.seal_listing(
                                  owner_zid=str(
                                      zid
                                  ),
                                  listing_id=(
                                      listing_id
                                  ),
                                  title=title,
                                  description=(
                                      description
                                  ),
                              )
                          )
                          if (
                              ok
                              and data is not None
                          ):
                              document_id = str(
                                  data.get(
                                      "document_id"
                                  )
                              )
                      row = store.add_listing(
                          listing_id=listing_id,
                          seller_account=(
                              seller_account
                          ),
                          seller_zid=(
                              str(zid)
                              if zid is not None
                              else None
                          ),
                          title=title,
                          description=(
                              description
                          ),
                          base_price=base_price,
                          document_id=document_id,
                      )
                      sealed_text = (
                          "SELLADO en la Red"
                          if document_id
                          else "pendiente de sello"
                      )
                      self._html(
                          200,
                          _page(
                              "Listado publicado",
                              "<h1>Listado"
                              " publicado</h1>"
                              f"<p>{title} - base $"
                              + str(base_price)
                              + "</p><p>"
                              + sealed_text
                              + "</p><a href="
                              "'/subastas/listings'>"
                              "<button>Ver listados"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["bid"]:
                      listing_id = self._req(
                          doc, "listing_id"
                      )
                      bidder_account = self._req(
                          doc, "bidder_account"
                      )
                      amount = float(
                          doc.get("amount", 0)
                      )
                      bid_id = (
                          "BID-"
                          + uuid.uuid4().hex[:10]
                      )
                      result = store.place_bid(
                          bid_id=bid_id,
                          listing_id=listing_id,
                          bidder_account=(
                              bidder_account
                          ),
                          amount=amount,
                      )
                      self._html(
                          200,
                          _page(
                              "Puja registrada",
                              "<h1>Puja registrada"
                              "</h1><p>$"
                              + str(
                                  result["amount"]
                              )
                              + "</p>"
                              "<a href='/subastas/"
                              "listings'>"
                              "<button>Ver listados"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["close"]:
                      listing_id = self._req(
                          doc, "listing_id"
                      )
                      seller_account = self._req(
                          doc, "seller_account"
                      )
                      row = store.close_listing(
                          listing_id=listing_id,
                          seller_account=(
                              seller_account
                          ),
                      )
                      winner = row.get(
                          "winner_account"
                      )
                      if winner is None:
                          winner_text = (
                              "Sin pujas - quedo"
                              " sin venta"
                          )
                      else:
                          winner_text = (
                              "Ganador: "
                              + str(winner)
                          )
                      self._html(
                          200,
                          _page(
                              "Subasta cerrada",
                              "<h1>Subasta cerrada"
                              "</h1><p>"
                              + winner_text
                              + "</p><a href="
                              "'/subastas/listings'>"
                              "<button>Ver listados"
                              "</button></a>",
                          ),
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>Ruta"
                      " desconocida</h1>"),
                  )

              def _read_form(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  ).decode("utf-8")
                  doc: dict[str, Any] = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          key, value = pair.split(
                              "=", 1
                          )
                          doc[key] = value.replace(
                              "+", " "
                          )
                  return doc

              def _read_json(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  )
                  parsed: Any = json.loads(
                      raw.decode("utf-8")
                  )
                  if not isinstance(parsed, dict):
                      raise ValueError(
                          "body must be a JSON"
                          " object"
                      )
                  return {
                      str(k): v
                      for k, v in parsed.items()
                  }

              @staticmethod
              def _req(
                  doc: dict[str, Any], key: str
              ) -> str:
                  value: Any = doc.get(key)
                  if isinstance(value, int) and not isinstance(
                      value, bool
                  ):
                      value = str(value)
                  if not isinstance(value, str):
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  if not value.strip():
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  return value

              def _api_get(self, s: list[str]) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app": "subastas",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  if s == ["listings"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": list(
                                  store.list_open()
                              ),
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _api_post(
                  self, s: list[str]
              ) -> None:
                  store = type(self).store
                  doc = self._read_json()
                  if s == ["accounts"]:
                      account_id = (
                          "SBS-"
                          + uuid.uuid4().hex[:12]
                      )
                      row = store.add_account(
                          account_id=account_id,
                          zid=doc.get("zid"),
                          name=self._req(doc, "name"),
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  if s == ["listings"]:
                      row = store.add_listing(
                          listing_id=(
                              "LST-"
                              + uuid.uuid4().hex[:10]
                          ),
                          seller_account=self._req(
                              doc,
                              "seller_account",
                          ),
                          seller_zid=doc.get(
                              "seller_zid"
                          ),
                          title=self._req(
                              doc, "title"
                          ),
                          description=self._req(
                              doc, "description"
                          ),
                          base_price=float(
                              doc.get(
                                  "base_price", 0
                              )
                          ),
                          document_id=None,
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

