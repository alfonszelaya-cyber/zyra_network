from __future__ import annotations

from shared_engines.identity_proofing import (
    AssuranceLevel,
    BiometricKind,
    DocumentCheck,
    DocumentStatus,
    IdentityProofingEngine,
    ProofingDecision,
    ProofingRequest,
)
from shared_engines.security.service_boundary import ServiceBoundary


def valid_document() -> DocumentCheck:
    return DocumentCheck(
        document_type="national_id",
        issuer="authorized_issuer",
        document_fingerprint="DOC-123456",
        authentic=True,
        attributes_verified=True,
        issuer_verified=True,
        tamper_detected=False,
    )


def test_identity_proofing_high_assurance():
    engine = IdentityProofingEngine()

    request = ProofingRequest(
        subject_zid="ZID-123",
        document=valid_document(),
        biometric_kind=BiometricKind.FACE,
        biometric_match=True,
        liveness_passed=True,
        duplicate_identity_detected=False,
    )

    result = engine.evaluate(request)

    assert result.decision is ProofingDecision.ACCEPT
    assert result.assurance is AssuranceLevel.HIGH
    assert result.document_status is DocumentStatus.AUTHENTIC
    assert result.evidence_digest


def test_fake_document_is_rejected():
    engine = IdentityProofingEngine()

    document = DocumentCheck(
        document_type="national_id",
        issuer="authorized_issuer",
        document_fingerprint="FAKE",
        authentic=False,
        attributes_verified=False,
        issuer_verified=False,
        tamper_detected=True,
    )

    request = ProofingRequest(
        subject_zid="ZID-123",
        document=document,
    )

    result = engine.evaluate(request)

    assert result.decision is ProofingDecision.REJECT
    assert result.assurance is AssuranceLevel.UNVERIFIED
    assert "document_tampering_detected" in result.reasons


def test_duplicate_identity_is_rejected():
    engine = IdentityProofingEngine()

    request = ProofingRequest(
        subject_zid="ZID-123",
        document=valid_document(),
        biometric_kind=BiometricKind.FACE,
        biometric_match=True,
        liveness_passed=True,
        duplicate_identity_detected=True,
    )

    result = engine.evaluate(request)

    assert result.decision is ProofingDecision.REJECT
    assert "duplicate_identity_detected" in result.reasons


def test_without_biometric_cannot_reach_high_assurance():
    engine = IdentityProofingEngine()

    request = ProofingRequest(
        subject_zid="ZID-123",
        document=valid_document(),
    )

    result = engine.evaluate(request)

    assert result.decision is ProofingDecision.REVIEW
    assert result.assurance is AssuranceLevel.BASIC


def test_service_credential_is_valid_for_correct_audience():
    boundary = ServiceBoundary(
        service_id="nexo",
        secret=b"x" * 32,
    )

    credential = boundary.issue(
        audience="zyra",
        ttl_seconds=60,
        now=1000,
    )

    assert boundary.verify(
        credential,
        expected_audience="zyra",
        now=1001,
    )


def test_service_credential_cannot_cross_audience():
    boundary = ServiceBoundary(
        service_id="nexo",
        secret=b"x" * 32,
    )

    credential = boundary.issue(
        audience="zyra",
        ttl_seconds=60,
        now=1000,
    )

    assert not boundary.verify(
        credential,
        expected_audience="axis",
        now=1001,
    )


def test_service_credential_expires():
    boundary = ServiceBoundary(
        service_id="nexo",
        secret=b"x" * 32,
    )

    credential = boundary.issue(
        audience="zyra",
        ttl_seconds=10,
        now=1000,
    )

    assert not boundary.verify(
        credential,
        expected_audience="zyra",
        now=1011,
    )


def test_service_credential_tampering_fails():
    boundary = ServiceBoundary(
        service_id="nexo",
        secret=b"x" * 32,
    )

    credential = boundary.issue(
        audience="zyra",
        ttl_seconds=60,
        now=1000,
    )

    tampered = type(credential)(
        service_id=credential.service_id,
        audience="axis",
        issued_at=credential.issued_at,
        expires_at=credential.expires_at,
        nonce=credential.nonce,
        signature=credential.signature,
    )

    assert not boundary.verify(
        tampered,
        expected_audience="axis",
        now=1001,
    )
PY

