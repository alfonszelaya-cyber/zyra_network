      - name: Write tutor e2e test (new file, originals untouched)
        run: |
          set -euo pipefail
          cat > apps/semilla/tests/test_semilla_tutor_e2e.py <<'PYEOF'
          """SEMILLA tutor e2e - adaptive profile, talent
          detection with network milestone and messages,
          adaptive challenges (never reveals answer), rewards,
          grade advance on trajectory, EDUCATION credential
          issued on the network; original screens untouched."""
          from __future__ import annotations

          import json
          import re
          import threading
          from pathlib import Path
          from urllib.request import (
              Request,
              urlopen,
          )

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities,
          )
          from shared_engines.runtime.combined_api import (
              serve_combined,
          )
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )

          from apps.semilla.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.semilla.infrastructure.persistence.semilla_store import (
              SemillaStore,
          )
          from apps.semilla.server import serve_semilla
          from apps.semilla.services.semilla_link import (
              SemillaLink,
          )


          class _Ecosystem:
              def __init__(self, tmp_path: Path) -> None:
                  self.net_db = SQLiteAdapter(
                      tmp_path / "network.db"
                  )
                  signer, _ = Ed25519Signer.generate()
                  self.kernel = ZyraKernel(
                      db=self.net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None,
                      ),
                  )
                  self.kernel.bootstrap_root()
                  self.caps = ZyraCapabilities(
                      self.net_db,
                      FrozenClock(),
                      identity=self.kernel.identity,
                      signer=signer,
                  )
                  self.net_server = serve_combined(
                      self.kernel,
                      self.caps,
                      host="127.0.0.1",
                      port=0,
                  )
                  self.net_thread = threading.Thread(
                      target=self.net_server.serve_forever,
                      daemon=True,
                  )
                  self.net_thread.start()
                  self.net_base = (
                      "http://127.0.0.1:"
                      f"{self.net_server.server_address[1]}"
                  )
                  self.client = NetworkClient(
                      self.net_base, max_retries=1
                  )
                  self.link = SemillaLink(self.client)
                  self.sem_db = SQLiteAdapter(
                      tmp_path / "semilla.db"
                  )
                  self.store = SemillaStore(
                      self.sem_db, FrozenClock()
                  )
                  self.sem_server = serve_semilla(
                      self.store, self.client
                  )
                  self.sem_thread = threading.Thread(
                      target=self.sem_server.serve_forever,
                      daemon=True,
                  )
                  self.sem_thread.start()
                  self.sem_base = (
                      "http://127.0.0.1:"
                      f"{self.sem_server.bound_port}"
                  )

              def close(self) -> None:
                  self.sem_server.shutdown()
                  self.sem_server.server_close()
                  self.sem_thread.join(timeout=5)
                  self.net_server.shutdown()
                  self.net_server.server_close()
                  self.net_thread.join(timeout=5)
                  self.sem_db.close()
                  self.net_db.close()


          def _post_form(url: str, doc: dict) -> str:
              request = Request(
                  url,
                  data=(
                      "&".join(
                          str(k) + "=" + str(v)
                          for k, v in doc.items()
                      )
                  ).encode("utf-8"),
                  method="POST",
              )
              with urlopen(request, timeout=10) as r:
                  return r.read().decode("utf-8")


          def _get_html(url: str) -> str:
              with urlopen(url, timeout=10) as r:
                  return r.read().decode("utf-8")


          def _post_json(url: str, doc: dict) -> dict:
              request = Request(
                  url,
                  data=json.dumps(doc).encode("utf-8"),
                  headers={
                      "Content-Type":
                      "application/json"
                  },
                  method="POST",
              )
              with urlopen(request, timeout=10) as r:
                  body = json.loads(
                      r.read().decode("utf-8")
                  )
              assert isinstance(body, dict)
              return body


          def _get_json(url: str) -> dict:
              with urlopen(url, timeout=10) as r:
                  body = json.loads(
                      r.read().decode("utf-8")
                  )
              assert isinstance(body, dict)
              return body


          def test_tutor_full_cycle(tmp_path: Path) -> None:
              eco = _Ecosystem(tmp_path)
              try:
                  assert eco.link.register_app()[0] is True
                  student_html = _post_form(
                      eco.sem_base + "/semilla/register",
                      {
                          "role": "alumno",
                          "name": "Maria Estudiante",
                          "school": "Escuela Central",
                          "grade": "primaria",
                      },
                  )
                  student_id = re.search(
                      r"SEM-[a-f0-9]{12}",
                      student_html,
                  ).group(0)
                  teacher_html = _post_form(
                      eco.sem_base + "/semilla/register",
                      {
                          "role": "profesor",
                          "name": "Profesor Gomez",
                          "school": "Escuela Central",
                      },
                  )
                  teacher_id = re.search(
                      r"SEM-[a-f0-9]{12}",
                      teacher_html,
                  ).group(0)
                  student = eco.store.get_account(
                      student_id
                  )
                  zid = student.get("zid")
                  assert isinstance(zid, str)
                  assert zid.startswith("ZID-")
                  for i in range(4):
                      response = _post_json(
                          eco.sem_base
                          + "/semilla/api/grades",
                          {
                              "student_account": (
                                  student_id
                              ),
                              "subject": "matematicas",
                              "score": 9.5,
                              "teacher_account": (
                                  teacher_id
                              ),
                          },
                      )
                      assert response["ok"] is True
                  for i in range(2):
                      _post_json(
                          eco.sem_base
                          + "/semilla/api/grades",
                          {
                              "student_account": (
                                  student_id
                              ),
                              "subject": "lectura",
                              "score": 5.5,
                              "teacher_account": (
                                  teacher_id
                              ),
                          },
                      )
                  profile = _get_json(
                      eco.sem_base
                      + "/semilla/api/profile/"
