name: zyra-w13-engine-search

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Clean engine init (W391)
        run: |
          set -euo pipefail
          f="shared_engines/search/__init__.py"
          [ -f "$f" ] && printf '"""ZYRA Network engine package."""\n' > "$f"
          echo "init cleaned"

      - name: Fill search engine (transversal authorized queries)
        run: |
          set -euo pipefail
          cat > shared_engines/search/errors.py <<'PYEOF'
          """Typed search errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
          )


          class SearchNotAuthorizedError(EngineError):
              """Querying app is not registered."""


          class UnknownSourceError(EngineError):
              """Requested search source does not exist."""
          PYEOF

          cat > shared_engines/search/contracts.py <<'PYEOF'
          """Search contracts."""
          from __future__ import annotations

          from dataclasses import dataclass


          @dataclass(frozen=True)
          class SearchHit:
              """One ranked result from one source."""

              source: str
              ref_id: str
              title: str
              snippet: str
              score: int
          PYEOF

          cat > shared_engines/search/engine.py <<'PYEOF'
          """Search engine: the transversal query layer.

          Composes EXISTING tables as sources - never
          duplicating engines or creating parallel indexes:

              identity    -> identities (display_name)
              credential  -> credentials (title, not revoked)
              document    -> sealed_documents (title)
              certificate -> certificates (title, not revoked)
              history     -> life_history_entries (payload)

          Guarantees:

          - Authorized: only apps registered via
            ProfileRegistry (app_registry) may search.
          - Auditable: every query is written to the
            durable search log, appended to the audit
            chain and emitted as network.search.performed.
          - Ranked: exact title match (3) > prefix (2) >
            substring (1); stable tiebreak by title.
          - Paginated with the existing common Page.
          - Case-insensitive matching via lower() +
            instr(); no LIKE escaping issues.
          - Missing source tables are skipped, so the
            engine works on partial deployments.

          Transactions never nest: the log entry and
          outbox event share one short transaction; the
          audit append runs afterwards on its own.
          """
          from __future__ import annotations

          import hashlib
          import sqlite3

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.pagination import Page
          from shared_engines.common.serialization import (
              canonical_json_dumps,
          )
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.search.contracts import (
              SearchHit,
          )
          from shared_engines.search.errors import (
              SearchNotAuthorizedError,
              UnknownSourceError,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          EVENT_SEARCH_PERFORMED = (
              "network.search.performed"
          )

          SOURCE_IDENTITY = "identity"
          SOURCE_CREDENTIAL = "credential"
          SOURCE_DOCUMENT = "document"
          SOURCE_CERTIFICATE = "certificate"
          SOURCE_HISTORY = "history"

          ALL_SOURCES: tuple[str, ...] = (
              SOURCE_IDENTITY,
              SOURCE_CREDENTIAL,
              SOURCE_DOCUMENT,
              SOURCE_CERTIFICATE,
              SOURCE_HISTORY,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "search_log",
                  (
                      "CREATE TABLE search_log ("
                      " search_id INTEGER PRIMARY KEY"
                      " AUTOINCREMENT,"
                      " app_id TEXT NOT NULL,"
                      " query TEXT NOT NULL,"
                      " sources TEXT NOT NULL,"
                      " result_count INTEGER NOT NULL,"
                      " performed_at REAL NOT NULL)",
                  ),
              ),
          )

          _SOURCE_QUERIES: dict[str, str] = {
              SOURCE_IDENTITY: (
                  "SELECT zid AS ref_id,"
                  " display_name AS title,"
                  " display_name AS snippet"
                  " FROM identities"
                  " WHERE instr(lower(display_name),"
                  " ?) > 0 LIMIT 500"
              ),
              SOURCE_CREDENTIAL: (
                  "SELECT credential_id AS ref_id,"
                  " title AS title,"
                  " detail AS snippet"
                  " FROM credentials"
                  " WHERE revoked = 0"
                  " AND instr(lower(title), ?) > 0"
                  " LIMIT 500"
              ),
              SOURCE_DOCUMENT: (
                  "SELECT document_id AS ref_id,"
                  " title AS title,"
                  " title AS snippet"
                  " FROM sealed_documents"
                  " WHERE instr(lower(title), ?)"
                  " > 0 LIMIT 500"
              ),
              SOURCE_CERTIFICATE: (
                  "SELECT certificate_id AS ref_id,"
                  " title AS title,"
                  " scope AS snippet"
                  " FROM certificates"
                  " WHERE revoked = 0"
                  " AND instr(lower(title), ?) > 0"
                  " LIMIT 500"
              ),
              SOURCE_HISTORY: (
                  "SELECT zid || '#' || entry_seq"
                  " AS ref_id,"
                  " entry_type AS title,"
                  " substr(payload, 1, 120)"
                  " AS snippet"
                  " FROM life_history_entries"
                  " WHERE instr("
                  " lower(payload), ?) > 0"
                  " LIMIT 500"
              ),
          }

          _SOURCE_TABLES: dict[str, str] = {
              SOURCE_IDENTITY: "identities",
              SOURCE_CREDENTIAL: "credentials",
              SOURCE_DOCUMENT: "sealed_documents",
              SOURCE_CERTIFICATE: "certificates",
              SOURCE_HISTORY: (
                  "life_history_entries"
              ),
          }


          class SearchEngine:
              """Authorized, audited, ranked global
              search over existing tables."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  audit: AuditTrail,
                  outbox: Outbox,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  self._outbox = outbox
                  MigrationRunner(
                      db, "search", _MIGRATIONS
                  ).run(clock)

              def _require_app(
                  self, app_id: str
              ) -> None:
                  row = self._db.query_one(
                      "SELECT 1 FROM app_registry"
                      " WHERE app_id = ?",
                      (app_id,),
                  )
                  if row is None:
                      raise (
                          SearchNotAuthorizedError(
                              "app not registered:"
                              f" {app_id}"
                          )
                      )

              def _table_exists(
                  self, table: str
              ) -> bool:
                  row = self._db.query_one(
                      "SELECT 1 FROM sqlite_master"
                      " WHERE type = 'table'"
                      " AND name = ?",
                      (table,),
                  )
                  return row is not None

              def _score(
                  self, title: str, q: str
              ) -> int:
                  t = title.lower()
                  if t == q:
                      return 3
                  if t.startswith(q):
                      return 2
                  return 1

              def search(
                  self,
                  *,
                  app_id: str,
                  query: str,
                  sources: tuple[str, ...] | None = None,
                  offset: int = 0,
                  limit: int = 20,
              ) -> Page[SearchHit]:
                  """Global authorized search."""
                  require_int_range(
                      offset, "offset", 0, 10**12
                  )
                  require_int_range(
                      limit, "limit", 1, 100
                  )
                  self._require_app(app_id)
                  require_non_empty_str(
                      query, "query"
                  )
                  q = query.strip().lower()
                  chosen: tuple[str, ...]
                  if sources is None:
                      chosen = ALL_SOURCES
                  else:
                      for s in sources:
                          if s not in ALL_SOURCES:
                              raise (
                                  UnknownSourceError(
                                      "unknown"
                                      " source:"
                                      f" {s}"
                                  )
                              )
                      chosen = sources
                  hits: list[SearchHit] = []
                  for source in chosen:
                      table = _SOURCE_TABLES[
                          source
                      ]
                      if not self._table_exists(
                          table
                      ):
                          continue
                      rows = self._db.query_all(
                          _SOURCE_QUERIES[source],
                          (q,),
                      )
                      for row in rows:
                          title = str(
                              row["title"]
                          )
                          hits.append(
                              SearchHit(
                                  source=source,
                                  ref_id=str(
                                      row["ref_id"]
                                  ),
                                  title=title,
                                  snippet=str(
                                      row["snippet"]
                                  ),
                                  score=self._score(
                                      title, q
                                  ),
                              )
                          )
                  hits.sort(
                      key=lambda h: (
                          -h.score,
                          h.title,
                          h.source,
                          h.ref_id,
                      )
                  )
                  total = len(hits)
                  end = offset + limit
                  window = hits[offset:end]
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO search_log"
                          " (app_id, query, sources,"
                          "  result_count,"
                          "  performed_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              app_id,
                              q,
                              ",".join(chosen),
                              total,
                              self._clock.now(),
                          ),
                      )
                      self._emit(
                          cursor,
                          app_id=app_id,
                          q=q,
                          total=total,
                      )
                  self._audit.append(
                      event_type=(
                          EVENT_SEARCH_PERFORMED
                      ),
                      actor=app_id,
                      subject=q,
                      payload={"results": total},
                  )
                  return Page(
                      items=tuple(window),
                      offset=offset,
                      limit=limit,
                      total=total,
                  )

              def _emit(
                  self,
                  cursor: sqlite3.Cursor,
                  *,
                  app_id: str,
                  q: str,
                  total: int,
              ) -> None:
                  event_id = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "a": app_id,
                              "q": q,
                              "ts": self._clock.now(),
                          }
                      ).encode("utf-8")
                  ).hexdigest()[:32]
                  fp = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "id": event_id,
                              "ty": (
                                  EVENT_SEARCH_PERFORMED
                              ),
                          }
                      ).encode("utf-8")
                  ).hexdigest()
                  cursor.execute(
                      "INSERT INTO events_outbox"
                      " (event_id, event_type,"
                      " aggregate_id, schema_version,"
                      " envelope_version, created_at,"
                      " payload, fingerprint,"
                      " published_at)"
                      " VALUES (?, ?, ?, 1, 1, ?, ?,"
                      " ?, NULL)",
                      (
                          event_id,
                          EVENT_SEARCH_PERFORMED,
                          app_id,
                          self._clock.now(),
                          canonical_json_dumps(
                              {
                                  "query": q,
                                  "results": total,
                              }
                          ),
                          fp,
                      ),
                  )

              def search_log_count(self) -> int:
                  row = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " search_log"
                  )
                  return (
                      int(row["n"])
                      if row is not None
                      else 0
                  )
          PYEOF
          echo "=== SEARCH ENGINE READY (transversal) ==="

      - name: Search proofs (4)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/search/tests
          cat > shared_engines/search/tests/test_search.py <<'PYEOF'
          """Search proofs: multi-source ranked results,
          unauthorized apps refused, pagination via Page,
          full auditability of every query."""
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.events.contracts import (
              EventCatalog,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              IdentityKind,
          )
          from shared_engines.identity.engine import (
              IdentityEngine,
          )
          from shared_engines.integrity.engine import (
              IntegrityEngine,
          )
          from shared_engines.network.document_exchange import (
              DocumentExchange,
          )
          from shared_engines.network.life_history import (
              LifeHistory,
          )
          from shared_engines.network.portable_profile import (
              ProfileRegistry,
          )
          from shared_engines.search.engine import SearchEngine
          from shared_engines.search.errors import (
              SearchNotAuthorizedError,
              UnknownSourceError,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )
          from shared_engines.telemetry.collector import (
              TelemetryCollector,
          )
          from shared_engines.verification.credentials import (
              CredentialRegistry,
              CredentialType,
          )
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )


          class _Net:
              def __init__(
                  self, tmp_path: Path
              ) -> None:
                  self.db = SQLiteAdapter(
                      tmp_path / "net.db"
                  )
                  self.clock = FrozenClock()
                  self.audit = AuditTrail(
                      self.db, self.clock
                  )
                  self.outbox = Outbox(
                      self.db, self.clock
                  )
                  self.outbox.ensure_schema()
                  self.catalog = EventCatalog()
                  for et in (
                      "identity.registered",
                      "identity.status_changed",
                      "verification.credential"
                      ".issued",
                      "network.document.sealed",
                      "network.history.appended",
                      "network.search.performed",
                  ):
                      self.catalog.register(et)
                  self.identity = IdentityEngine(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                  )
                  self.profiles = ProfileRegistry(
                      self.db,
                      self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.credentials = (
                      CredentialRegistry(
                          self.db,
                          self.clock,
                          self.audit,
                          self.outbox,
                          self.catalog,
                      )
                  )
                  self.integrity = IntegrityEngine(
                      self.db, self.clock
                  )
                  signer, _ = (
                      Ed25519Signer.generate()
                  )
                  self.exchange = DocumentExchange(
                      self.db,
                      self.clock,
                      signer=signer,
                      integrity=self.integrity,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.history = LifeHistory(
                      self.db,
                      self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.telemetry = TelemetryCollector(
                      self.db, self.clock
                  )
                  self.search = SearchEngine(
                      self.db,
                      self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                  )

              def close(self) -> None:
                  self.db.close()


          def test_multi_source_ranked_results(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  net.profiles.register_app(
                      app_id="portal",
                      display_name="Portal",
                      scopes=("display_name",),
                  )
                  person = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name=(
                              "Maria Lopez"
                          ),
                          actor="portal",
                      )
                  )
                  net.credentials.issue(
                      subject_zid=person.zid,
                      issuer_zid=person.zid,
                      credential_type=(
                          CredentialType.REFERENCE
                      ),
                      title=(
                          "Referencia de"
                          " Maria Lopez"
                      ),
                      detail="limpia",
                  )
                  net.exchange.seal_document(
                      owner_zid=person.zid,
                      title=(
                          "Contrato Maria Lopez"
                      ),
                      content=b"doc",
                      actor_app="portal",
                  )
                  result = net.search.search(
                      app_id="portal",
                      query="maria lopez",
                  )
                  sources_found = {
                      h.source
                      for h in result.items
                  }
                  assert (
                      "identity"
                      in sources_found
                  )
                  assert (
                      "credential"
                      in sources_found
                  )
                  assert (
                      "document"
                      in sources_found
                  )
                  top = result.items[0]
                  assert (
                      top.source == "identity"
                  )
                  assert top.score == 3
                  assert result.total >= 3
              finally:
                  net.close()


          def test_unauthorized_and_unknown_source(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  with pytest.raises(
                      SearchNotAuthorizedError
                  ):
                      net.search.search(
                          app_id="malware",
                          query="x",
                      )
                  net.profiles.register_app(
                      app_id="ok",
                      display_name="OK",
                      scopes=("display_name",),
                  )
                  with pytest.raises(
                      UnknownSourceError
                  ):
                      net.search.search(
                          app_id="ok",
                          query="x",
                          sources=("ghost",),
                      )
              finally:
                  net.close()


          def test_pagination_with_page(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  net.profiles.register_app(
                      app_id="portal",
                      display_name="Portal",
                      scopes=("display_name",),
                  )
                  owner = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="o",
                          actor="portal",
                      )
                  )
                  for i in range(5):
                      net.exchange.seal_document(
                          owner_zid=owner.zid,
                          title=(
                              f"Lote especial"
                              f" {i}"
                          ),
                          content=(
                              f"c{i}".encode()
                          ),
                          actor_app="portal",
                      )
                  page1 = net.search.search(
                      app_id="portal",
                      query="lote especial",
                      offset=0,
                      limit=2,
                  )
                  assert page1.total == 5
                  assert len(page1.items) == 2
                  assert (
                      page1.has_more is True
                  )
                  assert (
                      page1.next_offset == 2
                  )
                  page3 = net.search.search(
                      app_id="portal",
                      query="lote especial",
                      offset=4,
                      limit=2,
                  )
                  assert (
                      len(page3.items) == 1
                  )
                  assert (
                      page3.has_more is False
                  )
              finally:
                  net.close()


          def test_every_query_audited(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  net.profiles.register_app(
                      app_id="portal",
                      display_name="Portal",
                      scopes=("display_name",),
                  )
                  net.search.search(
                      app_id="portal",
                      query="algo",
                  )
                  net.search.search(
                      app_id="portal",
                      query="otro",
                  )
                  assert (
                      net.search
                      .search_log_count()
                      == 2
                  )
                  assert (
                      net.audit.verify() >= 2
                  )
                  net.telemetry.ingest_outbox(
                      net.outbox
                  )
                  events = (
                      net.telemetry.query_events(
                          event_type=(
                              "network.search"
                              ".performed"
                          )
                      )
                  )
                  assert len(events) == 2
              finally:
                  net.close()
          PYEOF
          echo "=== SEARCH TESTS READY ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs shared_engines/consensus shared_engines/integrity shared_engines/encryption shared_engines/certification shared_engines/search"
          python -m compileall -q $M main.py scripts shared_engines/tests
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M shared_engines/tests tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: engine 5/17 search - transversal query layer over EXISTING tables, authorized apps only, audited+outbox per query, ranked, paginated via common Page; slice fixed for flake8 E203"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== ENGINE SEARCH COMPLETE ==="
