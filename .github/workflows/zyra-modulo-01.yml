name: zyra-modulo-17-telemetry

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-17-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01-16 present
        run: |
          set -euo pipefail
          test -f shared_engines/network/cluster.py
          test -f shared_engines/authority/root.py
          echo "modules 01-16 present: OK"

      - name: Build telemetry + structured logs
        run: |
          set -euo pipefail
          mkdir -p shared_engines/telemetry/tests shared_engines/logs/tests

          cat > shared_engines/telemetry/__init__.py <<'PYEOF'
          """Zyra telemetry: durable metrics and event indexing."""
          from __future__ import annotations

          from shared_engines.telemetry.collector import (
              TelemetryCollector,
              TelemetryRecord,
          )
          from shared_engines.telemetry.system_health import (
              SystemHealthReporter,
              SystemReport,
          )

          __all__ = [
              "SystemHealthReporter", "SystemReport",
              "TelemetryCollector", "TelemetryRecord",
          ]
          PYEOF

          cat > shared_engines/telemetry/errors.py <<'PYEOF'
          """Typed telemetry errors."""
          from __future__ import annotations

          from shared_engines.common.errors import EngineError, ValidationError


          class TelemetryError(EngineError):
              """Base for telemetry failures."""


          class InvalidMetricError(TelemetryError, ValidationError):
              """A metric name or value failed validation."""
          PYEOF

          cat > shared_engines/telemetry/collector.py <<'PYEOF'
          """Durable telemetry collector: metrics + event index.

          Metrics (counters/gauges/timers) persist per name+tags;
          network/engine events are indexed by type, aggregate and
          time window for queryable operations history. This is what
          a dashboard or an external monitor would query.
          """
          from __future__ import annotations

          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
              require_positive_number,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
              canonical_json_loads,
          )
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          TELEMETRY_MIGRATIONS = (
              Migration(
                  1,
                  "telemetry_metrics",
                  (
                      "CREATE TABLE telemetry_metrics ("
                      " metric_id INTEGER PRIMARY KEY AUTOINCREMENT,"
                      " name TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " value REAL NOT NULL,"
                      " tags TEXT NOT NULL,"
                      " recorded_at REAL NOT NULL)",
                      "CREATE INDEX telemetry_metrics_name_time"
                      " ON telemetry_metrics (name, recorded_at)",
                  ),
              ),
              Migration(
                  2,
                  "telemetry_events",
                  (
                      "CREATE TABLE telemetry_events ("
                      " event_id TEXT PRIMARY KEY,"
                      " event_type TEXT NOT NULL,"
                      " aggregate_id TEXT NOT NULL,"
                      " payload TEXT NOT NULL,"
                      " occurred_at REAL NOT NULL)",
                      "CREATE INDEX telemetry_events_type_time"
                      " ON telemetry_events (event_type, occurred_at)",
                      "CREATE INDEX telemetry_events_aggregate"
                      " ON telemetry_events (aggregate_id, occurred_at)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class TelemetryRecord:
              metric_id: int
              name: str
              kind: str
              value: float
              tags: dict[str, str]
              recorded_at: float


          class TelemetryCollector:
              """Durable metrics + event index over the Network DB."""

              def __init__(self, db: Database, clock: Clock) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "telemetry", TELEMETRY_MIGRATIONS
                  ).run(clock)

              def counter(self, name: str, *, tags: dict[str, str] | None = None) -> None:
                  self._record(name, kind="counter", value=1, tags=tags)

              def gauge(
                  self, name: str, value: float,
                  *, tags: dict[str, str] | None = None,
              ) -> None:
                  require_positive_number(value, name)
                  self._record(name, kind="gauge", value=value, tags=tags)

              def timer(
                  self, name: str, seconds: float,
                  *, tags: dict[str, str] | None = None,
              ) -> None:
                  require_positive_number(seconds, "duration")
                  self._record(name, kind="timer", value=seconds, tags=tags)

              def _record(
                  self,
                  name: str,
                  *,
                  kind: str,
                  value: float,
                  tags: dict[str, str] | None,
              ) -> None:
                  require_non_empty_str(name, "name")
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO telemetry_metrics"
                          " (name, kind, value, tags, recorded_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              name,
                              kind,
                              value,
                              canonical_json_dumps(dict(tags or {})),
                              self._clock.now(),
                          ),
                      )

              def index_event(
                  self,
                  *,
                  event_id: str,
                  event_type: str,
                  aggregate_id: str,
                  payload: dict[str, object],
              ) -> None:
                  require_non_empty_str(event_id, "event_id")
                  require_non_empty_str(event_type, "event_type")
                  require_non_empty_str(aggregate_id, "aggregate_id")
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO telemetry_events"
                          " (event_id, event_type, aggregate_id,"
                          "  payload, occurred_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              event_id,
                              event_type,
                              aggregate_id,
                              canonical_json_dumps(dict(payload)),
                              self._clock.now(),
                          ),
                      )

              def query_metrics(
                  self,
                  name: str,
                  *,
                  limit: int = 100,
              ) -> tuple[TelemetryRecord, ...]:
                  require_non_empty_str(name, "name")
                  require_int_range(limit, "limit", 1, 10_000)
                  rows = self._db.query_all(
                      "SELECT * FROM telemetry_metrics"
                      " WHERE name = ?"
                      " ORDER BY recorded_at DESC, metric_id DESC"
                      " LIMIT ?",
                      (name, limit),
                  )
                  return tuple(self._record_from_row(row) for row in rows)

              def query_events(
                  self,
                  *,
                  event_type: str | None = None,
                  aggregate_id: str | None = None,
                  limit: int = 100,
              ) -> tuple[dict[str, object], ...]:
                  require_int_range(limit, "limit", 1, 10_000)
                  if event_type is not None and aggregate_id is not None:
                      rows = self._db.query_all(
                          "SELECT * FROM telemetry_events"
                          " WHERE event_type = ? AND aggregate_id = ?"
                          " ORDER BY occurred_at DESC LIMIT ?",
                          (event_type, aggregate_id, limit),
                      )
                  elif event_type is not None:
                      rows = self._db.query_all(
                          "SELECT * FROM telemetry_events"
                          " WHERE event_type = ?"
                          " ORDER BY occurred_at DESC LIMIT ?",
                          (event_type, limit),
                      )
                  elif aggregate_id is not None:
                      rows = self._db.query_all(
                          "SELECT * FROM telemetry_events"
                          " WHERE aggregate_id = ?"
                          " ORDER BY occurred_at DESC LIMIT ?",
                          (aggregate_id, limit),
                      )
                  else:
                      rows = self._db.query_all(
                          "SELECT * FROM telemetry_events"
                          " ORDER BY occurred_at DESC LIMIT ?",
                          (limit,),
                      )
                  return tuple(
                      {
                          "event_id": str(row["event_id"]),
                          "event_type": str(row["event_type"]),
                          "aggregate_id": str(row["aggregate_id"]),
                          "payload": canonical_json_loads(
                              str(row["payload"])
                          ),
                          "occurred_at": float(row["occurred_at"]),
                      }
                      for row in rows
                  )

              def metric_summary(
                  self, name: str
              ) -> dict[str, object]:
                  records = self.query_metrics(name, limit=10_000)
                  if not records:
                      return {
                          "name": name,
                          "count": 0,
                          "total": 0.0,
                          "last": None,
                      }
                  values = [r.value for r in records]
                  return {
                      "name": name,
                      "count": len(values),
                      "total": sum(values),
                      "last": values[0],
                  }

              @staticmethod
              def _record_from_row(row: object) -> TelemetryRecord:
                  from typing import cast

                  from shared_engines.storage.database import Database

                  if not hasattr(row, "__getitem__"):
                      raise ValueError("invalid telemetry row")
                  tags = canonical_json_loads(str(row["tags"]))
                  if not isinstance(tags, dict):
                      tags = {}
                  return TelemetryRecord(
                      metric_id=int(cast("object", row["metric_id"])),
                      name=str(row["name"]),
                      kind=str(row["kind"]),
                      value=float(row["value"]),
                      tags={str(k): str(v) for k, v in tags.items()},
                      recorded_at=float(row["recorded_at"]),
                  )
          PYEOF

          cat > shared_engines/telemetry/system_health.py <<'PYEOF'
          """System health reporter: one view of the whole Network."""
          from __future__ import annotations

          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.network.cluster import ClusterManager
          from shared_engines.observability.health import (
              ComponentHealth,
              HealthRegistry,
          )
          from shared_engines.telemetry.collector import TelemetryCollector


          @dataclass(frozen=True)
          class SystemReport:
              overall: ComponentHealth
              components: tuple[ComponentHealth, ...]
              cluster_nodes_active: int
              cluster_nodes_total: int
              recent_event_count: int


          class SystemHealthReporter:
              """Aggregates component health + cluster + telemetry."""

              def __init__(
                  self,
                  *,
                  registry: HealthRegistry,
                  cluster: ClusterManager,
                  telemetry: TelemetryCollector,
                  clock: Clock,
              ) -> None:
                  self._registry = registry
                  self._cluster = cluster
                  self._telemetry = telemetry
                  self._clock = clock

              def report(self) -> SystemReport:
                  overall = self._registry.overall()
                  components = self._registry.snapshot()
                  all_nodes = self._cluster.all_nodes()
                  active = self._cluster.active_nodes()
                  recent = self._telemetry.query_events(limit=100)
                  return SystemReport(
                      overall=overall,
                      components=components,
                      cluster_nodes_active=len(active),
                      cluster_nodes_total=len(all_nodes),
                      recent_event_count=len(recent),
                  )
          PYEOF

          cat > shared_engines/telemetry/tests/test_telemetry.py <<'PYEOF'
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.identity.contracts import IdentityKind
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.network.cluster import (
              ClusterManager,
              NodeRole,
          )
          from shared_engines.observability.health import (
              ComponentHealth,
              HealthRegistry,
              HealthStatus,
          )
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.telemetry.collector import TelemetryCollector
          from shared_engines.telemetry.system_health import (
              SystemHealthReporter,
          )


          class _Harness:
              def __init__(self, tmp_path: Path) -> None:
                  self.db = SQLiteAdapter(tmp_path / "tel.db")
                  self.clock = FrozenClock()
                  self.audit = AuditTrail(self.db, self.clock)
                  self.outbox = Outbox(self.db, self.clock)
                  self.outbox.ensure_schema()
                  self.catalog = EventCatalog()
                  for event_type in (
                      "network.node.joined",
                      "identity.registered",
                      "identity.status_changed",
                  ):
                      self.catalog.register(event_type)
                  self.identity = IdentityEngine(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                  )
                  self.cluster = ClusterManager(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                  )
                  self.telemetry = TelemetryCollector(self.db, self.clock)
                  self.registry = HealthRegistry()

              def close(self) -> None:
                  self.db.close()


          def test_counter_gauge_timer_persist(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              harness.telemetry.counter("identity.registered")
              harness.telemetry.counter("identity.registered")
              harness.telemetry.gauge("cluster.nodes.active", 3.0)
              harness.telemetry.timer("request.latency", 0.25)
              metrics = harness.telemetry.query_metrics(
                  "identity.registered"
              )
              assert len(metrics) == 2
              assert all(m.kind == "counter" for m in metrics)
              summary = harness.telemetry.metric_summary(
                  "identity.registered"
              )
              assert summary["count"] == 2
              assert summary["total"] == 2.0
              latencies = harness.telemetry.query_metrics(
                  "request.latency"
              )
              assert latencies[0].value == 0.25
              harness.close()


          def test_events_indexed_and_queryable(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              user = harness.identity.register_identity(
                  kind=IdentityKind.PERSON,
                  display_name="Watched",
                  actor="registrar",
              )
              events = harness.telemetry.query_events(
                  aggregate_id=user.zid
              )
              types = {e["event_type"] for e in events}
              assert "identity.registered" in types
              by_type = harness.telemetry.query_events(
                  event_type="identity.registered"
              )
              assert len(by_type) >= 1
              all_events = harness.telemetry.query_events(limit=50)
              assert len(all_events) >= 1
              harness.close()


          def test_system_report_aggregates_everything(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              harness.identity.register_identity(
                  kind=IdentityKind.PERSON,
                  display_name="Node Owner",
                  actor="bootstrap",
              )
              node = harness.cluster.all_nodes()[0] if harness.cluster.all_nodes() else None
              if node is None:
                  node_identity = harness.identity.register_identity(
                      kind=IdentityKind.DEVICE,
                      display_name="node-0",
                      actor="bootstrap",
                  )
                  harness.cluster.register_node(
                      node_id=node_identity.zid,
                      role=__import__(
                          "shared_engines.network.cluster",
                          fromlist=["NodeRole"],
                      ).NodeRole.COORDINATOR,
                      endpoint="tcp://node-0:9000",
                  )
              harness.cluster.heartbeat(
                  harness.cluster.all_nodes()[0].node_id
              )
              harness.registry.register(
                  "storage",
                  _StaticHealth(),
              )
              reporter = SystemHealthReporter(
                  registry=harness.registry,
                  cluster=harness.cluster,
                  telemetry=harness.telemetry,
                  clock=harness.clock,
              )
              report = reporter.report()
              assert report.overall.status is HealthStatus.HEALTHY
              assert report.cluster_nodes_total >= 1
              assert report.recent_event_count >= 1
              harness.close()


          def test_invalid_metric_rejected(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              from shared_engines.telemetry.errors import (
                  InvalidMetricError,
              )

              with pytest.raises(InvalidMetricError):
                  harness.telemetry.gauge("bad.gauge", -1.0)
              with pytest.raises(InvalidMetricError):
                  harness.telemetry.timer("bad.timer", 0.0)
              harness.close()


          class _StaticHealth:
              def check_health(self) -> ComponentHealth:
                  return ComponentHealth(
                      "storage", HealthStatus.HEALTHY, "static ok"
                  )
          PYEOF

          cat > shared_engines/logs/__init__.py <<'PYEOF'
          """Zyra structured logs with correlation."""
          from __future__ import annotations

          from shared_engines.logs.structured import (
              CorrelationContext,
              StructuredLogger,
              LogRecord,
          )

          __all__ = ["CorrelationContext", "LogRecord", "StructuredLogger"]
          PYEOF

          cat > shared_engines/logs/structured.py <<'PYEOF'
          """Structured JSON logging with request correlation.

          Every line is one JSON object: level, component, message,
          correlation_id, detail. Correlation ids group all log lines
          of one operation (an API request, a cluster event), making
          traces queryable. Retention keeps the newest N records.
          """
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Final

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.common.identifiers import new_id
          from shared_engines.common.serialization import canonical_json_dumps
          from shared_engines.common.validation import require_int_range
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          LEVELS: Final[tuple[str, ...]] = (
              "DEBUG",
              "INFO",
              "WARNING",
              "ERROR",
          )

          LOGS_MIGRATIONS = (
              Migration(
                  1,
                  "structured_logs",
                  (
                      "CREATE TABLE structured_logs ("
                      " log_id INTEGER PRIMARY KEY AUTOINCREMENT,"
                      " level TEXT NOT NULL,"
                      " component TEXT NOT NULL,"
                      " message TEXT NOT NULL,"
                      " correlation_id TEXT NOT NULL,"
                      " detail TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                      "CREATE INDEX logs_correlation"
                      " ON structured_logs (correlation_id, created_at)",
                      "CREATE INDEX logs_level_time"
                      " ON structured_logs (level, created_at)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class LogRecord:
              log_id: int
              level: str
              component: str
              message: str
              correlation_id: str
              detail: dict[str, str]
              created_at: float


          class CorrelationContext:
              """Per-operation correlation id generator/tracker."""

              def __init__(self) -> None:
                  self._current: str | None = None

              def start(self) -> str:
                  self._current = f"REQ-{new_id()}"
                  return self._current

              @property
              def current(self) -> str:
                  if self._current is None:
                      return self.start()
                  return self._current

              def clear(self) -> None:
                  self._current = None


          class StructuredLogger:
              """Durable structured logger with correlation + retention."""

              def __init__(self, db: Database, clock: Clock) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "logs.structured", LOGS_MIGRATIONS
                  ).run(clock)

              def log(
                  self,
                  *,
                  level: str,
                  component: str,
                  message: str,
                  correlation_id: str,
                  detail: dict[str, str] | None = None,
              ) -> LogRecord:
                  if level not in LEVELS:
                      raise IntegrityError(
                          f"invalid log level: {level}"
                      )
                  require_non_empty_str(component, "component")
                  require_non_empty_str(message, "message")
                  require_non_empty_str(correlation_id, "correlation_id")
                  safe_detail = {
                      str(k): str(v) for k, v in (detail or {}).items()
                  }
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO structured_logs"
                          " (level, component, message,"
                          "  correlation_id, detail, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?)",
                          (
                              level,
                              component,
                              message,
                              correlation_id,
                              canonical_json_dumps(safe_detail),
                              now,
                          ),
                      )
                      row = cursor.execute(
                          "SELECT * FROM structured_logs"
                          " ORDER BY log_id DESC LIMIT 1"
                      ).fetchone()
                  if row is None:
                      raise IntegrityError("log vanished after insert")
                  return self._record_from_row(row)

              def info(
                  self, component: str, message: str,
                  correlation_id: str,
                  detail: dict[str, str] | None = None,
              ) -> LogRecord:
                  return self.log(
                      level="INFO", component=component,
                      message=message, correlation_id=correlation_id,
                      detail=detail,
                  )

              def warning(
                  self, component: str, message: str,
                  correlation_id: str,
                  detail: dict[str, str] | None = None,
              ) -> LogRecord:
                  return self.log(
                      level="WARNING", component=component,
                      message=message, correlation_id=correlation_id,
                      detail=detail,
                  )

              def error(
                  self, component: str, message: str,
                  correlation_id: str,
                  detail: dict[str, str] | None = None,
              ) -> LogRecord:
                  return self.log(
                      level="ERROR", component=component,
                      message=message, correlation_id=correlation_id,
                      detail=detail,
                  )

              def query_by_correlation(
                  self, correlation_id: str
              ) -> tuple[LogRecord, ...]:
                  require_non_empty_str(correlation_id, "correlation_id")
                  rows = self._db.query_all(
                      "SELECT * FROM structured_logs"
                      " WHERE correlation_id = ?"
                      " ORDER BY created_at, log_id",
                      (correlation_id,),
                  )
                  return tuple(self._record_from_row(r) for r in rows)

              def enforce_retention(self, *, keep: int) -> int:
                  require_int_range(keep, "keep", 1, 1_000_000)
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "DELETE FROM structured_logs WHERE log_id NOT IN"
                          " (SELECT log_id FROM structured_logs"
                          "  ORDER BY log_id DESC LIMIT ?)",
                          (keep,),
                      )
                      row = cursor.execute("SELECT changes()").fetchone()
                  return int(row[0]) if row is not None else 0

              @staticmethod
              def _record_from_row(row: object) -> LogRecord:
                  from typing import cast

                  if not hasattr(row, "__getitem__"):
                      raise IntegrityError("invalid log row")
                  detail = cast(
                      "dict[str, str]",
                      __import__(
                          "shared_engines.common.serialization",
                          fromlist=["canonical_json_loads"],
                      ).canonical_json_loads(str(row["detail"])),
                  )
                  return LogRecord(
                      log_id=int(row["log_id"]),
                      level=str(row["level"]),
                      component=str(row["component"]),
                      message=str(row["message"]),
                      correlation_id=str(row["correlation_id"]),
                      detail=detail,
                      created_at=float(row["created_at"]),
                  )
          PYEOF

          cat > shared_engines/logs/tests/test_logs.py <<'PYEOF'
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.logs.structured import (
              CorrelationContext,
              StructuredLogger,
          )
          from shared_engines.storage.database import SQLiteAdapter


          def test_log_roundtrip_with_correlation(tmp_path: Path) -> None:
              db = SQLiteAdapter(tmp_path / "logs.db")
              logger = StructuredLogger(db, FrozenClock())
              ctx = CorrelationContext()
              corr = ctx.start()
              record = logger.info(
                  component="identity",
                  message="registered new identity",
                  correlation_id=corr,
                  detail={"zid": "ZID-abc", "kind": "person"},
              )
              assert record.level == "INFO"
              assert record.correlation_id == corr
              assert record.detail["zid"] == "ZID-abc"
              trace = logger.query_by_correlation(corr)
              assert len(trace) == 1
              db.close()


          def test_correlation_groups_multi_operation_trace(
              tmp_path: Path,
          ) -> None:
              db = SQLiteAdapter(tmp_path / "logs.db")
              logger = StructuredLogger(db, FrozenClock())
              ctx = CorrelationContext()
              corr = ctx.start()
              logger.info("api", "request received", corr)
              logger.info("identity", "identity looked up", corr)
              logger.warning("verification", "doc hash mismatch", corr)
              logger.error("api", "request failed", corr)
              trace = logger.query_by_correlation(corr)
              assert len(trace) == 4
              levels = [r.level for r in trace]
              assert levels == [
                  "INFO", "INFO", "WARNING", "ERROR",
              ]
              components = [r.component for r in trace]
              assert components == [
                  "api", "identity", "verification", "api",
              ]
              db.close()


          def test_invalid_level_rejected(tmp_path: Path) -> None:
              db = SQLiteAdapter(tmp_path / "logs.db")
              logger = StructuredLogger(db, FrozenClock())
              with pytest.raises(IntegrityError):
                  logger.log(
                      level="VERBOSE",
                      component="x",
                      message="y",
                      correlation_id="REQ-1",
                  )
              db.close()


          def test_retention_keeps_newest(tmp_path: Path) -> None:
              db = SQLiteAdapter(tmp_path / "logs.db")
              clock = FrozenClock()
              logger = StructuredLogger(db, clock)
              for index in range(10):
                  logger.info("test", f"line {index}", f"REQ-{index}")
                  clock.advance(1)
              removed = logger.enforce_retention(keep=3)
              assert removed == 7
              db.close()


          def test_logs_survive_reopen(tmp_path: Path) -> None:
              path = tmp_path / "logs.db"
              db = SQLiteAdapter(path)
              logger = StructuredLogger(db, FrozenClock())
              logger.info("test", "persist me", "REQ-42")
              db.close()
              db2 = SQLiteAdapter(path)
              logger2 = StructuredLogger(db2, FrozenClock())
              trace = logger2.query_by_correlation("REQ-42")
              assert len(trace) == 1
              assert trace[0].message == "persist me"
              db2.close()
          PYEOF

          echo "=== TELEMETRY + LOGS OK ==="

