name: zyra-n6a-axis-files

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-n6a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AXIS NetworkClient
        run: |
          set -euo pipefail
          mkdir -p apps/axis/infrastructure/network
          cat > apps/axis/infrastructure/network/network_client.py <<'PYEOF'
          """AXIS HTTP client to ZYRA Network."""
          from __future__ import annotations

          import json
          import os
          import urllib.request


          class NetworkClient:
              def __init__(
                  self,
                  base_url: str | None = None,
                  *,
                  timeout_seconds: float = 5.0,
                  max_retries: int = 2,
              ) -> None:
                  self._base = (
                      base_url
                      or os.environ.get("ZYRA_URL", "")
                  ).rstrip("/")
                  self._timeout = timeout_seconds
                  self._retries = max(0, max_retries)

              def get(self, path: str) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._call("GET", path)

              def post(
                  self, path: str, payload: dict
              ) -> tuple[bool, dict | None, str | None]:
                  return self._call("POST", path, payload)

              def _call(
                  self,
                  method: str,
                  path: str,
                  payload: dict | None = None,
              ) -> tuple[bool, dict | None, str | None]:
                  if not self._base:
                      return (
                          False,
                          None,
                          "ZYRA_URL not configured",
                      )
                  url = self._base + path
                  data = None
                  if payload is not None:
                      data = json.dumps(
                          payload
                      ).encode("utf-8")
                  last_error = "unknown"
                  for attempt in range(
                      self._retries + 1
                  ):
                      try:
                          request = urllib.request.Request(
                              url,
                              data=data,
                              method=method,
                              headers={
                                  "Content-Type":
                                  "application/json"
                              },
                          )
                          with urllib.request.urlopen(
                              request,
                              timeout=self._timeout,
                          ) as response:
                              body = json.loads(
                                  response.read()
                                  .decode("utf-8")
                              )
                          if body.get("ok") is True:
                              return (
                                  True,
                                  body.get("data"),
                                  None,
                              )
                          error = body.get("error", {})
                          return (
                              False,
                              None,
                              str(
                                  error.get(
                                      "message",
                                      "rejected",
                                  )
                              ),
                          )
                      except Exception as exc:
                          last_error = str(exc)
                  return False, None, last_error
          PYEOF

      - name: AxisLink (identity + history + evidence seal)
        run: |
          set -euo pipefail
          mkdir -p apps/axis/services
          cat > apps/axis/services/axis_link.py <<'PYEOF'
          """AxisLink: AXIS ops on the Network.
          Never raises - resilience rule."""
          from __future__ import annotations

          import base64

          from apps.axis.infrastructure.network.network_client import (
              NetworkClient,
          )


          class AxisLink:
              def __init__(
                  self, client: NetworkClient
              ) -> None:
                  self._client = client

              def register_app(self) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/apps/register",
                      {
                          "app_id": "axis",
                          "display_name": (
                              "AXIS - Salud, Justicia"
                              " y Seguridad"
                          ),
                          "scopes": [
                              "display_name",
                              "contact",
                          ],
                      },
                  )

              def register_person(
                  self, display_name: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": "person",
                          "display_name": display_name,
                          "actor": "axis",
                      },
                  )

              def complete_trust(
                  self, zid: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/trust/complete",
                      {"zid": zid, "actor": "axis"},
                  )

              def record_file_event(
                  self,
                  zid: str,
                  event: str,
                  detail: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/history/append",
                      {
                          "zid": zid,
                          "entry_type": "other",
                          "actor_app": "axis",
                          "payload": {
                              "event": event,
                              "detail": detail,
                          },
                      },
                  )

              def seal_evidence(
                  self,
                  *,
                  owner_zid: str,
                  evidence_id: str,
                  title: str,
                  content: bytes,
              ) -> tuple[bool, dict | None, str | None]:
                  encoded = base64.b64encode(
                      content
                  ).decode("ascii")
                  return self._client.post(
                      "/documents/seal",
                      {
                          "owner_zid": owner_zid,
                          "title": "Evidencia "
                          + evidence_id,
                          "content_b64": encoded,
                          "actor_app": "axis",
                      },
                  )

              def verify_evidence(
                  self,
                  *,
                  document_id: str,
                  content: bytes,
              ) -> tuple[bool, dict | None, str | None]:
                  encoded = base64.b64encode(
                      content
                  ).decode("ascii")
                  return self._client.post(
                      "/documents/verify",
                      {
                          "document_id": document_id,
                          "content_b64": encoded,
                      },
                  )
          PYEOF

      - name: AxisStore (5 roles: patient/doctor/lawyer/police/government)
        run: |
          set -euo pipefail
          mkdir -p apps/axis/infrastructure/persistence
          cat > apps/axis/infrastructure/persistence/axis_store.py <<'PYEOF'
          """AXIS durable store: expedientes medicos,
          penales, incidentes - roles gobernados."""
          from __future__ import annotations

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          ROLES = (
              "paciente",
              "medico",
              "abogado",
              "policia",
              "gobierno",
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "axis",
                  (
                      "CREATE TABLE axis_accounts ("
                      " account_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " role TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE axis_medical ("
                      " record_id TEXT PRIMARY KEY,"
                      " patient_account TEXT NOT NULL,"
                      " doctor_account TEXT NOT NULL,"
                      " diagnosis TEXT NOT NULL,"
                      " next_appointment TEXT,"
                      " sealed_doc TEXT,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE axis_legal_cases ("
                      " case_id TEXT PRIMARY KEY,"
                      " client_account TEXT NOT NULL,"
                      " lawyer_account TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " detail TEXT NOT NULL,"
                      " sealed_doc TEXT,"
                      " created_at REAL NOT NULL,"
                      " updated_at REAL NOT NULL)",
                      "CREATE TABLE axis_incidents ("
                      " incident_id TEXT PRIMARY KEY,"
                      " police_account TEXT NOT NULL,"
                      " description TEXT NOT NULL,"
                      " sealed_doc TEXT,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class AxisStore:
              """Durable state for AXIS (5 roles)."""

              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "axis", _MIGRATIONS
                  ).run(clock)

              def add_account(
                  self,
                  *,
                  account_id: str,
                  zid: str | None,
                  name: str,
                  role: str,
              ) -> dict[str, object]:
                  if role not in ROLES:
                      raise ValueError(
                          f"unknown role: {role}"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO axis_accounts"
                          " (account_id, zid, name,"
                          "  role, created_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              account_id,
                              zid,
                              name,
                              role,
                              now,
                          ),
                      )
                  return self.get_account(account_id)

              def get_account(
                  self, account_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM axis_accounts"
                      " WHERE account_id = ?",
                      (account_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown account:"
                          f" {account_id}"
                      )
                  return self._account_row(row)

              def list_by_role(
                  self, *, role: str
              ) -> tuple[dict[str, object], ...]:
                  if role not in ROLES:
                      raise ValueError(
                          f"unknown role: {role}"
                      )
                  rows = self._db.query_all(
                      "SELECT * FROM axis_accounts"
                      " WHERE role = ?"
                      " ORDER BY created_at",
                      (role,),
                  )
                  return tuple(
                      self._account_row(r)
                      for r in rows
                  )

              def add_medical_record(
                  self,
                  *,
                  record_id: str,
                  patient_account: str,
                  doctor_account: str,
                  diagnosis: str,
                  next_appointment: str | None,
                  sealed_doc: str | None,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO axis_medical"
                          " (record_id,"
                          "  patient_account,"
                          "  doctor_account,"
                          "  diagnosis,"
                          "  next_appointment,"
                          "  sealed_doc, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?)",
                          (
                              record_id,
                              patient_account,
                              doctor_account,
                              diagnosis,
                              next_appointment,
                              sealed_doc,
                              now,
                          ),
                      )
                  return {
                      "record_id": record_id,
                      "patient": patient_account,
                      "diagnosis": diagnosis,
                      "next_appointment": (
                          next_appointment
                      ),
                  }

              def medical_records_of(
                  self, *, patient_account: str
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM axis_medical"
                      " WHERE patient_account = ?"
                      " ORDER BY created_at",
                      (patient_account,),
                  )
                  return tuple(
                      {
                          "record_id": str(
                              r["record_id"]
                          ),
                          "diagnosis": str(
                              r["diagnosis"]
                          ),
                          "next_appointment": (
                              str(
                                  r[
                                      "next_appointment"
                                  ]
                              )
                              if r[
                                  "next_appointment"
                              ]
                              is not None
                              else None
                          ),
                          "created_at": float(
                              r["created_at"]
                          ),
                      }
                      for r in rows
                  )

              def add_legal_case(
                  self,
                  *,
                  case_id: str,
                  client_account: str,
                  lawyer_account: str,
                  status: str,
                  detail: str,
                  sealed_doc: str | None,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO axis_legal_cases"
                          " (case_id, client_account,"
                          "  lawyer_account, status,"
                          "  detail, sealed_doc,"
                          "  created_at, updated_at)"
                          " VALUES (?, ?, ?, ?, ?, ?,"
                          "  ?, ?)",
                          (
                              case_id,
                              client_account,
                              lawyer_account,
                              status,
                              detail,
                              sealed_doc,
                              now,
                              now,
                          ),
                      )
                  return self.get_case(case_id)

              def update_case_status(
                  self,
                  *,
                  case_id: str,
                  status: str,
                  detail: str,
                  sealed_doc: str | None,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE axis_legal_cases SET"
                          " status = ?, detail = ?,"
                          " sealed_doc = ?,"
                          " updated_at = ?"
                          " WHERE case_id = ?",
                          (
                              status,
                              detail,
                              sealed_doc,
                              now,
                              case_id,
                          ),
                      )
                  return self.get_case(case_id)

              def get_case(
                  self, case_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM axis_legal_cases"
                      " WHERE case_id = ?",
                      (case_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown case:"
                          f" {case_id}"
                      )
                  return {
                      "case_id": str(row["case_id"]),
                      "client_account": str(
                          row["client_account"]
                      ),
                      "lawyer_account": str(
                          row["lawyer_account"]
                      ),
                      "status": str(row["status"]),
                      "detail": str(row["detail"]),
                      "sealed_doc": (
                          str(row["sealed_doc"])
                          if row["sealed_doc"]
                          is not None
                          else None
                      ),
                  }

              def cases_for(
                  self, *, lawyer_account: str
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT case_id FROM"
                      " axis_legal_cases WHERE"
                      " lawyer_account = ?"
                      " ORDER BY updated_at DESC",
                      (lawyer_account,),
                  )
                  return tuple(
                      self.get_case(
                          str(r["case_id"])
                      )
                      for r in rows
                  )

              def add_incident(
                  self,
                  *,
                  incident_id: str,
                  police_account: str,
                  description: str,
                  sealed_doc: str | None,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO axis_incidents"
                          " (incident_id,"
                          "  police_account,"
                          "  description, sealed_doc,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              incident_id,
                              police_account,
                              description,
                              sealed_doc,
                              now,
                          ),
                      )
                  return {
                      "incident_id": incident_id,
                      "police": police_account,
                      "description": description,
                  }

              def list_incidents(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM axis_incidents"
                      " ORDER BY created_at DESC"
                  )
                  return tuple(
                      {
                          "incident_id": str(
                              r["incident_id"]
                          ),
                          "police": str(
                              r["police_account"]
                          ),
                          "description": str(
                              r["description"]
                          ),
                          "sealed_doc": (
                              str(r["sealed_doc"])
                              if r["sealed_doc"]
                              is not None
                              else None
                          ),
                      }
                      for r in rows
                  )

              @staticmethod
              def _account_row(row) -> dict[str, object]:
                  return {
                      "account_id": str(
                          row["account_id"]
                      ),
                      "zid": (
                          str(row["zid"])
                          if row["zid"] is not None
                          else None
                      ),
                      "name": str(row["name"]),
                      "role": str(row["role"]),
                      "created_at": float(
                          row["created_at"]
                      ),
                  }
          PYEOF

      - name: AXIS HTTP surface (5 role screens)
        run: |
          set -euo pipefail
          cat > apps/axis/server.py <<'PYEOF'
          """AXIS HTTP surface: role-based screens."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.axis.infrastructure.persistence.axis_store import (
              ROLES,
              AxisStore,
          )
          from apps.axis.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.axis.services.axis_link import AxisLink

          _CSS = (
              "body{font-family:system-ui,sans-serif;"
              "background:#0d1117;color:#e6edf3;"
              "display:flex;justify-content:center;"
              "padding:20px;margin:0}"
              ".wrap{max-width:680px;width:100%}"
              "h1{font-size:1.3rem}"
              "h2{font-size:1rem;margin-top:20px;"
              "color:#58a6ff}"
              ".card{background:#161b22;border:1px solid"
              " #30363d;border-radius:10px;padding:14px;"
              "margin-top:10px}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px 18px;border-radius:8px;"
              "font-size:1rem;cursor:pointer;margin:6px 4px"
              " 0 0;width:100%;text-align:left}"
              "button.gray{background:#30363d}"
              "input,select{width:100%;box-sizing:border-box;"
              "background:#0d1117;color:#e6edf3;"
              "border:1px solid #30363d;border-radius:6px;"
              "padding:8px;margin:4px 0;font-size:0.95rem}"
              ".ok{background:#0f2417;border:1px solid"
              " #238636;border-radius:8px;padding:10px;}"
              ".badge{color:#d29922;font-weight:bold}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html lang='es'><head>"
                  "<meta charset='utf-8'>"
                  "<meta name='viewport' content='width="
                  "device-width, initial-scale=1'>"
                  f"<title>{title}</title>"
                  f"<style>{_CSS}</style></head><body>"
                  f"<div class='wrap'>{body}</div></body>"
                  "</html>"
              )


          class AxisApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[AxisStore]
              link: ClassVar[AxisLink]

              def log_message(
                  self, format: str, *args: object
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(self, method: str) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._html(
                          404,
                          _page(
                              "No encontrado",
                              "<h1>404</h1>"
                              f"<p>{exc}</p>",
                          ),
                      )
                  except ValueError as exc:
                      self._html(
                          400,
                          _page(
                              "Error",
                              "<h1>Dato invalido"
                              f"</h1><p>{exc}</p>",
                          ),
                      )
                  except Exception as exc:
                      self._html(
                          500,
                          _page(
                              "Error",
                              "<h1>Error interno"
                              f"</h1><p>{exc}</p>",
                          ),
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != ["axis"]:
                      self._html(
                          404,
                          _page(
                              "404",
                              "<h1>Fuera de AXIS"
                              "</h1>",
                          ),
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_get(s[1:])
                      return
                  store = type(self).store
                  if not s or s == ["home"]:
                      self._home()
                      return
                  if s[0] == "paciente":
                      self._screen_patient(s)
                      return
                  if s[0] == "medico":
                      self._screen_doctor(s)
                      return
                  if s[0] == "abogado":
                      self._screen_lawyer(s)
                      return
                  if s[0] == "policia":
                      self._screen_police()
                      return
                  if s == ["gobierno"]:
                      self._screen_government()
                      return
                  self._html(
                      404,
                      _page("404", "<h1>No"
                      " encontrado</h1>"),
                  )

              def _post(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_post(s[1:])
                      return
                  store = type(self).store
                  link = type(self).link
                  doc = self._read_form()
                  if s == ["register"]:
                      name = self._req(doc, "name")
                      role = str(
                          doc.get("role", "paciente")
                      )
                      if role not in ROLES:
                          raise ValueError(
                              f"unknown role: {role}"
                          )
                      account_id = (
                          "AX-"
                          + uuid.uuid4().hex[:12]
                      )
                      zid: str | None = None
                      ok, data, _error = (
                          link.register_person(name)
                      )
                      if ok and data is not None:
                          zid = str(data.get("zid"))
                      store.add_account(
                          account_id=account_id,
                          zid=zid,
                          name=name,
                          role=role,
                      )
                      self._html(
                          200,
                          _page(
                              "Cuenta AXIS creada",
                              "<h1>Cuenta creada"
                              "</h1>"
                              "<p>Tu ID: <b>"
                              + account_id
                              + "</b></p>"
                              "<p>Tu ZID: <b>"
                              + (zid or "pendiente")
                              + "</b></p>"
                              "<a href='/axis/"
                              + role
                              + "/"
                              + account_id
                              + "'><button>Ir a mi"
                              " panel</button></a>",
                          ),
                      )
                      return
                  if s == ["medical"]:
                      patient_account = self._req(
                          doc, "patient_account"
                      )
                      doctor_account = self._req(
                          doc, "doctor_account"
                      )
                      diagnosis = self._req(
                          doc, "diagnosis"
                      )
                      appointment = doc.get(
                          "next_appointment"
                      )
                      appointment = (
                          str(appointment)
                          if appointment is not None
                          else None
                      )
                      patient = store.get_account(
                          patient_account
                      )
                      zid = patient.get("zid")
                      sealed_doc: str | None = None
                      if zid is not None:
                          ok, data, _error = (
                              link.seal_evidence(
                                  owner_zid=str(
                                      zid
                                  ),
                                  evidence_id=(
                                      "MED-"
                                      + uuid.uuid4()
                                      .hex[:8]
                                  ),
                                  title=(
                                      "Diagnostico:"
                                      " "
                                      + diagnosis
                                  ),
                                  content=(
                                      diagnosis.encode(
                                          "utf-8"
                                      )
                                  ),
                              )
                          )
                          if (
                              ok
                              and data is not None
                          ):
                              sealed_doc = str(
                                  data.get(
                                      "document_id"
                                  )
                              )
                      row = store.add_medical_record(
                          record_id=(
                              "MED-"
                              + uuid.uuid4().hex[:10]
                          ),
                          patient_account=(
                              patient_account
                          ),
                          doctor_account=(
                              doctor_account
                          ),
                          diagnosis=diagnosis,
                          next_appointment=(
                              appointment
                          ),
                          sealed_doc=sealed_doc,
                      )
                      if zid is not None:
                          link.record_file_event(
                              str(zid),
                              "medical_record",
                              diagnosis,
                          )
                      cita = (
                          row["next_appointment"]
                          or "sin cita programada"
                      )
                      self._html(
                          200,
                          _page(
                              "Registro medico",
                              "<h1>Registro sellado"
                              " en la Red</h1>"
                              "<p>Diagnostico: "
                              + diagnosis
                              + "</p><p>Proxima cita:"
                              " "
                              + cita
                              + " (automatica)"
                              "</p>"
                              "<a href='/axis/medico/"
                              + doctor_account
                              + "'><button>Volver"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["case"]:
                      client_account = self._req(
                          doc, "client_account"
                      )
                      lawyer_account = self._req(
                          doc, "lawyer_account"
                      )
                      status = self._req(
                          doc, "status"
                      )
                      if status not in (
                          "proceso",
                          "libre",
                          "preso",
                          "cerrado",
                      ):
                          raise ValueError(
                              "estado invalido"
                          )
                      detail = self._req(
                          doc, "detail"
                      )
                      case_id = (
                          "CASE-"
                          + uuid.uuid4().hex[:10]
                      )
                      row = store.add_legal_case(
                          case_id=case_id,
                          client_account=(
                              client_account
                          ),
                          lawyer_account=(
                              lawyer_account
                          ),
                          status=status,
                          detail=detail,
                          sealed_doc=None,
                      )
                      link.record_file_event(
                          client_account,
                          "legal_case",
                          f"{case_id}: {status}",
                      )
                      self._html(
                          200,
                          _page(
                              "Caso registrado",
                              "<h1>Caso"
                              f" {case_id}</h1>"
                              "<p>Estado: "
                              + status
                              + "</p>"
                              "<a href='/axis/abogado/"
                              + lawyer_account
                              + "'><button>Mis casos"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["case-update"]:
                      case_id = self._req(
                          doc, "case_id"
                      )
                      lawyer_account = self._req(
                          doc, "lawyer_account"
                      )
                      status = self._req(
                          doc, "status"
                      )
                      detail = self._req(
                          doc, "detail"
                      )
                      row = (
                          store.update_case_status(
                              case_id=case_id,
                              status=status,
                              detail=detail,
                              sealed_doc=None,
                          )
                      )
                      link.record_file_event(
                          row["client_account"],
                          "legal_case_update",
                          f"{case_id}: {status}",
                      )
                      self._html(
                          200,
                          _page(
                              "Caso actualizado",
                              "<h1>Caso"
                              f" {case_id}</h1>"
                              "<p>Nuevo estado: "
                              + status
                              + "</p>"
                              "<a href='/axis/abogado/"
                              + lawyer_account
                              + "'><button>Mis casos"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["incident"]:
                      police_account = self._req(
                          doc, "police_account"
                      )
                      description = self._req(
                          doc, "description"
                      )
                      incident_id = (
                          "INC-"
                          + uuid.uuid4().hex[:10]
                      )
                      sealed_doc: str | None = None
                      ok, data, _error = (
                          link.seal_evidence(
                              owner_zid=(
                                  police_account
                              ),
                              evidence_id=(
                                  incident_id
                              ),
                              title=(
                                  "Incidente "
                                  + incident_id
                              ),
                              content=description.encode(
                                  "utf-8"
                              ),
                          )
                      )
                      if ok and data is not None:
                          sealed_doc = str(
                              data.get(
                                  "document_id"
                              )
                          )
                      store.add_incident(
                          incident_id=incident_id,
                          police_account=(
                              police_account
                          ),
                          description=(
                              description
                          ),
                          sealed_doc=sealed_doc,
                      )
                      self._html(
                          200,
                          _page(
                              "Incidente reportado",
                              "<h1>Incidente sellado"
                              " como evidencia"
                              "</h1>"
                              f"<p>ID: {incident_id}"
                              "</p><p>Documento:"
                              f" {sealed_doc or '-'}"
                              "</p>"
                              "<a href='/axis/policia'>"
                              "<button>Volver"
                              "</button></a>",
                          ),
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>Ruta"
                      " desconocida</h1>"),
                  )

              def _read_form(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  ).decode("utf-8")
                  doc: dict[str, Any] = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          key, value = pair.split(
                              "=", 1
                          )
                          doc[key] = value.replace(
                              "+", " "
                          )
                  return doc

              def _read_json(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  )
                  parsed: Any = json.loads(
                      raw.decode("utf-8")
                  )
                  if not isinstance(parsed, dict):
                      raise ValueError(
                          "body must be a JSON"
                          " object"
                      )
                  return {
                      str(k): v
                      for k, v in parsed.items()
                  }

              @staticmethod
              def _req(
                  doc: dict[str, Any], key: str
              ) -> str:
                  value: Any = doc.get(key)
                  if isinstance(value, int) and not isinstance(
                      value, bool
                  ):
                      value = str(value)
                  if not isinstance(value, str):
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  if not value.strip():
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  return value

              def _api_get(self, s: list[str]) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app": "axis",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _api_post(
                  self, s: list[str]
              ) -> None:
                  store = type(self).store
                  doc = self._read_json()
                  if s == ["accounts"]:
                      account_id = (
                          "AX-"
                          + uuid.uuid4().hex[:12]
                      )
                      row = store.add_account(
                          account_id=account_id,
                          zid=doc.get("zid"),
                          name=self._req(doc, "name"),
                          role=self._req(doc, "role"),
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

