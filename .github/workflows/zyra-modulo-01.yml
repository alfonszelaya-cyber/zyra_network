          assert aid["status"] == "delivered"
          aid = store.confirm_aid(aid_id="AID-1", network_seq=6)
          assert aid["status"] == "confirmed"
          try:
              store.approve_aid(aid_id="AID-1", network_seq=7)
              raise AssertionError("wrong order must fail")
          except ValueError:
              pass
          transitions = [e["transition"] for e in aid["events"]]
          assert transitions == [
              "AID_REQUESTED",
              "AID_ELIGIBILITY_EVALUATED",
              "AID_APPROVED",
              "AID_ASSIGNED",
