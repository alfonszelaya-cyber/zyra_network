                  )["data"]
                  assert "matematicas" in profile[
                      "strengths"
                  ]
                  assert "lectura" in profile[
                      "weaknesses"
                  ]
                  assert 8.0 <= profile["level"] <= 8.5
                  talentos = _get_html(
