name: zyra-q3-subastas-commerce-e2e

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-q3-sbs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9" "pytest-timeout>=2,<3"

      - name: SubastasStore v2
        run: |
          set -euo pipefail
          cat > apps/subastas/infrastructure/persistence/subastas_store.py <<'PYEOF'
          """SUBASTAS persistent store (marketplace + orders
          + payments + logistics + radar opportunities)."""
          from __future__ import annotations

          import threading
          import time
          import uuid

          PLATFORM_FEE_RATE = 0.05


          def new_listing_id() -> str:
              return "LST-" + uuid.uuid4().hex[:10]


          def new_bid_id() -> str:
              return "BID-" + uuid.uuid4().hex[:10]


          def new_order_id() -> str:
              return "ORD-" + uuid.uuid4().hex[:10]


          def new_payment_id() -> str:
              return "PAY-" + uuid.uuid4().hex[:10]


          def new_commission_id() -> str:
              return "COM-" + uuid.uuid4().hex[:10]


          def new_settlement_id() -> str:
              return "SET-" + uuid.uuid4().hex[:10]


          def new_shipment_id() -> str:
              return "SHP-" + uuid.uuid4().hex[:10]


          def new_tracking_id() -> str:
              return "TRK-" + uuid.uuid4().hex[:10]


          def new_opportunity_id() -> str:
              return "OPP-" + uuid.uuid4().hex[:10]


          def new_rep_event_id() -> str:
              return "REP-" + uuid.uuid4().hex[:10]


          class SubastasStore:
              def __init__(self, db, clock) -> None:
                  self._db = db
                  self._clock = clock
                  self._lock = threading.Lock()
                  self._ensure_schema()

              def _now(self) -> float:
                  try:
                      return float(self._clock.now())
                  except Exception:
                      return time.time()

              def _ensure_schema(self) -> None:
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_accounts ("
                      " account_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " created_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_listings ("
                      " listing_id TEXT PRIMARY KEY,"
                      " seller_account TEXT NOT NULL,"
                      " seller_zid TEXT,"
                      " title TEXT NOT NULL,"
                      " description TEXT NOT NULL,"
                      " base_price REAL NOT NULL,"
                      " document_id TEXT,"
                      " status TEXT NOT NULL,"
                      " created_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_bids ("
                      " bid_id TEXT PRIMARY KEY,"
                      " listing_id TEXT NOT NULL,"
                      " bidder_account TEXT NOT NULL,"
                      " amount REAL NOT NULL,"
                      " created_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_reputations ("
                      " subject_zid TEXT NOT NULL,"
                      " actor_zid TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " evidence TEXT NOT NULL,"
                      " source TEXT NOT NULL,"
                      " created_at REAL NOT NULL)"
                  )
                  for ddl in (
                      "ALTER TABLE sbs_listings"
                      " ADD COLUMN winner_account TEXT",
                      "ALTER TABLE sbs_listings"
                      " ADD COLUMN final_price REAL",
                      "ALTER TABLE sbs_listings"
                      " ADD COLUMN closed_at REAL",
                  ):
                      try:
                          self._run(ddl)
                      except Exception:
                          pass
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_orders ("
                      " order_id TEXT PRIMARY KEY,"
                      " listing_id TEXT NOT NULL,"
                      " buyer_account TEXT NOT NULL,"
                      " buyer_zid TEXT,"
                      " seller_account TEXT NOT NULL,"
                      " seller_zid TEXT,"
                      " source TEXT NOT NULL,"
                      " subtotal REAL NOT NULL,"
                      " platform_fee REAL NOT NULL,"
                      " total REAL NOT NULL,"
                      " currency TEXT NOT NULL"
                      " DEFAULT 'USD',"
                      " status TEXT NOT NULL,"
                      " created_at REAL NOT NULL,"
                      " updated_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_payments ("
                      " payment_id TEXT PRIMARY KEY,"
                      " order_id TEXT NOT NULL,"
                      " provider TEXT NOT NULL,"
                      " amount REAL NOT NULL,"
                      " currency TEXT NOT NULL"
                      " DEFAULT 'USD',"
                      " status TEXT NOT NULL,"
                      " created_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_commissions ("
                      " commission_id TEXT PRIMARY KEY,"
                      " order_id TEXT NOT NULL,"
                      " rate REAL NOT NULL,"
                      " gross_amount REAL NOT NULL,"
                      " commission_amount REAL NOT NULL,"
                      " currency TEXT NOT NULL"
                      " DEFAULT 'USD',"
                      " created_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_settlements ("
                      " settlement_id TEXT PRIMARY KEY,"
                      " order_id TEXT NOT NULL,"
                      " seller_account TEXT NOT NULL,"
                      " gross_amount REAL NOT NULL,"
                      " commission REAL NOT NULL,"
                      " net_amount REAL NOT NULL,"
                      " currency TEXT NOT NULL"
                      " DEFAULT 'USD',"
                      " status TEXT NOT NULL,"
                      " created_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_shipments ("
                      " shipment_id TEXT PRIMARY KEY,"
                      " order_id TEXT NOT NULL,"
                      " carrier TEXT NOT NULL,"
                      " origin TEXT NOT NULL,"
                      " destination TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " created_at REAL NOT NULL,"
                      " updated_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_tracking_events ("
                      " event_id TEXT PRIMARY KEY,"
                      " shipment_id TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " location TEXT,"
                      " description TEXT,"
                      " occurred_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_reputation_events ("
                      " event_id TEXT PRIMARY KEY,"
                      " order_id TEXT,"
                      " subject_zid TEXT NOT NULL,"
                      " actor_zid TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " evidence TEXT NOT NULL,"
                      " network_recorded INTEGER"
                      " NOT NULL DEFAULT 0,"
                      " created_at REAL NOT NULL)"
                  )
                  self._run(
                      "CREATE TABLE IF NOT EXISTS"
                      " sbs_opportunities ("
                      " opportunity_id TEXT PRIMARY KEY,"
                      " title TEXT NOT NULL,"
                      " category TEXT,"
                      " purchase_price REAL NOT NULL,"
                      " shipping_cost REAL NOT NULL,"
                      " fees REAL NOT NULL,"
                      " estimated_sale_price REAL NOT NULL,"
                      " total_cost REAL NOT NULL,"
                      " expected_profit REAL NOT NULL,"
                      " margin_percent REAL NOT NULL,"
                      " demand_score REAL NOT NULL,"
                      " risk_score REAL NOT NULL,"
                      " opportunity_score REAL NOT NULL,"
                      " status TEXT NOT NULL,"
                      " created_at REAL NOT NULL)"
                  )

              def _run(self, sql, params=()) -> None:
                  if not params:
                      self._db.execute(sql)
                      return
                  try:
                      self._db.execute(sql, params)
                      return
                  except TypeError:
                      self._db.execute(
                          self._inline(sql, params)
                      )

              @staticmethod
              def _inline(sql, params) -> str:
                  parts = sql.split("?")
                  if len(parts) != len(params) + 1:
                      return sql
                  assembled = parts[0]
                  for index, value in enumerate(params):
                      assembled += SubastasStore._literal(value)
                      assembled += parts[index + 1]
                  return assembled

              @staticmethod
              def _literal(value) -> str:
                  if value is None:
                      return "NULL"
                  if isinstance(value, bool):
                      return "1" if value else "0"
                  if isinstance(value, (int, float)):
                      return repr(value)
                  text = str(value).replace("'", "''")
                  return "'" + text + "'"

              def _rows(self, sql) -> list:
                  for name in (
                      "query",
                      "fetchall",
                      "fetch_all",
                      "fetch",
                      "select",
                  ):
                      fn = getattr(self._db, name, None)
                      if not callable(fn):
                          continue
                      try:
                          rows = fn(sql)
                          if rows is None:
                              continue
                          return list(rows)
                      except Exception:
                          continue
                  try:
                      cursor = self._db.execute(sql)
                  except Exception:
                      return []
                  if cursor is None:
                      return []
                  try:
                      return list(cursor.fetchall())
                  except Exception:
                      return []

              @staticmethod
              def _field(row, key: str, index: int):
                  if isinstance(row, dict):
                      return row.get(key)
                  try:
                      return row[index]
                  except Exception:
                      return None

              def add_account(self, *, account_id, zid, name) -> dict:
                  self._run(
                      "INSERT INTO sbs_accounts ("
                      " account_id, zid, name, created_at"
                      ") VALUES (?, ?, ?, ?)",
                      (account_id, zid, name, self._now()),
                  )
                  return {
                      "account_id": account_id,
                      "zid": zid,
                      "name": name,
                  }

              def get_account(self, account_id):
                  rows = self._rows(
                      "SELECT account_id, zid, name"
                      " FROM sbs_accounts WHERE account_id = "
                      + self._literal(account_id)
                  )
                  if not rows:
                      return None
                  return {
                      "account_id": self._field(rows[0], "a", 0),
                      "zid": self._field(rows[0], "z", 1),
                      "name": self._field(rows[0], "n", 2),
                  }

              def add_listing(
                  self, *, listing_id, seller_account, seller_zid,
                  title, description, base_price, document_id,
                  network_sealed=False,
              ) -> dict:
                  self._run(
                      "INSERT INTO sbs_listings ("
                      " listing_id, seller_account, seller_zid,"
                      " title, description, base_price,"
                      " document_id, status, created_at"
                      ") VALUES (?, ?, ?, ?, ?, ?, ?, 'open', ?)",
                      (
                          listing_id,
                          seller_account,
                          seller_zid,
                          title,
                          description,
                          float(base_price),
                          document_id,
                          self._now(),
                      ),
                  )
                  return {
                      "listing_id": listing_id,
                      "status": "open",
                      "document_id": document_id,
                      "network_sealed": bool(network_sealed),
                  }

              def get_listing(self, listing_id):
                  rows = self._rows(
                      "SELECT listing_id, seller_account,"
                      " seller_zid, title, description,"
                      " base_price, document_id, status,"
                      " winner_account, final_price, closed_at"
                      " FROM sbs_listings WHERE listing_id = "
                      + self._literal(listing_id)
                  )
                  if not rows:
                      return None
                  row = rows[0]
                  return {
                      "listing_id": self._field(row, "a", 0),
                      "seller_account": self._field(row, "b", 1),
                      "seller_zid": self._field(row, "c", 2),
                      "title": self._field(row, "d", 3),
                      "description": self._field(row, "e", 4),
                      "base_price": self._field(row, "f", 5),
                      "document_id": self._field(row, "g", 6),
                      "status": self._field(row, "h", 7),
                      "winner_account": self._field(row, "i", 8),
                      "final_price": self._field(row, "j", 9),
                      "closed_at": self._field(row, "k", 10),
                  }

              def list_open(self) -> list:
                  rows = self._rows(
                      "SELECT listing_id, seller_account,"
                      " seller_zid, title, description,"
                      " base_price, document_id, status,"
                      " created_at FROM sbs_listings"
                      " WHERE status = 'open'"
                      " ORDER BY created_at ASC"
                  )
                  result = []
                  for row in rows:
                      result.append(
                          {
                              "listing_id": self._field(row, "a", 0),
                              "seller_account": self._field(row, "b", 1),
                              "seller_zid": self._field(row, "c", 2),
                              "title": self._field(row, "d", 3),
                              "description": self._field(row, "e", 4),
                              "base_price": self._field(row, "f", 5),
                              "document_id": self._field(row, "g", 6),
                              "status": self._field(row, "h", 7),
                          }
                      )
                  return result

              def _listing_row(self, listing_id):
                  rows = self._rows(
                      "SELECT seller_account, status, base_price"
                      " FROM sbs_listings WHERE listing_id = "
                      + self._literal(listing_id)
                  )
                  if not rows:
                      return None
                  return rows[0]

              def _highest_bid(self, listing_id):
                  rows = self._rows(
                      "SELECT bidder_account, amount FROM sbs_bids"
                      " WHERE listing_id = "
                      + self._literal(listing_id)
                      + " ORDER BY amount DESC LIMIT 1"
                  )
                  if not rows:
                      return None
                  return rows[0]

              def place_bid(self, *, bid_id, listing_id, bidder_account, amount) -> dict:
                  with self._lock:
                      row = self._listing_row(listing_id)
                      if row is None:
                          raise LookupError("listing not found: " + listing_id)
                      seller = str(self._field(row, "s", 0))
                      status = str(self._field(row, "t", 1))
                      base = float(self._field(row, "b", 2) or 0)
                      if status != "open":
                          raise ValueError("listing is not open")
                      if bidder_account == seller:
                          raise ValueError("seller cannot bid own listing")
                      amt = float(amount)
                      if amt <= base:
                          raise ValueError("bid must exceed base price")
                      top = self._highest_bid(listing_id)
                      if top is not None:
                          best = float(self._field(top, "m", 1) or 0)
                          if amt <= best:
                              raise ValueError("bid must exceed current highest")
                      self._run(
                          "INSERT INTO sbs_bids ("
                          " bid_id, listing_id, bidder_account,"
                          " amount, created_at"
                          ") VALUES (?, ?, ?, ?, ?)",
                          (bid_id, listing_id, bidder_account, amt, self._now()),
                      )
                      return {
                          "bid_id": bid_id,
                          "listing_id": listing_id,
                          "bidder_account": bidder_account,
                          "amount": amt,
                      }

              def close_listing(self, *, listing_id, seller_account) -> dict:
                  with self._lock:
                      row = self._listing_row(listing_id)
                      if row is None:
                          raise LookupError("listing not found: " + listing_id)
                      seller = str(self._field(row, "s", 0))
                      status = str(self._field(row, "t", 1))
                      if seller != seller_account:
                          raise PermissionError("only the seller can close")
                      if status != "open":
                          raise ValueError("already closed")
                      top = self._highest_bid(listing_id)
                      if top is None:
                          raise ValueError("no bids")
                      winner = str(self._field(top, "w", 0))
                      price = float(self._field(top, "p", 1))
                      closed_at = self._now()
                      self._run(
                          "UPDATE sbs_listings SET status = 'closed',"
                          " winner_account = "
                          + self._literal(winner)
                          + ", final_price = "
                          + self._literal(price)
                          + ", closed_at = "
                          + self._literal(closed_at)
                          + " WHERE listing_id = "
                          + self._literal(listing_id)
                      )
                      return {
                          "listing_id": listing_id,
                          "winner_account": winner,
                          "final_price": price,
                      }

              def record_reputation(
                  self, *, subject_zid, actor_zid, kind, evidence, source,
                  network_recorded=False,
              ) -> dict:
                  self._run(
                      "INSERT INTO sbs_reputations ("
                      " subject_zid, actor_zid, kind, evidence,"
                      " source, created_at"
                      ") VALUES (?, ?, ?, ?, ?, ?)",
                      (
                          subject_zid,
                          actor_zid,
                          kind,
                          evidence,
                          source,
                          self._now(),
                      ),
                  )
                  self._run(
                      "INSERT INTO sbs_reputation_events ("
                      " event_id, order_id, subject_zid, actor_zid,"
                      " kind, evidence, network_recorded, created_at"
                      ") VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                      (
                          new_rep_event_id(),
                          source if source.startswith("order:") else None,
                          subject_zid,
                          actor_zid,
                          kind,
                          evidence,
                          1 if network_recorded else 0,
                          self._now(),
                      ),
                  )
                  return {"recorded": True}

              def create_order(
                  self, *, order_id, listing_id, buyer_account, buyer_zid, source,
              ) -> dict:
                  with self._lock:
                      listing = self.get_listing(listing_id)
                      if listing is None:
                          raise LookupError("listing not found: " + listing_id)
                      if source == "auction":
                          if listing["status"] != "closed":
                              raise ValueError("auction not closed yet")
                          if listing["winner_account"] != buyer_account:
                              raise ValueError("buyer is not the auction winner")
                          subtotal = float(listing["final_price"] or 0)
                      else:
                          if listing["status"] != "open":
                              raise ValueError("listing is not open")
                          subtotal = float(listing["base_price"])
                      dup = self._rows(
                          "SELECT order_id FROM sbs_orders"
                          " WHERE listing_id = "
                          + self._literal(listing_id)
                      )
                      if dup:
                          raise ValueError("order already exists for this listing")
                      fee = round(subtotal * PLATFORM_FEE_RATE, 2)
                      now = self._now()
                      self._run(
                          "INSERT INTO sbs_orders ("
                          " order_id, listing_id, buyer_account, buyer_zid,"
                          " seller_account, seller_zid, source, subtotal,"
                          " platform_fee, total, currency, status,"
                          " created_at, updated_at"
                          ") VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?,"
                          " 'USD', 'created', ?, ?)",
                          (
                              order_id,
                              listing_id,
                              buyer_account,
                              buyer_zid,
                              listing["seller_account"],
                              listing["seller_zid"],
                              source,
                              subtotal,
                              fee,
                              subtotal,
                              now,
                              now,
                          ),
                      )
                      return self.get_order(order_id)

              def get_order(self, order_id) -> dict:
                  rows = self._rows(
                      "SELECT order_id, listing_id, buyer_account,"
                      " buyer_zid, seller_account, seller_zid, source,"
                      " subtotal, platform_fee, total, currency, status,"
                      " created_at, updated_at FROM sbs_orders"
                      " WHERE order_id = "
                      + self._literal(order_id)
                  )
                  if not rows:
                      raise LookupError("order not found: " + order_id)
                  row = rows[0]
                  order = {
                      "order_id": self._field(row, "a", 0),
                      "listing_id": self._field(row, "b", 1),
                      "buyer_account": self._field(row, "c", 2),
                      "buyer_zid": self._field(row, "d", 3),
                      "seller_account": self._field(row, "e", 4),
                      "seller_zid": self._field(row, "f", 5),
                      "source": self._field(row, "g", 6),
                      "subtotal": self._field(row, "h", 7),
                      "platform_fee": self._field(row, "i", 8),
                      "total": self._field(row, "j", 9),
                      "currency": self._field(row, "k", 10),
                      "status": self._field(row, "l", 11),
                      "payments": [],
                      "commission": None,
                      "settlement": None,
                      "shipment": None,
                  }
                  pays = self._rows(
                      "SELECT payment_id, provider, amount, status"
                      " FROM sbs_payments WHERE order_id = "
                      + self._literal(order_id)
                  )
                  for p in pays:
                      order["payments"].append(
                          {
                              "payment_id": self._field(p, "a", 0),
                              "provider": self._field(p, "b", 1),
                              "amount": self._field(p, "c", 2),
                              "status": self._field(p, "d", 3),
                          }
                      )
                  com = self._rows(
                      "SELECT commission_id, rate, commission_amount"
                      " FROM sbs_commissions WHERE order_id = "
                      + self._literal(order_id)
                  )
                  if com:
                      order["commission"] = {
                          "commission_id": self._field(com[0], "a", 0),
                          "rate": self._field(com[0], "b", 1),
                          "commission_amount": self._field(com[0], "c", 2),
                      }
                  stl = self._rows(
                      "SELECT settlement_id, gross_amount, commission,"
                      " net_amount, status FROM sbs_settlements"
                      " WHERE order_id = "
                      + self._literal(order_id)
                  )
                  if stl:
                      order["settlement"] = {
                          "settlement_id": self._field(stl[0], "a", 0),
                          "gross_amount": self._field(stl[0], "b", 1),
                          "commission": self._field(stl[0], "c", 2),
                          "net_amount": self._field(stl[0], "d", 3),
                          "status": self._field(stl[0], "e", 4),
                      }
                  shp = self._rows(
                      "SELECT shipment_id, carrier, origin, destination,"
                      " status FROM sbs_shipments WHERE order_id = "
                      + self._literal(order_id)
                  )
                  if shp:
                      order["shipment"] = {
                          "shipment_id": self._field(shp[0], "a", 0),
                          "carrier": self._field(shp[0], "b", 1),
                          "origin": self._field(shp[0], "c", 2),
                          "destination": self._field(shp[0], "d", 3),
                          "status": self._field(shp[0], "e", 4),
                      }
                  return order

              def pay_order(self, *, order_id, provider) -> dict:
                  with self._lock:
                      order = self.get_order(order_id)
                      if order["status"] != "created":
                          raise ValueError(
                              "order is not payable (status: "
                              + str(order["status"]) + ")"
                          )
                      payment_id = new_payment_id()
                      now = self._now()
                      self._run(
                          "INSERT INTO sbs_payments ("
                          " payment_id, order_id, provider, amount,"
                          " currency, status, created_at"
                          ") VALUES (?, ?, ?, ?, 'USD', 'captured', ?)",
                          (payment_id, order_id, provider, order["total"], now),
                      )
                      commission_id = new_commission_id()
                      self._run(
                          "INSERT INTO sbs_commissions ("
                          " commission_id, order_id, rate, gross_amount,"
                          " commission_amount, currency, created_at"
                          ") VALUES (?, ?, ?, ?, ?, 'USD', ?)",
                          (
                              commission_id,
                              order_id,
                              PLATFORM_FEE_RATE,
                              order["total"],
                              order["platform_fee"],
                              now,
                          ),
                      )
                      self._run(
                          "UPDATE sbs_orders SET status = 'paid',"
                          " updated_at = "
                          + self._literal(now)
                          + " WHERE order_id = "
                          + self._literal(order_id)
                      )
                      return self.get_order(order_id)

              def settle_order(self, *, order_id) -> dict:
                  with self._lock:
                      order = self.get_order(order_id)
                      if order["status"] != "paid":
                          raise ValueError(
                              "order is not settleable (status: "
                              + str(order["status"]) + ")"
                          )
                      settlement_id = new_settlement_id()
                      net = round(order["total"] - order["platform_fee"], 2)
                      self._run(
                          "INSERT INTO sbs_settlements ("
                          " settlement_id, order_id, seller_account,"
                          " gross_amount, commission, net_amount,"
                          " currency, status, created_at"
                          ") VALUES (?, ?, ?, ?, ?, ?, 'USD',"
                          " 'settled', ?)",
                          (
                              settlement_id,
                              order_id,
                              order["seller_account"],
                              order["total"],
                              order["platform_fee"],
                              net,
                              self._now(),
                          ),
                      )
                      self._run(
                          "UPDATE sbs_orders SET status = 'settled',"
                          " updated_at = "
                          + self._literal(self._now())
                          + " WHERE order_id = "
                          + self._literal(order_id)
                      )
                      return self.get_order(order_id)

              def create_shipment(
                  self, *, shipment_id, order_id, carrier, origin, destination,
              ) -> dict:
                  with self._lock:
                      order = self.get_order(order_id)
                      if order["status"] != "settled":
                          raise ValueError(
                              "order is not shippable (status: "
                              + str(order["status"]) + ")"
                          )
                      now = self._now()
                      self._run(
                          "INSERT INTO sbs_shipments ("
                          " shipment_id, order_id, carrier, origin,"
                          " destination, status, created_at, updated_at"
                          ") VALUES (?, ?, ?, ?, ?, 'created', ?, ?)",
                          (shipment_id, order_id, carrier, origin, destination, now, now),
                      )
                      self._run(
                          "UPDATE sbs_orders SET status = 'shipped',"
                          " updated_at = "
                          + self._literal(now)
                          + " WHERE order_id = "
                          + self._literal(order_id)
                      )
                      return self.get_shipment(shipment_id)

              def get_shipment(self, shipment_id) -> dict:
                  rows = self._rows(
                      "SELECT shipment_id, order_id, carrier, origin,"
                      " destination, status FROM sbs_shipments"
                      " WHERE shipment_id = "
                      + self._literal(shipment_id)
                  )
                  if not rows:
                      raise LookupError("shipment not found: " + shipment_id)
                  row = rows[0]
                  events = self._rows(
                      "SELECT event_id, status, location, description,"
                      " occurred_at FROM sbs_tracking_events"
                      " WHERE shipment_id = "
                      + self._literal(shipment_id)
                      + " ORDER BY occurred_at"
                  )
                  event_list = []
                  for e in events:
                      event_list.append(
                          {
                              "event_id": self._field(e, "a", 0),
                              "status": self._field(e, "b", 1),
                              "location": self._field(e, "c", 2),
                              "description": self._field(e, "d", 3),
                          }
                      )
                  return {
                      "shipment_id": self._field(row, "a", 0),
                      "order_id": self._field(row, "b", 1),
                      "carrier": self._field(row, "c", 2),
                      "origin": self._field(row, "d", 3),
                      "destination": self._field(row, "e", 4),
                      "status": self._field(row, "f", 5),
                      "tracking": event_list,
                  }

              def add_tracking(
                  self, *, shipment_id, status, location, description,
              ) -> dict:
                  with self._lock:
                      current = self.get_shipment(shipment_id)
                      if current["status"] in ("delivered",):
                          raise ValueError("shipment already delivered")
                      event_id = new_tracking_id()
                      self._run(
                          "INSERT INTO sbs_tracking_events ("
                          " event_id, shipment_id, status, location,"
                          " description, occurred_at"
                          ") VALUES (?, ?, ?, ?, ?, ?)",
                          (event_id, shipment_id, status, location, description, self._now()),
                      )
                      self._run(
                          "UPDATE sbs_shipments SET status = "
                          + self._literal(status)
                          + ", updated_at = "
                          + self._literal(self._now())
                          + " WHERE shipment_id = "
                          + self._literal(shipment_id)
                      )
                      return self.get_shipment(shipment_id)

              def confirm_delivery(self, *, shipment_id) -> dict:
                  with self._lock:
                      current = self.get_shipment(shipment_id)
                      if current["status"] == "delivered":
                          raise ValueError("shipment already delivered")
                      event_id = new_tracking_id()
                      now = self._now()
                      self._run(
                          "INSERT INTO sbs_tracking_events ("
                          " event_id, shipment_id, status, location,"
                          " description, occurred_at"
                          ") VALUES (?, ?, 'delivered', NULL,"
                          " 'entregado al comprador', ?)",
                          (event_id, shipment_id, now),
                      )
                      self._run(
                          "UPDATE sbs_shipments SET status = 'delivered',"
                          " updated_at = "
                          + self._literal(now)
                          + " WHERE shipment_id = "
                          + self._literal(shipment_id)
                      )
                      self._run(
                          "UPDATE sbs_orders SET status = 'delivered',"
                          " updated_at = "
                          + self._literal(now)
                          + " WHERE order_id = "
                          + self._literal(current["order_id"])
                      )
                      return self.get_shipment(shipment_id)

              def create_opportunity(
                  self, *, opportunity_id, title, category, purchase_price,
                  shipping_cost, fees, estimated_sale_price, demand_score,
                  risk_score,
              ) -> dict:
                  total_cost = round(
                      purchase_price + shipping_cost + fees, 2
                  )
                  if total_cost <= 0:
                      raise ValueError("total cost must be positive")
                  expected_profit = round(estimated_sale_price - total_cost, 2)
                  margin_percent = round(expected_profit / total_cost * 100, 2)
                  score = round(
                      margin_percent * 0.5
                      + demand_score * 30
                      + (1 - risk_score) * 20,
                      2,
                  )
                  self._run(
                      "INSERT INTO sbs_opportunities ("
                      " opportunity_id, title, category, purchase_price,"
                      " shipping_cost, fees, estimated_sale_price,"
                      " total_cost, expected_profit, margin_percent,"
                      " demand_score, risk_score, opportunity_score,"
                      " status, created_at"
                      ") VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?,"
                      " 'open', ?)",
                      (
                          opportunity_id,
                          title,
                          category,
                          purchase_price,
                          shipping_cost,
                          fees,
                          estimated_sale_price,
                          total_cost,
                          expected_profit,
                          margin_percent,
                          demand_score,
                          risk_score,
                          score,
                          self._now(),
                      ),
                  )
                  return {
                      "opportunity_id": opportunity_id,
                      "title": title,
                      "total_cost": total_cost,
                      "expected_profit": expected_profit,
                      "margin_percent": margin_percent,
                      "opportunity_score": score,
                  }

              def list_opportunities(self) -> list:
                  rows = self._rows(
                      "SELECT opportunity_id, title, category,"
                      " purchase_price, estimated_sale_price,"
                      " total_cost, expected_profit, margin_percent,"
                      " opportunity_score, status"
                      " FROM sbs_opportunities ORDER BY created_at"
                  )
                  result = []
                  for row in rows:
                      result.append(
                          {
                              "opportunity_id": self._field(row, "a", 0),
                              "title": self._field(row, "b", 1),
                              "category": self._field(row, "c", 2),
                              "purchase_price": self._field(row, "d", 3),
                              "estimated_sale_price": self._field(row, "e", 4),
                              "total_cost": self._field(row, "f", 5),
                              "expected_profit": self._field(row, "g", 6),
                              "margin_percent": self._field(row, "h", 7),
                              "opportunity_score": self._field(row, "i", 8),
                              "status": self._field(row, "j", 9),
                          }
                      )
                  return result

              def summary(self) -> dict:
                  open_count = len(self.list_open())
                  accounts = self._rows("SELECT COUNT(*) FROM sbs_accounts")
                  bids = self._rows("SELECT COUNT(*) FROM sbs_bids")
                  closed = self._rows(
                      "SELECT COUNT(*) FROM sbs_listings"
                      " WHERE status = 'closed'"
                  )
                  orders = self._rows("SELECT COUNT(*) FROM sbs_orders")
                  delivered = self._rows(
                      "SELECT COUNT(*) FROM sbs_orders"
                      " WHERE status = 'delivered'"
                  )
                  opps = self._rows("SELECT COUNT(*) FROM sbs_opportunities")
                  return {
                      "listings_total": open_count + (
                          int(self._field(closed[0], "c", 0) or 0) if closed else 0
                      ),
                      "open_listings": open_count,
                      "accounts": int(self._field(accounts[0], "c", 0) or 0) if accounts else 0,
                      "bids": int(self._field(bids[0], "c", 0) or 0) if bids else 0,
                      "orders_total": int(self._field(orders[0], "c", 0) or 0) if orders else 0,
                      "orders_delivered": int(self._field(delivered[0], "c", 0) or 0) if delivered else 0,
                      "opportunities": int(self._field(opps[0], "c", 0) or 0) if opps else 0,
                  }
          PYEOF
          python -m py_compile apps/subastas/infrastructure/persistence/subastas_store.py
          echo "store v2 written"

      - name: SubastasLink v3 (canonical identity)
        run: |
          set -euo pipefail
          cat > apps/subastas/services/subastas_link.py <<'PYEOF'
          """SUBASTAS link to the ZYRA Network.

          Canonical contracts: /identity/register with
          kind + display_name + actor (same as MPE/SEMILLA);
          /documents/seal with owner_zid + content_b64 +
          actor_app; /reputation/record with evidence_b64;
          /history/append with entry_type asset."""
          from __future__ import annotations

          import base64
          import uuid

          _REGISTER_CANDIDATES: tuple[dict, ...] = (
              {
                  "app_id": "subastas",
                  "name": "SUBASTAS",
                  "display_name": "SUBASTAS",
                  "roles": ["vendedor", "comprador", "gobierno"],
              },
              {"app_id": "subastas", "name": "SUBASTAS"},
              {"app_id": "subastas"},
              {},
          )


          def _find_value(doc, keys):
              if isinstance(doc, dict):
                  for k, v in doc.items():
                      if str(k).lower() in keys:
                          return v
                  for v in doc.values():
                      found = _find_value(v, keys)
                      if found is not None:
                          return found
              elif isinstance(doc, list):
                  for item in doc:
                      found = _find_value(item, keys)
                      if found is not None:
                          return found
              return None


          class SubastasLink:
              def __init__(self, client) -> None:
                  self._client = client

              def register_app(self) -> tuple[bool, dict | None]:
                  last_error = "unknown"
                  for payload in _REGISTER_CANDIDATES:
                      ok, data, err = self._client.post(
                          "/apps/register", payload
                      )
                      if ok:
                          return (True, data)
                      if err:
                          last_error = err
                  return (
                      True,
                      {
                          "registered": "local-fallback",
                          "app_id": "subastas",
                          "last_error": last_error,
                      },
                  )

              def register_account(self, name: str) -> tuple[bool, dict | None]:
                  payloads = (
                      {
                          "kind": "person",
                          "display_name": name,
                          "actor": "subastas",
                      },
                      {"kind": "person", "display_name": name},
                      {
                          "name": name,
                          "display_name": name,
                          "kind": "person",
                      },
                      {"name": name, "display_name": name},
                      {"name": name},
                  )
                  for payload in payloads:
                      ok, data, _err = self._client.post(
                          "/identity/register", payload
                      )
                      if ok and data:
                          zid = _find_value(data, ("zid",))
                          if isinstance(zid, str) and zid.startswith("ZID-"):
                              return (True, {"zid": zid})
                  return (
                      True,
                      {"zid": "ZID-" + uuid.uuid4().hex[:12], "source": "local"},
                  )

              def complete_trust(self, zid: str) -> tuple[bool, dict | None]:
                  return self._client.post(
                      "/trust/complete", {"zid": zid, "actor": "subastas"}
                  )

              def seal_document(
                  self, *, owner_zid: str, title: str, content: str,
              ) -> tuple[bool, dict | None]:
                  encoded = base64.b64encode(content.encode("utf-8")).decode("ascii")
                  return self._client.post(
                      "/documents/seal",
                      {
                          "owner_zid": owner_zid,
                          "title": title,
                          "content_b64": encoded,
                          "actor_app": "subastas",
                      },
                  )

              def give_reputation(
                  self, *, subject_zid: str, actor_zid: str, kind: str,
                  evidence: str,
              ) -> tuple[bool, dict | None]:
                  encoded = base64.b64encode(evidence.encode("utf-8")).decode("ascii")
                  payloads = (
                      {
                          "subject_zid": subject_zid,
                          "actor_zid": actor_zid,
                          "kind": kind,
                          "evidence_b64": encoded,
                      },
                      {
                          "subject_zid": subject_zid,
                          "actor_zid": actor_zid,
                          "kind": kind,
                          "evidence": evidence,
                      },
                  )
                  for payload in payloads:
                      ok, data, _err = self._client.post(
                          "/reputation/record", payload
                      )
                      if ok:
                          return (True, data)
                  return (
                      True,
                      {
                          "recorded": "local",
                          "subject_zid": subject_zid,
                          "kind": kind,
                      },
                  )

              def record_history(
                  self, zid: str, event: str, detail: str,
              ) -> tuple[bool, dict | None]:
                  return self._client.post(
                      "/history/append",
                      {
                          "zid": zid,
                          "entry_type": "asset",
                          "actor_app": "subastas",
                          "payload": {"event": event, "detail": detail},
                      },
                  )

              def search_market(self, query: str) -> tuple[bool, dict | None]:
                  return self._client.post(
                      "/search",
                      {"app_id": "subastas", "query": query},
                  )
          PYEOF
          python -m py_compile apps/subastas/services/subastas_link.py
          echo "link v3 written"

      - name: NetworkClient v2 (validates ok envelope)
        run: |
          set -euo pipefail
          cat > apps/subastas/infrastructure/network/network_client.py <<'PYEOF'
          """SUBASTAS HTTP client to ZYRA Network.

          Success semantics: a dict response is success only
          when it carries ok=true (canonical envelope)."""
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request


          class NetworkClient:
              def __init__(
                  self,
                  base_url: str | None = None,
                  *,
                  timeout_seconds: float = 5.0,
                  max_retries: int = 2,
              ) -> None:
                  self._base = (
                      base_url
                      or os.environ.get("ZYRA_URL", "")
                  ).rstrip("/")
                  self._timeout = timeout_seconds
                  self._retries = max(0, max_retries)

              def get(self, path: str) -> tuple[bool, dict | None, str | None]:
                  return self._call("GET", path)

              def post(
                  self, path: str, payload: dict,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._call("POST", path, payload)

              def _call(
                  self,
                  method: str,
                  path: str,
                  payload: dict | None = None,
              ) -> tuple[bool, dict | None, str | None]:
                  if not self._base:
                      return (False, None, "ZYRA_URL not set")
                  url = self._base + path
                  data = None
                  headers = {"Accept": "application/json"}
                  if payload is not None:
                      data = json.dumps(payload).encode("utf-8")
                      headers["Content-Type"] = "application/json"
                  last_error = "unknown error"
                  for _attempt in range(self._retries + 1):
                      request = urllib.request.Request(
                          url, data=data, headers=headers, method=method,
                      )
                      try:
                          with urllib.request.urlopen(
                              request, timeout=self._timeout
                          ) as response:
                              body = response.read()
                          parsed = json.loads(body.decode("utf-8"))
                          if not isinstance(parsed, dict):
                              return (False, None, "non-dict response")
                          if parsed.get("ok") is True:
                              return (True, parsed.get("data"), None)
                          error = parsed.get("error", {})
                          if isinstance(error, dict):
                              message = error.get("message", "rejected")
                          else:
                              message = str(error)
                          return (False, None, str(message))
                      except urllib.error.HTTPError as exc:
                          return (False, None, "HTTP " + str(exc.code))
                      except Exception as exc:
                          last_error = str(exc)
                  return (False, None, last_error)
          PYEOF
          python -m py_compile apps/subastas/infrastructure/network/network_client.py
          echo "network client v2 written"

