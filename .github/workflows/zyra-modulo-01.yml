name: zyra-w15-triple-engine

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Clean engine inits (W391)
        run: |
          set -euo pipefail
          for f in compression scalability supervisor; do
            p="shared_engines/$f/__init__.py"
            [ -f "$p" ] && printf '"""ZYRA Network engine package."""\n' > "$p"
          done
          echo "inits cleaned"

      - name: Engine compression
        run: |
          set -euo pipefail
          cat > shared_engines/compression/errors.py <<'PYEOF'
          """Typed compression errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
              IntegrityError,
          )


          class CompressionLimitError(EngineError):
              """Input or output exceeds configured
              limits (decompression-bomb guard)."""


          class MalformedEnvelopeError(
              IntegrityError
          ):
              """Envelope is not a valid Zyra
              compression envelope."""
          PYEOF

          cat > shared_engines/compression/engine.py <<'PYEOF'
          """Compression engine: gzip with bomb guards.

          Envelope is canonical JSON (zyra.comp.v1) carrying
          the declared original size and the SHA-256 of the
          plaintext. Decompression is STREAMING with a hard
          output cap: a bomb cannot allocate memory beyond
          the limit even if its header lies. Size and hash
          are re-verified after inflation.

          Pure utility layer: callers (engines above) are
          responsible for auditing their own use of it.
          """
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import zlib
          from dataclasses import dataclass

          from shared_engines.common.errors import (
              IntegrityError,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
              canonical_json_loads,
          )
          from shared_engines.common.validation import (
              require_int_range,
          )
          from shared_engines.compression.errors import (
              CompressionLimitError,
              MalformedEnvelopeError,
          )

          _FORMAT = "zyra.comp.v1"
          _ALGO = "gzip"
          _STEP = 64 * 1024


          @dataclass(frozen=True)
          class CompressionResult:
              envelope: bytes
              original_size: int
              compressed_size: int
              sha256: str


          class CompressionEngine:
              """Bounded gzip compress/decompress."""

              def __init__(
                  self,
                  *,
                  max_input_bytes: int = 10_000_000,
                  max_output_bytes: int = 50_000_000,
              ) -> None:
                  require_int_range(
                      max_input_bytes,
                      "max_input_bytes",
                      1,
                      10**12,
                      config=True,
                  )
                  require_int_range(
                      max_output_bytes,
                      "max_output_bytes",
                      1,
                      10**12,
                      config=True,
                  )
                  self._max_in = max_input_bytes
                  self._max_out = max_output_bytes

              def compress(
                  self, data: bytes
              ) -> CompressionResult:
                  if not data:
                      raise ValueError(
                          "data required"
                      )
                  if len(data) > self._max_in:
                      raise CompressionLimitError(
                          "input exceeds"
                          f" {self._max_in} bytes"
                      )
                  compressed = gzip.compress(data)
                  sha = hashlib.sha256(
                      data
                  ).hexdigest()
                  envelope = canonical_json_dumps(
                      {
                          "format": _FORMAT,
                          "algo": _ALGO,
                          "original_size": len(
                              data
                          ),
                          "sha256": sha,
                          "data": base64.b64encode(
                              compressed
                          ).decode("ascii"),
                      }
                  ).encode("utf-8")
                  return CompressionResult(
                      envelope=envelope,
                      original_size=len(data),
                      compressed_size=len(
                          envelope
                      ),
                      sha256=sha,
                  )

              def decompress(
                  self, envelope: bytes
              ) -> bytes:
                  """Streaming inflate with hard cap;
                  declared size + real size + hash all
                  verified."""
                  try:
                      doc = canonical_json_loads(
                          envelope.decode("utf-8")
                      )
                  except Exception as exc:
                      raise (
                          MalformedEnvelopeError(
                              "envelope not"
                              " decodable"
                          )
                      ) from exc
                  if not isinstance(doc, dict) or (
                      doc.get("format") != _FORMAT
                      or doc.get("algo") != _ALGO
                  ):
                      raise (
                          MalformedEnvelopeError(
                              "unknown envelope"
                              " format"
                          )
                      )
                  declared = int(
                      doc["original_size"]
                  )
                  if declared > self._max_out:
                      raise CompressionLimitError(
                          "declared size exceeds"
                          f" {self._max_out} bytes"
                      )
                  compressed = base64.b64decode(
                      str(doc["data"]),
                      validate=True,
                  )
                  data = self._gunzip_limited(
                      compressed
                  )
                  if len(data) != declared:
                      raise IntegrityError(
                          "size mismatch:"
                          f" {len(data)} !="
                          f" {declared}"
                      )
                  if (
                      hashlib.sha256(
                          data
                      ).hexdigest()
                      != doc["sha256"]
                  ):
                      raise IntegrityError(
                          "sha256 mismatch after"
                          " inflate"
                      )
                  return data

              def _gunzip_limited(
                  self, compressed: bytes
              ) -> bytes:
                  deco = zlib.decompressobj(wbits=31)
                  out = bytearray()
                  start = 0
                  total = len(compressed)
                  while start < total and not deco.eof:
                      end = start + _STEP
                      part = compressed[start:end]
                      room = (
                          self._max_out
                          - len(out)
                          + 1
                      )
                      out += deco.decompress(
                          part, room
                      )
                      if len(out) > self._max_out:
                          raise (
                              CompressionLimitError(
                                  "inflated output"
                                  " exceeds limit"
                              )
                          )
                      start = end
                  while (
                      not deco.eof
                      and deco.unconsumed_tail
                  ):
                      room = (
                          self._max_out
                          - len(out)
                          + 1
                      )
                      out += deco.decompress(
                          deco.unconsumed_tail,
                          room,
                      )
                      if len(out) > self._max_out:
                          raise (
                              CompressionLimitError(
                                  "inflated output"
                                  " exceeds limit"
                              )
                          )
                  if not deco.eof:
                      raise (
                          MalformedEnvelopeError(
                              "truncated gzip"
                              " stream"
                          )
                      )
                  return bytes(out)
          PYEOF
          echo "=== COMPRESSION READY ==="

      - name: Engine scalability
        run: |
          set -euo pipefail
          cat > shared_engines/scalability/errors.py <<'PYEOF'
          """Typed scalability errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
          )


          class CapacityNotDefinedError(
              EngineError
          ):
              """Resource has no registered capacity."""
          PYEOF

          cat > shared_engines/scalability/engine.py <<'PYEOF'
          """Scalability engine: capacity, backpressure,
          deterministic partitioning.

          - Capacity: bounded resources; admission refuses
            beyond the limit using the common BackpressureError.
          - Partitioning: stable sha256-based keys, so an
            entity always maps to the same partition while
            spreading load evenly.

          Pure utility layer for engines that need bounded
          queues/shards; composition roots decide policy.
          """
          from __future__ import annotations

          import hashlib
          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              BackpressureError,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
          )
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.scalability.errors import (
              CapacityNotDefinedError,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "scalability_capacity",
                  (
                      "CREATE TABLE"
                      " scalability_capacity ("
                      " resource TEXT PRIMARY KEY,"
                      " max_items INTEGER NOT NULL,"
                      " used INTEGER NOT NULL,"
                      " updated_at REAL NOT NULL)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class CapacityRecord:
              resource: str
              max_items: int
              used: int


          class ScalabilityEngine:
              """Bounded resources + stable shards."""

              def __init__(
                  self, db: Database, clock: Clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db,
                      "scalability",
                      _MIGRATIONS,
                  ).run(clock)

              def define_capacity(
                  self,
                  *,
                  resource: str,
                  max_items: int,
              ) -> CapacityRecord:
                  require_non_empty_str(
                      resource, "resource"
                  )
                  require_int_range(
                      max_items,
                      "max_items",
                      1,
                      10**12,
                  )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " scalability_capacity"
                          " (resource, max_items,"
                          "  used, updated_at)"
                          " VALUES (?, ?, 0, ?)"
                          " ON CONFLICT(resource)"
                          " DO UPDATE SET"
                          " max_items ="
                          " excluded.max_items,"
                          " updated_at ="
                          " excluded.updated_at",
                          (
                              resource,
                              max_items,
                              self._clock.now(),
                          ),
                      )
                  return self.usage(
                      resource=resource
                  )

              def _row(
                  self, resource: str
              ) -> CapacityRecord:
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " scalability_capacity"
                      " WHERE resource = ?",
                      (resource,),
                  )
                  if row is None:
                      raise (
                          CapacityNotDefinedError(
                              "no capacity for"
                              f" '{resource}'"
                          )
                      )
                  return CapacityRecord(
                      resource=str(
                          row["resource"]
                      ),
                      max_items=int(
                          row["max_items"]
                      ),
                      used=int(row["used"]),
                  )

              def admit(
                  self,
                  *,
                  resource: str,
                  requested: int = 1,
              ) -> CapacityRecord:
                  """Take n slots or refuse with the
                  common BackpressureError."""
                  require_int_range(
                      requested, "requested", 1, 10**9
                  )
                  current = self._row(resource)
                  projected = (
                      current.used + requested
                  )
                  if projected > current.max_items:
                      raise BackpressureError(
                          f"'{resource}' full:"
                          f" {current.used}/"
                          f"{current.max_items},"
                          f" requested {requested}"
                      )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE"
                          " scalability_capacity"
                          " SET used = ?,"
                          " updated_at = ?"
                          " WHERE resource = ?"
                          " AND used + ? <="
                          " max_items",
                          (
                              projected,
                              self._clock.now(),
                              resource,
                              requested,
                          ),
                      )
                  return CapacityRecord(
                      resource=resource,
                      max_items=(
                          current.max_items
                      ),
                      used=projected,
                  )

              def release(
                  self,
                  *,
                  resource: str,
                  amount: int = 1,
              ) -> CapacityRecord:
                  require_int_range(
                      amount, "amount", 1, 10**9
                  )
                  current = self._row(resource)
                  freed = max(
                      0, current.used - amount
                  )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE"
                          " scalability_capacity"
                          " SET used = ?,"
                          " updated_at = ?"
                          " WHERE resource = ?",
                          (
                              freed,
                              self._clock.now(),
                              resource,
                          ),
                      )
                  return CapacityRecord(
                      resource=resource,
                      max_items=(
                          current.max_items
                      ),
                      used=freed,
                  )

              def usage(
                  self, *, resource: str
              ) -> CapacityRecord:
                  require_non_empty_str(
                      resource, "resource"
                  )
                  return self._row(resource)

              @staticmethod
              def partition_key(
                  *,
                  entity_id: str,
                  partitions: int,
              ) -> int:
                  """Stable shard: same entity always
                  maps to the same partition."""
                  require_non_empty_str(
                      entity_id, "entity_id"
                  )
                  require_int_range(
                      partitions,
                      "partitions",
                      1,
                      10_000,
                  )
                  digest = hashlib.sha256(
                      canonical_json_dumps(
                          {"e": entity_id}
                      ).encode("utf-8")
                  ).hexdigest()
                  return int(digest, 16) % partitions
          PYEOF
          echo "=== SCALABILITY READY ==="

      - name: Engine supervisor
        run: |
          set -euo pipefail
          cat > shared_engines/supervisor/errors.py <<'PYEOF'
          """Typed supervisor errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
          )


          class UnknownComponentError(EngineError):
              """Component not registered."""


          class QuarantinedError(EngineError):
              """Component exceeded its restart budget
              and is quarantined."""
          PYEOF

          cat > shared_engines/supervisor/engine.py <<'PYEOF'
          """Supervisor engine: component lifecycle with a
          restart budget.

          States: REGISTERED -> RUNNING <-> FAILED, with
          QUARANTINED as terminal when the restart budget is
          exhausted (a component that keeps dying is stopped
          from thrashing the Network). Every failure and
          restart is audited via the existing AuditTrail.
          """
          from __future__ import annotations

          from dataclasses import dataclass

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )
          from shared_engines.supervisor.errors import (
              QuarantinedError,
              UnknownComponentError,
          )

          STATE_REGISTERED = "REGISTERED"
          STATE_RUNNING = "RUNNING"
          STATE_FAILED = "FAILED"
          STATE_QUARANTINED = "QUARANTINED"

          EVENT_SUPERVISOR_RESTART = (
              "supervisor.component.restarted"
          )
          EVENT_SUPERVISOR_FAILED = (
              "supervisor.component.failed"
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "supervisor_components",
                  (
                      "CREATE TABLE"
                      " supervisor_components ("
                      " name TEXT PRIMARY KEY,"
                      " kind TEXT NOT NULL,"
                      " state TEXT NOT NULL,"
                      " max_restarts INTEGER"
                      " NOT NULL,"
                      " failures INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " restarts INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " last_reason TEXT,"
                      " last_transition REAL"
                      " NOT NULL)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class ComponentRecord:
              name: str
              kind: str
              state: str
              failures: int
              restarts: int
              max_restarts: int
              last_reason: str | None


          class SupervisorEngine:
              """Lifecycle with restart budget."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  audit: AuditTrail,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  MigrationRunner(
                      db,
                      "supervisor",
                      _MIGRATIONS,
                  ).run(clock)

              def _row(self, name: str) -> ComponentRecord:
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " supervisor_components"
                      " WHERE name = ?",
                      (name,),
                  )
                  if row is None:
                      raise UnknownComponentError(
                          f"unknown component:"
                          f" {name}"
                      )
                  return ComponentRecord(
                      name=str(row["name"]),
                      kind=str(row["kind"]),
                      state=str(row["state"]),
                      failures=int(
                          row["failures"]
                      ),
                      restarts=int(
                          row["restarts"]
                      ),
                      max_restarts=int(
                          row["max_restarts"]
                      ),
                      last_reason=(
                          str(
                              row["last_reason"]
                          )
                          if row["last_reason"]
                          is not None
                          else None
                      ),
                  )

              def register(
                  self,
                  *,
                  name: str,
                  kind: str,
                  max_restarts: int = 3,
              ) -> ComponentRecord:
                  require_non_empty_str(
                      name, "name"
                  )
                  require_non_empty_str(
                      kind, "kind"
                  )
                  require_int_range(
                      max_restarts,
                      "max_restarts",
                      1,
                      100,
                  )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " supervisor_components"
                          " (name, kind, state,"
                          "  max_restarts,"
                          "  last_transition)"
                          " VALUES (?, ?, ?, ?, ?)"
                          " ON CONFLICT(name) DO"
                          " NOTHING",
                          (
                              name,
                              kind,
                              STATE_REGISTERED,
                              max_restarts,
                              self._clock.now(),
                          ),
                      )
                  return self._row(name)

              def mark_running(
                  self, *, name: str
              ) -> ComponentRecord:
                  current = self._row(name)
                  if (
                      current.state
                      == STATE_QUARANTINED
                  ):
                      raise QuarantinedError(
                          f"'{name}' is"
                          " quarantined"
                      )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE"
                          " supervisor_components"
                          " SET state = ?,"
                          " last_transition = ?"
                          " WHERE name = ?",
                          (
                              STATE_RUNNING,
                              self._clock.now(),
                              name,
                          ),
                      )
                  return self._row(name)

              def mark_failed(
                  self,
                  *,
                  name: str,
                  reason: str,
              ) -> ComponentRecord:
                  current = self._row(name)
                  require_non_empty_str(
                      reason, "reason"
                  )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE"
                          " supervisor_components"
                          " SET state = ?,"
                          " failures = failures + 1,"
                          " last_reason = ?,"
                          " last_transition = ?"
                          " WHERE name = ?",
                          (
                              STATE_FAILED,
                              reason,
                              self._clock.now(),
                              name,
                          ),
                      )
                  self._audit.append(
                      event_type=(
                          EVENT_SUPERVISOR_FAILED
                      ),
                      actor="supervisor",
                      subject=name,
                      payload={"reason": reason},
                  )
                  return self._row(name)

              def record_restart(
                  self,
                  *,
                  name: str,
                  actor: str,
              ) -> ComponentRecord:
                  """One supervised restart; over budget
                  the component is quarantined."""
                  require_non_empty_str(
                      actor, "actor"
                  )
                  current = self._row(name)
                  restarts = (
                      current.restarts + 1
                  )
                  if (
                      restarts
                      > current.max_restarts
                  ):
                      state = STATE_QUARANTINED
                  else:
                      state = STATE_RUNNING
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE"
                          " supervisor_components"
                          " SET state = ?,"
                          " restarts = ?,"
                          " last_transition = ?"
                          " WHERE name = ?",
                          (
                              state,
                              restarts,
                              self._clock.now(),
                              name,
                          ),
                      )
                  self._audit.append(
                      event_type=(
                          EVENT_SUPERVISOR_RESTART
                      ),
                      actor=actor,
                      subject=name,
                      payload={
                          "restarts": restarts,
                          "state": state,
                      },
                  )
                  record = self._row(name)
                  if (
                      record.state
                      == STATE_QUARANTINED
                  ):
                      raise QuarantinedError(
                          f"'{name}' exceeded"
                          " restart budget"
                          f" ({record.restarts}"
                          ">"
                          f"{record.max_restarts})"
                          " - quarantined"
                      )
                  return record

              def snapshot(
                  self,
              ) -> tuple[ComponentRecord, ...]:
                  rows = self._db.query_all(
                      "SELECT name FROM"
                      " supervisor_components"
                      " ORDER BY name"
                  )
                  return tuple(
                      self._row(
                          str(r["name"])
                      )
                      for r in rows
                  )
          PYEOF
          echo "=== SUPERVISOR READY ==="

      - name: Engine proofs (compression x3, scalability x3, supervisor x3)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/compression/tests shared_engines/scalability/tests shared_engines/supervisor/tests

          cat > shared_engines/compression/tests/test_compression.py <<'PYEOF'
          """Compression proofs: roundtrip, bomb guard,
          corrupted envelope."""
          from __future__ import annotations

          import gzip

          import pytest

          from shared_engines.common.errors import (
              IntegrityError,
          )
          from shared_engines.compression.engine import (
              CompressionEngine,
          )
          from shared_engines.compression.errors import (
              CompressionLimitError,
              MalformedEnvelopeError,
          )


          def test_roundtrip_and_sizes() -> None:
              engine = CompressionEngine()
              data = b"expediente completo" * 1000
              result = engine.compress(data)
              assert (
                  result.original_size == len(data)
              )
              assert (
                  result.compressed_size
                  < len(data)
              )
              assert (
                  engine.decompress(
                      result.envelope
                  )
                  == data
              )


          def test_bomb_guard() -> None:
              small = CompressionEngine(
                  max_input_bytes=1_000_000,
                  max_output_bytes=100_000,
              )
              bomb = b"\x00" * 1_000_000
              tiny = b"\x00" * 500_000
              envelope = small.compress(tiny)
              with pytest.raises(
                  CompressionLimitError
              ):
                  small.decompress(
                      envelope.envelope
                  )
              bigger = b"\x00" * 2_000_000
              with pytest.raises(
                  CompressionLimitError
              ):
                  small.compress(bigger)
              assert len(gzip.compress(bomb)) < 10_000


          def test_corrupted_envelope() -> None:
              engine = CompressionEngine()
              with pytest.raises(
                  MalformedEnvelopeError
              ):
                  engine.decompress(b"not-json")
              result = engine.compress(b"data")
              broken = (
                  result.envelope[:-4]
                  + b'????}'
              )
              with pytest.raises(IntegrityError):
                  engine.decompress(broken)
          PYEOF

          cat > shared_engines/scalability/tests/test_scalability.py <<'PYEOF'
          """Scalability proofs: bounded admission with
          BackpressureError, release, stable partitioning."""
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.common.errors import (
              BackpressureError,
          )
          from shared_engines.scalability.engine import (
              ScalabilityEngine,
          )
          from shared_engines.scalability.errors import (
              CapacityNotDefinedError,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )


          def _engine(tmp_path: Path) -> ScalabilityEngine:
              db = SQLiteAdapter(
                  tmp_path / "scale.db"
              )
              clock = FrozenClock()
              return ScalabilityEngine(db, clock)


          def test_admission_until_backpressure(
              tmp_path: Path,
          ) -> None:
              engine = _engine(tmp_path)
              engine.define_capacity(
                  resource="queue-a", max_items=3
              )
              assert engine.admit(
                  resource="queue-a"
              ).used == 1
              assert engine.admit(
                  resource="queue-a"
              ).used == 2
              assert engine.admit(
                  resource="queue-a"
              ).used == 3
              with pytest.raises(
                  BackpressureError
              ):
                  engine.admit(resource="queue-a")
              with pytest.raises(
                  CapacityNotDefinedError
              ):
                  engine.admit(resource="ghost")


          def test_release_reopens_capacity(
              tmp_path: Path,
          ) -> None:
              engine = _engine(tmp_path)
              engine.define_capacity(
                  resource="q", max_items=2
              )
              engine.admit(resource="q")
              engine.admit(resource="q")
              with pytest.raises(
                  BackpressureError
              ):
                  engine.admit(resource="q")
              freed = engine.release(
                  resource="q", amount=1
              )
              assert freed.used == 1
              assert engine.admit(
                  resource="q"
              ).used == 2


          def test_partition_key_stable_and_ranged(
              tmp_path: Path,
          ) -> None:
              k1 = ScalabilityEngine.partition_key(
                  entity_id="ZID-123",
                  partitions=8,
              )
              k2 = ScalabilityEngine.partition_key(
                  entity_id="ZID-123",
                  partitions=8,
              )
              assert k1 == k2
              assert 0 <= k1 < 8
              spread = {
                  ScalabilityEngine.partition_key(
                      entity_id=f"e{i}",
                      partitions=8,
                  )
                  for i in range(200)
              }
              assert len(spread) > 5
