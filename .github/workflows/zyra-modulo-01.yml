          )
          history_result = link.record_history(zid, "probe", "history probe")
          assert bool(history_result[0]) is True
          print("IDENTITY PROBE OK: real network ZID + reputation + history")
          server.shutdown()
          server.server_close()
          db.close()
          PYEOF

