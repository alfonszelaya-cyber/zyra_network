              def detect_talents(
                  self,
                  *,
                  student_account: str,
              ) -> tuple[dict[str, object], ...]:
                  grades = self.grades_of(
                      student_account=(
                          student_account
                      )
                  )
                  by_subject: dict = {}
                  for g in grades:
                      by_subject.setdefault(
                          str(g["subject"]),
                          [],
                      ).append(
                          float(g["score"])
                      )
                  new: list = []
                  for subject, scores in (
                      by_subject.items()
                  ):
                      if len(
                          scores
                      ) < 3:
                          continue
                      average = sum(
                          scores
                      ) / len(scores)
                      if (
                          average
                          < 9.0
                      ):
                          continue
                      exists = self._db.query_one(
                          "SELECT 1 FROM"
                          " semilla_talents WHERE"
                          " student_account = ?"
                          " AND domain = ?",
                          (
                              student_account,
                              subject,
                          ),
                      )
                      if exists is not None:
                          continue
                      talent_id = (
                          "TAL-"
                          + uuid.uuid4().hex[:10]
                      )
                      evidence = (
                          "promedio"
                          f" {average:.1f} en"
                          f" {len(scores)} notas"
                      )
                      now = self._clock.now()
                      with (
                          self._db.transaction()
                      ) as cursor:
                          cursor.execute(
                              "INSERT INTO"
                              " semilla_talents ("
                              " talent_id,"
                              "  student_account,"
                              "  domain, evidence,"
                              "  created_at)"
                              " VALUES (?, ?, ?,"
                              "  ?, ?)",
                              (
                                  talent_id,
                                  student_account,
                                  subject,
                                  evidence,
                                  now,
                              ),
                          )
                      new.append(
                          {
                              "talent_id": (
                                  talent_id
                              ),
                              "domain": subject,
                              "evidence": (
                                  evidence
                              ),
                          }
                      )
                  return tuple(new)

