        run: |
          set -euo pipefail
          cat > apps/mi_primer_empleo/server.py <<'PYEOF'
          """MPE HTTP server - bidirectional employment."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from urllib.parse import parse_qs

          from apps.mi_primer_empleo.infrastructure.persistence.mpe_store import (
              MpeStore,
          )
          from apps.mi_primer_empleo.services.mpe_link import (
              MpeLink,
          )


          def _new_account_id() -> str:
              return "MPE-" + uuid.uuid4().hex[:12]


          def _new_job_id() -> str:
              return "JOB-" + uuid.uuid4().hex[:10]


          def _new_proposal_id() -> str:
              return "PROP-" + uuid.uuid4().hex[:10]


          def _new_hire_id() -> str:
              return "HIR-" + uuid.uuid4().hex[:10]


          def _new_application_id() -> str:
              return "APP-" + uuid.uuid4().hex[:10]


          def _find_zid(doc):
              if isinstance(doc, dict):
                  for key, value in (
                      doc.items()
                  ):
                      if (
                          str(key).lower()
                          == "zid"
                          and isinstance(
                              value, str
                          )
                          and value.startswith(
                              "ZID-"
                          )
                      ):
                          return value
                  for value in doc.values():
                      found = _find_zid(value)
                      if found is not None:
                          return found
              elif isinstance(doc, list):
                  for item in doc:
                      found = _find_zid(item)
                      if found is not None:
                          return found
              return None


          def _find_credential_id(doc):
              if isinstance(doc, dict):
                  for key, value in (
                      doc.items()
                  ):
                      key_lower = str(
                          key
                      ).lower()
                      if (
                          (
                              "credential"
                              in key_lower
                          )
                          or key_lower == "id"
                      ) and isinstance(
                          value, str
                      ) and value:
                          return value
                  for value in doc.values():
                      found = (
                          _find_credential_id(
                              value
                          )
                      )
                      if found is not None:
                          return found
              elif isinstance(doc, list):
                  for item in doc:
                      found = (
                          _find_credential_id(
                              item
                          )
                      )
                      if found is not None:
                          return found
              return None


          class MpeApiHandler(BaseHTTPRequestHandler):
              store: MpeStore
              link: MpeLink

              def log_message(
                  self, format: str, *args,
              ) -> None:
                  pass

              def _send_bytes(
                  self,
                  status: int,
                  ctype: str,
                  body: bytes,
              ) -> None:
                  self.send_response(status)
                  self.send_header(
                      "Content-Type", ctype
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body)),
                  )
                  self.end_headers()
                  self.wfile.write(body)

              def _send_html(
                  self, status: int, html: str,
              ) -> None:
                  self._send_bytes(
                      status,
                      "text/html",
                      html.encode("utf-8"),
                  )

              def _send_json(
                  self, status: int, doc: dict,
              ) -> None:
                  self._send_bytes(
                      status,
                      "application/json",
                      json.dumps(doc).encode(
                          "utf-8"
                      ),
                  )

              def _ok(self, data) -> None:
                  self._send_json(
                      200,
                      {"ok": True, "data": data},
                  )

              def _api_error(
                  self,
                  status: int,
                  message: str,
              ) -> None:
                  self._send_json(
                      status,
                      {
                          "ok": False,
                          "error": message,
                      },
                  )

              def _html_error(
                  self,
                  status: int,
                  message: str,
              ) -> None:
                  self._send_html(
                      status,
                      "<html><body><h1>MPE"
                      "</h1><p>Error: "
                      + message
                      + "</p></body></html>",
                  )

              def _read_body(self) -> bytes:
                  try:
                      length = int(
                          self.headers.get(
                              "Content-Length",
                              "0",
                          )
                          or "0"
                      )
                  except Exception:
                      length = 0
                  if length <= 0:
                      return b""
                  return self.rfile.read(
                      length
                  )

              def _read_form(self) -> dict:
                  raw = self._read_body()
                  parsed = parse_qs(
                      raw.decode("utf-8")
                  )
                  form: dict[str, str] = {}
                  for key, values in (
                      parsed.items()
                  ):
                      if values:
                          form[key] = values[0]
                  return form

              def _read_json(self) -> dict | None:
                  raw = self._read_body()
                  if not raw:
                      return {}
                  try:
                      doc = json.loads(
                          raw.decode("utf-8")
                      )
                  except Exception:
                      return None
                  if not isinstance(doc, dict):
                      return None
                  return doc

              @staticmethod
              def _form_value(
                  form: dict, key: str,
              ) -> str:
                  value = form.get(key, "")
                  if value is None:
                      return ""
                  return str(value)

              def _split_path(self) -> tuple[
                  str, dict,
              ]:
                  raw = self.path
                  if "?" in raw:
                      path, qs = raw.split(
                          "?", 1
                      )
                      query = {
                          k: v[0]
                          for k, v in parse_qs(
                              qs
                          ).items()
                          if v
                      }
                  else:
                      path = raw
                      query = {}
                  return path, query

              def _network_on_hire(
                  self,
                  job_id: str,
                  worker_account: str,
              ) -> dict:
                  result: dict = {
                      "credential": {
                          "issued": False,
                      },
                      "history_recorded":
                      False,
                  }
                  try:
                      status = (
                          self.store.job_status(
                              job_id=job_id
                          )
                      )
                      worker = (
                          self.store.get_account(
                              worker_account
                          )
                      )
                      worker_zid = worker.get(
                          "zid"
                      )
                      company = (
                          self.store.get_account(
                              str(
                                  status[
                                      "company_account"
                                  ]
                              )
                          )
                      )
                      company_zid = (
                          company.get("zid")
                      )
                      if (
                          worker_zid
                          and company_zid
                      ):
                          ok, data, err = (
                              self.link
                              .issue_employment_credential(
                                  subject_zid=str(
                                      worker_zid
                                  ),
                                  issuer_zid=str(
                                      company_zid
                                  ),
                                  title=str(
                                      status[
                                          "title"
                                      ]
                                  ),
                                  detail=(
                                      "contratacion"
                                      " registrada en"
                                      " MPE"
                                  ),
                              )
                          )
                          credential = {
                              "issued": bool(
                                  ok
                              ),
                          }
                          if (
                              ok
                              and isinstance(
                                  data, dict
                              )
                          ):
                              credential_id = (
                                  _find_credential_id(
                                      data
                                  )
                              )
                              if (
                                  credential_id
                              ):
                                  credential[
                                      "credential_id"
                                  ] = (
                                      credential_id
                                  )
                          elif not ok:
                              credential[
                                  "error"
                              ] = err
                          result[
                              "credential"
                          ] = credential
                      if worker_zid:
                          hok, _hd, _he = (
                              self.link
                              .record_work_event(
                                  str(
                                      worker_zid
                                  ),
                                  "hired",
                                  str(
                                      status[
                                          "title"
                                      ]
                                  ),
                              )
                          )
                          result[
                              "history_recorded"
                          ] = bool(hok)
                  except Exception:
                      pass
                  return result

              def _network_on_leave(
                  self,
                  job_id: str,
                  worker_account: str,
              ) -> bool:
                  try:
                      worker = (
                          self.store.get_account(
                              worker_account
                          )
                      )
                      worker_zid = worker.get(
                          "zid"
                      )
                      if not worker_zid:
                          return False
                      status = (
                          self.store.job_status(
                              job_id=job_id
                          )
                      )
                      hok, _hd, _he = (
                          self.link.record_work_event(
                              str(worker_zid),
                              "left",
                              str(
                                  status["title"]
                              ),
                          )
                      )
                      return bool(hok)
                  except Exception:
                      return False

              def do_GET(self) -> None:
                  path, query = (
                      self._split_path()
                  )
                  try:
                      if path in (
                          "/",
                          "/mpe",
                          "/mpe/home",
                      ):
                          self._send_html(
                              200,
                              self._home(),
                          )
                          return
                      if path == "/mpe/jobs":
                          self._send_html(
                              200,
                              self._jobs_html(),
                          )
                          return
                      if path == (
                          "/mpe/government/summary"
                      ):
                          self._send_html(
                              200,
                              self._gov_html(),
                          )
                          return
                      if path.startswith(
                          "/mpe/trabajador/"
                      ):
                          account_id = path.split(
                              "/mpe/trabajador/",
                              1,
                          )[1]
                          self._worker_panel(
                              account_id
                          )
                          return
                      if path.startswith(
                          "/mpe/empresa/"
                      ):
                          account_id = path.split(
                              "/mpe/empresa/",
                              1,
                          )[1]
                          self._company_panel(
                              account_id
                          )
                          return
                      if path == (
                          "/mpe/api/health"
                      ):
                          self._ok(
                              {
                                  "app": "mpe",
                                  "status": "ok",
                              }
                          )
                          return
                      if path == (
                          "/mpe/api/summary"
                      ):
                          self._ok(
                              self.store.summary()
                          )
                          return
                      if path == (
                          "/mpe/api/jobs"
                      ):
                          jobs = []
                          for job in (
                              self.store.list_jobs()
                          ):
                              jobs.append(
                                  self.store
                                  .job_status(
                                      job_id=str(
                                          job[
                                              "job_id"
                                          ]
                                      )
                                  )
                              )
                          self._ok(
                              {"jobs": jobs}
                          )
                          return
                      if path == (
                          "/mpe/api/workers"
                      ):
                          profession = query.get(
                              "profession"
                          )
                          workers = (
                              self.store
                              .list_workers(
                                  profession=(
                                      profession
                                  )
                              )
                          )
                          self._ok(
                              {
                                  "workers": list(
                                      workers
                                  )
                              }
                          )
                          return
                      if path.startswith(
                          "/mpe/api/job/"
                      ):
                          job_id = path.split(
                              "/mpe/api/job/",
                              1,
                          )[1]
                          self._ok(
                              self.store.job_status(
                                  job_id=job_id
                              )
                          )
                          return
                      if path == (
                          "/mpe/api/proposals"
                      ):
                          proposals = (
                              self.store
                              .list_proposals(
                                  worker_account=(
                                      query.get(
                                          "worker"
                                      )
                                  ),
                                  job_id=(
                                      query.get(
                                          "job"
                                      )
                                  ),
                                  status=(
                                      query.get(
                                          "status",
                                          "pending",
                                      )
                                  ),
                              )
                          )
                          self._ok(
                              {
                                  "proposals": list(
                                      proposals
                                  )
                              }
                          )
                          return
                      if path == (
                          "/mpe/api/notifications"
                      ):
                          self._notifications(
                              query
                          )
                          return
                      self._api_error(
                          404,
                          "unknown path: "
                          + path,
                      )
                  except LookupError as exc:
                      self._api_error(
                          404, str(exc)
                      )
                  except ValueError as exc:
                      self._api_error(
                          400, str(exc)
                      )
                  except Exception:
                      self._api_error(
                          500, "server error"
                      )

              def _notifications(
                  self, query: dict,
              ) -> None:
                  worker = query.get("worker")
                  items: list[dict] = []
                  if worker:
                      for proposal in (
