name: zyra-n4b-nexo-store-fix

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-n4b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Rewrite nexo_store.py with correct INSERT (11 cols, 11 values)
        run: |
          set -euo pipefail
          cat > apps/nexo/infrastructure/persistence/nexo_store.py <<'PYEOF'
          """NexoCore durable ledger: hash-chained
          accounting between ZIDs (fiscal kinds only)."""
          from __future__ import annotations

          import hashlib

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          KINDS = (
              "venta",
              "compra",
              "pago",
              "cobro",
              "ajuste",
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "nexo",
                  (
                      "CREATE TABLE nexo_companies ("
                      " company_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " synced INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE nexo_operations ("
                      " seq INTEGER PRIMARY KEY"
                      " AUTOINCREMENT,"
                      " operation_id TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " seller_zid TEXT NOT NULL,"
                      " buyer_zid TEXT NOT NULL,"
                      " amount REAL NOT NULL,"
                      " description TEXT NOT NULL,"
                      " invoice_id TEXT,"
                      " entry_hash TEXT NOT NULL,"
                      " prev_hash TEXT NOT NULL,"
                      " synced INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          def _entry_hash(
              *,
              seq: int,
              kind: str,
              seller_zid: str,
              buyer_zid: str,
              amount: float,
              description: str,
              prev_hash: str,
              created_at: float,
          ) -> str:
              raw = (
                  str(seq)
                  + "|"
                  + kind
                  + "|"
                  + seller_zid
                  + "|"
                  + buyer_zid
                  + "|"
                  + str(amount)
                  + "|"
                  + description
                  + "|"
                  + str(created_at)
                  + "|"
                  + prev_hash
              )
              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()


          class NexoStore:
              """Hash-chained durable ledger."""

              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "nexo", _MIGRATIONS
                  ).run(clock)

              def add_company(
                  self,
                  *,
                  company_id: str,
                  zid: str | None,
                  name: str,
                  synced: bool,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO nexo_companies"
                          " (company_id, zid, name,"
                          "  synced, created_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              company_id,
                              zid,
                              name,
                              int(synced),
                              now,
                          ),
                      )
                  return self.get_company(company_id)

              def get_company(
                  self, company_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM nexo_companies"
                      " WHERE company_id = ?",
                      (company_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown company:"
                          f" {company_id}"
                      )
                  zid = row["zid"]
                  return {
                      "company_id": str(
                          row["company_id"]
                      ),
                      "zid": (
                          str(zid)
                          if zid is not None
                          else None
                      ),
                      "name": str(row["name"]),
                      "synced": bool(
                          int(row["synced"])
                      ),
                  }

              def record_operation(
                  self,
                  *,
                  operation_id: str,
                  kind: str,
                  seller_zid: str,
                  buyer_zid: str,
                  amount: float,
                  description: str,
                  invoice_id: str | None,
                  synced: bool,
              ) -> dict[str, object]:
                  if kind not in KINDS:
                      raise ValueError(
                          f"unknown kind: {kind}"
                      )
                  if amount <= 0:
                      raise ValueError(
                          "amount must be positive"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      last = cursor.execute(
                          "SELECT seq, entry_hash"
                          " FROM nexo_operations"
                          " ORDER BY seq DESC"
                          " LIMIT 1"
                      ).fetchone()
                      if last is None:
                          seq = 1
                          prev_hash = "GENESIS"
                      else:
                          seq = int(
                              last["seq"]
                          ) + 1
                          prev_hash = str(
                              last["entry_hash"]
                          )
                      entry_hash = _entry_hash(
                          seq=seq,
                          kind=kind,
                          seller_zid=seller_zid,
                          buyer_zid=buyer_zid,
                          amount=amount,
                          description=description,
                          prev_hash=prev_hash,
                          created_at=now,
                      )
                      cursor.execute(
                          "INSERT INTO nexo_operations"
                          " (operation_id, kind,"
                          "  seller_zid, buyer_zid,"
                          "  amount, description,"
                          "  invoice_id, entry_hash,"
                          "  prev_hash, synced,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?,"
                          "  ?, ?, ?, ?, ?, ?)",
                          (
                              operation_id,
                              kind,
                              seller_zid,
                              buyer_zid,
                              amount,
                              description,
                              invoice_id,
                              entry_hash,
                              prev_hash,
                              int(synced),
                              now,
                          ),
                      )
                  return {
                      "operation_id": (
                          operation_id
                      ),
                      "seq": seq,
                      "kind": kind,
                      "amount": amount,
                      "entry_hash": entry_hash,
                      "prev_hash": prev_hash,
                      "invoice_id": invoice_id,
                      "synced": synced,
                  }

              def verify_chain(self) -> bool:
                  rows = self._db.query_all(
                      "SELECT * FROM nexo_operations"
                      " ORDER BY seq"
                  )
                  prev = "GENESIS"
                  for r in rows:
                      expected = _entry_hash(
                          seq=int(r["seq"]),
                          kind=str(r["kind"]),
                          seller_zid=str(
                              r["seller_zid"]
                          ),
                          buyer_zid=str(
                              r["buyer_zid"]
                          ),
                          amount=float(
                              r["amount"]
                          ),
                          description=str(
                              r["description"]
                          ),
                          prev_hash=prev,
                          created_at=float(
                              r["created_at"]
                          ),
                      )
                      if (
                          str(r["entry_hash"])
                          != expected
                          or str(r["prev_hash"])
                          != prev
                      ):
                          return False
                      prev = str(r["entry_hash"])
                  return True

              def list_operations(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM nexo_operations"
                      " ORDER BY seq"
                  )
                  return tuple(
                      {
                          "seq": int(r["seq"]),
                          "operation_id": str(
                              r["operation_id"]
                          ),
                          "kind": str(r["kind"]),
                          "seller_zid": str(
                              r["seller_zid"]
                          ),
                          "buyer_zid": str(
                              r["buyer_zid"]
                          ),
                          "amount": float(
                              r["amount"]
                          ),
                          "invoice_id": (
                              str(r["invoice_id"])
                              if r["invoice_id"]
                              is not None
                              else None
                          ),
                          "entry_hash": str(
                              r["entry_hash"]
                          ),
                      }
                      for r in rows
                  )

              def summary(self) -> dict[str, object]:
                  totals = self._db.query_all(
                      "SELECT kind, COUNT(*) AS n,"
                      " SUM(amount) AS total FROM"
                      " nexo_operations"
                      " GROUP BY kind"
                      " ORDER BY kind"
                  )
                  by_kind = {
                      str(r["kind"]): {
                          "count": int(r["n"]),
                          "total": float(
                              r["total"]
                          ),
                      }
                      for r in totals
                  }
                  row = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " nexo_operations"
                  )
                  return {
                      "operations_total": int(
                          row["n"]
                      )
                      if row is not None
                      else 0,
                      "by_kind": by_kind,
                      "chain_intact": (
                          self.verify_chain()
                      ),
                  }
          PYEOF
          echo "store rewritten with correct INSERT"

      - name: Compile check
        run: |
          set -euo pipefail
          python -m compileall -q apps/nexo/infrastructure/persistence/nexo_store.py
          echo "compile OK"
          find apps/nexo -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: NEXO proofs
        run: |
          set -euo pipefail
          mkdir -p apps/nexo/tests
          cat > apps/nexo/tests/test_nexo_core.py <<'PYEOF'
          """NEXO proofs: operation -> hash-chained ledger ->
          invoice sealed on the network -> contador verifies;
          tamper detected; resilience offline."""
          from __future__ import annotations

          import json
          import threading
          from pathlib import Path
          from urllib.request import Request, urlopen

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities,
          )
          from shared_engines.runtime.combined_api import (
              serve_combined,
          )
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )

          from apps.nexo.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.nexo.infrastructure.persistence.nexo_store import (
              NexoStore,
          )
          from apps.nexo.server import serve_nexo
          from apps.nexo.services.nexo_link import NexoLink


          class _Ecosystem:
              def __init__(self, tmp_path: Path) -> None:
                  self.net_db = SQLiteAdapter(
                      tmp_path / "network.db"
                  )
                  net_clock = FrozenClock()
                  signer, _ = Ed25519Signer.generate()
                  config = RuntimeConfig(
                      host="127.0.0.1",
                      port=0,
                      api_token=None,
                  )
                  self.kernel = ZyraKernel(
                      db=self.net_db,
                      clock=net_clock,
                      signer=signer,
                      config=config,
                  )
                  self.kernel.bootstrap_root()
                  self.caps = ZyraCapabilities(
                      self.net_db,
                      net_clock,
                      identity=self.kernel.identity,
                      signer=signer,
                  )
                  self.net_server = serve_combined(
                      self.kernel,
                      self.caps,
                      host="127.0.0.1",
                      port=0,
                  )
                  self.net_thread = threading.Thread(
                      target=(
                          self.net_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.net_thread.start()
                  self.net_base = (
                      "http://127.0.0.1:"
                      f"{self.net_server.server_address[1]}"
                  )
                  self.net_url = self.net_base

                  self.nexo_db = SQLiteAdapter(
                      tmp_path / "nexo.db"
                  )
                  nexo_clock = FrozenClock()
                  self.store = NexoStore(
                      self.nexo_db, nexo_clock
                  )
                  self.client = NetworkClient(
                      self.net_url, max_retries=1
                  )
                  self.link = NexoLink(self.client)
                  self.nexo_server = serve_nexo(
                      self.store, self.client
                  )
                  self.nexo_thread = threading.Thread(
                      target=(
                          self.nexo_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.nexo_thread.start()
                  self.nexo_base = (
                      "http://127.0.0.1:"
                      f"{self.nexo_server.bound_port}"
                  )

              def close(self) -> None:
                  self.nexo_server.shutdown()
                  self.nexo_server.server_close()
                  self.nexo_thread.join(timeout=5)
                  self.net_server.shutdown()
                  self.net_server.server_close()
                  self.net_thread.join(timeout=5)
                  self.nexo_db.close()
                  self.net_db.close()


          def _get(url: str) -> dict[str, object]:
              with urlopen(url, timeout=10) as response:
                  body = json.loads(
                      response.read().decode("utf-8")
                  )
              assert isinstance(body, dict)
              return body


          def _post(
              url: str, doc: dict[str, object]
          ) -> dict[str, object]:
              request = Request(
                  url,
                  data=json.dumps(doc).encode("utf-8"),
                  headers={
                      "Content-Type":
                      "application/json"
                  },
                  method="POST",
              )
              with urlopen(request, timeout=10) as response:
                  body = json.loads(
                      response.read().decode("utf-8")
                  )
              assert isinstance(body, dict)
              return body


          def test_company_operation_chain_invoice(
              tmp_path: Path,
          ) -> None:
              eco = _Ecosystem(tmp_path)
              try:
                  reg = eco.link.register_app()
                  assert reg[0] is True
                  created = _post(
                      f"{eco.nexo_base}/nexo/api/"
                      "companies",
                      {"name": "Mi Negocio SV"},
                  )
                  row = created["data"]
                  assert isinstance(row, dict)
                  assert (
                      row["company_id"]
                      .startswith("EMP-")
                  )
                  op = _post(
                      f"{eco.nexo_base}/nexo/api/"
                      "operations",
                      {
                          "kind": "venta",
                          "seller_zid": "ZID-seller",
                          "buyer_zid": "ZID-buyer",
                          "amount": 250.0,
                          "description": (
                              "venta de mercaderia"
                          ),
                      },
                  )
                  odata = op["data"]
                  assert isinstance(odata, dict)
                  assert odata["seq"] == 1
                  assert odata["synced"] is False
                  verify = _get(
                      f"{eco.nexo_base}/nexo/api/"
                      "ledger/verify"
                  )
                  vdata = verify["data"]
                  assert isinstance(vdata, dict)
                  assert (
                      vdata["chain_intact"]
                      is True
                  )
                  summary = _get(
                      f"{eco.nexo_base}/nexo/api/"
                      "summary"
                  )
                  gdata = summary["data"]
                  assert isinstance(gdata, dict)
                  assert (
                      gdata["operations_total"]
                      == 1
                  )
                  assert (
                      gdata["chain_intact"] is True
                  )
              finally:
                  eco.close()


          def test_tamper_detected_by_chain(
              tmp_path: Path,
          ) -> None:
              db = SQLiteAdapter(
                  tmp_path / "nexo.db"
              )
              clock = FrozenClock()
              store = NexoStore(db, clock)
              store.record_operation(
                  operation_id="OP-1",
                  kind="venta",
                  seller_zid="ZID-a",
                  buyer_zid="ZID-b",
                  amount=100.0,
                  description="original",
                  invoice_id=None,
                  synced=False,
              )
              store.record_operation(
                  operation_id="OP-2",
                  kind="compra",
                  seller_zid="ZID-b",
                  buyer_zid="ZID-a",
                  amount=50.0,
                  description="materia prima",
                  invoice_id=None,
                  synced=False,
              )
              assert store.verify_chain() is True
              db.execute(
                  "UPDATE nexo_operations SET"
                  " amount = 9999 WHERE seq = 1"
              )
              assert store.verify_chain() is False
              server = None
              db.close()


          def test_resilience_network_down(
              tmp_path: Path,
          ) -> None:
              db = SQLiteAdapter(
                  tmp_path / "nexo.db"
              )
              clock = FrozenClock()
              store = NexoStore(db, clock)
              dead_client = NetworkClient(
                  "http://127.0.0.1:1",
                  timeout_seconds=1.0,
                  max_retries=0,
              )
              server = serve_nexo(store, dead_client)
              thread = threading.Thread(
                  target=server.serve_forever,
                  daemon=True,
              )
              thread.start()
              base = (
                  "http://127.0.0.1:"
                  f"{server.bound_port}"
              )
              try:
                  created = _post(
                      f"{base}/nexo/api/operations",
                      {
                          "kind": "venta",
                          "seller_zid": "ZID-x",
                          "buyer_zid": "ZID-y",
                          "amount": 75.0,
                          "description": "offline",
                      },
                  )
                  odata = created["data"]
                  assert isinstance(odata, dict)
                  assert odata["synced"] is False
                  assert odata["seq"] == 1
                  verify = _get(
                      f"{base}/nexo/api/ledger/verify"
                  )
                  vdata = verify["data"]
                  assert isinstance(vdata, dict)
                  assert (
                      vdata["chain_intact"] is True
                  )
              finally:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=5)
                  db.close()
          PYEOF
          echo "=== NEXO TESTS READY ==="

      - name: Run NEXO tests
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider apps/nexo/tests/test_nexo_core.py
          echo "NEXO tests OK"
          find apps/nexo -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: N4b nexo_store rewritten - INSERT now 11 placeholders for 11 columns (operation_id/kind/seller/buyer/amount/description/invoice_id/entry_hash/prev_hash/synced/created_at); journey+tamper+resilience proofs"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== N4B COMPLETE: NEXO LIVE ==="
