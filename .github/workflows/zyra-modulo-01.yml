name: zyra-n7-ciclo-digital

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-n7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: CICLO-DIGITAL core files
        run: |
          set -euo pipefail
          mkdir -p apps/ciclo_digital/infrastructure/network
          mkdir -p apps/ciclo_digital/infrastructure/persistence
          mkdir -p apps/ciclo_digital/services
          mkdir -p apps/ciclo_digital/tests

          cat > apps/ciclo_digital/infrastructure/network/network_client.py <<'PYEOF'
          """CICLO-DIGITAL HTTP client to ZYRA Network."""
          from __future__ import annotations

          import json
          import os
          import urllib.request


          class NetworkClient:
              def __init__(
                  self,
                  base_url: str | None = None,
                  *,
                  timeout_seconds: float = 5.0,
                  max_retries: int = 2,
              ) -> None:
                  self._base = (
                      base_url
                      or os.environ.get("ZYRA_URL", "")
                  ).rstrip("/")
                  self._timeout = timeout_seconds
                  self._retries = max(0, max_retries)

              def get(self, path: str) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._call("GET", path)

              def post(
                  self, path: str, payload: dict
              ) -> tuple[bool, dict | None, str | None]:
                  return self._call(
                      "POST", path, payload
                  )

              def _call(
                  self,
                  method: str,
                  path: str,
                  payload: dict | None = None,
              ) -> tuple[bool, dict | None, str | None]:
                  if not self._base:
                      return (
                          False,
                          None,
                          "ZYRA_URL not configured",
                      )
                  url = self._base + path
                  data = None
                  if payload is not None:
                      data = json.dumps(
                          payload
                      ).encode("utf-8")
                  last_error = "unknown"
                  for attempt in range(
                      self._retries + 1
                  ):
                      try:
                          request = urllib.request.Request(
                              url,
                              data=data,
                              method=method,
                              headers={
                                  "Content-Type":
                                  "application/json"
                              },
                          )
                          with urllib.request.urlopen(
                              request,
                              timeout=self._timeout,
                          ) as response:
                              body = json.loads(
                                  response.read()
                                  .decode("utf-8")
                              )
                          if (
                              body.get("ok") is True
                          ):
                              return (
                                  True,
                                  body.get("data"),
                                  None,
                              )
                          error = body.get(
                              "error", {}
                          )
                          return (
                              False,
                              None,
                              str(
                                  error.get(
                                      "message",
                                      "rejected",
                                  )
                              ),
                          )
                      except Exception as exc:
                          last_error = str(exc)
                  return False, None, last_error
          PYEOF

          cat > apps/ciclo_digital/services/ciclo_link.py <<'PYEOF'
          """CicloLink: CICLO-DIGITAL ops on the Network.
          Never raises - resilience rule."""
          from __future__ import annotations

          import base64

          from apps.ciclo_digital.infrastructure.network.network_client import (
              NetworkClient,
          )


          class CicloLink:
              def __init__(
                  self, client: NetworkClient
              ) -> None:
                  self._client = client

              def register_app(self) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/apps/register",
                      {
                          "app_id": "ciclo",
                          "display_name": (
                              "CICLO-DIGITAL"
                          ),
                          "scopes": [
                              "display_name",
                          ],
                      },
                  )

              def register_person(
                  self, display_name: str
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": "person",
                          "display_name": display_name,
                          "actor": "ciclo",
                      },
                  )

              def seal_recycled(
                  self,
                  *,
                  owner_zid: str,
                  item_id: str,
                  description: str,
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  content = (
                      "RECICLADO|"
                      + item_id
                      + "|"
                      + description
                  ).encode("utf-8")
                  encoded = base64.b64encode(
                      content
                  ).decode("ascii")
                  return self._client.post(
                      "/documents/seal",
                      {
                          "owner_zid": owner_zid,
                          "title": "Reciclado "
                          + item_id,
                          "content_b64": encoded,
                          "actor_app": "ciclo",
                      },
                  )

              def earn_tokens(
                  self,
                  *,
                  subject_zid: str,
                  activity: str,
                  ref_id: str,
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/tokens/earn",
                      {
                          "subject_zid": subject_zid,
                          "activity": activity,
                          "ref_type": "reciclaje",
                          "ref_id": ref_id,
                      },
                  )

              def token_balance(
                  self, zid: str
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.get(
                      "/tokens/" + zid + "/balance"
                  )

              def search_network(
                  self,
                  *,
                  app_id: str,
                  query: str,
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/search",
                      {
                          "app_id": app_id,
                          "query": query,
                      },
                  )

              def export_evidence(
                  self,
                  *,
                  subject_zid: str,
                  entries: list[list[str]],
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/export",
                      {
                          "subject_zid": subject_zid,
                          "entries": entries,
                          "actor_app": "ciclo",
                      },
                  )
          PYEOF

          cat > apps/ciclo_digital/infrastructure/persistence/ciclo_store.py <<'PYEOF'
          """CICLO-DIGITAL durable store."""
          from __future__ import annotations

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "ciclo",
                  (
                      "CREATE TABLE ciclo_recycled ("
                      " item_id TEXT PRIMARY KEY,"
                      " owner_zid TEXT NOT NULL,"
                      " description TEXT NOT NULL,"
                      " data_hash TEXT NOT NULL,"
                      " token_amount INTEGER NOT"
                      " NULL DEFAULT 0,"
                      " document_id TEXT,"
                      " synced INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE ciclo_exports ("
                      " export_id TEXT PRIMARY KEY,"
                      " subject_zid TEXT NOT NULL,"
                      " bundle_id TEXT NOT NULL,"
                      " purpose TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class CicloStore:
              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "ciclo", _MIGRATIONS
                  ).run(clock)

              def add_recycled(
                  self,
                  *,
                  item_id: str,
                  owner_zid: str,
                  description: str,
                  data_hash: str,
                  token_amount: int,
                  document_id: str | None,
                  synced: bool,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO ciclo_recycled"
                          " (item_id, owner_zid,"
                          "  description, data_hash,"
                          "  token_amount,"
                          "  document_id, synced,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?,"
                          "  ?, ?)",
                          (
                              item_id,
                              owner_zid,
                              description,
                              data_hash,
                              token_amount,
                              document_id,
                              int(synced),
                              now,
                          ),
                      )
                  return self.get_recycled(item_id)

              def get_recycled(
                  self, item_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM ciclo_recycled"
                      " WHERE item_id = ?",
                      (item_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown recycled item:"
                          f" {item_id}"
                      )
                  doc = row["document_id"]
                  return {
                      "item_id": str(
                          row["item_id"]
                      ),
                      "owner_zid": str(
                          row["owner_zid"]
                      ),
                      "description": str(
                          row["description"]
                      ),
                      "data_hash": str(
                          row["data_hash"]
                      ),
                      "token_amount": int(
                          row["token_amount"]
                      ),
                      "document_id": (
                          str(doc)
                          if doc is not None
                          else None
                      ),
                      "synced": bool(
                          int(row["synced"])
                      ),
                  }

              def list_recycled(
                  self, *, owner_zid: str
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM ciclo_recycled"
                      " WHERE owner_zid = ?"
                      " ORDER BY created_at",
                      (owner_zid,),
                  )
                  return tuple(
                      self.get_recycled(
                          str(r["item_id"])
                      )
                      for r in rows
                  )

              def record_export(
                  self,
                  *,
                  export_id: str,
                  subject_zid: str,
                  bundle_id: str,
                  purpose: str,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO ciclo_exports"
                          " (export_id, subject_zid,"
                          "  bundle_id, purpose,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              export_id,
                              subject_zid,
                              bundle_id,
                              purpose,
                              now,
                          ),
                      )
                  return {
                      "export_id": export_id,
                      "subject_zid": subject_zid,
                      "bundle_id": bundle_id,
                      "purpose": purpose,
                  }
          PYEOF

          cat > apps/ciclo_digital/server.py <<'PYEOF'
          """CICLO-DIGITAL HTTP surface."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.ciclo_digital.infrastructure.persistence.ciclo_store import (
              CicloStore,
          )
          from apps.ciclo_digital.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.ciclo_digital.services.ciclo_link import (
              CicloLink,
          )

          _CSS = (
              "body{font-family:system-ui,sans-serif;"
              "background:#0d1117;color:#e6edf3;"
              "display:flex;justify-content:center;"
              "padding:20px;margin:0}"
              ".wrap{max-width:680px;width:100%}"
              "h1{font-size:1.3rem}"
              "h2{font-size:1rem;margin-top:20px;"
              "color:#58a6ff}"
              ".card{background:#161b22;border:1px solid"
              " #30363d;border-radius:10px;padding:14px;"
              "margin-top:10px}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px 18px;border-radius:8px;"
              "font-size:1rem;cursor:pointer;margin:6px 4px"
              " 0 0;width:100%;text-align:left}"
              "button.gray{background:#30363d}"
              "input,textarea{width:100%;box-sizing:"
              "border-box;background:#0d1117;color:#e6edf3;"
              "border:1px solid #30363d;border-radius:6px;"
              "padding:8px;margin:4px 0;font-size:0.95rem}"
              ".big{font-size:1.6rem;font-weight:bold;"
              "color:#58a6ff}"
              ".ok{background:#0f2417;border:1px solid"
              " #238636;border-radius:8px;padding:10px;"
              "margin:8px 0}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html lang='es'><head>"
                  "<meta charset='utf-8'>"
                  "<meta name='viewport' content='width="
                  "device-width, initial-scale=1'>"
                  f"<title>{title}</title>"
                  f"<style>{_CSS}</style></head><body>"
                  f"<div class='wrap'>{body}</div></body>"
                  "</html>"
              )


          class CicloApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[CicloStore]
              link: ClassVar[CicloLink]
              client: ClassVar[NetworkClient]

              def log_message(
                  self, format: str, *args: object
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(self, method: str) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._html(
                          404,
                          _page(
                              "No encontrado",
                              "<h1>404</h1>"
                              f"<p>{exc}</p>",
                          ),
                      )
                  except ValueError as exc:
                      self._html(
                          400,
                          _page(
                              "Error",
                              "<h1>Dato invalido"
                              f"</h1><p>{exc}</p>",
                          ),
                      )
                  except Exception as exc:
                      self._html(
                          500,
                          _page(
                              "Error",
                              "<h1>Error interno"
                              f"</h1><p>{exc}</p>",
                          ),
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != ["ciclo"]:
                      self._html(
                          404,
                          _page(
                              "404",
                              "<h1>Fuera de"
                              " CICLO</h1>",
                          ),
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_get(s[1:])
                      return
                  store = type(self).store
                  if not s or s == ["home"]:
                      self._home()
                      return
                  if (
                      s[0] == "balance"
                      and len(s) == 2
                  ):
                      zid = s[1]
                      items = store.list_recycled(
                          owner_zid=zid
                      )
                      total_tokens = 0
                      items_html = ""
                      for it in items:
                          total_tokens += it[
                              "token_amount"
                          ]
                          items_html = (
                              items_html
                              + "<li>• "
                              + it["description"]
                              + " ("
                              + str(
                                  it["token_amount"]
                              )
                              + " tokens)</li>"
                          )
                      if not items_html:
                          items_html = (
                              "<li>Sin reciclajes"
                              " aun</li>"
                          )
                      body = (
                          "<h1>♻️ Mi Reciclaje"
                          "</h1>"
                          "<div class='card'>"
                          "<span class='big'>"
                          + str(total_tokens)
                          + "</span> tokens ganados"
                          "</div><ul>"
                          + items_html
                          + "</ul>"
                          "<a href='/ciclo'>"
                          "<button class='gray'>"
                          "Inicio</button></a>"
                      )
                      self._html(
                          200,
                          _page(
                              "CICLO - Reciclaje",
                              body,
                          ),
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>No"
                      " encontrado</h1>"),
                  )

              def _post(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_post(s[1:])
                      return
                  store = type(self).store
                  link = type(self).link
                  doc = self._read_form()
                  if s == ["recycle"]:
                      owner_zid = self._req(
                          doc, "owner_zid"
                      )
                      description = self._req(
                          doc, "description"
                      )
                      item_id = (
                          "REC-"
                          + uuid.uuid4().hex[:10]
                      )
                      sealed_doc: str | None = None
                      ok, data, _error = (
                          link.seal_recycled(
                              owner_zid=owner_zid,
                              item_id=item_id,
                              description=(
                                  description
                              ),
                          )
                      )
                      if ok and data is not None:
                          sealed_doc = str(
                              data.get(
                                  "document_id"
                              )
                          )
                      earned = 0
                      ok2, data2, _error2 = (
                          link.earn_tokens(
                              subject_zid=owner_zid,
                              activity="reciclaje",
                              ref_id=item_id,
                          )
                      )
                      if ok2 and data2 is not None:
                          earned = 5
                      import hashlib

                      data_hash = hashlib.sha256(
                          description.encode(
                              "utf-8"
                          )
                      ).hexdigest()
                      row = store.add_recycled(
                          item_id=item_id,
                          owner_zid=owner_zid,
                          description=description,
                          data_hash=data_hash,
                          token_amount=earned,
                          document_id=sealed_doc,
                          synced=True,
                      )
                      self._html(
                          200,
                          _page(
                              "Reciclado",
                              "<h1>♻️ Dato"
                              " reciclado</h1>"
                              "<p>Ganaste <b>"
                              + str(earned)
                              + " tokens</b></p>"
                              "<p>Sellado en la Red:"
                              " "
                              + (
                                  sealed_doc
                                  or "pendiente"
                              )
                              + "</p><a href='/ciclo/"
                              "balance/"
                              + owner_zid
                              + "'><button>Ver mis"
                              " tokens</button></a>"
                              "<a href='/ciclo'>"
                              "<button class='gray'>"
                              "Inicio</button></a>",
                          ),
                      )
                      return
                  if s == ["recover"]:
                      query = self._req(
                          doc, "query"
                      )
                      result = link.search_network(
                          app_id="ciclo",
                          query=query,
                      )
                      if not result[0]:
                          raise ValueError(
                              result[2]
                              or "busqueda fallo"
                          )
                      data = result[1] or {}
                      items = data.get("items", [])
                      html_items = ""
                      for h in items:
                          html_items = (
                              html_items
                              + "<li>• ["
                              + h.get("source", "")
                              + "] "
                              + h.get("title", "")
                              + "</li>"
                          )
                      if not html_items:
                          html_items = (
                              "<li>Sin resultados"
                              " recuperables</li>"
                          )
                      self._html(
                          200,
                          _page(
                              "Arqueologia digital",
                              "<h1>🔍 Recuperado de"
                              " la Red</h1><ul>"
                              + html_items
                              + "</ul>"
                              "<a href='/ciclo'>"
                              "<button class='gray'>"
                              "Inicio</button></a>",
                          ),
                      )
                      return
                  if s == ["export-evidence"]:
                      subject_zid = self._req(
                          doc, "subject_zid"
                      )
                      purpose = self._req(
                          doc, "purpose"
                      )
                      ok, data, _error = (
                          link.export_evidence(
                              subject_zid=(
                                  subject_zid
                              ),
                              entries=[
                                  [
                                      "evidence",
                                      "EXP-1",
                                      purpose,
                                  ]
                              ],
                          )
                      )
                      if not (
                          ok and data is not None
                      ):
                          raise ValueError(
                              "export fallo"
                          )
                      bundle_id = str(
                          data.get("bundle_id")
                      )
                      export_id = (
                          "EXP-"
                          + uuid.uuid4().hex[:10]
                      )
                      store.record_export(
                          export_id=export_id,
                          subject_zid=subject_zid,
                          bundle_id=bundle_id,
                          purpose=purpose,
                      )
                      self._html(
                          200,
                          _page(
                              "Evidencia exportada",
                              "<h1>📦 Evidencia"
                              " exportada</h1>"
                              "<p>Firmada y portable"
                              " para el juzgado.</p>"
                              "<p>Bundle: <b>"
                              + bundle_id
                              + "</b></p>"
                              "<a href='/ciclo'>"
                              "<button class='gray'>"
                              "Inicio</button></a>",
                          ),
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>Ruta"
                      " desconocida</h1>"),
                  )

              def _read_form(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  ).decode("utf-8")
                  doc: dict[str, Any] = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          key, value = pair.split(
                              "=", 1
                          )
                          doc[key] = value.replace(
                              "+", " "
                          )
                  return doc

              def _read_json(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  )
                  parsed: Any = json.loads(
                      raw.decode("utf-8")
                  )
                  if not isinstance(parsed, dict):
                      raise ValueError(
                          "body must be a JSON"
                          " object"
                      )
                  return {
                      str(k): v
                      for k, v in parsed.items()
                  }

              @staticmethod
              def _req(
                  doc: dict[str, Any], key: str
              ) -> str:
                  value: Any = doc.get(key)
                  if isinstance(value, int) and not isinstance(
                      value, bool
                  ):
                      value = str(value)
                  if not isinstance(value, str):
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  if not value.strip():
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  return value

              def _api_get(self, s: list[str]) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app":
                                  "ciclo_digital",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  if s[:1] == ["recycled"] and len(
                      s
                  ) == 2:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": list(
                                  store.list_recycled(
                                      owner_zid=s[1]
                                  )
                              ),
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _api_post(
                  self, s: list[str]
              ) -> None:
                  store = type(self).store
                  doc = self._read_json()
                  if s == ["recycled"]:
                      item_id = (
                          "REC-"
                          + uuid.uuid4().hex[:10]
                      )
                      row = store.add_recycled(
                          item_id=item_id,
                          owner_zid=self._req(
                              doc, "owner_zid"
                          ),
                          description=self._req(
                              doc, "description"
                          ),
                          data_hash=self._req(
                              doc, "data_hash"
                          ),
                          token_amount=int(
                              doc.get(
                                  "token_amount", 0
                              )
                          ),
                          document_id=None,
                          synced=False,
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _home(self) -> None:
                  body = (
