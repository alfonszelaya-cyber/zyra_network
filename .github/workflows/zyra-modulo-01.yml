                  ):
                      html += (
                          "<li>"
                          + str(job["title"])
                          + " ("
                          + str(job["job_id"])
                          + ")</li>"
                      )
                  html += "</ul></body></html>"
                  self._send_html(200, html)

              def _company_panel(
                  self, account_id: str,
              ) -> None:
                  try:
                      account = (
                          self.store.get_account(
                              account_id
                          )
                      )
                  except LookupError:
                      self._html_error(
                          404,
                          "cuenta no existe",
                      )
                      return
                  if account.get("role") != (
                      "empresa"
                  ):
                      self._html_error(
                          400,
                          "no es empresa",
                      )
                      return
                  html = (
                      "<html><body><h1>Panel"
                      " empresa</h1><p>"
                      + str(account["name"])
                      + "</p><h2>Tus vacantes"
                      "</h2><ul>"
                  )
                  for job in (
                      self.store.list_company_jobs(
                          company_account=(
                              account_id
                          )
                      )
                  ):
                      status = (
                          self.store.job_status(
                              job_id=str(
                                  job["job_id"]
                              )
                          )
                      )
                      html += (
                          "<li>"
                          + str(status["title"])
                          + " | "
                          + str(status["status"])
                          + " | contratados "
                          + str(status["hired"])
                          + "/"
                          + str(
                              status["openings"]
                          )
                          + " | quedan "
                          + str(
                              status["remaining"]
                          )
                          + "</li>"
                      )
                  html += (
                      "</ul><h2>Trabajadores"
                      " disponibles</h2><ul>"
                  )
                  for worker in (
                      self.store.list_workers()
                  ):
                      html += (
                          "<li>"
                          + str(worker["name"])
                          + " ("
                          + str(
                              worker[
                                  "profession"
                              ]
                          )
                          + ")</li>"
                      )
                  html += "</ul></body></html>"
                  self._send_html(200, html)

              def do_POST(self) -> None:
                  path, _query = (
                      self._split_path()
                  )
                  try:
                      if path == "/mpe/register":
                          self._register()
                          return
                      if path == "/mpe/job":
                          self._post_job_form()
                          return
                      if path == "/mpe/apply":
                          self._apply_form()
                          return
                      if path == "/mpe/proposal":
                          self._proposal_form()
                          return
                      if path == (
                          "/mpe/proposal-decide"
                      ):
                          self._decide_form()
                          return
                      if path == "/mpe/hire":
                          self._hire_form()
                          return
                      if path == "/mpe/leave":
                          self._leave_form()
                          return
                      if path == (
                          "/mpe/api/accounts"
                      ):
                          self._api_account()
                          return
                      if path == "/mpe/api/jobs":
                          self._api_job()
                          return
                      if path == (
                          "/mpe/api/proposals"
                      ):
                          self._api_proposal()
                          return
                      if path == (
                          "/mpe/api/proposals"
                          "/decide"
                      ):
                          self._api_decide()
                          return
                      if path == (
                          "/mpe/api/hires"
                      ):
                          self._api_hire()
                          return
                      if path == (
                          "/mpe/api/leave"
                      ):
                          self._api_leave()
                          return
                      self._api_error(
                          404,
                          "unknown path: "
                          + path,
                      )
                  except LookupError as exc:
                      self._api_error(
                          404, str(exc)
                      )
                  except (
                      ValueError,
                      PermissionError,
                  ) as exc:
                      self._api_error(
                          400, str(exc)
                      )
                  except Exception:
                      self._api_error(
                          500, "server error"
                      )

              def _register(self) -> None:
                  form = self._read_form()
                  role = self._form_value(
                      form, "role"
                  )
                  name = self._form_value(
                      form, "name"
                  )
                  profession = self._form_value(
                      form, "profession"
                  )
                  if role not in (
                      "trabajador",
                      "empresa",
                  ):
                      self._html_error(
                          400, "role invalido"
                      )
                      return
                  if not name:
                      self._html_error(
                          400, "name requerido"
                      )
                      return
                  zid = None
                  if role == "trabajador":
                      ok, data, _err = (
                          self.link.register_user(
                              name
                          )
                      )
                  else:
                      ok, data, _err = (
                          self.link
                          .register_company(
                              name
                          )
                      )
                  if ok and data is not None:
                      zid = _find_zid(data)
                  account_id = _new_account_id()
                  self.store.add_account(
                      account_id=account_id,
                      zid=zid,
                      name=name,
                      role=role,
                      profession=(
                          profession or None
                      ),
                  )
                  if zid is not None:
                      self.store.mark_verified(
                          account_id=account_id
                      )
                  html = (
                      "<html><body><h1>MPE</h1>"
                      "<p>Cuenta registrada</p>"
                      "<p>id: "
                      + account_id
                      + "</p><p>zid: "
                      + str(zid)
                      + "</p></body></html>"
                  )
                  self._send_html(200, html)

              def _post_job_form(self) -> None:
                  form = self._read_form()
                  job = self.store.post_job(
                      job_id=_new_job_id(),
                      company_account=(
                          self._form_value(
                              form,
                              "company_account",
                          )
                      ),
                      title=self._form_value(
                          form, "title"
                      ),
                      profession=(
                          self._form_value(
                              form,
                              "profession",
                          )
                      ),
                      openings=int(
                          self._form_value(
                              form, "openings"
                          )
                          or "1"
                      ),
                  )
                  self._send_html(
                      200,
                      "<html><body><h1>MPE</h1>"
                      "<p>Vacante publicada</p>"
                      "<p>job: "
                      + str(job["job_id"])
                      + "</p></body></html>",
                  )

              def _apply_form(self) -> None:
                  form = self._read_form()
                  self.store.apply(
                      application_id=(
                          _new_application_id()
                      ),
                      job_id=self._form_value(
                          form, "job_id"
                      ),
                      worker_account=(
                          self._form_value(
                              form,
                              "worker_account",
                          )
                      ),
                  )
                  self._send_html(
                      200,
                      "<html><body><h1>MPE</h1>"
                      "<p>Aplicacion enviada"
                      "</p></body></html>",
                  )

              def _proposal_form(self) -> None:
                  form = self._read_form()
                  proposal = (
                      self.store.create_proposal(
                          proposal_id=(
                              _new_proposal_id()
                          ),
                          job_id=(
                              self._form_value(
                                  form, "job_id"
                              )
                          ),
                          company_account=(
                              self._form_value(
                                  form,
                                  "company_account",
                              )
                          ),
                          worker_account=(
                              self._form_value(
                                  form,
                                  "worker_account",
                              )
                          ),
                      )
                  )
                  self._send_html(
