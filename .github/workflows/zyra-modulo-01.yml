name: zyra-w6-trust-flow

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Build trust flow engine
        run: |
          set -euo pipefail
          cat > shared_engines/network/trust_flow.py <<'PYEOF'
          """Trust flow: full onboarding over the identity
          lifecycle and the portable profile.

          The complete Network trust journey:

              register in an app (NEXO, Subastas, ...)
                    |
                    v
              ZID created (REGISTERED)
                    |
                    v
              profile fields filled (SELF_DECLARED)
                    |
                    v
              evidence verified per field (VERIFIED level)
                    |
                    v
              TrustFlow.onboarding_complete():
                  REGISTERED -> PENDING_VERIFICATION
                  -> VERIFIED -> ACTIVE
                    |
                    v
              any authorized app can now ask
              TrustFlow.is_trusted(zid) and get an
              evidence-backed answer.

          Every lifecycle step is validated by the identity
          contract, audited, and emitted as an event by the
          existing IdentityEngine - this module only composes
          engines, it never writes identity storage directly.
          """
          from __future__ import annotations

          from shared_engines.identity.contracts import (
              Identity,
              IdentityStatus,
          )
          from shared_engines.identity.engine import (
              IdentityEngine,
          )
          from shared_engines.network.portable_profile import (
              ProfileRegistry,
          )
          from shared_engines.common.validation import (
              require_non_empty_str,
          )

          TRUSTED_STATUSES = (
              IdentityStatus.VERIFIED,
              IdentityStatus.ACTIVE,
          )


          class TrustFlow:
              """Composes IdentityEngine + ProfileRegistry."""

              def __init__(
                  self,
                  *,
                  identity: IdentityEngine,
                  profiles: ProfileRegistry,
              ) -> None:
                  self._identity = identity
                  self._profiles = profiles

              def onboarding_complete(
                  self,
                  *,
                  zid: str,
                  actor: str,
              ) -> Identity:
                  """Walk the identity up to ACTIVE.

                  Idempotent: an already-ACTIVE identity
                  stays ACTIVE. Each transition is validated
                  against the contract's allowed map, so an
                  inconsistent request is refused, never
                  forced.
                  """
                  require_non_empty_str(zid, "zid")
                  require_non_empty_str(
                      actor, "actor"
                  )
                  current = (
                      self._identity.require_identity(
                          zid
                      )
                  )
                  if current.status is (
                      IdentityStatus.REGISTERED
                  ):
                      current = (
                          self._identity.transition_identity(
                              zid,
                              IdentityStatus.PENDING_VERIFICATION,
                              actor=actor,
                              reason=(
                                  "verification started"
                              ),
                          )
                      )
                  if current.status is (
                      IdentityStatus.PENDING_VERIFICATION
                  ):
                      current = (
                          self._identity.transition_identity(
                              zid,
                              IdentityStatus.VERIFIED,
                              actor=actor,
                              reason=(
                                  "evidence verified"
                              ),
                          )
                      )
                  if current.status is (
                      IdentityStatus.VERIFIED
                  ):
                      current = (
                          self._identity.transition_identity(
                              zid,
                              IdentityStatus.ACTIVE,
                              actor=actor,
                              reason=(
                                  "onboarding complete"
                              ),
                          )
                      )
                  return current

              def is_trusted(self, *, zid: str) -> bool:
                  """Evidence-backed trust answer."""
                  require_non_empty_str(zid, "zid")
                  identity = (
                      self._identity.get_identity(zid)
                  )
                  if identity is None:
                      return False
                  return identity.status in (
                      TRUSTED_STATUSES
                  )

              def suspended_identity(
                  self,
                  *,
                  zid: str,
                  actor: str,
                  reason: str,
              ) -> Identity:
                  """Revoke trust: ACTIVE -> SUSPENDED."""
                  require_non_empty_str(zid, "zid")
                  return (
                      self._identity.transition_identity(
                          zid,
                          IdentityStatus.SUSPENDED,
                          actor=actor,
                          reason=reason,
                      )
                  )

              def reactivate_identity(
                  self,
                  *,
                  zid: str,
                  actor: str,
                  reason: str,
              ) -> Identity:
                  """SUSPENDED -> ACTIVE."""
                  require_non_empty_str(zid, "zid")
                  return (
                      self._identity.transition_identity(
                          zid,
                          IdentityStatus.ACTIVE,
                          actor=actor,
                          reason=reason,
                      )
                  )
          PYEOF
          echo "=== TRUST FLOW READY ==="

      - name: Write trust flow proofs (3)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/network/tests
          cat > shared_engines/network/tests/test_trust_flow.py <<'PYEOF'
          """Trust flow proofs: lifecycle walk to ACTIVE,
          evidence-backed is_trusted, suspension and
          reactivation."""
          from __future__ import annotations

          from pathlib import Path

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.events.contracts import (
              EventCatalog,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              IdentityKind,
              IdentityStatus,
          )
          from shared_engines.identity.engine import (
              IdentityEngine,
          )
          from shared_engines.network.portable_profile import (
              ProfileRegistry,
          )
          from shared_engines.network.trust_flow import (
              TrustFlow,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )


          class _Net:
              def __init__(
                  self, tmp_path: Path
              ) -> None:
                  self.db = SQLiteAdapter(
                      tmp_path / "net.db"
                  )
                  self.clock = FrozenClock()
                  self.audit = AuditTrail(
                      self.db, self.clock
                  )
                  self.outbox = Outbox(
                      self.db, self.clock
                  )
                  self.outbox.ensure_schema()
                  self.catalog = EventCatalog()
                  for et in (
                      "identity.registered",
                      "identity.status_changed",
                      "network.profile.updated",
                      "network.profile.accessed",
                  ):
                      self.catalog.register(et)
                  self.identity = IdentityEngine(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                  )
                  self.profiles = ProfileRegistry(
                      self.db,
                      self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.flow = TrustFlow(
                      identity=self.identity,
                      profiles=self.profiles,
                  )

              def close(self) -> None:
                  self.db.close()


          def test_full_lifecycle_to_active(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  net.profiles.register_app(
                      app_id="nexo",
                      display_name="NEXO",
                      scopes=("display_name",),
                  )
                  user = (
                      net.identity.register_identity(
                          kind=IdentityKind.PERSON,
                          display_name="carla",
                          actor="nexo",
                      )
                  )
                  assert user.status is (
                      IdentityStatus.REGISTERED
                  )
                  assert (
                      net.flow.is_trusted(zid=user.zid)
                      is False
                  )
                  net.profiles.set_field(
                      zid=user.zid,
                      field="display_name",
                      value="Carla Ruiz",
                      verified=True,
                  )
                  final = net.flow.onboarding_complete(
                      zid=user.zid,
                      actor="verifier",
                  )
                  assert final.status is (
                      IdentityStatus.ACTIVE
                  )
                  assert (
                      net.flow.is_trusted(zid=user.zid)
                      is True
                  )
                  # Idempotent: stays ACTIVE
                  again = net.flow.onboarding_complete(
                      zid=user.zid,
                      actor="verifier",
                  )
                  assert again.status is (
                      IdentityStatus.ACTIVE
                  )
                  assert net.audit.verify() >= 4
              finally:
                  net.close()


          def test_is_trusted_unknown_zid(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  assert (
                      net.flow.is_trusted(
                          zid="ZID-nope"
                      )
                      is False
                  )
              finally:
                  net.close()


          def test_suspend_and_reactivate(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  user = (
                      net.identity.register_identity(
                          kind=IdentityKind.PERSON,
                          display_name="d",
                          actor="t",
                      )
                  )
                  net.flow.onboarding_complete(
                      zid=user.zid,
                      actor="verifier",
                  )
                  suspended = (
                      net.flow.suspended_identity(
                          zid=user.zid,
                          actor="ops",
                          reason="fraud alert",
                      )
                  )
                  assert suspended.status is (
                      IdentityStatus.SUSPENDED
                  )
                  assert (
                      net.flow.is_trusted(zid=user.zid)
                      is False
                  )
                  back = net.flow.reactivate_identity(
                      zid=user.zid,
                      actor="ops",
                      reason="alert cleared",
                  )
                  assert back.status is (
                      IdentityStatus.ACTIVE
                  )
                  assert (
                      net.flow.is_trusted(zid=user.zid)
                      is True
                  )
              finally:
                  net.close()
          PYEOF
          echo "=== TRUST TESTS READY ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs"
          python -m compileall -q $M main.py scripts shared_engines/tests
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M shared_engines/tests tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W6 trust flow - onboarding_complete walks REGISTERED->PENDING_VERIFICATION->VERIFIED->ACTIVE via identity contract, evidence-backed is_trusted, suspend/reactivate"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W6 COMPLETE ==="
