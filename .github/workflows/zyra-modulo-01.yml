                  panel = _h(
                      app.base
                      + "/ciclo/arqueologia/"
                      + case_id
                  )
                  assert "Expediente" in panel
                  assert "evidencia_encontrada" in panel
                  home = _h(app.base + "/ciclo")
                  assert "CICLO-DIGITAL" in home
                  assert "Reciclar" in home
                  assert "Arqueologia" in home
              finally:
                  app.close()


          def test_3_network_seal_with_real_zid(
              tmp_path: Path,
          ) -> None:
              net = _Networked(tmp_path)
              try:
                  reg = net.client.post(
                      "/apps/register",
                      {
                          "app_id": "ciclo",
                          "display_name": "CICLO-DIGITAL",
                          "scopes": ["display_name"],
                      },
                  )
                  assert reg[0] is True, json.dumps(
                      {"data": reg[1], "err": reg[2]}
                  )
                  zid = net.ext.register_trusted_person(
                      "Custodio Real"
                  )
                  assert zid.startswith("ZID-")
                  seal_ok, seal_doc = net.ext.seal_document(
                      owner_zid=zid,
                      title="Evidencia de prueba",
                      content="contenido sellado",
                  )
                  assert seal_ok is True, (
                      "seal failed for real zid " + zid
                  )
                  assert seal_doc is not None
                  earn_ok, _earn_data = net.ext.earn_tokens(
                      subject_zid=zid,
                      activity="reciclaje",
                      ref_id="REC-net1",
                  )
                  assert earn_ok is True
              finally:
                  net.close()


          def test_4_offline_resilience_store(
              tmp_path: Path,
          ) -> None:
              db = SQLiteAdapter(tmp_path / "ciclo.db")
              clock = FrozenClock()
              store = CicloStore(db, clock)
              try:
                  store.add_recycled(
                      item_id="REC-off",
                      owner_zid="ZID-off",
                      description="dato offline",
                      data_hash="abc",
                      token_amount=5,
                      document_id=None,
                      synced=False,
                  )
                  store.create_arch_case(
                      case_id="ARC-off",
                      owner_zid="ZID-off",
                      title="Caso offline",
                      description="sin red",
                  )
                  finding = store.add_finding(
                      finding_id="FND-off",
                      case_id="ARC-off",
                      source="local",
                      title="fragmento local",
                      content="contenido local",
                      certainty="evidencia_encontrada",
                      reason=None,
                      document_id=None,
                  )
                  assert (
                      finding["certainty"]
                      == "evidencia_encontrada"
                  )
                  sealed = store.seal_arch_case(
                      case_id="ARC-off",
                      sealed_doc="local-pending",
                  )
                  assert sealed["status"] == "sealed"
                  valuation = store.add_valuation(
                      valuation_id="VAL-off",
                      item_id="REC-off",
                      category="foto",
                      condition="regular",
                  )
                  assert (
                      valuation["reward_tokens"] == 1
                  )
                  stats = store.global_recycling_stats()
                  assert stats["total_events"] == 0
              finally:
                  db.close()
