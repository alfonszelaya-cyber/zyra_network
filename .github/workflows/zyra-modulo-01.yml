          class LabApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[LaboratorioStore]
              link: ClassVar[LaboratorioLink]

              def log_message(
                  self,
                  format: str,
                  *args: object,
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(
                  self, method: str,
              ) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._html(
                          404,
                          _page(
                              "No encontrado",
                              "<h1>404</h1>"
                              f"<p>{exc}</p>",
                          ),
                      )
                  except ValueError as exc:
                      self._html(
                          400,
                          _page(
                              "Error",
                              "<h1>Dato invalido"
                              f"</h1><p>{exc}</p>",
                          ),
                      )
                  except Exception as exc:
                      self._html(
                          500,
                          _page(
                              "Error",
                              "<h1>Error interno"
                              f"</h1><p>{exc}</p>",
                          ),
                      )

              def _route(
                  self, method: str,
              ) -> None:
                  path = urlparse(
                      self.path
                  ).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != [
                      "laboratorio"
                  ]:
                      self._html(
                          404,
                          _page(
                              "404",
                              "<h1>Fuera de"
                              " LABORATORIO</h1>",
                          ),
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(
                  self, s: list[str],
              ) -> None:
                  if s[:1] == ["api"]:
                      self._api_get(s[1:])
                      return
                  store = type(self).store
                  if not s or s == ["home"]:
                      self._home()
                      return
                  if s == ["escenarios"]:
                      scenarios = (
                          store.list_scenarios()
                      )
                      items = ""
                      for sc in scenarios:
                          impact = (
                              sc["impact_score"]
                              or "-"
                          )
                          items = (
                              items
                              + "<li>- "
                              + str(sc["title"])
                              + " ["
                              + str(
                                  sc[
                                      "scenario_type"
                                  ]
                              )
                              + "] "
                              + str(
                                  sc["status"]
                              )
                              + " | impacto: "
                              + str(impact)
                              + "</li>"
                          )
                      if not items:
                          items = (
                              "<li>Sin"
                              " escenarios</li>"
                          )
                      body = (
                          "<h1>Decisiones"
                          " Reales</h1><ul>"
                          + items
                          + "</ul>"
                          "<a href='/laboratorio'>"
                          "<button class='gray'>"
                          "Inicio</button></a>"
                      )
                      self._html(
                          200,
                          _page(
                              "LAB - Escenarios",
                              body,
                          ),
                      )
                      return
                  if s == ["creaciones"]:
                      creations = (
                          store.list_creations()
                      )
                      items = ""
                      for c in creations:
                          items = (
                              items
                              + "<li>- "
                              + str(c["title"])
                              + " ["
                              + str(
                                  c[
                                      "creation_type"
                                  ]
                              )
                              + "] <a href="
                              "'/laboratorio"
                              "/proyector/"
                              + str(
                                  c[
                                      "creation_id"
                                  ]
                              )
                              + "'>Proyectar</a>"
                              + "</li>"
                          )
                      if not items:
                          items = (
                              "<li>Sin"
                              " creaciones</li>"
                          )
                      body = (
                          "<h1>Laboratorio de"
                          " Creacion</h1><ul>"
                          + items
                          + "</ul>"
                          "<a href='/laboratorio'>"
                          "<button class='gray'>"
                          "Inicio</button></a>"
                      )
                      self._html(
                          200,
                          _page(
                              "LAB - Creaciones",
                              body,
                          ),
                      )
                      return
                  if s[0] == "proyector" and len(
                      s
                  ) > 1:
                      self._screen_projector(s[1])
                      return
                  self._html(
                      404,
                      _page(
                          "404",
                          "<h1>No encontrado</h1>",
                      ),
                  )

              def _post(
                  self, s: list[str],
              ) -> None:
                  if s[:1] == ["api"]:
                      self._api_post(s[1:])
                      return
                  store = type(self).store
                  doc = self._read_form()
                  if s == ["scenario"]:
                      self._scenario_form(doc)
                      return
                  if s == ["scenario-run"]:
                      self._scenario_run_form(doc)
                      return
                  if s == ["creation"]:
                      self._creation_form(doc)
                      return
                  self._html(
                      404,
                      _page(
                          "404",
                          "<h1>Ruta"
                          " desconocida</h1>",
                      ),
                  )

              def _scenario_form(
                  self, doc: dict[str, Any],
              ) -> None:
                  store = type(self).store
                  scenario_type = self._req(
                      doc, "scenario_type"
                  )
                  title = self._req(doc, "title")
                  description = self._req(
                      doc, "description"
                  )
                  import json as _json

                  parameters = _json.dumps(
                      {
                          "cost": float(
                              doc.get("cost", 0)
                              or 0
                          ),
                          "benefit": float(
                              doc.get(
                                  "benefit", 0
                              )
                              or 0
                          ),
                          "affected_population":
                          int(
                              doc.get(
                                  "affected_population",
                                  1,
                              )
                              or 1
                          ),
                          "risk_percent": float(
                              doc.get(
                                  "risk_percent",
                                  0,
                              )
                              or 0
                          ),
                          "time_months": int(
                              doc.get(
                                  "time_months", 1
                              )
                              or 1
                          ),
                      }
                  )
                  scenario_id = (
                      "SCN-"
                      + _uuid.uuid4().hex[:10]
                  )
                  store.create_scenario(
                      scenario_id=scenario_id,
                      owner_zid=None,
                      scenario_type=scenario_type,
                      title=title,
                      description=description,
                      parameters=parameters,
                  )
                  self._html(
                      200,
                      _page(
                          "Escenario creado",
                          "<h1>Escenario creado"
                          "</h1>"
                          "<p>Ahora ejecuta la"
                          " evaluacion real.</p>"
                          "<form method='POST'"
                          " action="
                          "'/laboratorio/"
                          "scenario-run'>"
                          "<input type='hidden'"
                          " name='scenario_id'"
                          " value='"
                          + scenario_id
                          + "'>"
                          "<input name='cost'"
                          " placeholder='Costo"
                          " total'>"
                          "<input name='benefit'"
                          " placeholder='Beneficio"
                          " total'>"
                          "<input name="
                          "'affected_population'"
                          " placeholder='Poblacion"
                          " afectada'>"
                          "<input name="
                          "'risk_percent'"
                          " placeholder='Riesgo %'>"
                          "<input name="
                          "'time_months'"
                          " placeholder='Meses'>"
                          "<button>Evaluar"
                          "</button></form>",
                      ),
                  )

              def _scenario_run_form(
                  self, doc: dict[str, Any],
              ) -> None:
                  store = type(self).store
                  ext = self._ext()
                  scenario_id = self._req(
                      doc, "scenario_id"
                  )
                  result = store.run_scenario(
                      scenario_id=scenario_id,
                      cost=float(
                          doc.get("cost", 0) or 0
                      ),
                      benefit=float(
                          doc.get("benefit", 0)
                          or 0
                      ),
                      affected_population=int(
                          doc.get(
                              "affected_population",
                              1,
                          )
                          or 1
                      ),
                      risk_percent=float(
                          doc.get(
                              "risk_percent", 0
                          )
                          or 0
                      ),
                      time_months=int(
                          doc.get(
                              "time_months", 1
                          )
                          or 1
                      ),
                  )
                  scenario = store.get_scenario(
                      scenario_id
                  )
                  zid = scenario.get("owner_zid")
                  if zid is not None:
                      ok, doc_id = (
                          ext.seal_document
                      )(
                          owner_zid=str(zid),
                          title="Decision "
                          + scenario_id,
                          content=(
                              str(
                                  result[
                                      "recommendation"
                                  ]
                              )
                              + " impacto:"
                              + str(
                                  result[
                                      "impact_score"
                                  ]
                              )
                          ),
                      )
                      if ok and doc_id:
                          store.seal_scenario(
                              scenario_id=(
                                  scenario_id
                              ),
                              sealed_doc=doc_id,
                          )
                          ext.append_history(
                              zid=str(zid),
                              event=(
                                  "decision_evaluada"
                              ),
                              detail=scenario_id
                              + ":"
                              + str(
                                  result[
                                      "risk_level"
                                  ]
                              ),
                          )
                  body = (
                      "<h1>Evaluacion real</h1>"
                      "<div class='card'>"
                      "<p>Impacto: <b>"
                      + str(result["impact_score"])
                      + "</b></p>"
                      "<p>Riesgo: "
                      + str(result["risk_level"])
                      + "</p>"
                      "<p>Beneficio/costo: "
                      + str(result["bc_ratio"])
                      + "</p>"
                      "<p>Impacto neto: $"
                      + str(result["net_impact"])
                      + "</p>"
                      "<p>Recomendacion: "
                      + str(
                          result["recommendation"]
                      )
                      + "</p></div>"
                      "<a href='/laboratorio"
                      "/escenarios'><button"
                      " class='gray'>Mis"
                      " escenarios</button></a>"
                  )
                  self._html(
                      200,
                      _page(
                          "LAB - Decision", body
                      ),
                  )

              def _creation_form(
