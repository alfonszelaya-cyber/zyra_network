                      "<html><body><h1>MPE</h1>"
                      "<p>Propuesta enviada</p>"
                      "<p>propuesta: "
                      + str(
                          proposal[
                              "proposal_id"
                          ]
                      )
                      + "</p></body></html>",
                  )

              def _decide_form(self) -> None:
                  form = self._read_form()
                  decision = self._form_value(
                      form, "decision"
                  )
                  if decision not in (
                      "aceptar",
                      "rechazar",
                  ):
                      self._html_error(
                          400,
                          "decision invalida",
                      )
                      return
                  result = (
                      self.store.decide_proposal(
                          proposal_id=(
                              self._form_value(
                                  form,
                                  "proposal_id",
                              )
                          ),
                          accepted=(
                              decision
                              == "aceptar"
                          ),
                      )
                  )
                  if result["status"] == (
                      "accepted"
                  ):
                      net = (
                          self._network_on_hire(
                              str(
                                  result["job_id"]
                              ),
                              str(
                                  result[
                                      "worker_account"
                                  ]
                              ),
                          )
                      )
                      self._send_html(
                          200,
                          "<html><body><h1>MPE"
                          "</h1><p>Contratado</p>"
                          "<p>contratados: "
                          + str(
                              result["hire"][
                                  "hired"
                              ]
                          )
                          + " | quedan: "
                          + str(
                              result["hire"][
                                  "remaining"
                              ]
                          )
                          + "</p>"
                          "<p>credencial: "
                          + str(
                              net["credential"][
                                  "issued"
                              ]
                          )
                          + "</p></body></html>",
                      )
                      return
                  self._send_html(
                      200,
                      "<html><body><h1>MPE</h1>"
                      "<p>Propuesta rechazada"
                      "</p></body></html>",
                  )

              def _hire_form(self) -> None:
                  form = self._read_form()
                  job_id = self._form_value(
                      form, "job_id"
                  )
                  worker_account = (
                      self._form_value(
                          form, "worker_account"
                      )
                  )
                  hire = self.store.hire_worker(
                      hire_id=_new_hire_id(),
                      job_id=job_id,
                      worker_account=(
                          worker_account
                      ),
                  )
                  net = self._network_on_hire(
                      job_id, worker_account
                  )
                  self._send_html(
                      200,
                      "<html><body><h1>MPE</h1>"
                      "<p>Contratado</p>"
                      "<p>contratados: "
                      + str(hire["hired"])
                      + " | quedan: "
                      + str(hire["remaining"])
                      + " | estado: "
                      + str(hire["job_status"])
                      + "</p>"
                      "<p>credencial: "
                      + str(
                          net["credential"][
                              "issued"
                          ]
                      )
                      + "</p></body></html>",
                  )

              def _leave_form(self) -> None:
                  form = self._read_form()
                  job_id = self._form_value(
                      form, "job_id"
                  )
                  worker_account = (
                      self._form_value(
                          form, "worker_account"
                      )
                  )
                  result = (
                      self.store.worker_leaves(
                          job_id=job_id,
                          worker_account=(
                              worker_account
                          ),
                      )
                  )
                  self._network_on_leave(
                      job_id, worker_account
                  )
                  self._send_html(
                      200,
                      "<html><body><h1>MPE</h1>"
                      "<p>Abandono registrado"
                      "</p><p>reabierta: "
                      + str(result["reopened"])
                      + " | quedan: "
                      + str(result["remaining"])
                      + "</p></body></html>",
                  )

              def _api_account(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._api_error(
                          400, "invalid JSON"
                      )
                      return
                  role = str(
                      doc.get("role", "")
                  )
                  name = str(
                      doc.get("name", "")
                  )
                  profession = doc.get(
                      "profession"
                  )
                  zid = None
                  if role == "trabajador":
                      ok, data, _err = (
                          self.link.register_user(
                              name
                          )
                      )
                  elif role == "empresa":
                      ok, data, _err = (
                          self.link
                          .register_company(
                              name
                          )
                      )
                  else:
                      self._api_error(
                          400, "role invalido"
                      )
                      return
                  if ok and data is not None:
                      zid = _find_zid(data)
                  account_id = _new_account_id()
                  account = (
                      self.store.add_account(
                          account_id=account_id,
                          zid=zid,
                          name=name,
                          role=role,
                          profession=(
                              str(profession)
                              if profession
                              else None
                          ),
                      )
                  )
                  if zid is not None:
                      self.store.mark_verified(
                          account_id=account_id
                      )
                  self._ok(account)

              def _api_job(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._api_error(
                          400, "invalid JSON"
                      )
                      return
                  job = self.store.post_job(
                      job_id=_new_job_id(),
                      company_account=str(
                          doc.get(
                              "company_account",
                              "",
                          )
                      ),
                      title=str(
                          doc.get("title", "")
                      ),
                      profession=str(
                          doc.get(
                              "profession", ""
                          )
                      ),
                      openings=int(
                          doc.get("openings", 1)
                      ),
                  )
                  self._ok(job)

              def _api_proposal(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._api_error(
                          400, "invalid JSON"
                      )
                      return
                  proposal = (
                      self.store.create_proposal(
                          proposal_id=(
                              _new_proposal_id()
                          ),
                          job_id=str(
                              doc.get(
                                  "job_id", ""
                              )
                          ),
                          company_account=str(
                              doc.get(
                                  "company_account",
                                  "",
                              )
                          ),
                          worker_account=str(
                              doc.get(
                                  "worker_account",
                                  "",
                              )
                          ),
                      )
                  )
                  self._ok(proposal)

              def _api_decide(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._api_error(
                          400, "invalid JSON"
                      )
                      return
                  decision = str(
                      doc.get("decision", "")
                  )
                  if decision not in (
                      "aceptar",
                      "rechazar",
                  ):
                      self._api_error(
                          400,
                          "decision invalida",
                      )
                      return
                  accepted = (
                      decision == "aceptar"
                  )
                  result = (
                      self.store.decide_proposal(
                          proposal_id=str(
                              doc.get(
                                  "proposal_id",
                                  "",
                              )
                          ),
                          accepted=accepted,
                      )
                  )
                  if accepted:
                      result["network"] = (
                          self._network_on_hire(
                              str(
                                  result["job_id"]
                              ),
                              str(
                                  result[
                                      "worker_account"
                                  ]
                              ),
                          )
                      )
                  self._ok(result)

              def _api_hire(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._api_error(
                          400, "invalid JSON"
                      )
                      return
                  job_id = str(
                      doc.get("job_id", "")
                  )
                  worker_account = str(
                      doc.get(
                          "worker_account", ""
                      )
                  )
                  hire = self.store.hire_worker(
                      hire_id=_new_hire_id(),
                      job_id=job_id,
                      worker_account=(
                          worker_account
                      ),
                  )
                  network = (
                      self._network_on_hire(
                          job_id,
                          worker_account,
                      )
                  )
                  self._ok(
                      {
                          "hire": hire,
                          "network": network,
                      }
                  )

              def _api_leave(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._api_error(
                          400, "invalid JSON"
                      )
                      return
                  job_id = str(
                      doc.get("job_id", "")
                  )
                  worker_account = str(
                      doc.get(
                          "worker_account", ""
                      )
                  )
                  result = (
                      self.store.worker_leaves(
                          job_id=job_id,
                          worker_account=(
                              worker_account
                          ),
                      )
                  )
                  self._network_on_leave(
                      job_id, worker_account
                  )
                  self._ok(result)


          def serve_mpe(
              store: MpeStore,
              client: object,
              *,
              host: str = "127.0.0.1",
              port: int = 0,
          ) -> ThreadingHTTPServer:
              handler = type(
                  "BoundMpeHandler",
                  (MpeApiHandler,),
                  {
                      "store": store,
                      "link": MpeLink(client),
                  },
              )
              server = ThreadingHTTPServer(
                  (host, port), handler,
              )
              server.bound_port = (
                  server.server_address[1]
              )
              return server
