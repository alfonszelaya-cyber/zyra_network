          """Routing proofs: priority resolution, failover
          by deactivation, unknown key refused."""
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.routing.engine import (
              RoutingEngine,
          )
          from shared_engines.routing.errors import (
              NoRouteError,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )


          def _engine(tmp_path: Path) -> RoutingEngine:
              db = SQLiteAdapter(
                  tmp_path / "routes.db"
              )
              clock = FrozenClock()
              return RoutingEngine(db, clock)


          def test_priority_resolution(
              tmp_path: Path,
          ) -> None:
              engine = _engine(tmp_path)
              engine.register_route(
                  route_key="verify.docs",
                  target="node-a",
                  priority=10,
              )
              engine.register_route(
                  route_key="verify.docs",
                  target="node-b",
                  priority=5,
              )
              engine.register_route(
                  route_key="verify.docs",
                  target="node-c",
                  priority=1,
              )
              best = engine.resolve(
                  route_key="verify.docs"
              )
              assert best.target == "node-c"
              assert best.priority == 1
              all_routes = engine.list_routes(
                  route_key="verify.docs"
              )
              assert len(all_routes) == 3


          def test_deactivation_falls_to_next(
              tmp_path: Path,
          ) -> None:
              engine = _engine(tmp_path)
              primary = engine.register_route(
                  route_key="pay.settle",
                  target="primary",
                  priority=1,
              )
              engine.register_route(
                  route_key="pay.settle",
                  target="backup",
                  priority=2,
              )
              assert (
                  engine.resolve(
                      route_key="pay.settle"
                  ).target
                  == "primary"
              )
              engine.deactivate_route(
                  route_id=primary.route_id
              )
              fell = engine.resolve(
                  route_key="pay.settle"
              )
              assert fell.target == "backup"
              assert fell.active is True
              assert (
                  engine.resolve(
                      route_key="pay.settle"
                  ).priority
                  == 2
              )


          def test_unknown_key_refused(
              tmp_path: Path,
          ) -> None:
              engine = _engine(tmp_path)
              with pytest.raises(NoRouteError):
                  engine.resolve(
                      route_key="ghost.key"
                  )
          PYEOF

          cat > shared_engines/system_loader/tests/test_system_loader.py <<'PYEOF'
          """System loader proofs: manifest-governed loading,
          compatibility policy enforced, duplicate and
          unknown refused, unload and reload."""
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.events.contracts import (
              EventCatalog,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )
          from shared_engines.system_loader.engine import (
              SystemLoaderEngine,
          )
          from shared_engines.system_loader.errors import (
              ComponentAlreadyLoadedError,
              IncompatibleVersionError,
              ManifestNotRegisteredError,
              UnknownLoadedComponentError,
          )


          def _engine(
              tmp_path: Path,
              *,
              contract: int = 1,
          ) -> SystemLoaderEngine:
              db = SQLiteAdapter(
                  tmp_path / f"loader{contract}.db"
              )
              clock = FrozenClock()
              outbox = Outbox(db, clock)
              outbox.ensure_schema()
              catalog = EventCatalog()
              catalog.register(
                  "system.component.loaded"
              )
              catalog.register(
                  "system.component.unloaded"
              )
              return SystemLoaderEngine(
                  db,
                  clock,
                  outbox=outbox,
                  network_contract_version=contract,
              )


          def test_compatible_load(tmp_path: Path) -> None:
              engine = _engine(tmp_path)
              engine.register_manifest(
                  component_id="engine-search",
                  version=2,
                  min_contract=1,
                  max_contract=2,
              )
              loaded = engine.load_component(
                  component_id="engine-search"
              )
              assert loaded.version == 2
              names = {
                  c.component_id
                  for c in (
                      engine.loaded_components()
                  )
              }
              assert "engine-search" in names


          def test_incompatible_and_unknown_refused(
              tmp_path: Path,
          ) -> None:
              engine = _engine(
                  tmp_path, contract=1
              )
              engine.register_manifest(
                  component_id="future-engine",
                  version=1,
                  min_contract=3,
                  max_contract=5,
              )
              with pytest.raises(
                  IncompatibleVersionError
              ):
                  engine.load_component(
                      component_id="future-engine"
                  )
              with pytest.raises(
                  ManifestNotRegisteredError
              ):
                  engine.load_component(
                      component_id="ghost"
                  )


          def test_duplicate_unload_reload(
              tmp_path: Path,
          ) -> None:
              engine = _engine(tmp_path)
              engine.register_manifest(
                  component_id="engine-x",
                  version=1,
                  min_contract=1,
                  max_contract=1,
              )
              engine.load_component(
                  component_id="engine-x"
              )
              with pytest.raises(
                  ComponentAlreadyLoadedError
              ):
                  engine.load_component(
                      component_id="engine-x"
                  )
                  _ = 0
              unloaded = (
                  engine.unload_component(
                      component_id="engine-x"
                  )
              )
              assert unloaded.version == 1
              assert (
                  engine.loaded_components()
                  == ()
              )
              with pytest.raises(
                  UnknownLoadedComponentError
              ):
                  engine.unload_component(
                      component_id="engine-x"
                  )
              reloaded = engine.load_component(
                  component_id="engine-x"
              )
              assert reloaded.version == 1
          PYEOF
