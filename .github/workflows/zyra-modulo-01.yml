name: zyra-modulo-13-hardening

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01-12 present
        run: |
          set -euo pipefail
          test -f shared_engines/common/errors.py
          test -f shared_engines/storage/database.py
          test -f shared_engines/audit/chain.py
          test -f shared_engines/verifier/verifier.py
          echo "modules 01-12 present: OK"

      - name: Build shared_engines/hardening
        run: |
          set -euo pipefail
          mkdir -p shared_engines/hardening/tests

          cat > shared_engines/hardening/__init__.py <<'PYEOF'
          """Zyra hardening: API keys, rate limiting, brute-force guard."""
          from __future__ import annotations

          from shared_engines.hardening.api_keys import (
              ApiKeyManager,
              ApiKeyRecord,
              KEY_PREFIX,
          )
          from shared_engines.hardening.bruteforce import BruteForceGuard
          from shared_engines.hardening.errors import (
              ApiKeyNotFoundError,
              ApiKeyRevokedError,
              HardeningError,
              InvalidApiKeyError,
              RateLimitExceededError,
              SourceLockedError,
          )
          from shared_engines.hardening.ratelimit import (
              RateCheckResult,
              RateLimiter,
          )

          __all__ = [
              "ApiKeyManager", "ApiKeyNotFoundError", "ApiKeyRecord",
              "ApiKeyRevokedError", "BruteForceGuard", "HardeningError",
              "InvalidApiKeyError", "KEY_PREFIX", "RateCheckResult",
              "RateLimitExceededError", "RateLimiter", "SourceLockedError",
          ]
          PYEOF

          cat > shared_engines/hardening/errors.py <<'PYEOF'
          """Typed hardening errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
              NotFoundError,
              ValidationError,
          )


          class HardeningError(EngineError):
              """Base for hardening failures."""


          class InvalidApiKeyError(HardeningError, ValidationError):
              """The presented API key does not exist or is malformed."""


          class ApiKeyRevokedError(HardeningError, ValidationError):
              """The API key was revoked and can no longer be used."""


          class ApiKeyNotFoundError(HardeningError, NotFoundError):
              """No API key exists for the given id."""


          class RateLimitExceededError(HardeningError, ValidationError):
              """The rate limit for this window was exceeded."""


          class SourceLockedError(HardeningError, ValidationError):
              """This source is temporarily locked due to failed
              authentication attempts."""
          PYEOF

          cat > shared_engines/hardening/api_keys.py <<'PYEOF'
          """Cryptographic API keys: one per client, hash-stored, audited.

          Key format: ``zy_<keyid>_<secret>``
          - keyid: 16 hex chars (public identifier, shown in logs)
          - secret: 48 hex chars (192-bit CSPRNG secret, shown ONCE)

          The database stores ONLY sha256(full_key). A stolen database
          does not leak usable keys. Verification compares hashes in
          constant time. Rotation creates a new key and revokes the
          old one atomically. Every lifecycle event is audited.
          """
          from __future__ import annotations

          import hashlib
          import hmac
          import secrets
          import sqlite3
          from dataclasses import dataclass

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.common.validation import require_non_empty_str
          from shared_engines.hardening.errors import (
              ApiKeyNotFoundError,
              ApiKeyRevokedError,
              InvalidApiKeyError,
          )
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          KEY_PREFIX = "zy"
          KEYID_HEX_LEN = 16
          SECRET_HEX_LEN = 48
          MAX_ATTEMPTS_CACHE: int = 10_000

          API_KEYS_MIGRATIONS = (
              Migration(
                  1,
                  "api_keys",
                  (
                      "CREATE TABLE api_keys ("
                      " key_id TEXT PRIMARY KEY,"
                      " label TEXT NOT NULL,"
                      " key_hash TEXT NOT NULL,"
                      " active INTEGER NOT NULL DEFAULT 1,"
                      " created_by TEXT NOT NULL,"
                      " created_at REAL NOT NULL,"
                      " revoked_at REAL)",
                      "CREATE INDEX api_keys_active"
                      " ON api_keys (active)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class ApiKeyRecord:
              key_id: str
              label: str
              active: bool
              created_by: str
              created_at: float
              revoked_at: float | None


          class ApiKeyManager:
              """Creates, verifies, rotates and revokes client keys."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  audit: AuditTrail,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  MigrationRunner(
                      db, "hardening.keys", API_KEYS_MIGRATIONS
                  ).run(clock)

              @staticmethod
              def _hash_key(full_key: str) -> str:
                  return hashlib.sha256(full_key.encode("utf-8")).hexdigest()

              def generate(
                  self, *, label: str, created_by: str
              ) -> tuple[str, ApiKeyRecord]:
                  """Creates a new key. Returns (full_key, record).

                  The full key is shown EXACTLY ONCE; the caller must
                  store it securely. Only its hash is persisted.
                  """
                  require_non_empty_str(label, "label")
                  require_non_empty_str(created_by, "created_by")
                  key_id = secrets.token_hex(KEY_HEX_LEN // 2)
                  secret = secrets.token_hex(SECRET_HEX_LEN // 2)
                  full_key = f"{KEY_PREFIX}_{key_id}_{secret}"
                  key_hash = self._hash_key(full_key)
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO api_keys"
                          " (key_id, label, key_hash, active,"
                          "  created_by, created_at, revoked_at)"
                          " VALUES (?, ?, ?, 1, ?, ?, NULL)",
                          (key_id, label, key_hash, created_by, now),
                      )
                  self._audit.append(
                      event_type="hardening.api_key.created",
                      actor=created_by,
                      subject=key_id,
                      payload={"label": label},
                  )
                  row = self._db.query_one(
                      "SELECT * FROM api_keys WHERE key_id = ?",
                      (key_id,),
                  )
                  if row is None:
                      raise IntegrityError("key row vanished after insert")
                  return full_key, self._record_from_row(row)

              def verify(self, full_key: str) -> ApiKeyRecord:
                  """Verifies a presented key; raises on any failure.

                  Hash comparison is constant-time: response timing
                  leaks nothing about key validity.
                  """
                  require_non_empty_str(full_key, "full_key")
                  parts = full_key.split("_")
                  if (
                      len(parts) != 3
                      or parts[0] != KEY_PREFIX
                      or len(parts[1]) != KEY_HEX_LEN // 2
                      or len(parts[2]) != SECRET_HEX_LEN // 2
                  ):
                      raise InvalidApiKeyError("malformed key format")
                  key_id = parts[1]
                  row = self._db.query_one(
                      "SELECT * FROM api_keys WHERE key_id = ?",
                      (key_id,),
                  )
                  if row is None:
                      raise InvalidApiKeyError("unknown key")
                  stored_hash = str(row["key_hash"])
                  computed = self._hash_key(full_key)
                  if not hmac.compare_digest(stored_hash, computed):
                      raise InvalidApiKeyError("key does not match")
                  if not bool(int(row["active"])):
                      raise ApiKeyRevokedError(
                          f"key {key_id} was revoked"
                      )
                  return self._record_from_row(row)

              def revoke(self, key_id: str, *, revoked_by: str) -> None:
                  require_non_empty_str(key_id, "key_id")
                  require_non_empty_str(revoked_by, "revoked_by")
                  row = self._db.query_one(
                      "SELECT active FROM api_keys WHERE key_id = ?",
                      (key_id,),
                  )
                  if row is None:
                      raise ApiKeyNotFoundError(
                          f"unknown key: {key_id}"
                      )
                  if not bool(int(row["active"])):
                      raise ApiKeyRevokedError(
                          f"key {key_id} already revoked"
                      )
                  now = self._clock.now()
                  self._db.execute(
                      "UPDATE api_keys SET active = 0, revoked_at = ?"
                      " WHERE key_id = ?",
                      (now, key_id),
                  )
                  self._audit.append(
                      event_type="hardening.api_key.revoked",
                      actor=revoked_by,
                      subject=key_id,
                      payload={},
                  )

              def rotate(
                  self, key_id: str, *, rotated_by: str
              ) -> tuple[str, ApiKeyRecord]:
                  """Revokes old key and creates a fresh one atomically."""
                  require_non_empty_str(rotated_by, "rotated_by")
                  row = self._db.query_one(
                      "SELECT label FROM api_keys WHERE key_id = ?",
                      (key_id,),
                  )
                  if row is None:
                      raise ApiKeyNotFoundError(
                          f"unknown key: {key_id}"
                      )
                  self.revoke(key_id, revoked_by=rotated_by)
                  return self.generate(
                      label=str(row["label"]) + "-rotated",
                      created_by=rotated_by,
                  )

              def list_active(self) -> tuple[ApiKeyRecord, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM api_keys WHERE active = 1"
                      " ORDER BY created_at, key_id"
                  )
                  return tuple(self._record_from_row(r) for r in rows)

              @staticmethod
              def _record_from_row(row: sqlite3.Row) -> ApiKeyRecord:
                  revoked_at = row["revoked_at"]
                  return ApiKeyRecord(
                      key_id=str(row["key_id"]),
                      label=str(row["label"]),
                      active=bool(int(row["active"])),
                      created_by=str(row["created_by"]),
                      created_at=float(row["created_at"]),
                      revoked_at=(
                          None if revoked_at is None else float(revoked_at)
                      ),
                  )
          PYEOF

          cat > shared_engines/hardening/ratelimit.py <<'PYEOF'
          """Durable fixed-window rate limiter per API key."""
          from __future__ import annotations

          from dataclasses import dataclass
          from typing import Final

          from shared_engines.common.clocks import Clock
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.hardening.errors import RateLimitExceededError
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _SECONDS_PER_WINDOW: Final[int] = 3600

          RATE_LIMIT_MIGRATIONS = (
              Migration(
                  1,
                  "rate_limit_windows",
                  (
                      "CREATE TABLE rate_limit_windows ("
                      " key_id TEXT NOT NULL,"
                      " window_start INTEGER NOT NULL,"
                      " count INTEGER NOT NULL,"
                      " PRIMARY KEY (key_id, window_start))",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class RateCheckResult:
              allowed: bool
              remaining: int
              limit: int


          class RateLimiter:
              """Fixed-window consumption counter per key (durable)."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  default_limit: int = 1000,
              ) -> None:
                  require_int_range(
                      default_limit, "default_limit", 1, 1_000_000,
                      config=True,
                  )
                  self._db = db
                  self._clock = clock
                  self._default_limit = default_limit
                  MigrationRunner(
                      db, "hardening.ratelimit", RATE_LIMIT_MIGRATIONS
                  ).run(clock)

              def check(
                  self, key_id: str, *, limit: int | None = None
              ) -> RateCheckResult:
                  """Checks and increments consumption atomically."""
                  require_non_empty_str(key_id, "key_id")
                  effective = (
                      limit if limit is not None else self._default_limit
                  )
                  require_int_range(effective, "effective", 1, 1_000_000)
                  now = self._clock.now()
                  window = int(now // _SECONDS_PER_WINDOW)
                  with self._db.transaction() as cursor:
                      row = cursor.execute(
                          "SELECT count FROM rate_limit_windows"
                          " WHERE key_id = ? AND window_start = ?",
                          (key_id, window),
                      ).fetchone()
                      current = int(row["count"]) if row is not None else 0
                      if current >= effective:
                          return RateCheckResult(
                              allowed=False,
                              remaining=0,
                              limit=effective,
                          )
                      cursor.execute(
                          "INSERT INTO rate_limit_windows"
                          " (key_id, window_start, count)"
                          " VALUES (?, ?, 1)"
                          " ON CONFLICT (key_id, window_start)"
                          " DO UPDATE SET count = count + 1",
                          (key_id, window),
                      )
                  return RateCheckResult(
                      allowed=True,
                      remaining=effective - current - 1,
                      limit=effective,
                  )

              def enforce(
                  self, key_id: str, *, limit: int | None = None
              ) -> RateCheckResult:
                  """check() that raises RateLimitExceededError."""
                  result = self.check(key_id, limit=limit)
                  if not result.allowed:
                      raise RateLimitExceededError(
                          f"rate limit {result.limit} exceeded for"
                          f" {key_id}; try the next window"
                      )
                  return result
          PYEOF

          cat > shared_engines/hardening/bruteforce.py <<'PYEOF'
          """Durable brute-force guard: temporary lockout after failures."""
          from __future__ import annotations

          from typing import Final

          from shared_engines.common.clocks import Clock
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.hardening.errors import SourceLockedError
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _SECONDS_PER_DAY: Final[int] = 86_400

          BRUTE_FORCE_MIGRATIONS = (
              Migration(
                  1,
                  "bruteforce_state",
                  (
                      "CREATE TABLE bruteforce_state ("
                      " source TEXT PRIMARY KEY,"
                      " failures INTEGER NOT NULL DEFAULT 0,"
                      " locked_until REAL)"
                  ),
              ),
          )


          class BruteForceGuard:
              """Tracks failed authentications per source and locks
              sources that exceed the threshold for a duration."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  max_failures: int = 5,
                  lockout_seconds: float = 900.0,
              ) -> None:
                  require_int_range(
                      max_failures, "max_failures", 1, 100, config=True
                  )
                  if lockout_seconds <= 0:
                      raise ValueError(
                          "lockout_seconds must be positive"
                      )
                  self._db = db
                  self._clock = clock
                  self._max_failures = max_failures
                  self._lockout_seconds = lockout_seconds
                  MigrationRunner(
                      db, "hardening.bruteforce", BRUTE_FORCE_MIGRATIONS
                  ).run(clock)

              def check_allowed(self, source: str) -> None:
                  """Raises SourceLockedError if this source is locked."""
                  require_non_empty_str(source, "source")
                  row = self._db.query_one(
                      "SELECT locked_until FROM bruteforce_state"
                      " WHERE source = ?",
                      (source,),
                  )
                  if row is None:
                      return
                  locked_until = row["locked_until"]
                  if locked_until is None:
                      return
                  if self._clock.now() < float(locked_until):
                      raise SourceLockedError(
                          f"source {source} is locked due to failed"
                          " authentication attempts"
                      )
                  self._db.execute(
                      "DELETE FROM bruteforce_state WHERE source = ?",
                      (source,),
                  )

              def record_failure(self, source: str) -> bool:
                  """Records a failure; returns True if now locked."""
                  require_non_empty_str(source, "source")
                  with self._db.transaction() as cursor:
                      row = cursor.execute(
                          "SELECT failures FROM bruteforce_state"
                          " WHERE source = ?",
                          (source,),
                      ).fetchone()
                      failures = (
                          int(row["failures"]) if row is not None else 0
                      )
                      failures += 1
                      locked = failures >= self._max_failures
                      locked_until = (
                          self._clock.now() + self._lockout_seconds
                          if locked
                          else None
                      )
                      cursor.execute(
                          "INSERT INTO bruteforce_state"
                          " (source, failures, locked_until)"
                          " VALUES (?, ?, ?)"
                          " ON CONFLICT (source) DO UPDATE SET"
                          " failures = excluded.failures,"
                          " locked_until = excluded.locked_until",
                          (source, failures, locked_until),
                      )
                  return locked

              def reset(self, source: str) -> None:
                  """Clears failures after a successful authentication."""
                  require_non_empty_str(source, "source")
                  self._db.execute(
                      "DELETE FROM bruteforce_state WHERE source = ?",
                      (source,),
                  )
          PYEOF

          cat > shared_engines/hardening/tests/test_hardening.py <<'PYEOF'
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.hardening.api_keys import ApiKeyManager
          from shared_engines.hardening.bruteforce import BruteForceGuard
          from shared_engines.hardening.errors import (
              ApiKeyNotFoundError,
              ApiKeyRevokedError,
              InvalidApiKeyError,
              RateLimitExceededError,
              SourceLockedError,
          )
          from shared_engines.hardening.ratelimit import RateLimiter
          from shared_engines.storage.database import SQLiteAdapter


          class _Harness:
              def __init__(self, tmp_path: Path) -> None:
                  self.db = SQLiteAdapter(tmp_path / "hardening.db")
                  self.clock = FrozenClock()
                  self.audit = AuditTrail(self.db, self.clock)
                  self.keys = ApiKeyManager(self.db, self.clock, self.audit)
                  self.limiter = RateLimiter(self.db, self.clock)
                  self.guard = BruteForceGuard(
                      self.db, self.clock, max_failures=3,
                      lockout_seconds=900,
                  )

              def close(self) -> None:
                  self.db.close()


          def test_generate_and_verify_roundtrip(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              full_key, record = harness.keys.generate(
                  label="nexo-app", created_by="founder"
              )
              assert full_key.startswith("zy_")
              verified = harness.keys.verify(full_key)
              assert verified.key_id == record.key_id
              assert verified.active is True
              assert verified.label == "nexo-app"
              harness.close()


          def test_verify_rejects_wrong_and_malformed(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              full_key, _ = harness.keys.generate(
                  label="a", created_by="x"
              )
              tampered = full_key[:-2] + "ff"
              with pytest.raises(InvalidApiKeyError):
                  harness.keys.verify(tampered)
              with pytest.raises(InvalidApiKeyError):
                  harness.keys.verify("not-a-key")
              with pytest.raises(InvalidApiKeyError):
                  harness.keys.verify("zy_abc")
              harness.close()


          def test_revoke_blocks_and_audit_captures(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              full_key, record = harness.keys.generate(
                  label="subastas", created_by="founder"
              )
              harness.keys.revoke(record.key_id, revoked_by="admin")
              with pytest.raises(ApiKeyRevokedError):
                  harness.keys.verify(full_key)
              assert harness.audit.verify() >= 2
              with pytest.raises(ApiKeyRevokedError):
                  harness.keys.revoke(record.key_id, revoked_by="admin")
              harness.close()


          def test_rotate_produces_new_working_key(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              old_key, old_record = harness.keys.generate(
                  label="bank", created_by="founder"
              )
              new_key, new_record = harness.keys.rotate(
                  old_record.key_id, rotated_by="admin"
              )
              assert new_record.key_id != old_record.key_id
              verified = harness.keys.verify(new_key)
              assert verified.active is True
              with pytest.raises(ApiKeyRevokedError):
                  harness.keys.verify(old_key)
              assert "rotated" in new_record.label
              harness.close()


          def test_stolen_database_yields_no_usable_keys(
              tmp_path: Path,
          ) -> None:
              """The database stores hashes only; a thief with full DB
              access cannot reconstruct any usable key."""
              harness = _Harness(tmp_path)
              harness.keys.generate(label="x", created_by="y")
              rows = harness.db.query_all("SELECT * FROM api_keys")
              for row in rows:
                  stored = str(row["key_hash"])
                  assert not stored.startswith("zy_")
                  assert len(stored) == 64
              harness.close()


          def test_rate_limit_allows_then_blocks(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              limiter = RateLimiter(
                  harness.db, harness.clock, default_limit=3
              )
              for _ in range(3):
                  result = limiter.check("key-1")
                  assert result.allowed is True
              blocked = limiter.check("key-1")
              assert blocked.allowed is False
              with pytest.raises(RateLimitExceededError):
                  limiter.enforce("key-1")
              harness.clock.advance(3600)
              recovered = limiter.check("key-1")
              assert recovered.allowed is True
              harness.close()


          def test_rate_limit_per_key_independent(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              limiter = RateLimiter(
                  harness.db, harness.clock, default_limit=2
              )
              limiter.enforce("key-a")
              limiter.enforce("key-a")
              with pytest.raises(RateLimitExceededError):
                  limiter.enforce("key-a")
              result = limiter.enforce("key-b")
              assert result.allowed is True
              harness.close()


          def test_bruteforce_locks_after_threshold(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              harness.guard.check_allowed("ip-1")
              assert harness.guard.record_failure("ip-1") is False
              assert harness.guard.record_failure("ip-1") is False
              assert harness.guard.record_failure("ip-1") is True
              with pytest.raises(SourceLockedError):
                  harness.guard.check_allowed("ip-1")
              harness.close()


          def test_bruteforce_unlocks_after_timeout(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              for _ in range(3):
                  harness.guard.record_failure("ip-2")
              with pytest.raises(SourceLockedError):
                  harness.guard.check_allowed("ip-2")
              harness.clock.advance(901)
              harness.guard.check_allowed("ip-2")
              assert harness.guard.record_failure("ip-2") is False
              harness.close()


          def test_bruteforce_reset_on_success(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              harness.guard.record_failure("ip-3")
              harness.guard.record_failure("ip-3")
              harness.guard.reset("ip-3")
              assert harness.guard.record_failure("ip-3") is False
              harness.close()


          def test_unknown_key_revoke(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              with pytest.raises(ApiKeyNotFoundError):
                  harness.keys.revoke("nonexistent", revoked_by="admin")
              harness.close()


          def test_audit_chain_intact_after_all_ops(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              k1, r1 = harness.keys.generate(label="a", created_by="f")
              harness.keys.generate(label="b", created_by="f")
              harness.keys.revoke(r1.key_id, revoked_by="admin")
              assert harness.audit.verify() >= 3
              assert len(harness.keys.list_active()) == 1
              assert harness.keys.list_active()[0].label == "b"
              _ = k1
              harness.close()
          PYEOF

          echo "=== HARDENING BUILD OK ==="

      - name: Quality gates (mypy first; full regression all modules)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening"
          python -m compileall -q $M main.py
          echo "compile OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider $M tests
          echo "pytest OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: module 13 HARDENING (256-bit API keys hash-stored, rate limiter, brute-force guard, audited rotation/revocation) + tests"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== MODULE 13 COMPLETE ==="
