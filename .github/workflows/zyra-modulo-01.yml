name: zyra-w28-2-agro-verify-route

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w282fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Insert missing producers/verify route into v3 _post
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path("apps/agro/server.py")
          text = path.read_text(encoding="utf-8")

          marker = 'if s == ["production"]:'
          already = (
              'if s == ["producers", "verify"]:'
          )
          if already in text:
              print("verify route already present")
          else:
              idx = text.find(marker)
              if idx == -1:
                  raise SystemExit(
                      "marker not found"
                  )
              block = (
                  'if s == ["producers",'
                  ' "verify"]:\n'
                  "                      if is_json:\n"
                  "                          doc = self._read_json()\n"
                  "                      else:\n"
                  "                          doc = self._read_form()\n"
                  "                      producer_id = self._req(\n"
                  '                          doc, "producer_id"\n'
                  "                      )\n"
                  "                      row = store.get_producer(\n"
                  "                          producer_id\n"
                  "                      )\n"
                  '                      zid = row.get("zid")\n'
                  "                      if zid is None:\n"
                  "                          raise ValueError(\n"
                  '                              "producer has no"\n'
                  '                              " network ZID yet"\n'
                  "                          )\n"
                  "                      ok, _data, _e = (\n"
                  "                          link.complete_trust(\n"
                  "                              str(zid)\n"
                  "                          )\n"
                  "                      )\n"
                  "                      if not ok:\n"
                  "                          raise ValueError(\n"
                  '                              "network trust"\n'
                  '                              " failed"\n'
                  "                          )\n"
                  "                      store.mark_verified(\n"
                  "                          producer_id=(\n"
                  "                              producer_id\n"
                  "                          )\n"
                  "                      )\n"
                  "                      updated = (\n"
                  "                          store.get_producer(\n"
                  "                              producer_id\n"
                  "                          )\n"
                  "                      )\n"
                  "                      if is_json:\n"
                  "                          self._send(\n"
                  "                              200,\n"
                  "                              {\n"
                  '                                  "ok": True,\n'
                  '                                  "data": updated,\n'
                  "                              },\n"
                  "                          )\n"
                  "                      else:\n"
                  "                          self._html(\n"
                  "                              200,\n"
                  "                              _page(\n"
                  '                                  "Verificado",\n'
                  '                                  "<h1>Productor'
                  ' VERIFICADO</h1>",\n'
                  "                              ),\n"
                  "                          )\n"
                  "                      return\n"
                  "                  "
              )
              text = (
                  text[:idx]
                  + block
                  + text[idx:]
              )
              path.write_text(
                  text, encoding="utf-8"
              )
              print("verify route inserted")
          PYEOF

      - name: Compile check
        run: |
          set -euo pipefail
          python -m compileall -q apps/agro/server.py
          echo "compile OK"
          find apps/agro -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Run ALL AGRO tests
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider apps/agro/tests/
          echo "ALL AGRO tests OK"
          find apps/agro -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W28-2fix AGRO - missing producers/verify route restored to v3 _post (dual JSON/form), journey test now passes; all AGRO tests green"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W28-2FIX COMPLETE: AGRO FULLY GREEN ==="
