          def test_credential_history_for_bank_client(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              bank = harness.active_issuer("Global Bank")
              client = harness.active_subject("Client X")
              harness.engine.issue_credential(
                  subject_zid=client,
