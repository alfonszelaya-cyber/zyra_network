name: zyra-modulo-11-deployment

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01-10 present
        run: |
          set -euo pipefail
          test -f shared_engines/runtime/kernel.py
          test -f shared_engines/runtime/api.py
          test -f shared_engines/runtime/server.py
          echo "modules 01-10 present: OK"

      - name: Build server entrypoint (main.py)
        run: |
          set -euo pipefail
          cat > main.py <<'PYEOF'
          """Zyra Network production entrypoint.

          Reads configuration from environment variables (12-factor,
          no secrets in code) and serves the full kernel over HTTP.
          Required: none. Optional:
            ZYRA_API_TOKEN   - enables bearer auth when set (>=16 chars)
            ZYRA_PORT        - defaults to $PORT then 8080
          Generated tokens for the signing authority are created
          fresh per boot and their public PEM is printed at startup
          so operators can publish the Network's verification key.
          """
          from __future__ import annotations

          import logging
          import os

          from shared_engines.common.clocks import SystemClock
          from shared_engines.runtime.api import ZyraApiHandler
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.server import ZyraServer
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import Ed25519Signer

          DATA_DIR = os.environ.get("ZYRA_DATA_DIR", "/tmp/zyra-data")
          DB_PATH = os.path.join(DATA_DIR, "zyra.db")


          def main() -> None:
              logging.basicConfig(
                  level=logging.INFO,
                  format="%(asctime)s %(name)s %(levelname)s %(message)s",
              )
              log = logging.getLogger("zyra.main")

              token = os.environ.get("ZYRA_API_TOKEN") or None
              if token is not None and len(token) < 16:
                  raise SystemExit(
                      "ZYRA_API_TOKEN must be at least 16 characters"
                  )
              port = int(os.environ.get("ZYRA_PORT") or os.environ.get("PORT") or 8080)

              os.makedirs(DATA_DIR, exist_ok=True)
              db = SQLiteAdapter(DB_PATH, busy_timeout_ms=10_000)
              clock = SystemClock()
              signer, _private_pem = Ed25519Signer.generate()
              config = RuntimeConfig(
                  host="0.0.0.0",
                  port=port,
                  max_body_bytes=5_000_000,
                  api_token=token,
              )
              kernel = ZyraKernel(
                  db=db,
                  clock=clock,
                  signer=signer,
                  config=config,
              )
              root = kernel.bootstrap_root()
              ZyraApiHandler.kernel = kernel
              server = ZyraServer((config.host, config.port))

              log.info("Zyra Network is LIVE")
              log.info("root authority zid=%s", root.zid)
              log.info("public verification key:")
              log.info("%s", signer.public_pem.decode("utf-8"))
              log.info("listening on %s:%d", config.host, config.port)
              log.info("health endpoint: GET /health")

              try:
                  server.serve_forever()
              except KeyboardInterrupt:
                  log.info("shutdown requested")
              finally:
                  server.server_close()
                  db.close()
                  log.info("Zyra Network stopped")


          if __name__ == "__main__":
              main()
          PYEOF

          echo "=== MAIN ENTRYPOINT OK ==="

      - name: Update render.yaml (correct deployment config)
        run: |
          set -euo pipefail
          cat > render.yaml <<'YEOF'
          services:
            - type: web
              name: zyra-network
              runtime: python
              plan: free
              buildCommand: |
                pip install --upgrade pip
                pip install "cryptography>=42,<45"
              startCommand: python main.py
              healthCheckPath: /health
              envVars:
                - key: PYTHON_VERSION
                  value: "3.12.4"
                - key: ZYRA_PORT
                  value: "10000"
                - key: ZYRA_API_TOKEN
                  sync: false
          YEOF

          echo "=== RENDER CONFIG OK ==="

      - name: Write deployment tests (entrypoint boots a real server)
        run: |
          set -euo pipefail
          mkdir -p tests
          cat > tests/test_deployment.py <<'PYEOF'
          from __future__ import annotations

          import json
          import os
          import socket
          import subprocess
          import sys
          import time
          import urllib.request
          from pathlib import Path

          import pytest

          REPO_ROOT = Path(__file__).resolve().parents[1]


          def _free_port() -> int:
              with socket.socket() as s:
                  s.bind(("127.0.0.1", 0))
                  return int(s.getsockname()[1])


          @pytest.fixture
          def live_server(tmp_path: Path) -> subprocess.Popen[bytes]:
              port = _free_port()
              env = dict(os.environ)
              env["ZYRA_PORT"] = str(port)
              env["ZYRA_DATA_DIR"] = str(tmp_path / "data")
              env.pop("ZYRA_API_TOKEN", None)
              proc = subprocess.Popen(
                  [sys.executable, str(REPO_ROOT / "main.py")],
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              base = f"http://127.0.0.1:{port}"
              deadline = time.time() + 20.0
              ready = False
              while time.time() < deadline:
                  if proc.poll() is not None:
                      out = (
                          proc.stdout.read().decode("utf-8")
                          if proc.stdout
                          else ""
                      )
                      raise RuntimeError(f"server died early: {out}")
                  try:
                      with urllib.request.urlopen(
                          f"{base}/health", timeout=2
                      ) as resp:
                          if resp.status == 200:
                              ready = True
                              break
                  except Exception:
                      time.sleep(0.3)
              if not ready:
                  proc.kill()
                  raise RuntimeError("server did not become healthy")
              yield proc
              proc.terminate()
              try:
                  proc.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  proc.kill()


          def test_production_server_serves_health(
              live_server: subprocess.Popen[bytes],
          ) -> None:
              port_env = None
              # The fixture does not expose the port directly; recover it
              # by hitting health through a retry loop is complex, so we
              # re-derive it from the same strategy: scan is unnecessary
              # because the fixture binds a free port that we stored in
              # the process environment.
              env_port = live_server.pid  # placeholder, replaced below
              del env_port
              # The server prints its port via ZYRA_PORT env var we set.
              # We recover the listening port by scanning /proc-free ways:
              # simplest reliable approach: the fixture returned after a
              # successful /health hit, so we just probe common temp via
              # the recorded env of the child is not portable; instead
              # the fixture stores it through the server's startup time.
              # For determinism, we re-request using the port saved at
              # generation time by re-running the same free-port logic
              # is impossible; therefore this test asserts on the fact
              # that the fixture succeeded (health was 200 before yield).
              assert live_server.poll() is None


          def test_health_shape_via_env_port(
              tmp_path: Path,
          ) -> None:
              """Boots with a KNOWN port to assert the payload shape."""
              port = _free_port()
              env = dict(os.environ)
              env["ZYRA_PORT"] = str(port)
              env["ZYRA_DATA_DIR"] = str(tmp_path / "data")
              env.pop("ZYRA_API_TOKEN", None)
              proc = subprocess.Popen(
                  [sys.executable, str(REPO_ROOT / "main.py")],
                  env=env,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              try:
                  base = f"http://127.0.0.1:{port}"
                  deadline = time.time() + 20.0
                  payload = None
                  while time.time() < deadline:
                      try:
                          with urllib.request.urlopen(
                              f"{base}/health", timeout=2
                          ) as resp:
                              if resp.status == 200:
                                  payload = json.loads(
                                      resp.read().decode("utf-8")
                                  )
                                  break
                      except Exception:
                          time.sleep(0.3)
                  assert payload is not None, "server never became healthy"
                  assert payload["ok"] is True
                  data = payload["data"]
                  components = {
                      c["component"] for c in data["components"]
                  }
                  assert {
                      "storage",
                      "identity",
                      "verification",
                      "tokenization",
                      "currency",
                  } <= components
                  assert data["overall"]["status"] == "healthy"
              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      proc.kill()
          PYEOF

          echo "=== DEPLOYMENT TESTS READY ==="

      - name: Quality gates (mypy first; full regression all modules)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency"
          python -m compileall -q $M main.py
          echo "compile OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider $M tests
          echo "pytest OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add main.py render.yaml tests
          OFF=$(git diff --cached --name-only | grep -vE '^(shared_engines/|\.github/workflows/|main\.py|render\.yaml|tests/)' || true)
          if [ -n "$OFF" ]; then
            echo "Out of scope:"; echo "$OFF"; exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: module 11 DEPLOYMENT (production entrypoint main.py, render.yaml, live-server boot tests)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== MODULE 11 COMPLETE ==="
