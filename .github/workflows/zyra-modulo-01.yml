name: zyra-w11-engine-encryption

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Clean engine init (W391)
        run: |
          set -euo pipefail
          f="shared_engines/encryption/__init__.py"
          [ -f "$f" ] && printf '"""ZYRA Network engine package."""\n' > "$f"
          echo "init cleaned"

      - name: Fill encryption engine (integrates security/crypto)
        run: |
          set -euo pipefail
          cat > shared_engines/encryption/contracts.py <<'PYEOF'
          """Encryption engine contracts."""
          from __future__ import annotations

          from dataclasses import dataclass


          @dataclass(frozen=True)
          class KeyRecord:
              """One durable key-encryption-key."""

              key_id: str
              version: int
              state: str
              created_at: float
              retired_at: float | None
          PYEOF

          cat > shared_engines/encryption/errors.py <<'PYEOF'
          """Typed encryption-engine errors.

          Cryptographic failures themselves surface as the
          existing typed errors of security.crypto
          (IntegrityError, ConfigurationError); this module
          adds engine-level lifecycle errors only.
          """
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
          )


          class EncryptionError(EngineError):
              """Base encryption-engine error."""


          class KeyStateError(EncryptionError):
              """Illegal key lifecycle operation."""
          PYEOF

          cat > shared_engines/encryption/keyring.py <<'PYEOF'
          """Durable keyring feeding EnvelopeCrypto.

          Closes the security persistence gap: keys survive
          restarts in SQLite. Rotation retires the current
          version and persists the next one atomically;
          retired versions are KEPT, so data sealed under
          them stays openable forever (history, never
          rewritten).
          """
          from __future__ import annotations

          import os
          import sqlite3

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              NotFoundError,
          )
          from shared_engines.encryption.contracts import (
              KeyRecord,
          )
          from shared_engines.encryption.errors import (
              KeyStateError,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          STATE_ACTIVE = "ACTIVE"
          STATE_RETIRED = "RETIRED"
          KEY_SIZE = 32

          _MIGRATIONS = (
              Migration(
                  1,
                  "encryption_keys",
                  (
                      "CREATE TABLE encryption_keys ("
                      " key_id TEXT PRIMARY KEY,"
                      " version INTEGER NOT NULL"
                      " UNIQUE,"
                      " key_bytes BLOB NOT NULL,"
                      " state TEXT NOT NULL,"
                      " created_at REAL NOT NULL,"
                      " retired_at REAL)",
                  ),
              ),
          )


          class DurableKeyring:
              """Persistent versioned KEK store."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  namespace: str = "default",
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._ns = namespace
                  MigrationRunner(
                      db,
                      f"encryption.{namespace}",
                      _MIGRATIONS,
                  ).run(clock)
                  row = db.query_one(
                      "SELECT 1 FROM"
                      " encryption_keys LIMIT 1"
                  )
                  if row is None:
                      self._create_version(1)

              def _create_version(
                  self, version: int
              ) -> None:
                  key_id = (
                      f"kek-{self._ns}-v{version}"
                  )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " encryption_keys"
                          " (key_id, version,"
                          "  key_bytes, state,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              key_id,
                              version,
                              os.urandom(KEY_SIZE),
                              STATE_ACTIVE,
                              self._clock.now(),
                          ),
                      )

              def load_keys(
                  self,
              ) -> dict[int, bytes]:
                  """All versions (active + retired)
                  for EnvelopeCrypto: old envelopes
                  stay openable."""
                  rows = self._db.query_all(
                      "SELECT version, key_bytes"
                      " FROM encryption_keys"
                      " ORDER BY version"
                  )
                  return {
                      int(r["version"]): bytes(
                          r["key_bytes"]
                      )
                      for r in rows
                  }

              def current_version(self) -> int:
                  row = self._db.query_one(
                      "SELECT version FROM"
                      " encryption_keys"
                      " WHERE state = ?"
                      " ORDER BY version DESC"
                      " LIMIT 1",
                      (STATE_ACTIVE,),
                  )
                  if row is None:
                      raise NotFoundError(
                          "no active key version"
                      )
                  return int(row["version"])

              def rotate(self) -> int:
                  """Persist next version; retire the
                  current one. Returns new version."""
                  current = (
                      self.current_version()
                  )
                  nxt = current + 1
                  existing = self._db.query_one(
                      "SELECT 1 FROM"
                      " encryption_keys"
                      " WHERE version = ?",
                      (nxt,),
                  )
                  if existing is not None:
                      raise KeyStateError(
                          f"version {nxt}"
                          " already exists"
                      )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE encryption_keys"
                          " SET state = ?,"
                          " retired_at = ?"
                          " WHERE version = ?",
                          (
                              STATE_RETIRED,
                              self._clock.now(),
                              current,
                          ),
                      )
                  self._create_version(nxt)
                  return nxt

              def history(
                  self,
              ) -> tuple[KeyRecord, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM"
                      " encryption_keys"
                      " ORDER BY version"
                  )
                  return tuple(
                      KeyRecord(
                          key_id=str(
                              r["key_id"]
                          ),
                          version=int(
                              r["version"]
                          ),
                          state=str(
                              r["state"]
                          ),
                          created_at=float(
                              r["created_at"]
                          ),
                          retired_at=(
                              float(
                                  r["retired_at"]
                              )
                              if r["retired_at"]
                              is not None
                              else None
                          ),
                      )
                      for r in rows
                  )


          def _unused_row_guard(
              row: sqlite3.Row,
          ) -> int:
              return int(row["version"])
          PYEOF

          cat > shared_engines/encryption/engine.py <<'PYEOF'
          """Encryption engine: high-level facade over the
          existing EnvelopeCrypto (security/crypto.py).

          Adds what crypto.py intentionally lacks: durable
          key persistence. The sealed format, AES-GCM
          primitives, AAD binding and zyra.enc.v1 envelope
          are REUSED, never duplicated. Rotation here is
          durable: after a restart, every historical
          version is still available and old envelopes
          stay openable.
          """
          from __future__ import annotations

          from shared_engines.common.clocks import Clock
          from shared_engines.encryption.contracts import (
              KeyRecord,
          )
          from shared_engines.encryption.keyring import (
              DurableKeyring,
          )
          from shared_engines.security.crypto import (
              EnvelopeCrypto,
          )
          from shared_engines.storage.database import (
              Database,
          )


          class EncryptionEngine:
              """Durable sealed storage via EnvelopeCrypto."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  namespace: str = "default",
              ) -> None:
                  self._keyring = DurableKeyring(
                      db,
                      clock,
                      namespace=namespace,
                  )
                  self._crypto = self._reload()

              def _reload(self) -> EnvelopeCrypto:
                  keys = (
                      self._keyring.load_keys()
                  )
                  current = (
                      self._keyring.current_version()
                  )
                  return EnvelopeCrypto(
                      keys, current
                  )

              def seal(
                  self,
                  data: bytes,
                  *,
                  aad: bytes = b"",
              ) -> bytes:
                  return self._crypto.seal(
                      data, aad=aad
                  )

              def open(
                  self,
                  sealed: bytes,
                  *,
                  aad: bytes = b"",
              ) -> bytes:
                  return self._crypto.open(
                      sealed, aad=aad
                  )

              def reseal(
                  self,
                  sealed: bytes,
                  *,
                  aad: bytes = b"",
              ) -> bytes:
                  return self._crypto.reseal(
                      sealed, aad=aad
                  )

              def inspect_key_version(
                  self, sealed: bytes
              ) -> int:
                  return (
                      self._crypto.inspect_key_version(
                          sealed
                      )
                  )

              def rotate(self) -> int:
                  """Durable rotation; survives
                  restarts."""
                  version = (
                      self._keyring.rotate()
                  )
                  self._crypto = self._reload()
                  return version

              def key_history(
                  self,
              ) -> tuple[KeyRecord, ...]:
                  return (
                      self._keyring.history()
                  )
          PYEOF
          echo "=== ENCRYPTION ENGINE READY (integrated) ==="

      - name: Encryption proofs (4)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/encryption/tests
          cat > shared_engines/encryption/tests/test_encryption.py <<'PYEOF'
          """Encryption engine proofs: zyra.enc.v1 reuse,
          AAD binding, tamper detection via existing typed
          error, and DURABLE rotation across restarts."""
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.common.errors import (
              IntegrityError,
          )
          from shared_engines.encryption.engine import (
              EncryptionEngine,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )

          _FORMAT = b"zyra.enc.v1"


          def _db(
              tmp_path: Path, name: str
          ) -> SQLiteAdapter:
              return SQLiteAdapter(
                  tmp_path / f"{name}.db"
              )


          def test_seal_uses_existing_format(
              tmp_path: Path,
          ) -> None:
              db = _db(tmp_path, "a")
              try:
                  engine = EncryptionEngine(
                      db, FrozenClock()
                  )
                  sealed = engine.seal(
                      b"expediente confidencial"
                  )
                  assert (
                      _FORMAT in sealed
                  )
                  assert (
                      engine.open(sealed)
                      == (
                          b"expediente"
                          b" confidencial"
                      )
                  )
                  assert (
                      engine.inspect_key_version(
                          sealed
                      )
                      == 1
                  )
              finally:
                  db.close()


          def test_aad_binding_and_tamper(
              tmp_path: Path,
          ) -> None:
              db = _db(tmp_path, "b")
              try:
                  engine = EncryptionEngine(
                      db, FrozenClock()
                  )
                  sealed = engine.seal(
                      b"data",
                      aad=b"record-42",
                  )
                  assert (
                      engine.open(
                          sealed,
                          aad=b"record-42",
                      )
                      == b"data"
                  )
                  with pytest.raises(
                      IntegrityError
                  ):
                      engine.open(sealed)
                  tampered = bytearray(sealed)
                  tampered[-3] ^= 0xFF
                  with pytest.raises(
                      IntegrityError
                  ):
                      engine.open(
                          bytes(tampered),
                          aad=b"record-42",
                      )
              finally:
                  db.close()


          def test_rotation_is_durable_across_restart(
              tmp_path: Path,
          ) -> None:
              db = _db(tmp_path, "c")
              try:
                  clock = FrozenClock()
                  engine = EncryptionEngine(
                      db, clock
                  )
                  old = engine.seal(b"v1 secret")
                  assert (
                      engine.inspect_key_version(
                          old
                      )
                      == 1
                  )
                  new_version = engine.rotate()
                  assert new_version == 2
                  new = engine.seal(b"v2 secret")
                  assert (
                      engine.inspect_key_version(
                          new
                      )
                      == 2
                  )
                  # RESTART: fresh engine, same DB
                  engine2 = EncryptionEngine(
                      db, FrozenClock()
                  )
                  assert (
                      engine2.open(old)
                      == b"v1 secret"
                  )
                  assert (
                      engine2.open(new)
                      == b"v2 secret"
                  )
                  states = [
                      (r.version, r.state)
                      for r in (
                          engine2.key_history()
                      )
                  ]
                  assert states == [
                      (1, "RETIRED"),
                      (2, "ACTIVE"),
                  ]
              finally:
                  db.close()


          def test_reseal_upgrades_version(
              tmp_path: Path,
          ) -> None:
              db = _db(tmp_path, "d")
              try:
                  engine = EncryptionEngine(
                      db, FrozenClock()
                  )
                  v1 = engine.seal(b"legacy")
                  engine.rotate()
                  upgraded = engine.reseal(v1)
                  assert (
                      engine.inspect_key_version(
                          upgraded
                      )
                      == 2
                  )
                  assert (
                      engine.open(upgraded)
                      == b"legacy"
                  )
              finally:
                  db.close()
          PYEOF
          echo "=== ENCRYPTION TESTS READY ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs shared_engines/consensus shared_engines/integrity shared_engines/encryption"
          python -m compileall -q $M main.py scripts shared_engines/tests
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M shared_engines/tests tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: engine 3/17 encryption - INTEGRATES security/crypto EnvelopeCrypto (zyra.enc.v1 reused, zero duplication); adds DurableKeyring closing the key-persistence gap (rotation survives restarts, retired versions kept, reseal upgrade); 4 proofs"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== ENGINE ENCRYPTION COMPLETE ==="
