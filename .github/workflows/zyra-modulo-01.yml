      - name: Write lab e2e tests (deterministic offline HTTP + math)
        run: |
          set -euo pipefail
          cat > apps/laboratorio/tests/test_laboratorio_e2e.py <<'PYEOF'
          """LABORATORIO e2e production - deterministic
          decision math, real SVG file generation, projection
          registry, offline HTTP flows (resilience pattern
          proven in every app)."""
          from __future__ import annotations

          import socket
          import threading
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          socket.setdefaulttimeout(20)

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.storage.database import SQLiteAdapter

          from apps.laboratorio.infrastructure.network.network_client import NetworkClient
          from apps.laboratorio.infrastructure.persistence.laboratorio_store import (
              LaboratorioStore,
          )
          from apps.laboratorio.server import serve_laboratorio


          class _App:
              def __init__(self, tmp_path: Path) -> None:
                  self.db = SQLiteAdapter(tmp_path / "lab.db")
                  self.store = LaboratorioStore(self.db, FrozenClock())
                  dead_client = NetworkClient(
                      "http://127.0.0.1:1",
                      timeout_seconds=1.0,
                      max_retries=0,
                  )
                  self.server = serve_laboratorio(
                      self.store, dead_client
                  )
                  self.thread = threading.Thread(
                      target=self.server.serve_forever, daemon=True
                  )
                  self.thread.start()
                  self.base = (
                      "http://127.0.0.1:"
                      f"{self.server.bound_port}"
                  )

              def close(self) -> None:
                  self.server.shutdown()
                  self.server.server_close()
                  self.thread.join(timeout=5)
                  self.db.close()


          def _pf(url: str, doc: dict) -> str:
              request = Request(
                  url,
                  data=(
                      "&".join(
                          str(k) + "=" + str(v)
                          for k, v in doc.items()
                      )
                  ).encode("utf-8"),
                  method="POST",
              )
              try:
                  with urlopen(request, timeout=15) as r:
                      return r.read().decode("utf-8")
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise AssertionError(
                      "POST " + url + " -> HTTP " + str(exc.code)
                      + " body: " + body[:600]
                  )


          def _h(url: str) -> str:
              try:
                  with urlopen(url, timeout=15) as r:
                      return r.read().decode("utf-8")
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise AssertionError(
                      "GET " + url + " -> HTTP " + str(exc.code)
                      + " body: " + body[:600]
                  )


          def test_1_decision_real_full_flow(tmp_path: Path) -> None:
              app = _App(tmp_path)
              try:
                  create_html = _pf(
                      app.base + "/laboratorio/scenario",
                      {
                          "scenario_type": "mercado",
                          "title": "Tienda de frutas",
                          "description": "probar el mercado",
                      },
                  )
                  assert "Escenario creado" in create_html
                  scenario = app.store.list_scenarios()[0]
                  scenario_id = str(scenario["scenario_id"])
                  run_html = _pf(
                      app.base + "/laboratorio/scenario-run",
                      {
                          "scenario_id": scenario_id,
                          "cost": 5000,
                          "benefit": 15000,
                          "affected_population": 2000,
                          "risk_percent": 25,
                          "time_months": 6,
                      },
                  )
                  assert "Evaluacion real" in run_html
                  assert "bajo" in run_html
                  assert "VIABLE" in run_html
                  full = app.store.get_scenario(scenario_id)
                  assert full["status"] == "evaluated"
                  assert full["impact_score"] > 60
                  esc = _h(
                      app.base + "/laboratorio/escenarios"
                  )
                  assert "Tienda de frutas" in esc
                  assert "bajo" in esc
              finally:
                  app.close()


          def test_2_creation_and_holographic_projector(
              tmp_path: Path,
          ) -> None:
              app = _App(tmp_path)
              try:
                  create_html = _pf(
                      app.base + "/laboratorio/creation",
                      {
                          "creation_type": "plano",
                          "title": "Casa de campo",
                          "description": "casa con jardin",
                      },
                  )
                  assert "archivo real SVG" in create_html
                  creation = app.store.list_creations()[0]
                  creation_id = str(creation["creation_id"])
                  assert creation["creation_type"] == "plano"
                  got = app.store.get_creation(creation_id)
                  assert got is not None
                  assert "<svg" in got["svg_content"]
                  assert "PLANO" in got["svg_content"]
                  panel = _h(
                      app.base
                      + "/laboratorio/proyector/"
                      + creation_id
                  )
                  assert "Proyector Holografico" in panel
                  assert "scene3d" in panel
                  assert "holo" in panel
                  assert "<svg" in panel
                  creaciones = _h(
                      app.base + "/laboratorio/creaciones"
                  )
                  assert "Casa de campo" in creaciones
                  assert "Proyectar" in creaciones
              finally:
                  app.close()


          def test_3_role_validation_and_errors(
              tmp_path: Path,
          ) -> None:
              app = _App(tmp_path)
              try:
                  try:
                      _pf(
                          app.base
                          + "/laboratorio/scenario",
                          {
                              "scenario_type": "otra_cosa",
                              "title": "Fake",
                              "description": "x",
                          },
                      )
                      raise AssertionError("must fail")
                  except AssertionError as exc:
                      assert "Dato invalido" in str(exc)
                  home = _h(app.base + "/laboratorio")
                  assert "LABORATORIO" in home
                  assert "Decisiones Reales" in home
                  assert "Creacion con IA" in home
              finally:
                  app.close()
          PYEOF
