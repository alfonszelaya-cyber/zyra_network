name: zyra-modulo-18-ops-resilience

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-18-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01-17 present
        run: |
          set -euo pipefail
          test -f shared_engines/telemetry/collector.py
          test -f shared_engines/logs/structured.py
          test -f scripts/backup.py
          echo "modules 01-17 present: OK"

      - name: Build remaining operational scripts (phase 6)
        run: |
          set -euo pipefail

          cat > scripts/diagnostics.py <<'PYEOF'
          """CLI: full system diagnostics of the Zyra Network.

          Reports: component health, migration state, snapshot
          inventory, log statistics, cluster membership.
          Exit 0 = healthy, 1 = problems found.
          """
          from __future__ import annotations

          import argparse
          import json
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from shared_engines.common.clocks import SystemClock  # noqa: E402
          from shared_engines.storage.database import SQLiteAdapter  # noqa: E402
          from shared_engines.storage.network_migrations import (  # noqa: E402
              NetworkMigrationRunner,
          )
          from shared_engines.storage.snapshots import SnapshotManager  # noqa: E402


          def run(*, data_dir: Path, snapshot_dir: Path) -> int:
              db_path = Path(data_dir) / "zyra.db"
              problems: list[str] = []
              report: dict[str, object] = {}
              if not db_path.exists():
                  print(json.dumps(
                      {"healthy": False,
                       "problems": [f"no database at {db_path}"]},
                      indent=2,
                  ))
                  return 1
              adapter = SQLiteAdapter(db_path)
              try:
                  report["database_integrity"] = "checking"
                  adapter.integrity_check()
                  report["database_integrity"] = "ok"
              except Exception as exc:
                  problems.append(f"integrity: {exc}")
              try:
                  migration_report = (
                      NetworkMigrationRunner(
                          adapter, SystemClock()
                      ).run_all()
                  )
                  report["migrations"] = {
                      r.namespace: len(r.versions)
                      for r in migration_report.results
                  }
              except Exception as exc:
                  problems.append(f"migrations: {exc}")
              try:
                  manager = SnapshotManager(
                      adapter, SystemClock(), Path(snapshot_dir)
                  )
                  snapshots = manager.list_snapshots()
                  report["snapshots"] = {
                      "count": len(snapshots),
                      "latest": (
                          snapshots[0].path.name
                          if snapshots
                          else None
                      ),
                  }
              except Exception as exc:
                  problems.append(f"snapshots: {exc}")
              report["healthy"] = len(problems) == 0
              report["problems"] = problems
              print(json.dumps(report, indent=2))
              adapter.close()
              return 0 if not problems else 1


          def main() -> None:
              parser = argparse.ArgumentParser(
                  description="Zyra Network diagnostics"
              )
              parser.add_argument("--data-dir", default="/tmp/zyra-data")
              parser.add_argument(
                  "--snapshot-dir", default="/tmp/zyra-snapshots"
              )
              args = parser.parse_args()
              raise SystemExit(
                  run(
                      data_dir=Path(args.data_dir),
                      snapshot_dir=Path(args.snapshot_dir),
                  )
              )


          if __name__ == "__main__":
              main()
          PYEOF

          cat > scripts/verify_installation.py <<'PYEOF'
          """CLI: verify the Zyra installation is complete and sane.

          Checks: required modules importable, database migratable,
          key material present. Exit 0 = installation verified.
          """
          from __future__ import annotations

          import argparse
          import json
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from shared_engines.common.clocks import SystemClock  # noqa: E402
          from shared_engines.storage.database import SQLiteAdapter  # noqa: E402
          from shared_engines.storage.network_migrations import (  # noqa: E402
              NetworkMigrationRunner,
          )


          def run(*, data_dir: Path) -> int:
              checks: dict[str, bool] = {}
              errors: list[str] = []
              for module in (
                  "shared_engines.common.errors",
                  "shared_engines.runtime.kernel",
                  "shared_engines.identity.engine",
                  "shared_engines.verification.engine",
                  "shared_engines.tokenization.engine",
                  "shared_engines.currency.engine",
                  "shared_engines.hardening.api_keys",
                  "shared_engines.authority.root",
              ):
                  try:
                      __import__(module)
                      checks[module] = True
                  except Exception as exc:
                      checks[module] = False
                      errors.append(f"{module}: {exc}")
              try:
                  db_path = Path(data_dir) / "zyra.db"
                  adapter = SQLiteAdapter(db_path)
                  NetworkMigrationRunner(
                      adapter, SystemClock()
                  ).run_all()
                  adapter.close()
                  checks["database_migratable"] = True
              except Exception as exc:
                  checks["database_migratable"] = False
                  errors.append(f"database: {exc}")
              verified = not errors
              print(json.dumps(
                  {"verified": verified, "checks": checks,
                   "errors": errors},
                  indent=2,
              ))
              return 0 if verified else 1


          def main() -> None:
              parser = argparse.ArgumentParser(
                  description="Verify Zyra Network installation"
              )
              parser.add_argument("--data-dir", default="/tmp/zyra-data")
              args = parser.parse_args()
              raise SystemExit(run(data_dir=Path(args.data_dir)))


          if __name__ == "__main__":
              main()
          PYEOF

          cat > scripts/bootstrap.py <<'PYEOF'
          """CLI: initial bootstrap of the Zyra Network.

          Migrates the full schema and creates the first verified
          snapshot. Safe to run multiple times (idempotent).
          """
          from __future__ import annotations

          import argparse
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from shared_engines.common.clocks import SystemClock  # noqa: E402
          from shared_engines.storage.database import SQLiteAdapter  # noqa: E402
          from shared_engines.storage.network_migrations import (  # noqa: E402
              NetworkMigrationRunner,
          )
          from shared_engines.storage.snapshots import SnapshotManager  # noqa: E402


          def run(*, data_dir: Path, snapshot_dir: Path) -> int:
              Path(data_dir).mkdir(parents=True, exist_ok=True)
              db_path = Path(data_dir) / "zyra.db"
              adapter = SQLiteAdapter(db_path)
              report = NetworkMigrationRunner(
                  adapter, SystemClock()
              ).run_all()
              print(
                  f"migrated: {report.total_applied_now} applied,"
                  f" {len(report.results)} namespaces"
              )
              manager = SnapshotManager(
                  adapter, SystemClock(), Path(snapshot_dir)
              )
              snapshot = manager.create(label="bootstrap")
              print(f"bootstrap snapshot: {snapshot.path}")
              print(f"sha256: {snapshot.sha256}")
              adapter.close()
              return 0


          def main() -> None:
              parser = argparse.ArgumentParser(
                  description="Bootstrap the Zyra Network"
              )
              parser.add_argument("--data-dir", default="/tmp/zyra-data")
              parser.add_argument(
                  "--snapshot-dir", default="/tmp/zyra-snapshots"
              )
              args = parser.parse_args()
              raise SystemExit(
                  run(
                      data_dir=Path(args.data_dir),
                      snapshot_dir=Path(args.snapshot_dir),
                  )
              )


          if __name__ == "__main__":
              main()
          PYEOF

          cat > scripts/cleanup.py <<'PYEOF'
          """CLI: retention cleanup — snapshots + structured logs."""
          from __future__ import annotations

          import argparse
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from shared_engines.common.clocks import SystemClock  # noqa: E402
          from shared_engines.logs.structured import StructuredLogger  # noqa: E402
          from shared_engines.storage.database import SQLiteAdapter  # noqa: E402
          from shared_engines.storage.snapshots import SnapshotManager  # noqa: E402


          def run(
              *,
              data_dir: Path,
              snapshot_dir: Path,
              keep_snapshots: int,
              keep_logs: int,
          ) -> int:
              db_path = Path(data_dir) / "zyra.db"
              if not db_path.exists():
                  print(f"no database at {db_path}")
                  return 1
              adapter = SQLiteAdapter(db_path)
              manager = SnapshotManager(
                  adapter, SystemClock(), Path(snapshot_dir)
              )
              removed_snapshots = manager.enforce_retention(
                  keep=keep_snapshots
              )
              logger = StructuredLogger(adapter, SystemClock())
              removed_logs = logger.enforce_retention(keep=keep_logs)
              print(f"snapshots removed: {len(removed_snapshots)}")
              print(f"log records removed: {removed_logs}")
              adapter.close()
              return 0


          def main() -> None:
              parser = argparse.ArgumentParser(
                  description="Zyra retention cleanup"
              )
              parser.add_argument("--data-dir", default="/tmp/zyra-data")
              parser.add_argument(
                  "--snapshot-dir", default="/tmp/zyra-snapshots"
              )
              parser.add_argument("--keep-snapshots", type=int, default=10)
              parser.add_argument("--keep-logs", type=int, default=10_000)
              args = parser.parse_args()
              raise SystemExit(
                  run(
                      data_dir=Path(args.data_dir),
                      snapshot_dir=Path(args.snapshot_dir),
                      keep_snapshots=args.keep_snapshots,
                      keep_logs=args.keep_logs,
                  )
              )


          if __name__ == "__main__":
              main()
          PYEOF

          cat > scripts/rollback.py <<'PYEOF'
          """CLI: rollback the database to the latest verified snapshot."""
          from __future__ import annotations

          import argparse
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from shared_engines.common.clocks import SystemClock  # noqa: E402
          from shared_engines.storage.database import SQLiteAdapter  # noqa: E402
          from shared_engines.storage.snapshots import SnapshotManager  # noqa: E402


          def run(
              *, data_dir: Path, snapshot_dir: Path
          ) -> int:
              db_path = Path(data_dir) / "zyra.db"
              if not db_path.exists():
                  print(f"no database at {db_path}")
                  return 1
              snapshots = sorted(
                  Path(snapshot_dir).glob("snapshot-*.db"),
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )
              if not snapshots:
                  print("no snapshots available for rollback")
                  return 1
              latest = snapshots[0]
              adapter = SQLiteAdapter(db_path)
              manager = SnapshotManager(
                  adapter, SystemClock(), Path(snapshot_dir)
              )
              manager.verify(latest)
              manager.restore(latest, db_path)
              print(f"rolled back to: {latest.name}")
              print("verify with: python scripts/verify_installation.py")
              adapter.close()
              return 0


          def main() -> None:
              parser = argparse.ArgumentParser(
                  description="Rollback to latest verified snapshot"
              )
              parser.add_argument("--data-dir", default="/tmp/zyra-data")
              parser.add_argument(
                  "--snapshot-dir", default="/tmp/zyra-snapshots"
              )
              args = parser.parse_args()
              raise SystemExit(
                  run(
                      data_dir=Path(args.data_dir),
                      snapshot_dir=Path(args.snapshot_dir),
                  )
              )


          if __name__ == "__main__":
              main()
          PYEOF

          echo "=== PHASE 6 SCRIPTS REAL ==="

      - name: Write resilience torture tests (phase 7)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/tests
          cat > shared_engines/tests/test_resilience.py <<'PYEOF'
          from __future__ import annotations

          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          import pytest

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.common.errors import EngineError
          from shared_engines.events.contracts import Event, EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import IdentityKind
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.logs.structured import StructuredLogger
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.storage.disaster_recovery import (
              DisasterRecovery,
          )
          from shared_engines.storage.snapshots import SnapshotManager
          from shared_engines.tokenization.engine import TokenEngine


          class SimulatedCrash(Exception):
              """Local chaos injection."""


          def test_concurrent_identity_and_token_writes(
              tmp_path: Path,
          ) -> None:
              """10 threads hammering identity+tokens: no corruption,
              no lost tokens, invariant holds."""
              db = SQLiteAdapter(tmp_path / "stress.db")
              clock = FrozenClock()
              audit = AuditTrail(db, clock)
              outbox = Outbox(db, clock)
              outbox.ensure_schema()
              catalog = EventCatalog()
              for event_type in (
                  "identity.registered",
                  "identity.status_changed",
                  "token.earned",
              ):
                  catalog.register(event_type)
              identity = IdentityEngine(
                  db=db, clock=clock, audit=audit,
                  outbox=outbox, catalog=catalog,
              )
              tokens = TokenEngine(
                  db=db, clock=clock, audit=audit,
                  outbox=outbox, catalog=catalog,
                  identity=identity,
              )
              tokens.define_rule(activity="stress", amount=1)

              def worker(worker_index: int) -> int:
                  created = 0
                  for index in range(5):
                      user = identity.register_identity(
                          kind=IdentityKind.PERSON,
                          display_name=f"w{worker_index}-{index}",
                          actor="stress",
                      )
                      tokens.earn(
                          subject_zid=user.zid,
                          activity="stress",
                          ref_type="stress",
                          ref_id=str(index),
                      )
                      created += 1
                  return created

              with ThreadPoolExecutor(max_workers=10) as pool:
                  results = list(pool.map(worker, range(10)))
              assert sum(results) == 50
              assert tokens.invariant_check() is True
              assert audit.verify() >= 50
              db.close()


          def test_outbox_survives_chaos_consumer(
              tmp_path: Path,
          ) -> None:
              """200 events, consumer fails every 3rd dispatch:
              redelivery continues, zero events lost."""
              db = SQLiteAdapter(tmp_path / "chaos.db")
              clock = FrozenClock()
              outbox = Outbox(db, clock)
              outbox.ensure_schema()
              catalog = EventCatalog()
              catalog.register("chaos.event")
              delivered: list[str] = []
              attempts: list[int] = [0]

              def chaotic_consumer(event: Event) -> None:
                  attempts[0] += 1
                  if attempts[0] % 3 == 0:
                      raise SimulatedCrash("chaos strike")
                  delivered.append(event.event_id)

              for index in range(200):
                  event = catalog.build(
                      "chaos.event",
                      aggregate_id=f"agg-{index}",
                      payload={"n": index},
                      clock=clock,
                  )
                  outbox.enqueue(event)

              rounds = 0
              while outbox.pending() and rounds < 500:
                  try:
                      outbox.dispatch_pending(chaotic_consumer)
                  except SimulatedCrash:
                      pass
                  rounds += 1
              assert len(delivered) == 200
              assert len(set(delivered)) == 200
              assert len(outbox.pending()) == 0
              db.close()


          def test_storage_closed_mid_ops_typed_errors(
              tmp_path: Path,
          ) -> None:
              """DB closed under operations: typed errors, no crash
              of the process, and the DB stays recoverable."""
              db = SQLiteAdapter(tmp_path / "ops.db")
              clock = FrozenClock()
              audit = AuditTrail(db, clock)
              identity = IdentityEngine(
                  db=db, clock=clock, audit=audit,
                  outbox=Outbox(db, clock),
                  catalog=EventCatalog(),
              )
              identity.register_identity(
                  kind=IdentityKind.PERSON,
                  display_name="before-close",
                  actor="test",
              )
              db.close()
              with pytest.raises(EngineError):
                  identity.register_identity(
                      kind=IdentityKind.PERSON,
                      display_name="after-close",
                      actor="test",
                  )
              reopened = SQLiteAdapter(tmp_path / "ops.db")
              row = reopened.query_one(
                  "SELECT COUNT(*) AS n FROM identities"
              )
              assert row is not None
              assert int(row["n"]) == 1
              reopened.close()


          def test_snapshot_consistent_under_concurrent_writes(
              tmp_path: Path,
          ) -> None:
              """Snapshots taken while other threads write stay
              internally consistent (sqlite backup API isolation)."""
              db = SQLiteAdapter(tmp_path / "live.db")
              clock = FrozenClock()
              db.execute(
                  "CREATE TABLE IF NOT EXISTS log_entries ("
                  " id INTEGER PRIMARY KEY AUTOINCREMENT,"
                  " payload TEXT NOT NULL)"
              )
              stop_flag: list[bool] = [False]

              def writer() -> None:
                  index = 0
                  while not stop_flag[0]:
                      db.execute(
                          "INSERT INTO log_entries (payload)"
                          " VALUES (?)",
                          (f"entry-{index}",),
                      )
                      index += 1

              with ThreadPoolExecutor(max_workers=2) as pool:
                  future = pool.submit(writer)
                  manager = SnapshotManager(
                      db, clock, tmp_path / "snaps"
                  )
                  snapshots = [
                      manager.create(label=f"mid-{i}") for i in range(3)
                  ]
                  stop_flag[0] = True
                  future.result()
              for record in snapshots:
                  assert manager.verify(record.path)
                  manager.restore(record.path, tmp_path / f"r-{record.label}.db")
              replica = SQLiteAdapter(tmp_path / "r-mid-0.db")
              row = replica.query_one(
                  "SELECT COUNT(*) AS n FROM log_entries"
              )
              assert row is not None
              assert int(row["n"]) > 0
              replica.close()
              db.close()


          def test_dr_drill_full_cycle(tmp_path: Path) -> None:
              """Phase 7 signature: DR drill proves the recovery path."""
              db = SQLiteAdapter(tmp_path / "db.sqlite")
              dr = DisasterRecovery(
                  db, FrozenClock(), tmp_path / "snaps"
              )
              report = dr.run_drill(rows=25)
              assert report.success is True
              assert report.rows_checked == 25
              db.close()


          def test_migrations_recover_partial_schema(
              tmp_path: Path,
          ) -> None:
              """A DB with partial schema recovers cleanly: migrations
              fill exactly what is missing, nothing corrupts."""
              db = SQLiteAdapter(tmp_path / "partial.db")
              from shared_engines.storage.network_migrations import (
                  NetworkMigrationRunner,
              )
              from shared_engines.common.clocks import FrozenClock

              runner = NetworkMigrationRunner(db, FrozenClock())
              report = runner.run_all()
              assert report.total_applied_now > 0
              report2 = runner.run_all()
              assert report2.total_applied_now == 0
              for result in report2.results:
                  assert len(result.versions) > 0
              db.close()


          def test_logs_correlate_under_concurrency(
              tmp_path: Path,
          ) -> None:
              db = SQLiteAdapter(tmp_path / "logs.db")
              clock = FrozenClock()
              logger = StructuredLogger(db, clock)

              def write_trace(trace_index: int) -> str:
                  corr = f"REQ-{trace_index}"
                  for line in range(4):
                      logger.info(
                          "component", f"trace {trace_index} line {line}",
                          corr,
                      )
                      clock.advance(0.001)
                  return corr

              with ThreadPoolExecutor(max_workers=5) as pool:
                  correlations = list(pool.map(write_trace, range(20)))
              for corr in correlations[:5]:
                  trace = logger.query_by_correlation(corr)
                  assert len(trace) == 4
                  assert all(
                      r.correlation_id == corr for r in trace
                  )
              db.close()


          def test_torture_summary_all_engines_alive(
              tmp_path: Path,
          ) -> None:
              """Final sweep: after all torture, every engine's core
              operation still works on the same DB."""
              db = SQLiteAdapter(tmp_path / "all.db")
              clock = FrozenClock()
              audit = AuditTrail(db, clock)
              outbox = Outbox(db, clock)
              outbox.ensure_schema()
              catalog = EventCatalog()
              for event_type in (
                  "identity.registered",
                  "identity.status_changed",
              ):
                  catalog.register(event_type)
              identity = IdentityEngine(
                  db=db, clock=clock, audit=audit,
                  outbox=outbox, catalog=catalog,
              )
              user = identity.register_identity(
                  kind=IdentityKind.PERSON,
                  display_name="survivor",
                  actor="torture",
              )
              moved = identity.transition_identity(
                  user.zid,
                  __import__(
                      "shared_engines.identity.contracts",
                      fromlist=["IdentityStatus"],
                  ).IdentityStatus.ACTIVE,
                  actor="torture",
                  reason="survived",
              )
              assert moved.status.value == "ACTIVE"
              assert audit.verify() >= 2
              assert db.ping() is True
              db.close()
          PYEOF

          cat > scripts/tests/__init__.py <<'PYEOF'
          """Tests for operational scripts."""
          PYEOF

          echo "=== RESILIENCE TESTS READY ==="

      - name: Write script tests
        run: |
          set -euo pipefail
          cat > shared_engines/tests/test_ops_scripts.py <<'PYEOF'
          from __future__ import annotations

          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[3]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from scripts.backup import run as backup_run  # noqa: E402
          from scripts.bootstrap import run as bootstrap_run  # noqa: E402
          from scripts.cleanup import run as cleanup_run  # noqa: E402
          from scripts.diagnostics import run as diagnostics_run  # noqa: E402
          from scripts.migrate import run as migrate_run  # noqa: E402
          from scripts.rollback import run as rollback_run  # noqa: E402
          from scripts.verify_installation import (  # noqa: E402
              run as verify_run,
          )


          def test_full_ops_lifecycle(tmp_path: Path) -> None:
              """bootstrap -> migrate -> verify -> snapshot -> cleanup
              -> diagnostics -> rollback: the operator loop."""
              data_dir = tmp_path / "data"
              snapshot_dir = tmp_path / "snaps"

              assert bootstrap_run(
                  data_dir=data_dir, snapshot_dir=snapshot_dir
              ) == 0
              assert migrate_run(db_path=data_dir / "zyra.db") == 0
              assert verify_run(data_dir=data_dir) == 0
              adapter = SQLiteAdapter(data_dir / "zyra.db")
              adapter.execute("CREATE TABLE op_probe (id INTEGER)")
              adapter.close()
              assert backup_run(
                  data_dir=data_dir,
                  snapshot_dir=snapshot_dir,
                  keep=5,
              ) == 0
              assert cleanup_run(
                  data_dir=data_dir,
                  snapshot_dir=snapshot_dir,
                  keep_snapshots=5,
                  keep_logs=100,
              ) == 0
              assert diagnostics_run(
                  data_dir=data_dir, snapshot_dir=snapshot_dir
              ) == 0
              assert rollback_run(
                  data_dir=data_dir, snapshot_dir=snapshot_dir
              ) == 0


          def test_diagnostics_reports_missing_db(tmp_path: Path) -> None:
              code = diagnostics_run(
                  data_dir=tmp_path / "empty",
                  snapshot_dir=tmp_path / "snaps",
              )
              assert code == 1
          PYEOF

          echo "=== OPS SCRIPT TESTS READY ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs"
          python -m compileall -q $M main.py scripts
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider $M tests/test_deployment.py
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add shared_engines scripts
          OFF=$(git diff --cached --name-only | grep -vE '^(shared_engines/|\.github/workflows/|main\.py|render\.yaml|tests/|public/|ARCHITECTURE\.md|infrastructure/|scripts/)' || true)
          if [ -n "$OFF" ]; then
            echo "Out of scope:"; echo "$OFF"; exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: module 18 PHASE 6+7 (real ops scripts: diagnostics/verify/bootstrap/cleanup/rollback; resilience torture: concurrent writes, chaos outbox, snapshots under load, DR drill, partial-schema recovery, correlated logs under concurrency)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== MODULE 18 COMPLETE ==="
