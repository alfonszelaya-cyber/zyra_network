      - name: Write aid e2e test
        run: |
          set -euo pipefail
          cat > apps/agro/tests/test_agro_aid_e2e.py <<'PYEOF'
          """AGRO aid e2e - producer requests government aid,
          eligibility evaluated, government approves, assigns,
          delivers, producer confirms; every transition recorded
          on the network history by ZID."""
          from __future__ import annotations

          import json
          import re
          import threading
          from pathlib import Path
          from urllib.request import (
              Request,
              urlopen,
          )

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities,
          )
          from shared_engines.runtime.combined_api import (
              serve_combined,
          )
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )

          from apps.agro.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.agro.infrastructure.persistence.agro_store import (
              AgroStore,
          )
          from apps.agro.server import serve_agro
          from apps.agro.services.zyra_link import (
              ZyraLink,
          )


          class _Ecosystem:
              def __init__(self, tmp_path: Path) -> None:
                  self.net_db = SQLiteAdapter(
                      tmp_path / "network.db"
                  )
                  signer, _ = Ed25519Signer.generate()
                  self.kernel = ZyraKernel(
                      db=self.net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1",
                          port=0,
                          api_token=None,
                      ),
                  )
                  self.kernel.bootstrap_root()
                  self.caps = ZyraCapabilities(
                      self.net_db,
                      FrozenClock(),
                      identity=self.kernel.identity,
                      signer=signer,
                  )
                  self.net_server = serve_combined(
                      self.kernel,
                      self.caps,
                      host="127.0.0.1",
                      port=0,
                  )
                  self.net_thread = threading.Thread(
                      target=(
                          self.net_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.net_thread.start()
                  self.net_base = (
                      "http://127.0.0.1:"
                      f"{self.net_server.server_address[1]}"
                  )
                  self.client = NetworkClient(
                      self.net_base,
                      max_retries=1,
                  )
                  self.agro_db = SQLiteAdapter(
                      tmp_path / "agro.db"
                  )
                  self.store = AgroStore(
                      self.agro_db, FrozenClock()
                  )
                  self.link = ZyraLink(self.client)
                  self.agro_server = serve_agro(
                      self.store, self.client
                  )
                  self.agro_thread = threading.Thread(
                      target=(
                          self.agro_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.agro_thread.start()
                  self.agro_base = (
                      "http://127.0.0.1:"
                      f"{self.agro_server.bound_port}"
                  )

              def close(self) -> None:
                  self.agro_server.shutdown()
                  self.agro_server.server_close()
                  self.agro_thread.join(timeout=5)
                  self.net_server.shutdown()
                  self.net_server.server_close()
                  self.net_thread.join(timeout=5)
                  self.agro_db.close()
                  self.net_db.close()


          def _get_json(url: str) -> dict:
              with urlopen(url, timeout=10) as r:
                  body = json.loads(
                      r.read().decode("utf-8")
                  )
              assert isinstance(body, dict)
              return body


          def _post_json(
              url: str, doc: dict,
          ) -> dict:
              request = Request(
                  url,
                  data=json.dumps(doc).encode(
                      "utf-8"
                  ),
                  headers={
                      "Content-Type":
                      "application/json"
                  },
                  method="POST",
              )
              with urlopen(
                  request, timeout=10
              ) as response:
                  body = json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )
              assert isinstance(body, dict)
              return body


          def _get_html(url: str) -> str:
              with urlopen(url, timeout=10) as r:
                  return r.read().decode("utf-8")


          def test_aid_full_cycle(
              tmp_path: Path,
          ) -> None:
              eco = _Ecosystem(tmp_path)
              try:
                  assert (
                      eco.link.register_app()[0]
                      is True
                  )
                  created = _post_json(
                      eco.agro_base
                      + "/agro/producers",
                      {
                          "name": "Jose Rural",
                          "producer_type":
                          "agricultor",
                          "location":
                          "Chalatenango",
                      },
                  )
                  row = created["data"]
                  producer_id = str(
                      row["producer_id"]
                  )
                  zid = row.get("zid")
                  assert isinstance(zid, str)
                  assert zid.startswith("ZID-")
                  verified = _post_json(
                      eco.agro_base
                      + "/agro/producers/verify",
                      {
                          "producer_id": (
                              producer_id
                          ),
                      },
                  )
                  assert (
                      verified["data"][
                          "verified"
                      ]
                      is True
                  )
                  aid_response = _post_json(
                      eco.agro_base
                      + "/agro/aid/request",
                      {
                          "producer_id": (
                              producer_id
                          ),
                          "program": "semillas",
                          "item": "maiz criollo",
                          "quantity": 10,
                      },
                  )
                  aid = aid_response["data"]
                  aid_id = str(aid["aid_id"])
                  assert (
                      aid["status"]
                      == "requested"
                  )
                  assert (
                      aid["zid"] == zid
                  )
                  eligible = _post_json(
                      eco.agro_base
                      + "/agro/aid/eligibility",
                      {"aid_id": aid_id},
                  )
                  assert (
                      eligible["data"][
                          "status"
                      ]
                      == "eligible"
                  )
                  approved = _post_json(
                      eco.agro_base
                      + "/agro/government/"
                      + "approve",
                      {"aid_id": aid_id},
                  )
                  assert (
                      approved["data"][
                          "status"
                      ]
                      == "approved"
                  )
                  assigned = _post_json(
                      eco.agro_base
                      + "/agro/government/"
                      + "assign",
                      {
                          "aid_id": aid_id,
                          "detail": "lote 7",
                      },
                  )
                  assert (
                      assigned["data"][
                          "status"
                      ]
                      == "assigned"
                  )
                  delivered = _post_json(
                      eco.agro_base
                      + "/agro/government/"
                      + "deliver",
                      {
                          "aid_id": aid_id,
                          "detail": "entregado"
                          " en centro agrario",
                      },
                  )
                  assert (
                      delivered["data"][
                          "status"
                      ]
                      == "delivered"
                  )
                  confirmed = _post_json(
                      eco.agro_base
                      + "/agro/government/"
                      + "confirm",
                      {"aid_id": aid_id},
                  )
                  assert (
                      confirmed["data"][
                          "status"
                      ]
                      == "confirmed"
                  )
                  transitions = [
                      str(event["transition"])
                      for event in confirmed[
                          "data"
                      ]["events"]
                  ]
                  assert (
                      "AID_REQUESTED"
                      in transitions
                  )
                  assert (
                      "AID_DELIVERY_CONFIRMED"
                      in transitions
                  )
                  detail = _get_json(
                      eco.agro_base
                      + "/agro/aid/"
                      + aid_id
                  )
                  assert (
                      detail["data"]["status"]
                      == "confirmed"
                  )
                  history_ok, history, _err = (
                      eco.client.get(
                          "/history/" + zid
                      )
                  )
                  assert history_ok is True
                  history_text = json.dumps(
                      history, default=str
                  )
                  assert "AID_" in history_text
                  unverified = _post_json(
                      eco.agro_base
                      + "/agro/producers",
                      {
                          "name": (
                              "Nuevo Sin Verificar"
                          ),
                          "producer_type":
                          "agricultor",
                      },
                  )
                  producer_b = str(
                      unverified["data"][
                          "producer_id"
                      ]
                  )
                  eco.store.mark_verified(
                      producer_id=(
                          producer_b
                      ),
                  ) if False else None
                  aid_b = _post_json(
                      eco.agro_base
                      + "/agro/aid/request",
                      {
                          "producer_id": (
                              producer_b
                          ),
                          "program": (
                              "fertilizante"
                          ),
                          "item": "urea",
                          "quantity": 5,
                      },
                  )
                  aid_b_id = str(
                      aid_b["data"]["aid_id"]
                  )
                  rejected = _post_json(
                      eco.agro_base
                      + "/agro/aid/eligibility",
                      {"aid_id": aid_b_id},
                  )
                  assert (
                      rejected["data"][
                          "status"
                      ]
                      == "rejected"
                  )
                  try:
                      _post_json(
                          eco.agro_base
                          + "/agro/government/"
                          + "approve",
                          {"aid_id": aid_b_id},
                      )
                      raise AssertionError(
                          "approve of rejected"
                          " should fail"
                      )
                  except Exception as exc:
                      assert "400" in str(exc)
                  panel = _get_html(
                      eco.agro_base
                      + "/agro/productor/"
                      + producer_id
                  )
                  assert aid_id in panel
                  assert "confirmed" in panel
                  summary = _get_json(
                      eco.agro_base
                      + "/agro/government/"
                      + "summary"
                  )
                  data = summary["data"]
                  assert (
                      data["aid_total"] >= 2
                  )
                  assert (
                      data["aid_by_status"][
                          "confirmed"
                      ]
                      == 1
                  )
                  assert (
                      data["aid_by_status"][
                          "rejected"
                      ]
                      == 1
                  )
                  assert "semillas" in data[
                      "aid_by_program"
                  ]
              finally:
                  eco.close()
          PYEOF
          echo "e2e written"

