name: zyra-n3-semilla-core

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-n3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Semilla core (client + link + store + tutor + server)
        run: |
          set -euo pipefail
          mkdir -p apps/semilla/infrastructure/network
          mkdir -p apps/semilla/infrastructure/persistence
          mkdir -p apps/semilla/services
          mkdir -p apps/semilla/tests

          cat > apps/semilla/infrastructure/network/network_client.py <<'PYEOF'
          """SEMILLA HTTP client to ZYRA Network."""
          from __future__ import annotations

          import json
          import os
          import urllib.request


          class NetworkClient:
              def __init__(
                  self,
                  base_url: str | None = None,
                  *,
                  timeout_seconds: float = 5.0,
                  max_retries: int = 2,
              ) -> None:
                  self._base = (
                      base_url
                      or os.environ.get("ZYRA_URL", "")
                  ).rstrip("/")
                  self._timeout = timeout_seconds
                  self._retries = max(0, max_retries)

              def get(self, path: str) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._call("GET", path)

              def post(
                  self, path: str, payload: dict
              ) -> tuple[bool, dict | None, str | None]:
                  return self._call("POST", path, payload)

              def _call(
                  self,
                  method: str,
                  path: str,
                  payload: dict | None = None,
              ) -> tuple[bool, dict | None, str | None]:
                  if not self._base:
                      return (
                          False,
                          None,
                          "ZYRA_URL not configured",
                      )
                  url = self._base + path
                  data = None
                  if payload is not None:
                      data = json.dumps(
                          payload
                      ).encode("utf-8")
                  last_error = "unknown"
                  for attempt in range(
                      self._retries + 1
                  ):
                      try:
                          request = urllib.request.Request(
                              url,
                              data=data,
                              method=method,
                              headers={
                                  "Content-Type":
                                  "application/json"
                              },
                          )
                          with urllib.request.urlopen(
                              request,
                              timeout=self._timeout,
                          ) as response:
                              body = json.loads(
                                  response.read()
                                  .decode("utf-8")
                              )
                          if body.get("ok") is True:
                              return (
                                  True,
                                  body.get("data"),
                                  None,
                              )
                          error = body.get("error", {})
                          return (
                              False,
                              None,
                              str(
                                  error.get(
                                      "message",
                                      "rejected",
                                  )
                              ),
                          )
                      except Exception as exc:
                          last_error = str(exc)
                  return False, None, last_error
          PYEOF

          cat > apps/semilla/services/semilla_link.py <<'PYEOF'
          """SemillaLink: SEMILLA ops on the Network."""
          from __future__ import annotations

          from apps.semilla.infrastructure.network.network_client import (
              NetworkClient,
          )


          class SemillaLink:
              def __init__(
                  self, client: NetworkClient
              ) -> None:
                  self._client = client

              def register_app(self) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/apps/register",
                      {
                          "app_id": "semilla",
                          "display_name": (
                              "SEMILLA - Educacion"
                          ),
                          "scopes": [
                              "display_name",
                              "contact",
                          ],
                      },
                  )

              def register_person(
                  self,
                  display_name: str,
                  kind: str = "person",
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": kind,
                          "display_name": display_name,
                          "actor": "semilla",
                      },
                  )

              def record_milestone(
                  self,
                  zid: str,
                  milestone: str,
                  detail: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/history/append",
                      {
                          "zid": zid,
                          "entry_type": "education",
                          "actor_app": "semilla",
                          "payload": {
                              "milestone": milestone,
                              "detail": detail,
                          },
                      },
                  )

              def give_star(
                  self,
                  subject_zid: str,
                  actor_zid: str,
                  reason: str,
              ) -> tuple[bool, dict | None, str | None]:
                  import base64

                  evidence = base64.b64encode(
                      reason.encode("utf-8")
                  ).decode("ascii")
                  return self._client.post(
                      "/reputation/record",
                      {
                          "subject_zid": (
                              subject_zid
                          ),
                          "actor_zid": actor_zid,
                          "kind": "positive",
                          "evidence_b64": evidence,
                      },
                  )
          PYEOF

          cat > apps/semilla/infrastructure/persistence/semilla_store.py <<'PYEOF'
          """SEMILLA durable store."""
          from __future__ import annotations

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          ROLES = (
              "alumno",
              "profesor",
              "institucion",
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "semilla",
                  (
                      "CREATE TABLE semilla_accounts ("
                      " account_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " role TEXT NOT NULL,"
                      " school TEXT,"
                      " grade TEXT,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE semilla_grades ("
                      " grade_id TEXT PRIMARY KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " subject TEXT NOT NULL,"
                      " score REAL NOT NULL,"
                      " teacher_account TEXT NOT"
                      " NULL,"
                      " recorded_at REAL NOT NULL)",
                      "CREATE TABLE semilla_attendance"
                      " ("
                      " att_id TEXT PRIMARY KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " present INTEGER NOT NULL,"
                      " recorded_at REAL NOT NULL)",
                      "CREATE TABLE semilla_welfare ("
                      " welfare_id TEXT PRIMARY KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " mood TEXT NOT NULL,"
                      " alert INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " recorded_at REAL NOT NULL)",
                      "CREATE TABLE"
                      " semilla_scholarships ("
                      " scholarship_id TEXT PRIMARY"
                      " KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " reason TEXT NOT NULL,"
                      " granted_at REAL NOT NULL)",
                  ),
              ),
          )


          class SemillaStore:
              """Durable state for SEMILLA."""

              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "semilla", _MIGRATIONS
                  ).run(clock)

              def add_account(
                  self,
                  *,
                  account_id: str,
                  zid: str | None,
                  name: str,
                  role: str,
                  school: str | None,
                  grade: str | None,
              ) -> dict[str, object]:
                  if role not in ROLES:
                      raise ValueError(
                          f"unknown role: {role}"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO semilla_accounts"
                          " (account_id, zid, name,"
                          "  role, school, grade,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?)",
                          (
                              account_id,
                              zid,
                              name,
                              role,
                              school,
                              grade,
                              now,
                          ),
                      )
                  return self.get_account(account_id)

              def get_account(
                  self, account_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM semilla_accounts"
                      " WHERE account_id = ?",
                      (account_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown account:"
                          f" {account_id}"
                      )
                  return self._account_row(row)

              def list_by_role(
                  self, *, role: str, school: str | None
                  = None
              ) -> tuple[dict[str, object], ...]:
                  if school is not None:
                      rows = self._db.query_all(
                          "SELECT * FROM"
                          " semilla_accounts WHERE"
                          " role = ? AND school = ?"
                          " ORDER BY created_at",
                          (role, school),
                      )
                  else:
                      rows = self._db.query_all(
                          "SELECT * FROM"
                          " semilla_accounts WHERE"
                          " role = ?"
                          " ORDER BY created_at",
                          (role,),
                      )
                  return tuple(
                      self._account_row(r)
                      for r in rows
                  )

              def add_grade(
                  self,
                  *,
                  grade_id: str,
                  student_account: str,
                  subject: str,
                  score: float,
                  teacher_account: str,
              ) -> dict[str, object]:
                  if not 0.0 <= score <= 10.0:
                      raise ValueError(
                          "score must be 0..10"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO semilla_grades"
                          " (grade_id,"
                          "  student_account, subject,"
                          "  score, teacher_account,"
                          "  recorded_at)"
                          " VALUES (?, ?, ?, ?, ?, ?)",
                          (
                              grade_id,
                              student_account,
                              subject,
                              score,
                              teacher_account,
                              now,
                          ),
                      )
                  return {
                      "grade_id": grade_id,
                      "student": student_account,
                      "subject": subject,
                      "score": score,
                  }

              def grades_of(
                  self, *, student_account: str
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM semilla_grades"
                      " WHERE student_account = ?"
                      " ORDER BY recorded_at",
                      (student_account,),
                  )
                  return tuple(
                      {
                          "subject": str(
                              r["subject"]
                          ),
                          "score": float(
                              r["score"]
                          ),
                      }
                      for r in rows
                  )

              def average_of(
                  self, *, student_account: str
              ) -> float | None:
                  rows = self.grades_of(
                      student_account=(
                          student_account
                      )
                  )
                  if not rows:
                      return None
                  return sum(
                      float(r["score"])
                      for r in rows
                  ) / len(rows)

              def attendance_rate(
                  self, *, student_account: str
              ) -> float | None:
                  rows = self._db.query_all(
                      "SELECT present FROM"
                      " semilla_attendance WHERE"
                      " student_account = ?",
                      (student_account,),
                  )
                  if not rows:
                      return None
                  present = sum(
                      int(r["present"])
                      for r in rows
                  )
                  return present / len(rows)

              def add_attendance(
                  self,
                  *,
                  att_id: str,
                  student_account: str,
                  present: bool,
              ) -> None:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " semilla_attendance"
                          " (att_id,"
                          "  student_account, present,"
                          "  recorded_at)"
                          " VALUES (?, ?, ?, ?)",
                          (
                              att_id,
                              student_account,
                              int(present),
                              now,
                          ),
                      )

              def add_welfare(
                  self,
                  *,
                  welfare_id: str,
                  student_account: str,
                  mood: str,
              ) -> dict[str, object]:
                  alert = mood in (
                      "triste",
                      "enojado",
                      "enfermo",
                  )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO semilla_welfare"
                          " (welfare_id,"
                          "  student_account, mood,"
                          "  alert, recorded_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              welfare_id,
                              student_account,
                              mood,
                              int(alert),
                              now,
                          ),
                      )
                  return {
                      "welfare_id": welfare_id,
                      "mood": mood,
                      "alert": alert,
                  }

              def welfare_alerts(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM semilla_welfare"
                      " WHERE alert = 1"
                      " ORDER BY recorded_at DESC"
                  )
                  return tuple(
                      {
                          "student": str(
                              r["student_account"]
                          ),
                          "mood": str(r["mood"]),
                      }
                      for r in rows
                  )

              def grant_scholarship(
                  self,
                  *,
                  scholarship_id: str,
                  student_account: str,
                  reason: str,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " semilla_scholarships"
                          " (scholarship_id,"
                          "  student_account, reason,"
                          "  granted_at)"
                          " VALUES (?, ?, ?, ?)",
                          (
                              scholarship_id,
                              student_account,
                              reason,
                              now,
                          ),
                      )
                  return {
                      "scholarship_id": (
                          scholarship_id
                      ),
                      "student": student_account,
                      "reason": reason,
                  }

              def has_scholarship(
                  self, *, student_account: str
              ) -> bool:
                  row = self._db.query_one(
                      "SELECT 1 FROM"
                      " semilla_scholarships WHERE"
                      " student_account = ?",
                      (student_account,),
                  )
                  return row is not None

              def summary(
                  self, *, school: str | None = None
              ) -> dict[str, object]:
                  if school is not None:
                      students = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " semilla_accounts WHERE"
                          " role = 'alumno' AND"
                          " school = ?",
                          (school,),
                      )
                      teachers = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " semilla_accounts WHERE"
                          " role = 'profesor' AND"
                          " school = ?",
                          (school,),
                      )
                  else:
                      students = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " semilla_accounts WHERE"
                          " role = 'alumno'"
                      )
                      teachers = self._db.query_one(
                          "SELECT COUNT(*) AS n FROM"
                          " semilla_accounts WHERE"
                          " role = 'profesor'"
                      )
                  return {
                      "students": int(
                          students["n"]
                      )
                      if students is not None
                      else 0,
                      "teachers": int(
                          teachers["n"]
                      )
                      if teachers is not None
                      else 0,
                  }

              @staticmethod
              def _account_row(row) -> dict[str, object]:
                  return {
                      "account_id": str(
                          row["account_id"]
                      ),
                      "zid": (
                          str(row["zid"])
                          if row["zid"] is not None
                          else None
                      ),
                      "name": str(row["name"]),
                      "role": str(row["role"]),
                      "school": (
                          str(row["school"])
                          if row["school"]
                          is not None
                          else None
                      ),
                      "grade": (
                          str(row["grade"])
                          if row["grade"]
                          is not None
                          else None
                      ),
                      "created_at": float(
                          row["created_at"]
                      ),
                  }
          PYEOF

          cat > apps/semilla/services/tutor.py <<'PYEOF'
          """IA-Tutor SEMILLA: the learning companion.

          Rules of the tutor (recorded in the ecosystem):
          - Stimulates thinking, never answers exams.
          - Emotion detection: positive moods get reward
            emojis; negative/critical moods raise alerts
            (professor, and via AXIS: family/hospital).
          - Scholarship engine: average >= 8.0 AND
            attendance >= 0.85 -> eligible.
          """
          from __future__ import annotations

          STIMULUS = {
              "feliz": "🌟 ¡Excelente actitud, sigue asi!",
              "motivado": "🚀 ¡Vamos con todo!",
              "neutro": "📚 Un paso a la vez.",
              "triste": "💙 Estamos contigo. Tu profesor"
                        " te acompaña.",
              "enojado": "🧘 Respiremos juntos. Todo"
                         " va a estar bien.",
              "enfermo": "🏥 Aviso enviado a tu familia"
                         " y al profesor.",
          }

          CRITICAL_MOODS = ("enfermo",)
          ALERT_MOODS = ("triste", "enojado", "enfermo")


          class Tutor:
              """Rule-based tutor with provenance-ready
              outputs (the AI engine records provenance in
              a later integration)."""

              def stimulus(self, *, mood: str) -> dict:
                  message = STIMULUS.get(
                      mood,
                      "📚 Un paso a la vez.",
                  )
                  alert = mood in ALERT_MOODS
                  critical = mood in CRITICAL_MOODS
                  return {
                      "mood": mood,
                      "message": message,
                      "alert": alert,
                      "critical": critical,
                      "notify": (
                          ["profesor"]
                          if alert
                          else []
                      )
                      + (
                          [
                              "familia",
                              "hospital",
                              "seguridad",
                          ]
                          if critical
                          else []
                      ),
                  }

              def scholarship_eligibility(
                  self,
                  *,
                  average: float | None,
                  attendance: float | None,
              ) -> dict:
                  if average is None or (
                      attendance is None
                  ):
                      return {
                          "eligible": False,
                          "reason": (
                              "faltan datos"
                              " (notas o"
                              " asistencia)"
                          ),
                      }
                  if (
                      average >= 8.0
                      and attendance >= 0.85
                  ):
                      return {
                          "eligible": True,
                          "reason": (
                              "promedio"
                              f" {average:.1f} y"
                              " asistencia"
                              f" {attendance:.0%}"
                          ),
                      }
                  return {
                      "eligible": False,
                      "reason": (
                          "promedio"
                          f" {average:.1f} /"
                          " asistencia"
                          f" {attendance:.0%}"
                          " (requiere 8.0 y 85%)"
                      ),
                  }
          PYEOF

          cat > apps/semilla/server.py <<'PYEOF'
          """SEMILLA HTTP surface (role screens + tutor)."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.semilla.infrastructure.persistence.semilla_store import (
              ROLES,
              SemillaStore,
          )
          from apps.semilla.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.semilla.services.semilla_link import SemillaLink
          from apps.semilla.services.tutor import Tutor

          _CSS = (
              "body{font-family:system-ui,sans-serif;"
              "background:#0d1117;color:#e6edf3;"
              "display:flex;justify-content:center;"
              "padding:20px;margin:0}"
              ".wrap{max-width:680px;width:100%}"
              "h1{font-size:1.3rem}"
              "h2{font-size:1rem;margin-top:20px;"
              "color:#58a6ff}"
              ".card{background:#161b22;border:1px solid"
              " #30363d;border-radius:10px;padding:14px;"
              "margin-top:10px}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px 18px;border-radius:8px;"
