name: zyra-modulo-09-10-currency-api

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-09-10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01-08 present
        run: |
          set -euo pipefail
          test -f shared_engines/common/errors.py
          test -f shared_engines/storage/database.py
          test -f shared_engines/events/outbox.py
          test -f shared_engines/audit/chain.py
          test -f shared_engines/identity/engine.py
          test -f shared_engines/runtime/kernel.py
          test -f shared_engines/tokenization/engine.py
          echo "modules 01-08 present: OK"

      - name: Fix currency engine (single QuoteSigner import, typed signer)
        run: |
          set -euo pipefail
          cat > shared_engines/currency/engine.py <<'PYEOF'
          """Currency engine: quotes, bridge routing, signed FX records.

          Bridge logic lives inside the engine: direct quote first,
          then via the configured bridge currency. Stale stored rates
          are refused, never used silently. Settlement happens
          outside the Network (banks/providers move the funds); its
          reference attaches via record_settlement() - never faked.
          """
          from __future__ import annotations

          from decimal import Decimal

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              NotFoundError,
              ValidationError,
          )
          from shared_engines.common.identifiers import new_id
          from shared_engines.common.validation import (
              require_non_empty_str,
              require_positive_number,
          )
          from shared_engines.currency.contracts import (
              CurrencyPair,
              Quote,
              SignedQuote,
          )
          from shared_engines.currency.errors import (
              NoRouteError,
              QuoteExpiredError,
              RateUnavailableError,
              StaleRateError,
          )
          from shared_engines.currency.rates import (
              ProviderChain,
              RateProvider,
              compose_rates,
          )
          from shared_engines.currency.registry import CurrencyRegistry
          from shared_engines.currency.signing import QuoteSigner
          from shared_engines.currency.store import DurableRateStore
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.observability.backend import (
              MetricsBackend,
              NoopMetrics,
              engine_logger,
          )
          from shared_engines.observability.health import (
              ComponentHealth,
              HealthStatus,
          )
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )
          from shared_engines.verification.signatures import Ed25519Signer

          EVENT_QUOTED = "currency.quote.issued"
          EVENT_CONVERTED = "currency.conversion.recorded"

          CONVERSIONS_MIGRATIONS = (
              Migration(
                  1,
                  "conversions",
                  (
                      "CREATE TABLE conversions ("
                      " conversion_id TEXT PRIMARY KEY,"
                      " subject_zid TEXT NOT NULL,"
                      " base TEXT NOT NULL,"
                      " quote_ccy TEXT NOT NULL,"
                      " base_amount TEXT NOT NULL,"
                      " quote_amount TEXT NOT NULL,"
                      " rate TEXT NOT NULL,"
                      " quote_source TEXT NOT NULL,"
                      " fx_settlement_ref TEXT,"
                      " created_at REAL NOT NULL,"
                      " contract_version INTEGER NOT NULL)",
                      "CREATE INDEX conversions_subject"
                      " ON conversions (subject_zid, created_at)",
                  ),
              ),
          )


          class CurrencyEngine:
              def __init__(
                  self,
                  *,
                  db: Database,
                  clock: Clock,
                  providers: list[RateProvider],
                  signer: Ed25519Signer,
                  audit: AuditTrail,
                  outbox: Outbox,
                  catalog: EventCatalog,
                  identity: IdentityEngine,
                  bridge: str = "USD",
                  max_rate_age_seconds: float = 300.0,
                  metrics: MetricsBackend | None = None,
              ) -> None:
                  require_non_empty_str(bridge, "bridge", config=True)
                  require_positive_number(
                      max_rate_age_seconds,
                      "max_rate_age_seconds",
                      config=True,
                  )
                  self._bridge = bridge.upper()
                  self._max_age = max_rate_age_seconds
                  self._registry = CurrencyRegistry()
                  self._chain = ProviderChain(list(providers))
                  self._store = DurableRateStore(db, clock)
                  self._quote_signer = QuoteSigner(signer)
                  self._identity = identity
                  self._audit = audit
                  self._outbox = outbox
                  self._clock = clock
                  self._db = db
                  self._catalog = catalog
                  self._metrics = metrics if metrics is not None else NoopMetrics()
                  self._log = engine_logger("currency")
                  self._catalog.register(EVENT_QUOTED)
                  self._catalog.register(EVENT_CONVERTED)
                  MigrationRunner(
                      db, "currency.conversions", CONVERSIONS_MIGRATIONS
                  ).run(clock)

              @property
              def registry(self) -> CurrencyRegistry:
                  return self._registry

              def quote(
                  self,
                  *,
                  base: str,
                  quote_ccy: str,
                  requester_zid: str,
              ) -> SignedQuote:
                  self._identity.require_identity(requester_zid)
                  base_u = base.upper().strip()
                  quote_u = quote_ccy.upper().strip()
                  self._registry.require(base_u)
                  self._registry.require(quote_u)
                  pair = CurrencyPair(base_u, quote_u)
                  stored = self._store.latest(pair)
                  now = self._clock.now()
                  if stored is not None and (
                      now - stored.quoted_at
                  ) <= self._max_age:
                      quote = stored
                  else:
                      quote = self._fetch_quote(pair, stored)
                      self._store.save(quote)
                  signed = self._quote_signer.sign(
                      quote, issuer_zid=requester_zid
                  )
                  event = self._catalog.build(
                      EVENT_QUOTED,
                      aggregate_id=pair.normalized,
                      payload={
                          "pair": pair.normalized,
                          "rate": str(quote.rate),
                          "source": quote.source,
                          "requester_zid": requester_zid,
                      },
                      clock=self._clock,
                  )
                  self._outbox.enqueue(event)
                  self._metrics.increment(
                      "currency.quoted", tags={"pair": pair.normalized}
                  )
                  self._log.info(
                      "quoted pair=%s rate=%s", pair.normalized, quote.rate
                  )
                  return signed

              def convert(
                  self,
                  *,
                  subject_zid: str,
                  base: str,
                  quote_ccy: str,
                  amount: Decimal,
              ) -> tuple[SignedQuote, str, Decimal]:
                  """Quotes, checks freshness, records the intent."""
                  self._identity.require_identity(subject_zid)
                  if not isinstance(amount, Decimal):
                      raise ValidationError(
                          "amount must be Decimal (build from str)"
                      )
                  if not amount.is_finite() or amount <= 0:
                      raise ValidationError(
                          "amount must be positive and finite"
                      )
                  signed = self.quote(
                      base=base,
                      quote_ccy=quote_ccy,
                      requester_zid=subject_zid,
                  )
                  quote = signed.quote
                  if self._clock.now() > quote.expires_at:
                      raise QuoteExpiredError(
                          "quote expired before conversion"
                      )
                  exact = amount * quote.rate
                  conversion_id = f"CNV-{new_id()}"
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO conversions"
                          " (conversion_id, subject_zid, base, quote_ccy,"
                          "  base_amount, quote_amount, rate, quote_source,"
                          "  fx_settlement_ref, created_at,"
                          "  contract_version)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?, ?, NULL, ?, ?)",
                          (
                              conversion_id,
                              subject_zid,
                              base.upper(),
                              quote_ccy.upper(),
                              str(amount),
                              str(exact),
                              str(quote.rate),
                              quote.source,
                              self._clock.now(),
                              1,
                          ),
                      )
                  event = self._catalog.build(
                      EVENT_CONVERTED,
                      aggregate_id=conversion_id,
                      payload={
                          "conversion_id": conversion_id,
                          "subject_zid": subject_zid,
                          "pair": quote.pair.normalized,
                          "rate": str(quote.rate),
                      },
                      clock=self._clock,
                  )
                  self._outbox.enqueue(event)
                  self._audit.append(
                      event_type=EVENT_CONVERTED,
                      actor=subject_zid,
                      subject=conversion_id,
                      payload={
                          "pair": quote.pair.normalized,
                          "rate": str(quote.rate),
                          "base_amount": str(amount),
                          "quote_amount": str(exact),
                      },
                  )
                  self._metrics.increment("currency.converted")
                  self._log.info(
                      "converted id=%s pair=%s",
                      conversion_id,
                      quote.pair.normalized,
                  )
                  return signed, conversion_id, exact

              def record_settlement(
                  self, conversion_id: str, *, settlement_ref: str
              ) -> None:
                  """Attaches the external provider's settlement ref."""
                  require_non_empty_str(settlement_ref, "settlement_ref")
                  row = self._db.query_one(
                      "SELECT conversion_id FROM conversions"
                      " WHERE conversion_id = ?",
                      (conversion_id,),
                  )
                  if row is None:
                      raise NotFoundError(
                          f"unknown conversion: {conversion_id}"
                      )
                  self._db.execute(
                      "UPDATE conversions SET fx_settlement_ref = ?"
                      " WHERE conversion_id = ?",
                      (settlement_ref, conversion_id),
                  )
                  self._audit.append(
                      event_type="currency.conversion.settled",
                      actor="fx-settlement",
                      subject=conversion_id,
                      payload={"settlement_ref": settlement_ref},
                  )
                  self._log.info("settled conversion=%s", conversion_id)

              def get_conversion(
                  self, conversion_id: str
              ) -> dict[str, object] | None:
                  row = self._db.query_one(
                      "SELECT * FROM conversions WHERE conversion_id = ?",
                      (conversion_id,),
                  )
                  if row is None:
                      return None
                  settlement = row["fx_settlement_ref"]
                  return {
                      "conversion_id": str(row["conversion_id"]),
                      "subject_zid": str(row["subject_zid"]),
                      "base": str(row["base"]),
                      "quote": str(row["quote_ccy"]),
                      "base_amount": str(row["base_amount"]),
                      "quote_amount": str(row["quote_amount"]),
                      "rate": str(row["rate"]),
                      "quote_source": str(row["quote_source"]),
                      "fx_settlement_ref": (
                          None if settlement is None else str(settlement)
                      ),
                      "created_at": float(row["created_at"]),
                  }

              def check_health(self) -> ComponentHealth:
                  if not self._db.ping():
                      return ComponentHealth(
                          "currency",
                          HealthStatus.UNHEALTHY,
                          "storage unavailable",
                      )
                  return ComponentHealth(
                      "currency",
                      HealthStatus.HEALTHY,
                      "rates + conversions ok",
                  )

              def _fetch_quote(
                  self, pair: CurrencyPair, stored: Quote | None
              ) -> Quote:
                  """Direct first; via bridge otherwise. Honest failures."""
                  try:
                      return self._chain.fetch(pair, self._clock)
                  except RateUnavailableError:
                      pass
                  if (
                      pair.base == self._bridge
                      or pair.quote == self._bridge
                  ):
                      if stored is not None:
                          raise StaleRateError(
                              f"only stored rate for"
                              f" {pair.normalized} is stale"
                          ) from None
                      raise
                  try:
                      leg_in = self._chain.fetch(
                          CurrencyPair(pair.base, self._bridge),
                          self._clock,
                      )
                      leg_out = self._chain.fetch(
                          CurrencyPair(self._bridge, pair.quote),
                          self._clock,
                      )
                  except RateUnavailableError:
                      if stored is not None:
                          raise StaleRateError(
                              f"only stored rate for"
                              f" {pair.normalized} is stale"
                          ) from None
                      raise NoRouteError(
                          f"no route for {pair.normalized}"
                      ) from None
                  ttl = min(
                      leg_in.expires_at - leg_in.quoted_at,
                      leg_out.expires_at - leg_out.quoted_at,
                  )
                  now = self._clock.now()
                  return Quote(
                      pair=pair,
                      rate=compose_rates(leg_in.rate, leg_out.rate),
                      quoted_at=now,
                      expires_at=now + ttl,
                      source=f"bridge:{self._bridge}",
                  )
          PYEOF

          echo "=== ENGINE FIXED ==="

      - name: Rebuild kernel.py completely (full wiring, no patches)
        run: |
          set -euo pipefail
          cat > shared_engines/runtime/kernel.py <<'PYEOF'
          """ZyraKernel: the living composition root of the Network.

          Builds and owns every engine over one durable database,
          registers the central event catalog, bootstraps the Root
          Authority identity, wires the token ledger and the FX
          engine, and aggregates component health.
          """
          from __future__ import annotations

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.currency.engine import CurrencyEngine
          from shared_engines.currency.rates import StaticTableRateProvider
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              Identity,
              IdentityKind,
              IdentityStatus,
          )
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.observability.backend import (
              MetricsBackend,
              NoopMetrics,
              engine_logger,
          )
          from shared_engines.observability.health import (
              ComponentHealth,
              HealthRegistry,
              HealthStatus,
          )
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.storage.database import Database
          from shared_engines.tokenization.engine import TokenEngine
          from shared_engines.verification.engine import VerificationEngine
          from shared_engines.verification.signatures import Ed25519Signer

          NETWORK_EVENT_TYPES = (
              "identity.registered",
              "identity.status_changed",
              "verification.media.registered",
              "verification.media.tamper_detected",
              "verification.credential.issued",
              "verification.credential.revoked",
              "verification.attestation.issued",
          )

          DEFAULT_FX_RATES: dict[str, str] = {
              "USD/EUR": "0.92",
              "USD/CNY": "7.25",
              "GTQ/USD": "0.128",
              "USD/MXN": "17.0",
          }


          class _StorageHealth:
              """Reports storage liveness through the adapter's ping."""

              def __init__(self, db: Database) -> None:
                  self._db = db

              def check_health(self) -> ComponentHealth:
                  if self._db.ping():
                      return ComponentHealth(
                          "storage", HealthStatus.HEALTHY, "ping ok"
                      )
                  return ComponentHealth(
                      "storage", HealthStatus.UNHEALTHY, "ping failed"
                  )


          class ZyraKernel:
              """Owns the engines; serves as the single source of truth."""

              def __init__(
                  self,
                  *,
                  db: Database,
                  clock: Clock,
                  signer: Ed25519Signer,
                  config: RuntimeConfig,
                  fx_rates: dict[str, str] | None = None,
                  metrics: MetricsBackend | None = None,
              ) -> None:
                  self._config = config
                  self._clock = clock
                  self._db = db
                  self._metrics = metrics if metrics is not None else NoopMetrics()
                  self._log = engine_logger("runtime")
                  self._audit = AuditTrail(db, clock)
                  self._outbox = Outbox(db, clock)
                  self._outbox.ensure_schema()
                  self._catalog = EventCatalog()
                  for event_type in NETWORK_EVENT_TYPES:
                      self._catalog.register(event_type)
                  self._identity = IdentityEngine(
                      db=db,
                      clock=clock,
                      audit=self._audit,
                      outbox=self._outbox,
                      catalog=self._catalog,
                      metrics=self._metrics,
                  )
                  self._verification = VerificationEngine(
                      db=db,
                      clock=clock,
                      signer=signer,
                      audit=self._audit,
                      outbox=self._outbox,
                      catalog=self._catalog,
                      identity=self._identity,
                      metrics=self._metrics,
                  )
                  self._tokens = TokenEngine(
                      db=db,
                      clock=clock,
                      audit=self._audit,
                      outbox=self._outbox,
                      catalog=self._catalog,
                      identity=self._identity,
                      metrics=self._metrics,
                  )
                  self._currency = CurrencyEngine(
                      db=db,
                      clock=clock,
                      providers=[
                          StaticTableRateProvider(
                              fx_rates
                              if fx_rates is not None
                              else DEFAULT_FX_RATES,
                              clock,
                          )
                      ],
                      signer=signer,
                      audit=self._audit,
                      outbox=self._outbox,
                      catalog=self._catalog,
                      identity=self._identity,
                      metrics=self._metrics,
                  )
                  self._health = HealthRegistry()
                  self._health.register("storage", _StorageHealth(db))
                  self._health.register("identity", self._identity)
                  self._health.register("verification", self._verification)
                  self._health.register("tokens", self._tokens)
                  self._health.register("currency", self._currency)
                  self._root_zid: str | None = None

              @property
              def config(self) -> RuntimeConfig:
                  return self._config

              @property
              def identity(self) -> IdentityEngine:
                  return self._identity

              @property
              def verification(self) -> VerificationEngine:
                  return self._verification

              @property
              def tokens(self) -> TokenEngine:
                  return self._tokens

              @property
              def currency(self) -> CurrencyEngine:
                  return self._currency

              @property
              def audit(self) -> AuditTrail:
                  return self._audit

              @property
              def outbox(self) -> Outbox:
                  return self._outbox

              @property
              def root_zid(self) -> str | None:
                  return self._root_zid

              def bootstrap_root(
                  self, *, display_name: str = "Zyra Root Authority"
              ) -> Identity:
                  """Creates/returns the Network's own ACTIVE authority."""
                  if self._root_zid is not None:
                      return self._identity.require_identity(self._root_zid)
                  root = self._identity.register_identity(
                      kind=IdentityKind.INSTITUTION,
                      display_name=display_name,
                      actor="kernel",
                  )
                  self._identity.transition_identity(
                      root.zid,
                      IdentityStatus.ACTIVE,
                      actor="kernel",
                      reason="root authority bootstrap",
                  )
                  self._root_zid = root.zid
                  self._log.info(
                      "root authority bootstrapped zid=%s", root.zid
                  )
                  return self._identity.require_identity(root.zid)

              def health(self) -> ComponentHealth:
                  """Worst-status aggregate across all components."""
                  return self._health.overall()

              def health_components(self) -> tuple[ComponentHealth, ...]:
                  return self._health.snapshot()

              def check_health(self) -> ComponentHealth:
                  """Kernel itself satisfies the HealthCheck protocol."""
                  return self.health()
          PYEOF

          echo "=== KERNEL REBUILT ==="

      - name: Rebuild responses.py (full error mapping incl. tokens + FX)
        run: |
          set -euo pipefail
          cat > shared_engines/runtime/responses.py <<'PYEOF'
          """HTTP response envelope and typed-error mapping.

          Success: {"ok": true, "data": ...}
          Failure: {"ok": false, "error": {"type": ..., "message": ...}}
          """
          from __future__ import annotations

          from shared_engines.common.errors import (
              BackpressureError,
              ConfigurationError,
              EngineError,
              PolicyViolation,
              RecoveryRequired,
              ValidationError,
          )
          from shared_engines.currency.errors import (
              NoRouteError,
              RateUnavailableError,
              StaleRateError,
              UnknownCurrencyError,
          )
          from shared_engines.identity.errors import (
              IdentityAlreadyExistsError,
              IdentityNotFoundError,
              InvalidTransitionError,
          )
          from shared_engines.tokenization.errors import (
              DuplicateRuleError,
              EmissionCapExceededError,
              InsufficientBalanceError,
              ItemInactiveError,
              RuleInactiveError,
              UnknownItemError,
              UnknownRuleError,
          )
          from shared_engines.verification.errors import (
              AttestationNotFoundError,
              CredentialNotFoundError,
              MediaNotFoundError,
              TamperDetectedError,
          )


          class ApiError(Exception):
              """Explicit API failure with a stable status and code."""

              def __init__(self, status: int, code: str, message: str) -> None:
                  super().__init__(message)
                  self.status = status
                  self.code = code
                  self.message = message


          _NOT_FOUND_ERRORS = (
              IdentityNotFoundError,
              MediaNotFoundError,
              AttestationNotFoundError,
              CredentialNotFoundError,
              UnknownRuleError,
              UnknownItemError,
              UnknownCurrencyError,
              NoRouteError,
          )

          _CONFLICT_ERRORS = (
              InvalidTransitionError,
              TamperDetectedError,
              IdentityAlreadyExistsError,
              InsufficientBalanceError,
              EmissionCapExceededError,
              RuleInactiveError,
              ItemInactiveError,
              StaleRateError,
              DuplicateRuleError,
          )


          def map_engine_error(exc: EngineError) -> ApiError:
              """Maps typed engine errors to stable HTTP semantics."""
              if isinstance(exc, _NOT_FOUND_ERRORS):
                  return ApiError(404, "not_found", str(exc))
              if isinstance(exc, _CONFLICT_ERRORS):
                  return ApiError(409, "conflict", str(exc))
              if isinstance(exc, PolicyViolation):
                  return ApiError(403, "forbidden", str(exc))
              if isinstance(exc, ValidationError):
                  return ApiError(400, "invalid_request", str(exc))
              if isinstance(
                  exc, (BackpressureError, RateUnavailableError)
              ):
                  return ApiError(503, "unavailable", str(exc))
              if isinstance(exc, (RecoveryRequired, ConfigurationError)):
                  return ApiError(
                      500, "internal_error", "internal state error"
                  )
              return ApiError(500, "internal_error", "internal error")
          PYEOF

          echo "=== RESPONSES REBUILT ==="

      - name: Rebuild api.py (all endpoints: identity, verification, tokens, FX)
        run: |
          set -euo pipefail
          cat > shared_engines/runtime/api.py <<'PYEOF'
          """HTTP API over the kernel: stable routes, auth, envelopes.

          Routes (all JSON):
            GET  /health                                        (no auth)
            POST /identity/register
            GET  /identity/{zid}
            POST /identity/transition
            POST /verification/media
            POST /verification/media/verify
            GET  /verification/media/{media_id}
            GET  /verification/media/{media_id}/history
            POST /verification/credentials
            GET  /verification/credentials/{credential_id}
            POST /verification/credentials/revoke
            GET  /verification/subjects/{zid}/credentials
            POST /verification/attestations
            POST /verification/attestations/verify
            POST /tokens/rules
            POST /tokens/items
            GET  /tokens/items
            POST /tokens/earn
            POST /tokens/redeem
            GET  /tokens/{zid}/balance
            GET  /tokens/{zid}/history
            POST /currency/quote
            POST /currency/convert
            POST /currency/settle
            GET  /currency/conversions/{conversion_id}

          Auth: if a token is configured, every route except /health
          requires ``Authorization: Bearer <token>`` compared in
          constant time. Money amounts travel as decimal STRINGS.
          """
          from __future__ import annotations

          import base64
          import hmac
          import json
          from decimal import Decimal, InvalidOperation
          from http.server import BaseHTTPRequestHandler
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from shared_engines.common.errors import EngineError
          from shared_engines.common.serialization import canonical_json_dumps
          from shared_engines.currency.contracts import SignedQuote
          from shared_engines.identity.contracts import (
              Identity,
              IdentityKind,
              IdentityStatus,
          )
          from shared_engines.observability.health import ComponentHealth
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.responses import (
              ApiError,
              map_engine_error,
          )
          from shared_engines.tokenization.ledger import (
              EmissionRule,
              LedgerTransaction,
              RedemptionItem,
              RedemptionRecord,
          )
          from shared_engines.verification.attestations import Attestation
          from shared_engines.verification.credentials import (
              CredentialRecord,
              CredentialType,
          )
          from shared_engines.verification.media import (
              MediaKind,
              MediaRecord,
          )
          from shared_engines.verification.provenance import ProvenanceEvent


          class ZyraApiHandler(BaseHTTPRequestHandler):
              """Thread-safe request handler bound to a shared kernel."""

              kernel: ClassVar[ZyraKernel]

              def log_message(self, format: str, *args: object) -> None:
                  return None

              def do_GET(self) -> None:
                  self._dispatch("GET")

              def do_POST(self) -> None:
                  self._dispatch("POST")

              def _dispatch(self, method: str) -> None:
                  try:
                      self._route(method)
                  except ApiError as exc:
                      self._send_json(exc.status, self._error_body(exc))
                  except EngineError as exc:
                      mapped = map_engine_error(exc)
                      self._send_json(mapped.status, self._error_body(mapped))
                  except Exception:
                      self._send_json(
                          500,
                          {
                              "ok": False,
                              "error": {
                                  "type": "internal_error",
                                  "message": "internal error",
                              },
                          },
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [s for s in path.split("/") if s]
                  if segments == ["health"] and method == "GET":
                      self._handle_health()
                      return
                  if not self._authorized():
                      raise ApiError(
                          401,
                          "unauthorized",
                          "valid bearer token required",
                      )
                  if method == "GET":
                      self._route_get(segments)
                  elif method == "POST":
                      self._route_post(segments)
                  else:
                      raise ApiError(
                          405, "method_not_allowed", "unsupported method"
                      )

              def _route_get(self, s: list[str]) -> None:
                  if len(s) == 2 and s[0] == "identity":
                      self._handle_get_identity(s[1])
                  elif s == ["tokens", "items"]:
                      self._handle_list_items()
                  elif (
                      len(s) == 3
                      and s[0] == "tokens"
                      and s[2] == "balance"
                  ):
                      self._handle_token_balance(s[1])
                  elif (
                      len(s) == 3
                      and s[0] == "tokens"
                      and s[2] == "history"
                  ):
                      self._handle_token_history(s[1])
                  elif (
                      len(s) == 3
                      and s[0] == "verification"
                      and s[1] == "media"
                  ):
                      self._handle_get_media(s[2])
                  elif (
                      len(s) == 4
                      and s[0] == "verification"
                      and s[1] == "media"
                      and s[3] == "history"
                  ):
                      self._handle_media_history(s[2])
                  elif (
                      len(s) == 3
                      and s[0] == "verification"
                      and s[1] == "credentials"
                  ):
                      self._handle_get_credential(s[2])
                  elif (
                      len(s) == 4
                      and s[0] == "verification"
                      and s[1] == "subjects"
                      and s[3] == "credentials"
                  ):
                      self._handle_subject_credentials(s[2])
                  elif (
                      len(s) == 3
                      and s[0] == "currency"
                      and s[1] == "conversions"
                  ):
                      self._handle_get_conversion(s[2])
                  else:
                      raise ApiError(404, "not_found", "unknown route")

              def _route_post(self, s: list[str]) -> None:
                  if s == ["identity", "register"]:
                      self._handle_register_identity()
                  elif s == ["identity", "transition"]:
                      self._handle_transition()
                  elif s == ["verification", "media"]:
                      self._handle_register_media()
                  elif s == ["verification", "media", "verify"]:
                      self._handle_verify_media()
                  elif s == ["verification", "credentials"]:
                      self._handle_issue_credential()
                  elif s == ["verification", "credentials", "revoke"]:
                      self._handle_revoke_credential()
                  elif s == ["verification", "attestations"]:
                      self._handle_issue_attestation()
                  elif s == ["verification", "attestations", "verify"]:
                      self._handle_verify_attestation()
                  elif s == ["tokens", "rules"]:
                      self._handle_token_rule()
                  elif s == ["tokens", "items"]:
                      self._handle_token_item()
                  elif s == ["tokens", "earn"]:
                      self._handle_token_earn()
                  elif s == ["tokens", "redeem"]:
                      self._handle_token_redeem()
                  elif s == ["currency", "quote"]:
                      self._handle_currency_quote()
                  elif s == ["currency", "convert"]:
                      self._handle_currency_convert()
                  elif s == ["currency", "settle"]:
                      self._handle_currency_settle()
                  else:
                      raise ApiError(404, "not_found", "unknown route")

              def _authorized(self) -> bool:
                  token = type(self).kernel.config.api_token
                  if token is None:
                      return True
                  header = self.headers.get("Authorization")
                  if header is None:
                      return False
                  return hmac.compare_digest(header, f"Bearer {token}")

              def _read_json(self) -> dict[str, Any]:
                  length_header = self.headers.get("Content-Length")
                  if length_header is None:
                      raise ApiError(
                          411, "length_required", "Content-Length required"
                      )
                  try:
                      length = int(length_header)
                  except ValueError as exc:
                      raise ApiError(
                          400, "invalid_request", "bad Content-Length"
                      ) from exc
                  max_body = type(self).kernel.config.max_body_bytes
                  if length > max_body:
                      raise ApiError(
                          413, "payload_too_large", "body exceeds limit"
                      )
                  raw = self.rfile.read(length)
                  try:
                      doc: Any = json.loads(raw.decode("utf-8"))
                  except (UnicodeDecodeError, ValueError) as exc:
                      raise ApiError(
                          400, "invalid_json", "body is not valid JSON"
                      ) from exc
                  if not isinstance(doc, dict):
                      raise ApiError(
                          400, "invalid_request", "body must be a JSON object"
                      )
                  typed: dict[str, Any] = {}
                  for key, value in doc.items():
                      typed[str(key)] = value
                  return typed

              @staticmethod
              def _require_str(doc: dict[str, Any], key: str) -> str:
                  value = doc.get(key)
                  if not isinstance(value, str) or not value.strip():
                      raise ApiError(
                          400, "invalid_request", f"missing field: {key}"
                      )
                  return value

              @staticmethod
              def _require_optional_str(
                  doc: dict[str, Any], key: str
              ) -> str | None:
                  value = doc.get(key)
                  if value is None:
                      return None
                  if not isinstance(value, str) or not value.strip():
                      raise ApiError(
                          400, "invalid_request", f"invalid field: {key}"
                      )
                  return value

              @staticmethod
              def _require_int(doc: dict[str, Any], key: str) -> int:
                  value = doc.get(key)
                  if not isinstance(value, int) or isinstance(value, bool):
                      raise ApiError(
                          400, "invalid_request", f"missing field: {key}"
                      )
                  return value

              @staticmethod
              def _require_optional_int(
                  doc: dict[str, Any], key: str
              ) -> int | None:
                  value = doc.get(key)
                  if value is None:
                      return None
                  if not isinstance(value, int) or isinstance(value, bool):
                      raise ApiError(
                          400, "invalid_request", f"invalid field: {key}"
                      )
                  return value

              @staticmethod
              def _require_decimal_str(
                  doc: dict[str, Any], key: str
              ) -> Decimal:
                  raw = ZyraApiHandler._require_str(doc, key)
                  try:
                      return Decimal(raw)
                  except InvalidOperation as exc:
                      raise ApiError(
                          400,
                          "invalid_request",
                          f"{key} must be a decimal string",
                      ) from exc

              def _send_json(
                  self, status: int, payload: dict[str, Any]
              ) -> None:
                  body = canonical_json_dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              @staticmethod
              def _error_body(exc: ApiError) -> dict[str, Any]:
                  return {
                      "ok": False,
                      "error": {"type": exc.code, "message": exc.message},
                  }

              def _ok(self, data: Any, status: int = 200) -> None:
                  self._send_json(status, {"ok": True, "data": data})

              def _handle_health(self) -> None:
                  kernel = type(self).kernel
                  self._ok(
                      {
                          "overall": _health_json(kernel.health()),
                          "components": [
                              _health_json(c)
                              for c in kernel.health_components()
                          ],
                      }
                  )

              def _handle_register_identity(self) -> None:
                  doc = self._read_json()
                  kind_raw = self._require_str(doc, "kind")
                  try:
                      kind = IdentityKind(kind_raw)
                  except ValueError as exc:
                      raise ApiError(
                          400, "invalid_request", "unknown kind"
                      ) from exc
                  identity = type(self).kernel.identity.register_identity(
                      kind=kind,
                      display_name=self._require_str(doc, "display_name"),
                      actor=self._require_str(doc, "actor"),
                  )
                  self._ok(_identity_json(identity), status=201)

              def _handle_get_identity(self, zid: str) -> None:
                  identity = type(self).kernel.identity.get_identity(zid)
                  if identity is None:
                      raise ApiError(
                          404, "not_found", f"unknown zid: {zid}"
                      )
                  self._ok(_identity_json(identity))

              def _handle_transition(self) -> None:
                  doc = self._read_json()
                  zid = self._require_str(doc, "zid")
                  try:
                      target = IdentityStatus(
                          self._require_str(doc, "to_status")
                      )
                  except ValueError as exc:
                      raise ApiError(
                          400, "invalid_request", "unknown to_status"
                      ) from exc
                  identity = type(self).kernel.identity.transition_identity(
                      zid,
                      target,
                      actor=self._require_str(doc, "actor"),
                      reason=self._require_str(doc, "reason"),
                  )
                  self._ok(_identity_json(identity))

              def _handle_register_media(self) -> None:
                  doc = self._read_json()
                  kind_raw = self._require_str(doc, "kind")
                  try:
                      kind = MediaKind(kind_raw)
                  except ValueError as exc:
                      raise ApiError(
                          400, "invalid_request", "unknown media kind"
                      ) from exc
                  content = self._decode_b64(
                      self._require_str(doc, "content_b64")
                  )
                  record = type(self).kernel.verification.register_media(
                      owner_zid=self._require_str(doc, "owner_zid"),
                      kind=kind,
                      title=self._require_str(doc, "title"),
                      content=content,
                      content_type=self._require_str(doc, "content_type"),
                      actor=self._require_str(doc, "actor"),
                  )
                  self._ok(_media_json(record), status=201)

              def _handle_verify_media(self) -> None:
                  doc = self._read_json()
                  content = self._decode_b64(
                      self._require_str(doc, "content_b64")
                  )
                  record = type(self).kernel.verification.verify_media(
                      self._require_str(doc, "media_id"), content
                  )
                  self._ok(_media_json(record))

              def _handle_get_media(self, media_id: str) -> None:
                  record = type(self).kernel.verification.get_media(media_id)
                  if record is None:
                      raise ApiError(
                          404, "not_found", f"unknown media: {media_id}"
                      )
                  self._ok(_media_json(record))

              def _handle_media_history(self, media_id: str) -> None:
                  history = (
                      type(self).kernel.verification.media_history(media_id)
                  )
                  self._ok([_provenance_json(e) for e in history])

              def _handle_issue_credential(self) -> None:
                  doc = self._read_json()
                  type_raw = self._require_str(doc, "credential_type")
                  try:
                      credential_type = CredentialType(type_raw)
                  except ValueError as exc:
                      raise ApiError(
                          400, "invalid_request", "unknown credential_type"
                      ) from exc
                  record = type(self).kernel.verification.issue_credential(
                      subject_zid=self._require_str(doc, "subject_zid"),
                      issuer_zid=self._require_str(doc, "issuer_zid"),
                      credential_type=credential_type,
                      title=self._require_str(doc, "title"),
                      detail=self._require_str(doc, "detail"),
                  )
                  self._ok(_credential_json(record), status=201)

              def _handle_get_credential(self, credential_id: str) -> None:
                  record = type(self).kernel.verification.get_credential(
                      credential_id
                  )
                  if record is None:
                      raise ApiError(
                          404,
                          "not_found",
                          f"unknown credential: {credential_id}",
                      )
                  self._ok(_credential_json(record))

              def _handle_revoke_credential(self) -> None:
                  doc = self._read_json()
                  record = type(self).kernel.verification.revoke_credential(
                      self._require_str(doc, "credential_id"),
                      revoked_by=self._require_str(doc, "revoked_by"),
                      reason=self._require_str(doc, "reason"),
                  )
                  self._ok(_credential_json(record))

              def _handle_subject_credentials(self, zid: str) -> None:
                  history = type(self).kernel.verification.subject_history(zid)
                  self._ok([_credential_json(c) for c in history])

              def _handle_issue_attestation(self) -> None:
                  doc = self._read_json()
                  attestation = (
                      type(self).kernel.verification.issue_attestation(
                          subject_zid=self._require_str(doc, "subject_zid"),
                          claim=self._require_str(doc, "claim"),
                          subject_sha256=self._require_optional_str(
                              doc, "subject_sha256"
                          ),
                      )
                  )
                  self._ok(_attestation_json(attestation), status=201)

              def _handle_verify_attestation(self) -> None:
                  doc = self._read_json()
                  ok = type(self).kernel.verification.verify_attestation(
                      self._require_str(doc, "attestation_id")
                  )
                  self._ok({"valid": ok})

              def _handle_token_rule(self) -> None:
                  doc = self._read_json()
                  rule = type(self).kernel.tokens.define_rule(
                      activity=self._require_str(doc, "activity"),
                      amount=self._require_int(doc, "amount"),
                      daily_cap=self._require_optional_int(doc, "daily_cap"),
                      lifetime_cap=self._require_optional_int(
                          doc, "lifetime_cap"
                      ),
                  )
                  self._ok(_rule_json(rule), status=201)

              def _handle_token_item(self) -> None:
                  doc = self._read_json()
                  item = type(self).kernel.tokens.define_item(
                      item_id=self._require_str(doc, "item_id"),
                      title=self._require_str(doc, "title"),
                      cost=self._require_int(doc, "cost"),
                  )
                  self._ok(_item_json(item), status=201)

              def _handle_list_items(self) -> None:
                  items = type(self).kernel.tokens.list_items()
                  self._ok([_item_json(i) for i in items])

              def _handle_token_earn(self) -> None:
                  doc = self._read_json()
                  tx = type(self).kernel.tokens.earn(
                      subject_zid=self._require_str(doc, "subject_zid"),
                      activity=self._require_str(doc, "activity"),
                      ref_type=self._require_str(doc, "ref_type"),
                      ref_id=self._require_str(doc, "ref_id"),
                  )
                  self._ok(_tx_json(tx), status=201)

              def _handle_token_redeem(self) -> None:
                  doc = self._read_json()
                  record = type(self).kernel.tokens.redeem(
                      self._require_str(doc, "subject_zid"),
                      self._require_str(doc, "item_id"),
                  )
                  self._ok(_redemption_json(record))

              def _handle_token_balance(self, zid: str) -> None:
                  balance = type(self).kernel.tokens.balance(zid)
                  self._ok({"zid": zid, "balance": balance})

              def _handle_token_history(self, zid: str) -> None:
                  history = type(self).kernel.tokens.history(zid)
                  self._ok([_tx_json(t) for t in history])

              def _handle_currency_quote(self) -> None:
                  doc = self._read_json()
                  signed = type(self).kernel.currency.quote(
                      base=self._require_str(doc, "base"),
                      quote_ccy=self._require_str(doc, "quote_ccy"),
                      requester_zid=self._require_str(doc, "requester_zid"),
                  )
                  self._ok(_signed_quote_json(signed), status=201)

              def _handle_currency_convert(self) -> None:
                  doc = self._read_json()
                  amount = self._require_decimal_str(doc, "amount")
                  signed, conversion_id, exact = (
                      type(self).kernel.currency.convert(
                          subject_zid=self._require_str(doc, "subject_zid"),
                          base=self._require_str(doc, "base"),
                          quote_ccy=self._require_str(doc, "quote_ccy"),
                          amount=amount,
                      )
                  )
                  self._ok(
                      {
                          "conversion_id": conversion_id,
                          "exact_amount": str(exact),
                          "quote": _signed_quote_json(signed),
                      },
                      status=201,
                  )

              def _handle_currency_settle(self) -> None:
                  doc = self._read_json()
                  type(self).kernel.currency.record_settlement(
                      self._require_str(doc, "conversion_id"),
                      settlement_ref=self._require_str(doc, "settlement_ref"),
                  )
                  self._ok({"settled": True})

              def _handle_get_conversion(self, conversion_id: str) -> None:
                  record = type(self).kernel.currency.get_conversion(
                      conversion_id
                  )
                  if record is None:
                      raise ApiError(
                          404,
                          "not_found",
                          f"unknown conversion: {conversion_id}",
                      )
                  self._ok(record)

              @staticmethod
              def _decode_b64(value: str) -> bytes:
                  try:
                      return base64.b64decode(value, validate=True)
                  except ValueError as exc:
                      raise ApiError(
                          400,
                          "invalid_request",
                          "content_b64 is not valid base64",
                      ) from exc


          def _health_json(component: ComponentHealth) -> dict[str, object]:
              return {
                  "component": component.component,
                  "status": component.status.value,
                  "detail": component.detail,
              }


          def _identity_json(identity: Identity) -> dict[str, object]:
              return {
                  "zid": identity.zid,
                  "kind": identity.kind.value,
                  "status": identity.status.value,
                  "display_name": identity.display_name,
                  "created_at": identity.created_at,
                  "updated_at": identity.updated_at,
                  "contract_version": identity.contract_version,
              }


          def _media_json(record: MediaRecord) -> dict[str, object]:
              return {
                  "media_id": record.media_id,
                  "owner_zid": record.owner_zid,
                  "kind": record.kind.value,
                  "title": record.title,
                  "content_sha256": record.content_sha256,
                  "content_size": record.content_size,
                  "content_type": record.content_type,
                  "created_at": record.created_at,
                  "contract_version": record.contract_version,
              }


          def _provenance_json(event: ProvenanceEvent) -> dict[str, object]:
              return {
                  "sequence": event.sequence,
                  "media_id": event.media_id,
                  "actor_zid": event.actor_zid,
                  "action": event.action,
                  "detail": event.detail,
                  "occurred_at": event.occurred_at,
                  "previous_hash": event.previous_hash,
                  "event_hash": event.event_hash,
              }


          def _credential_json(record: CredentialRecord) -> dict[str, object]:
              return {
                  "credential_id": record.credential_id,
                  "subject_zid": record.subject_zid,
                  "issuer_zid": record.issuer_zid,
                  "credential_type": record.credential_type.value,
                  "title": record.title,
                  "detail": record.detail,
                  "issued_at": record.issued_at,
                  "valid_from": record.valid_from,
                  "valid_until": record.valid_until,
                  "revoked": record.revoked,
                  "revoked_at": record.revoked_at,
                  "revoked_reason": record.revoked_reason,
                  "contract_version": record.contract_version,
              }


          def _attestation_json(attestation: Attestation) -> dict[str, object]:
              return {
                  "attestation_id": attestation.attestation_id,
                  "subject_zid": attestation.subject_zid,
                  "claim": attestation.claim,
                  "subject_sha256": attestation.subject_sha256,
                  "issued_at": attestation.issued_at,
                  "signature_b64": base64.b64encode(
                      attestation.signature
                  ).decode("ascii"),
                  "signer_public_pem": attestation.signer_public_pem.decode(
                      "utf-8"
                  ),
                  "contract_version": attestation.contract_version,
              }


          def _rule_json(rule: EmissionRule) -> dict[str, object]:
              return {
                  "rule_id": rule.rule_id,
                  "activity": rule.activity,
                  "amount": rule.amount,
                  "daily_cap": rule.daily_cap,
                  "lifetime_cap": rule.lifetime_cap,
                  "active": rule.active,
              }


          def _item_json(item: RedemptionItem) -> dict[str, object]:
              return {
                  "item_id": item.item_id,
                  "title": item.title,
                  "cost": item.cost,
                  "active": item.active,
              }


          def _tx_json(tx: LedgerTransaction) -> dict[str, object]:
              return {
                  "tx_id": tx.tx_id,
                  "kind": tx.kind,
                  "debit_account": tx.debit_account,
                  "credit_account": tx.credit_account,
                  "amount": tx.amount,
                  "reason": tx.reason,
                  "ref_type": tx.ref_type,
                  "ref_id": tx.ref_id,
                  "actor": tx.actor,
                  "created_at": tx.created_at,
              }


          def _redemption_json(record: RedemptionRecord) -> dict[str, object]:
              return {
                  "redemption_id": record.redemption_id,
                  "subject_zid": record.subject_zid,
                  "item_id": record.item_id,
                  "cost": record.cost,
                  "tx_id": record.tx_id,
                  "created_at": record.created_at,
              }


          def _signed_quote_json(signed: SignedQuote) -> dict[str, object]:
              return {
                  "pair": signed.quote.pair.normalized,
                  "rate": str(signed.quote.rate),
                  "quoted_at": signed.quote.quoted_at,
                  "expires_at": signed.quote.expires_at,
                  "source": signed.quote.source,
                  "issuer_zid": signed.issuer_zid,
                  "signature_b64": base64.b64encode(
                      signed.signature
                  ).decode("ascii"),
                  "signer_public_pem": signed.signer_public_pem.decode(
                      "utf-8"
                  ),
                  "contract_version": signed.contract_version,
              }
          PYEOF

          echo "=== API REBUILT ==="

      - name: Write HTTP tests for tokens and FX endpoints
        run: |
          set -euo pipefail
          cat > shared_engines/runtime/tests/test_tokens_fx_api.py <<'PYEOF'
          from __future__ import annotations

          import json
          import threading
          import urllib.error
          import urllib.request
          from collections.abc import Iterator
          from pathlib import Path
          from typing import Any

          import pytest

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.api import ZyraApiHandler
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.server import ZyraServer
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import Ed25519Signer


          class _Cluster:
              def __init__(self, tmp_path: Path) -> None:
                  self.db = SQLiteAdapter(Path(tmp_path) / "runtime.db")
                  self.kernel = ZyraKernel(
                      db=self.db,
                      clock=FrozenClock(),
                      signer=Ed25519Signer.generate()[0],
                      config=RuntimeConfig(host="127.0.0.1", port=0),
                  )
                  self.kernel.bootstrap_root()
                  ZyraApiHandler.kernel = self.kernel
                  self.server = ZyraServer(("127.0.0.1", 0))
                  self.thread = threading.Thread(
                      target=self.server.serve_forever, daemon=True
                  )
                  self.thread.start()
                  self.base = f"http://127.0.0.1:{self.server.bound_port}"

              def stop(self) -> None:
                  self.server.shutdown()
                  self.server.server_close()
                  self.thread.join(timeout=5)
                  self.db.close()

              def call(
                  self,
                  method: str,
                  path: str,
                  body: dict[str, Any] | None = None,
              ) -> tuple[int, dict[str, Any]]:
                  headers: dict[str, str] = {
                      "Content-Type": "application/json"
                  }
                  data = (
                      json.dumps(body).encode("utf-8")
                      if body is not None
                      else None
                  )
                  request = urllib.request.Request(
                      f"{self.base}{path}",
                      data=data,
                      headers=headers,
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(
                          request, timeout=10
                      ) as resp:
                          payload: dict[str, Any] = json.loads(
                              resp.read().decode("utf-8")
                          )
                          return int(resp.status), payload
                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8") or "{}"
                      error_payload: dict[str, Any] = json.loads(raw)
                      return int(exc.code), error_payload


          @pytest.fixture
          def cluster(tmp_path: Path) -> Iterator[_Cluster]:
              running = _Cluster(tmp_path)
              yield running
              running.stop()


          def _user(cluster: _Cluster, name: str) -> dict[str, Any]:
              status, payload = cluster.call(
                  "POST",
                  "/identity/register",
                  {
                      "kind": "person",
                      "display_name": name,
                      "actor": "api-clerk",
                  },
              )
              assert status == 201
              data: dict[str, Any] = payload["data"]
              return data


          def test_health_includes_tokens_and_currency(
              cluster: _Cluster,
          ) -> None:
              status, payload = cluster.call("GET", "/health")
              assert status == 200
              names = {
                  c["component"] for c in payload["data"]["components"]
              }
              assert {
                  "tokens",
                  "currency",
                  "storage",
                  "identity",
                  "verification",
              } <= names
              assert payload["data"]["overall"]["status"] == "healthy"


          def test_token_full_lifecycle_via_http(
              cluster: _Cluster,
          ) -> None:
              user = _user(cluster, "Recycler")
              rule_status, rule = cluster.call(
                  "POST",
                  "/tokens/rules",
                  {
                      "activity": "recycle.photo",
                      "amount": 5,
                      "daily_cap": 20,
                  },
              )
              assert rule_status == 201
              assert rule["data"]["active"] is True
              earn_status, earned = cluster.call(
                  "POST",
                  "/tokens/earn",
                  {
                      "subject_zid": user["zid"],
                      "activity": "recycle.photo",
                      "ref_type": "media",
                      "ref_id": "MED-1",
                  },
              )
              assert earn_status == 201
              assert earned["data"]["amount"] == 5
              balance_status, balance = cluster.call(
                  "GET", f"/tokens/{user['zid']}/balance"
              )
              assert balance_status == 200
              assert balance["data"]["balance"] == 5
              item_status, _ = cluster.call(
                  "POST",
                  "/tokens/items",
                  {
                      "item_id": "premium_space_1gb",
                      "title": "1 GB premium space",
                      "cost": 3,
                  },
              )
              assert item_status == 201
              redeem_status, redeemed = cluster.call(
                  "POST",
                  "/tokens/redeem",
                  {
                      "subject_zid": user["zid"],
                      "item_id": "premium_space_1gb",
                  },
              )
              assert redeem_status == 200
              assert redeemed["data"]["cost"] == 3
              final_status, final_balance = cluster.call(
                  "GET", f"/tokens/{user['zid']}/balance"
              )
              assert final_status == 200
              assert final_balance["data"]["balance"] == 2
              history_status, history = cluster.call(
                  "GET", f"/tokens/{user['zid']}/history"
              )
              assert history_status == 200
              kinds = sorted(t["kind"] for t in history["data"])
              assert kinds == ["mint", "redeem"]


          def test_token_earn_without_rule_not_found(
              cluster: _Cluster,
          ) -> None:
              user = _user(cluster, "NoRule")
              status, payload = cluster.call(
                  "POST",
                  "/tokens/earn",
                  {
                      "subject_zid": user["zid"],
                      "activity": "never.defined",
                      "ref_type": "x",
                      "ref_id": "1",
                  },
              )
              assert status == 404
              assert payload["error"]["type"] == "not_found"


          def test_token_balance_unknown_identity(
              cluster: _Cluster,
          ) -> None:
              status, payload = cluster.call(
                  "GET", "/tokens/ZID-ghost/balance"
              )
              assert status == 404
              assert payload["error"]["type"] == "not_found"


          def test_currency_quote_bridge_and_convert(
              cluster: _Cluster,
          ) -> None:
              user = _user(cluster, "Importer")
              quote_status, quote = cluster.call(
                  "POST",
                  "/currency/quote",
                  {
                      "base": "GTQ",
                      "quote_ccy": "CNY",
                      "requester_zid": user["zid"],
                  },
              )
              assert quote_status == 201
              assert quote["data"]["rate"] == "0.928"
              assert quote["data"]["source"].startswith("bridge:USD")
              assert quote["data"]["signature_b64"]
              convert_status, converted = cluster.call(
                  "POST",
                  "/currency/convert",
                  {
                      "subject_zid": user["zid"],
                      "base": "GTQ",
                      "quote_ccy": "CNY",
                      "amount": "1000.00",
                  },
              )
              assert convert_status == 201
              conversion_id = converted["data"]["conversion_id"]
              assert converted["data"]["exact_amount"] == "928.0000"
              settle_status, _ = cluster.call(
                  "POST",
                  "/currency/settle",
                  {
                      "conversion_id": conversion_id,
                      "settlement_ref": "WIRE-ZY-001",
                  },
              )
              assert settle_status == 200
              get_status, record = cluster.call(
                  "GET", f"/currency/conversions/{conversion_id}"
              )
              assert get_status == 200
              assert record["data"]["fx_settlement_ref"] == "WIRE-ZY-001"


          def test_currency_bad_amount_and_unknown_currency(
              cluster: _Cluster,
          ) -> None:
              user = _user(cluster, "Fx")
              bad_status, _ = cluster.call(
                  "POST",
                  "/currency/convert",
                  {
                      "subject_zid": user["zid"],
                      "base": "USD",
                      "quote_ccy": "EUR",
                      "amount": "not-a-number",
                  },
              )
              assert bad_status == 400
              unknown_status, unknown = cluster.call(
                  "POST",
                  "/currency/quote",
                  {
                      "base": "USD",
                      "quote_ccy": "ZZZ",
                      "requester_zid": user["zid"],
                  },
              )
              assert unknown_status == 404
              assert unknown["error"]["type"] == "not_found"
