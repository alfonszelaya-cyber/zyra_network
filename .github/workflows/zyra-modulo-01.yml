name: zyra-w18-cleanup-capabilities

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w18-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Structural cleanup (26 orphan dirs + 2 empty namespaces)
        run: |
          set -euo pipefail
          for d in \
            shared_engines/identity/authentication \
            shared_engines/identity/authorization \
            shared_engines/identity/biometrics \
            shared_engines/identity/credentials \
            shared_engines/identity/profiles \
            shared_engines/orchestration/dispatcher \
            shared_engines/orchestration/lifecycle \
            shared_engines/orchestration/scheduler \
            shared_engines/orchestration/tasks \
            shared_engines/radar/core \
            shared_engines/radar/detectors \
            shared_engines/radar/events \
            shared_engines/radar/registry \
            shared_engines/radar/rules \
            shared_engines/radar/scoring \
            shared_engines/tokenization/assets \
            shared_engines/tokenization/exchange \
            shared_engines/tokenization/registry \
            shared_engines/tokenization/transactions \
            shared_engines/tokenization/valuation \
            shared_engines/verification/ai_detection \
            shared_engines/verification/audio \
            shared_engines/verification/documents \
            shared_engines/verification/images \
            shared_engines/verification/integrity \
            shared_engines/verification/video; do
            rm -rf "$d"
          done
          rm -rf shared_engines/radar shared_engines/orchestration
          remaining=$(find . -path ./.git -prune -o \
            -name '__init__py' -print | wc -l)
          echo "orphan __init__py remaining: $remaining"
          test "$remaining" -eq 0
          echo "=== CLEANUP COMPLETE ==="

      - name: Build capabilities composition layer
        run: |
          set -euo pipefail
          cat > shared_engines/runtime/capabilities.py <<'PYEOF'
          """ZyraCapabilities: the trust-services composition
          layer.

          Composes the transverse engines into the
          consumer-facing services of the Network, over one
          durable database. Deliberately does NOT replace
          ZyraKernel (which owns identity/verification/
          tokens/currency): capabilities layers the trust
          services on top, sharing the same database.
          Engines whose wiring is a per-node decision
          (consensus member_id, integrations handlers,
          system_loader contract version) stay direct-use.
          """
          from __future__ import annotations

          from shared_engines.ai.engine import AIEngine
          from shared_engines.audit.chain import AuditTrail
          from shared_engines.certification.engine import (
              CertificationEngine,
          )
          from shared_engines.certification.registry import (
              IssuerRegistry,
          )
          from shared_engines.common.clocks import Clock
          from shared_engines.compliance.engine import (
              ComplianceEngine,
          )
          from shared_engines.encryption.engine import (
              EncryptionEngine,
          )
          from shared_engines.events.contracts import (
              EventCatalog,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.export.engine import ExportEngine
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.integrity.engine import IntegrityEngine
          from shared_engines.interoperability.engine import (
              InteroperabilityEngine,
          )
          from shared_engines.network.document_exchange import (
              DocumentExchange,
          )
          from shared_engines.network.life_history import LifeHistory
          from shared_engines.network.portable_profile import (
              ProfileRegistry,
          )
          from shared_engines.network.trust_flow import TrustFlow
          from shared_engines.reputation.engine import ReputationEngine
          from shared_engines.search.engine import SearchEngine
          from shared_engines.storage.database import Database
          from shared_engines.verification.credentials import (
              CredentialRegistry,
          )
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )

          CAPABILITY_EVENT_TYPES = (
              "identity.registered",
              "identity.status_changed",
              "verification.credential.issued",
              "verification.credential.revoked",
              "network.profile.updated",
              "network.profile.accessed",
              "network.history.appended",
              "network.document.sealed",
              "network.signature.requested",
              "network.document.signed",
              "network.document.rejected",
              "network.search.performed",
              "reputation.event.recorded",
              "certification.certificate.issued",
              "certification.certificate.revoked",
              "compliance.decision.recorded",
              "export.bundle.created",
              "ai.analysis.recorded",
          )


          class ZyraCapabilities:
              """Trust services over one database."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  identity: IdentityEngine,
                  signer: Ed25519Signer,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self.audit = AuditTrail(db, clock)
                  self.outbox = Outbox(db, clock)
                  self.outbox.ensure_schema()
                  self.catalog = EventCatalog()
                  for event_type in (
                      CAPABILITY_EVENT_TYPES
                  ):
                      self.catalog.register(event_type)
                  self.profiles = ProfileRegistry(
                      db,
                      clock,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.integrity = IntegrityEngine(
                      db, clock
                  )
                  self.trust = TrustFlow(
                      identity=identity,
                      profiles=self.profiles,
                  )
                  self.history = LifeHistory(
                      db,
                      clock,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.exchange = DocumentExchange(
                      db,
                      clock,
                      signer=signer,
                      integrity=self.integrity,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.credentials = CredentialRegistry(
                      db,
                      clock,
                      self.audit,
                      self.outbox,
                      self.catalog,
                  )
                  self.issuers = IssuerRegistry(db, clock)
                  self.certification = CertificationEngine(
                      db,
                      clock,
                      issuers=self.issuers,
                      identity=identity,
                      credentials=self.credentials,
                      signer=signer,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.search = SearchEngine(
                      db,
                      clock,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.reputation = ReputationEngine(
                      db,
                      clock,
                      identity=identity,
                      integrity=self.integrity,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.export = ExportEngine(
                      db,
                      clock,
                      signer=signer,
                      audit=self.audit,
                  )
                  self.interop = InteroperabilityEngine(
                      db, clock
                  )
                  self.compliance = ComplianceEngine(
                      db,
                      clock,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.ai = AIEngine(
                      db,
                      clock,
                      audit=self.audit,
                      outbox=self.outbox,
                  )
                  self.encryption = EncryptionEngine(
                      db,
                      clock,
                      namespace="capabilities",
                  )
          PYEOF
          echo "=== CAPABILITIES READY ==="

      - name: End-to-end capabilities proofs (3)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/runtime/tests
          cat > shared_engines/runtime/tests/test_capabilities.py <<'PYEOF'
          """Capabilities proofs: the family-demo end to end
          over the trust stack."""
          from __future__ import annotations

          from pathlib import Path

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              IdentityKind,
              IdentityStatus,
          )
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.network.document_exchange import (
              DocumentExchange,
          )
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities,
          )
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )


          def _caps(
              tmp_path: Path,
          ) -> tuple[
              SQLiteAdapter,
              ZyraCapabilities,
              IdentityEngine,
          ]:
              db = SQLiteAdapter(tmp_path / "caps.db")
              clock = FrozenClock()
              audit = AuditTrail(db, clock)
              outbox = Outbox(db, clock)
              outbox.ensure_schema()
              catalog = EventCatalog()
              for et in (
                  "identity.registered",
                  "identity.status_changed",
              ):
                  catalog.register(et)
              identity = IdentityEngine(
                  db=db,
                  clock=clock,
                  audit=audit,
                  outbox=outbox,
                  catalog=catalog,
              )
              signer, _ = Ed25519Signer.generate()
              caps = ZyraCapabilities(
                  db,
                  clock,
                  identity=identity,
                  signer=signer,
              )
              return db, caps, identity


          def test_trust_services_end_to_end(
              tmp_path: Path,
          ) -> None:
              db, caps, identity = _caps(tmp_path)
              try:
                  caps.profiles.register_app(
                      app_id="familia",
                      display_name="Familia",
                      scopes=(
                          "display_name",
                          "contact",
                      ),
                  )
                  user = identity.register_identity(
                      kind=IdentityKind.PERSON,
                      display_name="maria",
                      actor="familia",
                  )
                  caps.profiles.set_field(
                      zid=user.zid,
                      field="display_name",
                      value="Maria Lopez",
                  )
                  caps.profiles.set_field(
                      zid=user.zid,
                      field="contact",
                      value="maria@zyra.sv",
                  )
                  final = caps.trust.onboarding_complete(
                      zid=user.zid,
                      actor="verifier",
                  )
                  assert final.status is (
                      IdentityStatus.ACTIVE
                  )
                  assert (
                      caps.trust.is_trusted(
                          zid=user.zid
                      )
                      is True
                  )
                  view = caps.profiles.view_for_app(
                      app_id="familia",
                      zid=user.zid,
                  )
                  assert (
                      view.fields["display_name"]
                      == "Maria Lopez"
                  )
                  first = caps.history.append(
                      zid=user.zid,
                      entry_type=(
                          "birth_registration"
                      ),
                      actor_app="familia",
                      payload={
                          "hospital": "San Salvador"
                      },
                  )
                  assert first.entry_seq == 1
                  assert (
                      caps.history.verify_chain(
                          zid=user.zid
                      )
                      is True
                  )
                  sealed = caps.exchange.seal_document(
                      owner_zid=user.zid,
                      title="Acta",
                      content=b"acta de nacimiento",
                      actor_app="familia",
                  )
                  assert (
                      DocumentExchange.offline_verify(
                          document_id=(
                              sealed.document_id
                          ),
                          content=(
                              b"acta de nacimiento"
                          ),
                          signature=(
                              sealed.network_signature
                          ),
                          public_pem=(
                              sealed.public_pem
                          ),
                      )
                      is True
                  )
              finally:
                  db.close()


          def test_certification_search_reputation(
              tmp_path: Path,
          ) -> None:
              db, caps, identity = _caps(tmp_path)
              try:
                  caps.profiles.register_app(
                      app_id="familia",
                      display_name="Familia",
                      scopes=("display_name",),
                  )
                  uni = identity.register_identity(
                      kind=IdentityKind.INSTITUTION,
                      display_name="Uni SV",
                      actor="familia",
                  )
                  user = identity.register_identity(
                      kind=IdentityKind.PERSON,
                      display_name="maria lopez",
                      actor="familia",
                  )
                  caps.issuers.register_issuer(
                      issuer_id=uni.zid,
                      display_name="Uni SV",
                      scopes=("education",),
                  )
                  cert = (
                      caps.certification
                      .issue_certificate(
                          subject_zid=user.zid,
                          issuer_id=uni.zid,
                          scope="education",
                          title=(
                              "Ingenieria"
                              " Informatica"
                          ),
                          detail="titulo",
                      )
                  )
                  verdict = (
                      caps.certification
                      .verify_certificate(
                          certificate_id=(
                              cert.certificate_id
                          )
                      )
                  )
                  assert verdict.valid is True
                  result = caps.search.search(
                      app_id="familia",
                      query="ingenieria",
                  )
                  sources = {
                      h.source
                      for h in result.items
                  }
                  assert (
                      "certificate" in sources
                  )
                  event = caps.reputation.record_event(
                      subject_zid=user.zid,
                      actor_zid=uni.zid,
                      kind="positive",
                      evidence=b"titulo verificado",
                  )
                  summary = caps.reputation.summary(
                      subject_zid=user.zid
                  )
                  assert summary.score == 10
                  assert (
                      caps.reputation.verify_evidence(
                          event_id=event.event_id,
                          evidence=(
                              b"titulo verificado"
                          ),
                      )
                      is True
                  )
              finally:
                  db.close()


          def test_export_interop_compliance_ai_encryption(
              tmp_path: Path,
          ) -> None:
              db, caps, identity = _caps(tmp_path)
              try:
                  caps.profiles.register_app(
                      app_id="familia",
                      display_name="Familia",
                      scopes=("display_name",),
                  )
                  _ = identity
                  bundle = caps.export.export_bundle(
                      subject_zid="ZID-1",
                      entries=(
                          (
                              "doc",
                              "D-1",
                              "acta",
                          ),
                      ),
                      actor_app="familia",
                  )
                  assert (
                      caps.export.verify_stored(
                          bundle_id=(
                              bundle.bundle_id
                          )
                      )
                      is True
                  )
                  caps.interop.register_schema(
                      schema_id="zyra.demo",
                      version=1,
                      definition="demo",
                  )
                  agreed = caps.interop.negotiate(
                      schema_id="zyra.demo",
                      client_versions=(1, 2),
                  )
                  assert agreed.agreed_version == 1
                  caps.compliance.register_policy(
                      jurisdiction="SV",
                      requirement="kyc_verified",
                      mandatory=True,
                  )
                  decision = caps.compliance.evaluate(
                      subject_zid="ZID-1",
                      jurisdiction="SV",
                      requirement="kyc_verified",
                      satisfied=True,
                  )
                  assert (
                      decision.compliant is True
                  )
                  caps.ai.register_model(
                      model_id="classifier",
                      provider="lab",
                      model_version="1.0",
                      capabilities=("document",),
                  )
                  record = caps.ai.record_analysis(
                      model_id="classifier",
                      content_sha256="a" * 64,
                      verdict="authentic",
                      confidence=0.9,
                  )
                  assert (
                      record.model_version
                      == "1.0"
                  )
                  sealed = caps.encryption.seal(
                      b"secreto de la familia"
                  )
                  assert (
                      caps.encryption.open(sealed)
                      == b"secreto de la familia"
                  )
              finally:
                  db.close()
          PYEOF
          echo "=== CAPABILITY TESTS READY ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs shared_engines/consensus shared_engines/integrity shared_engines/encryption shared_engines/certification shared_engines/search shared_engines/reputation shared_engines/compression shared_engines/scalability shared_engines/supervisor shared_engines/workflow shared_engines/routing shared_engines/system_loader shared_engines/compliance shared_engines/integrations shared_engines/export shared_engines/interoperability shared_engines/ai"
          python -m compileall -q $M main.py scripts shared_engines/tests
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M shared_engines/tests tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W18 structural cleanup + capabilities - 26 orphan dirs removed, empty namespaces removed, runtime/capabilities.py composes 14 trust services over one DB; test 2 registers app before search; 3 end-to-end proofs"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W18 COMPLETE ==="
