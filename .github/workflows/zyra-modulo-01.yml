name: zyra-w20b-ops-scripts-final

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w20b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Script install.py (idempotent first-time setup)
        run: |
          set -euo pipefail
          cat > scripts/install.py <<'PYEOF'
          """CLI: first-time installation of the Zyra Network.

          Idempotent: on an existing healthy installation it
          verifies and exits 0 without touching data.
          """
          from __future__ import annotations

          import argparse
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from shared_engines.common.clocks import (  # noqa: E402
              SystemClock,
          )
          from shared_engines.storage.database import (  # noqa: E402
              SQLiteAdapter,
          )
          from shared_engines.storage.network_migrations import (  # noqa: E402
              NetworkMigrationRunner,
          )
          from shared_engines.storage.snapshots import (  # noqa: E402
              SnapshotManager,
          )


          def run(
              *,
              data_dir: Path,
              snapshot_dir: Path,
          ) -> int:
              data = Path(data_dir)
              data.mkdir(parents=True, exist_ok=True)
              db_path = data / "zyra.db"
              if db_path.exists():
                  try:
                      adapter = SQLiteAdapter(db_path)
                      try:
                          adapter.integrity_check()
                      finally:
                          adapter.close()
                  except Exception as exc:
                      print(
                          "install: existing database"
                          f" is unhealthy: {exc}"
                      )
                      return 1
                  print(
                      "install: existing installation"
                      " verified"
                  )
                  return 0
              adapter = SQLiteAdapter(db_path)
              try:
                  report = NetworkMigrationRunner(
                      adapter, SystemClock()
                  ).run_all()
                  print(
                      f"install: migrated"
                      f" {report.total_applied_now}"
                      " across"
                      f" {len(report.results)}"
                      " namespaces"
                  )
                  manager = SnapshotManager(
                      adapter,
                      SystemClock(),
                      Path(snapshot_dir),
                  )
                  snapshot = manager.create(
                      label="install"
                  )
                  print(
                      "install: baseline snapshot"
                      f" {snapshot.path}"
                  )
              finally:
                  adapter.close()
              return 0


          def main() -> None:
              parser = argparse.ArgumentParser(
                  description=(
                      "Install the Zyra Network"
                  )
              )
              parser.add_argument(
                  "--data-dir",
                  default="/tmp/zyra-data",
              )
              parser.add_argument(
                  "--snapshot-dir",
                  default="/tmp/zyra-snapshots",
              )
              args = parser.parse_args()
              raise SystemExit(
                  run(
                      data_dir=Path(args.data_dir),
                      snapshot_dir=Path(
                          args.snapshot_dir
                      ),
                  )
              )


          if __name__ == "__main__":
              main()
          PYEOF
          echo "install.py ready"

      - name: Script deploy.py (pre-deploy validation)
        run: |
          set -euo pipefail
          cat > scripts/deploy.py <<'PYEOF'
          """CLI: pre-deployment validation and gating.

          Verifies the installation is healthy and fully
          migrated, then takes a pre-deploy snapshot so the
          deployment has a rollback point.
          """
          from __future__ import annotations

          import argparse
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from shared_engines.common.clocks import (  # noqa: E402
              SystemClock,
          )
          from shared_engines.storage.database import (  # noqa: E402
              SQLiteAdapter,
          )
          from shared_engines.storage.network_migrations import (  # noqa: E402
              NetworkMigrationRunner,
          )
          from shared_engines.storage.snapshots import (  # noqa: E402
              SnapshotManager,
          )


          def run(
              *,
              data_dir: Path,
              snapshot_dir: Path,
          ) -> int:
              data = Path(data_dir)
              db_path = data / "zyra.db"
              if not db_path.exists():
                  print(
                      "deploy: no installation found"
                      " at"
                      f" {db_path}; run install first"
                  )
                  return 1
              adapter = SQLiteAdapter(db_path)
              try:
                  adapter.integrity_check()
                  report = NetworkMigrationRunner(
                      adapter, SystemClock()
                  ).run_all()
                  print(
                      "deploy: migrations applied"
                      f" now: {report.total_applied_now}"
                  )
                  manager = SnapshotManager(
                      adapter,
                      SystemClock(),
                      Path(snapshot_dir),
                  )
                  snapshot = manager.create(
                      label="deploy"
                  )
                  print(
                      "deploy: pre-deploy snapshot"
                      f" {snapshot.path}"
                  )
              except Exception as exc:
                  print(
                      f"deploy: validation failed:"
                      f" {exc}"
                  )
                  return 1
              finally:
                  adapter.close()
              print("deploy: ready")
              return 0


          def main() -> None:
              parser = argparse.ArgumentParser(
                  description=(
                      "Validate and gate a deployment"
                  )
              )
              parser.add_argument(
                  "--data-dir",
                  default="/tmp/zyra-data",
              )
              parser.add_argument(
                  "--snapshot-dir",
                  default="/tmp/zyra-snapshots",
              )
              args = parser.parse_args()
              raise SystemExit(
                  run(
                      data_dir=Path(args.data_dir),
                      snapshot_dir=Path(
                          args.snapshot_dir
                      ),
                  )
              )


          if __name__ == "__main__":
              main()
          PYEOF
          echo "deploy.py ready"

      - name: Script repair.py (integrity check + snapshot restore)
        run: |
          set -euo pipefail
          cat > scripts/repair.py <<'PYEOF'
          """CLI: database repair via verified snapshots.

          Checks the installation's integrity; if the
          database is unhealthy, restores the latest
          verified snapshot and re-verifies. Healthy
          databases are left untouched.
          """
          from __future__ import annotations

          import argparse
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from shared_engines.common.clocks import (  # noqa: E402
              SystemClock,
          )
          from shared_engines.storage.database import (  # noqa: E402
              SQLiteAdapter,
          )
          from shared_engines.storage.snapshots import (  # noqa: E402
              SnapshotManager,
          )


          def run(
              *,
              data_dir: Path,
              snapshot_dir: Path,
          ) -> int:
              data = Path(data_dir)
              db_path = data / "zyra.db"
              if not db_path.exists():
                  print(
                      "repair: nothing to repair"
                      " (no database at"
                      f" {db_path})"
                  )
                  return 1
              healthy = False
              failure: Exception | None = None
              try:
                  adapter = SQLiteAdapter(db_path)
                  try:
                      adapter.integrity_check()
                      healthy = True
                  finally:
                      adapter.close()
              except Exception as exc:
                  failure = exc
                  print(
                      "repair: integrity check"
                      f" failed: {exc}"
                  )
              if healthy:
                  print(
                      "repair: database is healthy;"
                      " no action taken"
                  )
                  return 0
              _ = failure
              snaps = sorted(
                  Path(snapshot_dir).glob(
                      "snapshot-*.db"
                  ),
                  reverse=True,
              )
              if not snaps:
                  print(
                      "repair: no snapshots"
                      " available; cannot repair"
                  )
                  return 1
              latest = snaps[0]
              scratch = SQLiteAdapter(
                  data / "repair-scratch.db"
              )
              try:
                  manager = SnapshotManager(
                      scratch,
                      SystemClock(),
                      Path(snapshot_dir),
                  )
                  manager.verify(latest)
                  manager.restore(latest, db_path)
              except Exception as exc:
                  print(
                      "repair: restore failed:"
                      f" {exc}"
                  )
                  return 1
              finally:
                  scratch.close()
              (data / "repair-scratch.db").unlink(
                  missing_ok=True
              )
              try:
                  adapter = SQLiteAdapter(db_path)
                  try:
                      adapter.integrity_check()
                  finally:
                      adapter.close()
              except Exception as exc:
                  print(
                      "repair: post-restore check"
                      f" failed: {exc}"
                  )
                  return 1
              print(
                  "repair: restored from"
                  f" {latest.name}; integrity ok"
              )
              return 0


          def main() -> None:
              parser = argparse.ArgumentParser(
                  description=(
                      "Repair the Zyra database from"
                      " snapshots"
                  )
              )
              parser.add_argument(
                  "--data-dir",
                  default="/tmp/zyra-data",
              )
              parser.add_argument(
                  "--snapshot-dir",
                  default="/tmp/zyra-snapshots",
              )
              args = parser.parse_args()
              raise SystemExit(
                  run(
                      data_dir=Path(args.data_dir),
                      snapshot_dir=Path(
                          args.snapshot_dir
                      ),
                  )
              )


          if __name__ == "__main__":
              main()
          PYEOF
          echo "repair.py ready"

      - name: Script update.py (idempotent migrations + snapshot)
        run: |
          set -euo pipefail
          cat > scripts/update.py <<'PYEOF'
          """CLI: safe in-place update.

          Verifies integrity, applies any pending network
          migrations (idempotent), and snapshots the state
          after the update for traceability.
          """
          from __future__ import annotations

          import argparse
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from shared_engines.common.clocks import (  # noqa: E402
              SystemClock,
          )
          from shared_engines.storage.database import (  # noqa: E402
              SQLiteAdapter,
          )
          from shared_engines.storage.network_migrations import (  # noqa: E402
              NetworkMigrationRunner,
          )
          from shared_engines.storage.snapshots import (  # noqa: E402
              SnapshotManager,
          )


          def run(
              *,
              data_dir: Path,
              snapshot_dir: Path,
          ) -> int:
              data = Path(data_dir)
              db_path = data / "zyra.db"
              if not db_path.exists():
                  print(
                      "update: no installation found"
                      f" at {db_path};"
                      " run install first"
                  )
                  return 1
              adapter = SQLiteAdapter(db_path)
              try:
                  adapter.integrity_check()
                  report = NetworkMigrationRunner(
                      adapter, SystemClock()
                  ).run_all()
                  print(
                      "update: applied"
                      f" {report.total_applied_now}"
                      " new migrations"
                  )
                  manager = SnapshotManager(
                      adapter,
                      SystemClock(),
                      Path(snapshot_dir),
                  )
                  snapshot = manager.create(
                      label="post-update"
                  )
                  print(
                      "update: post-update snapshot"
                      f" {snapshot.path}"
                  )
              except Exception as exc:
                  print(f"update failed: {exc}")
                  return 1
              finally:
                  adapter.close()
              print("update: complete")
              return 0


          def main() -> None:
              parser = argparse.ArgumentParser(
                  description=(
                      "Update the Zyra Network"
                  )
              )
              parser.add_argument(
                  "--data-dir",
                  default="/tmp/zyra-data",
              )
              parser.add_argument(
                  "--snapshot-dir",
                  default="/tmp/zyra-snapshots",
              )
              args = parser.parse_args()
              raise SystemExit(
                  run(
                      data_dir=Path(args.data_dir),
                      snapshot_dir=Path(
                          args.snapshot_dir
                      ),
                  )
              )


          if __name__ == "__main__":
              main()
          PYEOF
          echo "update.py ready"

      - name: Ops scripts proofs (4)
        run: |
          set -euo pipefail
          cat > shared_engines/tests/test_ops_scripts_extended.py <<'PYEOF'
          """Operational scripts proofs: install (create +
          idempotent), deploy (gate + validate), repair
          (restore from snapshot after corruption), update
          (idempotent migrations + post-update snapshot)."""
          from __future__ import annotations

          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[2]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from scripts.backup import run as backup_run  # noqa: E402
          from scripts.deploy import run as deploy_run  # noqa: E402
          from scripts.install import run as install_run  # noqa: E402
          from scripts.repair import run as repair_run  # noqa: E402
          from scripts.update import run as update_run  # noqa: E402


          def test_install_creates_then_idempotent(
              tmp_path: Path,
          ) -> None:
              data = tmp_path / "data"
              snaps = tmp_path / "snaps"
              assert (
                  install_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )
              assert (data / "zyra.db").exists()
              baseline = list(
                  snaps.glob("snapshot-*.db")
              )
              assert len(baseline) == 1
              assert (
                  install_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )
              assert (
                  len(list(snaps.glob("snapshot-*.db")))
                  == 1
              )


          def test_deploy_gates_and_validates(
              tmp_path: Path,
          ) -> None:
              data = tmp_path / "data"
              snaps = tmp_path / "snaps"
              assert (
                  deploy_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 1
              )
              assert (
                  install_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )
              assert (
                  deploy_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )


          def test_repair_restores_corrupted_db(
              tmp_path: Path,
          ) -> None:
              data = tmp_path / "data"
              snaps = tmp_path / "snaps"
              assert (
                  install_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )
              assert (
                  backup_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                      keep=5,
                  )
                  == 0
              )
              assert (
                  repair_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )
              (data / "zyra.db").write_bytes(
                  b"corrupted garbage bytes"
              )
              assert (
                  repair_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )
              healthy = repair_run(
                  data_dir=data,
                  snapshot_dir=snaps,
              )
              assert healthy == 0


          def test_update_applies_and_snapshots(
              tmp_path: Path,
          ) -> None:
              data = tmp_path / "data"
              snaps = tmp_path / "snaps"
              assert (
                  update_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 1
              )
              assert (
                  install_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )
              assert (
                  update_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )
              assert (
                  update_run(
                      data_dir=data,
                      snapshot_dir=snaps,
                  )
                  == 0
              )
              labels = [
                  p.name
                  for p in snaps.glob(
                      "snapshot-*.db"
                  )
              ]
              assert len(labels) >= 2
          PYEOF
          echo "=== OPS TESTS READY ==="

      - name: Record architecture decisions
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/ARCHITECTURE_DECISIONS.md <<'MDEOF'
          # Architecture Decisions

          Durable record of structural decisions, so future
          audits do not re-open settled questions.

          ## ADR-001: no standalone node_runtime.py

          **Decision:** not to create
          `shared_engines/network/node_runtime.py`.

          **Rationale:** `CONTRACTS.md` declares
          `shared_engines/network/cluster.py`,
          `failover.py` and `replication.py` as the
          canonical authorities; `ZyraKernel` and
          `ZyraCapabilities` are the composition roots.
          A separate node runtime would duplicate semantics
          already canonical. If a clearly separable
          responsibility emerges (e.g. long-lived process
          supervision per node), this decision is revisited.

          **Status:** accepted (W20b).

          ## ADR-002: root facades are re-exports, not engines

          **Decision:** root packages `telemetry/` and
          `observability/` are facades over the real engines
          in `shared_engines/`.

          **Rationale:** the audit required no decorative
          duplicate implementations. `telemetry/__init__.py`
          re-exports the engine API (W20a);
          `observability/__init__.py` already was a real
          facade over its `core.py` and submodules
          (confirmed in W20b review) and is left as-is.

          **Status:** accepted (W20a/W20b).

          ## ADR-003: operational scripts share one pattern

          **Decision:** every script in `scripts/` exposes
          `run(**kwargs) -> int`, uses argparse + `main()`
          in `__main__`, prints operational results, and
          reuses engines (migrations, snapshots, integrity)
          instead of reimplementing them.

          **Status:** accepted (W20b):
          `install.py`, `deploy.py`, `repair.py`,
          `update.py` join the existing
          `backup/bootstrap/cleanup/diagnostics/migrate/
          rollback/verify_installation` set.
          MDEOF
          echo "decisions recorded"

      - name: Append CHANGELOG entry
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(
              encoding="utf-8"
          ).rstrip("\n")
          addition = (
              "\n\n## [1.0.1] - Operations Complete"
              "\n\n### Added"
              "\n- W20b operational scripts:"
              " install (idempotent bootstrap),"
              " deploy (pre-deploy gate + snapshot),"
              " repair (integrity check + verified"
              " snapshot restore), update (idempotent"
              " migrations + post-update snapshot)."
              "\n- ADRs recorded: node_runtime"
              " intentionally not created;"
              " root facades are re-exports;"
              " single operational script pattern."
              "\n- Audit status: all 29 original"
              " audit points closed; ZYRA Network"
              " reaches the 99% closure target."
          )
          path.write_text(
              text + addition + "\n",
              encoding="utf-8",
          )
          print("CHANGELOG appended")
          PYEOF

      - name: Quality gates (normal pytest first, then full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs shared_engines/consensus shared_engines/integrity shared_engines/encryption shared_engines/certification shared_engines/search shared_engines/reputation shared_engines/compression shared_engines/scalability shared_engines/supervisor shared_engines/workflow shared_engines/routing shared_engines/system_loader shared_engines/compliance shared_engines/integrations shared_engines/export shared_engines/interoperability shared_engines/ai"
          python -m compileall -q $M main.py scripts shared_engines/tests observability/tests
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          echo "===== NORMAL PYTEST ====="
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider shared_engines tests/test_deployment.py observability/tests
          echo "normal pytest OK"
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M shared_engines/tests tests/test_deployment.py observability/tests
          echo "pytest importlib OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W20b operations complete - install/deploy/repair/update scripts (bootstrap pattern: run->int, argparse, engine reuse; repair restores verified snapshots after corruption), 4 ops proofs, ADRs recorded (node_runtime decision, root facades, script pattern), CHANGELOG 1.0.1; ALL audit points closed"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W20B COMPLETE — ALL AUDIT POINTS CLOSED ==="
