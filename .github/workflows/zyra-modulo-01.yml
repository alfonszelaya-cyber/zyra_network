cat > shared_engines/security/service_boundary.py <<'PY'
from __future__ import annotations

import hashlib
import hmac
import secrets
import time
from dataclasses import dataclass


@dataclass(frozen=True)
class ServiceCredential:
    service_id: str
    audience: str
    issued_at: int
    expires_at: int
    nonce: str
    signature: str


class ServiceBoundary:
    """
    Additive service-to-service authorization boundary.

    Credentials are:
      - short lived
      - audience bound
      - cryptographically signed
      - nonce protected

    This class does not modify the existing authentication system.
    """

    VERSION = "1"

    def __init__(self, service_id: str, secret: bytes):
        if not service_id or not service_id.strip():
            raise ValueError("service_id is required")

        if len(secret) < 32:
            raise ValueError("service secret must contain at least 32 bytes")

        self.service_id = service_id
        self._secret = bytes(secret)

    def issue(
        self,
        audience: str,
        ttl_seconds: int = 60,
        now: int | None = None,
    ) -> ServiceCredential:
        if not audience or not audience.strip():
            raise ValueError("audience is required")

        if not 1 <= ttl_seconds <= 300:
            raise ValueError("ttl_seconds must be between 1 and 300")

        issued_at = int(time.time()) if now is None else int(now)
        expires_at = issued_at + ttl_seconds
        nonce = secrets.token_urlsafe(32)

        signature = self._sign(
            self.service_id,
            audience,
            issued_at,
            expires_at,
            nonce,
        )

        return ServiceCredential(
            service_id=self.service_id,
            audience=audience,
            issued_at=issued_at,
            expires_at=expires_at,
            nonce=nonce,
            signature=signature,
        )

    def verify(
        self,
        credential: ServiceCredential,
        expected_audience: str,
        now: int | None = None,
    ) -> bool:
        if credential.service_id != self.service_id:
            return False

        if credential.audience != expected_audience:
            return False

        current = int(time.time()) if now is None else int(now)

        if credential.issued_at > current:
            return False

        if credential.expires_at < current:
            return False

        expected_signature = self._sign(
            credential.service_id,
            credential.audience,
            credential.issued_at,
            credential.expires_at,
            credential.nonce,
        )

        return hmac.compare_digest(
            credential.signature,
            expected_signature,
        )

    def _sign(
        self,
        service_id: str,
        audience: str,
        issued_at: int,
        expires_at: int,
        nonce: str,
    ) -> str:
        canonical = "|".join(
            (
                self.VERSION,
                service_id,
                audience,
                str(issued_at),
                str(expires_at),
                nonce,
            )
        ).encode("utf-8")

        return hmac.new(
            self._secret,
            canonical,
            hashlib.sha256,
        ).hexdigest()
PY

