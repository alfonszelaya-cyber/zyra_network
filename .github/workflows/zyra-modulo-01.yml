name: zyra-q3-nexo-vision-e2e

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-q3-nexo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9" "pytest-timeout>=2,<3"

      - name: Evidence (originals intact)
        run: |
          set -euo pipefail
          wc -c apps/nexo/server.py apps/nexo/infrastructure/persistence/nexo_store.py apps/nexo/services/nexo_link.py

      - name: NexoStore v2 (additive documents analyses duplicates)
        run: |
          set -euo pipefail
          cat > apps/nexo/infrastructure/persistence/nexo_store.py <<'PYEOF'
          """NexoCore durable ledger: hash-chained
          accounting between ZIDs (fiscal kinds only)
          + document analysis with provenance."""
          from __future__ import annotations

          import hashlib

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          KINDS = (
              "venta",
              "compra",
              "pago",
              "cobro",
              "ajuste",
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "nexo",
                  (
                      "CREATE TABLE nexo_companies ("
                      " company_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " synced INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE nexo_operations ("
                      " seq INTEGER PRIMARY KEY"
                      " AUTOINCREMENT,"
                      " operation_id TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " seller_zid TEXT NOT NULL,"
                      " buyer_zid TEXT NOT NULL,"
                      " amount REAL NOT NULL,"
                      " description TEXT NOT NULL,"
                      " invoice_id TEXT,"
                      " entry_hash TEXT NOT NULL,"
                      " prev_hash TEXT NOT NULL,"
                      " synced INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
              Migration(
                  2,
                  "nexo_vision",
                  (
                      "CREATE TABLE nexo_analyses ("
                      " analysis_id TEXT PRIMARY KEY,"
                      " content_sha256 TEXT NOT NULL,"
                      " model_id TEXT NOT NULL,"
                      " model_version TEXT NOT NULL,"
                      " verdict TEXT NOT NULL,"
                      " confidence REAL NOT NULL,"
                      " classification TEXT NOT NULL,"
                      " detail TEXT,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE nexo_documents ("
                      " document_id TEXT PRIMARY KEY,"
                      " content_sha256 TEXT NOT NULL,"
                      " title TEXT NOT NULL,"
                      " analysis_id TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " amount REAL NOT NULL,"
                      " seller_zid TEXT NOT NULL,"
                      " buyer_zid TEXT NOT NULL,"
                      " operation_id TEXT NOT NULL,"
                      " invoice_id TEXT,"
                      " synced INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE nexo_duplicates ("
                      " duplicate_id TEXT PRIMARY KEY,"
                      " content_sha256 TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          def _entry_hash(
              *,
              seq: int,
              kind: str,
              seller_zid: str,
              buyer_zid: str,
              amount: float,
              description: str,
              prev_hash: str,
              created_at: float,
          ) -> str:
              raw = (
                  str(seq)
                  + "|"
                  + kind
                  + "|"
                  + seller_zid
                  + "|"
                  + buyer_zid
                  + "|"
                  + str(amount)
                  + "|"
                  + description
                  + "|"
                  + str(created_at)
                  + "|"
                  + prev_hash
              )
              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()


          class NexoStore:
              """Hash-chained durable ledger."""

              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "nexo", _MIGRATIONS
                  ).run(clock)

              def add_company(
                  self,
                  *,
                  company_id: str,
                  zid: str | None,
                  name: str,
                  synced: bool,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO nexo_companies"
                          " (company_id, zid, name,"
                          "  synced, created_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              company_id,
                              zid,
                              name,
                              int(synced),
                              now,
                          ),
                      )
                  return self.get_company(company_id)

              def get_company(
                  self, company_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM nexo_companies"
                      " WHERE company_id = ?",
                      (company_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown company:"
                          f" {company_id}"
                      )
                  zid = row["zid"]
                  return {
                      "company_id": str(
                          row["company_id"]
                      ),
                      "zid": (
                          str(zid)
                          if zid is not None
                          else None
                      ),
                      "name": str(row["name"]),
                      "synced": bool(
                          int(row["synced"])
                      ),
                  }

              def record_operation(
                  self,
                  *,
                  operation_id: str,
                  kind: str,
                  seller_zid: str,
                  buyer_zid: str,
                  amount: float,
                  description: str,
                  invoice_id: str | None,
                  synced: bool,
              ) -> dict[str, object]:
                  if kind not in KINDS:
                      raise ValueError(
                          f"unknown kind: {kind}"
                      )
                  if amount <= 0:
                      raise ValueError(
                          "amount must be positive"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      last = cursor.execute(
                          "SELECT seq, entry_hash"
                          " FROM nexo_operations"
                          " ORDER BY seq DESC"
                          " LIMIT 1"
                      ).fetchone()
                      if last is None:
                          seq = 1
                          prev_hash = "GENESIS"
                      else:
                          seq = int(
                              last["seq"]
                          ) + 1
                          prev_hash = str(
                              last["entry_hash"]
                          )
                      entry_hash = _entry_hash(
                          seq=seq,
                          kind=kind,
                          seller_zid=seller_zid,
                          buyer_zid=buyer_zid,
                          amount=amount,
                          description=description,
                          prev_hash=prev_hash,
                          created_at=now,
                      )
                      cursor.execute(
                          "INSERT INTO nexo_operations"
                          " (operation_id, kind,"
                          "  seller_zid, buyer_zid,"
                          "  amount, description,"
                          "  invoice_id, entry_hash,"
                          "  prev_hash, synced,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?,"
                          "  ?, ?, ?, ?, ?, ?)",
                          (
                              operation_id,
                              kind,
                              seller_zid,
                              buyer_zid,
                              amount,
                              description,
                              invoice_id,
                              entry_hash,
                              prev_hash,
                              int(synced),
                              now,
                          ),
                      )
                  return {
                      "operation_id": (
                          operation_id
                      ),
                      "seq": seq,
                      "kind": kind,
                      "amount": amount,
                      "entry_hash": entry_hash,
                      "prev_hash": prev_hash,
                      "invoice_id": invoice_id,
                      "synced": synced,
                  }

              def verify_chain(self) -> bool:
                  rows = self._db.query_all(
                      "SELECT * FROM nexo_operations"
                      " ORDER BY seq"
                  )
                  prev = "GENESIS"
                  for r in rows:
                      expected = _entry_hash(
                          seq=int(r["seq"]),
                          kind=str(r["kind"]),
                          seller_zid=str(
                              r["seller_zid"]
                          ),
                          buyer_zid=str(
                              r["buyer_zid"]
                          ),
                          amount=float(
                              r["amount"]
                          ),
                          description=str(
                              r["description"]
                          ),
                          prev_hash=prev,
                          created_at=float(
                              r["created_at"]
                          ),
                      )
                      if (
                          str(r["entry_hash"])
                          != expected
                          or str(r["prev_hash"])
                          != prev
                      ):
                          return False
                      prev = str(
                          r["entry_hash"]
                      )
                  return True

              def list_operations(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM nexo_operations"
                      " ORDER BY seq"
                  )
                  return tuple(
                      {
                          "seq": int(r["seq"]),
                          "operation_id": str(
                              r["operation_id"]
                          ),
                          "kind": str(r["kind"]),
                          "seller_zid": str(
                              r["seller_zid"]
                          ),
                          "buyer_zid": str(
                              r["buyer_zid"]
                          ),
                          "amount": float(
                              r["amount"]
                          ),
                          "invoice_id": (
                              str(r["invoice_id"])
                              if r["invoice_id"]
                              is not None
                              else None
                          ),
                          "entry_hash": str(
                              r["entry_hash"]
                          ),
                      }
                      for r in rows
                  )

              def summary(self) -> dict[str, object]:
                  totals = self._db.query_all(
                      "SELECT kind, COUNT(*) AS n,"
                      " SUM(amount) AS total FROM"
                      " nexo_operations"
                      " GROUP BY kind"
                      " ORDER BY kind"
                  )
                  by_kind = {
                      str(r["kind"]): {
                          "count": int(r["n"]),
                          "total": float(
                              r["total"]
                          ),
                      }
                      for r in totals
                  }
                  row = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " nexo_operations"
                  )
                  return {
                      "operations_total": int(
                          row["n"]
                      )
                      if row is not None
                      else 0,
                      "by_kind": by_kind,
                      "chain_intact": (
                          self.verify_chain()
                      ),
                  }

              def save_analysis(
                  self,
                  *,
                  analysis_id: str,
                  content_sha256: str,
                  model_id: str,
                  model_version: str,
                  verdict: str,
                  confidence: float,
                  classification: str,
                  detail: str | None,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO nexo_analyses"
                          " (analysis_id,"
                          "  content_sha256, model_id,"
                          "  model_version, verdict,"
                          "  confidence, classification,"
                          "  detail, created_at)"
                          " VALUES (?, ?, ?, ?, ?,"
                          "  ?, ?, ?, ?)",
                          (
                              analysis_id,
                              content_sha256,
                              model_id,
                              model_version,
                              verdict,
                              float(confidence),
                              classification,
                              detail,
                              now,
                          ),
                      )
                  return {
                      "analysis_id": analysis_id,
                      "content_sha256": (
                          content_sha256
                      ),
                      "model_id": model_id,
                      "model_version": (
                          model_version
                      ),
                      "verdict": verdict,
                      "confidence": float(
                          confidence
                      ),
                      "classification": (
                          classification
                      ),
                  }

              def get_analysis(
                  self, analysis_id: str,
              ) -> dict[str, object] | None:
                  row = self._db.query_one(
                      "SELECT * FROM nexo_analyses"
                      " WHERE analysis_id = ?",
                      (analysis_id,),
                  )
                  if row is None:
                      return None
                  return {
                      "analysis_id": str(
                          row["analysis_id"]
                      ),
                      "content_sha256": str(
                          row["content_sha256"]
                      ),
                      "model_id": str(
                          row["model_id"]
                      ),
                      "model_version": str(
                          row["model_version"]
                      ),
                      "verdict": str(
                          row["verdict"]
                      ),
                      "confidence": float(
                          row["confidence"]
                      ),
                      "classification": str(
                          row["classification"]
                      ),
                  }

              def save_document(
                  self,
                  *,
                  document_id: str,
                  content_sha256: str,
                  title: str,
                  analysis_id: str,
                  kind: str,
                  amount: float,
                  seller_zid: str,
                  buyer_zid: str,
                  operation_id: str,
                  invoice_id: str | None,
                  synced: bool,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO nexo_documents"
                          " (document_id,"
                          "  content_sha256, title,"
                          "  analysis_id, kind, amount,"
                          "  seller_zid, buyer_zid,"
                          "  operation_id, invoice_id,"
                          "  synced, created_at)"
                          " VALUES (?, ?, ?, ?, ?,"
                          "  ?, ?, ?, ?, ?, ?, ?)",
                          (
                              document_id,
                              content_sha256,
                              title,
                              analysis_id,
                              kind,
                              float(amount),
                              seller_zid,
                              buyer_zid,
                              operation_id,
                              invoice_id,
                              int(synced),
                              now,
                          ),
                      )
                  return {
                      "document_id": document_id,
                      "content_sha256": (
                          content_sha256
                      ),
                      "analysis_id": analysis_id,
                      "kind": kind,
                      "amount": float(amount),
                      "operation_id": (
                          operation_id
                      ),
                      "invoice_id": invoice_id,
                      "synced": synced,
                  }

              def find_document_by_sha(
                  self, content_sha256: str,
              ) -> dict[str, object] | None:
                  row = self._db.query_one(
                      "SELECT * FROM nexo_documents"
                      " WHERE content_sha256 = ?",
                      (content_sha256,),
                  )
                  if row is None:
                      return None
                  return {
                      "document_id": str(
                          row["document_id"]
                      ),
                      "content_sha256": str(
                          row["content_sha256"]
                      ),
                      "operation_id": str(
                          row["operation_id"]
                      ),
                  }

              def get_document(
                  self, document_id: str,
              ) -> dict[str, object] | None:
                  row = self._db.query_one(
                      "SELECT * FROM nexo_documents"
                      " WHERE document_id = ?",
                      (document_id,),
                  )
                  if row is None:
                      return None
                  analysis = self.get_analysis(
                      str(row["analysis_id"])
                  )
                  op_row = self._db.query_one(
                      "SELECT seq, entry_hash FROM"
                      " nexo_operations WHERE"
                      " operation_id = ?",
                      (str(row["operation_id"]),),
                  )
                  return {
                      "document_id": str(
                          row["document_id"]
                      ),
                      "content_sha256": str(
                          row["content_sha256"]
                      ),
                      "title": str(row["title"]),
                      "kind": str(row["kind"]),
                      "amount": float(
                          row["amount"]
                      ),
                      "seller_zid": str(
                          row["seller_zid"]
                      ),
                      "buyer_zid": str(
                          row["buyer_zid"]
                      ),
                      "operation_id": str(
                          row["operation_id"]
                      ),
                      "operation_seq": (
                          int(op_row["seq"])
                          if op_row is not None
                          else None
                      ),
                      "operation_hash": (
                          str(op_row["entry_hash"])
                          if op_row is not None
                          else None
                      ),
                      "invoice_id": (
                          str(row["invoice_id"])
                          if row["invoice_id"]
                          is not None
                          else None
                      ),
                      "synced": bool(
                          int(row["synced"])
                      ),
                      "analysis": analysis,
                  }

              def list_documents(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT document_id FROM"
                      " nexo_documents"
                      " ORDER BY created_at"
                  )
                  return tuple(
                      self.get_document(
                          str(r["document_id"])
                      )
                      for r in rows
                  )

              def record_duplicate(
                  self, *, content_sha256: str,
              ) -> dict[str, object]:
                  import uuid

                  now = self._clock.now()
                  duplicate_id = (
                      "DUP-"
                      + uuid.uuid4().hex[:10]
                  )
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " nexo_duplicates ("
                          " duplicate_id,"
                          "  content_sha256,"
                          "  created_at)"
                          " VALUES (?, ?, ?)",
                          (
                              duplicate_id,
                              content_sha256,
                              now,
                          ),
                      )
                  return {
                      "duplicate_id": (
                          duplicate_id
                      ),
                      "content_sha256": (
                          content_sha256
                      ),
                  }

              def count_duplicates(self) -> int:
                  row = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " nexo_duplicates"
                  )
                  return (
                      int(row["n"])
                      if row is not None
                      else 0
                  )

              def review_summary(
                  self,
              ) -> dict[str, object]:
                  base = self.summary()
                  docs = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " nexo_documents"
                  )
                  anas = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " nexo_analyses"
                  )
                  return {
                      "chain_intact": base[
                          "chain_intact"
                      ],
                      "operations_total": base[
                          "operations_total"
                      ],
                      "by_kind": base["by_kind"],
                      "documents_total": (
                          int(docs["n"])
                          if docs is not None
                          else 0
                      ),
                      "analyses_total": (
                          int(anas["n"])
                          if anas is not None
                          else 0
                      ),
                      "duplicates_blocked": (
                          self.count_duplicates()
                      ),
                  }
          PYEOF
          python -m py_compile apps/nexo/infrastructure/persistence/nexo_store.py
          echo "store v2 written"

      - name: NexoLink v2 (trust + financial credential added, nothing duplicated)
        run: |
          set -euo pipefail
          cat > apps/nexo/services/nexo_link.py <<'PYEOF'
          """NexoLink: NEXO ops on the Network."""
          from __future__ import annotations

          import base64

          from apps.nexo.infrastructure.network.network_client import (
              NetworkClient,
          )


          class NexoLink:
              def __init__(
                  self, client: NetworkClient
              ) -> None:
                  self._client = client

              def register_app(self) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/apps/register",
                      {
                          "app_id": "nexo",
                          "display_name": "NEXO",
                          "scopes": [
                              "display_name",
                              "contact",
                          ],
                      },
                  )

              def register_company(
                  self, display_name: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": "organization",
                          "display_name": display_name,
                          "actor": "nexo",
                      },
                  )

              def register_person(
                  self, display_name: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": "person",
                          "display_name": display_name,
                          "actor": "nexo",
                      },
                  )

              def complete_trust(
                  self, zid: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/trust/complete",
                      {"zid": zid, "actor": "nexo"},
                  )

              def record_fiscal_event(
                  self,
                  zid: str,
                  event: str,
                  detail: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/history/append",
                      {
                          "zid": zid,
                          "entry_type": "other",
                          "actor_app": "nexo",
                          "payload": {
                              "event": event,
                              "detail": detail,
                          },
                      },
                  )

              def seal_invoice(
                  self,
                  *,
                  owner_zid: str,
                  invoice_id: str,
                  content: bytes,
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  encoded = base64.b64encode(
                      content
                  ).decode("ascii")
                  return self._client.post(
                      "/documents/seal",
                      {
                          "owner_zid": owner_zid,
                          "title": "Factura "
                          + invoice_id,
                          "content_b64": encoded,
                          "actor_app": "nexo",
                      },
                  )

              def issue_financial_credential(
                  self,
                  *,
                  subject_zid: str,
                  issuer_zid: str,
                  title: str,
                  detail: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/verification/credentials",
                      {
                          "subject_zid": subject_zid,
                          "issuer_zid": issuer_zid,
                          "credential_type":
                          "financial",
                          "title": title,
                          "detail": detail,
                      },
                  )
          PYEOF
          python -m py_compile apps/nexo/services/nexo_link.py
          echo "link v2 written"

      - name: Patch NEXO server (handlers receive the already-read body)
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python - <<'PYEOF'
          from pathlib import Path

          path = Path("apps/nexo/server.py")
          source = path.read_text(encoding="utf-8")

          def apply(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      "PATCH FAIL " + label
                      + " count=" + str(count)
                  )
              return text.replace(old, new, 1)

          API_GET_ROUTES = "\n".join([
              '        if s == ["review"]:',
              '            self._api_review()',
              '            return',
              '        if len(s) == 2 and s[0] == "documents":',
              '            self._api_document_detail(s[1])',
              '            return',
          ])

          API_POST_ROUTES = "\n".join([
              '        if s == ["documents"]:',
              '            self._documents_route(doc)',
              '            return',
              '        if s == ["review", "certify"]:',
              '            self._api_certify(doc)',
              '            return',
          ])

          HTML_GET_ROUTES = "\n".join([
              '        if s == ["revision"]:',
              '            self._screen_revision()',
              '            return',
              '        if s[0] == "documento" and len(s) > 1:',
              '            self._screen_documento(s[1])',
              '            return',
          ])

          METHODS = "\n".join([
              '    def _trust_best_effort(self, zid: str | None) -> bool:',
              '        if not zid:',
              '            return False',
              '        try:',
              '            ok, _d, _e = type(self).link.complete_trust(str(zid))',
              '            return bool(ok)',
              '        except Exception:',
              '            return False',
              '',
              '    @staticmethod',
              '    def _classify_content(text: str) -> tuple[str, float]:',
              '        lowered = text.lower()',
              '        if "factura de venta" in lowered or "venta" in lowered:',
              '            return "venta", 0.95',
              '        if "compra" in lowered:',
              '            return "compra", 0.95',
              '        if "pago" in lowered:',
              '            return "pago", 0.95',
              '        if "cobro" in lowered:',
              '            return "cobro", 0.95',
              '        if "ajuste" in lowered:',
              '            return "ajuste", 0.95',
