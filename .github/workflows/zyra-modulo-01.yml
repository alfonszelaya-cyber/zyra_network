name: zyra-fix-14-lint

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-fix-14-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Clean trailing blank lines in tests scaffolds + remove unused import
        run: |
          set -euo pipefail
          python3 - <<'PYCLEAN'
          from pathlib import Path

          # 1) Strip trailing blank lines from every tests scaffold __init__.py
          cleaned = 0
          for f in Path("tests").rglob("__init__.py"):
              text = f.read_text(encoding="utf-8")
              stripped = text.rstrip("\n") + "\n"
              if stripped != text:
                  f.write_text(stripped, encoding="utf-8")
                  cleaned += 1
          print(f"cleaned {cleaned} scaffold __init__.py files")

          # 2) Remove unused pytest import from test_deployment.py
          p = Path("tests/test_deployment.py")
          text = p.read_text(encoding="utf-8")
          if "import pytest" in text:
              lines = text.split("\n")
              lines = [
                  l for l in lines
                  if not (l.strip() == "import pytest")
              ]
              p.write_text("\n".join(lines), encoding="utf-8")
              print("removed unused pytest import from test_deployment.py")
          PYCLEAN

      - name: Quality gates (mypy first; full regression all modules)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority"
          python -m compileall -q $M main.py tests
          echo "compile OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +
          find tests -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py tests --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider $M tests
          echo "pytest OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +
          find tests -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: lint fixes (strip trailing blanks in scaffold __init__.py, remove unused pytest import)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== FIX COMPLETE ==="
