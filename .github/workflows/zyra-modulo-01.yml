name: zyra-fix-14-deployment-tests

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-fix-14-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules present
        run: |
          set -euo pipefail
          test -f main.py
          test -f tests/test_deployment.py
          test -f shared_engines/authority/root.py
          echo "targets present: OK"

      - name: Rewrite deployment tests (pass ZYRA_ROOT_KEY)
        run: |
          set -euo pipefail
          cat > tests/test_deployment.py <<'PYEOF'
          from __future__ import annotations

          import json
          import os
          import socket
          import subprocess
          import sys
          import time
          import urllib.request
          from pathlib import Path

          import pytest

          REPO_ROOT = Path(__file__).resolve().parents[1]
          TEST_MASTER_KEY = "aa" * 32


          def _free_port() -> int:
              with socket.socket() as s:
                  s.bind(("127.0.0.1", 0))
                  return int(s.getsockname()[1])


          def _boot(tmp_path: Path) -> tuple[
              subprocess.Popen[bytes], str
          ]:
              """Boots main.py with a temp master key and data dir.

              Returns (process, base_url) once /health is 200.
              """
              port = _free_port()
              env = dict(os.environ)
              env["ZYRA_PORT"] = str(port)
              env["ZYRA_DATA_DIR"] = str(tmp_path / "data")
              env["ZYRA_ROOT_KEY"] = TEST_MASTER_KEY
              env.pop("ZYRA_API_TOKEN", None)
              proc = subprocess.Popen(
                  [sys.executable, str(REPO_ROOT / "main.py")],
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              base = f"http://127.0.0.1:{port}"
              deadline = time.time() + 30.0
              while time.time() < deadline:
                  if proc.poll() is not None:
                      out = (
                          proc.stdout.read().decode("utf-8")
                          if proc.stdout
                          else ""
                      )
                      raise RuntimeError(f"server died early: {out}")
                  try:
                      with urllib.request.urlopen(
                          f"{base}/health", timeout=2
                      ) as resp:
                          if resp.status == 200:
                              return proc, base
                  except Exception:
                      time.sleep(0.3)
              proc.kill()
              raise RuntimeError("server never became healthy")


          def test_production_server_serves_health(
              tmp_path: Path,
          ) -> None:
              proc, base = _boot(tmp_path)
              try:
                  with urllib.request.urlopen(
                      f"{base}/health", timeout=5
                  ) as resp:
                      assert resp.status == 200
                  assert proc.poll() is None
              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      proc.kill()


          def test_health_shape_via_env_port(tmp_path: Path) -> None:
              proc, base = _boot(tmp_path)
              try:
                  with urllib.request.urlopen(
                      f"{base}/health", timeout=5
                  ) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
                  assert payload["ok"] is True
                  data = payload["data"]
                  components = {
                      c["component"] for c in data["components"]
                  }
                  assert {
                      "storage",
                      "identity",
                      "verification",
                      "tokenization",
                      "currency",
                  } <= components
                  assert data["overall"]["status"] == "healthy"
              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      proc.kill()


          def test_server_fails_closed_without_master_key(
              tmp_path: Path,
          ) -> None:
              """Without ZYRA_ROOT_KEY the server must REFUSE to boot:
              the fail-closed behavior is the security feature."""
              port = _free_port()
              env = dict(os.environ)
              env["ZYRA_PORT"] = str(port)
              env["ZYRA_DATA_DIR"] = str(tmp_path / "data")
              env.pop("ZYRA_ROOT_KEY", None)
              proc = subprocess.Popen(
                  [sys.executable, str(REPO_ROOT / "main.py")],
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              try:
                  out = (
                      proc.communicate(timeout=15)[0].decode("utf-8")
                      if proc.stdout
                      else ""
                  )
                  assert proc.returncode != 0
                  assert "ZYRA_ROOT_KEY is required" in out
              finally:
                  if proc.poll() is None:
                      proc.kill()


          def test_same_master_key_survives_restart(
              tmp_path: Path,
          ) -> None:
              """Two boots with the same master key and data dir keep
              the SAME authority fingerprint (persistence proof)."""
              import hashlib

              data_dir = tmp_path / "persistent"
              fingerprints: list[str] = []
              for _ in range(2):
                  port = _free_port()
                  env = dict(os.environ)
                  env["ZYRA_PORT"] = str(port)
                  env["ZYRA_DATA_DIR"] = str(data_dir)
                  env["ZYRA_ROOT_KEY"] = TEST_MASTER_KEY
                  proc = subprocess.Popen(
                      [sys.executable, str(REPO_ROOT / "main.py")],
                      env=env,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  base = f"http://127.0.0.1:{port}"
                  deadline = time.time() + 30.0
                  while time.time() < deadline:
                      if proc.poll() is not None:
                          break
                      try:
                          with urllib.request.urlopen(
                              f"{base}/health", timeout=2
                          ) as resp:
                              if resp.status == 200:
                                  break
                      except Exception:
                          time.sleep(0.3)
                  proc.terminate()
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                  key_file = data_dir / "root.key"
                  assert key_file.exists()
                  content = key_file.read_text(encoding="utf-8")
                  fingerprints.append(
                      hashlib.sha256(
                          content.encode("utf-8")
                      ).hexdigest()[:16]
                  )
              assert fingerprints[0] == fingerprints[1]
          PYEOF

          echo "=== DEPLOYMENT TESTS REWRITTEN ==="

      - name: Quality gates (mypy first; full regression all modules)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority"
          python -m compileall -q $M main.py
          echo "compile OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py tests --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider $M tests
          echo "pytest OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: fix deployment tests (pass ZYRA_ROOT_KEY, add fail-closed and persistence-across-restart proofs)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== FIX 14 COMPLETE ==="
