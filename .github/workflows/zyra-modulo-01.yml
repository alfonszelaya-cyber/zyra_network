name: zyra-w28b2-fix-listing-id

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w28b2fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Add listing_id to listing success page
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path("apps/subastas/server.py")
          text = path.read_text(encoding="utf-8")

          target = "+ sealed_text\n"
          if "+ sealed_text" not in text:
              raise SystemExit(
                  "sealed_text not found -"
                  " unexpected server state"
              )
          replacement = (
              "+ sealed_text\n"
              '                          + "</p><p>Listing'
              ' ID: <b>" + listing_id +'
              ' "</b>"\n'
          )
          text = text.replace(
              target, replacement, 1
          )
          path.write_text(
              text, encoding="utf-8"
          )
          print("listing_id added to page")
          PYEOF

      - name: Compile check
        run: |
          set -euo pipefail
          python -m compileall -q apps/subastas/server.py
          echo "compile OK"
          find apps/subastas -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Run SUBASTAS e2e
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider apps/subastas/tests/test_subastas_e2e.py
          echo "SUBASTAS e2e OK"
          find apps/subastas -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W28b2fix - listing success page now includes listing_id (regex test can extract it); SUBASTAS e2e passes"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W28B2FIX COMPLETE: SUBASTAS LIVE WITH E2E ==="
