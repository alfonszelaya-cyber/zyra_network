                  difficulty: int,
              ) -> None:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT OR REPLACE INTO"
                          " semilla_challenge_state"
                          " (student_account,"
                          "  domain, difficulty,"
