name: zyra-w1-diagnostico

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: zyra-w1-diagnostico-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "PASO 1 — Mapa del repo y las 17 carpetas"
        run: |
          echo "===== GIT LOG (ultimos 10 commits) ====="
          git log --oneline -10
          echo ""
          echo "===== WORKFLOWS ====="
          ls -1 .github/workflows/
          echo ""
          echo "===== CARPETAS EN shared_engines ====="
          ls -1 shared_engines/
          echo ""
          echo "===== shared_engines/network/ ====="
          ls -la shared_engines/network/
          echo ""
          echo "===== shared_engines/network/tests/ ====="
          ls -la shared_engines/network/tests/ 2>/dev/null || echo "NO EXISTE tests/"
          echo ""
          echo "===== ESTADO DE LAS 17 CARPETAS TRANSVERSALES ====="
          for e in ai certification compliance compression consensus encryption export integrations integrity interoperability reputation routing scalability search supervisor system_loader workflow; do
            count=$(find "shared_engines/$e" -type f -name "*.py" 2>/dev/null | wc -l)
            bytes=$(find "shared_engines/$e" -type f -name "*.py" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}')
            echo "shared_engines/$e: $count archivos .py, $bytes bytes"
          done

      - name: "PASO 2 — failover.py COMPLETO (para el fix)"
        run: |
          echo "===== shared_engines/network/failover.py ====="
          cat -n shared_engines/network/failover.py
          echo ""
          echo "===== shared_engines/network/errors.py ====="
          cat -n shared_engines/network/errors.py

      - name: "PASO 3 — outbox.py + inbox.py + collector.py COMPLETOS"
        run: |
          echo "===== shared_engines/events/outbox.py ====="
          cat -n shared_engines/events/outbox.py
          echo ""
          echo "===== shared_engines/events/inbox.py ====="
          cat -n shared_engines/events/inbox.py
          echo ""
          echo "===== shared_engines/telemetry/collector.py ====="
          cat -n shared_engines/telemetry/collector.py

      - name: "PASO 4 — database.py y snapshots.py COMPLETOS (los 2 FAIL)"
        run: |
          echo "===== shared_engines/storage/database.py ====="
          cat -n shared_engines/storage/database.py
          echo ""
          echo "===== shared_engines/storage/snapshots.py ====="
          cat -n shared_engines/storage/snapshots.py

      - name: "PASO 5 — Metodos publicos de cluster, identity y audit"
        run: |
          echo "===== cluster.py: clases y metodos ====="
          grep -n "^class \|^    def " shared_engines/network/cluster.py
          echo ""
          echo "===== identity/engine.py: clases y metodos ====="
          grep -n "^class \|^    def " shared_engines/identity/engine.py
          echo ""
          echo "===== audit/chain.py: clases y metodos ====="
          grep -n "^class \|^    def " shared_engines/audit/chain.py
          echo ""
          echo "===== runtime/api.py: clases y metodos ====="
          grep -n "^class \|^    def \|@app\|@router" shared_engines/runtime/api.py | head -40

      - name: "PASO 6 — Inventario de tests + conftest"
        run: |
          echo "===== TODOS LOS test_*.py ====="
          find . -path ./.git -prune -o -name 'test_*.py' -print | sort
          echo ""
          echo "TOTAL: $(find . -path ./.git -prune -o -name 'test_*.py' -print | wc -l)"
          echo ""
          echo "===== conftest.py ====="
          for f in $(find . -name 'conftest.py' -not -path './.git/*'); do
            echo "----- $f -----"
            cat "$f"
          done

      - name: "PASO 7 — PYTEST COMPLETO del repo"
        run: |
          set +e
          python -m pip install -q "cryptography>=42,<45" "pytest>=8,<9"
          TARGETS="shared_engines"
          [ -f tests/test_deployment.py ] && TARGETS="$TARGETS tests/test_deployment.py"
          [ -d observability/tests ] && TARGETS="$TARGETS observability/tests"
          echo "===== TARGETS: $TARGETS ====="
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $TARGETS 2>&1 | tail -35
          echo "===== FIN PYTEST ====="

      - name: "PASO 8 — MYPY ESTRICTO (lista de errores)"
        run: |
          set +e
          python -m pip install -q "mypy>=1.10,<2"
          mypy --strict shared_engines 2>&1 | grep -E "\.py:[0-9]+: error|Found" | head -30
          echo "===== FIN MYPY ====="

      - name: "PASO 9 — Estructura sucia: __init__py y carpetas decorativas"
        run: |
          echo "===== ARCHIVOS MAL NOMBRADOS __init__py ====="
          find . -path ./.git -prune -o -name '__init__py' -print | sort
          echo "TOTAL: $(find . -path ./.git -prune -o -name '__init__py' -print | wc -l)"
          echo ""
          echo "===== CARPETAS CON SOLO __init__.py (decorativas) ====="
          find . -path ./.git -prune -o -type d -print | while read -r d; do
            [ "$d" = "." ] && continue
            pyfiles=$(find "$d" -maxdepth 1 -type f -name "*.py" 2>/dev/null | wc -l)
            initfiles=$(find "$d" -maxdepth 1 -type f -name "__init__.py" 2>/dev/null | wc -l)
            if [ "$pyfiles" -gt 0 ] && [ "$pyfiles" -eq "$initfiles" ]; then
              echo "$d (solo init: $pyfiles)"
            fi
          done | head -60

      - name: "PASO 10 — requirements, scripts y docs"
        run: |
          echo "===== requirements.txt ====="
          if [ -f requirements.txt ]; then cat requirements.txt; else echo "FALTA"; fi
          echo ""
          echo "===== scripts/ (bytes por archivo) ====="
          for f in scripts/*.py; do [ -f "$f" ] && echo "$f: $(wc -c < "$f") bytes"; done
          echo ""
          echo "===== DOCS RAIZ ====="
          for f in README.md ARCHITECTURE.md CONTRACTS.md NAMESPACE_MANIFEST.md SECURITY_POLICY.md CHANGELOG.md; do
            [ -f "$f" ] && echo "$f: $(wc -l < "$f") lineas" || echo "$f: FALTA"
          done

      - name: "FIN — captura cada PASO y envialo"
        run: |
          echo "=============================================="
          echo " DIAGNOSTICO COMPLETO"
          echo " Prioridad de capturas: PASO 2, 3, 4 (codigo),"
          echo " PASO 7 (pytest) y PASO 8 (mypy)."
          echo "=============================================="
