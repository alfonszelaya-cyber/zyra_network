          from __future__ import annotations

          import base64
          import json
          import threading
          import urllib.error
          import urllib.request
          from collections.abc import Iterator

          import pytest

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.identity.contracts import IdentityKind, IdentityStatus
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.api import ZyraApiHandler
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.server import ZyraServer
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.credentials import CredentialType
          from shared_engines.verification.errors import TamperDetectedError
          from shared_engines.verification.signatures import Ed25519Signer


          class _Cluster:
              """Boots a real HTTP server over a live kernel."""

              def __init__(
                  self, tmp_path: object, token: str | None = None
              ) -> None:
                  self.db = SQLiteAdapter(f"{tmp_path}/runtime.db")
                  self.kernel = ZyraKernel(
                      db=self.db,
                      clock=FrozenClock(),
                      signer=Ed25519Signer.generate()[0],
                      config=RuntimeConfig(
                          host="127.0.0.1", port=0, api_token=token
                      ),
                  )
                  self.kernel.bootstrap_root()
                  ZyraApiHandler.kernel = self.kernel
                  self.server = ZyraServer(("127.0.0.1", 0))
                  self.thread = threading.Thread(
                      target=self.server.serve_forever, daemon=True
                  )
                  self.thread.start()
                  port = int(self.server.socket.getsockname()[1])
                  self.base = f"http://127.0.0.1:{port}"

              def stop(self) -> None:
                  self.server.shutdown()
                  self.server.server_close()
                  self.thread.join(timeout=5)
                  self.db.close()

              def call(
                  self,
                  method: str,
                  path: str,
                  body: dict | None = None,
                  token: str | None = None,
              ) -> tuple[int, dict]:
                  headers = {"Content-Type": "application/json"}
                  use_token = token
                  if use_token is None:
                      use_token = self.kernel.config.api_token
                  if use_token is not None:
                      headers["Authorization"] = f"Bearer {use_token}"
                  data = (
                      json.dumps(body).encode("utf-8")
                      if body is not None
                      else None
                  )
                  request = urllib.request.Request(
                      f"{self.base}{path}",
                      data=data,
                      headers=headers,
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=10) as resp:
                          payload = json.loads(resp.read().decode("utf-8"))
                          return int(resp.status), payload
                  except urllib.error.HTTPError as exc:
                      payload = json.loads(exc.read().decode("utf-8") or "{}")
                      return int(exc.code), payload


          @pytest.fixture
          def cluster(tmp_path) -> Iterator[_Cluster]:
              running = _Cluster(tmp_path)
              yield running
              running.stop()


