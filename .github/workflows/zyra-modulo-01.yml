          find apps/ciclo_digital -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: Q3 CICLO archaeology ADD-ONLY - migration 2 (arch cases + findings with formal certainty levels + reconstructions + valuations), certainty taxonomy (evidencia_encontrada/verificada/reconstruccion/inferencia/incertidumbre), archaeology case flow (create->findings->reconstruct->seal with network seal), valuation with condition-based reward and network tokens via /tokens/earn (no hardcoded 5), link ext new file (trust/seal/history), screen expediente; original store/link/client/tests untouched; probe + 3 focused e2e"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== Q3 CICLO COMPLETE ==="
