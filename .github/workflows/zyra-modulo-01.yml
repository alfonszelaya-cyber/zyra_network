name: zyra-w28b2v2-subastas-e2e

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w28b2v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Register live-auction vision (founder directive)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path

          path = Path("docs/PRODUCT_VISION.md")
          text = path.read_text(encoding="utf-8")
          addition = (

              "\n\n### SUBASTAS addition - live auctions"
              " (founder directive, W28b2v2)\n\n"
              "Real-time countdown auctions, faster and more"
              " visceral than eBay:\n"
              "- Seller controls the clock: starts from 0 or a"
              " base price, and can EXTEND the remaining time"
              " at will (e.g. 1 minute, 20 seconds, 3 seconds)"
              " to let last bids come in.\n"
              "- Whoever bids highest when the seller drops the"
              " hammer wins.\n"
              "- Every bid is timestamped by the Network"
              " (auditable, fake bids impossible).\n"
              "- The seller, not an algorithm, decides when"
              " the auction ends.\n\n"
              "Status: vision registered. Implementation"
              " (countdown field + extend endpoint + live bid"
              " feed) is the next SUBASTAS upgrade.\n"
          )
          if "live auctions (founder directive" not in text:
              path.write_text(
                  text + addition + "\n",
                  encoding="utf-8",
              )
              print("vision addition recorded")
          else:
              print("already recorded")
          PYEOF

      - name: Create SUBASTAS e2e test
        run: |
          set -euo pipefail
          mkdir -p apps/subastas/tests
          cat > apps/subastas/tests/test_subastas_e2e.py <<'PYEOF'
          """SUBASTAS e2e: seller registers over network
          (ZID issued), lists product (SEALED on the
          network), buyer bids, seller closes (winner
          picked), buyer gives REPUTATION WITH EVIDENCE to
          seller."""
          from __future__ import annotations

          import json
          import re
          import threading
          from pathlib import Path
          from urllib.request import (
              Request,
              urlopen,
          )

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities,
          )
          from shared_engines.runtime.combined_api import (
              serve_combined,
          )
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )

          from apps.subastas.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.subastas.infrastructure.persistence.subastas_store import (
              SubastasStore,
          )
          from apps.subastas.server import serve_subastas
          from apps.subastas.services.subastas_link import (
              SubastasLink,
          )


          class _Ecosystem:
              def __init__(self, tmp_path: Path) -> None:
                  self.net_db = SQLiteAdapter(
                      tmp_path / "network.db"
                  )
                  net_clock = FrozenClock()
                  signer, _ = Ed25519Signer.generate()
                  config = RuntimeConfig(
                      host="127.0.0.1",
                      port=0,
                      api_token=None,
                  )
                  self.kernel = ZyraKernel(
                      db=self.net_db,
                      clock=net_clock,
                      signer=signer,
                      config=config,
                  )
                  self.kernel.bootstrap_root()
                  self.caps = ZyraCapabilities(
                      self.net_db,
                      net_clock,
                      identity=self.kernel.identity,
                      signer=signer,
                  )
                  self.net_server = serve_combined(
                      self.kernel,
                      self.caps,
                      host="127.0.0.1",
                      port=0,
                  )
                  self.net_thread = threading.Thread(
                      target=(
                          self.net_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.net_thread.start()
                  self.net_base = (
                      "http://127.0.0.1:"
                      f"{self.net_server.server_address[1]}"
                  )
                  self.net_url = self.net_base

                  self.sbs_db = SQLiteAdapter(
                      tmp_path / "sbs.db"
                  )
                  sbs_clock = FrozenClock()
                  self.store = SubastasStore(
                      self.sbs_db, sbs_clock
                  )
                  self.client = NetworkClient(
                      self.net_url, max_retries=1
                  )
                  self.link = SubastasLink(
                      self.client
                  )
                  self.sbs_server = serve_subastas(
                      self.store, self.client
                  )
                  self.sbs_thread = threading.Thread(
                      target=(
                          self.sbs_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.sbs_thread.start()
                  self.sbs_base = (
                      "http://127.0.0.1:"
                      f"{self.sbs_server.bound_port}"
                  )

              def close(self) -> None:
                  self.sbs_server.shutdown()
                  self.sbs_server.server_close()
                  self.sbs_thread.join(timeout=5)
                  self.net_server.shutdown()
                  self.net_server.server_close()
                  self.net_thread.join(timeout=5)
                  self.sbs_db.close()
                  self.net_db.close()


          def _post_form(url: str, doc: dict) -> str:
              request = Request(
                  url,
                  data=(
                      "&".join(
                          str(k)
                          + "="
                          + str(v)
                          for k, v in doc.items()
                      )
                  ).encode("utf-8"),
                  method="POST",
              )
              with urlopen(request, timeout=10) as r:
                  return r.read().decode("utf-8")


          def test_marketplace_full_journey(
              tmp_path: Path,
          ) -> None:
              eco = _Ecosystem(tmp_path)
              try:
                  reg = eco.link.register_app()
                  assert reg[0] is True
                  seller_html = _post_form(
                      eco.sbs_base
                      + "/subastas/register",
                      {"name": "Vendedor Uno"},
                  )
                  seller_id = re.search(
                      r"SBS-[a-f0-9]{12}",
                      seller_html,
                  ).group(0)
                  seller_row = eco.store.get_account(
                      seller_id
                  )
                  seller_zid = seller_row.get("zid")
                  assert isinstance(seller_zid, str)
                  assert seller_zid.startswith("ZID-")
                  buyer_html = _post_form(
                      eco.sbs_base
                      + "/subastas/register",
                      {"name": "Comprador Uno"},
                  )
                  buyer_id = re.search(
                      r"SBS-[a-f0-9]{12}",
                      buyer_html,
                  ).group(0)
                  listing_html = _post_form(
                      eco.sbs_base
                      + "/subastas/listing",
                      {
                          "seller_account": (
                              seller_id
                          ),
                          "title": "Moto usada"
                          " 2019",
                          "description": "buena",
                          "base_price": 500,
                      },
                  )
                  assert "SELLADO" in listing_html
                  listing_id = re.search(
                      r"LST-[a-f0-9]{10}",
                      listing_html,
                  ).group(0)
                  listing_row = (
                      eco.store.get_listing(
                          listing_id
                      )
                  )
                  assert (
                      listing_row["document_id"]
                      is not None
                  )
                  bid_html = _post_form(
                      eco.sbs_base
                      + "/subastas/bid",
                      {
                          "listing_id": (
                              listing_id
                          ),
                          "bidder_account": (
                              buyer_id
                          ),
                          "amount": 650,
                      },
                  )
                  assert "Puja registrada" in (
                      bid_html
                  )
                  close_html = _post_form(
                      eco.sbs_base
                      + "/subastas/close",
                      {
                          "listing_id": (
                              listing_id
                          ),
                          "seller_account": (
                              seller_id
                          ),
                      },
                  )
                  assert "Ganador" in close_html
                  rep = eco.link.give_reputation(
                      subject_zid=seller_zid,
                      actor_zid="ZID-buyer",
                      kind="positive",
                      evidence=(
                          "compro y pago 650"
                      ),
                  )
                  assert rep[0] is True
                  with urlopen(
                      eco.sbs_base
                      + "/subastas/api/health",
                      timeout=10,
                  ) as response:
                      body = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )
                  assert body["ok"] is True
              finally:
                  eco.close()
          PYEOF
          echo "=== SUBASTAS E2E READY ==="

      - name: Run SUBASTAS e2e
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider apps/subastas/tests/test_subastas_e2e.py
          echo "SUBASTAS e2e OK"
          find apps/subastas -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W28b2v2 SUBASTAS e2e test created (journey: ZID, sealed listing, bids, close winner, reputation with evidence) + live-auction vision (seller controls clock, extendable countdown) recorded in PRODUCT_VISION; server listing_id fix also committed"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W28B2V2 COMPLETE: SUBASTAS LIVE WITH E2E ==="
