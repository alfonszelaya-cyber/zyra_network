name: zyra-fix-12-tests

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-fix-12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check verifier module present
        run: |
          set -euo pipefail
          test -f shared_engines/verifier/verifier.py
          echo "verifier present: OK"

      - name: Fix AttestationIssuer calls in both test files
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path

          old = """              issuer = AttestationIssuer(
                  db=db, clock=clock, signer=signer, audit=audit
              )"""
          new = """              issuer = AttestationIssuer(
                  db=db,
                  clock=clock,
                  signer=signer,
                  audit=audit,
                  outbox=outbox,
                  catalog=catalog,
              )"""

          files = [
              Path("shared_engines/verifier/tests/test_verifier.py"),
              Path("shared_engines/runtime/tests/test_public_verify_api.py"),
          ]
          for f in files:
              text = f.read_text(encoding="utf-8")
              if "outbox=outbox," in text and "issuer = AttestationIssuer" in text:
                  print(f"{f}: already fixed")
                  continue
              assert old in text, f"pattern not found in {f}"
              text = text.replace(old, new)
              f.write_text(text, encoding="utf-8")
              print(f"{f}: fixed")
          PYFIX

      - name: Quality gates (mypy first; full regression all modules)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier"
          python -m compileall -q $M main.py
          echo "compile OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider $M tests
          echo "pytest OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: fix verifier tests (pass outbox+catalog to AttestationIssuer)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== FIX COMPLETE ==="
