name: zyra-n1b-fix-server

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-n1b-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Patch broken multi-line f-strings in server.py
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re
          from pathlib import Path

          path = Path("apps/agro/server.py")
          text = path.read_text(encoding="utf-8")

          # Fix 1: f-string with raw newline inside the
          # expression ('pendiente
          #   de conexion}')
          fixed = re.sub(
              r"'pendiente\s*\n\s*de conexion\}'",
              "'pendiente de conexion}'",
              text,
          )
          if fixed != text:
              print(
                  "fixed: pendiente-de-conexion"
                  " f-string"
              )
          text = fixed

          # Fix 2 (defensive): bank-screen implicit
          # concatenation split across lines inside
          # braces -> joined into one literal.
          text = re.sub(
              r"f\{'✅ verificado \(elegible'"
              r"\s*\n\s*' para credito\}'"
              r"\s*\n\s*if p\['verified'\]"
              r"\s*\n\s*else '⚠️ sin verificar'\}",
              "f\"{('✅ verificado"
              " (elegible para credito)')"
              " if p['verified']"
              " else '⚠️ sin verificar'}\"",
              text,
          )
          path.write_text(text, encoding="utf-8")
          print("server.py patched")
          PYEOF

      - name: Compile check
        run: |
          set -euo pipefail
          python -m compileall -q apps/agro/server.py
          echo "server.py compiles OK"
          find apps/agro -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Run AGRO role tests
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider apps/agro/tests/test_agro_roles.py
          echo "AGRO role tests OK"
          find apps/agro -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: N1b fix - broken multi-line f-strings in server.py repaired (pendiente-de-conexion + bank-screen literal), compile verified, role tests rerun"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== N1B FIX COMPLETE ==="
