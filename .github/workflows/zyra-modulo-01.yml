name: zyra-modulo-03-events

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-03-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01+02 present
        run: |
          set -euo pipefail
          test -f shared_engines/common/errors.py
          test -f shared_engines/storage/database.py
          echo "modules 01+02 present: OK"

      - name: Build shared_engines/events
        run: |
          set -euo pipefail
          mkdir -p shared_engines/events/tests

          cat > shared_engines/events/__init__.py <<'PYEOF'
          """Versioned events, transactional outbox and consumer inbox."""
          from __future__ import annotations

          from shared_engines.events.contracts import Event, EventCatalog
          from shared_engines.events.inbox import Inbox
          from shared_engines.events.outbox import Outbox

          __all__ = ["Event", "EventCatalog", "Inbox", "Outbox"]
          PYEOF

          cat > shared_engines/events/contracts.py <<'PYEOF'
          """Versioned event contracts and the central catalog.

          Every event carries: event_id, event_type, aggregate_id,
          schema_version, envelope_version, timestamp, payload and a
          stable fingerprint. Evolving an event means registering a new
          schema_version, never mutating the old one.
          """
          from __future__ import annotations

          from collections.abc import Callable, Mapping
          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              ConfigurationError,
              UnsupportedVersionError,
              ValidationError,
          )
          from shared_engines.common.identifiers import new_id, stable_hash
          from shared_engines.common.serialization import canonical_json_dumps

          EVENT_ENVELOPE_VERSION = 1
          PayloadValidator = Callable[[Mapping[str, object]], None]


          @dataclass(frozen=True)
          class Event:
              event_id: str
              event_type: str
              aggregate_id: str
              schema_version: int
              envelope_version: int
              timestamp: float
              payload: Mapping[str, object]
              fingerprint: str


          def _default_validator(payload: Mapping[str, object]) -> None:
              if not isinstance(payload, dict):
                  raise ValidationError("event payload must be a mapping")


          class EventCatalog:
              """Central registry: type -> version -> validator.

              Registering the same type+version twice is an idempotent
              no-op so several engines can share one catalog.
              """

              def __init__(self) -> None:
                  self._schemas: dict[str, dict[int, PayloadValidator]] = {}

              def register(
                  self,
                  event_type: str,
                  *,
                  schema_version: int = 1,
                  validator: PayloadValidator | None = None,
              ) -> None:
                  if not event_type:
                      raise ConfigurationError("event_type must be non-empty")
                  if schema_version <= 0:
                      raise ConfigurationError("schema_version must be positive")
                  validators = self._schemas.setdefault(event_type, {})
                  if schema_version in validators:
                      return
                  validators[schema_version] = validator or _default_validator

              def build(
                  self,
                  event_type: str,
                  *,
                  aggregate_id: str,
                  payload: Mapping[str, object],
                  clock: Clock,
                  schema_version: int | None = None,
              ) -> Event:
                  versions = self._schemas.get(event_type)
                  if not versions:
                      raise ValidationError(
                          f"event type not registered: {event_type}"
                      )
                  version = (
                      schema_version if schema_version is not None else max(versions)
                  )
                  validator = versions.get(version)
                  if validator is None:
                      raise UnsupportedVersionError(
                          f"unsupported version {version} for {event_type}"
                      )
                  validator(payload)
                  fingerprint = stable_hash(
                      event_type,
                      aggregate_id,
                      str(version),
                      canonical_json_dumps(dict(payload)),
                  )
                  return Event(
                      event_id=new_id(),
                      event_type=event_type,
                      aggregate_id=aggregate_id,
                      schema_version=version,
                      envelope_version=EVENT_ENVELOPE_VERSION,
                      timestamp=clock.now(),
                      payload=dict(payload),
                      fingerprint=fingerprint,
                  )

              @property
              def registered_types(self) -> tuple[str, ...]:
                  return tuple(sorted(self._schemas))
          PYEOF

          cat > shared_engines/events/outbox.py <<'PYEOF'
          """Transactional outbox with at-least-once dispatch.

          ``enqueue_in_transaction`` runs inside the SAME transaction as
          the state change; delivery happens afterwards. A crash between
          handler and mark causes redelivery; consumers suppress
          duplicates via the Inbox.
          """
          from __future__ import annotations

          import sqlite3
          from collections.abc import Callable

          from shared_engines.common.clocks import Clock
          from shared_engines.common.serialization import (
              canonical_json_dumps,
              canonical_json_loads,
          )
          from shared_engines.events.contracts import Event
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import Migration, MigrationRunner

          MIGRATIONS = (
              Migration(
                  1,
                  "events_outbox",
                  (
                      "CREATE TABLE events_outbox ("
                      " event_id TEXT PRIMARY KEY,"
                      " event_type TEXT NOT NULL,"
                      " aggregate_id TEXT NOT NULL,"
                      " schema_version INTEGER NOT NULL,"
                      " envelope_version INTEGER NOT NULL,"
                      " created_at REAL NOT NULL,"
                      " payload TEXT NOT NULL,"
                      " fingerprint TEXT NOT NULL,"
                      " published_at REAL)",
                      "CREATE INDEX events_outbox_pending"
                      " ON events_outbox (published_at, created_at)",
                  ),
              ),
          )


          class Outbox:
              """Persists events atomically with the state producing them."""

              def __init__(self, db: Database, clock: Clock) -> None:
                  self._db = db
                  self._clock = clock

              def ensure_schema(self) -> None:
                  MigrationRunner(self._db, "events.outbox", MIGRATIONS).run(
                      self._clock
                  )

              def enqueue_in_transaction(
                  self, cursor: sqlite3.Cursor, event: Event
              ) -> None:
                  cursor.execute(
                      "INSERT INTO events_outbox"
                      " (event_id, event_type, aggregate_id, schema_version,"
                      "  envelope_version, created_at, payload, fingerprint,"
                      "  published_at)"
                      " VALUES (?, ?, ?, ?, ?, ?, ?, ?, NULL)",
                      (
                          event.event_id,
                          event.event_type,
                          event.aggregate_id,
                          event.schema_version,
                          event.envelope_version,
                          event.timestamp,
                          canonical_json_dumps(dict(event.payload)),
                          event.fingerprint,
                      ),
                  )

              def enqueue(self, event: Event) -> None:
                  with self._db.transaction() as cursor:
                      self.enqueue_in_transaction(cursor, event)

              def pending(self, limit: int = 100) -> tuple[Event, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM events_outbox WHERE published_at IS NULL"
                      " ORDER BY created_at, event_id LIMIT ?",
                      (limit,),
                  )
                  return tuple(self._to_event(row) for row in rows)

              def dispatch_pending(
                  self,
                  handler: Callable[[Event], None],
                  *,
                  batch_size: int = 100,
              ) -> int:
                  delivered = 0
                  for event in self.pending(batch_size):
                      handler(event)
                      self._db.execute(
                          "UPDATE events_outbox SET published_at = ?"
                          " WHERE event_id = ? AND published_at IS NULL",
                          (self._clock.now(), event.event_id),
                      )
                      delivered += 1
                  return delivered

              @staticmethod
              def _to_event(row: sqlite3.Row) -> Event:
                  return Event(
                      event_id=str(row["event_id"]),
                      event_type=str(row["event_type"]),
                      aggregate_id=str(row["aggregate_id"]),
                      schema_version=int(row["schema_version"]),
                      envelope_version=int(row["envelope_version"]),
                      timestamp=float(row["created_at"]),
                      payload=canonical_json_loads(str(row["payload"])),
                      fingerprint=str(row["fingerprint"]),
                  )
          PYEOF

          cat > shared_engines/events/inbox.py <<'PYEOF'
          """Consumer-side deduplication (inbox pattern).

          ``process`` records the event and runs the handler inside ONE
          transaction: the dedup record and the business effect commit
          atomically, so at-least-once delivery never becomes a
          duplicated effect.
          """
          from __future__ import annotations

          import sqlite3
          from collections.abc import Callable

          from shared_engines.common.clocks import Clock
          from shared_engines.events.contracts import Event
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import Migration, MigrationRunner

          MIGRATIONS = (
              Migration(
                  1,
                  "events_inbox",
                  (
                      "CREATE TABLE events_inbox ("
                      " event_id TEXT PRIMARY KEY,"
                      " event_type TEXT NOT NULL,"
                      " processed_at REAL NOT NULL)"
                  ),
              ),
          )


          class Inbox:
              """Deduplicates deliveries: record and effect commit together."""

              def __init__(self, db: Database, clock: Clock) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "events.inbox", MIGRATIONS).run(clock)

              def process(
                  self, event: Event, handler: Callable[[Event], None]
              ) -> bool:
                  """Applies handler once per event_id; False for duplicates."""
                  try:
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO events_inbox"
                              " (event_id, event_type, processed_at)"
                              " VALUES (?, ?, ?)",
                              (
                                  event.event_id,
                                  event.event_type,
                                  self._clock.now(),
                              ),
                          )
                          handler(event)
                  except sqlite3.IntegrityError:
                      return False
                  return True
          PYEOF

          cat > shared_engines/events/tests/test_events.py <<'PYEOF'
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.common.errors import ValidationError
          from shared_engines.events.contracts import Event, EventCatalog
          from shared_engines.events.inbox import Inbox
          from shared_engines.events.outbox import Outbox
          from shared_engines.storage.database import SQLiteAdapter


          class SimulatedCrash(Exception):
              """Local failure to prove redelivery semantics."""


          def _outbox(adapter: SQLiteAdapter) -> Outbox:
              outbox = Outbox(adapter, FrozenClock())
              outbox.ensure_schema()
              return outbox


          def _event(catalog: EventCatalog, clock: FrozenClock) -> Event:
              return catalog.build(
                  "test.ping", aggregate_id="agg-1", payload={"n": 1}, clock=clock
              )


          def test_outbox_dispatch_marks_published(tmp_path: Path) -> None:
              adapter = SQLiteAdapter(tmp_path / "events.db")
              catalog = EventCatalog()
              catalog.register("test.ping")
              outbox = _outbox(adapter)
              event = _event(catalog, FrozenClock())
              outbox.enqueue(event)
              assert len(outbox.pending()) == 1
              seen: list[str] = []

              def collect(seen_event: Event) -> None:
                  seen.append(seen_event.event_id)

              assert outbox.dispatch_pending(collect) == 1
              assert outbox.dispatch_pending(collect) == 0
              assert seen == [event.event_id]
              adapter.close()


          def test_outbox_redelivers_on_handler_failure(tmp_path: Path) -> None:
              adapter = SQLiteAdapter(tmp_path / "events.db")
              catalog = EventCatalog()
              catalog.register("test.ping")
              outbox = _outbox(adapter)
              outbox.enqueue(_event(catalog, FrozenClock()))

              def failing(received: Event) -> None:
                  raise SimulatedCrash("consumer crashed mid-dispatch")

              with pytest.raises(SimulatedCrash):
                  outbox.dispatch_pending(failing)
              assert len(outbox.pending()) == 1
              adapter.close()


          def test_inbox_deduplicates_deliveries(tmp_path: Path) -> None:
              adapter = SQLiteAdapter(tmp_path / "events.db")
              clock = FrozenClock()
              catalog = EventCatalog()
              catalog.register("test.ping")
              inbox = Inbox(adapter, clock)
              event = _event(catalog, clock)
              calls: list[int] = []

              def handle(received: Event) -> None:
                  calls.append(1)

              assert inbox.process(event, handle) is True
              assert inbox.process(event, handle) is False
              assert calls == [1]
              adapter.close()


          def test_inbox_rolls_back_record_and_effect(tmp_path: Path) -> None:
              adapter = SQLiteAdapter(tmp_path / "events.db")
              clock = FrozenClock()
              adapter.execute(
                  "CREATE TABLE effects (event_id TEXT NOT NULL,"
                  " applied_at REAL NOT NULL)"
              )
              inbox = Inbox(adapter, clock)
              catalog = EventCatalog()
              catalog.register("test.effect")
              event = catalog.build(
                  "test.effect", aggregate_id="agg", payload={}, clock=clock
              )

              def failing_effect(received: Event) -> None:
                  adapter.execute(
                      "INSERT INTO effects (event_id, applied_at) VALUES (?, ?)",
                      (received.event_id, clock.now()),
                  )
                  raise SimulatedCrash("effect crashed")

              with pytest.raises(SimulatedCrash):
                  inbox.process(event, failing_effect)
              row = adapter.query_one("SELECT COUNT(*) AS n FROM effects")
              assert row is not None
              assert int(row["n"]) == 0
              assert inbox.process(event, lambda e: None) is True
              adapter.close()


          def test_catalog_rejects_and_fingerprints_stable() -> None:
              catalog = EventCatalog()
              clock = FrozenClock()
              with pytest.raises(ValidationError):
                  _event(catalog, clock)
              catalog.register("test.ping")
              first = _event(catalog, clock)
              second = _event(catalog, clock)
              assert first.fingerprint == second.fingerprint
              assert first.event_id != second.event_id
              assert "test.ping" in catalog.registered_types


          def test_catalog_versions_are_selectable() -> None:
              catalog = EventCatalog()
              clock = FrozenClock()
              catalog.register("test.v")

              def v1_validator(payload: dict[str, object]) -> None:
                  if "v1_field" not in payload:
                      raise ValidationError("v1 requires v1_field")

              def v2_validator(payload: dict[str, object]) -> None:
                  if "v2_field" not in payload:
                      raise ValidationError("v2 requires v2_field")

              catalog.register("test.v", schema_version=2, validator=v2_validator)
              catalog.register("test.v", schema_version=1, validator=v1_validator)
              event_v2 = catalog.build(
                  "test.v",
                  aggregate_id="a",
                  payload={"v2_field": 1},
                  clock=clock,
              )
              assert event_v2.schema_version == 2
              event_v1 = catalog.build(
                  "test.v",
                  aggregate_id="a",
                  payload={"v1_field": 1},
                  clock=clock,
                  schema_version=1,
              )
              assert event_v1.schema_version == 1
          PYEOF

          echo "=== EVENTS BUILD OK ==="

      - name: Quality gates (common + storage + events)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events"
          python -m compileall -q $M
          echo "compile OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +
          flake8 $M --max-line-length=100
          echo "flake8 OK"
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider $M
          echo "pytest OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: module 03 events (catalog, outbox, inbox) + tests"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== MODULE 03 EVENTS COMPLETE ==="
