name: zyra-q3-semilla-tutor-e2e

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-q3-semilla-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9" "pytest-timeout>=2,<3"

      - name: Evidence (originals intact)
        run: |
          set -euo pipefail
          wc -c apps/semilla/server.py apps/semilla/infrastructure/persistence/semilla_store.py apps/semilla/services/tutor.py apps/semilla/services/semilla_link.py

      - name: Tutor v2 (adaptive challenges, talent detection, profile)
        run: |
          set -euo pipefail
          cat > apps/semilla/services/tutor.py <<'PYEOF'
          """IA-Tutor SEMILLA: the learning companion.

          Rules of the tutor (recorded in the ecosystem):
          - Stimulates thinking, never answers exams.
          - Emotion detection: positive moods get reward
            emojis; negative/critical moods raise alerts
            (professor, and via AXIS: family/hospital).
          - Scholarship engine: average >= 8.0 AND
            attendance >= 0.85 -> eligible.
          - Adaptive challenges: presents, measures and
            adapts difficulty; never reveals the answer
            before the student tries.
          - Talent detection: patterns across grades.
          """
          from __future__ import annotations

          STIMULUS = {
              "feliz": "🌟 ¡Excelente actitud, sigue asi!",
              "motivado": "🚀 ¡Vamos con todo!",
              "neutro": "📚 Un paso a la vez.",
              "triste": "💙 Estamos contigo. Tu profesor"
                        " te acompaña.",
              "enojado": "🧘 Respiremos juntos. Todo"
                         " va a estar bien.",
              "enfermo": "🏥 Aviso enviado a tu familia"
                         " y al profesor.",
          }

          CRITICAL_MOODS = ("enfermo",)
          ALERT_MOODS = ("triste", "enojado", "enfermo")

          TALENT_THRESHOLD = 9.0
          TALENT_MIN_GRADES = 3
          STRENGTH_THRESHOLD = 8.0
          WEAKNESS_THRESHOLD = 6.0

          MIN_DIFFICULTY = 1
          MAX_DIFFICULTY = 3

          CHALLENGE_BANK = {
              "matematicas": {
                  1: {
                      "question":
                      "¿Cuanto es 7 + 5?",
                      "options": [
                          "11", "12", "13",
                      ],
                      "answer": "12",
                  },
                  2: {
                      "question":
                      "¿Cuanto es 8 x 7?",
                      "options": [
                          "54", "56", "58",
                      ],
                      "answer": "56",
                  },
                  3: {
                      "question":
                      "¿Raiz cuadrada de 81?",
                      "options": [
                          "8", "9", "10",
                      ],
                      "answer": "9",
                  },
              },
              "logica": {
                  1: {
                      "question":
                      "Ana es mayor que Beto"
                      " y Beto es mayor que"
                      " Cara. ¿Quien es la"
                      " mayor?",
                      "options": [
                          "Ana", "Beto", "Cara",
                      ],
                      "answer": "Ana",
                  },
                  2: {
                      "question":
                      "Si todos los A son B y"
                      " todos los B son C,"
                      " entonces:",
                      "options": [
                          "Todos los A son C",
                          "Algunos C no son A",
                          "Ninguna de las"
                          " anteriores",
                      ],
                      "answer":
                      "Todos los A son C",
                  },
                  3: {
                      "question":
                      "Secuencia: 2, 4, 8, 16."
                      " ¿Siguiente?",
                      "options": [
                          "20", "24", "32",
                      ],
                      "answer": "32",
                  },
              },
              "lectura": {
                  1: {
                      "question":
                      "El sol es una...",
                      "options": [
                          "estrella",
                          "planta",
                          "roca",
                      ],
                      "answer": "estrella",
                  },
                  2: {
                      "question":
                      "Sinonimo de 'alegre':",
                      "options": [
                          "contento",
                          "triste",
                          "rapido",
                      ],
                      "answer": "contento",
                  },
                  3: {
                      "question":
                      "Lo contrario de"
                      " 'efimero' es:",
                      "options": [
                          "duradero",
                          "brillante",
                          "pequeno",
                      ],
                      "answer": "duradero",
                  },
              },
          }

          DOMAINS = tuple(
              CHALLENGE_BANK.keys()
          )


          class Tutor:
              """Rule-based tutor: stimulates,
              measures, adapts. Never answers
              exams for the student."""

              def stimulus(
                  self, *, mood: str,
              ) -> dict:
                  message = STIMULUS.get(
                      mood,
                      "📚 Un paso a la vez.",
                  )
                  alert = mood in ALERT_MOODS
                  critical = (
                      mood in CRITICAL_MOODS
                  )
                  return {
                      "mood": mood,
                      "message": message,
                      "alert": alert,
                      "critical": critical,
                      "notify": (
                          ["profesor"]
                          if alert
                          else []
                      )
                      + (
                          [
                              "familia",
                              "hospital",
                              "seguridad",
                          ]
                          if critical
                          else []
                      ),
                  }

              def scholarship_eligibility(
                  self,
                  *,
                  average: float | None,
                  attendance: float | None,
              ) -> dict:
                  if average is None or (
                      attendance is None
                  ):
                      return {
                          "eligible": False,
                          "reason": (
                              "faltan datos"
                              " (notas o"
                              " asistencia)"
                          ),
                      }
                  if (
                      average >= 8.0
                      and attendance >= 0.85
                  ):
                      return {
                          "eligible": True,
                          "reason": (
                              "promedio"
                              f" {average:.1f} y"
                              " asistencia"
                              f" {attendance:.0%}"
                          ),
                      }
                  return {
                      "eligible": False,
                      "reason": (
                          "promedio"
                          f" {average:.1f} /"
                          " asistencia"
                          f" {attendance:.0%}"
                          " (requiere 8.0 y 85%)"
                      ),
                  }

              def next_challenge(
                  self,
                  *,
                  domain: str,
                  difficulty: int,
              ) -> dict:
                  bank = CHALLENGE_BANK.get(
                      domain
                  ) or CHALLENGE_BANK[
                      "matematicas"
                  ]
                  level = (
                      int(difficulty)
                      if int(difficulty)
                      in bank
                      else MIN_DIFFICULTY
                  )
                  item = bank[level]
                  return {
                      "domain": domain,
                      "difficulty": level,
                      "question": item[
                          "question"
                      ],
                      "options": list(
                          item["options"]
                      ),
                  }

              def check_answer(
                  self,
                  *,
                  domain: str,
                  difficulty: int,
                  submitted: str,
              ) -> bool:
                  bank = CHALLENGE_BANK.get(
                      domain
                  ) or CHALLENGE_BANK[
                      "matematicas"
                  ]
                  item = bank.get(
                      int(difficulty)
                  )
                  if item is None:
                      return False
                  return (
                      str(submitted).strip()
                      == item["answer"]
                  )

              def adapt_difficulty(
                  self,
                  *,
                  difficulty: int,
                  correct: bool,
              ) -> int:
                  if correct:
                      return min(
                          MAX_DIFFICULTY,
                          int(difficulty) + 1,
                      )
                  return max(
                      MIN_DIFFICULTY,
                      int(difficulty) - 1,
                  )

              def detect_talents(
                  self, *, grades,
              ) -> list[str]:
                  by_subject: dict = {}
                  for g in grades:
                      by_subject.setdefault(
                          str(g["subject"]),
                          [],
                      ).append(
                          float(g["score"])
                      )
                  talents: list[str] = []
                  for subject, scores in (
                      by_subject.items()
                  ):
                      if len(
                          scores
                      ) >= TALENT_MIN_GRADES:
                          average = sum(
                              scores
                          ) / len(scores)
                          if (
                              average
                              >= TALENT_THRESHOLD
                          ):
                              talents.append(
                                  subject
                              )
                  return talents

              def student_profile(
                  self,
                  *,
                  grades,
                  attendance: float | None,
              ) -> dict:
                  by_subject: dict = {}
                  for g in grades:
                      by_subject.setdefault(
                          str(g["subject"]),
                          [],
                      ).append(
                          float(g["score"])
                      )
                  subjects = {}
                  for subject, scores in (
                      by_subject.items()
                  ):
                      subjects[subject] = (
                          round(
                              sum(scores)
                              / len(scores),
                              2,
                          )
                      )
                  strengths = [
                      s
                      for s, a in (
                          subjects.items()
                      )
                      if a
                      >= STRENGTH_THRESHOLD
                  ]
                  weaknesses = [
                      s
                      for s, a in (
                          subjects.items()
                      )
                      if a < WEAKNESS_THRESHOLD
                  ]
                  all_scores = [
                      float(g["score"])
                      for g in grades
                  ]
                  level = (
                      round(
                          sum(all_scores)
                          / len(all_scores),
                          2,
                      )
                      if all_scores
                      else None
                  )
                  return {
                      "level": level,
                      "strengths": (
                          strengths
                      ),
                      "weaknesses": (
                          weaknesses
                      ),
                      "subjects": subjects,
                      "attendance": (
                          attendance
                      ),
                      "progress": len(
                          grades
                      ),
                  }
          PYEOF
          python -m py_compile apps/semilla/services/tutor.py
          echo "tutor v2 written"

      - name: SemillaLink v2 (trust + education credential)
        run: |
          set -euo pipefail
          cat > apps/semilla/services/semilla_link.py <<'PYEOF'
          """SemillaLink: SEMILLA ops on the Network."""
          from __future__ import annotations

          from apps.semilla.infrastructure.network.network_client import (
              NetworkClient,
          )


          class SemillaLink:
              def __init__(
                  self, client: NetworkClient
              ) -> None:
                  self._client = client

              def register_app(self) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/apps/register",
                      {
                          "app_id": "semilla",
                          "display_name": (
                              "SEMILLA - Educacion"
                          ),
                          "scopes": [
                              "display_name",
                              "contact",
                          ],
                      },
                  )

              def register_person(
                  self,
                  display_name: str,
                  kind: str = "person",
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": kind,
                          "display_name": display_name,
                          "actor": "semilla",
                      },
                  )

              def complete_trust(
                  self, zid: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/trust/complete",
                      {
                          "zid": zid,
                          "actor": "semilla",
                      },
                  )

              def record_milestone(
                  self,
                  zid: str,
                  milestone: str,
                  detail: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/history/append",
                      {
                          "zid": zid,
                          "entry_type":
                          "education",
                          "actor_app": "semilla",
                          "payload": {
                              "milestone": (
                                  milestone
                              ),
                              "detail": detail,
                          },
                      },
                  )

              def give_star(
                  self,
                  subject_zid: str,
                  actor_zid: str,
                  reason: str,
              ) -> tuple[bool, dict | None, str | None]:
                  import base64

                  evidence = base64.b64encode(
                      reason.encode("utf-8")
                  ).decode("ascii")
                  return self._client.post(
                      "/reputation/record",
                      {
                          "subject_zid": (
                              subject_zid
                          ),
                          "actor_zid": actor_zid,
                          "kind": "positive",
                          "evidence_b64": (
                              evidence
                          ),
                      },
                  )

              def issue_education_credential(
                  self,
                  *,
                  subject_zid: str,
                  issuer_zid: str,
                  title: str,
                  detail: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/verification/credentials",
                      {
                          "subject_zid": (
                              subject_zid
                          ),
                          "issuer_zid": issuer_zid,
                          "credential_type":
                          "education",
                          "title": title,
                          "detail": detail,
                      },
                  )
          PYEOF
          python -m py_compile apps/semilla/services/semilla_link.py
          echo "link v2 written"

      - name: SemillaStore v2 (additive tutor migration)
        run: |
          set -euo pipefail
          cat > apps/semilla/infrastructure/persistence/semilla_store.py <<'PYEOF'
          """SEMILLA durable store (v2: + tutor tables)."""
          from __future__ import annotations

          import uuid

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          ROLES = (
              "alumno",
              "profesor",
              "institucion",
          )

          GRADE_LEVELS = (
              "prekinder",
              "kinder",
              "primaria",
              "secundaria",
              "universidad",
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "semilla",
                  (
                      "CREATE TABLE semilla_accounts ("
                      " account_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " role TEXT NOT NULL,"
                      " school TEXT,"
                      " grade TEXT,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE semilla_grades ("
                      " grade_id TEXT PRIMARY KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " subject TEXT NOT NULL,"
                      " score REAL NOT NULL,"
                      " teacher_account TEXT NOT"
                      " NULL,"
                      " recorded_at REAL NOT NULL)",
                      "CREATE TABLE semilla_attendance"
                      " ("
                      " att_id TEXT PRIMARY KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " present INTEGER NOT NULL,"
                      " recorded_at REAL NOT NULL)",
                      "CREATE TABLE semilla_welfare ("
                      " welfare_id TEXT PRIMARY KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " mood TEXT NOT NULL,"
                      " alert INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " recorded_at REAL NOT NULL)",
                      "CREATE TABLE"
                      " semilla_scholarships ("
                      " scholarship_id TEXT PRIMARY"
                      " KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " reason TEXT NOT NULL,"
                      " granted_at REAL NOT NULL)",
                  ),
              ),
              Migration(
                  2,
                  "semilla_tutor",
                  (
                      "CREATE TABLE"
                      " semilla_challenge_state ("
                      " student_account TEXT PRIMARY"
                      " KEY,"
                      " domain TEXT NOT NULL,"
                      " difficulty INTEGER NOT NULL,"
                      " updated_at REAL NOT NULL)",
                      "CREATE TABLE"
                      " semilla_attempts ("
                      " attempt_id TEXT PRIMARY KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " domain TEXT NOT NULL,"
                      " difficulty INTEGER NOT NULL,"
                      " correct INTEGER NOT NULL,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE semilla_talents ("
                      " talent_id TEXT PRIMARY KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " domain TEXT NOT NULL,"
                      " evidence TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE semilla_rewards ("
                      " reward_id TEXT PRIMARY KEY,"
                      " student_account TEXT NOT"
                      " NULL,"
                      " kind TEXT NOT NULL,"
                      " detail TEXT,"
                      " points INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE semilla_messages"
                      " ("
                      " message_id TEXT PRIMARY KEY,"
                      " recipient TEXT NOT NULL,"
                      " student_account TEXT,"
                      " text TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class SemillaStore:
              """Durable state for SEMILLA."""

              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db,
                      "semilla",
                      _MIGRATIONS,
                  ).run(clock)

              def add_account(
                  self,
                  *,
                  account_id: str,
                  zid: str | None,
                  name: str,
                  role: str,
                  school: str | None,
                  grade: str | None,
              ) -> dict[str, object]:
                  if role not in ROLES:
                      raise ValueError(
                          f"unknown role: {role}"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " semilla_accounts"
                          " (account_id, zid, name,"
                          "  role, school, grade,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?)",
                          (
                              account_id,
                              zid,
                              name,
                              role,
                              school,
                              grade,
                              now,
                          ),
                      )
                  return self.get_account(account_id)

              def get_account(
                  self, account_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " semilla_accounts"
                      " WHERE account_id = ?",
                      (account_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown account:"
                          f" {account_id}"
                      )
                  return self._account_row(row)

              def set_zid(
                  self,
                  *,
                  account_id: str,
                  zid: str,
              ) -> None:
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE"
                          " semilla_accounts SET"
                          " zid = ?"
                          " WHERE account_id = ?",
                          (zid, account_id),
                      )

              def update_grade(
                  self,
                  *,
                  account_id: str,
                  new_grade: str,
              ) -> None:
                  if new_grade not in GRADE_LEVELS:
                      raise ValueError(
                          "unknown grade:"
                          f" {new_grade}"
                      )
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE"
                          " semilla_accounts SET"
                          " grade = ?"
                          " WHERE account_id = ?",
                          (new_grade, account_id),
                      )

              def list_by_role(
                  self,
                  *,
                  role: str,
                  school: str | None = None,
              ) -> tuple[dict[str, object], ...]:
                  if school is not None:
                      rows = self._db.query_all(
                          "SELECT * FROM"
                          " semilla_accounts WHERE"
                          " role = ? AND school = ?"
                          " ORDER BY created_at",
                          (role, school),
                      )
                  else:
                      rows = self._db.query_all(
                          "SELECT * FROM"
                          " semilla_accounts WHERE"
                          " role = ?"
                          " ORDER BY created_at",
                          (role,),
                      )
                  return tuple(
                      self._account_row(r)
                      for r in rows
                  )

              def add_grade(
                  self,
                  *,
                  grade_id: str,
                  student_account: str,
                  subject: str,
                  score: float,
                  teacher_account: str,
              ) -> dict[str, object]:
                  if not 0.0 <= score <= 10.0:
                      raise ValueError(
                          "score must be 0..10"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO semilla_grades"
                          " (grade_id,"
                          "  student_account, subject,"
                          "  score, teacher_account,"
                          "  recorded_at)"
                          " VALUES (?, ?, ?, ?, ?, ?)",
                          (
                              grade_id,
                              student_account,
                              subject,
                              score,
                              teacher_account,
                              now,
                          ),
                      )
                  return {
                      "grade_id": grade_id,
                      "student": student_account,
                      "subject": subject,
                      "score": score,
                  }

              def grades_of(
                  self,
                  *,
                  student_account: str,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM semilla_grades"
                      " WHERE student_account = ?"
                      " ORDER BY recorded_at",
                      (student_account,),
                  )
                  return tuple(
                      {
                          "subject": str(
                              r["subject"]
                          ),
                          "score": float(
                              r["score"]
                          ),
                      }
                      for r in rows
                  )

              def average_of(
                  self,
                  *,
                  student_account: str,
              ) -> float | None:
                  rows = self.grades_of(
                      student_account=(
                          student_account
                      )
                  )
                  if not rows:
                      return None
                  return sum(
                      float(r["score"])
                      for r in rows
                  ) / len(rows)

              def attendance_rate(
                  self,
                  *,
                  student_account: str,
              ) -> float | None:
                  rows = self._db.query_all(
                      "SELECT present FROM"
                      " semilla_attendance WHERE"
                      " student_account = ?",
                      (student_account,),
                  )
                  if not rows:
                      return None
                  present = sum(
                      int(r["present"])
                      for r in rows
                  )
                  return present / len(rows)

              def add_attendance(
                  self,
                  *,
                  att_id: str,
                  student_account: str,
                  present: bool,
              ) -> None:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " semilla_attendance"
                          " (att_id,"
                          "  student_account, present,"
                          "  recorded_at)"
                          " VALUES (?, ?, ?, ?)",
                          (
                              att_id,
                              student_account,
                              int(present),
                              now,
                          ),
                      )

              def add_welfare(
                  self,
                  *,
                  welfare_id: str,
                  student_account: str,
                  mood: str,
              ) -> dict[str, object]:
                  alert = mood in (
                      "triste",
                      "enojado",
                      "enfermo",
                  )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO semilla_welfare"
                          " (welfare_id,"
                          "  student_account, mood,"
                          "  alert, recorded_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              welfare_id,
                              student_account,
                              mood,
                              int(alert),
                              now,
                          ),
                      )
                  return {
                      "welfare_id": welfare_id,
                      "mood": mood,
                      "alert": alert,
                  }

              def welfare_alerts(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM semilla_welfare"
                      " WHERE alert = 1"
                      " ORDER BY recorded_at DESC"
                  )
                  return tuple(
                      {
                          "student": str(
                              r["student_account"]
                          ),
                          "mood": str(r["mood"]),
                      }
                      for r in rows
                  )

              def grant_scholarship(
                  self,
                  *,
                  scholarship_id: str,
                  student_account: str,
                  reason: str,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " semilla_scholarships"
                          " (scholarship_id,"
                          "  student_account, reason,"
                          "  granted_at)"
                          " VALUES (?, ?, ?, ?)",
                          (
                              scholarship_id,
                              student_account,
                              reason,
                              now,
                          ),
                      )
                  return {
                      "scholarship_id": (
                          scholarship_id
                      ),
                      "student": student_account,
                      "reason": reason,
                  }

              def has_scholarship(
