name: zyra-modulo-16-network

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01-15 present
        run: |
          set -euo pipefail
          test -f shared_engines/authority/root.py
          test -f shared_engines/storage/network_migrations.py
          echo "modules 01-15 present: OK"

      - name: Build distributed network core
        run: |
          set -euo pipefail
          mkdir -p shared_engines/network/tests

          cat > shared_engines/network/__init__.py <<'PYEOF'
          """Zyra distributed network core."""
          from __future__ import annotations

          from shared_engines.network.cluster import (
              ClusterManager,
              NodeRole,
              NodeState,
              NodeStatus,
          )
          from shared_engines.network.errors import (
              InvalidTransitionError,
              NetworkError,
              NoQuorumError,
              NodeNotFoundError,
              ReplicationMismatchError,
          )
          from shared_engines.network.failover import FailoverCoordinator
          from shared_engines.network.replication import (
              ReplicationManager,
              ReplicationReport,
          )

          __all__ = [
              "ClusterManager", "FailoverCoordinator",
              "InvalidTransitionError", "NetworkError", "NoQuorumError",
              "NodeNotFoundError", "NodeRole", "NodeState", "NodeStatus",
              "ReplicationManager", "ReplicationMismatchError",
              "ReplicationReport",
          ]
          PYEOF

          cat > shared_engines/network/errors.py <<'PYEOF'
          """Typed network errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              ConcurrencyError,
              EngineError,
              NotFoundError,
              ValidationError,
          )


          class NetworkError(EngineError):
              """Base for network layer failures."""


          class NodeNotFoundError(NetworkError, NotFoundError):
              """The node is not part of the cluster."""


          class NoQuorumError(NetworkError, ConcurrencyError):
              """No majority active: failover refused (no split-brain)."""


          class InvalidTransitionError(NetworkError, ValidationError):
              """The node state transition is not allowed."""


          class ReplicationMismatchError(NetworkError, ValidationError):
              """Replica state hash differs from primary."""
          PYEOF

          cat > shared_engines/network/cluster.py <<'PYEOF'
          """Cluster membership: nodes, heartbeats, TTL failure detection.

          Lifecycle: JOINING -> (first heartbeat) -> ACTIVE -> SUSPECT
          -> DOWN -> REJOINED -> ACTIVE. A heartbeat reactivates
          JOINING, SUSPECT and REJOINED nodes. Cluster events are
          emitted to the outbox transactionally and audited.
          """
          from __future__ import annotations

          import sqlite3
          from dataclasses import dataclass
          from enum import Enum

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.common.validation import (
              require_non_empty_str,
              require_positive_number,
          )
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.network.errors import (
              InvalidTransitionError,
              NodeNotFoundError,
          )
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          EVENT_NODE_JOINED = "network.node.joined"
          EVENT_NODE_STATE_CHANGED = "network.node.state_changed"

          CLUSTER_MIGRATIONS = (
              Migration(
                  1,
                  "cluster_nodes",
                  (
                      "CREATE TABLE cluster_nodes ("
                      " node_id TEXT PRIMARY KEY,"
                      " role TEXT NOT NULL,"
                      " state TEXT NOT NULL,"
                      " endpoint TEXT NOT NULL,"
                      " joined_at REAL NOT NULL,"
                      " last_heartbeat REAL NOT NULL,"
                      " contract_version INTEGER NOT NULL)",
                      "CREATE INDEX cluster_nodes_state"
                      " ON cluster_nodes (state)",
                  ),
              ),
          )


          class NodeRole(Enum):
              COORDINATOR = "coordinator"
              WORKER = "worker"
              REPLICA = "replica"


          class NodeState(Enum):
              JOINING = "JOINING"
              ACTIVE = "ACTIVE"
              SUSPECT = "SUSPECT"
              DOWN = "DOWN"
              REJOINED = "REJOINED"


          VALID_NODE_TRANSITIONS: dict[
              NodeState, frozenset[NodeState]
          ] = {
              NodeState.JOINING: frozenset(
                  {NodeState.ACTIVE, NodeState.DOWN}
              ),
              NodeState.ACTIVE: frozenset(
                  {NodeState.SUSPECT, NodeState.DOWN}
              ),
              NodeState.SUSPECT: frozenset(
                  {NodeState.DOWN, NodeState.REJOINED}
              ),
              NodeState.DOWN: frozenset({NodeState.REJOINED}),
              NodeState.REJOINED: frozenset(
                  {NodeState.ACTIVE, NodeState.SUSPECT, NodeState.DOWN}
              ),
          }


          @dataclass(frozen=True)
          class NodeStatus:
              node_id: str
              role: NodeRole
              state: NodeState
              endpoint: str
              joined_at: float
              last_heartbeat: float


          class ClusterManager:
              """Membership authority: register, heartbeat, detect."""

              def __init__(
                  self,
                  *,
                  db: Database,
                  clock: Clock,
                  audit: AuditTrail,
                  outbox: Outbox,
                  catalog: EventCatalog,
                  heartbeat_ttl_seconds: float = 30.0,
              ) -> None:
                  require_positive_number(
                      heartbeat_ttl_seconds,
                      "heartbeat_ttl_seconds",
                      config=True,
                  )
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  self._outbox = outbox
                  self._catalog = catalog
                  self._ttl = heartbeat_ttl_seconds
                  for event_type in (
                      EVENT_NODE_JOINED,
                      EVENT_NODE_STATE_CHANGED,
                  ):
                      self._catalog.register(event_type)
                  MigrationRunner(
                      db, "network.cluster", CLUSTER_MIGRATIONS
                  ).run(clock)

              def register_node(
                  self,
                  *,
                  node_id: str,
                  role: NodeRole,
                  endpoint: str,
              ) -> NodeStatus:
                  require_non_empty_str(node_id, "node_id")
                  require_non_empty_str(endpoint, "endpoint")
                  now = self._clock.now()
                  try:
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO cluster_nodes"
                              " (node_id, role, state, endpoint,"
                              "  joined_at, last_heartbeat,"
                              "  contract_version)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?)",
                              (
                                  node_id,
                                  role.value,
                                  NodeState.JOINING.value,
                                  endpoint,
                                  now,
                                  now,
                                  1,
                              ),
                          )
                          event = self._catalog.build(
                              EVENT_NODE_JOINED,
                              aggregate_id=node_id,
                              payload={
                                  "role": role.value,
                                  "endpoint": endpoint,
                              },
                              clock=self._clock,
                          )
                          self._outbox.enqueue_in_transaction(
                              cursor, event
                          )
                  except sqlite3.IntegrityError as exc:
                      raise InvalidTransitionError(
                          f"node already registered: {node_id}"
                      ) from exc
                  self._audit.append(
                      event_type=EVENT_NODE_JOINED,
                      actor=node_id,
                      subject=node_id,
                      payload={"role": role.value, "endpoint": endpoint},
                  )
                  node = self.get(node_id)
                  if node is None:
                      raise IntegrityError("node vanished after insert")
                  return node

              def heartbeat(self, node_id: str) -> None:
                  """Refreshes liveness; reactivates JOINING, SUSPECT
                  and REJOINED nodes to ACTIVE."""
                  require_non_empty_str(node_id, "node_id")
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE cluster_nodes"
                          " SET last_heartbeat = ?,"
                          " state = CASE WHEN state IN"
                          "  ('JOINING', 'SUSPECT', 'REJOINED')"
                          "  THEN 'ACTIVE' ELSE state END"
                          " WHERE node_id = ?",
                          (now, node_id),
                      )
                      if cursor.rowcount != 1:
                          raise NodeNotFoundError(
                              f"unknown node: {node_id}"
                          )

              def get(self, node_id: str) -> NodeStatus | None:
                  row = self._db.query_one(
                      "SELECT * FROM cluster_nodes WHERE node_id = ?",
                      (node_id,),
                  )
                  if row is None:
                      return None
                  return self._node_from_row(row)

              def require(self, node_id: str) -> NodeStatus:
                  node = self.get(node_id)
                  if node is None:
                      raise NodeNotFoundError(
                          f"unknown node: {node_id}"
                      )
                  return node

              def detect_failures(self) -> tuple[str, ...]:
                  """ACTIVE->SUSPECT after TTL, SUSPECT->DOWN after 2x."""
                  now = self._clock.now()
                  changed: list[str] = []
                  rows = self._db.query_all(
                      "SELECT node_id, state, last_heartbeat"
                      " FROM cluster_nodes WHERE state IN"
                      " ('ACTIVE', 'SUSPECT')"
                  )
                  for row in rows:
                      node_id = str(row["node_id"])
                      state = NodeState(str(row["state"]))
                      last = float(row["last_heartbeat"])
                      age = now - last
                      if state is NodeState.ACTIVE and age > self._ttl:
                          self._transition(node_id, NodeState.SUSPECT)
                          changed.append(node_id)
                      elif (
                          state is NodeState.SUSPECT
                          and age > 2 * self._ttl
                      ):
                          self._transition(node_id, NodeState.DOWN)
                          changed.append(node_id)
                  return tuple(changed)

              def _transition(
                  self, node_id: str, to_state: NodeState
              ) -> None:
                  with self._db.transaction() as cursor:
                      row = cursor.execute(
                          "SELECT state FROM cluster_nodes"
                          " WHERE node_id = ?",
                          (node_id,),
                      ).fetchone()
                      if row is None:
                          raise NodeNotFoundError(
                              f"unknown node: {node_id}"
                          )
                      current = NodeState(str(row["state"]))
                      allowed = VALID_NODE_TRANSITIONS.get(
                          current, frozenset()
                      )
                      if to_state not in allowed:
                          raise InvalidTransitionError(
                              f"{current.value} -> {to_state.value}"
                          )
                      cursor.execute(
                          "UPDATE cluster_nodes SET state = ?"
                          " WHERE node_id = ?",
                          (to_state.value, node_id),
                      )
                      event = self._catalog.build(
                          EVENT_NODE_STATE_CHANGED,
                          aggregate_id=node_id,
                          payload={"to": to_state.value},
                          clock=self._clock,
                      )
                      self._outbox.enqueue_in_transaction(cursor, event)
                  self._audit.append(
                      event_type=EVENT_NODE_STATE_CHANGED,
                      actor="cluster-manager",
                      subject=node_id,
                      payload={"to": to_state.value},
                  )

              def active_nodes(self) -> tuple[NodeStatus, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM cluster_nodes"
                      " WHERE state IN ('ACTIVE', 'REJOINED')"
                      " ORDER BY node_id"
                  )
                  return tuple(self._node_from_row(r) for r in rows)

              def all_nodes(self) -> tuple[NodeStatus, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM cluster_nodes ORDER BY node_id"
                  )
                  return tuple(self._node_from_row(r) for r in rows)

              @staticmethod
              def _node_from_row(row: sqlite3.Row) -> NodeStatus:
                  return NodeStatus(
                      node_id=str(row["node_id"]),
                      role=NodeRole(str(row["role"])),
                      state=NodeState(str(row["state"])),
                      endpoint=str(row["endpoint"]),
                      joined_at=float(row["joined_at"]),
                      last_heartbeat=float(row["last_heartbeat"]),
                  )
          PYEOF

          cat > shared_engines/network/replication.py <<'PYEOF'
          """Hash-verified state replication between nodes."""
          from __future__ import annotations

          import json
          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.identifiers import stable_hash
          from shared_engines.common.validation import require_non_empty_str
          from shared_engines.network.errors import ReplicationMismatchError
          from shared_engines.storage.database import Database

          REPLICATED_TABLES = (
              "identities",
              "cluster_nodes",
          )


          @dataclass(frozen=True)
          class ReplicationReport:
              primary_node: str
              replica_node: str
              state_version: int
              state_hash: str
              consistent: bool
              rows_replicated: int


          class ReplicationManager:
              """Computes state hashes and verifies replica parity."""

              def __init__(self, db: Database, clock: Clock) -> None:
                  self._db = db
                  self._clock = clock

              def compute_state_hash(self) -> tuple[int, str]:
                  """Deterministic hash of the replicated state."""
                  parts: list[str] = []
                  for table in REPLICATED_TABLES:
                      rows = self._db.query_all(
                          f"SELECT * FROM {table} ORDER BY rowid"
                      )
                      for row in rows:
                          parts.append(
                              json.dumps(
                                  {
                                      k: str(v)
                                      for k, v in dict(row).items()
                                  },
                                  sort_keys=True,
                              )
                          )
                  version = int(self._clock.now())
                  return version, stable_hash(*parts)

              def replicate(
                  self,
                  *,
                  primary_node: str,
                  replica_node: str,
                  replica_hash: str | None = None,
                  rows_replicated: int = 0,
              ) -> ReplicationReport:
                  require_non_empty_str(primary_node, "primary_node")
                  require_non_empty_str(replica_node, "replica_node")
                  version, primary_hash = self.compute_state_hash()
                  if replica_hash is None:
                      replica_hash = primary_hash
                  consistent = replica_hash == primary_hash
                  if not consistent:
                      raise ReplicationMismatchError(
                          f"replica {replica_node} hash"
                          f" {replica_hash[:16]}"
                          f" != primary {primary_hash[:16]}"
                      )
                  return ReplicationReport(
                      primary_node=primary_node,
                      replica_node=replica_node,
                      state_version=version,
                      state_hash=primary_hash,
                      consistent=True,
                      rows_replicated=rows_replicated,
                  )
          PYEOF

          cat > shared_engines/network/failover.py <<'PYEOF'
          """Quorum-gated failover: no split-brain, ever."""
          from __future__ import annotations

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.validation import require_non_empty_str
          from shared_engines.network.cluster import (
              ClusterManager,
              NodeRole,
          )
          from shared_engines.network.errors import NoQuorumError

          EVENT_FAILOVER = "network.failover.elected"


          class FailoverCoordinator:
              """Elects a new primary under quorum, audited."""

              def __init__(
                  self,
                  *,
                  cluster: ClusterManager,
                  audit: AuditTrail,
              ) -> None:
                  self._cluster = cluster
                  self._audit = audit

              def elect_new_primary(
                  self, *, failed_primary: str
              ) -> str:
                  require_non_empty_str(failed_primary, "failed_primary")
                  registered = self._cluster.all_nodes()
                  if len(registered) == 0:
                      raise NoQuorumError("cluster is empty")
                  active = self._cluster.active_nodes()
                  majority = len(registered) // 2 + 1
                  if len(active) < majority:
                      raise NoQuorumError(
                          f"{len(active)}/{len(registered)} active:"
                          f" majority ({majority}) not reached -"
                          " failover refused to avoid split-brain"
                      )
                  candidates = [
                      n
                      for n in active
                      if n.node_id != failed_primary
                      and n.role
                      in (NodeRole.COORDINATOR, NodeRole.WORKER)
                  ]
                  if not candidates:
                      raise NoQuorumError(
                          "no eligible candidate node available"
                      )
                  candidates.sort(key=lambda n: n.node_id)
                  elected = candidates[0]
                  self._audit.append(
                      event_type=EVENT_FAILOVER,
                      actor="failover-coordinator",
                      subject=elected.node_id,
                      payload={
                          "failed_primary": failed_primary,
                          "active": len(active),
                          "registered": len(registered),
                      },
                  )
                  return elected.node_id

              def has_quorum(self) -> bool:
                  registered = self._cluster.all_nodes()
                  if not registered:
                      return False
                  active = self._cluster.active_nodes()
                  return len(active) >= len(registered) // 2 + 1
          PYEOF

          cat > shared_engines/network/tests/test_network.py <<'PYEOF'
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.identity.contracts import IdentityKind
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.network.cluster import (
              ClusterManager,
              NodeRole,
              NodeState,
          )
          from shared_engines.network.errors import (
              InvalidTransitionError,
              NoQuorumError,
              NodeNotFoundError,
              ReplicationMismatchError,
          )
          from shared_engines.network.failover import FailoverCoordinator
          from shared_engines.network.replication import ReplicationManager
          from shared_engines.storage.database import SQLiteAdapter


          class _Harness:
              def __init__(self, tmp_path: Path, nodes: int = 3) -> None:
                  self.db = SQLiteAdapter(tmp_path / "net.db")
                  self.clock = FrozenClock()
                  self.audit = AuditTrail(self.db, self.clock)
                  from shared_engines.events.contracts import EventCatalog
                  from shared_engines.events.outbox import Outbox

                  self.outbox = Outbox(self.db, self.clock)
                  self.outbox.ensure_schema()
                  self.catalog = EventCatalog()
                  for event_type in (
                      "network.node.joined",
                      "network.node.state_changed",
                      "network.failover.elected",
                      "identity.registered",
                      "identity.status_changed",
                  ):
                      self.catalog.register(event_type)
                  self.identity = IdentityEngine(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                  )
                  self.cluster = ClusterManager(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                      heartbeat_ttl_seconds=30.0,
                  )
                  self.replication = ReplicationManager(
                      self.db, self.clock
                  )
                  self.failover = FailoverCoordinator(
                      cluster=self.cluster, audit=self.audit
                  )
                  self.node_ids: list[str] = []
                  for index in range(nodes):
                      node_identity = self.identity.register_identity(
                          kind=IdentityKind.DEVICE,
                          display_name=f"node-{index}",
                          actor="bootstrap",
                      )
                      role = (
                          NodeRole.COORDINATOR
                          if index == 0
                          else NodeRole.WORKER
                      )
                      self.cluster.register_node(
                          node_id=node_identity.zid,
                          role=role,
                          endpoint=f"tcp://node-{index}:9000",
                      )
                      self.node_ids.append(node_identity.zid)

              def activate_all(self) -> None:
                  for node_id in self.node_ids:
                      self.cluster.heartbeat(node_id)

              def kill_node(self, node_id: str) -> None:
                  """Advances time so ONLY node_id goes stale: the other
                  nodes keep heartbeating and stay ACTIVE."""
                  others = [
                      n for n in self.node_ids if n != node_id
                  ]
                  self.clock.advance(31)
                  for other in others:
                      self.cluster.heartbeat(other)
                  harness_detect = self.cluster.detect_failures()
                  assert node_id in harness_detect
                  self.clock.advance(31)
                  for other in others:
                      self.cluster.heartbeat(other)
                  harness_detect = self.cluster.detect_failures()
                  assert node_id in harness_detect

              def kill_all(self) -> None:
                  self.clock.advance(31)
                  self.cluster.detect_failures()
                  self.clock.advance(31)
                  self.cluster.detect_failures()

              def close(self) -> None:
                  self.db.close()


          def test_nodes_register_and_heartbeat_activates(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              nodes = harness.cluster.all_nodes()
              assert len(nodes) == 3
              assert all(n.state is NodeState.JOINING for n in nodes)
              harness.activate_all()
              active = harness.cluster.active_nodes()
              assert len(active) == 3
              assert all(
                  n.state is NodeState.ACTIVE for n in active
              )
              harness.close()


          def test_heartbeat_failure_detection_ladder(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              harness.activate_all()
              node = harness.cluster.active_nodes()[0]
              harness.clock.advance(31)
              expired = harness.cluster.detect_failures()
              assert node.node_id in expired
              suspect = harness.cluster.require(node.node_id)
              assert suspect.state is NodeState.SUSPECT
              harness.clock.advance(31)
              harness.cluster.detect_failures()
              down = harness.cluster.require(node.node_id)
              assert down.state is NodeState.DOWN
              harness.close()


          def test_unknown_node_heartbeat_raises(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              with pytest.raises(NodeNotFoundError):
                  harness.cluster.heartbeat("ZID-ghost")
              harness.close()


          def test_failover_with_quorum_elects_new_primary(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              harness.activate_all()
              coordinator_id = harness.node_ids[0]
              harness.kill_node(coordinator_id)
              new_primary = harness.failover.elect_new_primary(
                  failed_primary=coordinator_id
              )
              assert new_primary != coordinator_id
              assert new_primary in harness.node_ids[1:]
              assert harness.failover.has_quorum() is True
              assert harness.audit.verify() >= 1
              harness.close()


          def test_failover_without_quorum_refused(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path, nodes=3)
              harness.activate_all()
              coordinator_id = harness.node_ids[0]
              harness.kill_all()
              with pytest.raises(NoQuorumError):
                  harness.failover.elect_new_primary(
                      failed_primary=coordinator_id
                  )
              assert harness.failover.has_quorum() is False
              harness.close()


          def test_rejoined_node_recovers_active(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path, nodes=3)
              harness.activate_all()
              victim = harness.node_ids[2]
              harness.kill_node(victim)
              assert harness.cluster.require(victim).state is (
                  NodeState.DOWN
              )
              harness.cluster.heartbeat(victim)
              recovered = harness.cluster.require(victim)
              assert recovered.state is NodeState.ACTIVE
              harness.close()


          def test_replication_consistent_and_mismatch(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              harness.activate_all()
              version, state_hash = harness.replication.compute_state_hash()
              report = harness.replication.replicate(
                  primary_node="node-primary",
                  replica_node="node-replica",
                  replica_hash=state_hash,
              )
              assert report.consistent is True
              assert report.state_hash == state_hash
              with pytest.raises(ReplicationMismatchError):
                  harness.replication.replicate(
                      primary_node="node-primary",
                      replica_node="node-replica",
                      replica_hash="0" * 64,
                  )
              harness.close()


          def test_state_hash_changes_when_membership_changes(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              harness.activate_all()
              _, hash_before = harness.replication.compute_state_hash()
              new_identity = harness.identity.register_identity(
                  kind=IdentityKind.DEVICE,
                  display_name="node-extra",
                  actor="bootstrap",
              )
              harness.cluster.register_node(
                  node_id=new_identity.zid,
                  role=NodeRole.WORKER,
                  endpoint="tcp://node-extra:9000",
              )
              _, hash_after = harness.replication.compute_state_hash()
              assert hash_after != hash_before
              harness.close()


          def test_cluster_events_in_outbox(tmp_path: Path) -> None:
              from shared_engines.events.contracts import Event

              harness = _Harness(tmp_path)
              collected: list[Event] = []

              def collect(event: Event) -> None:
                  collected.append(event)

              harness.outbox.dispatch_pending(collect)
              by_type = {e.event_type for e in collected}
              assert "network.node.joined" in by_type
              joined = [
                  e
                  for e in collected
                  if e.event_type == "network.node.joined"
              ]
              assert len(joined) == 3
              harness.close()


          def test_audit_chain_covers_cluster_events(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              harness.activate_all()
              count = harness.audit.verify()
              assert count >= 6
              harness.close()


          def test_duplicate_node_registration_rejected(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path, nodes=1)
              node = harness.cluster.all_nodes()[0]
              with pytest.raises(InvalidTransitionError):
                  harness.cluster.register_node(
                      node_id=node.node_id,
                      role=NodeRole.WORKER,
                      endpoint="tcp://dupe:9000",
                  )
              harness.close()
          PYEOF

