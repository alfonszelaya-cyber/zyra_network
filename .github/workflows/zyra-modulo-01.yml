                  assert paid["status"] == "paid"
                  settled = _pj(
                      eco.sbs_base
                      + "/subastas/api/orders/"
                      + order["order_id"]
                      + "/settle",
                      {},
                  )["data"]
                  assert settled["settlement"]["net_amount"] == 114.0
                  final_order = _gj(
                      eco.sbs_base
                      + "/subastas/api/orders/"
                      + order["order_id"]
                  )["data"]
                  assert final_order["status"] == "settled"
                  assert final_order["payments"][0]["status"] == "captured"
                  assert final_order["settlement"] is not None
              finally:
                  eco.close()


