      - name: Write ciclo e2e tests (new file - old tests untouched)
        run: |
          set -euo pipefail
          cat > apps/ciclo_digital/tests/test_ciclo_archaeology_e2e.py <<'PYEOF'
          """CICLO archaeology e2e ADD-ONLY - case creation,
          findings with formal certainty levels, reconstruction,
          case sealing, valuation with network tokens; original
          tests untouched."""
          from __future__ import annotations

          import json
          import re
          import socket
          import threading
          from pathlib import Path
          from urllib.request import Request, urlopen

          socket.setdefaulttimeout(20)

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import Ed25519Signer

          from apps.ciclo_digital.infrastructure.network.network_client import NetworkClient
          from apps.ciclo_digital.infrastructure.persistence.ciclo_store import CicloStore
          from apps.ciclo_digital.server import serve_ciclo


          class _Eco:
              def __init__(self, tmp_path: Path) -> None:
                  self.net_db = SQLiteAdapter(tmp_path / "network.db")
                  signer, _ = Ed25519Signer.generate()
                  self.kernel = ZyraKernel(
                      db=self.net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(host="127.0.0.1", port=0, api_token=None),
                  )
                  self.kernel.bootstrap_root()
                  self.caps = ZyraCapabilities(
                      self.net_db,
                      FrozenClock(),
                      identity=self.kernel.identity,
                      signer=signer,
                  )
                  self.net_server = serve_combined(
                      self.kernel, self.caps, host="127.0.0.1", port=0
                  )
                  threading.Thread(
                      target=self.net_server.serve_forever, daemon=True
                  ).start()
                  self.net_base = (
                      "http://127.0.0.1:"
                      f"{self.net_server.server_address[1]}"
                  )
                  self.client = NetworkClient(self.net_base, max_retries=1)
                  self.ciclo_db = SQLiteAdapter(tmp_path / "ciclo.db")
                  self.store = CicloStore(self.ciclo_db, FrozenClock())
                  self.ciclo_server = serve_ciclo(self.store, self.client)
                  threading.Thread(
                      target=self.ciclo_server.serve_forever, daemon=True
                  ).start()
                  self.ciclo_base = (
                      "http://127.0.0.1:"
                      f"{self.ciclo_server.bound_port}"
                  )

              def close(self) -> None:
                  self.ciclo_server.shutdown()
                  self.ciclo_server.server_close()
                  self.net_server.shutdown()
                  self.net_server.server_close()
                  self.ciclo_db.close()
                  self.net_db.close()


          def _pf(url: str, doc: dict) -> str:
              request = Request(
                  url,
                  data=(
                      "&".join(str(k) + "=" + str(v) for k, v in doc.items())
                  ).encode("utf-8"),
                  method="POST",
              )
              with urlopen(request, timeout=15) as r:
                  return r.read().decode("utf-8")


          def _pj(url: str, doc: dict) -> dict:
              request = Request(
                  url,
                  data=json.dumps(doc).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urlopen(request, timeout=15) as r:
                  body = json.loads(r.read().decode("utf-8"))
              assert isinstance(body, dict)
              return body


          def _h(url: str) -> str:
              with urlopen(url, timeout=15) as r:
                  return r.read().decode("utf-8")


          def test_1_archaeology_full_flow(tmp_path: Path) -> None:
              eco = _Eco(tmp_path)
              try:
                  assert eco.client.post(
                      "/apps/register",
                      {
                          "app_id": "ciclo",
                          "display_name": "CICLO-DIGITAL",
                          "scopes": ["display_name"],
                      },
                  )[0] is True
                  ok, data, _err = eco.client.post(
                      "/identity/register",
                      {
                          "kind": "person",
                          "display_name": "Juan Investigador",
                          "actor": "ciclo",
                      },
                  )
                  assert ok is True and data is not None
                  owner_zid = str(data.get("zid"))
                  assert owner_zid.startswith("ZID-")
                  eco.client.post(
                      "/trust/complete",
                      {"zid": owner_zid, "actor": "ciclo"},
                  )
                  case = _pj(
                      eco.ciclo_base + "/ciclo/api/archaeology/cases",
                      {
                          "owner_zid": owner_zid,
                          "title": "Foto familiar perdida",
                          "description": (
                              "recuperar foto borrada"
                          ),
                      },
                  )["data"]
                  case_id = case["case_id"]
                  assert case_id.startswith("ARC-")
                  assert case["status"] == "open"
                  finding_html = _pf(
                      eco.ciclo_base + "/ciclo/arch-finding",
                      {
                          "case_id": case_id,
                          "source": "red",
                          "title": "fragmento foto",
                          "content": "metadata recuperada",
                          "certainty": "evidencia_encontrada",
                      },
                  )
                  assert "Hallazgo registrado" in finding_html
                  assert "evidencia_encontrada" in finding_html
                  finding2_html = _pf(
                      eco.ciclo_base + "/ciclo/arch-finding",
                      {
                          "case_id": case_id,
                          "source": "memoria",
                          "title": "testimonio",
                          "content": "era en la playa",
                          "certainty": "inferencia",
                      },
                  )
                  assert "inferencia" in finding2_html
                  recon_html = _pf(
                      eco.ciclo_base + "/ciclo/arch-reconstruct",
                      {
                          "case_id": case_id,
                          "title": "foto familiar playa",
                          "description": "reconstruccion parcial",
                          "basis": "FND-1 + FND-2",
                          "certainty": "reconstruccion",
                      },
                  )
                  assert "Reconstruccion registrada" in recon_html
                  seal_html = _pf(
                      eco.ciclo_base + "/ciclo/arch-seal",
                      {"case_id": case_id},
                  )
                  assert "Expediente sellado" in seal_html
                  panel = _h(
                      eco.ciclo_base
                      + "/ciclo/arqueologia/"
                      + case_id
                  )
                  assert "Expediente" in panel
                  assert "sealed" in panel
                  assert "evidencia_encontrada" in panel
                  assert "inferencia" in panel
                  assert "reconstruccion" in panel
                  home = _h(eco.ciclo_base + "/ciclo")
                  assert "CICLO-DIGITAL" in home
                  assert "Reciclar" in home
                  assert "Arqueologia" in home
              finally:
                  eco.close()


          def test_2_valuation_with_network_tokens(
              tmp_path: Path,
          ) -> None:
              eco = _Eco(tmp_path)
              try:
                  assert eco.client.post(
                      "/apps/register",
                      {
                          "app_id": "ciclo",
                          "display_name": "CICLO-DIGITAL",
                          "scopes": ["display_name"],
                      },
                  )[0] is True
                  ok, data, _err = eco.client.post(
                      "/identity/register",
                      {
                          "kind": "person",
                          "display_name": "Reciclador",
                          "actor": "ciclo",
                      },
                  )
                  assert ok is True and data is not None
                  zid = str(data.get("zid"))
                  eco.client.post(
                      "/trust/complete",
                      {"zid": zid, "actor": "ciclo"},
                  )
                  balance_ok, balance, _err = eco.client.get(
                      "/tokens/" + zid + "/balance"
                  )
                  assert balance_ok is True
                  valuation = _pj(
                      eco.ciclo_base + "/ciclo/api/recycling/value",
                      {
                          "item_id": "REC-e2e1",
                          "owner_zid": zid,
                          "category": "video",
                          "condition": "bueno",
                      },
                  )["data"]
                  assert valuation["estimated_value"] == 8.0
                  assert valuation["reward_tokens"] == 4
                  assert valuation["network_tokens"] is True
                  bad = _pj(
                      eco.ciclo_base + "/ciclo/api/recycling/value",
                      {
                          "item_id": "REC-e2e2",
                          "category": "documento",
                          "condition": "malo",
                      },
                  )["data"]
                  assert bad["estimated_value"] == 2.0
                  assert bad["reward_tokens"] == 1
                  try:
                      _pj(
                          eco.ciclo_base
                          + "/ciclo/api/recycling/value",
                          {
                              "item_id": "REC-e2e3",
                              "category": "nave",
                              "condition": "bueno",
                          },
                      )
                      raise AssertionError("bad category must fail")
                  except Exception as exc:
                      assert "400" in str(exc)
              finally:
                  eco.close()


          def test_3_offline_resilience(tmp_path: Path) -> None:
              db = SQLiteAdapter(tmp_path / "ciclo.db")
              clock = FrozenClock()
              store = CicloStore(db, clock)
              dead_client = NetworkClient(
                  "http://127.0.0.1:1",
                  timeout_seconds=1.0,
                  max_retries=0,
              )
              server = serve_ciclo(store, dead_client)
              thread = threading.Thread(
                  target=server.serve_forever, daemon=True
              )
              thread.start()
              base = "http://127.0.0.1:" f"{server.bound_port}"
              try:
                  store.add_recycled(
                      item_id="REC-off",
                      owner_zid="ZID-off",
                      description="dato offline",
                      data_hash="abc",
                      token_amount=5,
                      document_id=None,
                      synced=False,
                  )
                  case = store.create_arch_case(
                      case_id="ARC-off",
                      owner_zid="ZID-off",
                      title="Caso offline",
                      description="sin red",
                  )
                  finding = store.add_finding(
                      finding_id="FND-off",
                      case_id="ARC-off",
                      source="local",
                      title="fragmento local",
                      content="contenido local",
                      certainty="evidencia_encontrada",
                      reason=None,
                      document_id=None,
                  )
                  assert finding["certainty"] == "evidencia_encontrada"
                  sealed = store.seal_arch_case(
                      case_id="ARC-off",
                      sealed_doc="local-pending",
                  )
                  assert sealed["status"] == "sealed"
                  valuation = store.add_valuation(
                      valuation_id="VAL-off",
                      item_id="REC-off",
                      category="foto",
                      condition="regular",
                  )
                  assert valuation["reward_tokens"] == 1
                  with urlopen(
                      base + "/ciclo", timeout=10
                  ) as response:
                      home = response.read().decode("utf-8")
                  assert "CICLO-DIGITAL" in home
              finally:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=5)
                  db.close()
          PYEOF
