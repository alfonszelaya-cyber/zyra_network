name: zyra-w16-triple-engine-2

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Clean engine inits (W391)
        run: |
          set -euo pipefail
          for f in workflow routing system_loader; do
            p="shared_engines/$f/__init__.py"
            [ -f "$p" ] && printf '"""ZYRA Network engine package."""\n' > "$p"
          done
          echo "inits cleaned"

      - name: Engine workflow
        run: |
          set -euo pipefail
          cat > shared_engines/workflow/errors.py <<'PYEOF'
          """Typed workflow errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
          )


          class UnknownWorkflowError(EngineError):
              """Workflow definition not registered."""


          class UnknownRunError(EngineError):
              """Workflow run does not exist."""


          class InvalidStateError(EngineError):
              """Operation not valid in current run
              state."""
          PYEOF

          cat > shared_engines/workflow/contracts.py <<'PYEOF'
          """Workflow contracts."""
          from __future__ import annotations

          from dataclasses import dataclass

          STATE_RUNNING = "RUNNING"
          STATE_COMPLETED = "COMPLETED"
          STATE_COMPENSATING = "COMPENSATING"
          STATE_COMPENSATED = "COMPENSATED"


          @dataclass(frozen=True)
          class WorkflowRun:
              """Durable run snapshot."""

              run_id: str
              workflow_id: str
              state: str
              steps: tuple[str, ...]
              completed_count: int
              pending_compensations: int
              reason: str | None
          PYEOF

          cat > shared_engines/workflow/engine.py <<'PYEOF'
          """Workflow engine: durable multi-step runs with
          compensation.

          A workflow is an ordered list of named steps. A
          run persists its position; each completed step is
          durable. On failure, completed steps are
          compensated in REVERSE order (saga pattern):

              RUNNING -> step -> step -> COMPLETED
                  |
                  v (failure)
              COMPENSATING (undo last-first)
                  |
                  v
              COMPENSATED

          Every state change is durable (SQLite), emitted
          to the Outbox, and the lifecycle milestones are
          audited. Reuses the existing patterns only -
          no parallel event system.
          """
          from __future__ import annotations

          import hashlib
          import json
          import sqlite3

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.identifiers import (
              new_id,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
          )
          from shared_engines.common.validation import (
              require_non_empty_str,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )
          from shared_engines.workflow.contracts import (
              STATE_COMPENSATED,
              STATE_COMPENSATING,
              STATE_COMPLETED,
              STATE_RUNNING,
              WorkflowRun,
          )
          from shared_engines.workflow.errors import (
              InvalidStateError,
              UnknownRunError,
              UnknownWorkflowError,
          )

          EVENT_STARTED = "workflow.run.started"
          EVENT_STEP = "workflow.run.step_completed"
          EVENT_COMPLETED = "workflow.run.completed"
          EVENT_FAILED = "workflow.run.failed"
          EVENT_COMPENSATED = (
              "workflow.run.compensated"
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "workflow",
                  (
                      "CREATE TABLE workflow_defs ("
                      " workflow_id TEXT PRIMARY KEY,"
                      " steps_json TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE workflow_runs ("
                      " run_id TEXT PRIMARY KEY,"
                      " workflow_id TEXT NOT NULL,"
                      " state TEXT NOT NULL,"
                      " current_step INTEGER NOT"
                      " NULL DEFAULT 0,"
                      " compensating_at INTEGER,"
                      " reason TEXT,"
                      " created_at REAL NOT NULL,"
                      " updated_at REAL NOT NULL)",
                  ),
              ),
          )


          class WorkflowEngine:
              """Durable saga-style workflow runs."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  audit: AuditTrail,
                  outbox: Outbox,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  self._outbox = outbox
                  MigrationRunner(
                      db, "workflow", _MIGRATIONS
                  ).run(clock)

              def _emit(
                  self,
                  cursor: sqlite3.Cursor,
                  *,
                  event_type: str,
                  aggregate: str,
                  payload: dict[str, object],
              ) -> None:
                  uid = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "t": event_type,
                              "a": aggregate,
                              "u": new_id(),
                          }
                      ).encode("utf-8")
                  ).hexdigest()[:32]
                  fp = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "id": uid,
                              "ty": event_type,
                          }
                      ).encode("utf-8")
                  ).hexdigest()
                  cursor.execute(
                      "INSERT INTO events_outbox"
                      " (event_id, event_type,"
                      " aggregate_id, schema_version,"
                      " envelope_version, created_at,"
                      " payload, fingerprint,"
                      " published_at)"
                      " VALUES (?, ?, ?, 1, 1, ?, ?,"
                      " ?, NULL)",
                      (
                          uid,
                          event_type,
                          aggregate,
                          self._clock.now(),
                          canonical_json_dumps(
                              payload
                          ),
                          fp,
                      ),
                  )

              def _steps_of(
                  self, workflow_id: str
              ) -> tuple[str, ...]:
                  row = self._db.query_one(
                      "SELECT steps_json FROM"
                      " workflow_defs WHERE"
                      " workflow_id = ?",
                      (workflow_id,),
                  )
                  if row is None:
                      raise UnknownWorkflowError(
                          "unknown workflow:"
                          f" {workflow_id}"
                      )
                  parsed = json.loads(
                      str(row["steps_json"])
                  )
                  return tuple(
                      str(s)
                      for s in parsed
                      if isinstance(s, str)
                  ) if isinstance(
                      parsed, list
                  ) else tuple()

              def _run_row(
                  self, run_id: str
              ) -> sqlite3.Row:
                  row = self._db.query_one(
                      "SELECT * FROM workflow_runs"
                      " WHERE run_id = ?",
                      (run_id,),
                  )
                  if row is None:
                      raise UnknownRunError(
                          f"unknown run: {run_id}"
                      )
                  return row

              def _record(
                  self, run_id: str
              ) -> WorkflowRun:
                  row = self._run_row(run_id)
                  steps = self._steps_of(
                      str(row["workflow_id"])
                  )
                  comp = row["compensating_at"]
                  state = str(row["state"])
                  return WorkflowRun(
                      run_id=str(row["run_id"]),
                      workflow_id=str(
                          row["workflow_id"]
                      ),
                      state=state,
                      steps=steps,
                      completed_count=(
                          int(row["current_step"])
                          if state == STATE_COMPLETED
                          else int(
                              row["current_step"]
                          )
                      ),
                      pending_compensations=(
                          int(comp)
                          if comp is not None
                          and state
                          == STATE_COMPENSATING
                          else 0
                      ),
                      reason=(
                          str(row["reason"])
                          if row["reason"]
                          is not None
                          else None
                      ),
                  )

              def define_workflow(
                  self,
                  *,
                  workflow_id: str,
                  steps: tuple[str, ...],
              ) -> None:
                  require_non_empty_str(
                      workflow_id, "workflow_id"
                  )
                  if not steps:
                      raise ValueError(
                          "at least one step"
                          " required"
                      )
                  if any(
                      not s.strip()
                      for s in steps
                  ):
                      raise ValueError(
                          "steps must be non-empty"
                      )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO workflow_defs"
                          " (workflow_id, steps_json,"
                          "  created_at)"
                          " VALUES (?, ?, ?)"
                          " ON CONFLICT(workflow_id)"
                          " DO UPDATE SET steps_json"
                          " = excluded.steps_json",
                          (
                              workflow_id,
                              canonical_json_dumps(
                                  list(steps)
                              ),
                              self._clock.now(),
                          ),
                      )

              def start_run(
                  self, *, workflow_id: str
              ) -> WorkflowRun:
                  steps = self._steps_of(
                      workflow_id
                  )
                  run_id = f"RUN-{new_id()}"
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO workflow_runs"
                          " (run_id, workflow_id,"
                          "  state, current_step,"
                          "  created_at, updated_at)"
                          " VALUES (?, ?, ?, 0, ?, ?)",
                          (
                              run_id,
                              workflow_id,
                              STATE_RUNNING,
                              now,
                              now,
                          ),
                      )
                      self._emit(
                          cursor,
                          event_type=EVENT_STARTED,
                          aggregate=run_id,
                          payload={
                              "workflow": (
                                  workflow_id
                              )
                          },
                      )
                  self._audit.append(
                      event_type=EVENT_STARTED,
                      actor="workflow-engine",
                      subject=run_id,
                      payload={
                          "workflow": workflow_id
                      },
                  )
                  return self._record(run_id)

              def complete_step(
                  self, *, run_id: str
              ) -> WorkflowRun:
                  row = self._run_row(run_id)
                  if str(row["state"]) != (
                      STATE_RUNNING
                  ):
                      raise InvalidStateError(
                          "run is not RUNNING:"
                          f" {run_id}"
                      )
                  workflow_id = str(
                      row["workflow_id"]
                  )
                  steps = self._steps_of(
                      workflow_id
                  )
                  current = int(
                      row["current_step"]
                  )
                  if current >= len(steps):
                      raise InvalidStateError(
                          "no pending steps"
                      )
                  new_step = current + 1
                  done = (
                      new_step == len(steps)
                  )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE workflow_runs SET"
                          " current_step = ?,"
                          " state = ?,"
                          " updated_at = ?"
                          " WHERE run_id = ?",
                          (
                              new_step,
                              STATE_COMPLETED
                              if done
                              else STATE_RUNNING,
                              now,
                              run_id,
                          ),
                      )
                      self._emit(
                          cursor,
                          event_type=(
                              EVENT_COMPLETED
                              if done
                              else EVENT_STEP
                          ),
                          aggregate=run_id,
                          payload={
                              "step": steps[current],
                              "position": new_step,
                          },
                      )
                  if done:
                      self._audit.append(
                          event_type=(
                              EVENT_COMPLETED
                          ),
                          actor="workflow-engine",
                          subject=run_id,
                          payload={},
                      )
                  return self._record(run_id)

              def fail_run(
                  self,
                  *,
                  run_id: str,
                  reason: str,
              ) -> WorkflowRun:
                  require_non_empty_str(
                      reason, "reason"
                  )
                  row = self._run_row(run_id)
                  if str(row["state"]) != (
                      STATE_RUNNING
                  ):
                      raise InvalidStateError(
                          "run is not RUNNING:"
                          f" {run_id}"
                      )
                  completed = int(
                      row["current_step"]
                  )
                  terminal = (
                      STATE_COMPENSATED
                      if completed == 0
                      else STATE_COMPENSATING
                  )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE workflow_runs SET"
                          " state = ?,"
                          " compensating_at = ?,"
                          " reason = ?,"
                          " updated_at = ?"
                          " WHERE run_id = ?",
                          (
                              terminal,
                              completed
                              if terminal
                              == (
                                  STATE_COMPENSATING
                              )
                              else None,
                              reason,
                              now,
                              run_id,
                          ),
                      )
                      self._emit(
                          cursor,
                          event_type=EVENT_FAILED,
                          aggregate=run_id,
                          payload={
                              "reason": reason
                          },
                      )
                  self._audit.append(
                      event_type=EVENT_FAILED,
                      actor="workflow-engine",
                      subject=run_id,
                      payload={"reason": reason},
                  )
                  return self._record(run_id)

              def compensate_step(
                  self, *, run_id: str
              ) -> WorkflowRun:
                  row = self._run_row(run_id)
                  if str(row["state"]) != (
                      STATE_COMPENSATING
                  ):
                      raise InvalidStateError(
                          "run is not"
                          " COMPENSATING:"
                          f" {run_id}"
                      )
                  comp = int(
                      row["compensating_at"]
                      or 0
                  )
                  if comp <= 0:
                      raise InvalidStateError(
                          "nothing to compensate"
                      )
                  remaining = comp - 1
                  done = remaining == 0
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE workflow_runs SET"
                          " compensating_at = ?,"
                          " state = ?,"
                          " updated_at = ?"
                          " WHERE run_id = ?",
                          (
                              remaining
                              if not done
                              else None,
                              STATE_COMPENSATED
                              if done
                              else (
                                  STATE_COMPENSATING
                              ),
                              now,
                              run_id,
                          ),
                      )
                      self._emit(
                          cursor,
                          event_type=(
                              EVENT_COMPENSATED
                              if done
                              else EVENT_STEP
                          ),
                          aggregate=run_id,
                          payload={
                              "undo_position": comp
                          },
                      )
                  if done:
                      self._audit.append(
                          event_type=(
                              EVENT_COMPENSATED
                          ),
                          actor="workflow-engine",
                          subject=run_id,
                          payload={},
                      )
                  return self._record(run_id)

              def get_run(
                  self, *, run_id: str
              ) -> WorkflowRun:
                  return self._record(run_id)
          PYEOF
          echo "=== WORKFLOW READY ==="

      - name: Engine routing
        run: |
          set -euo pipefail
          cat > shared_engines/routing/errors.py <<'PYEOF'
          """Typed routing errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
              NotFoundError,
          )


          class NoRouteError(NotFoundError):
              """No active route for the key."""
          PYEOF

          cat > shared_engines/routing/engine.py <<'PYEOF'
          """Routing engine: the transversal route table.

          Canonical layer mapping route keys to targets with
          explicit priorities. Deliberately independent of
          network/ (node-level routing) and currency (bridge
          routing): this is the Network-wide registry for
          "which target serves this key, in which order".

          Resolution is deterministic: lowest priority
          number wins, ties broken by route_id. Deactivating
          a route falls resolution to the next one. Pure
          utility layer.
          """
          from __future__ import annotations

          import sqlite3
          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              NotFoundError,
          )
          from shared_engines.common.identifiers import (
              new_id,
          )
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.routing.errors import (
              NoRouteError,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "routing_routes",
                  (
                      "CREATE TABLE routing_routes ("
                      " route_id TEXT PRIMARY KEY,"
                      " route_key TEXT NOT NULL,"
                      " target TEXT NOT NULL,"
                      " priority INTEGER NOT NULL,"
                      " active INTEGER NOT NULL"
                      " DEFAULT 1,"
                      " created_at REAL NOT NULL)",
                      "CREATE INDEX routing_lookup"
                      " ON routing_routes"
                      " (route_key, priority,"
                      " route_id)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class RouteRecord:
              route_id: str
              route_key: str
              target: str
              priority: int
              active: bool


          class RoutingEngine:
              """Durable prioritized route table."""

              def __init__(
                  self, db: Database, clock: Clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "routing", _MIGRATIONS
                  ).run(clock)

              def _record(
                  self, row: sqlite3.Row
              ) -> RouteRecord:
                  return RouteRecord(
                      route_id=str(
                          row["route_id"]
                      ),
                      route_key=str(
                          row["route_key"]
                      ),
                      target=str(row["target"]),
                      priority=int(
                          row["priority"]
                      ),
                      active=bool(
                          int(row["active"])
                      ),
                  )

              def register_route(
                  self,
                  *,
                  route_key: str,
                  target: str,
                  priority: int = 100,
              ) -> RouteRecord:
                  require_non_empty_str(
                      route_key, "route_key"
                  )
                  require_non_empty_str(
                      target, "target"
                  )
                  require_int_range(
                      priority,
                      "priority",
                      1,
                      10**6,
                  )
                  route_id = f"RTE-{new_id()}"
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO routing_routes"
                          " (route_id, route_key,"
                          "  target, priority,"
                          "  active, created_at)"
                          " VALUES (?, ?, ?, ?, 1, ?)",
                          (
                              route_id,
                              route_key,
                              target,
                              priority,
                              self._clock.now(),
                          ),
                      )
                  row = self._db.query_one(
                      "SELECT * FROM routing_routes"
                      " WHERE route_id = ?",
                      (route_id,),
                  )
                  assert row is not None
                  return self._record(row)

              def deactivate_route(
                  self, *, route_id: str
              ) -> RouteRecord:
                  require_non_empty_str(
                      route_id, "route_id"
                  )
                  row = self._db.query_one(
                      "SELECT * FROM routing_routes"
                      " WHERE route_id = ?",
                      (route_id,),
                  )
                  if row is None:
                      raise NotFoundError(
                          "unknown route:"
                          f" {route_id}"
                      )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE routing_routes"
                          " SET active = 0"
                          " WHERE route_id = ?",
                          (route_id,),
                      )
                  return self._record(
                      self._db.query_one(
                          "SELECT * FROM"
                          " routing_routes"
                          " WHERE route_id = ?",
                          (route_id,),
                      )
                  )

              def resolve(
                  self, *, route_key: str
              ) -> RouteRecord:
                  """Best active route: lowest priority
                  number, tie by route_id."""
                  require_non_empty_str(
                      route_key, "route_key"
                  )
                  row = self._db.query_one(
                      "SELECT * FROM routing_routes"
                      " WHERE route_key = ?"
                      " AND active = 1"
                      " ORDER BY priority ASC,"
                      " route_id ASC LIMIT 1",
                      (route_key,),
                  )
                  if row is None:
                      raise NoRouteError(
                          "no active route for"
                          f" '{route_key}'"
                      )
                  return self._record(row)

              def list_routes(
                  self, *, route_key: str
              ) -> tuple[RouteRecord, ...]:
                  require_non_empty_str(
                      route_key, "route_key"
                  )
                  rows = self._db.query_all(
                      "SELECT * FROM routing_routes"
                      " WHERE route_key = ?"
                      " ORDER BY priority ASC,"
                      " route_id ASC",
                      (route_key,),
                  )
                  return tuple(
                      self._record(row)
                      for row in rows
                  )
          PYEOF
          echo "=== ROUTING READY ==="

      - name: Engine system_loader
        run: |
          set -euo pipefail
          cat > shared_engines/system_loader/errors.py <<'PYEOF'
          """Typed system-loader errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
              NotFoundError,
          )


          class IncompatibleVersionError(EngineError):
              """Manifest version range does not cover
              this Network contract version."""


          class ComponentAlreadyLoadedError(
              EngineError
          ):
              """Component is already loaded."""


          class ManifestNotRegisteredError(
              NotFoundError
          ):
              """No manifest for the requested
              component/version."""


          class UnknownLoadedComponentError(
              NotFoundError
          ):
              """Component is not currently loaded."""
          PYEOF

          cat > shared_engines/system_loader/engine.py <<'PYEOF'
          """System loader: manifest-governed component
          loading.

          The GOVERNANCE layer above execution (foundation
          ModuleLoader/ComponentLoader do the actual import;
          LifecycleManager runs states). This engine decides
          WHAT MAY LOAD and records it durably:

              manifest declared (component, version,
                                 compatible contract range)
                    |
                    v
              load_component(): policy check
              (contract version within range, not loaded)
                    |
                    v
              durable loaded-registry + outbox event

          Policy is compatibility-based and explicit: an
          out-of-range component can never load, and a
          component cannot load twice. This is the
          anti-arbitrary-loading guard the audit demanded.
          """
          from __future__ import annotations

          import hashlib
          import sqlite3
          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.identifiers import (
              new_id,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
          )
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )
          from shared_engines.system_loader.errors import (
              ComponentAlreadyLoadedError,
              IncompatibleVersionError,
              ManifestNotRegisteredError,
              UnknownLoadedComponentError,
          )

          EVENT_LOADED = "system.component.loaded"
          EVENT_UNLOADED = (
              "system.component.unloaded"
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "system_loader",
                  (
                      "CREATE TABLE"
                      " system_manifests ("
                      " component_id TEXT NOT NULL,"
                      " version INTEGER NOT NULL,"
                      " min_contract INTEGER NOT"
                      " NULL,"
                      " max_contract INTEGER NOT"
                      " NULL,"
                      " registered_at REAL NOT"
                      " NULL,"
                      " PRIMARY KEY (component_id,"
                      " version))",
                      "CREATE TABLE system_loaded ("
                      " component_id TEXT PRIMARY"
                      " KEY,"
                      " version INTEGER NOT NULL,"
                      " loaded_at REAL NOT NULL)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class ManifestRecord:
              component_id: str
              version: int
              min_contract: int
              max_contract: int
              registered_at: float


          @dataclass(frozen=True)
          class LoadedRecord:
              component_id: str
              version: int
              loaded_at: float


          class SystemLoaderEngine:
              """Manifest policy over durable load
              registry."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  outbox: Outbox,
                  network_contract_version: int = 1,
              ) -> None:
                  require_int_range(
                      network_contract_version,
                      "network_contract_version",
                      1,
                      10**6,
                      config=True,
                  )
                  self._db = db
                  self._clock = clock
                  self._outbox = outbox
                  self._contract = (
                      network_contract_version
                  )
                  MigrationRunner(
                      db,
                      "system_loader",
                      _MIGRATIONS,
                  ).run(clock)

              def _emit(
                  self,
                  cursor: sqlite3.Cursor,
                  *,
                  event_type: str,
                  aggregate: str,
                  payload: dict[str, object],
              ) -> None:
                  uid = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "t": event_type,
                              "a": aggregate,
                              "u": new_id(),
                          }
                      ).encode("utf-8")
                  ).hexdigest()[:32]
                  fp = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "id": uid,
                              "ty": event_type,
                          }
                      ).encode("utf-8")
                  ).hexdigest()
                  cursor.execute(
                      "INSERT INTO events_outbox"
                      " (event_id, event_type,"
                      " aggregate_id, schema_version,"
                      " envelope_version, created_at,"
                      " payload, fingerprint,"
                      " published_at)"
                      " VALUES (?, ?, ?, 1, 1, ?, ?,"
                      " ?, NULL)",
                      (
                          uid,
                          event_type,
                          aggregate,
                          self._clock.now(),
                          canonical_json_dumps(
                              payload
                          ),
                          fp,
                      ),
                  )

              def register_manifest(
                  self,
                  *,
                  component_id: str,
                  version: int,
                  min_contract: int,
                  max_contract: int,
              ) -> ManifestRecord:
                  require_non_empty_str(
                      component_id,
                      "component_id",
                  )
                  require_int_range(
                      version, "version", 1, 10**6
                  )
                  require_int_range(
                      min_contract,
                      "min_contract",
                      1,
                      10**6,
                  )
                  require_int_range(
                      max_contract,
                      "max_contract",
                      1,
                      10**6,
                  )
                  if min_contract > max_contract:
                      raise ValueError(
                          "min_contract exceeds"
                          " max_contract"
                      )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " system_manifests"
                          " (component_id, version,"
                          "  min_contract,"
                          "  max_contract,"
                          "  registered_at)"
                          " VALUES (?, ?, ?, ?, ?)"
                          " ON CONFLICT("
                          " component_id, version)"
                          " DO UPDATE SET"
                          " min_contract ="
                          " excluded.min_contract,"
                          " max_contract ="
                          " excluded.max_contract",
                          (
                              component_id,
                              version,
                              min_contract,
                              max_contract,
                              now,
                          ),
                      )
                  return ManifestRecord(
                      component_id=component_id,
                      version=version,
                      min_contract=min_contract,
                      max_contract=max_contract,
                      registered_at=now,
                  )

              def _pick_manifest(
                  self,
                  component_id: str,
                  version: int | None,
              ) -> ManifestRecord:
                  if version is not None:
                      row = self._db.query_one(
                          "SELECT * FROM"
                          " system_manifests"
                          " WHERE component_id = ?"
                          " AND version = ?",
                          (component_id, version),
                      )
                  else:
                      row = self._db.query_one(
                          "SELECT * FROM"
                          " system_manifests"
                          " WHERE component_id = ?"
                          " ORDER BY version DESC"
                          " LIMIT 1",
                          (component_id,),
                      )
                  if row is None:
                      raise (
                          ManifestNotRegisteredError(
                              "no manifest for"
                              f" '{component_id}'"
                          )
                      )
                  return ManifestRecord(
                      component_id=str(
                          row["component_id"]
                      ),
                      version=int(
                          row["version"]
                      ),
                      min_contract=int(
                          row["min_contract"]
                      ),
                      max_contract=int(
                          row["max_contract"]
                      ),
                      registered_at=float(
                          row["registered_at"]
                      ),
                  )

              def load_component(
                  self,
                  *,
                  component_id: str,
                  version: int | None = None,
              ) -> LoadedRecord:
                  require_non_empty_str(
                      component_id,
                      "component_id",
                  )
                  already = self._db.query_one(
                      "SELECT 1 FROM"
                      " system_loaded WHERE"
                      " component_id = ?",
                      (component_id,),
                  )
                  if already is not None:
                      raise (
                          ComponentAlreadyLoadedError(
                              "already loaded:"
                              f" {component_id}"
                          )
                      )
                  manifest = self._pick_manifest(
                      component_id, version
                  )
                  if not (
                      manifest.min_contract
                      <= self._contract
                      <= manifest.max_contract
                  ):
                      raise (
                          IncompatibleVersionError(
                              f"'{component_id}'"
                              f" v{manifest.version}"
                              " needs contract"
                              " ["
                              f"{manifest.min_contract}"
                              ","
                              f"{manifest.max_contract}"
                              "] but network is"
                              f" {self._contract}"
                          )
                      )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " system_loaded"
                          " (component_id, version,"
                          "  loaded_at)"
                          " VALUES (?, ?, ?)",
                          (
                              component_id,
                              manifest.version,
                              now,
                          ),
                      )
                      self._emit(
                          cursor,
                          event_type=EVENT_LOADED,
                          aggregate=component_id,
                          payload={
                              "version": (
                                  manifest.version
                              )
                          },
                      )
                  return LoadedRecord(
                      component_id=component_id,
                      version=manifest.version,
                      loaded_at=now,
                  )

              def unload_component(
                  self, *, component_id: str
              ) -> LoadedRecord:
                  require_non_empty_str(
                      component_id,
                      "component_id",
                  )
                  row = self._db.query_one(
                      "SELECT * FROM system_loaded"
                      " WHERE component_id = ?",
                      (component_id,),
                  )
                  if row is None:
                      raise (
                          UnknownLoadedComponentError(
                              "not loaded:"
                              f" {component_id}"
                          )
                      )
                  record = LoadedRecord(
                      component_id=str(
                          row["component_id"]
                      ),
                      version=int(row["version"]),
                      loaded_at=float(
                          row["loaded_at"]
                      ),
                  )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "DELETE FROM"
                          " system_loaded WHERE"
                          " component_id = ?",
                          (component_id,),
                      )
                      self._emit(
                          cursor,
                          event_type=(
                              EVENT_UNLOADED
                          ),
                          aggregate=component_id,
                          payload={
                              "version": (
                                  record.version
                              )
                          },
                      )
                  return record

              def loaded_components(
                  self,
              ) -> tuple[LoadedRecord, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM system_loaded"
                      " ORDER BY component_id"
                  )
                  return tuple(
                      LoadedRecord(
                          component_id=str(
                              r["component_id"]
                          ),
                          version=int(
                              r["version"]
                          ),
                          loaded_at=float(
                              r["loaded_at"]
                          ),
                      )
                      for r in rows
                  )
          PYEOF
          echo "=== SYSTEM LOADER READY ==="

