          def test_signature_request_flow(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  net.profiles.register_app(
                      app_id="marketplace",
                      display_name="Market",
                      scopes=("display_name",),
                  )
                  seller = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="s",
                          actor="marketplace",
                      )
                  )
                  buyer = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="b",
                          actor="marketplace",
                      )
                  )
                  sealed = (
                      net.exchange.seal_document(
                          owner_zid=seller.zid,
                          title="Acuerdo",
                          content=b"acuerdo v1",
                          actor_app=(
                              "marketplace"
                          ),
                      )
                  )
                  req = (
                      net.exchange
                      .request_signature(
                          document_id=(
                              sealed.document_id
                          ),
                          signer_zid=buyer.zid,
                          requester_zid=(
                              seller.zid
                          ),
                      )
                  )
                  assert req.status == "PENDING"
                  assert len(
                      net.exchange.pending_for(
                          signer_zid=buyer.zid
                      )
                  ) == 1
                  signed = (
                      net.exchange.sign_request(
                          request_id=req.request_id,
                          signer_zid=buyer.zid,
                      )
                  )
                  assert signed.status == "SIGNED"
                  assert (
                      signed.signature is not None
                  )
                  assert len(
                      net.exchange.pending_for(
                          signer_zid=buyer.zid
                      )
                  ) == 0
                  assert (
                      DocumentExchange
                      .verify_signature_receipt(
                          request_id=req.request_id,
                          document_id=(
                              sealed.document_id
                          ),
                          sha256=sealed.sha256,
                          signer_zid=buyer.zid,
                          signature=(
                              signed.signature
                          ),
                          public_pem=(
                              sealed.public_pem
                          ),
                      )
                      is True
                  )
                  with pytest.raises(ValueError):
                      net.exchange.sign_request(
                          request_id=(
                              req.request_id
                          ),
                          signer_zid=buyer.zid,
                      )
              finally:
                  net.close()


          def test_reject_and_unauthorized_app(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  net.profiles.register_app(
                      app_id="marketplace",
                      display_name="Market",
                      scopes=("display_name",),
                  )
                  a = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="a",
                          actor="marketplace",
                      )
                  )
                  b = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="b",
                          actor="marketplace",
                      )
                  )
                  sealed = (
                      net.exchange.seal_document(
                          owner_zid=a.zid,
                          title="T",
                          content=b"x",
                          actor_app=(
                              "marketplace"
                          ),
                      )
                  )
                  req = (
                      net.exchange
                      .request_signature(
                          document_id=(
                              sealed.document_id
                          ),
                          signer_zid=b.zid,
                          requester_zid=a.zid,
                      )
                  )
                  rejected = (
                      net.exchange
                      .reject_request(
                          request_id=req.request_id,
                          signer_zid=b.zid,
                      )
                  )
                  assert (
                      rejected.status
                      == "REJECTED"
                  )
                  with pytest.raises(
                      ValueError
                  ):
                      net.exchange.sign_request(
                          request_id=(
                              req.request_id
                          ),
                          signer_zid=b.zid,
                      )
                  with pytest.raises(
                      PermissionError
                  ):
                      net.exchange.seal_document(
                          owner_zid=a.zid,
                          title="T",
                          content=b"y",
                          actor_app="malware",
                      )
              finally:
                  net.close()
