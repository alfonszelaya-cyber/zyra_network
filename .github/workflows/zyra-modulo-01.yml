name: zyra-w4-replication-real

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Write replication.py (physical transfer, legacy kept)
        run: |
          set -euo pipefail
          cat > shared_engines/network/replication.py <<'PYEOF'
          """Hash-verified state replication between nodes.

          Two layers:

          1. Parity (legacy, preserved): ``compute_state_hash``
             and ``replicate`` verify that a replica's state
             hash matches the primary's.
          2. Physical transfer (W4): ``export_state`` produces
             a self-describing snapshot (schema DDL + rows of
             the replicated tables), ``apply_state`` atomically
             replaces the destination tables with it, and
             ``replicate_to`` orchestrates transfer -> apply ->
             verify -> ack. Real rows move between two SQLite
             databases; deletes propagate; divergence is
             detected and healable by re-replicating.
          """
          from __future__ import annotations

          import json
          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.identifiers import (
              stable_hash,
          )
          from shared_engines.common.validation import (
              require_non_empty_str,
          )
          from shared_engines.network.errors import (
              ReplicationMismatchError,
          )
          from shared_engines.storage.database import (
              Database,
          )

          REPLICATED_TABLES = (
              "identities",
              "cluster_nodes",
          )


          @dataclass(frozen=True)
          class ReplicationReport:
              primary_node: str
              replica_node: str
              state_version: int
              state_hash: str
              consistent: bool
              rows_replicated: int


          @dataclass(frozen=True)
          class StateSnapshot:
              """Self-describing transferable state."""

              version: int
              state_hash: str
              schemas: dict[str, str]
              tables: dict[
                  str, tuple[dict[str, object], ...]
              ]


          class ReplicationManager:
              """Computes hashes, verifies parity and now also
              physically transfers state to replicas."""

              def __init__(
                  self, db: Database, clock: Clock
              ) -> None:
                  self._db = db
                  self._clock = clock

              def compute_state_hash(
                  self,
              ) -> tuple[int, str]:
                  parts: list[str] = []
                  for table in REPLICATED_TABLES:
                      rows = self._db.query_all(
                          f"SELECT * FROM {table}"
                          " ORDER BY rowid"
                      )
                      for row in rows:
                          parts.append(
                              json.dumps(
                                  {
                                      k: str(v)
                                      for k, v in dict(
                                          row
                                      ).items()
                                  },
                                  sort_keys=True,
                              )
                          )
                  version = int(self._clock.now())
                  return version, stable_hash(*parts)

              def export_state(self) -> StateSnapshot:
                  """Capture schema DDL + rows + hash."""
                  version, state_hash = (
                      self.compute_state_hash()
                  )
                  tables: dict[
                      str,
                      tuple[dict[str, object], ...],
                  ] = {}
                  schemas: dict[str, str] = {}
                  for table in REPLICATED_TABLES:
                      rows = self._db.query_all(
                          f"SELECT * FROM {table}"
                          " ORDER BY rowid"
                      )
                      tables[table] = tuple(
                          dict(row) for row in rows
                      )
                      schema_row = self._db.query_one(
                          "SELECT sql FROM sqlite_master"
                          " WHERE type = 'table'"
                          " AND name = ?",
                          (table,),
                      )
                      if schema_row is not None and (
                          schema_row["sql"] is not None
                      ):
                          schemas[table] = str(
                              schema_row["sql"]
                          )
                  return StateSnapshot(
                      version=version,
                      state_hash=state_hash,
                      schemas=schemas,
                      tables=tables,
                  )

              def apply_state(
                  self, snapshot: StateSnapshot
              ) -> int:
                  """Atomically replace local replicated
                  tables with the snapshot. Returns the
                  number of rows applied.

                  FK-safe ordering: tables are created
                  parent-first, emptied child-first and
                  filled parent-first.
                  """
                  applied = 0
                  with self._db.transaction() as cursor:
                      for table in REPLICATED_TABLES:
                          exists = cursor.execute(
                              "SELECT name FROM"
                              " sqlite_master"
                              " WHERE type = 'table'"
                              " AND name = ?",
                              (table,),
                          ).fetchone()
                          if exists is None:
                              ddl = (
                                  snapshot.schemas.get(
                                      table
                                  )
                              )
                              if ddl:
                                  cursor.execute(ddl)
                      for table in reversed(
                          REPLICATED_TABLES
                      ):
                          exists = cursor.execute(
                              "SELECT name FROM"
                              " sqlite_master"
                              " WHERE type = 'table'"
                              " AND name = ?",
                              (table,),
                          ).fetchone()
                          if exists is not None:
                              cursor.execute(
                                  f"DELETE FROM {table}"
                              )
                      for table in REPLICATED_TABLES:
                          for row in (
                              snapshot.tables.get(
                                  table, ()
                              )
                          ):
                              cols = list(row.keys())
                              col_sql = ", ".join(cols)
                              marks = ", ".join(
                                  "?" for _ in cols
                              )
                              cursor.execute(
                                  f"INSERT INTO {table}"
                                  f" ({col_sql}) VALUES"
                                  f" ({marks})",
                                  tuple(
                                      row[c]
                                      for c in cols
                                  ),
                              )
                              applied += 1
                  return applied

              def replicate_to(
                  self,
                  *,
                  replica_db: Database,
                  primary_node: str,
                  replica_node: str,
              ) -> ReplicationReport:
                  """Physical replication:
                  transfer -> apply -> verify -> ack."""
                  require_non_empty_str(
                      primary_node, "primary_node"
                  )
                  require_non_empty_str(
                      replica_node, "replica_node"
                  )
                  snapshot = self.export_state()
                  replica_manager = ReplicationManager(
                      replica_db, self._clock
                  )
                  applied = (
                      replica_manager.apply_state(
                          snapshot
                      )
                  )
                  _, replica_hash = (
                      replica_manager.compute_state_hash()
                  )
                  if replica_hash != snapshot.state_hash:
                      raise ReplicationMismatchError(
                          f"replica {replica_node} hash"
                          f" {replica_hash[:16]} !="
                          f" primary"
                          f" {snapshot.state_hash[:16]}"
                          " after apply"
                      )
                  return ReplicationReport(
                      primary_node=primary_node,
                      replica_node=replica_node,
                      state_version=snapshot.version,
                      state_hash=snapshot.state_hash,
                      consistent=True,
                      rows_replicated=applied,
                  )

              def replicate(
                  self,
                  *,
                  primary_node: str,
                  replica_node: str,
                  replica_hash: str | None = None,
                  rows_replicated: int = 0,
              ) -> ReplicationReport:
                  require_non_empty_str(
                      primary_node, "primary_node"
                  )
                  require_non_empty_str(
                      replica_node, "replica_node"
                  )
                  version, primary_hash = (
                      self.compute_state_hash()
                  )
                  if replica_hash is None:
                      replica_hash = primary_hash
                  consistent = (
                      replica_hash == primary_hash
                  )
                  if not consistent:
                      raise ReplicationMismatchError(
                          f"replica {replica_node} hash"
                          f" {replica_hash[:16]}"
                          f" != primary"
                          f" {primary_hash[:16]}"
                      )
                  return ReplicationReport(
                      primary_node=primary_node,
                      replica_node=replica_node,
                      state_version=version,
                      state_hash=primary_hash,
                      consistent=True,
                      rows_replicated=rows_replicated,
                  )
          PYEOF
          echo "=== REPLICATION PHYSICAL READY ==="

      - name: Write physical replication proofs (3)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/network/tests
          cat > shared_engines/network/tests/test_replication_physical.py <<'PYEOF'
          """Physical replication proofs: rows really move
          between two databases, deletes propagate, and
          divergence is detected and healed."""
          from __future__ import annotations

          from pathlib import Path

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.events.contracts import (
              EventCatalog,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              IdentityKind,
          )
          from shared_engines.identity.engine import (
              IdentityEngine,
          )
          from shared_engines.network.cluster import (
              ClusterManager,
          )
          from shared_engines.network.replication import (
              ReplicationManager,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )


          class _Node:
              """Real node: identity + cluster + replication."""

              def __init__(
                  self, tmp_path: Path, name: str
              ) -> None:
                  self.db = SQLiteAdapter(
                      tmp_path / f"{name}.db"
                  )
                  self.clock = FrozenClock()
                  self.audit = AuditTrail(
                      self.db, self.clock
                  )
                  self.outbox = Outbox(
                      self.db, self.clock
                  )
                  self.outbox.ensure_schema()
                  self.catalog = EventCatalog()
                  for et in (
                      "identity.registered",
                      "identity.status_changed",
                      "network.node.joined",
                      "network.node.state_changed",
                  ):
                      self.catalog.register(et)
                  self.identity = IdentityEngine(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                  )
                  self.cluster = ClusterManager(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                      heartbeat_ttl_seconds=30.0,
                  )
                  self.replication = ReplicationManager(
                      self.db, self.clock
                  )

              def close(self) -> None:
                  self.db.close()


          def _identity_count(
              node: _Node,
          ) -> int:
              row = node.db.query_one(
                  "SELECT COUNT(*) AS n FROM identities"
              )
              assert row is not None
              return int(row["n"])


          def test_transfer_resync_hashes_equal(
              tmp_path: Path,
          ) -> None:
              primary = _Node(tmp_path, "primary")
              replica = _Node(tmp_path, "replica")
              try:
                  primary.identity.register_identity(
                      kind=IdentityKind.PERSON,
                      display_name="u1",
                      actor="t",
                  )
                  report = (
                      primary.replication.replicate_to(
                          replica_db=replica.db,
                          primary_node="A",
                          replica_node="B",
                      )
                  )
                  assert report.consistent is True
                  assert report.rows_replicated >= 1
                  assert (
                      _identity_count(replica) == 1
                  )
                  _, hp = (
                      primary.replication.compute_state_hash()
                  )
                  _, hr = (
                      replica.replication.compute_state_hash()
                  )
                  assert hp == hr
                  # Re-sync after new writes
                  primary.identity.register_identity(
                      kind=IdentityKind.PERSON,
                      display_name="u2",
                      actor="t",
                  )
                  primary.replication.replicate_to(
                      replica_db=replica.db,
                      primary_node="A",
                      replica_node="B",
                  )
                  assert (
                      _identity_count(replica) == 2
                  )
                  _, hp2 = (
                      primary.replication.compute_state_hash()
                  )
                  _, hr2 = (
                      replica.replication.compute_state_hash()
                  )
                  assert hp2 == hr2
              finally:
                  primary.close()
                  replica.close()


          def test_delete_propagates_to_replica(
              tmp_path: Path,
          ) -> None:
              primary = _Node(tmp_path, "primary")
              replica = _Node(tmp_path, "replica")
              try:
                  primary.identity.register_identity(
                      kind=IdentityKind.PERSON,
                      display_name="u1",
                      actor="t",
                  )
                  primary.identity.register_identity(
                      kind=IdentityKind.PERSON,
                      display_name="u2",
                      actor="t",
                  )
                  primary.replication.replicate_to(
                      replica_db=replica.db,
                      primary_node="A",
                      replica_node="B",
                  )
                  assert (
                      _identity_count(replica) == 2
                  )
                  primary.db.execute(
                      "DELETE FROM identities WHERE"
                      " rowid = (SELECT MIN(rowid)"
                      " FROM identities)"
                  )
                  primary.replication.replicate_to(
                      replica_db=replica.db,
                      primary_node="A",
                      replica_node="B",
                  )
                  assert (
                      _identity_count(replica) == 1
                  )
                  _, hp = (
                      primary.replication.compute_state_hash()
                  )
                  _, hr = (
                      replica.replication.compute_state_hash()
                  )
                  assert hp == hr
              finally:
                  primary.close()
                  replica.close()


          def test_divergence_detected_and_healed(
              tmp_path: Path,
          ) -> None:
              primary = _Node(tmp_path, "primary")
              replica = _Node(tmp_path, "replica")
              try:
                  primary.identity.register_identity(
                      kind=IdentityKind.PERSON,
                      display_name="u1",
                      actor="t",
                  )
                  primary.replication.replicate_to(
                      replica_db=replica.db,
                      primary_node="A",
                      replica_node="B",
                  )
                  _, hp = (
                      primary.replication.compute_state_hash()
                  )
                  _, hr = (
                      replica.replication.compute_state_hash()
                  )
                  assert hp == hr
                  # Tamper with the replica directly
                  replica.db.execute(
                      "UPDATE identities SET"
                      " display_name = 'tampered'"
                  )
                  _, hr_bad = (
                      replica.replication.compute_state_hash()
                  )
                  assert hr_bad != hp
                  # Re-replication heals the divergence
                  primary.replication.replicate_to(
                      replica_db=replica.db,
                      primary_node="A",
                      replica_node="B",
                  )
                  _, hr_fixed = (
                      replica.replication.compute_state_hash()
                  )
                  assert hr_fixed == hp
              finally:
                  primary.close()
                  replica.close()
          PYEOF
          echo "=== PHYSICAL TESTS READY ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs"
          python -m compileall -q $M main.py scripts shared_engines/tests
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M shared_engines/tests tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W4 physical replication - export_state/apply_state (self-describing snapshot, FK-safe apply), replicate_to transfer->apply->verify->ack, delete propagation, divergence heal; legacy parity API untouched"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W4 COMPLETE ==="
