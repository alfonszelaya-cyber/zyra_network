          else
            git commit -m "zyra: Q3 AXIS emergencias v3 - ROOT CAUSE fixed: exam handlers receive the already-read form doc (no body re-read = no timeout), emergency API routes moved inside _api_post where JSON dispatch happens (404 fixed), single-line HTML strings; migration 2 + custody chain + trust ext; probe + 3 e2e"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
