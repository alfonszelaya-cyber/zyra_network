                      in str(m["text"])
                      for m in family
                  )
                  certify = _post_json(
                      eco.sem_base
                      + "/semilla/api/certify",
                      {
                          "student_account": student_id,
                          "teacher_account": teacher_id,
                      },
                  )["data"]
                  assert certify["issued"] is True
                  credential_id = certify.get(
                      "credential_id"
                  )
                  assert credential_id
                  with urlopen(
                      eco.net_base
                      + "/verification/credentials/"
                      + str(credential_id),
                      timeout=10,
                  ) as response:
                      raw = response.read().decode(
                          "utf-8"
                      )
                  assert "education" in raw
                  home = _get_html(
                      eco.sem_base + "/semilla"
                  )
                  assert "Soy alumno" in home
                  assert "Soy profesor" in home
              finally:
                  eco.close()
          PYEOF
          echo "e2e written"

      - name: Run SEMILLA tests (regression plus tutor e2e)
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --timeout=120 --timeout-method=thread apps/semilla/tests/
          echo "SEMILLA tests OK"
          find apps/semilla -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: Q3 SEMILLA tutor v2 - fixed unterminated string in challenge feedback (if/else blocks instead of split ternary), additive migration 2, tutor v2 adaptive bank never reveals answer, link v2 trust + education credential, surgical server patches, screens retos/talentos/mensajes, advance grade, certify via network with trust; probe + tutor e2e"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== Q3 SEMILLA COMPLETE ==="
