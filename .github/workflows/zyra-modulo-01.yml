name: zyra-block-a2-shadow

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-block-a2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Remove shadowing future-namespace dirs (module.py vs module/)
        run: |
          set -euo pipefail
          python3 - <<'PYSHADOW'
          from pathlib import Path

          root = Path("shared_engines")
          removed: list[str] = []
          manifest = Path("NAMESPACE_MANIFEST.md")

          for py_file in sorted(root.rglob("*.py")):
              if py_file.name in ("__init__.py", "conftest.py"):
                  continue
              shadow_dir = py_file.with_suffix("")
              if not shadow_dir.is_dir():
                  continue
              # The dir shadows the module. Only remove if it holds
              # nothing but package markers (it is a future namespace).
              contents = list(shadow_dir.rglob("*"))
              only_markers = all(
                  c.is_dir() or (c.name == "__init__.py")
                  for c in contents
              )
              if only_markers:
                  import shutil

                  shutil.rmtree(shadow_dir)
                  rel = str(shadow_dir)
                  removed.append(rel)
                  print(f"removed shadowing dir: {rel}")

          header = "# Reserved future namespaces (do not create as packages)\n\n"
          entries = ""
          if manifest.exists():
              entries = manifest.read_text(encoding="utf-8")
          if not entries.startswith("# Reserved"):
              entries = header + entries
          new_lines = [
              f"- `{r}/` — FUTURE (reserved; shadows real module"
              f" `{r}.py`, removed to unblock imports)"
              for r in removed
          ]
          if new_lines:
              entries = entries.rstrip("\n") + "\n" + "\n".join(new_lines) + "\n"
              manifest.write_text(entries, encoding="utf-8")
          print(f"total shadowing dirs removed: {len(removed)}")
          PYSHADOW

      - name: Verify the three known conflicts are resolved
        run: |
          set -euo pipefail
          test -f shared_engines/verification/signatures.py
          test -f shared_engines/identity/registry.py
          test -f shared_engines/tokenization/ledger.py
          if [ -d shared_engines/verification/signatures ]; then
            echo "FAIL: verification/signatures/ still shadows signatures.py"
            exit 1
          fi
          if [ -d shared_engines/identity/registry ]; then
            echo "FAIL: identity/registry/ still shadows registry.py"
            exit 1
          fi
          if [ -d shared_engines/tokenization/ledger ]; then
            echo "FAIL: tokenization/ledger/ still shadows ledger.py"
            exit 1
          fi
          echo "all three shadowed modules resolved"

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs"
          python -m compileall -q $M main.py scripts
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add shared_engines NAMESPACE_MANIFEST.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: block A2 fix (remove future-namespace dirs shadowing real modules: verification/signatures, identity/registry, tokenization/ledger + generic scan; NAMESPACE_MANIFEST.md updated)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== BLOCK A2 COMPLETE ==="
