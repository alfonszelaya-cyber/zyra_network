              " #d29922;border-radius:8px;padding:10px;"
              "margin:8px 0}"
              "small{color:#8b949e}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html lang='es'><head>"
                  "<meta charset='utf-8'>"
                  "<meta name='viewport' content='width="
                  "device-width, initial-scale=1'>"
                  f"<title>{title}</title>"
                  f"<style>{_CSS}</style></head><body>"
                  f"<div class='wrap'>{body}</div></body>"
                  "</html>"
              )


          class SemillaApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[SemillaStore]
              link: ClassVar[SemillaLink]
              tutor: ClassVar[Tutor] = Tutor()

              def log_message(
                  self, format: str, *args: object
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(self, method: str) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._html(
                          404,
                          _page(
                              "No encontrado",
                              "<h1>404</h1>"
                              f"<p>{exc}</p>",
                          ),
                      )
                  except ValueError as exc:
                      self._html(
                          400,
                          _page(
                              "Error",
                              "<h1>Dato invalido"
                              f"</h1><p>{exc}</p>",
                          ),
                      )
                  except Exception as exc:
                      self._html(
                          500,
                          _page(
                              "Error",
                              "<h1>Error interno"
                              f"</h1><p>{exc}</p>",
                          ),
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != ["semilla"]:
                      self._html(
                          404,
                          _page(
                              "404",
                              "<h1>Fuera de"
                              " SEMILLA</h1>",
                          ),
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_get(s[1:])
                      return
                  store = type(self).store
                  tutor = type(self).tutor
                  if not s or s == ["home"]:
                      self._home()
                      return
                  if s[0] == "alumno":
                      account_id = (
                          s[1] if len(s) > 1 else ""
                      )
                      row = store.get_account(
                          account_id
                      )
                      grades = store.grades_of(
                          student_account=(
                              account_id
                          )
                      )
                      average = store.average_of(
                          student_account=(
                              account_id
                          )
                      )
                      attendance = (
                          store.attendance_rate(
                              student_account=(
                                  account_id
                              )
                          )
                      )
                      eligibility = (
                          tutor.scholarship_eligibility(
                              average=average,
                              attendance=(
                                  attendance
                              ),
                          )
                      )
                      avg_text = (
                          f"{average:.1f}"
                          if average is not None
                          else "sin notas"
                      )
                      grades_html = "".join(
                          "<li>• "
                          + g["subject"]
