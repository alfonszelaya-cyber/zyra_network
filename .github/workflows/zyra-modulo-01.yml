name: zyra-block-a2-shadow-fix

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-block-a2-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Remove shadowing dirs (broken __init__py counts as marker)
        run: |
          set -euo pipefail
          python3 - <<'PYSHADOW'
          from pathlib import Path
          import shutil

          root = Path("shared_engines")
          removed: list[str] = []
          marker_names = {"__init__.py", "__init__py"}

          for py_file in sorted(root.rglob("*.py")):
              if py_file.name in ("__init__.py", "conftest.py"):
                  continue
              shadow_dir = py_file.with_suffix("")
              if not shadow_dir.is_dir():
                  continue
              contents = list(shadow_dir.rglob("*"))
              only_markers = all(
                  c.is_dir() or (c.name in marker_names)
                  for c in contents
              )
              if only_markers:
                  shutil.rmtree(shadow_dir)
                  rel = str(shadow_dir)
                  removed.append(rel)
                  print(f"removed shadowing dir: {rel}")

          manifest = Path("NAMESPACE_MANIFEST.md")
          if removed:
              header = (
                  "# Reserved future namespaces"
                  " (do not create as packages)\n\n"
              )
              existing = ""
              if manifest.exists():
                  current = manifest.read_text(encoding="utf-8")
                  if current.startswith("# Reserved"):
                      existing = current
                  else:
                      existing = header + current
              else:
                  existing = header
              lines = [
                  f"- `{r}/` — FUTURE (reserved; shadowed real module"
                  f" `{r}.py`, dir removed to unblock imports)"
                  for r in removed
              ]
              existing = existing.rstrip("\n") + "\n" + "\n".join(lines) + "\n"
              manifest.write_text(existing, encoding="utf-8")
          print(f"total removed: {len(removed)}")
          PYSHADOW

      - name: Verify the three known conflicts are resolved
        run: |
          set -euo pipefail
          test -f shared_engines/verification/signatures.py
          test -f shared_engines/identity/registry.py
          test -f shared_engines/tokenization/ledger.py
          for d in shared_engines/verification/signatures \
                   shared_engines/identity/registry \
                   shared_engines/tokenization/ledger; do
            if [ -d "$d" ]; then
              echo "FAIL: $d still shadows its module"
              exit 1
            fi
          done
          echo "all shadowed modules resolved"

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs"
          python -m compileall -q $M main.py scripts
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add shared_engines NAMESPACE_MANIFEST.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: block A2 fixed (shadow scan accepts broken __init__py markers; verification/signatures, identity/registry, tokenization/ledger unblocked)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== BLOCK A2 COMPLETE ==="
