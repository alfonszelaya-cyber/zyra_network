name: zyra-w28b2v7-subastas-fix-e2e

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w28b2v7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Evidence (old routes before rewrite)
        run: |
          set -euo pipefail
          echo "=== OLD server.py ==="
          wc -c apps/subastas/server.py || true
          grep -n "do_GET\|do_POST\|path ==" \
            apps/subastas/server.py | head -40 || true
          echo "=== OLD link calls ==="
          grep -n "\.post(\|\.get(" \
            apps/subastas/services/subastas_link.py \
            | head -30 || true

      - name: Rewrite SUBASTAS core (contract-aligned)
        run: |
          set -euo pipefail
          mkdir -p \
            apps/subastas/infrastructure/network \
            apps/subastas/infrastructure/persistence \
            apps/subastas/services \
            apps/subastas/tests
          for pkg in \
            apps/subastas \
            apps/subastas/infrastructure \
            apps/subastas/infrastructure/network \
            apps/subastas/infrastructure/persistence \
            apps/subastas/services \
            apps/subastas/tests
          do
            touch "$pkg/__init__.py"
          done
          cat > apps/subastas/infrastructure/network/network_client.py <<'PYEOF'
          """SUBASTAS HTTP client to ZYRA Network."""
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request


          class NetworkClient:
              def __init__(
                  self,
                  base_url: str | None = None,
                  *,
                  timeout_seconds: float = 5.0,
                  max_retries: int = 2,
              ) -> None:
                  self._base = (
                      base_url
                      or os.environ.get("ZYRA_URL", "")
                  ).rstrip("/")
                  self._timeout = timeout_seconds
                  self._retries = max(0, max_retries)

              def get(self, path: str) -> tuple[
                  bool, dict | None, str | None,
              ]:
                  return self._call("GET", path)

              def post(
                  self, path: str, payload: dict,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._call("POST", path, payload)

              def _call(
                  self,
                  method: str,
                  path: str,
                  payload: dict | None = None,
              ) -> tuple[bool, dict | None, str | None]:
                  if not self._base:
                      return (
                          False,
                          None,
                          "ZYRA_URL not set",
                      )
                  url = self._base + path
                  data = None
                  headers = {
                      "Accept": "application/json",
                  }
                  if payload is not None:
                      data = json.dumps(
                          payload
                      ).encode("utf-8")
                      headers["Content-Type"] = (
                          "application/json"
                      )
                  last_error = "unknown error"
                  for _attempt in range(
                      self._retries + 1
                  ):
                      request = urllib.request.Request(
                          url,
                          data=data,
                          headers=headers,
                          method=method,
                      )
                      try:
                          with (
                              urllib.request.urlopen(
                                  request,
                                  timeout=(
                                      self._timeout
                                  ),
                              )
                          ) as response:
                              body = response.read()
                          parsed = json.loads(
                              body.decode("utf-8")
                          )
                          if isinstance(
                              parsed, dict
                          ):
                              return (
                                  True,
                                  parsed,
                                  None,
                              )
                          return (
                              False,
                              None,
                              "non-dict response",
                          )
                      except (
                          urllib.error.HTTPError
                      ) as exc:
                          return (
                              False,
                              None,
                              "HTTP "
                              + str(exc.code),
                          )
                      except Exception as exc:
                          last_error = str(exc)
                  return (
                      False,
                      None,
                      last_error,
                  )
