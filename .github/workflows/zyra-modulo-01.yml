name: zyra-q3-mpe-hiring-e2e-v2

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-q3-mpe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9" "pytest-timeout>=2,<3"

      - name: Extend MpeStore migration 2 (proposals hires dynamic openings)
        run: |
          set -euo pipefail
          cat > apps/mi_primer_empleo/infrastructure/persistence/mpe_store.py <<'PYEOF'
          """MPE durable store - accounts, jobs, applications,
          proposals, hires with dynamic openings."""
          from __future__ import annotations

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "mpe",
                  (
                      "CREATE TABLE mpe_accounts ("
                      " account_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " role TEXT NOT NULL,"
                      " profession TEXT,"
                      " verified INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE mpe_jobs ("
                      " job_id TEXT PRIMARY KEY,"
                      " company_account TEXT NOT NULL,"
                      " title TEXT NOT NULL,"
                      " profession TEXT NOT NULL,"
                      " openings INTEGER NOT NULL,"
                      " status TEXT NOT NULL"
                      " DEFAULT 'open',"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE mpe_applications ("
                      " application_id TEXT PRIMARY"
                      " KEY,"
                      " job_id TEXT NOT NULL,"
                      " worker_account TEXT NOT NULL,"
                      " status TEXT NOT NULL"
                      " DEFAULT 'submitted',"
                      " created_at REAL NOT NULL)",
                  ),
              ),
              Migration(
                  2,
                  "mpe_hiring",
                  (
                      "CREATE TABLE mpe_proposals ("
                      " proposal_id TEXT PRIMARY KEY,"
                      " job_id TEXT NOT NULL,"
                      " company_account TEXT NOT NULL,"
                      " worker_account TEXT NOT NULL,"
                      " status TEXT NOT NULL"
                      " DEFAULT 'pending',"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE mpe_hires ("
                      " hire_id TEXT PRIMARY KEY,"
                      " job_id TEXT NOT NULL,"
                      " worker_account TEXT NOT NULL,"
                      " status TEXT NOT NULL"
                      " DEFAULT 'active',"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class MpeStore:
              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "mpe", _MIGRATIONS
                  ).run(clock)

              def add_account(
                  self,
                  *,
                  account_id: str,
                  zid: str | None,
                  name: str,
                  role: str,
                  profession: str | None,
              ) -> dict[str, object]:
                  if role not in (
                      "trabajador",
                      "empresa",
                  ):
                      raise ValueError(
                          f"unknown role: {role}"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO mpe_accounts"
                          " (account_id, zid, name,"
                          "  role, profession, verified,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, 0, ?)",
                          (
                              account_id,
                              zid,
                              name,
                              role,
                              profession,
                              now,
                          ),
                      )
                  return self.get_account(account_id)

              def mark_verified(
                  self, *, account_id: str
              ) -> None:
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE mpe_accounts SET"
                          " verified = 1"
                          " WHERE account_id = ?",
                          (account_id,),
                      )

              def get_account(
                  self, account_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM mpe_accounts"
                      " WHERE account_id = ?",
                      (account_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown account:"
                          f" {account_id}"
                      )
                  return self._account_row(row)

              def list_workers(
                  self, *, profession: str | None = None
              ) -> tuple[dict[str, object], ...]:
                  if profession is not None:
                      rows = self._db.query_all(
                          "SELECT * FROM mpe_accounts"
                          " WHERE role = 'trabajador'"
                          " AND profession = ?"
                          " ORDER BY created_at",
                          (profession,),
                      )
                  else:
                      rows = self._db.query_all(
                          "SELECT * FROM mpe_accounts"
                          " WHERE role = 'trabajador'"
                          " ORDER BY created_at"
                      )
                  return tuple(
                      self._account_row(r)
                      for r in rows
                  )

              def list_companies(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM mpe_accounts"
                      " WHERE role = 'empresa'"
                      " ORDER BY created_at"
                  )
                  return tuple(
                      self._account_row(r)
                      for r in rows
                  )

              def post_job(
                  self,
                  *,
                  job_id: str,
                  company_account: str,
                  title: str,
                  profession: str,
                  openings: int,
              ) -> dict[str, object]:
                  company = self.get_account(
                      company_account
                  )
                  if company.get("role") != "empresa":
                      raise ValueError(
                          "only companies can post"
                          " jobs"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO mpe_jobs"
                          " (job_id, company_account,"
                          "  title, profession,"
                          "  openings, status,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?,"
                          "  'open', ?)",
                          (
                              job_id,
                              company_account,
                              title,
                              profession,
                              openings,
                              now,
                          ),
                      )
                  row = self._db.query_one(
                      "SELECT * FROM mpe_jobs"
                      " WHERE job_id = ?",
                      (job_id,),
                  )
                  assert row is not None
                  return self._job_row(row)

              def list_jobs(
                  self, *, profession: str | None = None
              ) -> tuple[dict[str, object], ...]:
                  if profession is not None:
                      rows = self._db.query_all(
                          "SELECT * FROM mpe_jobs"
                          " WHERE status = 'open'"
                          " AND profession = ?"
                          " ORDER BY created_at",
                          (profession,),
                      )
                  else:
                      rows = self._db.query_all(
                          "SELECT * FROM mpe_jobs"
                          " WHERE status = 'open'"
                          " ORDER BY created_at"
                      )
                  return tuple(
                      self._job_row(r)
                      for r in rows
                  )

              def list_company_jobs(
                  self, *, company_account: str
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM mpe_jobs"
                      " WHERE company_account = ?"
                      " ORDER BY created_at",
                      (company_account,),
                  )
                  return tuple(
                      self._job_row(r)
                      for r in rows
                  )

              def apply(
                  self,
                  *,
                  application_id: str,
                  job_id: str,
                  worker_account: str,
              ) -> dict[str, object]:
                  worker = self.get_account(
                      worker_account
                  )
                  if (
                      worker.get("role")
                      != "trabajador"
                  ):
                      raise ValueError(
                          "only workers can apply"
                      )
                  row = self._db.query_one(
                      "SELECT * FROM mpe_jobs"
                      " WHERE job_id = ?"
                      " AND status = 'open'",
                      (job_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "job not open:"
                          f" {job_id}"
                      )
                  dup = self._db.query_one(
                      "SELECT 1 FROM"
                      " mpe_applications WHERE"
                      " job_id = ? AND"
                      " worker_account = ?",
                      (job_id, worker_account),
                  )
                  if dup is not None:
                      raise ValueError(
                          "already applied"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " mpe_applications"
                          " (application_id, job_id,"
                          "  worker_account, status,"
                          "  created_at)"
                          " VALUES (?, ?, ?,"
                          "  'submitted', ?)",
                          (
                              application_id,
                              job_id,
                              worker_account,
                              now,
                          ),
                      )
                  return {
                      "application_id": (
                          application_id
                      ),
                      "job_id": job_id,
                      "worker": worker_account,
                      "status": "submitted",
                  }

              def applications_for(
                  self, *, job_id: str
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM"
                      " mpe_applications"
                      " WHERE job_id = ?"
                      " ORDER BY created_at",
                      (job_id,),
                  )
                  return tuple(
                      {
                          "application_id": str(
                              r["application_id"]
                          ),
                          "job_id": str(
                              r["job_id"]
                          ),
                          "worker_account": str(
                              r["worker_account"]
                          ),
                          "status": str(
                              r["status"]
                          ),
                      }
                      for r in rows
                  )

              def _job_row_by_id(
                  self, job_id: str,
              ):
                  return self._db.query_one(
                      "SELECT * FROM mpe_jobs"
                      " WHERE job_id = ?",
                      (job_id,),
                  )

              def _active_hires_count(
                  self, job_id: str,
              ) -> int:
                  row = self._db.query_one(
                      "SELECT COUNT(*) AS n"
                      " FROM mpe_hires"
                      " WHERE job_id = ?"
                      " AND status = 'active'",
                      (job_id,),
                  )
                  if row is None:
                      return 0
                  return int(row["n"])

              def job_status(
                  self, *, job_id: str,
              ) -> dict[str, object]:
                  row = self._job_row_by_id(job_id)
                  if row is None:
                      raise LookupError(
                          "unknown job:"
                          f" {job_id}"
                      )
                  job = self._job_row(row)
                  openings = int(job["openings"])
                  active = (
                      self._active_hires_count(
                          job_id
                      )
                  )
                  return {
                      "job_id": job_id,
                      "title": job["title"],
                      "profession": job[
                          "profession"
                      ],
                      "company_account": job[
                          "company_account"
                      ],
                      "openings": openings,
                      "hired": active,
                      "remaining": max(
                          openings - active, 0
                      ),
                      "status": job["status"],
                  }

              def create_proposal(
                  self,
                  *,
                  proposal_id: str,
                  job_id: str,
                  company_account: str,
                  worker_account: str,
              ) -> dict[str, object]:
                  company = self.get_account(
                      company_account
                  )
                  if (
                      company.get("role")
                      != "empresa"
                  ):
                      raise ValueError(
                          "only companies can"
                          " send proposals"
                      )
                  worker = self.get_account(
                      worker_account
                  )
                  if (
                      worker.get("role")
                      != "trabajador"
                  ):
                      raise ValueError(
                          "only workers can"
                          " receive proposals"
                      )
                  job_row = self._job_row_by_id(
                      job_id
                  )
                  if job_row is None:
                      raise LookupError(
                          "unknown job:"
                          f" {job_id}"
                      )
                  job = self._job_row(job_row)
                  if job["status"] != "open":
                      raise ValueError(
                          "job not open"
                      )
                  if (
                      worker.get("profession")
                      != job["profession"]
                  ):
                      raise ValueError(
                          "profession mismatch"
                      )
                  dup = self._db.query_one(
                      "SELECT 1 FROM"
                      " mpe_proposals WHERE"
                      " job_id = ? AND"
                      " worker_account = ? AND"
                      " status = 'pending'",
                      (job_id, worker_account),
                  )
                  if dup is not None:
                      raise ValueError(
                          "proposal already"
                          " pending"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " mpe_proposals"
                          " (proposal_id, job_id,"
                          "  company_account,"
                          "  worker_account,"
                          "  status, created_at)"
                          " VALUES (?, ?, ?, ?,"
                          "  'pending', ?)",
                          (
                              proposal_id,
                              job_id,
                              company_account,
                              worker_account,
                              now,
                          ),
                      )
                  return {
                      "proposal_id": proposal_id,
                      "job_id": job_id,
                      "worker_account": (
                          worker_account
                      ),
                      "status": "pending",
                  }

              def list_proposals(
                  self,
                  *,
                  worker_account: str | None = None,
                  job_id: str | None = None,
                  status: str | None = "pending",
              ) -> tuple[dict[str, object], ...]:
                  sql = (
                      "SELECT * FROM"
                      " mpe_proposals WHERE 1=1"
                  )
                  params: list[object] = []
                  if worker_account is not None:
                      sql += (
                          " AND worker_account = ?"
                      )
                      params.append(
                          worker_account
                      )
                  if job_id is not None:
                      sql += " AND job_id = ?"
                      params.append(job_id)
                  if status is not None:
                      sql += " AND status = ?"
                      params.append(status)
                  sql += " ORDER BY created_at"
                  rows = self._db.query_all(
                      sql, tuple(params)
                  )
                  return tuple(
                      {
                          "proposal_id": str(
                              r["proposal_id"]
                          ),
                          "job_id": str(
                              r["job_id"]
                          ),
                          "company_account": str(
                              r[
                                  "company_account"
                              ]
                          ),
                          "worker_account": str(
                              r[
                                  "worker_account"
                              ]
                          ),
                          "status": str(
                              r["status"]
                          ),
                      }
                      for r in rows
                  )

              def decide_proposal(
                  self,
                  *,
                  proposal_id: str,
                  accepted: bool,
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " mpe_proposals WHERE"
                      " proposal_id = ?",
                      (proposal_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown proposal:"
                          f" {proposal_id}"
                      )
                  if str(row["status"]) != "pending":
                      raise ValueError(
                          "proposal already"
                          " decided"
                      )
                  job_id = str(row["job_id"])
                  worker_account = str(
                      row["worker_account"]
                  )
                  if accepted:
                      job_row = (
                          self._job_row_by_id(
                              job_id
                          )
                      )
                      if job_row is None:
                          raise LookupError(
                              "unknown job:"
                              f" {job_id}"
                          )
                      if (
                          str(job_row["status"])
                          != "open"
                      ):
                          raise ValueError(
                              "job not open"
                          )
                      if (
                          self
                          ._active_hires_count(
                              job_id
                          )
                          >= int(
                              job_row["openings"]
                          )
                      ):
                          raise ValueError(
                              "no openings left"
                          )
                      new_status = "accepted"
                  else:
                      new_status = "rejected"
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE mpe_proposals"
                          " SET status = ?"
                          " WHERE proposal_id = ?",
                          (
                              new_status,
                              proposal_id,
                          ),
                      )
                  result: dict[str, object] = {
                      "proposal_id": proposal_id,
                      "status": new_status,
                      "job_id": job_id,
                      "worker_account": (
                          worker_account
                      ),
                  }
                  if accepted:
                      hire_id = (
                          "HIR-"
                          + proposal_id[5:]
                      )
                      hire = self.hire_worker(
                          hire_id=hire_id,
                          job_id=job_id,
                          worker_account=(
                              worker_account
                          ),
                      )
                      result["hire"] = hire
                  return result

              def hire_worker(
                  self,
                  *,
                  hire_id: str,
                  job_id: str,
                  worker_account: str,
              ) -> dict[str, object]:
                  worker = self.get_account(
                      worker_account
                  )
                  if (
                      worker.get("role")
                      != "trabajador"
                  ):
                      raise ValueError(
                          "only workers can be"
                          " hired"
                      )
                  job_row = self._job_row_by_id(
                      job_id
                  )
                  if job_row is None:
                      raise LookupError(
                          "unknown job:"
                          f" {job_id}"
                      )
                  if (
                      str(job_row["status"])
                      != "open"
                  ):
                      raise ValueError(
                          "job not open"
                      )
                  if (
                      worker.get("profession")
                      != str(
                          job_row["profession"]
                      )
                  ):
                      raise ValueError(
                          "profession mismatch"
                      )
                  if (
                      self._active_hires_count(
                          job_id
                      )
                      >= int(job_row["openings"])
                  ):
                      raise ValueError(
                          "no openings left"
                      )
                  dup = self._db.query_one(
                      "SELECT 1 FROM mpe_hires"
                      " WHERE job_id = ? AND"
                      " worker_account = ? AND"
                      " status = 'active'",
                      (job_id, worker_account),
                  )
                  if dup is not None:
                      raise ValueError(
                          "already hired"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO mpe_hires"
                          " (hire_id, job_id,"
                          "  worker_account,"
                          "  status, created_at)"
                          " VALUES (?, ?, ?,"
                          "  'active', ?)",
                          (
                              hire_id,
                              job_id,
                              worker_account,
                              now,
                          ),
                      )
                  active = (
                      self._active_hires_count(
                          job_id
                      )
                  )
                  openings = int(
                      job_row["openings"]
                  )
                  filled = active >= openings
                  if filled:
                      with (
                          self._db.transaction()
                      ) as cursor:
                          cursor.execute(
                              "UPDATE mpe_jobs"
                              " SET status ="
                              " 'filled'"
                              " WHERE job_id = ?",
                              (job_id,),
                          )
                  return {
                      "hire_id": hire_id,
                      "job_id": job_id,
                      "worker_account": (
                          worker_account
                      ),
                      "hired": active,
                      "remaining": max(
                          openings - active, 0
                      ),
                      "job_status": (
                          "filled"
                          if filled
                          else "open"
                      ),
                  }

              def worker_leaves(
                  self,
                  *,
                  job_id: str,
                  worker_account: str,
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM mpe_hires"
                      " WHERE job_id = ? AND"
                      " worker_account = ? AND"
                      " status = 'active'",
                      (job_id, worker_account),
                  )
                  if row is None:
                      raise LookupError(
                          "no active hire for"
                          " this job and worker"
                      )
                  hire_id = str(row["hire_id"])
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE mpe_hires SET"
                          " status = 'left'"
                          " WHERE hire_id = ?",
                          (hire_id,),
                      )
                  job_row = self._job_row_by_id(
                      job_id
                  )
                  reopened = False
                  if (
                      job_row is not None
                      and str(job_row["status"])
                      == "filled"
                  ):
                      with (
                          self._db.transaction()
                      ) as cursor:
                          cursor.execute(
                              "UPDATE mpe_jobs"
                              " SET status ="
                              " 'open'"
                              " WHERE job_id = ?",
                              (job_id,),
                          )
                      reopened = True
                  active = (
                      self._active_hires_count(
                          job_id
                      )
                  )
                  openings = (
                      int(job_row["openings"])
                      if job_row is not None
                      else 0
                  )
                  return {
                      "job_id": job_id,
                      "worker_account": (
                          worker_account
                      ),
                      "hired": active,
                      "remaining": max(
                          openings - active, 0
                      ),
                      "status": (
                          "open"
                          if reopened
                          else (
                              str(
                                  job_row[
                                      "status"
                                  ]
                              )
                              if job_row
                              is not None
                              else "open"
                          )
                      ),
                      "reopened": reopened,
                  }

              def hires_for(
                  self,
                  *,
                  job_id: str | None = None,
                  worker_account: str | None = None,
                  status: str | None = "active",
              ) -> tuple[dict[str, object], ...]:
                  sql = (
                      "SELECT * FROM mpe_hires"
                      " WHERE 1=1"
                  )
                  params: list[object] = []
                  if job_id is not None:
                      sql += " AND job_id = ?"
                      params.append(job_id)
                  if worker_account is not None:
                      sql += (
                          " AND worker_account = ?"
                      )
                      params.append(
                          worker_account
                      )
                  if status is not None:
                      sql += " AND status = ?"
                      params.append(status)
                  sql += " ORDER BY created_at"
                  rows = self._db.query_all(
                      sql, tuple(params)
                  )
                  return tuple(
                      {
                          "hire_id": str(
                              r["hire_id"]
                          ),
                          "job_id": str(
                              r["job_id"]
                          ),
                          "worker_account": str(
                              r[
                                  "worker_account"
                              ]
                          ),
                          "status": str(
                              r["status"]
                          ),
                      }
                      for r in rows
                  )

              def summary(self) -> dict[str, object]:
                  accounts = self._db.query_one(
                      "SELECT COUNT(*) AS total,"
                      " SUM(verified) AS verified"
                      " FROM mpe_accounts"
                  )
                  roles = self._db.query_all(
                      "SELECT role, COUNT(*) AS n"
                      " FROM mpe_accounts"
                      " GROUP BY role"
                  )
                  jobs = self._db.query_one(
                      "SELECT COUNT(*) AS open_jobs"
                      " FROM mpe_jobs"
                      " WHERE status = 'open'"
                  )
                  apps = self._db.query_one(
                      "SELECT COUNT(*) AS total"
                      " FROM mpe_applications"
                  )
                  hires = self._db.query_one(
                      "SELECT COUNT(*) AS total"
                      " FROM mpe_hires"
                      " WHERE status = 'active'"
                  )
                  props = self._db.query_one(
                      "SELECT COUNT(*) AS total"
                      " FROM mpe_proposals"
                      " WHERE status = 'pending'"
                  )
                  by_role = {
                      str(r["role"]): int(r["n"])
                      for r in roles
                  }
                  total = 0
                  verified = 0
                  if accounts is not None:
                      total = int(
                          accounts["total"]
                      )
                      if (
                          accounts["verified"]
                          is not None
                      ):
                          verified = int(
                              accounts[
                                  "verified"
                              ]
                          )
                  return {
                      "accounts_total": total,
                      "accounts_verified": (
                          verified
                      ),
                      "by_role": by_role,
                      "open_jobs": int(
                          jobs["open_jobs"]
                      )
                      if jobs is not None
                      else 0,
                      "applications_total": int(
                          apps["total"]
                      )
                      if apps is not None
                      else 0,
