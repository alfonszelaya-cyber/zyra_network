name: zyra-w14-engine-reputation

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w14-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Clean engine init (W391)
        run: |
          set -euo pipefail
          f="shared_engines/reputation/__init__.py"
          [ -f "$f" ] && printf '"""ZYRA Network engine package."""\n' > "$f"
          echo "init cleaned"

      - name: Fill reputation engine (evidence-backed scoring)
        run: |
          set -euo pipefail
          cat > shared_engines/reputation/errors.py <<'PYEOF'
          """Typed reputation errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
          )


          class SelfReputationError(EngineError):
              """An entity cannot rate itself."""


          class UnknownEntityError(EngineError):
              """Subject or actor identity unknown."""


          class EmptyEvidenceError(EngineError):
              """Evidence bytes are required."""
          PYEOF

          cat > shared_engines/reputation/contracts.py <<'PYEOF'
          """Reputation contracts."""
          from __future__ import annotations

          from dataclasses import dataclass

          KIND_POSITIVE = "positive"
          KIND_NEGATIVE = "negative"

          EVENT_KINDS = (
              KIND_POSITIVE,
              KIND_NEGATIVE,
          )


          @dataclass(frozen=True)
          class ReputationEvent:
              """One evidence-backed reputation event."""

              event_id: str
              seq: int
              subject_zid: str
              actor_zid: str
              kind: str
              weight: float
              evidence_sha: str
              proof_id: str
              created_at: float


          @dataclass(frozen=True)
          class ReputationSummary:
              """Computed, evidence-backed state."""

              subject_zid: str
              score: int
              positive_events: int
              negative_events: int
              last_event_at: float | None
          PYEOF

          cat > shared_engines/reputation/policy.py <<'PYEOF'
          """Reputation policy: explicit, inspectable rules.

          Score is NEVER a magic increment: every event
          contributes weight * sign, decayed by a half-life.
          The policy is a frozen value injected at
          construction, so different deployments can use
          different rules while the arithmetic stays
          transparent and auditable.
          """
          from __future__ import annotations

          from dataclasses import dataclass

          from shared_engines.common.validation import (
              require_positive_number,
          )


          @dataclass(frozen=True)
          class ReputationPolicy:
              """Scoring rules (all positive numbers)."""

              weight_per_event: float = 10.0
              half_life_seconds: float = 100.0

              def __post_init__(self) -> None:
                  require_positive_number(
                      self.weight_per_event,
                      "weight_per_event",
                  )
                  require_positive_number(
                      self.half_life_seconds,
                      "half_life_seconds",
                  )

              def decay_factor(
                  self,
                  *,
                  age_seconds: float,
              ) -> float:
                  """0.5 ** (age / half_life): fresh
                  evidence counts fully; old evidence
                  fades, never below zero contribution
                  magnitude."""
                  if age_seconds <= 0.0:
                      return 1.0
                  return 2.0 ** (
                      -age_seconds
                      / self.half_life_seconds
                  )
          PYEOF

          cat > shared_engines/reputation/engine.py <<'PYEOF'
          """Reputation engine: evidence -> score, nothing
          else.

          Flow per event:

              actor (another ZID, never self)
                    |
                    v
              evidence bytes (real content)
                    |
                    v
              IntegrityEngine.issue_proof
              (durable, verifiable SHA-256)
                    |
                    v
              reputation_events append-only row
              (seq per subject, evidence_sha, proof_id)
                    |
                    v
              score = sum(sign * weight
                          * decay(age))
              (policy-driven, transparent)

          Guarantees:

          - No self-rating: actor != subject, both must
            be known identities.
          - Evidence inmutable: every event carries a
            verifiable integrity proof id; the evidence
            hash is stored, so tampering with history
            is detectable by recomputing.
          - Deterministic score: pure function of the
            event list, the policy and the clock.
          - Every event is audited and emitted as
            reputation.event.recorded.

          Deliberately separate from TokenLedger: tokens
          are spendable currency; reputation is earned
          trust with evidence and time decay.
          """
          from __future__ import annotations

          import hashlib
          import sqlite3

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              NotFoundError,
          )
          from shared_engines.common.identifiers import (
              new_id,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
          )
          from shared_engines.common.validation import (
              require_non_empty_str,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.engine import (
              IdentityEngine,
          )
          from shared_engines.integrity.engine import (
              IntegrityEngine,
          )
          from shared_engines.reputation.contracts import (
              EVENT_KINDS,
              KIND_NEGATIVE,
              KIND_POSITIVE,
              ReputationEvent,
              ReputationSummary,
          )
          from shared_engines.reputation.errors import (
              EmptyEvidenceError,
              SelfReputationError,
              UnknownEntityError,
          )
          from shared_engines.reputation.policy import (
              ReputationPolicy,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          EVENT_RECORDED = (
              "reputation.event.recorded"
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "reputation_events",
                  (
                      "CREATE TABLE"
                      " reputation_events ("
                      " event_id TEXT PRIMARY KEY,"
                      " seq INTEGER NOT NULL,"
                      " subject_zid TEXT NOT NULL,"
                      " actor_zid TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " weight REAL NOT NULL,"
                      " evidence_sha TEXT NOT NULL,"
                      " proof_id TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                      "CREATE INDEX rep_subject"
                      " ON reputation_events"
                      " (subject_zid, seq)",
                  ),
              ),
          )


          class ReputationEngine:
              """Evidence-backed trust scoring."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  identity: IdentityEngine,
                  integrity: IntegrityEngine,
                  audit: AuditTrail,
                  outbox: Outbox,
                  policy: ReputationPolicy
                  | None = None,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._identity = identity
                  self._integrity = integrity
                  self._audit = audit
                  self._outbox = outbox
                  self._policy = (
                      policy or ReputationPolicy()
                  )
                  MigrationRunner(
                      db,
                      "reputation",
                      _MIGRATIONS,
                  ).run(clock)

              def _emit(
                  self,
                  cursor: sqlite3.Cursor,
                  *,
                  subject_zid: str,
                  event_id: str,
                  kind: str,
              ) -> None:
                  uid = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "e": event_id,
                              "u": new_id(),
                          }
                      ).encode("utf-8")
                  ).hexdigest()[:32]
                  fp = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "id": uid,
                              "ty": EVENT_RECORDED,
                          }
                      ).encode("utf-8")
                  ).hexdigest()
                  cursor.execute(
                      "INSERT INTO events_outbox"
                      " (event_id, event_type,"
                      " aggregate_id, schema_version,"
                      " envelope_version, created_at,"
                      " payload, fingerprint,"
                      " published_at)"
                      " VALUES (?, ?, ?, 1, 1, ?, ?,"
                      " ?, NULL)",
                      (
                          uid,
                          EVENT_RECORDED,
                          subject_zid,
                          self._clock.now(),
                          canonical_json_dumps(
                              {
                                  "event_id": event_id,
                                  "kind": kind,
                              }
                          ),
                          fp,
                      ),
                  )

              def record_event(
                  self,
                  *,
                  subject_zid: str,
                  actor_zid: str,
                  kind: str,
                  evidence: bytes,
              ) -> ReputationEvent:
                  """One evidence-backed reputation
                  event. Refuses self-rating, unknown
                  entities, empty evidence and unknown
                  kinds."""
                  require_non_empty_str(
                      subject_zid, "subject_zid"
                  )
                  require_non_empty_str(
                      actor_zid, "actor_zid"
                  )
                  if kind not in EVENT_KINDS:
                      raise ValueError(
                          f"unknown kind: {kind}"
                      )
                  if actor_zid == subject_zid:
                      raise SelfReputationError(
                          "an entity cannot rate"
                          " itself"
                      )
                  if not evidence:
                      raise EmptyEvidenceError(
                          "evidence bytes required"
                      )
                  try:
                      self._identity.require_identity(
                          subject_zid
                      )
                  except Exception as exc:
                      raise UnknownEntityError(
                          "unknown subject:"
                          f" {subject_zid}"
                      ) from exc
                  try:
                      self._identity.require_identity(
                          actor_zid
                      )
                  except Exception as exc:
                      raise UnknownEntityError(
                          "unknown actor:"
                          f" {actor_zid}"
                      ) from exc
                  event_id = f"REP-{new_id()}"
                  proof = self._integrity.issue_proof(
                      subject=event_id,
                      data=evidence,
                  )
                  evidence_sha = (
                      self._integrity.digest_bytes(
                          evidence
                      )
                  )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      row = cursor.execute(
                          "SELECT COALESCE(MAX(seq),"
                          " 0) AS last FROM"
                          " reputation_events"
                          " WHERE subject_zid = ?",
                          (subject_zid,),
                      ).fetchone()
                      seq = (
                          int(row["last"]) + 1
                          if row is not None
                          else 1
                      )
                      cursor.execute(
                          "INSERT INTO"
                          " reputation_events"
                          " (event_id, seq,"
                          "  subject_zid, actor_zid,"
                          "  kind, weight,"
                          "  evidence_sha, proof_id,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?,"
                          "  ?, ?, ?)",
                          (
                              event_id,
                              seq,
                              subject_zid,
                              actor_zid,
                              kind,
                              self._policy
                              .weight_per_event,
                              evidence_sha,
                              proof.proof_id,
                              now,
                          ),
                      )
                      self._emit(
                          cursor,
                          subject_zid=subject_zid,
                          event_id=event_id,
                          kind=kind,
                      )
                  self._audit.append(
                      event_type=EVENT_RECORDED,
                      actor=actor_zid,
                      subject=subject_zid,
                      payload={
                          "event_id": event_id,
                          "kind": kind,
                          "proof_id": (
                              proof.proof_id
                          ),
                      },
                  )
                  return ReputationEvent(
                      event_id=event_id,
                      seq=seq,
                      subject_zid=subject_zid,
                      actor_zid=actor_zid,
                      kind=kind,
                      weight=self._policy
                      .weight_per_event,
                      evidence_sha=evidence_sha,
                      proof_id=proof.proof_id,
                      created_at=now,
                  )

              def _events(
                  self, *, subject_zid: str
              ) -> tuple[ReputationEvent, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM"
                      " reputation_events"
                      " WHERE subject_zid = ?"
                      " ORDER BY seq",
                      (subject_zid,),
                  )
                  return tuple(
                      ReputationEvent(
                          event_id=str(
                              r["event_id"]
                          ),
                          seq=int(r["seq"]),
                          subject_zid=str(
                              r["subject_zid"]
                          ),
                          actor_zid=str(
                              r["actor_zid"]
                          ),
                          kind=str(r["kind"]),
                          weight=float(
                              r["weight"]
                          ),
                          evidence_sha=str(
                              r["evidence_sha"]
                          ),
                          proof_id=str(
                              r["proof_id"]
                          ),
                          created_at=float(
                              r["created_at"]
                          ),
                      )
                      for r in rows
                  )

              def score(
                  self, *, subject_zid: str
              ) -> int:
                  """Deterministic decayed score:
                  sum(sign * weight * decay(age)),
                  floored at zero."""
                  require_non_empty_str(
                      subject_zid, "subject_zid"
                  )
                  now = self._clock.now()
                  total = 0.0
                  for ev in self._events(
                      subject_zid=subject_zid
                  ):
                      age = max(
                          0.0,
                          now - ev.created_at,
                      )
                      factor = (
                          self._policy.decay_factor(
                              age_seconds=age
                          )
                      )
                      sign = (
                          1.0
                          if ev.kind == KIND_POSITIVE
                          else -1.0
                      )
                      total += (
                          sign
                          * self._policy
                          .weight_per_event
                          * factor
                      )
                  return max(0, int(round(total)))

              def summary(
                  self, *, subject_zid: str
              ) -> ReputationSummary:
                  events = self._events(
                      subject_zid=subject_zid
                  )
                  positives = sum(
                      1
                      for e in events
                      if e.kind == KIND_POSITIVE
                  )
                  negatives = sum(
                      1
                      for e in events
                      if e.kind == KIND_NEGATIVE
                  )
                  last = (
                      max(
                          e.created_at
                          for e in events
                      )
                      if events
                      else None
                  )
                  return ReputationSummary(
                      subject_zid=subject_zid,
                      score=self.score(
                          subject_zid=subject_zid
                      ),
                      positive_events=positives,
                      negative_events=negatives,
                      last_event_at=last,
                  )

              def verify_evidence(
                  self,
                  *,
                  event_id: str,
                  evidence: bytes,
              ) -> bool:
                  """Re-verify historic evidence against
                  its stored integrity proof."""
                  row = self._db.query_one(
                      "SELECT proof_id FROM"
                      " reputation_events"
                      " WHERE event_id = ?",
                      (event_id,),
                  )
                  if row is None:
                      raise NotFoundError(
                          "unknown reputation"
                          f" event: {event_id}"
                      )
                  return (
                      self._integrity.verify_proof(
                          proof_id=str(
                              row["proof_id"]
                          ),
                          data=evidence,
                      )
                  )
          PYEOF
          echo "=== REPUTATION ENGINE READY ==="

      - name: Reputation proofs (4)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/reputation/tests
          cat > shared_engines/reputation/tests/test_reputation.py <<'PYEOF'
          """Reputation proofs: evidence-backed scoring,
          self-rating refused, mixed signs, temporal decay,
          evidence re-verification."""
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.events.contracts import (
              EventCatalog,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              IdentityKind,
          )
          from shared_engines.identity.engine import (
              IdentityEngine,
          )
          from shared_engines.integrity.engine import (
              IntegrityEngine,
          )
          from shared_engines.reputation.engine import (
              ReputationEngine,
          )
          from shared_engines.reputation.errors import (
              EmptyEvidenceError,
              SelfReputationError,
              UnknownEntityError,
          )
          from shared_engines.reputation.policy import (
              ReputationPolicy,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )
          from shared_engines.telemetry.collector import (
              TelemetryCollector,
          )


          class _Net:
              def __init__(
                  self, tmp_path: Path
              ) -> None:
                  self.db = SQLiteAdapter(
                      tmp_path / "net.db"
                  )
                  self.clock = FrozenClock()
                  self.audit = AuditTrail(
                      self.db, self.clock
                  )
                  self.outbox = Outbox(
                      self.db, self.clock
                  )
                  self.outbox.ensure_schema()
                  self.catalog = EventCatalog()
                  for et in (
                      "identity.registered",
                      "identity.status_changed",
                      "reputation.event.recorded",
                  ):
                      self.catalog.register(et)
                  self.identity = IdentityEngine(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                  )
                  self.integrity = IntegrityEngine(
                      self.db, self.clock
                  )
                  self.telemetry = TelemetryCollector(
                      self.db, self.clock
                  )
                  self.policy = ReputationPolicy(
                      weight_per_event=10.0,
                      half_life_seconds=100.0,
                  )
                  self.reputation = ReputationEngine(
                      self.db,
                      self.clock,
                      identity=self.identity,
                      integrity=self.integrity,
                      audit=self.audit,
                      outbox=self.outbox,
                      policy=self.policy,
                  )

              def person(
                  self, name: str
              ) -> str:
                  identity = (
                      self.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name=name,
                          actor="bootstrap",
                      )
                  )
                  return identity.zid

              def close(self) -> None:
                  self.db.close()


          def test_evidence_backed_score(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  employer = net.person("employer")
                  worker = net.person("worker")
                  evidence = (
                      b"contract 2026 signed"
                  )
                  event = net.reputation.record_event(
                      subject_zid=worker,
                      actor_zid=employer,
                      kind="positive",
                      evidence=evidence,
                  )
                  assert event.seq == 1
                  summary = (
                      net.reputation.summary(
                          subject_zid=worker
                      )
                  )
                  assert summary.score == 10
                  assert (
                      summary.positive_events == 1
                  )
                  assert (
                      summary.negative_events == 0
                  )
                  assert (
                      net.reputation.verify_evidence(
                          event_id=event.event_id,
                          evidence=evidence,
                      )
                      is True
                  )
                  assert (
                      net.reputation.verify_evidence(
                          event_id=event.event_id,
                          evidence=b"faked",
                      )
                      is False
                  )
                  net.telemetry.ingest_outbox(
                      net.outbox
                  )
                  events = (
                      net.telemetry.query_events(
                          event_type=(
                              "reputation.event"
                              ".recorded"
                          )
                      )
                  )
                  assert len(events) >= 1
              finally:
                  net.close()


          def test_self_rating_and_unknown_refused(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  worker = net.person("worker")
                  with pytest.raises(
                      SelfReputationError
                  ):
                      net.reputation.record_event(
                          subject_zid=worker,
                          actor_zid=worker,
                          kind="positive",
                          evidence=b"self",
                      )
                  with pytest.raises(
                      UnknownEntityError
                  ):
                      net.reputation.record_event(
                          subject_zid=worker,
                          actor_zid="ZID-ghost",
                          kind="positive",
                          evidence=b"e",
                      )
                  employer = net.person("employer")
                  with pytest.raises(
                      EmptyEvidenceError
                  ):
                      net.reputation.record_event(
                          subject_zid=worker,
                          actor_zid=employer,
                          kind="positive",
                          evidence=b"",
                      )
                  with pytest.raises(ValueError):
                      net.reputation.record_event(
                          subject_zid=worker,
                          actor_zid=employer,
                          kind="magical",
                          evidence=b"e",
                      )
                  assert (
                      net.reputation.summary(
                          subject_zid=worker
                      ).score
                      == 0
                  )
              finally:
                  net.close()


          def test_mixed_signs_cancel(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  a = net.person("a")
                  b = net.person("b")
                  c = net.person("c")
                  worker = net.person("worker")
                  net.reputation.record_event(
                      subject_zid=worker,
                      actor_zid=a,
                      kind="positive",
                      evidence=b"good-1",
                  )
                  net.reputation.record_event(
                      subject_zid=worker,
                      actor_zid=b,
                      kind="positive",
                      evidence=b"good-2",
                  )
                  net.reputation.record_event(
                      subject_zid=worker,
                      actor_zid=c,
                      kind="negative",
                      evidence=b"breach",
                  )
                  summary = (
                      net.reputation.summary(
                          subject_zid=worker
                      )
                  )
                  assert summary.score == 10
                  assert (
                      summary.positive_events == 2
                  )
                  assert (
                      summary.negative_events == 1
                  )
                  assert (
                      summary.last_event_at
                      is not None
                  )
              finally:
                  net.close()


          def test_decay_over_time(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  employer = net.person("employer")
                  worker = net.person("worker")
                  net.reputation.record_event(
                      subject_zid=worker,
                      actor_zid=employer,
                      kind="positive",
                      evidence=b"fresh",
                  )
                  assert (
                      net.reputation.score(
                          subject_zid=worker
                      )
                      == 10
                  )
                  net.clock.advance(100)
                  assert (
                      net.reputation.score(
                          subject_zid=worker
                      )
                      == 5
                  )
                  net.clock.advance(100)
                  faded = net.reputation.score(
                      subject_zid=worker
                  )
                  assert faded < 6
                  assert faded >= 2
              finally:
                  net.close()
          PYEOF
          echo "=== REPUTATION TESTS READY ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs shared_engines/consensus shared_engines/integrity shared_engines/encryption shared_engines/certification shared_engines/search shared_engines/reputation"
          python -m compileall -q $M main.py scripts shared_engines/tests
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M shared_engines/tests tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: engine 6/17 reputation - evidence-backed scoring over IntegrityEngine (durable proof per event, verify_evidence), no self-rating, unknown entities refused, append-only per-subject ledger, deterministic decayed score (policy: weight * half-life), audited + outbox; separate from TokenLedger; 4 proofs"
