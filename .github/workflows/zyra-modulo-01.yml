name: zyra-w28-2-agro-tests

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w282-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Run ALL AGRO tests
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider apps/agro/tests/
          echo "ALL AGRO tests OK"
          find apps/agro -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W28-2 AGRO all tests pass with v3 server"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W28-2 COMPLETE: AGRO FULLY GREEN ==="
