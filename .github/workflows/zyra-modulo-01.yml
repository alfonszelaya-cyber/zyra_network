name: zyra-w9-engine-integrity

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Fill integrity engine (contracts, errors, engine)
        run: |
          set -euo pipefail
          cat > shared_engines/integrity/contracts.py <<'PYEOF'
          """Integrity contracts."""
          from __future__ import annotations

          from dataclasses import dataclass


          @dataclass(frozen=True)
          class IntegrityProof:
              """A durable, verifiable content proof."""

              proof_id: str
              subject: str
              algorithm: str
              digest: str
              size_bytes: int
              created_at: float
          PYEOF

          cat > shared_engines/integrity/errors.py <<'PYEOF'
          """Typed integrity errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
          )


          class UnsupportedAlgorithmError(
              EngineError
          ):
              """Requested digest algorithm is not
              available."""


          class ProofNotFoundError(EngineError):
              """No proof stored for the subject."""
          PYEOF

          cat > shared_engines/integrity/engine.py <<'PYEOF'
          """Integrity engine: hashing, durable proofs and
          tamper detection for content and files.

          Complements (never duplicates) the audit chain:
          the audit chain proves the ORDER of network
          events; this engine proves the CONTENT of data.
          An app stores a proof once, then can re-verify
          at any time that the bytes are still exactly the
          originals.

          Proofs are durable (SQLite) and recomputable:
          verify re-hashes the current bytes and compares
          against the stored digest. Any modification,
          however small, fails verification.
          """
          from __future__ import annotations

          import hashlib
          import sqlite3
          from pathlib import Path

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              NotFoundError,
          )
          from shared_engines.common.identifiers import (
              new_id,
          )
          from shared_engines.common.validation import (
              require_non_empty_str,
          )
          from shared_engines.integrity.contracts import (
              IntegrityProof,
          )
          from shared_engines.integrity.errors import (
              UnsupportedAlgorithmError,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          ALGORITHMS = {
              "sha256": hashlib.sha256,
              "sha512": hashlib.sha512,
          }

          _MIGRATIONS = (
              Migration(
                  1,
                  "integrity",
                  (
                      "CREATE TABLE integrity_proofs ("
                      " proof_id TEXT PRIMARY KEY,"
                      " subject TEXT NOT NULL,"
                      " algorithm TEXT NOT NULL,"
                      " digest TEXT NOT NULL,"
                      " size_bytes INTEGER NOT NULL,"
                      " created_at REAL NOT NULL)",
                      "CREATE INDEX integrity_subject"
                      " ON integrity_proofs"
                      " (subject, created_at)",
                  ),
              ),
          )


          class IntegrityEngine:
              """Content proofs with tamper detection."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  algorithm: str = "sha256",
              ) -> None:
                  if algorithm not in ALGORITHMS:
                      raise (
                          UnsupportedAlgorithmError(
                              "unsupported algorithm:"
                              f" {algorithm}"
                          )
                      )
                  self._db = db
                  self._clock = clock
                  self._algorithm = algorithm
                  self._hasher = ALGORITHMS[
                      algorithm
                  ]
                  MigrationRunner(
                      db, "integrity", _MIGRATIONS
                  ).run(clock)

              def digest_bytes(
                  self, data: bytes
              ) -> str:
                  return self._hasher(
                      data
                  ).hexdigest()

              def digest_file(
                  self, path: Path
              ) -> str:
                  """Streaming digest: constant memory
                  regardless of file size."""
                  digest = self._hasher()
                  with Path(path).open("rb") as fh:
                      for chunk in iter(
                          lambda: fh.read(
                              512 * 1024
                          ),
                          b"",
                      ):
                          digest.update(chunk)
                  return digest.hexdigest()

              def issue_proof(
                  self,
                  *,
                  subject: str,
                  data: bytes,
              ) -> IntegrityProof:
                  """Store a durable proof for content."""
                  require_non_empty_str(
                      subject, "subject"
                  )
                  digest = self.digest_bytes(data)
                  proof_id = f"PRF-{new_id()}"
                  created_at = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " integrity_proofs"
                          " (proof_id, subject,"
                          " algorithm, digest,"
                          " size_bytes, created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?)",
                          (
                              proof_id,
                              subject,
                              self._algorithm,
                              digest,
                              len(data),
                              created_at,
                          ),
                      )
                  return IntegrityProof(
                      proof_id=proof_id,
                      subject=subject,
                      algorithm=self._algorithm,
                      digest=digest,
                      size_bytes=len(data),
                      created_at=created_at,
                  )

              def get_proof(
                  self, *, proof_id: str
              ) -> IntegrityProof:
                  require_non_empty_str(
                      proof_id, "proof_id"
                  )
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " integrity_proofs"
                      " WHERE proof_id = ?",
                      (proof_id,),
                  )
                  if row is None:
                      raise NotFoundError(
                          "proof not found:"
                          f" {proof_id}"
                      )
                  return self._proof_from_row(row)

              def proofs_for(
                  self, *, subject: str
              ) -> tuple[IntegrityProof, ...]:
                  require_non_empty_str(
                      subject, "subject"
                  )
                  rows = self._db.query_all(
                      "SELECT * FROM"
                      " integrity_proofs"
                      " WHERE subject = ?"
                      " ORDER BY created_at DESC",
                      (subject,),
                  )
                  return tuple(
                      self._proof_from_row(row)
                      for row in rows
                  )

              def verify_proof(
                  self,
                  *,
                  proof_id: str,
                  data: bytes,
              ) -> bool:
                  """Re-hash the current bytes and
                  compare with the stored digest.
                  False means the content was altered
                  after the proof was issued."""
                  proof = self.get_proof(
                      proof_id=proof_id
                  )
                  if (
                      proof.algorithm
                      not in ALGORITHMS
                  ):
                      raise (
                          UnsupportedAlgorithmError(
                              "proof algorithm"
                              " unknown:"
                              f" {proof.algorithm}"
                          )
                      )
                  current = ALGORITHMS[
                      proof.algorithm
                  ](data).hexdigest()
                  return current == proof.digest

              def verify_latest(
                  self,
                  *,
                  subject: str,
                  data: bytes,
              ) -> bool:
                  """Verify against the most recent
                  proof of a subject. No proof at all
                  -> NotFoundError."""
                  proofs = self.proofs_for(
                      subject=subject
                  )
                  if not proofs:
                      raise NotFoundError(
                          "no proof for subject:"
                          f" {subject}"
                      )
                  return self.verify_proof(
                      proof_id=proofs[
                          0
                      ].proof_id,
                      data=data,
                  )

              @staticmethod
              def _proof_from_row(
                  row: sqlite3.Row,
              ) -> IntegrityProof:
                  return IntegrityProof(
                      proof_id=str(
                          row["proof_id"]
                      ),
                      subject=str(
                          row["subject"]
                      ),
                      algorithm=str(
                          row["algorithm"]
                      ),
                      digest=str(row["digest"]),
                      size_bytes=int(
                          row["size_bytes"]
                      ),
                      created_at=float(
                          row["created_at"]
                      ),
                  )
          PYEOF
          echo "=== INTEGRITY ENGINE READY ==="

      - name: Integrity proofs tests (4)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/integrity/tests
          cat > shared_engines/integrity/tests/test_integrity.py <<'PYEOF'
          """Integrity proofs: deterministic digests,
          streaming file hashing, tamper detection and
          unknown-proof errors."""
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          import pytest

          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.common.errors import (
              NotFoundError,
          )
          from shared_engines.integrity.engine import (
              IntegrityEngine,
          )
          from shared_engines.integrity.errors import (
              UnsupportedAlgorithmError,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )


          def _engine(
              tmp_path: Path,
          ) -> tuple[
              SQLiteAdapter,
              IntegrityEngine,
              FrozenClock,
          ]:
              db = SQLiteAdapter(
                  tmp_path / "integrity.db"
              )
              clock = FrozenClock()
              engine = IntegrityEngine(db, clock)
              return db, engine, clock


          def test_deterministic_digest(
              tmp_path: Path,
          ) -> None:
              db, engine, clock = _engine(tmp_path)
              try:
                  d1 = engine.digest_bytes(
                      b"zyra network"
                  )
                  d2 = engine.digest_bytes(
                      b"zyra network"
                  )
                  assert d1 == d2
                  assert (
                      d1
                      == hashlib.sha256(
                          b"zyra network"
                      ).hexdigest()
                  )
                  d3 = engine.digest_bytes(
                      b"zyra network "
                  )
                  assert d3 != d1
              finally:
                  db.close()


          def test_file_digest_streams(
              tmp_path: Path,
          ) -> None:
              db, engine, clock = _engine(tmp_path)
              try:
                  blob = tmp_path / "doc.bin"
                  payload = b"patient record" * 10_000
                  blob.write_bytes(payload)
                  assert (
                      engine.digest_file(blob)
                      == hashlib.sha256(
                          payload
                      ).hexdigest()
                  )
              finally:
                  db.close()


          def test_issue_and_verify_detects_tampering(
              tmp_path: Path,
          ) -> None:
              db, engine, clock = _engine(tmp_path)
              try:
                  original = (
                      b"birth record: Bebe Perez"
                  )
                  proof = engine.issue_proof(
                      subject="doc-1",
                      data=original,
                  )
                  assert (
                      engine.verify_proof(
                          proof_id=proof.proof_id,
                          data=original,
                      )
                      is True
                  )
                  altered = (
                      b"birth record: Faked Name"
                  )
                  assert (
                      engine.verify_proof(
                          proof_id=proof.proof_id,
                          data=altered,
                      )
                      is False
                  )
                  assert (
                      engine.verify_latest(
                          subject="doc-1",
                          data=original,
                      )
                      is True
                  )
                  assert (
                      engine.verify_latest(
                          subject="doc-1",
                          data=altered,
                      )
                      is False
                  )
              finally:
                  db.close()


          def test_unknown_proof_and_algorithm(
              tmp_path: Path,
          ) -> None:
              db, engine, clock = _engine(tmp_path)
              try:
                  with pytest.raises(
                      NotFoundError
                  ):
                      engine.verify_proof(
                          proof_id="PRF-nope",
                          data=b"x",
                      )
                  with pytest.raises(
                      NotFoundError
                  ):
                      engine.verify_latest(
                          subject="ghost",
                          data=b"x",
                      )
                  with pytest.raises(
                      UnsupportedAlgorithmError
                  ):
                      IntegrityEngine(
                          db,
                          clock,
                          algorithm="md5",
                      )
                  sha512_engine = IntegrityEngine(
                      db, clock, algorithm="sha512"
                  )
                  d = sha512_engine.digest_bytes(
                      b"x"
                  )
                  assert (
                      d
                      == hashlib.sha512(
                          b"x"
                      ).hexdigest()
                  )
              finally:
                  db.close()
          PYEOF
          echo "=== INTEGRITY TESTS READY ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs shared_engines/consensus shared_engines/integrity"
          python -m compileall -q $M main.py scripts shared_engines/tests
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M shared_engines/tests tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: engine 2/17 integrity - sha256/sha512 digests (bytes + streaming file), durable content proofs, tamper detection via re-hash compare, NotFound/UnsupportedAlgorithm typed errors; 4 proofs"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== ENGINE INTEGRITY COMPLETE ==="
