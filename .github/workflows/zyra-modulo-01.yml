name: zyra-block-b-contracts

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-block-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: B1 — Write CONTRACTS.md (canonical authority map)
        run: |
          set -euo pipefail
          cat > CONTRACTS.md <<'MDEOF'
          # Zyra Network — Mapa de Contratos Canónicos

          Documento vinculante: define la AUTORIDAD de cada capacidad
          cuando existe en más de una capa. Basado en auditoría 2025.

          ## Regla de interpretación
          - **Autoridad canónica**: la implementación de referencia.
          - **Capa de ejecución**: usa/delega en la autoridad; no
            redefine semántica.
          - Ambos pueden coexistir SI respetan esta tabla.

          ## Tabla de autoridad

          | Capacidad | Autoridad canónica | Capa de ejecución / fachada | Regla |
          |---|---|---|---|
          | Result | `foundation/contracts/result.py` | `shared_engines/common/result.py` | Engines importan de common; common delega semántica a foundation |
          | Serialización | `foundation/contracts/serialization.py` | `shared_engines/common/serialization.py` | Idem |
          | Tipos semánticos | `foundation/types/` | `shared_engines/common/types.py` | Idem |
          | Service discovery | `infrastructure/dns/` (mecanismo autoritativo) | `infrastructure/discovery/` = fachada alto nivel | Fachada delega en dns |
          | Transport | `protocol/transport/` (contrato) | `network/transport/` (implementación) | network implementa el contrato de protocol |
          | Cluster | `shared_engines/network/cluster.py` (motor con tests) | `network/cluster/` (capa raíz) | Capa raíz delega en el engine |
          | Failover | `shared_engines/network/failover.py` (quorum demostrado) | `network/failover/` | Idem |
          | Replication | `shared_engines/network/replication.py` (hash-verified) | `network/replication/` | Idem |
          | Database | `infrastructure/database/` (infra operativa) | `shared_engines/storage/database.py` (contrato para motores) | Motores dependen SOLO del contrato |
          | Migraciones | `shared_engines/storage/migrations.py` + `network_migrations.py` (motor) | `migrations/versions/` (historial operativo) | scripts/migrate.py ejecuta el motor |
          | Verificación | `shared_engines/verification/` (emisión) | `shared_engines/verifier/` (verificación OFFLINE terceros) | verifier consume attestations; nunca emite |
          | Observability | `shared_engines/observability/` (backend + health) | `observability/` raíz (colección/dashboards) | Capa raíz se integra vía MetricsBackend/HealthRegistry |
          | Telemetry | `shared_engines/telemetry/` (engine) | `telemetry/` raíz (fachadas futuras) | Se activan en fases posteriores |
          | Logs | `shared_engines/logs/structured.py` (engine) | `logs/` raíz (archivo/retención) | cleanup.py usa el engine |

          ## Regla de nuevos módulos
          Antes de crear cualquier archivo, consultar esta tabla.
          Si la capacidad no está aquí, añadirla a esta tabla EN EL
          MISMO commit que el código.
          MDEOF

      - name: B2 — Complete NAMESPACE_MANIFEST.md
        run: |
          set -euo pipefail
          cat > NAMESPACE_MANIFEST.md <<'MDEOF'
          # NAMESPACE_MANIFEST — Etiquetado formal de namespaces

          Etiquetas: FUTURE (reservado por roadmap) · APP-SCOPE (de una App).

          ## Namespaces en shared_engines/

          | Namespace | Etiqueta | Condición de activación |
          |---|---|---|
          | ai/ | FUTURE | Modelos de IA reales contratados |
          | certification/ | FUTURE | Proceso de certificación institucional (post ISO) |
          | compliance/ | FUTURE | Reglas por jurisdicción definidas |
          | compression/ | FUTURE | Necesidad demostrada |
          | consensus/ | FUTURE | Multi-nodo real en producción |
          | encryption/ | FUTURE | Capacidades adicionales sobre security/ |
          | export/ | FUTURE | Requisito de exportación por clientes |
          | integrations/ | FUTURE | Primer convenio externo (gob.sv, bancos) |
          | integrity/ | FUTURE | Verificaciones adicionales sobre audit/ |
          | interoperability/ | FUTURE | Interoperabilidad con otras redes |
          | orchestration/ | FUTURE | Orquestación post multi-nodo |
          | radar/ | **APP-SCOPE** | Pertenece a SUBASTAS (Radar VIP) |
          | reputation/ | FUTURE | Reputación cross-app definida |
          | routing/ | FUTURE | Routing sobre network/ |
          | scalability/ | FUTURE | Escalado demostrado necesario |
          | search/ | FUTURE | Búsqueda sobre volúmenes reales |
          | supervisor/ | FUTURE | Supervisión de engines en runtime |
          | system_loader/ | FUTURE | Carga dinámica si se requiere |
          | workflow/ | FUTURE | Flujos multi-paso entre motores |

          ## Regla de oro
          Ningún namespace se llena artificialmente. Se activa cuando
          su condición se cumple, con tests reales.
          MDEOF

      - name: B3 — Write SECURITY_POLICY.md (20-year key governance)
        run: |
          set -euo pipefail
          cat > SECURITY_POLICY.md <<'MDEOF'
          # Zyra Network — Política de Seguridad Criptográfica

          Política vinculante para la Root Authority. Vigencia: permanente.

          ## 1. Jerarquía de claves

          ZYRA_ROOT_KEY (master, entorno/KMS, NUNCA en código)
                ↓ deriva (SHA-256 + nonce)
          root.key (firma Ed25519, cifrada AES-256-GCM en disco)
                ↓ firma
          attestations / fx quotes / eventos de seguridad

          ## 2. Ciclo de vida

          | Fase | Operación | Requisito |
          |---|---|---|
          | Creación | Primer arranque | Master 32 bytes CSPRNG |
          | Carga | Arranques posteriores | Misma master; root.key verificado |
          | Fail-closed | Master incorrecta | Rechazo de arranque — nunca segunda autoridad |
          | Rotación | rotate() por operador autorizado | Nueva clave; huella archivada; auditada |
          | Archivo | Automático | historical_fingerprints() consultable |
          | Revocación | Documental (futuro CRL) | Huella excluida por verificadores |

          ## 3. Procedimiento de rotación (operador)

          1. GET /health → healthy
          2. python scripts/backup.py
          3. PersistentRootAuthority.rotate(rotated_by=<operador>)
          4. Verificar nueva huella en el log
          5. Publicar nueva clave pública a verificadores
          6. Confirmar attestations históricos verificables

          ## 4. Recuperación de desastre

          - Master perdida → irrecuperable POR DISEÑO (nueva era
            documentada). La master vive en KMS con backup.
          - root.key corrupto → rollback.py o re-derivación con
            la misma master.
          - Compromiso → rotación inmediata + revocación + forense.

          ## 5. Tabla de firma

          | Artefacto | Firmado con | Verificado con |
          |---|---|---|
          | Attestations | Root Authority (Ed25519) | Clave pública embebida |
          | FX Quotes | Root Authority (Ed25519) | Idem, offline |
          | API Keys | N/A (hash SHA-256) | Comparación constante |
          | Audit chain | Hash-chain | Recomputo |

          ## 6. Futuro (KMS/HSM)

          - ZYRA_ROOT_KEY → AWS/GCP KMS o HSM (adapter listo)
          - Rotación programada con doble control
          - Anclaje externo de audit checkpoints

          ## 7. API Keys operativas

          - Una por cliente/app, 256-bit CSPRNG
          - Solo hash SHA-256 almacenado
          - Rotación/revocación individuales auditadas
          - Rate limiting + brute-force lockout
          MDEOF

      - name: B-test — Policy tests (rotation + fail-closed)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/authority/tests
          cat > shared_engines/authority/tests/test_security_policy.py <<'PYEOF'
          """Proves the SECURITY_POLICY.md guarantees with code."""
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.authority.root import (
              PersistentRootAuthority,
              RootAuthorityStatus,
          )
          from shared_engines.common.errors import IntegrityError

          MASTER = "cc" * 32


          def test_policy_rotation_maintains_verifiable_history(
              tmp_path: Path,
          ) -> None:
              """Rotations archive every old fingerprint; the latest
              key persists across loads; history stays verifiable."""
              auth = PersistentRootAuthority(
                  data_dir=tmp_path, master_key_hex=MASTER
              )
              signer1, s1 = auth.load_or_create()
              assert s1.status is RootAuthorityStatus.CREATED_NEW
              signer2, s2 = auth.rotate(rotated_by="ciso")
              assert s2.status is RootAuthorityStatus.ROTATED
              signer3, s3 = auth.rotate(rotated_by="ciso")
              assert s3.status is RootAuthorityStatus.ROTATED
              history = auth.historical_fingerprints()
              assert s1.public_pem_fingerprint in history
              assert s2.public_pem_fingerprint in history
              assert s3.public_pem_fingerprint not in history
              signer4, s4 = auth.load_or_create()
              assert s4.status is RootAuthorityStatus.LOADED
              assert s4.public_pem_fingerprint == (
                  s3.public_pem_fingerprint
              )
              assert signer4.public_pem == signer3.public_pem


          def test_policy_fail_closed_on_wrong_master(
              tmp_path: Path,
          ) -> None:
              auth = PersistentRootAuthority(
                  data_dir=tmp_path, master_key_hex=MASTER
              )
              auth.load_or_create()
              intruder = PersistentRootAuthority(
                  data_dir=tmp_path, master_key_hex="dd" * 32
              )
              with pytest.raises(IntegrityError):
                  intruder.load_or_create()
              legitimate = PersistentRootAuthority(
                  data_dir=tmp_path, master_key_hex=MASTER
              )
              restored, status = legitimate.load_or_create()
              assert status.status is RootAuthorityStatus.LOADED
              assert restored is not None
          PYEOF

          echo "=== POLICY TESTS OK ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs"
          python -m compileall -q $M main.py scripts
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add CONTRACTS.md NAMESPACE_MANIFEST.md SECURITY_POLICY.md shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: block B contracts (CONTRACTS.md canonical authority map, NAMESPACE_MANIFEST.md, SECURITY_POLICY.md governance + corrected policy tests)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== BLOCK B COMPLETE ==="
