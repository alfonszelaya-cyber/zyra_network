name: zyra-block-b-contracts

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-block-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: B1 — Write CONTRACTS.md (canonical authority map)
        run: |
          set -euo pipefail
          cat > CONTRACTS.md <<'MDEOF'
          # Zyra Network — Mapa de Contratos Canónicos

          Documento vinculante: define la AUTORIDAD de cada capacidad
          cuando existe en más de una capa. Basado en auditoría 2025.

          ## Regla de interpretación
          - **Autoridad canónica**: la implementación de referencia.
          - **Capa de ejecución**: usa/delega en la autoridad; no
            redefine semántica.
          - Ambos pueden coexistir SI respetan esta tabla.

          ## Tabla de autoridad

          | Capacidad | Autoridad canónica | Capa de ejecución / fachada | Regla |
          |---|---|---|---|
          | Result | `foundation/contracts/result.py` | `shared_engines/common/result.py` | Engines importan de common; common delega semántica a foundation |
          | Serialización | `foundation/contracts/serialization.py` | `shared_engines/common/serialization.py` | Idem |
          | Tipos semánticos | `foundation/types/` | `shared_engines/common/types.py` | Idem |
          | Service discovery | `infrastructure/dns/` (dns_* = mecanismo autoritativo) | `infrastructure/discovery/` = fachada alto nivel | Fachada delega en dns |
          | Transport | `protocol/transport/` (contrato de comunicación) | `network/transport/` (implementación de red) | network implementa el contrato de protocol |
          | Cluster | `shared_engines/network/cluster.py` (motor ejecutable con tests) | `network/cluster/` (capa de distribución raíz) | Capa raíz delega en el engine |
          | Failover | `shared_engines/network/failover.py` (quorum anti-split-brain demostrado) | `network/failover/` | Idem |
          | Replication | `shared_engines/network/replication.py` (hash-verified) | `network/replication/` | Idem |
          | Database | `infrastructure/database/` (infra operativa) | `shared_engines/storage/database.py` (contrato Database para motores) | Motores dependen SOLO del contrato |
          | Migraciones | `shared_engines/storage/migrations.py` + `network_migrations.py` (motor) | `migrations/versions/` (historial operativo de la red) | scripts/migrate.py ejecuta el motor |
          | Verificación de contenido | `shared_engines/verification/` (emisión: media, credenciales, attestations) | `shared_engines/verifier/` (verificación OFFLINE de terceros) | verifier consume attestations; nunca emite |
          | Observability | `shared_engines/observability/` (backend protocol + health con tests) | `observability/` raíz (colección/exportación/dashboards de capa) | Capa raíz se integra vía MetricsBackend/HealthRegistry |
          | Telemetry | `shared_engines/telemetry/` (engine: collector, system report) | `telemetry/` raíz (fachadas futuras: tracing, profiling) | Fachadas se activan en fases posteriores |
          | Logs | `shared_engines/logs/structured.py` (engine con correlación) | `logs/` raíz (archivo/retención operativa) | cleanup.py usa el engine |

          ## Regla de nuevos módulos
          Antes de crear cualquier archivo, consultar esta tabla.
          Si la capacidad no está aquí, añadirla a esta tabla EN EL
          MISMO commit que el código.
          MDEOF

          echo "=== CONTRACTS.md OK ==="

      - name: B2 — Complete NAMESPACE_MANIFEST.md (formal labels)
        run: |
          set -euo pipefail
          cat > NAMESPACE_MANIFEST.md <<'MDEOF'
          # NAMESPACE_MANIFEST — Etiquetado formal de namespaces

          Etiquetas: FUTURE (reservado, se activará por roadmap) ·
          RESERVED-EXTERNAL (espera proveedor/decisión externa) ·
          APP-SCOPE (pertenece a una App, no a la Red).

          ## Namespaces en shared_engines/

          | Namespace | Etiqueta | Condición de activación |
          |---|---|---|
          | ai/ | FUTURE | Modelos de IA reales contratados (detección contenido real vs IA) |
          | certification/ | FUTURE | Proceso de certificación institucional definido (post ISO) |
          | compliance/ | FUTURE | Reglas de compliance por jurisdicción definidas |
          | compression/ | FUTURE | Necesidad demostrada de compresión de almacenamiento |
          | consensus/ | FUTURE | Multi-nodo real desplegado (fase de red distribuida en producción) |
          | encryption/ | FUTURE | Capacidades de cifrado adicionales sobre security/ |
          | export/ | FUTURE | Requisito de exportación de datos por clientes |
          | integrations/ | FUTURE | Primer convenio de integración externa (gob.sv, bancos) |
          | integrity/ | FUTURE | Verificaciones de integridad adicionales sobre audit/ |
          | interoperability/ | FUTURE | Protocolos de interoperabilidad con otras redes |
          | orchestration/ | FUTURE | Orquestación de tareas entre nodos (post multi-nodo) |
          | radar/ | **APP-SCOPE** | Pertenece a SUBASTAS (Radar VIP). La Red NO lo implementa |
          | reputation/ | FUTURE | Sistema de reputación cross-app definido |
          | routing/ | FUTURE | Routing de mensajes/servicios sobre network/ |
          | scalability/ | FUTURE | Mecanismos de escalado demostrados necesarios |
          | search/ | FUTURE | Búsqueda indexada sobre volúmenes reales |
          | supervisor/ | FUTURE | Supervisión de procesos/engines en runtime |
          | system_loader/ | FUTURE | Carga dinámica de módulos si se requiere |
          | workflow/ | FUTURE | Flujos de trabajo multi-paso entre motores |

          ## Subdirectorios especializados (dentro de engines vivos)
          identity/authentication|authorization|biometrics|credentials|
          profiles|registry — FUTURE (subcapacidades de identidad).
          verification/ai_detection|audio|documents|images|integrity|
          signatures|video — FUTURE (verificación por tipo de contenido).
          tokenization/assets|exchange|registry|transactions|valuation —
          FUTURE (capacidades de tokenización avanzadas).
          orchestration/* y radar/* — ver tabla superior.

          ## Regla de oro
          Ningún namespace se llena artificialmente. Se activa cuando
          su condición de activación se cumple, con tests reales.
          MDEOF

          echo "=== NAMESPACE MANIFEST OK ==="

      - name: B3 — Write SECURITY_POLICY.md (20-year key governance)
        run: |
          set -euo pipefail
          cat > SECURITY_POLICY.md <<'MDEOF'
          # Zyra Network — Política de Seguridad Criptográfica

          Política vinculante para la Root Authority y todo material
          de clave. Vigencia: permanente (diseño 20+ años).

          ## 1. Jerarquía de claves

          ```
          ZYRA_ROOT_KEY (master, entorno/KMS, NUNCA en código)
                ↓ deriva (SHA-256 + nonce)
          root.key (clave de firma Ed25519, cifrada AES-256-GCM en disco)
                ↓ firma
          attestations / fx quotes / eventos de seguridad
          ```

          ## 2. Ciclo de vida de la Root Authority

          | Fase | Operación | Requisito |
          |---|---|---|
          | Creación | Primer arranque con ZYRA_ROOT_KEY | Master de 32 bytes CSPRNG (`PersistentRootAuthority.generate_master_key()`) |
          | Carga | Cada arranque posterior | Misma master key; archivo root.key descifrado y verificado |
          | Fail-closed | Master incorrecta o archivo manipulado | **Rechazo de arranque** (IntegrityError) — nunca crear segunda autoridad |
          | Rotación | `rotate()` por operador autorizado | Nueva clave firmante; huella anterior archivada en root.history.json; evento auditado |
          | Archivo | Automático en cada rotación | historical_fingerprints() consultable para verificar attestations históricos |
          | Revocación | Documental (futuro: CRL/OCSP interno) | Huella revocada publicada; verificadores la excluyen |

          ## 3. Procedimiento de rotación (operador)

          1. Verificar salud: `GET /health` → healthy
          2. Respaldar: `python scripts/backup.py`
          3. Ejecutar rotación (vía sesión operativa con
             `PersistentRootAuthority.rotate(rotated_by=<operador>)`)
          4. Verificar nueva huella en el log de arranque
          5. Publicar la nueva clave pública a los verificadores externos
          6. Confirmar que attestations anteriores siguen verificables
             contra las huellas históricas

          ## 4. Recuperación de desastre de claves

          - Master key perdida → **irrecuperable por diseño** (las
            attestations existentes requieren la huella histórica;
            nueva autoridad = nueva era, documentada). Por eso la
            master vive en KMS/secret manager con backup.
          - root.key corrupto → restaurar desde snapshot (scripts/rollback.py)
            o re-derivarse con la misma master key.
          - Compromiso sospechado → rotación INMEDIATA + revocación de
            huella + auditoría forense de la chain.

          ## 5. Tabla de firma: quién firma qué

          | Artefacto | Firmado con | Verificado con |
          |---|---|---|
          | Attestations (verificación) | Root Authority (Ed25519) | Clave pública embebida en el attestation |
          | FX Quotes (currency) | Root Authority (Ed25519) | Idem, offline |
          | API Keys (hardening) | N/A (hash SHA-256 almacenado) | Comparación constante de hash |
          | Audit chain | Hash-chain (integridad) | Recomputo de la cadena |

          ## 6. Requisitos futuros (KMS/HSM)

          Cuando el volumen/instituciones lo requieran:
          - Migrar ZYRA_ROOT_KEY a AWS KMS / GCP KMS / HSM físico
            (adapter: `PersistentRootAuthority` acepta cualquier
            fuente de master key vía constructor)
          - Rotación automática programada con doble control
          - Anclaje externo de audit checkpoints (blockchain/timestamping)

          ## 7. API Keys operativas

          - Una por cliente/app (Subastas, NEXO, terceros), 256-bit CSPRNG
          - Almacenadas SOLO como hash SHA-256 (robo de BD ≠ robo de llaves)
          - Rotación y revocación individuales, auditadas
          - Rate limiting + brute-force lockout por clave
          MDEOF

          echo "=== SECURITY POLICY OK ==="

      - name: B-test — Verify rotation policy is enforced by code
        run: |
          set -euo pipefail
          mkdir -p shared_engines/authority/tests
          cat > shared_engines/authority/tests/test_security_policy.py <<'PYEOF'
          """Proves the SECURITY_POLICY.md guarantees with code:
          rotation archives history, load keeps one authority,
          fail-closed protects against wrong masters."""
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.authority.root import (
              PersistentRootAuthority,
              RootAuthorityStatus,
          )
          from shared_engines.common.errors import IntegrityError

          MASTER = "cc" * 32


          def test_policy_rotation_maintains_verifiable_history(
              tmp_path: Path,
          ) -> None:
              auth = PersistentRootAuthority(
                  data_dir=tmp_path, master_key_hex=MASTER
              )
              signer1, s1 = auth.load_or_create()
              signer2, s2 = auth.rotate(rotated_by="ciso")
              signer3, s3 = auth.rotate(rotated_by="ciso")
              history = auth.historical_fingerprints()
              assert s1.public_pem_fingerprint in history
              assert s2.public_pem_fingerprint in history
              assert s3.public_pem_fingerprint not in history
              assert s3.status is RootAuthorityStatus.LOADED
              assert signer3.public_pem != signer2.public_pem
              assert signer2.public_pem != signer1.public_pem


          def test_policy_fail_closed_on_wrong_master(
              tmp_path: Path,
          ) -> None:
              auth = PersistentRootAuthority(
                  data_dir=tmp_path, master_key_hex=MASTER
              )
              auth.load_or_create()
              intruder = PersistentRootAuthority(
                  data_dir=tmp_path, master_key_hex="dd" * 32
              )
              with pytest.raises(IntegrityError):
                  intruder.load_or_create()
              legitimate = PersistentRootAuthority(
                  data_dir=tmp_path, master_key_hex=MASTER
              )
              restored, status = legitimate.load_or_create()
              assert status is RootAuthorityStatus.LOADED
              assert restored is not None
          PYEOF

          echo "=== POLICY TESTS OK ==="

      - name: Quality gates (mypy first; full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs"
          python -m compileall -q $M main.py scripts
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M tests/test_deployment.py observability/tests
          echo "pytest OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git add CONTRACTS.md NAMESPACE_MANIFEST.md SECURITY_POLICY.md shared_engines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: block B contracts (CONTRACTS.md canonical authority map, NAMESPACE_MANIFEST.md formal labels, SECURITY_POLICY.md 20-year key governance + policy tests)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== BLOCK B COMPLETE ==="
