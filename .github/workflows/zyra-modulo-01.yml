cat > shared_engines/identity_proofing/contracts.py <<'PY'
from __future__ import annotations

from dataclasses import dataclass, field
from enum import Enum
from typing import Optional


class AssuranceLevel(str, Enum):
    UNVERIFIED = "unverified"
    BASIC = "basic"
    VERIFIED = "verified"
    HIGH = "high"


class BiometricKind(str, Enum):
    FACE = "face"
    IRIS = "iris"


class DocumentStatus(str, Enum):
    NOT_CHECKED = "not_checked"
    AUTHENTIC = "authentic"
    INVALID = "invalid"
    REJECTED = "rejected"


class ProofingDecision(str, Enum):
    REJECT = "reject"
    REVIEW = "review"
    ACCEPT = "accept"


@dataclass(frozen=True)
class DocumentCheck:
    document_type: str
    issuer: str
    document_fingerprint: str

    authentic: bool = False
    attributes_verified: bool = False
    issuer_verified: bool = False
    tamper_detected: bool = False


@dataclass(frozen=True)
class ProofingRequest:
    subject_zid: str
    document: DocumentCheck

    biometric_kind: Optional[BiometricKind] = None
    biometric_match: bool = False
    liveness_passed: bool = False

    duplicate_identity_detected: bool = False
    source_reference: Optional[str] = None


@dataclass(frozen=True)
class ProofingResult:
    decision: ProofingDecision
    assurance: AssuranceLevel
    document_status: DocumentStatus

    reasons: tuple[str, ...] = field(default_factory=tuple)
    evidence_digest: str = ""
PY

cat > shared_engines/identity_proofing/engine.py <<'PY'
from __future__ import annotations

import hashlib
from dataclasses import asdict

from .contracts import (
    AssuranceLevel,
    DocumentStatus,
    ProofingDecision,
    ProofingRequest,
    ProofingResult,
)


class IdentityProofingEngine:
    """
    Additive identity-proofing decision engine.

    This layer does NOT create or replace ZID.
    It determines whether the claimed identity has enough
    evidence to receive an assurance level.

    External document/biometric providers may feed their
    verified results into ProofingRequest.
    """

    VERSION = "1.0.0"

    def evaluate(self, request: ProofingRequest) -> ProofingResult:
        reasons: list[str] = []
        document = request.document

        if not request.subject_zid.strip():
            return self._reject(
                request,
                DocumentStatus.INVALID,
                "missing_subject_zid",
            )

        if not document.document_type.strip():
            return self._reject(
                request,
                DocumentStatus.INVALID,
                "missing_document_type",
            )

        if not document.issuer.strip():
            return self._reject(
                request,
                DocumentStatus.INVALID,
                "missing_document_issuer",
            )

        if not document.document_fingerprint.strip():
            return self._reject(
                request,
                DocumentStatus.INVALID,
                "missing_document_fingerprint",
            )

        if document.tamper_detected:
            return self._reject(
                request,
                DocumentStatus.REJECTED,
                "document_tampering_detected",
            )

        if not document.authentic:
            return self._reject(
                request,
                DocumentStatus.INVALID,
                "document_authenticity_not_confirmed",
            )

        if not document.issuer_verified:
            return self._reject(
                request,
                DocumentStatus.INVALID,
                "document_issuer_not_verified",
            )

        if not document.attributes_verified:
            return self._reject(
                request,
                DocumentStatus.INVALID,
                "document_attributes_not_verified",
            )

        if request.duplicate_identity_detected:
            return self._reject(
                request,
                DocumentStatus.REJECTED,
                "duplicate_identity_detected",
            )

        # Documento válido pero sin biometría:
        # no se concede HIGH.
        if request.biometric_kind is None:
            reasons.append("biometric_binding_not_present")

            return self._result(
                request=request,
                decision=ProofingDecision.REVIEW,
                assurance=AssuranceLevel.BASIC,
                document_status=DocumentStatus.AUTHENTIC,
                reasons=reasons,
            )

        if not request.liveness_passed:
            return self._reject(
                request,
                DocumentStatus.REJECTED,
                "liveness_check_failed",
            )

        if not request.biometric_match:
            return self._reject(
                request,
                DocumentStatus.REJECTED,
                "biometric_match_failed",
            )

        # Documento autenticado + emisor/atributos verificados +
        # biometría vinculada + liveness + sin duplicado.
        return self._result(
            request=request,
            decision=ProofingDecision.ACCEPT,
            assurance=AssuranceLevel.HIGH,
            document_status=DocumentStatus.AUTHENTIC,
            reasons=("identity_proofing_completed",),
        )

    def _reject(
        self,
        request: ProofingRequest,
        document_status: DocumentStatus,
        reason: str,
    ) -> ProofingResult:
        return self._result(
            request=request,
            decision=ProofingDecision.REJECT,
            assurance=AssuranceLevel.UNVERIFIED,
            document_status=document_status,
            reasons=(reason,),
        )

    def _result(
        self,
        request: ProofingRequest,
        decision: ProofingDecision,
        assurance: AssuranceLevel,
        document_status: DocumentStatus,
        reasons: tuple[str, ...],
    ) -> ProofingResult:
        payload = {
            "version": self.VERSION,
            "request": asdict(request),
            "decision": decision.value,
            "assurance": assurance.value,
            "document_status": document_status.value,
            "reasons": reasons,
        }

        canonical = repr(payload).encode("utf-8")
        evidence_digest = hashlib.sha256(canonical).hexdigest()

        return ProofingResult(
            decision=decision,
            assurance=assurance,
            document_status=document_status,
            reasons=reasons,
            evidence_digest=evidence_digest,
        )
PY

