name: zyra-w28-3a-agro-server-pt1

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w283a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write server.py PART 1 (top through _get)
        run: |
          set -euo pipefail
          cat > apps/agro/server.py <<'PYEOF'
          """AGRO HTTP surface v4: role screens + JSON API
          dual mode."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.agro.infrastructure.persistence.agro_store import (
              ROLES,
              AgroStore,
          )
          from apps.agro.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.agro.modules.comercializacion.alertas_de_mercado.market_alert_service import (
              MarketAlertService,
          )
          from apps.agro.services.zyra_link import ZyraLink

          _CSS = (
              "body{font-family:system-ui,sans-serif;"
              "background:#0d1117;color:#e6edf3;"
              "display:flex;justify-content:center;"
              "padding:20px;margin:0}"
              ".wrap{max-width:680px;width:100%}"
              "h1{font-size:1.3rem}"
              "h2{font-size:1rem;margin-top:20px;"
              "color:#58a6ff}"
              ".card{background:#161b22;border:1px solid"
              " #30363d;border-radius:10px;padding:14px;"
              "margin-top:10px}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px 18px;border-radius:8px;"
              "font-size:1rem;cursor:pointer;margin:6px 4px"
              " 0 0;width:100%;text-align:left}"
              "button.gray{background:#30363d}"
              "input,select{width:100%;box-sizing:border-box;"
              "background:#0d1117;color:#e6edf3;"
              "border:1px solid #30363d;border-radius:6px;"
              "padding:8px;margin:4px 0;font-size:0.95rem}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html lang='es'><head>"
                  "<meta charset='utf-8'>"
                  "<meta name='viewport' content='width="
                  "device-width, initial-scale=1'>"
                  f"<title>{title}</title>"
                  f"<style>{_CSS}</style></head><body>"
                  f"<div class='wrap'>{body}</div></body>"
                  "</html>"
              )


          class AgroApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[AgroStore]
              link: ClassVar[ZyraLink]
              client: ClassVar[NetworkClient]
              alerts: ClassVar[MarketAlertService] = (
                  MarketAlertService()
              )

              def log_message(
                  self, format: str, *args: object
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(self, method: str) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._send(
                          404,
                          {
                              "ok": False,
                              "error": {
                                  "type":
                                  "not_found",
                                  "message": str(
                                      exc
                                  ),
                              },
                          },
                      )
                  except ValueError as exc:
                      self._send(
                          400,
                          {
                              "ok": False,
                              "error": {
                                  "type":
                                  "invalid_request",
                                  "message": str(
                                      exc
                                  ),
                              },
                          },
                      )
                  except Exception as exc:
                      self._send(
                          500,
                          {
                              "ok": False,
                              "error": {
                                  "type":
                                  "internal_error",
                                  "message": str(
                                      exc
                                  ),
                              },
                          },
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != ["agro"]:
                      self._send(
                          404,
                          {
                              "ok": False,
                              "error": {
                                  "type":
                                  "not_found",
                                  "message":
                                  "outside /agro",
                              },
                          },
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(self, s: list[str]) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app": "agro",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  if s == ["menu"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "title": "AGRO",
                                  "actions": [
                                      {
                                          "label":
                                          "Vender mi"
                                          " cosecha",
                                          "route":
                                          "/agro/production",
                                      },
                                      {
                                          "label":
                                          "Mi historial",
                                          "route":
                                          "/agro/government/summary",
                                      },
                                  ],
                              },
                          },
                      )
                      return
                  if s == ["producers"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": list(
                                  store.list_producers()
                              ),
                          },
                      )
                      return
                  if s == ["government", "summary"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": store.summary(),
                          },
                      )
                      return
                  if not s or s == ["home"]:
                      self._home()
                      return
                  if s[0] == "productor":
                      self._screen_producer(s)
                      return
                  if s[0] == "gobierno":
                      self._screen_government()
                      return
                  if s[0] == "banco":
                      self._screen_bank()
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown route",
                          },
                      },
                  )
          PYEOF
          echo "PART 1 written"

      - name: Commit part 1
        run: |
          set -euo pipefail
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W28-3a AGRO server v4 part 1 (top through _get, JSON routes + role screens)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== PART 1 COMMITTED ==="
