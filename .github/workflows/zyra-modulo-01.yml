name: zyra-w22b-map-and-verify

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w22b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Record ecosystem map
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/ECOSYSTEM_MAP.md <<'MDEOF'
          # ZYRA Ecosystem - App Consolidation Map

          Decision recorded in W22. The ecosystem is 9 systems,
          all living on ZYRA Network. Every app consumes the
          Network over HTTP; if one is down, the others keep
          working (document verification works offline).

          ## The 9 systems

          1. nexo - business/fiscal core (wave 1)
          2. agro - verified aid, planting records, prices (wave 1)
          3. semilla - education pre-k to university (wave 1)
          4. axis - health + justice + security (wave 1)
          5. subastas - marketplace + Radar VIP + stocks (wave 1)
          6. mi_primer_empleo - job matching (wave 1)
          7. ciclo_digital - archeology + recycling to tokens (wave 2)
          8. laboratorio - policy simulation + 3D decisions (wave 2)
          9. futuro_os - robots rescue + 3D space lanes (wave 3)

          ## Absorbed folders

          - security_command -> axis/modules/seguridad_comando
            (penal records, police, face/emotion detection; every
            consultation is audited by the Network)
          - reciclaje_digital -> ciclo_digital
          - decisiones_reales -> laboratorio
          - controlador_espacios -> futuro_os
          - governance_portal -> ZYRA admin surface
          - rednew, shared_domain -> removed (empty)

          ## Legacy cleanup

          - templatess/ typo directories removed.
          - AGRO real code (208 files) kept as starting point
            for its build (N1).
          MDEOF
          echo "map recorded"

      - name: Sanity checks (AGRO intact, AXIS absorbed, compile)
        run: |
          set -euo pipefail
          real=$(find apps/agro -name '*.py' -size +1c \
            ! -name '__init__.py' | wc -l)
          echo "agro real code files: $real"
          test "$real" -gt 200
          test -d apps/axis/modules/seguridad_comando
          echo "seguridad_comando inside axis: OK"
          python -m compileall -q apps/agro apps/axis
          echo "compile OK"
          find apps/agro apps/axis -name '__pycache__' \
            -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W22b ecosystem map recorded + sanity checks (AGRO code intact, seguridad_comando inside axis, compile OK)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W22B COMPLETE: ECOSYSTEM CONSOLIDATED ==="
