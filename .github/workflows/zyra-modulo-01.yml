name: zyra-n1b-agro-roles

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-n1b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: AgroStore v2 (role-aware)
        run: |
          set -euo pipefail
          cat > apps/agro/infrastructure/persistence/agro_store.py <<'PYEOF'
          """AGRO local durable store v2 (role-aware)."""
          from __future__ import annotations

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          ROLES = (
              "agricultor",
              "ganadero",
              "gobierno",
              "banco",
          )

          _MIGRATIONS = (
              Migration(
                  2,
                  "agro",
                  (
                      "CREATE TABLE IF NOT EXISTS"
                      " agro_producers_v2 ("
                      " producer_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " producer_type TEXT NOT NULL,"
                      " role TEXT NOT NULL"
                      " DEFAULT 'agricultor',"
                      " location TEXT,"
                      " verified INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " synced INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE"
                      " agro_productions ("
                      " production_id TEXT PRIMARY"
                      " KEY,"
                      " producer_id TEXT NOT NULL,"
                      " product TEXT NOT NULL,"
                      " quantity REAL NOT NULL,"
                      " unit TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " network_seq INTEGER,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class AgroStore:
              """Durable local state for AGRO (v2, roles)."""

              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "agro.store", _MIGRATIONS
                  ).run(clock)

              def add_producer(
                  self,
                  *,
                  producer_id: str,
                  zid: str | None,
                  name: str,
                  producer_type: str,
                  role: str,
                  location: str | None,
                  synced: bool,
              ) -> dict[str, object]:
                  if role not in ROLES:
                      raise ValueError(
                          f"unknown role: {role}"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO agro_producers_v2"
                          " (producer_id, zid, name,"
                          "  producer_type, role,"
                          "  location, verified, synced,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?, 0,"
                          "  ?, ?)",
                          (
                              producer_id,
                              zid,
                              name,
                              producer_type,
                              role,
                              location,
                              int(synced),
                              now,
                          ),
                      )
                  return self.get_producer(
                      producer_id
                  )

              def link_zid(
                  self, *, producer_id: str, zid: str
              ) -> None:
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE agro_producers_v2 SET"
                          " zid = ?, synced = 1"
                          " WHERE producer_id = ?",
                          (zid, producer_id),
                      )

              def mark_verified(
                  self, *, producer_id: str
              ) -> None:
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE agro_producers_v2 SET"
                          " verified = 1"
                          " WHERE producer_id = ?",
                          (producer_id,),
                      )

              def get_producer(
                  self, producer_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " agro_producers_v2"
                      " WHERE producer_id = ?",
                      (producer_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown producer:"
                          f" {producer_id}"
                      )
                  return self._producer_row(row)

              def list_producers(
                  self, *, role: str | None = None
              ) -> tuple[dict[str, object], ...]:
                  if role is not None:
                      if role not in ROLES:
                          raise ValueError(
                              f"unknown role:"
                              f" {role}"
                          )
                      rows = self._db.query_all(
                          "SELECT * FROM"
                          " agro_producers_v2"
                          " WHERE role = ?"
                          " ORDER BY created_at",
                          (role,),
                      )
                  else:
                      rows = self._db.query_all(
                          "SELECT * FROM"
                          " agro_producers_v2"
                          " ORDER BY created_at"
                      )
                  return tuple(
                      self._producer_row(r)
                      for r in rows
                  )

              def add_production(
                  self,
                  *,
                  production_id: str,
                  producer_id: str,
                  product: str,
                  quantity: float,
                  unit: str,
                  network_seq: int | None,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO agro_productions"
                          " (production_id,"
                          "  producer_id, product,"
                          "  quantity, unit, status,"
                          "  network_seq, created_at)"
                          " VALUES (?, ?, ?, ?, ?,"
                          "  'active', ?, ?)",
                          (
                              production_id,
                              producer_id,
                              product,
                              quantity,
                              unit,
                              network_seq,
                              now,
                          ),
                      )
                  row = self._db.query_one(
                      "SELECT * FROM agro_productions"
                      " WHERE production_id = ?",
                      (production_id,),
                  )
                  assert row is not None
                  raw_seq = row["network_seq"]
                  return {
                      "production_id": str(
                          row["production_id"]
                      ),
                      "producer_id": str(
                          row["producer_id"]
                      ),
                      "product": str(row["product"]),
                      "quantity": float(
                          row["quantity"]
                      ),
                      "unit": str(row["unit"]),
                      "status": str(row["status"]),
                      "network_seq": (
                          int(raw_seq)
                          if raw_seq is not None
                          else None
                      ),
                  }

              def list_productions(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM agro_productions"
                      " ORDER BY created_at"
                  )
                  result: list[
                      dict[str, object]
                  ] = []
                  for r in rows:
                      raw_seq = r["network_seq"]
                      result.append(
                          {
                              "production_id": str(
                                  r["production_id"]
                              ),
                              "producer_id": str(
                                  r["producer_id"]
                              ),
                              "product": str(
                                  r["product"]
                              ),
                              "quantity": float(
                                  r["quantity"]
                              ),
                              "unit": str(r["unit"]),
                              "status": str(
                                  r["status"]
                              ),
                              "network_seq": (
                                  int(raw_seq)
                                  if raw_seq
                                  is not None
                                  else None
                              ),
                          }
                      )
                  return tuple(result)

              def summary(self) -> dict[str, object]:
                  producers = self._db.query_one(
                      "SELECT COUNT(*) AS total,"
                      " SUM(verified) AS verified"
                      " FROM agro_producers_v2"
                  )
                  by_role_rows = self._db.query_all(
                      "SELECT role, COUNT(*) AS n"
                      " FROM agro_producers_v2"
                      " GROUP BY role"
                  )
                  productions = self._db.query_all(
                      "SELECT product, SUM(quantity)"
                      " AS total FROM"
                      " agro_productions"
                      " GROUP BY product"
                      " ORDER BY product"
                  )
                  by_role = {
                      str(r["role"]): int(r["n"])
                      for r in by_role_rows
                  }
                  by_product = {
                      str(r["product"]): float(
                          r["total"]
                      )
                      for r in productions
                  }
                  total = 0
                  verified = 0
                  if producers is not None:
                      total = int(
                          producers["total"]
                      )
                      if (
                          producers["verified"]
                          is not None
                      ):
                          verified = int(
                              producers["verified"]
                          )
                  return {
                      "producers_total": total,
                      "producers_verified": (
                          verified
                      ),
                      "producers_by_role": by_role,
                      "productions_by_product": (
                          by_product
                      ),
                  }

              @staticmethod
              def _producer_row(row) -> dict[str, object]:
                  return {
                      "producer_id": str(
                          row["producer_id"]
                      ),
                      "zid": (
                          str(row["zid"])
                          if row["zid"] is not None
                          else None
                      ),
                      "name": str(row["name"]),
                      "producer_type": str(
                          row["producer_type"]
                      ),
                      "role": str(row["role"]),
                      "location": (
                          str(row["location"])
                          if row["location"]
                          is not None
                          else None
                      ),
                      "verified": bool(
                          int(row["verified"])
                      ),
                      "synced": bool(
                          int(row["synced"])
                      ),
                      "created_at": float(
                          row["created_at"]
                      ),
                  }
          PYEOF
          echo "store v2 ready"

      - name: AGRO HTTP surface v2 (role screens, fixed strings)
        run: |
          set -euo pipefail
          cat > apps/agro/server.py <<'PYEOF'
          """AGRO HTTP surface v2: role-based screens."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.agro.infrastructure.persistence.agro_store import (
              ROLES,
              AgroStore,
          )
          from apps.agro.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.agro.modules.comercializacion.alertas_de_mercado.market_alert_service import (
              MarketAlertService,
          )
          from apps.agro.services.zyra_link import ZyraLink

          _CSS = (
              "body{font-family:system-ui,sans-serif;"
              "background:#0d1117;color:#e6edf3;"
              "display:flex;justify-content:center;"
              "padding:20px;margin:0}"
              ".wrap{max-width:680px;width:100%}"
              "h1{font-size:1.3rem}"
              "h2{font-size:1rem;margin-top:20px;"
              "color:#58a6ff}"
              ".card{background:#161b22;border:1px solid"
              " #30363d;border-radius:10px;padding:14px;"
              "margin-top:10px}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px 18px;border-radius:8px;"
              "font-size:1rem;cursor:pointer;margin:6px 4px 0 0;"
              "width:100%;text-align:left}"
              "button.gray{background:#30363d}"
              "input,select{width:100%;box-sizing:border-box;"
              "background:#0d1117;color:#e6edf3;"
              "border:1px solid #30363d;border-radius:6px;"
              "padding:8px;margin:4px 0;font-size:0.95rem}"
              ".big{font-size:1.6rem;font-weight:bold;"
              "color:#58a6ff}"
              "small{color:#8b949e}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html lang='es'><head>"
                  "<meta charset='utf-8'>"
                  "<meta name='viewport' content='width="
                  "device-width, initial-scale=1'>"
                  f"<title>{title}</title>"
                  f"<style>{_CSS}</style></head><body>"
                  f"<div class='wrap'>{body}</div></body>"
                  "</html>"
              )


          class AgroApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[AgroStore]
              link: ClassVar[ZyraLink]
              client: ClassVar[NetworkClient]
              alerts: ClassVar[MarketAlertService] = (
                  MarketAlertService()
              )

              def log_message(
                  self, format: str, *args: object
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(self, method: str) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._html(
                          404,
                          _page(
                              "No encontrado",
                              "<h1>404</h1>"
                              f"<p>{exc}</p>",
                          ),
                      )
                  except ValueError as exc:
                      self._html(
                          400,
                          _page(
                              "Error",
                              "<h1>Dato invalido"
                              f"</h1><p>{exc}</p>",
                          ),
                      )
                  except Exception as exc:
                      self._html(
                          500,
                          _page(
                              "Error",
                              "<h1>Error interno"
                              f"</h1><p>{exc}</p>",
                          ),
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != ["agro"]:
                      self._html(
                          404,
                          _page(
                              "404",
                              "<h1>Fuera de AGRO"
                              "</h1>",
                          ),
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_get(s[1:])
                      return
                  store = type(self).store
                  if not s or s == ["home"]:
                      self._home()
                      return
                  if s[0] == "productor":
                      self._screen_producer(s)
                      return
                  if s[0] == "gobierno":
                      self._screen_government()
                      return
                  if s[0] == "banco":
                      self._screen_bank()
                      return
                  if s == ["government", "summary"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": store.summary(),
                          },
                      )
                      return
                  self._html(
                      404,
                      _page(
                          "404",
                          "<h1>Pagina no"
                          " encontrada</h1>"
                          "<a href='/agro'>Volver"
                          " a AGRO</a>",
                      ),
                  )

              def _post(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_post(s[1:])
                      return
                  store = type(self).store
                  link = type(self).link
                  doc = self._read_form()
                  if s == ["register"]:
                      name = self._req(doc, "name")
                      producer_type = self._req(
                          doc, "producer_type"
                      )
                      role = str(
                          doc.get("role", "agricultor")
                      )
                      if role not in ROLES:
                          raise ValueError(
                              f"unknown role: {role}"
                          )
                      location = doc.get("location")
                      location = (
                          str(location)
                          if location is not None
                          else None
                      )
                      producer_id = (
                          "PRD-"
                          + uuid.uuid4().hex[:12]
                      )
                      zid: str | None = None
                      ok, data, _error = (
                          link.register_producer_zid(
                              name
                          )
                      )
                      if ok and data is not None:
                          zid = str(data.get("zid"))
                      store.add_producer(
                          producer_id=producer_id,
                          zid=zid,
                          name=name,
                          producer_type=(
                              producer_type
                          ),
                          role=role,
                          location=location,
                          synced=(zid is not None),
                      )
                      zid_text = (
                          zid
                          if zid is not None
                          else "pendiente de conexion"
                      )
                      self._html(
                          200,
                          _page(
                              "Bienvenido a AGRO",
                              "<h1>Registro listo"
                              "</h1>"
                              "<p>Tu ID de confianza:"
                              f" <b>{producer_id}"
                              "</b></p>"
                              "<p>Tu ZID de red: "
                              f"<b>{zid_text}</b></p>"
                              "<a href='/agro/productor/"
                              f"{producer_id}'>"
                              "<button>Ir a mi panel"
                              "</button></a>"
                              "<a href='/agro'>"
                              "<button class='gray'>"
                              "Inicio</button></a>",
                          ),
                      )
                      return
                  if s == ["production"]:
                      producer_id = self._req(
                          doc, "producer_id"
                      )
                      producer = store.get_producer(
                          producer_id
                      )
                      product = self._req(
                          doc, "product"
                      )
                      quantity = float(
                          doc.get("quantity", 0)
                      )
                      if quantity <= 0:
                          raise ValueError(
                              "cantidad invalida"
                          )
                      unit = self._req(doc, "unit")
                      network_seq: int | None = None
                      zid = producer.get("zid")
                      if zid is not None:
                          ok, data, _error = (
                              link.record_agro_event(
                                  str(zid),
                                  "production",
                                  f"{product}:"
                                  f" {quantity}"
                                  f" {unit}",
                              )
                          )
                          if (
                              ok
                              and data is not None
                          ):
                              network_seq = int(
                                  data.get("seq", 0)
                              )
                      store.add_production(
                          production_id=(
                              "PRO-"
                              + uuid.uuid4().hex[:12]
                          ),
                          producer_id=producer_id,
                          product=product,
                          quantity=quantity,
                          unit=unit,
                          network_seq=network_seq,
                      )
                      self._html(
                          200,
                          _page(
                              "Cosecha registrada",
                              "<h1>Guardado en la"
                              " Red</h1>"
                              f"<p>{product}:"
                              f" {quantity} {unit}"
                              "</p>"
                              "<a href='/agro/productor/"
                              f"{producer_id}'>"
                              "<button>Volver a mi"
                              " panel</button></a>",
                          ),
                      )
                      return
                  if s == ["verify"]:
                      producer_id = self._req(
                          doc, "producer_id"
                      )
                      row = store.get_producer(
                          producer_id
                      )
                      zid = row.get("zid")
                      if zid is None:
                          raise ValueError(
                              "sin ZID de red"
                          )
                      ok, _data, _error = (
                          link.complete_trust(
                              str(zid)
                          )
                      )
                      if not ok:
                          raise ValueError(
                              "la red rechazo la"
                              " verificacion"
                          )
                      store.mark_verified(
                          producer_id=producer_id
                      )
                      self._html(
                          200,
                          _page(
                              "Verificado",
                              "<h1>Productor"
                              " VERIFICADO</h1>"
                              "<p>Ya puede recibir"
                              " bonos y beneficios"
                              " del gobierno.</p>"
                              "<a href='/agro/productor/"
                              f"{producer_id}'>"
                              "<button>Ir a mi panel"
                              "</button></a>",
                          ),
                      )
                      return
                  self._html(
                      404,
                      _page(
                          "404",
                          "<h1>Ruta desconocida"
                          "</h1>",
                      ),
                  )

              def _read_form(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  ).decode("utf-8")
                  doc: dict[str, Any] = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          key, value = pair.split(
                              "=", 1
                          )
                          doc[key] = value.replace(
                              "+", " "
                          )
                  return doc

              def _read_json(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  )
                  parsed: Any = json.loads(
                      raw.decode("utf-8")
                  )
                  if not isinstance(parsed, dict):
                      raise ValueError(
                          "body must be a JSON"
                          " object"
                      )
                  return {
                      str(k): v
                      for k, v in parsed.items()
                  }

              @staticmethod
              def _req(
                  doc: dict[str, Any], key: str
              ) -> str:
                  value: Any = doc.get(key)
                  if isinstance(value, int) and not isinstance(
                      value, bool
                  ):
                      value = str(value)
                  if not isinstance(value, str):
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  if not value.strip():
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  return value

              def _api_get(self, s: list[str]) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app": "agro",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  if s == ["producers"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": list(
                                  store.list_producers()
                              ),
                          },
                      )
                      return
                  if s == ["productions"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": list(
                                  store.list_productions()
                              ),
                          },
                      )
                      return
                  if s == ["government", "summary"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": store.summary(),
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _api_post(
                  self, s: list[str]
              ) -> None:
                  store = type(self).store
                  doc = self._read_json()
                  if s == ["producers"]:
                      producer_id = (
                          "PRD-"
                          + uuid.uuid4().hex[:12]
                      )
                      row = store.add_producer(
                          producer_id=producer_id,
                          zid=doc.get("zid"),
                          name=self._req(doc, "name"),
                          producer_type=self._req(
                              doc, "producer_type"
                          ),
                          role=str(
                              doc.get(
                                  "role",
                                  "agricultor",
                              )
                          ),
                          location=None,
                          synced=False,
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  if s == ["production"]:
                      row = store.add_production(
                          production_id=(
                              "PRO-"
                              + uuid.uuid4().hex[:12]
                          ),
                          producer_id=self._req(
                              doc, "producer_id"
                          ),
                          product=self._req(
                              doc, "product"
                          ),
                          quantity=float(
                              doc.get("quantity", 0)
                          ),
                          unit=self._req(doc, "unit"),
                          network_seq=None,
                      )
                      self._send(
                          201,
                          {
