name: zyra-w12-engine-certification

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Clean engine init (W391)
        run: |
          set -euo pipefail
          f="shared_engines/certification/__init__.py"
          [ -f "$f" ] && printf '"""ZYRA Network engine package."""\n' > "$f"
          echo "init cleaned"

      - name: Fill certification engine (integration layer)
        run: |
          set -euo pipefail
          cat > shared_engines/certification/errors.py <<'PYEOF'
          """Typed certification errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
          )


          class IssuerNotRegisteredError(EngineError):
              """Entity is not an accredited certifier."""


          class ScopeNotAuthorizedError(EngineError):
              """Issuer lacks authority for this scope."""


          class CertificateNotFoundError(EngineError):
              """Unknown certificate id."""


          class AlreadyRevokedError(EngineError):
              """Certificate was already revoked."""
          PYEOF

          cat > shared_engines/certification/contracts.py <<'PYEOF'
          """Certification contracts."""
          from __future__ import annotations

          from dataclasses import dataclass


          @dataclass(frozen=True)
          class IssuerRecord:
              issuer_id: str
              display_name: str
              scopes: tuple[str, ...]
              registered_at: float
              active: bool


          @dataclass(frozen=True)
          class CertificateRecord:
              certificate_id: str
              subject_zid: str
              issuer_id: str
              scope: str
              title: str
              detail: str
              evidence: tuple[str, ...]
              credential_id: str
              signature: bytes
              public_pem: bytes
              issued_at: float
              valid_until: float | None
              revoked: bool


          @dataclass(frozen=True)
          class CertificationVerdict:
              """Evidence-backed certification answer."""

              certificate_id: str
              signature_valid: bool
              within_validity: bool
              issuer_authorized: bool
              not_revoked: bool
              valid: bool
              credential_id: str
              evidence: dict[str, object]
          PYEOF

          cat > shared_engines/certification/registry.py <<'PYEOF'
          """Accredited certifier registry: WHO may certify
          WHAT. An issuer is a Network identity (ZID) formally
          accredited for explicit certification scopes;
          issuing outside accredited scopes is impossible by
          construction."""
          from __future__ import annotations

          from shared_engines.common.clocks import Clock
          from shared_engines.common.validation import (
              require_non_empty_str,
          )
          from shared_engines.certification.contracts import (
              IssuerRecord,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "certification_issuers",
                  (
                      "CREATE TABLE"
                      " certification_issuers ("
                      " issuer_id TEXT PRIMARY KEY,"
                      " display_name TEXT NOT NULL,"
                      " scopes TEXT NOT NULL,"
                      " registered_at REAL NOT NULL,"
                      " active INTEGER NOT NULL"
                      " DEFAULT 1)",
                  ),
              ),
          )


          class IssuerRegistry:
              """Durable accreditation of certifiers."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db,
                      "certification.issuers",
                      _MIGRATIONS,
                  ).run(clock)

              def register_issuer(
                  self,
                  *,
                  issuer_id: str,
                  display_name: str,
                  scopes: tuple[str, ...],
              ) -> IssuerRecord:
                  require_non_empty_str(
                      issuer_id, "issuer_id"
                  )
                  require_non_empty_str(
                      display_name,
                      "display_name",
                  )
                  clean: list[str] = []
                  for scope in scopes:
                      require_non_empty_str(
                          scope, "scope"
                      )
                      if scope not in clean:
                          clean.append(scope)
                  if not clean:
                      raise ValueError(
                          "at least one scope"
                          " required"
                      )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " certification_issuers"
                          " (issuer_id,"
                          " display_name, scopes,"
                          " registered_at, active)"
                          " VALUES (?, ?, ?, ?, 1)"
                          " ON CONFLICT(issuer_id)"
                          " DO UPDATE SET"
                          " display_name ="
                          " excluded.display_name,"
                          " scopes ="
                          " excluded.scopes,"
                          " active = 1",
                          (
                              issuer_id,
                              display_name,
                              ",".join(clean),
                              now,
                          ),
                      )
                  return IssuerRecord(
                      issuer_id=issuer_id,
                      display_name=(
                          display_name
                      ),
                      scopes=tuple(clean),
                      registered_at=now,
                      active=True,
                  )

              def deactivate_issuer(
                  self, issuer_id: str
              ) -> None:
                  require_non_empty_str(
                      issuer_id, "issuer_id"
                  )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE"
                          " certification_issuers"
                          " SET active = 0"
                          " WHERE issuer_id = ?",
                          (issuer_id,),
                      )

              def get_issuer(
                  self, issuer_id: str
              ) -> IssuerRecord | None:
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " certification_issuers"
                      " WHERE issuer_id = ?",
                      (issuer_id,),
                  )
                  if row is None:
                      return None
                  return IssuerRecord(
                      issuer_id=str(
                          row["issuer_id"]
                      ),
                      display_name=str(
                          row["display_name"]
                      ),
                      scopes=tuple(
                          s
                          for s in str(
                              row["scopes"]
                          ).split(",")
                          if s
                      ),
                      registered_at=float(
                          row["registered_at"]
                      ),
                      active=bool(
                          int(row["active"])
                      ),
                  )

              def has_scope(
                  self,
                  *,
                  issuer_id: str,
                  scope: str,
              ) -> bool:
                  issuer = self.get_issuer(
                      issuer_id
                  )
                  if issuer is None:
                      return False
                  return (
                      issuer.active
                      and scope
                      in issuer.scopes
                  )
          PYEOF

          cat > shared_engines/certification/engine.py <<'PYEOF'
          """Certification engine: the integration layer.

          Composes EXISTING network capabilities into formal
          certifications - never duplicating them:

              IssuerRegistry     who may certify what (new)
              IdentityEngine     subject + issuer exist (reuse)
              CredentialRegistry durable credential per
                                 certificate, revocable
                                 (reuse, CERTIFICATION type)
              Ed25519Signer      network-notarized signature
                                 (reuse)

          A certificate is a signed, durable, verifiable
          statement bound to its underlying credential:
          revoke certificate -> credential revoked too.
          """
          from __future__ import annotations

          import hashlib
          import json
          import sqlite3

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              NotFoundError,
          )
          from shared_engines.common.identifiers import (
              new_id,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
          )
          from shared_engines.common.validation import (
              require_non_empty_str,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.engine import (
              IdentityEngine,
          )
          from shared_engines.certification.contracts import (
              CertificateRecord,
              CertificationVerdict,
          )
          from shared_engines.certification.errors import (
              AlreadyRevokedError,
              CertificateNotFoundError,
              IssuerNotRegisteredError,
              ScopeNotAuthorizedError,
          )
          from shared_engines.certification.registry import (
              IssuerRegistry,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )
          from shared_engines.verification.credentials import (
              CredentialRegistry,
              CredentialType,
          )
          from shared_engines.verification.signatures import (
              Ed25519Signer,
              Ed25519Verifier,
          )

          EVENT_CERT_ISSUED = (
              "certification.certificate.issued"
          )
          EVENT_CERT_REVOKED = (
              "certification.certificate.revoked"
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "certificates",
                  (
                      "CREATE TABLE certificates ("
                      " certificate_id TEXT"
                      " PRIMARY KEY,"
                      " subject_zid TEXT NOT NULL,"
                      " issuer_id TEXT NOT NULL,"
                      " scope TEXT NOT NULL,"
                      " title TEXT NOT NULL,"
                      " detail TEXT NOT NULL,"
                      " evidence_json TEXT"
                      " NOT NULL,"
                      " content_sha TEXT NOT NULL,"
                      " credential_id TEXT"
                      " NOT NULL,"
                      " signature BLOB NOT NULL,"
                      " public_pem BLOB NOT NULL,"
                      " issued_at REAL NOT NULL,"
                      " valid_until REAL,"
                      " revoked INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " revoked_at REAL,"
                      " revoked_reason TEXT)",
                      "CREATE INDEX certs_subject"
                      " ON certificates"
                      " (subject_zid)",
                      "CREATE INDEX certs_scope"
                      " ON certificates (scope)",
                  ),
              ),
          )


          def _content_sha(
              *,
              title: str,
              detail: str,
              evidence: tuple[str, ...],
              issued_at: float,
              valid_until: float | None,
          ) -> str:
              src = canonical_json_dumps(
                  {
                      "title": title,
                      "detail": detail,
                      "evidence": list(evidence),
                      "issued_at": issued_at,
                      "valid_until": valid_until,
                  }
              )
              return hashlib.sha256(
                  src.encode("utf-8")
              ).hexdigest()


          def _sig_payload(
              *,
              certificate_id: str,
              subject_zid: str,
              issuer_id: str,
              scope: str,
              content_sha: str,
          ) -> bytes:
              return (
                  f"CERT:{certificate_id}:"
                  f"{subject_zid}:{issuer_id}:"
                  f"{scope}:{content_sha}"
              ).encode("utf-8")


          class CertificationEngine:
              """Formal certifications over existing
              engines."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  issuers: IssuerRegistry,
                  identity: IdentityEngine,
                  credentials: CredentialRegistry,
                  signer: Ed25519Signer,
                  audit: AuditTrail,
                  outbox: Outbox,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._issuers = issuers
                  self._identity = identity
                  self._credentials = (
                      credentials
                  )
                  self._signer = signer
                  self._audit = audit
                  self._outbox = outbox
                  self._public_pem = (
                      signer.public_pem
                  )
                  MigrationRunner(
                      db,
                      "certification.certs",
                      _MIGRATIONS,
                  ).run(clock)

              def _emit(
                  self,
                  cursor: sqlite3.Cursor,
                  *,
                  event_type: str,
                  aggregate: str,
                  payload: dict[str, object],
              ) -> None:
                  event_id = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "t": event_type,
                              "a": aggregate,
                              "p": payload,
                              "ts": self._clock.now(),
                          }
                      ).encode("utf-8")
                  ).hexdigest()[:32]
                  fp = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "id": event_id,
                              "ty": event_type,
                          }
                      ).encode("utf-8")
                  ).hexdigest()
                  cursor.execute(
                      "INSERT INTO events_outbox"
                      " (event_id, event_type,"
                      " aggregate_id, schema_version,"
                      " envelope_version, created_at,"
                      " payload, fingerprint,"
                      " published_at)"
                      " VALUES (?, ?, ?, 1, 1, ?, ?,"
                      " ?, NULL)",
                      (
                          event_id,
                          event_type,
                          aggregate,
                          self._clock.now(),
                          canonical_json_dumps(
                              payload
                          ),
                          fp,
                      ),
                  )

              def issue_certificate(
                  self,
                  *,
                  subject_zid: str,
                  issuer_id: str,
                  scope: str,
                  title: str,
                  detail: str,
                  evidence: tuple[str, ...] = (),
                  valid_until: float | None = None,
              ) -> CertificateRecord:
                  """Accredited issuer certifies a
                  subject. Refuses unregistered issuers,
                  unauthorized scopes, unknown subjects.
                  Always creates the underlying durable
                  credential (integration, not
                  duplication)."""
                  require_non_empty_str(
                      subject_zid, "subject_zid"
                  )
                  require_non_empty_str(
                      issuer_id, "issuer_id"
                  )
                  require_non_empty_str(
                      scope, "scope"
                  )
                  require_non_empty_str(
                      title, "title"
                  )
                  issuer = (
                      self._issuers.get_issuer(
                          issuer_id
                      )
                  )
                  if issuer is None:
                      raise IssuerNotRegisteredError(
                          "not an accredited"
                          f" certifier: {issuer_id}"
                      )
                  if not issuer.active:
                      raise IssuerNotRegisteredError(
                          "certifier deactivated:"
                          f" {issuer_id}"
                      )
                  if scope not in issuer.scopes:
                      raise ScopeNotAuthorizedError(
                          f"issuer {issuer_id} is"
                          " not accredited for"
                          f" scope '{scope}'"
                      )
                  self._identity.require_identity(
                      subject_zid
                  )
                  self._identity.require_identity(
                      issuer_id
                  )
                  now = self._clock.now()
                  credential = (
                      self._credentials.issue(
                          subject_zid=subject_zid,
                          issuer_zid=issuer_id,
                          credential_type=(
                              CredentialType
                              .CERTIFICATION
                          ),
                          title=title,
                          detail=detail,
                          valid_from=now,
                          valid_until=valid_until,
                      )
                  )
                  certificate_id = (
                      f"CRT-{new_id()}"
                  )
                  content_sha = _content_sha(
                      title=title,
                      detail=detail,
                      evidence=evidence,
                      issued_at=now,
                      valid_until=valid_until,
                  )
                  signature = self._signer.sign(
                      _sig_payload(
                          certificate_id=(
                              certificate_id
                          ),
                          subject_zid=subject_zid,
                          issuer_id=issuer_id,
                          scope=scope,
                          content_sha=content_sha,
                      )
                  )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO certificates"
                          " (certificate_id,"
                          " subject_zid, issuer_id,"
                          " scope, title, detail,"
                          " evidence_json,"
                          " content_sha,"
                          " credential_id,"
                          " signature, public_pem,"
                          " issued_at, valid_until)"
                          " VALUES (?, ?, ?, ?, ?, ?,"
                          " ?, ?, ?, ?, ?, ?, ?)",
                          (
                              certificate_id,
                              subject_zid,
                              issuer_id,
                              scope,
                              title,
                              detail,
                              canonical_json_dumps(
                                  list(evidence)
                              ),
                              content_sha,
                              credential.credential_id,
                              signature,
                              self._public_pem,
                              now,
                              valid_until,
                          ),
                      )
                      self._emit(
                          cursor,
                          event_type=(
                              EVENT_CERT_ISSUED
                          ),
                          aggregate=(
                              certificate_id
                          ),
                          payload={
                              "subject": (
                                  subject_zid
                              ),
                              "issuer": issuer_id,
                              "scope": scope,
                          },
                      )
                  self._audit.append(
                      event_type=EVENT_CERT_ISSUED,
                      actor=issuer_id,
                      subject=certificate_id,
                      payload={
                          "subject": subject_zid,
                          "scope": scope,
                      },
                  )
                  return (
                      self.require_certificate(
                          certificate_id=(
                              certificate_id
                          )
                      )
                  )

              def _row_to_record(
                  self, row: sqlite3.Row
              ) -> CertificateRecord:
                  raw_ev = row["evidence_json"]
                  parsed = json.loads(str(raw_ev))
                  ev_list = (
                      [str(e) for e in parsed]
                      if isinstance(parsed, list)
                      else []
                  )
                  return CertificateRecord(
                      certificate_id=str(
                          row["certificate_id"]
                      ),
                      subject_zid=str(
                          row["subject_zid"]
                      ),
                      issuer_id=str(
                          row["issuer_id"]
                      ),
                      scope=str(row["scope"]),
                      title=str(row["title"]),
                      detail=str(
                          row["detail"]
                      ),
                      evidence=tuple(ev_list),
                      credential_id=str(
                          row["credential_id"]
                      ),
                      signature=bytes(
                          row["signature"]
                      ),
                      public_pem=bytes(
                          row["public_pem"]
                      ),
                      issued_at=float(
                          row["issued_at"]
                      ),
                      valid_until=(
                          float(
                              row["valid_until"]
                          )
                          if row["valid_until"]
                          is not None
                          else None
                      ),
                      revoked=bool(
                          int(row["revoked"])
                      ),
                  )

              def get_certificate(
                  self,
                  *,
                  certificate_id: str,
              ) -> CertificateRecord | None:
                  row = self._db.query_one(
                      "SELECT * FROM certificates"
                      " WHERE certificate_id = ?",
                      (certificate_id,),
                  )
                  if row is None:
                      return None
                  return self._row_to_record(
                      row
                  )

              def require_certificate(
                  self,
                  *,
                  certificate_id: str,
              ) -> CertificateRecord:
                  record = self.get_certificate(
                      certificate_id=(
                          certificate_id
                      )
                  )
                  if record is None:
                      raise (
                          CertificateNotFoundError(
                              "unknown certificate:"
                              f" {certificate_id}"
                          )
                      )
                  return record

              def verify_certificate(
                  self,
                  *,
                  certificate_id: str,
              ) -> CertificationVerdict:
                  """Full evidence-backed check:
                  signature, validity window, issuer
                  accreditation, revocation."""
                  row = self._db.query_one(
                      "SELECT * FROM certificates"
                      " WHERE certificate_id = ?",
                      (certificate_id,),
                  )
                  if row is None:
                      raise NotFoundError(
                          "unknown certificate:"
                          f" {certificate_id}"
                      )
                  record = self._row_to_record(
                      row
                  )
                  content_sha = _content_sha(
                      title=record.title,
                      detail=record.detail,
                      evidence=record.evidence,
                      issued_at=(
                          record.issued_at
                      ),
                      valid_until=(
                          record.valid_until
                      ),
                  )
                  verifier = Ed25519Verifier(
                      record.public_pem
                  )
                  signature_valid = (
                      verifier.verify(
                          _sig_payload(
                              certificate_id=(
                                  certificate_id
                              ),
                              subject_zid=(
                                  record.subject_zid
                              ),
                              issuer_id=(
                                  record.issuer_id
                              ),
                              scope=record.scope,
                              content_sha=(
                                  content_sha
                              ),
                          ),
                          record.signature,
                      )
                  )
                  now = self._clock.now()
                  within = (
                      record.valid_until is None
                      or now <= record.valid_until
                  )
                  authorized = (
                      self._issuers.has_scope(
                          issuer_id=(
                              record.issuer_id
                          ),
                          scope=record.scope,
                      )
                  )
                  not_revoked = (
                      not record.revoked
                  )
                  valid = (
                      signature_valid
                      and within
                      and authorized
                      and not_revoked
                  )
                  return CertificationVerdict(
                      certificate_id=(
                          certificate_id
                      ),
                      signature_valid=(
                          signature_valid
                      ),
                      within_validity=within,
                      issuer_authorized=(
                          authorized
                      ),
                      not_revoked=not_revoked,
                      valid=valid,
                      credential_id=(
                          record.credential_id
                      ),
                      evidence={
                          "subject": (
                              record.subject_zid
                          ),
                          "issuer": (
                              record.issuer_id
                          ),
                          "scope": record.scope,
                          "issued_at": (
                              record.issued_at
                          ),
                          "valid_until": (
                              record.valid_until
                          ),
                      },
                  )

              def revoke_certificate(
                  self,
                  *,
                  certificate_id: str,
                  revoked_by: str,
                  reason: str,
              ) -> CertificateRecord:
                  """Revoke the certificate AND its
                  underlying credential (cascade)."""
                  record = (
                      self.require_certificate(
                          certificate_id=(
                              certificate_id
                          )
                      )
                  )
                  if record.revoked:
                      raise AlreadyRevokedError(
                          "already revoked:"
                          f" {certificate_id}"
                      )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE certificates"
                          " SET revoked = 1,"
                          " revoked_at = ?,"
                          " revoked_reason = ?"
                          " WHERE certificate_id"
                          " = ?",
                          (
                              now,
                              reason,
                              certificate_id,
                          ),
                      )
                      self._emit(
                          cursor,
                          event_type=(
                              EVENT_CERT_REVOKED
                          ),
                          aggregate=(
                              certificate_id
                          ),
                          payload={
                              "reason": reason
                          },
                      )
                  self._credentials.revoke(
                      record.credential_id,
                      revoked_by=revoked_by,
                      reason=reason,
                  )
                  self._audit.append(
                      event_type=(
                          EVENT_CERT_REVOKED
                      ),
                      actor=revoked_by,
                      subject=certificate_id,
                      payload={"reason": reason},
                  )
                  return (
                      self.require_certificate(
                          certificate_id=(
                              certificate_id
                          )
                      )
                  )

              def list_by_subject(
                  self, *, subject_zid: str
              ) -> tuple[CertificateRecord, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM certificates"
                      " WHERE subject_zid = ?"
                      " ORDER BY issued_at",
                      (subject_zid,),
                  )
                  return tuple(
                      self._row_to_record(row)
                      for row in rows
                  )

              def list_by_scope(
                  self, *, scope: str
              ) -> tuple[CertificateRecord, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM certificates"
                      " WHERE scope = ?"
                      " ORDER BY issued_at",
                      (scope,),
                  )
                  return tuple(
                      self._row_to_record(row)
                      for row in rows
                  )
          PYEOF
          echo "=== CERTIFICATION ENGINE READY (integrated) ==="

      - name: Certification proofs (4)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/certification/tests
          cat > shared_engines/certification/tests/test_certification.py <<'PYEOF'
          """Certification proofs: accredited issuance with
          underlying credential, scope enforcement, expiry,
          cascade revocation."""
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import (
              FrozenClock,
          )
          from shared_engines.events.contracts import (
              EventCatalog,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              IdentityKind,
          )
          from shared_engines.identity.engine import (
              IdentityEngine,
          )
          from shared_engines.certification.engine import (
              CertificationEngine,
          )
          from shared_engines.certification.errors import (
              IssuerNotRegisteredError,
              ScopeNotAuthorizedError,
          )
          from shared_engines.certification.registry import (
              IssuerRegistry,
          )
          from shared_engines.storage.database import (
              SQLiteAdapter,
          )
          from shared_engines.verification.credentials import (
              CredentialRegistry,
          )
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )


          class _Net:
              def __init__(
                  self, tmp_path: Path
              ) -> None:
                  self.db = SQLiteAdapter(
                      tmp_path / "net.db"
                  )
                  self.clock = FrozenClock()
                  self.audit = AuditTrail(
                      self.db, self.clock
                  )
                  self.outbox = Outbox(
                      self.db, self.clock
                  )
                  self.outbox.ensure_schema()
                  self.catalog = EventCatalog()
                  for et in (
                      "identity.registered",
                      "identity.status_changed",
                      "verification.credential"
                      ".issued",
                      "verification.credential"
                      ".revoked",
                      "certification.certificate"
                      ".issued",
                      "certification.certificate"
                      ".revoked",
                  ):
                      self.catalog.register(et)
                  self.identity = IdentityEngine(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                  )
                  self.credentials = (
                      CredentialRegistry(
                          self.db,
                          self.clock,
                          self.audit,
                          self.outbox,
                          self.catalog,
                      )
                  )
                  self.issuers = IssuerRegistry(
                      self.db, self.clock
                  )
                  signer, _ = (
                      Ed25519Signer.generate()
                  )
                  self.certification = (
                      CertificationEngine(
                          self.db,
                          self.clock,
                          issuers=self.issuers,
                          identity=self.identity,
                          credentials=(
                              self.credentials
                          ),
                          signer=signer,
                          audit=self.audit,
                          outbox=self.outbox,
                      )
                  )

              def close(self) -> None:
                  self.db.close()


          def test_accredited_issue_and_verify(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  uni = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind
                              .INSTITUTION
                          ),
                          display_name="Uni SV",
                          actor="bootstrap",
                      )
                  )
                  student = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="maria",
                          actor="bootstrap",
                      )
                  )
                  net.issuers.register_issuer(
                      issuer_id=uni.zid,
                      display_name="Uni SV",
                      scopes=(
                          "education",
                          "professional",
                      ),
                  )
                  cert = (
                      net.certification
                      .issue_certificate(
                          subject_zid=student.zid,
                          issuer_id=uni.zid,
                          scope="education",
                          title=(
                              "Ingenieria en"
                              " Informatica"
                          ),
                          detail=(
                              "Titulo registrado"
                          ),
                          evidence=(
                              "doc-123",
                              "record-456",
                          ),
                      )
                  )
                  assert (
                      cert.credential_id != ""
                  )
                  underlying = (
                      net.credentials.get(
                          cert.credential_id
                      )
                  )
                  assert underlying is not None
                  assert (
                      underlying.revoked is False
                  )
                  verdict = (
                      net.certification
                      .verify_certificate(
                          certificate_id=(
                              cert.certificate_id
                          )
                      )
                  )
                  assert verdict.valid is True
                  assert (
                      verdict.signature_valid
                      is True
                  )
                  assert (
                      verdict.issuer_authorized
                      is True
                  )
                  assert (
                      verdict.credential_id
                      == cert.credential_id
                  )
              finally:
                  net.close()


          def test_unaccredited_or_scope_denied(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  stranger = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="x",
                          actor="bootstrap",
                      )
                  )
                  target = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="y",
                          actor="bootstrap",
                      )
                  )
                  with pytest.raises(
                      IssuerNotRegisteredError
                  ):
                      net.certification.issue_certificate(
                          subject_zid=target.zid,
                          issuer_id=stranger.zid,
                          scope="education",
                          title="fake",
                          detail="fake",
                      )
                  uni = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind
                              .INSTITUTION
                          ),
                          display_name="Uni",
                          actor="bootstrap",
                      )
                  )
                  net.issuers.register_issuer(
                      issuer_id=uni.zid,
                      display_name="Uni",
                      scopes=("education",),
                  )
                  with pytest.raises(
                      ScopeNotAuthorizedError
                  ):
                      net.certification.issue_certificate(
                          subject_zid=target.zid,
                          issuer_id=uni.zid,
                          scope="medical",
                          title="fake",
                          detail="fake",
                      )
              finally:
                  net.close()


          def test_expired_certificate_invalid(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  uni = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind
                              .INSTITUTION
                          ),
                          display_name="Board",
                          actor="bootstrap",
                      )
                  )
                  pro = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="pro",
                          actor="bootstrap",
                      )
                  )
                  net.issuers.register_issuer(
                      issuer_id=uni.zid,
                      display_name="Board",
                      scopes=(
                          "professional",
                      ),
                  )
                  cert = (
                      net.certification
                      .issue_certificate(
                          subject_zid=pro.zid,
                          issuer_id=uni.zid,
                          scope="professional",
                          title="Licencia",
                          detail="2026",
                          valid_until=(
                              net.clock.now()
                              + 10.0
                          ),
                      )
                  )
                  early = (
                      net.certification
                      .verify_certificate(
                          certificate_id=(
                              cert.certificate_id
                          )
                      )
                  )
                  assert (
                      early.within_validity
                      is True
                  )
                  assert early.valid is True
                  net.clock.advance(11)
                  late = (
                      net.certification
                      .verify_certificate(
                          certificate_id=(
                              cert.certificate_id
                          )
                      )
                  )
                  assert (
                      late.within_validity
                      is False
                  )
                  assert (
                      late.valid is False
                  )
              finally:
                  net.close()


          def test_revoke_cascades_to_credential(
              tmp_path: Path,
          ) -> None:
              net = _Net(tmp_path)
              try:
                  uni = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind
                              .INSTITUTION
                          ),
                          display_name="Uni",
                          actor="bootstrap",
                      )
                  )
                  grad = (
                      net.identity.register_identity(
                          kind=(
                              IdentityKind.PERSON
                          ),
                          display_name="g",
                          actor="bootstrap",
                      )
                  )
                  net.issuers.register_issuer(
                      issuer_id=uni.zid,
                      display_name="Uni",
                      scopes=("education",),
                  )
                  cert = (
                      net.certification
                      .issue_certificate(
                          subject_zid=grad.zid,
                          issuer_id=uni.zid,
                          scope="education",
                          title="Diploma",
                          detail="ok",
                      )
                  )
                  before = (
                      net.certification
                      .verify_certificate(
                          certificate_id=(
                              cert.certificate_id
                          )
                      )
                  )
                  assert before.valid is True
                  revoked = (
                      net.certification
                      .revoke_certificate(
                          certificate_id=(
                              cert.certificate_id
                          ),
                          revoked_by=uni.zid,
                          reason="fraud detected",
                      )
                  )
                  assert (
                      revoked.revoked is True
                  )
                  after = (
                      net.certification
                      .verify_certificate(
                          certificate_id=(
                              cert.certificate_id
                          )
                      )
                  )
                  assert (
                      after.valid is False
                  )
                  assert (
                      after.not_revoked
                      is False
                  )
                  underlying = (
                      net.credentials.get(
                          cert.credential_id
                      )
                  )
                  assert underlying is not None
                  assert (
                      underlying.revoked is True
                  )
                  with pytest.raises(Exception):
                      net.certification.revoke_certificate(
                          certificate_id=(
                              cert.certificate_id
                          ),
                          revoked_by=uni.zid,
                          reason="again",
                      )
              finally:
                  net.close()
