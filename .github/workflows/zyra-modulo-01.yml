              def do_POST(self) -> None:
                  path, _query = (
                      self._split_path()
                  )
                  try:
                      if path == (
                          "/agro/producers"
                      ):
                          self._producers_api()
                          return
                      if path == (
                          "/agro/producers/verify"
                      ):
                          self._verify_api()
                          return
                      if path == (
                          "/agro/production"
                      ):
                          self._production_api()
                          return
                      if path == (
                          "/agro/alerts/evaluate"
                      ):
                          self._alerts_api()
                          return
                      if path == (
                          "/agro/register"
                      ):
                          self._register()
                          return
                      if path == (
                          "/agro/aid/request"
                      ):
                          self._aid_request()
                          return
                      if path == (
                          "/agro/aid/eligibility"
                      ):
                          self._aid_eligibility()
                          return
                      if path == (
                          "/agro/government/approve"
                      ):
                          self._aid_approve()
                          return
                      if path == (
                          "/agro/government/assign"
                      ):
                          self._aid_assign()
                          return
                      if path == (
                          "/agro/government"
                          "/deliver"
                      ):
                          self._aid_deliver()
                          return
                      if path == (
                          "/agro/government"
                          "/confirm"
                      ):
                          self._aid_confirm()
                          return
                      self._api_error(
                          404,
                          "unknown path: "
                          + path,
                      )
                  except LookupError as exc:
                      self._api_error(
                          404, str(exc)
                      )
                  except (
                      ValueError,
                      PermissionError,
                  ) as exc:
                      self._api_error(
                          400, str(exc)
                      )
                  except Exception:
                      self._api_error(
                          500, "server error"
                      )

              def _role_of(
                  self, doc: dict,
              ) -> str:
                  role = self._value(
                      doc, "role"
                  ).strip()
                  if not role:
                      role = "agricultor"
                  if role not in ROLES:
                      raise ValueError(
                          "unknown role: "
                          + role
                      )
                  return role

              def _register(self) -> None:
                  doc = self._payload() or {}
                  role = self._role_of(doc)
                  name = self._value(
                      doc, "name"
                  ).strip()
                  if not name:
                      self._send_html(
                          400,
                          "<html><body><h1>AGRO"
                          "</h1><p>name"
                          " requerido</p>"
                          "</body></html>",
                      )
                      return
                  producer_id = (
                      _new_producer_id()
                  )
                  ok, data, _err = (
                      self.link
                      .register_producer_zid(
                          name
                      )
                  )
                  zid = (
                      _find_zid(data)
                      if ok and data
                      else None
                  )
                  self.store.add_producer(
                      producer_id=producer_id,
                      zid=zid,
                      name=name,
                      producer_type=self._value(
                          doc, "producer_type"
                      )
                      or role,
                      role=role,
                      location=self._value(
                          doc, "location"
                      )
                      or None,
                      synced=zid is not None,
                  )
                  if zid is not None:
                      self._trust_best_effort(
                          zid
                      )
                      self.store.mark_verified(
                          producer_id=(
                              producer_id
                          )
                      )
                  self._send_html(
                      200,
                      "<html><body><h1>AGRO</h1>"
                      "<p>Productor"
                      " registrado</p>"
                      "<p>id: "
                      + producer_id
                      + "</p><p>zid: "
                      + str(zid)
                      + "</p><p><a"
                      " href='/agro/productor/"
                      + producer_id
                      + "'>Panel"
                      " productor</a></p>"
                      "</body></html>",
                  )

              def _producers_api(self) -> None:
                  doc = self._payload() or {}
                  role = self._role_of(doc)
                  name = self._value(
                      doc, "name"
                  ).strip()
                  if not name:
                      self._api_error(
                          400,
                          "name is required",
                      )
                      return
                  producer_id = (
                      _new_producer_id()
                  )
                  ok, data, _err = (
                      self.link
                      .register_producer_zid(
                          name
                      )
                  )
                  zid = (
                      _find_zid(data)
                      if ok and data
                      else None
                  )
                  row = self.store.add_producer(
                      producer_id=producer_id,
                      zid=zid,
                      name=name,
                      producer_type=self._value(
                          doc, "producer_type"
                      )
                      or role,
                      role=role,
                      location=self._value(
                          doc, "location"
                      )
                      or None,
                      synced=zid is not None,
                  )
                  if zid is not None:
                      self._trust_best_effort(
                          zid
                      )
                      self.store.mark_verified(
                          producer_id=(
                              producer_id
                          )
                      )
                      row = (
                          self.store.get_producer(
                              producer_id
                          )
                      )
                  self._ok(row)

              def _verify_api(self) -> None:
                  doc = self._payload() or {}
                  producer_id = self._value(
                      doc, "producer_id"
                  )
                  self.store.mark_verified(
                      producer_id=producer_id
                  )
                  row = self.store.get_producer(
                      producer_id
                  )
                  self._ok(
                      {
                          "producer_id": (
                              producer_id
                          ),
                          "verified": row[
                              "verified"
                          ],
                      }
                  )

              def _production_api(self) -> None:
                  doc = self._payload() or {}
                  producer_id = self._value(
                      doc, "producer_id"
                  )
                  producer = (
                      self.store.get_producer(
                          producer_id
                      )
                  )
                  product = self._value(
                      doc, "product"
                  ).strip()
                  if not product:
                      self._api_error(
                          400,
                          "product is required",
                      )
                      return
                  try:
                      quantity = float(
                          self._value(
                              doc, "quantity"
                          )
                      )
                  except ValueError:
                      self._api_error(
                          400,
                          "quantity must be a"
                          " number",
                      )
                      return
                  unit = self._value(
                      doc, "unit"
                  ).strip() or "quintal"
                  seq = (
                      self._network_event(
                          producer.get("zid"),
                          "PRODUCTION_REGISTERED",
                          product
                          + " "
                          + format(
                              quantity, ".2f"
                          ),
                      )
                  )
                  row = self.store.add_production(
                      production_id=(
                          _new_production_id()
                      ),
                      producer_id=producer_id,
                      product=product,
                      quantity=quantity,
                      unit=unit,
                      network_seq=seq,
                  )
                  self._ok(row)

              def _alerts_api(self) -> None:
                  doc = self._payload() or {}
                  try:
                      previous = float(
                          self._value(
                              doc,
                              "previous_price",
                          )
                      )
                      current = float(
                          self._value(
                              doc,
                              "current_price",
                          )
                      )
                  except ValueError:
                      self._api_error(
                          400,
                          "prices must be numbers",
                      )
                      return
                  if previous <= 0:
                      self._api_error(
                          400,
                          "previous_price must"
                          " be positive",
                      )
                      return
                  change = (
                      current - previous
                  ) / previous
                  alert = abs(change) > 0.05
                  direction = (
                      "up"
                      if change > 0
                      else (
                          "down"
                          if change < 0
                          else "flat"
                      )
                  )
                  self._ok(
                      {
                          "alert": alert,
                          "direction": direction,
                          "change_pct": round(
                              change * 100, 2
                          ),
                      }
                  )

              def _aid_request(self) -> None:
                  doc = self._payload() or {}
                  producer_id = self._value(
                      doc, "producer_id"
                  )
                  producer = (
                      self.store.get_producer(
                          producer_id
                      )
                  )
                  program = self._value(
                      doc, "program"
                  ).strip()
                  item = self._value(
                      doc, "item"
                  ).strip()
                  if not program or not item:
                      self._api_error(
                          400,
                          "program and item are"
                          " required",
                      )
                      return
                  try:
                      quantity = float(
                          self._value(
                              doc, "quantity"
                          )
                          or "1"
                      )
                  except ValueError:
                      self._api_error(
                          400,
                          "quantity must be a"
                          " number",
                      )
                      return
                  seq = (
                      self._network_event(
                          producer.get("zid"),
                          "AID_REQUESTED",
                          program + ": " + item,
                      )
                  )
                  aid = (
                      self.store.create_aid_request(
                          aid_id=_new_aid_id(),
                          producer_id=(
                              producer_id
                          ),
                          program=program,
                          item=item,
                          quantity=quantity,
                          network_seq=seq,
                      )
                  )
                  self._ok(aid)

              def _aid_eligibility(self) -> None:
                  doc = self._payload() or {}
                  aid_id = self._value(
                      doc, "aid_id"
                  )
                  aid = self.store.get_aid(
                      aid_id
                  )
                  producer = (
                      self.store.get_producer(
                          str(
                              aid["producer_id"]
                          )
                      )
                  )
                  eligible = bool(
                      producer["verified"]
                  )
                  reason = (
                      "productor verificado"
                      if eligible
                      else "productor no"
                      " verificado"
                  )
                  seq = (
                      self._network_event(
                          aid.get("zid"),
                          "AID_ELIGIBILITY_"
                          "EVALUATED",
                          reason,
                      )
                  )
                  result = (
                      self.store.evaluate_aid(
                          aid_id=aid_id,
                          eligible=eligible,
                          reason=reason,
                          network_seq=seq,
                      )
                  )
                  self._ok(result)

              def _aid_approve(self) -> None:
                  doc = self._payload() or {}
                  aid_id = self._value(
                      doc, "aid_id"
                  )
                  aid = self.store.get_aid(
                      aid_id
                  )
                  seq = (
                      self._network_event(
                          aid.get("zid"),
                          "AID_APPROVED",
                          str(aid["program"]),
                      )
                  )
                  self._ok(
                      self.store.approve_aid(
                          aid_id=aid_id,
                          network_seq=seq,
                      )
                  )

              def _aid_assign(self) -> None:
                  doc = self._payload() or {}
                  aid_id = self._value(
                      doc, "aid_id"
                  )
                  detail = self._value(
                      doc, "detail"
                  ).strip() or None
                  aid = self.store.get_aid(
                      aid_id
                  )
                  seq = (
                      self._network_event(
                          aid.get("zid"),
                          "AID_ASSIGNED",
                          detail
                          or str(aid["program"]),
                      )
                  )
                  self._ok(
                      self.store.assign_aid(
                          aid_id=aid_id,
                          detail=detail,
                          network_seq=seq,
                      )
                  )

              def _aid_deliver(self) -> None:
                  doc = self._payload() or {}
                  aid_id = self._value(
                      doc, "aid_id"
                  )
                  detail = self._value(
                      doc, "detail"
                  ).strip() or None
                  aid = self.store.get_aid(
                      aid_id
                  )
                  seq = (
                      self._network_event(
                          aid.get("zid"),
                          "AID_DELIVERED",
                          detail
                          or str(aid["item"]),
                      )
                  )
                  self._ok(
                      self.store.deliver_aid(
                          aid_id=aid_id,
                          detail=detail,
                          network_seq=seq,
                      )
                  )

              def _aid_confirm(self) -> None:
                  doc = self._payload() or {}
                  aid_id = self._value(
                      doc, "aid_id"
                  )
                  aid = self.store.get_aid(
                      aid_id
                  )
                  seq = (
                      self._network_event(
                          aid.get("zid"),
                          "AID_DELIVERY_"
                          "CONFIRMED",
                          str(aid["program"]),
                      )
                  )
                  self._ok(
                      self.store.confirm_aid(
                          aid_id=aid_id,
                          network_seq=seq,
                      )
                  )


          def serve_agro(
              store: AgroStore,
              client: object,
              *,
              host: str = "127.0.0.1",
              port: int = 0,
          ) -> ThreadingHTTPServer:
              handler = type(
                  "BoundAgroHandler",
                  (AgroApiHandler,),
                  {
                      "store": store,
                      "link": ZyraLink(client),
                  },
              )
              server = ThreadingHTTPServer(
                  (host, port), handler,
              )
              server.bound_port = (
                  server.server_address[1]
              )
              return server
          PYEOF
          python -m py_compile apps/agro/server.py
          echo "server written"

