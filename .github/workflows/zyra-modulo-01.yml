name: zyra-w20a-close-audit-gaps

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w20a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Prove W19 artifact exists (capabilities_api.py)
        run: |
          set -euo pipefail
          test -f shared_engines/runtime/capabilities_api.py
          echo "capabilities_api.py present: $(wc -l < shared_engines/runtime/capabilities_api.py) lines"

      - name: Deduplicate ALL test basenames (generic auto-rename)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from collections import defaultdict
          from pathlib import Path

          root = Path(".")
          files = [
              p
              for p in root.rglob("test_*.py")
              if ".git" not in p.parts
              and "__pycache__" not in p.parts
          ]
          groups: dict[str, list[Path]] = defaultdict(
              list
          )
          for path in files:
              groups[path.name].append(path)

          renamed = 0
          for name, paths in groups.items():
              if len(paths) < 2:
                  continue
              ordered = sorted(
                  paths,
                  key=lambda p: 0
                  if "shared_engines" in p.parts
                  else 1,
              )
              for extra in ordered[1:]:
                  parent = extra.parent.name
                  stem = extra.stem
                  target = (
                      extra.parent
                      / f"{stem}_{parent}.py"
                  )
                  counter = 1
                  while target.exists():
                      target = (
                          extra.parent
                          / f"{stem}_{parent}_{counter}.py"
                      )
                      counter += 1
                  extra.rename(target)
                  renamed += 1
                  print(
                      f"renamed {extra} -> {target}"
                  )
          print(f"total renamed: {renamed}")
          PYEOF
          dupes=$(find . -path ./.git -prune -o \
            -name 'test_*.py' -print \
            | xargs -n1 basename | sort | uniq -d)
          echo "duplicate test basenames now: [${dupes}]"
          test -z "$dupes"
          echo "=== COLLECTION FIXED ==="

      - name: Telemetry root becomes an explicit facade
        run: |
          set -euo pipefail
          cat > telemetry/__init__.py <<'PYEOF'
          """ZYRA Network telemetry facade.

          The real telemetry engine lives in
          ``shared_engines.telemetry`` (collector, system
          health, errors, tests). This root package is a
          thin composition facade: it re-exports the engine
          API so external consumers can import from either
          path, and exists so the root layout stays stable
          for deploy targets. It deliberately contains no
          second implementation.
          """
          from shared_engines.telemetry.collector import (
              TelemetryCollector,
          )
          from shared_engines.telemetry.errors import (
              TelemetryError,
          )
          from shared_engines.telemetry.system_health import (
              SystemHealth,
          )

          __all__ = [
              "TelemetryCollector",
              "TelemetryError",
              "SystemHealth",
          ]
          PYEOF
          echo "telemetry facade written"

      - name: README.md (real documentation)
        run: |
          set -euo pipefail
          cat > README.md <<'MDEOF'
          # ZYRA Network

          **Red de confianza digital independiente y autónoma.**
          Como el WiFi o la energía: todos la consumen, nadie necesita verla.

          Una infraestructura de identidad, verificación, autoridad y
          evidencia, consumible por aplicaciones propias y terceros
          autorizados (bancos, gobiernos, empresas, personas).

          ---

          ## Qué resuelve

          - **Un ID único de confianza (ZID)** por persona, empresa o
            dispositivo, creado una sola vez y reconocido por toda la red.
          - **Registro una vez, reconocido en todas partes**: quien se
            registra en una app autorizada obtiene su ZID y su perfil viaja
            con él (con permisos y auditoría por campo).
          - **Historial de por vida** tipo registro civil digital: partida de
            nacimiento, salud, educación, empleo — append-only y a prueba de
            manipulación (cadena de hashes por persona).
          - **Verificación para terceros con evidencia, no promesas**:
            cualquier comprador, banco o institución puede verificar un
            documento o firma OFFLINE con matemáticas (Ed25519 + SHA-256),
            sin confiar en el emisor ni consultar la red.
          - **Autoridad de certificación acreditada**: emisores registrados
            con scopes explícitos, certificados con vigencia y revocación en
            cascada.

          ## Arquitectura

              apps (NEXO, DoctorSV, Subastas, externas)
                        |
                        v
              HTTP surface (runtime/api.py + capabilities_api.py)
                        |
                        v
              ZyraKernel (identity, verification, tokens, currency)
              ZyraCapabilities (trust services composition)
                        |
                        v
              17 transverse engines (consensus, integrity, encryption,
              certification, search, reputation, compression,
              scalability, supervisor, workflow, routing, system_loader,
              compliance, integrations, export, interoperability, ai)
                        |
                        v
              Storage (SQLite durable, WAL, snapshots, self-heal)
              Events (transactional outbox, claim/lease/fencing)
              Audit (tamper-evident hash chain)

          ## Los 17 motores transversales

          | Motor | Responsabilidad |
          |---|---|
          | consensus | membership, términos, votos, líder por quorum, leases con fencing |
          | integrity | proofs durables de contenido, detección de manipulación |
          | encryption | keyring durable con rotación, sobres AES-GCM (zyra.enc.v1) |
          | certification | emisores acreditados, certificados firmados con vigencia y revocación |
          | search | búsquedas globales autorizadas, auditadas y paginadas |
          | reputation | score con evidencia inmutable y decay temporal |
          | compression | gzip con guardas anti-bomba |
          | scalability | capacidad, backpressure, particionado estable |
          | supervisor | ciclo de vida con presupuesto de reinicios y cuarentena |
          | workflow | corridas durables multi-paso con compensación (saga) |
          | routing | tabla de rutas priorizada y determinística |
          | system_loader | carga por manifiestos con política de compatibilidad |
          | compliance | políticas por jurisdicción, decisiones auditadas |
          | integrations | adaptadores externos con retry y health |
          | export | paquetes de evidencia firmados, verificables offline |
          | interoperability | schemas versionados y negociación mutua |
          | ai | provenance de análisis: qué modelo, qué versión, qué hash |

          ## Superficie HTTP

          Núcleo (runtime/api.py): identity, verification (media,
          credentials, attestations), tokens, currency.

          Confianza (runtime/capabilities_api.py): apps autorizadas,
          perfil portable, onboarding a ACTIVE, historial de vida,
          notaría de documentos, búsqueda, reputación, export.

          ## Calidad

          - ~290 tests en verde (pytest, colección normal)
          - mypy --strict sobre todo shared_engines
          - flake8, compileall
          - CI en GitHub Actions: cada fase committeó código probado

          Ver CHANGELOG.md para el historial de construcción y
          docs/ROOT_AUTHORITY_RUNBOOK.md para el procedimiento de
          rotación de la autoridad raíz.
          MDEOF
          echo "README written"

      - name: CHANGELOG.md (real history)
        run: |
          set -euo pipefail
          cat > CHANGELOG.md <<'MDEOF'
          # Changelog

          All notable construction phases of ZYRA Network.
          Each entry landed as a green CI run with tested code.

          ## [1.0.0] - Network Core Complete

          ### Added
          - W1 Network flow: failover publishes elected events to the
            outbox; failover -> audit -> outbox -> telemetry closes.
          - W2 Storage lifecycle: typed DatabaseClosedError, adapter
            self-heal reopen on restored-file inode swap, fsync-durable
            snapshot restore.
          - W3 Outbox concurrency: atomic claim/lease, fencing tokens
            (LeaseLost), exponential backoff retry, dead-letter +
            requeue, expired-lease reaper.
          - W4 Physical replication: export_state/apply_state with
            FK-safe apply, transfer -> apply -> verify -> ack, delete
            propagation, divergence heal.

          ### Added - Trust services (product core)
          - W5 Portable identity: ProfileRegistry with per-field
            verification levels and scoped cross-app access, audited.
          - W6 Trust flow: onboarding walk REGISTERED ->
            PENDING_VERIFICATION -> VERIFIED -> ACTIVE via the identity
            contract; evidence-backed is_trusted.
          - W7 Lifelong history: append-only per-ZID civic timeline
            (birth_registration first), tamper-evident hash chain.

          ### Added - 17 transverse engines
          - consensus, integrity, encryption (durable keyring over
            EnvelopeCrypto), certification (accredited issuers, cascade
            revocation), search (authorized + audited), reputation
            (evidence-backed, decay), compression (bomb guards),
            scalability (backpressure + stable partitioning),
            supervisor (restart budget -> quarantine), workflow
            (saga compensation), routing (prioritized failover),
            system_loader (manifest compatibility policy), compliance
            (multi-jurisdiction), integrations (retry/health), export
            (signed offline-verifiable bundles), interoperability
            (mutual-version negotiation), ai (honest provenance).

          ### Added - Composition and surface
          - W18 Structural cleanup: 26 orphan __init__py dirs removed,
            empty namespaces removed; ZyraCapabilities composes 14
            trust services over one database.
          - W19 HTTP trust surface: CapabilitiesApiHandler +
            CapabilitiesServer (14 routes), optional bearer token,
            registered-apps enforced by engines.
          - W20a Audit-gap closure: pytest normal collection fixed
            (all test basenames unique), README/CHANGELOG written,
            root authority rotation runbook, telemetry root facade.
          MDEOF
          echo "CHANGELOG written"

      - name: Root authority rotation runbook (closes audit point 22)
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/ROOT_AUTHORITY_RUNBOOK.md <<'MDEOF'
          # Root Authority — Rotation Runbook

          Operational procedure for rotating the Root Authority key
          (shared_engines/authority/root.py). This document is the
          operational contract; the code enforces the mechanics.

          ## Roles

          - **Custodian**: holds the master key passphrase; never
            sees the private key in plaintext.
          - **Authorizer**: approves the rotation (two-person rule
            recommended for production).
          - **Operator**: executes the procedure and records evidence.

          ## Preconditions

          1. Current authority loads and verifies:
             `RootAuthority(...).load_or_create()` returns an active
             signer and matching status record.
          2. A fresh snapshot of the authority database exists
             (SnapshotManager.create, label `pre-rotation`).
          3. The rotation is recorded in an incident/change ticket
             with authorizer approval.

          ## Procedure

          1. **Backup** — snapshot as in precondition 2; verify its
             manifest hash.
          2. **Rotate** — call
             `root.rotate(rotated_by="<operator-id>")`.
             The engine persists the new encrypted key, records the
             rotation timestamp, and appends the new fingerprint to
             the historical fingerprints chain.
          3. **Verify** —
             - `load_or_create()` returns the NEW key with the NEW
               fingerprint.
             - `historical_fingerprints()` contains the old
               fingerprint followed by the new one (order preserved).
             - Signatures issued BEFORE rotation still verify against
               the OLD public key (keep old public keys published).
          4. **Publish** — distribute the new public key to every
             consumer that verifies attestations offline.
          5. **Record evidence** — attach to the ticket: snapshot
             label, rotation timestamp, old and new fingerprints.

          ## Recovery

          - If rotation is interrupted mid-write, the engine's
            file-atomic writes leave either the old or the new state,
            never a mixed one; re-running `load_or_create()` shows
            which. Restore the `pre-rotation` snapshot only if the
            new state is unusable, then repeat from step 2.
          - Historical fingerprints are append-only: NEVER edit them;
            to invalidate a mistaken rotation, rotate again.

          ## What is kept

          - Every historical fingerprint (verification of documents
            signed under old keys remains possible forever).
          - The encrypted previous private keys are retained by the
            storage layer for audit; their plaintext is never
            reconstructed outside `load_or_create`.
          MDEOF
          echo "runbook written"

      - name: Normalize EOF of generated docs (no trailing blank lines)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path

          for name in (
              "README.md",
              "CHANGELOG.md",
              "docs/ROOT_AUTHORITY_RUNBOOK.md",
          ):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              stripped = text.rstrip("\n") + "\n"
              if stripped != text:
                  path.write_text(
                      stripped, encoding="utf-8"
                  )
                  print(f"normalized EOF: {name}")
          print("EOF normalization done")
          PYEOF

      - name: Quality gates (normal pytest first, then full regression)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity shared_engines/verification shared_engines/runtime shared_engines/tokenization shared_engines/currency shared_engines/verifier shared_engines/hardening shared_engines/authority shared_engines/network shared_engines/telemetry shared_engines/logs shared_engines/consensus shared_engines/integrity shared_engines/encryption shared_engines/certification shared_engines/search shared_engines/reputation shared_engines/compression shared_engines/scalability shared_engines/supervisor shared_engines/workflow shared_engines/routing shared_engines/system_loader shared_engines/compliance shared_engines/integrations shared_engines/export shared_engines/interoperability shared_engines/ai"
          python -m compileall -q $M main.py scripts shared_engines/tests observability/tests
          echo "compile OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +
          echo "===== NORMAL PYTEST (no importlib) — the audit blocker ====="
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider shared_engines tests/test_deployment.py observability/tests
          echo "normal pytest OK"
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M main.py scripts tests/test_deployment.py --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --import-mode=importlib $M shared_engines/tests tests/test_deployment.py observability/tests
          echo "pytest importlib OK"
          find $M scripts -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W20a audit-gap closure - normal pytest collection fixed (generic dedup of all duplicate test basenames), real README + CHANGELOG (EOF normalized), ROOT_AUTHORITY_RUNBOOK, telemetry root facade; capabilities_api.py presence proven"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W20A COMPLETE ==="
