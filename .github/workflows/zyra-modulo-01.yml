name: zyra-s8-laboratorio-e2e

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-s8-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9" "pytest-timeout>=2,<3"

      - name: LAB NetworkClient (production pattern)
        run: |
          set -euo pipefail
          mkdir -p apps/laboratorio/infrastructure/network
          touch apps/laboratorio/__init__.py
          touch apps/laboratorio/infrastructure/__init__.py
          touch apps/laboratorio/infrastructure/network/__init__.py
          cat > apps/laboratorio/infrastructure/network/network_client.py <<'PYEOF'
          """LABORATORIO HTTP client to ZYRA Network."""
          from __future__ import annotations

          import json
          import os
          import urllib.request


          class NetworkClient:
              def __init__(
                  self,
                  base_url: str | None = None,
                  *,
                  timeout_seconds: float = 5.0,
                  max_retries: int = 2,
              ) -> None:
                  self._base = (
                      base_url
                      or os.environ.get("ZYRA_URL", "")
                  ).rstrip("/")
                  self._timeout = timeout_seconds
                  self._retries = max(0, max_retries)

              def get(self, path: str) -> tuple[
                  bool, dict | None, str | None,
              ]:
                  return self._call("GET", path)

              def post(
                  self, path: str, payload: dict,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._call("POST", path, payload)

              def _call(
                  self,
                  method: str,
                  path: str,
                  payload: dict | None = None,
              ) -> tuple[bool, dict | None, str | None]:
                  if not self._base:
                      return (
                          False,
                          None,
                          "ZYRA_URL not configured",
                      )
                  url = self._base + path
                  data = None
                  if payload is not None:
                      data = json.dumps(
                          payload
                      ).encode("utf-8")
                  last_error = "unknown"
                  for attempt in range(
                      self._retries + 1
                  ):
                      try:
                          request = urllib.request.Request(
                              url,
                              data=data,
                              method=method,
                              headers={
                                  "Content-Type":
                                  "application/json"
                              },
                          )
                          with urllib.request.urlopen(
                              request,
                              timeout=self._timeout,
                          ) as response:
                              body = json.loads(
                                  response.read()
                                  .decode("utf-8")
                              )
                          if (
                              body.get("ok")
                              is True
                          ):
                              return (
                                  True,
                                  body.get("data"),
                                  None,
                              )
                          error = body.get(
                              "error", {}
                          )
                          return (
                              False,
                              None,
                              str(
                                  error.get(
                                      "message",
                                      "rejected",
                                  )
                              ),
                          )
                      except Exception as exc:
                          last_error = str(exc)
                  return False, None, last_error
          PYEOF
          python -m py_compile apps/laboratorio/infrastructure/network/network_client.py
          echo "network client written"

      - name: LAB Store (scenarios simulations creations projections)
        run: |
          set -euo pipefail
          mkdir -p apps/laboratorio/infrastructure/persistence
          touch apps/laboratorio/infrastructure/persistence/__init__.py
          cat > apps/laboratorio/infrastructure/persistence/laboratorio_store.py <<'PYEOF'
          """LABORATORIO durable store - production.
          Decision scenarios with real evaluation math,
          creations as real files (SVG), projection
          registry."""
          from __future__ import annotations

          import uuid

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          SCENARIO_TYPES = (
              "politica",
              "ley",
              "app",
              "mercado",
              "tienda",
              "trabajo",
              "invencion",
          )

          CREATION_TYPES = (
              "documento",
              "grafico",
              "plano",
              "logo",
              "presentacion",
              "ropa",
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "laboratorio",
                  (
                      "CREATE TABLE lab_scenarios ("
                      " scenario_id TEXT PRIMARY KEY,"
                      " owner_zid TEXT,"
                      " scenario_type TEXT NOT NULL,"
                      " title TEXT NOT NULL,"
                      " description TEXT NOT NULL,"
                      " parameters TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " result_data TEXT,"
                      " impact_score REAL,"
                      " risk_level TEXT,"
                      " recommendation TEXT,"
                      " sealed_doc TEXT,"
                      " created_at REAL NOT NULL,"
                      " updated_at REAL NOT NULL)",
                      "CREATE TABLE lab_creations ("
                      " creation_id TEXT PRIMARY KEY,"
                      " owner_zid TEXT,"
                      " creation_type TEXT NOT NULL,"
                      " title TEXT NOT NULL,"
                      " description TEXT NOT NULL,"
                      " svg_content TEXT NOT NULL,"
                      " sealed_doc TEXT,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE lab_projections ("
                      " projection_id TEXT PRIMARY KEY,"
                      " creation_id TEXT NOT NULL,"
                      " mode TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          def _nid(prefix: str) -> str:
              return prefix + uuid.uuid4().hex[:10]


          def evaluate_scenario(
              *,
              scenario_type: str,
              cost: float,
              benefit: float,
              affected_population: int,
              risk_percent: float,
              time_months: int,
          ) -> dict[str, object]:
              """Real deterministic evaluation math.
              Production-grade scenario scoring."""
              if cost < 0 or benefit < 0:
                  raise ValueError(
                      "cost and benefit must be"
                      " non-negative"
                  )
              if affected_population <= 0:
                  raise ValueError(
                      "affected_population must be"
                      " positive"
                  )
              if not 0 <= risk_percent <= 100:
                  raise ValueError(
                      "risk_percent must be 0..100"
                  )
              if time_months <= 0:
                  raise ValueError(
                      "time_months must be positive"
                  )
              net_impact = round(
                  benefit - cost, 2
              )
              cost_per_person = round(
                  cost / affected_population, 4
              )
              benefit_per_person = round(
                  benefit / affected_population, 4
              )
              if cost > 0:
                  bc_ratio = round(
                      benefit / cost, 2
                  )
              else:
                  bc_ratio = 0.0
              monthly_benefit = round(
                  benefit / time_months, 2
              )
              if bc_ratio >= 2.0 and (
                  risk_percent <= 30
              ):
                  risk_level = "bajo"
                  impact_score = round(
                      min(
                          100.0,
                          bc_ratio * 25
                          + (
                              100 - risk_percent
                          )
                          * 0.4
                          + min(
                              affected_population
                              / 1000,
                              20,
                          ),
                      ),
                      2,
                  )
                  recommendation = (
                      "VIABLE - proceder con"
                      " implementacion"
                  )
              elif bc_ratio >= 1.0 and (
                  risk_percent <= 60
              ):
                  risk_level = "medio"
                  impact_score = round(
                      min(
                          100.0,
                          bc_ratio * 20
                          + (
                              100 - risk_percent
                          )
                          * 0.3,
                      ),
                      2,
                  )
                  recommendation = (
                      "VIABLE CON AJUSTES -"
                      " reducir riesgo o costo"
                      " antes de proceder"
                  )
              else:
                  risk_level = "alto"
                  impact_score = round(
                      max(
                          0.0,
                          bc_ratio * 15
                          + (
                              100 - risk_percent
                          )
                          * 0.2,
                      ),
                      2,
                  )
                  recommendation = (
                      "NO VIABLE EN ESTAS"
                      " CONDICIONES -"
                      " replantear parametros"
                  )
              return {
                  "net_impact": net_impact,
                  "cost_per_person": (
                      cost_per_person
                  ),
                  "benefit_per_person": (
                      benefit_per_person
                  ),
                  "bc_ratio": bc_ratio,
                  "monthly_benefit": (
                      monthly_benefit
                  ),
                  "risk_level": risk_level,
                  "impact_score": (
                      impact_score
                  ),
                  "recommendation": (
                      recommendation
                  ),
              }


          class LaboratorioStore:
              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db,
                      "laboratorio",
                      _MIGRATIONS,
                  ).run(clock)

              def create_scenario(
                  self,
                  *,
                  scenario_id: str,
                  owner_zid: str | None,
                  scenario_type: str,
                  title: str,
                  description: str,
                  parameters: str,
              ) -> dict[str, object]:
                  if scenario_type not in (
                      SCENARIO_TYPES
                  ):
                      raise ValueError(
                          f"unknown scenario type:"
                          f" {scenario_type}"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO lab_scenarios ("
                          " scenario_id, owner_zid,"
                          "  scenario_type, title,"
                          "  description, parameters,"
                          "  status, created_at,"
                          "  updated_at)"
                          " VALUES (?, ?, ?, ?, ?, ?,"
                          "  'created', ?, ?)",
                          (
                              scenario_id,
                              owner_zid,
                              scenario_type,
                              title,
                              description,
                              parameters,
                              now,
                              now,
                          ),
                      )
                  return self.get_scenario(
                      scenario_id
                  )

              def run_scenario(
                  self,
                  *,
                  scenario_id: str,
                  cost: float,
                  benefit: float,
                  affected_population: int,
                  risk_percent: float,
                  time_months: int,
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT scenario_type, title"
                      " FROM lab_scenarios"
                      " WHERE scenario_id = ?",
                      (scenario_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown scenario:"
                          f" {scenario_id}"
                      )
                  result = evaluate_scenario(
                      scenario_type=str(
                          row["scenario_type"]
                      ),
                      cost=cost,
                      benefit=benefit,
                      affected_population=(
                          affected_population
                      ),
                      risk_percent=risk_percent,
                      time_months=time_months,
                  )
                  now = self._clock.now()
                  import json as _json

                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE lab_scenarios SET"
                          " status = 'evaluated',"
                          " result_data = ?,"
                          " impact_score = ?,"
                          " risk_level = ?,"
                          " recommendation = ?,"
                          " updated_at = ?"
                          " WHERE scenario_id = ?",
                          (
                              _json.dumps(
                                  result
                              ),
                              result[
                                  "impact_score"
                              ],
                              result["risk_level"],
                              result[
                                  "recommendation"
                              ],
                              now,
                              scenario_id,
                          ),
                      )
                  result["scenario_id"] = (
                      scenario_id
                  )
                  result["title"] = str(
                      row["title"]
                  )
                  return result

              def get_scenario(
                  self, scenario_id: str,
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM lab_scenarios"
                      " WHERE scenario_id = ?",
                      (scenario_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown scenario:"
                          f" {scenario_id}"
                      )
                  sealed = row["sealed_doc"]
                  return {
                      "scenario_id": str(
                          row["scenario_id"]
                      ),
                      "owner_zid": (
                          str(row["owner_zid"])
                          if row["owner_zid"]
                          is not None
                          else None
                      ),
                      "scenario_type": str(
                          row["scenario_type"]
                      ),
                      "title": str(row["title"]),
                      "description": str(
                          row["description"]
                      ),
                      "status": str(row["status"]),
                      "result_data": (
                          str(row["result_data"])
                          if row["result_data"]
                          is not None
                          else None
                      ),
                      "impact_score": (
                          float(
                              row["impact_score"]
                          )
                          if row["impact_score"]
                          is not None
                          else None
                      ),
                      "risk_level": (
                          str(row["risk_level"])
                          if row["risk_level"]
                          is not None
                          else None
                      ),
                      "recommendation": (
                          str(
                              row[
                                  "recommendation"
                              ]
                          )
                          if row[
                              "recommendation"
                          ]
                          is not None
                          else None
                      ),
                      "sealed_doc": (
                          str(sealed)
                          if sealed is not None
                          else None
                      ),
                  }

              def list_scenarios(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT scenario_id FROM"
                      " lab_scenarios"
                      " ORDER BY created_at"
                  )
                  return tuple(
                      self.get_scenario(
                          str(r["scenario_id"])
                      )
                      for r in rows
                  )

              def seal_scenario(
                  self,
                  *,
                  scenario_id: str,
                  sealed_doc: str,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE lab_scenarios SET"
                          " sealed_doc = ?,"
                          " updated_at = ?"
                          " WHERE scenario_id = ?",
                          (
                              sealed_doc,
                              now,
                              scenario_id,
                          ),
                      )
                  return self.get_scenario(
                      scenario_id
                  )

              def create_creation(
                  self,
                  *,
                  creation_id: str,
                  owner_zid: str | None,
                  creation_type: str,
                  title: str,
                  description: str,
                  svg_content: str,
                  sealed_doc: str | None,
              ) -> dict[str, object]:
                  if creation_type not in (
                      CREATION_TYPES
                  ):
                      raise ValueError(
                          f"unknown creation type:"
                          f" {creation_type}"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO lab_creations ("
                          " creation_id, owner_zid,"
                          "  creation_type, title,"
                          "  description,"
                          "  svg_content,"
                          "  sealed_doc, created_at)"
                          " VALUES (?, ?, ?, ?, ?,"
                          "  ?, ?, ?)",
                          (
                              creation_id,
                              owner_zid,
                              creation_type,
                              title,
                              description,
                              svg_content,
                              sealed_doc,
                              now,
                          ),
                      )
                  return {
                      "creation_id": creation_id,
                      "creation_type": (
                          creation_type
                      ),
                      "title": title,
                  }

              def get_creation(
                  self, creation_id: str,
              ) -> dict[str, object] | None:
                  row = self._db.query_one(
                      "SELECT * FROM lab_creations"
                      " WHERE creation_id = ?",
                      (creation_id,),
                  )
                  if row is None:
                      return None
                  sealed = row["sealed_doc"]
                  return {
                      "creation_id": str(
                          row["creation_id"]
                      ),
                      "owner_zid": (
                          str(row["owner_zid"])
                          if row["owner_zid"]
                          is not None
                          else None
                      ),
                      "creation_type": str(
                          row["creation_type"]
                      ),
                      "title": str(row["title"]),
                      "description": str(
                          row["description"]
                      ),
                      "svg_content": str(
                          row["svg_content"]
                      ),
                      "sealed_doc": (
                          str(sealed)
                          if sealed is not None
                          else None
                      ),
                  }

              def list_creations(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT creation_id,"
                      " creation_type, title,"
                      " description FROM"
                      " lab_creations"
                      " ORDER BY created_at"
                  )
                  return tuple(
                      {
                          "creation_id": str(
                              r["creation_id"]
                          ),
                          "creation_type": str(
                              r["creation_type"]
                          ),
                          "title": str(
                              r["title"]
                          ),
                          "description": str(
                              r["description"]
                          ),
                      }
                      for r in rows
                  )

              def record_projection(
                  self,
                  *,
                  projection_id: str,
                  creation_id: str,
                  mode: str,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO lab_projections"
                          " (projection_id,"
                          "  creation_id, mode,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?)",
                          (
                              projection_id,
                              creation_id,
                              mode,
                              now,
                          ),
                      )
                  return {
                      "projection_id": (
                          projection_id
                      ),
                      "creation_id": creation_id,
                      "mode": mode,
                  }

              def summary(self) -> dict[str, object]:
                  scenarios = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " lab_scenarios"
                  )
                  evaluated = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " lab_scenarios WHERE"
                      " status = 'evaluated'"
                  )
                  creations = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM"
                      " lab_creations"
                  )
                  projections = (
                      self._db.query_one(
                          "SELECT COUNT(*) AS n"
                          " FROM lab_projections"
                      )
                  )
                  return {
                      "scenarios_total": int(
                          scenarios["n"]
                      )
                      if scenarios is not None
                      else 0,
                      "scenarios_evaluated": int(
                          evaluated["n"]
                      )
                      if evaluated is not None
                      else 0,
                      "creations_total": int(
                          creations["n"]
                      )
                      if creations is not None
                      else 0,
                      "projections_total": int(
                          projections["n"]
                      )
                      if projections
                      is not None
                      else 0,
                  }
          PYEOF
          python -m py_compile apps/laboratorio/infrastructure/persistence/laboratorio_store.py
          echo "store written"

      - name: LAB Link (production resilience)
        run: |
          set -euo pipefail
          mkdir -p apps/laboratorio/services
          touch apps/laboratorio/services/__init__.py
          cat > apps/laboratorio/services/laboratorio_link.py <<'PYEOF'
          """LaboratorioLink: LAB ops on the Network."""
          from __future__ import annotations

          import base64

          from apps.laboratorio.infrastructure.network.network_client import (
              NetworkClient,
          )


          class LaboratorioLink:
              def __init__(
                  self, client: NetworkClient
              ) -> None:
                  self._client = client

              def register_app(self) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/apps/register",
                      {
                          "app_id":
                          "laboratorio",
                          "display_name": (
                              "LABORATORIO"
                          ),
                          "scopes": [
                              "display_name",
                              "contact",
                          ],
                      },
                  )

              def register_person(
                  self, display_name: str
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": "person",
                          "display_name": display_name,
                          "actor": "laboratorio",
                      },
                  )

              def complete_trust(
                  self, zid: str,
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/trust/complete",
                      {
                          "zid": zid,
                          "actor": "laboratorio",
                      },
                  )

              def seal_document(
                  self,
                  *,
                  owner_zid: str,
                  title: str,
                  content: str,
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  encoded = base64.b64encode(
                      content.encode("utf-8")
                  ).decode("ascii")
                  return self._client.post(
                      "/documents/seal",
                      {
                          "owner_zid": owner_zid,
                          "title": title,
                          "content_b64": encoded,
                          "actor_app":
                          "laboratorio",
                      },
                  )

              def record_lab_event(
                  self,
                  zid: str,
                  event: str,
                  detail: str,
              ) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/history/append",
                      {
                          "zid": zid,
                          "entry_type": "other",
                          "actor_app":
                          "laboratorio",
                          "payload": {
                              "event": event,
                              "detail": detail,
                          },
                      },
                  )
          PYEOF
          python -m py_compile apps/laboratorio/services/laboratorio_link.py
          echo "link written"

      - name: LAB Server (production - decisions creations projector)
        run: |
          set -euo pipefail
          cat > apps/laboratorio/server.py <<'PYEOF'
          """LABORATORIO HTTP server - production.
          Decisiones Reales (scenario evaluation),
          Laboratorio de Creacion (SVG generators),
          Proyector holografico (CSS 3D real)."""
          from __future__ import annotations

          import html as _html
          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.laboratorio.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.laboratorio.infrastructure.persistence.laboratorio_store import (
              SCENARIO_TYPES,
              LaboratorioStore,
          )
          from apps.laboratorio.services.laboratorio_link import (
              LaboratorioLink,
          )

          _CSS = (
              "body{font-family:system-ui,sans-serif;"
              "background:#0d1117;color:#e6edf3;"
              "display:flex;justify-content:center;"
              "padding:20px;margin:0}"
              ".wrap{max-width:680px;width:100%}"
              "h1{font-size:1.3rem}"
              "h2{font-size:1rem;margin-top:20px;"
              "color:#58a6ff}"
              ".card{background:#161b22;border:1px solid"
              " #30363d;border-radius:10px;padding:14px;"
              "margin-top:10px}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px 18px;"
              "border-radius:8px;font-size:1rem;"
              "cursor:pointer;margin:6px 4px 0 0;"
              "width:100%;text-align:left}"
              "button.gray{background:#30363d}"
              "input,select,textarea{width:100%;"
              "box-sizing:border-box;background:"
              "#0d1117;color:#e6edf3;border:1px solid"
              " #30363d;border-radius:6px;padding:8px;"
              "margin:4px 0;font-size:0.95rem}"
              ".big{font-size:1.6rem;font-weight:bold;"
              "color:#58a6ff}"
              ".scene3d{perspective:900px;height:340px;"
              "display:flex;align-items:center;"
              "justify-content:center;"
              "background:radial-gradient("
              "ellipse at center,#16233a 0%,"
              "#0d1117 75%);border-radius:12px;"
              "overflow:hidden;margin-top:10px}"
              ".holo{transform-style:preserve-3d;"
              "animation:spin3d 14s linear infinite;"
              "width:260px;height:260px}"
              ".holo svg{width:100%;height:100%;"
              "filter:drop-shadow(0 0 18px"
              " #58a6ff)}"
              "@keyframes spin3d{0%{transform:"
              "rotateY(0deg) rotateX(12deg)}"
