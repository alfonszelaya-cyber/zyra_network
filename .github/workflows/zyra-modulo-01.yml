name: zyra-modulo-09-10-currency-api

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-09-10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01-08 present
        run: |
          set -euo pipefail
          test -f shared_engines/common/errors.py
          test -f shared_engines/storage/database.py
          test -f shared_engines/events/outbox.py
          test -f shared_engines/audit/chain.py
          test -f shared_engines/identity/engine.py
          test -f shared_engines/runtime/kernel.py
          test -f shared_engines/tokenization/engine.py
          echo "modules 01-08 present: OK"

      - name: Build currency engine + upgrade runtime API (modules 09+10)
        run: |
          set -euo pipefail
          mkdir -p shared_engines/currency/tests

          cat > shared_engines/currency/__init__.py <<'PYEOF'
          """Zyra currency engine: exact FX trust layer.

          The Network never custodies funds. Banks and payment
          providers move money; Zyra provides exact-decimal rates,
          immutable rate history, bridge routing (GTQ->USD->CNY),
          Ed25519-signed quotes verifiable offline by any counterparty,
          and auditable conversion records. Settlement references from
          external providers attach afterwards - never faked here.
          """
          from __future__ import annotations

          from shared_engines.currency.contracts import (
              CurrencyPair,
              Money,
              Quote,
              SignedQuote,
          )
          from shared_engines.currency.engine import CurrencyEngine
          from shared_engines.currency.errors import (
              CurrencyError,
              InvalidRateError,
              NoRouteError,
              QuoteExpiredError,
              RateUnavailableError,
              StaleRateError,
              UnknownCurrencyError,
          )
          from shared_engines.currency.rates import (
              ProviderChain,
              RateProvider,
              StaticTableRateProvider,
              compose_rates,
          )
          from shared_engines.currency.registry import (
              CurrencyRegistry,
              CurrencySpec,
          )
          from shared_engines.currency.signing import QuoteSigner
          from shared_engines.currency.store import DurableRateStore

          __all__ = [
              "CurrencyError", "CurrencyPair", "CurrencyRegistry",
              "CurrencySpec", "DurableRateStore", "InvalidRateError",
              "Money", "NoRouteError", "ProviderChain", "Quote",
              "QuoteExpiredError", "QuoteSigner", "RateProvider",
              "RateUnavailableError", "SignedQuote", "StaleRateError",
              "StaticTableRateProvider", "UnknownCurrencyError",
              "compose_rates",
          ]
          PYEOF

          cat > shared_engines/currency/errors.py <<'PYEOF'
          """Typed currency errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              EngineError,
              NotFoundError,
              ProviderTransientError,
              ValidationError,
          )


          class CurrencyError(EngineError):
              """Base for currency engine failures."""


          class UnknownCurrencyError(CurrencyError, NotFoundError):
              """The currency code is not in the registry."""


          class InvalidRateError(CurrencyError, ValidationError):
              """A rate is not a positive finite decimal."""


          class RateUnavailableError(CurrencyError, ProviderTransientError):
              """No provider could quote the pair."""


          class StaleRateError(CurrencyError, ValidationError):
              """The only stored quote is beyond the max age."""


          class QuoteExpiredError(CurrencyError, ValidationError):
              """A signed quote past its validity window."""


          class NoRouteError(CurrencyError, NotFoundError):
              """No direct or bridge route exists for the pair."""
          PYEOF

          cat > shared_engines/currency/contracts.py <<'PYEOF'
          """Versioned currency contracts: Money, pairs, quotes.

          Money accepts Decimal ONLY: binary floats are rejected at
          construction because their representation error is exactly
          the class of financial bug this engine prevents.
          """
          from __future__ import annotations

          from dataclasses import dataclass
          from decimal import Decimal

          from shared_engines.common.errors import ValidationError
          from shared_engines.common.validation import require_non_empty_str

          CURRENCY_CONTRACT_VERSION = 1


          @dataclass(frozen=True)
          class Money:
              amount: Decimal
              currency: str

              def __post_init__(self) -> None:
                  if not isinstance(self.amount, Decimal):
                      raise ValidationError(
                          "Money amount must be Decimal (build from str)"
                      )
                  if not self.amount.is_finite() or self.amount < 0:
                      raise ValidationError(
                          "Money amount must be finite and non-negative"
                      )
                  require_non_empty_str(self.currency, "currency")


          @dataclass(frozen=True)
          class CurrencyPair:
              base: str
              quote: str

              def __post_init__(self) -> None:
                  require_non_empty_str(self.base, "base")
                  require_non_empty_str(self.quote, "quote")
                  if self.base == self.quote:
                      raise ValidationError("base and quote must differ")

              @property
              def normalized(self) -> str:
                  return f"{self.base}/{self.quote}"


          @dataclass(frozen=True)
          class Quote:
              pair: CurrencyPair
              rate: Decimal
              quoted_at: float
              expires_at: float
              source: str

              def __post_init__(self) -> None:
                  if not isinstance(self.rate, Decimal):
                      raise ValidationError("rate must be Decimal")
                  if not self.rate.is_finite() or self.rate <= 0:
                      raise ValidationError("rate must be positive")
                  if self.expires_at <= self.quoted_at:
                      raise ValidationError("quote window is empty")


          @dataclass(frozen=True)
          class SignedQuote:
              quote: Quote
              issuer_zid: str
              signature: bytes
              signer_public_pem: bytes
              contract_version: int = CURRENCY_CONTRACT_VERSION
          PYEOF

          cat > shared_engines/currency/registry.py <<'PYEOF'
          """Currency registry: known codes, asset types, minor units.

          Minor units drive presentation rounding (2 for most fiat,
          0 for JPY/CLP, 8 for BTC). The baseline covers the Americas,
          Europe and Asia fiat plus crypto/metals; operators extend
          via register().
          """
          from __future__ import annotations

          from dataclasses import dataclass
          from enum import Enum

          from shared_engines.common.errors import ConfigurationError
          from shared_engines.common.validation import require_int_range
          from shared_engines.currency.errors import UnknownCurrencyError


          class CurrencyAssetType(Enum):
              FIAT = "fiat"
              CRYPTO = "crypto"
              COMMODITY = "commodity"


          @dataclass(frozen=True)
          class CurrencySpec:
              code: str
              asset_type: CurrencyAssetType
              minor_units: int


          _BASELINE: dict[str, tuple[CurrencyAssetType, int]] = {
              "USD": (CurrencyAssetType.FIAT, 2),
              "EUR": (CurrencyAssetType.FIAT, 2),
              "GBP": (CurrencyAssetType.FIAT, 2),
              "CHF": (CurrencyAssetType.FIAT, 2),
              "JPY": (CurrencyAssetType.FIAT, 0),
              "CNY": (CurrencyAssetType.FIAT, 2),
              "GTQ": (CurrencyAssetType.FIAT, 2),
              "MXN": (CurrencyAssetType.FIAT, 2),
              "COP": (CurrencyAssetType.FIAT, 2),
              "BRL": (CurrencyAssetType.FIAT, 2),
              "ARS": (CurrencyAssetType.FIAT, 2),
              "CLP": (CurrencyAssetType.FIAT, 0),
              "BTC": (CurrencyAssetType.CRYPTO, 8),
              "ETH": (CurrencyAssetType.CRYPTO, 8),
              "USDT": (CurrencyAssetType.CRYPTO, 6),
              "XAU": (CurrencyAssetType.COMMODITY, 3),
          }


          class CurrencyRegistry:
              def __init__(self) -> None:
                  self._specs: dict[str, CurrencySpec] = {
                      code: CurrencySpec(
                          code=code,
                          asset_type=asset_type,
                          minor_units=minor_units,
                      )
                      for code, (asset_type, minor_units) in _BASELINE.items()
                  }

              def register(
                  self,
                  code: str,
                  asset_type: CurrencyAssetType,
                  minor_units: int,
              ) -> None:
                  code = code.upper().strip()
                  if len(code) < 2 or len(code) > 8:
                      raise ConfigurationError(
                          "currency code must be 2-8 characters"
                      )
                  require_int_range(
                      minor_units, "minor_units", 0, 8, config=True
                  )
                  self._specs[code] = CurrencySpec(
                      code=code,
                      asset_type=asset_type,
                      minor_units=minor_units,
                  )

              def require(self, code: str) -> CurrencySpec:
                  spec = self._specs.get(code.upper().strip())
                  if spec is None:
                      raise UnknownCurrencyError(
                          f"unknown currency: {code}"
                      )
                  return spec

              def is_known(self, code: str) -> bool:
                  return code.upper().strip() in self._specs

              @property
              def codes(self) -> tuple[str, ...]:
                  return tuple(sorted(self._specs))
          PYEOF

          cat > shared_engines/currency/rates.py <<'PYEOF'
          """Rate providers behind a protocol + exact bridge composition.

          The domain depends on ``RateProvider`` only. The static
          table is an operator-maintained reference source that
          validates every entry at construction.
          """
          from __future__ import annotations

          from collections.abc import Sequence
          from decimal import Decimal

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import ConfigurationError
          from shared_engines.currency.contracts import CurrencyPair, Quote
          from shared_engines.currency.errors import (
              RateUnavailableError,
          )


          class RateProvider:
              """A named source of point-in-time quotes."""

              name: str

              def fetch(self, pair: CurrencyPair, clock: Clock) -> Quote:
                  raise RateUnavailableError(
                      "RateProvider.fetch must be implemented by subclasses"
                  )


          class StaticTableRateProvider(RateProvider):
              """Operator-maintained reference rates (exact decimals)."""

              def __init__(
                  self,
                  rates: dict[str, str],
                  clock: Clock,
                  *,
                  ttl_seconds: float = 300.0,
              ) -> None:
                  if not rates:
                      raise ConfigurationError(
                          "static rate table must not be empty"
                      )
                  self._clock = clock
                  self._rates: dict[str, Decimal] = {}
                  self.name = "static-table"
                  self._ttl = ttl_seconds
                  for key, raw in rates.items():
                      try:
                          value = Decimal(raw)
                      except Exception as exc:
                          raise ConfigurationError(
                              f"static rate {key} is not a decimal"
                          ) from exc
                      if not value.is_finite() or value <= 0:
                          raise ConfigurationError(
                              f"static rate {key} must be positive"
                          )
                      self._rates[key] = value

              def fetch(self, pair: CurrencyPair, clock: Clock) -> Quote:
                  rate = self._rates.get(pair.normalized)
                  if rate is None:
                      raise RateUnavailableError(
                          f"no quote for {pair.normalized}"
                      )
                  now = clock.now()
                  return Quote(
                      pair=pair,
                      rate=rate,
                      quoted_at=now,
                      expires_at=now + self._ttl,
                      source=self.name,
                  )


          class ProviderChain:
              """Tries providers in order; first success wins."""

              def __init__(self, providers: Sequence[RateProvider]) -> None:
                  if not providers:
                      raise ConfigurationError(
                          "at least one provider required"
                      )
                  self._providers: tuple[RateProvider, ...] = tuple(providers)

              def fetch(self, pair: CurrencyPair, clock: Clock) -> Quote:
                  failures: list[str] = []
                  for provider in self._providers:
                      try:
                          return provider.fetch(pair, clock)
                      except RateUnavailableError as exc:
                          failures.append(f"{provider.name}: {exc}")
                  raise RateUnavailableError(
                      f"all providers exhausted: {'; '.join(failures)}"
                  )


          def compose_rates(leg1: Decimal, leg2: Decimal) -> Decimal:
              """Composes two legs multiplicatively (exact)."""
              if not leg1.is_finite() or not leg2.is_finite():
                  raise ValueError("legs must be finite")
              return leg1 * leg2
          PYEOF

          cat > shared_engines/currency/store.py <<'PYEOF'
          """Durable rate store: immutable exact-decimal history.

          Rates are stored as TEXT for exact Decimal round-trips.
          Rows are immutable: a conflicting write under the same
          (pair, source, as_at) is an integrity error, never a
          silent overwrite. Historical as-of queries supported.
          """
          from __future__ import annotations

          from decimal import Decimal

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.currency.contracts import CurrencyPair, Quote
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          RATES_MIGRATIONS = (
              Migration(
                  1,
                  "exchange_rates",
                  (
                      "CREATE TABLE exchange_rates ("
                      " id INTEGER PRIMARY KEY AUTOINCREMENT,"
                      " pair TEXT NOT NULL,"
                      " rate TEXT NOT NULL,"
                      " source TEXT NOT NULL,"
                      " as_at REAL NOT NULL,"
                      " fetched_at REAL NOT NULL,"
                      " UNIQUE (pair, source, as_at))",
                      "CREATE INDEX rates_pair_time"
                      " ON exchange_rates (pair, as_at)",
                  ),
              ),
          )


          class DurableRateStore:
              def __init__(self, db: Database, clock: Clock) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "currency", RATES_MIGRATIONS
                  ).run(clock)

              def save(self, quote: Quote) -> None:
                  with self._db.transaction() as cursor:
                      existing = cursor.execute(
                          "SELECT rate FROM exchange_rates"
                          " WHERE pair = ? AND source = ? AND as_at = ?",
                          (
                              quote.pair.normalized,
                              quote.source,
                              quote.quoted_at,
                          ),
                      ).fetchone()
                      if existing is not None:
                          if str(existing["rate"]) != str(quote.rate):
                              raise IntegrityError(
                                  "conflicting rate for identical"
                                  " pair/source/timestamp"
                              )
                          return
                      cursor.execute(
                          "INSERT INTO exchange_rates"
                          " (pair, rate, source, as_at, fetched_at)"
                          " VALUES (?, ?, ?, ?, ?)",
                          (
                              quote.pair.normalized,
                              str(quote.rate),
                              quote.source,
                              quote.quoted_at,
                              self._clock.now(),
                          ),
                      )

              def latest(self, pair: CurrencyPair) -> Quote | None:
                  row = self._db.query_one(
                      "SELECT * FROM exchange_rates WHERE pair = ?"
                      " ORDER BY as_at DESC LIMIT 1",
                      (pair.normalized,),
                  )
                  if row is None:
                      return None
                  return self._quote_from_row(row)

              def as_of(
                  self, pair: CurrencyPair, at: float
              ) -> Quote | None:
                  row = self._db.query_one(
                      "SELECT * FROM exchange_rates WHERE pair = ?"
                      " AND as_at <= ? ORDER BY as_at DESC LIMIT 1",
                      (pair.normalized, at),
                  )
                  if row is None:
                      return None
                  return self._quote_from_row(row)

              @staticmethod
              def _quote_from_row(row: object) -> Quote:
                  if not hasattr(row, "__getitem__"):
                      raise IntegrityError("invalid rate row type")
                  normalized = str(row["pair"])
                  parts = normalized.split("/", 1)
                  if len(parts) != 2:
                      raise IntegrityError("corrupt pair in rate row")
                  rate = Decimal(str(row["rate"]))
                  as_at = float(row["as_at"])
                  return Quote(
                      pair=CurrencyPair(parts[0], parts[1]),
                      rate=rate,
                      quoted_at=as_at,
                      expires_at=as_at + 300.0,
                      source=str(row["source"]),
                  )
          PYEOF

          cat > shared_engines/currency/signing.py <<'PYEOF'
          """Ed25519-signed quotes: portable, third-party verifiable FX.

          A signed quote binds issuer, pair, rate and validity window
          into a canonical payload signed with the Network key. The
          receiving bank verifies offline that the presented rate is
          the one Zyra issued - no database access needed.
          """
          from __future__ import annotations

          from shared_engines.common.serialization import canonical_json_dumps
          from shared_engines.currency.contracts import Quote, SignedQuote
          from shared_engines.verification.signatures import (
              Ed25519Signer,
              Ed25519Verifier,
          )

          QUOTE_FORMAT = "zyra.fxquote.v1"


          def quote_canonical_bytes(signed: SignedQuote) -> bytes:
              payload = {
                  "format": QUOTE_FORMAT,
                  "pair": signed.quote.pair.normalized,
                  "rate": str(signed.quote.rate),
                  "quoted_at": f"{signed.quote.quoted_at:.6f}",
                  "expires_at": f"{signed.quote.expires_at:.6f}",
                  "source": signed.quote.source,
                  "issuer_zid": signed.issuer_zid,
              }
              return canonical_json_dumps(payload).encode("utf-8")


          class QuoteSigner:
              """Signs and verifies FX quotes with the Network key."""

              def __init__(self, signer: Ed25519Signer) -> None:
                  self._signer = signer

              def sign(self, quote: Quote, *, issuer_zid: str) -> SignedQuote:
                  candidate = SignedQuote(
                      quote=quote,
                      issuer_zid=issuer_zid,
                      signature=b"",
                      signer_public_pem=self._signer.public_pem,
                  )
                  data = quote_canonical_bytes(candidate)
                  signature = self._signer.sign(data)
                  return SignedQuote(
                      quote=quote,
                      issuer_zid=issuer_zid,
                      signature=signature,
                      signer_public_pem=self._signer.public_pem,
                  )

              @staticmethod
              def verify(signed: SignedQuote) -> bool:
                  data = quote_canonical_bytes(signed)
                  verifier = Ed25519Verifier(signed.signer_public_pem)
                  return verifier.verify(data, signed.signature)
          PYEOF

          cat > shared_engines/currency/engine.py <<'PYEOF'
          """Currency engine: quotes, bridge routing, signed FX records.

          Flow: an app requests a quote (USD->CNY, GTQ->USD); the
          engine resolves direct or via bridge, persists the rate
          immutably, signs it, and records the conversion intent.
          Settlement happens outside the Network (banks/providers);
          its reference attaches via record_settlement() - never
          faked here.
          """
          from __future__ import annotations

          from decimal import Decimal

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import NotFoundError, ValidationError
          from shared_engines.common.identifiers import new_id
          from shared_engines.common.validation import (
              require_non_empty_str,
              require_positive_number,
          )
          from shared_engines.currency.contracts import (
              CurrencyPair,
              Quote,
              SignedQuote,
          )
          from shared_engines.currency.errors import (
              NoRouteError,
              QuoteExpiredError,
              RateUnavailableError,
              StaleRateError,
          )
          from shared_engines.currency.rates import (
              ProviderChain,
              RateProvider,
              compose_rates,
          )
          from shared_engines.currency.registry import CurrencyRegistry
          from shared_engines.currency.signing import QuoteSigner
          from shared_engines.currency.store import DurableRateStore
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.observability.backend import (
              MetricsBackend,
              NoopMetrics,
              engine_logger,
          )
          from shared_engines.observability.health import (
              ComponentHealth,
              HealthStatus,
          )
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          EVENT_QUOTED = "currency.quote.issued"
          EVENT_CONVERTED = "currency.conversion.recorded"

          CONVERSIONS_MIGRATIONS = (
              Migration(
                  1,
                  "conversions",
                  (
                      "CREATE TABLE conversions ("
                      " conversion_id TEXT PRIMARY KEY,"
                      " subject_zid TEXT NOT NULL,"
                      " base TEXT NOT NULL,"
                      " quote_ccy TEXT NOT NULL,"
                      " base_amount TEXT NOT NULL,"
                      " quote_amount TEXT NOT NULL,"
                      " rate TEXT NOT NULL,"
                      " quote_source TEXT NOT NULL,"
                      " fx_settlement_ref TEXT,"
                      " created_at REAL NOT NULL,"
                      " contract_version INTEGER NOT NULL)",
                      "CREATE INDEX conversions_subject"
                      " ON conversions (subject_zid, created_at)",
                  ),
              ),
          )


          class CurrencyEngine:
              def __init__(
                  self,
                  *,
                  db: Database,
                  clock: Clock,
                  providers: list[RateProvider],
                  signer: object,
                  audit: AuditTrail,
                  outbox: Outbox,
                  catalog: EventCatalog,
                  identity: IdentityEngine,
                  bridge: str = "USD",
                  max_rate_age_seconds: float = 300.0,
                  metrics: MetricsBackend | None = None,
              ) -> None:
                  from shared_engines.currency.signing import QuoteSigner
                  from shared_engines.verification.signatures import (
                      Ed25519Signer,
                  )

                  if not isinstance(signer, Ed25519Signer):
                      raise ValidationError("signer must be Ed25519Signer")
                  require_non_empty_str(bridge, "bridge", config=True)
                  require_positive_number(
                      max_rate_age_seconds,
                      "max_rate_age_seconds",
                      config=True,
                  )
                  self._bridge = bridge.upper()
                  self._max_age = max_rate_age_seconds
                  self._registry = CurrencyRegistry()
                  self._chain = ProviderChain(list(providers))
                  self._store = DurableRateStore(db, clock)
                  self._quote_signer = QuoteSigner(signer)
                  self._identity = identity
                  self._audit = audit
                  self._outbox = outbox
                  self._clock = clock
                  self._db = db
                  self._catalog = catalog
                  self._metrics = metrics if metrics is not None else NoopMetrics()
                  self._log = engine_logger("currency")
                  self._catalog.register(EVENT_QUOTED)
                  self._catalog.register(EVENT_CONVERTED)
                  MigrationRunner(
                      db, "currency.conversions", CONVERSIONS_MIGRATIONS
                  ).run(clock)

              @property
              def registry(self) -> CurrencyRegistry:
                  return self._registry

              def quote(
                  self,
                  *,
                  base: str,
                  quote_ccy: str,
                  requester_zid: str,
              ) -> SignedQuote:
                  self._identity.require_identity(requester_zid)
                  base_u = base.upper().strip()
                  quote_u = quote_ccy.upper().strip()
                  self._registry.require(base_u)
                  self._registry.require(quote_u)
                  pair = CurrencyPair(base_u, quote_u)
                  stored = self._store.latest(pair)
                  now = self._clock.now()
                  if stored is not None and (
                      now - stored.quoted_at
                  ) <= self._max_age:
                      quote = stored
                  else:
                      quote = self._fetch_quote(pair, stored)
                      self._store.save(quote)
                  signed = self._quote_signer.sign(
                      quote, issuer_zid=requester_zid
                  )
                  event = self._catalog.build(
                      EVENT_QUOTED,
                      aggregate_id=pair.normalized,
                      payload={
                          "pair": pair.normalized,
                          "rate": str(quote.rate),
                          "source": quote.source,
                          "requester_zid": requester_zid,
                      },
                      clock=self._clock,
                  )
                  self._outbox.enqueue(event)
                  self._metrics.increment(
                      "currency.quoted", tags={"pair": pair.normalized}
                  )
                  self._log.info(
                      "quoted pair=%s rate=%s", pair.normalized, quote.rate
                  )
                  return signed

              def convert(
                  self,
                  *,
                  subject_zid: str,
                  base: str,
                  quote_ccy: str,
                  amount: Decimal,
              ) -> tuple[SignedQuote, str, Decimal]:
                  """Quotes, checks freshness, records the intent.

                  Returns (signed_quote, conversion_id, exact_amount).
                  The caller settles externally and attaches the
                  provider reference via record_settlement().
                  """
                  self._identity.require_identity(subject_zid)
                  if not isinstance(amount, Decimal):
                      raise ValidationError(
                          "amount must be Decimal (build from str)"
                      )
                  if not amount.is_finite() or amount <= 0:
                      raise ValidationError(
                          "amount must be positive and finite"
                      )
                  signed = self.quote(
                      base=base,
                      quote_ccy=quote_ccy,
                      requester_zid=subject_zid,
                  )
                  quote = signed.quote
                  if self._clock.now() > quote.expires_at:
                      raise QuoteExpiredError(
                          "quote expired before conversion"
                      )
                  exact = amount * quote.rate
                  conversion_id = f"CNV-{new_id()}"
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO conversions"
                          " (conversion_id, subject_zid, base, quote_ccy,"
                          "  base_amount, quote_amount, rate, quote_source,"
                          "  fx_settlement_ref, created_at,"
                          "  contract_version)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?, ?, NULL, ?, ?)",
                          (
                              conversion_id,
                              subject_zid,
                              base.upper(),
                              quote_ccy.upper(),
                              str(amount),
                              str(exact),
                              str(quote.rate),
                              quote.source,
                              self._clock.now(),
                              1,
                          ),
                      )
                  event = self._catalog.build(
                      EVENT_CONVERTED,
                      aggregate_id=conversion_id,
                      payload={
                          "conversion_id": conversion_id,
                          "subject_zid": subject_zid,
                          "pair": quote.pair.normalized,
                          "rate": str(quote.rate),
                      },
                      clock=self._clock,
                  )
                  self._outbox.enqueue(event)
                  self._audit.append(
                      event_type=EVENT_CONVERTED,
                      actor=subject_zid,
                      subject=conversion_id,
                      payload={
                          "pair": quote.pair.normalized,
                          "rate": str(quote.rate),
                          "base_amount": str(amount),
                          "quote_amount": str(exact),
                      },
                  )
                  self._metrics.increment("currency.converted")
                  self._log.info(
                      "converted id=%s pair=%s",
                      conversion_id,
                      quote.pair.normalized,
                  )
                  return signed, conversion_id, exact

              def record_settlement(
                  self, conversion_id: str, *, settlement_ref: str
              ) -> None:
                  """Attaches the external provider's settlement ref."""
                  require_non_empty_str(settlement_ref, "settlement_ref")
                  row = self._db.query_one(
                      "SELECT conversion_id FROM conversions"
                      " WHERE conversion_id = ?",
                      (conversion_id,),
                  )
                  if row is None:
                      raise NotFoundError(
                          f"unknown conversion: {conversion_id}"
                      )
                  self._db.execute(
                      "UPDATE conversions SET fx_settlement_ref = ?"
                      " WHERE conversion_id = ?",
                      (settlement_ref, conversion_id),
                  )
                  self._audit.append(
                      event_type="currency.conversion.settled",
                      actor="fx-settlement",
                      subject=conversion_id,
                      payload={"settlement_ref": settlement_ref},
                  )
                  self._log.info("settled conversion=%s", conversion_id)

              def get_conversion(
                  self, conversion_id: str
              ) -> dict[str, object] | None:
                  row = self._db.query_one(
                      "SELECT * FROM conversions WHERE conversion_id = ?",
                      (conversion_id,),
                  )
                  if row is None:
                      return None
                  settlement = row["fx_settlement_ref"]
                  return {
                      "conversion_id": str(row["conversion_id"]),
                      "subject_zid": str(row["subject_zid"]),
                      "base": str(row["base"]),
                      "quote": str(row["quote_ccy"]),
                      "base_amount": str(row["base_amount"]),
                      "quote_amount": str(row["quote_amount"]),
                      "rate": str(row["rate"]),
                      "quote_source": str(row["quote_source"]),
                      "fx_settlement_ref": (
                          None if settlement is None else str(settlement)
                      ),
                      "created_at": float(row["created_at"]),
                  }

              def check_health(self) -> ComponentHealth:
                  if not self._db.ping():
                      return ComponentHealth(
                          "currency",
                          HealthStatus.UNHEALTHY,
                          "storage unavailable",
                      )
                  return ComponentHealth(
                      "currency",
                      HealthStatus.HEALTHY,
                      "rates + conversions ok",
                  )

              def _fetch_quote(
                  self, pair: CurrencyPair, stored: Quote | None
              ) -> Quote:
                  try:
                      return self._chain.fetch(pair, self._clock)
                  except RateUnavailableError:
                      pass
                  if (
                      pair.base == self._bridge
                      or pair.quote == self._bridge
                  ):
                      if stored is not None:
                          raise StaleRateError(
                              f"only stored rate for"
                              f" {pair.normalized} is stale"
                          ) from None
                      raise
                  try:
                      leg_in = self._chain.fetch(
                          CurrencyPair(pair.base, self._bridge),
                          self._clock,
                      )
                      leg_out = self._chain.fetch(
                          CurrencyPair(self._bridge, pair.quote),
                          self._clock,
                      )
                  except RateUnavailableError:
                      if stored is not None:
                          raise StaleRateError(
                              f"only stored rate for"
                              f" {pair.normalized} is stale"
                          ) from None
                      raise NoRouteError(
                          f"no route for {pair.normalized}"
                      ) from None
                  ttl = min(
                      leg_in.expires_at - leg_in.quoted_at,
                      leg_out.expires_at - leg_out.quoted_at,
                  )
                  now = self._clock.now()
                  return Quote(
                      pair=pair,
                      rate=compose_rates(leg_in.rate, leg_out.rate),
                      quoted_at=now,
                      expires_at=now + ttl,
                      source=f"bridge:{self._bridge}",
                  )
          PYEOF

