          cat > shared_engines/audit/chain.py <<'PYEOF'
          """Append-only hash-chained audit trail with checkpoints.

          Each record commits to the previous record's hash; any later
          mutation breaks verification from that point. Checkpoints pin
          (sequence, chain_hash) for external anchoring later. This
          local chain is tamper-EVIDENT; it is not cryptographic proof
          against an attacker with full database control.
          """
          from __future__ import annotations

          from collections.abc import Mapping
          from dataclasses import dataclass
          from typing import Any

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError, ValidationError
          from shared_engines.common.identifiers import (
              payload_fingerprint,
              stable_hash,
          )
          from shared_engines.common.validation import require_non_empty_str
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import Migration, MigrationRunner

          GENESIS_HASH = "0" * 64

          MIGRATIONS = (
              Migration(
                  1,
                  "audit_chain",
                  (
                      "CREATE TABLE audit_records ("
                      " sequence INTEGER PRIMARY KEY,"
                      " timestamp REAL NOT NULL,"
                      " event_type TEXT NOT NULL,"
                      " actor TEXT NOT NULL,"
                      " subject TEXT NOT NULL,"
                      " payload_hash TEXT NOT NULL,"
                      " previous_hash TEXT NOT NULL,"
                      " record_hash TEXT NOT NULL)",
                      "CREATE TABLE audit_checkpoints ("
                      " sequence INTEGER PRIMARY KEY,"
                      " chain_hash TEXT NOT NULL,"
                      " checkpoint_hash TEXT NOT NULL,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class AuditRecord:
              sequence: int
              timestamp: float
              event_type: str
              actor: str
              subject: str
              payload_hash: str
              previous_hash: str
              record_hash: str


          def _compute_record_hash(
              sequence: int,
              timestamp: float,
              event_type: str,
              actor: str,
              subject: str,
              payload_hash: str,
              previous_hash: str,
          ) -> str:
              return stable_hash(
                  str(sequence),
                  f"{timestamp:.6f}",
                  event_type,
                  actor,
                  subject,
                  payload_hash,
                  previous_hash,
              )


          class AuditTrail:
              """Tamper-evident chain; checkpoints pin the chain head."""

              def __init__(self, db: Database, clock: Clock) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(db, "audit", MIGRATIONS).run(clock)

              def append(
                  self,
                  *,
                  event_type: str,
                  actor: str,
                  subject: str,
                  payload: Mapping[str, Any],
              ) -> AuditRecord:
                  require_non_empty_str(event_type, "event_type")
                  require_non_empty_str(actor, "actor")
                  require_non_empty_str(subject, "subject")
                  payload_hash = payload_fingerprint(dict(payload))
                  with self._db.transaction() as cursor:
                      last = cursor.execute(
                          "SELECT sequence, record_hash FROM audit_records"
                          " ORDER BY sequence DESC LIMIT 1"
                      ).fetchone()
                      sequence = int(last["sequence"]) + 1 if last is not None else 1
                      previous_hash = (
                          str(last["record_hash"])
                          if last is not None
                          else GENESIS_HASH
                      )
                      timestamp = self._clock.now()
                      record_hash = _compute_record_hash(
                          sequence,
                          timestamp,
                          event_type,
                          actor,
                          subject,
                          payload_hash,
                          previous_hash,
                      )
                      cursor.execute(
                          "INSERT INTO audit_records"
                          " (sequence, timestamp, event_type, actor, subject,"
                          "  payload_hash, previous_hash, record_hash)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                          (
                              sequence,
                              timestamp,
                              event_type,
                              actor,
                              subject,
                              payload_hash,
                              previous_hash,
                              record_hash,
                          ),
                      )
                  return AuditRecord(
                      sequence=sequence,
                      timestamp=timestamp,
                      event_type=event_type,
                      actor=actor,
                      subject=subject,
                      payload_hash=payload_hash,
                      previous_hash=previous_hash,
                      record_hash=record_hash,
                  )

              def verify(self) -> int:
                  """Recomputes the whole chain; raises on any break."""
                  previous = GENESIS_HASH
                  count = 0
                  for row in self._db.query_all(
                      "SELECT * FROM audit_records ORDER BY sequence"
                  ):
                      expected_sequence = count + 1
                      if int(row["sequence"]) != expected_sequence:
                          raise IntegrityError(
                              f"audit chain gap at sequence {expected_sequence}"
                          )
                      expected = _compute_record_hash(
                          expected_sequence,
                          float(row["timestamp"]),
                          str(row["event_type"]),
                          str(row["actor"]),
                          str(row["subject"]),
                          str(row["payload_hash"]),
                          previous,
                      )
                      if str(row["previous_hash"]) != previous:
                          raise IntegrityError(
                              f"chain broken at sequence {expected_sequence}:"
                              " previous hash mismatch"
                          )
                      if str(row["record_hash"]) != expected:
                          raise IntegrityError(
                              f"record modified at sequence {expected_sequence}"
                          )
                      previous = str(row["record_hash"])
                      count = expected_sequence
                  return count

              def checkpoint(self) -> tuple[int, str]:
                  count = self.verify()
                  if count == 0:
                      raise ValidationError(
                          "cannot checkpoint an empty audit trail"
                      )
                  last = self._db.query_one(
                      "SELECT sequence, record_hash FROM audit_records"
                      " ORDER BY sequence DESC LIMIT 1"
                  )
                  if last is None:
                      raise IntegrityError("audit trail vanished")
                  sequence = int(last["sequence"])
                  chain_hash = str(last["record_hash"])
                  checkpoint_hash = stable_hash(
                      "audit-checkpoint", str(sequence), chain_hash
                  )
                  self._db.execute(
                      "INSERT INTO audit_checkpoints"
                      " (sequence, chain_hash, checkpoint_hash, created_at)"
                      " VALUES (?, ?, ?, ?)",
                      (sequence, chain_hash, checkpoint_hash, self._clock.now()),
                  )
                  return sequence, checkpoint_hash

              def verify_checkpoints(self) -> int:
                  """Re-verifies the chain and every checkpoint binding."""
                  self.verify()
                  rows = self._db.query_all(
                      "SELECT * FROM audit_checkpoints ORDER BY sequence"
                  )
                  for row in rows:
                      sequence = int(row["sequence"])
                      record = self._db.query_one(
                          "SELECT record_hash FROM audit_records"
                          " WHERE sequence = ?",
                          (sequence,),
                      )
                      if record is None or str(record["record_hash"]) != str(
                          row["chain_hash"]
                      ):
                          raise IntegrityError(
                              f"checkpoint at {sequence} no longer matches chain"
                          )
                      expected = stable_hash(
                          "audit-checkpoint", str(sequence), str(row["chain_hash"])
                      )
                      if expected != str(row["checkpoint_hash"]):
                          raise IntegrityError(
                              f"checkpoint modified at sequence {sequence}"
                          )
                  return len(rows)
          PYEOF

          cat > shared_engines/audit/tests/test_audit.py <<'PYEOF'
          from __future__ import annotations

          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          import pytest

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.common.errors import IntegrityError, ValidationError
          from shared_engines.storage.database import SQLiteAdapter


          def _trail(tmp_path: Path) -> tuple[AuditTrail, SQLiteAdapter]:
              db = SQLiteAdapter(tmp_path / "audit.db")
              return AuditTrail(db, FrozenClock()), db


          def test_chain_verifies_and_detects_tampering(tmp_path: Path) -> None:
              trail, db = _trail(tmp_path)
              for index in range(3):
                  trail.append(
                      event_type="test.event",
                      actor="tester",
                      subject=f"s{index}",
                      payload={"i": index},
                  )
              assert trail.verify() == 3
              db.execute(
                  "UPDATE audit_records SET event_type = 'evil'"
                  " WHERE sequence = 2"
              )
              with pytest.raises(IntegrityError):
                  trail.verify()
              db.close()


          def test_chain_detects_row_deletion(tmp_path: Path) -> None:
              trail, db = _trail(tmp_path)
              for index in range(3):
                  trail.append(
                      event_type="t", actor="a", subject=f"s{index}", payload={}
                  )
              db.execute("DELETE FROM audit_records WHERE sequence = 2")
              with pytest.raises(IntegrityError):
                  trail.verify()
              db.close()


          def test_checkpoint_binds_chain(tmp_path: Path) -> None:
              trail, db = _trail(tmp_path)
              trail.append(event_type="t", actor="a", subject="s", payload={"n": 1})
              sequence, checkpoint_hash = trail.checkpoint()
              assert sequence == 1
              assert len(checkpoint_hash) == 64
              trail.append(event_type="t", actor="a", subject="s2", payload={})
              assert trail.verify_checkpoints() == 1
              db.execute(
                  "UPDATE audit_records SET subject = 'rewritten'"
                  " WHERE sequence = 1"
              )
              with pytest.raises(IntegrityError):
                  trail.verify_checkpoints()
              db.close()


          def test_checkpoint_requires_records(tmp_path: Path) -> None:
              trail, _ = _trail(tmp_path)
              with pytest.raises(ValidationError):
                  trail.checkpoint()


          def test_chain_gap_free_under_concurrency(tmp_path: Path) -> None:
              trail, db = _trail(tmp_path)

              def write(index: int) -> None:
                  trail.append(
                      event_type="t",
                      actor="worker",
                      subject=f"s{index}",
                      payload={"i": index},
                  )

              with ThreadPoolExecutor(max_workers=4) as pool:
                  list(pool.map(write, range(24)))
              assert trail.verify() == 24
              db.close()
          PYEOF

