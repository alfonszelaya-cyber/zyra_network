          def test_4_resilience_offline_commerce(tmp_path: Path) -> None:
              db = SQLiteAdapter(tmp_path / "sbs.db")
              clock = FrozenClock()
              store = SubastasStore(db, clock)
              dead_client = NetworkClient(
                  "http://127.0.0.1:1",
                  timeout_seconds=1.0,
                  max_retries=0,
              )
              server = serve_subastas(store, dead_client)
              thread = threading.Thread(
                  target=server.serve_forever, daemon=True
              )
              thread.start()
              base = "http://127.0.0.1:" f"{server.bound_port}"
              try:
                  store.add_account(
                      account_id="SBS-off-s",
                      zid=None,
                      name="Vendedor Offline",
                  )
                  store.add_account(
                      account_id="SBS-off-b",
                      zid=None,
                      name="Comprador Offline",
                  )
                  html = _pf(
                      base + "/subastas/listing",
                      {
                          "seller_account": "SBS-off-s",
                          "title": "Cosecha offline",
                          "description": "venta sin red",
                          "base_price": 80,
                      },
                  )
                  assert "SELLADO" in html
                  listing_id = store.list_open()[0]["listing_id"]
                  listing = store.get_listing(listing_id)
                  assert listing["document_id"] is not None
                  body = _pj(
                      base + "/subastas/api/bids",
                      {
                          "listing_id": listing_id,
                          "bidder_account": "SBS-off-b",
                          "amount": 90,
                      },
                  )
                  assert body["ok"] is True
                  closed = store.close_listing(
                      listing_id=listing_id, seller_account="SBS-off-s"
                  )
                  assert closed["winner_account"] == "SBS-off-b"
                  order = _pj(
                      base + "/subastas/api/orders",
                      {
                          "listing_id": listing_id,
                          "buyer_account": "SBS-off-b",
                          "source": "auction",
                      },
                  )["data"]
                  assert order["subtotal"] == 90.0
                  paid = _pj(
                      base + "/subastas/api/orders/" + order["order_id"] + "/pay",
                      {"provider": "efectivo"},
                  )["data"]
                  assert paid["status"] == "paid"
                  settled = _pj(
                      base
                      + "/subastas/api/orders/"
                      + order["order_id"]
                      + "/settle",
                      {},
                  )["data"]
                  assert settled["settlement"]["net_amount"] == 85.5
                  summary = _gj(base + "/subastas/api/summary")["summary"]
                  assert summary["orders_total"] == 1
              finally:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=5)
                  db.close()
