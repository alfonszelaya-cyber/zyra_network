name: zyra-q1-suite-hang-diagnosis

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-q1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9" "pytest-timeout>=2,<3"

      - name: Confirm collection
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -m pytest --collect-only -q -p no:cacheprovider 2>&1 | tail -5

      - name: Full suite WITH timeout protection (finds the hang)
        run: |
          set +e
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider --timeout=60 --timeout-method=thread --durations=30 > /tmp/zyra_full_suite.log 2>&1
          code=$?
          echo "pytest exit code: $code"
          echo "=== TIMEOUTS / FAILURES / TIMEOUT MARKERS ==="
          grep -n -E "Timeout|FAILED|ERROR" /tmp/zyra_full_suite.log | head -50 || true
          echo "=== LAST 120 LINES (hang evidence / thread stacks) ==="
          tail -120 /tmp/zyra_full_suite.log
          echo "=== SLOWEST TESTS ==="
          grep -n -A 35 "slowest" /tmp/zyra_full_suite.log | head -50 || true
          set -e

      - name: Blocks re-check (known green path)
        run: |
          set +e
          echo "=== BLOCK 1: apps + observability + shared_engines ==="
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider apps shared_engines observability 2>&1 | tail -3
          echo "=== BLOCK 2: deployment ==="
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider tests/test_deployment.py 2>&1 | tail -3
          set -e

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: Q1 suite-hang diagnosis - full run with pytest-timeout 60s + thread stacks + durations, blocks re-check"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== Q1 DIAGNOSIS COMPLETE ==="
