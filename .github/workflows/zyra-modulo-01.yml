name: zyra-n1-agro-core

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-n1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Combined HTTP surface (prefix-dispatch fix)
        run: |
          set -euo pipefail
          cat > shared_engines/runtime/combined_api.py <<'PYEOF'
          """Combined HTTP surface: core API + capabilities
          on ONE port.

          MRO note: both parents define _route_get/_route_post,
          so CombinedHandler overrides both with a
          first-segment dispatcher that sends each group to
          its correct parent implementation.
          """
          from __future__ import annotations

          from http.server import ThreadingHTTPServer
          from typing import ClassVar
          from urllib.parse import urlparse

          from shared_engines.common.errors import (
              EngineError,
          )
          from shared_engines.runtime.api import (
              ZyraApiHandler,
          )
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities,
          )
          from shared_engines.runtime.capabilities_api import (
              CapabilitiesApiHandler,
          )
          from shared_engines.runtime.capabilities_api import (
              _ApiError,
          )
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.runtime.responses import (
              ApiError,
              map_engine_error,
          )

          CORE_PREFIXES = frozenset(
              {
                  "health",
                  "verify",
                  "identity",
                  "verification",
                  "tokens",
                  "currency",
              }
          )

          CAPS_GET_PREFIXES = frozenset(
              {
                  "trust",
                  "profile",
                  "history",
                  "reputation",
                  "certificates",
              }
          )

          CAPS_POST_PREFIXES = frozenset(
              {
                  "apps",
                  "profile",
                  "trust",
                  "history",
                  "documents",
                  "search",
                  "reputation",
                  "export",
              }
          )


          class CombinedHandler(
              ZyraApiHandler, CapabilitiesApiHandler
          ):
              """One port, two surfaces, shared database."""

              caps: ClassVar[ZyraCapabilities]
              kernel: ClassVar[ZyraKernel]

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments and (
                      segments[0] in CORE_PREFIXES
                  ):
                      ZyraApiHandler._route(
                          self, method
                      )
                      return
                  CapabilitiesApiHandler._route(
                      self, method
                  )

              def _route_get(
                  self, s: list[str]
              ) -> None:
                  if s and s[0] in CAPS_GET_PREFIXES:
                      CapabilitiesApiHandler._route_get(
                          self, s
                      )
                      return
                  ZyraApiHandler._route_get(self, s)

              def _route_post(
                  self, s: list[str]
              ) -> None:
                  if s and (
                      s[0] in CAPS_POST_PREFIXES
                  ):
                      CapabilitiesApiHandler._route_post(
                          self, s
                      )
                      return
                  ZyraApiHandler._route_post(
                      self, s
                  )

              def _dispatch(
                  self, method: str
              ) -> None:
                  try:
                      self._route(method)
                  except ApiError as exc:
                      self._send_json(
                          exc.status,
                          self._error_body(exc),
                      )
                  except _ApiError as exc:
                      CapabilitiesApiHandler._error(
                          self,
                          exc.status,
                          exc.code,
                          exc.message,
                      )
                  except PermissionError as exc:
                      CapabilitiesApiHandler._error(
                          self,
                          403,
                          "forbidden",
                          str(exc),
                      )
                  except EngineError as exc:
                      mapped = map_engine_error(exc)
                      self._send_json(
                          mapped.status,
                          self._error_body(mapped),
                      )
                  except ValueError as exc:
                      CapabilitiesApiHandler._error(
                          self,
                          400,
                          "invalid_request",
                          str(exc),
                      )
                  except Exception:
                      CapabilitiesApiHandler._error(
                          self,
                          500,
                          "internal_error",
                          "internal error",
                      )


          def serve_combined(
              kernel: ZyraKernel,
              caps: ZyraCapabilities,
              *,
              host: str,
              port: int,
          ) -> ThreadingHTTPServer:
              """Bind both surfaces to one server."""
              CombinedHandler.kernel = kernel
              CombinedHandler.caps = caps
              return ThreadingHTTPServer(
                  (host, port), CombinedHandler
              )
          PYEOF
          echo "=== COMBINED API READY ==="

      - name: Extend NetworkClient (real HTTP, legacy kept)
        run: |
          set -euo pipefail
          cat > apps/agro/infrastructure/network/network_client.py <<'PYEOF'
          """Real HTTP client to ZYRA Network.

          Resilience contract: failures are returned as
          (ok=False, data=None, error=...), never raised -
          the app keeps working when the Network is down.
          """
          from __future__ import annotations

          import json
          import os
          import urllib.request


          class NetworkClient:
              """HTTP client for ZYRA Network (retries)."""

              def __init__(
                  self,
                  base_url: str | None = None,
                  *,
                  timeout_seconds: float = 5.0,
                  max_retries: int = 2,
              ) -> None:
                  self._base = (
                      base_url
                      or os.environ.get("ZYRA_URL", "")
                  ).rstrip("/")
                  self._timeout = timeout_seconds
                  self._retries = max(0, max_retries)

              @property
              def base_url(self) -> str:
                  return self._base

              def get(self, path: str) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._call("GET", path)

              def post(
                  self, path: str, payload: dict
              ) -> tuple[bool, dict | None, str | None]:
                  return self._call("POST", path, payload)

              def _call(
                  self,
                  method: str,
                  path: str,
                  payload: dict | None = None,
              ) -> tuple[bool, dict | None, str | None]:
                  if not self._base:
                      return (
                          False,
                          None,
                          "ZYRA_URL not configured",
                      )
                  url = self._base + path
                  data = None
                  if payload is not None:
                      data = json.dumps(
                          payload
                      ).encode("utf-8")
                  last_error = "unknown"
                  for attempt in range(
                      self._retries + 1
                  ):
                      try:
                          request = urllib.request.Request(
                              url,
                              data=data,
                              method=method,
                              headers={
                                  "Content-Type":
                                  "application/json"
                              },
                          )
                          with urllib.request.urlopen(
                              request,
                              timeout=self._timeout,
                          ) as response:
                              body = json.loads(
                                  response.read()
                                  .decode("utf-8")
                              )
                          if body.get("ok") is True:
                              return (
                                  True,
                                  body.get("data"),
                                  None,
                              )
                          error = body.get(
                              "error", {}
                          )
                          return (
                              False,
                              None,
                              str(
                                  error.get(
                                      "message",
                                      "rejected",
                                  )
                              ),
                          )
                      except Exception as exc:
                          last_error = str(exc)
                  return False, None, last_error

              def request(
                  self, service: str, payload=None
              ) -> dict:
                  """Legacy stub contract, now real."""
                  ok, data, error = self.post(
                      service, payload or {}
                  )
                  return {
                      "service": service,
                      "payload": payload,
                      "status": (
                          "confirmed"
                          if ok
                          else "unreachable"
                      ),
                      "data": data,
                      "error": error,
                  }
          PYEOF
          echo "network client extended"

      - name: ZyraLink (high-level trust operations for AGRO)
        run: |
          set -euo pipefail
          cat > apps/agro/services/zyra_link.py <<'PYEOF'
          """ZyraLink: high-level AGRO operations on the
          Network. Never raises - resilience rule."""
          from __future__ import annotations

          from apps.agro.infrastructure.network.network_client import (
              NetworkClient,
          )


          class ZyraLink:
              """Trust operations for producers."""

              def __init__(
                  self, client: NetworkClient
              ) -> None:
                  self._client = client

              def register_app(self) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/apps/register",
                      {
                          "app_id": "agro",
                          "display_name": (
                              "AGRO - Productores"
                          ),
                          "scopes": [
                              "display_name",
                              "contact",
                              "address",
                          ],
                      },
                  )

              def register_producer_zid(
                  self, display_name: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": "person",
                          "display_name": display_name,
                          "actor": "agro",
                      },
                  )

              def complete_trust(
                  self, zid: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/trust/complete",
                      {"zid": zid, "actor": "agro"},
                  )

              def is_trusted(
                  self, zid: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.get(
                      f"/trust/{zid}"
                  )

              def record_agro_event(
                  self,
                  zid: str,
                  event: str,
                  detail: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/history/append",
                      {
                          "zid": zid,
                          "entry_type": "other",
                          "actor_app": "agro",
                          "payload": {
                              "event": event,
                              "detail": detail,
                          },
                      },
                  )
          PYEOF
          echo "zyra link ready"

      - name: AgroStore (local durable state, resilience)
        run: |
          set -euo pipefail
          cat > apps/agro/infrastructure/persistence/agro_store.py <<'PYEOF'
          """AGRO local durable store (SQLite)."""
          from __future__ import annotations

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "agro",
                  (
                      "CREATE TABLE agro_producers ("
                      " producer_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " producer_type TEXT NOT NULL,"
                      " location TEXT,"
                      " verified INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " synced INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE"
                      " agro_productions ("
                      " production_id TEXT PRIMARY"
                      " KEY,"
                      " producer_id TEXT NOT NULL,"
                      " product TEXT NOT NULL,"
                      " quantity REAL NOT NULL,"
                      " unit TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " network_seq INTEGER,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class AgroStore:
              """Durable local state for AGRO."""

              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "agro.store", _MIGRATIONS
                  ).run(clock)

              def add_producer(
                  self,
                  *,
                  producer_id: str,
                  zid: str | None,
                  name: str,
                  producer_type: str,
                  location: str | None,
                  synced: bool,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO agro_producers"
                          " (producer_id, zid, name,"
                          "  producer_type, location,"
                          "  verified, synced,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, 0, ?,"
                          " ?)",
                          (
                              producer_id,
                              zid,
                              name,
                              producer_type,
                              location,
                              int(synced),
                              now,
                          ),
                      )
                  return self.get_producer(
                      producer_id
                  )

              def link_zid(
                  self, *, producer_id: str, zid: str
              ) -> None:
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE agro_producers SET"
                          " zid = ?, synced = 1"
                          " WHERE producer_id = ?",
                          (zid, producer_id),
                      )

              def mark_verified(
                  self, *, producer_id: str
              ) -> None:
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE agro_producers SET"
                          " verified = 1"
                          " WHERE producer_id = ?",
                          (producer_id,),
                      )

              def get_producer(
                  self, producer_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM agro_producers"
                      " WHERE producer_id = ?",
                      (producer_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown producer:"
                          f" {producer_id}"
                      )
                  return self._producer_row(row)

              def list_producers(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM agro_producers"
                      " ORDER BY created_at"
                  )
                  return tuple(
                      self._producer_row(r)
                      for r in rows
                  )

              def add_production(
                  self,
                  *,
                  production_id: str,
                  producer_id: str,
                  product: str,
                  quantity: float,
                  unit: str,
                  network_seq: int | None,
              ) -> dict[str, object]:
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO agro_productions"
                          " (production_id,"
                          "  producer_id, product,"
                          "  quantity, unit, status,"
                          "  network_seq, created_at)"
                          " VALUES (?, ?, ?, ?, ?,"
                          "  'active', ?, ?)",
                          (
                              production_id,
                              producer_id,
                              product,
                              quantity,
                              unit,
                              network_seq,
                              now,
                          ),
                      )
                  row = self._db.query_one(
                      "SELECT * FROM agro_productions"
                      " WHERE production_id = ?",
                      (production_id,),
                  )
                  assert row is not None
                  raw_seq = row["network_seq"]
                  return {
                      "production_id": str(
                          row["production_id"]
                      ),
                      "producer_id": str(
                          row["producer_id"]
                      ),
                      "product": str(row["product"]),
                      "quantity": float(
                          row["quantity"]
                      ),
                      "unit": str(row["unit"]),
                      "status": str(row["status"]),
                      "network_seq": (
                          int(raw_seq)
                          if raw_seq is not None
                          else None
                      ),
                  }

              def list_productions(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM agro_productions"
                      " ORDER BY created_at"
                  )
                  result: list[
                      dict[str, object]
                  ] = []
                  for r in rows:
                      raw_seq = r["network_seq"]
                      result.append(
                          {
                              "production_id": str(
                                  r["production_id"]
                              ),
                              "producer_id": str(
                                  r["producer_id"]
                              ),
                              "product": str(
                                  r["product"]
                              ),
                              "quantity": float(
                                  r["quantity"]
                              ),
                              "unit": str(r["unit"]),
                              "status": str(
                                  r["status"]
                              ),
                              "network_seq": (
                                  int(raw_seq)
                                  if raw_seq
                                  is not None
                                  else None
                              ),
                          }
                      )
                  return tuple(result)

              def summary(self) -> dict[str, object]:
                  producers = self._db.query_one(
                      "SELECT COUNT(*) AS total,"
                      " SUM(verified) AS verified"
                      " FROM agro_producers"
                  )
                  productions = self._db.query_all(
                      "SELECT product, SUM(quantity)"
                      " AS total FROM"
                      " agro_productions"
                      " GROUP BY product"
                      " ORDER BY product"
                  )
                  by_product = {
                      str(r["product"]): float(
                          r["total"]
                      )
                      for r in productions
                  }
                  total = 0
                  verified = 0
                  if producers is not None:
                      total = int(
                          producers["total"]
                      )
                      if (
                          producers["verified"]
                          is not None
                      ):
                          verified = int(
                              producers["verified"]
                          )
                  return {
                      "producers_total": total,
                      "producers_verified": (
                          verified
                      ),
                      "productions_by_product": (
                          by_product
                      ),
                  }

              @staticmethod
              def _producer_row(row) -> dict[str, object]:
                  return {
                      "producer_id": str(
                          row["producer_id"]
                      ),
                      "zid": (
                          str(row["zid"])
                          if row["zid"] is not None
                          else None
                      ),
                      "name": str(row["name"]),
                      "producer_type": str(
                          row["producer_type"]
                      ),
                      "location": (
                          str(row["location"])
                          if row["location"]
                          is not None
                          else None
                      ),
                      "verified": bool(
                          int(row["verified"])
                      ),
                      "synced": bool(
                          int(row["synced"])
                      ),
                      "created_at": float(
                          row["created_at"]
                      ),
                  }
          PYEOF
          echo "store ready"

      - name: AGRO HTTP surface (menus + operations)
        run: |
          set -euo pipefail
          cat > apps/agro/server.py <<'PYEOF'
          """AGRO HTTP surface (menus + operations)."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.agro.infrastructure.persistence.agro_store import (
              AgroStore,
          )
          from apps.agro.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.agro.modules.comercializacion.alertas_de_mercado.market_alert_service import (
              MarketAlertService,
          )
          from apps.agro.services.zyra_link import ZyraLink


          class AgroApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[AgroStore]
              link: ClassVar[ZyraLink]
              client: ClassVar[NetworkClient]
              alerts: ClassVar[MarketAlertService] = (
                  MarketAlertService()
              )

              def log_message(
                  self, format: str, *args: object
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(self, method: str) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._send(
                          404,
                          {
                              "ok": False,
                              "error": {
                                  "type":
                                  "not_found",
                                  "message": str(
                                      exc
                                  ),
                              },
                          },
                      )
                  except ValueError as exc:
                      self._send(
                          400,
                          {
                              "ok": False,
                              "error": {
                                  "type":
                                  "invalid_request",
                                  "message": str(
                                      exc
                                  ),
                              },
                          },
                      )
                  except Exception as exc:
                      self._send(
                          500,
                          {
                              "ok": False,
                              "error": {
                                  "type":
                                  "internal_error",
                                  "message": str(
                                      exc
                                  ),
                              },
                          },
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != ["agro"]:
                      self._send(
                          404,
                          {
                              "ok": False,
                              "error": {
                                  "type":
                                  "not_found",
                                  "message":
                                  "outside /agro",
                              },
                          },
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(self, s: list[str]) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app": "agro",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  if s == ["menu"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "title": "AGRO",
                                  "subtitle": (
                                      "Tu cosecha,"
                                      " tus precios,"
                                      " tu ayuda"
                                      " del gobierno"
                                  ),
                                  "actions": [
                                      {
                                          "label":
                                          "Vender mi"
                                          " cosecha",
                                          "route":
                                          "/agro/production",
                                      },
                                      {
                                          "label":
                                          "Mi historial",
                                          "route":
                                          "/agro/government/summary",
                                      },
                                  ],
                              },
                          },
                      )
                      return
                  if s == ["producers"]:
                      self._ok(
                          list(store.list_producers())
                      )
                      return
                  if s == ["productions"]:
                      self._ok(
                          list(
                              store.list_productions()
                          )
                      )
                      return
                  if s == ["government", "summary"]:
                      self._ok(store.summary())
                      return
                  self._not_found()

              def _post(self, s: list[str]) -> None:
                  store = type(self).store
                  link = type(self).link
                  doc = self._read_json()
                  if s == ["producers"]:
                      name = self._req(
                          doc, "name"
                      )
                      producer_type = self._req(
                          doc, "producer_type"
                      )
                      location = doc.get("location")
                      location = (
                          str(location)
                          if location is not None
                          else None
                      )
                      producer_id = (
                          "PRD-"
                          + uuid.uuid4().hex[:12]
                      )
                      zid: str | None = None
                      synced = False
                      ok, data, _error = (
                          link.register_producer_zid(
                              name
                          )
                      )
                      if ok and data is not None:
                          zid = str(data.get("zid"))
                          synced = True
                      row = store.add_producer(
                          producer_id=producer_id,
                          zid=zid,
                          name=name,
                          producer_type=(
                              producer_type
                          ),
                          location=location,
                          synced=synced,
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  if s == ["producers", "verify"]:
                      producer_id = self._req(
                          doc, "producer_id"
                      )
                      row = store.get_producer(
                          producer_id
                      )
                      zid = row.get("zid")
                      if zid is None:
                          raise ValueError(
                              "producer has no"
                              " network ZID yet"
                          )
                      ok, data, _error = (
                          link.complete_trust(
                              str(zid)
                          )
                      )
                      if not ok:
                          raise ValueError(
                              "network trust failed"
                          )
                      store.mark_verified(
                          producer_id=producer_id
                      )
                      updated = store.get_producer(
                          producer_id
                      )
                      self._ok(updated)
                      return
                  if s == ["production"]:
                      producer_id = self._req(
                          doc, "producer_id"
                      )
                      producer = store.get_producer(
                          producer_id
                      )
                      product = self._req(
                          doc, "product"
                      )
                      quantity = float(
                          doc.get("quantity", 0)
                      )
                      if quantity <= 0:
                          raise ValueError(
                              "quantity must be"
                              " positive"
                          )
                      unit = self._req(
                          doc, "unit"
                      )
                      network_seq: int | None = None
                      zid = producer.get("zid")
                      if zid is not None:
                          ok, data, _error = (
                              link.record_agro_event(
                                  str(zid),
                                  "production",
                                  f"{product}:"
                                  f" {quantity}"
                                  f" {unit}",
                              )
                          )
                          if (
                              ok
                              and data is not None
                          ):
                              network_seq = int(
                                  data.get(
                                      "seq", 0
                                  )
                              )
                      row = store.add_production(
                          production_id=(
                              "PRO-"
                              + uuid.uuid4()
                              .hex[:12]
                          ),
                          producer_id=producer_id,
                          product=product,
                          quantity=quantity,
                          unit=unit,
                          network_seq=network_seq,
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  if s == ["alerts", "evaluate"]:
                      previous = float(
                          doc.get(
                              "previous_price", 0
                          )
                      )
                      current = float(
                          doc.get("current_price", 0)
                      )
                      result = (
                          type(self).alerts.evaluate(
                              previous,
                              current,
                          )
                      )
                      self._ok(result)
                      return
                  self._not_found()

              def _read_json(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  )
                  parsed: Any = json.loads(
                      raw.decode("utf-8")
                  )
                  if not isinstance(parsed, dict):
                      raise ValueError(
                          "body must be a JSON"
                          " object"
                      )
                  return {
                      str(k): v
                      for k, v in parsed.items()
                  }

              @staticmethod
              def _req(
                  doc: dict[str, Any], key: str
              ) -> str:
                  value: Any = doc.get(key)
                  if isinstance(value, int) and not isinstance(
                      value, bool
                  ):
                      value = str(value)
                  if not isinstance(value, str):
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  if not value.strip():
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  return value

              def _ok(self, data: Any) -> None:
                  self._send(
                      200,
                      {"ok": True, "data": data},
                  )

              def _not_found(self) -> None:
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown route",
                          },
                      },
                  )

              def _send(
                  self,
                  status: int,
                  payload: dict[str, Any],
              ) -> None:
                  body = json.dumps(payload).encode(
                      "utf-8"
                  )
                  self.send_response(status)
                  self.send_header(
                      "Content-Type",
                      "application/json",
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body)),
                  )
                  self.end_headers()
                  self.wfile.write(body)


          class AgroServer(ThreadingHTTPServer):
              daemon_threads = True
              allow_reuse_address = True

              def __init__(
                  self, address: tuple[str, int]
              ) -> None:
                  super().__init__(
                      address, AgroApiHandler
                  )

              @property
              def bound_port(self) -> int:
                  return int(
                      self.server_address[1]
                  )


          def serve_agro(
              store: AgroStore,
              client: NetworkClient,
              *,
              host: str = "127.0.0.1",
              port: int = 0,
          ) -> AgroServer:
              AgroApiHandler.store = store
              AgroApiHandler.link = ZyraLink(client)
              AgroApiHandler.client = client
              return AgroServer((host, port))
          PYEOF
          echo "server ready"

      - name: N1 proofs (e2e over real HTTP + resilience)
        run: |
          set -euo pipefail
          mkdir -p apps/agro/tests
          cat > apps/agro/tests/test_agro_n1.py <<'PYEOF'
          """AGRO N1 proofs: farmer journey over real HTTP
          against the COMBINED network surface + resilience."""
          from __future__ import annotations

          import json
          import threading
          from pathlib import Path
          from urllib.request import Request, urlopen

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities,
          )
          from shared_engines.runtime.combined_api import (
              serve_combined,
          )
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )

          from apps.agro.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.agro.infrastructure.persistence.agro_store import (
              AgroStore,
          )
          from apps.agro.server import serve_agro
          from apps.agro.services.zyra_link import ZyraLink


          class _Ecosystem:
              def __init__(self, tmp_path: Path) -> None:
                  self.net_db = SQLiteAdapter(
                      tmp_path / "network.db"
                  )
                  net_clock = FrozenClock()
                  signer, _ = Ed25519Signer.generate()
                  config = RuntimeConfig(
                      host="127.0.0.1",
                      port=0,
                      api_token=None,
                  )
                  self.kernel = ZyraKernel(
                      db=self.net_db,
                      clock=net_clock,
                      signer=signer,
                      config=config,
                  )
                  self.kernel.bootstrap_root()
                  self.caps = ZyraCapabilities(
                      self.net_db,
                      net_clock,
                      identity=self.kernel.identity,
                      signer=signer,
                  )
                  self.net_server = serve_combined(
                      self.kernel,
                      self.caps,
                      host="127.0.0.1",
                      port=0,
                  )
                  self.net_thread = threading.Thread(
                      target=(
                          self.net_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.net_thread.start()
                  self.net_base = (
                      "http://127.0.0.1:"
                      f"{self.net_server.server_address[1]}"
                  )
                  self.net_url = self.net_base

                  self.agro_db = SQLiteAdapter(
                      tmp_path / "agro.db"
                  )
                  agro_clock = FrozenClock()
                  self.store = AgroStore(
                      self.agro_db, agro_clock
                  )
                  self.client = NetworkClient(
                      self.net_url, max_retries=1
                  )
                  self.link = ZyraLink(self.client)
                  self.agro_server = serve_agro(
                      self.store, self.client
                  )
                  self.agro_thread = threading.Thread(
                      target=(
                          self.agro_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.agro_thread.start()
                  self.agro_base = (
                      "http://127.0.0.1:"
                      f"{self.agro_server.bound_port}"
                  )

              def close(self) -> None:
                  self.agro_server.shutdown()
                  self.agro_server.server_close()
                  self.agro_thread.join(timeout=5)
                  self.net_server.shutdown()
                  self.net_server.server_close()
                  self.net_thread.join(timeout=5)
                  self.agro_db.close()
                  self.net_db.close()


          def _get(url: str) -> dict[str, object]:
              with urlopen(url, timeout=10) as response:
                  body = json.loads(
                      response.read().decode("utf-8")
                  )
              assert isinstance(body, dict)
              return body


          def _post(
              url: str, doc: dict[str, object]
          ) -> dict[str, object]:
              request = Request(
                  url,
                  data=json.dumps(doc).encode("utf-8"),
                  headers={
                      "Content-Type":
                      "application/json"
                  },
                  method="POST",
              )
              with urlopen(request, timeout=10) as response:
                  body = json.loads(
                      response.read().decode("utf-8")
                  )
              assert isinstance(body, dict)
              return body


          def test_farmer_journey_end_to_end(
              tmp_path: Path,
          ) -> None:
              eco = _Ecosystem(tmp_path)
              try:
                  reg = eco.link.register_app()
                  assert reg[0] is True
                  health = _get(
                      f"{eco.agro_base}/agro/health"
                  )
                  assert health["ok"] is True
                  created = _post(
                      f"{eco.agro_base}/agro/producers",
                      {
                          "name": "Jose Rural",
                          "producer_type":
                          "agricultor",
                          "location": "Chalatenango",
                      },
                  )
                  row = created["data"]
                  assert isinstance(row, dict)
                  producer_id = str(
                      row["producer_id"]
                  )
                  zid = row.get("zid")
                  assert isinstance(zid, str)
                  assert zid.startswith("ZID-")
                  assert row["synced"] is True
                  verified = _post(
                      f"{eco.agro_base}/agro/producers/verify",
                      {"producer_id": producer_id},
                  )
                  vdata = verified["data"]
                  assert isinstance(vdata, dict)
                  assert vdata["verified"] is True
                  production = _post(
                      f"{eco.agro_base}/agro/production",
                      {
                          "producer_id": producer_id,
                          "product": "maiz",
                          "quantity": 50,
                          "unit": "quintal",
                      },
                  )
                  pdata = production["data"]
                  assert isinstance(pdata, dict)
                  assert (
                      pdata["network_seq"] is not None
                  )
                  summary = _get(
                      f"{eco.agro_base}/agro/government/"
                      "summary"
                  )
                  gdata = summary["data"]
                  assert isinstance(gdata, dict)
                  assert (
                      gdata["producers_total"] == 1
                  )
                  assert (
                      gdata["producers_verified"]
                      == 1
                  )
                  by_product = gdata[
                      "productions_by_product"
                  ]
                  assert isinstance(by_product, dict)
                  assert by_product.get("maiz") == 50
                  alert = _post(
                      f"{eco.agro_base}/agro/alerts/"
                      "evaluate",
                      {
                          "previous_price": 20.0,
                          "current_price": 22.0,
                      },
                  )
                  adata = alert["data"]
                  assert isinstance(adata, dict)
                  assert adata["alert"] is True
                  assert adata["direction"] == "up"
              finally:
                  eco.close()


          def test_resilience_network_down_app_survives(
              tmp_path: Path,
          ) -> None:
              db = SQLiteAdapter(tmp_path / "agro.db")
              clock = FrozenClock()
              store = AgroStore(db, clock)
              dead_client = NetworkClient(
                  "http://127.0.0.1:1",
                  timeout_seconds=1.0,
                  max_retries=0,
              )
              server = serve_agro(store, dead_client)
              thread = threading.Thread(
                  target=server.serve_forever,
                  daemon=True,
              )
              thread.start()
              base = (
                  "http://127.0.0.1:"
                  f"{server.bound_port}"
              )
              try:
                  created = _post(
                      f"{base}/agro/producers",
                      {
                          "name": "Maria Offline",
                          "producer_type": (
                              "agricultora"
                          ),
                          "location": "Usulutan",
                      },
                  )
                  row = created["data"]
                  assert isinstance(row, dict)
                  assert row.get("zid") is None
                  assert row["synced"] is False
                  production = _post(
                      f"{base}/agro/production",
                      {
                          "producer_id": str(
                              row["producer_id"]
                          ),
                          "product": "frijol",
                          "quantity": 10,
                          "unit": "quintal",
                      },
                  )
                  pdata = production["data"]
                  assert isinstance(pdata, dict)
                  assert (
                      pdata["network_seq"] is None
                  )
                  summary = _get(
                      f"{base}/agro/government/summary"
                  )
                  gdata = summary["data"]
                  assert isinstance(gdata, dict)
                  assert (
                      gdata["producers_total"] == 1
                  )
              finally:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=5)
                  db.close()


          def test_menu_silicon_valley_rule(
              tmp_path: Path,
          ) -> None:
              eco = _Ecosystem(tmp_path)
              try:
                  menu = _get(
                      f"{eco.agro_base}/agro/menu"
                  )
                  data = menu["data"]
                  assert isinstance(data, dict)
                  actions = data["actions"]
                  assert isinstance(actions, list)
                  assert len(actions) <= 2
              finally:
                  eco.close()
