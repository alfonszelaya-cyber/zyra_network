              def _post(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_post(s[1:])
                      return
                  store = type(self).store
                  link = type(self).link
                  doc = self._read_form()
                  if s == ["register"]:
                      name = self._req(doc, "name")
                      role = str(
                          doc.get("role", "alumno")
                      )
                      if role not in ROLES:
                          raise ValueError(
                              f"unknown role:"
                              f" {role}"
                          )
                      school = doc.get("school")
                      school = (
                          str(school)
                          if school is not None
                          else None
                      )
                      grade = doc.get("grade")
                      grade = (
                          str(grade)
                          if grade is not None
                          else None
                      )
                      account_id = (
                          "SEM-"
                          + uuid.uuid4().hex[:12]
                      )
                      zid: str | None = None
                      if role == "alumno":
                          ok, data, _error = (
                              link.register_person(
                                  name
                              )
                          )
                          if (
                              ok
                              and data is not None
                          ):
                              zid = str(
                                  data.get("zid")
                              )
                              link.record_milestone(
                                  zid,
                                  "inscripcion",
                                  name,
                              )
                      store.add_account(
                          account_id=account_id,
                          zid=zid,
                          name=name,
                          role=role,
                          school=school,
                          grade=grade,
                      )
                      self._html(
                          200,
                          _page(
                              "Bienvenido a SEMILLA",
                              "<h1>Cuenta creada"
                              "</h1>"
                              "<p>Tu ID:"
                              f" <b>{account_id}"
                              "</b></p>"
                              "<a href='/semilla/"
                              f"{role}/{account_id}'>"
                              "<button>Ir a mi panel"
                              "</button></a>"
                          ),
                      )
                      return
                  if s == ["grade"]:
                      student_account = self._req(
                          doc, "student_account"
                      )
                      teacher_account = self._req(
                          doc, "teacher_account"
                      )
                      row = store.add_grade(
                          grade_id=(
                              "NOT-"
                              + uuid.uuid4().hex[:10]
                          ),
                          student_account=(
                              student_account
                          ),
                          subject=self._req(
                              doc, "subject"
                          ),
                          score=float(
                              doc.get("score", 0)
                          ),
                          teacher_account=(
                              teacher_account
                          ),
                      )
                      self._html(
                          200,
                          _page(
                              "Nota registrada",
                              "<h1>Nota"
                              " registrada</h1>"
                              f"<p>{row['subject']}:"
                              f" {row['score']}</p>"
                              "<a href='/semilla/"
                              "profesor/"
                              f"{teacher_account}'>"
                              "<button>Volver"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["welfare"]:
                      student_account = self._req(
                          doc, "student_account"
                      )
                      mood = self._req(
                          doc, "mood"
                      )
                      result = type(
                          self
                      ).tutor.stimulus(mood=mood)
                      store.add_welfare(
                          welfare_id=(
                              "WEL-"
                              + uuid.uuid4().hex[:10]
                          ),
                          student_account=(
                              student_account
                          ),
                          mood=mood,
                      )
                      icon = (
                          "🚨"
                          if result["critical"]
                          else (
                              "⚠️"
                              if result["alert"]
                              else "🌟"
                          )
                      )
                      self._html(
                          200,
                          _page(
                              "Tutor SEMILLA",
                              "<h1>"
                              + icon
                              + " Tutor SEMILLA"
                              "</h1>"
                              "<p>"
                              + result["message"]
                              + "</p>"
                              + (
                                  "<div class='alert'>"
                                  "Aviso enviado a:"
                                  " "
                                  + ", ".join(
                                      result[
                                          "notify"
                                      ]
                                  )
                                  + "</div>"
                                  if result["alert"]
                                  else ""
                              )
                              + "<a href='/semilla'>"
                              "<button class='gray'>"
                              "Inicio</button></a>",
                          ),
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>Ruta"
                      " desconocida</h1>"),
                  )

              def _read_form(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  ).decode("utf-8")
                  doc: dict[str, Any] = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          key, value = pair.split(
                              "=", 1
                          )
                          doc[key] = value.replace(
                              "+", " "
                          )
                  return doc

              def _read_json(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  )
                  parsed: Any = json.loads(
                      raw.decode("utf-8")
                  )
                  if not isinstance(parsed, dict):
                      raise ValueError(
                          "body must be a JSON"
                          " object"
                      )
                  return {
                      str(k): v
                      for k, v in parsed.items()
                  }

              @staticmethod
              def _req(
                  doc: dict[str, Any], key: str
              ) -> str:
                  value: Any = doc.get(key)
                  if isinstance(value, int) and not isinstance(
                      value, bool
                  ):
                      value = str(value)
                  if not isinstance(value, str):
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  if not value.strip():
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  return value

              def _api_get(self, s: list[str]) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app": "semilla",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  if s == ["summary"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": store.summary(),
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _api_post(
                  self, s: list[str]
              ) -> None:
                  store = type(self).store
                  doc = self._read_json()
                  if s == ["accounts"]:
                      account_id = (
                          "SEM-"
                          + uuid.uuid4().hex[:12]
                      )
                      row = store.add_account(
                          account_id=account_id,
                          zid=doc.get("zid"),
                          name=self._req(doc, "name"),
                          role=self._req(doc, "role"),
                          school=doc.get("school"),
                          grade=doc.get("grade"),
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  if s == ["grades"]:
                      row = store.add_grade(
                          grade_id=(
                              "NOT-"
                              + uuid.uuid4().hex[:10]
                          ),
                          student_account=self._req(
                              doc,
                              "student_account",
                          ),
                          subject=self._req(
                              doc, "subject"
                          ),
                          score=float(
                              doc.get("score", 0)
                          ),
                          teacher_account=self._req(
                              doc,
                              "teacher_account",
                          ),
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

