          """SUBASTAS HTTP server: marketplace + direct
          purchase + orders + payments + settlement +
          shipments + mutual reputation + radar VIP."""
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import uuid
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import parse_qs

          from apps.subastas.infrastructure.persistence.subastas_store import (
              SubastasStore,
              new_bid_id,
              new_listing_id,
              new_opportunity_id,
              new_order_id,
              new_shipment_id,
          )
          from apps.subastas.services.subastas_link import SubastasLink


          def _find_value(doc, keys):
              if isinstance(doc, dict):
                  for k, v in doc.items():
                      if str(k).lower() in keys:
                          return v
                  for v in doc.values():
                      found = _find_value(v, keys)
                      if found is not None:
                          return found
              elif isinstance(doc, list):
                  for item in doc:
                      found = _find_value(item, keys)
                      if found is not None:
                          return found
              return None


          class SubastasApiHandler(BaseHTTPRequestHandler):
              store: SubastasStore
              net_client: object
              link: SubastasLink

              def log_message(self, format: str, *args) -> None:
                  pass

              def _send_bytes(self, status, ctype, body) -> None:
                  self.send_response(status)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def _send_html(self, status, html) -> None:
                  self._send_bytes(status, "text/html", html.encode("utf-8"))

              def _send_json(self, status, doc) -> None:
                  self._send_bytes(
                      status, "application/json", json.dumps(doc).encode("utf-8")
                  )

              def _read_body(self) -> bytes:
                  try:
                      length = int(self.headers.get("Content-Length", "0") or "0")
                  except Exception:
                      length = 0
                  if length <= 0:
                      return b""
                  return self.rfile.read(length)

              def _read_form(self) -> dict:
                  raw = self._read_body()
                  parsed = parse_qs(raw.decode("utf-8"))
                  form = {}
                  for key, values in parsed.items():
                      if values:
                          form[key] = values[0]
                  return form

              def _read_json(self) -> dict | None:
                  raw = self._read_body()
                  if not raw:
                      return {}
                  try:
                      doc = json.loads(raw.decode("utf-8"))
                  except Exception:
                      return None
                  if not isinstance(doc, dict):
                      return None
                  return doc

              @staticmethod
              def _form_value(form, key) -> str:
                  value = form.get(key, "")
                  if value is None:
                      return ""
                  return str(value)

              def _trust_best_effort(self, zid) -> bool:
                  if not zid:
                      return False
                  try:
                      ok, _d, _e = self.link.complete_trust(str(zid))
                      return bool(ok)
                  except Exception:
                      return False

              def do_GET(self) -> None:
                  path = self.path.split("?")[0]
                  try:
                      if path in ("/", "/subastas", "/subastas/"):
                          self._send_html(200, self._home())
                          return
                      if path in ("/subastas/api/health", "/subastas/health"):
                          self._send_json(200, {"ok": True, "app": "subastas"})
                          return
                      if path == "/subastas/listings":
                          self._send_html(200, self._listings_html())
                          return
                      if path == "/subastas/api/summary":
                          self._send_json(
                              200, {"ok": True, "summary": self.store.summary()}
                          )
                          return
                      if path == "/subastas/api/opportunities":
                          self._send_json(
                              200,
                              {
                                  "ok": True,
                                  "data": {
                                      "opportunities": self.store.list_opportunities()
                                  },
                              },
                          )
                          return
                      if path == "/subastas/revision":
                          self._send_html(200, self._revision_html())
                          return
                      if path.startswith("/subastas/api/listings/"):
                          listing_id = path[len("/subastas/api/listings/"):]
                          listing = self.store.get_listing(listing_id)
                          if listing is None:
                              self._send_json(
                                  200,
                                  {
                                      "ok": False,
                                      "error": "unknown listing: " + listing_id,
                                  },
                              )
                              return
                          self._send_json(200, {"ok": True, "data": listing})
                          return
                      if path.startswith("/subastas/api/orders/"):
                          order_id = path[len("/subastas/api/orders/"):]
                          self._send_json(
                              200, {"ok": True, "data": self.store.get_order(order_id)}
                          )
                          return
                      if path.startswith("/subastas/api/shipments/"):
                          shipment_id = path[len("/subastas/api/shipments/"):]
                          self._send_json(
                              200,
                              {
                                  "ok": True,
                                  "data": self.store.get_shipment(shipment_id),
                              },
                          )
                          return
                      self._send_json(
                          404, {"ok": False, "error": "unknown path: " + path}
                      )
                  except LookupError as exc:
                      self._send_json(404, {"ok": False, "error": str(exc)})
                  except Exception:
                      self._send_json(500, {"ok": False, "error": "server error"})

              def do_POST(self) -> None:
                  path = self.path.split("?")[0]
                  try:
                      if path == "/subastas/listing":
                          self._create_listing_form()
                          return
                      if path == "/subastas/api/bids":
                          self._create_bid_json()
                          return
                      if path == "/subastas/close":
                          self._close_form()
                          return
                      if path == "/subastas/api/orders":
                          self._create_order_json()
                          return
                      if path == "/subastas/api/reputation/mutual":
                          self._mutual_reputation_json()
                          return
                      if path == "/subastas/api/radar/scan":
                          self._radar_scan_json()
                          return
                      if path.startswith("/subastas/api/orders/"):
                          parts = path[len("/subastas/api/orders/"):].split("/")
                          order_id = parts[0]
                          action = parts[1] if len(parts) > 1 else ""
                          self._order_action(order_id, action)
                          return
                      if path.startswith("/subastas/api/shipments/"):
                          parts = path[len("/subastas/api/shipments/"):].split("/")
                          shipment_id = parts[0]
                          action = parts[1] if len(parts) > 1 else ""
                          self._shipment_action(shipment_id, action)
                          return
                      self._send_json(
                          404, {"ok": False, "error": "unknown path: " + path}
                      )
                  except (ValueError, LookupError, PermissionError) as exc:
                      self._send_json(400, {"ok": False, "error": str(exc)})
                  except Exception:
                      self._send_json(500, {"ok": False, "error": "server error"})

              def _seal_listing(
                  self, seller_zid, seller_account, title, description, base_price,
              ):
                  content = "|".join(
                      (
                          seller_account,
                          title,
                          description,
                          format(base_price, ".2f"),
                      )
                  )
                  encoded = base64.b64encode(content.encode("utf-8")).decode("ascii")
                  payload = {
                      "owner_zid": seller_zid if seller_zid else seller_account,
                      "title": title,
                      "content_b64": encoded,
                      "actor_app": "subastas",
                  }
                  ok, data, _err = self.net_client.post("/documents/seal", payload)
                  if ok and data:
                      doc_id = _find_value(data, ("document_id", "seal_id"))
                      if isinstance(doc_id, str) and doc_id:
                          return doc_id, True
                  digest = hashlib.sha256(content.encode("utf-8")).hexdigest()
                  return "DOC-" + digest[:16], False

              def _create_listing_form(self) -> None:
                  form = self._read_form()
                  seller_account = self._form_value(form, "seller_account")
                  title = self._form_value(form, "title")
                  description = self._form_value(form, "description")
                  raw_price = self._form_value(form, "base_price")
                  if not seller_account or not title:
                      self._send_html(
                          400,
                          "<html><body><h1>Faltan datos</h1></body></html>",
                      )
                      return
                  try:
                      base_price = float(raw_price)
                  except (TypeError, ValueError):
                      self._send_html(
                          400,
                          "<html><body><h1>Precio invalido</h1></body></html>",
                      )
                      return
                  account = self.store.get_account(seller_account)
                  seller_zid = account["zid"] if account else None
                  document_id, network_sealed = self._seal_listing(
                      seller_zid, seller_account, title, description, base_price
                  )
                  listing_id = new_listing_id()
                  self.store.add_listing(
                      listing_id=listing_id,
                      seller_account=seller_account,
                      seller_zid=seller_zid,
                      title=title,
                      description=description,
                      base_price=base_price,
                      document_id=document_id,
                      network_sealed=network_sealed,
                  )
                  if network_sealed:
                      seal_line = "<p>SELLADO</p>"
                  else:
                      seal_line = "<p>SELLADO LOCAL (pendiente de red)</p>"
                  html = (
                      "<html><body><h1>SUBASTAS</h1>"
                      + seal_line
                      + "<p>listing: "
                      + listing_id
                      + "</p><p>documento: "
                      + document_id
                      + "</p></body></html>"
                  )
                  self._send_html(200, html)

              def _create_bid_json(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._send_json(400, {"ok": False, "error": "invalid JSON"})
                      return
                  bid = self.store.place_bid(
                      bid_id=new_bid_id(),
                      listing_id=str(doc.get("listing_id", "")),
                      bidder_account=str(doc.get("bidder_account", "")),
                      amount=float(doc.get("amount", 0)),
                  )
                  self._send_json(200, {"ok": True, "bid": bid})

              def _close_form(self) -> None:
                  form = self._read_form()
                  closed = self.store.close_listing(
                      listing_id=self._form_value(form, "listing_id"),
                      seller_account=self._form_value(form, "seller_account"),
                  )
                  html = (
                      "<html><body><h1>SUBASTAS</h1>"
                      "<p>GANADOR: "
                      + str(closed["winner_account"])
                      + "</p><p>PRECIO FINAL: "
                      + format(closed["final_price"], ".2f")
                      + "</p></body></html>"
                  )
                  self._send_html(200, html)

              def _create_order_json(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._send_json(400, {"ok": False, "error": "invalid JSON"})
                      return
                  listing_id = str(doc.get("listing_id", ""))
                  buyer_account = str(doc.get("buyer_account", ""))
                  source = str(doc.get("source", "direct"))
                  buyer = self.store.get_account(buyer_account)
                  buyer_zid = buyer["zid"] if buyer else None
                  order = self.store.create_order(
                      order_id=new_order_id(),
                      listing_id=listing_id,
                      buyer_account=buyer_account,
                      buyer_zid=buyer_zid,
                      source=source,
                  )
                  self._send_json(201, {"ok": True, "data": order})

              def _order_action(self, order_id: str, action: str) -> None:
                  doc = self._read_json() or {}
                  if action == "pay":
                      provider = str(doc.get("provider", "wallet"))
                      order = self.store.pay_order(order_id=order_id, provider=provider)
                      self._send_json(200, {"ok": True, "data": order})
                      return
                  if action == "settle":
                      order = self.store.settle_order(order_id=order_id)
                      self._send_json(200, {"ok": True, "data": order})
                      return
                  if action == "ship":
                      self.store.create_shipment(
                          shipment_id=new_shipment_id(),
                          order_id=order_id,
                          carrier=str(doc.get("carrier", "zyra-express")),
                          origin=str(doc.get("origin", "SV")),
                          destination=str(doc.get("destination", "SV")),
                      )
                      order = self.store.get_order(order_id)
                      self._send_json(200, {"ok": True, "data": order})
                      return
                  self._send_json(
                      400, {"ok": False, "error": "unknown order action: " + action}
                  )

              def _shipment_action(self, shipment_id: str, action: str) -> None:
                  doc = self._read_json() or {}
                  if action == "track":
                      shipment = self.store.add_tracking(
                          shipment_id=shipment_id,
                          status=str(doc.get("status", "in_transit")),
                          location=str(doc.get("location", "")),
                          description=str(doc.get("description", "")),
                      )
                      self._send_json(200, {"ok": True, "data": shipment})
                      return
                  if action == "deliver":
                      shipment = self.store.confirm_delivery(shipment_id=shipment_id)
                      self._send_json(200, {"ok": True, "data": shipment})
                      return
                  self._send_json(
                      400,
                      {"ok": False, "error": "unknown shipment action: " + action},
                  )

              def _mutual_reputation_json(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._send_json(400, {"ok": False, "error": "invalid JSON"})
                      return
                  order_id = str(doc.get("order_id", ""))
                  buyer_account = str(doc.get("buyer_account", ""))
                  seller_account = str(doc.get("seller_account", ""))
                  evidence = str(
                      doc.get("evidence", "")
                      or "transaccion completada en SUBASTAS"
                  )
                  self.store.get_order(order_id)
                  buyer = self.store.get_account(buyer_account)
                  seller = self.store.get_account(seller_account)
                  buyer_zid = buyer["zid"] if buyer else None
                  seller_zid = seller["zid"] if seller else None
                  if not buyer_zid or not seller_zid:
                      raise ValueError("accounts must have network ZIDs")
                  self._trust_best_effort(buyer_zid)
                  self._trust_best_effort(seller_zid)

                  def _network(rep) -> bool:
                      try:
                          if not rep[0]:
                              return False
                          data = rep[1]
                          if isinstance(data, dict) and data.get("recorded") == "local":
                              return False
                          return True
                      except Exception:
                          return False

                  rep_b2s = self.link.give_reputation(
                      subject_zid=seller_zid,
                      actor_zid=buyer_zid,
                      kind="positive",
                      evidence=evidence,
                  )
                  rep_s2b = self.link.give_reputation(
                      subject_zid=buyer_zid,
                      actor_zid=seller_zid,
                      kind="positive",
                      evidence=evidence,
                  )
                  self.store.record_reputation(
                      subject_zid=seller_zid,
                      actor_zid=buyer_zid,
                      kind="positive",
                      evidence=evidence,
                      source="order:" + order_id,
                      network_recorded=_network(rep_b2s),
                  )
                  self.store.record_reputation(
                      subject_zid=buyer_zid,
                      actor_zid=seller_zid,
                      kind="positive",
                      evidence=evidence,
                      source="order:" + order_id,
                      network_recorded=_network(rep_s2b),
                  )
                  hist_s = self.link.record_history(
                      seller_zid, "venta completada", "orden " + order_id
                  )
                  hist_b = self.link.record_history(
                      buyer_zid, "compra completada", "orden " + order_id
                  )
                  self._send_json(
                      200,
                      {
                          "ok": True,
                          "data": {
                              "order_id": order_id,
                              "buyer_to_seller_network": _network(rep_b2s),
                              "seller_to_buyer_network": _network(rep_s2b),
                              "history_seller_recorded": bool(hist_s[0]),
                              "history_buyer_recorded": bool(hist_b[0]),
                          },
                      },
                  )

              def _radar_scan_json(self) -> None:
                  doc = self._read_json()
                  if doc is None:
                      self._send_json(400, {"ok": False, "error": "invalid JSON"})
                      return
                  title = str(doc.get("title", "oportunidad"))
                  category = str(doc.get("category", "general"))
                  purchase = float(doc.get("purchase_price", 0))
                  shipping = float(doc.get("shipping_cost", 0))
                  fees = float(doc.get("fees", 0))
                  sale = float(doc.get("estimated_sale_price", 0))
                  demand = float(doc.get("demand_score", 0.5))
                  risk = float(doc.get("risk_score", 0.5))
                  if purchase <= 0 or sale <= 0:
                      raise ValueError(
                          "purchase_price and estimated_sale_price must be positive"
                      )
                  opportunity = self.store.create_opportunity(
                      opportunity_id=new_opportunity_id(),
                      title=title,
                      category=category,
                      purchase_price=purchase,
                      shipping_cost=shipping,
                      fees=fees,
                      estimated_sale_price=sale,
                      demand_score=demand,
                      risk_score=risk,
                  )
                  self._send_json(201, {"ok": True, "data": opportunity})

              def _home(self) -> str:
                  return (
                      "<html><head><title>SUBASTAS</title></head><body>"
                      "<h1>SUBASTAS</h1><p>Super-market ZYRA.</p>"
                      "<p>Roles: vendedor | comprador | gobierno</p>"
                      "<ul>"
                      "<li>POST /subastas/listing (form, sella)</li>"
                      "<li>POST /subastas/api/bids</li>"
                      "<li>POST /subastas/close</li>"
                      "<li>POST /subastas/api/orders (compra directa o ganador)</li>"
                      "<li>POST /subastas/api/orders/{id}/pay</li>"
                      "<li>POST /subastas/api/orders/{id}/settle</li>"
                      "<li>POST /subastas/api/orders/{id}/ship</li>"
                      "<li>POST /subastas/api/shipments/{id}/track</li>"
                      "<li>POST /subastas/api/shipments/{id}/deliver</li>"
                      "<li>POST /subastas/api/reputation/mutual</li>"
                      "<li>POST /subastas/api/radar/scan</li>"
                      "<li>GET /subastas/api/opportunities</li>"
                      "<li>GET /subastas/listings</li>"
                      "<li>GET /subastas/revision</li>"
                      "<li>GET /subastas/api/health</li>"
                      "</ul></body></html>"
                  )

              def _listings_html(self) -> str:
                  rows = self.store.list_open()
                  html = (
                      "<html><body><h1>Publicaciones abiertas</h1><ul>"
                  )
                  for row in rows:
                      html += (
                          "<li>"
                          + str(row["listing_id"])
                          + " - "
                          + str(row["title"])
                          + " - base "
                          + format(float(row["base_price"]), ".2f")
                          + "</li>"
                      )
                  html += "</ul></body></html>"
                  return html

              def _revision_html(self) -> str:
                  summary = self.store.summary()
                  html = (
                      "<html><body><h1>Revision SUBASTAS</h1>"
                      "<p>ordenes: "
                      + str(summary["orders_total"])
                      + " | entregadas: "
                      + str(summary["orders_delivered"])
                      + " | oportunidades radar: "
                      + str(summary["opportunities"])
                      + "</p>"
                      "<a href='/subastas'><button>Inicio</button></a>"
                      "</body></html>"
                  )
                  return html


          def serve_subastas(
              store: SubastasStore,
              client: object,
              *,
              host: str = "127.0.0.1",
              port: int = 0,
          ) -> ThreadingHTTPServer:
              handler = type(
                  "BoundSubastasHandler",
                  (SubastasApiHandler,),
                  {
                      "store": store,
                      "net_client": client,
                      "link": SubastasLink(client),
                  },
              )
              server = ThreadingHTTPServer((host, port), handler)
              server.bound_port = server.server_address[1]
              return server
