name: zyra-modulo-06-verification

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-06-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01-05 present
        run: |
          set -euo pipefail
          test -f shared_engines/common/errors.py
          test -f shared_engines/storage/database.py
          test -f shared_engines/events/outbox.py
          test -f shared_engines/audit/chain.py
          test -f shared_engines/identity/engine.py
          echo "modules 01-05 present: OK"

      - name: Build shared_engines/verification
        run: |
          set -euo pipefail
          mkdir -p shared_engines/verification/tests

          cat > shared_engines/verification/__init__.py <<'PYEOF'
          """Zyra verification engine.

          Verifiable authenticity for the Network: documents, photos,
          videos, audio, signed attestations, verifiable credential
          history (bank/employer/education records), per-media
          provenance chains. Third parties verify offline with the
          Network's public key; every state change is audited.
          AI-content detection requires real models and arrives as a
          dedicated engine; this module does not fake it.
          """
          from __future__ import annotations

          from shared_engines.verification.attestations import (
              Attestation,
              AttestationIssuer,
          )
          from shared_engines.verification.credentials import (
              CredentialRecord,
              CredentialRegistry,
              CredentialType,
          )
          from shared_engines.verification.engine import VerificationEngine
          from shared_engines.verification.errors import (
              AttestationNotFoundError,
              CredentialNotFoundError,
              DocumentNotFoundError,
              InvalidSignatureError,
              MediaNotFoundError,
              ProvenanceError,
              SigningKeyError,
              TamperDetectedError,
              VerificationError,
          )
          from shared_engines.verification.media import (
              MediaKind,
              MediaPage,
              MediaRecord,
              MediaRegistry,
              content_sha256,
          )
          from shared_engines.verification.provenance import (
              ProvenanceChain,
              ProvenanceEvent,
          )
          from shared_engines.verification.signatures import (
              Ed25519Signer,
              Ed25519Verifier,
          )

          __all__ = [
              "Attestation", "AttestationIssuer", "AttestationNotFoundError",
              "CredentialNotFoundError", "CredentialRecord",
              "CredentialRegistry", "CredentialType", "DocumentNotFoundError",
              "Ed25519Signer", "Ed25519Verifier", "InvalidSignatureError",
              "MediaKind", "MediaNotFoundError", "MediaPage", "MediaRecord",
              "MediaRegistry", "ProvenanceChain", "ProvenanceError",
              "ProvenanceEvent", "SigningKeyError", "TamperDetectedError",
              "VerificationEngine", "VerificationError", "content_sha256",
          ]
          PYEOF

          cat > shared_engines/verification/errors.py <<'PYEOF'
          """Typed verification errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              ConfigurationError,
              EngineError,
              IntegrityError,
              NotFoundError,
          )


          class VerificationError(EngineError):
              """Base for verification engine failures."""


          class DocumentNotFoundError(VerificationError, NotFoundError):
              """No document exists for the given id."""


          class MediaNotFoundError(VerificationError, NotFoundError):
              """No media item exists for the given id."""


          class TamperDetectedError(VerificationError, IntegrityError):
              """Content does not match the registered fingerprint."""


          class InvalidSignatureError(VerificationError, IntegrityError):
              """A signature does not verify against the claimed key."""


          class SigningKeyError(VerificationError, ConfigurationError):
              """A signing/verification key could not be loaded."""


          class AttestationNotFoundError(VerificationError, NotFoundError):
              """No attestation exists for the given id."""


          class CredentialNotFoundError(VerificationError, NotFoundError):
              """No credential exists for the given id."""


          class ProvenanceError(VerificationError, IntegrityError):
              """The provenance chain is broken or inconsistent."""
          PYEOF

          cat > shared_engines/verification/signatures.py <<'PYEOF'
          """Ed25519 digital signatures.

          Real asymmetric cryptography: the Network signs with its
          private key; anyone with the public key verifies. Signatures
          are compact (64 bytes) and third-party verifiable without
          any database access.
          """
          from __future__ import annotations

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import (
              Ed25519PrivateKey,
              Ed25519PublicKey,
          )

          from shared_engines.verification.errors import SigningKeyError


          class Ed25519Signer:
              """Holds the private signing key; signs canonical bytes."""

              def __init__(self, private_pem: bytes) -> None:
                  try:
                      key = serialization.load_pem_private_key(
                          private_pem, password=None
                      )
                  except Exception as exc:
                      raise SigningKeyError(
                          "private key PEM is not loadable"
                      ) from exc
                  if not isinstance(key, Ed25519PrivateKey):
                      raise SigningKeyError("signing key must be Ed25519")
                  self._key = key

              @classmethod
              def generate(cls) -> tuple[Ed25519Signer, bytes]:
                  """Returns (signer, private_pem). Store the PEM safely."""
                  private = Ed25519PrivateKey.generate()
                  private_pem = private.private_bytes(
                      encoding=serialization.Encoding.PEM,
                      format=serialization.PrivateFormat.PKCS8,
                      encryption_algorithm=serialization.NoEncryption(),
                  )
                  return cls(private_pem), private_pem

              @property
              def public_pem(self) -> bytes:
                  return self._key.public_key().public_bytes(
                      encoding=serialization.Encoding.PEM,
                      format=serialization.PublicFormat.SubjectPublicKeyInfo,
                  )

              def sign(self, data: bytes) -> bytes:
                  return self._key.sign(data)


          class Ed25519Verifier:
              """Verifies signatures against a public key.

              This is the object a third party uses to check a Zyra
              attestation offline.
              """

              def __init__(self, public_pem: bytes) -> None:
                  try:
                      key = serialization.load_pem_public_key(public_pem)
                  except Exception as exc:
                      raise SigningKeyError(
                          "public key PEM is not loadable"
                      ) from exc
                  if not isinstance(key, Ed25519PublicKey):
                      raise SigningKeyError(
                          "verification key must be Ed25519"
                      )
                  self._key = key

              def verify(self, data: bytes, signature: bytes) -> bool:
                  try:
                      self._key.verify(signature, data)
                  except Exception:
                      return False
                  return True
          PYEOF

          cat > shared_engines/verification/media.py <<'PYEOF'
          """Media registry: photos, videos, audio, documents.

          A media record stores the SHA-256 fingerprint of the
          ORIGINAL content plus its kind. Later, presenting the
          content again re-hashes against the registry: mismatch
          means tampering and is audited + evented. The registry
          never stores raw content, only fingerprints and metadata.
          """
          from __future__ import annotations

          import hashlib
          import sqlite3
          from dataclasses import dataclass
          from enum import Enum

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.common.identifiers import new_id
          from shared_engines.common.validation import require_non_empty_str
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )
          from shared_engines.verification.errors import (
              MediaNotFoundError,
              TamperDetectedError,
          )

          EVENT_MEDIA_REGISTERED = "verification.media.registered"
          EVENT_MEDIA_TAMPER = "verification.media.tamper_detected"

          MEDIA_MIGRATIONS = (
              Migration(
                  1,
                  "media",
                  (
                      "CREATE TABLE media ("
                      " media_id TEXT PRIMARY KEY,"
                      " owner_zid TEXT NOT NULL,"
                      " kind TEXT NOT NULL,"
                      " title TEXT NOT NULL,"
                      " content_sha256 TEXT NOT NULL,"
                      " content_size INTEGER NOT NULL,"
                      " content_type TEXT NOT NULL,"
                      " created_at REAL NOT NULL,"
                      " contract_version INTEGER NOT NULL)",
                      "CREATE INDEX media_owner ON media (owner_zid)",
                      "CREATE INDEX media_kind ON media (kind)",
                  ),
              ),
          )


          def content_sha256(content: bytes) -> str:
              return hashlib.sha256(content).hexdigest()


          class MediaKind(Enum):
              PHOTO = "photo"
              VIDEO = "video"
              AUDIO = "audio"
              DOCUMENT = "document"


          @dataclass(frozen=True)
          class MediaRecord:
              media_id: str
              owner_zid: str
              kind: MediaKind
              title: str
              content_sha256: str
              content_size: int
              content_type: str
              created_at: float
              contract_version: int


          @dataclass(frozen=True)
          class MediaPage:
              items: tuple[MediaRecord, ...]
              offset: int
              limit: int
              total: int

              @property
              def has_more(self) -> bool:
                  return self.offset + len(self.items) < self.total


          class MediaRegistry:
              """Durable registry of content fingerprints, any media kind."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  audit: AuditTrail,
                  outbox: Outbox,
                  catalog: EventCatalog,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  self._outbox = outbox
                  self._catalog = catalog
                  MigrationRunner(
                      db, "verification.media", MEDIA_MIGRATIONS
                  ).run(clock)

              def register(
                  self,
                  *,
                  owner_zid: str,
                  kind: MediaKind,
                  title: str,
                  content: bytes,
                  content_type: str,
                  actor: str,
              ) -> MediaRecord:
                  require_non_empty_str(owner_zid, "owner_zid")
                  require_non_empty_str(title, "title")
                  require_non_empty_str(content_type, "content_type")
                  require_non_empty_str(actor, "actor")
                  sha = content_sha256(content)
                  media_id = f"MED-{new_id()}"
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO media"
                          " (media_id, owner_zid, kind, title,"
                          "  content_sha256, content_size, content_type,"
                          "  created_at, contract_version)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)",
                          (
                              media_id,
                              owner_zid,
                              kind.value,
                              title,
                              sha,
                              len(content),
                              content_type,
                              now,
                              1,
                          ),
                      )
                      event = self._catalog.build(
                          EVENT_MEDIA_REGISTERED,
                          aggregate_id=media_id,
                          payload={
                              "media_id": media_id,
                              "owner_zid": owner_zid,
                              "kind": kind.value,
                              "content_sha256": sha,
                              "content_type": content_type,
                          },
                          clock=self._clock,
                      )
                      self._outbox.enqueue_in_transaction(cursor, event)
                  self._audit.append(
                      event_type=EVENT_MEDIA_REGISTERED,
                      actor=actor,
                      subject=media_id,
                      payload={
                          "content_sha256": sha,
                          "owner_zid": owner_zid,
                      },
                  )
                  record = self.get(media_id)
                  if record is None:
                      raise IntegrityError("media vanished after insert")
                  return record

              def get(self, media_id: str) -> MediaRecord | None:
                  row = self._db.query_one(
                      "SELECT * FROM media WHERE media_id = ?", (media_id,)
                  )
                  if row is None:
                      return None
                  return self._record_from_row(row)

              def verify_content(
                  self, media_id: str, content: bytes
              ) -> MediaRecord:
                  record = self.get(media_id)
                  if record is None:
                      raise MediaNotFoundError(
                          f"unknown media: {media_id}"
                      )
                  current = content_sha256(content)
                  if current != record.content_sha256:
                      self._audit.append(
                          event_type=EVENT_MEDIA_TAMPER,
                          actor="verification-engine",
                          subject=media_id,
                          payload={
                              "expected_sha256": record.content_sha256,
                              "observed_sha256": current,
                          },
                      )
                      event = self._catalog.build(
                          EVENT_MEDIA_TAMPER,
                          aggregate_id=media_id,
                          payload={
                              "expected_sha256": record.content_sha256,
                              "observed_sha256": current,
                          },
                          clock=self._clock,
                      )
                      self._outbox.enqueue(event)
                      raise TamperDetectedError(
                          f"content hash mismatch for {media_id}:"
                          " the media does not match the registry"
                      )
                  return record

              def list_by_owner(
                  self,
                  owner_zid: str,
                  *,
                  offset: int = 0,
                  limit: int = 50,
              ) -> MediaPage:
                  total_row = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM media WHERE owner_zid = ?",
                      (owner_zid,),
                  )
                  total = int(total_row["n"]) if total_row is not None else 0
                  rows = self._db.query_all(
                      "SELECT * FROM media WHERE owner_zid = ?"
                      " ORDER BY created_at, media_id LIMIT ? OFFSET ?",
                      (owner_zid, limit, offset),
                  )
                  items = tuple(self._record_from_row(row) for row in rows)
                  return MediaPage(
                      items=items, offset=offset, limit=limit, total=total
                  )

              @staticmethod
              def _record_from_row(row: sqlite3.Row) -> MediaRecord:
                  return MediaRecord(
                      media_id=str(row["media_id"]),
                      owner_zid=str(row["owner_zid"]),
                      kind=MediaKind(str(row["kind"])),
                      title=str(row["title"]),
                      content_sha256=str(row["content_sha256"]),
                      content_size=int(row["content_size"]),
                      content_type=str(row["content_type"]),
                      created_at=float(row["created_at"]),
                      contract_version=int(row["contract_version"]),
                  )
          PYEOF

          cat > shared_engines/verification/provenance.py <<'PYEOF'
          """Content provenance: tamper-evident chain of custody.

          Every action on a media item (registered, transferred,
          annotated, verified, attested) is appended to a
          hash-chained log specific to that media. Anyone can verify
          the chain integrity by recomputing hashes from the events,
          without access to the storage.
          """
          from __future__ import annotations

          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.identifiers import stable_hash
          from shared_engines.common.validation import require_non_empty_str
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          GENESIS_HASH = "0" * 64

          PROVENANCE_MIGRATIONS = (
              Migration(
                  1,
                  "provenance",
                  (
                      "CREATE TABLE media_provenance ("
                      " sequence INTEGER NOT NULL,"
                      " media_id TEXT NOT NULL,"
                      " actor_zid TEXT NOT NULL,"
                      " action TEXT NOT NULL,"
                      " detail TEXT NOT NULL,"
                      " occurred_at REAL NOT NULL,"
                      " previous_hash TEXT NOT NULL,"
                      " event_hash TEXT NOT NULL,"
                      " PRIMARY KEY (media_id, sequence))",
                      "CREATE INDEX provenance_media"
                      " ON media_provenance (media_id, sequence)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class ProvenanceEvent:
              sequence: int
              media_id: str
              actor_zid: str
              action: str
              detail: str
              occurred_at: float
              previous_hash: str
              event_hash: str


          class ProvenanceChain:
              """Per-media hash-chained custody log."""

              def __init__(self, db: Database, clock: Clock) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "verification.provenance", PROVENANCE_MIGRATIONS
                  ).run(clock)

              def record(
                  self,
                  *,
                  media_id: str,
                  actor_zid: str,
                  action: str,
                  detail: str,
              ) -> ProvenanceEvent:
                  require_non_empty_str(media_id, "media_id")
                  require_non_empty_str(actor_zid, "actor_zid")
                  require_non_empty_str(action, "action")
                  require_non_empty_str(detail, "detail")
                  with self._db.transaction() as cursor:
                      last = cursor.execute(
                          "SELECT sequence, event_hash FROM media_provenance"
                          " WHERE media_id = ?"
                          " ORDER BY sequence DESC LIMIT 1",
                          (media_id,),
                      ).fetchone()
                      sequence = (
                          int(last["sequence"]) + 1
                          if last is not None
                          else 1
                      )
                      previous = (
                          str(last["event_hash"])
                          if last is not None
                          else GENESIS_HASH
                      )
                      occurred_at = self._clock.now()
                      event_hash = stable_hash(
                          media_id,
                          str(sequence),
                          actor_zid,
                          action,
                          detail,
                          f"{occurred_at:.6f}",
                          previous,
                      )
                      cursor.execute(
                          "INSERT INTO media_provenance"
                          " (sequence, media_id, actor_zid, action, detail,"
                          "  occurred_at, previous_hash, event_hash)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                          (
                              sequence,
                              media_id,
                              actor_zid,
                              action,
                              detail,
                              occurred_at,
                              previous,
                              event_hash,
                          ),
                      )
                  return ProvenanceEvent(
                      sequence=sequence,
                      media_id=media_id,
                      actor_zid=actor_zid,
                      action=action,
                      detail=detail,
                      occurred_at=occurred_at,
                      previous_hash=previous,
                      event_hash=event_hash,
                  )

              def history(
                  self, media_id: str
              ) -> tuple[ProvenanceEvent, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM media_provenance WHERE media_id = ?"
                      " ORDER BY sequence",
                      (media_id,),
                  )
                  return tuple(
                      ProvenanceEvent(
                          sequence=int(row["sequence"]),
                          media_id=str(row["media_id"]),
                          actor_zid=str(row["actor_zid"]),
                          action=str(row["action"]),
                          detail=str(row["detail"]),
                          occurred_at=float(row["occurred_at"]),
                          previous_hash=str(row["previous_hash"]),
                          event_hash=str(row["event_hash"]),
                      )
                      for row in rows
                  )

              def verify_history(self, media_id: str) -> bool:
                  """Recompute the chain; returns False if broken."""
                  events = self.history(media_id)
                  previous = GENESIS_HASH
                  for index, event in enumerate(events, start=1):
                      if event.sequence != index:
                          return False
                      if event.previous_hash != previous:
                          return False
                      expected = stable_hash(
                          event.media_id,
                          str(event.sequence),
                          event.actor_zid,
                          event.action,
                          event.detail,
                          f"{event.occurred_at:.6f}",
                          previous,
                      )
                      if event.event_hash != expected:
                          return False
                      previous = event.event_hash
                  return True
          PYEOF

          cat > shared_engines/verification/credentials.py <<'PYEOF'
          """Verifiable credential history: bank/employer/education records.

          A bank issues "client X has an active account since 2020";
          an employer issues "person Y worked here from A to B"; a
          school issues "degree C". These are DURABLE, REVOCABLE,
          AUDITED records. Third parties query by subject and receive
          the full history; integrity is backed by the audit chain.
          Revocation is explicit, never a silent delete.
          """
          from __future__ import annotations

          import sqlite3
          from dataclasses import dataclass
          from enum import Enum

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.common.identifiers import new_id
          from shared_engines.common.validation import require_non_empty_str
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )
          from shared_engines.verification.errors import (
              CredentialNotFoundError,
          )

          EVENT_CREDENTIAL_ISSUED = "verification.credential.issued"
          EVENT_CREDENTIAL_REVOKED = "verification.credential.revoked"

          CREDENTIALS_MIGRATIONS = (
              Migration(
                  1,
                  "credentials",
                  (
                      "CREATE TABLE credentials ("
                      " credential_id TEXT PRIMARY KEY,"
                      " subject_zid TEXT NOT NULL,"
                      " issuer_zid TEXT NOT NULL,"
                      " credential_type TEXT NOT NULL,"
                      " title TEXT NOT NULL,"
                      " detail TEXT NOT NULL,"
                      " issued_at REAL NOT NULL,"
                      " valid_from REAL NOT NULL,"
                      " valid_until REAL,"
                      " revoked INTEGER NOT NULL DEFAULT 0,"
                      " revoked_at REAL,"
                      " revoked_reason TEXT,"
                      " contract_version INTEGER NOT NULL)",
                      "CREATE INDEX credentials_subject"
                      " ON credentials (subject_zid)",
                      "CREATE INDEX credentials_issuer"
                      " ON credentials (issuer_zid)",
                      "CREATE INDEX credentials_type"
                      " ON credentials (credential_type)",
                  ),
              ),
          )


          class CredentialType(Enum):
              EMPLOYMENT = "employment"
              EDUCATION = "education"
              CERTIFICATION = "certification"
              REFERENCE = "reference"
              FINANCIAL = "financial"
              IDENTITY_DOCUMENT = "identity_document"
              TRANSACTION_HISTORY = "transaction_history"
              KYC_VERIFIED = "kyc_verified"


          @dataclass(frozen=True)
          class CredentialRecord:
              credential_id: str
              subject_zid: str
              issuer_zid: str
              credential_type: CredentialType
              title: str
              detail: str
              issued_at: float
              valid_from: float
              valid_until: float | None
              revoked: bool
              revoked_at: float | None
              revoked_reason: str | None
              contract_version: int


          class CredentialRegistry:
              """Durable credential history per subject, issued by others."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  audit: AuditTrail,
                  outbox: Outbox,
                  catalog: EventCatalog,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  self._outbox = outbox
                  self._catalog = catalog
                  MigrationRunner(
                      db, "verification.credentials", CREDENTIALS_MIGRATIONS
                  ).run(clock)

              def issue(
                  self,
                  *,
                  subject_zid: str,
                  issuer_zid: str,
                  credential_type: CredentialType,
                  title: str,
                  detail: str,
                  valid_from: float | None = None,
                  valid_until: float | None = None,
              ) -> CredentialRecord:
                  require_non_empty_str(subject_zid, "subject_zid")
                  require_non_empty_str(issuer_zid, "issuer_zid")
                  require_non_empty_str(title, "title")
                  require_non_empty_str(detail, "detail")
                  credential_id = f"CRD-{new_id()}"
                  now = self._clock.now()
                  valid_from_value = (
                      valid_from if valid_from is not None else now
                  )
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO credentials"
                          " (credential_id, subject_zid, issuer_zid,"
                          "  credential_type, title, detail, issued_at,"
                          "  valid_from, valid_until, revoked,"
                          "  contract_version)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, 0, ?)",
                          (
                              credential_id,
                              subject_zid,
                              issuer_zid,
                              credential_type.value,
                              title,
                              detail,
                              now,
                              valid_from_value,
                              valid_until,
                              1,
                          ),
                      )
                      event = self._catalog.build(
                          EVENT_CREDENTIAL_ISSUED,
                          aggregate_id=credential_id,
                          payload={
                              "credential_id": credential_id,
                              "subject_zid": subject_zid,
                              "issuer_zid": issuer_zid,
                              "credential_type": credential_type.value,
                              "title": title,
                          },
                          clock=self._clock,
                      )
                      self._outbox.enqueue_in_transaction(cursor, event)
                  self._audit.append(
                      event_type=EVENT_CREDENTIAL_ISSUED,
                      actor=issuer_zid,
                      subject=credential_id,
                      payload={
                          "subject_zid": subject_zid,
                          "credential_type": credential_type.value,
                      },
                  )
                  record = self.get(credential_id)
                  if record is None:
                      raise IntegrityError(
                          "credential vanished after insert"
                      )
                  return record

              def get(self, credential_id: str) -> CredentialRecord | None:
                  row = self._db.query_one(
                      "SELECT * FROM credentials WHERE credential_id = ?",
                      (credential_id,),
                  )
                  if row is None:
                      return None
                  return self._record_from_row(row)

              def require(self, credential_id: str) -> CredentialRecord:
                  record = self.get(credential_id)
                  if record is None:
                      raise CredentialNotFoundError(
                          f"unknown credential: {credential_id}"
                      )
                  return record

              def revoke(
                  self,
                  credential_id: str,
                  *,
                  revoked_by: str,
                  reason: str,
              ) -> CredentialRecord:
                  require_non_empty_str(revoked_by, "revoked_by")
                  require_non_empty_str(reason, "reason")
                  existing = self.get(credential_id)
                  if existing is None:
                      raise CredentialNotFoundError(
                          f"unknown credential: {credential_id}"
                      )
                  if existing.revoked:
                      raise IntegrityError(
                          f"credential {credential_id} already revoked"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE credentials SET revoked = 1,"
                          " revoked_at = ?, revoked_reason = ?"
                          " WHERE credential_id = ?",
                          (now, reason, credential_id),
                      )
                      event = self._catalog.build(
                          EVENT_CREDENTIAL_REVOKED,
                          aggregate_id=credential_id,
                          payload={
                              "credential_id": credential_id,
                              "reason": reason,
                          },
                          clock=self._clock,
                      )
                      self._outbox.enqueue_in_transaction(cursor, event)
                  self._audit.append(
                      event_type=EVENT_CREDENTIAL_REVOKED,
                      actor=revoked_by,
                      subject=credential_id,
                      payload={"reason": reason},
                  )
                  return self.require(credential_id)

              def list_by_subject(
                  self, subject_zid: str
              ) -> tuple[CredentialRecord, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM credentials WHERE subject_zid = ?"
                      " ORDER BY issued_at, credential_id",
                      (subject_zid,),
                  )
                  return tuple(self._record_from_row(row) for row in rows)

              def list_by_issuer(
                  self, issuer_zid: str
              ) -> tuple[CredentialRecord, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM credentials WHERE issuer_zid = ?"
                      " ORDER BY issued_at, credential_id",
                      (issuer_zid,),
                  )
                  return tuple(self._record_from_row(row) for row in rows)

              @staticmethod
              def _record_from_row(row: sqlite3.Row) -> CredentialRecord:
                  valid_until = row["valid_until"]
                  revoked_at = row["revoked_at"]
                  revoked_reason = row["revoked_reason"]
                  return CredentialRecord(
                      credential_id=str(row["credential_id"]),
                      subject_zid=str(row["subject_zid"]),
                      issuer_zid=str(row["issuer_zid"]),
                      credential_type=CredentialType(
                          str(row["credential_type"])
                      ),
                      title=str(row["title"]),
                      detail=str(row["detail"]),
                      issued_at=float(row["issued_at"]),
                      valid_from=float(row["valid_from"]),
                      valid_until=(
                          None
                          if valid_until is None
                          else float(valid_until)
                      ),
                      revoked=bool(int(row["revoked"])),
                      revoked_at=(
                          None if revoked_at is None else float(revoked_at)
                      ),
                      revoked_reason=(
                          None
                          if revoked_reason is None
                          else str(revoked_reason)
                      ),
                      contract_version=int(row["contract_version"]),
                  )
