name: zyra-w22c-finish-consolidation

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w22c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: DIAGNOSTIC - state BEFORE
        run: |
          echo "===== apps/ ANTES (todo) ====="
          ls -la apps/ || true

      - name: Converge structure (idempotent moves)
        run: |
          set -euo pipefail
          if [ -d apps/arqueologia_digital ]; then
            git mv apps/arqueologia_digital apps/ciclo_digital \
              || mv apps/arqueologia_digital apps/ciclo_digital
            echo "moved arqueologia_digital"
          fi
          if [ -d apps/pruebas ]; then
            git mv apps/pruebas apps/laboratorio \
              || mv apps/pruebas apps/laboratorio
            echo "moved pruebas"
          fi
          if [ -d apps/cerebrotic ]; then
            git mv apps/cerebrotic apps/futuro_os \
              || mv apps/cerebrotic apps/futuro_os
            echo "moved cerebrotic"
          fi
          if [ -d apps/security_command ]; then
            mkdir -p apps/axis/modules
            git mv apps/security_command apps/axis/modules/seguridad_comando \
              || mv apps/security_command apps/axis/modules/seguridad_comando
            echo "absorbed security_command into axis"
          fi

      - name: Remove absorbed folders (idempotent)
        run: |
          set -euo pipefail
          for d in reciclaje_digital decisiones_reales \
                   controlador_espacios governance_portal \
                   rednew shared_domain; do
            rm -rf "apps/$d"
          done
          echo "cleanup done"

      - name: Remove ALL templatess dirs (recursive)
        run: |
          set -euo pipefail
          find apps -type d -name 'templatess' -prune \
            -exec rm -rf {} +
          left=$(find apps -type d -name 'templatess' | wc -l)
          test "$left" -eq 0
          echo "typo cleaned at any depth"

      - name: Clean stray files in apps root (keep dirs only)
        run: |
          set -euo pipefail
          # Anything that is NOT a directory in apps/ root is
          # a stray artifact (e.g. a loose __init__.py) - remove.
          find apps -maxdepth 1 -mindepth 1 ! -type d \
            -print -delete
          echo "apps/ root now contains directories only"

      - name: DIAGNOSTIC - state AFTER
        run: |
          echo "===== apps/ DESPUES ====="
          ls -1 apps/

      - name: Verify final structure (9 systems)
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' agro axis ciclo_digital futuro_os \
            laboratorio mi_primer_empleo nexo semilla subastas \
            | sort)
          actual=$(ls -1 apps/ | sort)
          if [ "$expected" != "$actual" ]; then
            echo "UNEXPECTED STRUCTURE"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "verified: exactly 9 systems"

      - name: Record ecosystem map
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/ECOSYSTEM_MAP.md <<'MDEOF'
          # ZYRA Ecosystem - App Consolidation Map

          Decision recorded in W22. The ecosystem is 9 systems,
          all living on ZYRA Network. Every app consumes the
          Network over HTTP; if one is down, the others keep
          working (document verification works offline).

          ## The 9 systems

          1. nexo - business/fiscal core (wave 1)
          2. agro - verified aid, planting records, prices (wave 1)
          3. semilla - education pre-k to university (wave 1)
          4. axis - health + justice + security (wave 1)
          5. subastas - marketplace + Radar VIP + stocks (wave 1)
          6. mi_primer_empleo - job matching (wave 1)
          7. ciclo_digital - archeology + recycling to tokens (wave 2)
          8. laboratorio - policy simulation + 3D decisions (wave 2)
          9. futuro_os - robots rescue + 3D space lanes (wave 3)

          ## Absorbed folders

          - security_command -> axis/modules/seguridad_comando
            (penal records, police, face/emotion detection; every
            consultation is audited by the Network)
          - reciclaje_digital -> ciclo_digital
          - decisiones_reales -> laboratorio
          - controlador_espacios -> futuro_os
          - governance_portal -> ZYRA admin surface
          - rednew, shared_domain -> removed (empty)

          ## Legacy cleanup

          - templatess/ typo directories removed at any depth.
          - Stray non-directory artifacts in apps/ root removed.
          - AGRO real code (208 files) kept as starting point
            for its build (N1).
          MDEOF
          echo "map recorded"

      - name: Sanity checks
        run: |
          set -euo pipefail
          real=$(find apps/agro -name '*.py' -size +1c \
            ! -name '__init__.py' | wc -l)
          echo "agro real code files: $real"
          test "$real" -gt 200
          test -d apps/axis/modules/seguridad_comando
          echo "seguridad_comando inside axis: OK"
          python -m compileall -q apps/agro apps/axis
          echo "compile OK"
          find apps/agro apps/axis -name '__pycache__' \
            -type d -prune -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W22c consolidation finished - stray non-dir artifacts removed from apps root, structure converged to 9 systems, security_command absorbed into axis, ALL templatess removed, map recorded, sanity passed"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W22C COMPLETE: ECOSYSTEM CONSOLIDATED ==="
