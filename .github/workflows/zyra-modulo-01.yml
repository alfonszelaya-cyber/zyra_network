name: zyra-w28b2v4-subastas-final

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w28b2v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Rewrite server.py complete (listing_id + bids API)
        run: |
          set -euo pipefail
          cat > apps/subastas/server.py <<'PYEOF'
          """SUBASTAS HTTP surface v2."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.subastas.infrastructure.persistence.subastas_store import (
              SubastasStore,
          )
          from apps.subastas.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.subastas.services.subastas_link import (
              SubastasLink,
          )

          _CSS = (
              "body{font-family:system-ui,sans-serif;"
              "background:#0d1117;color:#e6edf3;"
              "display:flex;justify-content:center;"
              "padding:20px;margin:0}"
              ".wrap{max-width:680px;width:100%}"
              "h1{font-size:1.3rem}"
              "h2{font-size:1rem;margin-top:20px;"
              "color:#58a6ff}"
              ".card{background:#161b22;border:1px solid"
              " #30363d;border-radius:10px;padding:14px;"
              "margin-top:10px}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px 18px;border-radius:8px;"
              "font-size:1rem;cursor:pointer;margin:6px 4px"
              " 0 0;width:100%;text-align:left}"
              "button.gray{background:#30363d}"
              "input,select,textarea{width:100%;"
              "box-sizing:border-box;background:#0d1117;"
              "color:#e6edf3;border:1px solid #30363d;"
              "border-radius:6px;padding:8px;margin:4px 0;"
              "font-size:0.95rem}"
              ".ok{background:#0f2417;border:1px solid"
              " #238636;border-radius:8px;padding:10px;"
              "margin:8px 0}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html lang='es'><head>"
                  "<meta charset='utf-8'>"
                  "<meta name='viewport' content='width="
                  "device-width, initial-scale=1'>"
                  f"<title>{title}</title>"
                  f"<style>{_CSS}</style></head><body>"
                  f"<div class='wrap'>{body}</div></body>"
                  "</html>"
              )


          class SubastasApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[SubastasStore]
              link: ClassVar[SubastasLink]

              def log_message(
                  self, format: str, *args: object
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(self, method: str) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._html(
                          404,
                          _page(
                              "No encontrado",
                              "<h1>404</h1>"
                              f"<p>{exc}</p>",
                          ),
                      )
                  except ValueError as exc:
                      self._html(
                          400,
                          _page(
                              "Error",
                              "<h1>Dato invalido"
                              f"</h1><p>{exc}</p>",
                          ),
                      )
                  except Exception as exc:
                      self._html(
                          500,
                          _page(
                              "Error",
                              "<h1>Error interno"
                              f"</h1><p>{exc}</p>",
                          ),
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != ["subastas"]:
                      self._html(
                          404,
                          _page(
                              "404",
                              "<h1>Fuera de"
                              " SUBASTAS</h1>",
                          ),
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_get(s[1:])
                      return
                  store = type(self).store
                  if not s or s == ["home"]:
                      self._home()
                      return
                  if s == ["listings"]:
                      listings = store.list_open()
                      items = ""
                      for l in listings:
                          items = (
                              items
                              + "<li>• "
                              + l["title"]
                              + " - base $"
                              + str(l["base_price"])
                              + " <small>("
                              + l["listing_id"]
                              + ")</small></li>"
                          )
                      if not items:
                          items = (
                              "<li>Sin listados"
                              " abiertos</li>"
                          )
                      self._html(
                          200,
                          _page(
                              "SUBASTAS - Listados",
                              "<h1>Listados abiertos"
                              "</h1><ul>"
                              + items
                              + "</ul>"
                              "<a href='/subastas'>"
                              "<button class='gray'>"
                              "Inicio</button></a>",
                          ),
                      )
                      return
                  if s == ["summary"]:
                      listings = store.list_open()
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "open_listings": len(
                                      listings
                                  ),
                              },
                          },
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>No"
                      " encontrado</h1>"),
                  )

              def _post(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_post(s[1:])
                      return
                  store = type(self).store
                  link = type(self).link
                  doc = self._read_form()
                  if s == ["register"]:
                      name = self._req(doc, "name")
                      account_id = (
                          "SBS-"
                          + uuid.uuid4().hex[:12]
                      )
                      zid: str | None = None
                      ok, data, _error = (
                          link.register_account(name)
                      )
                      if ok and data is not None:
                          zid = str(data.get("zid"))
                      store.add_account(
                          account_id=account_id,
                          zid=zid,
                          name=name,
                      )
                      zid_text = (
                          zid
                          if zid is not None
                          else "pendiente de conexion"
                      )
                      self._html(
                          200,
                          _page(
                              "Cuenta creada",
                              "<h1>Cuenta creada"
                              "</h1>"
                              "<p>Tu ID: <b>"
                              + account_id
                              + "</b></p>"
                              "<p>Tu ZID: <b>"
                              + zid_text
                              + "</b></p>"
                              "<a href='/subastas'>"
                              "<button>Inicio"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["listing"]:
                      seller_account = self._req(
                          doc, "seller_account"
                      )
                      seller = store.get_account(
                          seller_account
                      )
                      title = self._req(
                          doc, "title"
                      )
                      description = self._req(
                          doc, "description"
                      )
                      base_price = float(
                          doc.get("base_price", 0)
                      )
                      listing_id = (
                          "LST-"
                          + uuid.uuid4().hex[:10]
                      )
                      document_id: str | None = None
                      zid = seller.get("zid")
                      if zid is not None:
                          ok, data, _error = (
                              link.seal_listing(
                                  owner_zid=str(
                                      zid
                                  ),
                                  listing_id=(
                                      listing_id
                                  ),
                                  title=title,
                                  description=(
                                      description
                                  ),
                              )
                          )
                          if (
                              ok
                              and data is not None
                          ):
                              document_id = str(
                                  data.get(
                                      "document_id"
                                  )
                              )
                      row = store.add_listing(
                          listing_id=listing_id,
                          seller_account=(
                              seller_account
                          ),
                          seller_zid=(
                              str(zid)
                              if zid is not None
                              else None
                          ),
                          title=title,
                          description=(
                              description
                          ),
                          base_price=base_price,
                          document_id=document_id,
                      )
                      sealed_text = (
                          "SELLADO en la Red"
                          if document_id
                          else "pendiente de sello"
                      )
                      self._html(
                          200,
                          _page(
                              "Listado publicado",
                              "<h1>Listado"
                              " publicado</h1>"
                              f"<p>{title} - base $"
                              + str(base_price)
                              + "</p><p>"
                              + sealed_text
                              + "</p><p>Listing ID:"
                              " <b>"
                              + listing_id
                              + "</b></p><a href="
                              "'/subastas/listings'>"
                              "<button>Ver listados"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["bid"]:
                      listing_id = self._req(
                          doc, "listing_id"
                      )
                      bidder_account = self._req(
                          doc, "bidder_account"
                      )
                      amount = float(
                          doc.get("amount", 0)
                      )
                      bid_id = (
                          "BID-"
                          + uuid.uuid4().hex[:10]
                      )
                      result = store.place_bid(
                          bid_id=bid_id,
                          listing_id=listing_id,
                          bidder_account=(
                              bidder_account
                          ),
                          amount=amount,
                      )
                      self._html(
                          200,
                          _page(
                              "Puja registrada",
                              "<h1>Puja registrada"
                              "</h1><p>$"
                              + str(
                                  result["amount"]
                              )
                              + "</p>"
                              "<a href='/subastas/"
                              "listings'>"
                              "<button>Ver listados"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["close"]:
                      listing_id = self._req(
                          doc, "listing_id"
                      )
                      seller_account = self._req(
                          doc, "seller_account"
                      )
                      row = store.close_listing(
                          listing_id=listing_id,
                          seller_account=(
                              seller_account
                          ),
                      )
                      winner = row.get(
                          "winner_account"
                      )
                      if winner is None:
                          winner_text = (
                              "Sin pujas - quedo"
                              " sin venta"
                          )
                      else:
                          winner_text = (
                              "Ganador: "
                              + str(winner)
                          )
                      self._html(
                          200,
                          _page(
                              "Subasta cerrada",
                              "<h1>Subasta cerrada"
                              "</h1><p>"
                              + winner_text
                              + "</p><a href="
                              "'/subastas/listings'>"
                              "<button>Ver listados"
                              "</button></a>",
                          ),
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>Ruta"
                      " desconocida</h1>"),
                  )

              def _read_form(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  ).decode("utf-8")
                  doc: dict[str, Any] = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          key, value = pair.split(
                              "=", 1
                          )
                          doc[key] = value.replace(
                              "+", " "
                          )
                  return doc

              def _read_json(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  )
                  parsed: Any = json.loads(
                      raw.decode("utf-8")
                  )
                  if not isinstance(parsed, dict):
                      raise ValueError(
                          "body must be a JSON"
                          " object"
                      )
                  return {
                      str(k): v
                      for k, v in parsed.items()
                  }

              @staticmethod
              def _req(
                  doc: dict[str, Any], key: str
              ) -> str:
                  value: Any = doc.get(key)
                  if isinstance(value, int) and not isinstance(
                      value, bool
                  ):
                      value = str(value)
                  if not isinstance(value, str):
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  if not value.strip():
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  return value

              def _api_get(self, s: list[str]) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app": "subastas",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  if s == ["listings"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": list(
                                  store.list_open()
                              ),
                          },
                      )
                      return
                  if s[:1] == ["bids"] and len(s) == 2:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": list(
                                  store.bids_for(
                                      listing_id=s[1]
                                  )
                              ),
                          },
                      )
                      return
                  if s == ["summary"]:
                      listings = store.list_open()
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "open_listings": len(
                                      listings
                                  ),
                              },
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _api_post(
                  self, s: list[str]
              ) -> None:
                  store = type(self).store
                  doc = self._read_json()
                  if s == ["accounts"]:
                      account_id = (
                          "SBS-"
                          + uuid.uuid4().hex[:12]
                      )
                      row = store.add_account(
                          account_id=account_id,
                          zid=doc.get("zid"),
                          name=self._req(doc, "name"),
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  if s == ["listings"]:
                      row = store.add_listing(
                          listing_id=(
                              "LST-"
                              + uuid.uuid4().hex[:10]
                          ),
                          seller_account=self._req(
                              doc,
                              "seller_account",
                          ),
                          seller_zid=doc.get(
                              "seller_zid"
                          ),
                          title=self._req(
                              doc, "title"
                          ),
                          description=self._req(
                              doc, "description"
                          ),
                          base_price=float(
                              doc.get(
                                  "base_price", 0
                              )
                          ),
                          document_id=None,
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  if s == ["bids"]:
                      bid = store.place_bid(
                          bid_id=(
                              "BID-"
                              + uuid.uuid4().hex[:10]
                          ),
                          listing_id=self._req(
                              doc, "listing_id"
                          ),
                          bidder_account=self._req(
                              doc,
                              "bidder_account",
                          ),
                          amount=float(
                              doc.get("amount", 0)
                          ),
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": bid,
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _home(self) -> None:
                  body = (
                      "<h1>🔨 SUBASTAS</h1>"
                      "<p>El mercado de ZYRA:"
                      " cada listado sellado,"
                      " cada reputacion con"
                      " evidencia - nadie vende"
                      " humo.</p>"
                      "<h2>Crear cuenta</h2>"
                      "<div class='card'>"
                      "<form method='POST'"
                      " action='/subastas/register'>"
                      "<input name='name'"
                      " placeholder='Mi nombre'>"
                      "<button>Crear cuenta en la"
                      " Red</button>"
                      "</form></div>"
                      "<h2>Comprar / pujar</h2>"
                      "<div class='card'>"
                      "<a href='/subastas/listings'>"
                      "<button>Ver listados"
                      " abiertos</button></a>"
                      "</div>"
                      "<h2>Vender (listado sellado"
                      " en la Red)</h2>"
                      "<div class='card'>"
                      "<form method='POST'"
                      " action='/subastas/listing'>"
                      "<input name='seller_account'"
                      " placeholder='Mi ID de cuenta"
                      " (SBS-...)'>"
                      "<input name='title'"
                      " placeholder='Titulo del"
                      " producto'>"
                      "<input name='description'"
                      " placeholder='Descripcion'>"
                      "<input name='base_price'"
                      " placeholder='Precio base'>"
                      "<button>Publicar listado"
                      "</button>"
                      "</form></div>"
                  )
                  self._html(
                      200, _page("SUBASTAS", body)
                  )

              def _html(
                  self, status: int, html: str
              ) -> None:
                  body = html.encode("utf-8")
                  self.send_response(status)
                  self.send_header(
                      "Content-Type",
                      "text/html; charset=utf-8",
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body)),
                  )
                  self.end_headers()
                  self.wfile.write(body)

              def _send(
                  self,
                  status: int,
                  payload: dict[str, Any],
              ) -> None:
                  body = json.dumps(payload).encode(
                      "utf-8"
                  )
                  self.send_response(status)
                  self.send_header(
                      "Content-Type",
                      "application/json",
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body)),
                  )
                  self.end_headers()
                  self.wfile.write(body)


          class SubastasServer(ThreadingHTTPServer):
              daemon_threads = True
              allow_reuse_address = True

              def __init__(
                  self, address: tuple[str, int]
              ) -> None:
                  super().__init__(
                      address, SubastasApiHandler
                  )

              @property
              def bound_port(self) -> int:
                  return int(
                      self.server_address[1]
                  )


          def serve_subastas(
              store: SubastasStore,
              client: NetworkClient,
              *,
              host: str = "127.0.0.1",
              port: int = 0,
          ) -> SubastasServer:
              SubastasApiHandler.store = store
              SubastasApiHandler.link = SubastasLink(
                  client
              )
              return SubastasServer((host, port))
          PYEOF
          echo "server v2 ready"

      - name: Compile check
        run: |
          set -euo pipefail
          python -m compileall -q apps/subastas/server.py
          echo "compile OK"
          find apps/subastas -name '__pycache__' -type d \
            -prune -exec rm -rf {} +

      - name: SUBASTAS e2e
        run: |
          set -euo pipefail
          mkdir -p apps/subastas/tests
          cat > apps/subastas/tests/test_subastas_e2e.py <<'PYEOF'
          """SUBASTAS e2e: seller with network ZID lists
          (SEALED), buyer bids via API, close picks winner,
          reputation with evidence. IDs from store."""
          from __future__ import annotations

          import json
          import threading
          from pathlib import Path
          from urllib.request import (
              Request,
              urlopen,
          )

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.capabilities import (
              ZyraCapabilities,
          )
          from shared_engines.runtime.combined_api import (
              serve_combined,
          )
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import (
              Ed25519Signer,
          )

          from apps.subastas.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.subastas.infrastructure.persistence.subastas_store import (
              SubastasStore,
          )
          from apps.subastas.server import serve_subastas
          from apps.subastas.services.subastas_link import (
              SubastasLink,
          )


          class _Ecosystem:
              def __init__(self, tmp_path: Path) -> None:
                  self.net_db = SQLiteAdapter(
                      tmp_path / "network.db"
                  )
                  net_clock = FrozenClock()
                  signer, _ = Ed25519Signer.generate()
                  config = RuntimeConfig(
                      host="127.0.0.1",
                      port=0,
                      api_token=None,
                  )
                  self.kernel = ZyraKernel(
                      db=self.net_db,
                      clock=net_clock,
                      signer=signer,
                      config=config,
                  )
                  self.kernel.bootstrap_root()
                  self.caps = ZyraCapabilities(
                      self.net_db,
                      net_clock,
                      identity=self.kernel.identity,
                      signer=signer,
                  )
                  self.net_server = serve_combined(
                      self.kernel,
                      self.caps,
                      host="127.0.0.1",
                      port=0,
                  )
                  self.net_thread = threading.Thread(
                      target=(
                          self.net_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.net_thread.start()
                  self.net_base = (
                      "http://127.0.0.1:"
                      f"{self.net_server.server_address[1]}"
                  )
                  self.net_url = self.net_base

                  self.sbs_db = SQLiteAdapter(
                      tmp_path / "sbs.db"
                  )
                  sbs_clock = FrozenClock()
                  self.store = SubastasStore(
                      self.sbs_db, sbs_clock
                  )
                  self.client = NetworkClient(
                      self.net_url, max_retries=1
                  )
                  self.link = SubastasLink(
                      self.client
                  )
                  self.sbs_server = serve_subastas(
                      self.store, self.client
                  )
                  self.sbs_thread = threading.Thread(
                      target=(
                          self.sbs_server
                          .serve_forever
                      ),
                      daemon=True,
                  )
                  self.sbs_thread.start()
                  self.sbs_base = (
                      "http://127.0.0.1:"
                      f"{self.sbs_server.bound_port}"
                  )

              def close(self) -> None:
                  self.sbs_server.shutdown()
                  self.sbs_server.server_close()
                  self.sbs_thread.join(timeout=5)
                  self.net_server.shutdown()
                  self.net_server.server_close()
                  self.net_thread.join(timeout=5)
                  self.sbs_db.close()
                  self.net_db.close()


          def _post_json(
              url: str, doc: dict
          ) -> tuple[int, dict | None]:
              request = Request(
                  url,
                  data=json.dumps(doc).encode(
                      "utf-8"
                  ),
                  headers={
                      "Content-Type":
                      "application/json"
                  },
                  method="POST",
              )
              try:
                  with urlopen(
                      request, timeout=10
                  ) as response:
                      body = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )
                  assert isinstance(body, dict)
                  return response.status, body
              except Exception:
                  return 0, None


          def test_marketplace_full_journey(
              tmp_path: Path,
          ) -> None:
              eco = _Ecosystem(tmp_path)
              try:
                  reg = eco.link.register_app()
                  assert reg[0] is True
                  seller = eco.store.add_account(
                      account_id="SBS-seller01",
                      zid=None,
                      name="Vendedor Uno",
                  )
                  _ = seller
                  reg_s = eco.link.register_account(
                      "Vendedor Uno ZID"
                  )
                  assert reg_s[0] is True
                  seller_zid = str(
                      reg_s[1].get("zid")
                  )
                  eco.store.link_zid(
                      account_id="SBS-seller01",
                      zid=seller_zid,
                  )
                  buyer = eco.store.add_account(
                      account_id="SBS-buyer001",
                      zid=None,
                      name="Comprador Uno",
                  )
                  _ = buyer
                  status, _body = _post_json(
                      eco.sbs_base
                      + "/subastas/api/listings",
                      {
                          "seller_account": (
                              "SBS-seller01"
                          ),
                          "seller_zid": seller_zid,
                          "title": "Moto usada"
                          " 2019",
                          "description": "buena",
                          "base_price": 500,
                      },
                  )
                  assert status == 201
                  open_listings = (
                      eco.store.list_open()
                  )
                  assert len(open_listings) == 1
                  listing_id = open_listings[0][
                      "listing_id"
                  ]
                  assert open_listings[0][
                      "document_id"
                  ] is not None
                  bid_status, _bid = _post_json(
                      eco.sbs_base
                      + "/subastas/api/bids",
                      {
                          "listing_id": listing_id,
                          "bidder_account": (
                              "SBS-buyer001"
                          ),
                          "amount": 650,
                      },
                  )
                  assert bid_status == 201
                  closed = eco.store.close_listing(
                      listing_id=listing_id,
                      seller_account=(
                          "SBS-seller01"
                      ),
                  )
                  assert (
                      closed["winner_account"]
                      == "SBS-buyer001"
                  )
                  assert (
                      closed["final_price"]
                      == 650.0
                  )
                  rep = eco.link.give_reputation(
                      subject_zid=seller_zid,
                      actor_zid="ZID-buyer",
                      kind="positive",
                      evidence=(
                          "compro y pago 650"
                      ),
                  )
                  assert rep[0] is True
                  with urlopen(
                      eco.sbs_base
                      + "/subastas/api/health",
                      timeout=10,
                  ) as response:
                      body = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )
                  assert body["ok"] is True
              finally:
                  eco.close()


          def test_seller_cannot_bid_own_listing(
              tmp_path: Path,
          ) -> None:
              eco = _Ecosystem(tmp_path)
              try:
                  eco.store.add_account(
                      account_id="SBS-self",
                      zid=None,
                      name="Vendedor Solo",
                  )
                  eco.store.add_listing(
                      listing_id="LST-self1",
                      seller_account="SBS-self",
                      seller_zid=None,
                      title="Producto propio",
                      description="test",
                      base_price=100.0,
                      document_id=None,
                  )
                  try:
                      eco.store.place_bid(
                          bid_id="BID-self",
                          listing_id="LST-self1",
                          bidder_account=(
                              "SBS-self"
                          ),
                          amount=200.0,
                      )
                      raise AssertionError(
                          "own bid should fail"
                      )
                  except ValueError:
                      pass
                  try:
                      eco.store.place_bid(
                          bid_id="BID-low",
                          listing_id="LST-self1",
                          bidder_account=(
                              "SBS-other"
                          ),
                          amount=50.0,
                      )
                      raise AssertionError(
                          "low bid should fail"
                      )
                  except LookupError:
                      pass
                  except ValueError:
                      pass
              finally:
                  eco.close()
